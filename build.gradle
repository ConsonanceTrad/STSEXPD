        def parseKeys = { File resource ->
            def keys = []
            resource.readLines('UTF-8').each { line ->
                if (line && !line.startsWith('#') && line.contains('=')) {
                    keys << line.substring(0, line.indexOf('='))
                }
            }
            def duplicates = keys.countBy { it }.findAll { key, count -> count > 1 }.keySet()
            if (!duplicates.isEmpty()) throw new GradleException("${resource}: 存在重复资源键 ${duplicates}")
            keys.findAll { key -> spsPrefixes.any { key.startsWith(it) } }.toSet()
        }

        messagePairs.each { pair ->
            pair.each { resource ->
                def text = resource.getText('UTF-8')
                if (text.contains('\uFFFD') || text.contains('锟斤拷') || text.contains('烫烫烫')) {
                    throw new GradleException("${resource}: 检测到疑似乱码")
                }
            }
            def baseKeys = parseKeys(pair[0])
            def zhKeys = parseKeys(pair[1])
            if (baseKeys != zhKeys) {
                throw new GradleException("${pair[0].parent}: SPS内容的中英文资源键不一致，英文独有=${baseKeys-zhKeys}，中文独有=${zhKeys-baseKeys}")
            }
        }

