				'sps_dragonrider.png': [264, 36], 'sps_spiderbot.png': [256, 16],
				'sps_musketeer.png': [256, 32], 'sps_manyskeleton.png': [64, 16],
				'sps_levelchecker.png': [64, 16], 'sps_greatmoss.png': [256, 16],
				'sps_redwraith.png': [128, 16], 'sps_cellmob.png': [256, 32],
