		splashFiles.each { name ->
			def splash = file("core/src/main/assets/splashes/${name}")
			def image = javax.imageio.ImageIO.read(splash)
			if (image == null || image.width != 800 || image.height != 450) {
				throw new GradleException("${splash}: 融合职业原画必须为800x450像素")
			}
		}

		def journalSource = file('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/items/quest/AdventureJournal.java').getText('UTF-8')
		if (!journalSource.contains('DESTINATION_COUNT = 25')) {
			throw new GradleException('AdventureJournal: 异界目的地数量不是25')
		}
		def styleLines = file('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/hero/CombatStyle.java').readLines('UTF-8')
		if (styleLines.count { it ==~ /\s*[A-Z]+\(.*/ } != 8) {
			throw new GradleException('CombatStyle: 战斗风格数量不是8')
		}
		def generatorSource = file('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/items/Generator.java').getText('UTF-8')
