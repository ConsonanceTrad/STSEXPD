			requireText(actions, "Input.Keys.NUM_${slot}", '九格快捷栏默认键位')
			requireText(quickSlotButton, "SPDAction.QUICKSLOT_${slot}", '九格快捷栏按钮')
		}
		requireText(quickSlotButton, 'slotVisible', '三区快捷栏可见性')
		['SPDSettings.quickslotsBottom()', 'QuickSlot.BOTTOM_SIZE'].each {
			requireText(toolbar, it, '下快捷栏数量设置')
		}
		['QuickSlot.LEFT_START', 'QuickSlot.RIGHT_START',
		 'SPDSettings.quickslotsLeft()', 'SPDSettings.quickslotsRight()'].each {
			requireText(sideQuickBar, it, '两侧快捷栏')
		}

		def pets = readSource('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/items/quest/PetCompendium.java')
        requireText(pets, 'lastSummonDepth == Dungeon.depth && lastSummonBranch == Dungeon.branch', '伙伴重召限制')
        ['SELECTED', 'PET_ID', 'SUMMON_DEPTH', 'SUMMON_BRANCH'].each {
            requireText(pets, "bundle.put(${it}", '伙伴图鉴存档')
        }

        def guardian = readSource('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/mobs/AdventureGuardian.java')
        requireText(guardian, 'destination == 21 && rushWave < 3', '首领连续战')
        requireText(guardian, 'bundle.put(RUSH_WAVE, rushWave)', '首领连续战存档')
        requireText(guardian, 'rushWave = bundle.getInt(RUSH_WAVE)', '首领连续战恢复')

        def guide = readSource('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/mobs/npcs/AdventureGuide.java')
        requireText(guide, 'bundle.put(PURCHASED, purchasedMask)', '城镇库存存档')
        requireText(guide, 'bundle.put(CRAFTED, crafted)', '异界锻造存档')

		def palantir = readSource('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/items/Palantir.java')
		['public static final int BRANCH = 48;', 'Dungeon.zotKilled',
		 'bundle.put(RETURN_DEPTH, returnDepth)', 'detach(hero.belongings.backpack)'].each {
			requireText(palantir, it, 'Zot监牢往返流程')
		}
		def zotLevel = readSource('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/levels/ZotBossLevel.java')
		['public static final int WIDTH = 48;', 'public static final int HEIGHT = 48;',
		 'if (enteredArena && !Dungeon.zotKilled)', 'return false;', 'safeBossCell'].each {
			requireText(zotLevel, it, 'Zot监牢地图与坏档修复')
		}
		def zot = readSource('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/mobs/Zot.java')
		['HP = HT = 25000', 'countMobs(ZotPhase.class) >= 7',
		 'Dungeon.level.drop(new SoulCollect()', 'Dungeon.zotKilled = true'].each {
			requireText(zot, it, 'Zot首领机制')
		}

		def heroClassSource = readSource('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/hero/HeroClass.java')
		requireText(heroClassSource, 'ClassSkill classSkill = ClassSkill.createFor(this);', '八职业开局技能物品')
		requireText(heroClassSource, 'classSkill.collect(hero.belongings.backpack);', '八职业开局技能物品')
		['new Porksoup().identify().collect()', 'new Meatroll().identify().collect()',
		 'new RiceGruel().identify().collect()', 'new Vegetablekebab().identify().collect()',
		 'new NutCookie(6).identify().collect()', 'new MixPizza(4).identify().collect()',
		 'new MoonCake().identify().collect()', 'new FruitCandy(3).identify().collect()'].each {
			requireText(heroClassSource, it, '八职业默认皮肤开局食物')
		}
		['hero.belongings.weapon = new ShortSword()', 'hero.belongings.armor = new WoodenArmor()',
		 'new MissileShield().identify().collect()', 'new Powerpill().identify().collect()',
		 'new Smashpill().identify().collect()', 'new Hardpill().identify().collect()',
		 'hero.belongings.weapon = new MageBook()', 'new WandOfDisintegration()',
		 'new PotionOfMage().identify().collect()', 'hero.improveMagicSkill(3)'].each {
			requireText(heroClassSource, it, '战士与法师默认皮肤开局配置')
		}
		['items.weapon.melee.normalweapon.Dagger()', 'hero.belongings.armor = new VestArmor()',
		 'new BlindFruit(3)', 'hero.belongings.weapon = new com.shatteredpixel.shatteredpixeldungeon.items.weapon.melee.normalweapon.Knuckles()',
		 'new Boomerang()', 'new EmpBola(3)'].each {
			requireText(heroClassSource, it, '盗贼与女猎手默认皮肤开局配置')
		}
		['hero.belongings.weapon = new Triangolo()', 'new Shovel()', 'new SpsFireBomb()',
		 'new IceBomb()', 'new StormBomb()', 'hero.belongings.weapon = new Sling()',
		 'new GunOfSoldier()', 'new EscapeKnive(3)', 'hero.improveAttackSkill(4)',
		 'hero.improveDefenseSkill(2)'].each {
			requireText(heroClassSource, it, '演员与星兵默认皮肤开局配置')
		}
		requireText(hero, 'if (shovel != null) shovel.gainCharge();', '铁铲逐回合充能')
		requireText(hero, 'if (soldierGun != null) soldierGun.gainCharge();', '脉冲手枪逐回合充能')
		requireText(hero, 'if (jumpW != null) jumpW.gainCharge();', '战士之鞋逐回合充能')
		requireText(readSource('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/mobs/Mob.java'),
				'shovel.gainCharge(5);', '演员击杀恢复铁铲耐久')
		requireText(readSource('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/mobs/Mob.java'),
				'contract.gainSoul();', '恶魔契约击杀收集灵魂')
		requireText(hero, 'SuperArcane arcane = buff(SuperArcane.class);', '奥术灌注法强接入')
		requireText(hero, 'boolean notice = buff(Notice.class) != null;', '敏锐被动搜索接入')
		requireText(hero, '} else if (intentional || notice){', '敏锐必定发现隐藏事物')

		println 'SPS机制静态测试通过：8个旧版职业可见且开局获得对应技能物品、6个过渡层已接入、破碎独有装备已移出主生成牌组；25条异界路线、8条挑战路线、29份一次性奖励、终局门槛、外观返回路径、三区快捷栏（下3-10、左右0-4）、水袋功能选择及5组关键存档机制均符合当前实现。'
    }
}

