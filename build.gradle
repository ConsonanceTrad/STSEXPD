		}
		def spsPotionClasses = ['PotionOfMending', 'PotionOfMight', 'PotionOfMixing',
				'PotionOfShield', 'PotionOfOverHealing']
		def potionSource = file('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/items/potions/Potion.java').getText('UTF-8')
		spsPotionClasses.each { name ->
			def source = file("core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/items/potions/${name}.java")
			if (!source.isFile() || !generatorSource.contains("${name}.class") || !potionSource.contains("${name}.class")) {
				throw new GradleException("SPS植物药剂未完整接入生成器和种子炼金: ${name}")
			}
		}
		def plantClasses = ['Dewcatcher', 'Dreamfoil', 'Freshberry', 'NutPlant',
				'ReNepenth', 'Seedpod', 'SiOtwoFlower', 'StarEater']
		def plantLogic = plantClasses.collectEntries { name ->
			[(name): file("core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/plants/${name}.java").getText('UTF-8')]
		}
		['Dewcatcher': ['RedDewdrop', 'VioletDewdrop', 'YellowDewdrop'],
		 'Dreamfoil': ['DreamLeaf'], 'Freshberry': ['Category.BERRY'],
		 'NutPlant': ['NutVegetable', 'Strawberry', 'Cherry'],
		 'ReNepenth': ['TransmutationBall'], 'SiOtwoFlower': ['GlassFruit'],
		 'StarEater': ['UpgradeEatBall']].each { plant, tokens ->
			tokens.each { token ->
				if (!plantLogic[plant].contains(token)) {
					throw new GradleException("SPS植物掉落尚未接入: ${plant} -> ${token}")
				}
			}
		}
		plantClasses.each { name ->
			def source = file("core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/plants/${name}.java")
			if (!source.isFile() || !generatorSource.contains("${name}.Seed.class")) {
				throw new GradleException("SPS植物未完整接入种子生成器: ${name}")
			}
		}
		['MissileShield', 'PotionOfMage'].each { name ->
			def source = file("core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/items/misc/${name}.java")
			if (!source.isFile()) throw new GradleException("第5层特殊战利品缺失: ${name}")
		}
		['Gleaf', 'Dpotion'].each { name ->
			def source = file("core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/items/weapon/rockcode/${name}.java")
			if (!source.isFile()) throw new GradleException("演员第7皮肤首领奖励缺失: ${name}")
		}
		def rockCodeBossDrops = [
				'SpsGoo': 'Obubble', 'SpsTengu': 'Nshuriken', 'PrisonWander': 'Ichain',
				'Tank': 'Trush', 'SpiderQueen': 'Sweb', 'SpsDM300': 'Bmech',
				'Hybrid': 'Mlaser', 'LichDancer': 'Lbox', 'King': 'Zshield',
				'ElderAvatar': 'Alink'
		]
		rockCodeBossDrops.each { boss, code ->
			def codeSource = file("core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/items/weapon/rockcode/${code}.java")
			def bossSource = file("core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/mobs/${boss}.java")
			if (!codeSource.isFile() || !bossSource.isFile()) {
				throw new GradleException("演员第7皮肤首领芯片文件缺失: ${boss} -> ${code}")
			}
			def bossLogic = bossSource.getText('UTF-8')
			if (!bossLogic.contains('RockCode.dropForPerformer(') ||
					!bossLogic.contains("rockcode.${code}()")) {
				throw new GradleException("演员第7皮肤首领芯片未接入限定掉落: ${boss} -> ${code}")
			}
		}

		println "SPS内容审计通过：全部消息资源均为严格UTF-8；${layoutRows.size()}行固定地图、25个目的地、8条挑战路线、20种药物、14种果蔬、8种植物产物、5种植物药剂、8种独有植物、12枚洛克芯片、8套战斗风格、9张保留职业动画图集和5张独立职业原画；中英文资源键一致。"
    }
}

