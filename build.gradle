			def image = javax.imageio.ImageIO.read(resource)
			if (image == null || image.width != dimensions[0] || image.height != dimensions[1]) {
				throw new GradleException("SPS城区素材尺寸错误：${name}")
			}
		}
		def itemSheetSource = file('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/sprites/ItemSpriteSheet.java').getText('UTF-8')
		if (!itemSheetSource.contains('TX_HEIGHT = 992')) {
			throw new GradleException('ItemSpriteSheet: 图集高度必须为992，避免SPS药丸图标被裁切')
		}
