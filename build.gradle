buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.0'
    }
}

allprojects {

	tasks.withType(JavaCompile).configureEach {
		options.encoding = 'UTF-8'
	}

    ext {
		appName = 'SPSEXPD'
		appPackageName = 'com.shatteredpixel.shatteredpixeldungeon'
		appAndroidPackageName = 'com.hmdzl.spsexpd'

        //Full releases gets +2 on version code, needed for an F-Droid quirk
		appVersionCode = 923
		appVersionName = '0.1.1-alpha'

        appJavaCompatibility = JavaVersion.VERSION_11

        appAndroidCompileSDK = 36   //Android 15
        appAndroidMinSDK = 21       //Android 5.0
        appAndroidTargetSDK = 36    //Android 15

        gdxVersion = '1.14.0'
        gdxControllersVersion = '2.2.4'
        robovmVersion = '2.3.24'
    }
    version = appVersionName

    repositories {
        google()
        mavenCentral()
        maven { url 'https://central.sonatype.com/repository/maven-snapshots/' }
    }

}

tasks.register('verifySpsContent') {
    group = 'verification'
    description = '检查SPS移植内容的中英文资源、UTF-8文本与固定地图模板。'

    doLast {
		fileTree('core/src/main/assets/messages').matching { include '**/*.properties' }.each { resource ->
			def decoder = java.nio.charset.StandardCharsets.UTF_8.newDecoder()
					.onMalformedInput(java.nio.charset.CodingErrorAction.REPORT)
					.onUnmappableCharacter(java.nio.charset.CodingErrorAction.REPORT)
			def text
			try {
				text = decoder.decode(java.nio.ByteBuffer.wrap(resource.bytes)).toString()
			} catch (java.nio.charset.CharacterCodingException error) {
				throw new GradleException("${resource}: 不是严格UTF-8文本", error)
			}
			if (text.contains('\uFFFD') || text.contains('锟斤拷') || text.contains('烫烫烫')) {
				throw new GradleException("${resource}: 检测到疑似乱码")
			}
			if (text.readLines().any { it.startsWith('com.shatteredpixel.shatteredpixeldungeon.') }) {
				throw new GradleException("${resource}: 资源键错误包含完整Java包名前缀")
			}
		}

