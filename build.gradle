				'MUSHROOM_LANTERN':       'E6D20A912E6CCA916B88D8703AC1B35796486903E3C598527BA83AF62780136F',
				'MUSHROOM_EARTHSTAR':      'C1FAF6BD074C6D9C4EC3976135D1CED7DB22AC0A62A8B309B327704CE46EDE8F',
				'MUSHROOM_GREEN_SPORE':    'FE5D9E5D680FD7755E130C1C5F7D78BB3AF71AD7E3BE88ED38DCF8A7EAC5A0BB',
				'MUSHROOM_DEATHCAP':       '4AE5C036CFDACE2A730875DBD40A3E3A50FA2FEB52A0FFC6931FF75891D7483D',
				'MUSHROOM_PIXIEPARASOL':   'A639F90CB936B9461C852E0244B5B167ADAC7F99DD18372E777D15750C3D11FC',
				'MUSHROOM_GOLDENJELLY':    'B2B4D2277E8E585DCC90B801B845B98A9A532D35995668BE29A3761CD226C4DD',
				'MUSHROOM_BLUEMILK':       '800A7433F330AC2A6F3B4667C0FC1A91088CADC8D847DB75ABADA9FA711E55CD',
				'GREAT_PILL':               'D864F3BFD443A565849566465ECB5AB18A13251700047A1AADBE7FB4738846E9',
				'WINE':                     '4CFFD6B4BC50655AC84964CE5F720C1F877B844DC0FADE93F50F16470B1D92E7'
		]
		def medicineSheet = javax.imageio.ImageIO.read(file('core/src/main/assets/sprites/items/items.png'))
		medicineIconHashes.eachWithIndex { name, expected, slot ->
			def pixelBytes = new java.io.ByteArrayOutputStream(16 * 16 * 4)
			def pixels = new java.io.DataOutputStream(pixelBytes)
			for (int y = 976; y < 992; y++) {
				for (int x = slot * 16; x < slot * 16 + 16; x++) {
					pixels.writeInt(medicineSheet.getRGB(x, y))
				}
			}
			pixels.flush()
			def actual = java.security.MessageDigest.getInstance('SHA-256')
					.digest(pixelBytes.toByteArray()).encodeHex().toString().toUpperCase()
			if (actual != expected) {
				throw new GradleException("SPS药丸图标像素不一致: ${name}")
			}
		}
