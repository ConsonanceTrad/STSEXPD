		def validateHeroSheet = { File skin, String label ->
			def image = javax.imageio.ImageIO.read(skin)
			if (image == null || image.width != 256 || image.height != 128) {
				throw new GradleException("${skin}: ${label}必须为256x128像素")
			}
			(0..<8).each { row ->
				boolean hasVisiblePixel = false
				for (int y = row * 15; y < row * 15 + 15 && !hasVisiblePixel; y++) {
					for (int x = 0; x < image.width; x++) {
						if (((image.getRGB(x, y) >>> 24) & 0xFF) != 0) {
							hasVisiblePixel = true
							break
						}
					}
				}
				if (!hasVisiblePixel) throw new GradleException("${skin}: 第${row + 1}行动画为空")
			}
		}
		skinFiles.each { name ->
			validateHeroSheet(fileTree(dir: 'core/src/main/assets/sprites', includes: ["**/${name}"]).singleFile, '职业皮肤图集')
		}
