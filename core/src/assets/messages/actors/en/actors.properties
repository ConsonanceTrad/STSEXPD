actors.mobs.npcs.tinkerer1.name=dew researcher
actors.mobs.npcs.tinkerer1.desc=A researcher from Dolya. He seems to be waiting for something.
actors.mobs.npcs.tinkerer1.tell1=I need a special mushroom for my research, but it is too dangerous for me to go farther.
actors.mobs.npcs.tinkerer1.tell2=You need a waterskin before I can improve it.

actors.mobs.npcs.tinkerer2.name=Rune scholar Lynn
actors.mobs.npcs.tinkerer2.desc=A scholar from Dolya who studies the connection between different kinds of magic.
actors.mobs.npcs.tinkerer2.tell1=I think there must be a connection between different kinds of magic... Maybe something can help me.

actors.buffs.armorbreak.name=Armor break
actors.buffs.armorbreak.desc=All incoming damage is increased by _%2$d%%_.\n\nTurns remaining: %1$s.

actors.buffs.dewcharge.name=Dew burst
actors.buffs.dewcharge.desc=Whenever you kill an enemy, dewdrops may appear around it.\n\nDew burst duration remaining: %s turns.
actors.buffs.rhythm2.name=super rhythm
actors.buffs.rhythm2.desc=Your speed and damage are increased by 20%%, and incoming damage is reduced by 10%%.\n\nTurns remaining: %s.

actors.buffs.tentsleep.name=rest
actors.buffs.tentsleep.desc=You are resting in a tent, hidden and protected from harmful terrain.\n\nRest time remaining: %s turns.
actors.mobs.npcs.spssokobansheep.name=sokoban sheep
actors.mobs.npcs.spssokobansheep.desc=This unusual sheep can be pushed across the floor to operate mechanisms.
actors.mobs.npcs.spssokobansheep$corner.name=diagonal sheep
actors.mobs.npcs.spssokobansheep$corner.desc=This sheep can also be pushed diagonally.
actors.mobs.npcs.spssokobansheep$switch.name=switch sheep
actors.mobs.npcs.spssokobansheep$switch.desc=Interacting with this sheep swaps your positions.
actors.mobs.npcs.spssokobansheep$black.name=black sheep
actors.mobs.npcs.spssokobansheep$black.desc=This sheep jumps toward a nearby fleecing trap.
actors.mobs.npcs.spssokobansheep$stop.name=stopped sheep
actors.mobs.npcs.spssokobansheep$stop.desc=This sheep can no longer be pushed.

actors.mobs.sokobansentinel.name=sokoban prospector
actors.mobs.sokobansentinel.desc=A slow, mindless phantom wielding _%s_ that attacks intruders in the guarded area.
actors.mobs.sentinel.name=sentinel
actors.mobs.sentinel.desc=An enchanted guardian wielding _%s_. It remains still until disturbed, then attacks with the weapon it protects.
actors.mobs.monsterbox.name=monster box
actors.mobs.monsterbox.desc=A living box that imitates your combat ability. When destroyed, it may create a fresh copy of one type of equipment you are wearing.

actors.mobs.pets.legacypet.levelup=Your pet has gained a level.
actors.mobs.pets.butterflypet.name=butterfly
actors.mobs.pets.butterflypet.desc=She causes blindness and restores health while staying beside you.
actors.mobs.pets.chocobo.name=chocobo
actors.mobs.pets.chocobo.desc=Its speed magic helps both itself and its owner escape danger.
actors.mobs.pets.datura.name=datura
actors.mobs.pets.datura.desc=A rare living plant which frightens enemies and sheds magical dew when struck.
actors.mobs.pets.dogpet.name=faithful dog
actors.mobs.pets.dogpet.desc=It protects you with a shield whenever you fight side by side.
actors.mobs.pets.dwarfboy.name=dwarf apprentice
actors.mobs.pets.dwarfboy.desc=A brave dwarf who, for some reason, is dressed like a sheep.
actors.mobs.pets.foxhelper.name=fox maid
actors.mobs.pets.foxhelper.desc=A fox-orc maid who periodically brings you a scroll of upgrade.
actors.mobs.pets.frogpet.name=frog
actors.mobs.pets.frogpet.desc=This green frog can reach distant enemies and may find an item after a finishing blow.
actors.mobs.pets.gentlecrab.name=gentle crab
actors.mobs.pets.gentlecrab.desc=It is a gentleman. Also a crab. Its claws can break armor.
actors.mobs.pets.kodora.name=kodora
actors.mobs.pets.kodora.desc=A little dragon whose attacks are entirely magical and can weaken magic resistance.
actors.mobs.pets.litdemon.name=chainsaw demon
actors.mobs.pets.litdemon.desc=A cute demon with a large chainsaw and a flurry of cutting attacks.
actors.mobs.pets.monkey.name=green monkey
actors.mobs.pets.monkey.desc=Strictly speaking it is not a monkey; monkey is simply part of its name.
actors.mobs.pets.snake.name=venomous snake
actors.mobs.pets.snake.desc=This wandering snake poisons prey and can tear away a third of its remaining life.
actors.mobs.pets.spider.name=plant spider
actors.mobs.pets.spider.desc=A small, fuzzy plant creature which spreads poison and webbing around its enemies.
actors.mobs.pets.starkid.name=star child
actors.mobs.pets.starkid.desc=A child of the stars whose attacks deal light damage.
actors.mobs.pets.stone.name=rock fist
actors.mobs.pets.stone.desc=One of Shattered's weapons is its relative, but its parents came from a monster-catching world.
actors.mobs.pets.fly.name=fly
actors.mobs.pets.fly.desc=This ambitious buzzing fly dreams of becoming a beautiful butterfly and calls stray flies when struck.
actors.mobs.pets.fly$flytwo.name=stray fly
actors.mobs.pets.fly$flytwo.desc=A helper attracted by the fly.
actors.mobs.pets.ribbonrat.name=ribbon rat
actors.mobs.pets.ribbonrat.desc=This little rat treasures its ribbon and calls a swarm of helpers in battle.
actors.mobs.pets.ribbonrat$ribbonrattwo.name=ribbon rat swarm
actors.mobs.pets.ribbonrat$ribbonrattwo.desc=A helper called by the ribbon rat.
actors.mobs.pets.bluedragon.name=Blue dragon
actors.mobs.pets.bluedragon.desc=Blue dragon is good at ice magic.
actors.mobs.pets.bluegirl.name=Blue doll
actors.mobs.pets.bluegirl.desc=A heavily armored toy from Ren Pixel Dungeon which is skilled at close combat.
actors.mobs.pets.bugdragon.name=B u G d r A g O N
actors.mobs.pets.bugdragon.desc=??????
actors.mobs.pets.golddragon.name=Gold dragon
actors.mobs.pets.golddragon.desc=No reliable information about this dragon exists in the bestiary.
actors.mobs.pets.greendragon.name=Green dragon
actors.mobs.pets.greendragon.desc=Green dragon is good at lightning magic.
actors.mobs.pets.leryfire.name=Chaos elemental
actors.mobs.pets.leryfire.desc=An unstable elemental created by Xiu Qi from an early Shattered translation team.
actors.mobs.pets.lightdragon.name=Light dragon
actors.mobs.pets.lightdragon.desc=It is a light dragon.
actors.mobs.pets.reddragon.name=Red dragon
actors.mobs.pets.reddragon.desc=Red dragon is good at fire magic.
actors.mobs.pets.scorpion.name=Blood scorpion
actors.mobs.pets.scorpion.desc=A huge bloodthirsty scorpion with a dangerous stinger.
actors.mobs.pets.shadowdragon.name=Shadow dragon
actors.mobs.pets.shadowdragon.desc=The shadow dragon belongs to darkness, but light is needed to summon it.
actors.mobs.pets.violetdragon.name=Violet dragon
actors.mobs.pets.violetdragon.desc=Violet dragon is an earth dragon which releases foul toxins.

actors.buffs.growseed.name=parasitic growth
actors.buffs.growseed.heromsg=Thorny growth bursts from your body!
actors.buffs.growseed.desc=A magical seed is growing inside its victim, damaging them while feeding nearby creatures.

# Original SPS Dolya town residents
actors.mobs.npcs.udawos.name=Udawos
actors.mobs.npcs.udawos.desc=This is a developer who build Pioneer. Seems like he is doing his job now.
actors.mobs.npcs.udawos.yell1=I'm Udawos, have you ever played my Pioneer before? My new game is chernog : FOMTMA. You can download it in google play store.
actors.mobs.npcs.udawos.yell2=In fact, Pioneer is not a Roguelike game. Rather, it is an RPG.
actors.mobs.npcs.typedscroll.name=TypedScroll
actors.mobs.npcs.typedscroll.desc=This is a developer who build LCPD. He looks like a error.
actors.mobs.npcs.typedscroll.yell1=I'm TypedScroll, I don't know what should I say now.
actors.mobs.npcs.typedscroll.yell2=Give more confidence to my LCPD.
