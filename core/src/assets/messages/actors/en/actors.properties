actors.mobs.demonrabbit.desc=A rabbit marksman transformed by demon blood. It fires bloodshot rounds and leaves corruption in their wake.

actors.mobs.sewerheart.name=Sewer heart
actors.mobs.sewerheart.desc=The hardened fruit of a mature rotberry plant protects a mass of living organs. This enormous heart commands its roots and fires a deadly beam.
actors.mobs.sewerheart.blink=The sewer heart blinks away!
actors.mobs.sewerheart$sewerlasher.name=Sewer lasher
actors.mobs.sewerheart$sewerlasher.desc=A defensive root of the mature rotberry plant. It remains rooted in place and violently lashes anything nearby.
actors.mobs.plaguedoctor.name=Plague doctor
actors.mobs.plaguedoctor.desc=A rejected researcher driven mad after being brought into this world. His treatment becomes increasingly violent as the fight continues.
actors.mobs.plaguedoctor.notice=So... are you here to help with my research?
actors.mobs.plaguedoctor.yell=Do not worry, this will not hurt... I will prove it to you.
actors.mobs.plaguedoctor.yell2=Rats... they are everywhere... we will die here...
actors.mobs.plaguedoctor.crazy=The plague doctor's resolve is tested... madness!
actors.mobs.plaguedoctor$shadowrat.name=Plague shadow
actors.mobs.plaguedoctor$shadowrat.desc=A strange shadow shaped like a rat.

actors.buffs.arcane.name=Arcane
actors.buffs.arcane.desc=Magic is temporarily amplified.\n\nTurns remaining: %s.
actors.buffs.highlight.name=High light
actors.buffs.highlight.desc=Bright light expands vision to ten tiles.\n\nTurns remaining: %s.
actors.buffs.hot.name=Hot
actors.buffs.hot.desc=Heat makes all incoming damage 20%% stronger.\n\nTurns remaining: %s.
actors.buffs.rhythm.name=Rhythm
actors.buffs.rhythm.desc=Rhythm triples accuracy and raises evasion by 50%%.\n\nTurns remaining: %s.
actors.buffs.shocked.name=Shocked
actors.buffs.shocked.desc=Electrical shock deals percentage damage when it first pulses.
actors.buffs.shadowcurse.name=Shadow curse
actors.buffs.shadowcurse.desc=The curse deals percentage damage immediately and bursts again after four pulses.
actors.buffs.newcombo.name=Fighter combo
