actors.buffs.newcombo.cleave_desc=_Cleave_ deals 2.5x damage. A killing blow preserves and increases the combo.
actors.buffs.newcombo.slam_prompt=Select a target to slam
actors.buffs.newcombo.slam_desc=_Slam_ takes the better of two damage rolls, deals 2.6x damage, and grants a physical shield.
actors.buffs.newcombo.crush_prompt=Select a target to crush
actors.buffs.newcombo.crush_desc=_Crush_ takes the best of four damage rolls and deals 3.5x damage.
actors.buffs.newcombo.desc=Successful unarmed strikes build a combo. The combo expires after four turns or after two misses. Finishers unlock at 2, 4, 6, and 8 hits.
actors.buffs.goldtouch.name=Gold Touch
actors.buffs.goldtouch.desc=You gain gold when making melee attacks.\n\nTurns remaining: %s.
actors.buffs.hastebuff.name=Haste
actors.buffs.hastebuff.desc=Your movement speed is doubled.\n\nTurns remaining: %s.
actors.buffs.disarm.name=Disarmed
actors.buffs.disarm.desc=Invisible bindings prevent ordinary attacks.\n\nTurns remaining: %s.
actors.buffs.disarm.cant_attack=You cannot attack while disarmed.
actors.buffs.moonfury.name=Moon Fury
actors.buffs.moonfury.desc=Your next successful attack will deal triple damage.
actors.buffs.highattack.name=Climbing Ambush
actors.buffs.highattack.desc=Remaining beside a wall charges your next attack and slightly improves evasion. Leaving the wall ends the effect.\n\nNext damage multiplier: %s.
actors.buffs.skillrecharge.name=Skill Recharge
actors.buffs.skillrecharge.desc=Class skills can be used without waiting for their cooldown.\n\nTurns remaining: %s.
actors.blobs.memoryfire.desc=The emerald flame holds a perfect memory of this moment. Step into it to preserve a copy of the current adventure in another save slot.
actors.buffs.muscle.name=Muscle
actors.buffs.muscle.desc=Your strength is increased by 2.\n\nTurns remaining: %s.
actors.buffs.bloodimbue.name=Blood Imbue
actors.buffs.bloodimbue.desc=Successful attacks may cripple, root, or paralyze their target. You are immune to several hindering effects.\n\nTurns remaining: %s.
actors.buffs.needling.name=Needling
actors.buffs.needling.desc=Successful attacks inflict either 50%% armor break or heavy bleeding.\n\nTurns remaining: %s.
actors.buffs.targetshoot.name=Aimed Shot
actors.buffs.targetshoot.desc=Missile weapon damage is increased by 50%%.\n\nTurns remaining: %s.
actors.buffs.speedimbue.name=Speed Imbue
actors.buffs.speedimbue.desc=Speed is doubled and attack damage is raised by 50%%, but damage taken is raised by 10%%.\n\nTurns remaining: %s.
actors.buffs.spattack.name=Special Attack
actors.buffs.spattack.desc=Attacks deal triple damage to full-health enemies and 50%% more damage to enemies below one-quarter health.\n\nTurns remaining: %s.
actors.buffs.feed.name=Life Feeding
actors.buffs.feed.desc=Each hostile enemy killed permanently grants 1 maximum HP.\n\nTurns remaining: %s.
actors.buffs.magicweak.name=Magic Weakness
actors.buffs.magicweak.desc=Damage from magic and status effects is increased by 50%%.\n\nTurns remaining: %s.
actors.buffs.magicarmor.name=Magic Armor
actors.buffs.magicarmor.desc=This shield absorbs damage from magic and status effects. Shield remaining: %s.
actors.buffs.htimprove.name=Vitality Surge
actors.buffs.htimprove.desc=Unmodified maximum HP is temporarily increased by 20%%.\n\nTurns remaining: %s.
actors.buffs.paryattack.name=Stationary Parry
actors.buffs.paryattack.desc=Remaining still steadily raises attack power and reduces incoming damage. Moving or lacking the required gold ends the stance. Current strength: %s%%.
actors.buffs.blasphemy.name=Blasphemy
actors.buffs.blasphemy.desc=Each permanent stack increases all attack damage by 10%%. Current stacks: %s.
actors.buffs.highvoice.name=High Voice
actors.buffs.highvoice.desc=Your performance sometimes strengthens attacks and softens incoming blows.\n\nTurns remaining: %s.
actors.buffs.learnskill.name=Learn Skill
actors.buffs.learnskill.desc=After %s more hostile kills, attack, defense, magic, and maximum HP will permanently increase.
actors.buffs.mecharmor.name=Mechanical Armor
actors.buffs.mecharmor.desc=Mechanical armor absorbs all damage but loses one point each turn. Armor remaining: %s.
actors.mobs.npcs.mtree.name=War Tree
actors.mobs.npcs.mtree.desc=An ancient guardian called by the huntress. Its heavy blows root enemies in place.

actors.mobs.thiefking.name=The thief king
actors.mobs.thiefking.desc=Leader of this city, a legendary thief.
actors.mobs.thiefking.notice=Ready to die, %s?
actors.mobs.thiefking.die=You are better than I think...
actors.mobs.normalcell.name=normal cell
actors.mobs.normalcell.desc=A strange living cell created by unstable evolve ammunition.
actors.buffs.holystun.name=shield strike
actors.buffs.holystun.desc=A powerful stun which cannot be shortened by damage.\n\nTurns remaining: %s
actors.mobs.forestprotector.name=forest witch
actors.mobs.forestprotector.desc=A plant that can cast spells, but is even more dangerous in melee combat.
actors.mobs.mossyskeleton.name=mossy skeleton
actors.mobs.mossyskeleton.desc=Moss has grown through this skeleton and now controls its every movement.
actors.mobs.mossyskeleton.killcount=Mossy skeletons defeated: %d
actors.mobs.graveprotector.name=Cyclops
actors.mobs.graveprotector.desc=This cyclops has powerful ranged attacks, but is less effective in melee combat.
actors.mobs.albinopiranha.name=albino giant piranha
actors.mobs.albinopiranha.desc=After centuries in this place its sight has faded, but its other senses detect the slightest change in the water.
actors.mobs.albinopiranha.killcount=Albino piranhas defeated: %d
actors.mobs.fishprotector.name=frost giant
actors.mobs.fishprotector.desc=An elemental survivor from a fissure in time. Its death changes the surrounding ground into water.
actors.mobs.goldthief.name=gold thief
actors.mobs.goldthief.desc=Unlike other thieves, it cares only for glittering gold and will flee as soon as it has taken some.
actors.mobs.goldthief.stole=The gold thief stole %d gold from you!
actors.mobs.goldthief.killcount=Gold thieves defeated: %d
actors.mobs.vaultprotector.name=bounty hunter
actors.mobs.vaultprotector.desc=Wherever a sufficiently valuable target appears, a bounty hunter soon follows.
actors.mobs.iceball.name=big ice ball
actors.mobs.iceball.desc=The giant ice ball is coming.
actors.buffs.spsacidooze.name=acid
actors.buffs.spsacidooze.desc=Emerald acid is eating into the target. Water washes it away.
actors.buffs.acidooze.name=acid ooze
actors.buffs.acidooze.desc=This sticky acid clings to flesh, slowly melting it away.\n\nOoze will deal consistent damage until it is washed off in water.\n\nOoze does not expire on its own and must be removed with water.
actors.buffs.acidooze.heromsg=Caustic ooze eats your flesh. Wash it away!
actors.blobs.swampgas.desc=A brown cloud of swamp gas is swirling here. It makes creatures vulnerable and increasingly slow, and is highly flammable.
actors.buffs.speedslow.name=Slow body
actors.buffs.speedslow.desc=This stacking slow weakens as it expires, but enough exposure causes complete immobility.\n\nTurns remaining: %1$s.\nSpeed reduction: %2$s%%.
actors.buffs.standdown.name=Body freeze
actors.buffs.standdown.desc=The target cannot act. Unlike paralysis, taking damage immediately ends this effect.\n\nTurns remaining: %s.
actors.buffs.spscharm.name=charmed
actors.buffs.spscharm.heromsg=You are charmed!
actors.buffs.spscharm.desc=The target cannot directly attack the character that charmed it, but can still attack others. Unlike modern charm, taking damage does not shorten this effect.\n\nTurns remaining: %s.
actors.buffs.damageup.name=Damage charge
actors.buffs.damageup.desc=The next successful attack gains %s damage.
actors.buffs.superarcane.name=Arcane infusion
actors.buffs.superarcane.desc=Magical power flows through your body, increasing magic skill by %1$s points.\n\nTurns remaining: %2$s.
actors.buffs.notice.name=Awareness
actors.buffs.notice.desc=Your sharpened intuition makes passive searches discover every searchable hidden feature in range.\n\nTurns remaining: %s.
actors.buffs.wargroove.name=war groove
actors.buffs.wargroove.desc=Your next successful physical attack deals 50%% more damage.
actors.blobs.slowgas.desc=The air here is unnaturally cold and steadily slows anything inside it.
actors.buffs.betired.name=fatigue
actors.buffs.betired.desc=Fatigue builds whenever its owner takes a hit. Reaching sixteen hits before it expires deals 10%% of maximum health as damage.\n\nTurns remaining: %1$s. Hits remaining: %2$d.
actors.buffs.boxstar.name=invincibility star
actors.buffs.boxstar.desc=All incoming damage is negated for %s turns.
actors.buffs.mirrorshield.name=wisdom protection
actors.buffs.mirrorshield.desc=Incoming damage is negated and partly reflected for %s turns.
actors.buffs.faithbuff.mechfaith.name=Faith - Mech
actors.buffs.faithbuff.mechfaith.desc=Reduces damage from mechanical factions by 25%% and increases damage against natural factions by 50%%.
actors.buffs.faithbuff.lifefaith.name=Faith - Nature
actors.buffs.faithbuff.lifefaith.desc=Reduces damage from natural factions by 25%% and increases damage against mechanical factions by 50%%.
actors.buffs.faithbuff.demonfaith.name=Faith - Demon
actors.buffs.faithbuff.demonfaith.desc=Reduces damage from demonic factions by 25%% and increases damage against holy factions by 50%%.
actors.buffs.faithbuff.humanfaith.name=Faith - Holy
actors.buffs.faithbuff.humanfaith.desc=Reduces damage from holy factions by 25%% and increases damage against demonic factions by 50%%.
actors.buffs.faithbuff.balancefaith.name=Faith - Balance
actors.buffs.faithbuff.balancefaith.desc=Reduces damage from bosses and minibosses by 25%% and increases damage against them by 50%%.
actors.buffs.infjump.name=infinite jump
actors.buffs.infjump.desc=Jumping consumes no shoe charge.\n\nTurns remaining: %s.
actors.buffs.forevershadow.name=Forever Shadow
actors.buffs.forevershadow.desc=You will can't be find until it disappare. %s turns left.
actors.buffs.mindbuff.terrormind.name=mind-fear
actors.buffs.mindbuff.terrormind.desc=Evasion is reduced.
actors.buffs.mindbuff.amokmind.name=mind-confusion
actors.buffs.mindbuff.amokmind.desc=Accuracy is reduced.
actors.buffs.mindbuff.crazymind.name=mind-despair
actors.buffs.mindbuff.crazymind.desc=Attacks become erratic.
actors.buffs.mindbuff.losemind.name=mind-inattentive
actors.buffs.mindbuff.losemind.desc=Magic skill is reduced.
actors.buffs.mindbuff.weakmind.name=mind-fragile
actors.buffs.mindbuff.weakmind.desc=Damage taken is increased.
actors.buffs.onepunch.name=serious punch
actors.buffs.onepunch.desc=The next successful attack deals %d%% additional damage.
actors.buffs.shocked2.name=electrostatic turbulence
actors.buffs.shocked2.desc=Moving before this current fades deals damage and roots the target. Turns remaining: %d.
actors.buffs.mindbuff.hopemind.name=mind-hope
actors.buffs.mindbuff.hopemind.desc=Each future level grants one additional maximum HP.
actors.buffs.mindbuff.keepmind.name=mind-firm
actors.buffs.mindbuff.keepmind.desc=Grants immunity to webs and harmful weather effects.

actors.buffs.bunnycombo.name=bunny combo
actors.buffs.bunnycombo.bad_target=Your target must be an enemy within attack range.
actors.buffs.bunnycombo.a_prompt=Choose a target to cripple
actors.buffs.bunnycombo.a_desc=_Cripple_ is ready. This attack cripples its target for 5 turns.
actors.buffs.bunnycombo.b_prompt=Choose a target to blind
actors.buffs.bunnycombo.b_desc=_Throw Sand_ is ready. This attack blinds its target for 5 turns.
actors.buffs.bunnycombo.c_prompt=Choose a target to make bleed
actors.buffs.bunnycombo.c_desc=_Sever_ is ready. This attack makes its target bleed.
actors.buffs.bunnycombo.d_prompt=Choose a target to knock back
actors.buffs.bunnycombo.d_desc=_Impact_ is ready. This attack knocks its target back and disorients it.
actors.buffs.bunnycombo.e_prompt=Choose a target to finish
actors.buffs.bunnycombo.e_desc=_Finish Attack_ is ready. This strike deals damage multiplied by the accumulated combo and resets it.
actors.buffs.bunnycombo.desc=Successful attacks build a combo. Missing twice in a row or going 4 turns without attacking resets it. Different unavoidable finishers become available at 2, 4, 6, 8, and 10 combo; only the highest finisher resets the combo.
actors.buffs.funnybuff.name=funny
actors.buffs.funnybuff.desc=Everything seems funny.\n\nTurns remaining: %s.
actors.buffs.exprotect.name=Super protection
actors.buffs.exprotect.desc=The first incoming hit is completely negated. The guard remains asleep until this protection is broken.
actors.buffs.dburning.name=deep burning
actors.buffs.dburning.desc=An intense magical flame damages the target in proportion to its maximum health.\n\nTurns remaining: %s.
actors.blobs.sandstorm.desc=A dry sandstorm is swirling here. It dries creatures and earth-hits items on the floor.
actors.mobs.spsexitmobs$guardalbino.name=Albino rat
actors.mobs.spsexitmobs$guardalbino.desc=This rare white rat spreads corrupt gas and a drying sandstorm around itself.
actors.mobs.spsexitmobs$guardvagrant.name=Infected vagrant
actors.mobs.spsexitmobs$guardvagrant.desc=An originium-infected vagrant with exceptional regeneration and life drain.
actors.mobs.spsexitmobs$guardbandit.name=Crazy bandit
actors.mobs.spsexitmobs$guardbandit.desc=This violet bandit steals gold, spreads dark gas, and poisons its victim.
actors.mobs.spsexitmobs$guardbamboo.name=Bamboo plus
actors.mobs.spsexitmobs$guardbamboo.desc=An evolved bamboo spirit which drains the surrounding life and roots nearby creatures.
actors.mobs.spsexitmobs$guardbombbug.name=Stone bug
actors.mobs.spsexitmobs$guardbombbug.desc=A worm encased in ice stone. It freezes nearby creatures and can split when badly injured.
actors.mobs.spsexitmobs$guardshielded.name=Shielded brute
actors.mobs.spsexitmobs$guardshielded.desc=This gnoll carries a heavy shield, retaliates against attacks, and repeatedly restores its defenses.
actors.mobs.spsexitmobs$guardsenior.name=Senior monk
actors.mobs.spsexitmobs$guardsenior.desc=An elder monk who heals and becomes much stronger when wounded.
actors.mobs.spsexitmobs$guardfiresuccubus.name=Fire succubus
actors.mobs.spsexitmobs$guardfiresuccubus.desc=A powerful succubus surrounded by fire which answers attacks with greater offensive force.
actors.mobs.spsexitmobs$guardacidic.name=Acidic scorpio
actors.mobs.spsexitmobs$guardacidic.desc=This dangerous scorpio releases stench gas and sprays corrosive fluid when struck.

actors.mobs.pets.haro.name=Haro
actors.mobs.pets.haro.desc=An unknown machine repaired by AshWolf.
actors.mobs.pets.pigpet.name=Pixel pig
actors.mobs.pets.pigpet.desc=A clever pink pig trained to find rare underground mushrooms.
actors.mobs.pets.cococat.name=Bomb cat
actors.mobs.pets.cococat.desc=Coconut's pet cat carries a large supply of bombs.
actors.mobs.pets.velocirooster.name=Velocirooster
actors.mobs.pets.velocirooster.desc=A vicious rooster which races through the dungeon and attacks with sharp talons and beak.
actors.mobs.pets.velocirooster.yell1=Cock-a-doodle-roar!
actors.mobs.pets.velocirooster.yell2=Cock-a-doodle-roar...

