actors.mobs.npcs.giftnpc.gift=Give gift
actors.mobs.npcs.giftnpc.gift_prompt=Choose a gift
actors.mobs.npcs.giftnpc.npc_item=%s was gladly accepted.
actors.mobs.npcs.giftnpc.npc_not_item=This resident does not like that gift.
actors.mobs.npcs.giftren.name=REN, waiting for gifts
actors.mobs.npcs.giftren.desc=REN is collecting distinctive objects from this dungeon.
actors.mobs.npcs.giftren.normal=Hello. I am collecting unusual treasures from this dungeon for another world.
actors.mobs.npcs.giftren.yell1=Is there something you need?
actors.mobs.npcs.giftren.yell2=I like gifts from this dungeon.
actors.mobs.npcs.giftren.yell3=I am beginning to like you.
actors.mobs.npcs.giftren.yell4=There are still many interesting things here.
actors.mobs.npcs.giftren.thank1=Excellent condition. Thank you.
actors.mobs.npcs.giftren.thank2=Oh, thank you.
actors.mobs.npcs.giftren.thank3=What a surprise. Thank you!
actors.mobs.npcs.giftren.reward1=Take this in exchange.
actors.mobs.npcs.giftren.reward2=I found this shining nearby.
actors.mobs.npcs.giftren.reward3=I collected plenty of these. Take one.
actors.mobs.npcs.giftren.reward4=Here is something in return.
actors.mobs.npcs.giftren.reward5=Thank you for all those gifts. This armor may protect you from other versions of me.
actors.mobs.npcs.giftashwolf.name=Baron AshWolf
actors.mobs.npcs.giftashwolf.desc=AshWolf is filming a dungeon-survival program with creatures from his domain.
actors.mobs.npcs.giftashwolf.normal=A dungeon expedition cannot carry a lifetime of food. Learn to live off the land.
actors.mobs.npcs.giftashwolf.yell1=Try not to eat raw meat. Use traps or magic to prepare it.
actors.mobs.npcs.giftashwolf.yell2=Rations are fine, but cooked food tastes much better.
actors.mobs.npcs.giftashwolf.yell3=Honey dishes are nutritious and improve endurance.
actors.mobs.npcs.giftashwolf.yell4=A companion matters on a lonely journey.
actors.mobs.npcs.giftashwolf.thank1=How did you know I needed this?
actors.mobs.npcs.giftashwolf.thank2=It smells good. Thank you.
actors.mobs.npcs.giftashwolf.reward1=I gathered several of these. Take one.
actors.mobs.npcs.giftashwolf.reward2=This little fellow would rather adventure with you.
actors.mobs.npcs.giftcoconut.name=Coconut, field tester
actors.mobs.npcs.giftcoconut.desc=An orange cat testing all sorts of equipment.
actors.mobs.npcs.giftcoconut.normal=Hello. Need something?
actors.mobs.npcs.giftcoconut.yell1=I would like some cake.
actors.mobs.npcs.giftcoconut.yell2=What other strange technology is there?
actors.mobs.npcs.giftcoconut.yell3=Where did my little robot go?
actors.mobs.npcs.giftcoconut.yell4=How did the tests go? I have plenty of bombs.
actors.mobs.npcs.giftcoconut.thank1=Thanks.
actors.mobs.npcs.giftcoconut.reward1=A fresh bomb for you.
actors.mobs.npcs.giftcoconut.reward2=This experiment improves accuracy.
actors.mobs.npcs.giftcoconut.reward3=This experiment improves evasion.
actors.mobs.npcs.giftcoconut.reward4=This experiment improves magic power.
actors.mobs.npcs.giftcoconut.reward5=Time for strength training.
actors.mobs.npcs.giftbegger.name=Nameless beggar
actors.mobs.npcs.giftbegger.desc=A wandering beggar who accepts almost anything.
actors.mobs.npcs.giftbegger.normal=Spare something for me?
actors.mobs.npcs.giftbegger.yell1=Spare something for me?
actors.mobs.npcs.giftbegger.yell2=Spare something for me?
actors.mobs.npcs.giftbegger.yell3=Spare something for me?
actors.mobs.npcs.giftbegger.yell4=May the gods protect you.
actors.mobs.npcs.giftbegger.thank1=Thank you. Please take this dew.
actors.mobs.npcs.giftbegger.reward1=I caught this bird for lunch, but it should travel with you instead.
actors.mobs.npcs.giftafly.name=Alfred, Abbey and Abyss camping
actors.mobs.npcs.giftafly.desc=Spring is a fine time to camp, provided there is enough good food.
actors.mobs.npcs.giftafly.normal=Fine weather. Come share some food.
actors.mobs.npcs.giftafly.yell1=Why are there so many mind-vision potions and no food?
actors.mobs.npcs.giftafly.yell2=Why are there so many psionic scrolls and no tissues?
actors.mobs.npcs.giftafly.yell3=How did a sock get mixed in?
actors.mobs.npcs.giftafly.yell4=At least the camping trip went well.
actors.mobs.npcs.giftafly.thank1=Food! At last.
actors.mobs.npcs.giftafly.reward1=Take this potion and scroll in return.
actors.mobs.npcs.giftafly.reward2=The camping trip is over. Take these three blessed rice balls.
actors.mobs.npcs.giftbamech.name=Bastion survey probe
actors.mobs.npcs.giftbamech.desc=A machine used to survey unknown territory.
actors.mobs.npcs.giftbamech.normal=Beep... beep...
actors.mobs.npcs.giftbamech.yell1=Surveying soil.
actors.mobs.npcs.giftbamech.yell2=Surveying life.
actors.mobs.npcs.giftbamech.yell3=Surveying climate.
actors.mobs.npcs.giftbamech.yell4=Survey complete. Analyzing.
actors.mobs.npcs.giftbamech.thank1=Data uploaded.
actors.mobs.npcs.giftbamech.reward1=Supplies delivered.
actors.mobs.npcs.giftbamech.reward2=Survey complete. Transferring points.
actors.mobs.npcs.giftfruitworker.name=Farmer seeking land
actors.mobs.npcs.giftfruitworker.desc=This farmer likes fruit and vegetables.
actors.mobs.npcs.giftfruitworker.normal=Take up a pick and cultivate any soil you find.
actors.mobs.npcs.giftfruitworker.yell1=Did you need something?
actors.mobs.npcs.giftfruitworker.yell2=Your pack smells of fertilizer. You must be a pioneer too.
actors.mobs.npcs.giftfruitworker.yell3=Flowerpots always seem to grow something useful.
actors.mobs.npcs.giftfruitworker.yell4=May your journey be smooth.
actors.mobs.npcs.giftfruitworker.thank1=Fine color and flavor. I like it.
actors.mobs.npcs.giftfruitworker.reward1=Remember to eat well.
actors.mobs.npcs.giftfruitworker.reward2=You have given me so much. Take these rare seeds.
actors.mobs.npcs.giftmeatseller.name=Travelling meat seller
actors.mobs.npcs.giftmeatseller.desc=He likes valuable objects and trades in fresh meat.
actors.mobs.npcs.giftmeatseller.normal=Fresh meat! Bring something valuable to trade.
actors.mobs.npcs.giftmeatseller.yell1=Do not miss this offer.
actors.mobs.npcs.giftmeatseller.yell2=Once I leave, this shop is gone.
actors.mobs.npcs.giftmeatseller.yell3=Money or company, both are welcome.
actors.mobs.npcs.giftmeatseller.yell4=We are friends now. I will look out for you.
actors.mobs.npcs.giftmeatseller.thank1=Thank you for your business.
actors.mobs.npcs.giftmeatseller.reward1=Take this small voucher and visit again.
actors.mobs.npcs.giftmeatseller.reward2=Honeyed meat is my favorite. Take these for free.
actors.mobs.npcs.gifttorch.name=Burning campfire
actors.mobs.npcs.gifttorch.desc=An ordinary campfire.
actors.mobs.npcs.gifttorch.normal=The fire crackles.
actors.mobs.npcs.gifttorch.yell1=The flame burns steadily.
actors.mobs.npcs.gifttorch.yell2=The flame burns fiercely.
actors.mobs.npcs.gifttorch.yell3=The campfire burns steadily.
actors.mobs.npcs.gifttorch.yell4=The flame burns fiercely.
actors.mobs.npcs.gifttorch.thank1=The flame brightens and produces a torch.
actors.mobs.npcs.gifttorch.reward1=The flame roars and a lump of coal falls out.
actors.mobs.npcs.gifttorch.reward2=The flame roars and several gems fall out.
actors.mobs.npcs.giftflyling.name=Ling, lost in thought
actors.mobs.npcs.giftflyling.desc=Ling quietly supports worthy adventurers.
actors.mobs.npcs.giftflyling.normal=Every adventurer who braves the golden-city laboratory deserves respect.
actors.mobs.npcs.giftflyling.yell1=No need to thank me. I only helped a little.
actors.mobs.npcs.giftflyling.yell2=No need to thank me. I only helped a little.
actors.mobs.npcs.giftflyling.yell3=No need to thank me. I only helped a little.
actors.mobs.npcs.giftflyling.yell4=Travel safely. I wish you well.
actors.mobs.npcs.giftflyling.thank1=Thank you. I will treasure it.
actors.mobs.npcs.giftflyling.thank2=Is this really for me? Thank you!
actors.mobs.npcs.giftflyling.thank3=You are skilled and kind. I will have a gift for you too.
actors.mobs.npcs.giftflyling.reward1=This potion should help your potential.
actors.mobs.npcs.giftflyling.reward2=Take this wand. It will help you.
actors.mobs.npcs.giftflyling.reward3=Take this blessed crystal necklace.
actors.mobs.npcs.giftbunnykeeper.name=Bunny-stacking keeper
actors.mobs.npcs.giftbunnykeeper.desc=She is stacking rabbits for reasons unknown.
actors.mobs.npcs.giftbunnykeeper.normal=Would you help me gather rabbits?
actors.mobs.npcs.giftbunnykeeper.yell1=They run around. You will need cleverness to catch them.
actors.mobs.npcs.giftbunnykeeper.yell2=It is fine if they escape into a burrow.
actors.mobs.npcs.giftbunnykeeper.yell3=Rabbits are limited, but herd them together and...
actors.mobs.npcs.giftbunnykeeper.yell4=Please support Paquerette: Down the Bunburrows.
actors.mobs.npcs.giftbunnykeeper.thank1=Bunny, bunny.
actors.mobs.npcs.giftbunnykeeper.reward1=Look, a new little bunny.
actors.mobs.npcs.giftbunnykeeper.reward2=Look, a big bunny.
actors.buffs.lokispoison.name=virulent poison
actors.buffs.lokispoison.desc=Virulent poison courses through the body and deals damage based on its remaining duration.\n\nPoison duration remaining: %s turns.
actors.buffs.lokispoison.heromsg=You are poisoned!
actors.buffs.bloodangry.name=Blood Angry
actors.buffs.bloodangry.desc=It make you stronger. %s turns left.
actors.buffs.fullmoonstrength.name=Moon power
actors.buffs.fullmoonstrength.desc=You become stronger, and you will deal 2.5 damage.
actors.buffs.fullmoonstrength.heromsg=You become stronger.
actors.buffs.lingbless.name=Ling's prayer
actors.buffs.lingbless.desc=Ling's blessing slightly improves your evasion and speed.\n\n%s turns left.
actors.buffs.magicimmunity.name=Magic shield
actors.buffs.magicimmunity.desc=Magic immunity can help you resistances some buffs.\n\nTurn left : %s
actors.mobs.orbofzotmob.name=Zot destructo
actors.mobs.orbofzotmob.desc=You use this thing and it is attacking mobs.
actors.mobs.orbofzotmob.die=Energy down, waiting for charge.
actors.mobs.npcs.blacksmith.gold_1=Hey human! Wanna be useful, eh? Take dis pickaxe and mine me some _dark gold ore, 15 pieces_ should be enough. What do you mean, how am I gonna pay? You greedy...\nOk, ok, I don't have money to pay, but I can do some smithin' for you. Consider yourself lucky, I'm the only blacksmith around.
actors.mobs.npcs.blacksmith.gold_2=Dark gold ore. 15 pieces. Seriously, is it dat hard?
actors.mobs.npcs.blacksmith.keeppickaxe=Take this pickaxe. It will be useful.
actors.mobs.npcs.blacksmith.completed=Oh, you have returned... Better late dan never.
actors.mobs.npcs.blacksmith.same_item=Select 2 different items, not the same item twice!
actors.mobs.npcs.blacksmith.un_ided=I need to know what I'm working with, identify them first!
actors.mobs.npcs.blacksmith.cursed=I don't work with cursed items!
actors.mobs.npcs.blacksmith.degraded=It's junk, the quality is too poor!
actors.mobs.npcs.blacksmith.need_reinforced=Sorry, dis item is too weak to handle so many upgrades.
actors.mobs.npcs.blacksmith.cant_reforge=I can't reforge these items!
actors.mobs.npcs.blacksmith.triforce=So, you found those three pieces? Fine, I will fuse them.

actors.mobs.npcs.blacksmith2.name=Troll welder
actors.mobs.npcs.blacksmith2.desc=This troll welder is tall and lean, and his skin resembles stone in both color and texture. He is tinkering with an unproportionally small welding tool.
actors.mobs.npcs.blacksmith2.himself=I'm that stubborn blacksmith's younger brother. I believe science can help trolls too. Bring me a matching _adamant component_ and _50 dark gold_ and I can surprise you.
actors.mobs.npcs.blacksmith2.adamantite=That adamant component can let an item withstand any number of upgrades. Bring me _50 dark gold_ and I can weld them together.
actors.mobs.npcs.blacksmith2.same_item=I can't weld an item to itself.
actors.mobs.npcs.blacksmith2.un_ided=I can't weld an unknown item.
actors.mobs.npcs.blacksmith2.cursed=I can't weld a cursed item.
actors.mobs.npcs.blacksmith2.already_reforge=That item already has an adamant component welded to it.
actors.mobs.npcs.blacksmith2.degraded=I can't weld a degraded item.
actors.mobs.npcs.blacksmith2.cant_reforge=I can't reinforce an item that cannot be upgraded.
actors.mobs.npcs.blacksmith2.cant_work=That component does not match this item.
actors.mobs.npcs.blacksmith2.looks_better=Your %s can now withstand any number of upgrades.

