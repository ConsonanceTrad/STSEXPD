actors.mobs.spscitymobs$summonedskeleton.desc=This is merely an undead creature pulled into the dungeon by magic.
actors.mobs.spscitymobs$levelchecker.name=Adjudicator
actors.mobs.spscitymobs$levelchecker.desc=A huge mechanical adjudicator resembling a set of scales. It judges its victims by their experience.
actors.mobs.spscitymobs$greatmoss.name=Great moss
actors.mobs.spscitymobs$greatmoss.desc=A massive hybrid of plant and elemental life which releases dangerous spores when struck.
actors.mobs.spscitymobs$redwraith.name=Chaos wraith
actors.mobs.spscitymobs$redwraith.desc=A red wraith dense with chaotic energy. Legends say that some rings draw their magic from these spirits.
