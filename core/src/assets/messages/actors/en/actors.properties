actors.mobs.firesuccubus.desc=The succubi are demons that look like seductive (in a slightly gothic way) girls. Using its magic, the succubus can charm a hero, who will become unable to attack anything until the charm wears off.

actors.mobs.bombbug.name=stone bug
actors.mobs.bombbug.desc=An worm that lives with ice stone.

