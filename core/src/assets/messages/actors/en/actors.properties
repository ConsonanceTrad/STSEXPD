actors.mobs.sandmob$minisand.desc=mini sand mob
actors.mobs.icebug.name=Ice climber
actors.mobs.icebug.desc=An worm that lives in a cold environment.
actors.mobs.timekeeper.name=timekeeper
actors.mobs.timekeeper.desc=The guardian of the timeline.
actors.mobs.timekeeper.yell=foolish!!!
actors.mobs.dustelement.name=dust element
actors.mobs.dustelement.blind=Dust hinder your sight.
actors.mobs.dustelement.desc=It's a cloud of dust, made by time and dark magic power.
actors.mobs.ratboss.name=Leader rat
actors.mobs.ratboss.desc=This is leader rat, it can summon other rats,
actors.mobs.ratboss.spawn=There's a group of mice here!
actors.mobs.shit.name=Toilet Elf
actors.mobs.shit.desc=live in sewers, live with garbage.
actors.mobs.livemoss.name=living moss
actors.mobs.livemoss.desc=One mob from slay the spire.
actors.mobs.patroluav.name=patrol UAV
actors.mobs.patroluav.desc=It is robot used for cleaning sewer garbage.\nmech
actors.mobs.vagrant.name=vagrant
actors.mobs.vagrant.desc=Vagrant living in sewers, and heal fast.
actors.mobs.exvagrant.name=virus vagrant
actors.mobs.exvagrant.desc=vagrant with stone virus
actors.mobs.ghostphoto.name=Mouldy painting
actors.mobs.ghostphoto.desc=An oil painting once used to decorate a prison office. Dark magic has corrupted it and set it wandering.
actors.mobs.goldcollector.name=Gold collector
actors.mobs.goldcollector.desc=A goblin tax collector carrying a huge bag. It steals gold and converts the proceeds into a shield.
actors.mobs.firerabbit.name=Lucifer
actors.mobs.firerabbit.desc=A rabbit fire trooper sent here to purge the undead.
actors.mobs.firerabbit.yell=ko~ko~da~yo
actors.mobs.trollwarrior.name=Troll warrior
actors.mobs.trollwarrior.desc=Trolls were among the prison's strongest factions before its fall. Even the guards tried to avoid provoking them.
actors.mobs.trollwarrior.angry=You dare attack me?!
actors.mobs.zombie.name=Zombie
actors.mobs.zombie.desc=This is no mindless, slow corpse. It is an infected undead creature.
actors.mobs.fireelemental.name=Fire elemental
actors.mobs.fireelemental.desc=Wandering fire elementals are a byproduct of summoning greater entities. They are too chaotic to be controlled by even the most powerful demonologist.
actors.mobs.greyrat.name=Grey rat
actors.mobs.greyrat.desc=Heartier cousins to marsupial rats, grey rats tolerate the most polluted parts of the sewers. They are probably still good to eat once cooked.

actors.buffs.becorrupt.name=Erosion
actors.buffs.becorrupt.desc=Erosion prevents healing and turns changes in health into further damage. Remaining erosion: %s.
actors.mobs.spshallsmobs$demongoo.name=Demon goo
actors.mobs.spshallsmobs$demongoo.desc=Demon goo is made from lava, slime, dark energy and malice, but most of its body is darkness. Even a weak fragment can grow strong again.
actors.mobs.spshallsmobs$demongoo.divide=The demon goo divides!
actors.mobs.spshallsmobs$thiefimp.name=Thief imp
actors.mobs.spshallsmobs$thiefimp.desc=Imps are lesser demons known for cruelty and greed. This one steals anything it can carry.
actors.mobs.spshallsmobs$thiefimp.stole=The thief imp stole %s from you!
actors.mobs.spshallsmobs$thiefimp.carries=\n\nThe thief imp is carrying _%s_. Stolen, obviously.
actors.mobs.spshallsmobs$demonflower.name=Demon flower
actors.mobs.spshallsmobs$demonflower.desc=A flower grown in hell. It attacks in rapid bursts and releases spores that weaken its target's attacks and armor.
actors.mobs.spshallsmobs$demonflower.debuff=The demon flower releases weakening spores.
actors.mobs.spshallsmobs$sufferer.name=Sufferer
actors.mobs.spshallsmobs$sufferer.desc=A warlock who failed to control a greater demon and was corrupted and enslaved by it.
