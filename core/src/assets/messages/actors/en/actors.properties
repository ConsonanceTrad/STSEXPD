actors.char.def_verb=dodged
actors.char.invulnerable=invulnerable
actors.char.immune=immune

actors.mobs.challengeguardian.guardian_name=challenge guardian
actors.mobs.challengeguardian.echo_name=challenge echo
actors.mobs.challengeguardian.guardian_desc=A guardian shaped by the journal's magic. It protects the destination's sole reward. Its strength follows the chapter where the route was found, and defeating it grants no experience.
actors.mobs.challengeguardian.echo_desc=A lesser echo given form by the journal's magic. It carries no treasure and grants no experience.

actors.mobs.adventureguardian.guardian_name=%s guardian
actors.mobs.adventureguardian.echo_name=%s echo
actors.mobs.adventureguardian.guardian_desc=The principal enemy of %s. Each destination selects a ranged or melee pattern and one of five status attacks. At two health thresholds it gains a short burst of speed and a capped barrier. It grants no experience or random loot.
actors.mobs.adventureguardian.echo_desc=A lesser enemy echo inhabiting %s. It uses a weaker version of the destination's status attack and grants no experience or random loot.
actors.mobs.adventureguardian.boss_desc=The central boss of %s. %s Its phase ability can trigger only twice, and summoned echoes grant no experience or random loot.
actors.mobs.adventureguardian.boss_name_6=year beast
