actors.mobs.npcs.omicronrg9.yell2=Be cautious with the piranhas. They are dangerous when unarmored.
actors.mobs.npcs.omicronrg9.yell3=There are 24 Pixel Dungeon mods which start with "P". This is not a joking!
actors.mobs.npcs.omicronrg9.yell4=My left eye got burnt because excessive time at computer, searching for new mods. It was a needed sacrifice.
actors.mobs.npcs.omicronrg9.yell5=Hope is still an illusion!
