actors.mobs.adventureguardian.boss_name_21_wave_2=dwarf king echo
actors.mobs.adventureguardian.boss_name_21_wave_3=shadow god echo
actors.mobs.adventureguardian.rush_next=%s enters the boss rush!
actors.mobs.adventureguardian.boss_name_22=chaos avatar
actors.mobs.adventureguardian.boss_name_23=Zot projection
actors.mobs.adventureguardian.boss_name_24=Zot
actors.mobs.fiend.name=fiend
actors.mobs.fiend.desc=Some demons seem to transcend their flesh and wear pure darkness as their form. Shadowy and menacing, these unholy abominations are born of malicious intent and are nothing more than incarnations of distilled evil, revelling only in death and pain.
actors.mobs.goldorc.name=gold-eyed bokoblin
actors.mobs.goldorc.def_verb=blocked
actors.mobs.goldorc.desc=Dark energy has corrupted this bokoblin into a dangerous monster.
actors.mobs.bluewraith.name=wraith warrior
actors.mobs.bluewraith.desc=A wraith warrior has been dispatched to avenge the dungeon.
actors.mobs.orc.name=bokoblin
actors.mobs.orc.desc=A brutal pig-faced warrior which releases corrupt gas when heavily wounded.
actors.mobs.orc.killcount=Bokoblins defeated: %d
actors.mobs.flyingprotector.name=wisdom protector
actors.mobs.flyingprotector.desc=Protector of the wisdom trial.
actors.mobs.flyingprotector.zap_kill=The wisdom protector's lightning bolt killed you...
actors.mobs.shadowyog.name=shadow Yog-Dzewa
actors.mobs.shadowyog.desc=Shadow Yog is Yog's projection from another world. Defeating it may reveal the secret of crossing worlds.
actors.mobs.shadowyog.blink=Shadow Yog vanishes!
actors.mobs.shadowyog.die=...
actors.mobs.shadowyog.illusion=There is no light here, only our shadows to consume you...
actors.mobs.tenguden.name=hidden Tengu
actors.mobs.tenguden.desc=A famous and enigmatic assassin who escaped confinement. He uses deceptive movement and precise attacks to eliminate anyone who finds his den.
actors.mobs.tenguden.notice=How did you find me?!
actors.mobs.tenguden.die=Curse you!!!
actors.mobs.skeletonhand1.name=skeleton hand
actors.mobs.skeletonhand1.desc=This ancient giant hand belongs to the king of skeletons.
actors.mobs.skeletonhand2.name=king hand
actors.mobs.skeletonhand2.desc=This ancient giant hand belongs to the king of skeletons.
actors.mobs.skeletonking.name=skeleton king
actors.mobs.skeletonking.desc=This ancient giant skull belongs to the king of skeletons.
actors.mobs.skeletonking.notice=You will die screaming in flames, %s!
actors.mobs.skeletonking.die=I need more mana...
actors.mobs.crabking.name=crab king
actors.mobs.crabking.desc=The crab king collects protective magic and items to defend its children. It hides within a powerful suit of armor.
actors.mobs.crabking.notice=Away from my children!
actors.mobs.crabking.die=Sorry... my children...
actors.mobs.crabking.heal=The crab king draws power from the lightning shell!
actors.mobs.shell.name=lightning shell
actors.mobs.shell.desc=The lightning shell crackles with power drawn from attacks against the king's servants.
actors.mobs.shell.zap=The lightning shell discharges!
actors.mobs.spshermitcrab.name=hermit crab
actors.mobs.spshermitcrab.desc=These tough servants of the crab king absorb powerful attacks with their shells and feed that energy to the lightning shell.
actors.mobs.spshermitcrab.absorb=The hermit crab channels the attack into the lightning shell.
actors.mobs.adventureguardian.tactic_6=It pressures movement with fire attacks and accelerates at each phase change.
actors.mobs.adventureguardian.tactic_7=It fires from range, and its heavy shell produces barriers at phase changes.
actors.mobs.adventureguardian.tactic_9=It inflicts poison and hatches one echo at each phase change.
actors.mobs.adventureguardian.tactic_10=It controls range with blinding darts and relocates at phase changes.
actors.mobs.adventureguardian.tactic_11=It weakens nearby enemies and twice calls an echo from the tomb.
actors.mobs.adventureguardian.tactic_12=It cripples enemies and relies on thicker phase barriers than other bosses.
actors.mobs.adventureguardian.tactic_13=It blinds targets from range and calls an accomplice when wounded.
actors.mobs.adventureguardian.tactic_14=It weakens enemies and rallies a field echo at each phase change.
actors.mobs.adventureguardian.tactic_15=It disrupts movement, while its pottery barrier reforms at each phase change.
actors.mobs.adventureguardian.tactic_16=It spreads poison from range and slips elsewhere on the map at phase changes.
actors.mobs.adventureguardian.tactic_17=It launches ranged fire attacks and calls a dragon echo at each phase change.
actors.mobs.adventureguardian.tactic_18=It delays pursuit with blinding attacks and changes position twice.
actors.mobs.adventureguardian.tactic_19=It uses ranged crippling attacks and has thicker phase barriers.
actors.mobs.adventureguardian.tactic_20=It exposes weaknesses from range and teleports at phase changes.
actors.mobs.adventureguardian.tactic_21=Four boss echoes fight in sequence, using cripple, blindness, weakness, and slow respectively. Their total health stays within the endgame budget.
actors.mobs.adventureguardian.tactic_22=Its status effects vary, and it relocates unpredictably at phase changes.
actors.mobs.adventureguardian.tactic_23=It exposes weaknesses from range and creates Zot echoes at phase changes.
actors.mobs.adventureguardian.tactic_24=It alternates poison and cold while combining summoning with teleportation.

actors.mobs.npcs.sokobanblock.name=sokoban block
actors.mobs.npcs.sokobanblock.desc=A heavy puzzle block. Interact with it from a cardinal direction to push it one tile. Move every block onto a marked pedestal to solve the map.
actors.hero.heroclass.performer=performer
actors.hero.heroclass.performer_desc_short=The performer builds short bursts of _rhythm_ after gaining experience and fights with an unusual mix of reach and tricks.
actors.hero.heroclass.performer_desc=The performer gains a brief _blessing of rhythm_ whenever experience is earned, and gains a small barrier on level-up. The starting kit contains a dagger and a reed pipe; the pipe is intended as a reach weapon once its strength requirement is met.\n\nThe performer can become a _superstar_ or a _joker_.\n\nThe performer begins knowing scrolls of lullaby and potions of purity.
actors.hero.heroclass.performer_unlock=The performer is unlocked by default in the fusion edition.
actors.hero.heroclass.soldier=soldier
actors.hero.heroclass.soldier_desc_short=The soldier has slightly better _accuracy, evasion, and health growth_ without exceeding normal equipment scaling.
actors.hero.heroclass.soldier_desc=The soldier begins with a rapier and three throwing spikes. Training grants 5% more accuracy and evasion, 2 additional starting health, and one additional maximum health on each level-up.\n\nThe soldier can become an _agent_ or a _leader_.\n\nThe soldier begins knowing scrolls of rage and potions of healing.
actors.hero.heroclass.soldier_unlock=The soldier is unlocked by default in the fusion edition.
actors.hero.heroclass.follower=follower
actors.hero.heroclass.follower_desc_short=The follower relies on _careful supplies and fairer prices_, beginning with healing and a small travel fund.
actors.hero.heroclass.follower_desc=The follower begins with a cudgel, one potion of healing, and 50 gold. Shop purchases cost 10% less, but selling prices and random drops are unchanged.\n\nThe follower can become an _artisan_ or a _pastor_.\n\nThe follower begins knowing scrolls of terror and potions of healing.
actors.hero.heroclass.follower_unlock=The follower is unlocked by default in the fusion edition.
actors.hero.heroclass.ascetic=ascetic
actors.hero.heroclass.ascetic_desc_short=The ascetic alternates between _close combat and controlled wand use_ with no free upgrade multiplier.
actors.hero.heroclass.ascetic_desc=The ascetic begins with gloves and a magic missile wand. The starting equipment is deliberately unupgraded, so the class follows the same early-game power budget as Shattered's other heroes.\n\nThe ascetic can become a _disciplinarian_ or a _hacker_.\n\nThe ascetic begins knowing scrolls of recharging and mirror image.
actors.hero.heroclass.ascetic_unlock=The ascetic is unlocked by default in the fusion edition.
actors.hero.heroclass.newplayer=beginner
actors.hero.heroclass.newplayer_desc_short=A hidden class used only by the SPS-PD beginner tutorial.
actors.hero.heroclass.newplayer_desc=The beginner enters the tutorial with no equipment, 50 maximum health, and 10 current health.
actors.hero.heroclass.newplayer_unlock=This class is only available through the tutorial.

actors.mobs.npcs.leadercn.name=Guide coconut
actors.mobs.npcs.leadercn.desc=Follow this cat to complete this tutorial.
actors.mobs.npcs.leadercn.yell1=Welcome, welcome to this test, pick up this key, and then open that door.
actors.mobs.npcs.leadercn.yell2=You don't have anything now. Pick up those pieces of equipment, open your backpack, select each item, and equip it. After that, attack the enemy ahead.
actors.mobs.npcs.leadercn.yell3=Can't find the way? Use the search button and inspect the walls around you. You may discover something.
actors.mobs.npcs.leadercn.yell4=You stepped on a trap. Your health is now low, so search the nearby chests and mounds for something useful.
actors.mobs.npcs.leadercn.yell5=There may be food in those webs, but I don't recommend opening them directly. Throw this onto the strange empty space in the middle.
actors.mobs.npcs.leadercn.yell6=This wand deals magical damage. The enemy ahead resists physical damage, so choose the right element to defeat it.
actors.mobs.npcs.leadercn.yell7=You now understand the basic controls. Complete the rest on your own. This bomb can destroy walls.
actors.mobs.npcs.leadercn.yell8=Congratulations, you found the last of me. Pick up this pudding and the tutorial is over. Goodbye, and I hope we meet again.

actors.hero.herosubclass.superstar=superstar
actors.hero.herosubclass.superstar_short_desc=The _superstar_ keeps the performer's rhythm blessing for longer.
actors.hero.herosubclass.superstar_desc=Whenever experience is gained, the superstar's rhythm blessing lasts 5 turns instead of 3. Their tier-3 talents emphasize mobility and tempo.
actors.hero.herosubclass.joker=joker
actors.hero.herosubclass.joker_short_desc=The _joker_ can hinder enemies with missile attacks.
actors.hero.herosubclass.joker_desc=Missile attacks have a 20% chance to cripple their target for 2 turns. Their tier-3 talents emphasize ranged setup and shared upgrades.
actors.hero.herosubclass.agent=agent
actors.hero.herosubclass.agent_short_desc=The _agent_ uses missile weapons with improved accuracy.
actors.hero.herosubclass.agent_desc=The agent gains 15% accuracy with missile weapons. Their tier-3 talents support range, movement, and bounties.
actors.hero.herosubclass.leader=leader
actors.hero.herosubclass.leader_short_desc=The _leader_ remains composed under direct attack.
actors.hero.herosubclass.leader_desc=The leader takes 10% less damage before armor reduction. Their tier-3 talents emphasize protection and support.
actors.hero.herosubclass.artisan=artisan
actors.hero.herosubclass.artisan_short_desc=The _artisan_ handles demanding equipment more efficiently.
actors.hero.herosubclass.artisan_desc=For equipment requirements, the artisan has 1 additional effective strength. Their tier-3 talents emphasize equipment flexibility.
actors.hero.herosubclass.pastor=pastor
actors.hero.herosubclass.pastor_short_desc=The _pastor_ recovers health more efficiently while fed.
actors.hero.herosubclass.pastor_desc=The pastor's natural regeneration is 25% faster. Unlike the old implementation, it cannot heal beyond maximum health.
actors.hero.herosubclass.ascetic_monk=disciplinarian
actors.hero.herosubclass.ascetic_monk_short_desc=The _disciplinarian_ specializes in controlled glove combat.
actors.hero.herosubclass.ascetic_monk_desc=The disciplinarian deals 1 additional damage with gloves. This route uses the monk talent family but remains distinct from the duelist's Monk subclass.
actors.hero.herosubclass.hacker=hacker
actors.hero.herosubclass.hacker_short_desc=The _hacker_ converts active recharging into melee power.
actors.hero.herosubclass.hacker_desc=While recharging, the hacker deals 10% more physical damage. Their tier-3 talents emphasize wand charge and empowered strikes.
actors.mobs.npcs.adventureguide.name_0=haven archivist
actors.mobs.npcs.adventureguide.desc_0=The archivist maintains the stable route back to the main dungeon. The haven contains no renewable supplies.
actors.mobs.npcs.adventureguide.dialogue_0=Your journal is now synchronized with the haven marker. The sokoban practice route has been recorded.
actors.mobs.npcs.adventureguide.name_5=Dolyahaven commissioner
actors.mobs.npcs.adventureguide.desc_5=The commissioner records expeditions for the town. Completing this conversation accepts the festival and mining route chain.
actors.mobs.npcs.adventureguide.dialogue_5=The town registry recognizes your journal. The spring festival grounds are now available as the next commission.
actors.mobs.npcs.adventureguide.name_8=new-home caretaker
actors.mobs.npcs.adventureguide.desc_8=The caretaker guards the route from the peaceful maps into the dangerous expedition chain.
actors.mobs.npcs.adventureguide.dialogue_8=Preparations are complete. The infested nest has been entered as your first combat expedition.
actors.mobs.npcs.adventureguide.town_shop=View limited supplies
actors.mobs.npcs.adventureguide.town_leave=Leave for now
actors.mobs.npcs.adventureguide.shop_title=Dolyahaven supplies
actors.mobs.npcs.adventureguide.shop_desc=The town has one of each item per run and never restocks. Followers receive a ten-percent discount.
