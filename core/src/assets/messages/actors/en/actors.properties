actors.buffs.newcombo.bad_target=Your target must be an enemy within attack range.
actors.buffs.newcombo.clobber_prompt=Select a target to clobber
actors.buffs.newcombo.clobber_desc=_Clobber_ deals 1.6x damage, knocks the target back, and disorients it.
