actors.blobs.nmgas.rankings_desc=Consumed by nano gas
actors.blobs.nmgas.ondeath=You were consumed by nano gas...
actors.blobs.curseweb.desc=Everything here is covered by shadow webbing. It curses every creature that steps into it.
