actors.mobs.npcs.omicronrg9.desc=This long-haired human seems to be a crusader of the old times, but It is actually a Scholar who restlessly researches for different worlds in this big universe. He's here because Honey brought him, and he is collecting data about this world and sharing information about other worlds. He has not slept well so He may be aggresive.
