actors.mobs.spsgoo.name=Sewer Goo
actors.mobs.spsgoo.desc=Little is known about Goo. It may not even be a creature, but a mass of vile sewer matter given basic intelligence by dark magic. Its gelatinous body stores enormous dark energy; a fully charged strike is extremely dangerous.
