actors.mobs.spscavemobs$sandmob$minisand.desc=A smaller fragment split from a dead sand creature.
actors.mobs.spscavemobs$icebug.name=Ice climber
actors.mobs.spscavemobs$icebug.desc=A worm adapted to extremely cold environments. Its bite inflicts crystalline frost.
actors.mobs.spscavemobs$timekeeper.name=Timekeeper
actors.mobs.spscavemobs$timekeeper.desc=A guardian of the timeline which can displace creatures through space and escape fatal blows.
actors.mobs.spscavemobs$timekeeper.yell=Foolish!
actors.buffs.bugslow.name=Parasite infestation
actors.buffs.bugslow.desc=The parasites periodically slow their host. Removing every parasite from the backpack ends this effect.
actors.buffs.lightshootattack.name=Light strike
actors.buffs.lightshootattack.desc=Powerful light repeatedly strikes this location. Move away from the area to avoid further damage. Turns remaining: %s.
actors.mobs.spscitymobs$dragonrider.name=Dragon rider
actors.mobs.spscitymobs$dragonrider.desc=A soldier who fights from dragonback. When the dragon dies, its rider continues the battle.
actors.mobs.spscitymobs$spiderbot.name=Scavenger
actors.mobs.spscitymobs$spiderbot.desc=These creatures appeared in the city late in the war. They feed on corpses and launch their young onto hostile creatures. When one dies, the parasites inside spill everywhere.
actors.mobs.spscitymobs$spiderbot.yell=Strange bugs climb into your backpack.
actors.mobs.spscitymobs$musketeer.name=Dwarf musketeer
actors.mobs.spscitymobs$musketeer.desc=Unlike the dwarven king, the dwarven general believed firearms were the right path of research. These marksmen now patrol the kingdom.
