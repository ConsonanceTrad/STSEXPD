actors.mobs.spscavemobs$gnollshaman.name=Gnoll shaman
actors.mobs.spscavemobs$gnollshaman.desc=The most intelligent gnolls master battle magic to compensate for their lack of physical strength.
actors.mobs.spscavemobs$sandmob.name=Sand creature
actors.mobs.spscavemobs$sandmob.desc=An elemental creature made from sand. It splits into smaller copies when destroyed.
