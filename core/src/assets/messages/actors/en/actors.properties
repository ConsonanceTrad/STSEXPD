actors.mobs.npcs.adventureguide.forge_prompt=Choose an unupgraded fusion weapon
actors.mobs.npcs.adventureguide.forge_already=That weapon has already been upgraded and cannot receive this limited forging.
actors.mobs.npcs.adventureguide.forged=%s is stabilized at +1. The otherworld forge has gone cold for this run.

