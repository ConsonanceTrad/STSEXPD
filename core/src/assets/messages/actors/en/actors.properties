actors.mobs.npcs.fusionpet.role_1=Striker role: higher melee damage, but lower health.
actors.mobs.npcs.fusionpet.role_2=Ranged role: can attack along clear lines at three-quarters damage.
actors.mobs.npcs.fusionpet.role_3=Support role: balanced base stats and an occasional poison attack.
actors.mobs.npcs.fusionpet.desc=A travelling companion from the Special Surprise pet families. %s Its stats grow only within a capped hero-level curve, and it produces no items or experience.

