###features
levels.features.chasm.chasm=Chasm
levels.features.chasm.yes=Yes, I know what I'm doing
levels.features.chasm.no=No, I changed my mind
levels.features.chasm.jump=Do you really want to jump into the chasm? A fall that far will be painful.
levels.features.chasm.ondeath=You fell to death...
levels.features.chasm.rankings_desc=Died on Impact

levels.features.dewblessroom.order=The dew goddess blesses you. Clear this floor within %d turns.

levels.features.sign.dead_end=What are you doing here?!
levels.features.sign.pit_message=Note to self: Always leave a teleport scroll in the vault.
levels.features.sign.chaos=Endless mode
levels.features.sign.new_room_0=Standard SPS-PD model room.
levels.features.sign.new_room_1=Forest house made by Ash Wolf. It is said that a little witch once lived there.
levels.features.sign.new_room_2=Abandoned grassland made by hmdzl001. Its former residents left because of the barren soil.
levels.features.sign.new_room_3=Beach islands made by hmdzl001, with wide waters, little cover, and no shark attacks.
levels.features.sign.new_room_4=Snowfield made by hmdzl001, cold yet welcoming.
levels.features.sign.tip_1=Nice view, isn't it? This is a small town at the edge of the barrier. The sealed sewer lies ahead; investigate why it was closed.
levels.features.sign.tip_2=Welcome to this dungeon. If you are new, open your backpack and use the random soul to obtain your first pet. A pet's strength is limited; if you do not intend to grow stronger yourself, you will need a powerful one.
levels.features.sign.tip_3=Time passes unnoticed. Check the current time in the status bar, and prepare enough light for the night.
levels.features.sign.tip_4=Meat is meat, mushrooms are vegetables, rations are staples, and berries are fruit. Add water made from dew and you should be able to cook many kinds of food.
levels.features.sign.tip_5=What lies at the bottom of the sewers: an element swallowed by darkness, a scholar exploring the unknown, or an exotic plant? Go and see.
levels.features.sign.tip_6=After resolving the sewer incident, you arrive at the gate of Horn Prison. “Pixel Shop” provides everything a successful adventurer needs, and even sells a small cabin.
levels.features.sign.tip_7=The tower has begun testing firearms. You can forge two raw stones into heavy shot, or experiment with other recipes such as a raw stone and a seed.
levels.features.sign.tip_8=Many races can be found here, each with its own resistances and weaknesses. Use them to make your journey easier.
levels.features.sign.tip_9=Starvation will hurt you, and hunger alone will weaken your attacks.
levels.features.sign.tip_10=This is the prison's central control room. The warden watches, Tengu hides in the shadows, and the undead are ready to break through. Prepare yourself.
levels.features.sign.tip_11=After leaving the prison, you head for a cave beneath the palace where time is said to be chaotic. “Pixel Shop”: spend more money, travel farther. Sightseeing tickets available.
levels.features.sign.tip_12=This dungeon hides many traps and secret doors, as well as extreme weather. Do not rush.
levels.features.sign.tip_13=Weapons generally have their own special effects, most noticeable on lower-tier weapons. Armor comes in light, normal, and heavy types, each with different benefits.
levels.features.sign.tip_14=Bombs and darts are single-use consumables. Use them wisely. Ranged weapons can increase arrow damage.
levels.features.sign.tip_15=Time converges and events unfold here. Will machines resume production, beasts take over completely, or something unknowable seize control? The future is in your hands.
levels.features.sign.tip_16=The end of the caves transports you to ruins near the tribe. “Pixel Market” makes the dungeon safer.
levels.features.sign.tip_17=Some effects cancel each other while others reinforce one another. Make sure you are at your strongest before facing your enemies.
levels.features.sign.tip_18=The town keeps changing, just as you do.
levels.features.sign.tip_19=Many things remain unfinished. They will be resolved in the future.
levels.features.sign.tip_20=The climax of the war of chaos: a king, a leader, an undead. You will reveal who prevails.
levels.features.sign.tip_21=One final task: investigate the abyss. “Pixel Market” offers demon hunters special discounts and displays unique items that are not for sale.
levels.features.sign.tip_22=Reading signs seems pointless now. Are you sure you want to continue?
levels.features.sign.tip_23=The abyss lies at the farthest edge we can observe. No one knows what is beyond it.
levels.features.sign.tip_24=No expedition has reached the very bottom. Most creatures here have demonic traits and are much stronger.
levels.features.sign.tip_25=The evil god lies ahead. Learn how to banish it, and use its power...
levels.features.sign.burn=As you try to read the sign, it bursts into greenish flames.



###rooms
levels.rooms.secret.ratkingroom$ratkingroomdeco.statue_name=Rat Statue
levels.rooms.secret.ratkingroom$ratkingroomdeco.pillow_name=Regal Pillow
levels.rooms.secret.ratkingroom$ratkingroomdeco.statue_desc=A statue in the likeness of Rat King. Who made this?
levels.rooms.secret.ratkingroom$ratkingroomdeco.pillow_desc=This puffy purple pillow would be too small of a bed for you, but it's the perfect size for the world's most important rat.

levels.rooms.special.magicalfireroom$eternalfire.desc=A wall of dense bright green fire is here, seemingly caused by magic. It's so dense that you can't move through it, and it ignites anything that gets too close. It shows no signs of burning down naturally, you'll need to use something to extinguish it.

levels.rooms.special.sentryroom$sentry.name=red sentry
levels.rooms.special.sentryroom$sentry.desc=This blood-red sentry seems to be positioned here to guard the treasure at the other end of this room. It will fire beams of disintegration magic at you if you step in the area it defends.\n\nIt's immune to all harmful effects and can see through invisibility, but seems to take a while to charge up before it starts firing.\n\nSomehow the sentry only wants to fire on you, as if it knows that the denizens of the dungeon are no threat to the treasure.
levels.rooms.special.sentryroom$sentry.discover_hint=You can find this enemy anywhere in the dungeon.

levels.rooms.special.toxicgasroom$toxicvent.name=toxic vent
levels.rooms.special.toxicgasroom$toxicvent.desc=A careless adventurer must have triggered this trap ages ago. Despite its inactive state, it's still spewing toxic gas into the room and shows no signs of stopping. You'll need some way to prevent damage from the gas if you want to explore this room.

levels.rooms.special.weakfloorroom$hiddenwell.name=Distant well
levels.rooms.special.weakfloorroom$hiddenwell.desc=You can just make out a well in the depths below, perhaps there is something down there?

levels.rooms.quest.ambitiousimproom$questentrance.name=Vault Entrance
levels.rooms.quest.ambitiousimproom$questentrance.desc=This ominous pit seems to be the entrance to some ancient dwarven vault. A magical barrier prevents entry, you can walk over top of it as if there was floor here.

levels.rooms.quest.blacksmithroom$questentrance.name=Mine entrance
levels.rooms.quest.blacksmithroom$questentrance.desc=This ladder leads to an old mine just below the blacksmith's workshop.

levels.rooms.quest.blacksmithroom$smithyvisuals.name=Smithy
levels.rooms.quest.blacksmithroom$smithyvisuals.desc=A little smithy set up by the troll blacksmith, complete with a coal tray, a forge, and a water basin that looks absolutely filthy.

levels.rooms.quest.ritualsiteroom$ritualmarker.name=Ritual marker
levels.rooms.quest.ritualsiteroom$ritualmarker.desc=A painted marker for some dark ritual. Candles are usually placed on the four corners.
levels.rooms.quest.ritualsiteroom$table.name=Ominous Table
levels.rooms.quest.ritualsiteroom$table.desc=This heavy table looks like it was crudely modified into a sort of torture rack.

levels.rooms.quest.massgraveroom$massgravedeco.name=Mass grave
levels.rooms.quest.massgraveroom$massgravedeco.desc=Bones litter the floor, what happened here?

levels.rooms.quest.mineentrance$questexit.name=Mine exit
levels.rooms.quest.mineentrance$questexit.desc=This ladder leads out of the mine, back into the blacksmith's workshop.

levels.rooms.quest.vault.vaultentranceroom$questentranceinternal.name=Platform
levels.rooms.quest.vault.vaultentranceroom$questentranceinternal.desc=This large platform is same size as the pit above you. Probably this platform is involved in some kind of elevator mechanism when the vault is accessed normally.

levels.rooms.quest.vault.vaultfinalroom.imp_warning_unprepared=As you step into the large room, time seems to slow and you hear the Imp's voice:\n\n"I think you've entered the ultimate chamber of the vault, my statuette should be just beyond! I'm sure there's going to some sort of nasty trap or guardian though, so _you really should explore and prepare before going any further!_ I want you to actually get my prize, not die trying!"
levels.rooms.quest.vault.vaultfinalroom.imp_warning_prepared=As you step into the large room, time seems to slow and you hear the Imp's voice:\n\n"Alright, I think you're in the ultimate chamber of the vault, my statuette should be just beyond! I'm sure there's going to some sort of nasty trap or guardian though, so _make sure you're all powered up and ready for a big fight!_ I want you to actually get my prize, not die trying."
levels.rooms.quest.vault.vaultfinalroom.final_warning=You hear something charging up, one more step forward is going to trigger something!
levels.rooms.quest.vault.vaultfinalroom$markertiles.name=Gigantic marker
levels.rooms.quest.vault.vaultfinalroom$markertiles.desc=This pattern in the floor tiles looks like a gigantic version of a summoning marker from the prison.\n\nThe whole floor hums with energy, as if there's some great power just waiting to be unleashed.
levels.rooms.quest.vault.vaultfinalroom$vaulttreasure.desc=Gold is piled on the floor here, it's a shame you can't take it back out of the vault with you.

###traps
levels.traps.alarmtrap.name=alarm trap
levels.traps.alarmtrap.alarm=The trap emits a piercing sound that echoes throughout the dungeon!
levels.traps.alarmtrap.desc=This trap seems to be tied to a loud alarm mechanism. Triggering it will likely alert everything on the level.

levels.traps.boundtrap.name=bound reward trap
levels.traps.boundtrap.desc=Triggering this trap releases a random item.

levels.traps.dewtrap.name=violet dew trap
levels.traps.dewtrap.desc=Triggering this trap scatters violet dewdrops across the surrounding tiles.

levels.traps.knowledgetrap.name=knowledge trap
levels.traps.knowledgetrap.desc=Triggering this trap identifies the equipment you are carrying.

levels.traps.paralytictrap.name=paralytic gas trap
levels.traps.paralytictrap.desc=Triggering this trap releases a cloud of paralytic gas into the surrounding area.
levels.traps.poisontrap.name=poison trap
levels.traps.poisontrap.desc=Triggering this trap poisons the creature standing on it.
levels.traps.venomtrap.name=venom gas trap
levels.traps.venomtrap.desc=Triggering this trap releases a cloud of deadly venom gas into the surrounding area.
levels.traps.worntrap.name=worn out trap
levels.traps.worntrap.nothing=Nothing happens...
levels.traps.worntrap.desc=This ancient trap is too worn out to do anything when triggered.

levels.traps.bufftrap.firebufftrap.name=fire field trap
levels.traps.bufftrap.firebufftrap.desc=This visible trap releases a short-lived field of SPS fire.
levels.traps.bufftrap.icebufftrap.name=frost field trap
levels.traps.bufftrap.icebufftrap.desc=This visible trap releases a short-lived field of SPS frost.
levels.traps.bufftrap.shockbufftrap.name=shock field trap
levels.traps.bufftrap.shockbufftrap.desc=This visible trap releases a short-lived field of SPS electricity.
levels.traps.bufftrap.earthbufftrap.name=acid field trap
levels.traps.bufftrap.earthbufftrap.desc=This visible trap releases a short-lived field of SPS acid.
levels.traps.bufftrap.lightbufftrap.name=light field trap
levels.traps.bufftrap.lightbufftrap.desc=This visible trap releases a short-lived field of SPS light.
levels.traps.bufftrap.darkbufftrap.name=shadow field trap
levels.traps.bufftrap.darkbufftrap.desc=This visible trap releases a short-lived field of SPS shadow.
levels.traps.bufftrap.firebuff2trap.name=fire field trap
levels.traps.bufftrap.firebuff2trap.desc=This trap releases a medium field of SPS fire.
levels.traps.bufftrap.firebuff3trap.name=large fire field trap
levels.traps.bufftrap.firebuff3trap.desc=This trap releases a large field of SPS fire.
levels.traps.bufftrap.icebuff2trap.name=frost field trap
levels.traps.bufftrap.icebuff2trap.desc=This trap releases a medium field of SPS frost.
