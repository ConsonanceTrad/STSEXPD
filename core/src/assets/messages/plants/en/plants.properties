plants.sungrass$exsungrass.desc=You can find heal fruit in here.
plants.dewcatcher$exdewcatcher.name=shrub of dewcatcher
plants.dewcatcher$exdewcatcher.desc=You can find green spores in here.
plants.stareater$exstareater.name=shrub of upgrade eater
plants.stareater$exstareater.desc=You can find upgrade eaters in here.
plants.renepenth$exrenepenth.name=shrub of phase-pitcher
plants.renepenth$exrenepenth.desc=You can find transmutation balls in here.
plants.seedpod$exseedpod.name=shrub of seed-pod
plants.seedpod$exseedpod.desc=You can find random fruit in here.
