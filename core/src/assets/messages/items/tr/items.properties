items.consum.potions.potion.ac_drink=İÇ
items.consum.potions.potion.turquoise=turkuaz iksir
items.consum.potions.potion.crimson=kızıl iksir
items.consum.potions.potion.azure=gök mavisi iksir
items.consum.potions.potion.jade=yeşim iksir
items.consum.potions.potion.golden=altın iksir
items.consum.potions.potion.magenta=eflatun iksir
