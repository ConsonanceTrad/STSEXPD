items.equipment.artifacts.cloakofshadows.discover_hint=Kahramanlardan birisi bu eşyayla başlar.
items.equipment.artifacts.cloakofshadows$cloakstealth.no_charge=Pelerininin enerjisi bitti.
items.equipment.artifacts.cloakofshadows$cloakstealth.levelup=Pelerinin güçlendi!
