items.kingscrown.upgraded=Zırhın dönüşürken taç hafifçe parlıyor ve yok oluyor.
items.kingscrown.ratgraded=Zırhın dönüşürken Fare Kralın ön ayakları parlıyor.
items.kingscrown.desc=Son cüce kralınının tacı inanılmaz büyülü enerjiyle parlıyor.\n\nTakıldığında tacın büyüsü şu an giydiğin zırha akar ve onu _özel yetenekli eşsiz ve epik_ bir zırha dönüştürür. Yeni zırh orijinal zırhın tüm özelliklerini korur.
items.kingscrown.discover_hint=Bu eşyayı belirli düşmanlardan düşünce edinebilirsin.

items.liquidmetal.name=sıvı metal
items.liquidmetal.ac_apply=ÜZERİNDE KULLAN
items.liquidmetal.prompt=Atılan bir silah seçin
items.liquidmetal.already_fixed=O fırlatılan silah zaten mükemmel durumda!
items.liquidmetal.apply=Fırlattığınız silahı onarmak için %d sıvı metal kullanıyorsunuz.
items.liquidmetal.desc=Bu sihirli sıvı, fırlatılan bir silahın çatlak ve kırıklarına dolarak onu mükemmel duruma geri getirebilir! Bir silah setinde bir silah eksikse ancak diğerleri tamamen onarılmışsa, sıvı metal setten eksik olan silahı değiştirmek için bile kullanılabilir!\n\n1. seviye bir silahın tamamen onarılması için 10 sıvı metal, 5. seviye bir silahın onarılması için ise 30 sıvı metal gerekir. Her yükseltme, gereken metal miktarını %35 artırır.\n\nSıvı metal, uçlu dartların uçlarını onarmak için kullanılamaz.
items.liquidmetal.discover_hint=Bu eşyayı simya ile üretebilirsin.

items.lostbackpack.name=kayıp sırt çantası
items.lostbackpack.desc=Bu senin kayıp envanterin. Kaybettiğin tüm eşyaları geri almak için topla!

items.merchantsbeacon.name=tüccar'ın feneri
items.merchantsbeacon.ac_use=KULLAN
items.merchantsbeacon.desc=Bu garip cüce teknoloji parçası uzak mesafelerden iletişim kurmanı sağlar.\n\nAktifleştirildikten sonra, bu fener Pixel Mart'a zindanda herhangi bir yerden eşya satmanı sağlar.\n\nAncak, bu fenerin içindeki büyü sadece bir seferliğine kullanılabilir, bu yüzden dikkatlice kullan.

items.stylus.name=büyülü kalem
items.stylus.ac_inscribe=KAZI
items.stylus.prompt=Bir zırh seç
items.stylus.identify=Öncelikle bu zırhın lanetli olup olmadığını belirlemelisin.
items.stylus.cursed=Kalemin büyüsü lanetli zırhın üzerinde işe yaramaz.
items.stylus.inscribed=Kalemle zırhının üzerini kazıdın
items.stylus.desc=Bu büyülü kalem kara, berk bir taştan yapılmış. Bunu kullanarak zırhın üzerine büyülü bir rün işleyebilirsin, ancak bu rünün ne olacağı konusunda hiç bir gücün yoktur; kalem senin için seçecektir.

items.tengusmask.name=Tengunun Maskesi
items.tengusmask.ac_wear=GİYİM
items.tengusmask.used=Maskenin gücü sana aktıkça maske yok oluyor!
items.tengusmask.desc=Bu maske tengu ölürken yüzünden düştü, maskeden yayılan güçlü büyülü gücü hissedebiliyorsun. Maske Tengunun gücünün kaynağı mıydı ?\n\nTakıldığında maskenin inanılmaz gücü sana geçer, artık _kahramanın için bir alt sınıf_ seçebilirsin.\n\nHangi alt sınıfı seçeceksin?
items.tengusmask.discover_hint=Bu eşyayı belirli düşmanlardan düşünce edinebilirsin.

items.torch.name=meşale
items.torch.ac_light=YAK
items.torch.desc=Bir maceranın olmazsa olmazı, bir zindan karardığında bir meşale yolu gösterebilir.

items.waterskin.name=kırba
items.waterskin.ac_drink=İÇ
items.waterskin.collected=Çiy damlasını kırbana topladın.
items.waterskin.full=Kırban doldu!
items.waterskin.empty=Kırban boş!
items.waterskin.desc=Deri ve sicimden yapılmış mantar tıpayla tıkanan sıvılar için bir kap.
items.waterskin.desc_water=Şu anda kırbada sadece normal içme suyu var. Eminim ki zindanda kırbanın depolayabileceği başka bir şey vardır.
items.waterskin.desc_heal=Kırba şu anda şifalı su depolamak için kullanılıyor. Kırba ne kadar dolu olursa, ondan içerken o kadar fazla anında iyileşirsin. Sadece ihtiyacın kadar içeceksin.
items.waterskin.desc_full=Dolu kırba enerji saçıyor gibi görünüyor, belki de başka bir hayatta kalma eşyasını kutsamak için kullanılabilir?
items.waterskin.discover_hint=Kahramanlardan birisi bu eşyayla başlar.
