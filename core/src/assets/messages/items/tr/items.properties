items.equipment.wands.cursedwand.transmogrify_other=Eşyanız farklı bir şeye dönüşüyor!
items.equipment.wands.cursedwand.disguise=Görüntün gözlerinin önünde değişiyor.
items.equipment.wands.cursedwand.supernova=Alev alev yanan bir enerji topu büyümeye başlıyor. Koşmak isteyebilirsin!
items.equipment.wands.cursedwand.supernova_positive=Alev alev yanan bir enerji topu büyümeye başladı ama bir şekilde kendini güvende hissettiriyor.
items.equipment.wands.cursedwand.sinkhole=Etrafınızdaki zemin çökmeye başlıyor!
items.equipment.wands.cursedwand.sinkhole_positive=Yer çökmeye başlıyor ama altınızda yeterince sağlam hissediyorsunuz.
items.equipment.wands.cursedwand.gravity=Yerçekimi aniden rastgele yönlere doğru çekmeye başlar!
items.equipment.wands.cursedwand.gravity_positive=Bir anda yerçekimi her yerden çekmeye başlıyor ama bu seni etkiliyor gibi görünmüyor
items.equipment.wands.cursedwand.gravity_end=Yer çekimi kaosu sona erdi.

