###armor curses
items.equipment.armor.curses.antientropy.name=Anti entropi %s
items.equipment.armor.curses.antientropy.desc=Anti-entropi laneti, evrenin güçlerine karşı çalışır, enerjiyi kullanıcıya çeker ve çevresinden uzaklaştırır. Bu, kullanıcıyı kısaca ateşe verir, ancak etrafındaki her şeyi dondurur!

items.equipment.armor.curses.bulk.name=Yığın %s
items.equipment.armor.curses.bulk.desc=Büyük zırhlar daha büyük ve daha heybetli görünür, ancak aslında savunma gücünü artırmaz. Daha da kötüsü, ek boyut kapı aralıklarından geçmeyi çok zorlaştırır.

items.equipment.armor.curses.corrosion.name=Korozif %s
items.equipment.armor.curses.corrosion.desc=Korozif zırhlar etrafa aşındırıcı bir sıvı saçarak bölgedeki her şeyi yapışkan, asidik bir çamurla kaplayabilir.

items.equipment.armor.curses.displacement.name=Boşluk dolduran %s
items.equipment.armor.curses.displacement.desc=Yerdeğiştirme laneti giyen kişiyi saldırıdan korumak için güvenliğe hareket ettirmeye çalışır. Ama biraz fazla etkili olduğu için kullanıcıyı seviyenin içinde rastgele ışınlar.

items.equipment.armor.curses.metabolism.name=Metabolistik %s
items.equipment.armor.curses.metabolism.desc=Metabolizma laneti giyen kişi yaralandığında tokluğu doğrudan sağlığa çevirerek iyileştirme katkısı yapar, ancak çabucak açlığa yol açar.

items.equipment.armor.curses.multiplicity.name=Çoğaltan %s
items.equipment.armor.curses.multiplicity.desc=Çokluk laneti barındıran zırhlar tehlikeli kopyalama büyüsü içerir. Bazen giyen kişinin bir ayna görüntüsünü oluşturur, ama düşmanları da kopyalama şansı vardır!

items.equipment.armor.curses.overgrowth.name=Aşırı büyümüş %s
items.equipment.armor.curses.overgrowth.desc=Aşırı büyüme zırhı çeşitli yeşimlenmiş bitkilerle kaplı. Bu etki kesinlikle ilginç görünse de defans adına hiçbir şey sağlamıyor, ve bu bitkiler dövüş esnasında rastgele aktifleşecek!

items.equipment.armor.curses.stench.name=pis kokulu %s
items.equipment.armor.curses.stench.desc=Kokuşma ile lanetlenmiş zırh, içinde yakalanan her şey için zararlı iğrenç gaz bulutları salar.


###glyphs
items.equipment.armor.glyphs.affection.name=Hayranlık veren %s
items.equipment.armor.glyphs.affection.desc=Bu güçlü rün saldıranların zihinlerini kontrol ederek onların geçici olarak tutulmasına yol açar.

items.equipment.armor.glyphs.antimagic.name=büyükıran %s
items.equipment.armor.glyphs.antimagic.desc=Bu güçlü rün, zırhı giyen kişinin fiziksel saldırıların yanı sıra büyülü saldırılara karşı da korur. Büyü koruması zırh seviyesinden etkilenmez.

items.equipment.armor.glyphs.brimstone.name=kükürtlü %s
items.equipment.armor.glyphs.brimstone.desc=Bu rün, zırhı giyen kişiyi ve eşyalarını ateşten korur, ateşin hasarı ve olumsuz etkilerini tamamen geçersiz kılar.

items.equipment.armor.glyphs.camouflage.name=kamuflajlı %s
items.equipment.armor.glyphs.camouflage.desc=Bu rün zırhı giyen kişinin uzun çimlerin içine karışmasını sağlayarak onlara geçici görünmezlik verir.

items.equipment.armor.glyphs.entanglement.name=Dolaştıran %s
items.equipment.armor.glyphs.entanglement.desc=Bu rün, hasarı emmek için zırhın etrafında topraktan bir kabuk yetiştirir, ancak zırhı giyen kişi hareket ederse koruma devre dışı kalır.

items.equipment.armor.glyphs.flow.name=akışkan %s
items.equipment.armor.glyphs.flow.desc=Bu rün suyun akışını zırhı giyen kişinin etrafında kontrol ederek o kişinin suyun içinde daha hızlı hareket etmesini sağlar.

items.equipment.armor.glyphs.obfuscation.name=kafa karıştırıcı %s
items.equipment.armor.glyphs.obfuscation.desc=Bu rün, giyen kişiye belirsiz bir görüntü vererek onu farkedilmesi daha zor bir hale getirir.

items.equipment.armor.glyphs.potential.name=Potansiyel veren %s
items.equipment.armor.glyphs.potential.desc=Bu rün, hasar aldıkça enerji üretir ve aktif edildiğinde zırhı giyen kişinin değneklerini şarj eder.

items.equipment.armor.glyphs.repulsion.name=geri tepici %s
items.equipment.armor.glyphs.repulsion.desc=Bu rün saldırganların güçünü onlara çevirerek onları geriye doğru savurur.

items.equipment.armor.glyphs.stone.name=taşlı %s
items.equipment.armor.glyphs.stone.desc=Bu rün, zırhı, kaçınmayı imkansız hale getiren ağır bir büyülü taşla kaplar, fakat aldığı kaçınmanın üstünü kapatmak için fazladan hasar bloklar.

items.equipment.armor.glyphs.swiftness.name=çevik %s
items.equipment.armor.glyphs.swiftness.desc=Bu rün, yakınlarda bir düşman yoksa zırhı giyen kişinin hızını artırır

items.equipment.armor.glyphs.thorns.name=dikenli %s
items.equipment.armor.glyphs.thorns.desc=Bu güçlü rün sahibine saldıranları yavaşça kanatarak saldırganlara zarar verir.

items.equipment.armor.glyphs.viscosity.name=Yumuşak %s
items.equipment.armor.glyphs.viscosity.deferred=ertelenmiş %d
items.equipment.armor.glyphs.viscosity$defereddamage.name=ertelenmiş hasar
items.equipment.armor.glyphs.viscosity$defereddamage.ondeath=Geciktirilmiş hasar seni öldürdü...
items.equipment.armor.glyphs.viscosity$defereddamage.rankings_desc=Geciktirilmiş hasar tarafından öldürüldü
items.equipment.armor.glyphs.viscosity$defereddamage.desc=Hasar anında verilmek yerine zamanla veriliyor.\n\nKalan geciktirilmiş hasar: %d.
items.equipment.armor.glyphs.viscosity.desc=Bu rün giyen kişinin aldığı hasarı depolayarak onlara bunu birden vermenin tersine yavaşça verir.



