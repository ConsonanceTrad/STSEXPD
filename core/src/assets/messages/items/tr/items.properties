items.equipment.artifacts.driedrose.desc_no_quest=Yaşına rağmen hala bir arada kalmayı başarabilen kurumuş bir gül.\n\nBir ruhani bir güce sahip gibi görünüyor, fakat şu an o gücü nasıl kullanabileceğin hakkında hiçbir fikrin yok.
items.equipment.artifacts.driedrose.desc_hint=Görünüşe göre bir kaç taçyaprağı eksik. Belki onları tekrar yerine takmak gülü güçlendirir.
