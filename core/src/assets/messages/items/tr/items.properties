items.equipment.rings.ringofarcana.upgrade_stat_name_1=Gizemli bonus
items.equipment.rings.ringofarcana.desc=Bu yüzük, lanetler de dahil olmak üzere silahlardaki büyülü büyüleri ve zırhlardaki glifleri geliştirir! Önce aktivasyon şansını arttırır, ardından aktivasyon şansı %100 olduğunda etkinin gücünü arttırır. Bunun yerine lanetli bir yüzük büyüleri, glifleri ve lanetleri zayıflatır.

items.equipment.rings.ringofelements.name=elementlerin yüzüğü
items.equipment.rings.ringofelements.stats=Bu yüzük takıldığında _%%%s_ element direnci sağlar.
items.equipment.rings.ringofelements.typical_stats=Bu yüzük takıldığında tipik olarak _%%%s_ element direnci sağlar.
items.equipment.rings.ringofelements.combined_stats=Takılı yüzüklerin güçlerini birleştirerek toplam _%%%s_ element direnci sağlıyor.
items.equipment.rings.ringofelements.upgrade_stat_name_1=Direniş
items.equipment.rings.ringofelements.desc=Bu yüzük çoğu elemental ve büyülü etkiye karşı onların verdiği hasarları ve zararlı etkilerinin sürelerini azaltarak direnç sağlar. Doğal olarak lanetli bir yüzük bu etkileri daha kötü bir hale getirir.

items.equipment.rings.ringofenergy.name=Enerji yüzüğü
items.equipment.rings.ringofenergy.stats=Takıldığında bu yüzük değnek, eser, ve kahraman zırhı şarj olma hızını  _%s%%_ arttırır.
items.equipment.rings.ringofenergy.typical_stats=Takıldığında bu yüzük tipik olarak değnek, eser, ve kahraman zırhı şarj olma hızını _%s%%_ arttırır.
items.equipment.rings.ringofenergy.combined_stats=Takılı yüzüklerin güçlerini birleştirerek şarj olma hızını toplam _%%%s_ arttırıyor.
items.equipment.rings.ringofenergy.upgrade_stat_name_1=Şarj bonusu
items.equipment.rings.ringofenergy.desc=Bu yüzükten yayılan gizemli enerji alanında sihirli ekipmanın daha hızlı yenilenir. Ancak lanetli bir yüzük, yenilenmeyi yavaşlatır.

items.equipment.rings.ringofevasion.name=sakınma yüzüğü
items.equipment.rings.ringofevasion.stats=Bu yüzük takıldığında, kaçınma yeteneğini _%%%s_ arttırır.
items.equipment.rings.ringofevasion.typical_stats=Bu yüzük takıldığında, genellikle kaçınma yeteneğinizi _%%%s_ artırır.
items.equipment.rings.ringofevasion.combined_stats=Takılı yüzüklerin güçlerini birleştirerek kaçınma oranını toplam _%%%s_ arttırıyor.
items.equipment.rings.ringofevasion.upgrade_stat_name_1=Kaçınma bonusu
items.equipment.rings.ringofevasion.desc=Bu yüzük giyen kişinin reaksiyonlarını hızlandırarak ona vurmayı zorlaştırır. Lanetli bir yüzük onu giyen kişiye vurulmasını kolaylaştıracaktır.

items.equipment.rings.ringofforce.name=güç yüzüğü
items.equipment.rings.ringofforce.stats=Mevcut gücünüz ile yumruk atarken bu yüzük _%1$d-%2$d_ hasar verir. Bir silah kullanıyorsanız bu yüzük hasarınızı _%3$d_ artırır.
items.equipment.rings.ringofforce.typical_stats=Yumruklarınız ve mevcut gücünüz ile bu yüzük normalde _%1$d-%2$d_ hasar  verir. Bir silah kullanıyorsanız normalde hasarınızı _%3$d_ artırır.
items.equipment.rings.ringofforce.combined_stats=Takılı yüzükleriniz güçlerini birleştirerek silahsız olarak toplam _%1$d-%2$d hasar_ verir veya bir tanesiyle hasarı _%3$d_ artırır.
items.equipment.rings.ringofforce.upgrade_stat_name_1=Silahsız hasar
items.equipment.rings.ringofforce.upgrade_stat_name_2=Silahlı hasar bonusu
items.equipment.rings.ringofforce.upgrade_stat_name_3=Yetenek hasarı
items.equipment.rings.ringofforce.ability_name=kavgacı duruşu
items.equipment.rings.ringofforce.typical_ability_desc=Düellocu bu yüzükle bir _kavgacı duruşu_ benimseyebilir, bu da normal saldırılarının bir silah takılı olsa bile her zaman bu yüzüğü kullanmasına neden olur. Bu saldırılar tipik olarak _%1$d-%2$d hasar_ verir ve ayrıca silahın büyüsünü ve güçlendirmesini de devralır.  Bu duruş silahın şarj olma hızını 50%% yavaşlatır.
items.equipment.rings.ringofforce.ability_desc=Düellocu bu yüzükle bir _kavgacı duruşu_ benimseyebilir, bu da normal saldırılarının bir silah takılı olsa bile her zaman bu yüzüğü kullanmasına neden olur. Bu saldırılar _%1$d-%2$d hasar_ ve ayrıca silahın büyüsünü ve güçlendirmesini de devralır. Bu duruş silahın şarj olma hızını 50%% yavaşlatır.
items.equipment.rings.ringofforce.desc=Bu yüzük kuşananın yakın dövüş saldırılarını geliştirecektir. Bu fazladan güç silah kullanırken çok daha azdır ama yumruklarınızı çok daha fazla güçlendirir. Lanetli bir yüzük ise kuşananın darbelerinin etkisini düşürecektir
items.equipment.rings.ringofforce$brawlersstance.name=kavgacı duruşu
items.equipment.rings.ringofforce$brawlersstance.desc=Bu duruştayken Düellocu'nun normal saldırıları, bir silah kuşanmış olsa bile, kuşanılmış bir güç yüzüğünü kullanacaktır. Bu saldırılar ilave hasar kazanır ve silahın güçlendirme ve büyüsünü kullanmaya devam eder.\n\nAncak bu duruşu sürdürmek odaklanmayı gerektirir ve silah yeteneği şarj hızını %50 azaltır.\n\nBu duruş bir güç yüzüğü kullanılarak açılıp kapatılabilir, ancak duruş hızla etkinleştirilip devre dışı bırakılırsa şarj hızındaki azalma bir süre daha devam eder.

items.equipment.rings.ringoffuror.name=öfke yüzüğü
items.equipment.rings.ringoffuror.stats=Bu yüzük takıldığında, saldırılarınızın hızını _%%%s_ artırır.
items.equipment.rings.ringoffuror.typical_stats=Bu yüzük takıldığında, saldırılarınızın hızını genellikle _%%%s_ artırır.
items.equipment.rings.ringoffuror.combined_stats=Takılı yüzükleriniz güçlerini birleştirerek saldırılarınızın hızını toplamda _%s-%%_ artırıyor.
items.equipment.rings.ringoffuror.upgrade_stat_name_1=Saldırı hızı bonusu
items.equipment.rings.ringoffuror.desc=Bu yüzük giyenine bir iç hiddet verip daha hızlı saldırmasını sağlayacaktır. Lanetli bir yüzük ise giyeninin saldırı hızını düşürecektir.

items.equipment.rings.ringofhaste.name=acele yüzüğü
items.equipment.rings.ringofhaste.stats=Takıldığında bu yüzük hareket hızını _%s%%_ artırır
items.equipment.rings.ringofhaste.typical_stats=Takıldığında bu yüzük tipik olarak hareket hızını _%s%%_ artırır
items.equipment.rings.ringofhaste.combined_stats=Takılı yüzükleriniz güçlerini birleştirerek hareket hızınızı toplamda _%s-%%_ oranında artırıyor.
items.equipment.rings.ringofhaste.upgrade_stat_name_1=Hareket hızı bonusu
items.equipment.rings.ringofhaste.desc=Bu yüzük, giyicisinin hareket stresini azaltarak insanüstü hızlarda koşmasını sağlayacaktır. Lanetli bir yüzük ise giyicisinin hareketini ağırlaştıracaktır.

items.equipment.rings.ringofmight.name=yücelik yüzüğü
items.equipment.rings.ringofmight.stats=Takıldığında bu yüzük gücünü _%1$d_ ve azami canını _%2$s%%_ artırır.
items.equipment.rings.ringofmight.typical_stats=Kuşanıldığında bu yüzük normalde kuşananın gücünü _%1$d_ ve azami canınını _%2$s%%_ artırır
items.equipment.rings.ringofmight.combined_stats=Takılı yüzükleriniz güçlerini birleştirerek gücünüzü toplamda _%1$d_ ve maksimum HP'nizi _%2$s%%_ artırıyor.
items.equipment.rings.ringofmight.upgrade_stat_name_1=Güç Artışı
items.equipment.rings.ringofmight.upgrade_stat_name_2=Maksimum can bonusu
items.equipment.rings.ringofmight.desc=Bu yüzük giyen kişinin fiziksel kabiliyetlerini arttırarak onlara daha yüksek fiziksel güç ve dayanıklılık verir. Lanetli bir yüzük giyen kişiyi zayıflatır.

items.equipment.rings.ringofsharpshooting.name=keskin nişancılık yüzüğü
items.equipment.rings.ringofsharpshooting.stats=Bu yüzük giyildiği zaman, sanki fırlatma silahlarının seviyesi _%1$d_ artmış gibi hasar verir, ve dayanıklılıklarını _%2$s%%_ arttırır.
items.equipment.rings.ringofsharpshooting.typical_stats=Takıldığında, bu yüzük tipik olarak, fırlatmalı silahlarınızın hasarını, sanki seviyeleri _%1$d_ artırılmış gibi ve dayanıklılıklarını _%2$s%%_ oranında artıracaktır.
items.equipment.rings.ringofsharpshooting.combined_stats=Takılı yüzükleriniz güçlerini birleştirerek etkili fırlatılan silah seviyesini _%1$d_ ve dayanıklılıklarını toplamda _%2$s%%_ artırıyor.
items.equipment.rings.ringofsharpshooting.upgrade_stat_name_1=Seviye hasarı bonusu
items.equipment.rings.ringofsharpshooting.upgrade_stat_name_2=Dayanıklılık bonusu
items.equipment.rings.ringofsharpshooting.desc=Bu yüzük, giyen kişinin nişan alımını ve kesinliğini attırarak tüm mesafeli silahları daha hasar verici ve sağlam hale getirir. Lanetli bir yüzük zıt efekte sahip olacaktır.

items.equipment.rings.ringoftenacity.name=inat yüzüğü
items.equipment.rings.ringoftenacity.stats=Kuşanıldığında bu yüzük kuşanannın aldığı hasarı _%s%%_ azaltır.
items.equipment.rings.ringoftenacity.typical_stats=Kuşanıldığında bu yüzük genelde kuşananın aldığı hasarı _%s%%_ azaltır.
items.equipment.rings.ringoftenacity.combined_stats=Takılı yüzükleriniz güçlerini birleştirerek aldığınız hasarı toplamda _%s%%_ kadar azaltır.
items.equipment.rings.ringoftenacity.upgrade_stat_name_1=Maximum hasar dayanıklılığı
items.equipment.rings.ringoftenacity.desc=Giyildiğinde bu yüzük kuşananın normalde ölümcül olan saldırılara direncini arttırır. Kullanıcı ne kadar yaralı ise, hasara karşı o kadar dirençli olur. Lanetli bir yüzük düşmanların giyen kişiyi öldürmelerini kolaylaştırır.

items.equipment.rings.ringofwealth.name=zenginlik yüzüğü
items.equipment.rings.ringofwealth.stats=Kuşanıldığında bu yüzük şansını _%%%s_ artırır.
items.equipment.rings.ringofwealth.typical_stats=Kuşanıldığında bu yüzük normalde şansını _%%%s_ artırır.
items.equipment.rings.ringofwealth.combined_stats=Takılı yüzüklerin güçlerini birleştirerek şansını toplamda _%%%s_ artırıyor.
items.equipment.rings.ringofwealth.upgrade_stat_name_1=Şans Artışı
items.equipment.rings.ringofwealth.desc=Bu yüzük hazineler için bir mıknatıs gibi, düşmanların ve konteynırların değerli eşyalar taşıması şansını artırır. Lanetli bir yüzük ise ganimet kazanma şansını azaltır.



