items.equipment.artifacts.cloakofshadows$cloakstealth.desc=Gölgelerin pelerini, sen onunla örtünmüşken sana görünmezlik sağlıyor. İptal edilene veya görünmezliğinin şarjı bitene kadar görünmez kalacaksın.\n\nSen görünmezken düşmanlar sana saldıramaz veya seni takip edemez. Fiziksel saldırılar ve büyülü etkiler (parşömenler ve değnekler gibi) görünmezliği hemen iptal eder.\n\nŞarj harcanmasına kalan sıra: %d.

