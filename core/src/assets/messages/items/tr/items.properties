items.equipment.wands.wand.resin_one=Bu değnek, gizemli reçineden _1 seviye_ kazandı.
items.equipment.wands.wand.resin_many=Bu değnek, gizemli reçineden _%d seviye_ kazandı.
items.equipment.wands.wand.cursed=Bu değnek lanetlenmiş, bu lanet onun büyüsünü kaotik ve rastgele bir hale getiriyor.
items.equipment.wands.wand.not_cursed=Bu değnekte kötücül bir büyü yok.
items.equipment.wands.wand.curse_discover=Bu %s lanetlenmiş!
items.equipment.wands.wand.prompt=Saldırmak için bir yer seç
items.equipment.wands.wand$placeholder.name=değnek

items.equipment.wands.wandofblastwave.name=patlayıcı dalga değneği
items.equipment.wands.wandofblastwave.staff_name=patlayıcı dalga asası
items.equipment.wands.wandofblastwave.ondeath=Kendini kendi Patlayıcı Dalga Değneğin ile öldürdün...
items.equipment.wands.wandofblastwave.knockback_ondeath=Çarpışma seni öldürdü...
items.equipment.wands.wandofblastwave.desc=Bu değnek bir çeşit mermer taşından yapılmış, üzerinde altın süsleme ve ucunda siyah bir mücevher bulunuyor. Elinde çok ağır hissettiriyor.
items.equipment.wands.wandofblastwave.typical_stats_desc=Bu değnek, hedef konumda şiddetli bir şekilde patlayan bir şimşek fırlatır. Bu patlamanın gücü genellikle _%1$d-%2$d hasar_ verir ve çoğu düşmanı uçuracak kadar güçlüdür.
items.equipment.wands.wandofblastwave.stats_desc=Bu değnek hedef bölgede şiddetli bir biçimde patlayan bir büyü fırlatır. Patlamanın kuvveti _%1$d-%2$d_ hasar verir ve çoğu düşmanı uçuracak kadar güçlüdür.
items.equipment.wands.wandofblastwave.upgrade_stat_name_2=Geri itme
items.equipment.wands.wandofblastwave.bmage_desc=Savaş Büyücüsü felçli bir düşmana patlama dalgası asasını vurduğunda, felç etkisini harcayarak ekstra büyü hasarı verir. Bu etki, her düşman için kısa bir bekleme süresine sahiptir.
items.equipment.wands.wandofblastwave.eleblast_desc=Patlayıcı dalga asası ile uygulanan bir elemental patlama %67 hasar verir ve bütün düşmanları patlama alanının dışına savurur.

items.equipment.wands.wandofcorrosion.name=aşındırma değneği
items.equipment.wands.wandofcorrosion.staff_name=aşındırma asası
items.equipment.wands.wandofcorrosion.desc=Bu değneğin dişbudak ağacından yapılma gövdesinin içerisinde parlak bir turuncu mücevher bulunuyor.
items.equipment.wands.wandofcorrosion.stats_desc=Bu değnek hedefe patlayıp aşındırıcı gaz bulutu salan bir ok gönderir. Bulutun içinde kalan her şey  _%d hasardan_ başlayarak zamanla artan hasar verir.
items.equipment.wands.wandofcorrosion.upgrade_stat_name_1=Aşınma hasarı
items.equipment.wands.wandofcorrosion.upgrade_stat_name_2=Gaz Seviyesi
items.equipment.wands.wandofcorrosion.bmage_desc=_Savaş Büyücüsü_ bir düşmana korozyon asasıyla vurduğunda, düşmanın korozyona uğrama şansı vardır.
items.equipment.wands.wandofcorrosion.eleblast_desc=Korozyon asasıyla yapılan bir elemental patlama, düşmanlara 6 hasardan başlayarak 4 tur korozyon verir.

items.equipment.wands.wandofcorruption.name=bozucu değnek
items.equipment.wands.wandofcorruption.staff_name=bozucu asa
items.equipment.wands.wandofcorruption.already_corrupted=Bu karakter daha fazla etkilenemez.
items.equipment.wands.wandofcorruption.desc=Eğer başındaki küçük kuru kafadan anlaşılmıyorsa bu değnek korkunç bir kara enerji yayıyor.
items.equipment.wands.wandofcorruption.stats_desc=Bu değnek düşmanları yoran ve senin isteğine göre çalıştıran bir enerji patlaması oluşturur. Düşmanlar bu bozulmaya karşı koyabilir, fakat zayıflamış düşmanları bozmak sağlıklı olanları bozmaktan çok daha kolaydır.
items.equipment.wands.wandofcorruption.upgrade_stat_name_1=Yozlaştırıcı Güç
items.equipment.wands.wandofcorruption.upgrade_stat_name_2=Zayıflama Süresi
items.equipment.wands.wandofcorruption.bmage_desc=_Savaş Büyücüsü_ bir düşmana yozlaşma asasıyla vurduğunda, düşmanın çılgın olma şansı vardır.
items.equipment.wands.wandofcorruption.eleblast_desc=Yozlaşma asasıyla yapılan bir elemental patlama, düşmanlara 5 tur çılgınlık verir.

items.equipment.wands.wandofdisintegration.name=parçalayıcı değnek
items.equipment.wands.wandofdisintegration.staff_name=parçalayıcı asa
items.equipment.wands.wandofdisintegration.desc=Bu değnek berk bir obsidiyen parçasından yapılmış, kenarlarında, ucunda biten koyu mor bir ışık çıkıyor. Yıkıcı enerji ile parlıyor, ileri fırlamak için bekliyor.
items.equipment.wands.wandofdisintegration.stats_desc=Bu değnek tüm engelleri delip geçen bir ışın yayar ve yükseltildikçe daha uzağa gider. Bu ışın _%1$d-%2$d hasar_ verir ve deldiği her düşman ve duvar için aynı zamanda fazladan hasar verir.
items.equipment.wands.wandofdisintegration.upgrade_stat_name_2=Maksimum mesafe
items.equipment.wands.wandofdisintegration.bmage_desc=Parçalayıcı Asa _Savaş Büyücüsü_ tarafından kullanılırken erişen efsunu varmış gibi menzil kazanır.
items.equipment.wands.wandofdisintegration.eleblast_desc=Parçalayıcı asayla yapılan element patlaması %100 hasar verir ve duvarlardan geçer.

items.equipment.wands.wandoffireblast.name=ateş patlaması değneği
items.equipment.wands.wandoffireblast.staff_name=ateş patlaması asası
items.equipment.wands.wandoffireblast.desc=Bu değnek kırmızı-verniklenmiş bir odundan yapılmış, şatafatlı gözükmesi için de altın yapraklar kullanılmış. Ucu çatırdayıp tıslayarak güçlü büyüsünü açığa vurmak için can atıyor.
items.equipment.wands.wandoffireblast.stats_desc=Bu değnek kullanıldığında koni şeklinde ateş püskürtür. Sonraki saldırısı _%1$d şarj_ kullanacak ve _%2$d-%3$d hasar_ verecek.  Kullandığı şarj sayısı arttıkça etkinin büyüklüğü ve gücü de artar.
items.equipment.wands.wandoffireblast.upgrade_stat_name_1=1 şarj hasarı
items.equipment.wands.wandoffireblast.upgrade_stat_name_2=2 şarj hasarı
items.equipment.wands.wandoffireblast.upgrade_stat_name_3=3 şarj hasarı
items.equipment.wands.wandoffireblast.bmage_desc=_Savaş Büyücüsü_ bir düşmana ateş patlaması asasıyla vurduğunda, asanın düşmanlara hasar veren ve yakındaki tüm ateşi tüketen bir patlama üretme şansı vardır! Bu şans, düşmanın yanında ne kadar çok ateş varsa o kadar artar.
items.equipment.wands.wandoffireblast.eleblast_desc=Ateş püskürten bir asa ile yapılan elemental patlama %100 hasar verir, kapıları patlatarak açar, düşmanları ve araziyi ateşe verir.

items.equipment.wands.wandoffrost.name=dondurma değneği
items.equipment.wands.wandoffrost.staff_name=dondurma asası
items.equipment.wands.wandoffrost.desc=Bu değnek bir çeşit büyülü buzdan yapılmış gibi görünüyor. Yuvarlak ucuna doğru daha da parlıyor. Elinde çok soğuk hissettiriyor, ama nasıl oluyorsa elin ılık kalıyor.
items.equipment.wands.wandoffrost.stats_desc=Bu değnek düşmanlarına doğru buzlu bir enerji ateşleyerek _%1$d-%2$d_ hasar verir ve onları soğutur.  Bu etki görünüşe göre suda daha güçlü. Soğutulmuş veya donmuş düşmanlar, bu değnekten daha az hasar alırlar.
items.equipment.wands.wandoffrost.upgrade_stat_name_2=soğutma süresi
items.equipment.wands.wandoffrost.bmage_desc=_Savaş büyücüsü_ üşüyen bir düşmana dondurma asasıyla saldırdığında, düşman anında donma şansına sahip olur. Bu şans, düşman ne kadar üşümüşse o kadar artar.
items.equipment.wands.wandoffrost.eleblast_desc=Dondurma asasıyla yapılan bir element patlaması %100 hasar verir, düşmanları dondurur ve ateşleri söndürür.

items.equipment.wands.wandoflightning.name=yıldırım değneği
items.equipment.wands.wandoflightning.staff_name=yıldırım asası
items.equipment.wands.wandoflightning.ondeath=Kendini kendi Yıldırım Değneğin ile öldürdün...
items.equipment.wands.wandoflightning.desc=Bu değnek sert çelikten yapılmış, bu da onu şaşırtıcı biçimde ağır yapıyor. Ucuna doğru iki diş çıkıyor ve aralarında elektrik atlıyor.
items.equipment.wands.wandoflightning.stats_desc=Bu değnek vurulan her neyse ondan seken güçlü bir yıldırım göndererek _%1$d-%2$d hasar_ verir. Bu elektrik yakındaki düşmanlardan seker, ve suda daha kolay yayılır. Yıldırım ve hasar suyun üzerinde daha etkili dağıtılır. Asadan seken yıldırımlar sana hasar verebilir, ama dostlarına zarar vermez.
items.equipment.wands.wandoflightning.bmage_desc=_Savaş Büyücüsü_, yıldırım asasıyla bir düşmana vurduğunda, kendini 10 tur boyunca elektrikle şarj etme şansına sahip olur. Şarjlı olduğu sürece Savaş Büyücüsü yıldırım hasarına karşı bağışıktır ve yıldırımı daha uzağa yayar.
items.equipment.wands.wandoflightning.eleblast_desc=yıldırım asasıyla yapılan bir element patlaması %100 hasar verir, düşmanları beş saniye sersemletir ve suyu elekriklendirir.
items.equipment.wands.wandoflightning$lightningcharge.name=Elektrik yüklü
items.equipment.wands.wandoflightning$lightningcharge.desc=Savaş Büyücüsü şu anda enerjiyle yüklüdür, bu da ona yıldırım asasına bağışıklık kazandırır ve yıldırımın yayılabileceği menzili artırır.\n\nKalan Tur Sayısı: %s.

items.equipment.wands.wandoflivingearth.name=yaşayan toprak değneği
items.equipment.wands.wandoflivingearth.staff_name=yaşayan toprak asası
items.equipment.wands.wandoflivingearth.desc=Bu değnek, parlayan sarı enerji bantları olan ilginç bir kayadan yapılmıştır. Sen değneği kavradıkça kayalar sanki elini hissediyormuş gibi hafifçe yer değiştiriyor.
items.equipment.wands.wandoflivingearth.stats_desc=Bu değnek düşmanlara büyülü kaya parçaları göndererek _%1$d-%2$d _ hasar verir. Kayalar daha sonra kullanıcının etrafında yeniden şekillenerek verilen hasarla orantılı olarak ona zırh kazandırır. Yeterince zırh inşa edilirse, değnek bir sonraki vuruşunda bir kaya koruyucusuna dönüşecektir.
items.equipment.wands.wandoflivingearth.upgrade_stat_name_2=Gardiyanın maksimum canı
items.equipment.wands.wandoflivingearth.upgrade_stat_name_3=Gardiyanın engellemesi
items.equipment.wands.wandoflivingearth.bmage_desc=_Savaş Büyücüsü_ düşmana canlı toprak asasıyla vurduğunda, verdiği hasarın bir kısmı taş zırhı olarak geri döner.
items.equipment.wands.wandoflivingearth.eleblast_desc=Yaşayan toprak asasıyla yapılan element patlaması %50 hasar verir, aktif bir taş gardiyanı patlamanın vurduğu her düşman için iyileştirir.
items.equipment.wands.wandoflivingearth$rockarmor.name=taş zırh
items.equipment.wands.wandoflivingearth$rockarmor.desc=Büyülü kayalar vücudunuzu çevreler, saldırıya uğradığınızda sizi engellemeye çalışırlar ve aldığınız hasarı 50 %% azaltırlar. Ancak engellenen her hasar kayanın bir kısmını sıyırır.\n\nKalan zırh: %1$d.\n\nEtrafınızda yeterince kaya oluşursa, yaşayan toprak değneğinizden gelen bir sonraki vuruş, kayaların sizinle savaşacak bir muhafız haline gelmesine neden olur.\n\nMuhafız için gereken zırh: %2$d
items.equipment.wands.wandoflivingearth$rockarmor.desc_many=Bu toprak muhafızı da Çoğunluğun Gücü'nden yararlanıyor. Kalan hamle sayısı: %d.
items.equipment.wands.wandoflivingearth$earthguardian.name=Taştan Koruma
items.equipment.wands.wandoflivingearth$earthguardian.desc=Yaşayan toprak değneğinizden çıkan taşlar koruyucu bir toprak muhafızına dönüştü! Bu kayalık koruyucu yakındaki düşmanlara saldıracak ve onları senin yerine koruyucuya saldırmaya zorlayacak. Yakındaki tüm tehditler ortadan kalktığında, koruyucu etrafınızda yeniden şekillenecek ve değneğinizi bir sonraki kullanışınızda geri dönecek.
items.equipment.wands.wandoflivingearth$earthguardian.wand_info=Muhafızın savunma gücü senin değneğin seviyesine bağlı. Şu anlık %1$d-%2$d hasarı engelliyor
items.equipment.wands.wandoflivingearth$earthguardian.discover_hint=Bu karakteri belirli bir değnek ile bulabilirsiniz.

items.equipment.wands.wandofmagicmissile.name=büyülü mermi değneği
items.equipment.wands.wandofmagicmissile.staff_name=büyülü mermi asası
items.equipment.wands.wandofmagicmissile.desc=Bu oldukça sade değnek, saf büyü enerisinden oluşan mermiler fırlatır. Değneğin kendisi özel bir etkiden yoksundur; ancak daha fazla kullanıma sahiptir ve yükseltildiğinde diğer değnekleri kısa süreliğine güçlendirebilir.
items.equipment.wands.wandofmagicmissile.stats_desc=Bu değnekten çıkan her darbe _%1$d-%2$d hasar verir._ ve yükseltilirse diğer değneklerden üstün olabilir.
items.equipment.wands.wandofmagicmissile.bmage_desc=_Savaş Büyücüsü_ büyülü mermi asası ile düşmana vurduğunda bu asa dahil tüm değnekleri şarj kazanır.
items.equipment.wands.wandofmagicmissile.eleblast_desc=Büyülü ok asasıyla yapılan element patlaması %50 hasar verir, büyücüye 15 tur reşarj verir.
items.equipment.wands.wandofmagicmissile.discover_hint=Kahramanlardan birisi bu eşyayla başlar.
items.equipment.wands.wandofmagicmissile$magiccharge.name=sihirli şarj
items.equipment.wands.wandofmagicmissile$magiccharge.desc=Büyülü mermi değneğinin yaydığı enerji, diğer değnekleri besleyerek bir sonraki büyülerinin gücünü artırdı.\n\nDeğneklerin güçlendirildi: +%d.\n\nKalan güçlendirilmiş büyü süresi: %s tur.

items.equipment.wands.wandofprismaticlight.name=prizmatik ışık değneği
items.equipment.wands.wandofprismaticlight.staff_name=prizmatik ışık asası
items.equipment.wands.wandofprismaticlight.desc=Bu değnek düzgün, uzun bir cam kütlesini andıran katı bir yarı saydam kristalden yapılmış. Küçük, renkli ışık huzmeleri değneğin ucunda dans ederek dışarı çıkmayı bekliyor.
items.equipment.wands.wandofprismaticlight.stats_desc=Bu değnek karanlığı delici bir ışık saçar, bu ışınlar gizlenmiş bölgeleri ve tuzakları açığa çıkarır. Bu ışın düşmanları kör edebilir ve _%1$d-%2$d_ hasar verir. Şeytani yaratıklar ve hortlaklar bu ışınlardan yanarak daha fazla hasar alırlar.
items.equipment.wands.wandofprismaticlight.upgrade_stat_name_2=Kör yapma şansı
items.equipment.wands.wandofprismaticlight.upgrade_stat_name_3=Işık süresi
items.equipment.wands.wandofprismaticlight.bmage_desc=_Savaş Büyücüsü_ bir düşmana prizmatik ışık asasıyla vurduğunda, düşman asa seviyesiyle ölçeklenen bir süre boyunca sakat kalır.
items.equipment.wands.wandofprismaticlight.eleblast_desc=Prizmatik ışık asasıyla yapılan bir element patlaması %67 hasar verir, patlamadaki tüm bölgeyi açığa çıkarır ve düşmanları beş tur kör eder.

items.equipment.wands.wandofregrowth.name=yeniden büyüme değneği
items.equipment.wands.wandofregrowth.staff_name=yeniden büyüme asası
items.equipment.wands.wandofregrowth.desc=Bu değnek ustalıkla oyulmuş ince bir ağaç gövdesinden yapılmıştır. Her nasılsa hâlâ canlı ve diri, genç bir ağacın çekirdeği gibi parlak yeşil. "Yaşam sona erdiğinde yeni yaşam her zaman büyümeye başlar... Sonsuz döngü her zaman devam eder!"
items.equipment.wands.wandofregrowth.stats_desc=Kullanıldığında bu değnek koni şeklinde bir sihirli yeniden büyüme enerjisi yaratır. Bu enerji çimen, kökler ve nadir bitkilerin hayata fışkırmasını sağlar. Sonraki kullanım _%1$d şarj_ kullanır. Değneğin kullandığı şarj arttıkça etkisi de daha büyük ve güçlü olacak.
items.equipment.wands.wandofregrowth.degradation=Başka bir _%d şarjdan sonra, bu değnek bitki ve taze ot üretmemeye başlayacak. Bu sınır, değnek seviye yükseltilerek veya geliştirilerek artırılır.
items.equipment.wands.wandofregrowth.upgrade_stat_name_1=Şarj başına ot
items.equipment.wands.wandofregrowth.upgrade_stat_name_2=Toplam ot limiti
items.equipment.wands.wandofregrowth.bmage_desc=_Savaş Büyücüsü_ yeniden büyüme asasıyla bir düşmana vurduğunda veya çimende duruyorsa vurduğu hasara göre bitkisel iyileşme alır.
items.equipment.wands.wandofregrowth.eleblast_desc=yeniden büyüme asasıyla yapılan element patlaması düşmanları yerine sabitler ve patlama bölgesinde rastgele çimen büyütür.
items.equipment.wands.wandofregrowth$dewcatcher.name=Çiytoplayıcı
items.equipment.wands.wandofregrowth$dewcatcher.desc=Çiykapanlar, kendilerini büyülü çiy ile dolduran harika bitkilerdir. Dikkat çekmemek için ot gibi kamufle olmaya çalışırlar, ancak biriken çiy şişkinlikleri onları ele verir.
items.equipment.wands.wandofregrowth$dewcatcher.discover_hint=Bu bitkiyi belirli bir değnek ile bulabilirsiniz.
items.equipment.wands.wandofregrowth$seedpod.name=Tohum Zarfı
items.equipment.wands.wandofregrowth$seedpod.desc=Tohum Kozaları, kendi tohumları yerine diğer bitki türlerinden tohum üreten büyülü bitkilerdir. Kendi tohumları olmamasına rağmen bir şekilde yayılmayı başarırlar.
items.equipment.wands.wandofregrowth$seedpod.discover_hint=Bu bitkiyi belirli bir değnek ile bulabilirsiniz.
items.equipment.wands.wandofregrowth$lotus.name=Altın Lotus
items.equipment.wands.wandofregrowth$lotus.desc=Altın nilüfer, yalnızca güçlü bir yeniden büyüme değneği tarafından yaratılabilen mistik bir bitkidir. Aurası tüm bitkileri ve bitki etkilerini geliştirir, ancak enerjisi tükenir ve kısa bir süre sonra ölür.
items.equipment.wands.wandofregrowth$lotus.wand_info=Bu yonca bir _+%1$d yeniden büyüme değneği tarafından üretildi. Eğer bir karakterin üzerine dikilmişse etkisinde olan tüm bitkiler _aniden tetiklenecek_. Bitkiler aynı zamanda _%2$d%% ihtimalle tohumlarını düşürebilir ve uçlu dartlar _%3$d%% daha az dayanıklılık_ kullanacak
items.equipment.wands.wandofregrowth$lotus.discover_hint=Bu bitkiyi belirli bir değneği birkaç kez yükselttikten sonra bulabilirsiniz.

items.equipment.wands.wandoftransfusion.name=transfüzyon değneği
items.equipment.wands.wandoftransfusion.staff_name=transfüzyon asası
items.equipment.wands.wandoftransfusion.ondeath=Kendi Transfüzyon Değneğinle kendini öldürdün...
items.equipment.wands.wandoftransfusion.charged=Asan düşmanının yaşam enerjisi ile şarj oldu!
items.equipment.wands.wandoftransfusion.desc=Gayet basit şekilli bir değnek, pembemsi rengi ve ucundaki simsiyah mücevheri ile göze çarpıyor.
items.equipment.wands.wandoftransfusion.stats_desc=Müttefikler veya büyüyle dost hâline getirilmiş düşmanlar üzerinde kullanıldığında, bu değnek, _kullanıcının %1$d sağlık puanını_ tüketerek müttefiki _%2$d sağlık puanı_ kadar iyileştirir veya ona kalkan sağlar. Düşmanlar üzerinde kullanıldığında, değnek onları kısa süreliğine büyü etkisiyle dost hâline getirir ve kullanıcıya _%3$d kalkan_ uygular. Düşman olan ölümsüz yaratıklar büyülenmek yerine _%4$d-%5$d hasar_ alır.
items.equipment.wands.wandoftransfusion.upgrade_stat_name_1=Dost iyileştirme
items.equipment.wands.wandoftransfusion.upgrade_stat_name_2=Kendini kalkanlama
items.equipment.wands.wandoftransfusion.upgrade_stat_name_3=Yozlaştırılmış hasarı
items.equipment.wands.wandoftransfusion.bmage_desc=_Savaş Büyücüsü_ büyülenmiş bir düşmana transfüzyon asasıyla vurduğunda kalkan kazanır ve asayla bir sonraki vuruşu can kaybına yol açmaz.
items.equipment.wands.wandoftransfusion.eleblast_desc=Transfüzyon asasıyla yapılan elemental patlama, düşmanları büyüler, dostları iyileştirir ve ölümsüz düşmanlara %100 hasar verir.

items.equipment.wands.wandofwarding.name=korunma değneği
items.equipment.wands.wandofwarding.staff_name=koğuş asası
items.equipment.wands.wandofwarding.no_more_wards=Değneğin daha fazla korumaya dayanamaz.
items.equipment.wands.wandofwarding.bad_location=Oraya bir koğuş yerleştiremezsiniz.
items.equipment.wands.wandofwarding.desc=Bu kısa metal değneğin ucunda parlak mor bir kristal var
items.equipment.wands.wandofwarding.stats_desc=Doğrudan bir düşmana zarar vermek yerine, bu asa sabit bekçiler ve nöbetçiler çağıracaktır. Bekçiler, görüşünüz varsa duvarların içinden bile her yere çağrılabilir. Bu değnek aynı anda _%d enerji_ değerinde bekçiyi destekleyebilir.
items.equipment.wands.wandofwarding.upgrade_stat_name_1=bariyer hasarı
items.equipment.wands.wandofwarding.upgrade_stat_name_2=Maximum enerji
items.equipment.wands.wandofwarding.bmage_desc=_Savaş Büyücüsü_ bir düşmana bir koruma asasıyla vurduğunda, tüm aktif korumalar ve nöbetçiler iyileşme şansına sahip olur.
items.equipment.wands.wandofwarding.eleblast_desc=Koruyucu asa ile yapılan bir elementsel patlama, patlama alanındaki tüm koruyucuları ve nöbetçileri iyileştirir.
items.equipment.wands.wandofwarding$ward.desc_generic_ward=Bu nöbetçi, görüş menziline giren her düşmanı otomatik olarak vurur.\n\nBu nöbetçiye nöbetçi değneğinizle vurmak onu yükseltecektir.\n\nNöbetçiler dağılmadan önce sınırlı sayıda vuruş yapabilir.
items.equipment.wands.wandofwarding$ward.desc_generic_sentry=Bu nöbetçi, bir muhafızla aynı ateş gücüne sahiptir, ancak belirli sayıda şarj yerine cana sahiptir. Korunma değneğinizin ucundaki mücevhere benzer.\n\nBu nöbetçiye koruma değneğinizle vurmak onu geliştirir ve iyileştirir.\n\nBu nöbetçi, bir düşmanı her vurduğunda bir miktar sağlık harcayacaktır, ancak üzerinde koruma değneğinizi kullanarak iyileştirilebilir.
items.equipment.wands.wandofwarding$ward.name_1=küçük koğuş
items.equipment.wands.wandofwarding$ward.desc_1=Bu temel koruma, görüş menziline giren her düşmanı otomatik olarak çarparak _%1$d-%2$d hasar verir._\n\nBu korumaya koruma değneğinizle vurmak onu yükseltecektir.\n\nBu koğuş dağılmadan önce sadece tek bir kez ışık saçar.\n\nKoruma değneğiniz bu korumayı sürdürmek için _%3$d enerji_ kullanıyor.
items.equipment.wands.wandofwarding$ward.name_2=koğuş
items.equipment.wands.wandofwarding$ward.desc_2=Bu güçlendirilmiş totem daha karmaşık bir yapıya sahiptir  ve bir kaç sefer saldırabilir. Bu totemin her saldırısı _%1$d-%2$d hasar verir._\n\nBu totemi totem değneğinizle vurmanız totemi güçlendirir.\nBu totem yok olmadan önce 3 kere saldırır.-\nDeğneğiniz bu totemi var etmek için _%3$denerji harcar._
items.equipment.wands.wandofwarding$ward.name_3=büyük koğuş
items.equipment.wands.wandofwarding$ward.desc_3=Tamamen yükseltilmiş bu koruma, öncekilerden daha fazla saldırı yapabilir. Bu koğuştan gelen her vuruş _%1$d-%2$d hasar_ verir.\n\nBu korumaya koruma değneğinizle vurmak onu geliştirecektir.\n\nBu koruma, dağılmadan önce beş kez çarpacaktır.\n\nKoruma değneğiniz bu korumayı sürdürmek için _%3$d enerji_ kullanıyor.
items.equipment.wands.wandofwarding$ward.name_4=küçük nöbetçi
items.equipment.wands.wandofwarding$ward.desc_4=Bu daha küçük nöbetçi, daha büyük bir muhafızla aynı ateş gücüne sahiptir, ancak belirli sayıda şarj yerine sağlığa sahiptir. Korunma değneğinizin ucundaki mücevheri andırır. Bu nöbetçiden gelen her vuruş _%1$d-%2$d_ hasar verir.\n\nBu nöbetçiye koruma değneğinizle vurmak onu geliştirir ve iyileştirir.\n\nBu nöbetçi, bir düşmanı her vurduğunda bir miktar sağlık harcayacaktır, ancak üzerinde koruma değneğinizi kullanarak iyileştirilebilir.\n\nKoruma değneğin bu nöbetçiyi ayakta tutmak için _%3$d enerji_ kullanıyor.
items.equipment.wands.wandofwarding$ward.name_5=nöbetçi
items.equipment.wands.wandofwarding$ward.desc_5=Bu yükseltilmiş nöbetçi, daha düşük bir nöbetçiden daha büyük ve daha dayanıklıdır. Bu nöbetçiden gelen her vuruş _%1$d-%2$d_ hasar verir.\n\nBu nöbetçiye koruma değneğinle vurmak onu geliştirir ve iyileştirir.\n\nBu nöbetçi, bir düşmanı her vurduğunda bir miktar sağlık harcayacaktır, ancak üzerinde koruma değneğini kullanarak iyileştirilebilir.\n\nKoruma değneğin bu nöbetçiyi ayakta tutmak için _%3$d enerji_ kullanıyor.
items.equipment.wands.wandofwarding$ward.name_6=büyük nöbetçi
items.equipment.wands.wandofwarding$ward.desc_6=Tamamen yükseltilmiş bu nöbetçi, öncekilerden çok daha dayanıklıdır. Bu nöbetçiden gelen her vuruş _%1$d-%2$d hasar verir._\n\nBu nöbetçiyi koruma değneğinle vurmak onu iyileştirecektir.\n\nBu nöbetçi, bir düşmanı her vurduğunda bir miktar sağlık harcar, ancak üzerinde koruma değneğini kullanarak iyileştirilebilir.\n\nKoruma değneğin bu nöbetçiyi ayakta tutmak için _%3$denerji_ kullanıyor.
items.equipment.wands.wandofwarding$ward.discover_hint=Bu karakteri belirli bir değnek ile bulabilirsiniz.
items.equipment.wands.wandofwarding$ward.dismiss_title=Bu koğuşu kapatacak mısınız?
items.equipment.wands.wandofwarding$ward.dismiss_body=Değnekle korumayı sürdürmek istemiyorsan bu korumayı kaldırabilirsin. Bunu yaptığında koruma anında yok olur.\n\nBu korumayı kaldırmak istiyor musun?
items.equipment.wands.wandofwarding$ward.dismiss_confirm=evet
items.equipment.wands.wandofwarding$ward.dismiss_cancel=hayır

###weapon curses
items.equipment.weapon.curses.annoying.name=sinir bozucu %s
items.equipment.weapon.curses.annoying.msg_1=OOO, BİRİYLE Mİ SAVAŞIYORUZ!?
items.equipment.weapon.curses.annoying.msg_2=EVET, BİTİR İŞLERİNİ!
items.equipment.weapon.curses.annoying.msg_3=HEY, DİNLE!
items.equipment.weapon.curses.annoying.msg_4=HALA PATRONA GELMEDİK Mİ!?
items.equipment.weapon.curses.annoying.msg_5=AH, BENİ O KADAR SERT SALLAMA!
items.equipment.weapon.curses.annoying.msg_6=GEBER, BÖCEK!
items.equipment.weapon.curses.annoying.msg_7=YEEEEEEEEEEEEEEE!
items.equipment.weapon.curses.annoying.msg_8=MOLA VEREBİLİR MİYİZ!?
items.equipment.weapon.curses.annoying.msg_9=BUM, HAHA!
items.equipment.weapon.curses.annoying.msg_10=GÜZEL VURUŞ!
items.equipment.weapon.curses.annoying.msg_11=Bir silah olmak istemedim, bir oduncunun baltası olmak istedim.
items.equipment.weapon.curses.annoying.msg_12=Unutma, aşırı özgüven yavaş ve sinsi bir katildir.
items.equipment.weapon.curses.annoying.msg_13=TÜM ÜSSÜNÜZ BİZE AİT!
items.equipment.weapon.curses.annoying.desc=Sinir bozucu silahlar konuşabilir, ancak biraz fazla enerjikler. Çoğu zaman istemeden de olsa tüm dikkati üzerine çekerler.
items.equipment.weapon.curses.annoying.elestrike_desc=Sinir bozucu bir lanete sahip bir element saldırısı, menzildeki her düşmanı 6 tur boyunca darmadağın etmek için %20 şansa sahiptir.

items.equipment.weapon.curses.dazzling.name=göz kamaştırıcı %s
items.equipment.weapon.curses.dazzling.desc=Göz kamaştırıcı silahlar bazen göz kamaştırıcı bir ışıkla parlayarak onu görebilen her şeyi kör eder.
items.equipment.weapon.curses.dazzling.elestrike_desc=Göz kamaştırıcı lanete sahip bir element saldırısı, menzildeki her düşmanı 6 tur boyunca kör etmek için %50 şansa sahiptir.

items.equipment.weapon.curses.displacing.name=yer değiştirici %s
items.equipment.weapon.curses.displacing.desc=Yer değiştirici silahlar kaotik ışınlama enerjisiyle işlenmiş, bu büyü düşmanları katın içinde rastgele ışınlama yeteneğine sahiptir.
items.equipment.weapon.curses.displacing.elestrike_desc=Yer değiştirme laneti içeren bir elemental vuruşun menzil içindeki her düşmanı ışınlama şansı %50'dir.

items.equipment.weapon.curses.explosive.name=patlayıcı %s
items.equipment.weapon.curses.explosive.warm=Ilık...
items.equipment.weapon.curses.explosive.hot=Sıcak!
items.equipment.weapon.curses.explosive.desc=Patlayıcı silahlar sürekli olarak güç biriktirir ve patlayarak yakındaki her şeye zarar verir.
items.equipment.weapon.curses.explosive.desc_cool=Sılahın şu anda dokunmak için serin.
items.equipment.weapon.curses.explosive.desc_warm=Silahın enerji topluyor ve ısınıyor...
items.equipment.weapon.curses.explosive.desc_hot=Silahın sıcak! Patlamak üzere!
items.equipment.weapon.curses.explosive.elestrike_desc=Patlayıcı lanetli bir elemental saldırının, menzil içindeki rastgele bir düşman üzerinde bir patlamanın belirmesine neden olma şansı %50'dir.

items.equipment.weapon.curses.friendly.name=arkadaş canlısı %s
items.equipment.weapon.curses.friendly.desc=Arkadaş canlısı silahlar barışçıl kişiler için en iyi seçimdir, bazen dövüşmeyi imkansız hale getiren bir büyünün tetiğini çekerler.
items.equipment.weapon.curses.friendly.elestrike_desc=Dost laneti içeren bir element saldırısı, menzildeki her düşmanı 6 tur boyunca büyülemek için %50 şansa sahiptir.

items.equipment.weapon.curses.polarized.name=kutuplaştırılmış %s
items.equipment.weapon.curses.polarized.desc=Kutuplaşmış bir silah, saldırısının ya %50 daha fazla hasar vermesine ya da hiç hasar vermemesine neden olan büyüden etkilenir.
items.equipment.weapon.curses.polarized.elestrike_desc=Kutuplaşmış lanete sahip bir elemental vuruşun menzildeki her düşmana 24-36 hasar verme şansı %50'dir.

items.equipment.weapon.curses.pressurized.name=Basınçlı %s
items.equipment.weapon.curses.pressurized.desc=Basınçlı silahlar sen de dahil yakındaki her şeyi iten güçlü bir su patlaması oluşturabilir.
items.equipment.weapon.curses.pressurized.elestrike_desc=Basınçlı bir lanetle güçlendirilmiş elementel vuruş, araziyi yerle bir eden ve menzildeki tüm düşmanları geri savuran bir su dalgası yaratacaktır.

items.equipment.weapon.curses.sacrificial.name=kana susamış %s
items.equipment.weapon.curses.sacrificial.desc=Kana susamış silahlar kuşanan kişiden düşmanlara saldırmanın karşılığında kan talep eder. Giyen kişi ne kadar sağlıklıysa, lanet o kadar kan alacaktır.
items.equipment.weapon.curses.sacrificial.elestrike_desc=Kurban laneti ,Kana susamış lanet, içeren bir element saldırısı, kahramanın ve menzilindeki her düşmanın 12 HP kan kaybetmesine neden olur.

items.equipment.weapon.curses.wayward.name=ıskacı %s
items.equipment.weapon.curses.wayward.desc=Asi silahlar bazen inanılmaz isabetsiz olabilir. Bu büyü başladıktan sonra bir vakit daha devam eder, fakat asi silah ile bir isabet indirmek büyüyü defeder.
items.equipment.weapon.curses.wayward.elestrike_desc=Yoldan çıkaran lanete sahip bir elemental vuruş, menzilindeki her düşmanı 6 tur boyunca büyülemek için %50 şansa sahiptir.
items.equipment.weapon.curses.wayward$waywardbuff.name=asi
items.equipment.weapon.curses.wayward$waywardbuff.desc=Asi silahının büyüsü etkinleşti ve kısa bir süre için son derece isabetsiz hale geldi. Bunun, sürpriz saldırılar gibi vurması garanti edilen saldırıları etkilemediğini unutma. Asi silahla başarılı bir şekilde saldırmak bu etkiyi anında ortadan kaldıracaktır.\n\nKalan sıra %s.

items.equipment.weapon.curses.wondrous.name=Şaşırtıcı %s
items.equipment.weapon.curses.wondrous.desc=Şaşırtıcı silahlar lanetli asalarla aynı kaotik enerjiyi içeriyor. Lanet etkinleştiğinde ne olacağını kim bilir!
items.equipment.weapon.curses.wondrous.elestrike_desc=Şaşırtıcı bir lanet içeren elementel bir vuruş, menzildeki her düşmana farklı bir lanetli asa etkisi uygulama şansına sahiptir.

###enchantments
items.equipment.weapon.enchantments.blazing.name=yakıcı %s
items.equipment.weapon.enchantments.blazing.desc=Bu büyü, silahtan alevler püskürterek düşmanları tutuşturur ve zaten yanmakta olan düşmanlara ilave hasar verir.
items.equipment.weapon.enchantments.blazing.elestrike_desc=Alevli büyüye sahip bir element saldırısı, menzildeki her kareye ateş yayar ve bu 8 tur sürer.

items.equipment.weapon.enchantments.blocking.name=Engelleyici %s
items.equipment.weapon.enchantments.blocking.desc=Engelleyici silahlar, onlara saldırdıktan sonra seni kısa süreliğine koruma şansına sahiptir.
items.equipment.weapon.enchantments.blocking.elestrike_desc=Engelleme büyüsüne sahip bir element saldırısı, Düellocuya menzilindeki her düşman için fazladan 6 kalkan kazandırır.
items.equipment.weapon.enchantments.blocking$blockbuff.name=engelleniyor
items.equipment.weapon.enchantments.blocking$blockbuff.desc=Silahının engelleyici büyüsü, savunma gücüne kısa süreli bir destek sağladı!\n\nKalan kalkan: %d\n\nKalan sıra: %s.

items.equipment.weapon.enchantments.blooming.name=Bittiren %s
items.equipment.weapon.enchantments.blooming.desc=Çiçek açtıran silahlar, vurdukları kişilerin üzerinde veya çevresinde bitki örtüsünün filizlenmesine neden olacak büyü içerir.
items.equipment.weapon.enchantments.blooming.elestrike_desc=Çiçek açma büyüsüne sahip bir element saldırısı, menzildeki 8 kareye kadar çimen yayar ve menzildeki tüm düşmanları 6 tur boyunca köklendirir.

items.equipment.weapon.enchantments.chilling.name=üşütücü %s
items.equipment.weapon.enchantments.chilling.desc=Bu efsunla vurulan düşmanlar üşür, bu da hareket ve saldırılarını yavaşlatır.
items.equipment.weapon.enchantments.chilling.elestrike_desc=Tüyler ürpertici bir büyüye sahip bir element saldırısı, menzil içindeki her kareye 8 tur süren tüyler ürpertici bir hava yayar.

items.equipment.weapon.enchantments.crystal.name=Kristal %s
items.equipment.weapon.enchantments.crystal.alert_fixed=Kristal silahın tamamıyla onarıldı!
items.equipment.weapon.enchantments.crystal.alert_fixed_ghost=Hayaletin kristal silahı tamamıyla onarıldı!
items.equipment.weapon.enchantments.crystal.alert_noflaw=Kristal silahın artık hasarlı değil.
items.equipment.weapon.enchantments.crystal.alert_noflaw_ghost=Hayaletin kristal sılahı artık hasarlı değil.
items.equipment.weapon.enchantments.crystal.alert_nocrack=Kristal silahın artık çatlak değil.
items.equipment.weapon.enchantments.crystal.alert_nocrack_ghost=Hayaletin kristal silahı artık çatlak değil.
items.equipment.weapon.enchantments.crystal.alert_flawed=Kristal silahınız hafif hasar gördü.
items.equipment.weapon.enchantments.crystal.alert_flawed_ghost=Hayaletin kristal silahı hafifçe hasar gördü.
items.equipment.weapon.enchantments.crystal.alert_cracked=Kristal silahınız çatlıyor, kırılmak üzere!
items.equipment.weapon.enchantments.crystal.alert_cracked_ghost=Hayaletin kristal silahı çatlıyor, kırılmak üzere!
items.equipment.weapon.enchantments.crystal.alert_shattered=Kristal silahınız paramparça oldu!
items.equipment.weapon.enchantments.crystal.alert_shattered_ghost=Hayaletin kristal silahı paramparça oldu!
items.equipment.weapon.enchantments.crystal.desc=Bu güçlü ekstra büyü hasarı verir ve silahın değerini artırır ancak kristaller onarılmazsa veya kendi kendini onarması için zaman tanınmazsa büyülü silah parçalanabilir
items.equipment.weapon.enchantments.crystal.desc_thrown=Kristal fırlatma silahlarının dayanıklılığı çok daha düşüktür, ancak zamanla yavaş yavaş dayanıklığını tekrar kazanırlar.
items.equipment.weapon.enchantments.crystal.desc_perfect=Bu kristal silah şu anda kusursuz durumda.
items.equipment.weapon.enchantments.crystal.desc_fine=Bu kristal silah şu anda iyi durumda.
items.equipment.weapon.enchantments.crystal.desc_flawed=Bu kristal silahın bir kusuru var, ama kırılmak üzere değil.
items.equipment.weapon.enchantments.crystal.desc_cracked=Bu kristal silah çatlıyor, tamamen kırılma riskiyle karşı karşıya!
items.equipment.weapon.enchantments.crystal.elestrike_desc=Kristal büyüsüyle yapılan bir element saldırısı, birincil hedef hariç menzil içindeki her düşmana 10-20 hasar verir ve silahı onarır.

items.equipment.weapon.enchantments.kinetic.name=Kinetik %s
items.equipment.weapon.enchantments.kinetic.desc=Bir düşman kinetik bir silahla öldürüldüğünde, fazla kuvvet silahta depolanır ve bir sonraki başarılı saldırıya uygulanır.
items.equipment.weapon.enchantments.kinetic.elestrike_desc=Kinetik büyüye sahip bir element saldırısı, birincil hedef hariç menzildeki her düşmana depolanmış hasarın %40'ını uygular.
items.equipment.weapon.enchantments.kinetic$conserveddamage.name=korunan hasar
items.equipment.weapon.enchantments.kinetic$conserveddamage.desc=Silahın önceki öldürücü vuruştaki fazladan gücü depoladı ve bir sonraki vuruşta fazladan hasar olarak verecek. Ama bu enerji zamanla kaybolacak.\n\nDepolanan Hasar: %d.

items.equipment.weapon.enchantments.corrupting.name=Yozlaştırıcı %s
items.equipment.weapon.enchantments.corrupting.desc=Bu güçlü büyü, düşmanları isteğinize göre dönüştürme yeteneğine sahiptir. Bir düşman bu silahla öldürüldüğünde, ölmek yerine yozlaşma ihtimali vardır.
items.equipment.weapon.enchantments.corrupting.elestrike_desc=Bozucu büyüye sahip bir element saldırısının, birincil hedef hariç menzildeki her düşmanı bozma şansı %5-25'tir (eksik HP'ye bağlı olarak).

items.equipment.weapon.enchantments.eldritch.name=korkunç %s
items.equipment.weapon.enchantments.eldritch.desc=Korkunç silahlar, vuruşlarına tanık olan yakındaki düşmanlara korku salarak, saldırgandan kaçmalarına neden olur.
items.equipment.weapon.enchantments.eldritch.elestrike_desc=Büyülü bir element saldırısı, birincil hedef de dahil olmak üzere menzil içindeki tüm düşmanlara uzun süreli korku etkisi uygular.

items.equipment.weapon.enchantments.elastic.name=elastik %s
items.equipment.weapon.enchantments.elastic.desc=Elastik silahlar düşmanı kısa bir mesafede geriye doğru uçurabilirler.
items.equipment.weapon.enchantments.elastic.elestrike_desc=Elastik büyülü bir element saldırısı, menzildeki tüm düşmanları 5 karo geriye savurur.

items.equipment.weapon.enchantments.grim.name=ölümcül %s
items.equipment.weapon.enchantments.grim.desc=Bu güçlü efsun o kadar güçlüdür ki, bir düşmanı anında öldürme gücüne sahiptir! Düşman ne kadar zayıfsa bu etki o kadar sık gerçekleşir.
items.equipment.weapon.enchantments.grim.elestrike_desc=Acımasız büyüye sahip bir element saldırısının, birincil hedef hariç menzildeki her düşmanı öldürme şansı %6-30'dur (eksik HP'ye bağlı olarak).

items.equipment.weapon.enchantments.lucky.name=şanslı %s
items.equipment.weapon.enchantments.lucky.desc=Şanslı bir silahla öldürülen düşmanların daha fazla ganimet düşürme şansı vardır.
items.equipment.weapon.enchantments.lucky.elestrike_desc=Şans büyüsüne sahip bir element saldırısı, menzildeki her düşmanın altına %12,5 oranında ganimet bırakma şansına sahiptir. Bu etki düşman başına yalnızca bir kez tetiklenebilir.

items.equipment.weapon.enchantments.projecting.name=erişen %s
items.equipment.weapon.enchantments.projecting.desc=Bu efsunla yakın dövüş silahları ekstra menzil kazanacak. Menzilli silahlar yakındaki hedeflere doğrultulduğunda duvarları delip geçecek.
items.equipment.weapon.enchantments.projecting.elestrike_desc=Yansıtma büyüsüne sahip bir element saldırısı, birincil hedef hariç menzildeki her düşmana %30 hasar verir.

items.equipment.weapon.enchantments.shocking.name=şok edici %s
items.equipment.weapon.enchantments.shocking.desc=Elektrik şok edici silahtan sıçrayarak yakındaki tüm düşmanlara ekstra hasar verir.
items.equipment.weapon.enchantments.shocking.elestrike_desc=Şok edici büyüye sahip elementsel bir saldırı menzilindeki tüm alanlara elektrik yayıyor, 8 tur sürer.

items.equipment.weapon.enchantments.unstable.name=dengesiz %s
items.equipment.weapon.enchantments.unstable.desc=Bu efsun kaotik enerji yayarak her vuruşta farklı bir efsun olarak görev yapar.
items.equipment.weapon.enchantments.unstable.elestrike_desc=Dengesiz bir büyüye sahip bir temel saldırı, birincil hedef dışında menzil içindeki her düşmana rastgele bir büyü etkisi uygular.

items.equipment.weapon.enchantments.vampiric.name=vampirik %s
items.equipment.weapon.enchantments.vampiric.desc=Bu güçlü efsun her vuruşla rakibin canını sömürür ve kuşanana aktarır. Bu etki kuşananın canı azaldıkça güçlenir.
items.equipment.weapon.enchantments.vampiric.elestrike_desc=Vampir büyüsüne sahip elementsel bir vuruş Düellocu'yu menzilindeki her düşman için 2.5 can iyileştirir.

items.equipment.weapon.enchantments.venomous.name=zehirli %s
items.equipment.weapon.enchantments.venomous.desc=Zehirli silahlar, gecikmeli ancak ölümcül bir zehir etkisi yapar ve bu zehir her uygulandığında daha da şiddetlenir.
items.equipment.weapon.enchantments.venomous.elestrike_desc=Zehirli bir büyüyle yapılan element saldırısı, birincil hedef hariç menzil içindeki tüm düşmanlara gecikmeli ek zehir etkisi uygular.

items.equipment.weapon.enchantments.vorpal.name=keskin %s
items.equipment.weapon.enchantments.vorpal.desc=Keskin silahlar özellikle ölümcüldür; o kadar isabetli vuruş yapma olasılıkları vardır ki, kanamaya meyilli düşmanlara hasar yerine kanama etkisi verirler.
items.equipment.weapon.enchantments.vorpal.elestrike_desc=Keskin büyüsüyle güçlendirilmiş bir element saldırısı, birincil hedef hariç menzil içindeki tüm düşmanlara ek kanama etkisi uygular.


###melee weapons
items.equipment.weapon.melee.assassinsblade.name=suikastçının bıçağı
items.equipment.weapon.melee.assassinsblade.stats_desc=Bu silah farkında olmayan düşmanlara karşı daha güçlü.
items.equipment.weapon.melee.assassinsblade.ability_name=sinsilik
items.equipment.weapon.melee.assassinsblade.typical_ability_desc=Düellocu bir suikastçı kılıcı kullanırken _gizlice yaklaşabilir_. Bu yetenek, Düellocunun 3 karo uzaklığa kadar anında gözden kaybolmasını sağlar ve genellikle ona _%d tur görünmezlik verir._
items.equipment.weapon.melee.assassinsblade.ability_desc=Düellocu bir suikastçı kılıcı kullanırken _sessizce sokulabilir_ . Bu yetenek, Düellocunun 3 karo uzaklığa kadar uzaklaşmasını sağlar ve _%d tur görünmezlik_ kazandırır.
items.equipment.weapon.melee.assassinsblade.upgrade_ability_stat_name=Yetenek süresi
items.equipment.weapon.melee.assassinsblade.desc=Küçük, dalgalı obsidyenden yapılma bir bıçak, hafif olmasına rağmen kullanması zor, ancak hedefi tutturursa ölümcül.

items.equipment.weapon.melee.battleaxe.name=savaş baltası
items.equipment.weapon.melee.battleaxe.stats_desc=Bu silah gayet isabetli.
items.equipment.weapon.melee.battleaxe.ability_name=Ağır Darbe
items.equipment.weapon.melee.battleaxe.typical_ability_desc=Düellocu savaş baltasıyla _ağır bir darbe_ indirebilir. Bu yoğun saldırı, düşmanı şaşırttıysa tipik olarak _%1$d-%2$d hasar verir ve onları 5 tur boyunca sersemleterek isabet oranını ve kaçınma kabiliyetini 50%% azaltır. Ağır darbe her zaman isabet eder ancak düşmanı şaşırtmazsa normal hasar verir.
items.equipment.weapon.melee.battleaxe.ability_desc=Düellocu savaş baltasıyla _ağır bir darbe_ indirebilir. Bu yoğunlaştırılmış saldırı, düşmanı şaşırttıysa _%1$d-%2$d hasar_ verir ve 5 tur boyunca sersemleterek isabet oranını ve kaçma kabiliyetini 50%% azaltır. Ağır darbe her zaman isabet eder ancak düşmanı şaşırtmazsa normal hasar verir.
items.equipment.weapon.melee.battleaxe.desc=Bu savaş baltasının devasa çelik başı her geniş savurmaya ağırlığını veriyor.

items.equipment.weapon.melee.crossbow.name=arbalet
items.equipment.weapon.melee.crossbow.typical_stats_desc=Genellikle bu silah, donatıldığında fırlatılan dartların _%1$d-%2$d hasar_ vermesini sağlar ve hatta onlara büyüsünü de aktarır.
items.equipment.weapon.melee.crossbow.stats_desc=Bu silah, donatıldığında fırlatılan dartların verdiği _%1$d-%2$d hasar_ vermesini sağlar ve hatta onlara büyüsünü de aktarır.
items.equipment.weapon.melee.crossbow.ability_name=ücretli atış
items.equipment.weapon.melee.crossbow.typical_ability_desc=Düellocu arbaletini _kurar_ ve sonraki normal saldırısının her zaman isabet etmesini ve üç etkiden birinin gerçekleşmesini sağlar: Yakın saldırılar düşmanları iter, Uçsuz dartlar _+%1$d hasar_ verir ve uçlu dartlar etkilerini 7x7 büyüklüğünde bir alana gösterirler ve _%2$d kadar fazla kullanılabilirler_.
items.equipment.weapon.melee.crossbow.ability_desc=Düellocu arbaletini _kurar_ ve sonraki normal saldırısının her zaman isabet etmesini ve üç etkiden birinin gerçekleşmesini sağlar: Yakın saldırılar düşmanları iter, Uçsuz dartlar _+%1$d hasar_ verir ve uçlu dartlar etkilerini 7x7 büyüklüğünde bir alana gösterirler ve _%2$d kadar fazla kullanılabilirler_.
items.equipment.weapon.melee.crossbow.desc=Pek karmaşık olmayan ve okları mükemmel hızlarda atan bir silah. Bunun için dizayn edilmemiş olsa da arbaletin ağır ve sağlam yapısı onun idare eder bir yakın dövüş silahı olarak ta kullanabilmesini sağlar.
items.equipment.weapon.melee.crossbow.upgrade_ability_stat_name=Yetenek bonusu
items.equipment.weapon.melee.crossbow$chargedshot.name=Kurulmuş.
items.equipment.weapon.melee.crossbow$chargedshot.desc=Düellocu arbaletine gücünü odaklıyor. Sonraki saldırısı her zaman isabet eder ve üç etkiden birini uygular.\n-Yakın saldırılar düşmanları birkaç kare uzaklaştırır.\n-Uçsuz dartlar bonus hasar verir.\n-Uçlu dartlar fazladan kullanıma sahip olurlar ve etkilerini 7x7 alanda uygularlar. Pozitif dart etkileri yalnızca müttefiklere etki eder, Zararlı etkiler yalnızca düşmanlara etki eder. Bu yetenekle atılan pozitif dart etkileri düellocunun kendisini etkilemez

items.equipment.weapon.melee.cudgel.name=çomak
items.equipment.weapon.melee.cudgel.stats_desc=Bu silah gayet isabetli.
items.equipment.weapon.melee.cudgel.ability_name=ağır darbe
items.equipment.weapon.melee.cudgel.typical_ability_desc=Düellocu, bir çomak ile _ağır darbe_ gerçekleştirebilir. Bu yoğunlaşmış saldırı, eğer düşmanı şaşırttıysa genellikle _%1$d-%2$d hasar_ verir ve onları 5 tur boyunca sersemletir; bu da isabet ve kaçınmayı 50%% azaltır. Ağır darbe her zaman isabet eder, ancak düşmanı şaşırtmazsa normal hasar verir.
items.equipment.weapon.melee.cudgel.ability_desc=Düellocu, bir sopa ile güçlü darbe yapabilir. Bu odaklanmış saldırı, düşmanı şaşırttıysa _%1$d-%2$d hasar_ verir ve düşmanı 5 tur boyunca sersemletir; bu da isabet ve kaçınma şansını %%50 azaltır. Güçlü darbe her zaman isabet eder, ancak düşman şaşırmadıysa normal hasar verir.
items.equipment.weapon.melee.cudgel.desc=Küçük bir pirinç topuz, macera silahlarından çok soylular için bir savunma aracı olarak yapılmış.
items.equipment.weapon.melee.cudgel.discover_hint=Kahramanlardan birisi bu eşyayla başlar.

items.equipment.weapon.melee.dagger.name=hançer
items.equipment.weapon.melee.dagger.stats_desc=Bu silah farkında olmayan düşmanlara karşı daha güçlü.
items.equipment.weapon.melee.dagger.ability_name=gizlice sokul
items.equipment.weapon.melee.dagger.typical_ability_desc=Düellocu bir hançer kullanırken _sessizce sokulabilir_ . Bu yetenek, Düellocunun 5 karo uzaklığa kadar anında uzaklaşmasını sağlar ve tipik olarak _%d tur görünmezlik_ kazandırır.
items.equipment.weapon.melee.dagger.ability_desc=Düellocu bir hançer kullanırken _sessizce sokulabilir_ . Bu yetenek, Düellocunun 5 karo uzaklığa kadar anında uzaklaşmasını sağlar ve _%d tur görünmezlik_ kazandırır.
items.equipment.weapon.melee.dagger.upgrade_ability_stat_name=Yetenek süresi
items.equipment.weapon.melee.dagger.desc=Eskimiş bir ahşap kabzaya sahip basit, demirden bir hançer.
items.equipment.weapon.melee.dagger.discover_hint=Kahramanlardan birisi bu eşyayla başlar.

items.equipment.weapon.melee.dirk.name=kama
items.equipment.weapon.melee.dirk.stats_desc=Bu silah farkında olmayan düşmanlara karşı daha güçlü.
items.equipment.weapon.melee.dirk.ability_name=sinsilik
items.equipment.weapon.melee.dirk.typical_ability_desc=Düellocu bir hançer kullanırken _sessizce sokulabilir_ . Bu yetenek, Düellocunun 4 karo uzaklığa kadar anında uzaklaşmasını sağlar ve tipik olarak _%d tur görünmezlik_ kazandırır.
