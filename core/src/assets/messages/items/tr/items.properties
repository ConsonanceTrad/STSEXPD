items.equipment.rings.ringofaccuracy.upgrade_stat_name_1=Hedefleme bonusu
items.equipment.rings.ringofaccuracy.desc=Bu yüzük odağınızı artırarak saldırılarınızın hedefini bulmasını kolaylaştırır.Lanetli bir yüzük ise saldırılarınızın hedefi bulmasını zorlaştıracak

items.equipment.rings.ringofarcana.name=sırlar yüzüğü
items.equipment.rings.ringofarcana.stats=Takıldığında bu yüzük efsun ve rünlerin gücünü _%s%%_ arttırır.
items.equipment.rings.ringofarcana.typical_stats=Takıldığında bu yüzük genellikle efsun ve rünlerin gücünü _%s%%_ arttırır.
