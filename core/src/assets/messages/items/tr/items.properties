items.consum.potions.potion.bistre=kahverengi iksir
items.consum.potions.potion.indigo=çivit iksir
items.consum.potions.potion.silver=gümüş iksir
items.consum.potions.potion.unknown_desc=Bu şişe girdap halinde dönen renkli bir sıvı içeriyor. İçildiğinde veya fırlatıldığında ne yapacağını kim bilebilir?
items.consum.potions.potion.harmful=Zararlı iksir!
items.consum.potions.potion.beneficial=Yararlı iksir
items.consum.potions.potion.yes=Evet, ne yaptığımı biliyorum
items.consum.potions.potion.no=Hayır, fikrimi değiştirdim
items.consum.potions.potion.sure_drink=İçmek istediğine emin misin? Genellikle bu türden iksirleri düşmanların üstüne atmalısın.
items.consum.potions.potion.sure_throw=Fırlatmak istediğine emin misin? Genellikle bu gibi iksirleri içmek daha mantıklıdır.
items.consum.potions.potion.shatter=Cam kırılıyor ve içindeki sıvı zararsızca etrafa sıçrıyor.
items.consum.potions.potion.discover_hint=Bu etkiye sahip bir eşyayı zindanda rastgele bulabilirsin ya da simya ile üretebilirsin.
items.consum.potions.potion$placeholder.name=iksir
items.consum.potions.potion$seedtopotion.name=Rastgele İksir

items.consum.potions.potionofexperience.name=deneyim iksiri
items.consum.potions.potionofexperience.desc=Çok sayıda tarihi savaşın deneyimlerinin sıvı bir hale indirgenerek saklandığı bu sıvıyı içmek tecrübe seviyeni anında arttıracaktır.

items.consum.potions.potionoffrost.name=dondurma iksiri
items.consum.potions.potionoffrost.desc=Bu iksirin içindeki kimyasal, hava ile temas ettiğinde dondurucu bir bulut oluşturacaktır.

items.consum.potions.potionofhaste.name=acele iksiri
items.consum.potions.potionofhaste.energetic=Enerjik hissediyorsun!
items.consum.potions.potionofhaste.desc=Bu ilginç biçimde tatlı sıvıyı içmek sana kısa süreyle muazzam bir enerji kazandırarak yüksek hızlarda koşmanı sağlayacaktır.

items.consum.potions.potionofhealing.name=iyileştirme iksiri
items.consum.potions.potionofhealing.heal=Yaraların kapanmaya başlıyor.
items.consum.potions.potionofhealing.desc=Bu iksir canını hızla yenileyecek ve birçok rahatsızlığı iyileştirecektir.

items.consum.potions.potionofinvisibility.name=görünmezlik iksiri
items.consum.potions.potionofinvisibility.invisible=Ellerinin görünmez olduğunu görüyorsun!
items.consum.potions.potionofinvisibility.desc=Bu iksiri içtiğinizde geçici olarak görünmez olursunuz. Görünmezken düşmanlar sizi göremez. Fiziksel saldırılar ve büyülü etkiler (parşömenler ve değnekler gibi) görünmezliği derhal iptal eder.

items.consum.potions.potionoflevitation.name=uçma iksiri
items.consum.potions.potionoflevitation.float=Havada süzülüyorsun!
items.consum.potions.potionoflevitation.desc=Bu ilginç sıvıyı içmek havada süzülmene neden olarak tuzak ve çukurlar üzerinden zahmetsizce uçmanı sağlar. Bu iksiri fırlatmak rafine edilmemiş bir gaz bulutu oluşturarak içinde kalan her şeyin kafasını karıştırır.

items.consum.potions.potionofliquidflame.name=sıvı ateş iksiri
items.consum.potions.potionofliquidflame.desc=Bu cam şişe içinde hava ile temas halinde şiddetli bir biçimde ateş alan dengesiz bir bileşik bulunuyor.

items.consum.potions.potionofmindvision.name=akıl görüşü iksiri
items.consum.potions.potionofmindvision.see_mobs=Bir şekilde diğer yaratıkların zihinlerinin varlığını hissediyorsun!
items.consum.potions.potionofmindvision.see_none=Bir şekilde bu seviyede şu anda yalnız olduğunu hissediyorsun.
items.consum.potions.potionofmindvision.desc=Bunu içtikten sonra zihnin yakınlardaki yaratıkların fiziksel imzası ile bağdaşacak, bu da biyolojik varlıkları duvarların ardından görebilmeni sağlayacak. Ayrıca bu iksir, yakındaki kapı ve duvarları da görmeni sağlar.

items.consum.potions.potionofparalyticgas.name=felç edici gaz iksiri
items.consum.potions.potionofparalyticgas.desc=Açık hava ile temas ettiğinde bu şişenin içindeki sıvı felç edici sarı bir duman oluşturur. Bu dumanı soluyan herkes anında felç olarak duman dağıldıktan sonra bir zamana kadar hareket edemez hale gelir. Bu eşyayı uzaktaki düşmanlara fırlatarak onları gazın etkisi içinde yakalamak mümkündür.

items.consum.potions.potionofpurity.name=temizlik iksiri
items.consum.potions.potionofpurity.freshness=Havada sıradışı bir tazelik hissediyorsun.
items.consum.potions.potionofpurity.protected=Koruyucu bir tabaka seni örtüyor!
items.consum.potions.potionofpurity.desc=Bu büyülü sıvı, geniş bir alandaki tüm zararlı alana bağlı etkileri hızla etkisiz hale getirecektir. Bunu içmek size bu tür etkilere karşı geçici bağışıklık kazandıracaktır.

items.consum.potions.potionofstrength.name=güç iksiri
items.consum.potions.potionofstrength.msg=Yeni keşfedilen güç vücudunuzda dalgalanıyor, artık gücün %d!
items.consum.potions.potionofstrength.desc=Bu güçlü sıvı kasların boyunca ilerleyip kalıcı olarak gücünü bir puan arttıracaktır.

items.consum.potions.potionoftoxicgas.name=zehirli gaz iksiri
items.consum.potions.potionoftoxicgas.desc=Bu basınçlı şişeyi açmak ya da parçalamak içindekilerin ölümcül bir zehirli gaz bulutu oluşturmasına neden olur. Bu iksiri elle açmaktansa uzaktaki düşmanlarına fırlatmayı tercih edebilirsin.



###brews
items.consum.potions.brews.brew.discover_hint=Bu eşyayı simya ile üretebilirsin.

items.consum.potions.brews.aquabrew.name=su karışımı
items.consum.potions.brews.aquabrew.desc=Bu iksir kırıldığında, o yerden basınçlı su püskürtecektir. Gücü sadece ateşli düşmanlara zarar verecek kadardır ama yakındaki zemini de suya çevirecek, buralardaki tuzakları zararsız hale getirecek, ateşi söndürecek ve yanındaki düşmanı iteleyecektir.

items.consum.potions.brews.blizzardbrew.name=kar fırtınası iksiri
items.consum.potions.brews.blizzardbrew.desc=Bu karışım kırıldığında gaz gibi hızlıca yayılan hortum gibi bir tipi açığa çıkarır

items.consum.potions.brews.causticbrew.name=aşındırıcı karışım
items.consum.potions.brews.causticbrew.desc=Bu karışım, aşındırıcı çamuru fırlatıldığı bölgenin etrafındaki geniş bir alana yayacaktır. Bu çamura yakalanan herhangi bir şey, suyla yıkanmaması durumunda yavaşça eriyecektir.

items.consum.potions.brews.infernalbrew.name=cehennem karışımı
items.consum.potions.brews.infernalbrew.desc=Parçalandığında, bu karışım gaz gibi hızla yayılan azgın bir cehennemi serbest bırakacaktır.

items.consum.potions.brews.shockingbrew.name=şok edici karışım
items.consum.potions.brews.shockingbrew.desc=Parçalandığında, bu karışım kırıldığı yerin çevresinde geniş bir alanda bir elektrik fırtınası salacak.

items.consum.potions.brews.unstablebrew.name=dengesiz karışım
items.consum.potions.brews.unstablebrew.desc=Bu büyülü karışım gökkuşağının değişen renkleriyle parlıyor.\n\nİçildiğinde veya fırlatıldığında rastgele bir iksirin etkisini tetikler. İksir etkisi içildiğinde her zaman faydalı, fırlatıldığında ise her zaman zararlı olacaktır.

###elixirs
items.consum.potions.elixirs.elixir.discover_hint=Bu eşyayı simya ile üretebilirsin.

items.consum.potions.elixirs.elixirofarcanearmor.name=sihirli zırh iksiri
items.consum.potions.elixirs.elixirofarcanearmor.desc=Bu iksir onu içen kişiye uzun süreli bir büyü direnci verecektir.

items.consum.potions.elixirs.elixirofaquaticrejuvenation.name=suda iyileşme iksiri
items.consum.potions.elixirs.elixirofaquaticrejuvenation.desc=Bu iksir sağlık iksiri ve Goo'nun kalıntılarından oluşuyor. Bu iksir direk can kazanmanızı sağlamazken sudayken sürekli ve normalden daha fazla can verir
items.consum.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=suda iyileşme
items.consum.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Geçici bir süre için Goo'nunkine benzer yenileyici özellikler kazandın\nSudayken her sırada ufak bir miktar can yenilersin. Bu etki ya canının tamamı dolu ise ya da sudan çıktığında sona erer\nKalan iyileştirme%d

items.consum.potions.elixirs.elixirofdragonsblood.name=ejderha kanı özütü
items.consum.potions.elixirs.elixirofdragonsblood.desc=Bu özüt tüketildiği zaman içen kişinin damarlarına ateşli bir güç akışı gönderir. Bu etki içen kişiyi ateşe bağışıklı yapar ve düşmanlarını, onlara fiziksel saldırılar yaparak yakma olanağı sağlar.

items.consum.potions.elixirs.elixiroffeatherfall.name=tüy düşüşü iksiri
items.consum.potions.elixirs.elixiroffeatherfall.light=Bir tüy gibi hafif hissediyorsun!
items.consum.potions.elixirs.elixiroffeatherfall.desc=Bu iksir daha güçsüz ama daha kontrollü. Bunu içen kişi bir süreliğine hasar almadan uzun mesafelerden düşebilir.
items.consum.potions.elixirs.elixiroffeatherfall$featherbuff.name=tüy düşüşü
items.consum.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Yavaş düşüş iksirinin etkisi altındasın, uçurumlardan hasar almadan düşebilirsin!\n\nKalan tur: %s.

items.consum.potions.elixirs.elixirofhoneyedhealing.name=ballı iyileşme özütü
items.consum.potions.elixirs.elixirofhoneyedhealing.desc=Bu iksir şifa ile balın tatlılığını birleştirir. İçildiğinde, bir şifa iksiriyle aynı etkiyi gösterir ve az miktarda açlığı giderir, ancak aynı zamanda bir müttefiki iyileştirmek için de atılabilir.\n\nBala yakınlığı olan yaratıklar, bu eşya üzerlerinde kullanıldığında sakinleşebilir.

items.consum.potions.elixirs.elixiroficytouch.name=buz dokunuşu özütü
items.consum.potions.elixirs.elixiroficytouch.desc=Kullanıldığında, bu özüt içen kişinin saldırdığı düşmanlardan ısı çekmesini sağlar. Bu etki, içen kişiye soğuğa karşı bağışıklılık kazandırır, ve içen kişinin fiziksel saldırılarla saldırdığı düşmanları üşütür.

items.consum.potions.elixirs.elixirofmight.name=güç özütü
items.consum.potions.elixirs.elixirofmight.msg=Yeni keşfedilen güç vücudunuzda dalgalanıyor, artık gücün %d!
items.consum.potions.elixirs.elixirofmight.desc=Bu güçlü sıvı kaslarınızdan geçerek gücünüzü kalıcı olarak bir puan artırır ve en yüksek canınızı geçici olarak %d puan artırır. Sağlık artışı en yüksek sağlığınızla ölçeklenir, ancak seviye kazandıkça yavaş yavaş azalır.
items.consum.potions.elixirs.elixirofmight$htboost.name=maks. sağlık artışı
items.consum.potions.elixirs.elixirofmight$htboost.desc=Vücudunuz doğal olmayan bir şekilde güçlü ve sağlıklı hissediyor.\n\nEn yüksek sağlığınız uzun bir süre boyunca artar. Seviye kazandıkça, destek giderek azalır.\n\nŞu anki artış miktarı: %d.\nKalan seviye: %d.

items.consum.potions.elixirs.elixiroftoxicessence.name=zehir özü iksiri
items.consum.potions.elixirs.elixiroftoxicessence.desc=Bu iksir tüketildiğinde, içen kişiye zehirli enerji kazandırır. İçen kişi hareket ettikçe sürekli olarak zehirli gaz yayacak ve etki süresinden biraz daha uzun bir süre boyunca zehirli gaz ve zehre karşı bağışıklık kazanacaktır.



###exotic potions
items.consum.potions.exotic.exoticpotion.turquoise=egzotik turkuaz rengi iksir
items.consum.potions.exotic.exoticpotion.crimson=egzotik kızıl iksir
items.consum.potions.exotic.exoticpotion.azure=egzotik gök mavisi rengi iksir
items.consum.potions.exotic.exoticpotion.jade=egzotik yeşim iksir
items.consum.potions.exotic.exoticpotion.golden=egzotik altın rengi iksir
items.consum.potions.exotic.exoticpotion.magenta=egzotik eflatun rengi iksir
items.consum.potions.exotic.exoticpotion.charcoal=egzotik kömür rengi iksir
items.consum.potions.exotic.exoticpotion.ivory=egzotik fildişi iksiri
items.consum.potions.exotic.exoticpotion.amber=egzotik kehribar iksir
items.consum.potions.exotic.exoticpotion.bistre=egzotik barut rengi iksir
items.consum.potions.exotic.exoticpotion.indigo=egzotik çivit rengi iksir
items.consum.potions.exotic.exoticpotion.silver=egzotik gümüş rengi iksir
items.consum.potions.exotic.exoticpotion.unknown_desc=Bu yuvarlak camın içerisinde tanecikli ve renkli bir sıvı var. Buralara yabancı gibi duruyor, içildiğinde veya fırlatıldığında ne olacağını kim bilir?
items.consum.potions.exotic.exoticpotion.warning=Bu iksiri kullanmaktan vazgeçmek istediğine emin misin? Yine de tükenecek.
items.consum.potions.exotic.exoticpotion.yes=Evet, eminim
items.consum.potions.exotic.exoticpotion.no=Hayır, fikrimi değiştirdim
items.consum.potions.exotic.exoticpotion.discover_hint=Bu eşyayı simya ile üretebilirsin.

items.consum.potions.exotic.potionofcleansing.name=lanet kaldırma iksiri
items.consum.potions.exotic.potionofcleansing.desc=Bu güçlü reaktif iksir içeni tüm zararlı durum etkilerine karşı birkaç tur koruyacaktır. Ayrıca, bir hedefe arındırma maksadıyla atılabilir.
items.consum.potions.exotic.potionofcleansing$cleanse.name=arınmış
items.consum.potions.exotic.potionofcleansing$cleanse.desc=Bu karakter tüm zararlı durum etkilerine karşı birkaç tur bağışıktır!\n\nKalan tur: %s.

items.consum.potions.exotic.potionofcorrosivegas.name=aşındırıcı gaz iksiri
items.consum.potions.exotic.potionofcorrosivegas.desc=Bu basınçlı şişeyi açmak ya da kırmak içindekilerin patlayıp pas rengi zehirli bir gaz bulutu çıkarmasına neden olur. Bu gaz zehirli gazdan daha hızlı yayılır ve daha ölümcüldür, fakat onun kadar uzun süre dayanmaz.

items.consum.potions.exotic.potionofdragonsbreath.name=ejderha nefesi iksiri
items.consum.potions.exotic.potionofdragonsbreath.prompt=Yakmak için bir bölge seç
items.consum.potions.exotic.potionofdragonsbreath.desc=Bu şişede tükürük ile karıştıktan kısa bir süre sonra alev alan normalin dışı bir kimsasal bulunuyor. Bu sıvıyı çabucak tükürmek, kullanıcının ağzından ateş püskürmesini sağlayacaktır!

items.consum.potions.exotic.potionofearthenarmor.name=dünyasal zırh iksiri
items.consum.potions.exotic.potionofearthenarmor.desc=Bu sıvı, deriyi felç etmek yerine sertleştirerek onu geçici bir doğal zırh haline getirir.

items.consum.potions.exotic.potionofdivineinspiration.name=ilâhi ilham iksiri
items.consum.potions.exotic.potionofdivineinspiration.no_more_points=Daha fazla ekstra yetenek puanı kazanamazsın.
items.consum.potions.exotic.potionofdivineinspiration.select_tier=İçinde iki ekstra puan kazanacağın bir yetenek sınıfı seç. Puanları harcayabilmen için o sınıfın kilidini açmış olman gerek.
items.consum.potions.exotic.potionofdivineinspiration.bonus=+2 Yetenek Puanı!
items.consum.potions.exotic.potionofdivineinspiration.desc=Kutsal enerjinin sıvı formuna indirgenmiş gücü olan bu iksir, içen kişiye ilahi bir güç vererek kendi seçtiği bir kademede iki ekstra yetenek puanı kazandırır.\n\nBu iksir her yetenek kademesi için yalnızca bir kez kullanılabilir.

items.consum.potions.exotic.potionofmagicalsight.name=büyüsel görüş iksiri
items.consum.potions.exotic.potionofmagicalsight.desc=Bunu içtikten sonra, duyularınız kısa bir süreliğine inanılmaz seviyelere yükselecek ve 12 karo yarıçapındaki duvarların arkasını görmenizi sağlayacaktır!

items.consum.potions.exotic.potionofmastery.name=ustalık iksiri
items.consum.potions.exotic.potionofmastery.prompt=Bir Eşyada Ustalaş
items.consum.potions.exotic.potionofmastery.weapon_easier=Silahını tutmak kolaylaştı!
items.consum.potions.exotic.potionofmastery.armor_easier=Zırhını giymek kolaylaştı!
items.consum.potions.exotic.potionofmastery.desc=Bu iksir kaba kuvvet vermek yerine onu içenin kaslarını belirli bir eşyaya alıştırır. Sanki iksiri içen o eşyayla antrenman yapıp kas hafızası elde etmişçesine o eşyayı kullanmayı kolaylaştırır.\n\nSeçtiğin bir silah ya da zırh 2 puan daha az güç ister. Bu iksir her eşya üzerinde sadece bir kere kullanılabilir.

items.consum.potions.exotic.potionofshielding.name=korunma iksiri
items.consum.potions.exotic.potionofshielding.desc=Kullanıcısını iyileştirmek yerine bu iksir onun etrafında dayanıklı bir kalkan oluşturarak onu hatrı sayılır bir miktar hasardan koruyacaktır.

items.consum.potions.exotic.potionofshroudingfog.name=gizleyici sis iksiri
items.consum.potions.exotic.potionofshroudingfog.desc=Bu şişedeki sıvı havayla temas ettiğinde çabucak yayılan ve düşmanların görüşünü engelleyen yoğun, dumanlı bir sis üretir.

items.consum.potions.exotic.potionofsnapfreeze.name=anında donma iksiri
items.consum.potions.exotic.potionofsnapfreeze.desc=Bu iksirde saklanan kimyasal, hava ile sürekli olarak tepkimeye girerek etkisi altındaki her şeyi donduracak ve yerine kökleyecektir.

items.consum.potions.exotic.potionofstamina.name=kondisyon iksiri
items.consum.potions.exotic.potionofstamina.desc=Bu garip derecedeki tatlı sıvıyı içmek seni uzun süreli bir enerji artışı ile sarar, bu da uzun bir süreliğine daha da hızlı bir şekilde koşmanı sağlar.

items.consum.potions.exotic.potionofstormclouds.name=fırtına bulutları iksiri
items.consum.potions.exotic.potionofstormclouds.desc=Bu iksir fırlatıldığında hızla yayılan konsantre bir buhar bulutu oluşur ve bu buhar yoğunlaşarak çevreye yayılır. Çoğu arazi suya dönüşecek, ateşli düşmanlar hasar alacak, ateş sönecek ve tuzaklar alt edilip kırılacaktır.



###quest items
items.quest.ceremonialcandle.name=seromonik mum
items.quest.ceremonialcandle.desc=Bir dizi mum, kullanım sonucu erimiş ve aşınmış. \n\nYalnızken değersizdirler, fakat diğer mumlarla bir şekil üzerinde kullanılırsa bir rituel oluşturmak üzerinde yoğunlaşabilirler.
items.quest.ceremonialcandle.discover_hint=Bu eşyayı belirli bir görev esnasında bulabilirsin.

items.quest.corpsedust.name=ceset tozu
items.quest.corpsedust.chill=Sırtından bir ürperti iniyor.
items.quest.corpsedust.desc=Bu ceset tozu normal bir toz yığınından pek de fark etmiyor. Ama etrafında kötü bir enerjinin süzüldüğünü hissedebiliyorsun. \n\nBundan bir an önce kurtulmak iyi bir fikir olabilir.
items.quest.corpsedust.discover_hint=Bu eşyayı belirli bir görev esnasında bulabilirsin.
items.quest.corpsedust&dustwraith.rankings_desc=Ceset Tozu tarafından lanetlenmiş

items.quest.darkgold.name=kara altın cevheri
items.quest.darkgold.you_now_have=Artık %d kara altının var.
items.quest.darkgold.desc=Bu metalin adı kara, ama rengi yüzünden değil (normal altından farksız), daha çok güneş ışığı altında eriyip yeryüzünde işe yaramaz olması yüzünden.
items.quest.darkgold.discover_hint=Bu eşyayı belirli bir görev esnasında bulabilirsin.

items.quest.dwarftoken.name=cüce jetonu
items.quest.dwarftoken.discard=Fazlalık jetonundan kurtuluyorsun
items.quest.dwarftoken.desc=Kasadaki bir grup canavar tarafından korunan garip şekilli bir metal parçası. Belki de kasanın sihriyle bir şekilde bağlantılıdır? En iyisi yanında dursun, belki bi işe yarar.
items.quest.dwarftoken.desc_old=Çoğu cüce ve onların bazı büyük yapıtları bu küçük metal parçalarını bilinmeyen bir nedenden dolayı taşıyordu. Belki de bir çeşit mücevher veya kimlik görevi görüyorlardı. Cüceler garip bir halk.
items.quest.dwarftoken.discover_hint=Bu eşyayı belirli bir görev esnasında bulabilirsin.

items.quest.embers.name=elementer köz
items.quest.embers.desc=Sadece genç ateş elementallerinden elde edilebilen özel közler. Termal enerji yayıyorlar.
items.quest.embers.discover_hint=Bu eşyayı belirli bir görev esnasında bulabilirsin.

items.quest.escapecrystal.name=kaçış kristali
items.quest.escapecrystal.ac_use=KULLAN
items.quest.escapecrystal.prompt=Bir eşya seç
items.quest.escapecrystal.desc=Işınlanma büyüsü içeren ince bir kristal. Bunu istediğin zaman kasadan ayrılmak için kullanabilirsin ama erkenden ayrılırsan ödülün tamamını alamayacaksın!
items.quest.escapecrystal.discover_hint=Bu eşyayı belirli bir görev esnasında bulabilirsin.
items.quest.escapecrystal.injure_warning_1=İmp'in sesini duyduğunuzda zaman yavaşlıyor gibi geliyor:\n\n"Hey, bayağı yaralanmış gibisin, aşağıda her şey yolunda mı? Heykelimi istiyorum ama onu almaya çalışırken ölmeni gerektirecek kadar da değil!"
items.quest.escapecrystal.injure_warning_2="Eğer tatsız bir durumda kaldıysanız, _başlangıç odasındaki ışınlanma eşyalarından birini kullanarak_ oraya geri kaçabilir ve tekrar deneyebilirsiniz."
items.quest.escapecrystal.injure_warning_3="Eğer durum gerçekten vahim görünüyorsa,sen _sana verdiğim o kristali kullanarak kaçabilirsin._ Sana ödülün tamamını vermeyeceğim ama kesinlikle ölmekten daha iyidir!"
items.quest.escapecrystal.leaving_start=Zaman yavaşlamaya başlıyor ve İmp'in sesini duyuyorsun:\n\n"Dinle, tedirgin hissetmeni anlıyorum ama en azından ilk odadan da ayrılabilirsin ya!"\n\n"Eşyaların hakkında endişelenmene gerek yok, ben sözümün eri bir İmp'im ve geri döndüğünde her şeyini eksiksiz geri alacaksın. Ayrıca başın fena yanarsa da kristali erkenden ayrılmak için kullanmana laf etmem."
items.quest.escapecrystal.leaving_early=Zaman yavaşlamaya başlıyor ve İmp'in sesini duyuyorsun:\n\n"Şimdiden ayrılmak mı istiyorsun!? Buradaki çoğu düşmandan kaçabileceğinin farkındasın değil mi?"\n\n"Bak eğer hayatın tehlikedeyse seni ordan çıkarabilirim, ama yanına bişey almana izin veremem. Senden daha fazlasını beklerdim =("
items.quest.escapecrystal.leaving_partly_explored=Zaman yavaşlamaya başlıyor ve İmp'in sesini duyuyorsun:\n\n"Şimdiden ayrılıyor musun? Eh en azından artık aşağısı hakkında bilgiye sahibim, hiç yoktan iyidir ya!"\n\n"Yine de senden daha fazlasını beklerdim=( Tabi ihtiyacın varsa seni ordan alırım o ayrı. Sanırım bi iksir yada parşömen almana da müsaade edebilirim."
items.quest.escapecrystal.leaving_fully_explored=Zaman yavaşlıyor ve İmp'in sesini duyuyorsun:\n\n"Ayrılman mı lazım? En azından kasanın büyük bir çoğunluğunu keşfettin, bu da bişeydir. Heykelciği aşırma konusunda senden daha iyisini beklerdim ama en azından artık aşağının işleyişi hakkında bayağı bilgi sahibiyim."\n\n"Yanına bir eşya almana karışmayacağım ama sihirli bişeyler olmasın ha!"
items.quest.escapecrystal.leaving_partial_victory=Zaman yavaşlıyor ve İmp'in sesini duyuyorsun:\n\n"Heykelciğimi alacağını umuyordum ama yine de kasanın büyük bir kısmını temizleyerek ve keşfederek iyi iş çıkardın!"\n\n"Bak sana ne diyeceğim, +1 yükseltme sınırını geçmemek şartıyla bir eşyayı almana izin vereceğim ve her şeye rağmen zindanın aşağılarına dükkanımı açacağım. Ne de olsa bir sonraki hamlemi planlamak için zamana ihtiyacım var."
items.quest.escapecrystal.leaving_victory=Zaman yavaşlıyor ve İmp'in sesini duyuyorsun.\n\n"Vaay temiz iş çıkardın doğrusu! Ayrılmaya hazır mısın? Heykeli geri geldiğinde alacağım."\n\n"Söz verdiğim gibi aşağılarda bir yere bir dükkan açacağım, ayrıca kasadan istediğini almakta özgürsün! İstersen biraz düşün çünkü seçimin hariç her şey kasada kalacak."
items.quest.escapecrystal.leaving_item=Yanına almak istediğin eşyanın bu olduğuna emin misin?
items.quest.escapecrystal.leaving_seal=_Bu zırha iliştirilmiş kırık mühür aynaya bağlı ve yanında götüremezsin._ Mühür zırhından otomatik olarak ayrılacak, bu işlem zırh seviyesini 1 düşürecek ama üzerine kazılı hiç bir rünü kaldırmaz.
items.quest.escapecrystal.leaving_staff=_Bu büyücünün asası aynaya bağlı ve yanına götüremezsin ancak ona işlenmiş olan asayı götürebilirsin._ Asa otomatik olarak büyücünün asasından ayrılır ve sana asanın -1 levelinde geri verilir.
items.quest.escapecrystal.leaving_yes=Kasadan ayrıl
items.quest.escapecrystal.leaving_no=Burada kal
items.quest.escapecrystal.error_start=Görünüşe göre kasa seviyesinde değilsin! Muhtemelen bir hata yada çökme durumundan dolayı böyle oldu.
items.quest.escapecrystal.error_no_items=Eşyalarınızdan hiçbiri depolanmıyor, bu nedenle kristal envanterinizden kaldırıldı.
items.quest.escapecrystal.error_with_items=Eşyalarınız şu anda depolanmaktadır bu nedenle göreve başlamak için kasaya tekrar inmeyi denemelisiniz depolanan eşyalarınız görev sona erdiğinde size geri verilecektir

items.quest.gooblob.name=yapışkan çamur damlası
items.quest.gooblob.desc=Ölürken Goo'dan ayrılmış, sallantılı bir yapışkan madde. Neredeyse büyük bir jöle topu gibidir, ancak onu yemeye cesaret edemezsiniz.\n\nTek başına hiçbir işe yaramaz, ancak bazı iksirlerle veya bir bombayla birleştirildiğinde faydalı olabilir. En azından makul miktarda enerjiye dönüşmesi gerekir.
items.quest.gooblob.discover_hint=Bu eşyayı belirli düşmanlardan düşünce edinebilirsin.

items.quest.impstatue.name=Obsidyen Heykelcik
items.quest.impstatue.desc=Obsidyenden yontulmuş, simsiyah, küçük bir heykelcik. Seni buraya gönderen İmp'e benziyor; hatta onunki gibi parlayan yeşil gözleri bile var. Heykelin kaidesinde, daha önce hiç görmediğin bir dilde yazılmış bir yazı bulunuyor.
items.quest.impstatue.discover_hint=Bu eşyayı belirli bir görev esnasında bulabilirsin.

items.quest.vaultbeacon.name=Kasa geri dönüş feneri
items.quest.vaultbeacon.desc=Bu geri dönüş fenerinin konumu çoktan ayarlanmış gibi, muhtemelen seni ilk odaya ışınlayacak.\n\nKeşif yaparken zaman kazanmak için yada başın derde girdiğinde sıvışmak için kullanabilirsin.
items.quest.vaultbeacon.discover_hint=Bu eşyayı belirli bir görev esnasında bulabilirsin.

items.quest.metalshard.name=lanetli metal parçası
items.quest.metalshard.desc=DM-300 yok edilirken ondan kopan paslanmış lanetli metal parçası. İçinde aktif olmayan kötü niyetli bir büyü hissedebilirsiniz.\n\nTek başına hiçbir işe yaramıyor ama bazı parşömenlerle ya da bir bombayla birleştirildiğinde faydalı olabilir. En azından makul miktarda enerjiye dönüşmesi gerekir.
items.quest.metalshard.discover_hint=Bu eşyayı belirli düşmanlardan düşünce edinebilirsin.

items.quest.pickaxe.name=kazma
items.quest.pickaxe.ability_name=delmek
items.quest.pickaxe.ability_desc=Düellocu bir düşmanı kazmayla _delebilir_. Bu vuruş garantilidir, 3 tur boyunca savunmasız kalır ve sert derili düşmanlara _%1$d-%2$d hasar_ verir.
items.quest.pickaxe.upgrade_ability_stat_name=Yetenek hasarı
items.quest.pickaxe.desc=Bu, kayaları kırmak için sağlam ve ağır bir alettir. Bununla madencilik yapmak için kazmayı kuşanmanıza gerek yoktur, ancak muhtemelen bir silah olarak kuşanılabilir.
items.quest.pickaxe.discover_hint=Bu eşyayı belirli bir görev esnasında bulabilirsin.



###remains
items.ground.remains.remainsitem.ac_use=KULLAN
items.ground.remains.remainsitem.discover_hint=Bu eşyayı, daha önce zindanda yitip gitmiş belirli bir kahramanın kalıntıları içinde bulabilirsin.

items.ground.remains.bowfragment.name=yay parçası
items.ground.remains.bowfragment.desc=Bu kırık tahta parçası bir zamanlar kayıp bir Avcı'nın ruh yayının bir parçasıydı. Parçada hâlâ biraz doğa enerjisi kaldığını hissedebilirsiniz, parçayı etrafınızda biraz yüksek ot yetiştirmek için kullanabilirsiniz. Ancak bunu yapmak parçayı yok edecektir.

items.ground.remains.brokenhilt.name=kırık kabza
items.ground.remains.brokenhilt.desc=Bu kırık kabza, yenilmiş bir Düellocunun silahından gelmiş gibi görünüyor. Kabzada hala biraz dövüş gücü kaldığını hissedebilirsiniz, bunu sonraki iki yakın dövüş vuruşunuzda biraz ilave hasar almak için kullanabilirsiniz. Ancak bunu yapmak kabzayı yok edecektir.

items.ground.remains.brokenstaff.name=kırık asa
items.ground.remains.brokenstaff.desc=Bu büyücü asası, sahibi öldükten sonra ikiye bölünmüş. Asada hâlâ biraz sihirli enerji kaldığını hissedebilirsiniz, bunu değneklerine biraz şarj desteği vermek için kullanabilirsin. Ancak bunu yapmak asayı yok edecektir.

items.ground.remains.cloakscrap.name=kumaş artığı
items.ground.remains.cloakscrap.desc=Bu yarı saydam kumaş parçası, geç dönem bir Düzenbazın gölgeler pelerininden kalmış gibi görünüyor. İçinde hala biraz mistik enerji kaldığını hissedebilirsiniz, bunu eserlerinize biraz şarj desteği vermek için kullanabilirsiniz. Ancak bunu yapmak kumaşı yok edecektir.

items.ground.remains.sealshard.name=mühür kırıkları
items.ground.remains.sealshard.desc=Bu küçük kırmızı balmumu parçaları, kaybetmiş bir Savaşçının mühründen gelmiş gibi görünüyor. Mühürde hala biraz irade gücü kaldığını hissedebiliyorsun, bunu kendine biraz kalkan sağlamak için kullanabilirsin. Ancak bunu yapman mühür parçalarını yok edecektir.

items.ground.remains.tornpage.name=aşınmış sayfa
items.ground.remains.tornpage.desc=Bu sayfa son nefesini vermiş bir Ruhban'ın kutsal kitabından kopmuş gibi görünüyor. Üstünde hâla biraz ilahi enerji tutunuyor. Bunu biraz sağlık kazanmak için kullanabilirsin. Bunu yapmak yırtık sayfayı yok edecektir.



