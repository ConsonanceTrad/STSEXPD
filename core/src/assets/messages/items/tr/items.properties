##ghost hero
items.equipment.artifacts.driedrose$ghosthero.name=üzgün hayalet
items.equipment.artifacts.driedrose$ghosthero.def_verb=sıyrıldı
items.equipment.artifacts.driedrose$ghosthero.discover_hint=Bu karakteri belirli bir eser vasıtasıyla bulabilirsin.

items.equipment.artifacts.driedrose$ghosthero.hello=Tekrar merhaba %s.
items.equipment.artifacts.driedrose$ghosthero.introduce=Ruhum bu güle bağlı; bu gül benim için çok kıymetliydi, yeryüzünde bıraktığım sevgilimin bir hediyesiydi.\n\nArtık ona geri dönemem, ama senin sayende yolculuğumu tamamlamak için ikinci bir şansım var. Yapabildiğimde çağrına yanıt verecek ve seninle birlikte savaşacağım.\n\nGüle sahip olduğun sürece sesini duyabilirim, böylece sesini beni uzaktan yönetmek için kullanabilirsin.\n\nUmarım benim başaramadığımı sen başarırsın...

items.equipment.artifacts.driedrose$ghosthero.dialogue_sewers_1=Bu lağım eskiden güvenliydi, hatta insanlar kışın burada yaşardı.
items.equipment.artifacts.driedrose$ghosthero.dialogue_sewers_2=Gardiyanlara ne olduğunu merak ediyorum, acaba pes mi ettiler?
items.equipment.artifacts.driedrose$ghosthero.dialogue_sewers_3=Yeryüzünde bir ailem vardı, umarım güvendedirler.
items.equipment.artifacts.driedrose$ghosthero.dialogue_sewers_4=Gardiyanlar bu canavarları alt edemedi, ama belki biz edebiliriz.
items.equipment.artifacts.driedrose$ghosthero.dialogue_sewers_5=Lağımlar bile bu kadar tehlikeliyse aşağıda neler var merak ediyorum...
items.equipment.artifacts.driedrose$ghosthero.dialogue_sewers_6=Fareler ve yengeçlerin bu kadar büyümesine ne sebep olmuş olabilir?
items.equipment.artifacts.driedrose$ghosthero.dialogue_prison_1=Bu yer hakkında hikayeler duydum, hiçbiri iyi değildi.
items.equipment.artifacts.driedrose$ghosthero.dialogue_prison_2=Burası her zaman bir hapishaneden çok zindan gibiydi.
items.equipment.artifacts.driedrose$ghosthero.dialogue_prison_3=Burası terk edildiğinde neler olduğunu hayal bile edemiyorum.
items.equipment.artifacts.driedrose$ghosthero.dialogue_prison_4=Görünüşe göre mahkumlar da gardiyanlar da canavarlara dönüşmüş.
items.equipment.artifacts.driedrose$ghosthero.dialogue_prison_5=Bu iskeletlerin sorumlusu ne olabilir?
items.equipment.artifacts.driedrose$ghosthero.dialogue_prison_6=Bu insanların sonu böyle olmamalıydı.
items.equipment.artifacts.driedrose$ghosthero.dialogue_caves_1=Uzun bir süredir ne bir insan ne de bir cüce buraya ayak basmamış.
items.equipment.artifacts.driedrose$ghosthero.dialogue_caves_2=Cücelerin altın madenini terk etmesine ne sebep olmuş olabilir?
items.equipment.artifacts.driedrose$ghosthero.dialogue_caves_3=Ne yazık ki buradaki altınların yüzeyde bir değeri olmuyor.
items.equipment.artifacts.driedrose$ghosthero.dialogue_caves_4=Buradaki yaratıklar tıpkı lağımdakiler gibi çarpık
items.equipment.artifacts.driedrose$ghosthero.dialogue_caves_5=Buradaki yarasalar bile kana susamış.
items.equipment.artifacts.driedrose$ghosthero.dialogue_caves_6=Herhangi bir maden ekipmanından iz yok, cüceler hepsini geri mi aldı?
items.equipment.artifacts.driedrose$ghosthero.dialogue_city_1=Cüceler çalışkandı, fakat açgözlüydüler.
items.equipment.artifacts.driedrose$ghosthero.dialogue_city_2=Görünüşe göre, cüce metropolü gerçekten de düşmüş.
items.equipment.artifacts.driedrose$ghosthero.dialogue_city_3=Umarım yüzey bu mekân gibi bir hâle gelmez.
items.equipment.artifacts.driedrose$ghosthero.dialogue_city_4=Cücelerin bu kadar soluk görünmemeleri gerekiyor.
items.equipment.artifacts.driedrose$ghosthero.dialogue_city_5=Hangisi daha kötü bilmiyorum; cüceler mi yoksa yarattıkları mı.
items.equipment.artifacts.driedrose$ghosthero.dialogue_city_6=Görünüşe bakılırsa, cüceler de akılsız canavarlara dönüşmüşler.
items.equipment.artifacts.driedrose$ghosthero.dialogue_halls_1=Burası da neresi?
items.equipment.artifacts.driedrose$ghosthero.dialogue_halls_2=Burası korkutucu...
items.equipment.artifacts.driedrose$ghosthero.dialogue_halls_3=Cüceler bunun gibi bir güçle oynarken akıllarından ne geçiyordu?
items.equipment.artifacts.driedrose$ghosthero.dialogue_halls_4=Buradaki canavarlar doğaüstü, acaba nereden geldiler?
items.equipment.artifacts.driedrose$ghosthero.dialogue_halls_5=Hissedebiliyor musun? Sanki birisi bizi izliyor.
items.equipment.artifacts.driedrose$ghosthero.dialogue_halls_6=Çok şükür meşaleler var, burası çok karanlık!
items.equipment.artifacts.driedrose$ghosthero.dialogue_ascension_1=Neden böyle bir şey oluyor, başardığımızı sanmıştım?
items.equipment.artifacts.driedrose$ghosthero.dialogue_ascension_2=Bu şey nasıl oluyor da hala bu dünyayı kontrol edebiliyor?
items.equipment.artifacts.driedrose$ghosthero.dialogue_ascension_3=Umarım o muska ile ne yaptığını biliyorsundur.
items.equipment.artifacts.driedrose$ghosthero.dialogue_ascension_4=Sanırım işimiz hala bitmedi.
items.equipment.artifacts.driedrose$ghosthero.dialogue_ascension_5=Buraya kadar geldik, bunu başarabiliriz!
