items.equipment.artifacts.capeofthorns$thorns.name=diken
items.equipment.artifacts.capeofthorns$thorns.desc=Pelerinin enerji yayarak seni yansıtıcı bir güç alanı ile sarıyor!\n\nAldığın tüm hasar diken etkisi aktifken azalır. Aynı zamanda, eğer saldıran senin hemen yakınındaysa, azaltılan miktar saldırgana geri yansıtılır.\n\nDikenlerin kaybolmasına kalan sıra: %s

items.equipment.artifacts.chaliceofblood.name=kan kadehi
items.equipment.artifacts.chaliceofblood.ac_prick=BATIR
items.equipment.artifacts.chaliceofblood.yes=Evet, ne yaptığımı biliyorum
items.equipment.artifacts.chaliceofblood.no=Hayır, fikrimi değiştirdim
items.equipment.artifacts.chaliceofblood.prick_warn=Kadehi her kullandığınızda, yaşam enerjiniz daha fazla azalacak, ancak bunun karşılığında doğal sağlık yenilenme yeteneğiniz daha da artacaktır.\n\nŞu anda kendinizi iğnelediğinizde _%1$d-%2$d hasar_ alırsınız, ancak bu hasar _fiziksel ve büyülü engelleme veya hasar azaltma ile azaltılabilir._ Hasar azaltma etkilerini dikkate almadan, kendinizi iğnelediğinizde şu anda yaşam gücünüzün tamamen tükenme -%%%3$s olasılığı_ vardır.\n\nKadehe daha fazla yaşam enerjisi sunmak istediğinizden emin misiniz?
items.equipment.artifacts.chaliceofblood.onprick=Elini kestin ve yaşam özün kadehin içine doğru emildi.
items.equipment.artifacts.chaliceofblood.ondeath=Kadeh tüm yaşam enerjini emdi...
items.equipment.artifacts.chaliceofblood.desc=Bu parlak gümüş kadeh ilginç bir şekilde kenarında keskin mücevherlerle donatılmış.
items.equipment.artifacts.chaliceofblood.desc_cursed=Lanetli kadeh kendini sıkıca eline tutturdu ve sağlığını yenileme yeteneğini baskılıyor.
items.equipment.artifacts.chaliceofblood.desc_1=Kadehi elinde tutarken içinde garip bir şekilde kendini o keskin mücevherlerle kesme isteği duyuyorsun.
items.equipment.artifacts.chaliceofblood.desc_2=Kanınızın bir kısmı kadehe akıyor, kadehin size yaşam enerjisi verdiğini ve doğal sağlık yenilenmenizi artırdığını hafifçe hissedebiliyorsunuz. Acı vereceğini bilseniz de yine de kadehle kendinizi kesmek istiyorsunuz.
items.equipment.artifacts.chaliceofblood.desc_3=Kadeh yaşam özünle ağzına kadar doldu. Kadehin sana yaşam enerjisini geri verdiğini hissediyorsun.

items.equipment.artifacts.cloakofshadows.name=gölgelerin pelerini
items.equipment.artifacts.cloakofshadows.ac_stealth=GİZLİLİK
