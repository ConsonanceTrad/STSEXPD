items.equipment.artifacts.capeofthorns$thorns.inert=Pelerinin tekrar durağanlaştı.
items.equipment.artifacts.capeofthorns$thorns.radiating=Pelerinin enerji yaymaya başladı, korunmuş hissediyorsun!
