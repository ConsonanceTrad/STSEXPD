items.equipment.artifacts.driedrose$wndghosthero.desc=Hayalet tek başına güçsüz, ama somut formu bir silah ile zırh ile kuşanmak için yeterince sağlam. Tıpkı senin gibi bu eşyaları kullanabilir.\n\nHayaletin kullanabileceği ekipmanların azami güç gereksinimi: _%d güç._
