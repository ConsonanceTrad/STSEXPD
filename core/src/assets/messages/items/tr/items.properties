items.equipment.artifacts.sandalsofnature.desc_2=Ayakkabıların büyüdü ve daha çok bir çift kunduraya benzemeye başladı. Renkleri ortaya çıkmaya başladı, acaba daha fazla büyüyebilirler mi?
items.equipment.artifacts.sandalsofnature.desc_3=Bitkiler yeniden büyüdü ve ağaç kabuğundan yapılmış bir çift bota benzemeye başladı. Bitkiler güçlerini toparlamış gibi görünüyor, ama acaba daha da fazla büyüyebilirler mi?
items.equipment.artifacts.sandalsofnature.desc_4=Bitkiler en yüksek boylarına ulaştı, bir çift zırhlı çizmeye benziyorlar. Çizmeler koyu kahverengi renkte ve bir çeşit dayanıklı ağacı andırıyor.
items.equipment.artifacts.sandalsofnature.desc_hint=Bu eseri giyerken kendini doğayla uyum içinde hissediyorsun.
items.equipment.artifacts.sandalsofnature.desc_cursed=Lanetli sandaletler doğayla olan herhangi bir ilişkiyi engelliyor.
items.equipment.artifacts.sandalsofnature.desc_ability=Ayakkabılar, onları beslediğiniz son tohumun rengiyle dalgalanır. Kısa süreliğine toprağa kök salabilir ve 3 karo yarıçapındaki herhangi bir yerde o bitkinin etkisini üretebilirler.\nTohum: _%s_\nŞarj gerekli: _%d%%_
items.equipment.artifacts.sandalsofnature.desc_seeds=Ayakkabılara %d tohumu yedirdin.

items.equipment.artifacts.skeletonkey.name=iskelet anahtar
items.equipment.artifacts.skeletonkey.ac_insert=EKLE
items.equipment.artifacts.skeletonkey.cursed=Lanetli bir iskelet anahtarı kullanamazsın.
items.equipment.artifacts.skeletonkey.prompt=Hedef seçin
items.equipment.artifacts.skeletonkey.invalid_target=Orada kilitlenecek veya açılacak bir şey yok.
items.equipment.artifacts.skeletonkey.lock_no_space=Bir karakteri kapının arkasında kilitleyemezsin!
items.equipment.artifacts.skeletonkey.iron_charges=Normal bir kilidi açmak için 1 şarj gerekir.
items.equipment.artifacts.skeletonkey.gold_charges=Altın kilidi açmak için 2 şarj gerekir.
items.equipment.artifacts.skeletonkey.lock_charges=Bir kapıyı kilitlemek için 2 şarj gerekir.
items.equipment.artifacts.skeletonkey.wall_charges=Geçici bir duvar oluşturmak için 2 şarj gerekir.
items.equipment.artifacts.skeletonkey.crystal_charges=Kristal kilidi açmak için 5 şarj gerekir.
items.equipment.artifacts.skeletonkey.wont_open=Anahtar nedense bu kilide girmiyor.
items.equipment.artifacts.skeletonkey.locked_with_key=O kapı senin iskelet anahtarınla kilitlenmişti.
items.equipment.artifacts.skeletonkey.force_lock=İskelet anahtarınız olmadan kilit zayıflamıştır. Zorlayarak açmayı başarabilirsiniz.
items.equipment.artifacts.skeletonkey.discard=Fazla anahtarlarınızı atabilirsiniz.
items.equipment.artifacts.skeletonkey.levelup=İskelet anahtarınız güçleniyor!
items.equipment.artifacts.skeletonkey.desc=Kafatası şeklinde bir başı olan önemli görünümlü bir anahtar. Dişleri her baktığınızda farklı görünüyor.
items.equipment.artifacts.skeletonkey.desc_worn=Bu sihirli anahtar, zindanın normal anahtarları yerine kullandıkça güç kazanıyor gibi görünüyor. Zindandaki neredeyse tüm kilitlere takılarak, daha önce hiç kilitlenmemiş kapılar da dahil olmak üzere, kilitleri açabilir veya kapatabilir.\n\nAnahtar, önünüzdeki havayı “kilitlemek” için boş bir alanda dikey veya çapraz yönde bile kullanılabilir ve 10 tur boyunca 3 karo genişliğinde sağlam bir duvar oluşturur. Kilitleme, yeterli alan varsa düşmanları uzaklaştırır.
items.equipment.artifacts.skeletonkey.desc_cursed=Lanetli anahtar, herhangi bir kilide uymaktan aktif olarak kaçınıyor gibi görünüyor ve diğer anahtarlarınızı kullanmanızı zorlaştırıyor (ancak imkansız hale getirmiyor).
items.equipment.artifacts.skeletonkey$keywall.desc=Buraya iskelet anahtarı tarafından geçici bir sihirli duvar yerleştirilmiştir.

items.equipment.artifacts.talismanofforesight.name=öngörü tılsımı
items.equipment.artifacts.talismanofforesight.ac_scry=ÖNGÖRÜ
items.equipment.artifacts.talismanofforesight.low_charge=Bu tılsımın görmek için en az %5 enerjiye ihtiyacı var.
items.equipment.artifacts.talismanofforesight.prompt=Taramak için bir yer seç.
items.equipment.artifacts.talismanofforesight.levelup=Tılsımın güçlendi!
items.equipment.artifacts.talismanofforesight.full_charge=Tılsımın tamamen şarj oldu!
items.equipment.artifacts.talismanofforesight.desc=Üzerinde garip oymalar olan pürüzsüz bir taş. Sanki etrafındaki her şeyi izliyor, gizli kalmış bir şey olup olmadığını kolluyor gibi hissediyorsun.
items.equipment.artifacts.talismanofforesight.desc_worn=Tılsımı eline aldığında duyularının keskinleştiğini hissediyorsun. Tılsım, zaman geçtikçe ve gizli kapıları ya da tuzakları keşfettiğinde yavaş yavaş şarj oluyor.\n\nTılsım, şarjını kullanarak koni şeklinde bir alanda ‘öngörü’ sağlayabilir; bu, taranan alandaki tüm kareleri ve sırları ortaya çıkarır ve sana kısa bir süreliğine düşmanları ve eşyaları görme yeteneği kazandırır.
items.equipment.artifacts.talismanofforesight.desc_cursed=Lanetli tılsım sana dikkatle bakıyor ve duyularını köreltiyor.
items.equipment.artifacts.talismanofforesight$foresight.name=öngörü
items.equipment.artifacts.talismanofforesight$foresight.uneasy=Tedirgin hissediyorsun.
items.equipment.artifacts.talismanofforesight$foresight.desc=Kendini sanki yakınlarda görünmez bir tehlike varmış gibi çok tedirgin hissediyorsun.

items.equipment.artifacts.timekeepershourglass.name=zaman korucusunun kum saati
items.equipment.artifacts.timekeepershourglass.ac_activate=AKTİFLEŞTİR
items.equipment.artifacts.timekeepershourglass.deactivate=Zaman dondurmasını devre dışı bıraktın.
items.equipment.artifacts.timekeepershourglass.no_charge=Kum saatin kullanılabilecek kadar şarj olmadı.
items.equipment.artifacts.timekeepershourglass.cursed=Lanetli bir kumsaati kullanamazsın.
items.equipment.artifacts.timekeepershourglass.onstasis=Dünya etrafında birdenbire değişmiş gibi duruyor.
items.equipment.artifacts.timekeepershourglass.onfreeze=Etrafındaki herşey birden bire donuklaşıyor.
items.equipment.artifacts.timekeepershourglass.stasis=Kendimi dondur
items.equipment.artifacts.timekeepershourglass.freeze=Çevremdeki zamanı dondur
items.equipment.artifacts.timekeepershourglass.prompt=Kum saatinin büyüsünü nasıl kullanmak istersiniz?\n\nDurağanlıktayken, siz donmuş ve tamamen zarar görmez haldeyken zaman normal şekilde hareket eder, bir seferde en fazla 2 şarj tüketir.\n\nZaman donduğunda, eylemleriniz hiç zaman almıyormuş gibi hareket edebilirsiniz. Bu, kum saati kullanılarak veya saldırarak herhangi bir zamanda devre dışı bırakılabilir.
items.equipment.artifacts.timekeepershourglass.desc=Bu büyük antika kum saati bayağı mütevazı duruyor, ancak harika biçimde oyulmuş çerçevesinde müthiş bir güç hissediyorsun. Kum saatini döndürdükçe ve kumun akışını izledikçe büyüsünün sana yöneldiğini hissediyorsun, bu büyüyü kullanmak sana kesinlikle zaman üzerinde biraz kontrol verecek
items.equipment.artifacts.timekeepershourglass.desc_hint=Kum saati biraz kum kaybetmiş gibi duruyor, keşke biraz bulabilseydin...
items.equipment.artifacts.timekeepershourglass.desc_cursed=Lanetli kum saati yanına kilitlendi, zaman akışını değiştirmeye çalıştığını hissedebiliyorsun.
items.equipment.artifacts.timekeepershourglass$timefreeze.name=Zamanı Dondur
items.equipment.artifacts.timekeepershourglass$timefreeze.desc=Etrafındaki zaman dondu ve hareketleri anında yapmana izin veriyor. Etki iptal edilene kadar yada kum saatinin şarjı bitene kadar devam eder. Saldırmak yada büyü kullanmak da etkisini bozar.\n\nŞarj kullanımına kadar turlar: %s.
items.equipment.artifacts.timekeepershourglass$sandbag.name=büyülü kum çantası
items.equipment.artifacts.timekeepershourglass$sandbag.levelup=Kumu kum saatine ekledin.
items.equipment.artifacts.timekeepershourglass$sandbag.maxlevel=Kum saatin büyülü kumla doldu!
items.equipment.artifacts.timekeepershourglass$sandbag.no_hourglass=Bu kumu ekleyecek kum saatin yok.
items.equipment.artifacts.timekeepershourglass$sandbag.desc=Bu küçük ince kumla dolu torba kumsaatinle mükemmel çalışmalı.\n\nMağaza sahibinin tam ihtiyacın olduğunda bu özel eşyaya sahip olması biraz ilginç...

items.equipment.artifacts.unstablespellbook.name=dengesiz büyü kitabı
items.equipment.artifacts.unstablespellbook.ac_read=OKU
items.equipment.artifacts.unstablespellbook.ac_add=EKLE
items.equipment.artifacts.unstablespellbook.blinded=Körken kitaptan okuyamazsın.
items.equipment.artifacts.unstablespellbook.no_charge=Büyü kitabının şimdilik enerjisi bitti.
items.equipment.artifacts.unstablespellbook.cursed=Lanetli bir büyü kitabından okuyamazsın.
items.equipment.artifacts.unstablespellbook.prompt=Bir parşömen seç
items.equipment.artifacts.unstablespellbook.infuse_scroll=Parşömenin enerjisini kitaba işledin.
items.equipment.artifacts.unstablespellbook.unable_scroll=Bu parşömeni kitaba ekleyemezsin.
items.equipment.artifacts.unstablespellbook.unknown_scroll=Bunun henüz ne tür bir parşömen olduğunu bilmiyorsun.
items.equipment.artifacts.unstablespellbook.desc=Bu büyü kitabı yaşına göre hayret verici biçimde iyi durumda. Sayfaları gezdikçe dengesiz bir güçle dolup taşıyor. Bu kitaptan okursan, hangi büyüyü kullanacağını bilmene imkan yok.
items.equipment.artifacts.unstablespellbook.desc_cursed=Lanetli kitap kendini sana kilitledi, çoğu parşömeni kullanma yeteneğini engelliyor.
items.equipment.artifacts.unstablespellbook.desc_index=Bu kitap yarım kalmış. Dizini şu anda belirtilen boş sayfaları gösteriyor:
items.equipment.artifacts.unstablespellbook.desc_empowered=Kitaba eklediğin parşömenler güç ile parlıyor. Bu parşömenlerin egzotik versiyonlarını fazladan şarj harcayarak kullanabileceksin.
items.equipment.artifacts.unstablespellbook.read_empowered=Büyü kitabına eklediğin parşömen enerji ile dolup taşıyor. Bu parşömenin etkisinin normal etkisinin yanında istersen egzotik versiyonunu da kullanabilirsin.\n\nEgzotik sürümü seçmek 1 şarj yerine 2 şarja mal olacaktır.



###bags
items.equipment.bags.bag.name=sırt çantası
items.equipment.bags.bag.discover_hint=Bu eşyayı bir mağazadan satın alabilirsin.

items.equipment.bags.potionbandolier.name=iksir palaskası
items.equipment.bags.potionbandolier.desc=Bu kalın palaska göğsünüzün etrafına bir kuşak gibi oturur, üzerinde iksir şişelerini, su tulumunuzu veya sıvı metal şişelerini tutmak için birçok yalıtımlı kayış vardır.\n\nPalaska içindeyken iksirleriniz soğuktan korunur.

items.equipment.bags.scrollholder.name=parşomen tutacağı
items.equipment.bags.scrollholder.desc=Bu boru şeklindeki kap, bir astronomun aletleri ve haritaları için tasarlanmış gibi görünüyor, ancak parşömenleriniz tam olarak sığacaktır. Büyü kristalleri, büyü kalemleri ve büyü reçineleri için mükemmel olabilecek birkaç yan bölme bile vardır.\n\nTaban yanıcı gibi görünmüyor, bu nedenle parşömenleriniz içeride ateşten korunacaktır.

items.equipment.bags.velvetpouch.name=kadife kese
items.equipment.bags.velvetpouch.desc=Bu küçük kadife kese içinde bir sürü eşya bulundurabilir, tohumlar, rün taşları, ve bazı simya maddeleri.
items.equipment.bags.velvetpouch.discover_hint=Kahramanlardan birisi bu eşyayla başlar.

items.equipment.bags.magicalholster.name=büyülü kılıf
items.equipment.bags.magicalholster.desc=Bu ince kılıf egzotik bir hayvanın derisinden yapılmış ve çok sayıda menzilli silah taşımanı sağlayan kuvvetli bir sihir taşıyor.\n\nKolayca çantaya elini sokup tam aradığın eşyayı tutabilirsin.\n\nBu kılıfın taşıdığı sihir sayesinde değnekler biraz daha hızlı şarj olur ve fırlatılan silahların ömrü biraz daha artar.



###bombs
items.equipment.bombs.arcanebomb.name=gizemli bomba
items.equipment.bombs.arcanebomb.desc=Bu bombaya gizemli özellikler kazandırılmıştır. Goo'nun pompalı saldırısına benzer güçlü bir patlamayla patlayacak ve 2 karo içindeki her şeye _%1$d-%2$d büyü hasarı_ verecek.
items.equipment.bombs.arcanebomb.discover_hint=Bu eşyayı simya ile üretebilirsin.

items.equipment.bombs.bomb.name=bomba
items.equipment.bombs.bomb.ac_lightthrow=YAK & FIRLAT
items.equipment.bombs.bomb.snuff_fuse=Bombanın fitilini çabucak söndürdün.
items.equipment.bombs.bomb.ondeath=Patlama seni öldürdü...
items.equipment.bombs.bomb.rankings_desc=Bir patlama tarafından öldürüldü
items.equipment.bombs.bomb.desc=Oldukça ağır bir kara barut bombası. Bu bombanın patlaması, bitişiğindeki her şeye 1-2 hasar verir ve bazı bitişik arazileri veya eşyaları yok eder.Oldukça ağır bir kara barut bombası. Bu bombanın patlaması, bitişiğindeki her şeye _%1$d-%2$d hasar_ verir ve bazı bitişik arazileri veya eşyaları yok eder.
items.equipment.bombs.bomb.desc_fuse=Görünüşe göre fitilin ateşlendikten sonra tamamen yanması için birkaç sıra beklemek gerekiyor.
items.equipment.bombs.bomb.desc_burning=Bombanın fitili yanıp gidiyor, ya ondan uzaklaş ya da fitili söndür!
items.equipment.bombs.bomb$doublebomb.name=iki bomba
items.equipment.bombs.bomb$doublebomb.desc=Bayağı ağır bir kara barut bomba çifti, görünüşe bakılırsa birini bedavaya alıyorsun!

items.equipment.bombs.firebomb.name=ateş bombası
items.equipment.bombs.firebomb.desc=Bu bomba daha geniş bir alanda patlayacak, _%1$d-%2$d hasar_ verecek ve 2 karo içinde sürekli alev yayacak şekilde değiştirildi.
items.equipment.bombs.firebomb.discover_hint=Bu eşyayı simya ile üretebilirsin.

items.equipment.bombs.flashbangbomb.name=flaş bombası
items.equipment.bombs.flashbangbomb.desc=Bu özelleştirilmiş bomba patladığında bir ışık, ses ve elektrik patlamasına dönüşecek. 2 karo içindeki her şey patlamadan _%1$d-%2$d hasar_, elektrikten ek %%25 hasar alır ve 10 tur boyunca sersemler.
items.equipment.bombs.flashbangbomb.discover_hint=Bu eşyayı simya ile üretebilirsin.

items.equipment.bombs.frostbomb.name=buz bombası
items.equipment.bombs.frostbomb.desc=Bu bomba daha geniş bir alanda patlayacak, _%1$d-%2$d_ hasar verecek ve 2 karo içinde sürekli bir dondurucu hava dalgası yayacak şekilde değiştirildi.
items.equipment.bombs.frostbomb.discover_hint=Bu eşyayı simya ile üretebilirsin.

items.equipment.bombs.holybomb.name=kutsal bomba
items.equipment.bombs.holybomb.desc=Bu bomba, patladığında daha geniş bir alanda kutsal ışık saçacak şekilde değiştirildi. 2 karo içindeki her şey patlamadan _%1$d-%2$d hasar_ alır ve ölümsüz veya şeytani düşmanlar kutsal ışıktan ek %%50 hasar alır.
items.equipment.bombs.holybomb.discover_hint=Bu eşyayı simya ile üretebilirsin.

items.equipment.bombs.noisemaker.name=ses yapıcı
items.equipment.bombs.noisemaker.desc=Bu özelleştirilmiş bomba, fünyesi bittiğinde tekrar tekrar ses çıkaracak. Bombaya bir şey dokunduğunda patlayacak ve 2 karo içindeki her şeye _%1$d-%2$d hasar_ verecek!
items.equipment.bombs.noisemaker.desc_burning=Ses bombası bipliyor, yanına bir şey yaklaşırsa patlar!
items.equipment.bombs.noisemaker.discover_hint=Bu eşyayı simya ile üretebilirsin.

items.equipment.bombs.smokebomb.name=Sis bombası
items.equipment.bombs.smokebomb.desc=Bu bomba patladığı anda aynı zamanda yoğun bir gaz bulutu püskürtecek şekilde modifiye edilmiş. _%1$d-%2$d hasar_ verecek ve bu gaz iki karo yayılacak
items.equipment.bombs.smokebomb.discover_hint=Bu eşyayı simya ile üretebilirsin.

items.equipment.bombs.regrowthbomb.name=yeniden büyüme bombası
items.equipment.bombs.regrowthbomb.desc=Bu özelleştirilmiş bomba patlamak yerine 3 karo içinde her yere hayat veren sıvı sıçratır. Patlamaya maruz kalan bölgede hızla çim ve bitkiler filizlenir. Kendiniz ve patlamaya yakalanan tüm müttefikleriniz bir iyileştirme iksiri içmiş gibi iyileşir.
items.equipment.bombs.regrowthbomb.discover_hint=Bu eşyayı simya ile üretebilirsin.

items.equipment.bombs.shrapnelbomb.name=şarapnel bombası
items.equipment.bombs.shrapnelbomb.desc=Bu bomba DM-300'ün metal parçalarıyla geliştirilmiştir, patladığında parçalanarak etrafa saçılır ve bombanın etrafındaki geniş bir alanda _%1$d-%2$d hasar_ verir. Kullanırken bir şeyin arkasına saklansanız iyi olur...
items.equipment.bombs.shrapnelbomb.discover_hint=Bu eşyayı simya ile üretebilirsin.

items.equipment.bombs.woollybomb.name=yünlü bomba
items.equipment.bombs.woollybomb.desc=Bu özel yapım bombanın patlamasını takiben büyük bir alanı büyülü koyunlar kaplayacak. Patlama 2 karo içerisindeki her şeye _%1$d-%2$d hasar_ verecek. Koyunlar uzun süre duracak ve hareket etmene engel olacaklar! Güçlü düşmanlar mevcut iken koyunlar o kadar da uzun kalmayacak, ve istenirse koyunlarla karşılıklı etkileşim yoluyla bu süre kısaltılabilir.
items.equipment.bombs.woollybomb.discover_hint=Bu eşyayı simya ile üretebilirsin.

###food
items.consum.food.berry.name=zindan dutu
items.consum.food.berry.eat_msg=Bu dut lezzetliydi!
items.consum.food.berry.desc=Bu küçük meyve, Avcı tarafından zindandaki çalıların arasında bulundu. Hızlı bir şekilde tüketilebilir, az miktarda tokluğu geri kazandırır ve bir tohum içerebilir!
items.consum.food.berry.discover_hint=Bu karakteri belirli bir kahraman yeteneği kullanarak bulabilirsin.

items.consum.food.blandfruit.name=tatsız meyve
items.consum.food.blandfruit.cooked=pişmiş tatsızmeyve
items.consum.food.blandfruit.sunfruit=güneş meyvesi
items.consum.food.blandfruit.rotfruit=çürük meyve
items.consum.food.blandfruit.earthfruit=dünya meyvesi
items.consum.food.blandfruit.blindfruit=kör meyve
items.consum.food.blandfruit.firefruit=ateş meyvesi
items.consum.food.blandfruit.icefruit=buz meyvesi
items.consum.food.blandfruit.fadefruit=soluk meyve
items.consum.food.blandfruit.sorrowfruit=üzüntü meyvesi
items.consum.food.blandfruit.stormfruit=fırtına meyvesi
items.consum.food.blandfruit.dreamfruit=büyücü meyvesi
items.consum.food.blandfruit.starfruit=yıldız meyvesi
items.consum.food.blandfruit.swiftfruit=çevikmeyve
items.consum.food.blandfruit.raw=Bunu çiğ yemeye için elvermiyor.
items.consum.food.blandfruit.desc=Çok kuru ve temelsiz, belki başka bir malzeme ile pişirmek onu geliştirebilir.
items.consum.food.blandfruit.desc_cooked=Meyve tencerede bekletildiği süre boyunca dolgunlaştı ve hatta pişirildiği tohumun özelliklerini emdi. Tohum hangi iksire karşılık geliyorsa onun etkisine sahip olacaktır.
items.consum.food.blandfruit.desc_eat=Yenilmeye hazır görünüyor!
items.consum.food.blandfruit.desc_throw=Baya uçucu görünüyor, onu fırlatmak yapılacak en iyi şey olabilir.
items.consum.food.blandfruit$chunks.name=tatsızmeyve parçacıkları
items.consum.food.blandfruit$chunks.desc=Tatsız meyve bir darbe nedeniyle parçalandı ve sonuç olarak arkasında parçalarını bıraktı.\n\nBirazcık tozlanmış olsalar da bu pişirilmiş tatsız meyve parçacıkları tamamen yenebilir gibi duruyor.

items.consum.food.chargrilledmeat.name=kızartılmış et
items.consum.food.chargrilledmeat.desc=Normal pişmiş bir et gibi görünüyor.
items.consum.food.chargrilledmeat.discover_hint=Bunu başka bir yiyeceği kullanarak üretebilirsin.

items.consum.food.food.name=yemek paketi
items.consum.food.food.ac_eat=YE
items.consum.food.food.eat_msg=Bu yemek lezzetliydi!
items.consum.food.food.desc=Burada şık bir şey yok: kurumuş et, biraz bisküvi - bunun gibi şeyler.

items.consum.food.frozencarpaccio.name=donmuş et
items.consum.food.frozencarpaccio.invis=Ellerinin görünmez olduğunu görüyorsun!
items.consum.food.frozencarpaccio.hard=Derinin sertleştiğini hissediyorsun!
items.consum.food.frozencarpaccio.refresh=Tazeleyici!
items.consum.food.frozencarpaccio.better=Daha iyi hissediyorsun!
items.consum.food.frozencarpaccio.desc=Bu bir parça donmuş çiğ et. Bunu yemenin tek yolu küçük parçalara ayırmak. Bu yolla tadı şaşırtıcı derecede güzel.
items.consum.food.frozencarpaccio.discover_hint=Bunu başka bir yiyeceği kullanarak üretebilirsin.

items.consum.food.meatpie.name=etli börek
items.consum.food.meatpie.eat_msg=Bu yemek harikaydı!
items.consum.food.meatpie.desc=Tuzlu etle doldurulmuş enfes bir börek. Bu yemek seni diğer bütün yemeklerden daha tok tutacak.
items.consum.food.meatpie.discover_hint=Bu eşyayı simya ile üretebilirsin.

items.consum.food.mysterymeat.name=gizemli et
items.consum.food.mysterymeat.eat_msg=Bu yemeğin tadı... garipti.
items.consum.food.mysterymeat.hot=Oh, bu sıcak!
items.consum.food.mysterymeat.legs=Bacaklarını hissedemiyorsun!
items.consum.food.mysterymeat.not_well=İyi hissetmiyorsun.
items.consum.food.mysterymeat.stuffed=Tıkandın.
items.consum.food.mysterymeat.desc=Kendi riskine ye!
items.consum.food.mysterymeat.discover_hint=Bu eşyayı belirli düşmanlardan düşünce edinebilirsin.
items.consum.food.mysterymeat$placeholder.name=et

items.consum.food.phantommeat.name=hayalet eti
items.consum.food.phantommeat.desc=Büyük pırıl pırıl yarı saydam et, hayalet piranadan kesilip çıkartılmış. Bu büyülü etin pişirilmesine gerek yok ve seni tamamen doyurmanın yanı sıra birtakım yararlar sağlar. Yenildiğinde görünmezlik, kabukderi ve biraz iyileşme sağlayıp birçok zararlı etkiyi temizler.
items.consum.food.phantommeat.discover_hint=Bu eşyayı belirli düşmanlardan düşünce edinebilirsin.

items.consum.food.pasty.name=etli börek
items.consum.food.pasty.fish_name=buğulama balık
items.consum.food.pasty.amulet_name=Yendor'un tılsımı mı?
items.consum.food.pasty.egg_name=paskalya yumurtası
items.consum.food.pasty.rainbow_name=gökkuşağı iksiri
items.consum.food.pasty.shattered_name=yeşil kek
items.consum.food.pasty.pie_name=bal kabağı turtası
items.consum.food.pasty.vanilla_name=mavi kek
items.consum.food.pasty.cane_name=şeker kamışı
items.consum.food.pasty.sparkling_name=köpüklü iksir
items.consum.food.pasty.desc=Geleneksel et ve patates harcıyla yapılmış hakiki bir börek. Nefis!
items.consum.food.pasty.fish_desc=Yeşillik yatağında sihirli bir şekilde korunmuş, buharda pişirilmiş bütün bir balık. Yılın bu zamanlarında bir miktar balığı daha sonrası için saklamak bir gelenektir, böylece hepsini bir kerede yemek yerine bir miktar artığı saklamış olursunuz.\n\nAy Yeni Yılınız Kutlu Olsun!
items.consum.food.pasty.amulet_desc=Sonunda onu buldunuz, büyülü tılsımı - bir dakika, bu sadece tılsım gibi görünmesi için folyoya sarılmış bir çikolata! Size sınırsız güç vermeyecek ama en azından içinizi dolduracak ve size küçük bir eser şarjı sağlayacak.\n\n1 Nisan Şakası!
items.consum.food.pasty.egg_desc=Renkli sarı folyoya sarılmış kocaman bir çikolatalı yumurta. Burada sizi doyurmaya yetecek kadar çikolata var ve şeker, eserlerinize biraz daha fazla enerji verebilir.\n\nMutlu Paskalyalar!
items.consum.food.pasty.rainbow_desc=Bu renkli iksir bir tür sıvı gıdadır. Açlığınızı gidermenin yanı sıra, içindeki küçük bir sihir sayesinde patron olmayan bir düşmanı sakinleştirerek geçici olarak sizinle savaşmaktan çekinmesini sağlar.\n\nMutlu Onurlar!
items.consum.food.pasty.shattered_desc=Bu büyük vanilyalı kek dilimi renkli süslere ve yeşil kremaya sahip. Pasta, yılların deneyimini kutlamak için yapıldı ve yenildiğinde size bu deneyimin küçük bir kısmını verecektir.\n\nShattered Pixel Dungeon ilk olarak 5 Ağustos 2014'te piyasaya sürüldü. Doğum günün kutlu olsun Shattered Pixel Dungeon!
items.consum.food.pasty.pie_desc=Kocaman bir dilim balkabağı turtası. Tatlı ve baharatlı lezzeti sizi doyuracak ve bir parça şifa verecektir.\n\nMutlu Cadılar Bayramı!
items.consum.food.pasty.vanilla_desc=Bu büyük dilim vanilyalı pastanın üzerinde renkli serpintiler ve mavi krema bulunmaktadır. Pasta, yılların deneyimini kutlamak için yapılmıştır ve yenildiğinde size bu deneyimin küçük bir miktarını verecektir.\n\nOrijinal Pixel Dungeon ilk olarak 4 Aralık 2012 tarihinde yayınlanmıştır. İyi ki doğdun Pixel Dungeon!
items.consum.food.pasty.cane_desc=Kocaman şekerli bir şeker kamışı. Sizi doyuracak kadar büyüktür ve şekeri de değneklerinize biraz ekstra güç verebilir.\n\nİyi tatiller!
items.consum.food.pasty.sparkling_desc=Bu köpüklü iksir bir tür sıvı gıdadır. Açlığı giderir ve köpüklü şarabı taklit eder, ancak aslında alkollü değildir. Karnınızdaki sıcaklık hissi biraz kalkan görevi görecektir.\n\nMutlu Yıllar!
items.consum.food.pasty$fishleftover.name=balık artıkları
items.consum.food.pasty$fishleftover.eat_msg=Bu yemeğin tadı fena değildi.
items.consum.food.pasty$fishleftover.desc=Önceki öğününüzden kalan biraz balık. Biraz açlığı gidermek için istediğiniz zaman yiyebilirsiniz.

items.consum.food.smallration.name=küçük yemek paketi
items.consum.food.smallration.eat_msg=Bu yemeğin tadı fena değildi.
items.consum.food.smallration.desc=Tam olarak standart bir yemek paketi gibi görünüyor ama daha küçük.
items.consum.food.smallration.discover_hint=Bu eşyayı bir mağazadan satın alabilirsin.

items.consum.food.stewedmeat.name=güveç et
items.consum.food.stewedmeat.eat_msg=Bu yemeğin tadı fena değildi.
items.consum.food.stewedmeat.desc=Eti güveç haline getirmek onu tüm hastalıklardan ve parazitlerden temizledi. Artık bunu yemek güvenli olmalı.
items.consum.food.stewedmeat.discover_hint=Bu eşyayı simya ile üretebilirsin.

items.consum.food.supplyration.name=tedarik oranı
items.consum.food.supplyration.desc=Bu tayın zindana hırsızlar loncası üyeleri tarafından ve onlar için bırakılmıştır. Hareket halindeyken yenmek ve genel kurnazlıklara yardımcı olmak için özel olarak tasarlanmıştır.\n\nSizi normal bir tayın kadar doyurmasa da, hızlıca yenebilir, biraz doğrudan iyileşme sağlar ve Düzenbazın Gölgeler Pelerini'ne bir şarj geri yükler.
items.consum.food.supplyration.discover_hint=Bu karakteri belirli bir kahraman yeteneği kullanarak bulabilirsin.



##journal items
items.specific.journal.documentpage.name=aşınmış sayfa
items.specific.journal.documentpage.desc=Yalnız bir sayfa, muhtemelen bir kitaptan veya benzeri bir şeyden düşmüş. Okumak için yerden alman gerekiyor.

items.specific.journal.alchemypage.name=yırtık simya kitabı sayfası
items.specific.journal.alchemypage.desc=Simya üzerine yazılmış bir rehber kitabından bir sayfa.\n\nYazının çoğu uzaktan okumak için çok küçük, fakat sayfanın başlığını çıkarabiliyorsun:\n\n_"%s"_

items.specific.journal.guidebook.name= zindan ustalığı cildi
items.specific.journal.guidebook.hint_mobile=Rehber kitabında senin için bazı tavsiyeler var! Okumak için sağ üst köşede yanıp sönen günlük düğmesine dokun.
items.specific.journal.guidebook.hint_desktop=Rehberinde bazı tavsiyeler var! Okumak için sağ üst köşedeki yanıp sönen günlük simgesine (%s) tıkla.
items.specific.journal.guidebook.hint_status=Rehber kitap
items.specific.journal.guidebook.desc=Bir maceracının rehber kitabı, maceraya atılmanın ona göre olmadığına karar vermiş biri tarafından buraya bırakılmış! Bu özel kitap büyülü ve maceracıları doğru zamanda bir sayfayı okumaya sevk edebilir.\n\nBu işlevselliğe rağmen, kitap en çok kapakta büyük dostça harflerle yazılmış "Panik Yapmayın!" kelimeleri nedeniyle popülerdir.

items.specific.journal.guidepage.name=aşınmış kılavuz sayfası
items.specific.journal.guidepage.desc=Bir macera kılavuzundan yırtılmış bir sayfa.\n\nYazının çoğunluğu uzaktan okuyabilmek için çok küçük, ama sayfanın başlığını çıkarabiliyorsun:\n\n_"%s"_

items.specific.journal.regionlorepage$sewers.name=eskimiş mektup
items.specific.journal.regionlorepage$sewers.desc=Bir mektuba benzeyen bu şey, toprak lekeli bir kağıda yazılmış. Okumak için onu alman gerekecek.

items.specific.journal.regionlorepage$prison.name=eskimiş günlük girdisi
items.specific.journal.regionlorepage$prison.desc=Bir günlük girdisi, ya da bir çeşit kayıt, eski bir kağıt parçası üzerine yazılmış. Diğer bulduğun mektuplardan daha iyi halde kalmış olsa bile onu okumak için eline alman gerekecek.

items.specific.journal.regionlorepage$caves.name=eskimiş kayıt girdisi
items.specific.journal.regionlorepage$caves.desc=Bir kâşifin seyir defterindeki bir girdi gibi görünüyor, ne kadar eski olmasına rağmen şaşırtıcı derecede iyi korunmuş. Okumak için yerden al.

items.specific.journal.regionlorepage$city.name=paslı tablet
items.specific.journal.regionlorepage$city.desc=İçindeki mesaj sihirli bir şekilde kazınmış, küçük paslı metal bir tablet. Tabletin yaşına rağmen harfler hala net, ancak okumak için onu alman gerekecek.

items.specific.journal.regionlorepage$halls.name=parlayan tablet
items.specific.journal.regionlorepage$halls.desc=İçine parlak yeşil harfler kazınmış küçük siyah bir tablet. Parlayan harfler uzakta bulanıklaşıyor, okumak için onu alman gerekecek.


###keys
items.specific.keys.goldenkey.name=altın anahtar
items.specific.keys.goldenkey.desc=Bu anahtarın dişleri küçücük ve karmaşık. Acaba kilitli bir sandığı açabilir mi?

items.specific.keys.crystalkey.name=Kristal anahtar
items.specific.keys.crystalkey.desc=Bu kristal anahtarın kesik yüzeyleri karanlıkta parıldıyor. Belki kristalden yapılmış bir şeyi açar?

items.specific.keys.ironkey.name=demir anahtar
items.specific.keys.ironkey.desc=Bu anahtarın üzerindeki çentikler aşınmış; üzerindeki deri kordon yıllar geçtikçe çürümüş. Acaba bu anahtar ile hangi kapı açılabilir?

items.specific.keys.wornkey.name=aşınmış anahtar
items.specific.keys.wornkey.desc=Bu anahtar aşınmış ve rengi solmuş, ama ciddi görünüyor. Muhtemelen yakındaki önemli bir kapıyı açabilir.



