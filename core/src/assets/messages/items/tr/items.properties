items.consum.scrolls.scroll.unknown_desc=Bu parşömenin üzerine yorumlanamayan sihirli bir rün yazılmış. Seslice okunduğunda ne olacağını kim bilir?
items.consum.scrolls.scroll.blinded=Kör iken bir parşömen okuyamazsın.
items.consum.scrolls.scroll.no_magic=Büyü bağışıklılığındayken bir parşömen okuyamazsın.
items.consum.scrolls.scroll.cursed=Lanetli büyü kitabın bu parşömendeki büyüyü kullanmanı engelliyor! Ama bir lanet kaldırma parşömeni işe yaramak için yeterince güçlü olabilir...
items.consum.scrolls.scroll$placeholder.name=parşömen

items.consum.scrolls.inventoryscroll.warning=Bu parşomen kullanımından vazgeçmek istediğinize emin misiniz? Parşomen yinede tüketilecek.
items.consum.scrolls.inventoryscroll.yes=Evet, eminim
items.consum.scrolls.inventoryscroll.no=Hayır, fikrimi değiştirdim

items.consum.scrolls.scrollofidentify.name=tanımlama parşömeni
items.consum.scrolls.scrollofidentify.inv_title=Bir eşyayı tanımla
items.consum.scrolls.scrollofidentify.it_is=Eşyanız tanımlandı: %s.
items.consum.scrolls.scrollofidentify.desc=Bu parşömen tek bir eşyanın tüm sırlarını açığa çıkarır.

items.consum.scrolls.scrolloflullaby.name=ninni parşömeni
items.consum.scrolls.scrolloflullaby.sooth=Bu parşömen rahatlatıcı bir melodi söylüyor. Çok uykulu hissediyorsun.
items.consum.scrolls.scrolloflullaby.desc=Bu parşömen okunduğunda, onu duyan herkesi derin bir büyülü uykuya daldıracak rahatlatıcı bir melodi yayılır. Okuyan kişi ve müttefikleri için bu uyku onarıcıdır.

items.consum.scrolls.scrollofmagicmapping.name=büyülü haritalama parşömeni
items.consum.scrolls.scrollofmagicmapping.layout=Artık bölümün düzeninden haberdarsın.
items.consum.scrolls.scrollofmagicmapping.desc=Bu parşömen okunduğunda, kristal berraklığında bir resim hafızana kazınarak katın tüm sırlarını açığa çıkartır ve isabetli bir haritasını çıkartır. Eşya ve yaratıkların yerleri belirlenmemiş olarak kalacaktır.

items.consum.scrolls.scrollofmirrorimage.name=ayna görüntü parşömeni
items.consum.scrolls.scrollofmirrorimage.copies=Parşömen senin ayna görüntülerini oluşturuyor.
items.consum.scrolls.scrollofmirrorimage.no_copies=Parşömen, senin ayna görüntülerini oluşturmaya çalışıyor, ancak gidecek hiçbir yerleri yok.
items.consum.scrolls.scrollofmirrorimage.desc=Bu parşomenin üzerindeki büyü, okuyucunun iki ilüzyonik kopyasını oluşturacaktır. Bu ayna kopyalar okuyucunun zayıf klonları olarak görev yapar ve düşmanları kovalar. Fakat onların bir dayanıklılığı yoktur ve hasar aldıkları an kaybolurlar.

items.consum.scrolls.scrollofretribution.name=intikam parşömeni
items.consum.scrolls.scrollofretribution.blast=Parşömenden güçlü bir sihirli enerji fışkırıyor!
items.consum.scrolls.scrollofretribution.desc=Bu parşömen, okuyan kişinin çektiği acıyı dışa bir güç patlaması olarak yönlendiren yıkıcı bir enerjiye sahiptir. Okuyan kişi ne kadar zayıflamışsa bu parşömen o kadar fazla hasar verecektir. Çok az sağlıkta iken bu parşömen çoğu düşmanı anında öldürebilir.\n\nFakat bu parşömeni okumanın okuyan kişi için bir bedeli vardır, bu da onun kör olması ve zayıflamasıdır.

items.consum.scrolls.scrollofrage.name=öfke parşömeni
items.consum.scrolls.scrollofrage.roar=Parşömen bütün zindanda yankılanan öfkelendirici bir kükreme çıkardı!
items.consum.scrolls.scrollofrage.desc=Okunduğunda, bu parşömen tüm düşmanları okuyucuya çeken ve yakındakileri de öfkelendiren büyük bir kükreme salar.

items.consum.scrolls.scrollofrecharging.name=reşarj parşömeni
items.consum.scrolls.scrollofrecharging.surge=Bir enerji dalgası vücudundan geçerek değneklerini canlandırıyor!
items.consum.scrolls.scrollofrecharging.desc=Saf büyülü güç parşömenden çıkar ve zamanla kullanıcının bütün değneklerini şarj eder.

items.consum.scrolls.scrollofremovecurse.name=Lanet kaldırma parşömeni
items.consum.scrolls.scrollofremovecurse.inv_title=Bir eşyayı arındır
items.consum.scrolls.scrollofremovecurse.cleansed=Eşyan temizleyici bir ışıkla parlıyor ve kötücül bir güç dağılıyor!
items.consum.scrolls.scrollofremovecurse.not_cleansed=Eşyan temizleyici bir ışıkla parlıyor, ama hiç bir şey olmuyor.
items.consum.scrolls.scrollofremovecurse.spirit=Parşömenin eziyet görmüş ruhu serbest bırakıyor!
items.consum.scrolls.scrollofremovecurse.desc=Bu parşömenin üzerindeki büyülü sözler bir zırh, silah, değnek, yüzük veya eserden tüm lanetleri kaldırır.

items.consum.scrolls.scrollofteleportation.name=ışınlama parşömeni
items.consum.scrolls.scrollofteleportation.tele=Göz açıp kapayıncaya kadar bu katta başka bir yere ışınlandın.
items.consum.scrolls.scrollofteleportation.no_tele=Işınlama büyüsü başarısız oldu.
items.consum.scrolls.scrollofteleportation.cant_reach=Oraya ışınlanamazsın.
items.consum.scrolls.scrollofteleportation.prompt=Işınlanmak istediğin yeri seç
items.consum.scrolls.scrollofteleportation.desc=Bu parşömenin üstündeki büyü okuyucuyu anında başka bir yere ışınlar. Parşömen okuyanın daha önce gitmediği yerlere öncelik gösterir ama kilitli kapıları veya barikatların ardına geçemez. Bununla birlikte, yeni alanlara açılan gizli kapıları ortaya çıkarabilir.

items.consum.scrolls.scrollofterror.name=terör parşömeni
items.consum.scrolls.scrollofterror.none=Parşömen muazzam bir kırmızı ışık parlaması yayıyor.
items.consum.scrolls.scrollofterror.one=Parşöen muazzam bir kırmızı ışık parlaması yaydı ve %s kaçmaya başladı!
items.consum.scrolls.scrollofterror.many=Parşömen muazzam bir kırmızı ışık parlaması yaydı ve yaratıklar kaçmaya başladı!
items.consum.scrolls.scrollofterror.desc=Okunduğunda, bu parşömen görüş alanındaki tüm düşmanları korkuyla kaçıran kırmızı bir ışık yayar. Kaçan bir düşmana saldırmak etkinin süresini azaltır.

items.consum.scrolls.scrolloftransmutation.name=transmutasyon parşomeni
items.consum.scrolls.scrolloftransmutation.inv_title=Bir eşyayı transmüle et
items.consum.scrolls.scrolloftransmutation.nothing=Kayda değer bir şey olmadı.
items.consum.scrolls.scrolloftransmutation.morph=Eşyan başka bir şeye dönüştü!
items.consum.scrolls.scrolloftransmutation.desc=Bu parşömen güçlü dönüşüm büyüsü içerir. Uygun bir eşya üzerinde kullanıldığında, onu aynı türden farklı bir eşyaya dönüştürecektir. Büyü, yükseltmeleri, büyüleri ve kabartmaları bile koruyacaktır. Parşömenler ve iksirler egzotik eşdeğerlerine dönüştürülecek ve bunun tersi de geçerli olacaktı

items.consum.scrolls.scrollofupgrade.name=yükseltme parşömeni
items.consum.scrolls.scrollofupgrade.inv_title=Bir eşyayı yükselt
items.consum.scrolls.scrollofupgrade.weaken_curse=Yükseltme parşömeni eşyandaki laneti zayıflattı.
items.consum.scrolls.scrollofupgrade.remove_curse=Yükseltme parşömeni eşyandaki laneti temizledi!
items.consum.scrolls.scrollofupgrade.desc=Bu parşömen, tek bir eşyayı ya da bir set fırlatılabilir silahı geliştirir. Değnekler daha güçlü hale gelir ve şarj sayıları artar; silahlar ve zırhlar daha fazla hasar verir ya da daha iyi koruma sağlar; fırlatılabilir silah setleri tamamen onarılır ve daha dayanıklı olur; yüzüklerin etkileri ise güçlenir.\n\nAyrıca lanetleri zayıflatabilir, hatta bazen tamamen ortadan kaldırabilir, ancak bir lanet kaldırma parşömeni kadar güçlü değildir. Ne yazık ki, bu yükseltme büyüsü yüksek seviyeli eşyalar üzerindeki büyüleri veya glifleri silebilir.



###exotic scrolls
items.consum.scrolls.exotic.exoticscroll.kaunan=egzotik KAUNAN parşömeni
items.consum.scrolls.exotic.exoticscroll.sowilo=egzotik SOWILO parşömeni
items.consum.scrolls.exotic.exoticscroll.laguz=egzotik LAGUZ parşömeni
items.consum.scrolls.exotic.exoticscroll.yngvi=egzotik YNGVI parşömeni
items.consum.scrolls.exotic.exoticscroll.gyfu=egtozik GYFU parşömeni
items.consum.scrolls.exotic.exoticscroll.raido=egzotik RAIDO parşömeni
items.consum.scrolls.exotic.exoticscroll.isaz=egzotik ISAZ parşömeni
items.consum.scrolls.exotic.exoticscroll.mannaz=egzotik MANNAZ parşömeni
items.consum.scrolls.exotic.exoticscroll.naudiz=egzotik NAUDIZ parşömeni
items.consum.scrolls.exotic.exoticscroll.berkanan=egzotik BERKANAN iksiri
items.consum.scrolls.exotic.exoticscroll.odal=egzotik ODAL parşömeni
items.consum.scrolls.exotic.exoticscroll.tiwaz=egzotik TIWAZ parşömeni
items.consum.scrolls.exotic.exoticscroll.unknown_desc=Bu siyah parşömenin üzerine anlaşılamaz, parıldayan bir büyüsel rün yazılmış. Bu parşömen buralara yabancı gibi duruyor, sesli bir şekilde okunduğunda ne olacağını kim bilir?
items.consum.scrolls.exotic.exoticscroll.discover_hint=Bu eşyayı simya ile üretebilirsin.

items.consum.scrolls.exotic.scrollofsirenssong.name=deniz kızı şarkısı parşömeni
items.consum.scrolls.exotic.scrollofsirenssong.prompt=Hedef seçin
items.consum.scrolls.exotic.scrollofsirenssong.no_target=Parşomen bir hedef olmadan aktive oldu.
items.consum.scrolls.exotic.scrollofsirenssong.cancel=Bir hedef seçmek zorundasın.
items.consum.scrolls.exotic.scrollofsirenssong.desc=Bu parşömeni okumak hedef aldığın düşmanı köleleştirip sonsuza kadar müttefikin yapan baştan çıkarıcı bir melodi çıkarır! Melodiyi duyan diğer düşmanlar geçici süreliğine baştan çıkar.\n\nBazı güçlü düşmanlar köleleşmeye direnirler, bunun yerine baştan çıkarlar.
items.consum.scrolls.exotic.scrollofsirenssong$enthralled.name=büyülenmiş
items.consum.scrolls.exotic.scrollofsirenssong$enthralled.desc=Bu yaratık bir deniz kızı şarkısı parşömeninin büyüsüyle büyülenmiştir.\n\nBüyülenmiş bir karakter kalıcı olarak müttefikinizdir ve karşılaştığı tüm düşmanlarla savaşır.

items.consum.scrolls.exotic.scrollofantimagic.name=anti-büyü parşömeni
items.consum.scrolls.exotic.scrollofantimagic.desc=Bu parşömen üzerindeki büyü sizi, zararlı veya yararlı tüm büyü etkilerini geçici olarak engelleyen büyülü bir aura ile çevreleyecektir. Buna değnekler, parşömenler, yüzükler, eserler, büyüler ve lanetler gibi çoğu büyülü eşya etkisi dahildir. Ancak kahramanca zırh yetenekleri her şeye rağmen işe yarayacak kadar güçlüdür.

items.consum.scrolls.exotic.scrollofchallenge.name=meydan okuma parşömeni
items.consum.scrolls.exotic.scrollofchallenge.desc=Bu parşömen okunduğunda düşmanları okuyana çeken büyük bir kükreme çıkarır ve okuyanın etrafında küçük bir arena oluşturur.\n\nOkuyan arenanın içinde kaldığı sürece bütün kaynaklardan %33 daha az zarar alır(bu diğer bütün hasar azaltma şekillerinden önce uygulanır) ve acıkmaz.\n\nArenanın boyutu okuyanın bulunduğu alanın boyutuna bağlıdır. Bazı patron alanlarında epey küçük olabilir.
items.consum.scrolls.exotic.scrollofchallenge$challengearena.name=meydan okuma arenası
items.consum.scrolls.exotic.scrollofchallenge$challengearena.desc=Etrafınızda kırmızı bir sisle gösterilen büyülü bir arena belirdi.\n\nSisin içinde dururken açlığınız artmaz ve tüm kaynaklardan %%33 daha az hasar alırsınız. Başka hasar azaltma kaynaklarınız varsa (zırh gibi), bunlar %%33'lük azaltmadan sonra uygulanır.\n\nKalan turlar: %d.

items.consum.scrolls.exotic.scrollofdivination.name=sezgi parşömeni
items.consum.scrolls.exotic.scrollofdivination.nothing_left=Tanınacak hiçbir şey kalmadı!
items.consum.scrolls.exotic.scrollofdivination.desc=Bu parşömen, şu anda bilmediğiniz dört tür eşyayı rastgele belirleyecektir. Belirlenen türler bir iksirin rengi, bir parşömenin rünü veya bir yüzüğün taşı olabilir. Belirlenen eşyaların taşıdığınız eşyalar olması gerekmez.
items.consum.scrolls.exotic.scrollofdivination$wnddivination.desc=Sezgi parşömeni şu eşyaları tanıdı:

items.consum.scrolls.exotic.scrollofdread.name=dehşet parşömeni
items.consum.scrolls.exotic.scrollofdread.desc=Bu parşömen okunduğunda görüş alanındaki bütün düşmanları inanılmaz bir dehşete sokan kırmızı bir ışık yayar. Bu etki o kadar kuvvetlidir ki düşmanların çabucak, bir daha dönmemek üzere zindanı terkeder!\n\nTıpkı korku gibi, bu etki zamanla ya da düşman saldırıya uğradığında kaybolabilir.\n\nPatronlar gibi iradesi güçlü düşmanlar bunun yerine sıradan korkuya kapılır.

items.consum.scrolls.exotic.scrollofenchantment.name=efsunlama parşömeni
items.consum.scrolls.exotic.scrollofenchantment.inv_title=Bir eşyayı efsunla
items.consum.scrolls.exotic.scrollofenchantment.weapon=Silahına işlemek için bir efsun seç.
items.consum.scrolls.exotic.scrollofenchantment.armor=Zırhına işlemek için bir kabartma seç.
items.consum.scrolls.exotic.scrollofenchantment.cancel=iptal et
items.consum.scrolls.exotic.scrollofenchantment.cancel_warn=İptal etmek yine de büyü parşömeninizi tüketecektir, emin misiniz?
items.consum.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Evet, eminim.
items.consum.scrolls.exotic.scrollofenchantment.cancel_warn_no=Hayır, fikrimi değiştirdim
items.consum.scrolls.exotic.scrollofenchantment.desc=Bu parşömen bir silahı veya zırhı güçlü bir büyülü enerji ile işleyecektir. Okuyucu hangi büyünün işlendiği üzerine bile biraz kontrol sahibidir.

items.consum.scrolls.exotic.scrollofforesight.name=öngörü parşömeni
items.consum.scrolls.exotic.scrollofforesight.desc=Bu parşömeni okuduktan sonra etraftaki arazinin detayları okuyanın zihnine tam netlikte sürekli olarak verilir. Bu etki kayda değer bir süre devam eder, bütün gizli kapı ve tuzakları gösterir, bu esnada durup arama yapmak gereksizdir.

items.consum.scrolls.exotic.scrollofmetamorphosis.name=başkalaşım parşömeni
items.consum.scrolls.exotic.scrollofmetamorphosis.choose_desc=Başkalaşmak için bir yetenek seçin.
items.consum.scrolls.exotic.scrollofmetamorphosis.replace_desc=Başkalaşım geçirmiş yeteneğinizi değiştirmek için yeni bir yetenek seçin.
items.consum.scrolls.exotic.scrollofmetamorphosis.cancel_warn=İptal etmek yine de transmutasyon parşömeninizi tüketecektir, emin misiniz?
items.consum.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=başkalaşım yeteneği
items.consum.scrolls.exotic.scrollofmetamorphosis.desc=Bu parşömen, bir eşyayı değil büyüyü yapanı etkileyen güçlü bir dönüşüm büyüsü içermektedir. Bu büyü, kendine ait bir yeteneğini, başka sınıf bir kahramanın aynı düzeydeki 5 yeteneğinden biri ile değiştirebilmeni sağlar!\n\nBu etki yalnızca sınıf yeteneklerini kapsar, altsınıf ve zırhtan gelen yetenekleri değil. Kullanmana imkan olmayan yetenekler seçenek olarak sunulmayacaktır.

items.consum.scrolls.exotic.scrollofmysticalenergy.name=mistik enerji parşömeni
items.consum.scrolls.exotic.scrollofmysticalenergy.desc=Bu parşömenin içindeki çiğ büyüsel güç yayıldığı zaman bir kullanıcının kuşandığı eserleri zamanla şarj eder.

items.consum.scrolls.exotic.scrollofpassage.name=geçiş parşömeni
items.consum.scrolls.exotic.scrollofpassage.desc=Bu parşömenin üzerindeki büyü, okuyucuyu anında üstlerindeki en yakın birinci kat bölgesine taşıyor. Bir mağazaya hızlı bir şekilde ulaşmak için çok kullanışlı.

items.consum.scrolls.exotic.scrollofprismaticimage.name=prizmatik görüntü parşömeni
items.consum.scrolls.exotic.scrollofprismaticimage.desc=Bu parşömenin üzerindeki yazıt, okuyucunun ilüzyonik bir ikizini yaratacaktır. Bu prizmatik görüntü, okuyucu ile benzer defansa fakat daha az hp ve hasara sahip zayıf bir kopya olacak davranacaktır.\n\nBu prizmatik görüntü görünürde düşmanlar varken kendisini gösterecek ve okuyucuyu korumaya çalışacaktır.\n\nEğer bir prizmatik görüntü zaten yanında ise bu parşömeni okumak onu tamamen iyileştirecektir.

items.consum.scrolls.exotic.scrollofpsionicblast.name=psiyonik patlama parşömeni
items.consum.scrolls.exotic.scrollofpsionicblast.ondeath=Psionik Patlama zihnini paramparça etti...
items.consum.scrolls.exotic.scrollofpsionicblast.desc=Bu parşömende görünürdeki tüm yaratıkların zihinlerini paramparça edecek inanılmaz derecede yıkıcı bir enerji var.\n\nFakat bu parşömeni okumanın okuyucu için de bir karşılığı var,  okuyucu da hasar alacak, kör olacak ve zayıflayacak. Parşömen ne kadar fazla hedefe vurursa okuyucunun aldığı hasar o kadar azalacaktır.



###spells
items.consum.spells.alchemize.name=simyalaştır
items.consum.spells.alchemize.prompt=Bir Eşyayı Simyalaştır
items.consum.spells.alchemize.desc=Bu büyü bir simya kabında bulunanlara benzer dönüştürücü güçler içerir. Her kullanım, kullanıcının bir eşyayı (veya eşya yığınını) altına veya simya enerjisine dönüştürmesini sağlar. İksirleri veya parşömenleri enerjiye dönüştürmek onları tanımlayacaktır bile!\n\nDükkanlarda birkaç Simya kullanımı satılır, ancak bir tohum, rün taşı ve biraz simya enerjisi birleştirilerek simya kullanılarak çok daha fazlası yapılabilir.
items.consum.spells.alchemize$wndalchemizeitem.sell=%d altına çevir
items.consum.spells.alchemize$wndalchemizeitem.sell_1=1 tanesini %d altına çevir
items.consum.spells.alchemize$wndalchemizeitem.sell_all=Hepsini %d altına çevir
items.consum.spells.alchemize$wndalchemizeitem.energize=%d enerjiye çevir
items.consum.spells.alchemize$wndalchemizeitem.energize_1=1 tanesini %d enerjiye çevir
items.consum.spells.alchemize$wndalchemizeitem.energize_all=Hepsini %d enerjiye çevir

items.consum.spells.beaconofreturning.name=geri dönüş feneri
items.consum.spells.beaconofreturning.preventing=Bu mekanın güçlü büyüsel aurası seni büyüyü kullanmaktan alıkoyuyor.
items.consum.spells.beaconofreturning.creatures=Komşu yaratıkların ruhsal varlığı şu anda ışınlanmana izin vermiyor.
items.consum.spells.beaconofreturning.set=Lamba mevcut konuma koyuldu.
items.consum.spells.beaconofreturning.wnd_body=Bu yeri seçmek daha önce seçilen yerin yerini alır\n\nDönmeyi seçmek sizi son seçilen yere gönderir ve büyünün bir şarjını kullanır
items.consum.spells.beaconofreturning.wnd_set=Kur
items.consum.spells.beaconofreturning.wnd_return=Dön
items.consum.spells.beaconofreturning.desc_set=Bu fener Zindanın %d katında.
items.consum.spells.beaconofreturning.desc=Bu karışık büyü kullanana seçilen bir yere aradaki mesafe farketmeksizin geri dönme yeteneği bahşeder. Bu büyü sadece geri dönmekle tükenir, istenildiği kadar yer seçilebilir ama unutmayın sadece son seçilen yere dönersiniz.

items.consum.spells.curseinfusion.name=Lanet füzyonu
items.consum.spells.curseinfusion.inv_title=Bir eşyayı lanetle
items.consum.spells.curseinfusion.desc=Bu büyü, bir ekipman parçasına DM-300'de bulunan aynı güçlü kötücül büyüyü aşılar. Üzerinde kullanıldığı eşya derhal lanetlenir ve sahip olabileceği her türlü büyü veya glif geçersiz kılınır.\n\nSilahlar, zırhlar ve değnekler söz konusu olduğunda, eşya lanetlenmenin yanı sıra yükseltmeler de kazanacaktır. Lanet infüzyonu yükseltmeleri birikmez ve eşya lanetsiz hale gelirse yükseltmeler kaybolur.\n\nBir silah veya zırhın üzerindeki laneti değiştirmek için birden fazla lanet infüzyonu da kullanılabilir.

items.consum.spells.spell.ac_cast=YAP
items.consum.spells.spell.no_magic=Büyü bağışıklılığındayken büyü yapamazsın.
items.consum.spells.spell.discover_hint=Bu eşyayı simya ile üretebilirsin.

items.consum.spells.magicalinfusion.name=büyü füzyonu
items.consum.spells.magicalinfusion.inv_title=İşlemek için bir eşya seç
items.consum.spells.magicalinfusion.infuse=Eşyan, sırlı enerjiyle aşılandı!
items.consum.spells.magicalinfusion.desc=Bu büyü, bir yükseltme parşömeni ile aynı büyülü güce sahiptir, ancak daha kararlı bir biçimdedir.\n\nBir eşyayı normal şekilde yükseltmenin yanı sıra, bir büyüyü, glifi veya laneti asla silmeyecektir.

items.consum.spells.magicalporter.name=Sihirli Işınlayıcı
items.consum.spells.magicalporter.inv_title=Eşya ışınla
items.consum.spells.magicalporter.nowhere=Eşya ışınlayabileceğin bir yer yok
items.consum.spells.magicalporter.desc=Bu büyü üzerinde kullanıldığı her eşyayı ışınlar. Ama "Tüccarın Feneri"nin aksine eşyalar bir sonraki boss katının girişine ışınlanır.

items.consum.spells.phaseshift.name=Faz geçişi
items.consum.spells.phaseshift.no_target=Burada ışınlanacak bir yer yok.
items.consum.spells.phaseshift.desc=Bu kaotik büyü, hedef aldığı herhangi bir karakteri mevcut katta rastgele bir yere ışınlayacak ve onları önemli bir süre sersemletecek. Güçlü düşmanlar, çarpıcı etkiye direnebilecek. Bu büyü, bir hedefe veya kullanıcının kendisine yönlendirilebilir.

items.consum.spells.reclaimtrap.name=Tuzak Tutucu
items.consum.spells.reclaimtrap.no_trap=Orada tuzak yok.
items.consum.spells.reclaimtrap.desc_trap=Büyü şu anda bir _%s_ yi tetiklemeye hazır.
items.consum.spells.reclaimtrap.desc=Bu büyü DM-300'ün mekanik enerjisinin kalıntılarını içerir. Aktif bir tuzak üzerinde kullanıldığında, tuzağın gücü size bağlanır ve bu gücü dışarı atmak ve tuzağın etkisini istediğiniz herhangi bir yerde tetiklemek için büyüyü tekrar kullanmanıza izin verir.\n\nAncak, bazı tuzaklar her yerde çalışmayabilir ve aynı anda yalnızca bir tuzak saklanabilir.

items.consum.spells.recycle.name=Geri Dönüştürücü
items.consum.spells.recycle.inv_title=Bir eşyayı geri dönüştür
items.consum.spells.recycle.recycled=Bu eşya %s'e geri dönüştürüldü
items.consum.spells.recycle.desc=Bu büyü daha küçük bir değiştirici güce sahiptir. Ekipmanlarda çalışmaz. Parşömen, iksir, tohum, rüntaşı ya da uçlu dartları aynı tipte farklı bir eşyaya dönüştürür.

items.consum.spells.summonelemental.name=elemental çağır
items.consum.spells.summonelemental.ac_imbue=AŞILA
items.consum.spells.summonelemental.imbue_prompt=Bir eşya aşıla
items.consum.spells.summonelemental.desc=Bu büyü onu yapmak için kullanılan elementer közlerin enerjisini kanalize eder ve senine birlikte savaşması için dost bir elemental çağırmana izin verir! Tek seferde yalnızca bir elemental çağrılabilir, ancak elementali sana ücretsiz olarak geri vermek için büyü yeniden yapılabilir.
items.consum.spells.summonelemental.desc_newborn=Bu büyü şu anda yüksüzdür ve uzak mesafeli saldırısı olmayan bir _yeni doğan elemental_ çağırır. Büyüyü güçlendirmek için tanımlanmış bir sıvı alev iksiri, don iksiri, yeniden şarj etme parşömeni veya dönüşüm parşömeni aşılayabilir ve gelecekteki çağrıların tam güçlü bir elemental olmasına neden olabilirsiniz!
items.consum.spells.summonelemental.desc_fire=Büyü şu anda dokunulamayacak kadar sıcaktır, bir _ateş elementali_ çağıracaktır. Farklı bir eşyayı büyüye dahil edebilirsiniz, ancak büyü mevcut büyüsünü kaybedecektir.
items.consum.spells.summonelemental.desc_frost=Büyü şu anda dokunulamayacak kadar soğuktur, bir _don elementali_ çağıracaktır. Farklı bir eşyayı büyüye dahil edebilirsiniz, ancak büyü mevcut büyüsünü kaybedecektir.
items.consum.spells.summonelemental.desc_shock=Büyü şu anda statik enerji yayıyor, bir _şok elementali_ çağıracak. Farklı bir eşyayı büyüye dahil edebilirsiniz, ancak büyü mevcut büyüsünü kaybedecektir.
items.consum.spells.summonelemental.desc_chaos=Büyü şu anda kaotik enerji yayıyor, bir _kaos elementali_ çağıracak. Farklı bir eşyayı büyüye dahil edebilirsiniz, ancak büyü mevcut büyüsünü kaybedecektir.

items.consum.spells.targetedspell.prompt=Hedef seçin
items.consum.spells.targetedspell.inv_title=İşlemek için bir eşya seç

items.consum.spells.telekineticgrab.name=uzaktan tutuş
items.consum.spells.telekineticgrab.cant_grab=Onu tutamazsın.
items.consum.spells.telekineticgrab.no_target=Orada tutacak bir şey yok.
items.consum.spells.telekineticgrab.desc=Bu büyü, kullanıcının bir konumdaki tüm eşyaları veya bir düşmana saplanmış tüm fırlatma silahlarını uzaktan almasını sağlar!\n\nBaşkasının sahip olduğu eşyaları veya sandık gibi kapları almak için kullanılamaz.

items.consum.spells.unstablespell.name=dengesiz füzyon
items.consum.spells.unstablespell.desc=Bu küçük siyah kare kristalin her bir yüzeyinde değişen rünik semboller vardır.\n\nEtkinleştirildiğinde, rastgele bir parşömen etkisini tetikler. Parşömen etkisi, görüş alanınızda düşmanlar varsa her zaman savaş odaklı olacak, aksi takdirde her zaman savaş odaklı olmayacaktır.

items.consum.spells.wildenergy.name=Vahşi enerji
items.consum.spells.wildenergy.desc=Bu büyü DM-300'e güç vermiş lanetli enerjinin bir kısmını içeriyor. Kullanıldığında kahramanın üzerindeki değnekleri ve kuşanılmış büyülü eşyaları şarj eder ama rastgele bir lanetli değnek efekti devreye girer, bu etkiyi yönlendirebilirsiniz.


###runestones
items.consum.stones.inventorystone.ac_use=KULLAN

items.consum.stones.runestone$placeholder.name=Rüntaşı
items.consum.stones.runestone.discover_hint=Bu eşyayı zindanda rastgele bulabilirsin veya simya ile üretebilirsin.

items.consum.stones.stoneofaggression.name=saldırganlık taşı
items.consum.stones.stoneofaggression.desc=Bu taş bir düşmana yada bir dosta atıldığında yakınlardaki bütün düşmanlar kısa bir süreliğine ona saldırır.\n\nPatron düşmanlar direkt olarak hedef alınamaz ancak yardımcılarında ve kölelerinde hala işe yarar.
items.consum.stones.stoneofaggression$aggression.name=hedeflenmiş
items.consum.stones.stoneofaggression$aggression.desc=Manipülatif büyü, yakındaki tüm düşmanların bu karaktere saldırmayı tercih etmesini sağlıyor.\n\nKalan hamle sayısı: %s.

items.consum.stones.stoneofaugmentation.name=büyüme taşı
items.consum.stones.stoneofaugmentation.inv_title=Bir eşyayı yükselt
items.consum.stones.stoneofaugmentation.desc=Bu rün taşı, bir özelliği güçlendirirken başka birinden ödün vererek ekipmanı geliştirebilen güçlü bir sihir barındırır.\n\nBir silah üzerinde kullanıldığında, hız ya da hasar özelliklerinden birini geliştirmene olanak tanır.\nFırlatılabilir silahlar ayrıca hızlarına bağlı olarak dayanıklılık kazanabilir ya da kaybedebilir.\n\nBir zırh üzerinde kullanıldığında ise, savunma ya da kaçınma özelliklerinden biri geliştirilebilir.
items.consum.stones.stoneofaugmentation.discover_hint=Bu eşyayı mağazadan satın alabilir veya simya ile üretebilirsin.
items.consum.stones.stoneofaugmentation$wndaugment.choice=Bir özelliği arttırırsan diğeri azalır. Hangi özelliği yükseltmek istersin?
items.consum.stones.stoneofaugmentation$wndaugment.already=Bu eşya zaten yükseltilmiş, yükseltmenin özelliğini değiştirebilir veya tamamen kaldırabilirsin.
items.consum.stones.stoneofaugmentation$wndaugment.speed=+Hız -Hasar
items.consum.stones.stoneofaugmentation$wndaugment.damage=+Hasar -Hız
items.consum.stones.stoneofaugmentation$wndaugment.evasion=+Kaçınma -Savunma
items.consum.stones.stoneofaugmentation$wndaugment.defense= +Savunma -Kaçınma
items.consum.stones.stoneofaugmentation$wndaugment.none=Yükseltmeyi Kaldır
items.consum.stones.stoneofaugmentation$wndaugment.cancel=Boşver

items.consum.stones.stoneofblast.name=patlama taşı
items.consum.stones.stoneofblast.desc=Bu rüntaşı atıldığı yere değdiği an patlayacaktır. Aynı bir bomba gibi patlama çevresindekilere zarar verecektir.

items.consum.stones.stoneofblink.name=ışınlanma taşı
items.consum.stones.stoneofblink.desc=Bu rüntaşı kullanıcısını fırlatıldığı yere ışınlayacaktır.

items.consum.stones.stoneofclairvoyance.name=sağgörü taşı
items.consum.stones.stoneofclairvoyance.desc=Bu taş atıldığı anda geniş bir alandaki tüm zemini açığa çıkarır, bu etki duvarların ötesine de geçer.

items.consum.stones.stoneofdeepsleep.name=Derin Uyku Taşı
items.consum.stones.stoneofdeepsleep.desc=Bu taş bir düşmana atıldığında, onları tavuk gibi büyülü uykuya sokar. Sihirli bir şekilde uyuyan düşmanlar, dürtülene dek sonsuza kadar uyur.

items.consum.stones.stoneofdetectmagic.name=Büyü Saptama Taşı
items.consum.stones.stoneofdetectmagic.inv_title=Bir eşyanın lanetli olup olmadığını tespit et
items.consum.stones.stoneofdetectmagic.detected_none=Bu eşyaya etki eden bir büyü fark etmedin.
items.consum.stones.stoneofdetectmagic.detected_both=Bu eşyaya hem kötücül hem de pozitif büyünün etki ettiğini fark ediyorsun!
items.consum.stones.stoneofdetectmagic.detected_good=Bu eşyaya pozitif büyünün etki ettiğini fark ettin!
items.consum.stones.stoneofdetectmagic.detected_bad=Bu eşyaya kötücül büyünün etki ettiğini fark ettin!
items.consum.stones.stoneofdetectmagic.desc=Bu rün taşı bir eşyayı etkileyen büyüyü tespit edebilir. Bu taşı tanımlanamayan bir eşya üzerinde kullandığınızda, eşyanın kötü niyetli bir lanetten etkilenip etkilenmediğini ve bir büyü veya yükseltme gibi olumlu bir büyüden etkilenip etkilenmediğini anlarsınız.

items.consum.stones.stoneofdisarming.name=Etkisiz hale getirme taşı
items.consum.stones.stoneofdisarming.desc=Bu rün taşı içinde zindanda gizlenmiş kötü niyetli tuzakları imha eden bir büyüyü barındırmaktadır. Atıldığı alanda 9 birime kadar tuzak imha eder.

items.consum.stones.stoneofenchantment.name=efsunlama taşı
items.consum.stones.stoneofenchantment.inv_title=Bir eşyayı efsunla
items.consum.stones.stoneofenchantment.weapon=Silahın karanlıkta parlıyor!
items.consum.stones.stoneofenchantment.armor=Zırhın karanlıkta parlıyor!
items.consum.stones.stoneofenchantment.desc=Bu taş efsunlama sihrine sahip. Bir Yükseltme Tomarının aksine bir eşyanın gücünü direkt olarak yükseltmez, fakat bunun yerine bir zırha veya silahı bir büyüyle kaplayarak ona yeni bir güç kazandırır.

items.consum.stones.stoneoffear.name=korku taşı
items.consum.stones.stoneoffear.desc=Bu taş bir karakterin üzerine atıldığında dehşete kapılırlar ve dönüp kaçarlar. Kaçan bir karaktere saldırmak etkiyi kısaltır.

items.consum.stones.stoneofflock.name=sürü taşı
items.consum.stones.stoneofflock.desc=Bu rüntaşı fırlatıldığı bölgede kısa bir süreliğine büyülü bir koyun oluşturur.

items.consum.stones.stoneofintuition.name=sezgi taşı
items.consum.stones.stoneofintuition.inv_title=Bir eşya seç
items.consum.stones.stoneofintuition.desc=Bu rüntaşı tanımlama parşömeninin büyüsünün daha zayıf bir versiyonuna sahip. Kullanıldığı eşyayı direk tanımlamak yerine sezgilerinizle çalışır ve bir iksiri, parşömeni veya yüzüğü tahmin ederek tanımlamanızı sağlar.
items.consum.stones.stoneofintuition.break_info=Sezgi taşlarını biri kırılmadan önce iki kez kullanabilirsiniz, _sonraki kullanımınız bir taşı tüketmez_.
items.consum.stones.stoneofintuition.break_warn=Daha önce bir sezgi taşı kullandınız, _bu nedenle bundan sonraki kullanımınız bir taş tüketecektir_.
items.consum.stones.stoneofintuition$wndguess.text=Tanımlanmamış eşyanın tipini tahmin edin. Tahmininiz doğruysa, tip tanımlanır!
items.consum.stones.stoneofintuition$wndguess.correct=Doğru. Bu eşya tipi tanımlandı!
items.consum.stones.stoneofintuition$wndguess.incorrect=Tahminin yanlıştı.
items.consum.stones.stoneofintuition$wndguess.break=Sezgi taşı toz haline gelir.

items.consum.stones.stoneofshock.name=şok taşı
items.consum.stones.stoneofshock.desc=Bu rüntaşı yakındaki tüm düşmanları kısa süreliğine sersemleten bir elektriksel enerji salar ve fırlatan kişinin değneğini vurduğu her hedef için şarj artan bir şekilde şarj eder.


###trinkets
items.equipment.trinkets.chaoticcenser.name=kaotik rün
items.equipment.trinkets.chaoticcenser.spew=Buhurdanlığın boşalmak üzere: %s.
items.equipment.trinkets.chaoticcenser.desc=Simya kazanında biraz zaman geçirdikten sonra bu tütsü yakan buhurdan kendi kendine duman üretiyor gibi görünür! Bu gazlar birikir ve yarı rastgele aralıklarla buhurdanlıktan düşmanlara doğru püskürür. Her türlü gazı üretebilir gibi görünüyor, ancak buhurdan harekete geçmeden hemen önce bir anlık uyarı alacaksınız.
items.equipment.trinkets.chaoticcenser.typical_stats_desc=Genellikle bu tılsım, her _%d_ turda bir düşmanın yakınında zararlı bir gaz oluşturur. Gazlar yalnızca düşmanlar bulunduğunda görünür. Yüksek seviyelerde bu gazlar daha egzotik ve güçlü olma olasılığına sahiptir.
items.equipment.trinkets.chaoticcenser.stats_desc=Mevcut seviyesinde, bu tılsım yaklaşık her _%d_ turda bir düşmanın yakınında zararlı bir gaz ortaya çıkarır. Gazlar yalnızca düşmanlar mevcut olduğunda ortaya çıkar. Yüksek seviyelerde bu gazlar daha egzotik ve güçlü olma olasılığına sahiptir.

items.equipment.trinkets.crackedspyglass.name=çatlak dürbün
items.equipment.trinkets.crackedspyglass.desc=Bu el dürbünü, ön merceğindeki çatlak olmasaydı, mükemmel ve hassas işçiliğin bir örneği olurdu. Dürbün, zindandaki yeni öğeleri ortaya çıkararak size yardımcı oluyor gibi görünüyor, ancak kusuru nedeniyle ortaya çıkan öğeleri görmek oldukça zor!
items.equipment.trinkets.crackedspyglass.typical_stats_desc=Genellikle bu tılsım, patron olmayan her katta _%%%1$s şansla_ ekstra bir gizli öğe yaratır.
items.equipment.trinkets.crackedspyglass.stats_desc=Mevcut seviyesinde, bu tılsım her patron olmayan katta _%%%1$s şansla_ ekstra bir gizli öğe yaratır.
items.equipment.trinkets.crackedspyglass.stats_desc_upgraded=Mevcut seviyesinde, bu tılsım her patron olmayan katta _%%100 şansla_ ekstra bir gizli öğe ve _%%%1$s şansla_ ikinci bir ekstra gizli öğe yaratır.

items.equipment.trinkets.dimensionalsundial.name=boyutlu güneş saati
items.equipment.trinkets.dimensionalsundial.warning=Güneş saatin bir gölge düşürmüyor, tedirgin hissediyorsun.
items.equipment.trinkets.dimensionalsundial.desc=Bu küçük el güneş saati, siz onu dik tutmasanız bile bir şekilde zindanın derinliklerinde bir gölge oluşturabiliyor. Daha da tuhafı, gölgenin konumunun bu dünyadaki güneşle hiçbir ilişkisi yok gibi görünüyor. Gölge oluşmadığında, güneş saati tehlikeyi çekiyor gibi görünüyor.
items.equipment.trinkets.dimensionalsundial.typical_stats_desc=Tipik olarak bu tılsım, gerçek hayatta gündüz vakti (öö8-ös8) düşmanların ortaya çıkma oranını _%%%1$d_ azaltır ve gece vakti (ös8-öö8) düşmanların ortaya çıkma oranını _%%%2$d_ artırır.
items.equipment.trinkets.dimensionalsundial.stats_desc=Mevcut seviyesinde, bu tılsım gerçek hayatta gündüz vakti (öö8-ös8) düşmanların ortaya çıkma oranını _%%%1$d_ azaltacak ve gece vakti (ös8- öö8) düşmanların ortaya çıkma oranını _%%%2$d_ artıracaktır.

items.equipment.trinkets.exoticcrystals.name=egzotik kristaller
items.equipment.trinkets.exoticcrystals.desc=Bu küçük pembe kristaller simya enerjisi kristalleri ile aynı şekle sahiptir. Doğrudan enerji için kullanılamasalar da, bulduğunuz iksirleri ve parşömenleri bir şekilde etkiliyor gibi görünüyorlar.
items.equipment.trinkets.exoticcrystals.typical_stats_desc=Tipik olarak bu tılsım, iksir veya parşömen düşüşlerinin _%%%s_  egzotik eşdeğerleriyle değiştirecektir. Bu durum güç iksirlerini, yükseltme parşömenlerini veya tehlike odalarını çözmeye yardımcı olmak için üretilen eşyaları etkilemez.
items.equipment.trinkets.exoticcrystals.stats_desc=Mevcut seviyesinde bu tılsım, düşen iksir veya parşömenleri _%%%s_ oranında egzotik eşlenikleriyle değiştirecektir. Bu durum güç iksirlerini, yükseltme parşömenlerini veya tehlike odalarını çözmeye yardımcı olmak için üretilen eşyaları etkilemez.

items.equipment.trinkets.eyeofnewt.name=semender gözü
items.equipment.trinkets.eyeofnewt.desc=Bu altın ve siyah semender gözü, artık bir tılsım haline getirilmiş yaygın bir malzemedir. Göz, bir şeyleri başka şekillerde görmenize izin vermek karşılığında görüşünüzü azaltıyor gibi görünüyor.
items.equipment.trinkets.eyeofnewt.typical_stats_desc=Tipik olarak bu tılsım, görüş mesafeni _%1$s%%_ kadar düşürecek, fakat diğer yandan _%2$d_ karo yakınındaki düşmanlar için sana zihin görüşü sağlayacak.
items.equipment.trinkets.eyeofnewt.stats_desc=Bu seviyede iken bu tılsım senin görüş seviyeni _%1$s%%_ arttırır, ama ayrıca senin düşmanlar üzerindeki akıl okuma genişliğini _%2$d_ yapar.

items.equipment.trinkets.ferrettuft.name=Gelincik püskülü
items.equipment.trinkets.ferrettuft.desc=Limon yeşili bir kurdeleyle bağlanmış, ipeksi beyaz gelincik kürkünden yapılmış bir tutam. Gelincikler çeviklikleri, yaramazlıkları ve dürüstlükten yoksun olmalarıyla bilinirler. Bu gücün bir kısmı, bu tılsımdan yayılıyor gibi görünüyor ve yakınındaki her şeyden kaçmayı kolaylaştırıyor.
items.equipment.trinkets.ferrettuft.typical_stats_desc=Tipik olarak bu tılsım tüm karakterlerin kaçışını _%%%1$s_ artırır.
items.equipment.trinkets.ferrettuft.stats_desc=Mevcut seviyesinde bu tılsım tüm karakterlerin kaçışını _%%%1$s_ artırır.

items.equipment.trinkets.mimictooth.name=mimik dişi
items.equipment.trinkets.mimictooth.desc=Bu büyük ve keskin diş çok mutsuz bir taklitçiden alınmış olmalı. Görünüşe göre zindandaki taklitçileri daha yaygın ve daha tehlikeli yapıyor.
items.equipment.trinkets.mimictooth.typical_stats_desc=Tipik olarak bu tılsım bütün taklitçi çeşitlerini _%1$sx_ daha yaygın ve görmesini daha zor yapar, ama ayrıca düşürdükleri eşyalarıda arttırır. Her zindan katı _%2$s%%_ ihtimalle daha gizli bir abanoz taklitçi bulundurur.
items.equipment.trinkets.mimictooth.stats_desc=Tipik olarak bu tılsım bütün mimik çeşitlerini _%1$sx_ daha yaygın ve görmesini daha zor yapar, ama ayrıca düşürdükleri eşyalarıda arttırır. Her zindan katı _%2$s%%_ ihtimalle  extra gizli bir mimik bulundurur.

items.equipment.trinkets.mossyclump.name=yosun yığını
items.equipment.trinkets.mossyclump.desc=Bu ıslak yosun kümesi, ne kadar sıkarsanız sıkın nemini koruyor gibi görünüyor. Zindanın kendisine sihirli bir şekilde bağlı gibi görünüyor, bu da çim ve suyun ortaya çıkmasını daha olası hale getiriyor.
items.equipment.trinkets.mossyclump.typical_stats_desc=Bu tılsım genellikle temasız zeminlerin _%%%d_ oranındaki kısmının su ya da çimenle dolmasına neden olur.\n\nBu tılsımın yükseltilmesi daha fazla enerjiye mal olur.
items.equipment.trinkets.mossyclump.stats_desc=Mevcut seviyesinde bu tılsım, temasız zeminlerin _%%%d_ oranında su ya da çimenle dolmasını sağlayacaktır.\n\nBu tılsımın yükseltilmesi daha fazla enerjiye mal olur.

items.equipment.trinkets.parchmentscrap.name=parşömen parçası
items.equipment.trinkets.parchmentscrap.desc=Bu küçük parşömen parçası bir parşömene aitmiş gibi görünüyor. Büyüsünün bir kısmını korumuş ve zindanda bulunan silah ve zırhları etkiliyor gibi görünüyor.
items.equipment.trinkets.parchmentscrap.typical_stats_desc=Tipik olarak bu tılsım, büyüleri ve glifleri _%d kat_ daha yaygın hale getirirken, silahlar ve zırhlar üzerindeki lanetleri _%s kat_ daha yaygın hale getirir. Değnekler, yüzükler veya eserler üzerindeki lanetler bundan etkilenmez.\n\nBu tılsımın yükseltilmesi daha fazla enerjiye mal olur.
items.equipment.trinkets.parchmentscrap.stats_desc=Mevcut seviyesinde bu tılsım, büyüleri ve glifleri _%d kat_ daha yaygın hale getirecek ve silahlar ve zırhlar üzerindeki lanetleri _%s kat_ daha yaygın hale getirecektir. Değnekler, yüzükler veya eserler üzerindeki lanetler bundan etkilenmez.\n\nBu tılsımın yükseltilmesi daha fazla enerjiye mal olur.

items.equipment.trinkets.petrifiedseed.name=taşlaşmış tohum
items.equipment.trinkets.petrifiedseed.desc=Bu tohum ya yavaş jeolojik süreçler ya da büyü yoluyla fosilleşmiştir. Tohum, zindanın bitki örtüsünü sihirli bir şekilde etkiliyor gibi görünüyor ve zaman zaman bitki tohumlarını rün taşlarıyla değiştiriyor.
items.equipment.trinkets.petrifiedseed.typical_stats_desc=Normal koşullarda bu tılsım, _%1$s%%_ ihtimalle çiğnediğin otların tohum yerine rün taşı düşürmesini sağlar, ayrıca yüksek çalıların eşya düşürme ihtimalini _%2$s%%_  artırır.
items.equipment.trinkets.petrifiedseed.stats_desc=Bu tılsım mevcut seviyesinde, _%1$s%%_ ihtimalle çiğnenmiş otların tohumlar yerine rün taşlarını düşürmesine ve aynı zamanda _%2$s%%_ ihtimalle yüksek çimlerin daha sık eşya düşürmesine neden olacak.

items.equipment.trinkets.ratskull.name=fare kafatası
items.equipment.trinkets.ratskull.desc=Bu ürkütücü tılsım, bu zindanda bir şekilde nadir bulunan normal bir farenin kafatasından çok daha büyük değildir. Kafatasının büyülü etkisi, zindanın daha nadir sakinlerini kendine çekiyor ve onların çok daha sık görünmesini sağlıyor gibi görünüyor.
items.equipment.trinkets.ratskull.typical_stats_desc=Normal koşullarda bu tılsım, nadir egzotik düşmanların _%dx_ daha fazla ortaya çıkmasını sağlar. Ancak bu kafatası, çekici kristal mimiklerin ve zırhlı heykellerin ortaya çıkmasında sadece yarı yarıya daha az etkilidir.
items.equipment.trinkets.ratskull.stats_desc=Mevcut seviyesinde bu tılsım, nadir egzotik düşmanların ortaya çıkma olasılığını _%dx_ artıracaktır. Ancak kafatası kristal taklitçileri ve zırhlı heykelleri cezbetmede yarı yarıya etkilidir.

items.equipment.trinkets.saltcube.name=Tuz Küpü
items.equipment.trinkets.saltcube.desc=Bu büyük tuz kristali neredeyse mükemmel bir küp şeklinde kesilmiş ve bir şekilde simya kabındaki suyun yarısını eritmek yerine boşaltmayı başarmış. Görünüşe göre yediğiniz yiyecekleri sihirli bir şekilde kurutuyor ve koruyor, aldığınız tokluğu uzatıyor, ancak aynı zamanda açlıktan kıvranmadığınız da sağlığınızın yenilenmesini de azaltıyor.
items.equipment.trinkets.saltcube.typical_stats_desc=Genellikle bu tılsım acıkmadan önceki süreyi _%%%1$s_ oranında artırır, ancak zemin kilitli olmadığı sürece sağlık yenileme oranınızı da _%%%2$s_ oranında azaltır.
items.equipment.trinkets.saltcube.stats_desc=Mevcut seviyesinde bu tılsım, acıkmadan önceki süreyi _%%%1$s_ oranında artırır, ancak zemin kilitli değilse sağlık yenileme oranınızı da _%%%2$s_ oranında azaltır.

items.equipment.trinkets.shardofoblivion.name=unutuluş parçası
items.equipment.trinkets.shardofoblivion.desc=Bu küçük lanetli metal parçası simya kazanında kaynadıktan sonra değişerek... hiçbir şeyden yapılmaz hale geldi. Işık onun etrafında bükülüyor gibi görünüyor ve siz onu tutmadığınızda olduğu yerde asılı kalıyor. Parça cehaletinizden sihirli bir şekilde güç çekiyor gibi görünüyor, bu yüzden muhtemelen en iyisi bunun hakkında çok fazla düşünmemek.
items.equipment.trinkets.shardofoblivion.typical_stats_desc=Tipik olarak bu takı, taktığınız veya yakın zamanda kullandığınız tanımlanamayan her ekipman parçası için düşmanların ganimet düşürme oranını maksimum _%d eşya(lar)_'a kadar %%20 artıracaktır. Parça aynı zamanda ekipmanı tanımlamanızı da engeller, ancak hazır olan eşyaları el ile tanımak için kullanılabilir.
items.equipment.trinkets.shardofoblivion.stats_desc=Mevcut seviyesinde bu tılsım, kuşandığınız veya yakın zamanda kullandığınız tanımlanamayan her ekipman parçası için düşmanların ganimet düşürme oranını maksimum _%d eşya(lar)_'a kadar %%20 artıracaktır. Parça aynı zamanda ekipman tanımlamanızı engeller, ancak hazır olan eşyaları el ile tanımlamak için kullanılabilir.
items.equipment.trinkets.shardofoblivion.ac_identify=TANIMLA
items.equipment.trinkets.shardofoblivion.identify_prompt=Bir eşyayı tanımla
items.equipment.trinkets.shardofoblivion.identify_ready=Bir öğe tanımlanmaya hazırdır: %s. Tanımlamak için Unutuluş Parçası'nı üzerinde kullan.
items.equipment.trinkets.shardofoblivion.identify_ready_worn=Yıpranmış eşyalarınız artık tanımlanmaya hazır. Tanımlamak için eşyalar üzerinde Unutuluş Parçanızı kullanın.
items.equipment.trinkets.shardofoblivion.identify_not_yet=Bu eşya henüz tanımlamaya hazır değil.
items.equipment.trinkets.shardofoblivion.identify=Eşyayı tanımladın!
items.equipment.trinkets.shardofoblivion$wandusetracker.name=Tanımlanmamış Değnek Kullanıldı
items.equipment.trinkets.shardofoblivion$wandusetracker.desc=Kısa bir süre önce tanımlanamayan bir değnek kullandınız, bu da bir süreliğine unutuluş parçası için bir parça kullanılmış tanımlanamayan ekipman olarak sayılır.\n\nKalan hamle sayısı: %s.
items.equipment.trinkets.shardofoblivion$thrownusetracker.name=Tanımlanamayan Fırlatılabilir Silah Kullanıldı
items.equipment.trinkets.shardofoblivion$thrownusetracker.desc=Son zamanlarda tanımlanmamış bir fırlatılabilir silah kullandın. Bu, bir süreliğine unutuluş parçası için kullanılan tanımlanmamış ekipmandan biri sayılır.\n\nKalan hamle sayısı: %s.

items.equipment.trinkets.thirteenleafclover.name=on üç yapraklı yonca
items.equipment.trinkets.thirteenleafclover.desc=Her nasılsa simya kabında demlenmek bu yoncanın fazladan yapraklar çıkarmasına neden oldu! Bu tılsımı  şanslı mı yoksa şanssız mı olduğu pek belli değil, belki de bu tılsım şansınızı daha kaotik hale getirecektir?
items.equipment.trinkets.thirteenleafclover.typical_stats_desc=Tipik olarak bu tılsım, maksimum hasarı _%%%1$d_ oranında, minimum hasarı ise _%%%2$d_ oranında vermenize neden olur.
items.equipment.trinkets.thirteenleafclover.stats_desc=Mevcut seviyesinde bu tılsım, maksimum hasarı _%%%1$d_ oranında ve minimum hasarı _%%%2$d_ oranında vermenize neden olur.

items.equipment.trinkets.trapmechanism.name=tuzak mekanizması
items.equipment.trinkets.trapmechanism.desc=Zindanın tuzaklarından birinin çekirdek mekanizması, taşınabilmesi için zeminden dikkatlice oyulmuş. Zindanın kendisine sihirli bir şekilde bağlı gibi görünüyor, tehlikeli araziyi daha yaygın hale getiriyor ama aynı zamanda ona olan yakınlığınızı da artırıyor.
items.equipment.trinkets.trapmechanism.typical_stats_desc=Tipik olarak bu tılsım, temasız zeminlerin _%%%1$d_ oranının tuzaklarla ya da uçurumlarla dolmasına neden olur. Ek olarak, zindanın gizli tuzaklarının _%%%2$d_ oranındaki kısmı görünür hale gelir.
items.equipment.trinkets.trapmechanism.stats_desc=Mevcut seviyesinde bu tılsım, temasız zeminlerin _%%%1$d_ oranında tuzaklarla ya da uçurumlarla dolmasına neden olur. Ayrıca zindandaki gizli tuzakların _%%%2$d_ oranındaki kısmı görünür hale gelir.

items.equipment.trinkets.vialofblood.name=Kan şişesi
items.equipment.trinkets.vialofblood.desc=Bu ince şişe zindanda yaşayan birinin kanını içeriyor, şişeyi döndürdüğünüzde yavaşça hareket ediyor. Sihirli bir şekilde daha güçlü iyileştirme etkilerini artırıyor gibi görünüyor, ama aynı zamanda bu iyileşmenin gecikmesine de neden oluyor.
items.equipment.trinkets.vialofblood.typical_stats_desc=Bu tılsım genellikle iyileşme iksirleri, su tulumları veya sağlık kuyuları içerek kazandığınız toplam sağlığı _%%%1$s_ oranında artırır. Ancak bu iyileştirme etkileri daha yavaş gerçekleşir ve tur başına en fazla _%2$s_ HP yeniler (bu kahraman seviyesiyle ölçeklenir).
items.equipment.trinkets.vialofblood.stats_desc=Mevcut seviyesinde bu tılsım, iyileşme iksirleri, su tulumları veya sağlık kuyuları içerek kazandığınız toplam sağlığı _%%%1$s_ oranında artıracaktır. Bununla birlikte, bu iyileştirme etkileri daha yavaş gerçekleşecek ve tur başına en fazla _%2$s_ HP yenileyecektir (bu kahraman seviyesiyle ölçeklenir).

items.equipment.trinkets.wondrousresin.name=harikulade reçine
items.equipment.trinkets.wondrousresin.desc=Bu parıldayan mavi reçine, lanetli bir değneğin büyüsünün damıtılmış özüne sahip gibi görünüyor. Simya kabından gelen büyü onu biraz dengelemiş gibi görünüyor ve şimdi değneklerini etkiliyor.
items.equipment.trinkets.wondrousresin.typical_stats_desc=Tipik olarak bu tılsım, lanetli değnek etkilerini zamanın _%%%1$s_ oranında nötr veya pozitif olmaya zorlayacak ve lanetsiz değneklerin zamanın _%%%2$s_ oranında ek bir nötr veya pozitif lanetli zap atmasına neden olacaktır.\n\nBu tılsımın yükseltilmesi daha büyük miktarda enerjiye mal olur.
items.equipment.trinkets.wondrousresin.stats_desc=Mevcut seviyesinde bu tılsım, lanetli değnek etkilerini zamanın _%%%1$s_ oranında nötr veya pozitif olmaya zorlayacak ve lanetsiz değneklerin zamanın _%%%2$s_ oranında ek bir nötr veya pozitif lanetli zap atmasına neden olacaktır.\n\nBu tılsımın yükseltilmesi daha büyük miktarda enerjiye mal olur.

items.equipment.trinkets.trinketcatalyst.name=büyülü katalizör
items.equipment.trinkets.trinketcatalyst.window_title=tılsım oluştur
items.equipment.trinkets.trinketcatalyst.window_text=Katalizörü eklediğinde su parlamaya başlar. Yakında bulunan bazı eşyalar, enerjiyle aşılanarak sihirli bir tılsıma dönüştürülebilir.
items.equipment.trinkets.trinketcatalyst.desc=Bu büyülü altın tozu topu, zindanın karanlığında ışıltıyla parıldar. Bu katalizör, az miktarda simyasal enerjiyle birlikte simya kazanında kullanılarak benzersiz bir tılsım üretmek için kullanılabilir.\n\nTılsımlar, zindanı ya da içindekileri az da olsa değiştiren çeşitli etkiler sağlar. Daha fazla enerji kullanılarak güçlendirilebilir ya da etkisinden tamamen vazgeçmek için yere bırakılabilir.
items.equipment.trinkets.trinketcatalyst$randomtrinket.name=rastgele tılsım
items.equipment.trinkets.trinketcatalyst$randomtrinket.desc=Yakındaki bir eşya, açamadığınız bir kesenin içinde sıkışmış durumda.\n\nSimya işlemi keseyi çözecek, ancak bunu yapana kadar hangi tılsımı alacağınızı bilemeyeceksiniz!

items.equipment.trinkets.trinket.discover_hint=Simya yoluyla bir tılsım ürettiğinizde bu eşyanın bir seçenek olma şansı vardır.
items.equipment.trinkets.trinket$placeholder.name=tılsım

