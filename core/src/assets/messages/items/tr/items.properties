items.equipment.wands.wand.ac_zap=VUR
items.equipment.wands.wand.fizzles=Değneğin hiçbir şey yapmadı; yeterli şarjı olmasa gerek.
items.equipment.wands.wand.no_magic=Değneğin cızırdıyor; büyü bağışıklılığındayken değnekleri kullanamazsın.
items.equipment.wands.wand.self_target=Kendini hedef alamazsın!
