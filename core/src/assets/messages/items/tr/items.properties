items.equipment.armor.armor.seal_transfer=Savaşçının kırık mührünün fayda sağlaması için giymekte olduğu zırha takılı olması gerekir. Çıkardığın zırhtan otomatik olarak ayrılıp yerine giyiyor olduğun zırha takılmasını ister misin?
