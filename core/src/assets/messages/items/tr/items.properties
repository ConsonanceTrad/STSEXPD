items.equipment.artifacts.masterthievesarmband.desc_worn=Deneyim kazandıkça bileğinizdeki kol bandında güç biriktiğini hissedersiniz. Bu gücü dükkanlardan çalmak veya düşmanları soymak için kullanabilirsiniz!\n\nDüşmanları soymak anında gerçekleşir, onları kısa süreliğine şaşırtır ve size sahip oldukları ganimeti alma şansı verir! Bu güç farkında olmayan düşmanlara karşı daha etkilidir. Aynı düşmanı birden fazla kez soymak daha fazla ganimet şansı vermez.

