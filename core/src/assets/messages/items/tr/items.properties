items.equipment.artifacts.driedrose$ghosthero.seen_dm300_2=O şey kocaman...
items.equipment.artifacts.driedrose$ghosthero.seen_dm300_3=Bu şey bu zamana kadar nasıl etkin kaldı?
items.equipment.artifacts.driedrose$ghosthero.seen_king_1=İnsanlar güç yozlaştırır derken bunu kastederler.
items.equipment.artifacts.driedrose$ghosthero.seen_king_2=O artık kraldan çok ruhsuz bir büyücüye dönmüş.
