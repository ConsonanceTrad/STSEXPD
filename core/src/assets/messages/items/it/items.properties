items.equipment.weapon.melee.rapier.typical_ability_desc=La Duellante può lanciarsi con uno _stocco_ contro un nemico a 1 casella di distanza. Questo la muove verso il nemico, in genere infligge _%1$d-%2$d danni_ ed è garantito che colpisca.
