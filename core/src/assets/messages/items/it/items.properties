items.consum.scrolls.scroll.unknown_desc=Un'indecifrabile runa magica è scritta su questa pergamena. Chissà che effetto avrà quando letta ad alta voce?
items.consum.scrolls.scroll.blinded=Non puoi leggere una pergamena mentre sei accecato.
items.consum.scrolls.scroll.no_magic=Non puoi leggere una pergamena mentre sei immune alla magia.
items.consum.scrolls.scroll.cursed=Il tuo libro di magie maledetto ti impedisce di invocare la magia di questa pergamena! Tuttavia una pergamena di rimuovi maledizione potrebbe essere abbastanza forte da poter funzionare comunque...
items.consum.scrolls.scroll$placeholder.name=pergamena

items.consum.scrolls.inventoryscroll.warning=Vuoi davvero annullare questo utilizzo della pergamena? La pergamena non è stata identificata in precedenza, quindi verrà comunque consumata.
items.consum.scrolls.inventoryscroll.yes=Si, sono sicuro.
items.consum.scrolls.inventoryscroll.no=No, ho cambiato idea

items.consum.scrolls.scrollofidentify.name=pergamena dell'identificazione
items.consum.scrolls.scrollofidentify.inv_title=Identifica un oggetto
items.consum.scrolls.scrollofidentify.it_is=Il tuo oggetto è stato identificato: %s.
items.consum.scrolls.scrollofidentify.desc=Questa pergamena rivela in modo permanente tutti i segreti di un singolo oggetto.

items.consum.scrolls.scrolloflullaby.name=pergamena della ninna nanna
items.consum.scrolls.scrolloflullaby.sooth=La pergamena emette una rilassante melodia. Ti senti molto sonnolento.
items.consum.scrolls.scrolloflullaby.desc=Leggere questa pergamena sprigionerà una rilassante melodia che cullerà ogni ascoltatore verso un profondo sonno magico. Per il lettore e i suoi alleati il sonno sarà ristorativo.

items.consum.scrolls.scrollofmagicmapping.name=pergamena di mappatura magica
items.consum.scrolls.scrollofmagicmapping.layout=Ora conosci la struttura del piano.
items.consum.scrolls.scrollofmagicmapping.desc=Quando questa pergamena viene letta, un'immagine limpida si imprimerà nella tua memoria  rendendoti consapevole della struttura del piano, e rivelando tutti i segreti nascosti. La posizione di oggetti e creature rimarrà sconosciuta.

items.consum.scrolls.scrollofmirrorimage.name=pergamena dell'immagine speculare
items.consum.scrolls.scrollofmirrorimage.copies=La pergamena crea delle immagini speculari di te.
items.consum.scrolls.scrollofmirrorimage.no_copies=La pergamena prova a creare delle immagini speculari, ma non hanno spazio.
items.consum.scrolls.scrollofmirrorimage.desc=L'incantesimo di questa pergamena creerà due illusioni-clone del lettore. Queste immagini speculari si comportano come dei cloni più deboli del lettore e inseguiranno i loro nemici. Non possiedono robustezza tuttavia, e svaniranno subito dopo aver subito danno.

items.consum.scrolls.scrollofretribution.name=pergamena del castigo
items.consum.scrolls.scrollofretribution.blast=Una potente energia magica fuoriesce dalla pergamena!
items.consum.scrolls.scrollofretribution.desc=Questa pergamena contiene energia distruttiva che proietta all'esterno le sofferenze del lettore, incanalandole in un'esplosione di potere. Più il lettore è debole, maggiore saranno i danni causati. Se la tua salute è molto bassa questa pergamena può uccidere all'istante la maggior parte dei nemici.\n\nUsare questa pergamena ha un prezzo per l'utilizzatore: l'accecamento e l'indebolimento.

items.consum.scrolls.scrollofrage.name=pergamena della rabbia
items.consum.scrolls.scrollofrage.roar=La pergamena emette un furioso ruggito che echeggia attraverso il dungeon!
items.consum.scrolls.scrollofrage.desc=Quando letta ad alta voce, questa pergamena scatenerà un tremendo ruggito che attirerà tutti i nemici verso il lettore, rendendo furiosi quelli nelle immediate vicinanze.

items.consum.scrolls.scrollofrecharging.name=pergamena della ricarica
items.consum.scrolls.scrollofrecharging.surge=Un'ondata di energia scorre nel tuo corpo, energizzando le tue bacchette magiche!
items.consum.scrolls.scrollofrecharging.desc=Il puro potere magico racchiuso in questa pergamena caricherà tutte le tue bacchette nel tempo una volta utilizzato.

items.consum.scrolls.scrollofremovecurse.name=pergamena di rimuovi maledizione
items.consum.scrolls.scrollofremovecurse.inv_title=Purifica un oggetto
items.consum.scrolls.scrollofremovecurse.cleansed=Il tuo oggetto brilla di una luce purificante e un'energia malevola si disperde!
items.consum.scrolls.scrollofremovecurse.not_cleansed=Il tuo oggetto brilla di una luce purificante, ma non accade nulla.
items.consum.scrolls.scrollofremovecurse.spirit=La tua pergamena libera lo spirito tormentato!
items.consum.scrolls.scrollofremovecurse.desc=L'incantesimo in questa pergamena rimuoverà istantaneamente ogni maleficio da una singola arma, anello, bacchetta, armatura o artefatto.

items.consum.scrolls.scrollofteleportation.name=pergamena del teletrasporto
items.consum.scrolls.scrollofteleportation.tele=In un batter d'occhio sei stato teletrasportato in un'altra posizione del piano.
items.consum.scrolls.scrollofteleportation.no_tele=La magia di teletrasporto fallisce.
items.consum.scrolls.scrollofteleportation.cant_reach=Non puoi teletrasportarti là.
items.consum.scrolls.scrollofteleportation.prompt=Scegli un punto in cui teletrasportarti
items.consum.scrolls.scrollofteleportation.desc=L'incantesimo di questa pergamena trasporterà istantaneamente il lettore da qualche altra parte in questo piano. L'incantesimo privilegerà zone dove il lettore non è ancora stato ma non è capace di trasportarlo oltre porte chiuse o barricate. Può tuttavia rivelare porte nascoste che portano in nuove aree.

items.consum.scrolls.scrollofterror.name=pergamena del terrore
items.consum.scrolls.scrollofterror.none=La pergamena emette un brillante lampo di luce rossa.
items.consum.scrolls.scrollofterror.one=La pergamena emette un brillante lampo di luce rossa e %s fugge!
items.consum.scrolls.scrollofterror.many=La pergamena emette un brillante lampo di luce rossa e i mostri fuggono!
items.consum.scrolls.scrollofterror.desc=Quando viene letta, questa pergamena emette un lampo di luce rossa che travolge tutti i nemici nel tuo campo visivo, terrorizzandoli e facendoli fuggire. Attaccare un nemico in fuga abbrevia l'effetto.

items.consum.scrolls.scrolloftransmutation.name=pergamena della trasmutazione
items.consum.scrolls.scrolloftransmutation.inv_title=Trasmuta un oggetto
items.consum.scrolls.scrolloftransmutation.nothing=Non succede nulla di interessante.
items.consum.scrolls.scrolloftransmutation.morph=Il tuo oggetto si trasforma in qualcosa di diverso!
items.consum.scrolls.scrolloftransmutation.desc=Questa pergamena contiene una potente magia trasmutante. Quando usata su di un oggetto idoneo, esso verrà trasformato in un oggetto differente dello stesso tipo. La magia conserverà  miglioramenti, incantamenti e glifi. Pergamene e pozioni verranno trasmutate nel loro equivalente esotico e viceversa.

items.consum.scrolls.scrollofupgrade.name=pergamena del miglioramento
items.consum.scrolls.scrollofupgrade.inv_title=Migliora un oggetto
items.consum.scrolls.scrollofupgrade.weaken_curse=La pergamena del miglioramento indebolisce la maledizione sul tuo oggetto.
items.consum.scrolls.scrollofupgrade.remove_curse=La pergamena di miglioramento rimuove la maledizione dal tuo oggetto!
items.consum.scrolls.scrollofupgrade.desc=Questa pergamena migliorerà un singolo oggetto o set di armi da lancio. Delle bacchette aumenterà il danno e il numero di cariche, armi e armature infliggeranno e bloccheranno più danno, i set di armi da lancio verranno completamente riparati e resi più duraturi, e l'effetto degli anelli verrà intensificato.\n\nPuò anche indebolire o alcune volte completamente dissipare le maledizioni, sebbene non sia potente quanto una pergamena di rimuovi maledizione. Sfortunatamente, la magia di miglioramento può anche cancellare gli incantamenti o i glifi sull'equipaggiamento di livello superiore.



###exotic scrolls
items.consum.scrolls.exotic.exoticscroll.kaunan=Pergamena esotica "KAUNAN"
items.consum.scrolls.exotic.exoticscroll.sowilo=Pergamena esotica "SOWILO"
items.consum.scrolls.exotic.exoticscroll.laguz=Pergamena esotica "LAGUZ"
items.consum.scrolls.exotic.exoticscroll.yngvi=Pergamena esotica "YNGVI"
items.consum.scrolls.exotic.exoticscroll.gyfu=Pergamena esotica "GYFU"
items.consum.scrolls.exotic.exoticscroll.raido=Pergamena esotica "RAIDO"
items.consum.scrolls.exotic.exoticscroll.isaz=Pergamena esotica "ISAZ"
items.consum.scrolls.exotic.exoticscroll.mannaz=Pergamena esotica "MANNAZ"
items.consum.scrolls.exotic.exoticscroll.naudiz=Pergamena esotica "NAUDIZ"
items.consum.scrolls.exotic.exoticscroll.berkanan=Pergamena esotica "BERKANAN"
items.consum.scrolls.exotic.exoticscroll.odal=Pergamena esotica "ODAL"
items.consum.scrolls.exotic.exoticscroll.tiwaz=Pergamena esotica "TIWAZ"
items.consum.scrolls.exotic.exoticscroll.unknown_desc=Una brillante e indecifrabile runa magica è scritta su questa pergamena nera. Pare provenga da una terra straniera, chissà che effetto avrà quando letta ad alta voce?
items.consum.scrolls.exotic.exoticscroll.discover_hint=Puoi creare questo oggetto tramite l'alchimia.

items.consum.scrolls.exotic.scrollofsirenssong.name=pergamena del canto delle sirene
items.consum.scrolls.exotic.scrollofsirenssong.prompt=Scegli un bersaglio
items.consum.scrolls.exotic.scrollofsirenssong.no_target=La pergamena si attiva senza bersaglio.
items.consum.scrolls.exotic.scrollofsirenssong.cancel=Devi scegliere un bersaglio.
items.consum.scrolls.exotic.scrollofsirenssong.desc=Leggere questa pergamena produce una suadente melodia che incanta il nemico preso di mira facendolo diventare un allato in modo permanente! Gli altri nemici che la odono ne sono temporaneamente affascinati.
items.consum.scrolls.exotic.scrollofsirenssong$enthralled.name=affascinato
items.consum.scrolls.exotic.scrollofsirenssong$enthralled.desc=Questa creatura è sotto l'effetto della magia di una pergamena di Canto delle Sirene.\n\nI personaggi ammaliati sono alleati permanenti e combattono contro qualunque nemico essi incontrino.

items.consum.scrolls.exotic.scrollofantimagic.name=pergamena dell'anti-magia
items.consum.scrolls.exotic.scrollofantimagic.desc=L'incantesimo di questa pergamena ti circonderà di un'aura che blocca temporaneamente ogni effetto magico, sia benigno che dannoso. Questo include la maggior parte degli effetti magici come bacchette, pergamene, anelli, artefatti e maledizioni. Tuttavia, le abilità eroiche dell'armatura sono abbastanza forti da funzionare a prescindere.

items.consum.scrolls.exotic.scrollofchallenge.name=pergamena di sfida
items.consum.scrolls.exotic.scrollofchallenge.desc=Quando viene letta a voce alta, questa pergamena scatena un grande ruggito che attira dei nemici attorno a chi la usa ed allo stesso tempo crea una piccola arena attorno ad essi.\n\nDurante tutto il temp in cui il lettore rimane nell'arena, riceverà il 33% di danni in meno qualunque sia la loro origine (si applica prima di ogni altra forme di riduzione del danno)  e non perderanno sazietà.\n\nLe dimensioni dell'arena sono proporzionali a quelle dell'area in cui il lettore si trova: sarà particolarmente piccola in alcune aree nelle quali si trova un boss.
items.consum.scrolls.exotic.scrollofchallenge$challengearena.name=arena di sfida
items.consum.scrolls.exotic.scrollofchallenge$challengearena.desc=Intorno a te è apparsa un'arena magica, indicata da una fluttuante nebbia rossa.\n\nMentre sei nella nebbia, la tua fame non aumenterà e subirai 33%% danni in meno da tutte le fonti. Se disponi di altre fonti di riduzione del danno (come l'armatura), queste si applicheranno dopo la riduzione di 33%%.\n\nTurni rimanenti: %d.

items.consum.scrolls.exotic.scrollofdivination.name=pergamena della divinazione
items.consum.scrolls.exotic.scrollofdivination.nothing_left=Non c'è rimasto niente da identificare!
items.consum.scrolls.exotic.scrollofdivination.desc=Questa pergamena identificherà casualmente quattro tipi di oggetti che al momento non conosci. I tipi identificati possono essere il colore di una pozione, la runa di una pergamena o la gemma di un anello. Gli oggetti identificati non saranno necessariamente quelli che stai trasportando.
items.consum.scrolls.exotic.scrollofdivination$wnddivination.desc=La tua pergamena di divinazione ha identificato i seguenti oggetti:

items.consum.scrolls.exotic.scrollofdread.name=pergamena del terrore
items.consum.scrolls.exotic.scrollofdread.desc=Quando viene letta, questa pergamena emete un lampo di luce che instilla un incredibile terrore in tutti i nemici che si trovano nel tuo campo visivo. L'effetto è così grande che essi cercheranno di fuggire rapidamente ed abbandoneranno per sempre il dungeon!\n\nCome nel caso del normale Terrore, l'effetto può  svanire col passare del tempo o se il nemico viene attaccato.\n\nI nemici dalla grande forza di volontà, come i boss, saranno presi dal normale terrore

items.consum.scrolls.exotic.scrollofenchantment.name=pergamena dell'incantamento
items.consum.scrolls.exotic.scrollofenchantment.inv_title=Incanta un oggetto
items.consum.scrolls.exotic.scrollofenchantment.weapon=Seleziona un incantamento da applicare alla tua arma.
items.consum.scrolls.exotic.scrollofenchantment.armor=Seleziona un glifo da applicare alla tua armatura.
items.consum.scrolls.exotic.scrollofenchantment.cancel=annulla
items.consum.scrolls.exotic.scrollofenchantment.cancel_warn=L'annullamento consumerà comunque la tua pergamena dell'incantesimo, sei sicuro?
items.consum.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Sì, sono sicuro
items.consum.scrolls.exotic.scrollofenchantment.cancel_warn_no=No, ho cambiato idea
items.consum.scrolls.exotic.scrollofenchantment.desc=Questa pergamena infonderà un'arma o un'armatura con una potente energia magica. Il lettore ha persino qualche capacità di controllo sul tipo di magia infusa.

items.consum.scrolls.exotic.scrollofforesight.name=pergamena della preveggenza
items.consum.scrolls.exotic.scrollofforesight.desc=Dopo aver letto questa pergamena, i dettagli del terreno saranno percepiti in modo molto nitido dalla mente del lettore. L'effetto dura per un tempo considerevole e rivela tutte le trappole e le porte segrete, rendendo la ricerca non più necessaria.

items.consum.scrolls.exotic.scrollofmetamorphosis.name=pergamena di metamorfosi
items.consum.scrolls.exotic.scrollofmetamorphosis.choose_desc=Scegli un talento da trasformare
items.consum.scrolls.exotic.scrollofmetamorphosis.replace_desc=Scegli un nuovo talento da sostituire a quello che hai trasformato.
items.consum.scrolls.exotic.scrollofmetamorphosis.cancel_warn=L'annullamento consumerà comunque la tua pergamena della metamorfosi, sei sicuro?
items.consum.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=Trasforma talento
items.consum.scrolls.exotic.scrollofmetamorphosis.desc=Questa pergamena contiene una potente magia di trasmutazione, che si applica al lettore anziché ad un oggetto. La magia di questa pergamena ti permette di scegliere un talento e sostituirlo con uno di cinque dello stesso livello da diverse classi di Eroi!\n\nQuesto effetto si applica solo ai talenti della classe, non a quelli guadagnati dalle sottoclassi o dalle abilità dell'armatura. Non ti sarà proposta la scelta di talenti che non puoi utilizzare.

items.consum.scrolls.exotic.scrollofmysticalenergy.name=pergamena di energia mistica
items.consum.scrolls.exotic.scrollofmysticalenergy.desc=Il primordiale potere magico legato a questa pergamena ricaricherà, quando rilasciato, tutti gli artefatti nel corso del tempo.

items.consum.scrolls.exotic.scrollofpassage.name=pergamena del varco
items.consum.scrolls.exotic.scrollofpassage.desc=L'incantesimo su questa pergamena trasporta istantaneamente il lettore al primo piano della regione. Molto comoda per raggiungere rapidamente un negozio.

items.consum.scrolls.exotic.scrollofprismaticimage.name=pergamena dell'immagine prismatica
items.consum.scrolls.exotic.scrollofprismaticimage.desc=L'incantesimo di questa pergamena creerà una variopinta illusione-clone del lettore. Questa immagine prismatica si comporta come un clone più debole del lettore, con difesa simile ma minore salute e capacità offensiva.\n\nL'immagine prismatica si rivelerà quando i nemici saranno presenti e tenterà di difendere il lettore.\n\nSe un'immagine prismatica esiste già, usare questa pergamena la guarirà completamente.

items.consum.scrolls.exotic.scrollofpsionicblast.name=pergamena di esplosione psionica
items.consum.scrolls.exotic.scrollofpsionicblast.ondeath=L'esplosione psionica fa a pezzi la tua mente...
items.consum.scrolls.exotic.scrollofpsionicblast.desc=Questa pergamena contiene un'incredibile energia distruttiva che può essere canalizzata in modo da fare a pezzi le menti di tutte le creature visibili.\n\nC'è un rilevante effetto collaterale comunque e il lettore verrà anch'esso danneggiato, accecato e indebolito. Più bersagli colpisce la pergamena, meno danni auto-inflitti verranno ricevuti.



###spells
items.consum.spells.alchemize.name=alchimizzazione
items.consum.spells.alchemize.prompt=Alchimizza un oggetto
items.consum.spells.alchemize.desc=Questo incantesimo contiene poteri trasmutativi simili a quelli che si trovano in un calderone alchemico. Ogni lancio consente all'utente di trasformare un oggetto (o una pila di oggetti) in oro o energia alchemica. Trasformare pozioni o pergamene in energia li identificherà!\n\nAlcuni usi dell'Alchimizzazione vengono venduti nei negozi, ma molti altri possono essere realizzati utilizzando l'alchimia combinando un seme, una pietra runica e un po' di energia alchemica.
items.consum.spells.alchemize$wndalchemizeitem.sell=Convertine 1 in %dg
items.consum.spells.alchemize$wndalchemizeitem.sell_1=Convertine 1 in %dg
items.consum.spells.alchemize$wndalchemizeitem.sell_all=Converti tutti in %dg
items.consum.spells.alchemize$wndalchemizeitem.energize=Trasforma in %d di energia
items.consum.spells.alchemize$wndalchemizeitem.energize_1=Trasforma 1 in %d di energia
items.consum.spells.alchemize$wndalchemizeitem.energize_all=Trasforma tutto in %d energia

items.consum.spells.beaconofreturning.name=faro del ritorno
items.consum.spells.beaconofreturning.preventing=La forte aura magica di questo luogo ti impedisce di usare la formula magica!
items.consum.spells.beaconofreturning.creatures=L'aura psichica delle creature circostanti non ti permette di teletrasportarti in questo momento.
items.consum.spells.beaconofreturning.set=Il faro è impostato con successo alla tua posizione attuale.
items.consum.spells.beaconofreturning.wnd_body=Impostarlo sovrascriverà la posizione precedentemente salvata dal faro.\n\nRitornare ti riporterà alla tua ultima posizione impostata e consumerà un uso della formula magica.
items.consum.spells.beaconofreturning.wnd_set=Imposta
items.consum.spells.beaconofreturning.wnd_return=Ritorna
items.consum.spells.beaconofreturning.desc_set=Questo faro è stato impostato da qualche parte nel piano %d.
items.consum.spells.beaconofreturning.desc=Questa complicata magia permette a chi la usa l'abilità di ritornare in un luogo impostato, a prescindere dalla distanza. La magia verrà consumata solo al ritorno e può essere impostata quante volte vorrai, ma ricorderà solamente l'ultima posizione assegnata.

items.consum.spells.curseinfusion.name=infusione del maleficio
items.consum.spells.curseinfusion.inv_title=Maledici un oggetto
items.consum.spells.curseinfusion.desc=Questa magia infonde un pezzo di equipaggiamento con la stessa potente magia maligna presente all'interno di DM-300. L'oggetto su cui viene utilizzata sarà immediatamente maledetto e qualsiasi incantesimo o glifo che potesse avere verrà sovrascritto.\n\nNel caso di armi, armature e bacchette, l'oggetto otterrà potenziamenti oltre ad essere maledetto. I potenziamenti dell'infusione maledetta non si accumulano e vengono persi se l'oggetto diventa non maledetto.\n\nÈ anche possibile utilizzare più infusioni maledette per cambiare la maledizione su un'arma o un'armatura.

items.consum.spells.spell.ac_cast=LANCIA
items.consum.spells.spell.no_magic=Non puoi lanciare magie mentre sei immune alla magia.
items.consum.spells.spell.discover_hint=Puoi creare questo oggetto tramite l'alchimia.

items.consum.spells.magicalinfusion.name=infusione magica
items.consum.spells.magicalinfusion.inv_title=Infondi un oggetto
items.consum.spells.magicalinfusion.infuse=Il tuo oggetto viene infuso con magia arcana!
items.consum.spells.magicalinfusion.desc=Questo incantesimo possiede lo stesso potere magico di una pergamena di potenziamento, ma in una forma più stabile.\n\nOltre a potenziare un oggetto, infatti, non cancellerà mai un incantesimo, un glifo o una maledizione.

items.consum.spells.magicalporter.name=facchino magico
items.consum.spells.magicalporter.inv_title=Trasporta un oggetto
items.consum.spells.magicalporter.nowhere=Non c'è nessun posto in cui tu possa trasportare l'oggetto.
items.consum.spells.magicalporter.desc=Questa formula magica trasporterà qualunque oggetto su di cui viene lanciata. Diversamente dal faro del mercante comunque, l'oggetto verrà trasportato all'entrata del successivo livello del boss.

items.consum.spells.phaseshift.name=cambio di fase
items.consum.spells.phaseshift.no_target=Non c'è niente da teletrasportare lì.
items.consum.spells.phaseshift.desc=Questa caotica formula magica teletrasporterà qualunque personaggio bersagliato in un luogo casuale del piano attuale, stordendoli per un prolungato periodo di tempo. Nemici potenti saranno in grado di resistere l'effetto stordente. Questa magia può venire direzionata su di un bersaglio o sull'utilizzatore stesso.

items.consum.spells.reclaimtrap.name=bonifica trappola
items.consum.spells.reclaimtrap.no_trap=Non c'è nessuna trappola lì.
items.consum.spells.reclaimtrap.desc_trap=l'incantesimo è attualmente pronto per utilizzare un _%s._
items.consum.spells.reclaimtrap.desc=Questo incantesimo contiene i resti dell'energia meccanica di DM-300. Quando lanciato su una trappola attiva, il potere della trappola verrà immagazzinato in te, permettendoti di utilizzare di nuovo l'incantesimo per rilasciare questo potere e attivare l'effetto della trappola in un punto a tua scelta.\n\nComunque sia, alcune trappole potrebbero non funzionare in alcuni luoghi, e può essere immagazzinata solo una trappola per volta.

items.consum.spells.recycle.name=riciclo
items.consum.spells.recycle.inv_title=Ricicla un oggetto
items.consum.spells.recycle.recycled=Il tuo oggetto è stato riciclato in: %s.
items.consum.spells.recycle.desc=Quest'incantesimo possiede una forma più debole di trasmutazone magica. Non funziona sugli equipaggiamenti ma può trasformare una pergamena, una pozione, un seme, una pietra runica o un dardo imbevuto in un oggetto a caso dello stesso tipo.

items.consum.spells.summonelemental.name=evocazione elementale
items.consum.spells.summonelemental.ac_imbue=INSTILLA
items.consum.spells.summonelemental.imbue_prompt=Impregna un oggetto
items.consum.spells.summonelemental.desc=Quest'incantesimo incanala l'energia delle braci elementali usate per crearlo e ti consente di evocare un elementale amico che combatterà con te! Puoi evocare un solo elementale alla volta, ma l'incantesimo può essere ri-lanciato per far ritornare l'elementale da te senza costo.
items.consum.spells.summonelemental.desc_newborn=L'incantesimo non è stato infuso ed evocherà un _elementale neonato_ senza un attacco a distanza. Puoi infondere l'incantesimo in una pozione del Fuoco Liquido o del Ghiaccio, oppure in una pergamena della Ricarica o della Trasmutazione per potenziarlo, in modo che la sua futura evocazione sarà un elementale dotato di tutti i poteri!
items.consum.spells.summonelemental.desc_fire=L'incantesimo è attualmente caldo al tatto, evocherà un _elementale del fuoco_. Puoi infondere un oggetto diverso, ma l'incantesimo perderà l'infusione attuale.
items.consum.spells.summonelemental.desc_frost=L'incantesimo è attualmente freddo al tatto e evocherà un _elementale del gelo_. Puoi infondere un oggetto diverso, ma l'incantesimo perderà l'infusione attuale.
items.consum.spells.summonelemental.desc_shock=L'incantesimo attualmente irradia energia statica, evocherà un _elementale shock_. Puoi infondere un oggetto diverso, ma l'incantesimo perderà l'infusione attuale.
items.consum.spells.summonelemental.desc_chaos=L'incantesimo attualmente irradia energia caotica, evocherà un _elementale del caos_. Puoi infondere un oggetto diverso, ma l'incantesimo perderà l'infusione attuale.

items.consum.spells.targetedspell.prompt=Scegli un bersaglio
items.consum.spells.targetedspell.inv_title=Infondi un oggetto

items.consum.spells.telekineticgrab.name=presa telecinetica
items.consum.spells.telekineticgrab.cant_grab=Non puoi afferrarlo.
items.consum.spells.telekineticgrab.no_target=Non c'è niente da afferrare lì.
items.consum.spells.telekineticgrab.desc=Quest'incantesimo consente a chi lo pronuncia di afferrare da lontano ogni oggetto in un certo punto oppure ogni arma da lancio conficcata in un nemico!\n\nNon si può usare per attrarre a sé oggetti che qualcun altro possiede né contenitori come le casse.

items.consum.spells.unstablespell.name=incantesimo instabile
items.consum.spells.unstablespell.desc=Questo piccolo cristallo quadrato nero presenta simboli runici mobili su ciascuna delle sue superfici.\n\nQuando attivato, attiverà l'effetto di una pergamena casuale. L'effetto della pergamena sarà sempre focalizzato sul combattimento se ci sono nemici nel tuo campo visivo, altrimenti sarà sempre non focalizzato sul combattimento.

items.consum.spells.wildenergy.name=energia selvaggia
items.consum.spells.wildenergy.desc=Questa formula magica contiene un po' dell'energia malefica che alimenta DM-300. Quando lanciata ricaricherà le tue bacchette e i tuoi artefatti consunti, scatenando inoltre un effetto di bacchetta maledetta casuale. Sei comunque in grado di scegliere una direzione di lancio del maleficio.


###runestones
items.consum.stones.inventorystone.ac_use=USA

items.consum.stones.runestone$placeholder.name=pietra runica
items.consum.stones.runestone.discover_hint=Puoi trovare questo oggetto casualmente nel dungeon, o crearlo tramite l'alchimia.

items.consum.stones.stoneofaggression.name=pietra dell'aggressività
items.consum.stones.stoneofaggression.desc=Quando la pietra viene lanciata su un'alleato o un nemico, tutti i nemici nelle vicinanze preferiranno attaccare quel personaggio per un corto periodo di tempo.\n\nTuttavia, questo effetto non funziona direttamente sui boss nemici, ma funziona sui loro minion.
items.consum.stones.stoneofaggression$aggression.name=preso di mira
items.consum.stones.stoneofaggression$aggression.desc=Della magia manipolativa sta inducendo tutti i nemici nelle vicinanze a preferire di colpire questo personaggio.\n\nTurni rimanenti: %s.

items.consum.stones.stoneofaugmentation.name=pietra dell'incremento
items.consum.stones.stoneofaugmentation.inv_title=Incrementa un oggetto
items.consum.stones.stoneofaugmentation.desc=Questa pietra runica possiede una potente magia che può incrementare l'equipaggiamento per migliorare una proprietà al costo di un'altra.\n\nUsandola su di un'arma ti permetterà di migliorarne la velocità o il danno. Inoltre le armi da lancio otterranno o perderanno durabilità in proporzione alla loro velocità.\n\nUsandola su di un'armatura ti permetterà di migliorarne la difesa o l'evasività.
items.consum.stones.stoneofaugmentation.discover_hint=Puoi comprare questo oggetto in un negozio, o crearlo tramite l'alchimia.
items.consum.stones.stoneofaugmentation$wndaugment.choice=Incrementare una proprietà ridurrà l'altra. Quale proprietà vuoi incrementare?
items.consum.stones.stoneofaugmentation$wndaugment.already=Quest'oggetto è gia incrementato, puoi cambiare l'incremento o rimuoverlo.
items.consum.stones.stoneofaugmentation$wndaugment.speed=+Velocità -Danni
items.consum.stones.stoneofaugmentation$wndaugment.damage=+Danni -Velocità
items.consum.stones.stoneofaugmentation$wndaugment.evasion=+Evasione -Difesa
items.consum.stones.stoneofaugmentation$wndaugment.defense=+Difesa -Evasione
items.consum.stones.stoneofaugmentation$wndaugment.none=Rimuovi Incremento
items.consum.stones.stoneofaugmentation$wndaugment.cancel=Lascia perdere

items.consum.stones.stoneofblast.name=pietra dell'esplosione
items.consum.stones.stoneofblast.desc=Questa pietra runica esploderà immediatamente nel luogo in cui è lanciata. Proprio come una bomba, l'esplosione arrecherà danno a qualunque cosa vicina.

items.consum.stones.stoneofblink.name=pietra del guizzo
items.consum.stones.stoneofblink.desc=Questa pietra runica teletrasporterà l'utilizzatore nel posto in cui viene lanciata.

items.consum.stones.stoneofclairvoyance.name=pietra della chiaroveggenza
items.consum.stones.stoneofclairvoyance.desc=Questa pietra rivelerà istantaneamente ogni casella in un'ampia area attorno al luogo di lancio. I suoi effetti si estenderanno perfino attraverso i muri.

items.consum.stones.stoneofdeepsleep.name=pietra del sonno profondo
items.consum.stones.stoneofdeepsleep.desc=Quando questa pietra viene gettata contro un nemico, esso piomberà in un profondo sonno magico. I nemici addormentati magicamente dormiranno per sempre, finché non saranno disturbati.

items.consum.stones.stoneofdetectmagic.name=pietra di individuazione della magia
items.consum.stones.stoneofdetectmagic.inv_title=Rivela un oggetto
items.consum.stones.stoneofdetectmagic.detected_none=Non rilevi alcuna magia che influisca su questo oggetto.
items.consum.stones.stoneofdetectmagic.detected_both=Rilevi sia la magia positiva che quella malevola che influenzano questo oggetto!
items.consum.stones.stoneofdetectmagic.detected_good=Rilevi la magia positiva che influenza questo oggetto!
items.consum.stones.stoneofdetectmagic.detected_bad=Rilevi una magia malevola che colpisce questo oggetto!
items.consum.stones.stoneofdetectmagic.desc=Questa pietra runica è in grado di rilevare la magia che influenza un oggetto. Usare questa pietra su un oggetto non identificato ti dirà se è affetto da una maledizione malevola e se è affetto da magia positiva come un incantesimo o potenziamenti.

items.consum.stones.stoneofdisarming.name=pietra del disarmo
items.consum.stones.stoneofdisarming.desc=Questa pietra runica contiene magia che può disinnescare le trappole dannose nascoste ovunque nel dungeon. Disarmerà fino a 9 trappole attorno all'area in cui viene lanciata.

items.consum.stones.stoneofenchantment.name=pietra dell'incantamento
items.consum.stones.stoneofenchantment.inv_title=Incanta un oggetto
items.consum.stones.stoneofenchantment.weapon=La tua arma brilla nell'oscurità!
items.consum.stones.stoneofenchantment.armor=La tua armatura brilla nell'oscurità!
items.consum.stones.stoneofenchantment.desc=Questa pietra runica possiede una magia incantante. A differenza di una pergamena di miglioramento, non aumenterà la potenza diretta di un oggetto ma piuttosto instillerà un'arma o un'armatura con un incantamento, assegnandole un nuovo potere.

items.consum.stones.stoneoffear.name=pietra della paura
items.consum.stones.stoneoffear.desc=Quando questa pietra viene gettata contro un personaggio, esso sarà sopraffatto dal terrore e fuggirà. Attaccare un personaggio in fuga riduce la durata dell'effetto.

items.consum.stones.stoneofflock.name=pietra del gregge
items.consum.stones.stoneofflock.desc=Questa pietra runica evoca pecore magiche nella posizione di destinazione per un breve periodo.

items.consum.stones.stoneofintuition.name=pietra dell'intuizione
items.consum.stones.stoneofintuition.inv_title=Seleziona un oggetto
items.consum.stones.stoneofintuition.desc=Questa pietra runica contiene una versione più debole della magia che si trova nelle pergamene di identificazione. Invece di identificare direttamente un oggetto, funzionerà sul tuo intuito permettendoti di provare a identificare una pozione, pergamena o anello tirando a indovinare.
items.consum.stones.stoneofintuition.break_info=Puoi usare le pietre dell'intuizione due volte prima che una si rompa, _il tuo prossimo utilizzo non consumerà una pietra_.
items.consum.stones.stoneofintuition.break_warn=Hai usato una pietra dell'intuizione in precedenza, quindi _il tuo prossimo utilizzo consumerà una pietra_.
items.consum.stones.stoneofintuition$wndguess.text=Indovina la natura dell'oggetto sconosciuto. Se la supposizione è corretta, verrà identificato!
items.consum.stones.stoneofintuition$wndguess.correct=Corretto. L'oggetto è stato identificato!
items.consum.stones.stoneofintuition$wndguess.incorrect=La tua ipotesi era sbagliata.
items.consum.stones.stoneofintuition$wndguess.break=La tua pietra dell'intuizione si sbriciola in polvere...

items.consum.stones.stoneofshock.name=pietra della scossa
items.consum.stones.stoneofshock.desc=Questa pietra runica scatena una tempesta elettrica che stordirà brevemente ogni bersaglio vicino e donerà al lanciatore carica per le bacchette per ogni bersaglio colpito.


###trinkets
items.equipment.trinkets.chaoticcenser.name=incensiere caotico
items.equipment.trinkets.chaoticcenser.spew=Il tuo incensiere sta per emettere: %s.
items.equipment.trinkets.chaoticcenser.desc=Dopo un po' di tempo nel vaso dell'alchimia, questo incensiere sembra produrre fumo da solo! Questi gas si accumulano e fuoriescono dall'incensiere in direzioni casuali e a intervalli semi-casuali. Sembra in grado di produrre tutti i tipi di gas, ma avrai un avvertimento poco prima che l'incensiere si attivi.
items.equipment.trinkets.chaoticcenser.typical_stats_desc=In genere questo gingillo genererà un gas nocivo vicino ad un nemico circa ogni _%d_ turni. I gas appariranno solo quando ci sono dei nemici presenti. A livelli più alti, questi gas hanno più probabilità di essere rari e potenti.
items.equipment.trinkets.chaoticcenser.stats_desc=Al livello attuale, questo gingillo genererà un gas nocivo vicino ad un nemico circa ogni _%d_ turni. I gas appariranno solo quando ci sono dei nemici presenti. A livelli più alti, questi gas hanno più probabilità di essere rari e potenti.

items.equipment.trinkets.crackedspyglass.name=cannocchiale crepato
items.equipment.trinkets.crackedspyglass.desc=Questo telescopio portatile sarebbe una dimostrazione di una grande e fina abilità professionale, se non fosse per la crepa lungo le lenti frontali. Sembra che il cannocchiale ti stia aiutando a rivelare nuovi oggetti nel dungeon, ma a causa dei suoi difetti gli oggetti rivelati sono abbastanza difficili da vedere!
items.equipment.trinkets.crackedspyglass.typical_stats_desc=Di solito questo gingillo ha una _probabilità del %1$s%%_ di creare un oggetto nascosto in ogni piano senza un boss.
items.equipment.trinkets.crackedspyglass.stats_desc=A questo livello, questo gingillo ha una _probabilità del %1$s%%_ di creare un oggetto nascosto in ogni piano senza un boss.
items.equipment.trinkets.crackedspyglass.stats_desc_upgraded=A questo livello, questo gingillo ha una _probabilità del 100%%_ di creare un oggetto nascosto in ogni piano senza un boss, e una _probabilità del %1$s%%_ di creare un secondo oggetto nascosto.

items.equipment.trinkets.dimensionalsundial.name=meridiana dimensionale
items.equipment.trinkets.dimensionalsundial.warning=La tua meridiana non proietta ombra, ti senti a disagio.
items.equipment.trinkets.dimensionalsundial.desc=Questa piccola meridiana portatile in qualche modo è in grado di proiettare un'ombra nelle profondità del dungeon, anche se non la stai tenendo in verticale. Persino più stranamente, la posizione dell'ombra sembra non avere relazione con il sole in questo mondo. Quando nessuna ombra viene proiettata, la meridiana sembra attirare il pericolo.
items.equipment.trinkets.dimensionalsundial.typical_stats_desc=In genere questo gingillo ridurrà il tasso di generazione dei nemici di _%1$d%%_ durante il giorno nella vita reale (8:00-20:00) e aumenterà il tasso di generazione dei nemici di _%2$d%%_ durante la notte (20:00-8:00).
items.equipment.trinkets.dimensionalsundial.stats_desc=Al suo livello attuale, questo gingillo ridurrà il tasso di generazione dei nemici di _%1$d%%_ durante il giorno nella vita reale (8:00-20:00) e aumenterà il tasso di generazione dei nemici di _%2$d%%_ durante la notte (20:00-8:00).

items.equipment.trinkets.exoticcrystals.name=cristalli esotici
items.equipment.trinkets.exoticcrystals.desc=Questi piccoli cristalli rosa hanno la stessa forma dei cristalli di energia alchemica. Sebbene non possano essere usati direttamente per ottenere energia, sembra che essi influenzino in qualche modo le pozioni e le pergamene che trovi.
items.equipment.trinkets.exoticcrystals.typical_stats_desc=In genere questo gingillo sostituirà _%s%%_ di pozioni o pergamene con i loro equivalenti esotici. Ciò non influisce su pozioni di forza, pergamene di potenziamento o oggetti generati per aiutare a risolvere le stanze pericolose.
items.equipment.trinkets.exoticcrystals.stats_desc=Al suo livello attuale questo gingillo sostituirà _%s%%_ di pozioni o pergamene con i loro equivalenti esotici. Ciò non influisce su pozioni di forza, pergamene di potenziamento o oggetti generati per aiutare a risolvere le stanze pericolose.

items.equipment.trinkets.eyeofnewt.name=occhio di tritone
items.equipment.trinkets.eyeofnewt.desc=Quest'occhio di tritone dorato e nero è un ingrediente comune, ora migliorato in gingillo. L'occhio sembra star riducendo la tua visione in cambio del concederti di vedere le cose in altri modi.
items.equipment.trinkets.eyeofnewt.typical_stats_desc=In genere questo gingillo ridurrà il tuo raggio visivo di _%1$s%%_, ma ti garantirà anche la visione mentale sui nemici entro _%2$d_ tessere.
items.equipment.trinkets.eyeofnewt.stats_desc=Al suo livello attuale, questo gingillo ridurrà il tuo raggio visivo di _%1$s%%_, ma ti garantirà anche la visione mentale sui nemici entro _%2$d_ tessere.

items.equipment.trinkets.ferrettuft.name=ciocca di furetto
items.equipment.trinkets.ferrettuft.desc=Una ciocca di pelo bianco vellutato di furetto, tenuta assieme da un fiocco verde lime annodato in una curva. I furetti sono conosciuti per la loro agilità, birbanteria e mancanza di integrità. Un po' di quel potere sembra emanare dal gingillo, aumentando l'evasione di tutte le creature vicine.
items.equipment.trinkets.ferrettuft.typical_stats_desc=In generale questo gingillo aumenterà l'evasione di tutti i personaggi del _%1$s%%_.
items.equipment.trinkets.ferrettuft.stats_desc=Al suo attuale livello, questo gingillo aumenterà l'evasione di tutti i personaggi del _%1$s %%_.

items.equipment.trinkets.mimictooth.name=dente di imitatore
items.equipment.trinkets.mimictooth.desc=Questo grande dente affilato deve essere stato estratto da un imitatore molto infelice. Sembra che stia influenzando gli imitatori nel dungeon, rendendoli più frequenti e pericolosi.
items.equipment.trinkets.mimictooth.typical_stats_desc=In genere questo gingillo renderà tutti i tipi di imitatori _%1$sx_ più comuni e molto più difficili da individuare, ma aumenterà anche la quantità di bottino che rilasciano. Ogni piano del dungeon avrà anche una _%2$s%%_ possibilità di contenere un imitatore d'ebano extra furtivo.
items.equipment.trinkets.mimictooth.stats_desc=Al livello attuale, questo gingillo renderà tutti i tipi di imitatori _%1$sx_ più comuni e molto più difficili da individuare, ma aumenterà anche la quantità di bottino che rilasciano. Ogni piano del dungeon avrà anche una _%2$s%%_ possibilità di contenere un mimic d'ebano extra furtivo.

items.equipment.trinkets.mossyclump.name=ciuffo muschioso
items.equipment.trinkets.mossyclump.desc=Questo ciuffo di muschio bagnato sembra trattenere la sua umidità, indipendentemente da quanto tu lo strizzi. Sembra essere magicamente legato al dungeon stesso, rendendo più probabile la comparsa di erba e acqua.
items.equipment.trinkets.mossyclump.typical_stats_desc=In genere questo gingillo farà sì che il _%d%%_ dei piani regolari si riempiano di acqua o erba.\n\nQuesto gingillo costa una quantità di energia più grande per essere migliorato.
items.equipment.trinkets.mossyclump.stats_desc=Al suo livello attuale, questo gingillo farà sì che il _%d%%_ dei piani regolari si riempiano di acqua o erba.\n\nQuesto gingillo costa una quantità di energia più grande per essere migliorato.

items.equipment.trinkets.parchmentscrap.name=pezzo di cartapecora
items.equipment.trinkets.parchmentscrap.desc=Questo piccolo pezzo di cartapecora sembra provenire da una pergamena. Ha conservato parte della sua magia e sembra influenzare armi e armature trovate nel dungeon.
items.equipment.trinkets.parchmentscrap.typical_stats_desc=In genere questo gingillo renderà gli incantesimi e i glifi _%dx_ più comuni, e le maledizioni su armi e armature _%sx_ più comuni. Le maledizioni su bacchette, anelli o artefatti non vengono influenzate.\n\nQuesto gingillo costa una quantità di energia più grande per essere migliorato.
items.equipment.trinkets.parchmentscrap.stats_desc=Al livello attuale, questo gingillo renderà comuni gli incantesimi e i glifi _%dx_ e comuni le maledizioni su armi e armature _%sx_. Le maledizioni su bacchette, anelli o artefatti non vengono influenzate.\n\nQuesto gingillo costa una quantità di energia più grande per essere migliorato.

items.equipment.trinkets.petrifiedseed.name=seme pietrificato
items.equipment.trinkets.petrifiedseed.desc=Questo seme è stato fossilizzato, da lenti processi geologici o dalla magia. Questo seme sembra influenzare magicamente la flora del dungeon, occasionalmente sostituendo i semi delle piante con pietre runiche.
items.equipment.trinkets.petrifiedseed.typical_stats_desc=In genere questo gingillo farà sì che l'erba calpestata lasci cadere pietre runiche invece dei semi _%1$s%%_ delle volte, e farà anche sì che l'erba alta lasci cadere oggetti _%2$s%%_ più spesso.
items.equipment.trinkets.petrifiedseed.stats_desc=Al suo livello attuale, questo gingillo farà sì che l'erba calpestata lasci cadere pietre runiche invece dei semi _%1$s%%_ delle volte, e farà anche sì che l'erba alta lasci cadere oggetti _%2$s%%_ più spesso.

items.equipment.trinkets.ratskull.name=teschio di ratto
items.equipment.trinkets.ratskull.desc=Questo macabro gingillo non è più grosso del teschio di un ratto normale, una rarità giù in questo dungeon. L'influenza magica del teschio sembra attrarre gli abitanti più rari del dungeon, facendoli apparire più spesso.
items.equipment.trinkets.ratskull.typical_stats_desc=In genere questo gingillo farà apparire rari nemici esotici _%dx_. Tuttavia, il teschio è efficace solo la metà nell'attrarre imitatori di cristallo e statue corazzate.
items.equipment.trinkets.ratskull.stats_desc=Al suo livello attuale, questo gingillo renderà più probabile la comparsa di rari nemici esotici _%dx_. Tuttavia, il teschio è efficace solo la metà nell'attrarre imitatori di cristallo e statue corazzate.

items.equipment.trinkets.saltcube.name=cubetto di sale
items.equipment.trinkets.saltcube.desc=Questo grande cristallo di sale è stato tagliato in una forma cubica quasi perfetta e in qualche modo è riuscito a drenare metà dell'acqua dal calderone alchemico invece di dissolversi. Sembra che disidrati e preservi magicamente il cibo che mangi, prolungando il senso di sazietà che provi, ma anche diminuendo il ripristino della tua salute quando non sei affamato.
items.equipment.trinkets.saltcube.typical_stats_desc=In genere questo gingillo aumenterà la quantità di tempo prima che tu diventi affamato di _%1$s%%_, ma ridurrà anche il tuo tasso di rigenerazione della salute di _%2$s%%_ a meno che il livello non sia bloccato.
items.equipment.trinkets.saltcube.stats_desc=Al suo livello attuale, questo gingillo aumenterà la quantità di tempo prima che tu diventi affamato di _%1$s%%_, ma ridurrà anche il tuo tasso di rigenerazione della salute di _%2$s%%_ a meno che il livello non sia bloccato.

items.equipment.trinkets.shardofoblivion.name=frammento di oblio
items.equipment.trinkets.shardofoblivion.desc=Dopo essere stato stufato nel pentolone dell'alchimia, questo piccolo frammento di metallo maledetto è cambiato ed è fatto di... niente? La luce sembra piegarsi attorno ad esso e rimane sospeso sul posto quando non lo tieni. Sembra che il frammento tragga magicamente potere dalla tua ignoranza, quindi probabilmente è meglio non pensarci troppo.
items.equipment.trinkets.shardofoblivion.typical_stats_desc=In genere questo gingillo aumenterà la possibilità che i nemici rilascino bottino di 20%% per ogni pezzo di equipaggiamento non identificato equipaggiato o recentemente utilizzato, fino a un massimo di _%d oggetto(i)_. Il frammento inoltre ti impedirà di identificare l'equipaggiamento automaticamente, ma può anche essere usato per identificare manualmente gli oggetti che sono pronti per esserlo.
items.equipment.trinkets.shardofoblivion.stats_desc=Al livello attuale, questo gingillo aumenterà la possibilità che i nemici rilascino bottino di 20%% per ogni pezzo di equipaggiamento non identificato equipaggiato o recentemente utilizzato, fino a un massimo di _%d oggetto(i)_. Il frammento inoltre ti impedirà di identificare l'equipaggiamento automaticamente, ma può anche essere usato per identificare manualmente gli oggetti che sono pronti per esserlo.
items.equipment.trinkets.shardofoblivion.ac_identify=IDENTIFICA
items.equipment.trinkets.shardofoblivion.identify_prompt=Identifica un oggetto
items.equipment.trinkets.shardofoblivion.identify_ready=Un oggetto è pronto per essere identificato: %s. Utilizza il tuo Frammento di Oblio su di esso per identificarlo.
items.equipment.trinkets.shardofoblivion.identify_ready_worn=Gli oggetti che indossi sono tutti pronti per identificarli.. Utilizza il tuo Frammento di Oblio su oggetti per identificarli.
items.equipment.trinkets.shardofoblivion.identify_not_yet=L'oggetto non è ancora pronto per essere identificato.
items.equipment.trinkets.shardofoblivion.identify=Identifichi l'oggetto!
items.equipment.trinkets.shardofoblivion$wandusetracker.name=Bacchetta usata non identificata
items.equipment.trinkets.shardofoblivion$wandusetracker.desc=Recentemente hai utilizzato una bacchetta non identificata, che conta come un pezzo di equipaggiamento usato non identificato per il frammento dell'oblio per un po'.\n\nTurni rimanenti: %s
items.equipment.trinkets.shardofoblivion$thrownusetracker.name=Arma da Lancio Usata non Identificata
items.equipment.trinkets.shardofoblivion$thrownusetracker.desc=Recentemente hai utilizzato un'arma da lancio non identificata, che conta come un pezzo di equipaggiamento usato non identificato per il frammento dell'oblio per un po'.\n\nTurni rimanenti: %s

items.equipment.trinkets.thirteenleafclover.name=trifoglio a tredici foglie
items.equipment.trinkets.thirteenleafclover.desc=In qualche modo, stufare nel pentolone dell'alchimia questo trifoglio gli ha fatto sviluppare un mucchio di foglie extra! Non è proprio chiaro se questo gingillo sia fortunato o sfortunato, forse questo gingillo renderà la tua fortuna più caotica?
items.equipment.trinkets.thirteenleafclover.typical_stats_desc=In genere questo gingillo ti causerà di applicare il massimo del danno il _%1$d%%_ delle volte, e il minimo del danno il _%2$d%%_ delle volte.
items.equipment.trinkets.thirteenleafclover.stats_desc=Al livello attuale, questo gingillo ti causerà di applicare il massimo del danno il _%1$d%%_ delle volte, e il minimo del danno il _%2$d%%_ delle volte.

items.equipment.trinkets.trapmechanism.name=meccanismo a trappola
items.equipment.trinkets.trapmechanism.desc=Il meccanismo principale di una delle trappole fossa del dungeon, accuratamente estratto dal pavimento in modo da poter essere trasportato. Sembra magicamente legato al dungeon stesso, rendendo più comune il terreno pericoloso ma anche incrementando la tua affinità ad esso.
items.equipment.trinkets.trapmechanism.typical_stats_desc=In genere questo gingillo farà si che il _%1$d%%_ dei piani regolari si riempiano invece di trappole o fossati. In più, il _%2$d%%_ delle trappole nascoste del dungeon saranno visibili.
items.equipment.trinkets.trapmechanism.stats_desc=Al suo livello attuale questo gingillo farà si che il _%1$d%%_ dei piani regolari si riempiano invece di trappole o fossati. In più, il _%2$d%%_ delle trappole nascoste del dungeon saranno visibili.

items.equipment.trinkets.vialofblood.name=fiala di sangue
items.equipment.trinkets.vialofblood.desc=Questa sottile fiala contiene il sangue di qualche abitante del dungeon e si muove lentamente mentre ruoti la fiala. Sembra che aumenti magicamente gli effetti curativi più forti, ma li ritarda anche.
items.equipment.trinkets.vialofblood.typical_stats_desc=In genere questo gingillo aumenterà la salute generale che guadagni bevendo pozioni curative, otri o pozzi di salute di _%1$s%%_. Tuttavia, questi effetti curativi avverranno anche più lentamente, rigenerando un massimo di _%2$s_ HP per turno (questo scala con il livello dell'eroe).
items.equipment.trinkets.vialofblood.stats_desc=Al suo livello attuale, questo gingillo aumenterà la salute generale che ottieni bevendo pozioni curative, otri o pozzi di salute di _%1$s%%_. Tuttavia, questi effetti curativi avverranno anche più lentamente, rigenerando un massimo di _%2$s_ HP per turno (questo scala con il livello dell'eroe).

items.equipment.trinkets.wondrousresin.name=resina meravigliosa
items.equipment.trinkets.wondrousresin.desc=Questa resina blu scintillante sembra possedere l'essenza distillata della magia di una bacchetta maledetta. La magia del calderone alchemico sembra averla stabilizzata in qualche modo, e adesso sta influenzando le tue bacchette.
items.equipment.trinkets.wondrousresin.typical_stats_desc=In genere questo gingillo forzerà gli effetti della bacchetta maledetta a diventare neutri o positivi _%1$s%%_ delle volte, e farà sì che le bacchette non maledette sparino un ulteriore colpo maledetto neutro o positivo _%2$s%%_ delle volte.\n\nQuesto gingillo costa una quantità di energia più grande per essere migliorato.
items.equipment.trinkets.wondrousresin.stats_desc=Al suo livello attuale, questo gingillo forzerà gli effetti della bacchetta maledetta a diventare neutri o positivi _%1$s%%_ delle volte, e farà sì che le bacchette non maledette sparino un ulteriore colpo maledetto neutro o positivo _%2$s%%_ delle volte.\n\nQuesto gingillo costa una quantità di energia più grande per essere migliorato.

items.equipment.trinkets.trinketcatalyst.name=catalizzatore magico
items.equipment.trinkets.trinketcatalyst.window_title=crea un gingillo
items.equipment.trinkets.trinketcatalyst.window_text=L'acqua comincia a brillare quando aggiungi il catalizzatore. Ci sono alcuni oggetti nelle vicinanze che potresti infondere di energia per trasformarli in gingilli magici.
items.equipment.trinkets.trinketcatalyst.desc=Questa palla di polvere dorata magica luccica nell'oscurità del dungeon. Questo catalizzatore può essere usato in un calderone alchemico con un po' di energia alchemica per produrre un gingillo unico.\n\nI gingilli forniscono diversi effetti che modificano leggermente il dungeon o i suoi abitanti. I gingilli possono essere potenziati con più energia per rendere i loro effetti più potenti, o lasciati per rinunciare del tutto al loro effetto.
items.equipment.trinkets.trinketcatalyst$randomtrinket.name=gingillo casuale
items.equipment.trinkets.trinketcatalyst$randomtrinket.desc=Un oggetto nelle vicinanze è bloccato in una custodia che non puoi aprire.\n\nIl processo alchemico dissolverà la custodia, ma non saprai quale gingillo otterrai finché non lo farai!

items.equipment.trinkets.trinket.discover_hint=Questo oggetto può comparire come opzione quando crei un gingillo attraverso l'alchimia.
items.equipment.trinkets.trinket$placeholder.name=gingillo

###wands
items.equipment.wands.cursedwand.ondeath=Sei stato ucciso dal tuo stesso %s.
items.equipment.wands.cursedwand.nothing=Non succede nulla.
items.equipment.wands.cursedwand.mass_invuln=Una luce brillante erutta dalla tua bacchetta!
items.equipment.wands.cursedwand.petrify=All'improvviso ti blocchi sul posto!
items.equipment.wands.cursedwand.grass=Dell'erba spunta tutto intorno a te!
items.equipment.wands.cursedwand.fire=Senti puzza di bruciato...
items.equipment.wands.cursedwand.transmogrify_wand=La tua bacchetta si trasmuta in un oggetto diverso!
items.equipment.wands.cursedwand.transmogrify_other=La tua bacchetta si trasmuta in qualcosa di diverso!
items.equipment.wands.cursedwand.disguise=Il tuo aspetto cambia davanti ai tuoi occhi!
items.equipment.wands.cursedwand.supernova=Una sfera ardente di energia inizia a crescere. Forse è meglio scappare!
items.equipment.wands.cursedwand.supernova_positive=Una sfera ardente di energia inizia a crescere, ma per qualche motivo ti senti al sicuro.
items.equipment.wands.cursedwand.sinkhole=Il terreno comincia a sgretolarsi attorno a te!
items.equipment.wands.cursedwand.sinkhole_positive=Il terreno inizia a cedere, ma sembra abbastanza solido sotto di te.
items.equipment.wands.cursedwand.gravity=La gravità inizia improvvisamente a spingerti in direzioni casuali!
items.equipment.wands.cursedwand.gravity_positive=La gravità inizia improvvisamente a spingere in direzioni casuali, ma questo non sembra influenzarti.
items.equipment.wands.cursedwand.gravity_end=Il caos gravitazionale finisce.

items.equipment.wands.damagewand.upgrade_stat_name_1=Danno Magico

items.equipment.wands.wand.ac_zap=COLPISCI
items.equipment.wands.wand.fizzles=La tua bacchetta emette fievoli scoppiettii; sarà scarica.
items.equipment.wands.wand.no_magic=La tua bacchetta emette fievoli scoppiettii; non puoi usare bacchette mentre sei immune alla magia.
items.equipment.wands.wand.self_target=Non puoi puntarlo su te stesso!
items.equipment.wands.wand.identify=Ora hai abbastanza familiarità con la tua bacchetta magica per poterla identificare.
items.equipment.wands.wand.resin_one=Questa bacchetta ha guadagnato _1 livello_ grazie alla resina arcana.
items.equipment.wands.wand.resin_many=Questa bacchetta ha guadagnato _%d livelli_ grazie alla resina arcana.
items.equipment.wands.wand.cursed=Questa bacchetta è maledetta, rendendo la sua magia disordinata e casuale.
items.equipment.wands.wand.not_cursed=Questa bacchetta è libera da magia ostile.
items.equipment.wands.wand.curse_discover=Questo %s è maledetto!
items.equipment.wands.wand.prompt=Scegli un punto da colpire
items.equipment.wands.wand$placeholder.name=bacchetta

items.equipment.wands.wandofblastwave.name=bacchetta dell'onda d'urto
items.equipment.wands.wandofblastwave.staff_name=bastone dell'onda d'urto
items.equipment.wands.wandofblastwave.ondeath=Ti sei ucciso con la tua stessa bacchetta dell'onda d'urto...
items.equipment.wands.wandofblastwave.knockback_ondeath=La collisione ti ha ucciso...
items.equipment.wands.wandofblastwave.desc=Questa bacchetta è composta da una sorta di pietra marmorea, rivestita d'oro e con una gemma nera tonda in cima. La senti molto pesante nella tua mano.
items.equipment.wands.wandofblastwave.typical_stats_desc=Questa bacchetta spara un dardo che esplode violentemente nel punto bersaglio. La forza di questa esplosione in genere infligge _%1$d-%2$d danni_ ed è abbastanza forte da spingere via la maggior parte dei nemici.
items.equipment.wands.wandofblastwave.stats_desc=Questa bacchetta spara un dardo che esplode sul bersaglio. La forza d'urto infligge _%1$d-%2$d punti danno_ ed è forte abbastanza da far volare via la maggior parte dei nemici.
items.equipment.wands.wandofblastwave.upgrade_stat_name_2=Respinta
items.equipment.wands.wandofblastwave.bmage_desc=Quando _il Mago Guerriero_ colpisce un nemico paralizzato con una staffa dell'onda d'urto, consumerà la paralisi per infliggere danni magici bonus. Questo ha un tempo di recupero per ciascun nemico.
items.equipment.wands.wandofblastwave.eleblast_desc=Un'esplosione elementale con un bastone dell'onda d'urto infligge il 67% di danno e butta fuori tutti i nemici dall'area dell'esplosione.

items.equipment.wands.wandofcorrosion.name=bacchetta della corrosione
items.equipment.wands.wandofcorrosion.staff_name=bastone della corrosione
items.equipment.wands.wandofcorrosion.desc=Questa bacchetta possiede un corpo cinereo che conduce ad una gemma arancione brillante.
items.equipment.wands.wandofcorrosion.stats_desc=Questa bacchetta spara un dardo che esplode in una nuvola di gas altamente corrosivo in una posizione mirata. Qualsiasi cosa all'interno di tale nuvola riceverà danno crescente nel tempo, a partire da _%d danni._
items.equipment.wands.wandofcorrosion.upgrade_stat_name_1=Danni da corrosione
items.equipment.wands.wandofcorrosion.upgrade_stat_name_2=Volume del gas
items.equipment.wands.wandofcorrosion.bmage_desc=Quando _il Mago Guerriero_ colpisce un nemico con un bastone della corrosione, c'è la possibilità che il nemico venga ricoperto di acido corrosivo.
items.equipment.wands.wandofcorrosion.eleblast_desc=Un'esplosione elementale con una bacchetta della corrosione infligge ai nemici 4 turni di corrosione, iniziando con 6 punti danno.

items.equipment.wands.wandofcorruption.name=bacchetta della corruzione
items.equipment.wands.wandofcorruption.staff_name=bastone della corruzione
items.equipment.wands.wandofcorruption.already_corrupted=Quel personaggio non può essere condizionato ulteriormente.
items.equipment.wands.wandofcorruption.desc=Questa bacchetta irradia un'energia oscura, come se non fosse già abbastanza ovvio, visto e considerato il piccolo teschio decorativo modellato sulla punta.
items.equipment.wands.wandofcorruption.stats_desc=Questa bacchetta rilascerà uno scoppio di energia corruttiva, cercando di piegare i nemici al tuo volere. Gli avversari sono in grado di resistere alla corruzione, ma i nemici indeboliti sono molto più facili da corrompere rispetto a quelli in salute.
items.equipment.wands.wandofcorruption.upgrade_stat_name_1=Potere corruttore
items.equipment.wands.wandofcorruption.upgrade_stat_name_2=Durata del depotenziamento
items.equipment.wands.wandofcorruption.bmage_desc=Quando _il Mago Guerriero_ colpisce un nemico con un bastone della corruzione, c'è la possibilità che il nemico diventi frenetico.
items.equipment.wands.wandofcorruption.eleblast_desc=Un'esplosione elementale con un bastone della corruzione infligge ai nemici 5 turni di frenesia.

items.equipment.wands.wandofdisintegration.name=bacchetta della disintegrazione
items.equipment.wands.wandofdisintegration.staff_name=bastone della disintegrazione
items.equipment.wands.wandofdisintegration.desc=Questa bacchetta è ottenuta da un solido pezzo di ossidiana e una profonda luce purpurea scorre dai suoi lati fino alla punta. Brilla con un'energia distruttiva, impaziente di sprigionarsi.
items.equipment.wands.wandofdisintegration.stats_desc=Questa bacchetta spara un raggio in grado di penetrare qualunque ostacolo e la sua portata aumenterà a ogni miglioramento. Il raggio infligge _%1$d-%2$d punti danno,_ più un bonus tanti più nemici e muri trapassa.
items.equipment.wands.wandofdisintegration.upgrade_stat_name_2=Portata massima
items.equipment.wands.wandofdisintegration.bmage_desc=Quando è impugnato dal _Mago Guerriero_, il bastone della disintegrazione ha un raggio di attacco maggiore, come se avesse incantesimo prominente.
items.equipment.wands.wandofdisintegration.eleblast_desc=Un'esplosione elementale con un bastone della disintegrazione infligge il 100% di danno e passa attraverso i muri.

items.equipment.wands.wandoffireblast.name=bacchetta dell'esplosione infuocata
items.equipment.wands.wandoffireblast.staff_name=bastone dell'esplosione infuocata
items.equipment.wands.wandoffireblast.desc=Questa bacchetta è fatta di legno laccato di rosso con foglie dorate generosamente disposte per farla apparire piuttosto maestosa. Scoppietta e sibila sulla punta, bramosa di scatenare la sua potente magia.
items.equipment.wands.wandoffireblast.stats_desc=Questa bacchetta emette un cono di fuoco quando viene usata. Il suo prossimo attacco utilizzerà _%1$d cariche_ ed infliggerà _%2$d-%3$d danni._ Più cariche vengono usate, più grande e più forte sarà l'effetto.
items.equipment.wands.wandoffireblast.upgrade_stat_name_1=Danno da 1 carica
items.equipment.wands.wandoffireblast.upgrade_stat_name_2=Danno da 2 cariche
items.equipment.wands.wandoffireblast.upgrade_stat_name_3=Danno da 3 cariche
items.equipment.wands.wandoffireblast.bmage_desc=Quando _il Mago Guerriero_ colpisce un nemico con un bastone dell'esplosione infuocata, c'è la possibilità che il nemico produca un'esplosione che infligge danni ai nemici e consuma tutto il fuoco circostante! Questa possibilità aumenta maggiore è il fuoco attorno al nemico.
items.equipment.wands.wandoffireblast.eleblast_desc=Un'esplosione elementale con un bastone dell'esplosione infuocata infligge il 100% di danno e manda a fuoco nemici e terreno.

items.equipment.wands.wandoffrost.name=bacchetta del congelamento
items.equipment.wands.wandoffrost.staff_name=bastone del congelamento
items.equipment.wands.wandoffrost.desc=Questa bacchetta sembra essere ricavata da un qualche tipo di ghiaccio magico. Acquista luminosità alla volta della sua punta arrotondata. È molto fredda al tatto quando impugnata, ma in qualche modo la tua mano resta calda.
items.equipment.wands.wandoffrost.stats_desc=Questa bacchetta spara raffiche di energia ghiacciata verso i tuoi avversari, infliggendo _%1$d-%2$d punti danno_ e causando brividi. L'effetto pare più forte nell'acqua. I nemici già raffreddati e congelati riceveranno meno danni da questa bacchetta, poiché sono già freddi.
items.equipment.wands.wandoffrost.upgrade_stat_name_2=Durata del ghiaccio
items.equipment.wands.wandoffrost.bmage_desc=Quando _il Mago Guerriero_ colpisce un nemico raffreddato con un bastone del congelamento, c'è la possibilità che tale nemico venga congelato istantaneamente. Questa possibilità aumenta se il nemico è già raffreddato.
items.equipment.wands.wandoffrost.eleblast_desc=Un'esplosione elementale con un bastone del congelamento infligge il 100% di danno, congela i nemici e spegne gli incendi.

items.equipment.wands.wandoflightning.name=bacchetta del fulmine
items.equipment.wands.wandoflightning.staff_name=bastone del fulmine
items.equipment.wands.wandoflightning.ondeath=Ti sei ucciso con la tua stessa bacchetta del fulmine...
items.equipment.wands.wandoflightning.desc=Questa bacchetta è fatta di solido metallo, rendendola sorprendentemente pesante. Due rebbi si estendono curvi sulla punta, emettendo archi elettrici.
items.equipment.wands.wandoflightning.stats_desc=Questa bacchetta irradia potenti fulmini, creando archi attraverso ogni cosa bersagliata e infliggendo _%1$d-%2$d punti danno._ Quest'elettricità può rimbalzare tra molti nemici vicini. Il fulmine di questa bacchetta potrebbe ferirti, ma non ferirà i tuoi compagni.
items.equipment.wands.wandoflightning.bmage_desc=Quando _il Mago Guerriero_ colpisce un nemico con un bastone del fulmine, ha la possibilità di caricarsi elettricamente per 10 turni. Una volta caricato, il Mago Guerriero è immune ai danni causati dai fulmini e i suoi attacchi con fulmini potranno balzare a bersagli più distanti.
items.equipment.wands.wandoflightning.eleblast_desc=Un'esplosione elementale con un bastone del fulmine infligge il 100% di danno, paralizza i nemici per 5 turni ed elettrizza l'acqua.
items.equipment.wands.wandoflightning$lightningcharge.name=caricato elettricamente
items.equipment.wands.wandoflightning$lightningcharge.desc=Attualmente il Mago Combattente è carico di energia, il che gli garantisce l'immunità ai fulmini del suo bastone e aumenta la gittata dei fulmini che possono balzare dal bersaglio principale.\n\nTurni rimanenti: %s.

items.equipment.wands.wandoflivingearth.name=bacchetta della viva terra
items.equipment.wands.wandoflivingearth.staff_name=bastone della viva terra
items.equipment.wands.wandoflivingearth.desc=Questa bacchetta è ottenuta da una pietra bizzarra, brillante di fasci d'energia color paglierino. La roccia pare muoversi leggermente al tuo tocco, come se potesse avvertire la tua presa.
items.equipment.wands.wandoflivingearth.stats_desc=Questa bacchetta scaglia lampi di roccia magica ai nemici, infliggendo _%1$d-%2$d punti danno._ La roccia quindi si riformerà attorno all'utilizzatore, concedendogli armatura in proporzione al danno arrecato. Se sufficiente armatura verrà costituita, essa formerà un guardiano di roccia al prossimo colpo della bacchetta.
items.equipment.wands.wandoflivingearth.upgrade_stat_name_2=HP massimi del guardiano
items.equipment.wands.wandoflivingearth.upgrade_stat_name_3=Armatura del guardiano
items.equipment.wands.wandoflivingearth.bmage_desc=Quando _il Mago Guerriero_ colpisce un nemico con un bastone della terra viva, parte del danno inflitto ritorna sotto forma di armatura di roccia.
items.equipment.wands.wandoflivingearth.eleblast_desc=Un'esplosione elementale con un bastone della viva terra infligge il 50% di danno e cura un guardiano terrestre per ogni colpo nemico subito.
items.equipment.wands.wandoflivingearth$rockarmor.name=armatura di roccia
items.equipment.wands.wandoflivingearth$rockarmor.desc=Rocce magiche circondano il tuo corpo: quando verrai attaccato bloccheranno per il colpo per te e ridurranno il danno ricevuto del 50%%. Ogni punto danno bloccato comunque sbriciolerà via un po' di roccia.\n\nArmatura rimanente: %1$d.\n\nSe sufficiente roccia si è costituita intorno a te, il prossimo colpo dalla tua bacchetta della viva terra spingerà le rocce a formarsi in un guardiano che combatterà al tuo fianco.\n\nArmatura necessaria per il Guardiano: %2$d.
items.equipment.wands.wandoflivingearth$rockarmor.desc_many=Anche questo guardiano terrestre beneficia del Potere dei Molti. Turni Rimanenti: %d.
items.equipment.wands.wandoflivingearth$earthguardian.name=guardiano terrestre
items.equipment.wands.wandoflivingearth$earthguardian.desc=Le rocce provenienti dalla tua bacchetta della viva terra si sono unite a formare un guardiano terrestre! Questo protettore roccioso attaccherà i nemici vicini, così da portarli a concentrare l'attenzione sul guardiano invece che su di te. Quando tutte le minacce saranno scomparse, il guardiano si ricostituirà attorno a te e ritornerà col prossimo uso della tua bacchetta.
items.equipment.wands.wandoflivingearth$earthguardian.wand_info=Il potere difensivo del guardiano è legato al livello della tua bacchetta. Attualmente blocca _%1$d-%2$d danni._
items.equipment.wands.wandoflivingearth$earthguardian.discover_hint=Puoi trovare questo personaggio con una bacchetta specifica.

items.equipment.wands.wandofmagicmissile.name=bacchetta del missile magico
items.equipment.wands.wandofmagicmissile.staff_name=bastone del missile magico
items.equipment.wands.wandofmagicmissile.desc=Questa bacchetta piuttosto semplice lancia missili di pura energia magica. Sebbene la bacchetta manchi di qualunque effetto speciale possiede più cariche disponibili e se migliorato, può rafforzare le altre bacchette.
items.equipment.wands.wandofmagicmissile.stats_desc=Ogni dardo da questa bacchetta infligge _%1$d-%2$d punti danno,_  e può rafforzare altre bacchette se migliorato.
items.equipment.wands.wandofmagicmissile.bmage_desc=Quando _il Mago Guerriero_ colpisce un nemico con un bastone del missile magico, tutte le sue bacchette si ricaricheranno oltre al suo bastone.
items.equipment.wands.wandofmagicmissile.eleblast_desc=Uno scoppio elementale con un bastone del missile magico causa 50% di danno e garantisce al mago 15 turni di ricarica.
items.equipment.wands.wandofmagicmissile.discover_hint=Uno degli eroi inizia con questo oggetto.
items.equipment.wands.wandofmagicmissile$magiccharge.name=carica magica
items.equipment.wands.wandofmagicmissile$magiccharge.desc=La tua bacchetta del missile magico ha instillato potere verso le tue altre bacchette, aumentando il livello effettivo della prossima scarica che emetteranno.\n\nLe tue bacchette sono incrementate a: +%d.\n\nTurni di carica magica rimanenti: %s.

items.equipment.wands.wandofprismaticlight.name=bacchetta della luce prismatica
items.equipment.wands.wandofprismaticlight.staff_name=bastone della luce prismatica
items.equipment.wands.wandofprismaticlight.desc=Questa bacchetta è composta di un solido pezzo di cristallo traslucido, come un lungo pezzo di vetro liscio. Piccoli corpuscoli di luce colorata danzano attorno alla punta della bacchetta, bramosi di sprigionarsi innanzi.
items.equipment.wands.wandofprismaticlight.stats_desc=Questa bacchetta emette raggi di luce che disperdono l'oscurità del dungeon, rivelando aree nascoste e trappole. Il raggio può accecare i nemici, ed infligge _%1$d-%2$d punti danno._ Avversari demoniaci e non-morti bruceranno alla luce luminosa della bacchetta, ricevendo danno bonus.
items.equipment.wands.wandofprismaticlight.upgrade_stat_name_2=Possibilità di accecamento
items.equipment.wands.wandofprismaticlight.upgrade_stat_name_3=Durata della luce
items.equipment.wands.wandofprismaticlight.bmage_desc=Quando _il Mago Guerriero_ colpisce un nemico con un bastone della luce prismatica, esso sarà stordito per una durata proporzionale al livello del bastone.
items.equipment.wands.wandofprismaticlight.eleblast_desc=Uno scoppio elementale con uno bastone della luce prismatica causa 67% di danno, rivela tutto il terreno colpito e acceca i nemici per 5 turni.

items.equipment.wands.wandofregrowth.name=bacchetta della ricrescita
items.equipment.wands.wandofregrowth.staff_name=bastone della ricrescita
items.equipment.wands.wandofregrowth.desc=Questa bacchetta è ricavata da una sottile asta di legno abilmente scolpito. In qualche modo è ancora viva e vibrante, di un verde brillante come il cuore di un giovane albero. "Quando la vita termina, nuova vita sempre inizia a crescere... L'eterno ciclo sempre perdura!"
items.equipment.wands.wandofregrowth.stats_desc=Quando usata, questa bacchetta sprigionerà magia di ricrescita magica a cono davanti a te, facendo nascere e spuntare erbe, radici e piante rare. Il suo prossimo uso consumerà _%1$d cariche_. Proseguendo nei miglioramenti questa bacchetta consumerà più cariche e l'effetto diverrà via via più potente di conseguenza.
items.equipment.wands.wandofregrowth.degradation=Dopo altre  _%d cariche_ questa bacchetta inizierà a non produrre piante ed erba fresca. Questo limite è incrementato aumentando di livello o migliorando la bacchetta.
items.equipment.wands.wandofregrowth.upgrade_stat_name_1=Erba per carica
items.equipment.wands.wandofregrowth.upgrade_stat_name_2=Limite totale dell'erba
items.equipment.wands.wandofregrowth.bmage_desc=Quando _il Mago Guerriero_ colpisce un nemico con un bastone della ricrescita, ed entrambi stanno sull'erba, egli riceverà guarigione erboristica proporzionale al danno inflitto.
items.equipment.wands.wandofregrowth.eleblast_desc=Uno scoppio elementale con un bastone della ricrescita intrappola i nemici con le radici e fa crescere erba casualmente nell'area dello scoppio.
items.equipment.wands.wandofregrowth$dewcatcher.name=Catturarugiada
items.equipment.wands.wandofregrowth$dewcatcher.desc=Le catturarugiada sono piante meravigliose ricolme di rugiada magica. Si mimetizzano da erba per sviare l'attenzione, ma le sue protuberanze ripiene di rugiada la rendono riconoscibile.
items.equipment.wands.wandofregrowth$dewcatcher.discover_hint=Puoi trovare questa pianta con una bacchetta specifica.
items.equipment.wands.wandofregrowth$seedpod.name=Baccello
items.equipment.wands.wandofregrowth$seedpod.desc=I Baccelli sono piante magiche che producono semi di altri tipi di piante, invece di semi propri. Riescono in qualche modo a riprodursi sebbene non possiedano un seme associato.
items.equipment.wands.wandofregrowth$seedpod.discover_hint=Puoi trovare questa pianta con una bacchetta specifica.
items.equipment.wands.wandofregrowth$lotus.name=Loto Dorato
items.equipment.wands.wandofregrowth$lotus.desc=Il loto dorato è una pianta mistica che può essere evocata solamente da una potente bacchetta della ricrescita. La sua aura migliora tutte le piante ed i loro effetti, ma la sua energia lo consuma, facendolo morire dopo breve tempo.
items.equipment.wands.wandofregrowth$lotus.wand_info=Questo loto è stato creato da una bacchetta della ricrescita _+%1$d_. Ogni pianta nel suo raggio si innescherà istantaneamente se è piantata su un personaggio. Le piante inoltre avranno il _%2$d%% di probabilità_ di ritornare il lore seme, e i dardi intinti useranno il _%3$d%% di durabilità in meno_.
items.equipment.wands.wandofregrowth$lotus.discover_hint=Puoi trovare questa pianta con una bacchetta specifica, dopo averla migliorata molte volte.

items.equipment.wands.wandoftransfusion.name=bacchetta della trasfusione
items.equipment.wands.wandoftransfusion.staff_name=bastone della trasfusione
items.equipment.wands.wandoftransfusion.ondeath=Ti sei ucciso con la tua stessa bacchetta della trasfusione...
items.equipment.wands.wandoftransfusion.charged=Il tuo bastone si è ricaricato con l'energia vitale del tuo nemico!
items.equipment.wands.wandoftransfusion.desc=Una bacchetta dalla forma piuttosto semplice, si distingue grazie alla sua tonalità magenta e alla gemma nerissima sulla punta.
items.equipment.wands.wandoftransfusion.stats_desc=Quando usata sugli alleati o sui nemici ammaliati, questa bacchetta indebolirà _%1$d punti vita del giocatore_ per curare o dare armatura all'alleato per _%2$d punti vita._ Quando usata su un nemico, la bacchetta lo ammalierà brevemente applicando _%3$d punti scudo_ al giocatore. I non-morti ostili prenderanno _%4$d-%5$d punti danno_ invece di essere ammaliati.
items.equipment.wands.wandoftransfusion.upgrade_stat_name_1=Guarigione per Alleato
items.equipment.wands.wandoftransfusion.upgrade_stat_name_2=Punti scudo
items.equipment.wands.wandoftransfusion.upgrade_stat_name_3=Danni a non morti
items.equipment.wands.wandoftransfusion.bmage_desc=Quando _il Mago Guerriero_ colpisce un nemico ammaliato con un bastone della trasfusione, egli riceverà protezione ed il suo prossimo colpo con il bastone non gli costerà alcun punto salute.
items.equipment.wands.wandoftransfusion.eleblast_desc=Uno scoppio elementale con un bastone della trasfusione ammalia i nemici, cura gli alleati e causa il 100% di danno ai nemici non-morti.

items.equipment.wands.wandofwarding.name=bacchetta della guardia
items.equipment.wands.wandofwarding.staff_name=bastone della guardia
items.equipment.wands.wandofwarding.no_more_wards=La tua bacchetta non può sostenere ulteriori sentinelle.
items.equipment.wands.wandofwarding.bad_location=Non puoi piazzare una sentinella qui.
items.equipment.wands.wandofwarding.desc=Questa corta bacchetta metallica ha una brillante gemma purpurea fluttuante sulla sua punta.
items.equipment.wands.wandofwarding.stats_desc=Anziché danneggiare direttamente un nemico, questa bacchetta evocherà delle sentinelle stazionarie. Le sentinelle possono venire evocate ovunque, anche attraverso i muri se ne possiedi visione. Questa bacchetta può sostenere _%d punti energia_ in sentinelle al massimo.
items.equipment.wands.wandofwarding.upgrade_stat_name_1=Danno delle sentinelle
items.equipment.wands.wandofwarding.upgrade_stat_name_2=Energia per sentinelle
items.equipment.wands.wandofwarding.bmage_desc=Quando _il Mago Guerriero_ colpisce un nemico con un bastone di guardia, tutte le sentinelle attive hanno una possibilità di venire guarite.
items.equipment.wands.wandofwarding.eleblast_desc=Uno scoppio elementale con un bastone della guardia cura tutte le sentinelle nell'area dello scoppio.
items.equipment.wands.wandofwarding$ward.desc_generic_ward=Questa sentinella fulmina automaticamente qualsiasi nemico che entra nel suo raggio visivo.\n\nColpire questa sentinella con la tua bacchetta magica la migliorerà.\n\nLe sentinelle hanno un numero limitato di zap prima di dissiparsi.
items.equipment.wands.wandofwarding$ward.desc_generic_sentry=Questa sentinella ha la stessa potenza di fuoco di una sentinella minore, ma ha salute invece di un determinato numero di cariche. Assomiglia alla gemma sulla punta della tua bacchetta magica.\n\nColpire questa sentinella con la tua bacchetta di guardia la migliorerà e la curerà.\n\nQuesta sentinella spenderà un po' di salute ogni volta che colpisce un nemico, ma può essere curata usando la tua bacchetta di guardia su di essa.
items.equipment.wands.wandofwarding$ward.name_1=sentinella minore
items.equipment.wands.wandofwarding$ward.desc_1=Questa semplice sentinella colpirà automaticamente ogni nemico entri nel suo raggio di visione, infliggendo _%1$d-%2$d punti danno._\n\nColpire questa sentinella con la tua bacchetta da guardia la migliorerà.\n\nQuesta sentinella colpirà solamente una volta prima di dissiparsi.\n\nLa tua bacchetta della guardia sta usando _%3$d punti energia_ per sostenere questa sentinella.
items.equipment.wands.wandofwarding$ward.name_2=sentinella
items.equipment.wands.wandofwarding$ward.desc_2=Questa sentinella migliorata ha uno schema più complesso e può attaccare molteplici volte. Ogni colpo di questa sentinella infliggerà _%1$d-%2$d punti danno._\n\nColpire questa sentinella con la tua bacchetta da guardia la migliorerà.\n\nQuesta sentinella colpirà due volte prima di dissiparsi.\n\nLa tua bacchetta della guardia sta usando _%3$d punti energia_ per sostenere questa sentinella.
items.equipment.wands.wandofwarding$ward.name_3=sentinella maggiore
items.equipment.wands.wandofwarding$ward.desc_3=Questa sentinella pienamente migliorata è capace di attaccare più volte e più rapidamente dei suoi predecessori. Ogni colpo di questa sentinella infliggerà _%1$d-%2$d punti danno._\n\nColpire questa sentinella con la tua bacchetta da guardia la migliorerà.\n\nQuesta sentinella colpirà quattro volte prima di dissiparsi.\n\nLa tua bacchetta da guardia sta usando _%3$d punti energia_ per sostenere questa sentinella.
items.equipment.wands.wandofwarding$ward.name_4=sentinella minore
items.equipment.wands.wandofwarding$ward.desc_4=Questa piccola sentinella ha lo stesso potere di fuoco di una più grande, ma ha salute al posto di numero di cariche. Assomiglia alla gemma sulla punta della tua bacchetta da guardia. Ogni scarica da questa sentinella causa _%1$d-%2$d punti danno._\n\nColpire questa sentinella con la tua bacchetta da guardia la migliorerà e curerà.\n\nQuesta sentinella spenderà qualche punto salute ogni volta che colpisce un nemico, ma potrà essere curata usando la tua bacchetta da guardia su di essa.\n\nLa tua bacchetta da guardia sta usando _%3$d punti energia_ per sostenere questa sentinella.
items.equipment.wands.wandofwarding$ward.name_5=sentinella
items.equipment.wands.wandofwarding$ward.desc_5=Questa sentinella migliorata è più grossa e capace di attaccare più rapidamente di una sentinella minore. Ogni colpo di questa sentinella infliggerà _%1$d-%2$d punti danno._\n\nColpire questa sentinella con la tua bacchetta da guardia la migliorerà e curerà.\n\nQuesta sentinella spenderà qualche punto salute ogni volta che colpisce un nemico, ma potrà essere curata usando la tua bacchetta da guardia su di essa.\n\nLa tua bacchetta da guardia sta usando _%3$d punti energia_ per sostenere questa sentinella.
items.equipment.wands.wandofwarding$ward.name_6=sentinella maggiore
items.equipment.wands.wandofwarding$ward.desc_6=Questa sentinella pienamente migliorata è considerevolmente più resistente dei suoi predecessori. Ogni colpo di questa sentinella infliggerà _%1$d-%2$d punti danno._\n\nColpire questa sentinella con la tua bacchetta da guardia la curerà.\n\nQuesta sentinella spenderà qualche punto salute ogni volta che colpirà un nemico, ma potrà essere curata usando la tua bacchetta da guardia su di essa.\n\nLa tua bacchetta da guardia sta usando _%3$d punti energia_ per sostenere questa sentinella.
items.equipment.wands.wandofwarding$ward.discover_hint=Puoi trovare questo personaggio con una bacchetta specifica.
items.equipment.wands.wandofwarding$ward.dismiss_title=Congedare questa sentinella?
items.equipment.wands.wandofwarding$ward.dismiss_body=Puoi dissipare questa sentinella se non vuoi più che la tua bacchetta la sostenga. Così facendo distruggerai immediatamente la sentinella.\n\nCongedare la sentinella?
items.equipment.wands.wandofwarding$ward.dismiss_confirm=sì
items.equipment.wands.wandofwarding$ward.dismiss_cancel=no

###weapon curses
items.equipment.weapon.curses.annoying.name=%s irritante
items.equipment.weapon.curses.annoying.msg_1=OOH, STIAMO COMBATTENDO QUALCOSA!?
items.equipment.weapon.curses.annoying.msg_2=EVVAI, BECCALI!
items.equipment.weapon.curses.annoying.msg_3=EHI, ASCOLTA!
items.equipment.weapon.curses.annoying.msg_4=NON SIAMO ARRIVATI AL BOSS ANCORA!?
items.equipment.weapon.curses.annoying.msg_5=OUCH, NON ROTEARMI COSÌ FORTE!
items.equipment.weapon.curses.annoying.msg_6=MUORI, INSETTO!
items.equipment.weapon.curses.annoying.msg_7=WEEEEEEEEEEEEEEEE!
items.equipment.weapon.curses.annoying.msg_8=POSSIAMO FARE UNA PAUSA!?
items.equipment.weapon.curses.annoying.msg_9=POW, HAHA!
items.equipment.weapon.curses.annoying.msg_10=BEL COLPO!
items.equipment.weapon.curses.annoying.msg_11=Non volevo essere un arma, volevo essere l'ascia di un falegname.
items.equipment.weapon.curses.annoying.msg_12=Ricorda, la troppa confidenza porta lentamente alla morte.
items.equipment.weapon.curses.annoying.msg_13=TUTTA LA VOSTRA BASE SONO APPARTENGONO A NOI!
items.equipment.weapon.curses.annoying.desc=Le armi irritanti sono capaci di parlare, ma sono un po' troppo vivaci. Spesso attireranno l'attenzione su di te, inconsapevolmente.
items.equipment.weapon.curses.annoying.elestrike_desc=Un colpo elementale con una maledizione fastidiosa ha una probabilità del 20% di infuriare ogni nemico nel raggio d'azione per 6 turni.

items.equipment.weapon.curses.dazzling.name=%s abbacinante
items.equipment.weapon.curses.dazzling.desc=Le armi accecanti ogni tanto rilasceranno un flash di luce accecante che accecherà tutti coloro che stanno guardando.
items.equipment.weapon.curses.dazzling.elestrike_desc=Un colpo elementale con una maledizione accecante ha una probabilità del 50% di accecare ogni nemico nel raggio d'azione per 6 turni.

items.equipment.weapon.curses.displacing.name=%s dislocante
items.equipment.weapon.curses.displacing.desc=Le armi dislocanti sono infuse con magia caotica teletrasportante e possiedono la capacità di spostare casualmente i nemici nel livello.
items.equipment.weapon.curses.displacing.elestrike_desc=Un attacco elementale con una maledizione dislocante ha una probabilità del 50% di teletrasportare ogni nemico nel raggio d'azione.

items.equipment.weapon.curses.explosive.name=esplosivo %s
items.equipment.weapon.curses.explosive.warm=Tiepido...
items.equipment.weapon.curses.explosive.hot=Caldo!
items.equipment.weapon.curses.explosive.desc=Le armi esplosive accumulano costantemente potenza ed esplodono, danneggiando qualunque cosa gli sia vicino.
items.equipment.weapon.curses.explosive.desc_cool=La tua arma è fredda al tocco.
items.equipment.weapon.curses.explosive.desc_warm=La tua arma sta accumulando energia e si sta riscaldando...
items.equipment.weapon.curses.explosive.desc_hot=La tua arma è calda! Sta per esplodere!
items.equipment.weapon.curses.explosive.elestrike_desc=Un colpo elementale con una maledizione esplosiva ha una probabilità del 50% di far apparire un'esplosione su un nemico casuale nel raggio d'azione.

items.equipment.weapon.curses.friendly.name=%s amichevole
items.equipment.weapon.curses.friendly.desc=Le armi amichevoli sono le più appropriate per i pacifisti, scatenando talvolta una magia che rende impossibile combattere.
items.equipment.weapon.curses.friendly.elestrike_desc=Un colpo elementale con una maledizione amichevole ha una probabilità del 50% di ammaliare ogni nemico nel raggio d'azione per 6 turni.

items.equipment.weapon.curses.polarized.name=%s polarizzata
items.equipment.weapon.curses.polarized.desc=Un'arma polarizzata è affetta da una magia che rende i suoi attacchi infliggere il 50% dei danni in più, o nessun danno del tutto.
items.equipment.weapon.curses.polarized.elestrike_desc=Un attacco elementale con una maledizione polarizzata ha una probabilità del 50% di infliggere 24-36 danni a ciascun nemico nel raggio d'azione.

items.equipment.weapon.curses.pressurized.name=pressurizzante %s
items.equipment.weapon.curses.pressurized.desc=Armi pressurizzanti possono esplodere in un forte geyser d'acqua che spingerà tutto via, incluso te.
items.equipment.weapon.curses.pressurized.elestrike_desc=Un colpo elementale con una maledizione pressurizzante creerà un'onda d'acqua che distruggerà il terreno e spingerà via tutti i nemici.

items.equipment.weapon.curses.sacrificial.name=%s sacrificale
items.equipment.weapon.curses.sacrificial.desc=Le armi sacrificali esigeranno il sangue del portatore come compenso per l'attacco degli avversari. Più in salute è il portatore, più sangue si prenderà la maledizione.
items.equipment.weapon.curses.sacrificial.elestrike_desc=Un colpo elementale con una maledizione sacrificale fa sanguinare l'eroe e ogni nemico nel raggio d'azione per 12 PS.

items.equipment.weapon.curses.wayward.name=%s ribelle
items.equipment.weapon.curses.wayward.desc=Le armi ribelli ogni tanto saranno estremamente inaccurate. La magia dura per un po' di tempo quando si attiva, ma può essere rimossa colpendo un nemico con l'arma ribelle.
items.equipment.weapon.curses.wayward.elestrike_desc=Un attacco elementale con una maledizione ribelle ha una probabilità del 50% di maledire ogni nemico nel raggio d'azione per 6 turni.
items.equipment.weapon.curses.wayward$waywardbuff.name=ribelle
items.equipment.weapon.curses.wayward$waywardbuff.desc=La magia della tua arma vagabonda si è attivata, rendendola estremamente inaccurata per un po'. Nota che ciò non influenza attacchi che colpiranno sicuramente il bersaglio, ad esempio gli attacchi a sorpresa. Colpire con successo con la tua arma vagabonda terminera immediatamente l'effetto.\n\nTurni rimanenti: %s.

items.equipment.weapon.curses.wondrous.name=meravigliosa%s
items.equipment.weapon.curses.wondrous.desc=Armi meravigliose contengono la stessa energia delle bacchette maledette. Non c'è modo di sapere cosa accadrà quando questa maledizione si attiva!
items.equipment.weapon.curses.wondrous.elestrike_desc=Un colpo elementale con una maledizione meravigliosa può affliggere ogni nemico con un effetto diverso delle bacchette maledette.

###enchantments
items.equipment.weapon.enchantments.blazing.name=%s ardente
items.equipment.weapon.enchantments.blazing.desc=Questo incantamento provoca l'emissione di fiamme da un'arma, mandando a fuoco i nemici e arrecando danni bonus a quelli già incendiati.
items.equipment.weapon.enchantments.blazing.elestrike_desc=Un colpo elementale con un incantesimo ardente diffonde il fuoco su ogni casella nel raggio, che dura 8 turni.

items.equipment.weapon.enchantments.blocking.name=%s bloccante
items.equipment.weapon.enchantments.blocking.desc=Le armi bloccanti hanno una possibilità di darti un breve scudo dopo aver attaccato.
items.equipment.weapon.enchantments.blocking.elestrike_desc=Un colpo elementale con un incantesimo bloccante garantisce alla Duellante 6 scudi extra per ogni nemico nel raggio d'azione.
items.equipment.weapon.enchantments.blocking$blockbuff.name=bloccante
items.equipment.weapon.enchantments.blocking$blockbuff.desc=L'incantamento bloccante della tua arma ti ha donato un breve incremento di potere difensivo!\n\nScudo rimasto: %d\n\nTurni rimasti:%s.

items.equipment.weapon.enchantments.blooming.name=%s fiorente
items.equipment.weapon.enchantments.blooming.desc=Le armi fiorenti contengono una magia che farà spuntare vegetazione attorno a colui colpito da esse.
items.equipment.weapon.enchantments.blooming.elestrike_desc=Un colpo elementale con un incantesimo fiorente diffonde l'erba fino a un massimo di 8 caselle nel raggio d'azione e radica tutti i nemici nel raggio d'azione per 6 turni.

items.equipment.weapon.enchantments.chilling.name=%s ghiacciante
items.equipment.weapon.enchantments.chilling.desc=I nemici colpiti con questo incantamento vengono raffreddati, rallentando i loro movimenti ed attacchi.
items.equipment.weapon.enchantments.chilling.elestrike_desc=Un colpo elementale con un incantesimo ghiacciante diffonde aria gelida su ogni casella nel raggio d'azione, che dura 8 turni.

items.equipment.weapon.enchantments.crystal.name=cristallizzata %s
items.equipment.weapon.enchantments.crystal.alert_fixed=La tua arma cristallizzata è completamente riparata!
items.equipment.weapon.enchantments.crystal.alert_fixed_ghost=L'arma cristallizzata del fantasma è completamente riparata!
items.equipment.weapon.enchantments.crystal.alert_noflaw=La tua arma cristallizzata non è più rovinata.
items.equipment.weapon.enchantments.crystal.alert_noflaw_ghost=L'arma cristallizzata del fantasma non è più rovinata.
items.equipment.weapon.enchantments.crystal.alert_nocrack=La tua arma cristallizzata non è più frantumata.
items.equipment.weapon.enchantments.crystal.alert_nocrack_ghost=L'arma cristallizzata del fantasma non è più frantumata.
items.equipment.weapon.enchantments.crystal.alert_flawed=La tua arma cristallizzata si è danneggiata leggermente.
items.equipment.weapon.enchantments.crystal.alert_flawed_ghost=L'arma cristallizzata del fantasma si è danneggiata leggermente.
items.equipment.weapon.enchantments.crystal.alert_cracked=La tua arma cristallizzata si sta frantumando, si romperà tra poco!
items.equipment.weapon.enchantments.crystal.alert_cracked_ghost=L'arma cristallizzata del fantasma si sta frantumando, si romperà tra poco!
items.equipment.weapon.enchantments.crystal.alert_shattered=La tua arma cristallizzata esplode in mille pezzi!
items.equipment.weapon.enchantments.crystal.alert_shattered_ghost=L'arma cristallizzata del fantasma esplode in mille pezzi!
items.equipment.weapon.enchantments.crystal.desc=Questo potente incantamento causa danni magici extra e aumenta il valore di un'arma. Ma attenzione, l'arma incantata può distruggersi se i cristalli non vengono riparati, o se non gli si lascia abbastanza tempo per ripararsi da soli.
items.equipment.weapon.enchantments.crystal.desc_thrown=Armi da lancio cristallizzate hanno molta meno durabilità, ma la ricoverano lentamente nel tempo.
items.equipment.weapon.enchantments.crystal.desc_perfect=Quest'arma cristallizzata è in condizioni perfette.
items.equipment.weapon.enchantments.crystal.desc_fine=Quest'arma cristallizzata è in buone condizioni.
items.equipment.weapon.enchantments.crystal.desc_flawed=Quest'arma cristallizzata è un po' rovinata, ma non si sta per rompere.
items.equipment.weapon.enchantments.crystal.desc_cracked=Quest'arma cristallizzata si sta frantumando, è a rischio di rompersi permanentemente!
items.equipment.weapon.enchantments.crystal.elestrike_desc=Un colpo elementale con un incantesimo cristallizzato causa 10-20 danni e ripara l'arma per ogni nemico colpito, tranne il bersaglio primario.

items.equipment.weapon.enchantments.kinetic.name=%s ad energia cinetica
items.equipment.weapon.enchantments.kinetic.desc=Quando un nemico viene ucciso da un'arma cinetica, ogni forza residua viene immagazzinata nell'arma e verrà applicata al prossimo attacco a segno.
items.equipment.weapon.enchantments.kinetic.elestrike_desc=Un colpo elementale con un incantesimo cinetico infligge il 40% dei danni immagazzinati a ogni nemico nel raggio d'azione, tranne il bersaglio principale.
items.equipment.weapon.enchantments.kinetic$conserveddamage.name=danno conservato
items.equipment.weapon.enchantments.kinetic$conserveddamage.desc=La tua arma ha immagazzinato la forza in eccesso da un precedente colpo mortale e verrà inflitta come danno bonus al tuo prossimo attacco. L'energia, comunque sia, svanirà lentamente nel tempo.\n\nDanno Conservato: %d.

items.equipment.weapon.enchantments.corrupting.name=%s corrompente
items.equipment.weapon.enchantments.corrupting.desc=Questo potente incantamento possiede l'abilità di piegare i nemici al tuo volere. Quando un nemico viene ucciso da quest'arma, c'è una probabilità che venga corrotto invece di morire.
items.equipment.weapon.enchantments.corrupting.elestrike_desc=Un colpo elementale con un incantesimo corrompente ha una probabilità del 5-25% (basata sugli HP mancanti) di corrompere ogni nemico nel raggio d'azione, tranne il bersaglio principale.

items.equipment.weapon.enchantments.eldritch.name=%s inquietante
items.equipment.weapon.enchantments.eldritch.desc=Armi inquietanti spaventano i nemici che vedono i loro colpi, facendoli scappare dall'utilizzatore.
items.equipment.weapon.enchantments.eldritch.elestrike_desc=Un colpo elementale con un'arma inquietante causa paura per un lungo tempo a tutti i nemici colpiti, incluso il bersaglio primario.

items.equipment.weapon.enchantments.elastic.name=%s dell'elasticità
items.equipment.weapon.enchantments.elastic.desc=Le armi elastiche hanno la possibilità di spedire i nemici all'indietro per brevi distanze.
items.equipment.weapon.enchantments.elastic.elestrike_desc=Un colpo elementale con un incantesimo elastico respinge tutti i nemici nel raggio d'azione di 5 caselle.

items.equipment.weapon.enchantments.grim.name=%s feroce
items.equipment.weapon.enchantments.grim.desc=Questo potente incantamento possiede il potere di uccidere instantaneamente un nemico. L'effetto è tanto più probabile quanto più debole è il nemico.
items.equipment.weapon.enchantments.grim.elestrike_desc=Un colpo elementale con un incantesimo feroce ha una possibilità del 6-30% (in base agli HP mancanti) di uccidere ogni nemico nel raggio d'azione, tranne il bersaglio principale.

items.equipment.weapon.enchantments.lucky.name=%s portafortuna
items.equipment.weapon.enchantments.lucky.desc=Nemici uccisi con un'arma fortunata hanno la possibilità di lasciare del bottino aggiuntivo.
items.equipment.weapon.enchantments.lucky.elestrike_desc=Un colpo elementale con un incantesimo fortunato ha una probabilità del 12.5% di generare bottino sotto ogni nemico nel raggio d'azione. Questo effetto può attivarsi solo una volta per nemico.

items.equipment.weapon.enchantments.projecting.name=%s prominente
items.equipment.weapon.enchantments.projecting.desc=Con questo incantamento le armi da mischia acquisiranno portata extra. Le armi a distanza saranno in grado di penetrare i muri quando mirate a nemici vicini.
items.equipment.weapon.enchantments.projecting.elestrike_desc=Un colpo elementale con un incantesimo proiettante infligge il 30% di danni a ogni nemico nel raggio d'azione, tranne il bersaglio principale.

items.equipment.weapon.enchantments.shocking.name=%s fulminante
items.equipment.weapon.enchantments.shocking.desc=L'elettricità scaturisce da un'arma fulminante, infliggendo danno extra a tutti i nemici vicini.
items.equipment.weapon.enchantments.shocking.elestrike_desc=Un colpo elementale con un incantesimo fulminante diffonde elettricità in ogni casella nel raggio d'azione, che dura 8 turni.

items.equipment.weapon.enchantments.unstable.name=%s instabile
items.equipment.weapon.enchantments.unstable.desc=Questo incantamento irradia energia caotica, assumendo la forma di un'incantamento diverso a ogni colpo.
items.equipment.weapon.enchantments.unstable.elestrike_desc=Un colpo elementale con un incantesimo instabile applica un effetto di incantesimo casuale a ogni nemico nel raggio d'azione, eccetto il bersaglio principale.

items.equipment.weapon.enchantments.vampiric.name=%s vampirica
items.equipment.weapon.enchantments.vampiric.desc=Questo potente incantamento sottrae forza vitale dai nemici ad ogni colpo, incanalandola verso il portatore. L'effetto è più forte tanto quanto più bassa è la salute del portatore.
items.equipment.weapon.enchantments.vampiric.elestrike_desc=Un colpo elementale con un incantesimo vampirico cura la Duellante di 2.5 HP per ogni nemico nel raggio d'azione.

items.equipment.weapon.enchantments.venomous.name=%s velenosa
items.equipment.weapon.enchantments.venomous.desc=Armi velenose infliggono un veleno lento ma potente, che diventa più letale ogni volta che viene applicato.
items.equipment.weapon.enchantments.venomous.elestrike_desc=Un colpo elementale con un'arma velenosa applica addizionale veleno a tutti i nemici colpiti, tranne il bersaglio primario.

items.equipment.weapon.enchantments.vorpal.name=%s bigralace
items.equipment.weapon.enchantments.vorpal.desc=Armi bigralace sono particolarmente letali, hanno una possibilità di colpire con così tanta precisione che infliggeranno sanguinamento invece che danni a nemici che possono sanguinare.
items.equipment.weapon.enchantments.vorpal.elestrike_desc=Un colpo elementale con un'arma bigralace applica sanguinamento addizionale a tutti i nemici colpiti, tranne il bersaglio primario.


###melee weapons
items.equipment.weapon.melee.assassinsblade.name=lama dell'assassino
items.equipment.weapon.melee.assassinsblade.stats_desc=Quest'arma è più forte contro nemici ignari.
items.equipment.weapon.melee.assassinsblade.ability_name=intrufolati
items.equipment.weapon.melee.assassinsblade.typical_ability_desc=La Duellante può _nascondersi_ mentre brandisce una lama dell'assassino. Questa abilità consente alla Duellante di scattare fino a 3 caselle di distanza e tipicamente le fornisce _%d turni di invisibilità_
items.equipment.weapon.melee.assassinsblade.ability_desc=La Duellante può _nascondersi_ mentre brandisce una lama dell'assassino. Questa abilità consente alla Duellante di scattare istantaneamente fino a 3 caselle di distanza e le fornisce _%d turni di invisibilità_
items.equipment.weapon.melee.assassinsblade.upgrade_ability_stat_name=Durata dell'abilità
items.equipment.weapon.melee.assassinsblade.desc=Una piccola lama ondulata di ossidiana, difficile da usare malgrado la sua leggerezza, ma mortale se trova il bersaglio giusto.

items.equipment.weapon.melee.battleaxe.name=Ascia da battaglia
items.equipment.weapon.melee.battleaxe.stats_desc=Questa è un'arma piuttosto accurata.
items.equipment.weapon.melee.battleaxe.ability_name=colpo pesante
items.equipment.weapon.melee.battleaxe.typical_ability_desc=La Duellante può compiere un _colpo pesante_ con un'ascia da battaglia. Questo attacco concentrato infligge tipicamente _%1$d-%2$d danni_ se sorprende il nemico, e lo confonde per 5 turni che riducono la precisione e l'evasione di 50 %%. Il colpo pesante colpisce sempre ma infligge danno normale se non sorprende il nemico.
items.equipment.weapon.melee.battleaxe.ability_desc=La Duellante può sferrare un _colpo pesante_ con un'ascia da battaglia. Questo attacco concentrato infligge _%1$d-%2$d danni_ se sorprende il nemico e lo stordisce per 5 turni, riducendo la precisione e l'evasione di 50%%. Il colpo pesante colpisce sempre ma infligge danni regolari se non sorprende il nemico.
items.equipment.weapon.melee.battleaxe.desc=L'enorme testa d'acciaio di questa ascia da battaglia porta un considerevole peso in coda a ogni ampio colpo.

items.equipment.weapon.melee.crossbow.name=balestra
items.equipment.weapon.melee.crossbow.typical_stats_desc=Di solito quest'arma porta i danni dei dardi lanciati a _%1$d-%2$d_ mentre è equipaggiata, e gli applica anche il suo incantamento.
items.equipment.weapon.melee.crossbow.stats_desc=Quest'arma porta i danni dei dardi lanciati a _%1$d-%2$d_ mentre è equipaggiata, e gli applica anche il suo incantamento.
items.equipment.weapon.melee.crossbow.ability_name=colpo caricato
items.equipment.weapon.melee.crossbow.typical_ability_desc=La Duellante può _caricare_ la sua balestra, facendo sì che il suo prossimo attacco regolare con essa colpisca sempre e applichi uno dei tre effetti: gli attacchi in mischia respingeranno i nemici, i dardi senza punta infliggeranno generalmente _+%1$d danni_ e i dardi con punta applicheranno il loro effetto in un'area 7x7 e in genere durano per _%2$d più usi_.
items.equipment.weapon.melee.crossbow.ability_desc=La Duellante può _caricare_ la sua balestra, facendo sì che il suo prossimo attacco regolare con essa colpisca sempre e applichi uno dei tre effetti: gli attacchi in mischia respingeranno i nemici, i dardi senza punta infliggeranno _+%1$d danni_ e i dardi con punta applicheranno il loro effetto in un'area 7x7 e durano per _%2$d altri usi_.
items.equipment.weapon.melee.crossbow.desc=Un'arma piuttosto complessa che spara dardi ad una velocità straordinaria. Anche se non è progettata a tal fine, la pesante e robusta struttura della balestra la rende una rispettabile arma da mischia.
items.equipment.weapon.melee.crossbow.upgrade_ability_stat_name=Potenziamento abilità
items.equipment.weapon.melee.crossbow$chargedshot.name=caricato
items.equipment.weapon.melee.crossbow$chargedshot.desc=La Duellante sta concentrando il potere sulla sua balestra. Il prossimo attacco che effettuerà con essa colpirà sempre e applicherà uno dei tre effetti:\n- Gli attacchi in mischia spingeranno i nemici indietro di qualche casella.\n- I dardi senza punta infliggeranno danni bonus.\n- I dardi con punta acquisiranno usi extra e applicheranno il loro effetto in un'area 7x7. Gli effetti dei dardi positivi influenzeranno solo gli alleati e gli effetti dannosi si applicheranno solo ai nemici. La Duellante non può usare questa capacità per applicare effetti positivi dei dardi su se stessa.

items.equipment.weapon.melee.cudgel.name=randello
items.equipment.weapon.melee.cudgel.stats_desc=Questa è un'arma piuttosto accurata.
items.equipment.weapon.melee.cudgel.ability_name=colpo pesante
items.equipment.weapon.melee.cudgel.typical_ability_desc=La Duellante può eseguire un _colpo pesante_ con un randello. Questo attacco concentrato in genere infligge _%1$d-%2$d danni_ se sorprende il nemico e lo stordisce per 5 turni, riducendo la precisione e l'evasione di 50%%. Il colpo pesante colpisce sempre ma infligge danni regolari se non sorprende il nemico.
items.equipment.weapon.melee.cudgel.ability_desc=La Duellante può eseguire un _colpo pesante_ con un randello. Questo attacco concentrato infligge _%1$d-%2$d danni_ se sorprende il nemico e lo stordisce per 5 turni, riducendo la precisione e l'evasione di 50%%. Il colpo pesante colpisce sempre ma infligge danni regolari se non sorprende il nemico.
items.equipment.weapon.melee.cudgel.desc=Una piccola mazza in ottone, più adatta ad essere una difesa personale di un nobile piuttosto che per le avventure.
items.equipment.weapon.melee.cudgel.discover_hint=Uno degli eroi inizia con questo oggetto.

items.equipment.weapon.melee.dagger.name=pugnale
items.equipment.weapon.melee.dagger.stats_desc=Quest'arma è più forte contro nemici ignari.
items.equipment.weapon.melee.dagger.ability_name=intrufolati
items.equipment.weapon.melee.dagger.typical_ability_desc=La Duellante può _nascondersi_ mentre brandisce un pugnale. Questa abilità consente alla Duellante di scattare istantaneamente fino a 5 caselle di distanza e tipicamente le dà _%d turni di invisibilità._
items.equipment.weapon.melee.dagger.ability_desc=La Duellante può _nascondersi_ mentre brandisce un pugnale. Questa abilità consente alla Duellante di teletrasportarsi istantaneamente fino a 5 tessere di distanza e le garantisce _%d turni di invisibilità._
items.equipment.weapon.melee.dagger.upgrade_ability_stat_name=Durata dell'abilità
items.equipment.weapon.melee.dagger.desc=Un semplice pugnale di ferro con un'impugnatura usurata in legno.
items.equipment.weapon.melee.dagger.discover_hint=Uno degli eroi inizia con questo oggetto.

items.equipment.weapon.melee.dirk.name=dirk
items.equipment.weapon.melee.dirk.stats_desc=Quest'arma è più forte contro nemici ignari.
items.equipment.weapon.melee.dirk.ability_name=intrufolati
items.equipment.weapon.melee.dirk.typical_ability_desc=La Duellante può _nascondersi_ mentre brandisce un dirk. Questa abilità consente alla Duellante di teletrasportarsi istantaneamente fino a 4 tessere di distanza e in genere le garantisce _%d turni di invisibilità._
items.equipment.weapon.melee.dirk.ability_desc=La Duellante può _nascondersi_ mentre brandisce un dirk. Questa abilità consente alla Duellante di teletrasportarsi istantaneamente fino a 4 tessere di distanza e le garantisce _%d turni di invisibilità._
items.equipment.weapon.melee.dirk.upgrade_ability_stat_name=Durata dell'abilità
items.equipment.weapon.melee.dirk.desc=Un lungo e penetrante pugnale, un po' di acciaio in più da conficcare negli avversari.

items.equipment.weapon.melee.flail.name=mazzafrusto
items.equipment.weapon.melee.flail.stats_desc=Questa è un'arma un po' lenta\nQuest'arma non può effettuare attacchi a sorpresa.
items.equipment.weapon.melee.flail.ability_name=roteare
items.equipment.weapon.melee.flail.spin_warn=Non puoi più far roteare il mazzafrusto.
items.equipment.weapon.melee.flail.typical_ability_desc=Il Duellante può far _girare_ un mazzafrusto per aumentarne la potenza per un breve periodo. Per ogni turno in cui il mazzafrusto viene fatto girare, in genere infliggerà _+%d danni_ al suo successivo attacco regolare, fino a un massimo di 3 volte. Un mazzafrusto rotante colpirà sicuramente. Solo iniziare a far girare il mazzafrusto costa una carica.
items.equipment.weapon.melee.flail.ability_desc=La Duellante può far _girare_ un mazzafrusto per aumentarne la potenza per un breve periodo. Per ogni turno in cui il mazzafrusto viene fatto girare, infliggerà _+%d danni_ al suo successivo attacco regolare, per un massimo di 3 volte. Un mazzafrusto rotante colpirà sicuramente. Solo iniziare a far girare il mazzafrusto costa una carica.
items.equipment.weapon.melee.flail.desc=Una palla chiodata collegata all'impugnatura da una catena. Molto scomoda da maneggiare, ma devastante se assesta un solido colpo.
items.equipment.weapon.melee.flail$spinabilitytracker.name=roteare
items.equipment.weapon.melee.flail$spinabilitytracker.desc=La Duellante sta facendo roteare il suo mazzafrusto, accumulando danni per il suo prossimo attacco regolare. Ogni giro dura un turno ma aumenta il danno, fino a un massimo di tre turni. È inoltre garantito che il mazzafrusto colpisca mentre gira.\n\nGiri attuali: %1$d%%.\nTurni rimanenti: %2$s.

items.equipment.weapon.melee.gauntlet.name=guanto di pietra
items.equipment.weapon.melee.gauntlet.stats_desc=Questa è un'arma molto veloce.
items.equipment.weapon.melee.gauntlet.ability_name=attacco combinato
items.equipment.weapon.melee.gauntlet.typical_ability_desc=La Duellante può eseguire un _colpo combo_ con un guanto di pietra. Questo attacco è sicuro di colpire e in genere infligge _+%d danni_ per ogni volta che la Duellante ha colpito con un normale attacco in mischia o con un'arma da lancio. Non colpire per 5 turni (15 dopo un'uccisione) azzera questa combo.
items.equipment.weapon.melee.gauntlet.ability_desc=La Duellante può eseguire un _colpo combo_ con un guanto di pietra. Questo attacco è sicuro di colpire e infligge _+%d danni_ per ogni volta che la Duellante ha colpito con un normale attacco in mischia o con un'arma da lancio. Non colpire per 5 turni (15 dopo un'uccisione) azzera questa combo.
items.equipment.weapon.melee.gauntlet.desc=Questo enorme guanto è fatto di un tessuto cremisi con al di sopra una pesante pietra magica. Il tessuto si stringe attorno a te, rendendo le spesse placche di pietra quasi una seconda pelle. Maneggiare un'arma così pesante richiede forza, ma aggiunge una potenza tremenda ai tuoi colpi.

items.equipment.weapon.melee.glaive.name=falcione
items.equipment.weapon.melee.glaive.stats_desc=Si tratta di un'arma piuttosto lenta.\nQuest'arma ha una portata extra.
items.equipment.weapon.melee.glaive.ability_name=arpione
items.equipment.weapon.melee.glaive.typical_ability_desc=La Duellante può usare la punta di un falcione per _infilzare_ un nemico che sia nel suo raggio d'azione ma non adiacente. Questo generalmente infligge _%1$d-%2$d danni_, respinge il nemico indietro ed è garantito che colpisca.
items.equipment.weapon.melee.glaive.ability_desc=La Duellante può usare la punta di un falcione per _infilzare_ un nemico che sia nel suo raggio d'azione ma non adiacente. Questo infligge _%1$d-%2$d danni_, respinge il nemico indietro ed è garantito che colpisca.
items.equipment.weapon.melee.glaive.desc=Una massiccia arma inastata consistente in una lama di spada posta alla fine di un palo.

items.equipment.weapon.melee.gloves.name=guanti borchiati
items.equipment.weapon.melee.gloves.stats_desc=Questa è un'arma molto veloce.
items.equipment.weapon.melee.gloves.ability_name=attacco combinato
items.equipment.weapon.melee.gloves.typical_ability_desc=La Duellante può eseguire un _colpo combo_ con i guanti di pietra. Questo attacco è sicuro di colpire e in genere infligge _+%d danni_ per ogni volta che la Duellante ha colpito con un normale attacco in mischia o con un'arma da lancio. Non colpire per 5 turni (15 dopo un'uccisione) azzera questa combo.
items.equipment.weapon.melee.gloves.ability_desc=La Duellante può eseguire un _colpo combo_ con i guanti di pietra. Questo attacco è sicuro di colpire e infligge _+%d danni_ per ogni volta che la Duellante ha colpito con un normale attacco in mischia o con un'arma da lancio. Non colpire per 5 turni (15 dopo un'uccisione) azzera questa combo.
items.equipment.weapon.melee.gloves.desc=Questi guanti borchiati non offrono una vera e propria protezione, agiscono piuttosto come armi efficaci mantenendo le mani libere.
items.equipment.weapon.melee.gloves.discover_hint=Uno degli eroi inizia con questo oggetto.

items.equipment.weapon.melee.greataxe.name=grandascia
items.equipment.weapon.melee.greataxe.stats_desc=Quest'arma è incredibilmente pesante.
items.equipment.weapon.melee.greataxe.ability_name=castigo
items.equipment.weapon.melee.greataxe.typical_ability_desc=La Duellante può eseguire un attacco di _punizione_ con una grandascia se ha meno di 50%% punti salute. Questo attacco devastante in genere infligge _%1$d-%2$d danni,_ colpisce sicuramente ed è istantaneo se uccide un nemico.
items.equipment.weapon.melee.greataxe.ability_desc=La Duellante può eseguire un attacco di _punizione_ con una grandascia se ha meno di 50%% punti salute. Questo attacco devastante infligge _%1$d-%2$d danni,_ colpisce sicuramente ed è istantaneo se uccide un nemico.
items.equipment.weapon.melee.greataxe.desc=Pensata per essere portata sopra la spalla, quest'ascia titanica è tanto potente quanto pesante.

items.equipment.weapon.melee.greatshield.name=granscudo
items.equipment.weapon.melee.greatshield.typical_stats_desc=Di solito quest'arma blocca 0-%d punti danno. Tale blocco aumenta con i miglioramenti.
items.equipment.weapon.melee.greatshield.stats_desc=Quest'arma blocca 0-%d punti danno. Tale blocco aumenta con i miglioramenti.
items.equipment.weapon.melee.greatshield.ability_name=protezione
items.equipment.weapon.melee.greatshield.typical_ability_desc=La Duellante può _proteggersi_ con un granscudo, annullando completamente tutti gli attacchi fisici o magici effettuati contro di lei, generalmente per _%d turni_. Una volta che la Duellante ha bloccato un attacco, contrattaccare o usare la magia interromperà la protezione.
items.equipment.weapon.melee.greatshield.ability_desc=La Duellante può _proteggersi_ con un granscudo, annullando completamente tutti gli attacchi fisici o magici effettuati contro di lei per _%d turni_. Una volta che la Duellante ha bloccato un attacco, contrattaccare o usare la magia interromperà la protezione.
items.equipment.weapon.melee.greatshield.upgrade_ability_stat_name=Durata dell'abilità
items.equipment.weapon.melee.greatshield.desc=Più un muro mobile che uno scudo, questa gigantesca massa di metallo assiste nella difesa, ma non lascia molto spazio per attaccare.

items.equipment.weapon.melee.greatsword.name=granspada
items.equipment.weapon.melee.greatsword.ability_name=fendente
items.equipment.weapon.melee.greatsword.typical_ability_desc=La Duellante può _fendere_ un nemico con una granspada. Questo in genere infligge _%1$d-%2$d danni_ ed è garantito che colpisca. Se l'attacco uccide un nemico, l'effetto è istantaneo e la Duellante può usarlo nuovamente entro 5 turni gratuitamente.
items.equipment.weapon.melee.greatsword.ability_desc=La Duellante può _fendere_ un nemico con una granspada. Questo infligge _%1$d-%2$d danni_ ed è garantito che colpisca. Se l'attacco uccide un nemico, l'effetto è istantaneo e la Duellante può usarlo nuovamente entro 5 turni gratuitamente.
items.equipment.weapon.melee.greatsword.desc=Quest'imponente lama infligge danni pesanti conferendo il suo peso a ogni colpo.

items.equipment.weapon.melee.handaxe.name=accetta
items.equipment.weapon.melee.handaxe.stats_desc=Questa è un'arma piuttosto accurata.
items.equipment.weapon.melee.handaxe.ability_name=colpo pesante
items.equipment.weapon.melee.handaxe.typical_ability_desc=La Duellante può eseguire un _colpo pesante_ con un'ascia. Questo attacco concentrato in genere infligge _%1$d-%2$d danni_ se sorprende il nemico e lo stordisce per 5 turni, riducendo la precisione e l'evasione di 50%%. Il colpo pesante colpisce sempre ma infligge danni regolari se non sorprende il nemico.
