items.equipment.weapon.melee.quarterstaff$defensivestance.desc=La Duellante sta usando la sua asta di legno per deviare colpi e proiettili in arrivo. Finché è in questa posizione, la sua evasione contro tutti gli attacchi è triplicata.\n\nTurni rimanenti: %s.

items.equipment.weapon.melee.rapier.name=stocco
