items.equipment.weapon.melee.scimitar.typical_ability_desc=La Duellante può eseguire una _danza della spada_ con una scimitarra. Questa posizione non richiede tempo per essere attivata e garantisce alla Duellante +60%% velocità di attacco e +50%% accuratezza in genere per _%d turni._
items.equipment.weapon.melee.scimitar.ability_desc=La Duellante può eseguire una _danza della spada_ con una scimitarra. Questa posizione non richiede tempo per essere attivata e garantisce alla Duellante +60%% velocità di attacco e +50%% accuratezza per _%d turni._
items.equipment.weapon.melee.scimitar.upgrade_ability_stat_name=Durata dell'abilità
items.equipment.weapon.melee.scimitar.desc=Una lama curva e spessa. La sua forma permette attacchi più veloci, sebbene poco potenti.
items.equipment.weapon.melee.scimitar$sworddance.name=danza della spada
items.equipment.weapon.melee.scimitar$sworddance.desc=La Duellante sta effettuando rapidi colpi usando il suo slancio, in una sorta di danza. Mentre questa posizione è attiva, attacca 60%% più velocemente (abbastanza per attaccare esattamente due volte per turno con una scimitarra) ed ha +50%% di accuratezza.\n\nTurni rimasti: %s.

items.equipment.weapon.melee.sickle.name=falcetta
items.equipment.weapon.melee.sickle.stats_desc=Questa è un'arma piuttosto imprecisa.
items.equipment.weapon.melee.sickle.ability_name=raccolta
items.equipment.weapon.melee.sickle.typical_ability_desc=La Duellante può _mietere_ un nemico con una falce. Questo attacco devastante è sicuro di colpire e in genere infligge _%d danni_. Questo danno viene applicato come sanguinamento se il bersaglio non ne è immune.
items.equipment.weapon.melee.sickle.ability_desc=La Duellante può _mietere_ un nemico con una falce. Questo attacco devastante è sicuro di colpire e infliggere _%d danni_. Questo danno viene applicato come sanguinamento se il bersaglio non è immune.
items.equipment.weapon.melee.sickle.desc=Uno strumento agricolo portatile che può essere usato come un'arma forte ma ingombrante.

items.equipment.weapon.melee.spear.name=lancia
items.equipment.weapon.melee.spear.stats_desc=Si tratta di un'arma piuttosto lenta.\nQuest'arma ha una portata extra.
items.equipment.weapon.melee.spear.ability_name=arpione
items.equipment.weapon.melee.spear.typical_ability_desc=La Duellante può usare la punta di una lancia per _infilzare_ un nemico che si trova nel raggio d'azione ma non adiacente. Questo in genere infligge _%1$d-%2$d danni_, respinge il nemico ed è garantito che colpisca.
items.equipment.weapon.melee.spear.ability_desc=La Duellante può usare la punta di una lancia per _infilzare_ un nemico che si trova nel raggio d'azione ma non adiacente. Questo infligge _%1$d-%2$d danni_, respinge il nemico ed è garantito che colpisca.
items.equipment.weapon.melee.spear.desc=Una sottile barra di legno ricoperta in punta con un ferro affilato.

items.equipment.weapon.melee.sword.name=spada
items.equipment.weapon.melee.sword.ability_name=fendente
items.equipment.weapon.melee.sword.typical_ability_desc=La Duellante può _fendere_ un nemico con una spada. Questo in genere infligge _%1$d-%2$d danni_ ed è garantito che colpisca. Se l'attacco uccide un nemico, l'effetto è istantaneo e la Duellante può usarlo nuovamente entro 5 turni gratuitamente.
items.equipment.weapon.melee.sword.ability_desc=La Duellante può _fendere_ un nemico con una spada. Questo infligge _%1$d-%2$d danni_ ed è garantito che colpisca. Se l'attacco uccide un nemico, l'effetto è istantaneo e la Duellante può usarlo nuovamente entro 5 turni gratuitamente.
