items.equipment.weapon.melee.longsword.typical_ability_desc=La Duellante può _fendere_ un nemico con uno spadone. Questo in genere infligge un _%1$d-%2$d di danno_ e colpisce sicuramente. Se l'attacco uccide un nemico, è istantaneo e la Duellante può usarlo nuovamente entro 5 turni gratuitamente.
