###armor curses
items.equipment.armor.curses.antientropy.name=%s dell'anti-entropia
items.equipment.armor.curses.antientropy.desc=La maledizione di Anti-entropia lavora contro le forze dell'universo, spingendo energia dentro chi la indossa prendendola dai suoi dintorni. Ciò dà fuoco brevemente al portatore, ma congela tutto intorno a lui!

items.equipment.armor.curses.bulk.name=%s della massa
items.equipment.armor.curses.bulk.desc=Un'armatura della massa appare più grande ed imponente ma non offre veramente una difesa migliore. Peggio ancora, le maggiori dimensioni rendono molto difficoltoso entrare nelle porte.

items.equipment.armor.curses.corrosion.name=%s della corrosione
items.equipment.armor.curses.corrosion.desc=L'armatura della corrosione è in grado di sprizzare fluido corrosivo, ricoprendo ogni cosa nell'area con appiccicosa melma acida.

items.equipment.armor.curses.displacement.name=%s del dislocamento
items.equipment.armor.curses.displacement.desc=La maledizione del dislocamento tenta di mettere in salvo il portatore dell'oggetto quando viene attaccato. Tuttavia, essa risulta troppo efficace, teletrasportando casualmente il portatore in giro per il piano.

items.equipment.armor.curses.metabolism.name=%s del metabolismo
items.equipment.armor.curses.metabolism.desc=La maledizione del metabolismo converte direttamente la sazietà in salute quando il portatore è ferito, provvedendo così ad un incremento in guarigione, ma causando velocemente fame estrema.

items.equipment.armor.curses.multiplicity.name=%s della molteplicità
items.equipment.armor.curses.multiplicity.desc=Un'armatura maledetta con molteplicità contiene una pericolosa magia duplicante. Creerà a volte un'immagine speculare del portatore, ma è altrettanto probabile che duplichi l'attaccante!

items.equipment.armor.curses.overgrowth.name=%s della sovracrescita
items.equipment.armor.curses.overgrowth.desc=Un'armatura della sovracrescita è coperta da diverse piante in fiore. Nonostante questo effetto appaia sicuramente interessante, è ininfluente per la difesa e tali piante si attiveranno casualmente durante il combattimento!

items.equipment.armor.curses.stench.name=%s del fetore
items.equipment.armor.curses.stench.desc=Un'armatura maledetta con fetore rilascerà nuvole di gas nocivo, pericoloso per ogni cosa intrappolata nella nube.


###glyphs
items.equipment.armor.glyphs.affection.name=%s dell'affezione
items.equipment.armor.glyphs.affection.desc=Questo potente glifo manipola la mente degli attaccanti, affascinandoli temporaneamente.

items.equipment.armor.glyphs.antimagic.name=%s dell'anti-magia
items.equipment.armor.glyphs.antimagic.desc=Questo potente glifo permette all'armatura di difendere colui che la indossa dagli attacchi magici così come quelli fisici. Tale difesa magica non è influenzata dalla categoria dell'armatura.

items.equipment.armor.glyphs.brimstone.name=%s sulfurea
items.equipment.armor.glyphs.brimstone.desc=Questo glifo protegge il portatore ed i suoi averi dal fuoco, annullando completamente gli effetti negativi e i danni causati da esso.

items.equipment.armor.glyphs.camouflage.name=%s del camuffamento
items.equipment.armor.glyphs.camouflage.desc=Questo glifo permette al portatore di mimetizzarsi nell'erba alta, concedendogli invisibilità temporanea.

items.equipment.armor.glyphs.entanglement.name=%s del groviglio
items.equipment.armor.glyphs.entanglement.desc=Questo glifo fa crescere radicaterra attorno al portatore per attutire i danni, ma tale armatura si romperà se ci si muove.

items.equipment.armor.glyphs.flow.name=%s del flusso
items.equipment.armor.glyphs.flow.desc=Questo glifo manipola il flusso dell'acqua attorno al portatore, rendendolo molto più veloce quando si muove attraverso essa.

items.equipment.armor.glyphs.obfuscation.name=%s dell'offuscamento
items.equipment.armor.glyphs.obfuscation.desc=Questo glifo offusca il portatore, rendendolo più difficile da individuare.

items.equipment.armor.glyphs.potential.name=%s potenziale
items.equipment.armor.glyphs.potential.desc=Questo glifo accumula energia quando colpito, donando carica alla bacchetta del portatore quando si attiva.

items.equipment.armor.glyphs.repulsion.name=%s della repulsione
items.equipment.armor.glyphs.repulsion.desc=Questo glifo rimbalza la forza contro gli attaccanti, sbalzandoli all'indietro.

items.equipment.armor.glyphs.stone.name=%s della pietra
items.equipment.armor.glyphs.stone.desc=Questo glifo circonda l'armatura di pesante pietra magica che rende impossibile schivare, ma blocca il danno in proporzione all'evasione.

items.equipment.armor.glyphs.swiftness.name=%s della celerità
items.equipment.armor.glyphs.swiftness.desc=Questo glifo aumenta la velocità del portatore ogni qual volta non è vicino ad un nemico.

items.equipment.armor.glyphs.thorns.name=%s di spine
items.equipment.armor.glyphs.thorns.desc=Questo potente glifo ferisce gli attaccanti, causando loro sanguinamenti quando attaccano il portatore.

items.equipment.armor.glyphs.viscosity.name=%s della viscosità
items.equipment.armor.glyphs.viscosity.deferred=differito %d
items.equipment.armor.glyphs.viscosity$defereddamage.name=danno differito
items.equipment.armor.glyphs.viscosity$defereddamage.ondeath=Il danno differito ti ha ucciso...
items.equipment.armor.glyphs.viscosity$defereddamage.rankings_desc=Ucciso dal danno differito
items.equipment.armor.glyphs.viscosity$defereddamage.desc=Il danno ti viene inferto nel tempo invece che immediatamente.\n\nDanno posticipato rimanente: %d.
items.equipment.armor.glyphs.viscosity.desc=Questo glifo è capace di immagazzinare il danno inflitto al portatore, restituendolo a lui lentamente piuttosto che tutto in una volta.



###armor
items.equipment.armor.armor.ac_detach=DISTACCA
items.equipment.armor.armor.detach_seal=Distacchi il sigillo dalla tua armatura.
items.equipment.armor.armor.equip_cursed=L'armatura ti si stringe addosso dolorosamente.
items.equipment.armor.armor.identify=Ora hai abbastanza familiarità con la tua armatura da poterla identificare.
items.equipment.armor.armor.hardening_gone=L'indurimento di questa armatura è svanito!
items.equipment.armor.armor.incompatible=L'interazione tra diversi tipi di magia ha cancellato il glifo su quest'armatura!
items.equipment.armor.armor.curr_absorb=Questa armatura di _livello %1$d_ blocca _%2$d-%3$d danni_ e richiede _%4$d forza_ per essere usata correttamente.
items.equipment.armor.armor.avg_absorb=Tipicamente questa armatura di _livello %1$d_ blocca _%2$d-%3$d danni_ e richiede _%4$d forza_ per essere usata correttamente.
items.equipment.armor.armor.too_heavy=A causa della tua forza inadeguata indossare quest'armatura diminuirà la tua abilità di muoversi, schivare e difendersi.
items.equipment.armor.armor.probably_too_heavy=Probabilmente questa armatura è troppo pesante per te.
items.equipment.armor.armor.excess_str=Per via della tua forza in eccesso, sei _più sfuggente_ mentre indossi quest'armatura.
items.equipment.armor.armor.evasion=È incrementata per migliorare _l'evasività._
items.equipment.armor.armor.defense=È incrementata per migliorare _la difesa._
items.equipment.armor.armor.inscribed=è inscritto con _%s._
items.equipment.armor.armor.glyph_hardened=È stata _rinforzata._
items.equipment.armor.armor.hardened_no_glyph=Questa armatura è stata _rinforzata_, ma attualmente non è incisa con un glifo.
items.equipment.armor.armor.cursed_worn=Poiché questa armatura è maledetta, non ti è possibile rimuoverla.
items.equipment.armor.armor.cursed=Puoi percepire un'energia maligna nascondersi in questa armatura.
items.equipment.armor.armor.weak_cursed=Nonostante la maledizione, puoi toglierti quest'armatura.
items.equipment.armor.armor.not_cursed=Questa armatura è libera da magia ostile.
items.equipment.armor.armor.seal_attached=Il sigillo rotto del Guerriero è attaccato a questa armatura. Quando sta per essere portato a meno della metà della vita, gli fornirà _%d di scudo.
items.equipment.armor.armor.seal_transfer=Il sigillo rotto del Guerriero deve essere fissato sulla sua armatura attualmente indossata per beneficiarne. Vuoi staccare automaticamente il sigillo dall'armatura che stai rimuovendo e fissarlo sull'armatura che stai equipaggiando?
items.equipment.armor.armor.seal_transfer_yes=sì
items.equipment.armor.armor.seal_transfer_no=no
items.equipment.armor.armor$glyph.glyph=glifo
items.equipment.armor.armor$glyph.killed=%s ti ha ucciso...
items.equipment.armor.armor$glyph.rankings_desc=Ucciso da un glifo
items.equipment.armor.armor$glyph.discover_hint=Puoi trovare un oggetto con questo effetto casualmente nel dungeon, oppure provare ad applicarlo ad un oggetto tu stesso.

items.equipment.armor.classarmor.ac_ability=SCEGLI ABILITÁ
items.equipment.armor.classarmor.ac_transfer=TRASFERIMENTO
items.equipment.armor.classarmor.no_ability=La tua armatura non ha abilità, puoi sceglierne una!
items.equipment.armor.classarmor.not_equipped=Devi indossare questa armatura per usare il suo potere speciale!
items.equipment.armor.classarmor.low_charge=L'armatura non ha abbastanza carica per usare il suo potere speciale!
items.equipment.armor.classarmor.charge_use=Usare l'abilità in questo momento consumerà _%s_ cariche.
items.equipment.armor.classarmor.transfer_title=Trasferisci Armatura
items.equipment.armor.classarmor.transfer_desc=La magia della corona del Re dei nani può essere trasferita ad un'altra armatura. Nota che l'armatura originaria verrà distrutta nel processo.
items.equipment.armor.classarmor.transfer_prompt=Seleziona un'Armatura
items.equipment.armor.classarmor.transfer_cancel=Annulla
items.equipment.armor.classarmor.transfer_complete=Le proprietà eroiche della tua armatura sono state trasferite!
items.equipment.armor.classarmor.discover_hint=Puoi trovare questo oggetto dopo aver sconfitto il boss del piano 20 con un eroe specifico.

items.equipment.armor.clericarmor.name=Paramenti dell'eroe
items.equipment.armor.clericarmor.desc=Mentre indossa questa combinazione di vesti e piastre, il Chierico può eseguire un'abilità speciale.

items.equipment.armor.clotharmor.name=armatura di stoffa
items.equipment.armor.clotharmor.desc=Questa armatura leggera offre una protezione base.
items.equipment.armor.clotharmor.discover_hint=Uno degli eroi inizia con questo oggetto.

items.equipment.armor.duelistarmor.name=corazza dell'eroe
items.equipment.armor.duelistarmor.desc=Mentre indossa questa armatura a piastre e mantello, la Duellante può eseguire un'abilità speciale.

items.equipment.armor.huntressarmor.name=manto dell'eroe
items.equipment.armor.huntressarmor.no_enemies=Nessun nemico in vista
items.equipment.armor.huntressarmor.desc=Quando indossa questo mantello, la Cacciatrice può usare un'abilità speciale.

items.equipment.armor.leatherarmor.name=armatura di cuoio
items.equipment.armor.leatherarmor.desc=Armatura ottenuta dalla pelle conciata di un mostro. Non leggera come quella di stoffa ma offre una protezione migliore.

items.equipment.armor.magearmor.name=veste dell'eroe
items.equipment.armor.magearmor.desc=Quando indossa questa magnifica tunica, il Mago può usare un'abilità speciale.

items.equipment.armor.mailarmor.name=armatura a maglie
items.equipment.armor.mailarmor.desc=L'intreccio degli anelli metallici crea un'armatura resistente e flessibile allo stesso tempo.

items.equipment.armor.platearmor.name=armatura a piastre
items.equipment.armor.platearmor.desc=Enormi piastre di metallo sono unite in un'armatura in grado di fornire una protezione impareggiabile ad ogni avventuriero forte abbastanza da sopportarne lo sconcertante peso.

items.equipment.armor.roguearmor.name=abito dell'eroe
items.equipment.armor.roguearmor.desc=Mentre indossa questa veste oscura, il Ladro può usare un'abilità speciale.

items.equipment.armor.scalearmor.name=armatura a scaglie
items.equipment.armor.scalearmor.desc=Le scaglie metalliche fissate su una maglia di cuoio creano un'armatura flessibile eppure protettiva.

items.equipment.armor.warriorarmor.name=armatura a piastre dell'eroe
items.equipment.armor.warriorarmor.desc=Mentre indossa questa pesante armatura a piastre, il Guerriero può eseguire un'abilità speciale.



###artifacts
items.equipment.artifacts.alchemiststoolkit.name=kit dell'alchimista
items.equipment.artifacts.alchemiststoolkit.ac_brew=PREPARA
items.equipment.artifacts.alchemiststoolkit.ac_energize=ENERGIZZA
items.equipment.artifacts.alchemiststoolkit.not_ready=Il tuo kit non è ancora pronto all'uso.
items.equipment.artifacts.alchemiststoolkit.cursed=Il tuo kit maledetto ti impedisce di usare l'alchimia!
items.equipment.artifacts.alchemiststoolkit.need_energy=Hai bisogno di almeno 6 energia per questo.
items.equipment.artifacts.alchemiststoolkit.energize_desc=Ogni 6 cristalli il kit avrà energia sufficiente per guadagnare un livello, il che aumenta la velocità con cui esso genera energia nel tempo e quanto velocemente si riscalda.\n\nQuanta energia vuoi usare?
items.equipment.artifacts.alchemiststoolkit.energize_1=6 energia: +1 livello
items.equipment.artifacts.alchemiststoolkit.energize_all=%1$d energia: + %2$d livelli
items.equipment.artifacts.alchemiststoolkit.desc=Il kit di strumenti contiene reagenti ed erbe, oltre ad una bottiglietta di miscelazione, che permettono di praticare l'alchimia in qualunque luogo. La bottiglietta contiene anche ciò che sembra un cristallo di energia alchemica in forma liquda.
items.equipment.artifacts.alchemiststoolkit.desc_cursed=Il kit maledetto si è fissato al tuo fianco e si rifiuta di lasciarti usare l'alchimia.
items.equipment.artifacts.alchemiststoolkit.desc_warming=Il kit di strumenti si sta riscaldando e sarà pronto all'uso tra breve.
items.equipment.artifacts.alchemiststoolkit.desc_hint=Il kit appena indossato genera lentamente energia alchemica, via via che tu accumuli esperienza. Sembra che la miscela nella fiala possa venire potenziata aggiungendovi dei cristalli d'energia.

items.equipment.artifacts.artifact.cannot_wear_two=Non puoi indossare due artefatti uguali.
items.equipment.artifacts.artifact.equip_cursed=L'artefatto si lega a te dolorosamente.
items.equipment.artifacts.artifact.curse_known=Puoi percepire una magia ostile nascondersi nell'artefatto.
items.equipment.artifacts.artifact.not_cursed=Questo artefatto è libero da magia ostile.
items.equipment.artifacts.artifact.need_to_equip=Dovrai equipaggiare l'artefatto per farlo.

items.equipment.artifacts.capeofthorns.name=cappa di spine
items.equipment.artifacts.capeofthorns.desc=Queste lamiere di metallo cadute da DM-300 si sono unite in un rigido mantello. Pare contenere una profonda energia, magari possiede un po' del potere del DM-300?
items.equipment.artifacts.capeofthorns.desc_inactive=Il mantello pesa in modo rassicurante sulle tue spalle, pare che acquisti energia dai danni che subisci.
items.equipment.artifacts.capeofthorns.desc_active=Il mantello pare rilasciare energia raccolta in precedenza, sta irradiando un potere protettivo.
items.equipment.artifacts.capeofthorns$thorns.inert=Il tuo mantello ritorna inerte.
items.equipment.artifacts.capeofthorns$thorns.radiating=Il tuo mantello comincia ad irradiare energia, ti senti protetto!
items.equipment.artifacts.capeofthorns$thorns.levelup=il tuo mantello diventa più forte!
items.equipment.artifacts.capeofthorns$thorns.name=spine
items.equipment.artifacts.capeofthorns$thorns.desc=Il tuo mantello irradia energia, circondandoti di un campo di forza deflettiva!\n\nTutto il danno ricevuto è ridotto mentre l'effetto delle spine è attivo. Inoltre se l'attaccante è vicino, l'ammontare ridotto è riflesso al nemico.\n\nTurni di spine rimanenti: %s.

items.equipment.artifacts.chaliceofblood.name=calice di sangue
items.equipment.artifacts.chaliceofblood.ac_prick=PUNGI
items.equipment.artifacts.chaliceofblood.yes=Sì, so quel che sto facendo
items.equipment.artifacts.chaliceofblood.no=No, ho cambiato idea
items.equipment.artifacts.chaliceofblood.prick_warn=Ogni volta che usi il calice, prosciugherà sempre più della tua energia vitale, ma in cambio incrementerà la tua rigenerazione naturale.\n\nAttualmente pungerti infliggerà _%1$d-%2$d danni_, anche se questo danno può essere ridotto da _armature e riduzioni dal danno sia fisiche che magiche._ Senza considerare gli effetti di riduzione del danno, attualmente pungerti ha una _probabilità del %3$s%%_ di prosciugare completamente la tua forza vitale.\n\nSei sicuro di voler offrire al calice più energia vitale?
items.equipment.artifacts.chaliceofblood.onprick=Ti fai pungere e la tua essenza vitale scorre nel calice.
items.equipment.artifacts.chaliceofblood.ondeath=Il calice prosciuga interamente la tua vita...
items.equipment.artifacts.chaliceofblood.desc=Questo calice d'argento luccicante è stranamente decorato con gemme affilate attorno all'orlo.
items.equipment.artifacts.chaliceofblood.desc_cursed=Il calice maledetto si è legato alla tua mano, inibendo la tua capacità di rigenerare salute.
items.equipment.artifacts.chaliceofblood.desc_1=Come afferri il calice, ti senti stranamente costretto a pungerti con le gemme taglienti.
items.equipment.artifacts.chaliceofblood.desc_2=C'è un po' del tuo sangue accumulato nel calice, senti la sensazione del calice rifornirti di energia vitale, aumentando la tua rigenerazione naturale. Vuoi ancora tagliarti col calice, anche se sai che farà male.
items.equipment.artifacts.chaliceofblood.desc_3=Il calice è riempito fino all'orlo della tua essenza vitale. Puoi sentire il calice riversare energia vitale in te.

items.equipment.artifacts.cloakofshadows.name=manto delle ombre
items.equipment.artifacts.cloakofshadows.ac_stealth=FURTIVITÀ
items.equipment.artifacts.cloakofshadows.cooldown=Il tuo manto necessita di ancora %d turni per ri-energizzarsi.
items.equipment.artifacts.cloakofshadows.cursed=Non puoi usare un manto maledetto.
items.equipment.artifacts.cloakofshadows.no_charge=Il tuo manto non si è ancora ricaricato abbastanza da poter essere usato.
items.equipment.artifacts.cloakofshadows.desc=Un'inestimabile manto magico, rubato dall'armeria reale molti anni fa dal Ladro. Una volta indossato può essere usato per rendersi completamente invisibili per un limitato periodo.\n\nPiù il manto viene usato più forte diverrà, permettendo al ladro di rendersi invisibile più frequentemente e per periodi più prolungati.
items.equipment.artifacts.cloakofshadows.discover_hint=Uno degli eroi inizia con questo oggetto.
items.equipment.artifacts.cloakofshadows$cloakstealth.no_charge=Il tuo manto ha esaurito l'energia.
items.equipment.artifacts.cloakofshadows$cloakstealth.levelup=Il tuo manto diventa più forte!
items.equipment.artifacts.cloakofshadows$cloakstealth.name=ammantato
items.equipment.artifacts.cloakofshadows$cloakstealth.desc=Il tuo mantello d'ombra ti garantisce l'invisibilità mentre ne sei avvolto. Rimarrai occultato fino a quando non verrà annullato o il tuo occultamento si esaurirà.\n\nMentre sei invisibile, i nemici non possono attaccarti o seguirti. Gli attacchi fisici e gli effetti magici (come pergamene e bacchette) annulleranno immediatamente l'invisibilità.\n\nTurni fino all'utilizzo della carica: %d.

items.equipment.artifacts.driedrose.name=rosa essiccata
items.equipment.artifacts.driedrose.ac_summon=EVOCA
items.equipment.artifacts.driedrose.ac_direct=DIREZIONA
items.equipment.artifacts.driedrose.ac_outfit=EQUIPAGGIA
items.equipment.artifacts.driedrose.spawned=Hai già evocato il fantasma.
items.equipment.artifacts.driedrose.no_charge=La tua rosa non è ancora completamente carica.
items.equipment.artifacts.driedrose.cursed=Non puoi usare una rosa maledetta.
items.equipment.artifacts.driedrose.no_space=Non c'è alcuno spazio libero attorno a te.
items.equipment.artifacts.driedrose.charged=La tua rosa è completamente carica!
items.equipment.artifacts.driedrose.desc=È questa la rosa che il fantasma ha menzionato prima di scomparire? Pare contenere qualche potere spirituale, magari può essere usata per incanalare l'energia di quel guerriero smarrito.
items.equipment.artifacts.driedrose.desc_no_quest=Una rosa disseccata che in qualche modo si tiene ancora insieme a discapito della sua età.\n\nPare possedere del potere spirituale, ma non hai idea su come usarla per il momento.
items.equipment.artifacts.driedrose.desc_hint=Sembra che le manchi qualche petalo. Forse riattaccandoli la rosa si rafforzerà.
items.equipment.artifacts.driedrose.desc_cursed=La rosa maledetta si lega alla tua mano, è sinistramente fredda al tocco.
items.equipment.artifacts.driedrose.desc_weapon=Arma del Fantasma: %s.
items.equipment.artifacts.driedrose.desc_armor=Armatura del Fantasma: %s.
items.equipment.artifacts.driedrose.desc_strength=Forza del Fantasma: %s.
items.equipment.artifacts.driedrose$petal.name=petalo essiccato
items.equipment.artifacts.driedrose$petal.no_rose=Non hai una rosa a cui aggiungere questo petalo.
items.equipment.artifacts.driedrose$petal.no_room=Non c'è spazio rimanente per questo petalo, quindi lo butti via.
items.equipment.artifacts.driedrose$petal.maxlevel=La rosa è completa!
items.equipment.artifacts.driedrose$petal.levelup=Aggiungi il petalo alla rosa.
items.equipment.artifacts.driedrose$petal.desc=Un fragile petalo disseccato, che in qualche modo è sopravvissuto così a lungo nel dungeon.
items.equipment.artifacts.driedrose$wndghosthero.title=Equipaggiamento del Fantasma
items.equipment.artifacts.driedrose$wndghosthero.desc=Il fantasma è debole di per sé, ma la sua forma è solida abbastanza da poter essere equipaggiata con un'arma ed un'armatura. Saranno capaci di usare questi oggetti proprio come fai tu.\n\nIl fantasma può attualmente equipaggiare oggetti richiedenti fino a _%d punti forza._
items.equipment.artifacts.driedrose$wndghosthero.weapon_prompt=Seleziona un'arma
items.equipment.artifacts.driedrose$wndghosthero.armor_prompt=Seleziona un'armatura
items.equipment.artifacts.driedrose$wndghosthero.cant_unique=Il fantasma non può usare oggetti esclusivi.
items.equipment.artifacts.driedrose$wndghosthero.cant_cursed=Il fantasma può utilizzare solo equipaggiamento che sei sicuro non sia maledetto.
items.equipment.artifacts.driedrose$wndghosthero.cant_strength_unknown=Il fantasma potrebbe non essere abbastanza forte per usarlo.
items.equipment.artifacts.driedrose$wndghosthero.cant_strength=Il fantasma non è abbastanza forte per usarlo.

##ghost hero
items.equipment.artifacts.driedrose$ghosthero.name=fantasma triste
items.equipment.artifacts.driedrose$ghosthero.def_verb=schivato
items.equipment.artifacts.driedrose$ghosthero.discover_hint=Puoi trovare questo personaggio con un artefatto specifico.

items.equipment.artifacts.driedrose$ghosthero.hello=Salve di nuovo %s.
items.equipment.artifacts.driedrose$ghosthero.introduce=Il mio spirito è legato a questa rosa: mi era molto cara, un dono ricevuto dall'amato che ho lasciato in superficie.\n\nNon posso ritornare ad esso, ma grazie a te ho una seconda possibilità di completare il mio viaggio. Quando ne sarò in grado risponderò alla tua chiamata e combatterò al tuo fianco.\n\nFintantoché avrai la rosa io potrò udire la tua voce, così da potermi utilizzare da lontano.\n\nSperiamo tu possa avere successo dove io ho fallito...

items.equipment.artifacts.driedrose$ghosthero.dialogue_sewers_1=Queste fognature un tempo erano sicure, addirittura la gente viveva qui durante l'inverno.
items.equipment.artifacts.driedrose$ghosthero.dialogue_sewers_2=Mi chiedo cosa sia successo alle guardie di pattuglia, si sono arrese?
items.equipment.artifacts.driedrose$ghosthero.dialogue_sewers_3=Avevo famiglia lassù in superficie, spero stiano bene.
items.equipment.artifacts.driedrose$ghosthero.dialogue_sewers_4=Le guardie non hanno potuto sconfiggere questi mostri, ma forse noi possiamo.
items.equipment.artifacts.driedrose$ghosthero.dialogue_sewers_5=Se perfino le fogne sono così pericolose, mi chiedo cosa si annidi più sotto...
items.equipment.artifacts.driedrose$ghosthero.dialogue_sewers_6=Cosa avrà fatto crescere questi ratti e questi granchi così grossi?
items.equipment.artifacts.driedrose$ghosthero.dialogue_prison_1=Ho sentito storie su questo luogo, niente di buono.
items.equipment.artifacts.driedrose$ghosthero.dialogue_prison_2=Questo luogo è sempre stato più una segreta che una prigione.
items.equipment.artifacts.driedrose$ghosthero.dialogue_prison_3=Non posso immaginare cosa sia successo quando questo luogo fu abbandonato.
items.equipment.artifacts.driedrose$ghosthero.dialogue_prison_4=Parrebbe che sia le guardie che i prigionieri siano stati trasformati in mostri.
items.equipment.artifacts.driedrose$ghosthero.dialogue_prison_5=Quale potrebbe essere la causa di tutti questi scheletri?
items.equipment.artifacts.driedrose$ghosthero.dialogue_prison_6=Queste persone non sarebbero dovute finire così...
items.equipment.artifacts.driedrose$ghosthero.dialogue_caves_1=Nessun umano o nano è stato qui da molto tempo.
items.equipment.artifacts.driedrose$ghosthero.dialogue_caves_2=Cosa mai avrebbe spinto dei nani ad abbandonare una miniera d'oro?
items.equipment.artifacts.driedrose$ghosthero.dialogue_caves_3=È un peccato che tutto l'oro che è qui sia inutile in superficie.
items.equipment.artifacts.driedrose$ghosthero.dialogue_caves_4=Le creature presenti qui sono contorte, proprio come nelle fognature.
items.equipment.artifacts.driedrose$ghosthero.dialogue_caves_5=Perfino i pipistrelli sono assetati di sangue qui.
items.equipment.artifacts.driedrose$ghosthero.dialogue_caves_6=Nessuna traccia di macchinari estrattivi, che i nani li abbiano recuperati tutti?
items.equipment.artifacts.driedrose$ghosthero.dialogue_city_1=I nani erano operosi, ma avidi.
items.equipment.artifacts.driedrose$ghosthero.dialogue_city_2=Dunque le metropoli naniche sono davvero cadute.
items.equipment.artifacts.driedrose$ghosthero.dialogue_city_3=Spero che la superficie non diventi mai come questo posto.
items.equipment.artifacts.driedrose$ghosthero.dialogue_city_4=I nani non dovrebbero essere così pallidi.
items.equipment.artifacts.driedrose$ghosthero.dialogue_city_5=Non so cosa siano peggio, i nani o le loro creazioni.
items.equipment.artifacts.driedrose$ghosthero.dialogue_city_6=Parrebbe che i nani siano ora diventati mostri irrazionali essi stessi.
items.equipment.artifacts.driedrose$ghosthero.dialogue_halls_1=Cos'è questo posto?
items.equipment.artifacts.driedrose$ghosthero.dialogue_halls_2=Questo luogo è terrificante...
items.equipment.artifacts.driedrose$ghosthero.dialogue_halls_3=Cosa avevano per la testa i nani, gingillandosi con un tale potere?
items.equipment.artifacts.driedrose$ghosthero.dialogue_halls_4=I mostri qui sono spettrali, da dove sono spuntati fuori?
items.equipment.artifacts.driedrose$ghosthero.dialogue_halls_5=Puoi avvertirlo? È come se qualcosa ci stesse osservando.
items.equipment.artifacts.driedrose$ghosthero.dialogue_halls_6=Grazie al cielo ci sono le torce, è così buio qui!
items.equipment.artifacts.driedrose$ghosthero.dialogue_ascension_1=Cosa sta succedendo? Pensavo avessimo vinto?
items.equipment.artifacts.driedrose$ghosthero.dialogue_ascension_2=Come fa quella cosa ad influenzare ancora questo mondo?
items.equipment.artifacts.driedrose$ghosthero.dialogue_ascension_3=Spero tu sappia cosa stai facendo con quell'amuleto.
items.equipment.artifacts.driedrose$ghosthero.dialogue_ascension_4=Suppongo che non sia ancora finita.
items.equipment.artifacts.driedrose$ghosthero.dialogue_ascension_5=Siamo arrivati così lontano, possiamo farcela!
items.equipment.artifacts.driedrose$ghosthero.dialogue_ascension_6=Un ultimo sforzo, possiamo uscire da qui!

items.equipment.artifacts.driedrose$ghosthero.seen_goo_1=Attenzione a Goo!
items.equipment.artifacts.driedrose$ghosthero.seen_goo_2=Molti dei miei amici morirono a causa di questa cosa, è tempo di vendetta!
items.equipment.artifacts.driedrose$ghosthero.seen_goo_3=A un abominio del genere non può essere permesso vivere!
items.equipment.artifacts.driedrose$ghosthero.seen_tengu_1=L'unico prigioniero rimasto è un letale assassino. Ovviamente...
items.equipment.artifacts.driedrose$ghosthero.seen_tengu_2=Ci ha intrappolato!
items.equipment.artifacts.driedrose$ghosthero.seen_tengu_3=Ho sentito storie orrende su quella maschera...
items.equipment.artifacts.driedrose$ghosthero.seen_dm300_1=Solamente i nani avrebbero potuto costruire una macchina scavatrice che uccide gli intrusi.
items.equipment.artifacts.driedrose$ghosthero.seen_dm300_2=Questa cosa è enorme...
items.equipment.artifacts.driedrose$ghosthero.seen_dm300_3=Come è potuta rimanere attiva così a lungo?
items.equipment.artifacts.driedrose$ghosthero.seen_king_1=Quando la gente dice il potere corrompe, questo è quello che intendono.
items.equipment.artifacts.driedrose$ghosthero.seen_king_2=È più un cadavere che un Re, adesso.
items.equipment.artifacts.driedrose$ghosthero.seen_king_3=Anche nella morte i nani obbediscono al loro padrone.
items.equipment.artifacts.driedrose$ghosthero.seen_yog_1=Oh, questo non va bene.
items.equipment.artifacts.driedrose$ghosthero.seen_yog_2=Dunque è questo l'aspetto di una divinità?
items.equipment.artifacts.driedrose$ghosthero.seen_yog_3=Questo farà male...

items.equipment.artifacts.driedrose$ghosthero.defeated_by_enemy_1=Buona fortuna...
items.equipment.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Stanco... per ora...
items.equipment.artifacts.driedrose$ghosthero.defeated_by_enemy_3=Ritornerò...
items.equipment.artifacts.driedrose$ghosthero.defeated_by_boss_1=Mi spiace... buona fortuna...
items.equipment.artifacts.driedrose$ghosthero.defeated_by_boss_2=Finiscilo... senza di me...
items.equipment.artifacts.driedrose$ghosthero.defeated_by_boss_3=No... Non posso...
items.equipment.artifacts.driedrose$ghosthero.blessed_ankh_1=Come sei sopravvissuto a quello?
items.equipment.artifacts.driedrose$ghosthero.blessed_ankh_2=Magari avessi avuto uno di quelli...
items.equipment.artifacts.driedrose$ghosthero.blessed_ankh_3=Santo cielo! Sei ancora vivo!
items.equipment.artifacts.driedrose$ghosthero.player_killed_1=No!...
items.equipment.artifacts.driedrose$ghosthero.player_killed_2=Non ho potuto aiutarli...
items.equipment.artifacts.driedrose$ghosthero.player_killed_3=Non così...

items.equipment.artifacts.driedrose$ghosthero.direct_prompt=Cosa dovrei fare?
items.equipment.artifacts.driedrose$ghosthero.directed_follow_1=Ok, ti seguirò.
items.equipment.artifacts.driedrose$ghosthero.directed_follow_2=Mi accoderò a te.
items.equipment.artifacts.driedrose$ghosthero.directed_follow_3=Ti seguo...
items.equipment.artifacts.driedrose$ghosthero.directed_follow_4=Ok, andiamo!
items.equipment.artifacts.driedrose$ghosthero.directed_follow_5=Ti copro.
items.equipment.artifacts.driedrose$ghosthero.directed_attack_1=Ok, attaccherò quello lì.
items.equipment.artifacts.driedrose$ghosthero.directed_attack_2=Lo prenderò.
items.equipment.artifacts.driedrose$ghosthero.directed_attack_3=Contatto...
items.equipment.artifacts.driedrose$ghosthero.directed_attack_4=Facciamoli fuori!
items.equipment.artifacts.driedrose$ghosthero.directed_attack_5=Ci penso io.
items.equipment.artifacts.driedrose$ghosthero.directed_position_1=Ok, manterrò la posizione.
items.equipment.artifacts.driedrose$ghosthero.directed_position_2=Andrò là e difenderò.
items.equipment.artifacts.driedrose$ghosthero.directed_position_3=Riposizionando...
items.equipment.artifacts.driedrose$ghosthero.directed_position_4=Arrivo!
items.equipment.artifacts.driedrose$ghosthero.directed_position_5=Andrò da quella parte.

items.equipment.artifacts.driedrose$ghosthero.desc=Una figura eterea dall'aspetto fragile con una forma umanoide. Il suo potere sembra legato alla rosa che possiedi.\n\nQuesto fantasma non sarà granché, ma pare essere il tuo unico vero amico quaggiù.

##back to artifacts
items.equipment.artifacts.etherealchains.name=catene eteree
items.equipment.artifacts.etherealchains.ac_cast=LANCIA
items.equipment.artifacts.etherealchains.rooted=Le tue catene non possono attrarre mentre sei immobilizzato.
items.equipment.artifacts.etherealchains.no_charge=Le tue catene non hanno abbastanza carica.
items.equipment.artifacts.etherealchains.cursed=Non puoi utilizzare catene maledette.
items.equipment.artifacts.etherealchains.does_nothing=Questo non farà nulla.
items.equipment.artifacts.etherealchains.cant_pull=Le tue catene non possono attrarre quel bersaglio.
items.equipment.artifacts.etherealchains.cant_reach=Le tue catene non possono arrivare là.
items.equipment.artifacts.etherealchains.inside_wall=Le tue catene possono solo attrarti attraverso i muri, non dentro di essi.
items.equipment.artifacts.etherealchains.nothing_to_grab=Non c'è nulla da afferrare qui.
items.equipment.artifacts.etherealchains.prompt=Scegli un punto da prendere di mira.
items.equipment.artifacts.etherealchains.desc=Queste ampie eppur leggere catene risplendono di energia spirituale. Possono essere usate per trasportarti verso un luogo, o attrarre nemici verso di te. La natura evanescente delle catene permette addirittura loro di estendersi attraverso i muri!
items.equipment.artifacts.etherealchains.desc_cursed=Le catene maledette sono serrate al tuo fianco, oscillando costantemente qua e là, tentando di ostacolarti o farti inciampare.
items.equipment.artifacts.etherealchains.desc_equipped=Le catene si appoggiano sul tuo fianco, spillando lentamente l'energia spirituale di quelli che sconfiggi. Ogni carica è un anello nella catena, che si estenderà di una casella esatta.
items.equipment.artifacts.etherealchains$chainsrecharge.levelup=Le tue catene diventano più forti!

items.equipment.artifacts.holytome.name=Tomo sacro
items.equipment.artifacts.holytome.ac_cast=LANCIA
items.equipment.artifacts.holytome.no_spell=Non sei in grado di lanciare quell'incantesimo al momento.
items.equipment.artifacts.holytome.cursed=Non puoi usare un tomo maledetto.
items.equipment.artifacts.holytome.levelup=Il tuo tomo diventa più forte!
items.equipment.artifacts.holytome.desc=Un tomo sacro che funziona da focus per la magia sacra del Chierico. Usare il tomo permette al Chierico di lanciare una varietà di incantesimi.\n\nIl tomo cresce in potere progressivamente con l'utilizzo da parte del Chierico, sbloccando più cariche massime e una maggiore velocità di ricarica di esse.
items.equipment.artifacts.holytome.discover_hint=Uno degli eroi inizia con questo oggetto.

items.equipment.artifacts.hornofplenty.name=cornucopia
items.equipment.artifacts.hornofplenty.ac_snack=SNACK
items.equipment.artifacts.hornofplenty.ac_eat=MANGIA
items.equipment.artifacts.hornofplenty.ac_store=DEPOSITA
items.equipment.artifacts.hornofplenty.eat=Ti alimenti dal corno.
items.equipment.artifacts.hornofplenty.prompt=Seleziona del cibo
items.equipment.artifacts.hornofplenty.no_food=Il corno non contiene cibo da mangiare!
items.equipment.artifacts.hornofplenty.full=Il corno è pieno di cibo!
items.equipment.artifacts.hornofplenty.reject=Il corno rigetta il blandofrutto crudo.
items.equipment.artifacts.hornofplenty.maxlevel=Il corno ha consumato tutto il cibo possibile!
items.equipment.artifacts.hornofplenty.levelup=Il corno consuma la tua offerta di cibo e cresce in forza!
items.equipment.artifacts.hornofplenty.feed=Il corno consuma la tua offerta di cibo.
items.equipment.artifacts.hornofplenty.desc=Non si può soffiare in questo corno, sembra però che si riempia di cibo via via che guadagni esperienza. Puoi consumare ogni carica da sola come se fosse un piccolo pasto oppure mangiare fino alla sazietà.
items.equipment.artifacts.hornofplenty.desc_hint=Magari è possibile aumentare il potere del corno fornendogli energia alimentare.
items.equipment.artifacts.hornofplenty.desc_cursed=Il corno maledetto si è legato al tuo fianco, sembra desideroso di sottrarre cibo piuttosto che produrne.

items.equipment.artifacts.lloydsbeacon.name=faro di lloyd
items.equipment.artifacts.lloydsbeacon.ac_set=IMPOSTA
items.equipment.artifacts.lloydsbeacon.ac_return=RITORNA
items.equipment.artifacts.lloydsbeacon.preventing=La forte aura magica di questo luogo ti impedisce di usare il faro di lloyd!
items.equipment.artifacts.lloydsbeacon.creatures=L'aura psichica delle creature circostanti non ti permette di usare il faro di lloyd in questo momento.
items.equipment.artifacts.lloydsbeacon.return=Il faro di lloyd è impostato con successo alla tua posizione attuale, ora puoi ritornare qui ogni volta che desideri.
items.equipment.artifacts.lloydsbeacon.desc_set=Questo faro è stato posizionato da qualche parte nel piano %d di Pixel Dungeon.

items.equipment.artifacts.masterthievesarmband.name=bracciale del maestro dei ladri
items.equipment.artifacts.masterthievesarmband.ac_steal=RUBA
items.equipment.artifacts.masterthievesarmband.no_charge=Il tuo bracciale non ha abbastanza carica.
items.equipment.artifacts.masterthievesarmband.cursed=Non puoi usare un bracciale maledetto.
items.equipment.artifacts.masterthievesarmband.full=Il tuo bracciale è completamente carico!
items.equipment.artifacts.masterthievesarmband.prompt=Scegli un nemico da bersagliare
items.equipment.artifacts.masterthievesarmband.no_target=Devi bersagliare un nemico adiacente a te.
items.equipment.artifacts.masterthievesarmband.steal_shopkeeper=Non puoi rubare direttamente da un negoziante
items.equipment.artifacts.masterthievesarmband.no_steal=Quel nemico non ha niente da rubare.
items.equipment.artifacts.masterthievesarmband.stole_item=Hai rubato un oggetto: %s.
items.equipment.artifacts.masterthievesarmband.failed_steal=Non sei riuscito a rubare niente.
items.equipment.artifacts.masterthievesarmband.level_up=Il tuo bracciale diventa più forte!
items.equipment.artifacts.masterthievesarmband.desc=Questo bracciale di velluto porpora porta il marchio di un ladro mastro. Non ti appartiene, ma probabilmente non appartiene nemmeno al suo precedente utilizzatore.
items.equipment.artifacts.masterthievesarmband.desc_cursed=Il bracciale maledetto è legato al tuo polso e in qualche modo il tuo portamonete pare lentamente divenire più leggero...
items.equipment.artifacts.masterthievesarmband.desc_worn=Senti del potere che cresce nel bracciale al tuo polso mentre ottieni esperienza. Puoi usare questo potere per rubare dai negozi, o derubare nemici!\n\nDerubare un nemico è istantaneo, lo stordisce brevemente, e ti da la possibilità di ottenere il bottino che trasporta! Questo potere è più efficace contro nemici ignari. Derubare lo stesso nemico più volte non dà maggiori possibilità di ottenere bottino.

items.equipment.artifacts.sandalsofnature.name=sandali della natura
items.equipment.artifacts.sandalsofnature.name_1=scarpe della natura
items.equipment.artifacts.sandalsofnature.name_2=stivali della natura
items.equipment.artifacts.sandalsofnature.name_3=schinieri della natura
items.equipment.artifacts.sandalsofnature.ac_feed=CIBA
items.equipment.artifacts.sandalsofnature.ac_root=PIANTA
items.equipment.artifacts.sandalsofnature.prompt=Seleziona un seme
items.equipment.artifacts.sandalsofnature.levelup=Le tue calzature aumentano di dimensioni!
items.equipment.artifacts.sandalsofnature.absorb_seed=Le calzature assorbono il seme, sembrano più floride.
items.equipment.artifacts.sandalsofnature.no_effect=Devi prima dare un seme alle tue calzature.
items.equipment.artifacts.sandalsofnature.low_charge=Le tue calzature non hanno abbastanza energia per quello.
items.equipment.artifacts.sandalsofnature.prompt_target=Seleziona un posto
items.equipment.artifacts.sandalsofnature.out_of_range=Quel posto è troppo lontano.
items.equipment.artifacts.sandalsofnature.desc_1=Quelli che inizialmente sembravano sandali fatti di corda sono in realtà due piante! Sembrano molto deboli e pallidi, magari hanno bisogno di sostanze nutritive?
items.equipment.artifacts.sandalsofnature.desc_2=Le calzature sono cresciute ed ora assomigliano più a delle scarpe fatte su misura. Un po' di colore è ricomparso su di loro, magari potranno crescere ancora?
items.equipment.artifacts.sandalsofnature.desc_3=Le piante sono cresciute ancora e adesso assomigliano ad un paio di solidi stivali di corteccia. Paiono aver riacquistato la loro forza, ma magari potranno crescere ancora?
items.equipment.artifacts.sandalsofnature.desc_4=Le piante paiono aver raggiunto la loro taglia massima, assomigliano ad un paio di schinieri rinforzati. Gli schinieri sono di un marrone profondo e ricordano un albero robusto.
items.equipment.artifacts.sandalsofnature.desc_hint=Ti senti più in sintonia con la natura mentre indossi questo artefatto.
items.equipment.artifacts.sandalsofnature.desc_cursed=i sandali maledetti bloccano ogni sintonia con la natura.
items.equipment.artifacts.sandalsofnature.desc_ability=Le calzature brillano del colore dell'ultimo seme con cui le hai nutrito. Possono temporaneamente radicarsi nel terreno e produrre l'effetto di quella pianta dove vuoi in un raggio di 3 caselle.\nSeme: _%s_\nCarica necessaria: _%d%%_
items.equipment.artifacts.sandalsofnature.desc_seeds=Hai nutrito le calzature con i semi di %d.

items.equipment.artifacts.skeletonkey.name=chiave scheletrica
items.equipment.artifacts.skeletonkey.ac_insert=INSERISCI
items.equipment.artifacts.skeletonkey.cursed=Non puoi utilizzare una chiave scheletrica maledetta.
items.equipment.artifacts.skeletonkey.prompt=Scegli un bersaglio
items.equipment.artifacts.skeletonkey.invalid_target=Non c'è niente da bloccare o sbloccare qua.
items.equipment.artifacts.skeletonkey.lock_no_space=Non puoi bloccare un personaggio in una porta!
items.equipment.artifacts.skeletonkey.iron_charges=Aprire una serratura normale richiede 1 carica.
items.equipment.artifacts.skeletonkey.gold_charges=Aprire una serratura dorata richiede 2 cariche.
items.equipment.artifacts.skeletonkey.lock_charges=Bloccare una porta richiede 2 cariche.
items.equipment.artifacts.skeletonkey.wall_charges=Creare un muro temporaneo richiede 2 cariche.
items.equipment.artifacts.skeletonkey.crystal_charges=Aprire una serratura di cristallo richiede 5 carche.
items.equipment.artifacts.skeletonkey.wont_open=Per qualche ragione la chiave si rifiuta di entrare in questa serratura.
items.equipment.artifacts.skeletonkey.locked_with_key=Quella porta è stata bloccata dalla tua chiave scheletrica.
items.equipment.artifacts.skeletonkey.force_lock=Il lucchetto si è indebolito senza la tua chiave scheletrica. Sei riuscito a sbloccarlo.
items.equipment.artifacts.skeletonkey.discard=Scarti le tue chiavi in eccesso.
items.equipment.artifacts.skeletonkey.levelup=La tua chiave scheletrica diventa più forte!
items.equipment.artifacts.skeletonkey.desc=Una chiave dall'aspetto importante con la testa a forma di teschio. I suoi denti sembrano diversi ogni volta che li guardi.
items.equipment.artifacts.skeletonkey.desc_worn=Sembra che questa chiave magica tragga potere quando la usi al posto delle regolari chiavi del dungeon. Può essere inserita in quasi ogni serratura del dungeon per aprirla o chiuderla, anche in quelle delle porte che non erano bloccate in precedenza.\n\nLa chiave può anche essere usata su uno spazio vuoto in una direzione cardinale o diagonale per 'bloccare' l'aria di fronte a te, creando un muro solido largo 3 caselle che dura per 10 turni. Bloccando spingerai via i nemici se c'è spazio per farlo.
items.equipment.artifacts.skeletonkey.desc_cursed=La chiave maledetta sembra star attivamente evitando di entrare in qualunque serratura, e ti sta anche rendendo difficile (ma non impossibile) usare le tue altre chiavi.
items.equipment.artifacts.skeletonkey$keywall.desc=Un muro magico temporaneo è stato posizionato qui dalla chiave scheletrica.

items.equipment.artifacts.talismanofforesight.name=talismano della preveggenza
items.equipment.artifacts.talismanofforesight.ac_scry=PROFETIZZA
items.equipment.artifacts.talismanofforesight.low_charge=Il talismano richiede almeno 5% di carica per scrutare i dintorni.
items.equipment.artifacts.talismanofforesight.prompt=Scegli un punto da esaminare.
items.equipment.artifacts.talismanofforesight.levelup=Il tuo talismano diventa più forte!
items.equipment.artifacts.talismanofforesight.full_charge=Il tuo talismano è completamente carico!
items.equipment.artifacts.talismanofforesight.desc=Una pietra liscia ricoperta di strane incisioni. Hai l'impressione che stia osservando ogni cosa attorno a te, alla ricerca di qualcosa di nascosto.
items.equipment.artifacts.talismanofforesight.desc_worn=Quando stringi il talismano avverti tuoi sensi amplificarsi. Il talismano sta acquisendo lentamente carica col passare del tempo e ogni qual volta che scopri porte nascoste o trappole.\n\nIl talismano può spendere la sua carica per 'profetizzare' una porzione a cono del livello, che rivelerà ogni casella e ogni segreto nell'area esaminata e ti permetterà di vedere nemici ed oggetti per un breve periodo di tempo.
items.equipment.artifacts.talismanofforesight.desc_cursed=Il talismano maledetto scruta intensamente dentro di te, attenuando i tuoi sensi.
items.equipment.artifacts.talismanofforesight$foresight.name=preveggenza
items.equipment.artifacts.talismanofforesight$foresight.uneasy=Ti senti a disagio.
items.equipment.artifacts.talismanofforesight$foresight.desc=Ti senti molto nervoso, come ci fosse un pericolo nascosto nelle vicinanze.

items.equipment.artifacts.timekeepershourglass.name=clessidra del padrone del tempo
items.equipment.artifacts.timekeepershourglass.ac_activate=ATTIVA
items.equipment.artifacts.timekeepershourglass.deactivate=Hai disattivato il congelamento del tempo.
items.equipment.artifacts.timekeepershourglass.no_charge=La tua clessidra non si è ancora caricata abbastanza da poter essere usata.
items.equipment.artifacts.timekeepershourglass.cursed=Non puoi utilizzare una clessidra maledetta.
items.equipment.artifacts.timekeepershourglass.onstasis=Il mondo pare mutare attorno a te in un istante.
items.equipment.artifacts.timekeepershourglass.onfreeze=Ogni cosa attorno a te diventa improvvisamente immobile.
items.equipment.artifacts.timekeepershourglass.stasis=Mettimi in stasi
items.equipment.artifacts.timekeepershourglass.freeze=Congela il tempo attorno a me
items.equipment.artifacts.timekeepershourglass.prompt=Come vuoi usare la magia della clessidra?\n\nDurante la stasi, il tempo scorrerà normalmente mentre tu sei congelato e completamente invulnerabile, consuma fino a 2 cariche alla volta.\n\nQuando il tempo è congelato, puoi muoverti come se le tue azioni non consumassero tempo. Questo può essere disattivato in qualsiasi momento usando la clessidra o attaccando.
items.equipment.artifacts.timekeepershourglass.desc=Questa grossa clessidra decorata pare senza pretese, ma avverti un grande potere all'interno della sua struttura intagliata. Come volti la clessidra e osservi la sabbia scorrere, puoi sentire la sua magia attrarti; di sicuro usare questa magia ti darà una qualche padronanza sul tempo.
items.equipment.artifacts.timekeepershourglass.desc_hint=La clessidra pare avere perso un po' di sabbia, se solo potessi trovarne un altro po'...
items.equipment.artifacts.timekeepershourglass.desc_cursed=La clessidra maledetta è bloccata al tuo fianco, puoi sentirla tentare di manipolare il tuo scorrere del tempo.
items.equipment.artifacts.timekeepershourglass$timefreeze.name=Blocco del Tempo
items.equipment.artifacts.timekeepershourglass$timefreeze.desc=Il tempo è fermo intorno a te, rendendoti capace di eseguire qualsiasi azione istantaneamente. L'effetto durerà finche non viene cancellato o la tua clessidra esaurirà le cariche. Anche attaccare o usare la magia terminerà questo effetto.\n\nTurni fino all'utilizzo della carica: %s.
items.equipment.artifacts.timekeepershourglass$sandbag.name=sacchetto di sabbia magica
items.equipment.artifacts.timekeepershourglass$sandbag.levelup=Aggiungi la sabbia alla tua clessidra.
items.equipment.artifacts.timekeepershourglass$sandbag.maxlevel=La tua clessidra è riempita con sabbia magica!
items.equipment.artifacts.timekeepershourglass$sandbag.no_hourglass=Non hai una clessidra in cui mettere questa sabbia.
items.equipment.artifacts.timekeepershourglass$sandbag.desc=Questa piccola borsa di sabbia minuta dovrebbe funzionare perfettamente con la tua clessidra.\n\nSembra strano che il negoziante abbia quest'oggetto specifico proprio quando ne hai bisogno...

items.equipment.artifacts.unstablespellbook.name=libro di magie instabile
items.equipment.artifacts.unstablespellbook.ac_read=LEGGI
items.equipment.artifacts.unstablespellbook.ac_add=AGGIUNGI
items.equipment.artifacts.unstablespellbook.blinded=Non puoi leggere dal libro mentre sei accecato.
items.equipment.artifacts.unstablespellbook.no_charge=Il tuo libro di magie ha terminato l'energia per ora.
items.equipment.artifacts.unstablespellbook.cursed=Non puoi leggere da un libro di magie maledetto.
items.equipment.artifacts.unstablespellbook.prompt=Seleziona una pergamena
items.equipment.artifacts.unstablespellbook.infuse_scroll=Hai instillato l'energia della pergamena nel libro.
items.equipment.artifacts.unstablespellbook.unable_scroll=Non sei in grado di aggiungere questa pergamena al libro.
items.equipment.artifacts.unstablespellbook.unknown_scroll=Non sei ancora sicuro che tipo di pergamena sia questa.
items.equipment.artifacts.unstablespellbook.desc=Questo Tomo è in condizioni sorprendentemente buone data la sua età. Crepita e scoppietta al movimento delle pagine, caricandosi di energia instabile. Se leggi questo libro, non c'è modo di sapere quale incantesimo potresti lanciare.
items.equipment.artifacts.unstablespellbook.desc_cursed=Il libro maledetto si è legato a te, inibendo la tua capacità di usare la maggior parte delle pergamene.
items.equipment.artifacts.unstablespellbook.desc_index=Il libro è incompleto. Il suo indice sta attualmente indicando le seguenti pagine vuote:
items.equipment.artifacts.unstablespellbook.desc_empowered=Le pergamene che hai aggiunto al libro brillano di potere. Sarai in grado di scegliere la versione esotica degli effetti di questa pergamena, al costo di una carica aggiuntiva.
items.equipment.artifacts.unstablespellbook.read_empowered=La pergamena che hai aggiunto al libro di magie si gonfia di energia. Sei in grado di scegliere la versione normale, oppure quella esotica dell'effetto di questa pergamena.\n\nScegliere la variante esotica costerà 2 cariche invece di una.



###bags
items.equipment.bags.bag.name=zaino
items.equipment.bags.bag.discover_hint=Puoi comprare questo oggetto in un negozio.

items.equipment.bags.potionbandolier.name=cintura per pozioni
items.equipment.bags.potionbandolier.desc=Questa spessa bandoliera si adatta al tuo petto come una fascia, ha molte cinghie isolanti per contenere fiale di pozioni, il tuo otre, o fiale di metallo liquido.\n\nAll'interno della bandoliera, le tue pozioni dovrebbero essere protette dal freddo.

items.equipment.bags.scrollholder.name=tubo per pergamene
items.equipment.bags.scrollholder.desc=Questo contenitore tubolare sembra contenere gli strumenti e le carte di un astronomo, ma le tue pergamene si adatteranno altrettanto bene. Ci sono anche alcuni scomparti laterali che possono contenere perfettamente cristalli magici, stili arcani e resina arcana.\n\nIl supporto non sembra molto infiammabile, quindi le tue pergamene dovrebbero essere al sicuro dal fuoco al suo interno.

items.equipment.bags.velvetpouch.name=sacchetto di velluto
items.equipment.bags.velvetpouch.desc=Questo piccolo sacchetto di velluto può contenere molti piccoli oggetti, come semi, pietre runiche e alcuni ingredienti alchemici.
items.equipment.bags.velvetpouch.discover_hint=Uno degli eroi inizia con questo oggetto.

items.equipment.bags.magicalholster.name=fodero magico
items.equipment.bags.magicalholster.desc=Questa sottile fondina è fatta di pelliccia di un qualche animale esotico, e possiede una potente magia che permette di immagazzinare una enorme quantità di armi a distanza.\n\nTi basterà infilare la mano nella fondina per trovare sempre l'oggetto che cerchi.\n\nGrazie alla magia della fondina, le bacchette si caricheranno in modo leggermente più veloce e le armi da lancio conservate al suo interno dureranno un po' di più.



###bombs
items.equipment.bombs.arcanebomb.name=bomba arcana
items.equipment.bombs.arcanebomb.desc=Questa bomba è stata intrisa di proprietà arcane. Esploderà in una potente esplosione simile all'attacco potenziato di Goo, infliggendo _%1$d-%2$d danni magici_ a qualsiasi cosa entro 2 caselle.
items.equipment.bombs.arcanebomb.discover_hint=Puoi creare questo oggetto tramite l'alchimia.

items.equipment.bombs.bomb.name=bomba
items.equipment.bombs.bomb.ac_lightthrow=ACCENDI e LANCIA
items.equipment.bombs.bomb.snuff_fuse=Spegni rapidamente la miccia della bomba.
items.equipment.bombs.bomb.ondeath=L'esplosione ti ha ucciso...
items.equipment.bombs.bomb.rankings_desc=Ucciso da un'esplosione
items.equipment.bombs.bomb.desc=Una bomba a polvere nera piuttosto pesante. Un'esplosione di questa bomba infligge _%1$d-%2$d danni_ a qualsiasi cosa adiacente ad essa e distruggerà alcuni terreni o oggetti adiacenti.
items.equipment.bombs.bomb.desc_fuse=A quanto pare la miccia impiegherà un paio di turni per consumarsi una volta accesa.
items.equipment.bombs.bomb.desc_burning=La miccia della bomba si sta consumando, mantieni le distanze o spegnila!
items.equipment.bombs.bomb$doublebomb.name=due bombe
items.equipment.bombs.bomb$doublebomb.desc=Due bombe di polvere da sparo impilate, pare che ne riceverai una gratis!

items.equipment.bombs.firebomb.name=bomba incendiaria
items.equipment.bombs.firebomb.desc=Questa bomba è stata modificata per esplodere in un'area più ampia, infliggendo _%1$d-%2$d danni_ e diffondendo fiamme prolungate entro 2 caselle.
items.equipment.bombs.firebomb.discover_hint=Puoi creare questo oggetto tramite l'alchimia.

items.equipment.bombs.flashbangbomb.name=granata stordente
items.equipment.bombs.flashbangbomb.desc=Questa bomba personalizzata creerà in un'esplosione di luce, suono ed elettricità quando esplode. Qualunque cosa entro 2 caselle  subirà _%1$d-%2$d danni_ dall'esplosione, altri 25%% danni dall'elettricità e rimarrà stordito per 10 turni.
items.equipment.bombs.flashbangbomb.discover_hint=Puoi creare questo oggetto tramite l'alchimia.

items.equipment.bombs.frostbomb.name=bomba gelata
items.equipment.bombs.frostbomb.desc=Questa bomba è stata modificata per esplodere in un'area più ampia, infliggendo _%1$d-%2$d danni_ e diffondendo una folata prolungata di aria gelida entro 2 caselle.
items.equipment.bombs.frostbomb.discover_hint=Puoi creare questo oggetto tramite l'alchimia.

items.equipment.bombs.holybomb.name=bomba sacra
items.equipment.bombs.holybomb.desc=Questa bomba è stata modificata per emettere luce sacra in un'area più ampia quando esplode. Qualunque cosa entro 2 caselle subirà _%1$d-%2$d danni_ dall'esplosione, e i nemici non morti o demoniaci subiranno ulteriori 50%% danni dalla luce sacra.
items.equipment.bombs.holybomb.discover_hint=Puoi creare questo oggetto tramite l'alchimia.

items.equipment.bombs.noisemaker.name=tric-trac
items.equipment.bombs.noisemaker.desc=Questa bomba personalizzata emetterà ripetutamente rumore quando la sua miccia si esaurisce. Quando qualcosa tocca la bomba, questa esploderà e infliggerà _%1$d-%2$d danni_ a qualsiasi cosa entro 2 caselle!
items.equipment.bombs.noisemaker.desc_burning=Il tric-trac sta ticchettando, esploderà quando qualcosa gli andrà vicino!
items.equipment.bombs.noisemaker.discover_hint=Puoi creare questo oggetto tramite l'alchimia.

items.equipment.bombs.smokebomb.name=bomba fumogena
items.equipment.bombs.smokebomb.desc=Questa bomba è stata modificata per emettere una densa nube di gas nello stesso momento in cui esplode. Infliggerà _%1$d-%2$d danni_ e diffonderà la nebbia avvolgente entro 2 caselle.
items.equipment.bombs.smokebomb.discover_hint=Puoi creare questo oggetto tramite l'alchimia.

items.equipment.bombs.regrowthbomb.name=bomba ricrescita
items.equipment.bombs.regrowthbomb.desc=Questa bomba personalizzata schizzerà liquido vivificante ovunque entro 3 tessere invece di esplodere. Nell’area colpita dall’esplosione germoglieranno rapidamente erba e piante. Tu e tutti gli alleati coinvolti nell'esplosione verrete guariti come se avessero bevuto una pozione curativa.
items.equipment.bombs.regrowthbomb.discover_hint=Puoi creare questo oggetto tramite l'alchimia.

items.equipment.bombs.shrapnelbomb.name=bomba shrapnel
items.equipment.bombs.shrapnelbomb.desc=Questa bomba è stata modificata con frammenti del metallo del DM-300, che si frammenteranno e voleranno ovunque quando esplode, infliggendo _%1$d-%2$d danni_ in un vasto raggio attorno alla bomba. Faresti meglio a nasconderti dietro qualcosa quando lo usi...
items.equipment.bombs.shrapnelbomb.discover_hint=Puoi creare questo oggetto tramite l'alchimia.

items.equipment.bombs.woollybomb.name=bomba lanosa
items.equipment.bombs.woollybomb.desc=Questa bomba personalizzata creerà un ampio campo di pecore magiche dopo l'esplosione. L'esplosione infliggerà _%1$d-%2$d danni_ a qualsiasi cosa entro 2 caselle. Le pecore bloccheranno il movimento e persisteranno per molto tempo! Tuttavia, le pecore non resisteranno a lungo in presenza di nemici potenti e potranno essere disperse manualmente prima interagendo con loro.
items.equipment.bombs.woollybomb.discover_hint=Puoi creare questo oggetto tramite l'alchimia.

###food
items.consum.food.berry.name=bacca del dungeon
items.consum.food.berry.eat_msg=Quella bacca era gustosa!
items.consum.food.berry.desc=Questa piccola bacca è stata trovata dalla Cacciatrice tra la vegetazione del dungeon. Può essere mangiata velocemente, ristabilisce un po di sazietà, e potrebbe contenere qualche seme utile!
items.consum.food.berry.discover_hint=Puoi trovare questo oggetto usando un talento dell'eroe specifico.

items.consum.food.blandfruit.name=blandofrutto
items.consum.food.blandfruit.cooked=blandofrutto cotto
items.consum.food.blandfruit.sunfruit=solefrutto
items.consum.food.blandfruit.rotfruit=marciofrutto
items.consum.food.blandfruit.earthfruit=frutto della terra
items.consum.food.blandfruit.blindfruit=frutto accecante
items.consum.food.blandfruit.firefruit=frutto del fuoco
items.consum.food.blandfruit.icefruit=frutto del ghiaccio
items.consum.food.blandfruit.fadefruit=fiocofrutto
items.consum.food.blandfruit.sorrowfruit=frutto del dolore
items.consum.food.blandfruit.stormfruit=frutto della tempesta
items.consum.food.blandfruit.dreamfruit=frutto regale
items.consum.food.blandfruit.starfruit=frutto delle stelle
items.consum.food.blandfruit.swiftfruit=agilefrutto
items.consum.food.blandfruit.raw=Non puoi mangiarlo crudo.
items.consum.food.blandfruit.desc=Così secco e inutile... forse stufarlo con un altro ingrediente potrebbe migliorarlo.
items.consum.food.blandfruit.desc_cooked=Il frutto sì è gonfiato a causa del tempo passato nella pentola ed ha assorbito le proprietà del seme con cui è stato cotto. Possiederà gli effetti della pozione corrispondente al seme usato.
items.consum.food.blandfruit.desc_eat=Sembra pronto per essere mangiato!
items.consum.food.blandfruit.desc_throw=Sembra piuttosto instabile, sarebbe meglio lanciarlo.
items.consum.food.blandfruit$chunks.name=pezzi di blandofrutto
items.consum.food.blandfruit$chunks.desc=Il blandofrutto è esploso all'impatto, lasciando dietro di sé dei pezzetti inerti.\n\nMalgrado siano un po' sporchi, questi grossi pezzi di blandofrutto cotto appaiono perfettamente commestibili.

items.consum.food.chargrilledmeat.name=carne alla griglia
items.consum.food.chargrilledmeat.desc=Sembra una bistecca niente male.
items.consum.food.chargrilledmeat.discover_hint=Puoi creare questo oggetto usando un altro cibo.

items.consum.food.food.name=razione di cibo
items.consum.food.food.ac_eat=MANGIA
items.consum.food.food.eat_msg=Il cibo era delizioso!
items.consum.food.food.desc=Niente di particolare qui: carne essiccata, qualche biscotto... cose così.

items.consum.food.frozencarpaccio.name=carpaccio congelato
items.consum.food.frozencarpaccio.invis=Vedi le tue mani diventare invisibili!
items.consum.food.frozencarpaccio.hard=Senti la tua pelle indurirsi!
items.consum.food.frozencarpaccio.refresh=Rinfrescante!
items.consum.food.frozencarpaccio.better=Ti senti meglio!
items.consum.food.frozencarpaccio.desc=È un pezzo di carne cruda congelata. L'unico modo per mangiarla è tagliandola in fettine sottili. E mangiata così è incredibilmente buona.
items.consum.food.frozencarpaccio.discover_hint=Puoi creare questo oggetto usando un altro cibo.

items.consum.food.meatpie.name=pasticcio di carne
items.consum.food.meatpie.eat_msg=Quel cibo era incredibile!
items.consum.food.meatpie.desc=Un delizioso pasticcio ripieno di carne saporita. Ti sazierà molto più di ogni altro pasto.
items.consum.food.meatpie.discover_hint=Puoi creare questo oggetto tramite l'alchimia.

items.consum.food.mysterymeat.name=carne misteriosa
items.consum.food.mysterymeat.eat_msg=Questo cibo ha un sapore... strano.
items.consum.food.mysterymeat.hot=Oh, è caldo!
items.consum.food.mysterymeat.legs=Non ti senti più le gambe!
items.consum.food.mysterymeat.not_well=Non ti senti bene.
items.consum.food.mysterymeat.stuffed=Sei troppo pieno.
items.consum.food.mysterymeat.desc=Mangia a tuo rischio e pericolo!
items.consum.food.mysterymeat.discover_hint=Puoi trovare questo oggetto come bottino da certi nemici.
items.consum.food.mysterymeat$placeholder.name=carne

items.consum.food.phantommeat.name=carne fantasma
items.consum.food.phantommeat.desc=Una grande bistecca traslucida e luccicante, tagliata da un piranha fantasma. Questa carne magica non ha bisogno di essere cucinata e garantisce una serie di benefici difensivi oltre a saziarti completamente. Quando viene mangiato garantisce l'invisibilità, pelle coriacea, un po' di guarigione e cura molti effetti dannosi.
items.consum.food.phantommeat.discover_hint=Puoi trovare questo oggetto come bottino da certi nemici.

items.consum.food.pasty.name=pasticcio
items.consum.food.pasty.fish_name=pesce al vapore
items.consum.food.pasty.amulet_name=amuleto di yendor?
items.consum.food.pasty.egg_name=uovo di Pasqua
items.consum.food.pasty.rainbow_name=pozione arcobaleno
items.consum.food.pasty.shattered_name=torta verde
items.consum.food.pasty.pie_name=torta di zucca
items.consum.food.pasty.vanilla_name=torta blu
items.consum.food.pasty.cane_name=bastoncino di zucchero
items.consum.food.pasty.sparkling_name=pozione scintillante
items.consum.food.pasty.desc=Un autentico pasticcio della Cornovaglia con il suo tradizionale ripieno di manzo e patate. Delizioso!
items.consum.food.pasty.fish_desc=Un pesce intero al vapore, magicamente conservato su un letto di verdure. È tradizione conservare un po' di pesce per dopo in questo periodo dell'anno, quindi conserverai degli avanzi invece di mangiarlo tutto in una volta.\n\nBuon Capodanno Lunare!
items.consum.food.pasty.amulet_desc=Hai finalmente trovato, l'amuleto magico - aspetta un minuto, questo è solo un cioccolato avvolto in alluminio che sembra un amuleto! Non ti concederà un potere illimitato, ma almeno ti riempirà e ti darà una piccola carica di artefatto.\n\nPesce d'aprile!
items.consum.food.pasty.egg_desc=Un grande uovo di cioccolato, avvolto in una colorata pellicola gialla. C'è abbastanza cioccolato qui per riempirti, e lo zucchero potrebbe dare ai tuoi artefatti una piccola carica  extra.\n\nBuona Pasqua!
items.consum.food.pasty.rainbow_desc=Questa pozione colorata è una specie di cibo liquido. Oltre a soddisfare la tua fame, contiene un po' di magia che calmerà un nemico adiacente che non sia un boss, rendendolo temporaneamente riluttante a combatterti.\n\nBuon mese del Pride!
items.consum.food.pasty.shattered_desc=Questa grande fetta di torta alla vaniglia ha confettini colorati e glassa verde. La torta è stata creata per celebrare anni di esperienza e ti garantirà una piccola quantità di quell'esperienza quando la mangerai.\n\nShattered Pixel Dungeon è stato rilasciato per la prima volta il 5 agosto 2014. Buon compleanno Shattered Pixel Dungeon!
items.consum.food.pasty.pie_desc=Una grande fetta di torta di zucca. Il suo sapore dolce e speziato ti riempirà e ti darà un piccolo po' di guarigione.\n\nBuon Halloween!
items.consum.food.pasty.vanilla_desc=Questa grande fetta di torta alla vaniglia ha confettini colorati e glassa blu. La torta è stata creata per celebrare anni di esperienza e ti garantirà una piccola quantità di quell'esperienza quando la mangerai.\n\nIl Pixel Dungeon originale è stato rilasciato per la prima volta il 4 dicembre 2012. Buon compleanno Pixel Dungeon!
items.consum.food.pasty.cane_desc=Una enorme caramella dolce e zuccherata a forma di bastoncino. È abbastanza grande da saziarti e lo zucchero potrebbe dare alle tue bacchette un po' di carica extra.\n\nBuone Feste!
items.consum.food.pasty.sparkling_desc=Questa pozione frizzante è una specie di cibo liquido. Placa la fame e simula lo spumante, ma in realtà non è alcolico. La sensazione di calore nella pancia ti garantirà un po' di protezione.\n\nBuon Anno!
items.consum.food.pasty$fishleftover.name=avanzi di pesce
items.consum.food.pasty$fishleftover.eat_msg=Quel cibo era ok.
items.consum.food.pasty$fishleftover.desc=Alcuni pesci in eccesso dal tuo pasto precedente. Puoi mangiarli quando vuoi per ripristinare un po' di fame.

items.consum.food.smallration.name=razione di cibo piccola
items.consum.food.smallration.eat_msg=Quel cibo era ok.
items.consum.food.smallration.desc=Ha lo stesso aspetto di una razione di cibo regolare. Ma più piccola.
items.consum.food.smallration.discover_hint=Puoi comprare questo oggetto in un negozio.

items.consum.food.stewedmeat.name=carne stufata
items.consum.food.stewedmeat.eat_msg=Quel cibo era ok.
items.consum.food.stewedmeat.desc=Stufare la carne l'ha purificata da ogni agente nocivo o parassiti. Dovrebbe essere sicura da mangiare.
items.consum.food.stewedmeat.discover_hint=Puoi creare questo oggetto tramite l'alchimia.

items.consum.food.supplyration.name=razione di supporto
items.consum.food.supplyration.desc=Questa razione veniva lasciata nella prigione da e per i membri della gilda dei ladri. È specificamente progettata per essere mangiata in movimento e aiuta in generale con attività illecite.\n\nAnche se non ti sazia tanto quanto una razione normale, può essere consumata rapidamente, fornisce un po' di guarigione diretta e ripristina una carica del mantello delle ombre del Ladro.
items.consum.food.supplyration.discover_hint=Puoi trovare questo oggetto usando un talento dell'eroe specifico.



##journal items
items.specific.journal.documentpage.name=pagina strappata
items.specific.journal.documentpage.desc=Una pagina solitaria, probabilmente strappata da un qualche libro. Dovrai raccoglierla per poterla leggere.

items.specific.journal.alchemypage.name=pagina strappata del libro d'alchimia
items.specific.journal.alchemypage.desc=Una pagina strappata da una guida sull'alchimia.\n\nLa maggior parte del testo è troppo piccola da leggere da lontano, ma puoi distinguere il titolo della pagina:\n\n_"%s"_

items.specific.journal.guidebook.name=Tomo sulla Padronanza dei Dungeon
items.specific.journal.guidebook.hint_mobile=La tua guida ha consigli per te! Premi il pulsante lampeggiante del diario in alto a destra per leggerlo.
items.specific.journal.guidebook.hint_desktop=La tua guida ha consigli per te! Seleziona il pulsante lampeggiante del diario (%s) in alto a destra per leggerlo.
items.specific.journal.guidebook.hint_status=Guida
items.specific.journal.guidebook.desc=Una guida per avventurieri, abbandonata qui da qualcuno che ha deciso che l'esplorazione di dungeon non faceva per lui. Questo libro è magico e può avvisarti al momento giusto quando c'è una pagina da leggere.\n\nNonostante questa caratteristica, il libro è più famoso a causa delle parole "Niente Panico!" scritte a grandi lettere sulla copertina.

items.specific.journal.guidepage.name=pagina strappata della guida
items.specific.journal.guidepage.desc=Una pagina strappata da una guida sull'avventurarsi.\n\nLa maggior parte del testo è troppo piccola da leggere da lontano, ma puoi distinguere il titolo della pagina:\n\n_"%s"_

items.specific.journal.regionlorepage$sewers.name=lettera logora
items.specific.journal.regionlorepage$sewers.desc=Sembra una lettera, scritta su un pezzo di carta sporco di terra. Dovrai raccoglierla per decifrare cosa c'è scritto.

items.specific.journal.regionlorepage$prison.name=pagina del diario logora
items.specific.journal.regionlorepage$prison.desc=Una pagina di un diario, o qualche altro tipo di enciclopedia, scritta su un pezzo di carta. Sembra essere messa meglio delle lettere che hai trovato nelle fogne, ma dovrai raccoglierla per poterla leggere.

items.specific.journal.regionlorepage$caves.name=voce di un vecchio registro
items.specific.journal.regionlorepage$caves.desc=Sembra una voce del registro di un esploratore, preservata sorprendentemente bene nonostante quanto vecchia sia. Raccoglila per leggerla.

items.specific.journal.regionlorepage$city.name=tavoletta arrugginita
items.specific.journal.regionlorepage$city.desc=Una piccola tavola metallica piena di ruggine con un messaggio inciso su di essa con la magia. Le lettere sono ancora chiare nonostante la sua età, ma dovrai raccoglierla per leggerla.

items.specific.journal.regionlorepage$halls.name=tavoletta luminosa
items.specific.journal.regionlorepage$halls.desc=Una piccola tavola nera con delle lettere verdi incise su di essa. Le lettere luminose sono sfocate da lontano, dovrai raccoglierla per leggerla.


###keys
items.specific.keys.goldenkey.name=chiave d'oro
items.specific.keys.goldenkey.desc=Le incisioni su questa chiave dorata sono minuziose e complicate. Magari aprirà il lucchetto di uno scrigno?

items.specific.keys.crystalkey.name=Chiave di cristallo
items.specific.keys.crystalkey.desc=La superficie levigata di questa chiave cristallina brilla nell'oscurità. Forse può aprire qualcosa fatto di cristallo?

items.specific.keys.ironkey.name=chiave di ferro
items.specific.keys.ironkey.desc=Le incisioni su questa vecchia chiave di ferro sono molto consumate; il suo cordino di cuoio è rovinato dal tempo.\nQuale porta potrà aprire?

items.specific.keys.wornkey.name=chiave logora
items.specific.keys.wornkey.desc=Questa chiave è logora e scolorita, ma ha un'aspetto importante. Probabilmente è in grado di aprire qualche porta molto importante.



###potions
items.consum.potions.potion.ac_drink=BEVI
items.consum.potions.potion.turquoise=pozione turchese
items.consum.potions.potion.crimson=pozione cremisi
items.consum.potions.potion.azure=pozione azzurra
items.consum.potions.potion.jade=pozione giada
items.consum.potions.potion.golden=pozione dorata
items.consum.potions.potion.magenta=pozione magenta
items.consum.potions.potion.charcoal=pozione antracite
items.consum.potions.potion.ivory=pozione avorio
items.consum.potions.potion.amber=pozione ambrata
items.consum.potions.potion.bistre=pozione fuliggine
items.consum.potions.potion.indigo=pozione indaco
items.consum.potions.potion.silver=pozione argento
items.consum.potions.potion.unknown_desc=Questa boccetta contiene un vorticoso liquido colorato. Chissà cosa farà una volta bevuta o lanciata?
items.consum.potions.potion.harmful=Pozione dannosa!
items.consum.potions.potion.beneficial=Pozione benefica
items.consum.potions.potion.yes=Sì, so quel che sto facendo
items.consum.potions.potion.no=No, ho cambiato idea
items.consum.potions.potion.sure_drink=Sei sicuro di volerla bere? Nella maggior parte dei casi dovresti lanciare questa pozione ai tuoi nemici.
items.consum.potions.potion.sure_throw=Sei sicuro di volerla lanciare? Nella maggior parte dei casi avrebbe più senso berla.
items.consum.potions.potion.shatter=La boccetta si frantuma e il liquido si sparge senza fare danno.
items.consum.potions.potion.discover_hint=Puoi trovare questo oggetto casualmente nel dungeon, o crearlo tramite l'alchimia.
items.consum.potions.potion$placeholder.name=pozione
items.consum.potions.potion$seedtopotion.name=Pozione Casuale

items.consum.potions.potionofexperience.name=pozione dell'esperienza
items.consum.potions.potionofexperience.desc=La leggendaria esperienza di una moltitudine di battaglie ridotta in forma liquida. Questo distillato incrementerà istantaneamente il tuo livello di esperienza.

items.consum.potions.potionoffrost.name=pozione del congelamento
items.consum.potions.potionoffrost.desc=La sostanza chimica contenuta in questa pozione evaporerà in una nube congelante non appena esposta all'aria aperta.

items.consum.potions.potionofhaste.name=pozione di fretta
items.consum.potions.potionofhaste.energetic=Sprizzi energia da tutti i pori!
items.consum.potions.potionofhaste.desc=Bere questo liquido curiosamente dolce ti irradierà di una eccezionale energia per un breve periodo, permettendoti di correre ad alte velocità.

items.consum.potions.potionofhealing.name=pozione della guarigione
items.consum.potions.potionofhealing.heal=Le tue ferite cominciano a chiudersi.
items.consum.potions.potionofhealing.desc=Questo elisir ripristinerà rapidamente la tua salute, curando istantaneamente molti disturbi.

items.consum.potions.potionofinvisibility.name=pozione dell'invisibilità
items.consum.potions.potionofinvisibility.invisible=Vedi le tue mani diventare invisibili!
items.consum.potions.potionofinvisibility.desc=Bere questa pozione ti renderà temporaneamente invisibile. Mentre sei invisibile, i nemici non saranno in grado di vederti. Gli attacchi fisici e gli effetti magici (come le pergamene e le bacchette) annulleranno immediatamente l'invisibilità.

items.consum.potions.potionoflevitation.name=pozione della levitazione
items.consum.potions.potionoflevitation.float=Stai volando a mezz'aria!
items.consum.potions.potionoflevitation.desc=Bere questo liquido curioso avrà l'effetto di farti librare in aria, capace di evitare senza pericoli trappole e buche. Lanciare questa pozione creerà una nube di gas grezzo, disorientando chiunque ne venga catturato.

items.consum.potions.potionofliquidflame.name=pozione del fuoco liquido
items.consum.potions.potionofliquidflame.desc=La boccetta contiene un componente instabile che arderà con vampate violente se esposta all'aria.

items.consum.potions.potionofmindvision.name=pozione di visione mentale
items.consum.potions.potionofmindvision.see_mobs=Riesci in un qualche modo a sentire la presenza delle menti delle altre creature!
items.consum.potions.potionofmindvision.see_none=Puoi in qualche modo sentire che al momento su questo piano sei solo.
items.consum.potions.potionofmindvision.desc=Dopo aver bevuto questa pozione, la tua mente si sintonizzerà sulla frequenza psichica di creature lontane, permettendoti di sentirne la presenza biologica attraverso le pareti. Ti permetterà anche di vedere attraverso muri e porte vicine.

items.consum.potions.potionofparalyticgas.name=pozione del gas paralizzante
items.consum.potions.potionofparalyticgas.desc=In seguito all'esposizione all'aria aperta, il liquido contenuto si vaporizzerà creando un'ipnotica foschia gialla. Chiunque la respiri sarà paralizzato all'istante, incapace di muoversi per un po' di tempo dopo che il gas si sarà diradato. Questo oggetto può essere lanciato verso nemici distanti per intrappolarli nell'effetto del gas.

items.consum.potions.potionofpurity.name=pozione di purificazione
items.consum.potions.potionofpurity.freshness=Avverti un'inconsueta freschezza nell'aria.
items.consum.potions.potionofpurity.protected=Una membrana protettiva ti avvolge!
items.consum.potions.potionofpurity.desc=Questo reagente magico neutralizzerà velocemente tutti gli effetti dannosi locali in una vasta area. Berlo invece garantirà un'immunità temporanea da questi effetti.

items.consum.potions.potionofstrength.name=pozione di forza
items.consum.potions.potionofstrength.msg=Nuova forza si sprigiona nel tuo corpo, ora hai %d di forza!
items.consum.potions.potionofstrength.desc=Questo potente liquido scorrerà nei tuoi muscoli, aumentando permanentemente la tua forza di un punto.

items.consum.potions.potionoftoxicgas.name=pozione di gas tossico
items.consum.potions.potionoftoxicgas.desc=Stappare o frantumare questa ampolla pressurizzata provocherà un'esplosione, creando una nube letale di gas tossico verde. Potresti scegliere di scagliare questa pozione verso nemici distanti invece di stapparla a mano.



###brews
items.consum.potions.brews.brew.discover_hint=Puoi creare questo oggetto tramite l'alchimia.

items.consum.potions.brews.aquabrew.name=infuso d'acqua
items.consum.potions.brews.aquabrew.desc=Una volta frantumata, questa miscela rilascerà un getto di acqua pressurizzata nella sua posizione. È abbastanza potente da danneggiare nemici infuocati, ma sparge anche acqua sul terreno vicino, disabilita trappole, spegne gli incendi e respinge i personaggi vicini all'esplosione.

items.consum.potions.brews.blizzardbrew.name=miscela bufera
items.consum.potions.brews.blizzardbrew.desc=Quando frantumata, questa miscela scatenerà una turbinante bufera che si espande come un gas.

items.consum.potions.brews.causticbrew.name=miscela caustica
items.consum.potions.brews.causticbrew.desc=Questa miscela spargerà della melma corrosiva in un'ampia area intorno al luogo in cui viene frantumata. Ogni cosa raggiunta dalla melma si scioglierà lentamente se non verrà lavata con l'acqua.

items.consum.potions.brews.infernalbrew.name=miscela infernale
items.consum.potions.brews.infernalbrew.desc=Quando frantumata, questa miscela scatenerà un roboante inferno di fiamme che si espande come un gas.

items.consum.potions.brews.shockingbrew.name=miscela fulminante
items.consum.potions.brews.shockingbrew.desc=Quando frantumata, questa miscela scatenerà una tempesta elettrica in un'ampia area circostante al luogo della sua rottura.

items.consum.potions.brews.unstablebrew.name=miscela instabile
items.consum.potions.brews.unstablebrew.desc=Questa miscela magica brilla dei colori cangianti dell'arcobaleno.\n\nQuando bevuto o lanciato attiverà l'effetto di una pozione casuale. L'effetto della pozione sarà sempre benefico se viene bevuta, e sarà sempre dannoso se viene lanciata.

###elixirs
items.consum.potions.elixirs.elixir.discover_hint=Puoi creare questo oggetto tramite l'alchimia.

items.consum.potions.elixirs.elixirofarcanearmor.name=elisir dell'armatura arcana
items.consum.potions.elixirs.elixirofarcanearmor.desc=questo elisir donerà al suo bevitore una durevole resistenza agli attacchi magici.

items.consum.potions.elixirs.elixirofaquaticrejuvenation.name=elisir del rinvigorimento acquatico
items.consum.potions.elixirs.elixirofaquaticrejuvenation.desc=Questo elisir contiene le spoglie di Goo, potenziate con una pozione di guarigione. Sebbene non fornisca una guarigione immediata, ripristinerà costantemente una superiore quantità di salute mentre resti in acqua.
items.consum.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=guarigione acquatica
items.consum.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Hai temporaneamente ottenuto proprietà di ripristino simili a quelle di Goo.\n\nMentre sei in acqua, recupererai una piccola quantità di salute ogni turno. L'effetto verrà sospeso quando sei in piena salute o fuori dall'acqua.\n\nTurni rimanenti: %d.

items.consum.potions.elixirs.elixirofdragonsblood.name=elisir del sangue di drago
items.consum.potions.elixirs.elixirofdragonsblood.desc=Quando tracannato, questo elisir irradierà un impetuoso potere nelle vene del suo bevitore. Questo effetto renderà il bevitore immune al fuoco e gli consentirà di incendiare i nemici tramite l'uso degli attacchi fisici.

items.consum.potions.elixirs.elixiroffeatherfall.name=elisir della caduta piumata
items.consum.potions.elixirs.elixiroffeatherfall.light=Ti senti leggero come una piuma!
items.consum.potions.elixirs.elixiroffeatherfall.desc=Questo elisir offre un effetto di levitazione più debole ma più controllato, consentendo a chi lo beve di cadere da grandi distanze senza danni per un po'.
items.consum.potions.elixirs.elixiroffeatherfall$featherbuff.name=caduta piumata
items.consum.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Sei sotto l'effetto di un elisir di caduta piumata, che ti permette di cadere negli abissi senza subire danni!\n\nTurni rimanenti: %s.

items.consum.potions.elixirs.elixirofhoneyedhealing.name=elisir della guarigione melliflua
items.consum.potions.elixirs.elixirofhoneyedhealing.desc=Questo elisir combina la guarigione con la dolcezza del miele. Una volta bevuta, applicherà lo stesso effetto di una pozione della guarigione e soddisferà una piccola quantità di fame, ma può anche essere lanciata per curare un alleato.\n\nLe creature con affinità per il miele potrebbero essere pacificate se questo oggetto viene utilizzato su di loro.

items.consum.potions.elixirs.elixiroficytouch.name=elisir del tocco gelido
items.consum.potions.elixirs.elixiroficytouch.desc=Quando tracannato, questo elisir permetterà al bevitore di sottrarre calore dai nemici bersagliati. Questo effetto renderà il bevitore immune al freddo e gli consentirà di raffreddare i nemici per mezzo degli attacchi fisici.

items.consum.potions.elixirs.elixirofmight.name=elisir della potenza
items.consum.potions.elixirs.elixirofmight.msg=Nuova forza si sprigiona nel tuo corpo, ora hai %d di forza!
items.consum.potions.elixirs.elixirofmight.desc=Questo potente liquido scorrerà nei tuoi muscoli, aumentando in modo permanente la tua forza di un punto e la salute massima temporaneamente di %d punti. L'aumento di salute cresce gradualmente con l'aumentare della salute massima, ma svanisce lentamente con l'aumento di livello.
items.consum.potions.elixirs.elixirofmight$htboost.name=incremento salute massima
items.consum.potions.elixirs.elixirofmight$htboost.desc=Senti il tuo corpo innaturalmente forte e in salute.\n\nLa tua salute massima è incrementata per un periodo esteso. Al progresso dnei livelli d'esperienza, l'incremento si attenuerà di conseguenza.\n\nIncremento attuale: %d.\nLivelli rimanenti: %d.

items.consum.potions.elixirs.elixiroftoxicessence.name=elisir dell'essenza tossica
items.consum.potions.elixirs.elixiroftoxicessence.desc=Una volta consumato, questo elisir infonderà a chi lo beve energia tossica. Il bevitore diffonderà continuamente gas tossico mentre si muove e sarà immune al gas tossico e al veleno per un periodo leggermente più lungo della durata dell'effetto.



###exotic potions
items.consum.potions.exotic.exoticpotion.turquoise=pozione turchese esotica
items.consum.potions.exotic.exoticpotion.crimson=pozione cremisi esotica
items.consum.potions.exotic.exoticpotion.azure=pozione azzurra esotica
items.consum.potions.exotic.exoticpotion.jade=pozione giada esotica
items.consum.potions.exotic.exoticpotion.golden=pozione dorata esotica
items.consum.potions.exotic.exoticpotion.magenta=pozione magenta esotica
items.consum.potions.exotic.exoticpotion.charcoal=pozione antracite esotica
items.consum.potions.exotic.exoticpotion.ivory=pozione avorio esotica
items.consum.potions.exotic.exoticpotion.amber=pozione ambrata esotica
items.consum.potions.exotic.exoticpotion.bistre=pozione fuliggine esotica
items.consum.potions.exotic.exoticpotion.indigo=pozione indaco esotica
items.consum.potions.exotic.exoticpotion.silver=pozione argento esotica
items.consum.potions.exotic.exoticpotion.unknown_desc=Questa boccetta tondeggiante contiene un granuloso liquido colorato. Pare provenga da una terra straniera, chissà che effetto potrebbe avere una volta bevuta o lanciata?
items.consum.potions.exotic.exoticpotion.warning=Vuoi davvero annullare l'uso di questa pozione? Sarà comunque consumata.
items.consum.potions.exotic.exoticpotion.yes=Si, sono sicuro.
items.consum.potions.exotic.exoticpotion.no=No, ho cambiato idea
items.consum.potions.exotic.exoticpotion.discover_hint=Puoi creare questo oggetto tramite l'alchimia.

items.consum.potions.exotic.potionofcleansing.name=pozione detergente
items.consum.potions.exotic.potionofcleansing.desc=Questo potente reagente rende chi lo beve immune a tutti gli effetti nocivi per alcuni turni quando ingerito. Puoi anche lanciarlo contro un bersaglio per ripulirlo dagli stessi effetti.
items.consum.potions.exotic.potionofcleansing$cleanse.name=purificato
items.consum.potions.exotic.potionofcleansing$cleanse.desc=Questo personaggio è temporaneamente immune a tutti gli effetti dannosi!\n\nTurni rimanenti: %s.

items.consum.potions.exotic.potionofcorrosivegas.name=pozione di gas corrosivo
items.consum.potions.exotic.potionofcorrosivegas.desc=Stappare o rompere questa fiala pressurizzata causerà la fuoriuscita del contenuto, che formerà una nube di gas corrosivo color ruggine. Il gas si spande pù velocemente del gas tossico ed è più letale, ma non dura altrettanto a lungo.

items.consum.potions.exotic.potionofdragonsbreath.name=pozione dell'alito di drago
items.consum.potions.exotic.potionofdragonsbreath.prompt=Scegli un punto da incendiare
items.consum.potions.exotic.potionofdragonsbreath.desc=Questa boccetta contiene un insolito composto che scoppierà in fiamme poco dopo essere stato mischiato con la saliva. Sputare rapidamente tale liquido permetterà al suo utilizzatore di emettere fiamme dalla sua bocca!

items.consum.potions.exotic.potionofearthenarmor.name=pozione dell'armatura di terracotta
items.consum.potions.exotic.potionofearthenarmor.desc=Piuttosto che paralizzare, questo liquido ha un effetto indurente sulla pelle, che si trasformerà così in un'autentica armatura temporanea.

items.consum.potions.exotic.potionofdivineinspiration.name=pozione di ispirazione divina
items.consum.potions.exotic.potionofdivineinspiration.no_more_points=Non puoi guadagnare altri punti Talento oltre a quelli che hai.
items.consum.potions.exotic.potionofdivineinspiration.select_tier=Scegli un'area di talenti in cui guadagnare 2 punti. Devi aver sbloccato quell'area, per potervi spendere i punti.
items.consum.potions.exotic.potionofdivineinspiration.bonus=+2 Punti Talento!
items.consum.potions.exotic.potionofdivineinspiration.desc=Potere di energia sacra ridotto a forma liquida, questa bevanda infonde potere divino in chi la consuma, facendogli guadagnare 2 punti Talento bonus in un'area di sua scelta.\n\nQuesta pozione può essere usata una sola volta per ogni area di talenti.

items.consum.potions.exotic.potionofmagicalsight.name=pozione di vista magica
items.consum.potions.exotic.potionofmagicalsight.desc=Dopo aver bevuto questo, i tuoi sensi saranno brevemente intensificati a livelli incredibili, permettendoti di vedere attraverso i muri in un raggio di 12 tessere!

items.consum.potions.exotic.potionofmastery.name=pozione di maestria
items.consum.potions.exotic.potionofmastery.prompt=Padroneggia un oggetto
items.consum.potions.exotic.potionofmastery.weapon_easier=La tua arma diventa più facile da maneggiare!
items.consum.potions.exotic.potionofmastery.armor_easier=La tua armatura diventa più leggera da indossare!
items.consum.potions.exotic.potionofmastery.desc=Invece di farti guadagnare forza bruta, questa pozione affina i muscoli all'uso di un particolare oggetto. Questo lo renderà più facile da usare, come se il bevitore avesse fatto pratica con esso e costruito memoria muscolare.\n\nL'uso dell'arma o dell'armatura scelta richiederà 2 punti forza in meno. Questa pozione può essere usata una sola volta per ogni oggetto.

items.consum.potions.exotic.potionofshielding.name=pozione dello scudo
items.consum.potions.exotic.potionofshielding.desc=Piuttosto che curare, questa pozione proietterà un robusto scudo attorno al corpo dell'utilizzatore, bloccando così un considerevole ammontare di danni.

items.consum.potions.exotic.potionofshroudingfog.name=pozione di nebbia avvolgente
items.consum.potions.exotic.potionofshroudingfog.desc=Quando esposto all'aria, il liquido in questa fiala produce una spessa nebbia fumosa che si espande velocemente e blocca la vista ai tuoi nemici.

items.consum.potions.exotic.potionofsnapfreeze.name=pozione del surgelamento
items.consum.potions.exotic.potionofsnapfreeze.desc=La sostanza chimica contenuta in questa pozione reagirà rapidamente con l'aria, congelando e bloccando istantaneamente qualunque cosa posta nel suo raggio di azione.

items.consum.potions.exotic.potionofstamina.name=pozione di resistenza
items.consum.potions.exotic.potionofstamina.desc=Bere questo liquido curiosamente dolce ti irradierà con un durevole sprint di energia, permettendoti di correre ritmo accelerato per un esteso periodo di tempo.

items.consum.potions.exotic.potionofstormclouds.name=pozione delle nubi tempestose
items.consum.potions.exotic.potionofstormclouds.desc=Gettare questa pozione creerà una nube di vapore che si espande velocemente, condensa e ricade a terra. La maggior parte del terreno sarà convertito in acqua, i nemici infuocati prenderanno danno, il fuoco verrà spento, e le trappole saranno sommerse e si romperanno.



###quest items
items.quest.ceremonialcandle.name=candela cerimoniale
items.quest.ceremonialcandle.desc=Un set di candele, sciolte e unite in seguito all'uso. \n\nSingolarmente non servono a nulla, ma usate con altre candele nel modo giusto, possono concentrare l'energia per un rituale di evocazione.
items.quest.ceremonialcandle.discover_hint=Puoi trovare questo oggetto durante una missione specifica.

items.quest.corpsedust.name=polvere di cadavere
items.quest.corpsedust.chill=Un brivido ti scorre giù per la schiena.
items.quest.corpsedust.desc=Questa palla di polvere di cadavere non è tanto diversa da una normale palla di polvere. Ma puoi avvertire un'energia maligna nascondersi in essa. \n\nLiberarsene al più presto sarebbe una buona idea.
items.quest.corpsedust.discover_hint=Puoi trovare questo oggetto durante una missione specifica.
items.quest.corpsedust&dustwraith.rankings_desc=Maledetto da Polvere di Cadavere

items.quest.darkgold.name=minerale di oro oscuro
items.quest.darkgold.you_now_have=Ora hai %d minerali d'oro scuro.
items.quest.darkgold.desc=Questo metallo è chiamato oscuro non tanto per il suo colore (che non è diverso dal normale oro), ma perché si fonde alla luce del sole, rendendolo inutile in superficie.
items.quest.darkgold.discover_hint=Puoi trovare questo oggetto durante una missione specifica.

items.quest.dwarftoken.name=gettone nanico
items.quest.dwarftoken.discard=Butti via il gettone in eccesso.
items.quest.dwarftoken.desc=Un pezzo di metallo dalla forma strana, tenuto da uno delle guardie del deposito. Forse fa parte della magia che la connetteva al deposito? Meglio tenerlo stretto, potrebbe avere un qualche uso.
items.quest.dwarftoken.desc_old=Molti nani e alcune delle loro creazioni più grandi recano con sé questi piccoli pezzi di metallo per chissà quale motivo. Forse sono gioielli o un qualche tipo di identificativo. I nani sono gente strana.
items.quest.dwarftoken.discover_hint=Puoi trovare questo oggetto durante una missione specifica.

items.quest.embers.name=braci elementali
items.quest.embers.desc=Braci speciali che possono essere raccolti da giovani elementali del fuoco. Irradiano energia termica.
items.quest.embers.discover_hint=Puoi trovare questo oggetto durante una missione specifica.

items.quest.escapecrystal.name=cristallo di fuga
items.quest.escapecrystal.ac_use=USA
items.quest.escapecrystal.prompt=Seleziona un oggetto
items.quest.escapecrystal.desc=Un piccolo cristallo contenente un incantesimo di teletrasporto. Puoi usare il cristallo in ogni momento per uscire dal deposito, ma se te ne vai troppo presto non riceverai la ricompensa completa!
items.quest.escapecrystal.discover_hint=Puoi trovare questo oggetto durante una missione specifica.
items.quest.escapecrystal.injure_warning_1=Il tempo sembra rallentare, puoi sentire la voce del Diavoletto: \n\n"Sembri abbastanza ferito, sta andando tutto bene giù? Rivoglio la mia statua ma non così tanto da lasciarti morire per riaverla!"
items.quest.escapecrystal.injure_warning_2="Se sei bloccato in una brutta situazione puoi usare uno di questi _oggetti del teletrasporto dalla stanza iniziale_ per fuggire da lì e riprovare."
items.quest.escapecrystal.injure_warning_3="Se le cose si stanno mettendo molto male, puoi _scappare usando quel cristallo che ti ho dato._ Non ti darò l'intera ricompensa, ma è sicuramente meglio che morire!"
items.quest.escapecrystal.leaving_start=Il tempo sembra rallentare, puoi sentire la voce del Diavoletto:\n\n"Ascolta, capisco che potresti essere preoccupato, ma per favore almeno esci dalla prima stanza!"\n\n"Non ti preoccupare del tuo equipaggiamento, sono un Diavoletto di parola, prometto che sarà qui ad aspettarti quando torni fuori. Prometto anche di lasciarti usare il cristallo per fuggire in caso fossi davvero in pericolo."
items.quest.escapecrystal.leaving_early=Il tempo sembra rallentare, puoi sentire la voce del Diavoletto:\n\n"Fuggi di già? Sul serio!? Hai capito che puoi scappare dalla maggior parte dei nemici nel deposito, vero?"\n\n"Ascolta, se la tua vita è in pericolo posso portarti fuori, ma non ti lascio portare fuori alcun oggetto. Mi aspettavo molto di più da te =("
items.quest.escapecrystal.leaving_partly_explored=Il tempo sembra rallentare, puoi sentire la voce del Diavoletto:\n\n"Oh, te ne vai di già? Beh, suppongo che almeno mi hai aiutato a mappare il deposito, che è meglio di niente."\n\n"Mi aspettavo comunque qualcosa di più da te =(. Ovviamente ti porterò fuori se davvero ne hai bisogno. Ti lascerò portare con te qualcosa come una pozione o una pergamena.
items.quest.escapecrystal.leaving_fully_explored=Il tempo sembra rallentare, puoi sentire la voce del Diavoletto:\n\n"Hai bisogno di uscire? Beh, almeno hai esplorato gran parte del deposito. Speravo riuscissi anche a derubarlo, ma almeno ho un'idea migliore di come funzioni il tutto."\n\n"Ti lascerò portare fuori qualcosa, ma nulla di magicamente migliorato!"
items.quest.escapecrystal.leaving_partial_victory=Il tempo sembra rallentare, puoi sentire la voce del Diavoletto:\n\n"Speravo riuscissi a prendere la mia statuetta, ma almeno hai fatto un buon lavoro esplorando e liberando gran parte del deposito!"\n\n"Facciamo così, ti lascerò portare fuori un oggetto a condizione che non sia migliorato più di +1, e mi metterò comunque a vendere oggetti più in basso. Mi serve comunque un po' di tempo per pianificare la mia prossima mossa."
items.quest.escapecrystal.leaving_victory=Il tempo sembra rallentare, puoi sentire la voce del Diavoletto:\n\n"Benissimo!! Sei pronto ad uscire? Ti prenderò la statuetta appena arrivi".\n\n"Come promesso, mi metterò a vendere oggetti più in basso e ti lascerò portare fuori un oggetto a tua scelta! Prenditi il tuo tempo per scegliere, tutto il resto rimarrà nel deposito."
items.quest.escapecrystal.leaving_item=Sei sicuro di voler portare con te questo oggetto?
items.quest.escapecrystal.leaving_seal=_Il Sigillo Rotto attaccato a quest'armatura è connesso allo specchio e non può essere portato fuori._ Il sigillo verrà automaticamente staccato dall' armatura. Questo ridurrà il livello dell'armatura di 1 ma non rimuoverà il glifo che ha.
items.quest.escapecrystal.leaving_staff=_Il Bastone del Mago è connesso allo specchio e non può essere portato fuori, ma potrai portare con te la bacchetta infusa._ La bacchetta verrà rimossa automaticamente dal bastone, e la riceverai al livello del bastone -1.
items.quest.escapecrystal.leaving_yes=Esci dal Deposito
items.quest.escapecrystal.leaving_no=Resta Qui
items.quest.escapecrystal.error_start=Sembra che tu non sia nel piano del Deposito! Questo può accadere a causa di un bug o crash.
items.quest.escapecrystal.error_no_items=Nessuno dei tuoi oggetti verrano tenuti, quindi il cristallo è stato rimosso dal tuo inventario.
items.quest.escapecrystal.error_with_items=I tuoi oggetti verranno mantenuti, dovresti provare a ritornare nel deposito e ricominciare la missione. I tuoi oggetti ti verranno ritornati quando completerai la missione.

items.quest.gooblob.name=grumo di viscidume
items.quest.gooblob.desc=Un grumo di melma tremolante che si è staccato da Goo quand'è morto.\nE? come una grossa palla di gelatina, anche se non oseresti mai mangiarla.\n\nDi per sè non fa nulla ma forse potrebbe essere utile in combinazione con certe pozioni o una bomba; In fondo si dovrebbe convertire in una discreta quantità di energia.
items.quest.gooblob.discover_hint=Puoi trovare questo oggetto come bottino da certi nemici.

items.quest.impstatue.name=statuetta di ossidiana
items.quest.impstatue.desc=Una piccola statuetta di ossidiana. Assomiglia al Diavoletto che ti ha mandato qui, ha anche gli stessi occhi verdi luminosi. C'è qualcosa inscritto sulla base della statuetta in una lingua che non hai mai visto prima.
items.quest.impstatue.discover_hint=Puoi trovare questo oggetto durante una missione specifica.

items.quest.vaultbeacon.name=faro del deposito
items.quest.vaultbeacon.desc=Questo incantesimo di Faro del Ritorno sembra avere una posizione già salvata, probabilmente la stanza d'ingresso dove l'hai trovato.\n\nPotresti usarlo per risparmiare un po' di tempo mentre esplori, o come via di fuga se sei in pericolo.
items.quest.vaultbeacon.discover_hint=Puoi trovare questo oggetto durante una missione specifica.

items.quest.metalshard.name=frammento di metallo maledetto
items.quest.metalshard.desc=Un frammento di metallo arrugginito e maledetto, che si è staccato da DM-300 quand'è stato distrutto. Puoi avvertire una forza malvagia inattiva al suo interno.
items.quest.metalshard.discover_hint=Puoi trovare questo oggetto come bottino da certi nemici.

items.quest.pickaxe.name=piccone
items.quest.pickaxe.ability_name=trafiggi
items.quest.pickaxe.ability_desc=La Duellante può _perforare_ un nemico con un piccone. Questo colpo è garantito, applica vulnerabile per 3 turni e infligge _%1$d-%2$d danni_ ai nemici con la pelle rigida.
items.quest.pickaxe.upgrade_ability_stat_name=Danni dell'abilità
items.quest.pickaxe.desc=Questo è uno strumento robusto e pesante per rompere le rocce. Non è necessario equipaggiare la piccozza per scavare con essa, ma probabilmente può essere equipaggiata come arma in caso di necessità.
items.quest.pickaxe.discover_hint=Puoi trovare questo oggetto durante una missione specifica.



###remains
items.ground.remains.remainsitem.ac_use=USA
items.ground.remains.remainsitem.discover_hint=Puoi trovare questo oggetto nei resti di un eroe specifico di una precedente avventura.

items.ground.remains.bowfragment.name=frammento di arco
items.ground.remains.bowfragment.desc=Questo frammento rotto di legno faceva parte dell'arco spirituale di una Cacciatrice perduta. Puoi ancora sentire un po' di energia naturale rimasta nel frammento, puoi usare il frammento per far crescere dell'erba alta intorno a te. Farlo però distruggerà il frammento.

items.ground.remains.brokenhilt.name=manico rotto
items.ground.remains.brokenhilt.desc=Questa impugnatura rotta sembra provenire dall'arma di una Duellante sconfitta. Puoi ancora percepire un po' di potere marziale rimasto nell'impugnatura, puoi usarlo per ottenere un piccolo bonus di danni sui tuoi prossimi due attacchi corpo a corpo. Farlo però distruggerà l'impugnatura.

items.ground.remains.brokenstaff.name=bastone rotto
items.ground.remains.brokenstaff.desc=Questo bastone del Mago è stato spezzato a metà dopo che il suo proprietario ha incontrato la sua fine. Puoi ancora sentire un po' di energia magica rimasta nel bastone, puoi usarla per dare un piccolo impulso di carica alle tue bacchette. Farlo però distruggerà il bastone.

items.ground.remains.cloakscrap.name=pezzo di stoffa
items.ground.remains.cloakscrap.desc=Questo pezzo di tessuto traslucido sembra provenire dal mantello delle ombre di un ladro tardivo. Puoi ancora percepire un po' di energia mistica residua in esso, puoi usarlo per dare ai tuoi artefatti un piccolo impulso di carica. Tuttavia, facendo ciò, distruggerai il tessuto.

items.ground.remains.sealshard.name=frammenti di sigillo
items.ground.remains.sealshard.desc=Questi piccoli frammenti di cera rossa sembrano provenire dal sigillo di un Guerriero caduto. Puoi ancora percepire un po' di determinazione attaccata al sigillo, puoi usarla per proteggerti un po'. Farlo distruggerà però i frammenti del sigillo.

items.ground.remains.tornpage.name=pagina strappata
items.ground.remains.tornpage.desc=Sembra che questa pagina sia stata strappata dal tomo svanito di un Chierico. C'è ancora un po' di magia divina intrisa ad essa, puoi usarla per riguadagnare un po' di salute. Tuttavia, facendo ciò distruggerai la pagina strappata.



###rings
items.equipment.rings.ring.diamond=anello di diamante
items.equipment.rings.ring.opal=anello di opale
items.equipment.rings.ring.garnet=anello granato
items.equipment.rings.ring.ruby=anello di rubino
items.equipment.rings.ring.amethyst=anello di ametista
items.equipment.rings.ring.topaz=anello di topazio
items.equipment.rings.ring.onyx=anello d'onice
items.equipment.rings.ring.tourmaline=anello di tormalina
items.equipment.rings.ring.emerald=anello di smeraldo
items.equipment.rings.ring.sapphire=anello di zaffiro
items.equipment.rings.ring.quartz=anello di quarzo
items.equipment.rings.ring.agate=anello d'agata
items.equipment.rings.ring.equip_cursed=L'anello si stringe dolorosamente attorno al tuo dito!
items.equipment.rings.ring.unknown_desc=Questa fede di metallo è adornata con una grande gemma che brilla nel buio. Chissà che effetto avrà una volta indossato?
items.equipment.rings.ring.known=Questo è un %s
items.equipment.rings.ring.identify=Ormai hai abbastanza familiarità con il tuo anello da indentificarlo.
items.equipment.rings.ring.cursed_worn=Poiché l'anello è maledetto, non ti è possibile rimuoverlo.
items.equipment.rings.ring.curse_known=Puoi percepire una magia maligna nascondersi all'interno di questo anello.
items.equipment.rings.ring.not_cursed=Questo anello è libero da magia ostile.

items.equipment.rings.ringofaccuracy.name=anello della precisione
items.equipment.rings.ringofaccuracy.stats=Quando indossato, questo anello aumenterà la tua precisione del _%s%%._
items.equipment.rings.ringofaccuracy.typical_stats=Quando indossato, questo anello aumenterà la tua precisione tipicamente del _%s%%._
items.equipment.rings.ringofaccuracy.combined_stats=Gli anelli equipaggiati stanno combinando il loro potere, aumentando la tua precisione di _%s%%_ in totale.
items.equipment.rings.ringofaccuracy.upgrade_stat_name_1=Aumento dell'accuratezza
items.equipment.rings.ringofaccuracy.desc=Questo anello aumenta la tua concentrazione, rendendo più facile ai tuoi attacchi trovare il loro bersaglio. Un anello maledetto invece renderà più difficile ai tuoi attacchi andare a segno.

items.equipment.rings.ringofarcana.name=anello dell'arcano
items.equipment.rings.ringofarcana.stats=Quando indossato, questo anello aumenterà la potenza degli incantamenti e dei glifi del _%s%%._
items.equipment.rings.ringofarcana.typical_stats=Quando indossato, questo anello aumenterà la potenza degli incantamenti e dei glifi tipicamente del _%s%%._
items.equipment.rings.ringofarcana.combined_stats=I tuoi anelli equipaggiati stanno combinando il loro potere, aumentando il potere degli incantesimi e dei glifi di _%s%%_ in totale.
items.equipment.rings.ringofarcana.upgrade_stat_name_1=Potenziamento arcano
items.equipment.rings.ringofarcana.desc=Questo anello potenzia gli incantesimi magici sulle armi e i glifi sulle armature, incluse le maledizioni! Prima aumenta la possibilità di attivazione, quindi aumenta la forza dell'effetto una volta che la possibilità di attivazione è del 100%. Un anello maledetto invece indebolirà incantesimi, glifi e maledizioni.

items.equipment.rings.ringofelements.name=anello degli elementi
items.equipment.rings.ringofelements.stats=Quando indossato, questo anello ti fornirà _%s%%_ resistenza elementale.
items.equipment.rings.ringofelements.typical_stats=Quando indossato, questo anello ti fornirà tipicamente _%s%%_ resistenza elementale.
items.equipment.rings.ringofelements.combined_stats=I tuoi anelli equipaggiati stanno combinando il loro potere, fornendo _%s%%_ resistenza elementale in totale.
items.equipment.rings.ringofelements.upgrade_stat_name_1=Resistenza
items.equipment.rings.ringofelements.desc=Questo anello fornisce resistenza alla maggior parte degli effetti magici ed elementali, riducendone i danni e la durata. Naturalmente un anello maledetto peggiorerà invece tali effetti.

items.equipment.rings.ringofenergy.name=anello dell'energia
items.equipment.rings.ringofenergy.stats=Quando indossato, questo anello aumenterà la velocità di ricarica delle bacchette, degli artefatti e delle armature eroiche del _%s%%._
items.equipment.rings.ringofenergy.typical_stats=Quando indossato, di solito questo anello aumenterà la velocità di ricarica delle bacchette, degli artefatti e delle armature eroiche del _%s%%._
items.equipment.rings.ringofenergy.combined_stats=Gli anelli equipaggiati stanno combinando il loro potere, aumentando la velocità di carica di _%s%%_ in totale.
items.equipment.rings.ringofenergy.upgrade_stat_name_1=Potenziamento della carica
items.equipment.rings.ringofenergy.desc=Il tuo equipaggiamento magico si ricaricherà più velocemente dalla forza arcana sprigionata da questo anello. Un anello maledetto invece rallenterà la ricarica.

items.equipment.rings.ringofevasion.name=anello di evasione
items.equipment.rings.ringofevasion.stats=Quando indossato, questo anello aumenterà la tua evasione del _%s%%._
items.equipment.rings.ringofevasion.typical_stats=Quando indossato, questo anello aumenterà la tua evasione tipicamente del _%s%%._
items.equipment.rings.ringofevasion.combined_stats=I tuoi anelli equipaggiati stanno combinando il loro potere, aumentando la tua evasione di _%s%%_ in totale.
items.equipment.rings.ringofevasion.upgrade_stat_name_1=Aumento dell'evasione
items.equipment.rings.ringofevasion.desc=Questo anello accelera i riflessi del portatore, rendendolo più difficile da colpire. Un anello maledetto invece renderà l'utilizzatore più facile da attaccare.

items.equipment.rings.ringofforce.name=anello della forza
items.equipment.rings.ringofforce.stats=Quando sei disarmato, alla tua forza attuale, questo anello infliggerà _%1$d-%2$d punti danno._ Con un'arma equipaggiata, questo anello aumenterà i danni di _%3$d punti._
items.equipment.rings.ringofforce.typical_stats=Quando sei disarmato, alla tua forza attuale, di solito questo anello infliggerà _%1$d-%2$d punti danno._ Con un'arma equipaggiata, questo anello aumenterà i danni tipicamente di _%3$d punti._
items.equipment.rings.ringofforce.combined_stats=I tuoi anelli equipaggiati stanno combinando il loro potere, infliggendo un totale di _%1$d-%2$d danni_ senza un'arma, o aumentando i danni di _%3$d_ con una.
items.equipment.rings.ringofforce.upgrade_stat_name_1=Danno senza armi
items.equipment.rings.ringofforce.upgrade_stat_name_2=Aumento del danno armato
items.equipment.rings.ringofforce.upgrade_stat_name_3=Danni dell'abilità
items.equipment.rings.ringofforce.ability_name=posizione dell'attaccabrighe
items.equipment.rings.ringofforce.typical_ability_desc=La Duellante può adottare una posizione da _attaccabrighe_ con questo anello, facendo sì che i suoi attacchi regolari utilizzino sempre questo anello anche con un'arma equipaggiata. Questi attacchi in genere infliggono _%1$d-%2$d danni_ ed erediteranno anche l'incantesimo e il potenziamento dell'arma. Questa posizione rallenta la velocità di ricarica dell'arma di 50%%.
items.equipment.rings.ringofforce.ability_desc=La Duellante può adottare una posizione da _attaccabrighe_ con questo anello, facendo sì che i suoi attacchi regolari utilizzino sempre questo anello anche con un'arma equipaggiata. Questi attacchi infliggeranno _%1$d-%2$d danni_ ed erediteranno anche l'incantesimo e il potenziamento dell'arma. Questa posizione rallenta la velocità di ricarica dell'arma di 50%%.
items.equipment.rings.ringofforce.desc=Questo anello incrementa la forza dei colpi del portatore nel corpo a corpo. Questo potere extra è piuttosto debole quando si brandiscono armi, ma renderà un attacco disarmato molto più forte. Un anello maledetto invece indebolirà i colpi del portatore.
items.equipment.rings.ringofforce$brawlersstance.name=posizione dell'attaccabrighe
items.equipment.rings.ringofforce$brawlersstance.desc=Mentre è in questa posizione, gli attacchi regolari della Duellante utilizzeranno un anello di forza equipaggiato anche quando ha un'arma equipaggiata. Questi attacchi ottengono danni bonus e utilizzeranno comunque l'aumento e l'incantesimo dell'arma.\n\nMantenere questa posizione richiede tuttavia concentrazione, riducendo la velocità di ricarica dell'abilità dell'arma del 50%.\n\nQuesta posizione può essere attivata o disattivata utilizzando un anello della forza, ma la riduzione della velocità di carica persisterà per un po' se la posizione viene attivata e disattivata rapidamente.

items.equipment.rings.ringoffuror.name=anello del furore
items.equipment.rings.ringoffuror.stats=Quando indossato, questo anello aumenterà la velocità dei tuoi attacchi del _%s%%._
items.equipment.rings.ringoffuror.typical_stats=Quando indossato, questo anello aumenterà la velocità dei tuoi attacchi tipicamente del _%s%%._
items.equipment.rings.ringoffuror.combined_stats=Gli anelli equipaggiati stanno combinando il loro potere, aumentando la velocità dei tuoi attacchi di _%s%%_ in totale.
items.equipment.rings.ringoffuror.upgrade_stat_name_1=Aumento della velocità di attacco
items.equipment.rings.ringoffuror.desc=Questo anello dona al portatore una furia interiore, permettendogli di attaccare più rapidamente. Un anello maledetto invece rallenterà la velocità di attacco del portatore.

items.equipment.rings.ringofhaste.name=anello della fretta
items.equipment.rings.ringofhaste.stats=Quando indossato, questo anello aumenterà la velocità dei tuoi movimenti del _%s%%._
items.equipment.rings.ringofhaste.typical_stats=Quando indossato, questo anello aumenterà la velocità dei tuoi movimenti tipicamente del _%s%%._
items.equipment.rings.ringofhaste.combined_stats=Gli anelli equipaggiati stanno combinando il loro potere, aumentando la tua velocità di movimento di _%s%%_ in totale.
items.equipment.rings.ringofhaste.upgrade_stat_name_1=Aumenta la velocità di movimento
items.equipment.rings.ringofhaste.desc=Quest'anello riduce lo sforzo di movimento del portatore, permettendogli di correre a velocità sovraumane. Un anello maledetto al contrario appesantirà chi lo indossa.

items.equipment.rings.ringofmight.name=anello della potenza
items.equipment.rings.ringofmight.stats=Quando indossato, questo anello aumenterà la tua forza di _%1$d_ e la tua salute massima del _%2$s%%._
items.equipment.rings.ringofmight.typical_stats=Quando indossato, questo anello aumenterà la tua forza di _%1$d_ e la tua salute massima del _%2$s%%._
items.equipment.rings.ringofmight.combined_stats=I tuoi anelli equipaggiati stanno combinando il loro potere, aumentando la tua forza di _%1$d_ e i tuoi HP massimi di _%2$s%%_ in totale.
items.equipment.rings.ringofmight.upgrade_stat_name_1=Aumento di Forza
items.equipment.rings.ringofmight.upgrade_stat_name_2=Aumento PS massimi
items.equipment.rings.ringofmight.desc=Questo anello incrementa le caratteristiche fisiche del portatore, garantendogli maggiore forza fisica e costituzione. Un anello maledetto invece indebolirà chi lo indossa.

items.equipment.rings.ringofsharpshooting.name=anello del tiratore scelto
items.equipment.rings.ringofsharpshooting.stats=Quando indossato, questo anello aumenterà il danno delle tue armi da lancio come se il loro livello fosse incrementato di _%1$d_, e aumenterà la loro durabilità di _%2$s%%._
items.equipment.rings.ringofsharpshooting.typical_stats=Quando indossato, generalmente questo anello aumenterà il danno delle tue armi da lancio come se il loro livello fosse incrementato di _%1$d_, e aumenterà la loro durabilità di _%2$s%%._
items.equipment.rings.ringofsharpshooting.combined_stats=I tuoi anelli equipaggiati stanno combinando il loro potere, aumentando il livello effettivo dell'arma da lancio di _%1$d_ e aumentando la loro durabilità di _%2$s%%_ in totale.
items.equipment.rings.ringofsharpshooting.upgrade_stat_name_1=Aumento del danno di livello
items.equipment.rings.ringofsharpshooting.upgrade_stat_name_2=Aumento della durabilità
items.equipment.rings.ringofsharpshooting.desc=Questo anello incrementa la mira e la precisione del portatore, rendendo tutte le armi da lancio più dannose e durature. Un anello maledetto avrà l'effetto opposto.

items.equipment.rings.ringoftenacity.name=anello della tenacia
items.equipment.rings.ringoftenacity.stats=Quando indossato, questo anello ridurrà i danni subiti fino al _%s%%._
items.equipment.rings.ringoftenacity.typical_stats=Quando indossato, questo anello ridurrà i danni subiti tipicamente fino al _%s%%._
items.equipment.rings.ringoftenacity.combined_stats=Gli anelli equipaggiati stanno combinando il loro potere, riducendo i danni subiti fino a _%s%%_ in totale.
items.equipment.rings.ringoftenacity.upgrade_stat_name_1=Resistenza massima al danno
items.equipment.rings.ringoftenacity.desc=Quando indossato, questo anello permetterà al portatore di resistere a colpi solitamente mortali. Più l'utilizzatore è ferito, più sarà resistente ai danni. Un anello maledetto invece renderà più facile ai nemici uccidere chi lo indossa.

items.equipment.rings.ringofwealth.name=anello dell'opulenza
items.equipment.rings.ringofwealth.stats=Quando indossato, questo anello aumenterà la tua fortuna del _%s%%._
items.equipment.rings.ringofwealth.typical_stats=Quando indossato, questo anello aumenterà la tua fortuna tipicamente del _%s%%._
items.equipment.rings.ringofwealth.combined_stats=I tuoi anelli equipaggiati stanno combinando il loro potere, aumentando la tua fortuna di _%s%%_ in totale.
items.equipment.rings.ringofwealth.upgrade_stat_name_1=Aumento della fortuna
items.equipment.rings.ringofwealth.desc=Questo anello funziona come una calamita per tesori, aumentando le possibilità che i nemici e i forzieri contengano oggetti preziosi. Un anello maledetto ridurrà le tue probabilità di ottenere del bottino.



###scrolls
items.consum.scrolls.scroll.ac_read=LEGGI
items.consum.scrolls.scroll.kaunan=Pergamena "KAUNAN"
items.consum.scrolls.scroll.sowilo=Pergamena "SOWILO"
items.consum.scrolls.scroll.laguz=Pergamena "LAGUZ"
