items.equipment.weapon.melee.roundshield.name=scudo tondo
items.equipment.weapon.melee.roundshield.typical_stats_desc=Di solito quest'arma blocca 0-%d punti danno. Tale blocco aumenta con i miglioramenti.
items.equipment.weapon.melee.roundshield.stats_desc=Quest'arma blocca 0-%d punti danno. Tale blocco aumenta con i miglioramenti.
items.equipment.weapon.melee.roundshield.ability_name=protezione
items.equipment.weapon.melee.roundshield.typical_ability_desc=La Duellante può _proteggersi_ con uno scudo rotondo, annullando completamente tutti gli attacchi fisici o magici effettuati contro di lei, generalmente per _%d turni_. Una volta che la Duellante ha bloccato un attacco, contrattaccare o usare la magia interromperà la protezione.
items.equipment.weapon.melee.roundshield.ability_desc=La Duellante può _proteggersi_ con uno scudo rotondo, annullando completamente tutti gli attacchi fisici o magici effettuati contro di lei per _%d turni_. Una volta che la Duellante ha bloccato un attacco, contrattaccare o usare la magia interromperà la protezione.
items.equipment.weapon.melee.roundshield.upgrade_ability_stat_name=Durata dell'abilità
items.equipment.weapon.melee.roundshield.desc=Questo largo scudo blocca in modo efficace gli attacchi e si rivela un'arma decente in caso di necessità.
items.equipment.weapon.melee.roundshield$guardtracker.name=proteggendo
items.equipment.weapon.melee.roundshield$guardtracker.guarded=in protezione
items.equipment.weapon.melee.roundshield$guardtracker.desc=La Duellante ha preparato il suo scudo in previsione degli attacchi in arrivo. Gli attacchi fisici o magici effettuati contro di lei verranno completamente annullati.\n\nTurni rimanenti: %s.

items.equipment.weapon.melee.runicblade.name=lama runica
