items.equipment.weapon.melee.sword$cleavetracker.name=fendente
items.equipment.weapon.melee.sword$cleavetracker.desc=La Duellante è pronta a dare seguito al suo precedente fendente. Il prossimo utilizzo di fendente non costerà nessuna carica per l'abilità dell'arma.\n\nTurni rimasti: %s.

items.equipment.weapon.melee.warhammer.name=martello da guerra
items.equipment.weapon.melee.warhammer.stats_desc=Questa è un'arma piuttosto accurata.
items.equipment.weapon.melee.warhammer.ability_name=colpo pesante
items.equipment.weapon.melee.warhammer.typical_ability_desc=La Duellante può sferrare un _colpo pesante_ con un martello da guerra. Questo attacco concentrato in genere infligge _%1$d-%2$d danni_ se sorprende il nemico e lo stordisce per 5 turni, riducendo la precisione e l'evasione di 50%%. Il colpo pesante colpisce sempre ma infligge danni regolari se non sorprende il nemico.
items.equipment.weapon.melee.warhammer.ability_desc=La Duellante può sferrare un _colpo pesante_ con un martello da guerra. Questo attacco concentrato infligge _%1$d-%2$d danni_ se sorprende il nemico e lo stordisce per 5 turni, riducendo la precisione e l'evasione di 50%%. Il colpo pesante colpisce sempre ma infligge danni regolari se non sorprende il nemico.
items.equipment.weapon.melee.warhammer.desc=Poche creature possono resistere al devastante colpo di questa imponente massa di piombo e acciaio, ma richiede grande forza per poterlo usare efficacemente.

items.equipment.weapon.melee.warscythe.name=falce da guerra
items.equipment.weapon.melee.warscythe.stats_desc=Questa è un'arma piuttosto imprecisa.
items.equipment.weapon.melee.warscythe.ability_name=raccolta
items.equipment.weapon.melee.warscythe.typical_ability_desc=La Duellante può _mietere_ un nemico con una falce da guerra. Questo attacco devastante è sicuro di colpire e in genere infligge _%d danni_. Questo danno viene applicato come sanguinamento se il bersaglio non è immune.
items.equipment.weapon.melee.warscythe.ability_desc=La Duellante può _falciare_ un nemico con una falce da guerra. Questo attacco devastante è sicuro di colpire e infliggere _%d danni_. Questo danno viene applicato come sanguinamento se il bersaglio non è immune.
items.equipment.weapon.melee.warscythe.desc=Questo strumento grande e ingombrante è stato rinforzato per renderlo più efficace nel tagliare i nemici rispetto ai raccolti.

items.equipment.weapon.melee.whip.name=frusta
items.equipment.weapon.melee.whip.stats_desc=Quest'arma ha una portata straordinaria.
items.equipment.weapon.melee.whip.ability_name=frustata
items.equipment.weapon.melee.whip.typical_ability_desc=La Duellante può _sferzare_ tutti i nemici attorno a sé con una frusta. Questa abilità in genere infligge _%1$d-%2$d danni_, attacca tutti i nemici nel raggio di attacco ed è garantito che colpisca.
items.equipment.weapon.melee.whip.ability_desc=La Duellante può _sferzare_ tutti i nemici attorno a sé con una frusta. Questa abilità infligge _%1$d-%2$d danni_, attacca tutti i nemici nel raggio di attacco ed è garantito che colpisca.
items.equipment.weapon.melee.whip.desc=Sebbene la corda spinata posta alla fine di quest'arma infligga poco danno, la sua portata è impareggiabile.

items.equipment.weapon.melee.wornshortsword.name=spada corta logora
items.equipment.weapon.melee.wornshortsword.ability_name=fendente
items.equipment.weapon.melee.wornshortsword.typical_ability_desc=La Duellante può _fendere_ un nemico con una spada corta usurata. Questo in genere infligge _%1$d-%2$d danni_ ed è garantito che colpisca. Se l'attacco uccide un nemico, l'effetto è istantaneo e la Duellante può usarlo nuovamente entro 5 turni gratuitamente.
items.equipment.weapon.melee.wornshortsword.ability_desc=La Duellante può _fendere_ un nemico con una spada corta consumata. Questo infligge _%1$d-%2$d danno_ ed è garantito di colpire. Se il fendente uccide un nemico è istantaneo e la Duellante può usare nuovamente fendente entro 5 turni gratuitamente.
items.equipment.weapon.melee.wornshortsword.desc=Una spada piuttosto corta, logorata dall'uso pesante. È sia più debole che più leggera di una spada corta regolare.
items.equipment.weapon.melee.wornshortsword.discover_hint=Uno degli eroi inizia con questo oggetto.


###missile weapons
items.equipment.weapon.missiles.darts.adrenalinedart.name=dardo dell'adrenalina
items.equipment.weapon.missiles.darts.adrenalinedart.desc=Questi dardi sono intinti con un composto a base di sboccialesto, che incrementerà la velocità di movimento e attacco degli alleati, o ridurrà la velocità di movimento dei nemici. Il dardo in sé è comunque dannoso per i nemici, ma non ferirà gli alleati.

items.equipment.weapon.missiles.darts.blindingdart.name=dardo accecante
items.equipment.weapon.missiles.darts.blindingdart.desc=Questi dardi sono intinti con un composto di erbacieca che renderà cieco il bersaglio per un breve periodo. Tuttavia non provocano disorientamento, perciò un nemico saprà comunque dove vi avrà visto l'ultima volta.

items.equipment.weapon.missiles.darts.chillingdart.name=dardo ghiacciante
items.equipment.weapon.missiles.darts.chillingdart.desc=Questi dardi sono intinti con un composto di calotta glaciale che gelerà sensibilmente il loro bersaglio.

items.equipment.weapon.missiles.darts.cleansingdart.name=Dardo purificante
items.equipment.weapon.missiles.darts.cleansingdart.desc=Questi dardi sono dotati di un composto a base di Magoregale che renderà temporaneamente gli alleati immuni a tutti gli effetti negativi o ripulirà gli effetti positivi dai nemici. I nemici possono anche dimenticare brevemente che stanno attaccando o fuggendo da te. Il dardo stesso è ancora dannoso per i nemici, ma non danneggerà gli alleati.

items.equipment.weapon.missiles.darts.dart.name=dardo
items.equipment.weapon.missiles.darts.dart.ac_tip=INTINGI
items.equipment.weapon.missiles.darts.dart.prompt=Seleziona un seme
items.equipment.weapon.missiles.darts.dart.tip_title=Dardi Intinti
items.equipment.weapon.missiles.darts.dart.tip_desc=Un seme può essere combinato con uno o due dardi per intingerne le punte. Ogni tipo di seme produce un suo genere di dardo intinto, con uno specifico effetto che dura per un solo uso.\n\nIntingere un dardo con questi semi produrrà un _%s._
items.equipment.weapon.missiles.darts.dart.tip_all=intingi %1$d dardi con %2$d semi
items.equipment.weapon.missiles.darts.dart.tip_two=intingi 2 dardi con 1 seme
items.equipment.weapon.missiles.darts.dart.tip_one=intingi 1 dardo con 1 seme
items.equipment.weapon.missiles.darts.dart.tip_cancel=annulla
items.equipment.weapon.missiles.darts.dart.desc=Queste semplici aste di legno puntute sono bilanciate per volare dritte e trafiggere le loro prede con un semplice movimento del polso. Possono inoltre venire intinti con i semi per acquisire un effetto bonus quando lanciati.
items.equipment.weapon.missiles.darts.dart.unlimited_uses=Data la loro struttura molto semplice, i dardi avranno una durata praticamente eterna.

items.equipment.weapon.missiles.darts.displacingdart.name=dardo dislocante
items.equipment.weapon.missiles.darts.displacingdart.desc=Questi dardi sono intinti con un composto di fiocafoglia che teletrasporterà il loro bersaglio poco lontano.

items.equipment.weapon.missiles.darts.healingdart.name=dardo della guarigione
items.equipment.weapon.missiles.darts.healingdart.desc=Questi dardi sono intinti con un composto di erbasole che donerà una scarica di guarigione al loro bersaglio. Il dardo è comunque dannoso per i nemici ma non ferirà gli alleati.

items.equipment.weapon.missiles.darts.holydart.name=dardo sacro
items.equipment.weapon.missiles.darts.holydart.desc=Questi dardi sono intinti in un composto di fiorestella che infonderà energia santa nel loro bersaglio. Alleati e nemici normali diventeranno benedetti, ma nemici non-morti o demoniaci riceveranno ingenti danni. Il dardo in se è comunque dannoso per i nemici, ma non ferirà gli alleati.

items.equipment.weapon.missiles.darts.incendiarydart.name=dardo incendiario
items.equipment.weapon.missiles.darts.incendiarydart.desc=Questi dardi sono intinti con un composto di fuocofiore che esploderà in fiamme vivide all'impatto.

items.equipment.weapon.missiles.darts.paralyticdart.name=dardo paralizzante
items.equipment.weapon.missiles.darts.paralyticdart.desc=Questi dardi sono intinti con un composto di radicaterra che paralizzerà il bersaglio per un breve periodo.

items.equipment.weapon.missiles.darts.poisondart.name=dardo avvelenato
items.equipment.weapon.missiles.darts.poisondart.desc=Questi dardi sono intinti con un composto di tristemuschio che avvelenerà il loro bersaglio.

items.equipment.weapon.missiles.darts.rotdart.name=dardo putrido
items.equipment.weapon.missiles.darts.rotdart.desc=Questi perfidi dardi sono intinti con un composto acido di baccamarcia, che divorerà aggressivamente qualunque cosa venga in contatto con esso. Gli avversari più potenti resisteranno alla maggior parte dell'effetto, ma la corrosione è abbastanza forte da uccidere facilmente i nemici ordinari. Questi dardi durano di più di altri dardi intinti, ma la loro durabilità non può essere aumentata.
items.equipment.weapon.missiles.darts.rotdart.discover_hint=Puoi creare questo oggetto utilizzando un seme da una missione specifica.

items.equipment.weapon.missiles.darts.shockingdart.name=dardo fulminante
items.equipment.weapon.missiles.darts.shockingdart.desc=Questi dardi sono intinti con un composto di tempestavite che darà una brutta scossa al loro bersaglio.

items.equipment.weapon.missiles.darts.tippeddart.ac_clean=RIPULISCI
items.equipment.weapon.missiles.darts.tippeddart.clean_title=Dardi Semplici
items.equipment.weapon.missiles.darts.tippeddart.clean_desc=Questa azione rimuoverà il seme intinto sui tuoi dardi, rendendoli di nuovo dei semplici dardi.
items.equipment.weapon.missiles.darts.tippeddart.clean_all=ripulisci tutto
items.equipment.weapon.missiles.darts.tippeddart.clean_one=ripuliscine uno
items.equipment.weapon.missiles.darts.tippeddart.cancel=annulla
items.equipment.weapon.missiles.darts.tippeddart.uses_left=Questa pila di dardi ha _%d/%d_ usi restanti prima che una punta si consumi.
items.equipment.weapon.missiles.darts.tippeddart.unlimited_uses=_Ma questi sono di qualità così buona che dureranno praticamente in eterno._
items.equipment.weapon.missiles.darts.tippeddart.about_to_break=La punta del tuo dardo sta per esaurirsi.
items.equipment.weapon.missiles.darts.tippeddart.has_broken=La punta del tuo dardo è esaurita.
items.equipment.weapon.missiles.darts.tippeddart.discover_hint=Puoi comprare questo oggetto in un negozio, o crearlo con un seme.


items.equipment.weapon.missiles.bolas.name=bolas
items.equipment.weapon.missiles.bolas.stats_desc=Quest'arma rende il nemico zoppicante.
items.equipment.weapon.missiles.bolas.desc=Queste insolite armi da lancio non infliggono molti danni, ma sono eccellenti nel rallentare i loro bersagli.

items.equipment.weapon.missiles.boomerang.name=boomerang
items.equipment.weapon.missiles.boomerang.desc=Una volta lanciato verso il nemico questo missile di legno ricurvo ritornerà nelle mani del lanciatore.
items.equipment.weapon.missiles.boomerang.durability=Data la sua robusta struttura, questo boomerang non si romperà con l'uso.

items.equipment.weapon.missiles.fishingspear.name=fiocina da pesca
items.equipment.weapon.missiles.fishingspear.desc=Piccoli giavellotti adatti come armi improvvisate nonostante siano stati creati per la pesca.

items.equipment.weapon.missiles.forcecube.name=cubo di forza
items.equipment.weapon.missiles.forcecube.ondeath=Ti sei ucciso con il tuo stesso Cubo di Forza...
items.equipment.weapon.missiles.forcecube.stats_desc=Quest'arma diffonde la forza del suo impatto in una piccola area, colpendo ogni cosa all'interno di essa.
items.equipment.weapon.missiles.forcecube.desc=Questi strani cubi magici sono abbastanza piccoli da poter essere tenuti in mano, ma straordinariamente pesanti.

items.equipment.weapon.missiles.heavyboomerang.name=boomerang pesante
items.equipment.weapon.missiles.heavyboomerang.stats_desc=Dopo cinque turni, quest'arma fa ritorno alla posizione da cui era stata lanciata.
items.equipment.weapon.missiles.heavyboomerang.desc=Questo grande boomerang è un po' difficile da maneggiare, ma infligge danni considerevoli.

items.equipment.weapon.missiles.javelin.name=giavellotto
items.equipment.weapon.missiles.javelin.desc=Questi grossi arpioni da lancio sono bilanciati per mantenere in avanti la punta mentre volano nell'aria.

items.equipment.weapon.missiles.kunai.name=kunai
items.equipment.weapon.missiles.kunai.stats_desc=Quest'arma è più forte contro nemici ignari.
items.equipment.weapon.missiles.kunai.desc=Questi piccoli coltelli sono molto potenti nelle mani di un utilizzatore esperto.

items.equipment.weapon.missiles.missileweapon.stats_known=Queste armi da lancio di _categoria %1$d_ infliggono _%2$d-%3$d danni_ e richiedono _%4$d punti forza_ per essere utilizzate correttamente.
items.equipment.weapon.missiles.missileweapon.stats_unknown=Di solito queste armi da lancio di _categoria %1$d_ infliggono _%2$d-%3$d danni_ e richiedono _%4$d punti forza_ per essere utilizzate correttamente.
items.equipment.weapon.missiles.missileweapon.stats_desc=
items.equipment.weapon.missiles.missileweapon.probably_too_heavy=Probabilmente quest'arma è troppo pesante per te.
items.equipment.weapon.missiles.missileweapon.distance=Le armi da lancio sono più accurate a distanza, ma meno accurate da vicino.
items.equipment.weapon.missiles.missileweapon.durability=Le armi da lancio si consumeranno e si romperanno con l'uso.
items.equipment.weapon.missiles.missileweapon.uses_left=Queste armi da lancio hanno _%d/%d_ usi restanti prima che una di esse si rompa.
items.equipment.weapon.missiles.missileweapon.unlimited_uses=Questo set è di una qualità talmente alta che durerà praticamente per sempre.
items.equipment.weapon.missiles.missileweapon.unknown_uses=Di solito queste armi da lancio hanno _%d_ usi restanti prima che una di esse si rompa.
items.equipment.weapon.missiles.missileweapon.curse_discover=Quest'arma da lancio è maledetta!
items.equipment.weapon.missiles.missileweapon.about_to_break=La tua arma da lancio sta per rompersi.
items.equipment.weapon.missiles.missileweapon.has_broken=Una delle tue armi da lancio si è rotta.
items.equipment.weapon.missiles.missileweapon.dust=L'arma da lancio si polverizza al tuo tocco.
items.equipment.weapon.missiles.missileweapon.break_upgraded_warn_desc=Se l'ultima arma da lancio del tuo set migliorato si rompe, questo verrà perso per sempre. Vuoi davvero lanciarla?
items.equipment.weapon.missiles.missileweapon.break_upgraded_warn_yes=Si
items.equipment.weapon.missiles.missileweapon.break_upgraded_warn_no=No
items.equipment.weapon.missiles.missileweapon$placeholder.name=arma da lancio

items.equipment.weapon.missiles.shuriken.name=shuriken
items.equipment.weapon.missiles.shuriken.stats_desc=Gli Shuriken possono essere lanciati immediatamente, con un tempo di recupero di 20 turni.
items.equipment.weapon.missiles.shuriken.desc=Queste stelle di metallo dalle lame affilate possono essere lanciate velocemente mentre ti stai muovendo.
items.equipment.weapon.missiles.shuriken$shurikeninstanttracker.name=Tempo di recupero per lo Shuriken
items.equipment.weapon.missiles.shuriken$shurikeninstanttracker.desc=Hai lanciato istantaneamente uno shuriken da poco, e devi aspettare prima di poterlo fare di nuovo. Puoi continuare a lanciarli, ma a velocità normale.\n\nTurni rimanenti: %s.

items.equipment.weapon.missiles.throwingclub.name=mazza da lancio
items.equipment.weapon.missiles.throwingclub.stats_desc=Quest'arma non rimane attaccata ai nemici e può essere raccolta immediatamente.
items.equipment.weapon.missiles.throwingclub.desc=Un'arma da lancio piuttosto semplice ma duratura, praticamente è una grossa pietra legata a un bastone.

items.equipment.weapon.missiles.throwinghammer.name=martello da lancio
items.equipment.weapon.missiles.throwinghammer.stats_desc=Quest'arma non rimane attaccata ai nemici e può essere raccolta immediatamente.
items.equipment.weapon.missiles.throwinghammer.desc=Questi pesanti martelli sono progettati per essere lanciati contro un nemico. La loro realizzazione interamente metallica li rende piuttosto durevoli.

items.equipment.weapon.missiles.throwingknife.name=coltello da lancio
items.equipment.weapon.missiles.throwingknife.stats_desc=Quest'arma è più forte contro nemici ignari.
items.equipment.weapon.missiles.throwingknife.desc=Questi leggeri coltelli sono bilanciati per fendere l'aria dritti nei loro bersagli.
items.equipment.weapon.missiles.throwingknife.discover_hint=Uno degli eroi inizia con questo oggetto.

items.equipment.weapon.missiles.throwingspear.name=lancia eiettabile
items.equipment.weapon.missiles.throwingspear.desc=Queste leggere lance hanno una struttura snella che è stata progettata per essere lanciata, non brandita.

items.equipment.weapon.missiles.throwingspike.name=punte da lancio
items.equipment.weapon.missiles.throwingspike.desc=Queste resistenti lance di metallo sono pensate per essere lanciate contro nemici lontani.
items.equipment.weapon.missiles.throwingspike.discover_hint=Uno degli eroi inizia con questo oggetto.

items.equipment.weapon.missiles.throwingstone.name=pietra da lancio
items.equipment.weapon.missiles.throwingstone.desc=Queste pietre sono state levigate per poterle lanciare con più potenza del normale.
items.equipment.weapon.missiles.throwingstone.discover_hint=Uno degli eroi inizia con questo oggetto.

items.equipment.weapon.missiles.tomahawk.name=tomahawk
items.equipment.weapon.missiles.tomahawk.stats_desc=Quest'arma infligge un _sanguinamento di %1$d-%2$d_ al suo bersaglio.
items.equipment.weapon.missiles.tomahawk.typical_stats_desc=Di solito, quest'arma infligge un _sanguinamento di %1$d-%2$d_ al suo bersaglio.
items.equipment.weapon.missiles.tomahawk.desc=Queste asce da lancio hanno un filo seghettato che lacera quando si conficca in un nemico.

items.equipment.weapon.missiles.trident.name=tridente
items.equipment.weapon.missiles.trident.desc=Enormi lance che terminano con tre letali rebbi. Sono molto potenti, ma piuttosto pesanti.


items.equipment.weapon.spiritbow.name=arco spirituale
items.equipment.weapon.spiritbow.ac_shoot=SCOCCA
items.equipment.weapon.spiritbow.prompt=Scegli un bersaglio
items.equipment.weapon.spiritbow.stats=L'arco non può venire migliorato direttamente, diverrà invece regolarmente più potente al salire del tuo livello. Al livello attuale, le frecce scoccate dall'arco infliggeranno _%1$d-%2$d punti danno_ e richiederanno _%3$d punti forza_ per essere usate correttamente.
items.equipment.weapon.spiritbow.desc=Un arco creato da un antico legno magico. La sua corda e le sue incisioni brillano di una fievole luce blu. Quando la corda viene tirata questo arco evocherà una freccia magica che può essere lanciata su di un nemico.
items.equipment.weapon.spiritbow.discover_hint=Uno degli eroi inizia con questo oggetto.

items.equipment.weapon.weapon.identify=Ora hai abbastanza familiarità con la tua arma da poterla identificare.
items.equipment.weapon.weapon.too_heavy=Per via della tua forza inadeguata quest'arma ostacolerà la tua velocità di attacco, precisione e capacità di effettuare attacchi a sorpresa.
items.equipment.weapon.weapon.excess_str=Per via della tua forza superiore, infliggerai _0-%d danni bonus_ con quest'arma.
items.equipment.weapon.weapon.hardening_gone=L'indurimento di quest'arma è svanito!
items.equipment.weapon.weapon.incompatible=L'interazione di differenti tipi di magia ha annullato l'incantamento su quest'arma!
items.equipment.weapon.weapon.cursed_worn=Poiché quest'arma è maledetta, sei incapace di rimuoverla.
items.equipment.weapon.weapon.cursed=Puoi percepire una magia ostile nascondersi in quest'arma.
items.equipment.weapon.weapon.weak_cursed=Nonostante la maledizione, puoi mollare quest'arma.
items.equipment.weapon.weapon.not_cursed=Quest'arma è libera da magia ostile.
items.equipment.weapon.weapon.faster=È incrementata per migliorare _la velocità._
items.equipment.weapon.weapon.stronger=È incrementata per migliorare _il danno._
items.equipment.weapon.weapon.enchanted=possiede _%s._
items.equipment.weapon.weapon.enchant_hardened=È stato _indurito._
items.equipment.weapon.weapon.hardened_no_enchant=Quest'arma è stata _indurita_, ma al momento non è incantata.
items.equipment.weapon.weapon$enchantment.enchant=incantamento
items.equipment.weapon.weapon$enchantment.rankings_desc=Ucciso da un incantamento
items.equipment.weapon.weapon$enchantment.discover_hint=Puoi trovare un oggetto con questo effetto casualmente nel dungeon, oppure provare ad applicarlo ad un oggetto tu stesso.


###misc items
items.amulet.name=amuleto di yendor
items.amulet.ac_end=FINE DEL GIOCO
items.amulet.desc=L'amuleto di Yendor è l'artefatto più potente conosciuto da umani e nani. Le sue gemme scintillanti contengono incredibili e misteriosi poteri.
items.amulet.desc_origins=Le origini dell'amuleto sono sconosciute. La storia dice che il Re dei Nani si vantava di aver scoperto il manufatto poco prima che la civiltà dei Nani interrompesse ogni contatto. Come l'ha trovato? Come ha fatto Yog-Dzewa a prenderlo da lui? Domande per un'altra volta forse, tutto ciò che conta ora è che l'amuleto è tuo!
items.amulet.desc_ascent=Le origini dell'amuleto sono sconosciute, ma chiaramente è stato fortemente influenzato dal potere di Yog-Dzewa. Il dungeon sembra piegarsi alla volontà di Yog mentre lo attraversi, rendendo i nemici molto più abbondanti e potenti! Inoltre, non puoi più attivare o scartare l'amuleto, quasi come se fosse maledetto.
items.amulet.ascent_title=Ascensione
items.amulet.ascent_desc=Inizi a sentire il grande e terribile potere di Yog-Dzewa che si irradia dall'amuleto. Risalire attraverso il dungeon come un mortale potrebbe essere più difficile di quanto pensassi!\n\nSe continui a salire con l'amuleto, il dungeon diventerà più pericoloso, i teletrasporti tra i piani saranno disabilitati e potrai vincere la partita solo sconfiggendo nemici mentre sali per il dungeon!\n\nPuoi lasciare l'amuleto qui per ora se vuoi salire senza iniziare questa sfida, o attivare l'amuleto prima di salire per terminare normalmente il gioco.
items.amulet.ascent_yes=Continua!
items.amulet.ascent_no=Fermati per Ora
items.amulet.discover_hint=Puoi trovare questo oggetto in fondo al dungeon...

items.ankh.name=ankh
items.ankh.ac_bless=BENEDICI
items.ankh.bless=Hai benedetto l'ankh con l'acqua magica.
items.ankh.desc=Questo antico simbolo d'immortalità consente il ritorno in vita dopo la morte. La maggior parte dei tuoi oggetti rimangono nel luogo in cui è avvenuta la tua morte ma potrai recuperarli se vi fai ritorno. Se il tuo otre è pieno, puoi benedire l'ankh con una forza extra.
items.ankh.desc_blessed=Questo antico simbolo di immortalità concede la capacità di ritornare alla vita. L'ankh è stato benedetto ed è ora molto più forte. L'ankh sacrificherà se stesso per salvarvi in un momento di pericolo mortale.
items.ankh.discover_hint=Puoi comprare questo oggetto in un negozio.

items.arcaneresin.name=resina arcana
items.arcaneresin.prompt=Seleziona una bacchetta
items.arcaneresin.ac_apply=APPLICA
items.arcaneresin.level_too_high=questa bacchetta è troppo potente perché la resina possa potenziarla
items.arcaneresin.not_enough=Non hai abbastanza resina per questo!
items.arcaneresin.apply=Rivesti la tua bacchetta con la resina, aumentandone il potere!
items.arcaneresin.desc=Questa polvere fine brilla tra le sfumature del viola e del bianco. Può agire come un amplificatore delle energie magiche, aumentando il livello delle bacchette quando viene applicato su di esse!\n\nMigliorare una bacchetta costa 1, 2 o 3 resina a seconda del livello iniziale della bacchetta. La resina può potenziare le bacchette fino a un massimo di +3.\n\nTuttavia, i potenziamenti della resina vengono _annullati da altre fonti di potenziamento_ (come le pergamene di potenziamento) e non si applicano quando si infonde una bacchetta nel bastone del Mago.
items.arcaneresin.discover_hint=Puoi creare questo oggetto tramite l'alchimia.

items.brokenseal.name=sigillo rotto
items.brokenseal.ac_affix=APPLICA
items.brokenseal.prompt=Seleziona un'armatura
items.brokenseal.unknown_armor=Devi prima identificare se quell'armatura sia maledetta o meno.
items.brokenseal.cursed_armor=Il sigillo non si attaccherà ad un armatura maledetta.
items.brokenseal.affix=Applichi il sigillo alla tua armatura!
items.brokenseal.desc=Un sigillo di cera, applicato all'armatura come simbolo di valore. È presente una sbiadita runa di protezione incisa nel mezzo, ed è rotto a metà.\n\nUn ricordo della sua casa, il sigillo aiuta il guerriero a perseverare. Mentre indossa il sigillo il guerriero guadagnerà istantaneamente uno scudo quando sta per essere ridotto a meno della metà della propria vita.\n\nIl sigillo può essere _apposto all'armatura_, e trasferito tra armature. Può portare con sé un singolo miglioramento, purché il miglioramento sia stato applicato mentre il sigillo era apposto su di essa.
items.brokenseal.inscribed=Il sigillo è iscritto con un _%s._
items.brokenseal.choose_title=Scegli un Glifo
items.brokenseal.choose_desc=Sia quest'armatura che il sigillo del guerriero portano un glifo. Scegli quale glifo deve essere conservato.\n\nGlifo dell'Armatura: %1$s \n\nGlifo del Sigillo rotto: %2$s \n\nRicorda che se scegli quello che è sull'armatura, il sigillo non sarà capace di trasferirlo in seguito.
items.brokenseal.discover_hint=Uno degli eroi inizia con questo oggetto.
items.brokenseal$warriorshield.name=Scudo del Guerriero
items.brokenseal$warriorshield.desc_active=Il sigillo rotto del Guerriero lo sta aiutando a perseverare, donandogli scudo oltre alla sua salute. È presente un tempo di recupero dopo l'attivazione iniziale dello scudo prima che possa essere usato nuovamente. \n\nLo scudo non decade nel tempo, ma terminerà se non sono presenti nemici nelle vicinanze per qualche turno. Quando termina, tutto lo scudo non usato ridurrà il tempo di recupero, fino ad un massimo di 50%%. \n\nScudo rimanente: %1$d. \n\nTempo di recupero attuale: %2$d.
items.brokenseal$warriorshield.desc_cooldown=Il Guerriero ha recentemente ottenuto scudo dal suo sigillo rotto, e deve aspettare prima di poter usufruire del suo effetto di scudo nuovamente. \n\nTurni Rimanenti: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=La ricarica dello scudo del guerriero è negativa al momento, perciò quando il suo scudo si attiverà la ricarica sarà più breve dei soliti 150 turni. La ricarica può venire abbassata fino a -150 turni, e ciò renderà lo scudo disponibile immediatamente dopo essere stato attivato.\n\nRicarica: %d.

items.dewdrop.name=goccia di rugiada
items.dewdrop.already_full=La tua salute è già al massimo.
items.dewdrop.desc=Una goccia di rugiada cristallina.\n\nPer via della magia di questo posto, l'acqua pura ha minori capacità ricostituenti.

items.equipableitem.curse_detected=Percepisci che l'oggetto è maledetto appena prima che lo equipaggi!
items.equipableitem.unequip_cursed=Non puoi rimuovere un oggetto maledetto!
items.equipableitem.ac_equip=METTI
items.equipableitem.ac_unequip=TOGLI

items.energycrystal.name=cristallo di energia
items.energycrystal.desc=Una collezione di piccoli cristalli magici pieni di energia alchemica.\n\nQuesti cristalli sono gli ingredienti più comuni nelle ricette alchemiche e si possono produrre in un calderone alchemico gettandovi degli oggetti consumabili.

items.gold.name=oro
items.gold.desc=Una pila di monete d'oro. Accumula monete d'oro per spenderle in seguito in un negozio.

items.heap.for_sale=%1$dg: %2$s
items.heap.chest=Forziere
items.heap.chest_desc=Non saprai cosa contiene finché non lo aprirai!
items.heap.locked_chest=Forziere chiuso
items.heap.locked_chest_desc=Non saprai cosa contiene finché non lo aprirai! Ma per aprirlo ti serve una chiave dorata.
items.heap.crystal_chest=Forziere di cristallo
items.heap.crystal_chest_desc=Noti che contiene _%s_ ma per aprirlo ti serve una chiave di cristallo.
items.heap.artifact=un artefatto
items.heap.wand=una bacchetta
items.heap.ring=un anello
items.heap.tomb=Lapide
items.heap.tomb_desc=Questa tomba antica può contenere qualcosa di utile, ma il suo occupante di certo avrà qualcosa da ridire.
items.heap.skeleton=Resti scheletrici
items.heap.skeleton_desc=Questo è tutto ciò che rimane di qualche sfortunato avventuriero. Forse vale la pena di controllare se vi è qualcosa di valore.
items.heap.remains=Resti di un eroe
items.heap.remains_desc=Questo è tutto ciò che rimane di uno dei tuoi predecessori. Forse vale la pena di controllare se vi è qualcosa di valore.

items.honeypot.name=vaso di miele
items.honeypot.ac_shatter=ROMPI
items.honeypot.desc=Questo capiente vaso è internamente rivestito di miele e ospita un'ape gigante! Le grandi api di questa specie sono solite rimanere nei loro alveari, che questo vaso sia una sorta di gabbia per intrappolarla? L'ape sembra alquanto compiaciuta all'interno del vaso con il suo miele e ronza verso di te con fare minaccioso quando la guardi.
items.honeypot$shatteredpot.name=vaso di miele frantumato
items.honeypot$shatteredpot.desc=Il vaso è andato in frantumi, solo il miele appiccicoso che lo riveste lo tiene ancora insieme, ma si sta lentamente sfaldando.\n\nNonostante il suo cattivo stato, pare che l'ape voglia ancora proteggere il vaso.

items.item.prompt=Scegli una direzione di lancio
items.item.ac_drop=LASCIA
items.item.ac_throw=LANCIA
items.item.rankings_desc=Ucciso da: %s
items.item.curse=maledizione
items.item.custom_note_type=Questo tipo di oggetto ha una nota personalizzata: "_%s_"
items.item.custom_note=Questo oggetto ha una nota personalizzata: "_%s_"
items.item.discover_hint=Puoi trovare questo oggetto casualmente nel dungeon.

items.kindofmisc.unequip_title=Rimuovi un oggetto
items.kindofmisc.unequip_message=Devi disequipaggiare uno di questi oggetti prima. Seleziona un oggetto da scambiare

items.kindofweapon.swift_equip=Equipaggi rapidamente la tua arma.
items.kindofweapon.equip_cursed=La tua presa si stringe involontariamente attorno all'arma.
items.kindofweapon.which_equip_msg=A quale slot arma vuoi equipaggiare questo oggetto?\n\nLa Campionessa attacca direttamente con la sua arma principale, ma può usare l'abilità di entrambe le armi. Entrambe le armi condividono lo stesso numero di cariche.\n\nLa Campionessa può anche scambiare istantaneamente la sua arma primaria e secondaria.
items.kindofweapon.which_equip_primary=Primario (%s)
items.kindofweapon.which_equip_secondary=Secondario (%s)
items.kindofweapon.empty=vuoto

items.kingscrown.name=Corona del Re dei Nani
items.kingscrown.ac_wear=INDOSSA
items.kingscrown.naked=Sfortunatamente, la corona non può essere trasformata in un abbigliamento intimo.
items.kingscrown.upgraded=La corona brilla intensamente e poi si disintegra mentre la tua armatura si trasforma!
items.kingscrown.ratgraded=Le zampe del Re dei Topi brillano luminose mentre la tua armatura si trasforma!
items.kingscrown.desc=La corona dell'ultimo Re dei nani, risplende di un'enorme energia magica.\n\nUna volta indossata, la magia della corona fluirà nell'armatura che indossi attualmente, trasformandola in un'armatura epica unica con abilità speciali. La nuova armatura manterrà tutte le proprietà dell'armatura originale.
items.kingscrown.discover_hint=Puoi trovare questo oggetto come bottino da certi nemici.

items.liquidmetal.name=metallo fuso
items.liquidmetal.ac_apply=APPLICA
items.liquidmetal.prompt=Scegli un'arma da lancio
items.liquidmetal.already_fixed=Quell'arma da lancio è già in condizioni perfette!
items.liquidmetal.apply=Usi %d metallo fuso per riparare la tua arma da lancio.
items.liquidmetal.desc=Questo liquido magico penetra in crepe e graffi delle armi da lancio, riportandole in condizioni perfette! Se le armi sono completamente funzionali ma ne manca una, il metallo liquido può persino essere utilizzato per rimpiazzarla!\n\nUn'arma di categoria 1 richiede 10 ampolle di metallo liquido, una di categoria 5 ne richiede 30. Ogni miglioramento incrementa la quantità di metallo necessaria del 35%.\n\nIl metallo liquido non può essere usato per riparare le punte dei dardi intinti.
items.liquidmetal.discover_hint=Puoi creare questo oggetto tramite l'alchimia.

items.lostbackpack.name=zaino perduto
items.lostbackpack.desc=Queste sono le cose che avevi perduto. Raccoglile per recuperarle tutte!

items.merchantsbeacon.name=faro del mercante
items.merchantsbeacon.ac_use=USA
items.merchantsbeacon.desc=Questo strano pezzo di tecnologia nanica ti permette di comunicare attraverso grandi distanze.\n\nUna volta attivato, questo faro ti permetterà di vendere oggetti al Pixel Mart da dovunque nel dungeon.\n\nComunque sia, la magia propria del faro durerà solo per una sessione, quindi usalo saggiamente.

items.stylus.name=stilo arcano
items.stylus.ac_inscribe=INSCRIVI
items.stylus.prompt=Seleziona un'armatura
items.stylus.identify=Devi prima identificare se quell'armatura è maledetta.
items.stylus.cursed=La magia dello stilo non funzionerà su un'armatura maledetta.
items.stylus.inscribed=Hai inscritto la tua armatura con lo stilo.
items.stylus.desc=Lo stilo arcano è composto di una qualche pietra scura molto dura. Usandolo potrai inscrivere un glifo magico sulla tua armatura, ma non avrai modo di scegliere quale glifo sarà, lo stilo lo deciderà per te.

items.tengusmask.name=Maschera di Tengu
items.tengusmask.ac_wear=INDOSSA
items.tengusmask.used=La maschera si disintegra mentre il suo potere fluisce dentro di te!
items.tengusmask.desc=Questa maschera è caduta dal viso di Tengu mentre moriva, puoi sentire un grande potere magico venir emanato da essa. La maschera di Tengu era la fonte della sua forza?\n\nUna volta indossata, il tremendo potere della maschera verrà trasferito dentro di te, permettendoti di _scegliere una sottoclasse per il tuo eroe._\n\nChe sottoclasse sceglierai?
items.tengusmask.discover_hint=Puoi trovare questo oggetto come bottino da certi nemici.

items.torch.name=torcia
items.torch.ac_light=ACCENDI
items.torch.desc=Un oggetto di base nelle avventure. Quando un dungeon diventa buio, una torcia può aiutare a farsi strada.

items.waterskin.name=Otre
items.waterskin.ac_drink=BEVI
items.waterskin.collected=Raccogli la goccia di rugiada nel tuo otre.
items.waterskin.full=Il tuo otre è pieno!
items.waterskin.empty=il tuo otre è vuoto!
items.waterskin.desc=Un contenitore per i liquidi, fatto di pelle e stringhe, sigillato da un tappo di sughero.
items.waterskin.desc_water=In questo momento l'otre contiene solo dell'acqua potabile. Sicuramente c'è qualcosa nel dungeon che la sacca d'acqua potrebbe immagazzinare.
items.waterskin.desc_heal=L'otre è attualmente utilizzato per immagazzinare l'acqua curativa. Più è piena la borraccia, più sarai guarito all'istante bevendola. Berrai solo quanto ti serve.
items.waterskin.desc_full=L'otre pieno sembra irradiare energia, forse può essere usata per benedire un altro oggetto di sopravvivenza?
items.waterskin.discover_hint=Uno degli eroi inizia con questo oggetto.
