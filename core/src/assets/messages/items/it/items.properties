items.equipment.weapon.melee.runicblade.typical_ability_desc=La Duellante può eseguire un _fendente runico_ con una lama runica. Questo attacco è sicuro di colpire e in genere ha _+%d%% potere di incantamenti._
items.equipment.weapon.melee.runicblade.ability_desc=La Duellante può eseguire un _fendente runico_ con una lama runica. Questo attacco è sicuro di colpire e ha _+%d%% potere di incantamenti._
items.equipment.weapon.melee.runicblade.upgrade_ability_stat_name=Potere bonus dell'Abilità
items.equipment.weapon.melee.runicblade.desc=Una misteriosa arma proveniente da una terra lontana, dalla lama di un blu vivace.

items.equipment.weapon.melee.sai.name=sai
items.equipment.weapon.melee.sai.stats_desc=Questa è un'arma molto veloce.
items.equipment.weapon.melee.sai.ability_name=attacco combinato
items.equipment.weapon.melee.sai.typical_ability_desc=La Duellante può eseguire un _colpo combo_ con i sai. Questo attacco è sicuro di colpire e in genere infligge _+%d danni_ per ogni volta che la Duellante ha colpito con un normale attacco in mischia o con un'arma da lancio. Non colpire per 5 turni (15 dopo un'uccisione) azzera questa combo.
items.equipment.weapon.melee.sai.ability_desc=La Duellante può eseguire un _colpo combo_ con i sai. Questo attacco è sicuro di colpire e infligge _+%d danni_ per ogni volta che la Duellante ha colpito con un normale attacco in mischia o con un'arma da lancio. Non colpire per 5 turni (15 dopo un'uccisione) azzera questa combo.
items.equipment.weapon.melee.sai.desc=Due lame sottili pensate per essere impugnate una per mano. Eccellenti per affettare i nemici con veloci fendenti.
items.equipment.weapon.melee.sai$combostriketracker.name=attacco combinato
items.equipment.weapon.melee.sai$combostriketracker.desc=La Duellante sta generando una combo che può essere utilizzata per aumentare il danno dell'abilità del colpo combo. Ogni attacco riuscito effettuato con un'arma da mischia o da lancio conterà, ma se non attacca con successo per 5 turni (15 dopo un'uccisione) si ripristina questa combo.\n\nColpi recenti: %1$d.\n\nTurni finché non si perdono i colpi: %2$s.

items.equipment.weapon.melee.scimitar.name=scimitarra
items.equipment.weapon.melee.scimitar.stats_desc=Questa è un'arma piuttosto veloce.
