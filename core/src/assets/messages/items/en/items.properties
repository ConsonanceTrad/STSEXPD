items.equipment.weapon.melee.fusion.windbottle.desc=A tier-3 vessel that releases a controlled gust. Each hit has a one-in-five chance to push a movable target back one tile.

items.equipment.armor.fusion.lifearmor.name=life armor
items.equipment.armor.fusion.lifearmor.desc=The Special Surprise life armor rebalanced as tier-4 armor. It blocks one less maximum damage than scale armor, but has a one-in-twelve chance to restore 1 health whenever damage gets through.
items.equipment.armor.fusion.catsharkarmor.name=catshark armor
items.equipment.armor.fusion.catsharkarmor.desc=A light tier-3 hybrid armor. It blocks one less maximum damage than mail armor in exchange for 6% faster action speed.

