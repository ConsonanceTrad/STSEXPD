items.greatrune.armor=Choose one of three glyphs for this armor.
items.greatrune.cancel=Give up
items.greatrune.item=Enchanting complete.
items.greatrune.desc=Lets you choose one of three random enchantments for a weapon or armor. It can be forged from a weightstone and an arcane stylus.

items.summon.activemrdestructo.name=Mr Destructo
items.summon.activemrdestructo.ac_active=USE
items.summon.activemrdestructo.desc=An autonomous turret built with dwarven technology and demonic energy. This device can only be used once.
items.summon.activemrdestructo$mrdestructo.name=Mr Destructo
items.summon.activemrdestructo$mrdestructo.desc=This activated device attacks nearby creatures with a beam and damages itself with every hit.
items.summon.activemrdestructo$mrdestructo2dot0.name=Mr Destructo 2.0
items.summon.activemrdestructo$mrdestructo2dot0.desc=The Leader's power strengthens this turret, improving its durability and beam.
items.summon.fairycard.name=fairy card
items.summon.fairycard.ac_active=USE
items.summon.fairycard.desc=Draw the card to summon a fairy.
items.summon.fairycard$fairy.name=healing fairy
items.summon.fairycard$fairy.desc=A short-lived fairy that follows you and heals nearby wounds.
items.summon.fairycard$sugarplumfairy.name=warlock fairy
items.summon.fairycard$sugarplumfairy.desc=A Leader-strengthened fairy which heals its owner and attacks nearby enemies.
items.summon.mobile.name=control satellite
items.summon.mobile.ac_active=USE
items.summon.mobile.desc=Calls a small lightning satellite.
items.summon.mobile$mobilesatellite.name=blue satellite
items.summon.mobile$mobilesatellite.desc=A swift, short-lived satellite found aboard an alien vessel.
items.summon.mobile$exmobilesatellite.name=red satellite
items.summon.mobile$exmobilesatellite.desc=A Leader-modified satellite with greater durability, attack speed and damage.
items.consum.food.smallmeat.name=small jerky
items.consum.food.smallmeat.desc=It is meat, small meat; eat it or cook it.
items.towel.name=towel
items.towel.desc=Don't forget your towel! It has limited uses, but removes several harmful conditions.
items.towel.ac_towel=USE
items.towel.apply=You use the towel.
items.towel.end=The towel is worn out.

items.misc.spectacles.name=spectacles
items.misc.spectacles.desc=Ordinary-looking spectacles said to strengthen the wearer's psionic power.

items.consum.scrolls.scrollofmagicalinfusion.name=scroll of magical infusion
items.consum.scrolls.scrollofmagicalinfusion.desc=This scroll upgrades a weapon or armor while preserving and strengthening its enchantment.
items.consum.scrolls.scrollofmagicalinfusion.inv_title=Select an item to infuse
items.consum.scrolls.scrollofmagicalinfusion.infuse=Your %s glows with magical power.
items.consum.scrolls.scrollofregrowth.name=scroll of regrowth
items.consum.scrolls.scrollofregrowth.desc=This scroll floods the nearby ground with life-giving water and causes plants to spring up.
items.consum.scrolls.scrollofpsionicblast.name=scroll of psionic draw
items.consum.scrolls.scrollofpsionicblast.ondeath=The Psionic Blast tears your mind apart...
items.consum.scrolls.scrollofpsionicblast.desc=This scroll contains destructive energy that can be channeled to tear apart the minds of all visible creatures. The power unleashed by the scroll will give magic to the reader.

items.misc.autopotion.name=auto-potion
items.misc.autopotion.desc=A peculiar wearable potion. Its original automatic-healing enchantment is dormant.

items.knowledgebook.name=knowledge book
items.knowledgebook.desc=A collection of notes about unusual places. Reading it opens the adventure journal.
items.knowledgebook.ac_read=READ

