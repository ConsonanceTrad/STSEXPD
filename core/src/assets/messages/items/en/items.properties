items.equipment.artifacts.holytome.levelup=Your tome grows stronger!
items.equipment.artifacts.holytome.desc=A holy tome that acts as a focus for the Cleric's divine magic. Using the tome lets the Cleric cast a variety of magical spells.\n\nThe tome will steadily get more powerful as the Cleric uses it, giving the Cleric more maximum charges and slightly increasing the recharging speed.
items.equipment.artifacts.holytome.discover_hint=One of the heroes starts with this item.

