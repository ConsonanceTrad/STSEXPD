items.equipment.artifacts.lloydsbeacon.desc=Lloyd's beacon is an intricate magic device that allows you to return to a place you have already been.
items.equipment.artifacts.lloydsbeacon.desc_set=This beacon was set somewhere on the level %d of Pixel Dungeon.

items.equipment.artifacts.masterthievesarmband.name=master thief armband
