###missile weapons
items.equipment.weapon.missiles.darts.adrenalinedart.name=adrenaline dart
items.equipment.weapon.missiles.darts.adrenalinedart.desc=These darts are tipped with a swiftthistle-based compound which will boost the movement and attack speed of allies, or briefly lower the movement speed of enemies. The dart itself is still harmful to enemies, but will not harm allies.

