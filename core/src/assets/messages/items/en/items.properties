items.equipment.artifacts.driedrose$wndghosthero.title=Ghost's Equipment
items.equipment.artifacts.driedrose$wndghosthero.desc=The ghost is weak on their own, but their form is solid enough to be equipped with a weapon and armor. They will be able to use these items just like you do.\n\nThe ghost can currently equip items requiring up to _%d strength._
