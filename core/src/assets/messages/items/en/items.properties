items.equipment.wands.fusion.wandofblood.ondeath=You exhausted your life through your own blood pact...
items.equipment.wands.fusion.wandofblood.charged=Enemy life energy flows into your blood-pact staff!
items.equipment.wands.fusion.wandofblood.desc=This _dark_ wand radiates dark energy, as if the small decorative skull shaped onto its tip were not already obvious enough.
items.equipment.wands.fusion.wandofblood.stats_desc=This wand releases a blast of corrupting energy, dealing _%1$d-%2$d damage_ and healing its user.
items.equipment.wands.fusion.wandofblood.upgrade_stat_name_1=Ally Healing
items.equipment.wands.fusion.wandofblood.upgrade_stat_name_2=Self-Shielding
items.equipment.wands.fusion.wandofblood.upgrade_stat_name_3=Undead Damage
items.equipment.wands.fusion.wandofblood.bmage_desc=The Battlemage gains shielding when striking a charmed target and avoids the next blood-pact health cost.
items.equipment.wands.fusion.wandofblood.eleblast_desc=The blood-pact elemental blast charms enemies, heals allies, and harms hostile undead.

items.equipment.rings.ring.starstone=starstone ring
items.equipment.rings.ring.moonstone=moonstone ring
items.equipment.rings.fusion.ringofmagic.name=ring of magic
items.equipment.rings.fusion.ringofmagic.stats=MIG improve _%d_ .
items.equipment.rings.fusion.ringofmagic.upgrade_stat_name_1=MIG Boost
items.equipment.rings.fusion.ringofmagic.desc=Your wands will become more powerful in the arcane field that radiates from this ring. Magic limit at 30 level.
items.equipment.rings.fusion.ringofknowledge.name=ring of knowledge
items.equipment.rings.fusion.ringofknowledge.stats=When worn, you have 25%% chance to deal _%1$s_ times damage when zapping, and _%2$s%%_ chance to gain an extra drop after defeating an enemy.
items.equipment.rings.fusion.ringofknowledge.upgrade_stat_name_1=Magic Critical Damage
items.equipment.rings.fusion.ringofknowledge.upgrade_stat_name_2=Extra Drop Progress
items.equipment.rings.fusion.ringofknowledge.desc=This ring improves the wearer's awareness, increasing the chance of dealing a magic critical and allowing extra loot after defeating enemies. The effect reaches its limit at level 30.

items.equipment.artifacts.fusion.eyeofskadi.name=eye of skadi
items.equipment.artifacts.fusion.eyeofskadi.ac_add=ADD
items.equipment.artifacts.fusion.eyeofskadi.ac_blast=S-ICE BLAST
items.equipment.artifacts.fusion.eyeofskadi.ac_curse=CURSE
items.equipment.artifacts.fusion.eyeofskadi.no_charge=Use ice of skadi need more charge.
items.equipment.artifacts.fusion.eyeofskadi.prompt=Add a stone ore
items.equipment.artifacts.fusion.eyeofskadi.need_charge=It is still need charge.
items.equipment.artifacts.fusion.eyeofskadi.full_charge=It is full charge.
items.equipment.artifacts.fusion.eyeofskadi.exp=It have %s exp.
items.equipment.artifacts.fusion.eyeofskadi.infuse_ore=You add stone ore into this eye.
items.equipment.artifacts.fusion.eyeofskadi.desc=Extremely rare artifact, guarded by the azure dragons.
items.equipment.artifacts.fusion.noomlincrown.name=Noomlin Crown
items.equipment.artifacts.fusion.noomlincrown.desc=From the depths of the PALACE, the crown atop the icy mountain peaks. The power of the cold has long dissipated, leaving only his pet and this worn-out crown.\nEven though this thing has no power, it is still regarded as a divine artifact.

items.consum.food.fusion.nut.name=festival nut
items.consum.food.fusion.nut.eat_msg=The nut is small, but pleasantly filling.
items.consum.food.fusion.nut.desc=A preserved festival snack recovered from another world. It restores a little hunger and health, and occasionally grants a brief layer of barkskin.

items.consum.medicine.mendingtonic.name=mending tonic
items.consum.medicine.mendingtonic.ac_drink=DRINK
items.consum.medicine.mendingtonic.mend=The tonic steadily closes your wounds.
items.consum.medicine.mendingtonic.desc=A carefully diluted restorative from another world. It heals less immediately than a potion of healing, but remains useful without replacing the dungeon's primary healing resource.
items.consum.medicine.magicpill.name=magic pill
items.consum.medicine.magicpill.ac_use=USE
items.consum.medicine.magicpill.desc=This pill will improve your magic for while.\nCooking it by 2 meats, 1 seed, 1 potion.
items.consum.medicine.timepill.name=time pill
items.consum.medicine.timepill.desc=Grants speed and a bag of magic time sand.\nCook it with _1 water and 4 stone ores_.
items.consum.medicine.pill.name=medicine pill
items.consum.medicine.pill.ac_eat=EAT
items.consum.medicine.pill.desc=A prepared medicine from Special Surprise Pixel Dungeon.
items.consum.medicine.bluemilk.name=blue milk
items.consum.medicine.bluemilk.desc=This mushroom oozes a milky blue substance.You feel your senses slipping. It can improve your move speed and your life, and slow others in this place.\nCooking it by 1 water, 1 vegetable, 1 seed of sungrass.
items.consum.medicine.deathcap.name=death cap mushroom
items.consum.medicine.deathcap.desc=A deadly-looking fungus found growing in the dungeon. It is too dangerous.\nCooking it by 1 water, 1 vegetable, 1 seed of sorrowmoss.
items.consum.medicine.earthstar.name=earthstar mushroom
items.consum.medicine.earthstar.desc=A tiny bit of an unknown world grows in this mushroom. It looks like blade.\nCooking it by 1 water, 1 vegetable, 1 seed of earthroot.
items.consum.medicine.foamedbeverage.name=foamed beverage
items.consum.medicine.foamedbeverage.desc=happy drinking!\nCooking it by 2 water, 1 vegetable, 1 seed, 1 fruit.
items.consum.medicine.goldenjelly.name=golden jelly mushroom
items.consum.medicine.goldenjelly.desc=A gelatinous fungi covered in a sticky ooze. Looks like it might cause some havoc.\nCooking it by 1 water, 1 vegetable, 1 seed of stormvine.
items.consum.medicine.greaterpill.name=Recover pill
items.consum.medicine.greaterpill.desc=heal life, or upgread weapon.\nCooking it by 1 fruit, 2 potions.
items.consum.medicine.greenspore.name=green spore mushroom
items.consum.medicine.greenspore.not_time=nothing happend.
items.consum.medicine.greenspore.desc=This is new mushroom, It is full with dew power.\nCooking it by 1 water, 1 vegetable, 1 seed of dewcatcher.
items.consum.medicine.hardpill.name=hard pill
items.consum.medicine.hardpill.desc=This pill will improve your defence for while.\nCooking it by 2 meats, 1 vegetable, 1 stone.
items.consum.medicine.jackolantern.name=jack o lantern mushroom
items.consum.medicine.jackolantern.desc=A strange heat emminates from this mushroom. It is easy to fire.\nCooking it by 1 water, 1 vegetable, 1 seed of firebloom.
items.consum.medicine.lingpotion.name=Ling prayer star bottle
items.consum.medicine.lingpotion.desc=A bottle of holy water from Ling that greatly improves the user's abilities.\nA return gift from Ling.
items.consum.medicine.musicpill.name=music pill
items.consum.medicine.musicpill.desc=This pill will improve your skill for while.\nCooking it by 2 meats, 1 seed, 1 stone.
items.consum.medicine.pixieparasol.name=pixie parasol mushroom
items.consum.medicine.pixieparasol.desc=These mushrooms seem to spin in front of your eyes. You hear fleeting laughter.\nCooking it by 1 water, 1 vegetable, 1 seed of dreamfoil.
items.consum.medicine.powerpill.name=power pill
items.consum.medicine.powerpill.desc=This pill will make your stronger for a while.\nCooking it by 3 meats, 1 vegetable.
items.consum.medicine.realgarwine.name=Realgar wine
items.consum.medicine.realgarwine.desc=give fire resistance and posion resistance.\nCooking it by 1 water, 1 seed of firebloom, 1 seed of earthroot.
items.consum.medicine.shootpill.name=shoot pill
items.consum.medicine.shootpill.desc=This pill will improve your range skill for while.\nCooking it by 3 meats, 1 seed.
items.consum.medicine.smashpill.name=smash pill
items.consum.medicine.smashpill.desc=This pill will improve your damage for while.\nCooking it by 2 meats, 1 vegetable, 1 potion.
items.consum.medicine.timepill2.name=time pill - spring type
items.consum.medicine.timepill2.desc=Grants speed and a magic watch spring.\nForge it with _1 water and 4 stone ores_.

items.equipment.weapon.missiles.fusion.rocketmissile.name=rocket missile
items.equipment.weapon.missiles.fusion.rocketmissile.desc=A tier-4 projectile with lower maximum damage than a javelin and a one-in-four chance to briefly ignite its target.
items.equipment.weapon.missiles.fusion.tempestboomerang.name=tempest boomerang
items.equipment.weapon.missiles.fusion.tempestboomerang.desc=A slightly lower-damage tier-4 boomerang with a one-in-four chance to cripple its target briefly. It returns using normal boomerang rules.

items.consum.food.fruit.blackberry.name=black berry
items.consum.food.fruit.blackberry.desc=A delectable berry filled with life energy. It rapidly restores health and may briefly reveal every creature on the floor.
items.consum.food.fruit.blueberry.name=blue berry
items.consum.food.fruit.blueberry.desc=A mysterious blue berry filled with knowledge. It grants foresight, revealing nearby terrain, secrets, and enemies as you explore.
items.consum.food.fruit.cloudberry.name=cloud berry
items.consum.food.fruit.cloudberry.desc=A light berry filled with wind energy. It grants haste, healing, and may also grant levitation.
items.consum.food.fruit.fullmoonberry.name=full moon berry
items.consum.food.fruit.fullmoonberry.desc=In the darkest hours of night a full moon berry grows. It was blessed by Selemene.
items.consum.food.fruit.moonberry.name=moon berry
items.consum.food.fruit.moonberry.desc=A hearty blue-green berry filled with power. It grants temporary strength and may harden your skin.
items.consum.food.fruit.strawberry.name=strawberry
items.consum.food.fruit.strawberry.desc=A rare fruit said to grow on the highest mountain in the Palace. It makes the eater light enough to float.
items.consum.food.fruit.cherry.name=cherry
items.consum.food.fruit.cherry.desc=A fruit borne by guardian plants near the Ruins. Its volatile pit turns into a live bomb when eaten.
items.consum.food.fruit.durian.name=durian
items.consum.food.fruit.durian.desc=One of the nut grove's secret weapons. Its thorny flesh grants a strong layer of barkskin.

items.consum.food.vegetable.nutvegetable.name=nut vine
items.consum.food.vegetable.nutvegetable.desc=A common vegetable usually used in cooking. Even raw, it is filling and grants a small protective barrier.
items.consum.food.vegetable.healgrass.name=healing grass
items.consum.food.vegetable.healgrass.desc=An edible cutting from sungrass. It restores health and grants temporary arcane protection.
items.consum.food.vegetable.battleflower.name=starflower petal
items.consum.food.vegetable.battleflower.desc=An edible part of a starflower. It strengthens physical attacks and grants blessing and arcane protection.
items.consum.food.vegetable.dreamleaf.name=dream leaf
items.consum.food.vegetable.dreamleaf.desc=An edible cutting from dreamfoil. It cleanses poison and other common harmful effects.
items.consum.food.vegetable.truffles.name=truffle
items.consum.food.vegetable.truffles.desc=A rare, sweet underground fungus. Eating it permanently increases maximum health.
items.consum.food.vegetable.brewleft.name=brewing leftovers
items.consum.food.vegetable.brewleft.desc=Edible scraps left after brewing. They are not nutritious, but wasting food would be worse.

items.reddewdrop.name=red dewdrop
items.reddewdrop.desc=A red dewdrop. If the waterskin cannot accept it, it immediately restores a moderate amount of health.
items.violetdewdrop.name=violet dewdrop
items.violetdewdrop.desc=A rare violet dewdrop. If the waterskin cannot accept it, it immediately restores a great deal of health.
items.yellowdewdrop.name=yellow dewdrop
items.yellowdewdrop.desc=A yellow dewdrop. If the waterskin cannot accept it, it immediately restores a little health.

items.transmutationball.name=phase pitcher fruit
items.transmutationball.ac_use=use
items.transmutationball.prompt=Select an unequipped item to transmute
items.transmutationball.desc=The fruit of the phase pitcher. It can transmute one unequipped item without consuming a scroll.
items.upgradeeatball.name=star eater fruit
items.upgradeeatball.ac_use=use
items.upgradeeatball.prompt=Select an unequipped item to refine
items.upgradeeatball.desc=The fruit of the star eater. It destroys an item and attempts to extract its upgrades as strengthening essence.
items.upgradeblob.prompt=Select an unequipped item to upgrade
items.upgradeblob.applied=Your %s absorbs %d level(s) of strengthening essence.
items.upgradeblobyellow.name=yellow strengthening essence
items.upgradeblobyellow.ac_apply=apply
items.upgradeblobyellow.desc=Yellow residue produced by a star eater. Applying it upgrades an item by one level.
items.upgradeblobred.name=red strengthening essence
items.upgradeblobred.ac_apply=apply
items.upgradeblobred.desc=Red residue produced by a star eater. Applying it upgrades an item by three levels.
items.upgradeblobviolet.name=violet strengthening essence
items.upgradeblobviolet.ac_apply=apply
items.upgradeblobviolet.desc=Rare violet residue produced by a star eater. Applying it upgrades an item by five levels.

items.consum.potions.potionofmending.name=potion of mending
items.consum.potions.potionofmending.desc=A restorative potion brewed from nut-vine seeds. It cleanses common ailments and steadily mends a substantial amount of health.
items.consum.potions.potionofmight.name=potion of might
items.consum.potions.potionofmight.desc=A fortifying potion brewed from phase-pitcher seeds. It temporarily raises maximum health and provides long-lasting physical protection.
items.consum.potions.potionofmixing.name=potion of mixing
items.consum.potions.potionofmixing.skillup=Your combat instincts sharpen, and magical equipment begins to recharge.
items.consum.potions.potionofmixing.desc=A rare potion brewed from seedpod seeds. It permanently improves accuracy and evasion, and temporarily accelerates magical recharging.
items.consum.potions.potionofshield.name=potion of shielding
items.consum.potions.potionofshield.desc=A defensive potion brewed from silica-flower seeds. Drinking it grants physical shielding and arcane armor; its splash briefly paralyzes creatures.
items.consum.potions.potionofoverhealing.name=potion of life
items.consum.potions.potionofoverhealing.desc=A powerful potion brewed from star-eater seeds. It cures ailments, fills health, continues healing, and converts excess vitality into shielding.

items.quest.mushroom.name=dew mushroom
items.quest.mushroom.desc=This rare mushroom grows in the damp dungeon. It is of great value to a researcher waiting near the entrance.

items.puddingcup.name=chocolate pudding
items.puddingcup.ac_save=remember
items.puddingcup.saved=This moment has been saved.
items.puddingcup.desc=The pudding's sweet scent preserves the memory of this moment, but only this moment.

items.saveyourlife.name=Emergency Offline Device
items.saveyourlife.ac_save=OFFLINE
items.saveyourlife.desc=Creates a memory save. This device should only appear in test mode.

items.testcloak.name=Test cloak
items.testcloak.ac_use=USE
items.testcloak.desc=A single-use experimental cloak made by SaidbySun.

