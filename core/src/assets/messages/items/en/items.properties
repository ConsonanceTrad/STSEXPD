items.equipment.artifacts.driedrose$wndghosthero.armor_prompt=Select an armor
items.equipment.artifacts.driedrose$wndghosthero.cant_unique=The ghost can't use unique items.
items.equipment.artifacts.driedrose$wndghosthero.cant_unidentified=You don't know enough about that item.
items.equipment.artifacts.driedrose$wndghosthero.cant_cursed=The ghost can only use equipment that you're sure isn't cursed.
items.equipment.artifacts.driedrose$wndghosthero.cant_strength_unknown=The ghost may not be strong enough to use that.
items.equipment.artifacts.driedrose$wndghosthero.cant_strength=The ghost is not strong enough to use that.

##ghost hero
items.equipment.artifacts.driedrose$ghosthero.name=sad ghost
items.equipment.artifacts.driedrose$superghosthero.name=mad ghost
items.equipment.artifacts.driedrose$superghosthero.desc=A frail looking ethereal figure with a woman shape. Its power seems tied to the rose you have.\n\nThis ghost's purity should be above me.
items.equipment.artifacts.driedrose$ghosthero.def_verb=dodged
items.equipment.artifacts.driedrose$ghosthero.discover_hint=You can find this character with a specific artifact.

items.equipment.artifacts.driedrose$ghosthero.hello=Hello again %s.
items.equipment.artifacts.driedrose$ghosthero.introduce=My spirit is bound to this rose, it was very precious to me, a gift from my love whom I left on the surface.\n\nI cannot return to him, but thanks to you I have a second chance to complete my journey. When I am able I will respond to your call and fight with you.\n\nAs long as you have the rose I can hear your voice, so you can use it to direct me from afar.\n\nHopefully you may succeed where I failed...

items.equipment.artifacts.driedrose$ghosthero.dialogue_sewers_1=These sewers used to be safe, people even lived here in the winter.
items.equipment.artifacts.driedrose$ghosthero.dialogue_sewers_2=I wonder what happened to the guard patrols, did they give up?
items.equipment.artifacts.driedrose$ghosthero.dialogue_sewers_3=I had family on the surface, I hope they're safe.
items.equipment.artifacts.driedrose$ghosthero.dialogue_sewers_4=The guards couldn't defeat these monsters, but maybe we can.
items.equipment.artifacts.driedrose$ghosthero.dialogue_sewers_5=If even the sewers are this dangerous, I wonder what's below...
items.equipment.artifacts.driedrose$ghosthero.dialogue_sewers_6=What could have caused these rats and crabs to grow so large?
items.equipment.artifacts.driedrose$ghosthero.dialogue_prison_1=I've heard stories about this place, nothing good.
items.equipment.artifacts.driedrose$ghosthero.dialogue_prison_2=This place was always more of a dungeon than a prison.
items.equipment.artifacts.driedrose$ghosthero.dialogue_prison_3=I can't imagine what went on when this place was abandoned.
items.equipment.artifacts.driedrose$ghosthero.dialogue_prison_4=It seems both the prisoners and guards have been turned into monsters.
items.equipment.artifacts.driedrose$ghosthero.dialogue_prison_5=What could be responsible for all these skeletons?
items.equipment.artifacts.driedrose$ghosthero.dialogue_prison_6=These people didn't have to end up like this...
items.equipment.artifacts.driedrose$ghosthero.dialogue_caves_1=No human or dwarf has been here for a very long time.
items.equipment.artifacts.driedrose$ghosthero.dialogue_caves_2=What would cause the dwarves to abandon a gold mine?
items.equipment.artifacts.driedrose$ghosthero.dialogue_caves_3=It's a shame all the gold here is useless on the surface.
items.equipment.artifacts.driedrose$ghosthero.dialogue_caves_4=The creatures here are twisted, just like in the sewers.
items.equipment.artifacts.driedrose$ghosthero.dialogue_caves_5=Even the bats are bloodthirsty here.
items.equipment.artifacts.driedrose$ghosthero.dialogue_caves_6=No sign of any mining equipment, did the dwarves reclaim it all?
items.equipment.artifacts.driedrose$ghosthero.dialogue_city_1=The dwarves were industrious, but greedy.
items.equipment.artifacts.driedrose$ghosthero.dialogue_city_2=So the dwarven metropolis really has fallen.
items.equipment.artifacts.driedrose$ghosthero.dialogue_city_3=I hope the surface never ends up like this place.
items.equipment.artifacts.driedrose$ghosthero.dialogue_city_4=Dwarves aren't supposed to look so pale.
items.equipment.artifacts.driedrose$ghosthero.dialogue_city_5=I don't know what's worse, the dwarves, or their creations.
items.equipment.artifacts.driedrose$ghosthero.dialogue_city_6=It seems the dwarves are mindless monsters now as well.
items.equipment.artifacts.driedrose$ghosthero.dialogue_halls_1=What is this place?
items.equipment.artifacts.driedrose$ghosthero.dialogue_halls_2=This place is terrifying...
items.equipment.artifacts.driedrose$ghosthero.dialogue_halls_3=What were the dwarves thinking, toying with power like this?
items.equipment.artifacts.driedrose$ghosthero.dialogue_halls_4=The monsters here are otherworldly, where did they come from?
items.equipment.artifacts.driedrose$ghosthero.dialogue_halls_5=Can you feel it? It's like something is watching us.
items.equipment.artifacts.driedrose$ghosthero.dialogue_halls_6=Thank goodness there are torches, it's so dark here!
items.equipment.artifacts.driedrose$ghosthero.dialogue_ascension_1=Why is this happening, I thought we succeeded?
items.equipment.artifacts.driedrose$ghosthero.dialogue_ascension_2=How is that thing still able to influence this world?
items.equipment.artifacts.driedrose$ghosthero.dialogue_ascension_3=I hope you know what you're doing with that amulet.
items.equipment.artifacts.driedrose$ghosthero.dialogue_ascension_4=I suppose we're not done just yet.
items.equipment.artifacts.driedrose$ghosthero.dialogue_ascension_5=We've come so far already, we can finish this!
items.equipment.artifacts.driedrose$ghosthero.dialogue_ascension_6=Just a little further, we can make it out of here!

items.equipment.artifacts.driedrose$ghosthero.seen_goo_1=Beware Goo!
items.equipment.artifacts.driedrose$ghosthero.seen_goo_2=Many of my friends died to this thing, time for vengeance!
items.equipment.artifacts.driedrose$ghosthero.seen_goo_3=Such an abomination cannot be allowed to live!
items.equipment.artifacts.driedrose$ghosthero.seen_tengu_1=The one prisoner left is a deadly assassin. Of course...
items.equipment.artifacts.driedrose$ghosthero.seen_tengu_2=He's trapped us!
items.equipment.artifacts.driedrose$ghosthero.seen_tengu_3=I've heard horror stories about that mask...
items.equipment.artifacts.driedrose$ghosthero.seen_dm300_1=Only dwarves would build a mining machine that kills intruders.
items.equipment.artifacts.driedrose$ghosthero.seen_dm300_2=That thing is huge...
items.equipment.artifacts.driedrose$ghosthero.seen_dm300_3=How has this thing stayed active for so long?
items.equipment.artifacts.driedrose$ghosthero.seen_king_1=When people say power corrupts, this is what they mean.
items.equipment.artifacts.driedrose$ghosthero.seen_king_2=He's more of a lich than a king now.
items.equipment.artifacts.driedrose$ghosthero.seen_king_3=Even in death the dwarves obey their master.
items.equipment.artifacts.driedrose$ghosthero.seen_yog_1=Oh, this doesn't look good.
items.equipment.artifacts.driedrose$ghosthero.seen_yog_2=So that's what a god looks like?
items.equipment.artifacts.driedrose$ghosthero.seen_yog_3=This is going to hurt...

items.equipment.artifacts.driedrose$ghosthero.defeated_by_enemy_1=Good luck...
items.equipment.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Tired... for now...
items.equipment.artifacts.driedrose$ghosthero.defeated_by_enemy_3=I will return...
items.equipment.artifacts.driedrose$ghosthero.defeated_by_boss_1=I'm sorry... good luck...
items.equipment.artifacts.driedrose$ghosthero.defeated_by_boss_2=Finish it off... without me...
items.equipment.artifacts.driedrose$ghosthero.defeated_by_boss_3=No... I can't...
items.equipment.artifacts.driedrose$ghosthero.blessed_ankh_1=How did you survive that?
items.equipment.artifacts.driedrose$ghosthero.blessed_ankh_2=I wish I had one of those...
items.equipment.artifacts.driedrose$ghosthero.blessed_ankh_3=Oh my! You're still alive!
items.equipment.artifacts.driedrose$ghosthero.player_killed_1=No!...
items.equipment.artifacts.driedrose$ghosthero.player_killed_2=I couldn't help them...
items.equipment.artifacts.driedrose$ghosthero.player_killed_3=Not like this...

items.equipment.artifacts.driedrose$ghosthero.direct_prompt=What should I do?
items.equipment.artifacts.driedrose$ghosthero.directed_follow_1=Okay, I'll follow you.
items.equipment.artifacts.driedrose$ghosthero.directed_follow_2=I'll fall in behind you.
items.equipment.artifacts.driedrose$ghosthero.directed_follow_3=Following you...
items.equipment.artifacts.driedrose$ghosthero.directed_follow_4=Okay, let's go!
items.equipment.artifacts.driedrose$ghosthero.directed_follow_5=I've got your back.
items.equipment.artifacts.driedrose$ghosthero.directed_attack_1=Okay, I'll attack that one.
items.equipment.artifacts.driedrose$ghosthero.directed_attack_2=I'll get that one.
items.equipment.artifacts.driedrose$ghosthero.directed_attack_3=Engaging...
items.equipment.artifacts.driedrose$ghosthero.directed_attack_4=Let's get them!
items.equipment.artifacts.driedrose$ghosthero.directed_attack_5=I've got that one.
items.equipment.artifacts.driedrose$ghosthero.directed_position_1=Okay, I'll hold that position.
items.equipment.artifacts.driedrose$ghosthero.directed_position_2=I'll go there and defend.
items.equipment.artifacts.driedrose$ghosthero.directed_position_3=Repositioning...
items.equipment.artifacts.driedrose$ghosthero.directed_position_4=On my way!
items.equipment.artifacts.driedrose$ghosthero.directed_position_5=I'll head over there.

items.equipment.artifacts.driedrose$ghosthero.desc=A frail looking ethereal figure with a humanoid shape. Their power seems tied to the rose you have.\n\nThis ghost may not be much, they seem to be your only true friend down here.

##back to artifacts
