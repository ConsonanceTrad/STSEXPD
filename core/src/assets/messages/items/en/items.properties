items.equipment.weapon.missiles.megacannon.damage=Each charge deals _%1$d-%2$d damage_; up to three charges can be stored.
items.equipment.weapon.missiles.megacannon.desc=Mega Man's arm cannon. Its melee attack deals no damage and builds energy for a ranged shot.
items.misc.rockmanjumpshoes.name=Mega jump shoes
items.misc.rockmanjumpshoes.ac_jump=JUMP
items.misc.rockmanjumpshoes.prompt=Choose a destination within three tiles
items.misc.rockmanjumpshoes.desc=These boots allow a jump of up to three tiles. Jumping takes as much time as the distance travelled.
items.equipment.armor.specialarmor.renbarmor.name=bunny suit
items.equipment.armor.specialarmor.renbarmor.desc=One of REN's treasured costumes. It breaks after 100 hits and leaves an Easter egg behind.
items.equipment.bombs.minibomb.name=mini bomb
items.equipment.bombs.minibomb.desc=A compact bomb that adds a focused blast at its center.
items.equipment.weapon.rockcode.obubble.name=O.bubble
items.equipment.weapon.rockcode.obubble.desc=Goo's skill chip launches an earthen bubble which may cover its target in ooze.
items.equipment.weapon.rockcode.obubble.stats_desc=Uses one of four charges to deal level-scaled earth damage and has a 50%% chance to apply ooze.
items.equipment.weapon.rockcode.ichain.name=I.chain
items.equipment.weapon.rockcode.ichain.desc=The Prison Wanderer's skill chip binds one target with an iron chain.
items.equipment.weapon.rockcode.ichain.stats_desc=Uses one of four charges to deal double level-scaled damage and has a 25%% chance to stun the target.
items.equipment.weapon.rockcode.nshuriken.name=N.shuriken
items.equipment.weapon.rockcode.nshuriken.desc=Tengu's skill chip throws a powerful ninja star.
items.equipment.weapon.rockcode.nshuriken.stats_desc=Uses one of four charges to deal triple level-scaled damage.
items.equipment.weapon.rockcode.trush.name=T.rush
items.equipment.weapon.rockcode.trush.desc=Tank's skill chip hurls a crushing tombstone and tears up the target tile.
items.equipment.weapon.rockcode.trush.stats_desc=Uses one of four charges to deal quadruple level-scaled damage and converts ordinary terrain to decorated floor.
items.equipment.weapon.rockcode.bmech.name=B.mech
items.equipment.weapon.rockcode.bmech.desc=DM-300's skill chip launches a mechanical demolition bomb.
items.equipment.weapon.rockcode.bmech.stats_desc=Uses one of four charges to detonate a dungeon bomb at the target.
items.equipment.weapon.rockcode.sweb.name=S.web
items.equipment.weapon.rockcode.sweb.desc=The Spider Queen's skill chip spreads webbing around the target.
items.equipment.weapon.rockcode.sweb.stats_desc=Uses one of four charges to deal level-scaled damage and seed web on adjacent passable tiles.
items.equipment.weapon.rockcode.mlaser.name=M.laser
items.equipment.weapon.rockcode.mlaser.desc=The Hybrid's skill chip releases a seven-element laser.
items.equipment.weapon.rockcode.mlaser.stats_desc=Uses one of four charges to deal energy, earth, fire, ice, shock, light, and dark damage.
items.equipment.weapon.rockcode.zshield.name=Z.shield
items.equipment.weapon.rockcode.zshield.desc=The Dwarf King's skill chip converts dark energy into a protective shield.
items.equipment.weapon.rockcode.zshield.stats_desc=Uses one of four charges to deal level-scaled dark damage and grant a shield worth five times the hero's level.
items.equipment.weapon.rockcode.alink.name=A.link
items.equipment.weapon.rockcode.alink.desc=The Elder Avatar's skill chip creates powerful mirror images near the target.
items.equipment.weapon.rockcode.alink.stats_desc=Uses one of four charges to summon up to two mirror images.
items.equipment.weapon.rockcode.lbox.name=L.box
items.equipment.weapon.rockcode.lbox.desc=The Lich Dancer's skill chip freezes its target inside an icy box.
items.equipment.weapon.rockcode.lbox.stats_desc=Uses one of four charges to deal level-scaled ice damage and inflict frostbite for 5 turns.

items.consum.food.staplefood.normalration.name=ration of food
items.consum.food.staplefood.normalration.desc=Nothing fancy here: dried meat, some biscuits, and similar travel food.
items.consum.food.staplefood.overpricedration.name=small ration
items.consum.food.staplefood.overpricedration.desc=A smaller food pack which is especially popular with young adventurers.
items.consum.food.staplefood.pasty.pasty=pasty
items.consum.food.staplefood.pasty.pasty_desc=This is an authentic Cornish pasty with a traditional beef and potato filling.
items.consum.food.staplefood.pasty.assorted=Spring Festival food
items.consum.food.staplefood.pasty.assorted_desc=Rice cakes, sweet dumplings, and dumplings fill this steamer. This traditional Spring Festival food completely satisfies hunger and fills you with determination.\n\nHappy Spring Festival!
items.consum.food.staplefood.pasty.book=school work
items.consum.food.staplefood.pasty.book_desc=This is school work for the summer vacation. Remember to balance work and rest.\n\nHappy summer vacation!
items.consum.food.staplefood.pasty.egg=rainbow egg
items.consum.food.staplefood.pasty.egg_desc=Although it looks small, eating it completely satisfies hunger and leaves you feeling energetic.\n\nHappy Easter!
items.consum.food.staplefood.pasty.pie=pumpkin pie
items.consum.food.staplefood.pasty.pie_desc=A great big slice of pumpkin pie! Its sweet and spicy flavor fills you up and restores a little health.\n\nHappy Halloween!
items.consum.food.staplefood.pasty.turkey=roast turkey
items.consum.food.staplefood.pasty.turkey_desc=A freshly roasted Thanksgiving turkey. It satisfies hunger and makes you move faster.\n\nHappy Thanksgiving!
items.consum.food.staplefood.pasty.cane=candy cane
items.consum.food.staplefood.pasty.cane_desc=A huge sugary candy cane! It is filling, and the sugar gives your wands a little extra charge.\n\nHappy Holidays!
items.consum.food.staplefood.pasty.bread=brick cake
items.consum.food.staplefood.pasty.bread_desc=A brick-shaped cake baked from flour and butter. There may even be gold inside.\n\nHappy International Workers' Day!
items.consum.food.staplefood.pasty.jelly=jelly sword
items.consum.food.staplefood.pasty.jelly_desc=A sword-shaped jelly candy. Perhaps only children enjoy this flavor.\n\nHappy International Children's Day!
items.consum.food.staplefood.pasty.worker=You earned some gold.
items.consum.food.meatfood.meat.name=raw meat
items.consum.food.meatfood.meat.desc=Ordinary market meat. It is best processed before eating.
items.consum.food.meatfood.firemeat.name=grilled steak
items.consum.food.meatfood.firemeat.desc=Fire is the simplest way to preserve meat and lets it provide more energy.
items.consum.food.meatfood.icemeat.name=frozen carpaccio
items.consum.food.meatfood.icemeat.desc=Thin slices of magically frozen raw meat. It provides little energy, but carries a useful blessing.
items.consum.food.meatfood.earthmeat.name=pickled meat
items.consum.food.meatfood.earthmeat.desc=Meat cured with the power of earth and filled with nature's protection.
items.consum.food.meatfood.shockmeat.name=fried meat
items.consum.food.meatfood.shockmeat.desc=Meat processed by a powerful electric current. It is crisp and refreshing.
items.consum.food.meatfood.lightmeat.name=bacon strip
items.consum.food.meatfood.lightmeat.desc=Air-dried in bright light for a long shelf life. There is always a little left over.
items.consum.food.meatfood.darkmeat.name=corrupted meat
items.consum.food.meatfood.darkmeat.desc=Meat aged in darkness. Strangely, eating it restores health.
items.consum.food.meatfood.funnyfood.name=funny meat
items.consum.food.meatfood.funnyfood.desc=A very strange dish which leaves everything feeling funny for a long time.
items.consum.food.fishcracker.name=fish cracker
items.consum.food.fishcracker.desc=A costly fish-shaped cracker. It is filling despite its small size.
items.consum.food.honey.name=honey
items.consum.food.honey.desc=Sweet concentrated honey which permanently strengthens the eater's vitality.
items.consum.food.completefood.petfood.name=pet food
items.consum.food.completefood.petfood.desc=Basic food prepared for dungeon companions.
items.consum.food.completefood.fishpetfood.name=fish pet food
items.consum.food.completefood.fishpetfood.desc=Fish-flavoured companion food with much more energy than an ordinary portion.
items.consum.food.meatfood.harmpoop.name=harmful waste
items.consum.food.meatfood.harmpoop.desc=This is technically edible, but causes poisoning and sluggishness.
items.consum.food.completefood.mediummeat.name=medium steak
items.consum.food.completefood.mediummeat.desc=A carefully cooked steak which greatly increases attack power for a while.
items.consum.food.completefood.nutcake.name=nut pudding
items.consum.food.completefood.nutcake.desc=A rich nut dessert which permanently raises vitality, heals wounds, and grants a physical shield.
items.consum.food.completefood.sishimi.name=sashimi
items.consum.food.completefood.sishimi.desc=Fresh slices which grant a magical shield when eaten.
items.consum.food.completefood.yearfood.name=Nian cake
items.consum.food.completefood.yearfood.desc=A festival dish which permanently raises vitality. Eating it on the final floor calls the Nian beast.
items.consum.food.completefood.zongzi.name=zongzi
items.consum.food.completefood.zongzi.desc=A heavy sticky-rice parcel which grants attack and magical protection, but leaves the eater tarred and slow.
items.specific.journalpages.journalpage.name=location
items.specific.journalpages.journalpage.desc=A location recorded for the adventure journal.
items.specific.journalpages.safespotpage.name=Housing contract
items.specific.journalpages.safespotpage.grassroom_desc=The address of a woodland cabin.
items.specific.journalpages.safespotpage.forestroom_desc=The address of an abandoned meadow.
items.specific.journalpages.safespotpage.cityroom_desc=The address of a city apartment.
items.specific.journalpages.sokoban1.name=Otiluck's journal -- sokoban1
items.specific.journalpages.sokoban1.desc=Location of sokoban1\n\nMy hometown was a beautiful place 50 years ago. Lots of people came here for magic stone, the great waterfall, delicious food, or something wonderful.\n\nBut because of the empire's industrial pollution and low-quality visitors, my hometown became worse. So I decided to save my town.
items.specific.journalpages.sokoban2.name=Otiluck's journal -- sokoban2
items.specific.journalpages.sokoban2.desc=Location of sokoban 2\n\nIt took a lot of time to collect useful information, but I finally found this place. I see some huge boxes, traps, and treasure in there.\n\nI'm sure this is some kind of puzzle, and I know I can solve it.
items.specific.journalpages.sokoban3.name=Otiluck's journal -- sokoban3
items.specific.journalpages.sokoban3.desc=Location of sokoban 3\n\nI found that island. A castle appeared after I used Dust of Appearance.\n\nI know this castle has the same builder as that prison. There are the same traps, the same boxes, the same tr... wait, a huge mirror with a mirror weapon?! I must lower my voice.\n\nI will never give up before I find my way to save my hometown.
items.specific.journalpages.sokoban4.name=Otiluck's journal -- sokoban4
items.specific.journalpages.sokoban4.desc=Location of sokoban 4\n\nThose creatures are frightened when I get close, and they transport me somewhere else.\n\nIt was the 61st time. I found a big stone tablet, and I can see unknown words on it. If I can understand what it says, I may be able to communicate with that creature.
items.specific.journalpages.town.name=Invitation from town
items.specific.journalpages.town.desc=Location of Dolye town.\n\n_Sorry, no magic stone is sold here now._
items.specific.journalpages.vault.name=Spring Festival Land
items.specific.journalpages.vault.desc=A simple location with number 25/1/2020.
items.specific.journalpages.newhome.name=New house location
items.specific.journalpages.newhome.desc=A recommended house listing with a location you can visit in person.

items.equipment.weapon.missiles.arrows.healfruit.name=heal fruit
items.equipment.weapon.missiles.arrows.healfruit.desc=A fruit grown from an enhanced sungrass. It heals a creature on a direct hit, or releases healing light when thrown onto the ground.
items.equipment.weapon.missiles.arrows.shockfruit.name=shock fruit
items.equipment.weapon.missiles.arrows.shockfruit.desc=A fruit grown from an enhanced stormvine. It shocks a creature on a direct hit, or releases electricity when thrown onto the ground.
items.equipment.weapon.missiles.arrows.toxicfruit.name=toxic fruit
items.equipment.weapon.missiles.arrows.toxicfruit.desc=A fruit grown from an enhanced sorrowmoss. It poisons a creature on a direct hit, or releases toxic gas when thrown onto the ground.
items.equipment.weapon.missiles.arrows.rootfruit.name=root fruit
items.equipment.weapon.missiles.arrows.rootfruit.desc=A fruit grown from an enhanced earthroot. It roots a creature on a direct hit, or spreads roots and webbing when thrown onto the ground.
items.equipment.weapon.missiles.arrows.firefruit.name=fire fruit
items.equipment.weapon.missiles.arrows.firefruit.desc=A fruit grown from an enhanced firebloom. It burns a creature on a direct hit, or releases fire when thrown onto the ground.
items.equipment.weapon.missiles.arrows.charmfruit.name=charm fruit
items.equipment.weapon.missiles.arrows.charmfruit.desc=A fruit grown from an enhanced dreamfoil. It charms a creature on a direct hit, or releases disorienting gas when thrown onto the ground.
items.equipment.weapon.missiles.arrows.smokefruit.name=smoke fruit
items.equipment.weapon.missiles.arrows.smokefruit.desc=A fruit grown from an enhanced fadeleaf. It blinds a creature on a direct hit, or fills the area with darkness when thrown onto the ground.
items.equipment.weapon.missiles.arrows.nutfruit.name=hard nut
items.equipment.weapon.missiles.arrows.nutfruit.desc=A fruit grown from an enhanced nut vine. It deals solid damage on a direct hit, or grows tall grass when thrown onto the ground.
items.equipment.weapon.missiles.arrows.icefruit.name=ice fruit
items.equipment.weapon.missiles.arrows.icefruit.desc=A fruit grown from an enhanced icecap. It chills a creature on a direct hit, or releases freezing mist when thrown onto the ground.
