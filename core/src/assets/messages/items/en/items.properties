items.equipment.weapon.missiles.darts.blindingdart.desc=These darts are tipped with a blindweed-based compound which will blind their target for a short time. They do not disorient however, so an enemy will still know where they last saw you.

items.equipment.weapon.missiles.darts.chillingdart.name=chilling dart
items.equipment.weapon.missiles.darts.chillingdart.desc=These darts are tipped with an icecap-based compound which will significantly chill their target.

items.equipment.weapon.missiles.darts.cleansingdart.name=cleansing dart
items.equipment.weapon.missiles.darts.cleansingdart.desc=These darts are tipped with a mageroyal-based compound which will temporarily make allies immune to all negative effects, or will cleanse positive effects from enemies. Enemies may even briefly forget that they are attacking or fleeing from you. The dart itself is still harmful to enemies, but will not harm allies.

items.equipment.weapon.missiles.darts.dart.name=dart
items.equipment.weapon.missiles.darts.dart.ac_tip=TIP
items.equipment.weapon.missiles.darts.dart.prompt=Select a seed
items.equipment.weapon.missiles.darts.dart.tip_title=Tip Darts
items.equipment.weapon.missiles.darts.dart.tip_desc=A seed can be combined with one or two darts to tip them. Each type of seed produces its own type of tipped dart, with a unique single-use effect.\n\nTipping a dart with these seeds will produce a _%s._
items.equipment.weapon.missiles.darts.dart.tip_all=tip %1$d darts with %2$d seeds
items.equipment.weapon.missiles.darts.dart.tip_two=tip 2 darts with 1 seed
items.equipment.weapon.missiles.darts.dart.tip_one=tip 1 dart with 1 seed
items.equipment.weapon.missiles.darts.dart.tip_cancel=cancel
items.equipment.weapon.missiles.darts.dart.desc=These simple shafts of spike-tipped wood are weighted to fly true and sting their prey with a flick of the wrist. They can be tipped with seeds to gain bonus effects when thrown.
items.equipment.weapon.missiles.darts.dart.unlimited_uses=Due to their simple construction darts will effectively last forever.

items.equipment.weapon.missiles.darts.displacingdart.name=displacing dart
items.equipment.weapon.missiles.darts.displacingdart.desc=These darts are tipped with a fadeleaf-based compound which will teleport their target a short distance away.

items.equipment.weapon.missiles.darts.healingdart.name=healing dart
items.equipment.weapon.missiles.darts.healingdart.desc=These darts are tipped with a sungrass-based compound which grants a burst of healing to their target. The dart itself is still harmful to enemies, but will not harm allies.

items.equipment.weapon.missiles.darts.holydart.name=holy dart
items.equipment.weapon.missiles.darts.holydart.desc=These darts are tipped with a starflower-based compound which infuses holy energy into their target. Allies and regular enemies will become blessed, but undead or demonic enemies will take heavy damage. The dart itself is still harmful to enemies, but will not harm allies.

items.equipment.weapon.missiles.darts.incendiarydart.name=incendiary dart
items.equipment.weapon.missiles.darts.incendiarydart.desc=These darts are tipped with a firebloom-based compound which will burst into brilliant flames on impact.

items.equipment.weapon.missiles.darts.paralyticdart.name=paralytic dart
items.equipment.weapon.missiles.darts.paralyticdart.desc=These darts are tipped with an earthroot-based compound which will paralyze their target for a short time.

items.equipment.weapon.missiles.darts.poisondart.name=poison dart
items.equipment.weapon.missiles.darts.poisondart.desc=These darts are tipped with a sorrowmoss-based compound which will poison their target.

items.equipment.weapon.missiles.darts.rotdart.name=rot dart
items.equipment.weapon.missiles.darts.rotdart.desc=These wicked darts are tipped with an acidic rotberry-based compound, which will aggressively eat through anything the dart comes into contact with. Powerful foes will resist most of the effect, but the corrosion is strong enough to easily kill most standard enemies. These last longer than other tipped darts, but their durability cannot be boosted.
items.equipment.weapon.missiles.darts.rotdart.discover_hint=You can create this item using a seed from a specific quest.

items.equipment.weapon.missiles.darts.shockingdart.name=shocking dart
items.equipment.weapon.missiles.darts.shockingdart.desc=These darts are tipped with a stormvine-based compound which will deliver a nasty shock to their target.

items.equipment.weapon.missiles.darts.tippeddart.ac_clean=CLEAN
items.equipment.weapon.missiles.darts.tippeddart.clean_title=Clean Darts
items.equipment.weapon.missiles.darts.tippeddart.clean_desc=This action will remove the seed tipping on your darts, reverting them back to regular darts.
items.equipment.weapon.missiles.darts.tippeddart.clean_all=clean all
items.equipment.weapon.missiles.darts.tippeddart.clean_one=clean one
items.equipment.weapon.missiles.darts.tippeddart.cancel=cancel
items.equipment.weapon.missiles.darts.tippeddart.uses_left=This stack of darts has _%d/%d_ uses left before one tip wears off.
items.equipment.weapon.missiles.darts.tippeddart.unlimited_uses=_But these are of such high quality that they will effectively last forever._
items.equipment.weapon.missiles.darts.tippeddart.about_to_break=Your dart's tip is about to expire.
items.equipment.weapon.missiles.darts.tippeddart.has_broken=Your dart's tip has expired.
items.equipment.weapon.missiles.darts.tippeddart.discover_hint=You can buy this item in a shop, or create it using a seed.


items.equipment.weapon.missiles.bolas.name=bolas
items.equipment.weapon.missiles.bolas.stats_desc=This weapon inflicts cripple on its target.
items.equipment.weapon.missiles.bolas.desc=These unusual ranged weapons aren't very damaging, but do an excellent job of slowing their target.

items.equipment.weapon.missiles.boomerang.name=boomerang
items.equipment.weapon.missiles.boomerang.desc=Thrown to the enemy this flat curved wooden missile will return to the hands of its thrower.
items.equipment.weapon.missiles.boomerang.durability=Due to its solid construction, this boomerang will not break from use.

items.equipment.weapon.missiles.fishingspear.name=fishing spear
items.equipment.weapon.missiles.fishingspear.desc=Tiny throwing spears that work well as an improvised weapon despite being designed for fishing.

items.equipment.weapon.missiles.forcecube.name=force cube
items.equipment.weapon.missiles.forcecube.ondeath=You killed yourself with your own Force Cube...
items.equipment.weapon.missiles.forcecube.stats_desc=This weapon spreads the force of its impact over a small area, hitting everything nearby.
items.equipment.weapon.missiles.forcecube.desc=These oddly-shaped magical cubes are small enough to hold in your hand, but are incredibly heavy.

items.equipment.weapon.missiles.heavyboomerang.name=heavy boomerang
items.equipment.weapon.missiles.heavyboomerang.stats_desc=This weapon circles back to the location it was thrown from after five turns.
items.equipment.weapon.missiles.heavyboomerang.desc=This large boomerang is difficult to wield effectively, but will deal considerable damage.

items.equipment.weapon.missiles.javelin.name=javelin
items.equipment.weapon.missiles.javelin.desc=These larger throwing spears are weighted to keep the spike at their tip foremost as they sail through the air.

items.equipment.weapon.missiles.kunai.name=kunai
items.equipment.weapon.missiles.kunai.stats_desc=This weapon is stronger against unaware enemies.
items.equipment.weapon.missiles.kunai.desc=These small knives are very powerful in the hands of a skilled user.

items.equipment.weapon.missiles.missileweapon.stats_known=This set of _tier-%1$d_ thrown weapons deals _%2$d-%3$d damage_ and requires _%4$d strength_ to use.
items.equipment.weapon.missiles.missileweapon.stats_unknown=Typically this set of _tier-%1$d_ thrown weapons deals _%2$d-%3$d damage_ and requires _%4$d strength_ to use.
items.equipment.weapon.missiles.missileweapon.stats_desc=
items.equipment.weapon.missiles.missileweapon.probably_too_heavy=Probably this weapon is too heavy for you.
items.equipment.weapon.missiles.missileweapon.distance=Thrown weapons are more accurate at range, but less accurate up close.
items.equipment.weapon.missiles.missileweapon.durability=Thrown weapons will wear out and break as they are used.
items.equipment.weapon.missiles.missileweapon.uses_left=This set of thrown weapons has _%d/%d_ uses left before one breaks.
items.equipment.weapon.missiles.missileweapon.unlimited_uses=This set is of such high quality that it will effectively last forever.
items.equipment.weapon.missiles.missileweapon.unknown_uses=Typically this set of thrown weapons will have _%d_ uses before one breaks.
items.equipment.weapon.missiles.missileweapon.curse_discover=This thrown weapon is cursed!
items.equipment.weapon.missiles.missileweapon.about_to_break=Your thrown weapon is about to break.
items.equipment.weapon.missiles.missileweapon.has_broken=One of your thrown weapons has broken.
items.equipment.weapon.missiles.missileweapon.dust=The thrown weapon crumbles to dust as you touch it.
items.equipment.weapon.missiles.missileweapon.break_upgraded_warn_desc=If the last thrown weapon in your enhanced thrown weapon set breaks, the set will be permanently lost. Are you sure you want to throw it?
items.equipment.weapon.missiles.missileweapon.break_upgraded_warn_yes=Yes
items.equipment.weapon.missiles.missileweapon.break_upgraded_warn_no=No
items.equipment.weapon.missiles.missileweapon$placeholder.name=thrown weapon

items.equipment.weapon.missiles.shuriken.name=shuriken
items.equipment.weapon.missiles.shuriken.stats_desc=Shurikens can be thrown instantly with a 20 turn cooldown.
items.equipment.weapon.missiles.shuriken.desc=These star-shaped pieces of metal with razor-sharp blades can be quickly thrown while on the move.
items.equipment.weapon.missiles.shuriken$shurikeninstanttracker.name=Shuriken Cooldown
items.equipment.weapon.missiles.shuriken$shurikeninstanttracker.desc=You have recently thrown a shuriken instantly, and must wait before doing it again. Shurikens can still be thrown, but at normal weapon speed.\n\nTurns Remaining: %s.

items.equipment.weapon.missiles.throwingclub.name=throwing club
items.equipment.weapon.missiles.throwingclub.stats_desc=This weapon doesn't stick to enemies and can be collected instantly.
items.equipment.weapon.missiles.throwingclub.desc=A fairly simple but durable thrown weapon, essentially a large rock fastened to a stick.

items.equipment.weapon.missiles.throwinghammer.name=throwing hammer
items.equipment.weapon.missiles.throwinghammer.stats_desc=This weapon doesn't stick to enemies and can be collected instantly.
items.equipment.weapon.missiles.throwinghammer.desc=These hefty hammers are designed to be thrown at an enemy. Their smooth all-metal construction means they are quite durable.

items.equipment.weapon.missiles.throwingknife.name=throwing knife
items.equipment.weapon.missiles.throwingknife.stats_desc=This weapon is stronger against unaware enemies.
items.equipment.weapon.missiles.throwingknife.desc=These lightweight knives are balanced to arc through the air right into their target.
items.equipment.weapon.missiles.throwingknife.discover_hint=One of the heroes starts with this item.

items.equipment.weapon.missiles.throwingspear.name=throwing spear
items.equipment.weapon.missiles.throwingspear.desc=These lightweight spears have thin frames which are designed to be thrown, and not thrusted.

items.equipment.weapon.missiles.throwingspike.name=throwing spike
items.equipment.weapon.missiles.throwingspike.desc=These durable pointed shafts of metal are meant to be thrown into distant enemies.
items.equipment.weapon.missiles.throwingspike.discover_hint=One of the heroes starts with this item.

items.equipment.weapon.missiles.throwingstone.name=throwing stone
items.equipment.weapon.missiles.throwingstone.desc=These stones are sanded down to make them able to be thrown with more power than a regular stone.
items.equipment.weapon.missiles.throwingstone.discover_hint=One of the heroes starts with this item.

items.equipment.weapon.missiles.tomahawk.name=tomahawk
items.equipment.weapon.missiles.tomahawk.stats_desc=This weapon inflicts _%1$d-%2$d bleed_ to its target.
items.equipment.weapon.missiles.tomahawk.typical_stats_desc=This weapon typically inflicts _%1$d-%2$d bleed_ to its target.
items.equipment.weapon.missiles.tomahawk.desc=These throwing axes have a serrated edge that tears as they stick to an enemy.

items.equipment.weapon.missiles.trident.name=trident
items.equipment.weapon.missiles.trident.desc=Massive throwing spears with three deadly prongs on the end. They are powerful, but quite heavy.


items.equipment.weapon.spiritbow.name=spirit bow
items.equipment.weapon.spiritbow.ac_shoot=SHOOT
items.equipment.weapon.spiritbow.prompt=Choose a target
items.equipment.weapon.spiritbow.stats=The bow cannot be directly upgraded, but will instead steadily grow stronger as you level up. At your current level, arrows shot from the bow will deal _%1$d-%2$d damage_ and require _%3$d strength_ to use properly.
items.equipment.weapon.spiritbow.desc=A bow made out of ancient magical wood. The bow's string and etchings glow with a pale blue light. When the string is pulled this bow will conjure a magical arrow which can be fired at an enemy.
items.equipment.weapon.spiritbow.discover_hint=One of the heroes starts with this item.

items.equipment.weapon.weapon.identify=You are now familiar enough with your weapon to identify it.
items.equipment.weapon.weapon.too_heavy=Because of your inadequate strength this weapon will hinder your attack speed, accuracy, and ability to surprise attack.
items.equipment.weapon.weapon.excess_str=Because of your excess strength, you will deal _0-%d bonus damage_ with this weapon.
items.equipment.weapon.weapon.hardening_gone=The hardening on this weapon has worn off!
items.equipment.weapon.weapon.incompatible=Interaction of different types of magic has negated the enchantment on this weapon!
items.equipment.weapon.weapon.cursed_worn=Because this weapon is cursed, you are powerless to remove it.
items.equipment.weapon.weapon.cursed=You can feel a malevolent magic lurking within this weapon.
items.equipment.weapon.weapon.weak_cursed=Despite the curse, you are able to unequip this weapon.
items.equipment.weapon.weapon.not_cursed=This weapon is free of malevolent magic.
items.equipment.weapon.weapon.faster=It is augmented to enhance _speed._
items.equipment.weapon.weapon.stronger=It is augmented to enhance _damage._
items.equipment.weapon.weapon.enchanted=it has a _%s._
items.equipment.weapon.weapon.enchant_hardened=It has been _hardened._
items.equipment.weapon.weapon.hardened_no_enchant=This weapon has been _hardened,_ but is not currently enchanted.
items.equipment.weapon.weapon$enchantment.enchant=enchantment
items.equipment.weapon.weapon$enchantment.rankings_desc=Killed by an enchantment
items.equipment.weapon.weapon$enchantment.discover_hint=You can find an item with this effect randomly in the dungeon, or try to apply it to an item yourself.


###misc items
items.amulet.name=amulet of yendor
items.amulet.ac_end=END THE GAME
items.amulet.desc=The Amulet of Yendor is the most powerful artifact known to human or dwarf kind. Its shimmering crystals contain incredible and wondrous power.
items.amulet.desc_origins=The origins of the amulet are unknown. History says that the King of Dwarves boasted that he had discovered the artifact shortly before the Dwarven civilization cut off all contact. How did he find it? How did Yog-Dzewa take it from him? Questions for another time perhaps, all that matters now is the amulet is yours!
items.amulet.desc_ascent=The origins of the amulet are unknown, but clearly it has been heavily influenced by Yog-Dzewa's power. The dungeon seems to be bending to Yog's will as you move through it, making enemies much more plentiful and powerful! You're also no longer able to activate or discard the amulet, almost as if it is cursed.
items.amulet.ascent_title=Ascension
items.amulet.ascent_desc=You begin to feel Yog-Dzewa's great and terrible power radiating from the amulet. Ascending back through the dungeon as a mortal might be more difficult than you thought!\n\nIf you continue ascending with the amulet the dungeon will become more dangerous, teleports between floors will be disabled, and you will only be able to win the game by defeating enemies as you ascend through the dungeon!\n\nYou can leave the amulet here for now if you want to ascend without starting this challenge, or activate the amulet before ascending to end the game normally.
items.amulet.ascent_yes=Continue!
items.amulet.ascent_no=Stop for Now
items.amulet.discover_hint=You can find this item at the bottom of the dungeon...

items.ankh.name=ankh
items.ankh.ac_bless=BLESS
items.ankh.bless=You bless the ankh with magical water.
items.ankh.desc=This ancient symbol of immortality grants the ability to return to life after death. Most items will be dropped where you died, but can be reclaimed if you return to it. Using a full waterskin, the ankh can be blessed with extra strength.
items.ankh.desc_blessed=This ancient symbol of immortality grants the ability to return to life after death. The ankh has been blessed and is now much stronger. The Ankh will sacrifice itself to save you in a moment of deadly peril.
items.ankh.discover_hint=You can buy this item in a shop.

items.arcaneresin.name=arcane resin
items.arcaneresin.prompt=Select a wand
items.arcaneresin.ac_apply=APPLY
items.arcaneresin.level_too_high=That wand is too powerful for resin to improve.
items.arcaneresin.not_enough=You don't have enough resin for that!
items.arcaneresin.apply=You coat your wand with resin, increasing its power!
items.arcaneresin.desc=This fine powder shimmers between shades of purple and white. It can act as an amplifier to magical energies, increasing the level of wands when it is applied to them!\n\nUpgrading a wand costs 1, 2, or 3 resin depending on the wand's initial level. Resin can upgrade wands to a maximum of +3.\n\nResin upgrades are _overridden by other upgrade sources_ however (such as scrolls of upgrade), and do not apply when imbuing a wand into the Mage's staff.
items.arcaneresin.discover_hint=You can craft this item via alchemy.

items.brokenseal.name=broken seal
items.brokenseal.ac_affix=AFFIX
items.brokenseal.prompt=Select an armor
items.brokenseal.unknown_armor=You must identify whether that armor is cursed or not first.
items.brokenseal.cursed_armor=The seal won't apply to cursed armor.
items.brokenseal.affix=You affix the seal to your armor!
items.brokenseal.desc=A wax seal, affixed to armor as a symbol of valor. It has a faded rune of protection engraved in the center, and is cracked in half across the middle.\n\nA memento from his home, the seal helps the warrior persevere. While wearing the seal the warrior will instantly gain shielding when he is about to be damaged to half health or lower.\n\nThe seal can be _affixed to armor,_ and moved between armors. It can carry a single upgrade with it, so long as that upgrade was applied to the armor while the seal was attached to it.
items.brokenseal.inscribed=The seal is inscribed with a _%s._
items.brokenseal.choose_title=Choose a Glyph
items.brokenseal.choose_desc=Both this armor and the broken seal are carrying a glyph. Pick which glyph should be kept.\n\nArmor Glyph: %1$s\nBroken Seal Glyph: %2$s\n\nNote that if you pick the glyph that is currently on the armor, the seal will not be able to transfer it later.
items.brokenseal.discover_hint=One of the heroes starts with this item.
items.brokenseal$warriorshield.name=Warrior Shield
items.brokenseal$warriorshield.desc_active=The Warrior's broken seal is currently helping him persevere, granting him shielding on top of his health. There is a cooldown after the shielding initially triggers before it can be used again.\n\nThis shield does not decay over time, but will end if no enemies are nearby for a few turns. When it ends, any unused shielding will reduce the cooldown, up to a max of 50%%.\n\nShield remaining: %1$d.\n\nCurrent Cooldown: %2$d.
items.brokenseal$warriorshield.desc_cooldown=The Warrior has recently gained shielding from his broken seal, and must wait until he can benefit from its shielding effect again.\n\nTurns Remaining: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=The Warrior's shield cooldown is currently negative, meaning that when his shield activates the cooldown will be lower than the usual 150 turns. The shield cooldown can be reduced to as low as -150 turns, which means it will immediately be available again once it is activated.\n\nCurrent cooldown: %d.

items.dewdrop.name=dewdrop
items.dewdrop.already_full=You already have full health.
items.dewdrop.desc=A crystal clear dewdrop.\n\nDue to the magic of this place, pure water has minor restorative properties.

items.equipableitem.curse_detected=You sense that the item is cursed just before you equip it!
items.equipableitem.unequip_cursed=You can't remove a cursed item!
items.equipableitem.ac_equip=EQUIP
items.equipableitem.ac_unequip=UNEQUIP

items.energycrystal.name=energy crystal
items.energycrystal.desc=A collection of small magical crystals, filled with alchemical energy.\n\nThese crystals are the most common ingredient in alchemy recipes and can be produced at an alchemy pot by scrapping consumable items.

items.gold.name=gold
items.gold.desc=A pile of gold coins. Collect gold coins to spend them later in a shop.

items.heap.for_sale=%1$dg: %2$s
items.heap.for_life=%2$s: %1$d life
items.heap.mimic=This is a mimic!
items.heap.chest=Chest
items.heap.chest_desc=You won't know what's inside until you open it!
items.heap.locked_chest=Locked chest
items.heap.locked_chest_desc=You won't know what's inside until you open it! But to open it you need a golden key.
items.heap.crystal_chest=Crystal chest
items.heap.crystal_chest_desc=You can see _%s_ inside, but to open the chest you need a crystal key.
items.heap.artifact=an artifact
items.heap.wand=a wand
items.heap.ring=a ring
items.heap.tomb=Tomb
items.heap.tomb_desc=This ancient tomb may contain something useful, but its owner will most certainly object to checking.
items.heap.skeleton=Skeletal remains
items.heap.skeleton_desc=This is all that's left of some unfortunate adventurer. Maybe it's worth checking for any valuables.
items.heap.remains=Hero's remains
items.heap.remains_desc=This is all that's left from one of your predecessors. Maybe it's worth checking for any valuables.

items.honeypot.name=honeypot
items.honeypot.ac_shatter=SHATTER
items.honeypot.desc=This large honeypot is only really lined with honey, instead it houses a giant bee! These sorts of massive bees usually stay in their hives, perhaps the pot is some sort of specialized trapper's cage? The bee seems pretty content inside the pot with its honey, and buzzes at you warily when you look at it.
items.honeypot$shatteredpot.name=shattered honeypot
items.honeypot$shatteredpot.desc=The pot has been shattered, only the sticky honey that lines its walls is holding it together, and it is slowly coming apart.\n\nDespite its broken state, the bee still seems to want to protect the pot.

items.item.prompt=Choose direction of throw
items.item.ac_drop=DROP
items.item.ac_throw=THROW
items.item.rankings_desc=Killed by: %s
items.item.curse=curse
items.item.custom_note_type=This type of item has a custom note: "_%s_"
items.item.custom_note=This item has a custom note: "_%s_"
items.item.discover_hint=You can find this item randomly in the dungeon.

items.kindofmisc.unequip_title=Unequip one item
items.kindofmisc.unequip_message=You must unequip one of these items first. Select an item to swap with.

items.kindofweapon.swift_equip=You swiftly equip your weapon.
items.kindofweapon.equip_cursed=Your grip involuntarily tightens around the weapon.
items.kindofweapon.which_equip_msg=Which weapon slot would you like to equip this item to?\n\nThe Champion directly attacks with her primary weapon, but can use the ability of either weapon. Both weapons share the same charge count.\n\nThe Champion can also swap her primary and secondary weapon instantly.
items.kindofweapon.which_equip_primary=Primary (%s)
items.kindofweapon.which_equip_secondary=Secondary (%s)

items.changeequip.name=equipment switch
items.changeequip.desc=Swaps the primary and secondary weapons and armor.
items.changeequip.ac_change=swap
items.changeequip.change=equipment switched
items.kindofweapon.empty=empty

items.kingscrown.name=Dwarf King's crown
items.kingscrown.ac_wear=WEAR
items.kingscrown.naked=Unfortunately, the crown cannot transform your underwear.
items.kingscrown.upgraded=The crown glows brightly and then disintegrates as your armor transforms!
items.kingscrown.ratgraded=Rat King's paws glow brightly as your armor transforms!
items.kingscrown.desc=The crown of the last dwarven king, it glows with tremendous magical energy.\n\nWhen worn, the crown's magic will flow into the armor you're currently wearing, transforming it into a _unique epic armor with special abilities._ The new armor will keep all the properties of the original armor.
items.kingscrown.discover_hint=You can get this item as a drop from certain enemies.

items.liquidmetal.name=liquid metal
items.liquidmetal.ac_apply=APPLY
items.liquidmetal.prompt=Select a thrown weapon
items.liquidmetal.already_fixed=That thrown weapon is already in perfect condition!
items.liquidmetal.apply=You use %d liquid metal to repair your thrown weapon.
items.liquidmetal.desc=This magical liquid can fill into the cracks and tears on a thrown weapon, restoring it to perfect condition! If a set of weapons is missing a weapon but otherwise fully repaired, then liquid metal can even be used to replace a missing weapon from the set!\n\nA tier 1 weapon requires 10 liquid metal to be fully repaired, a tier 5 weapon requires 30. Each upgrade also increases the amount of metal needed by 35%.\n\nLiquid metal cannot be used to repair the tips on tipped darts.
items.liquidmetal.discover_hint=You can craft this item via alchemy.

items.lostbackpack.name=lost backpack
items.lostbackpack.desc=This is your lost inventory. Collect it to reclaim all the items you lost!

items.merchantsbeacon.name=merchant's beacon
items.merchantsbeacon.ac_use=USE
items.merchantsbeacon.desc=This odd piece of dwarven technology allows you to communicate from great distances.\n\nAfter being activated, this beacon will let you sell items to Pixel Mart from anywhere in the dungeon.\n\nHowever, the magic within the beacon will only last for one session, so use it wisely.

items.stylus.name=arcane stylus
items.stylus.ac_inscribe=INSCRIBE
items.stylus.prompt=Select an armor
items.stylus.identify=You must identify whether that armor is cursed first.
items.stylus.cursed=The stylus's magic will not work on cursed armor.
items.stylus.inscribed=You inscribed your armor with the stylus.
items.stylus.desc=This arcane stylus is made of some dark, very hard stone. Using it you can inscribe a magical glyph on your armor, but you have no power over choosing what glyph it will be, the stylus will decide it for you.

items.tengusmask.name=Tengu's mask
items.tengusmask.ac_wear=WEAR
items.tengusmask.used=The mask disintegrates as its power flows into you!
