items.equipment.weapon.melee.sai$combostriketracker.desc=The Duelist is building combo that can be used to increase the damage of the combo strike ability. Each successful regular melee or thrown weapon attack will count, but not successfully attacking for 5 turns (15 after a kill) resets this combo.\n\nRecent hits: %1$d.\n\nTurns until hits are lost: %2$s.

items.equipment.weapon.melee.scimitar.name=scimitar
items.equipment.weapon.melee.scimitar.stats_desc=This is a rather fast weapon.
