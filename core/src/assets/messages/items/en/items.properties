items.equipment.artifacts.etherealchains.desc_cursed=The cursed chains are locked to your side, constantly swinging around, trying to trip or bind you.
items.equipment.artifacts.etherealchains.desc_equipped=The chains rest around your side, slowly siphoning the spiritual energy of those you defeat. Each charge is a link in the chain, which will extend out exactly one tile.
items.equipment.artifacts.etherealchains$chainsrecharge.levelup=Your chains grow stronger!

