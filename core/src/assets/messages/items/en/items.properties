items.skills.warriorskill.ac_special_three=SHIELD SPELL
items.skills.warriorskill.ac_special_four=SURPRISE ATTACK
items.skills.warriorskill.desc=_Armaments:_ gain a +5 weapon or armor and +2 strength for a time. At level 56, gain both, reinforced.\n\n_Fighting Arena (level 21):_ weaken nearby enemies and disarm and silence distant visible enemies. At level 56, strongly improve attack and defense.\n\n_Shield Spell (level 31):_ heal pets, gain a physical shield, strike adjacent enemies, and clear several ailments. At level 56, also gain magic and energy shields.\n\n_Surprise Attack (level 41):_ imbue attacks with blood and deal extra damage to full-health and badly wounded enemies. At level 56, permanently gain 1 maximum HP and temporarily gain 20%% more maximum HP.
items.skills.mageskill.name=Mage Skill
items.skills.mageskill.ac_special=CHAOS STORM
items.skills.mageskill.ac_special_two=SOUL SIPHON
items.skills.mageskill.ac_special_three=TIME PORTAL
items.skills.mageskill.ac_special_four=LIGHTNING ARRESTER
items.skills.mageskill.desc=_Chaos Storm:_ damage every nearby visible enemy with one of seven elements and apply its status. At level 56, also burn away walls at the four corners around you.\n\n_Soul Siphon (level 21):_ kills permanently grant maximum HP, while maximum HP is temporarily increased by 20%%. At level 56, cooldown is halved.\n\n_Time Portal (level 31):_ teleport and lose a level plus 10 permanent maximum HP. At level 56, maximum HP is not lost.\n\n_Lightning Arrester (level 41):_ create an identified +5 wand and recharge wands. At level 56, the wand is reinforced.
items.skills.huntressskill.name=Huntress Skill
items.skills.huntressskill.ac_special=HUNTER'S INSTINCT
items.skills.huntressskill.ac_special_two=LIGHT OF THE RUINS
items.skills.huntressskill.ac_special_three=NATURE'S HELP
items.skills.huntressskill.ac_special_four=ANCIENT PROTECTOR
items.skills.huntressskill.desc=_Hunter's Instinct:_ gain aimed shot, needling, and a random elemental weapon imbue. At level 56, gain every elemental imbue.\n\n_Light of the Ruins (level 21):_ gain a dew reward bag. At level 56, reinforce the first eligible equipped item.\n\n_Nature's Help (level 31):_ gain three missile weapons and summon a fairy. At level 56, summon the stronger sugarplum fairy.\n\n_Ancient Protector (level 41):_ root and seed nearby visible enemies, then summon a war tree.
items.skills.performerskill.name=Performer Skill
items.skills.performerskill.ac_special=SPECIAL DANCE
items.skills.performerskill.ac_special_two=CURTAIN CALL
items.skills.performerskill.ac_special_three=MAGIC TRICKS
items.skills.performerskill.ac_special_four=STUDY
items.skills.performerskill.desc=_Special Dance:_ charm and enrage every visible enemy while improving yourself. At level 56, cooldown is halved.\n\n_Curtain Call (level 21):_ damage, blind, and slow every visible enemy, leaving a seed beneath it. At level 56, also gain a bomb.\n\n_Magic Tricks (level 31):_ transmute a selected piece of equipment. At level 56, gain a transmutation ball.\n\n_Study (level 41):_ after 50 hostile kills, permanently improve attack, defense, magic, and maximum HP. At level 56, the improvement is doubled.
items.skills.soldierskill.name=Soldier Skill
items.skills.soldierskill.ac_special=MIRROR BOMBER
items.skills.soldierskill.ac_special_two=SUMMON MECH
items.skills.soldierskill.ac_special_three=CALL OF WAR
items.skills.soldierskill.ac_special_four=AIR DROP
items.skills.soldierskill.desc=_Mirror Bomber:_ create two fighting mirror images which explode when destroyed. At level 56, also clear several ailments.\n\n_Summon Mech (level 21):_ gain mechanical and physical armor. At level 56, both are doubled.\n\n_Call of War (level 31):_ gain a random item or summon item. At level 56, always gain a summon item.\n\n_Air Drop (level 41):_ drop missile weapons and food at the four corners around you. At level 56, the food is improved.
items.skills.soldierskill$seekingbomb.name=Bombing Robot
items.skills.soldierskill$seekingbomb.desc=A mirror fighter carrying an explosive charge. It detonates when destroyed.
items.skills.soldierskill$seekinghugebomb.name=Heavy Bombing Robot
items.skills.soldierskill$seekinghugebomb.desc=A leader's reinforced bombing robot. Its destruction triggers two explosions.
items.skills.followerskill.name=Follower Skill
items.skills.followerskill.ac_special=PARRY
items.skills.followerskill.ac_special_two=FUND RAISING
items.skills.followerskill.ac_special_three=BLASPHEMY
items.skills.followerskill.ac_special_four=BLESS SPELL
items.skills.followerskill.desc=_Parry:_ remaining still steadily increases attack and damage reduction, eventually consuming gold. At level 56, it charges twice as fast.\n\n_Fund Raising (level 21):_ call every creature toward you and gain random offerings based on their number. At level 56, also gain gold.\n\n_Blasphemy (level 31):_ exchange 40 permanent maximum HP for strength, attack, defense, magic, and permanent damage. At level 56, gain two damage stacks.\n\n_Bless Spell (level 41):_ upgrade a selected item. At level 56, also remove its curse.
items.skills.asceticskill.name=Ascetic Skill
items.skills.asceticskill.ac_special=OVERCLOCK
items.skills.asceticskill.ac_special_two=ENERGY IMBUE
items.skills.asceticskill.ac_special_three=REPROGRAM
items.skills.asceticskill.ac_special_four=EARTHQUAKE
items.skills.asceticskill.desc=_Overclock:_ double speed and raise attack damage, but take slightly more damage. At level 56, this has no cooldown.\n\n_Energy Imbue (level 21):_ create a great rune. At level 56, also create a random item.\n\n_Reprogram (level 31):_ trade one attack and defense point for two magic points. At level 56, also gain one random combat point.\n\n_Earthquake (level 41):_ destroy nearby walls, damage enemies, and build doors around you. At level 56, also blind and disorient enemies.
items.equipment.weapon.missiles.buildblock.doorblock.name=door block
items.equipment.weapon.missiles.buildblock.doorblock.desc=Throw this block onto an unoccupied tile to build a door there. It cannot cover wells, stairs, alchemy pots, or iron makers.
items.equipment.weapon.missiles.buildblock.plantpotblock.name=plant pot
items.equipment.weapon.missiles.buildblock.plantpotblock.desc=Throw this block onto an unoccupied tile to create a flower pot suitable for planting. It cannot cover wells, stairs, alchemy pots, or iron makers.
items.equipment.bags.shoppingcart.name=shopping cart
items.equipment.bags.shoppingcart.desc=A roomy shopping cart which holds food and brewed potions, but refuses bug meat.
items.equipment.bombs.lightbomb.name=holy bomb
items.equipment.bombs.lightbomb.desc=This bomb releases a burst of searing light. It blinds everything nearby and is especially destructive to unnatural creatures.
items.equipment.bombs.fishingbomb.name=fishing bomb
items.equipment.bombs.fishingbomb.desc=This bomb relocates nearby hostile creatures onto dry ground.
items.equipment.bombs.fishingbomb.no_tp=There is no dry ground available.
items.equipment.bombs.fishingbomb.tp=Something was pulled onto dry ground.
items.equipment.wands.wandofacid.name=Wand of Acid
items.equipment.wands.wandofacid.desc=This _earth type_ wand has a purple body which opens to a brilliant green gem.
items.equipment.wands.wandofacid.stats_desc=When used, this wand blasts emerald-green acid energy, dealing _%1$d-%2$d damage_ and sometimes coating the target in damaging acid.
items.equipment.wands.wandoffreeze.name=Wand of Freeze
items.equipment.wands.wandoffreeze.desc=This _water type_ wand seems to be made out of magical ice. It grows brighter toward its rounded tip. It feels very cold when held, but somehow your hand stays warm.
items.equipment.wands.wandoffreeze.stats_desc=This wand shoots icy energy, dealing _%1$d-%2$d damage_ and inflicting frostbite. In water, it can freeze the target completely. Already frozen targets are unaffected.
items.equipment.wands.wandoffirebolt.name=Wand of Firebolt
items.equipment.wands.wandoffirebolt.desc=This _fire type_ wand is made from red-lacquered wood with golden leaf used liberally to make it look quite regal. It crackles and hisses at the tip, eager to unleash its powerful magic.
items.equipment.wands.wandoffirebolt.stats_desc=This wand launches a firebolt that deals _%1$d-%2$d damage_, burns its target for 5 turns, and ignites the impact tile.
items.equipment.wands.wandoflight.name=Wand of Light
items.equipment.wands.wandoflight.desc=This _light type_ wand is made of a solid piece of translucent crystal, like a long chunk of smooth glass. Small bits of colorful light dance around its tip.
items.equipment.wands.wandoflight.stats_desc=This wand fires a wall-piercing ray that deals _%1$d-%2$d damage_, can blind its target, and burns undead and demonic creatures more severely.
items.equipment.wands.wandofswamp.name=Wand of Swamp
items.equipment.wands.wandofswamp.desc=This _earth type_ wand is made from a thin shaft of expertly carved wood. Somehow it is still alive, bright brown like a dead tree's core.
items.equipment.wands.wandofswamp.stats_desc=This wand shoots a bolt which explodes into a cloud of swamp gas at a targeted location, dealing _%1$d-%2$d damage_. Anything caught inside the cloud becomes vulnerable and increasingly slow.
items.equipment.wands.wandofcharm.name=Wand of Charm
items.equipment.wands.wandofcharm.desc=A fairly plainly shaped _light type_ wand, it stands out due to its magenta hue and pitch black gem at the tip.
items.equipment.wands.wandofcharm.stats_desc=This wand consumes half of its current charges and makes an enemy run amok while preventing it from directly attacking the caster.
items.equipment.wands.wandofflock.name=Wand of Flock
items.equipment.wands.wandofflock.desc=This _dark type_ wand looks like an ordinary wooden stick, but the gold fittings at both ends make it stand out.
items.equipment.wands.wandofflock.stats_desc=This wand summons one harmless magic sheep at the targeted location for _2 + wand level_ turns. Its body can block movement and its wool lashes out with dark damage when struck.
items.equipment.wands.wandofflock.guard=The magic has attracted the attention of a wisdom protector.
items.equipment.wands.wandofflock$magicsheep.name=magic sheep
items.equipment.wands.wandofflock$magicsheep.desc=This magic sheep cannot be killed. It stands in place until it disappears and retaliates when struck.
items.equipment.wands.wandofflock$magicbombsheep.name=BABA
items.equipment.wands.wandofflock$magicbombsheep.desc=LEVEL _TOO_ HARD, BABA _IS_ DONE. BETTER _LOOK_ OUT, BABA _HAS_ GUN.
items.equipment.wands.wandofmeteorite.name=Wand of Meteorite
items.equipment.wands.wandofmeteorite.desc=This _fire type_ wand is made of meteorite, with gold trim and a round black gem at the tip. It feels very weighty in your hand.
items.equipment.wands.wandofmeteorite.stats_desc=This wand calls a meteor onto the target, dealing _%1$d-%2$d damage_ on impact and a second, smaller hit throughout a 3x3 blast. The impact can paralyze its target and scorches flammable terrain.
items.equipment.wands.wandoferror.name=Wand of Error
items.equipment.wands.wandoferror.desc=It is an error.
items.equipment.wands.wandoferror.stats_desc=???
items.equipment.wands.wandoferror.no_teleport=The teleportation effect could not find a destination.
items.equipment.wands.wandoferror.teleported=%1$s teleported %2$s somewhere else.
items.equipment.wands.wandoferror.nothing=Nothing happened.
items.equipment.wands.wandoftcloud.name=Wand of Thundercloud
items.equipment.wands.wandoftcloud.desc=This _electrical_ wand is made of conductive metal, with a tiny black cloud at its tip. Fortunately, it is safe to hold.
items.equipment.wands.wandoftcloud.stats_desc=This wand creates electric currents at the target. With at least ten charges, it instead summons an autonomous thundercloud.
items.equipment.wands.wandoftcloud.more_charge=The wand does not have enough charge to summon a thundercloud.
items.equipment.wands.wandoftcloud$tcloud.name=Thundercloud
items.equipment.wands.wandoftcloud$tcloud.desc=A crackling thundercloud that attacks enemies automatically.
items.equipment.wands.wandoftcloud$stcloud.name=KEKE
items.equipment.wands.wandoftcloud$stcloud.desc=KEKE _IS_ MOVE, MOB _WILL_ DEAD.
items.equipment.weapon.melee.normalweapon.normalmeleeweapon.sps_stats=This weapon has _%1$sx_ accuracy, _%2$sx_ attack delay, and _%3$d_ reach.
items.equipment.weapon.melee.normalweapon.dagger.name=dagger
items.equipment.weapon.melee.normalweapon.dagger.desc=A simple iron dagger with a well worn wooden handle. --Watabou \nPuncture
items.equipment.weapon.melee.normalweapon.knuckles.name=knuckleduster
items.equipment.weapon.melee.normalweapon.knuckles.desc=A piece of iron shaped to fit around the knuckles. --Watabou \nCripple
items.equipment.weapon.melee.normalweapon.shortsword.name=short sword
items.equipment.weapon.melee.normalweapon.shortsword.desc=It is indeed quite short, just a few inches longer than a dagger. --Watabou \nRupture
items.equipment.weapon.melee.normalweapon.magebook.name=magic book
items.equipment.weapon.melee.normalweapon.magebook.desc=A magic book from the tower. It is hard to read. --Coconut \nBlunt
items.equipment.weapon.melee.normalweapon.handaxe.name=hand axe
items.equipment.weapon.melee.normalweapon.handaxe.desc=A light axe, most commonly used for felling trees. The wide blade works well against foes as well. --00-Evan \nRupture
items.equipment.weapon.melee.normalweapon.spear.name=spear
items.equipment.weapon.melee.normalweapon.spear.desc=A slender wooden rod tipped with sharpened iron. --Watabou \nCripple
items.equipment.weapon.melee.normalweapon.dualknive.name=dual sword
items.equipment.weapon.melee.normalweapon.dualknive.desc=Two razor sharp blades for more damage. --Bilboldev \nPuncture
items.equipment.weapon.melee.normalweapon.fightgloves.name=fight gloves
items.equipment.weapon.melee.normalweapon.fightgloves.desc=Simple leather and metal tips form this weapon. --Juh9870 \nBlunt
items.equipment.weapon.melee.normalweapon.nunchakus.name=nunchakus
items.equipment.weapon.melee.normalweapon.nunchakus.desc=Two short wooden rods connected by a strong rope. --Hmdzl001 \nBlunt+
items.equipment.weapon.melee.normalweapon.scimitar.name=scimitar
items.equipment.weapon.melee.normalweapon.scimitar.desc=A thick curved blade. Its shape allows for faster, yet less powerful attacks. --00-Evan \nRupture+
items.equipment.weapon.melee.normalweapon.whip.name=whip
items.equipment.weapon.melee.normalweapon.whip.desc=While the barbed length of rope deals poor damage, its reach cannot be matched. --00-Evan \nCripple+
items.equipment.weapon.melee.normalweapon.rapier.name=rapier
items.equipment.weapon.melee.normalweapon.rapier.desc=A thin, long and sharp weapon. --Snof33 \nPuncture+
items.equipment.weapon.melee.normalweapon.assassinsblade.name=assassins blade
items.equipment.weapon.melee.normalweapon.assassinsblade.desc=A small wavy blade made of obsidian, difficult to use despite being lightweight, but deadly if it finds the right mark. --00-Evan \nPuncture
items.equipment.weapon.melee.normalweapon.battleaxe.name=battle axe
items.equipment.weapon.melee.normalweapon.battleaxe.desc=The enormous steel head of this battle axe puts considerable heft behind each stroke. --Watabou \nRupture
items.equipment.weapon.melee.normalweapon.glaive.name=glaive
items.equipment.weapon.melee.normalweapon.glaive.desc=A polearm consisting of a sword blade on the end of a pole. --Watabou \nCripple
items.equipment.weapon.melee.normalweapon.club.name=club
items.equipment.weapon.melee.normalweapon.club.desc=A simple heavy wooden weapon. --Snof33 \nBlunt
items.equipment.weapon.melee.normalweapon.gsword.name=greatsword
items.equipment.weapon.melee.normalweapon.gsword.desc=This towering blade inflicts heavy damage by investing its heft into every swing. --00-Evan \nRupture
items.equipment.weapon.melee.normalweapon.halberd.name=halberd
items.equipment.weapon.melee.normalweapon.halberd.desc=The reach of a spear and the brutality of an axe are combined in this weapon. --Consideredhamster \nCripple
items.equipment.weapon.melee.normalweapon.warhammer.name=war hammer
items.equipment.weapon.melee.normalweapon.warhammer.desc=Few creatures can withstand this towering mass of lead and steel, but only the strongest adventurers can use it effectively. --Watabou \nBlunt
items.equipment.weapon.melee.normalweapon.lance.name=lance
items.equipment.weapon.melee.normalweapon.lance.desc=Stout iron bars connect to a huge cone, forming this weapon. --Hmdzl001 \nPuncture
items.equipment.weapon.enchantments.enchantmentdark.name=dark %s
items.equipment.weapon.enchantments.enchantmentdark.desc=This enchantment strikes fear into enemies, causing them to flee from the attacker. It also deals heavy dark damage.
items.equipment.weapon.enchantments.enchantmentfire.name=fire %s
items.equipment.weapon.enchantments.enchantmentfire.desc=This enchantment causes flames to spit forth from a weapon, burning enemies and terrain alike. It also deals light fire damage.
items.equipment.weapon.enchantments.enchantmentlight.name=shining %s
items.equipment.weapon.enchantments.enchantmentlight.desc=This enchantment strikes enemies with light and blinds them. It also deals heavy light damage.
items.equipment.weapon.enchantments.enchantmentenergy.name=energy %s
items.equipment.weapon.enchantments.enchantmentenergy.desc=This enchantment can improve the user's next attack. It also deals light energy damage.
items.equipment.weapon.enchantments.enchantmentearth.name=earth %s
items.equipment.weapon.enchantments.enchantmentearth.desc=This enchantment plants a seed in enemies which feeds nearby life. It also deals heavy earth damage.
items.equipment.weapon.enchantments.enchantmentshock.name=electric %s
items.equipment.weapon.enchantments.enchantmentshock.desc=This enchantment deals extra damage through a chain of nearby targets. It also deals heavy shock damage.
items.equipment.weapon.enchantments.enchantmentice.name=coldwave %s
items.equipment.weapon.enchantments.enchantmentice.desc=This enchantment slows an enemy's movement and attacks. It also deals heavy ice damage.
items.equipment.weapon.enchantments.enchantmentice2.name=ice %s
items.equipment.weapon.enchantments.enchantmentice2.desc=This enchantment causes frostbite. It also deals light ice damage.
items.equipment.weapon.enchantments.enchantmentdark2.name=incantation %s
items.equipment.weapon.enchantments.enchantmentdark2.desc=This enchantment curses enemies and causes delayed damage. It also deals light dark damage.
items.equipment.weapon.enchantments.enchantmentfire2.name=tar %s
items.equipment.weapon.enchantments.enchantmentfire2.desc=This enchantment coats the target in tar. It also deals heavy fire damage.
items.equipment.weapon.enchantments.enchantmentlight2.name=light %s
items.equipment.weapon.enchantments.enchantmentlight2.desc=This enchantment marks enemies for repeated holy-light strikes. It also deals light light damage.
items.equipment.weapon.enchantments.enchantmentenergy2.name=dance %s
items.equipment.weapon.enchantments.enchantmentenergy2.desc=This enchantment can improve the user's physical shield. It also deals heavy energy damage.
items.equipment.weapon.enchantments.enchantmentearth2.name=acid %s
items.equipment.weapon.enchantments.enchantmentearth2.desc=This enchantment can root and coat its target in ooze. It also deals light earth damage.
items.equipment.weapon.enchantments.enchantmentshock2.name=shock %s
items.equipment.weapon.enchantments.enchantmentshock2.desc=This enchantment can charge its target with static electricity. It also deals light shock damage.
items.consum.food.completefood.porksoup.name=pork soup
items.consum.food.completefood.porksoup.desc=Commercial soup became popular with the invention of canning in the 19th century, and today a great variety of canned and dried soups are on the market.\nMade from _1 vegetable, 1 meat, and 1 water_.
items.consum.food.completefood.meatroll.name=meat roll
items.consum.food.completefood.meatroll.desc=It is made from a scroll and meat. Yes, it needs a scroll.\nMade from _1 scroll and 1 meat_.
items.consum.food.completefood.ricegruel.name=rice gruel
items.consum.food.completefood.ricegruel.desc=More water, less rice.\nMade from _1 staple food and 2 water_.
items.consum.food.completefood.vegetablekebab.name=vegetable kebab
items.consum.food.completefood.vegetablekebab.desc=It is like a kebab, without meat.\nMade from _2 vegetables and 1 meat_.
items.consum.food.completefood.nutcookie.name=nut cookie
items.consum.food.completefood.nutcookie.desc=Six in one pack, with the strongest result blocking six heavy hits.\nMade from _5 nuts_.
items.consum.food.completefood.mixpizza.name=mixed pizza
items.consum.food.completefood.mixpizza.desc=Some people in the Tribe do not like it.\nMade from _1 staple food, 1 stone, 1 fruit, 1 meat, and 1 vegetable_.
items.consum.food.completefood.mooncake.name=moon cake
items.consum.food.completefood.mooncake.desc=Moon viewing during the Mid-Autumn Festival is one of the Bastion's many traditions.\nMade from _1 staple food and 2 nuts_.
items.consum.food.completefood.fruitcandy.name=fruit candy
items.consum.food.completefood.fruitcandy.desc=Making hard candy usually takes many steps, but here it is surprisingly simple.\nMade from _1 water, 1 fruit, and 1 stone_.
items.consum.food.completefood.chickennugget.name=chicken nugget
items.consum.food.completefood.chickennugget.desc=Although it is called a chicken nugget, there is no chicken in it.\nMade from _1 stone and 1 meat_.
items.consum.food.completefood.chocolate.name=chocolate
items.consum.food.completefood.chocolate.desc=Pure chocolate, and extremely bitter.\nMade from _5 nuts_.
items.consum.food.completefood.foodfans.name=silk noodles
items.consum.food.completefood.foodfans.desc=Cook thoroughly before eating.\nMade from _1 potion and 2 nuts_.
items.consum.food.completefood.frenchfries.name=French fries
items.consum.food.completefood.frenchfries.desc=Excess starch warning.\nMade from _1 scroll and 2 nuts_.
items.consum.food.completefood.fruitsalad.name=fruit salad
items.consum.food.completefood.fruitsalad.desc=In fact, making this food does not require any salad greens.\nMade from _2 fruits and 1 water_.
items.consum.food.completefood.gel.name=gel
items.consum.food.completefood.gel.desc=A lump of gel.\nMade from _1 stone and 1 water_.
items.consum.food.completefood.hamburger.name=giant hamburger
items.consum.food.completefood.hamburger.desc=It is enormous!\nMade from _2 staple foods, 1 vegetable, and 2 meats_.
items.consum.food.completefood.herbmeat.name=herb-seasoned meat
items.consum.food.completefood.herbmeat.desc=Meat tastes even better with herbs.\nMade from _1 seed and 1 meat_.
items.consum.food.completefood.honeygel.name=honey pudding
items.consum.food.completefood.honeygel.desc=Honey fills every part of this gel.\nMade from _1 gel and 1 honey_.
items.consum.food.completefood.honeymeat.name=honey-glazed steak
items.consum.food.completefood.honeymeat.desc=Honey poured over steak... very sweet.\nMade from _1 honey and 1 meat_.
items.consum.food.completefood.honeyrice.name=honey rice
items.consum.food.completefood.honeyrice.desc=My mouth is full of bees!\nMade from _1 staple food and 1 honey_.
items.consum.food.completefood.honeywater.name=honey water
items.consum.food.completefood.honeywater.desc=Honey diluted with water.\nMade from _2 waters and 1 honey_.
items.consum.food.completefood.icecream.name=ice feast
items.consum.food.completefood.icecream.desc=An enormous ice cream drizzled with honey. It looks refreshing.\nMade from _1 honey, 1 water, and 1 icecap seed_.
items.consum.food.completefood.kebab.name=large meat kebab
items.consum.food.completefood.kebab.desc=A large skewer loaded with meat.\nMade from _1 vegetable and 2 meats_.
items.consum.food.completefood.perfectfood.name=perfect lunch
items.consum.food.completefood.perfectfood.desc=The highest masterpiece of dungeon cooking.\nMade from _1 vegetable, 1 stone, 1 staple food, 1 water, and 1 fruit_; or from _1 fish cracker_.
items.consum.food.completefood.ricefood.name=refined rice
items.consum.food.completefood.ricefood.desc=Sometimes carefully prepared rice tastes better.\nMade from _1 staple food and 1 water_.
items.consum.food.completefood.vegetableroll.name=vegetable roll
items.consum.food.completefood.vegetableroll.desc=The vegetable-filled sibling of the meat roll.\nMade from _1 scroll and 1 vegetable_.
items.consum.food.completefood.vegetablesoup.name=vegetable soup
items.consum.food.completefood.vegetablesoup.desc=A soup made by cooking all kinds of vegetables together.\nMade from _1 water and 2 vegetables_.
items.equipment.weapon.missiles.arrows.blindfruit.name=shining fruit
items.equipment.weapon.missiles.arrows.blindfruit.desc=An artificially cultivated blindweed fruit. A direct hit disorients, silences, locks, and disarms its target; on impact with the ground it releases confusion gas and damaging light.
items.equipment.weapon.missiles.throwing.empbola.name=EMP bola
items.equipment.weapon.missiles.throwing.empbola.desc=A hunting tool which cripples and electrically shocks its target, removes energy armor, and heavily damages mechanical creatures.
items.misc.shovel.name=shovel
items.misc.shovel.ac_use=BREAK WALL
items.misc.shovel.ac_build=BUILD WALL
items.misc.shovel.not_wall=There is no breakable wall beside you.
items.misc.shovel.break=The shovel does not have enough charge.
items.misc.shovel.charge=Charge: %1$d / %2$d.
items.misc.shovel.desc=The performer found this shovel during the great prison escape. It can break adjacent walls or build new ones, and its charge recovers over time.
items.misc.gunofsoldier.name=pulse pistol
items.misc.gunofsoldier.ac_use=SHOOT
items.misc.gunofsoldier.prompt=Choose a target.
