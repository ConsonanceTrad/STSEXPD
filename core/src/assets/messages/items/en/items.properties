items.equipment.artifacts.masterthievesarmband.ac_goldtouch=S-GOLDTOUCH
items.equipment.artifacts.masterthievesarmband.no_charge=need more charge
items.equipment.artifacts.masterthievesarmband.cursed=It is cursed, and it is eating your gold.
items.equipment.artifacts.masterthievesarmband.no_target=no target here
items.equipment.artifacts.masterthievesarmband.level_up=master thieves armband level up
items.equipment.artifacts.masterthievesarmband.prompt=choose a target
items.equipment.artifacts.masterthievesarmband.desc=This purple velvet armband bears the mark of a master thief. This doesn't belong to you, but it probably didn't belong to its last user either.
items.equipment.artifacts.masterthievesarmband.desc_worn=You feel power building in the armband on your wrist as you gain experience. You can use this power to rob enemies!

items.equipment.artifacts.sandalsofnature.name=sandals of nature
items.equipment.artifacts.sandalsofnature.ac_feed=FEED
items.equipment.artifacts.sandalsofnature.ac_root=ROOT
items.equipment.artifacts.sandalsofnature.ac_sprout=S-SPROUT
items.equipment.artifacts.sandalsofnature.no_charge=They have no energy right now.
items.equipment.artifacts.sandalsofnature.prompt=Select a seed
items.equipment.artifacts.sandalsofnature.already_fed=Your footwear have already recently gained nutrients from that seed.
items.equipment.artifacts.sandalsofnature.levelup=Your footwear surges in size!
items.equipment.artifacts.sandalsofnature.absorb_seed=The footwear absorbs the seed, they seem healthier.
items.equipment.artifacts.sandalsofnature.prompt_target=Select a location
items.equipment.artifacts.sandalsofnature.out_of_range=That location is out of range.
items.equipment.artifacts.sandalsofnature.desc_0=What initially seem like sandals made of twine are actually two plants! They seem very weak and pale, perhaps they need to be given nutrients?
items.equipment.artifacts.sandalsofnature.desc_1=The footwear has grown and now more closely resemble two tailored shoes. Some colour has returned to them, perhaps they can still grow further?
items.equipment.artifacts.sandalsofnature.desc_2=The plants have grown again and now resembles a pair of solid boots made from bark. The plants seem to have regained their strength, but perhaps they can still grow further?
items.equipment.artifacts.sandalsofnature.desc_3=The plants seem to have reached their maximum size, they resemble a pair of armored greaves. The greaves are a deep brown and resemble a very sturdy tree.
items.equipment.artifacts.sandalsofnature.desc_hint=You feel more attuned with nature while wearing this artifact.
items.equipment.artifacts.sandalsofnature.desc_cursed=The cursed sandals are blocking any attunement with nature.
items.equipment.artifacts.sandalsofnature.desc_ability=The footwear has gained the ability to form up into a sort of immobile natural armour, but will need to charge up for it.
items.equipment.artifacts.sandalsofnature.desc_seeds=You have fed the footwear %d seeds.

items.equipment.artifacts.skeletonkey.name=skeleton key
items.equipment.artifacts.skeletonkey.ac_insert=INSERT
items.equipment.artifacts.skeletonkey.cursed=You can't use a cursed skeleton key.
items.equipment.artifacts.skeletonkey.prompt=Choose a target
items.equipment.artifacts.skeletonkey.invalid_target=There's nothing to lock or unlock there.
items.equipment.artifacts.skeletonkey.lock_no_space=You can't lock a character inside of a door!
items.equipment.artifacts.skeletonkey.iron_charges=Opening a regular lock requires 1 charge.
items.equipment.artifacts.skeletonkey.gold_charges=Opening a gold lock requires 2 charges.
items.equipment.artifacts.skeletonkey.lock_charges=Locking a door requires 2 charges.
items.equipment.artifacts.skeletonkey.wall_charges=Creating a temporary wall requires 2 charges.
items.equipment.artifacts.skeletonkey.crystal_charges=Opening a crystal lock requires 5 charges.
items.equipment.artifacts.skeletonkey.wont_open=The key refuses to fit into this lock for some reason.
items.equipment.artifacts.skeletonkey.locked_with_key=That door was locked by your skeleton key.
items.equipment.artifacts.skeletonkey.force_lock=The lock has weakened without your skeleton key. You manage to force it open.
items.equipment.artifacts.skeletonkey.discard=You discard your excess keys.
items.equipment.artifacts.skeletonkey.levelup=Your skeleton key grows stronger!
items.equipment.artifacts.skeletonkey.desc=An important-looking key with a head shaped like a skull. Its teeth seem to be different every time you look at them.
items.equipment.artifacts.skeletonkey.desc_worn=This magical key seems to gain power as you use it instead of the dungeon's regular keys. It can be inserted into almost any of the dungeon's locks to either open or close them, including doors that were never locked previously.\n\nThe key can even be used on empty space in a cardinal or diagonal direction to 'lock' the air in front of you, creating a 3 tile wide solid wall that lasts for 10 turns. Locking will push away enemies if there is space to do so.
items.equipment.artifacts.skeletonkey.desc_cursed=The cursed key seems to be actively avoiding fitting into any lock, and is even making it difficult (but not impossible) for you to use your other keys.
items.equipment.artifacts.skeletonkey$keywall.desc=A temporary magical wall has been placed here by the skeleton key.

items.equipment.artifacts.talismanofforesight.name=talisman of foresight
items.equipment.artifacts.talismanofforesight.ac_scry=SCRY
items.equipment.artifacts.talismanofforesight.ac_notice=S-NOTICE
items.equipment.artifacts.talismanofforesight.no_charge=Your talisman isn't fully charged yet.
items.equipment.artifacts.talismanofforesight.scry=The Talisman floods your mind with knowledge about the current floor.
items.equipment.artifacts.talismanofforesight.low_charge=The talisman requires at least 5% charge to scry.
