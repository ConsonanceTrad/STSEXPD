items.equipment.artifacts.talismanofforesight.levelup=Your Talisman grows stronger!
items.equipment.artifacts.talismanofforesight.full_charge=Your Talisman is fully charged!
items.equipment.artifacts.talismanofforesight.desc=A smooth stone with strange engravings on it. You feel like it's watching everything around you, keeping an eye out for anything unusual.
items.equipment.artifacts.talismanofforesight.desc_worn=When you hold the talisman you feel like your senses are heightened.
items.equipment.artifacts.talismanofforesight.desc_cursed=The cursed talisman is intently staring into you, making it impossible to concentrate.
items.equipment.artifacts.talismanofforesight$foresight.name=Foresight
items.equipment.artifacts.talismanofforesight$foresight.levelup=Your Talisman grows stronger!
items.equipment.artifacts.talismanofforesight$foresight.full_charge=Your Talisman is fully charged!
items.equipment.artifacts.talismanofforesight$foresight.uneasy=You feel uneasy.
items.equipment.artifacts.talismanofforesight$foresight.desc=You feel very nervous, as if there is nearby unseen danger.

items.equipment.artifacts.timekeepershourglass.name=timekeeper's hourglass
items.equipment.artifacts.timekeepershourglass.ac_activate=ACTIVATE
items.equipment.artifacts.timekeepershourglass.ac_restart=S-RESTART
items.equipment.artifacts.timekeepershourglass.in_use=Your hourglass is already in use.
items.equipment.artifacts.timekeepershourglass.deactivate=You deactivate the time freeze.
items.equipment.artifacts.timekeepershourglass.no_charge=Your hourglass hasn't recharged enough to be usable yet.
items.equipment.artifacts.timekeepershourglass.cursed=You cannot use a cursed hourglass.
items.equipment.artifacts.timekeepershourglass.onstasis=The world seems to shift around you in an instant.
items.equipment.artifacts.timekeepershourglass.onfreeze=Everything around you suddenly freezes.
items.equipment.artifacts.timekeepershourglass.stasis=Put myself in stasis
items.equipment.artifacts.timekeepershourglass.freeze=Freeze time around me
items.equipment.artifacts.timekeepershourglass.prompt=How would you like to use the hourglass's magic?\n\nWhile in stasis, time will move normally while you are frozen and completely invulnerable.\n\nWhen time is frozen, you can move as if your actions take no time. Note that attacking will break this.
items.equipment.artifacts.timekeepershourglass.desc=This large ornate hourglass looks fairly unassuming, but you feel a great power in its finely carved frame. As you rotate the hourglass and watch the sand pour you can feel its magic tugging at you, surely using this magic would give you some control over time.
items.equipment.artifacts.timekeepershourglass.desc_hint=The hourglass seems to have lost some sand, if only you could find some...
items.equipment.artifacts.timekeepershourglass.desc_cursed=The cursed hourglass is locked to your side, you can feel it trying to manipulate your flow of time.
items.equipment.artifacts.timekeepershourglass$timefreeze.name=Time Freeze
items.equipment.artifacts.timekeepershourglass$timefreeze.desc=Time is frozen around you, allowing you to perform actions instantly. The effect will last until it is cancelled or your hourglass runs out of charge. Attacking or using magic will break this effect as well.\n\nTurns until charge use: %s.
items.equipment.artifacts.timekeepershourglass$sandbag.name=bag of magic sand
items.equipment.artifacts.timekeepershourglass$sandbag.levelup=You add the sand to your hourglass.
items.equipment.artifacts.timekeepershourglass$sandbag.maxlevel=Your hourglass is filled with magical sand!
items.equipment.artifacts.timekeepershourglass$sandbag.no_hourglass=You have no hourglass to place this sand into.
items.equipment.artifacts.timekeepershourglass$sandbag.desc=This small bag of fine sand should work perfectly with your hourglass.\n\nIt seems odd that the shopkeeper would have this specific item right when you need it...

items.equipment.artifacts.unstablespellbook.name=unstable spellbook
items.equipment.artifacts.unstablespellbook.ac_read=READ
items.equipment.artifacts.unstablespellbook.ac_add=ADD
items.equipment.artifacts.unstablespellbook.ac_song=S-SONG
items.equipment.artifacts.unstablespellbook.blinded=You cannot read from the book while blinded.
items.equipment.artifacts.unstablespellbook.no_charge=Your spellbook is out of energy for now.
items.equipment.artifacts.unstablespellbook.cursed=You cannot read from a cursed spellbook.
items.equipment.artifacts.unstablespellbook.update=Spell book become powerful.
items.equipment.artifacts.unstablespellbook.dew_empty=dew is not enough.
items.equipment.artifacts.unstablespellbook.prompt=Select a scroll
items.equipment.artifacts.unstablespellbook.infuse_scroll=You infuse the scroll's energy into the book.
items.equipment.artifacts.unstablespellbook.unable_scroll=You are unable to add this scroll to the book.
items.equipment.artifacts.unstablespellbook.unknown_scroll=You're not sure what type of scroll this is yet.
items.equipment.artifacts.unstablespellbook.desc=This Tome is in surprising good condition given its age. It fizzes and crackles as you move the pages, surging with unstable energy. If you read from this book, there's no telling what spell you might cast.
items.equipment.artifacts.unstablespellbook.desc_cursed=The cursed book has bound itself to you, it is inhibiting your ability to use most scrolls.
items.equipment.artifacts.unstablespellbook.desc_index=Next upgrade this item needs %s dews.
items.equipment.artifacts.unstablespellbook.desc_empowered=The scrolls that you've added to the book are glowing with power. You will be able to choose the exotic version of these scroll's effects, but at the cost of an additional charge.
items.equipment.artifacts.unstablespellbook.read_empowered=The scroll you added to the spellbook surges with energy. You are able to channel either the regular, or exotic version of this scroll's effect.\n\nChoosing the exotic variant will cost 2 charges instead of 1.



###bags
items.equipment.bags.bag.name=backpack
items.equipment.bags.bag.discover_hint=You can buy this item in a shop.

items.equipment.bags.potionbandolier.name=potion bandolier
items.equipment.bags.potionbandolier.desc=This thick bandolier fits around your chest like a sash, it has many insulated straps on it to hold potion vials, your waterskin, or liquid metal vials.\n\nWhile inside the bandolier, your potions should be protected from the cold.

items.equipment.bags.scrollholder.name=scroll holder
items.equipment.bags.scrollholder.desc=This tubular container looks like it would hold an astronomer's tools and charts, but your scrolls will fit just as well. There's even a few side compartments which would nicely fit spell crystals, arcane styli, and arcane resin.\n\nThe holder doesn't look very flammable, so your scrolls should be safe from fire inside it.

items.equipment.bags.velvetpouch.name=velvet pouch
items.equipment.bags.velvetpouch.desc=This small velvet pouch can store many small items in it, such as seeds, runestones, and some alchemy ingredients.
items.equipment.bags.velvetpouch.discover_hint=One of the heroes starts with this item.

items.equipment.bags.magicalholster.name=magical holster
items.equipment.bags.magicalholster.desc=This slim holster is made from some exotic animal hide, and possesses powerful magic which lets it store a massive amount of ranged weapons.\n\nYou can simply reach into the bag and will always grab the item you were looking for.\n\nDue to the holster's magic, wands will charge slightly faster and thrown weapons will last slightly longer inside of it.



###bombs
items.equipment.bombs.arcanebomb.name=arcane bomb
items.equipment.bombs.arcanebomb.desc=This bomb has been imbued with arcane properties. It will explode into a powerful blast similar to Goo's pumped up attack, dealing _%1$d-%2$d magical damage_ to anything within 2 tiles.
items.equipment.bombs.arcanebomb.discover_hint=You can craft this item via alchemy.

items.equipment.bombs.bomb.name=bomb
items.equipment.bombs.bomb.ac_lightthrow=LIGHT & THROW
items.equipment.bombs.bomb.snuff_fuse=You quickly snuff the bomb's fuse.
items.equipment.bombs.bomb.ondeath=The explosion killed you...
items.equipment.bombs.bomb.rankings_desc=Killed by an explosion
items.equipment.bombs.bomb.desc=A fairly hefty black powder bomb. An explosion from this bomb deals _%1$d-%2$d damage_ to anything adjacent to it, and will destroy some adjacent terrain or items.
items.equipment.bombs.bomb.desc_fuse=It looks like the fuse will take a couple rounds to burn down once it is lit.
items.equipment.bombs.bomb.desc_burning=The bomb's fuse is burning away, keep your distance or put it out!

items.equipment.bombs.buildbomb.name=build bomb
items.equipment.bombs.buildbomb.desc=A handmade bomb that damages everything nearby. It is also used to craft other special bombs.

items.equipment.bombs.hugebomb.name=huge bomb
items.equipment.bombs.hugebomb.desc=This bomb causes a large explosion that can destroy nearby walls.
items.flag.name=flag
items.flag.desc=The 70th Anniversary of the Founding of the People's Republic of China.
items.equipment.bombs.bomb$doublebomb.name=two bombs
items.equipment.bombs.bomb$doublebomb.desc=A stack of two hefty black powder bombs, looks like you get one free!

items.equipment.bombs.firebomb.name=firebomb
items.equipment.bombs.firebomb.desc=This bomb has been modified to explode in a larger area, dealing _%1$d-%2$d damage_ and spreading sustained flame within 2 tiles.
items.equipment.bombs.firebomb.discover_hint=You can craft this item via alchemy.

items.equipment.bombs.flashbangbomb.name=flashbang
items.equipment.bombs.flashbangbomb.desc=This customized bomb will erupt into a blast of light, sound, and electricity when it explodes. Anything within 2 tiles will take _%1$d-%2$d damage_ from the explosion, an additional 25%% damage from the electricity, and be stunned for 10 turns.
items.equipment.bombs.flashbangbomb.discover_hint=You can craft this item via alchemy.

items.equipment.bombs.frostbomb.name=frost bomb
items.equipment.bombs.frostbomb.desc=This bomb has been modified to explode in a larger area, dealing _%1$d-%2$d damage_ and spreading a sustained gust of freezing air within 2 tiles.
items.equipment.bombs.frostbomb.discover_hint=You can craft this item via alchemy.

items.equipment.bombs.holybomb.name=holy bomb
items.equipment.bombs.holybomb.desc=This bomb has been modified to flash holy light in a larger area when it explodes. Anything within 2 tiles will take _%1$d-%2$d damage_ from the explosion, and undead or demonic enemies will take an additional 50%% damage from the holy light.
items.equipment.bombs.holybomb.discover_hint=You can craft this item via alchemy.

items.equipment.bombs.noisemaker.name=noisemaker
items.equipment.bombs.noisemaker.desc=This customized bomb will repeatedly make noise when its fuse runs out. When something touches the bomb, it will explode and deal _%1$d-%2$d damage_ to anything within 2 tiles!
items.equipment.bombs.noisemaker.desc_burning=The noisemaker is ticking away, it'll explode when something gets near!
items.equipment.bombs.noisemaker.discover_hint=You can craft this item via alchemy.

items.equipment.bombs.smokebomb.name=smoke bomb
items.equipment.bombs.smokebomb.desc=This bomb has been modified to spew a thick cloud of gas at the same time as exploding. It will deal _%1$d-%2$d damage_ and spread shrouding fog within 2 tiles.
items.equipment.bombs.smokebomb.discover_hint=You can craft this item via alchemy.

items.equipment.bombs.regrowthbomb.name=regrowth bomb
items.equipment.bombs.regrowthbomb.desc=This customized bomb will splash life-giving liquid everywhere within 3 tiles instead of exploding. The area caught in the blast will rapidly sprout grass and plants. Yourself and any allies caught in the blast will be healed as if they had drank a potion of healing.
items.equipment.bombs.regrowthbomb.discover_hint=You can craft this item via alchemy.

items.equipment.bombs.shrapnelbomb.name=shrapnel bomb
items.equipment.bombs.shrapnelbomb.desc=This bomb has been modified with scraps of DM-300's metal, which will fragment and fly everywhere when it explodes, dealing _%1$d-%2$d damage_ in a huge range around the bomb. You had better hide behind something when using it...
items.equipment.bombs.shrapnelbomb.discover_hint=You can craft this item via alchemy.

items.equipment.bombs.woollybomb.name=woolly bomb
items.equipment.bombs.woollybomb.desc=This customized bomb will create a wide field of magical sheep after exploding. The explosion will deal _%1$d-%2$d damage_ to anything within 2 tiles. The sheep will block movement and persist for a very long time! The sheep will not last as long in the presence of powerful enemies though, and can be manually dispelled sooner by interacting with them.
items.equipment.bombs.woollybomb.discover_hint=You can craft this item via alchemy.

###food
items.consum.food.berry.name=dungeon berry
items.consum.food.berry.eat_msg=That berry was tasty!
items.consum.food.berry.desc=This small berry was found by the Huntress among the dungeon's vegetation. It can be eaten quickly, restores a small amount of satiety, and might contain a usable seed!
items.consum.food.berry.discover_hint=You can find this item using a specific hero talent.

items.consum.food.blandfruit.name=blandfruit
items.consum.food.blandfruit.cooked=cooked blandfruit
items.consum.food.blandfruit.sunfruit=sunfruit
items.consum.food.blandfruit.rotfruit=rotfruit
items.consum.food.blandfruit.earthfruit=earthfruit
items.consum.food.blandfruit.blindfruit=blindfruit
items.consum.food.blandfruit.firefruit=firefruit
items.consum.food.blandfruit.icefruit=icefruit
items.consum.food.blandfruit.fadefruit=fadefruit
items.consum.food.blandfruit.sorrowfruit=sorrowfruit
items.consum.food.blandfruit.stormfruit=stormfruit
items.consum.food.blandfruit.dreamfruit=magefruit
items.consum.food.blandfruit.starfruit=starfruit
items.consum.food.blandfruit.swiftfruit=swiftfruit
items.consum.food.blandfruit.raw=You can't bear to eat it raw.
items.consum.food.blandfruit.desc=So dry and insubstantial, perhaps stewing it with another ingredient would improve it.
items.consum.food.blandfruit.desc_cooked=The fruit has plumped up from its time soaking in the pot and has even absorbed the properties of the seed it was cooked with. It will have the effect of whatever potion the seed corresponded to.
items.consum.food.blandfruit.desc_eat=It looks ready to be eaten!
items.consum.food.blandfruit.desc_throw=It seems pretty volatile, it might be best to throw it.
items.consum.food.blandfruit$chunks.name=blandfruit chunks
items.consum.food.blandfruit$chunks.desc=The blandfruit has exploded on impact, leaving inert chunks behind.\n\nDespite a bit of dirt, these large chunks of cooked blandfruit seem perfectly edible.

items.consum.food.chargrilledmeat.name=chargrilled meat
items.consum.food.chargrilledmeat.desc=It looks like a decent steak.
items.consum.food.firemeat.name=fire meat
items.consum.food.firemeat.desc=A piece of meat radiating a warm red glow.
items.consum.food.firemeat.eat_msg=That meat was hot!
items.consum.food.chargrilledmeat.discover_hint=You can create this using another food item.

items.consum.food.food.name=ration of food
items.consum.food.food.ac_eat=EAT
items.consum.food.food.eat_msg=That food tasted delicious!
items.consum.food.food.locked=Locked magic prevents you from eating this food.
items.consum.food.food.desc=Nothing fancy here: dried meat, some biscuits - things like that.

items.consum.food.frozencarpaccio.name=frozen carpaccio
items.consum.food.frozencarpaccio.invis=You see your hands turn invisible!
items.consum.food.frozencarpaccio.hard=You feel your skin harden!
items.consum.food.frozencarpaccio.refresh=Refreshing!
items.consum.food.frozencarpaccio.better=You feel better!
items.consum.food.frozencarpaccio.desc=It's a piece of frozen raw meat. The only way to eat it is by cutting thin slices of it. And this way it's surprisingly good.
items.consum.food.frozencarpaccio.discover_hint=You can create this using another food item.

items.consum.food.meatpie.name=meat pie
items.consum.food.meatpie.eat_msg=That food was incredible!
items.consum.food.meatpie.desc=A delicious pie filled with savoury meat. This will satiate you far more than any other meal.
items.consum.food.meatpie.discover_hint=You can craft this item via alchemy.

items.consum.food.mysterymeat.name=mystery meat
items.consum.food.mysterymeat.eat_msg=That food tasted... strange.
items.consum.food.mysterymeat.hot=Oh it's hot!
items.consum.food.mysterymeat.legs=You can't feel your legs!
items.consum.food.mysterymeat.not_well=You are not feeling well.
items.consum.food.mysterymeat.stuffed=You are stuffed.
items.consum.food.mysterymeat.desc=Eat at your own risk!
items.consum.food.mysterymeat.discover_hint=You can get this item as a drop from certain enemies.
items.consum.food.mysterymeat$placeholder.name=meat

items.consum.food.phantommeat.name=phantom meat
items.consum.food.phantommeat.desc=A large glistening translucent steak, cut from a phantom piranha. This magical meat doesn't need to be cooked and grants a number of defensive benefits in addition to fully satiating you. When eaten it will grant invisibility, barkskin, some healing, and cures many harmful effects.
items.consum.food.phantommeat.discover_hint=You can get this item as a drop from certain enemies.

items.consum.food.pasty.name=pasty
items.consum.food.pasty.fish_name=steamed fish
items.consum.food.pasty.amulet_name=amulet of yendor?
items.consum.food.pasty.egg_name=easter egg
items.consum.food.pasty.rainbow_name=rainbow potion
items.consum.food.pasty.shattered_name=green cake
items.consum.food.pasty.pie_name=pumpkin pie
items.consum.food.pasty.vanilla_name=blue cake
items.consum.food.pasty.cane_name=candy cane
items.consum.food.pasty.sparkling_name=sparkling potion
items.consum.food.pasty.desc=An authentic Cornish pasty with a traditional filling of beef and potato. Delicious!
items.consum.food.pasty.fish_desc=A whole steamed fish, magically preserved on a bed of greens. It's tradition to save some fish for later around this time of year, so you'll keep some leftovers instead of eating it all at once.\n\nHappy Lunar New Year!
items.consum.food.pasty.amulet_desc=You've finally found it, the magical amulet of - wait a minute, this is just a foil-wrapped chocolate made to look like the amulet! It won't grant you limitless power, but at least it'll fill you up and give you a little artifact charge.\n\nApril Fools!
items.consum.food.pasty.egg_desc=A great big chocolate egg, wrapped in colorful yellow foil. There's easily enough chocolate here to fill you up, and the sugar might give your artifacts a tiny bit of extra charge.\n\nHappy Easter!
items.consum.food.pasty.rainbow_desc=This colorful potion is a kind of liquid food. In addition to satisfying your hunger, it has a little magic in it which will calm an adjacent non-boss enemy, making them temporarily hesitant to fight you.\n\nHappy Pride!
items.consum.food.pasty.shattered_desc=This large slice of vanilla cake has colorful sprinkles and green frosting. The cake was made to celebrate years of experience, and will grant a small amount of that experience to you when eaten.\n\nShattered Pixel Dungeon was first released on August 5th 2014. Happy birthday Shattered Pixel Dungeon!
items.consum.food.pasty.pie_desc=A great big slice of pumpkin pie. Its sweet and spicy flavor will fill you up and give you a tiny bit of healing.\n\nHappy Halloween!
items.consum.food.pasty.vanilla_desc=This large slice of vanilla cake has colorful sprinkles and blue frosting. The cake was made to celebrate years of experience, and will grant a small amount of that experience to you when eaten.\n\nThe original Pixel Dungeon was first released on December 4th 2012. Happy birthday Pixel Dungeon!
items.consum.food.pasty.cane_desc=A huge sugary sweet candy cane. It's big enough to fill you up, and the sugar might give your wands a tiny bit of extra charge too.\n\nHappy Holidays!
items.consum.food.pasty.sparkling_desc=This sparkling potion is a kind of liquid food. It satisfies hunger and simulates sparkling wine, but isn't actually alcoholic. The warm feeling in your belly will grant a little bit of shielding.\n\nHappy New Year!
items.consum.food.pasty$fishleftover.name=fish leftovers
items.consum.food.pasty$fishleftover.eat_msg=That food tasted ok.
items.consum.food.pasty$fishleftover.desc=Some surplus fish from your previous meal. You can eat it any time you like to restore a little hunger.

items.consum.food.smallration.name=small food ration
items.consum.food.smallration.eat_msg=That food tasted ok.
items.consum.food.smallration.desc=It looks exactly like a standard ration of food but smaller.
items.consum.food.smallration.discover_hint=You can buy this item in a shop.

items.consum.food.stewedmeat.name=stewed meat
items.consum.food.stewedmeat.eat_msg=That food tasted ok.
items.consum.food.stewedmeat.desc=Stewing the meat has cleansed it of any disease or parasites. It should be safe to eat.
items.consum.food.stewedmeat.discover_hint=You can craft this item via alchemy.

items.consum.food.supplyration.name=supply ration
items.consum.food.supplyration.desc=This ration was left in the dungeon by and for members of the thieves guild. It's specifically designed to be eaten on the go, and aid with general skullduggery.\n\nWhile it doesn't fill you up as much as a regular ration, it can be eaten quickly, provides a little direct healing, and will restore a charge to the Rogue's cloak of shadows.
items.consum.food.supplyration.discover_hint=You can find this item using a specific hero talent.



##journal items
items.specific.journal.documentpage.name=torn page
items.specific.journal.documentpage.desc=A lone page, probably torn from a book of some sort. You'll need to pick it up to read it.

items.specific.journal.alchemypage.name=torn alchemy book page
items.specific.journal.alchemypage.desc=A torn page from a guidebook on alchemy.\n\nMost of the text is too small to read at a distance, but you can make out the title of the page:\n\n_"%s"_

items.specific.journal.guidebook.name=tome of dungeon mastery
items.specific.journal.guidebook.hint_mobile=Your guidebook has advice for you! Tap the flashing journal button on the top-right to read it.
items.specific.journal.guidebook.hint_desktop=Your guidebook has advice for you! Select the flashing journal button (%s) on the top-right to read it.
items.specific.journal.guidebook.hint_status=Guidebook
items.specific.journal.guidebook.desc=An adventurer's guidebook, left here by someone who decided adventuring wasn't for them! This particular book is magical, and can prompt adventurers to read a page at the right moment.\n\nDespite that functionality, the book is most popular because of the big words "Don't Panic!" written in large friendly letters on the cover.

items.specific.journal.guidepage.name=torn guidebook page
items.specific.journal.guidepage.desc=A torn page from an adventuring guidebook.\n\nMost of the text is too small to read at a distance, but you can make out the title of the page:\n\n_"%s"_

items.specific.journal.regionlorepage$sewers.name=worn letter
items.specific.journal.regionlorepage$sewers.desc=What looks to be a letter, written on a dirt-stained piece of paper. You'll need to pick it up to be able to make out what's written on it.

items.specific.journal.regionlorepage$prison.name=worn journal entry
items.specific.journal.regionlorepage$prison.desc=A journal entry, or some other kind of record, written on an old piece of paper. It seems to have fared better than the letters you found in the sewers, but you'll still need to pick it up to read it.

items.specific.journal.regionlorepage$caves.name=old log entry
items.specific.journal.regionlorepage$caves.desc=What looks to be an entry in an explorer's logbook, preserved surprisingly well despite how old it must be. Pick it up to read it.

items.specific.journal.regionlorepage$city.name=rusted tablet
items.specific.journal.regionlorepage$city.desc=A small rusted metal tablet with a message magically etched into it. The letters are still clear despite the tablet's age, but you'll have to pick it up to read it.

items.specific.journal.regionlorepage$halls.name=glowing tablet
items.specific.journal.regionlorepage$halls.desc=A small black tablet with glowing green letters etched into it. The glowing letters blur together into a haze at a distance, you'll have to pick it up to read it.


###keys
items.specific.keys.goldenkey.name=golden key
items.specific.keys.goldenkey.desc=The notches on this golden key are tiny and intricate. Perhaps it will open a locked chest?

items.specific.keys.crystalkey.name=Crystal key
items.specific.keys.crystalkey.desc=The cut surfaces of this crystalline key shimmer in the darkness. Perhaps it will open something made of crystal?

items.specific.keys.ironkey.name=iron key
items.specific.keys.ironkey.desc=The notches on this ancient iron key are well worn; its leather lanyard is battered by age. What door might it open?

items.specific.keys.wornkey.name=worn key
items.specific.keys.wornkey.desc=This key is worn and discolored, but looks serious. Probably it can open some serious door nearby.



###potions
items.consum.potions.potion.ac_drink=DRINK
items.consum.potions.potion.turquoise=turquoise potion
items.consum.potions.potion.crimson=crimson potion
items.consum.potions.potion.azure=azure potion
items.consum.potions.potion.jade=jade potion
items.consum.potions.potion.golden=golden potion
items.consum.potions.potion.magenta=magenta potion
items.consum.potions.potion.charcoal=charcoal potion
items.consum.potions.potion.ivory=ivory potion
items.consum.potions.potion.amber=amber potion
items.consum.potions.potion.bistre=bistre potion
items.consum.potions.potion.indigo=indigo potion
items.consum.potions.potion.silver=silver potion
items.consum.potions.potion.unknown_desc=This flask contains a swirling colorful liquid. Who knows what it will do when drunk or thrown?
items.consum.potions.potion.harmful=Harmful potion!
items.consum.potions.potion.beneficial=Beneficial potion
items.consum.potions.potion.yes=Yes, I know what I'm doing
items.consum.potions.potion.no=No, I changed my mind
items.consum.potions.potion.sure_drink=Are you sure you want to drink it? In most cases you should throw such potions at your enemies.
items.consum.potions.potion.sure_throw=Are you sure you want to throw it? In most cases it makes sense to drink it.
items.consum.potions.potion.shatter=The flask shatters and the liquid splashes harmlessly.
items.consum.potions.potion.discover_hint=You can find this item randomly in the dungeon, or craft it via alchemy.
items.consum.potions.potion$placeholder.name=potion
items.consum.potions.potion$seedtopotion.name=Random Potion

items.consum.potions.potionofexperience.name=potion of experience
items.consum.potions.potionofexperience.desc=The storied experiences of multitudes of battles reduced to liquid form, this draught will instantly raise your experience level.

items.consum.potions.potionoffrost.name=potion of frost
items.consum.potions.potionoffrost.desc=The chemical contained in this potion will evaporate into a freezing cloud upon exposure to open air.

items.consum.potions.potionofhaste.name=potion of haste
items.consum.potions.potionofhaste.energetic=You feel energetic!
items.consum.potions.potionofhaste.desc=Drinking this oddly sweet liquid will imbue you with tremendous energy for a short time, allowing you to run at high speeds.

items.consum.potions.potionofhealing.name=potion of healing
items.consum.potions.potionofhealing.heal=Your wounds begin to close.
items.consum.potions.potionofhealing.desc=This elixir will rapidly restore your health and instantly cure many ailments.

items.consum.potions.potionofinvisibility.name=potion of invisibility
items.consum.potions.potionofinvisibility.invisible=You see your hands turn invisible!
items.consum.potions.potionofinvisibility.desc=Drinking this potion will render you temporarily invisible. While invisible, enemies will be unable to see you. Physical attacks and magical effects (such as scrolls and wands) will immediately cancel invisibility.

items.consum.potions.potionoflevitation.name=potion of levitation
items.consum.potions.potionoflevitation.float=You float into the air!
items.consum.potions.potionoflevitation.desc=Drinking this curious liquid will cause you to hover in the air, able to drift effortlessly over traps and pits. Throwing this potion will create a cloud of unrefined gas, disorienting anything caught in it.

items.consum.potions.potionofliquidflame.name=potion of liquid flame
items.consum.potions.potionofliquidflame.desc=This flask contains an unstable compound which will burst violently into flame upon exposure to open air.

items.consum.potions.potionofmindvision.name=potion of mind vision
items.consum.potions.potionofmindvision.see_mobs=You can somehow feel the presence of other creatures' minds!
items.consum.potions.potionofmindvision.see_none=You can somehow tell that you are alone on this level at the moment.
items.consum.potions.potionofmindvision.desc=After drinking this, your mind will become attuned to the psychic signature of distant creatures, enabling you to sense biological presences through walls. Also this potion will permit you to see through nearby walls and doors.

items.consum.potions.potionofparalyticgas.name=potion of paralytic gas
items.consum.potions.potionofparalyticgas.desc=Upon exposure to open air, the liquid in this flask will vaporize into a numbing yellow haze. Anyone who inhales the cloud will be paralyzed instantly, unable to move for some time after the cloud dissipates. This item can be thrown at distant enemies to catch them within the effect of the gas.

items.consum.potions.potionofpurity.name=potion of purity
items.consum.potions.potionofpurity.freshness=You feel uncommon freshness in the air.
items.consum.potions.potionofpurity.protected=A protective film envelops you!
items.consum.potions.potionofpurity.desc=This magical reagent will quickly neutralize all harmful area-bound effects in a large area. Drinking it will give you temporary immunity to such effects.

items.consum.potions.potionofstrength.name=potion of strength
items.consum.potions.potionofstrength.msg=Newfound strength surges through your body, you now have %d strength!
items.consum.potions.potionofstrength.desc=This powerful liquid will course through your muscles, permanently increasing your strength by one point.

items.consum.potions.potionoftoxicgas.name=potion of toxic gas
items.consum.potions.potionoftoxicgas.desc=Uncorking or shattering this pressurized glass will cause its contents to explode into a deadly cloud of toxic green gas. You might choose to fling this potion at distant enemies instead of uncorking it by hand.



###brews
items.consum.potions.brews.brew.discover_hint=You can craft this item via alchemy.

items.consum.potions.brews.aquabrew.name=aqua brew
items.consum.potions.brews.aquabrew.desc=When shattered, this brew will release a burst of pressurized water at its location. It's only forceful enough to damage fiery enemies, but it also spreads water to nearby terrain, disables traps, douses fires, and knocks back characters near the burst.

items.consum.potions.brews.blizzardbrew.name=blizzard brew
items.consum.potions.brews.blizzardbrew.desc=When shattered, this brew will unleash a swirling blizzard which quickly spreads like a gas.

items.consum.potions.brews.causticbrew.name=caustic brew
items.consum.potions.brews.causticbrew.desc=This brew will spread corrosive ooze in a wide area around the location it shatters in. Anything caught by the ooze will slowly melt if it can't wash it off in water.

items.consum.potions.brews.infernalbrew.name=infernal brew
items.consum.potions.brews.infernalbrew.desc=When shattered, this brew will unleash a raging inferno which quickly spreads like a gas.

items.consum.potions.brews.shockingbrew.name=shocking brew
items.consum.potions.brews.shockingbrew.desc=When shattered, this brew will unleash an electrical storm in a wide area around the location it breaks at.

items.consum.potions.brews.unstablebrew.name=unstable brew
items.consum.potions.brews.unstablebrew.desc=This magical brew glows with shifting colors of the rainbow.\n\nWhen drank or thrown it will trigger the effect of a random potion. The potion effect will always be beneficial if it is drank, and will always be harmful if it is thrown.

###elixirs
items.consum.potions.elixirs.elixir.discover_hint=You can craft this item via alchemy.

items.consum.potions.elixirs.elixirofarcanearmor.name=elixir of arcane armor
items.consum.potions.elixirs.elixirofarcanearmor.desc=This elixir will grant the drinker a long lasting resistance to magical damage.

items.consum.potions.elixirs.elixirofaquaticrejuvenation.name=elixir of aquatic rejuvenation
items.consum.potions.elixirs.elixirofaquaticrejuvenation.desc=This elixir contains the remains of Goo enhanced with a healing potion. While it will not provide immediate healing, it will steadily restore a greater amount of health while you are standing in water.
items.consum.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=aquatic healing
items.consum.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=You have temporarily gained restorative properties similar to that of Goo.\n\nWhile standing in water, you will recover a small amount of health per turn. The effect is paused when you are at full health or are out of water.\n\nHealing left: %d.

items.consum.potions.elixirs.elixirofdragonsblood.name=elixir of dragon's blood
items.consum.potions.elixirs.elixirofdragonsblood.desc=When consumed, this elixir will send fiery power coursing through the drinker's veins. This effect will make the drinker immune to fire, and allow them to set enemies aflame with physical attacks.

items.consum.potions.elixirs.elixiroffeatherfall.name=elixir of feather fall
items.consum.potions.elixirs.elixiroffeatherfall.light=You feel light as a feather!
items.consum.potions.elixirs.elixiroffeatherfall.desc=This elixir offers a weaker but more controlled levitation effect, allowing the drinker to fall great distances without harm for a little while.
items.consum.potions.elixirs.elixiroffeatherfall$featherbuff.name=feather fall
items.consum.potions.elixirs.elixiroffeatherfall$featherbuff.desc=You are under the effects of a feather fall elixir, allowing you to fall into chasms without taking damage!\n\nTurns remaining: %s.

items.consum.potions.elixirs.elixirofhoneyedhealing.name=elixir of honeyed healing
items.consum.potions.elixirs.elixirofhoneyedhealing.desc=This elixir combines healing with the sweetness of honey. When drank, it will apply the same effect as a potion of healing and satisfy a small amount of hunger, but it can also be thrown to heal an ally.\n\nCreatures with an affinity for honey might be pacified if this item is used on them.

items.consum.potions.elixirs.elixiroficytouch.name=elixir of icy touch
items.consum.potions.elixirs.elixiroficytouch.desc=When consumed, this elixir will allow the drinker to sap the heat from enemies they attack. This effect will make the drinker immune to the cold, and allow them to chill enemies with physical attacks.

items.consum.potions.elixirs.elixirofmight.name=elixir of might
items.consum.potions.elixirs.elixirofmight.msg=Newfound strength surges through your body, you now have %d strength!
items.consum.potions.elixirs.elixirofmight.desc=This powerful liquid will course through your muscles, permanently increasing your strength by one point and temporarily increasing maximum health by %d points. The health boost scales with your maximum health, but will slowly wear off as you gain levels.
items.consum.potions.elixirs.elixirofmight$htboost.name=max health boost
items.consum.potions.elixirs.elixirofmight$htboost.desc=Your body feels unnaturally strong and healthy.\n\nYour maximum health is boosted for an extended period of time. As you gain levels, the boost will steadily fade.\n\nCurrent boost amount: %d.\nLevels remaining: %d.

items.consum.potions.elixirs.elixiroftoxicessence.name=elixir of toxic essence
items.consum.potions.elixirs.elixiroftoxicessence.desc=When consumed, this elixir will imbue the drinker with toxic energy. The drinker will continuously spread toxic gas as they move, and will be immune to toxic gas and poison for slightly longer than the duration of the effect.



###exotic potions
items.consum.potions.exotic.exoticpotion.turquoise=exotic turquoise potion
items.consum.potions.exotic.exoticpotion.crimson=exotic crimson potion
items.consum.potions.exotic.exoticpotion.azure=exotic azure potion
items.consum.potions.exotic.exoticpotion.jade=exotic jade potion
items.consum.potions.exotic.exoticpotion.golden=exotic golden potion
items.consum.potions.exotic.exoticpotion.magenta=exotic magenta potion
items.consum.potions.exotic.exoticpotion.charcoal=exotic charcoal potion
items.consum.potions.exotic.exoticpotion.ivory=exotic ivory potion
items.consum.potions.exotic.exoticpotion.amber=exotic amber potion
items.consum.potions.exotic.exoticpotion.bistre=exotic bistre potion
items.consum.potions.exotic.exoticpotion.indigo=exotic indigo potion
items.consum.potions.exotic.exoticpotion.silver=exotic silver potion
items.consum.potions.exotic.exoticpotion.unknown_desc=This round flask contains a grainy colorful liquid. It seems to be foreign to this land, who knows what it might do when drunk or thrown?
items.consum.potions.exotic.exoticpotion.warning=Do you really want to cancel this potion usage? It will be consumed anyway.
items.consum.potions.exotic.exoticpotion.yes=Yes, I'm positive
items.consum.potions.exotic.exoticpotion.no=No, I changed my mind
items.consum.potions.exotic.exoticpotion.discover_hint=You can craft this item via alchemy.

items.consum.potions.exotic.potionofcleansing.name=potion of cleansing
items.consum.potions.exotic.potionofcleansing.desc=This powerful reagent will render the drinker immune to all harmful status effects for a few turns when quaffed. It can be thrown at a target to cleanse them as well.
items.consum.potions.exotic.potionofcleansing$cleanse.name=cleansed
items.consum.potions.exotic.potionofcleansing$cleanse.desc=This character is temporarily immune to all harmful status effects!\n\nTurns remaining: %s.

items.consum.potions.exotic.potionofcorrosivegas.name=potion of corrosive gas
items.consum.potions.exotic.potionofcorrosivegas.desc=Uncorking or shattering this pressurized glass will cause its contents to explode into a deadly cloud of corrosive rust-colored gas. The gas spreads more quickly than toxic gas and is more deadly, but also won't last as long.

items.consum.potions.exotic.potionofdragonsbreath.name=potion of dragon's breath
items.consum.potions.exotic.potionofdragonsbreath.prompt=Choose a location to burn
items.consum.potions.exotic.potionofdragonsbreath.desc=This flask contains an unusual compound which bursts into flame shortly after mixing with saliva. Quickly spitting the liquid will allow the user to spew flame from their mouth!

items.consum.potions.exotic.potionofearthenarmor.name=potion of earthen armor
items.consum.potions.exotic.potionofearthenarmor.desc=Rather than paralyze, this liquid has a hardening effect on the skin which will turn it into temporary natural armor.

items.consum.potions.exotic.potionofdivineinspiration.name=potion of divine inspiration
items.consum.potions.exotic.potionofdivineinspiration.no_more_points=You can't gain any more bonus talent points.
items.consum.potions.exotic.potionofdivineinspiration.select_tier=Select a talent tier to gain two bonus points in. You must have unlocked the tier to be able to spend the points.
items.consum.potions.exotic.potionofdivineinspiration.bonus=+2 Talent Points!
items.consum.potions.exotic.potionofdivineinspiration.desc=The power of holy energy reduced to liquid form, this draught will imbue the drinker with divine power, granting them two bonus talent points in a tier of their choosing.\n\nThis potion can only be used once for each talent tier.

items.consum.potions.exotic.potionofmagicalsight.name=potion of magical sight
items.consum.potions.exotic.potionofmagicalsight.desc=After drinking this, your senses will be briefly heightened to incredible levels, allowing you to see through walls in a 12 tile radius!

items.consum.potions.exotic.potionofmastery.name=potion of mastery
items.consum.potions.exotic.potionofmastery.prompt=Master an Item
items.consum.potions.exotic.potionofmastery.weapon_easier=Your weapon becomes easier to wield!
items.consum.potions.exotic.potionofmastery.armor_easier=Your armor becomes easier to wear!
items.consum.potions.exotic.potionofmastery.desc=Rather than granting raw strength, this potion will instead attune the muscles of the user to a particular item. This will make that item easier to use, as if the drinker had practised with it and built muscle memory.\n\nThe chosen weapon or armor will require 2 less strength to use. This potion can only be used once on each item.

items.consum.potions.exotic.potionofshielding.name=potion of shielding
items.consum.potions.exotic.potionofshielding.desc=Rather than heal, this potion will instead project a durable shield around the user's body, blocking a considerable amount of damage.

items.consum.potions.exotic.potionofshroudingfog.name=potion of shrouding fog
items.consum.potions.exotic.potionofshroudingfog.desc=When exposed to air, the liquid in this flask will produce a thick smoky fog which quickly spreads and blocks the vision of your enemies.

items.consum.potions.exotic.potionofsnapfreeze.name=potion of snap freeze
items.consum.potions.exotic.potionofsnapfreeze.desc=The chemical contained in this potion will rapidly react with the air, instantly freezing and rooting all within its effect.

items.consum.potions.exotic.potionofstamina.name=potion of stamina
items.consum.potions.exotic.potionofstamina.desc=Drinking this oddly sweet liquid will imbue you with a long-lasting boost of energy, allowing you to run at a quickened pace for an extended period of time.

items.consum.potions.exotic.potionofstormclouds.name=potion of storm clouds
items.consum.potions.exotic.potionofstormclouds.desc=Throwing this potion will create a quickly-spreading cloud of concentrated vapor, which will condense and pour down onto the environment. Most terrain will be converted to water, fiery enemies will take damage, fire will be doused, and traps will be overwhelmed and break.



###quest items
items.quest.ceremonialcandle.name=ceremonial candle
items.quest.ceremonialcandle.desc=A set of candles, melted down and fused together through use.\n\nAlone they are worthless, but used with other candles in a pattern, they can focus the energy for a summoning ritual.
items.quest.ceremonialcandle.discover_hint=You can find this item during a specific quest.

items.quest.corpsedust.name=corpse dust
items.quest.corpsedust.chill=A chill runs down your spine.
items.quest.corpsedust.desc=The ball of corpse dust doesn't differ outwardly from a regular dust ball. But you can feel a malevolent energy lurking within it.\n\nGetting rid of it as soon as possible would be a good idea.
items.quest.corpsedust.discover_hint=You can find this item during a specific quest.
items.quest.corpsedust&dustwraith.rankings_desc=Cursed by Corpse Dust

items.quest.darkgold.name=dark gold ore
items.quest.darkgold.you_now_have=You now have %d dark gold ore.
items.quest.darkgold.desc=This metal is called dark not because of its color (it doesn't differ from the normal gold), but because it melts under the daylight, making it useless on the surface.
items.quest.darkgold.discover_hint=You can find this item during a specific quest.

items.quest.dwarftoken.name=dwarf token
items.quest.dwarftoken.discard=You discard the excess token.
items.quest.dwarftoken.desc=A strange shaped piece of metal that was being held by a denizen of the dwarven vault. Perhaps it is part of the magic that was binding it to the vault? Best to hold onto it, it might have some use.
items.quest.dwarftoken.desc_old=Many dwarves and some of their larger creations carry these small pieces of metal of unknown purpose. Maybe they are jewelry or maybe some kind of ID. Dwarves are strange folk.
items.quest.dwarftoken.discover_hint=You can find this item during a specific quest.

items.quest.embers.name=elemental embers
items.quest.embers.desc=Special embers which can only be harvested from young fire elementals. They radiate thermal energy.
items.quest.embers.discover_hint=You can find this item during a specific quest.

items.quest.escapecrystal.name=escape crystal
items.quest.escapecrystal.ac_use=USE
items.quest.escapecrystal.prompt=Select an item
items.quest.escapecrystal.desc=A thin magical spell crystal that seems to contain teleportation magic. You can use the crystal at any time to leave the dwarven vault, but if you leave early you won't get the full reward!
items.quest.escapecrystal.discover_hint=You can find this item during a specific quest.
items.quest.escapecrystal.injure_warning_1=Time seems to slow down as you hear the Imp's voice:\n\n"Hey, you seem to be pretty injured, is everything going alright down there? I want my statue but not badly enough for you to die trying to get it!"
items.quest.escapecrystal.injure_warning_2="If you're stuck in a nasty situation you can use one of those _teleport items from the starting room_ to escape back there and try again."
items.quest.escapecrystal.injure_warning_3="If things are looking really dire, you can _escape using that crystal I gave you._ I'm not going to give you the full reward but it's certainly better than dying!"
items.quest.escapecrystal.injure_confirm=Okay (this message won't appear again in future runs)
items.quest.escapecrystal.leaving_start=Time seems to slow down as you hear the Imp's voice:\n\n"Listen, I understand if you're nervous but please at least leave the first room!"\n\n"You don't need to worry about your gear, I'm an Imp of my word, I promise it will all be waiting for you when you get back. I also promise that I'll let you use the crystal to escape if you're actually in danger."
items.quest.escapecrystal.leaving_early=Time seems to slow down as you hear the Imp's voice:\n\n"Really, fleeing already!? You know you can run away from most of the enemies in that place right?"\n\n"Look, if your life is in danger I can pull you out, but I'm not letting you take anything back with you. I expected a lot more from you =("
items.quest.escapecrystal.leaving_partly_explored=Time seems to slow down and you hear the Imp's voice:\n\n"Oh, are you leaving already? Well I suppose you've helped chart the place out, and that's better than nothing."\n\n"Still, I had expected more from you =(. Of course I'll pull you out if you need me to. I'll let you take something like a potion or scroll with you I suppose."
items.quest.escapecrystal.leaving_fully_explored=Time seems to slow down and you hear the Imp's voice:\n\n"Need to leave? Well, you've explored the vault a decent amount at least. I was hoping you'd fare better with actually pilfering it, but I've got a much better idea of how the place works now."\n\n"I'll let you bring something out with you, but nothing magically upgraded!"
items.quest.escapecrystal.leaving_partial_victory=Time seems to slow down and you hear the Imp's voice:\n\n"I had hoped you might get my statuette, but you have done a great job of exploring and clearing most of the vault!"\n\n"Tell you what, I'll let you keep an item as long as it's not enhanced past +1, and I'll still set up shop further in the dungeon. I'll need some time to plan my next steps anyway."
items.quest.escapecrystal.leaving_victory=Time seems to slow down and you hear the Imp's voice:\n\n"Excellent work!! Are you ready to leave? I'll take the statue from you when you return."\n\n"As promised I'll set up shop further down and I'll let you take anything you like back out with you! Take your time choosing if you want, everything else will stay inside the vault."
items.quest.escapecrystal.leaving_item=Are you sure this is the item that you want to take with you?
items.quest.escapecrystal.leaving_seal=_The Broken Seal attached to this armor is tied to the mirror and cannot be taken with you._ The seal will be automatically removed from the armor. This will reduce the armor's level by 1 but will not remove any glyph it has.
items.quest.escapecrystal.leaving_staff=_This Mage's Staff is tied to the mirror and cannot be taken with you, but the wand imbued in it can._ The wand will be automatically removed from the staff, and given to you at the staff's level -1.
items.quest.escapecrystal.leaving_yes=Leave the Vault
items.quest.escapecrystal.leaving_no=Stay Here
items.quest.escapecrystal.error_start=It looks like you aren't in the Vault level! This might have happened due to a bug or crash.
items.quest.escapecrystal.error_no_items=None of your items are being stored, so the crystal has been removed from your inventory.
items.quest.escapecrystal.error_with_items=Your items are currently being stored, so you should attempt to descend into the vault again to begin the quest. Your stored items will be returned to you when the quest ends.

items.quest.gooblob.name=blob of goo
items.quest.gooblob.desc=A jiggly blob of goop, split off from Goo as it died. It's almost like a big ball of jelly, though you wouldn't dare eat it.\n\nIt does nothing on its own, but it might be useful when combined with certain potions, or a bomb. At the very least it should convert into a decent amount of energy.
items.quest.gooblob.discover_hint=You can get this item as a drop from certain enemies.

items.quest.impstatue.name=obsidian statuette
items.quest.impstatue.desc=A small jet-black statue carved out of obsidian. It resembles the Imp who sent you down here, it even has their glowing green eyes. There is an inscription on the base of the statue in a language you've never seen before.
items.quest.impstatue.discover_hint=You can find this item during a specific quest.

items.quest.vaultbeacon.name=vault beacon
items.quest.vaultbeacon.desc=This beacon of returning spell seems to already have a location set, probably to the entry room you found it in.\n\nYou could use it to save time while exploring, or as a way to escape if you're in danger.
items.quest.vaultbeacon.discover_hint=You can find this item during a specific quest.

items.quest.metalshard.name=cursed metal shard
items.quest.metalshard.desc=A shard of rusted cursed metal, which broke off DM-300 as it was destroyed. You can feel an inactive malevolent magic within it.\n\nIt does nothing on its own, but it might be useful when combined with certain scrolls, or a bomb. At the very least it should convert into a decent amount of energy.
items.quest.metalshard.discover_hint=You can get this item as a drop from certain enemies.

items.quest.pickaxe.name=pickaxe
items.quest.pickaxe.ac_mine=MINE
items.quest.pickaxe.no_vein=There is no dark gold vein near you to mine.
items.quest.pickaxe.ability_name=pierce
items.quest.pickaxe.ability_desc=The Duelist can _pierce_ an enemy with a pickaxe. This is guaranteed to hit, applies vulnerable for 3 turns, and deals _%1$d-%2$d damage_ to enemies with rigid skin.
items.quest.pickaxe.upgrade_ability_stat_name=Ability Damage
items.quest.pickaxe.desc=This is a large and sturdy tool for breaking rocks. Probably it can be used as a weapon.
items.quest.pickaxe.discover_hint=You can find this item during a specific quest.

items.quest.ratskull.name=giant rat skull
items.quest.ratskull.desc=A surprisingly large rat skull. It would make a great hunting trophy, if you had a wall to mount it on.



###remains
items.ground.remains.remainsitem.ac_use=USE
items.ground.remains.remainsitem.discover_hint=You can find this item in the remains of a specific hero from a previous lost run.

items.ground.remains.bowfragment.name=bow fragment
items.ground.remains.bowfragment.desc=This broken fragment of wood was once part of a lost Huntress' spirit bow. You can still feel a little nature energy left in the fragment, you can use the fragment to grow some high grass around you. Doing this will destroy the fragment however.

items.ground.remains.brokenhilt.name=broken hilt
items.ground.remains.brokenhilt.desc=This broken hilt looks like it came from a defeated Duelist's weapon. You can still feel a little martial power left in the hilt, you can use it to get a little bonus damage on your next two melee hits. Doing this will destroy the hilt however.

items.ground.remains.brokenstaff.name=broken staff
items.ground.remains.brokenstaff.desc=This Mage's staff has been broken in half after its owner met their demise. You can still feel some magical energy left in the staff, you can use it to give your wands a little charge boost. Doing this will destroy the staff however.

items.ground.remains.cloakscrap.name=scrap of fabric
items.ground.remains.cloakscrap.desc=This scrap of translucent fabric looks like it came from a late Rogue's cloak of shadows. You can still feel a little mystical energy left in it, you can use it to give your artifacts a little charge boost. Doing this will destroy the fabric however.

items.ground.remains.sealshard.name=seal shards
items.ground.remains.sealshard.desc=These tiny shards of red wax look like they came from the seal of a fallen Warrior. You can still feel a bit of willpower clinging to the seal, you can use it to give yourself a bit of shielding. Doing this will destroy the seal shards however.

items.ground.remains.tornpage.name=torn page
items.ground.remains.tornpage.desc=This page looks like it was ripped out of an expired Cleric's holy tome. There's still a little divine energy clinging to it, you can use it to regain a little bit of health. Doing this will destroy the torn page however.



###rings
items.equipment.rings.ring.diamond=diamond ring
items.equipment.rings.ring.opal=opal ring
items.equipment.rings.ring.garnet=garnet ring
items.equipment.rings.ring.ruby=ruby ring
items.equipment.rings.ring.amethyst=amethyst ring
items.equipment.rings.ring.topaz=topaz ring
items.equipment.rings.ring.onyx=onyx ring
items.equipment.rings.ring.tourmaline=tourmaline ring
items.equipment.rings.ring.emerald=emerald ring
items.equipment.rings.ring.sapphire=sapphire ring
items.equipment.rings.ring.quartz=quartz ring
items.equipment.rings.ring.agate=agate ring
items.equipment.rings.ring.equip_cursed=The ring tightens around your finger painfully!
items.equipment.rings.ring.unknown_desc=This metal band is adorned with a large gem that glitters in the darkness. Who knows what effect it has when worn?
items.equipment.rings.ring.known=This is a %s
items.equipment.rings.ring.identify=You are now familiar enough with your ring to identify it.
items.equipment.rings.ring.cursed_worn=Because this ring is cursed, you are powerless to remove it.
items.equipment.rings.ring.curse_known=You can feel a malevolent magic lurking within this ring.
items.equipment.rings.ring.not_cursed=This ring is free of malevolent magic.

items.equipment.rings.ringofaccuracy.name=ring of accuracy
items.equipment.rings.ringofaccuracy.stats=ACU improve _ %1$d _ , Attack range improve _%2$d_ .
items.equipment.rings.ringofaccuracy.typical_stats=When worn, this ring will typically increase your accuracy by _%s%%._
items.equipment.rings.ringofaccuracy.combined_stats=Your equipped rings are combining their power, increasing your accuracy by _%s%%_ in total.
items.equipment.rings.ringofaccuracy.upgrade_stat_name_1=Accuracy Boost
items.equipment.rings.ringofaccuracy.desc=This ring increases your focus, reducing your enemy's ability to dodge your attacks. Also every 10 level it can make player gain 1 more attack distance, range limit at 30 level.

items.equipment.rings.ringofarcana.name=ring of arcana
items.equipment.rings.ringofarcana.stats=When worn, this ring will increase the power of enchantments and glyphs by _%s%%._
items.equipment.rings.ringofarcana.typical_stats=When worn, this ring will typically increase the power of enchantments and glyphs by _%s%%._
items.equipment.rings.ringofarcana.combined_stats=Your equipped rings are combining their power, increasing the power of enchantments and glyphs by _%s%%_ in total.
items.equipment.rings.ringofarcana.upgrade_stat_name_1=Arcana Boost
items.equipment.rings.ringofarcana.desc=This ring enhances magical enchantments on weapons and glyphs on armor, including curses! It first increases activation chance, and then increases the strength of the effect once activation chance is 100%. A cursed ring will instead weaken enchantments, glyphs, and curses.

items.equipment.rings.ringofelements.name=ring of elements
items.equipment.rings.ringofelements.stats=Gain element resistance, improve buff by %1$s%%, and reduce debuff by %2$s%%.
items.equipment.rings.ringofelements.upgrade_stat_name_1=Magic resistance
items.equipment.rings.ringofelements.desc=This ring provides resistance to different elements, such as fire, electricity, gases etc. Also it decreases duration of negative effects. Limit at 30 level.

items.equipment.rings.ringofenergy.name=ring of energy
items.equipment.rings.ringofenergy.stats=When worn, this ring will increase wand, artifact, and heroic armor charge speed by _%s%%._
items.equipment.rings.ringofenergy.typical_stats=When worn, this ring will typically increase wand, artifact, and heroic armor charge speed by _%s%%._
items.equipment.rings.ringofenergy.combined_stats=Your equipped rings are combining their power, increasing charge speed by _%s%%_ in total.
items.equipment.rings.ringofenergy.upgrade_stat_name_1=Charge Boost
items.equipment.rings.ringofenergy.desc=Your magical equipment will recharge more quickly in the arcane field that radiates from this ring. A cursed ring will instead slow recharge.

items.equipment.rings.ringofevasion.name=ring of evasion
items.equipment.rings.ringofevasion.stats=Dex improve _%d_ , steath improve _%2$d_ .
items.equipment.rings.ringofevasion.typical_stats=When worn, this ring will typically increase your evasion by _%s%%._
items.equipment.rings.ringofevasion.combined_stats=Your equipped rings are combining their power, increasing your evasion by _%s%%_ in total.
items.equipment.rings.ringofevasion.upgrade_stat_name_1=Evasion Boost
items.equipment.rings.ringofevasion.desc=This ring obfuscates the true position of the wearer, making them harder to detect and attack.  A degraded ring will instead make the user easier to detect and strike. Every 5 level it will give wearer 1 steath, steath limit at level 30.

items.equipment.rings.ringofforce.name=ring of force
items.equipment.rings.ringofforce.stats=When unarmed, at your current strength, this ring will deal _%1$d-%2$d damage._ With a weapon equipped, this ring will increase damage by _%3$d._
items.equipment.rings.ringofforce.typical_stats=When unarmed, at your current strength, typically this ring will deal _%1$d-%2$d damage._ With a weapon equipped, typically this ring will increase damage by _%3$d._
items.equipment.rings.ringofforce.combined_stats=Your equipped rings are combining their power, dealing a total of _%1$d-%2$d damage_ without a weapon, or increasing damage by _%3$d_ with one.
items.equipment.rings.ringofforce.upgrade_stat_name_1=Unarmed Damage
items.equipment.rings.ringofforce.upgrade_stat_name_2=Armed Damage Boost
items.equipment.rings.ringofforce.upgrade_stat_name_3=Ability Damage
items.equipment.rings.ringofforce.ability_name=brawler's stance
items.equipment.rings.ringofforce.typical_ability_desc=The Duelist can adopt a _brawler's stance_ with this ring, causing her regular attacks to always use this ring even with a weapon equipped. These attacks will typically deal _%1$d-%2$d damage_ and will also inherit the weapon's enchantment and augmentation. This stance slows weapon recharging speed by 50%%.
items.equipment.rings.ringofforce.ability_desc=The Duelist can adopt a _brawler's stance_ with this ring, causing her regular attacks to always use this ring even with a weapon equipped. These attacks will deal _%1$d-%2$d damage_ and will also inherit the weapon's enchantment and augmentation. This stance slows weapon recharging speed by 50%%.
items.equipment.rings.ringofforce.desc=This ring enhances the force of the wearer's melee blows. This extra power is fairly weak when wielding weapons, but an unarmed attack will be made much stronger. A cursed ring will instead weaken the wearer's blows.
items.equipment.rings.ringofforce$brawlersstance.name=brawler's stance
items.equipment.rings.ringofforce$brawlersstance.desc=While in this stance the Duelist's regular attacks will use an equipped ring of force even when she has a weapon equipped. These attacks gain bonus damage and will still use the weapon's augmentation and enchantment.\n\nMaintaining this stance takes focus however, reducing weapon ability recharge speed by 50%.\n\nThis stance can be toggled on or off by using a ring of force, but the reduction in charge speed will persist for a little while if the stance is quickly activated and deactivated.

items.equipment.rings.ringoffuror.name=ring of furor
items.equipment.rings.ringoffuror.stats=Melee attack speed improve _%s%%_ .
items.equipment.rings.ringoffuror.typical_stats=When worn, this ring will typically increase the speed of your attacks by _%s%%._
items.equipment.rings.ringoffuror.combined_stats=Your equipped rings are combining their power, increasing the speed of your attacks by _%s%%_ in total.
items.equipment.rings.ringoffuror.upgrade_stat_name_1=Attack Speed Boost
items.equipment.rings.ringoffuror.desc=This ring grants the wearer an inner fury, allowing them to attack more rapidly. Speed limit at 30 level.

items.equipment.rings.ringofhaste.name=ring of haste
items.equipment.rings.ringofhaste.stats=Move speed improve _%s%%_ .
items.equipment.rings.ringofhaste.typical_stats=When worn, this ring will typically increase your movement speed by _%s%%._
items.equipment.rings.ringofhaste.combined_stats=Your equipped rings are combining their power, increasing your movement speed by _%s%%_ in total.
items.equipment.rings.ringofhaste.upgrade_stat_name_1=Move Speed Boost
items.equipment.rings.ringofhaste.desc=This ring reduces the stress of movement on the wearer, allowing them to run at superhuman speeds. Speed limit at 30 level.

items.equipment.rings.ringofmight.name=ring of might
items.equipment.rings.ringofmight.stats=When worn, this ring will increase your strength by _%1$d_ and your max HP by _%2$s%%._
items.equipment.rings.ringofmight.typical_stats=When worn, this ring will typically increase your strength by _%1$d_ and your max HP by _%2$s%%._
items.equipment.rings.ringofmight.combined_stats=Your equipped rings are combining their power, boosting your strength by _%1$d_ and max HP by _%2$s%%_ in total.
items.equipment.rings.ringofmight.upgrade_stat_name_1=Strength Boost
items.equipment.rings.ringofmight.upgrade_stat_name_2=Max HP Boost
items.equipment.rings.ringofmight.desc=This ring enhances the physical traits of the wearer, granting them greater physical strength and constitution. A cursed ring will weaken the wearer.

items.equipment.rings.ringofsharpshooting.name=ring of sharpshooting
items.equipment.rings.ringofsharpshooting.stats=When worn, this ring will boost the damage of your thrown weapons as if their level was increased by _%1$d_, and will increase their durability by _%2$s%%._
items.equipment.rings.ringofsharpshooting.typical_stats=When worn, this ring will typically boost the damage of your thrown weapons as if their level was increased by _%1$d_ and will increase their durability by _%2$s%%._
items.equipment.rings.ringofsharpshooting.combined_stats=Your equipped rings are combining their power, boosting effective thrown weapon level by _%1$d_ and increasing their durability by _%2$s%%_ in total.
items.equipment.rings.ringofsharpshooting.upgrade_stat_name_1=Level Damage Boost
items.equipment.rings.ringofsharpshooting.upgrade_stat_name_2=Durability Boost
items.equipment.rings.ringofsharpshooting.desc=This ring enhances the wearer's precision and aim, which will make all projectile weapons more damaging and durable. A cursed ring will have the opposite effect.

items.equipment.rings.ringoftenacity.name=ring of tenacity
items.equipment.rings.ringoftenacity.stats=When worn, this ring will reduce the damage you take by up to _%s%%._
items.equipment.rings.ringoftenacity.typical_stats=When worn, this ring will typically reduce the damage you take by up to _%s%%._
items.equipment.rings.ringoftenacity.combined_stats=Your equipped rings are combining their power, reducing the damage you take by up to _%s%%_ in total.
items.equipment.rings.ringoftenacity.upgrade_stat_name_1=Max Damage Resist
items.equipment.rings.ringoftenacity.desc=When worn, this ring will allow the wearer to resist normally mortal strikes. The more injured the user is, the more resistant they will be to damage. A cursed ring will instead make it easier for enemies to execute the wearer.

items.equipment.rings.ringofwealth.name=ring of wealth
items.equipment.rings.ringofwealth.stats=When worn, this ring will increase your luck by _%s%%._
items.equipment.rings.ringofwealth.typical_stats=When worn, this ring will typically increase your luck by _%s%%._
items.equipment.rings.ringofwealth.combined_stats=Your equipped rings are combining their power, increasing your luck by _%s%%_ in total.
items.equipment.rings.ringofwealth.upgrade_stat_name_1=Luck Boost
items.equipment.rings.ringofwealth.desc=This ring acts like a magnet for treasure, increasing the likelihood that enemies and containers will be carrying valuable items. A cursed ring will instead reduce your chance of receiving loot.



###scrolls
items.consum.scrolls.scroll.ac_read=READ
items.consum.scrolls.scroll.kaunan=scroll of KAUNAN
items.consum.scrolls.scroll.sowilo=scroll of SOWILO
items.consum.scrolls.scroll.laguz=scroll of LAGUZ
items.consum.scrolls.scroll.yngvi=scroll of YNGVI
items.consum.scrolls.scroll.gyfu=scroll of GYFU
items.consum.scrolls.scroll.raido=scroll of RAIDO
items.consum.scrolls.scroll.isaz=scroll of ISAZ
items.consum.scrolls.scroll.mannaz=scroll of MANNAZ
items.consum.scrolls.scroll.naudiz=scroll of NAUDIZ
items.consum.scrolls.scroll.berkanan=scroll of BERKANAN
items.consum.scrolls.scroll.ncosrane=scroll of NCOSRANE
items.consum.scrolls.scroll.odal=scroll of ODAL
items.consum.scrolls.scroll.tiwaz=scroll of TIWAZ
items.consum.scrolls.scroll.nendil=scroll of NENDIL
items.consum.scrolls.scroll.libra=scroll of LIBRA
items.consum.scrolls.scroll.unknown_desc=An indecipherable magical rune is written on this parchment. Who knows what it will do when read aloud?
items.consum.scrolls.scroll.blinded=You can't read a scroll while blinded.
items.consum.scrolls.scroll.no_magic=You can't read a scroll while magic immune.
items.consum.scrolls.scroll.cursed=Your cursed spellbook prevents you from invoking this scroll's magic! A scroll of remove curse might be strong enough to still work though...
items.consum.scrolls.scroll$placeholder.name=scroll

items.consum.scrolls.inventoryscroll.warning=Do you really want to cancel this scroll usage? The scroll wasn't previously identified, so it will be consumed anyway.
items.consum.scrolls.inventoryscroll.yes=Yes, I'm positive
items.consum.scrolls.inventoryscroll.no=No, I changed my mind

items.consum.scrolls.scrollofidentify.name=scroll of identify
items.consum.scrolls.scrollofidentify.inv_title=Identify an item
items.consum.scrolls.scrollofidentify.it_is=Your item has been identified: %s.
items.consum.scrolls.scrollofidentify.desc=This scroll permanently reveals all of the secrets of a single item.

items.consum.scrolls.scrolloflullaby.name=scroll of lullaby
items.consum.scrolls.scrolloflullaby.sooth=The scroll utters a soothing melody. You feel very sleepy.
items.consum.scrolls.scrolloflullaby.desc=Reading this scroll emits a soothing melody which will lull all who hear it into a deep magical sleep. For the reader and their allies the sleep is restorative.

items.consum.scrolls.scrollofmagicmapping.name=scroll of magic mapping
items.consum.scrolls.scrollofmagicmapping.layout=You are now aware of the level layout.
items.consum.scrolls.scrollofmagicmapping.desc=When this scroll is read, an image of crystal clarity will be etched into your memory, alerting you to the precise layout of the level and revealing all hidden secrets. The locations of items and creatures will remain unknown.

items.consum.scrolls.scrollofmirrorimage.name=scroll of mirror image
items.consum.scrolls.scrollofmirrorimage.copies=The scroll forms mirror images of you.
items.consum.scrolls.scrollofmirrorimage.no_copies=The scroll attempts to create mirror images of you, but they have nowhere to go.
items.consum.scrolls.scrollofmirrorimage.desc=The incantation on this scroll will create two illusory twins of the reader. These mirror images act as weaker clones of the reader, and will chase down their enemies. They have no durability however, and will fade upon taking damage.

items.consum.scrolls.scrollofretribution.name=scroll of retribution
items.consum.scrolls.scrollofretribution.blast=Powerful magical energy erupts from the scroll!
items.consum.scrolls.scrollofretribution.desc=This scroll contains destructive energy which channels the reader's suffering outward into a blast of power. The weaker the reader is, the more damage they will deal. At very low health this scroll can kill most enemies instantly.\n\nUsing the scroll takes a toll on the user however, blinding and weakening them.

items.consum.scrolls.scrollofrage.name=scroll of rage
items.consum.scrolls.scrollofrage.roar=The scroll emits an enraging roar that echoes throughout the dungeon!
items.consum.scrolls.scrollofrage.desc=When read aloud, this scroll will unleash a great roar that draws all enemies to the reader, and enrages nearby ones.

items.consum.scrolls.scrollofrecharging.name=scroll of recharging
items.consum.scrolls.scrollofrecharging.surge=A surge of energy courses through your body, invigorating your wands!
items.consum.scrolls.scrollofrecharging.desc=The raw magical power bound up in this parchment will charge up all the user's wands over time when released.

items.consum.scrolls.scrollofremovecurse.name=scroll of remove curse
items.consum.scrolls.scrollofremovecurse.inv_title=Cleanse an item
items.consum.scrolls.scrollofremovecurse.cleansed=Your item glows with a cleansing light, and a malevolent energy disperses!
items.consum.scrolls.scrollofremovecurse.not_cleansed=Your item glows with a cleansing light, but nothing happens.
items.consum.scrolls.scrollofremovecurse.spirit=Your scroll frees the tormented spirit!
items.consum.scrolls.scrollofremovecurse.desc=The incantation on this scroll will instantly strip any curses from a single weapon, ring, wand, armor, or artifact.

items.consum.scrolls.scrollofteleportation.name=scroll of teleportation
items.consum.scrolls.scrollofteleportation.tele=In a blink of an eye you were teleported to another location of the level.
items.consum.scrolls.scrollofteleportation.no_tele=The teleportation magic fails.
items.consum.scrolls.scrollofteleportation.cant_reach=You can't teleport there.
items.consum.scrolls.scrollofteleportation.prompt=Choose a location to teleport
items.consum.scrolls.scrollofteleportation.desc=The spell on this parchment instantly transports the reader to a different location on the dungeon level. The scroll prioritizes areas the reader hasn't been to before, though it is not able to teleport past locked doors or barricades. It can, however, reveal hidden doors that lead to new areas.

items.consum.scrolls.scrollofterror.name=scroll of terror
items.consum.scrolls.scrollofterror.none=The scroll emits a brilliant flash of red light.
items.consum.scrolls.scrollofterror.one=The scroll emits a brilliant flash of red light and the %s flees!
items.consum.scrolls.scrollofterror.many=The scroll emits a brilliant flash of red light and the monsters flee!
items.consum.scrolls.scrollofterror.desc=When read, this scroll will emit a flash of red light that will overwhelm all enemies in your field of view with terror, and they will turn and flee. Attacking a fleeing enemy will shorten the effect.

items.consum.scrolls.scrolloftransmutation.name=scroll of transmutation
items.consum.scrolls.scrolloftransmutation.inv_title=Transmute an item
items.consum.scrolls.scrolloftransmutation.nothing=Nothing interesting happens.
items.consum.scrolls.scrolloftransmutation.morph=Your item morphs into something different!
items.consum.scrolls.scrolloftransmutation.desc=This scroll contains powerful transmutation magic. When used on an eligible item it will transform it into a different item of the same type. The magic will even preserve upgrades, enchantments, and glyphs. Scrolls and potions will be transmuted into their exotic equivalent, and vice-versa.

items.consum.scrolls.scrollofupgrade.name=scroll of upgrade
items.consum.scrolls.scrollofupgrade.inv_title=Upgrade an item
items.consum.scrolls.scrollofupgrade.weaken_curse=The scroll of upgrade weakens the curse on your item.
items.consum.scrolls.scrollofupgrade.remove_curse=The scroll of upgrade cleanses the curse on your item!
items.consum.scrolls.scrollofupgrade.desc=This scroll will upgrade a single item or set of thrown weapons. Wands will increase in power and number of charges, weapons and armor will deal and block more damage, thrown weapon sets will be fully repaired and more durable, and the effects of rings will intensify.\n\nIt can even weaken or sometimes totally dispel curses, though it is not as potent as a scroll of remove curse. Unfortunately, the upgrading magic can also erase enchantments or glyphs on higher level gear.



###exotic scrolls
items.consum.scrolls.exotic.exoticscroll.kaunan=exotic scroll of KAUNAN
items.consum.scrolls.exotic.exoticscroll.sowilo=exotic scroll of SOWILO
items.consum.scrolls.exotic.exoticscroll.laguz=exotic scroll of LAGUZ
items.consum.scrolls.exotic.exoticscroll.yngvi=exotic scroll of YNGVI
items.consum.scrolls.exotic.exoticscroll.gyfu=exotic scroll of GYFU
items.consum.scrolls.exotic.exoticscroll.raido=exotic scroll of RAIDO
items.consum.scrolls.exotic.exoticscroll.isaz=exotic scroll of ISAZ
items.consum.scrolls.exotic.exoticscroll.mannaz=exotic scroll of MANNAZ
items.consum.scrolls.exotic.exoticscroll.naudiz=exotic scroll of NAUDIZ
items.consum.scrolls.exotic.exoticscroll.berkanan=exotic scroll of BERKANAN
items.consum.scrolls.exotic.exoticscroll.odal=exotic scroll of ODAL
items.consum.scrolls.exotic.exoticscroll.tiwaz=exotic scroll of TIWAZ
items.consum.scrolls.exotic.exoticscroll.unknown_desc=A glowing indecipherable magical rune is written on this black parchment. It seems to be foreign to this land, who knows what it will do when read aloud?
items.consum.scrolls.exotic.exoticscroll.discover_hint=You can craft this item via alchemy.

items.consum.scrolls.exotic.scrollofsirenssong.name=scroll of siren's song
items.consum.scrolls.exotic.scrollofsirenssong.prompt=Choose a target
items.consum.scrolls.exotic.scrollofsirenssong.no_target=The scroll activates without a target.
items.consum.scrolls.exotic.scrollofsirenssong.cancel=You must choose a target.
items.consum.scrolls.exotic.scrollofsirenssong.desc=Reading this scroll emits an alluring melody which will enthrall a targeted enemy, permanently turning them into an ally! Other enemies who hear it will be temporarily charmed.\n\nParticularly strong enemies can resist the enthrall effect, and will be charmed instead.
items.consum.scrolls.exotic.scrollofsirenssong$enthralled.name=enthralled
items.consum.scrolls.exotic.scrollofsirenssong$enthralled.desc=This creature has been bewitched by the magic of a scroll of siren's song.\n\nAn enthralled character is permanently your ally, and will fight any enemies they encounter.

items.consum.scrolls.exotic.scrollofantimagic.name=scroll of anti-magic
items.consum.scrolls.exotic.scrollofantimagic.desc=The incantation on this scroll will surround you with a magical aura that temporarily blocks all magical effects, harmful or helpful. This includes most magical item effects such as wands, scrolls, rings, artifacts, enchantments, and curses. Heroic armor abilities are strong enough to work regardless however.

items.consum.scrolls.exotic.scrollofchallenge.name=scroll of challenge
items.consum.scrolls.exotic.scrollofchallenge.desc=When read aloud, this scroll will unleash a great roar that draws enemies to the user while simultaneously creating a small arena around them.\n\nAs long as the reader stays in this arena they will take 33% less damage from all sources (this is applied before other forms of damage reduction), and they will not lose satiety.\n\nThe size of the arena will scale with the size of the area the reader is in. It will be particularly small in some boss areas.
items.consum.scrolls.exotic.scrollofchallenge$challengearena.name=challenge arena
items.consum.scrolls.exotic.scrollofchallenge$challengearena.desc=A magical arena has appeared around you, denoted by a billowing red fog.\n\nWhile standing in the fog, your hunger will not increase and you will take 33%% less damage from all sources. If you have any other sources of damage reduction (such as armor), they will apply after the 33%% reduction.\n\nTurns remaining: %d.

items.consum.scrolls.exotic.scrollofdivination.name=scroll of divination
items.consum.scrolls.exotic.scrollofdivination.nothing_left=There is nothing left to identify!
items.consum.scrolls.exotic.scrollofdivination.desc=This scroll will randomly identify four types of item that you don't currently know. The types identified can be a potion's color, a scroll's rune, or a ring's gem. The items identified won't necessarily be ones you're carrying.
items.consum.scrolls.exotic.scrollofdivination$wnddivination.desc=Your scroll of divination has identified the following items:

items.consum.scrolls.exotic.scrollofdread.name=scroll of dread
items.consum.scrolls.exotic.scrollofdread.desc=When read, this scroll will emit a flash of red light that will instill incredible terror in all enemies in your field of view. So great is this effect that they will rapidly try to flee from the entire dungeon, never to be seen again!\n\nJust like with terror, this effect can expire with time, or if the enemy is attacked.\n\nStrong-willed enemies, such as bosses, will be inflicted with regular terror instead.

items.consum.scrolls.exotic.scrollofenchantment.name=scroll of enchantment
items.consum.scrolls.exotic.scrollofenchantment.inv_title=Enchant an item
items.consum.scrolls.exotic.scrollofenchantment.weapon=Select an enchantment to apply to your weapon.
items.consum.scrolls.exotic.scrollofenchantment.armor=Select a glyph to apply to your armor.
items.consum.scrolls.exotic.scrollofenchantment.cancel=cancel
items.consum.scrolls.exotic.scrollofenchantment.cancel_warn=Cancelling will still consume your scroll of enchantment, are you sure?
items.consum.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Yes, I'm sure
items.consum.scrolls.exotic.scrollofenchantment.cancel_warn_no=No, I changed my mind
items.consum.scrolls.exotic.scrollofenchantment.desc=This scroll will infuse a weapon or armor with powerful magical energy. The reader even has some degree of control over which magic is imbued.

items.consum.scrolls.exotic.scrollofforesight.name=scroll of foresight
items.consum.scrolls.exotic.scrollofforesight.desc=After reading this scroll, the detail of nearby terrain will be constantly fed to the reader's mind in crystal clarity. This effect lasts for a considerable amount of time, and will reveal all hidden doors or traps, making searching unnecessary.

items.consum.scrolls.exotic.scrollofmetamorphosis.name=scroll of metamorphosis
items.consum.scrolls.exotic.scrollofmetamorphosis.choose_desc=Choose a talent to metamorphose.
items.consum.scrolls.exotic.scrollofmetamorphosis.replace_desc=Choose a new talent to replace your metamorphosed talent with.
items.consum.scrolls.exotic.scrollofmetamorphosis.cancel_warn=Cancelling will still consume your scroll of metamorphosis, are you sure?
items.consum.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=metamorphose talent
items.consum.scrolls.exotic.scrollofmetamorphosis.desc=This scroll contains powerful transmutation magic, which will apply to the caster instead of to an item. The magic of this scroll will let you select one talent, and replace it with one of five talents of the same tier from different hero classes!\n\nThis effect can only apply to class talents, not talents gained from subclasses or armor abilities. Talents that you cannot use will not be given as options.

items.consum.scrolls.exotic.scrollofmysticalenergy.name=scroll of mystical energy
items.consum.scrolls.exotic.scrollofmysticalenergy.desc=The raw magical power bound up in this parchment will, when released, charge a user's equipped artifacts over time.

items.consum.scrolls.exotic.scrollofpassage.name=scroll of passage
items.consum.scrolls.exotic.scrollofpassage.desc=The spell on this parchment instantly transports the reader to the nearest region first floor above them. Very handy for quickly getting to a shop.

items.consum.scrolls.exotic.scrollofprismaticimage.name=scroll of prismatic image
items.consum.scrolls.exotic.scrollofprismaticimage.desc=The incantation on this scroll will create a colorful illusory twin of the reader. This prismatic image acts as a weaker clone of the reader, with similar defence but lower hp and damage.\n\nThe prismatic image will show itself when enemies are present, and will attempt to defend the reader.\n\nIf a prismatic image already exists, using this scroll will fully heal it.

items.consum.scrolls.exotic.scrollofpsionicblast.name=scroll of psionic blast
items.consum.scrolls.exotic.scrollofpsionicblast.ondeath=The Psionic Blast tears your mind apart...
items.consum.scrolls.exotic.scrollofpsionicblast.desc=This scroll contains incredible destructive energy that can be channeled to destroy the minds of all visible creatures.\n\nThere is significant feedback however, and the reader will also be damaged, blinded, and weakened. The more targets the scroll hits, the less self-damage will be taken.



###spells
items.consum.spells.alchemize.name=alchemize
items.consum.spells.alchemize.prompt=Alchemize an Item
items.consum.spells.alchemize.desc=This spell contains transmutative powers similar to those found in an alchemy pot. Each cast allows the user to turn an item (or stack of items) into gold or alchemical energy. Turning potions or scrolls into energy will even identify them!\n\nA few Alchemize uses are sold from shops, but many more can be made using alchemy by combining a seed, runestone, and a little alchemical energy.
items.consum.spells.alchemize$wndalchemizeitem.sell=Turn into %dg
items.consum.spells.alchemize$wndalchemizeitem.sell_1=Turn 1 into %dg
items.consum.spells.alchemize$wndalchemizeitem.sell_all=Turn all into %dg
items.consum.spells.alchemize$wndalchemizeitem.energize=Turn into %d energy
items.consum.spells.alchemize$wndalchemizeitem.energize_1=Turn 1 into %d energy
items.consum.spells.alchemize$wndalchemizeitem.energize_all=Turn all into %d energy

items.consum.spells.beaconofreturning.name=beacon of returning
items.consum.spells.beaconofreturning.preventing=The strong magic aura of this place prevents you from using the spell!
items.consum.spells.beaconofreturning.creatures=The Psychic aura of neighbouring creatures doesn't allow you to teleport at this moment.
items.consum.spells.beaconofreturning.set=The beacon was set at your current location.
items.consum.spells.beaconofreturning.wnd_body=Setting will override the location the beacon was previously set to.\n\nReturning will return to your last set location and consume one use of the spell.
items.consum.spells.beaconofreturning.wnd_set=Set
items.consum.spells.beaconofreturning.wnd_return=Return
items.consum.spells.beaconofreturning.desc_set=This beacon was set somewhere on floor %d.
items.consum.spells.beaconofreturning.desc=This intricate spell grants the user the ability to return to a set location, regardless of distance. The spell will only be consumed by returning, it can be set as many times as you like, but it will only remember the most recent location it was set to.

items.consum.spells.curseinfusion.name=curse infusion
items.consum.spells.curseinfusion.inv_title=Curse an item
items.consum.spells.curseinfusion.desc=This spell infuses a piece of equipment with the same powerful malignant magic present within DM-300. The item it is used on will immediately be cursed, and any enchantment or glyph it may have had will be overridden.\n\nIn the case of weapons, armor, and wands, the item will gain upgrades in addition to being cursed. Curse infusion upgrades do not stack, and the upgrades are lost if the item becomes uncursed.\n\nMultiple curse infusions can also be used to change the curse on a weapon or armor.

items.consum.spells.spell.ac_cast=CAST
items.consum.spells.spell.no_magic=You can't cast spells while magic immune.
items.consum.spells.spell.discover_hint=You can craft this item via alchemy.

items.consum.spells.magicalinfusion.name=magical infusion
items.consum.spells.magicalinfusion.inv_title=Infuse an item
items.consum.spells.magicalinfusion.infuse=Your item is infused with arcane energy!
items.consum.spells.magicalinfusion.desc=This spell possesses the same magical power as a scroll of upgrade, but in a more stable form.\n\nIn addition to upgrading an item as normal it will never erase an enchantment, glyph, or curse.

items.consum.spells.magicalporter.name=magical porter
items.consum.spells.magicalporter.inv_title=Port an item
items.consum.spells.magicalporter.nowhere=There is nowhere for you to port an item to.
items.consum.spells.magicalporter.desc=This spell will magically transport any item it is cast on. Unlike a merchant's beacon however, the items will be transported to the entrance of the next boss floor.

items.consum.spells.phaseshift.name=phase shift
items.consum.spells.phaseshift.no_target=There is nothing to teleport there.
items.consum.spells.phaseshift.desc=This chaotic spell will teleport any character it is aimed at to a random location on the current floor, and stun them for a significant amount of time. Powerful foes will be able to resist the stunning effect. This spell can be directed at a target or at the user themselves.

items.consum.spells.reclaimtrap.name=reclaim trap
items.consum.spells.reclaimtrap.no_trap=There is no trap there.
items.consum.spells.reclaimtrap.desc_trap=The spell is currently ready to trigger a _%s._
items.consum.spells.reclaimtrap.desc=This spell contains remnants of the mechanical energy of DM-300. When cast on an active trap, the power of the trap will become attached to you, allowing you to use the spell again to expel this power and trigger the trap's effect at any location you like.\n\nHowever, some traps may not function in all places, and only one trap can be stored at a time.

items.consum.spells.recycle.name=recycle
items.consum.spells.recycle.inv_title=Recycle an item
items.consum.spells.recycle.recycled=Your item was recycled into: %s.
items.consum.spells.recycle.desc=This spell contains a lesser form of transmutation magic. While it won't work on equipment, this spell will transform a scroll, potion, seed, runestone, or tipped dart into a random item of the same type.

items.consum.spells.summonelemental.name=summon elemental
items.consum.spells.summonelemental.ac_imbue=IMBUE
items.consum.spells.summonelemental.imbue_prompt=Imbue an item
items.consum.spells.summonelemental.desc=This spell channels the energy of the elemental embers used to make it, and will allow you to summon a friendly elemental to fight with you! Only one elemental can be summoned at a time, but the spell can be re-cast to return the elemental to you at no cost.
items.consum.spells.summonelemental.desc_newborn=The spell is currently unimbued, and will summon a _newborn elemental_ without a ranged attack. You can imbue an identified potion of liquid flame, potion of frost, scroll of recharging, or scroll of transmutation to power the spell up, causing future summons to be a full power elemental!
items.consum.spells.summonelemental.desc_fire=The spell is currently hot to the touch, it will summon a _fire elemental_. You can imbue a different item, but the spell will lose its current imbue.
items.consum.spells.summonelemental.desc_frost=The spell is currently cold to the touch, it will summon a _frost elemental_. You can imbue a different item, but the spell will lose its current imbue.
items.consum.spells.summonelemental.desc_shock=The spell is currently radiating static energy, it will summon a _shock elemental_. You can imbue a different item, but the spell will lose its current imbue.
items.consum.spells.summonelemental.desc_chaos=The spell is currently radiating chaotic energy, it will summon a _chaos elemental_. You can imbue a different item, but the spell will lose its current imbue.

items.consum.spells.targetedspell.prompt=Choose a target
items.consum.spells.targetedspell.inv_title=Infuse an item

items.consum.spells.telekineticgrab.name=telekinetic grab
items.consum.spells.telekineticgrab.cant_grab=You can't grab that.
items.consum.spells.telekineticgrab.no_target=There's nothing to grab there.
items.consum.spells.telekineticgrab.desc=This spell allows the caster to remotely grab all items at a location, or all thrown weapons stuck to an enemy!\n\nIt can't be used to grab items that someone else owns, or to grab containers like chests.

items.consum.spells.unstablespell.name=unstable spell
items.consum.spells.unstablespell.desc=This small black square crystal has shifting runic symbols on each of its surfaces.\n\nWhen activated, it will trigger the effect of a random scroll. The scroll effect will always be combat focused if there are enemies in your field of view, and will always be non-combat focused otherwise.

items.consum.spells.wildenergy.name=wild energy
items.consum.spells.wildenergy.desc=This spell contains some of the cursed energy which powered DM-300. When cast, it will recharge your wands and worn artifacts, while also triggering a random cursed wand effect. You are able to choose a direction for this cursed magic to shoot in, however.


###runestones
items.consum.stones.inventorystone.ac_use=USE

items.consum.stones.runestone$placeholder.name=runestone
items.consum.stones.runestone.discover_hint=You can find this item randomly in the dungeon, or craft it via alchemy.

items.consum.stones.stoneofaggression.name=stone of aggression
items.consum.stones.stoneofaggression.desc=When this stone is thrown at an ally or enemy, all nearby enemies will prefer to attack that character for a short time.\n\nBoss enemies cannot be targeted by this effect directly, but it does work on their minions.
items.consum.stones.stoneofaggression$aggression.name=targeted
items.consum.stones.stoneofaggression$aggression.desc=Manipulative magic is making all nearby enemies prefer to attack this character.\n\nTurns remaining: %s.

items.consum.stones.stoneofaugmentation.name=stone of augmentation
items.consum.stones.stoneofaugmentation.inv_title=Augment an item
items.consum.stones.stoneofaugmentation.desc=This runestone possesses potent magic which can augment equipment to enhance one property at the cost of another.\n\nUsing on a weapon will allow you to enhance either speed or damage. Thrown weapons will also gain or lose durability in proportion with their speed.\n\nUsing on armor will allow you to enhance either defense or evasion.
items.consum.stones.stoneofaugmentation.discover_hint=You can buy this item in a shop, or craft it via alchemy.
items.consum.stones.stoneofaugmentation$wndaugment.choice=Augmenting for one property will reduce the other. What property would you like to enhance?
items.consum.stones.stoneofaugmentation$wndaugment.already=This item is already augmented, you can swap the augment or remove it.
items.consum.stones.stoneofaugmentation$wndaugment.speed=+Speed -Damage
items.consum.stones.stoneofaugmentation$wndaugment.damage=+Damage -Speed
items.consum.stones.stoneofaugmentation$wndaugment.evasion=+Evasion -Defense
items.consum.stones.stoneofaugmentation$wndaugment.defense=+Defense -Evasion
items.consum.stones.stoneofaugmentation$wndaugment.none=Remove Augmentation
items.consum.stones.stoneofaugmentation$wndaugment.cancel=Never mind

items.consum.stones.stoneofblast.name=stone of blast
items.consum.stones.stoneofblast.desc=This runestone will instantly explode at the location it is thrown to. Just like a bomb, the explosion will deal damage to anything nearby.

items.consum.stones.stoneofblink.name=stone of blink
items.consum.stones.stoneofblink.desc=This runestone will teleport the user to the location it is thrown to.

items.consum.stones.stoneofclairvoyance.name=stone of clairvoyance
items.consum.stones.stoneofclairvoyance.desc=This stone will instantly reveal all tiles in a very wide area around where it is thrown. Its effect will even reach through walls.

items.consum.stones.stoneofdeepsleep.name=stone of deep sleep
items.consum.stones.stoneofdeepsleep.desc=When this stone is thrown at an enemy, it will put them into a deep magical sleep. Magically slept enemies will sleep forever until disturbed.

items.consum.stones.stoneofdetectmagic.name=stone of detect magic
items.consum.stones.stoneofdetectmagic.inv_title=Detect an item
items.consum.stones.stoneofdetectmagic.detected_none=You don't detect any magic affecting this item.
items.consum.stones.stoneofdetectmagic.detected_both=You detect both positive and malevolent magic affecting this item!
items.consum.stones.stoneofdetectmagic.detected_good=You detect positive magic affecting this item!
items.consum.stones.stoneofdetectmagic.detected_bad=You detect malevolent magic affecting this item!
items.consum.stones.stoneofdetectmagic.desc=This runestone is able to detect magic affecting an item. Using this stone on an unidentified item will tell you if it is affected by a malevolent curse and whether it is affected by positive magic such as an enchantment or upgrades.

items.consum.stones.stoneofdisarming.name=stone of disarming
items.consum.stones.stoneofdisarming.desc=This runestone holds magic that can disable malicious traps hidden throughout the dungeon. It will disarm up to 9 traps around the area it is thrown at.

items.consum.stones.stoneofenchantment.name=stone of enchantment
items.consum.stones.stoneofenchantment.inv_title=Enchant an item
items.consum.stones.stoneofenchantment.weapon=Your weapon glows in the darkness!
items.consum.stones.stoneofenchantment.armor=Your armor glows in the darkness!
items.consum.stones.stoneofenchantment.desc=This runestone possesses enchanting magic. Unlike a scroll of upgrade, it will not increase the direct power of an item, but will instead imbue a weapon or armor with an enchantment, granting it a new power.

items.consum.stones.stoneoffear.name=stone of fear
items.consum.stones.stoneoffear.desc=When this stone is thrown onto a character they will be overwhelmed with terror, and will turn and flee. Attacking a fleeing character will shorten the effect.

items.consum.stones.stoneofflock.name=stone of flock
items.consum.stones.stoneofflock.desc=This runestone summons magical sheep for a short time around the location it is thrown to.

items.consum.stones.stoneofintuition.name=stone of intuition
items.consum.stones.stoneofintuition.inv_title=Select an item
items.consum.stones.stoneofintuition.desc=This runestone holds a weaker version of the magic found in scrolls of identification. Rather than directly identifying an item, it will work on your intuition, allowing you to attempt to identify the type of a potion, scroll, or ring by guessing.
items.consum.stones.stoneofintuition.break_info=You can use stones of intuition twice before one breaks, _your next use won't consume a stone_.
items.consum.stones.stoneofintuition.break_warn=You've used a stone of intuition previously, so _your next use will consume a stone_.
items.consum.stones.stoneofintuition$wndguess.text=Guess what the type of the unidentified item is. If you guess correctly, the type will be identified!
items.consum.stones.stoneofintuition$wndguess.correct=Correct. The item's type has been identified!
items.consum.stones.stoneofintuition$wndguess.incorrect=Your guess was incorrect.
items.consum.stones.stoneofintuition$wndguess.break=Your stone of intuition crumbles to dust...

items.consum.stones.stoneofshock.name=stone of shock
items.consum.stones.stoneofshock.desc=This runestone unleashes a blast of electrical energy which briefly stuns all nearby targets, and grants the thrower wand charge for each target hit.


###trinkets
items.equipment.trinkets.chaoticcenser.name=chaotic censer
items.equipment.trinkets.chaoticcenser.spew=Your censer is about to spew: %s.
items.equipment.trinkets.chaoticcenser.desc=After some time in the alchemy pot this incense-burning censer appears to be producing smoke all on its own! These gasses build up and will spew forth from the censer toward enemies at semi-random intervals. It seems capable of producing all sorts of gasses, but you'll get a moment of warning just before the censer activates.
items.equipment.trinkets.chaoticcenser.typical_stats_desc=Typically this trinket will spawn a harmful gas near an enemy roughly every _%d_ turns. Gasses will only appear when enemies are present. At higher levels these gases are more likely to be exotic and powerful.
items.equipment.trinkets.chaoticcenser.stats_desc=At its current level, this trinket will spawn a harmful gas near an enemy roughly every _%d_ turns. Gasses will only appear when enemies are present. At higher levels these gases are more likely to be exotic and powerful.

items.equipment.trinkets.crackedspyglass.name=cracked spyglass
items.equipment.trinkets.crackedspyglass.desc=This handheld telescope would be a demonstration of great and precise workmanship, if it weren't for the crack along its front lens. The spyglass seems to be helping you by revealing new items in the dungeon, but due to its flaw the revealed items are quite hard to see!
items.equipment.trinkets.crackedspyglass.typical_stats_desc=Typically this trinket has a _%1$s%% chance_ to create an extra hidden item on each non-boss floor.
items.equipment.trinkets.crackedspyglass.stats_desc=At its current level, this trinket has a _%1$s%% chance_ to create an extra hidden item on each non-boss floor.
items.equipment.trinkets.crackedspyglass.stats_desc_upgraded=At its current level, this trinket has a _100%% chance_ to create an extra hidden item on each non-boss floor, and a _%1$s%% chance_ to create a second extra hidden item.

items.equipment.trinkets.dimensionalsundial.name=dimensional sundial
items.equipment.trinkets.dimensionalsundial.warning=Your sundial isn't casting a shadow, you feel uneasy.
items.equipment.trinkets.dimensionalsundial.desc=This small handheld sundial is somehow able to cast a shadow in the depths of the dungeon, even if you aren't holding it upright. Even more strangely, the shadow's position seems to have no relation to the sun in this world. When no shadow is cast, the sundial seems to attract danger.
items.equipment.trinkets.dimensionalsundial.typical_stats_desc=Typically this trinket will reduce the spawning rate of enemies by _%1$d%%_ during the daytime in real life (8am-8pm), and increase the spawning rate of enemies by _%2$d%%_ at nighttime (8pm-8am).
items.equipment.trinkets.dimensionalsundial.stats_desc=At its current level, this trinket will reduce the spawning rate of enemies by _%1$d%%_ during the daytime in real life (8am-8pm), and increase the spawning rate of enemies by _%2$d%%_ at nighttime (8pm-8am).

items.equipment.trinkets.exoticcrystals.name=exotic crystals
items.equipment.trinkets.exoticcrystals.desc=These small pink crystals have the same shape as crystals of alchemical energy. While they can't be used for energy directly, they seem to be somehow influencing the potions and scrolls you find.
items.equipment.trinkets.exoticcrystals.typical_stats_desc=Typically this trinket will replace _%s%%_ of potion or scroll drops with their exotic equivalents. This does not affect potions of strength, scrolls of upgrade, or items that are generated to help solve hazard rooms.
items.equipment.trinkets.exoticcrystals.stats_desc=At its current level this trinket will replace _%s%%_ of potion or scroll drops with their exotic equivalents. This does not affect potions of strength, scrolls of upgrade, or items that are generated to help solve hazard rooms.

items.equipment.trinkets.eyeofnewt.name=eye of newt
items.equipment.trinkets.eyeofnewt.desc=This golden and black newt's eye is a common ingredient, now enhanced into a trinket. The eye seems to be reducing your vision in exchange for letting you see things in other ways.
items.equipment.trinkets.eyeofnewt.typical_stats_desc=Typically this trinket will reduce your vision range by _%1$s%%_, but will also grant you mind vision on enemies within _%2$d_ tiles.
items.equipment.trinkets.eyeofnewt.stats_desc=At its current level this trinket will reduce your vision range by _%1$s%%_, but will also grant you mind vision on enemies within _%2$d_ tiles.

items.equipment.trinkets.ferrettuft.name=ferret tuft
items.equipment.trinkets.ferrettuft.desc=A tuft of silky white ferret fur, held together by a Lime green ribbon tied into a bow. Ferrets are known for their agility, mischievousness, and lack of integrity. Some of that power seems to radiate from the trinket, enhancing the evasion of anything nearby.
items.equipment.trinkets.ferrettuft.typical_stats_desc=Typically this trinket will increase the evasion of all characters by _%1$s%%_.
items.equipment.trinkets.ferrettuft.stats_desc=At its current level this trinket will increase the evasion of all characters by _%1$s%%_.

items.equipment.trinkets.mimictooth.name=mimic tooth
items.equipment.trinkets.mimictooth.desc=This large sharp tooth must have been pulled from a very unhappy mimic. It seems to be influencing the mimics of the dungeon, making them more frequent and dangerous.
items.equipment.trinkets.mimictooth.typical_stats_desc=Typically this trinket will make all kinds of mimic _%1$sx_ more common and much more difficult to detect, but will also increase the amount of loot they drop. Each dungeon floor will also have a _%2$s%%_ chance to contain an extra stealthy ebony mimic.
items.equipment.trinkets.mimictooth.stats_desc=At its current level this trinket will make all kinds of mimic _%1$sx_ more common and much more difficult to detect, but will also increase the amount of loot they drop. Each dungeon floor will also have a _%2$s%%_ chance to contain an extra stealthy ebony mimic.

items.equipment.trinkets.mossyclump.name=mossy clump
items.equipment.trinkets.mossyclump.desc=This clump of wet moss seems to hold onto its moisture no matter how hard you squeeze it. It seems to be magically tied to the dungeon itself, making grass and water more likely to appear.
items.equipment.trinkets.mossyclump.typical_stats_desc=Typically this trinket will make _%d%%_ of unthemed floors become filled with either water or grass instead.\n\nThis trinket costs a larger amount of energy to upgrade.
items.equipment.trinkets.mossyclump.stats_desc=At its current level this trinket will make _%d%%_ of unthemed floors become filled with either water or grass instead.\n\nThis trinket costs a larger amount of energy to upgrade.

items.equipment.trinkets.parchmentscrap.name=parchment scrap
items.equipment.trinkets.parchmentscrap.desc=This little scrap of parchment looks like it came from a scroll. It has retained some of its magic, and it seems to be influencing weapons and armor found in the dungeon.
items.equipment.trinkets.parchmentscrap.typical_stats_desc=Typically this trinket will make enchantments and glyphs _%dx_ as common, and curses on weapons and armor _%sx_ as common. Curses on wands, rings, or artifacts are not affected.\n\nThis trinket costs a larger amount of energy to upgrade.
items.equipment.trinkets.parchmentscrap.stats_desc=At its current level this trinket will make enchantments and glyphs _%dx_ as common, and curses on weapons and armor _%sx_ as common. Curses on wands, rings, or artifacts are not affected.\n\nThis trinket costs a larger amount of energy to upgrade.

items.equipment.trinkets.petrifiedseed.name=petrified seed
items.equipment.trinkets.petrifiedseed.desc=This seed has been fossilised, either by slow geological processes or by magic. The seed seems to be magically influencing the flora of the dungeon, occasionally replacing plant seeds with runestones.
items.equipment.trinkets.petrifiedseed.typical_stats_desc=Typically this trinket will cause trampled grass to drop runestones instead of seeds _%1$s%%_ of the time, and will also cause high grass to drop items _%2$s%%_ more often.
items.equipment.trinkets.petrifiedseed.stats_desc=At its current level this trinket will cause trampled grass to drop runestones instead of seeds _%1$s%%_ of the time, and will also cause high grass to drop items _%2$s%%_ more often.

items.equipment.trinkets.ratskull.name=rat skull
items.equipment.trinkets.ratskull.desc=This macabre trinket isn't much larger than the skull of a normal rat, which is somehow a rarity down in this dungeon. The skull's magical influence seems to attract the more rare denizens of the dungeon, making them appear far more often.
items.equipment.trinkets.ratskull.typical_stats_desc=Typically this trinket will make rare exotic enemies _%dx_ as likely to appear. The skull is only half as effective at attracting crystal mimics and armored statues, however.
items.equipment.trinkets.ratskull.stats_desc=At its current level this trinket will make rare exotic enemies _%dx_ as likely to appear. The skull is only half as effective at attracting crystal mimics and armored statues, however.

items.equipment.trinkets.saltcube.name=salt cube
items.equipment.trinkets.saltcube.desc=This large salt crystal was cut into an almost perfect cube shape, and it somehow managed to drain half the water from the alchemy pot instead of dissolving. It seems to be magically dehydrating and preserving the food you eat, extending the satiety you get, but also lessening your health restoration when not starving.
items.equipment.trinkets.saltcube.typical_stats_desc=Typically this trinket will increase the amount of time before you grow hungry by _%1$s%%_, but will also reduce your rate of health regeneration by _%2$s%%_ unless the floor is locked.
items.equipment.trinkets.saltcube.stats_desc=At its current level this trinket will increase the amount of time before you grow hungry by _%1$s%%_, but will also reduce your rate of health regeneration by _%2$s%%_ unless the floor is locked.

items.equipment.trinkets.shardofoblivion.name=shard of oblivion
items.equipment.trinkets.shardofoblivion.desc=After stewing in the alchemy pot, this small shard of cursed metal has changed to be made of... nothing? Light seems to bend around it, and it hovers in place when you aren't holding it. The shard seems to be magically drawing power from your ignorance, so it's probably best to not think about it too much.
items.equipment.trinkets.shardofoblivion.typical_stats_desc=Typically this trinket will increase the rate that enemies drop loot by 20%% for each piece of unidentified equipment you have equipped or recently used, to a max of _%d item(s)_. The shard will also prevent you from identifying equipment, but can be used to manually identify items that are ready for it.
items.equipment.trinkets.shardofoblivion.stats_desc=At its current level this trinket will increase the rate that enemies drop loot by 20%% for each piece of unidentified equipment you have equipped or recently used, to a max of _%d item(s)_. The shard will also prevent you from identifying equipment, but can be used to manually identify items that are ready for it.
items.equipment.trinkets.shardofoblivion.ac_identify=IDENTIFY
items.equipment.trinkets.shardofoblivion.identify_prompt=Identify an Item
items.equipment.trinkets.shardofoblivion.identify_ready=An item is ready to identify: %s. Use your Shard of Oblivion on it to identify it.
items.equipment.trinkets.shardofoblivion.identify_ready_worn=Your worn items are now all ready to identify. Use your Shard of Oblivion on items to identify them.
items.equipment.trinkets.shardofoblivion.identify_not_yet=That item isn't ready to be identified yet.
items.equipment.trinkets.shardofoblivion.identify=You identify the item!
items.equipment.trinkets.shardofoblivion$wandusetracker.name=Unidentified Wand Used
items.equipment.trinkets.shardofoblivion$wandusetracker.desc=You have recently used an unidentified wand, which counts as one piece of used unidentified equipment for the shard of oblivion for a little while.\n\nTurns remaining: %s.
items.equipment.trinkets.shardofoblivion$thrownusetracker.name=Unidentified Thrown Weapon Used
items.equipment.trinkets.shardofoblivion$thrownusetracker.desc=You have recently used an unidentified thrown weapon, which counts as one piece of used unidentified equipment for the shard of oblivion for a little while.\n\nTurns remaining: %s.

items.equipment.trinkets.thirteenleafclover.name=thirteen leaf clover
items.equipment.trinkets.thirteenleafclover.desc=Somehow stewing in the alchemy pot has caused this clover to grow a bunch of extra leaves! It's not really clear if this trinket is lucky or unlucky, perhaps this trinket will make your luck more chaotic?
items.equipment.trinkets.thirteenleafclover.typical_stats_desc=Typically this trinket will cause you to deal maximum damage _%1$d%%_ of the time, and minimum damage _%2$d%%_ of the time.
items.equipment.trinkets.thirteenleafclover.stats_desc=At its current level this trinket will cause you to deal maximum damage _%1$d%%_ of the time, and minimum damage _%2$d%%_ of the time.

items.equipment.trinkets.trapmechanism.name=trap mechanism
items.equipment.trinkets.trapmechanism.desc=The core mechanism of one of the dungeon's pitfall traps, carefully carved out of the floor so it can be carried. It seems to be magically tied to the dungeon itself, making hazardous terrain more common but also increasing your affinity towards it.
items.equipment.trinkets.trapmechanism.typical_stats_desc=Typically this trinket will make _%1$d%%_ of unthemed floors become filled with either traps or chasms instead. Additionally, _%2$d%%_ of the dungeon's hidden traps will instead be visible.
items.equipment.trinkets.trapmechanism.stats_desc=At its current level this trinket will make _%1$d%%_ of unthemed floors become filled with either traps or chasms instead. Additionally, _%2$d%%_ of the dungeon's hidden traps will instead be visible.

items.equipment.trinkets.vialofblood.name=vial of blood
items.equipment.trinkets.vialofblood.desc=This thin vial contains the blood of some denizen of the dungeon, it moves slowly as you rotate the vial. It seems to be magically enhancing stronger healing effects, but also delaying them.
items.equipment.trinkets.vialofblood.typical_stats_desc=Typically this trinket will increase the overall health you gain from drinking potions of healing, waterskins, or wells of health by _%1$s%%_. However, these healing effects will also occur more slowly, regenerating a maximum of _%2$s_ HP per turn (this scales with hero level).
items.equipment.trinkets.vialofblood.stats_desc=At its current level this trinket will increase the overall health you gain from drinking potions of healing, waterskins, or wells of health by _%1$s%%_. However, these healing effects will also occur more slowly, regenerating a maximum of _%2$s_ HP per turn (this scales with hero level).

items.equipment.trinkets.wondrousresin.name=wondrous resin
items.equipment.trinkets.wondrousresin.desc=This shimmering blue resin appears to have the distilled essence of a cursed wand's magic. The magic from the alchemy pot has seemed to stabilize it somewhat, and it's now affecting your wands.
items.equipment.trinkets.wondrousresin.typical_stats_desc=Typically this trinket will force cursed wand effects to become neutral or positive _%1$s%%_ of the time, and will cause uncursed wands to fire an additional neutral or positive cursed zap _%2$s%%_ of the time.\n\nThis trinket costs a larger amount of energy to upgrade.
items.equipment.trinkets.wondrousresin.stats_desc=At its current level this trinket will force cursed wand effects to become neutral or positive _%1$s%%_ of the time, and will cause uncursed wands to fire an additional neutral or positive cursed zap _%2$s%%_ of the time.\n\nThis trinket costs a larger amount of energy to upgrade.

items.equipment.trinkets.trinketcatalyst.name=magical catalyst
items.equipment.trinkets.trinketcatalyst.window_title=create a trinket
items.equipment.trinkets.trinketcatalyst.window_text=The water begins to glow as you add the catalyst. There are a few nearby items you could imbue with energy to turn into a magical trinket.
items.equipment.trinkets.trinketcatalyst.desc=This ball of magical golden dust glimmers in the darkness of the dungeon. This catalyst can be used at an alchemy pot with a little alchemical energy to produce a unique trinket item.\n\nTrinkets provide various different effects that slightly alter the dungeon or its inhabitants. Trinkets can be upgraded with more energy to make their effect more powerful, or dropped to forego the effect entirely.
items.equipment.trinkets.trinketcatalyst$randomtrinket.name=random trinket
items.equipment.trinkets.trinketcatalyst$randomtrinket.desc=One nearby item is stuck inside a pouch that you can't get open.\n\nThe alchemy process will dissolve the pouch away, but you won't know what trinket you'll get until you do it!

items.equipment.trinkets.trinket.discover_hint=This item has a chance to be an option whenever you craft a trinket via alchemy.
items.equipment.trinkets.trinket$placeholder.name=trinket

###wands
items.equipment.wands.cursedwand.ondeath=You were killed by your own %s.
items.equipment.wands.cursedwand.nothing=Nothing happens.
items.equipment.wands.cursedwand.mass_invuln=Brilliant light erupts from your wand!
items.equipment.wands.cursedwand.petrify=You suddenly freeze in place!
items.equipment.wands.cursedwand.grass=Grass erupts around you!
items.equipment.wands.cursedwand.fire=You smell burning...
items.equipment.wands.cursedwand.transmogrify_wand=Your wand transmogrifies into a different item!
items.equipment.wands.cursedwand.transmogrify_other=Your item transmogrifies into something different!
items.equipment.wands.cursedwand.disguise=Your appearance changes before your eyes!
items.equipment.wands.cursedwand.supernova=A blazing ball of energy starts to grow. You might want to run!
items.equipment.wands.cursedwand.supernova_positive=A blazing ball of energy starts to grow, but it feels safe somehow.
items.equipment.wands.cursedwand.sinkhole=The ground starts to give way around you!
items.equipment.wands.cursedwand.sinkhole_positive=The ground starts to give way, but feels solid enough beneath you.
items.equipment.wands.cursedwand.gravity=Gravity suddenly starts to pull in random directions!
items.equipment.wands.cursedwand.gravity_positive=Gravity suddenly starts to pull in random directions, but this doesn't seem to affect you.
items.equipment.wands.cursedwand.gravity_end=The gravity chaos ends.

items.equipment.wands.damagewand.upgrade_stat_name_1=Magic Damage

items.equipment.wands.wand.ac_zap=ZAP
items.equipment.wands.wand.fizzles=Your wand fizzles; it must not have enough charge.
items.equipment.wands.wand.no_magic=Your wand fizzles; you cannot use wands while magic immune.
items.equipment.wands.wand.self_target=You can't target yourself!
items.equipment.wands.wand.identify=You are now familiar enough with your wand to identify it.
items.equipment.wands.wand.resin_one=This wand has gained _1 level_ from arcane resin.
items.equipment.wands.wand.resin_many=This wand has gained _%d levels_ from arcane resin.
items.equipment.wands.wand.cursed=This wand is cursed, making its magic chaotic and random.
items.equipment.wands.wand.not_cursed=This wand is free of malevolent magic.
items.equipment.wands.wand.curse_discover=This %s is cursed!
items.equipment.wands.wand.prompt=Choose a location to zap
items.equipment.wands.wand$placeholder.name=wand

items.equipment.wands.wandofblastwave.name=wand of blast wave
items.equipment.wands.wandofblastwave.staff_name=staff of blast wave
items.equipment.wands.wandofblastwave.ondeath=You killed yourself with your own Wand of Blast Wave...
items.equipment.wands.wandofblastwave.knockback_ondeath=The collision killed you...
items.equipment.wands.wandofblastwave.desc=This wand is made of a sort of marbled stone, with gold trim and a round black gem at the tip. It feels very weighty in your hand.
items.equipment.wands.wandofblastwave.typical_stats_desc=This wand shoots a bolt which violently detonates at a target location. The force of this blast typically deals _%1$d-%2$d damage_ and is strong enough to send most enemies flying.
items.equipment.wands.wandofblastwave.stats_desc=This wand shoots a bolt which violently detonates at a target location. The force of this blast deals _%1$d-%2$d damage_ and is strong enough to send most enemies flying.
items.equipment.wands.wandofblastwave.upgrade_stat_name_2=Knockback
items.equipment.wands.wandofblastwave.bmage_desc=When _the Battlemage_ strikes a paralyzed enemy with a staff of blast wave, it will consume the paralysis to deal a burst of bonus magic damage. This has a short cooldown per-enemy.
items.equipment.wands.wandofblastwave.eleblast_desc=An elemental blast with a staff of blast wave deals 67% damage and knocks all enemies outside of the blast area.

items.equipment.wands.wandofcorrosion.name=wand of corrosion
items.equipment.wands.wandofcorrosion.staff_name=staff of corrosion
items.equipment.wands.wandofcorrosion.desc=This wand has an ashen body which opens to a brilliant orange gem.
items.equipment.wands.wandofcorrosion.stats_desc=This wand shoots a bolt which explodes into a cloud of highly corrosive gas at a targeted location. Anything caught inside this cloud will take increasing damage over time, starting at _%d damage._
items.equipment.wands.wandofcorrosion.upgrade_stat_name_1=Corrosion Damage
items.equipment.wands.wandofcorrosion.upgrade_stat_name_2=Gas Volume
items.equipment.wands.wandofcorrosion.bmage_desc=When _the Battlemage_ strikes an enemy with a staff of corrosion, the enemy has a chance to become oozed.
items.equipment.wands.wandofcorrosion.eleblast_desc=An elemental blast with a staff of corrosion inflicts enemies with 4 turns of corrosion, starting at 6 damage.

items.equipment.wands.wandofcorruption.name=wand of corruption
items.equipment.wands.wandofcorruption.staff_name=staff of corruption
items.equipment.wands.wandofcorruption.already_corrupted=That character cannot be influenced further.
items.equipment.wands.wandofcorruption.desc=This wand radiates chaotic dark energy, if that weren't already obvious from the small decorative skull shaped onto its tip.
items.equipment.wands.wandofcorruption.stats_desc=This wand will release a blast of corrupting energy which will debuff enemies and eventually bend them to your will. Enemies are able to resist the corruption, but weakened enemies are much easier to corrupt than healthy ones.
items.equipment.wands.wandofcorruption.upgrade_stat_name_1=Corrupting Power
items.equipment.wands.wandofcorruption.upgrade_stat_name_2=Debuff Duration
items.equipment.wands.wandofcorruption.bmage_desc=When _the Battlemage_ strikes an enemy with a staff of corruption, the enemy has a chance to become amoked.
items.equipment.wands.wandofcorruption.eleblast_desc=An elemental blast with a staff of corruption inflicts enemies with 5 turns of amok.

items.equipment.wands.wandofdisintegration.name=wand of disintegration
items.equipment.wands.wandofdisintegration.staff_name=staff of disintegration
items.equipment.wands.wandofdisintegration.desc=This _energy_ wand is made from a solid smooth chunk of obsidian, with a deep purple light running up its side and ending at the tip. It glows with destructive energy, waiting to shoot forward.
items.equipment.wands.wandofdisintegration.stats_desc=This wand shoots a beam that pierces any obstacle, and will go farther the more it is upgraded. The beam deals _%1$d-%2$d damage,_ and will also deal bonus damage for each enemy and wall it penetrates.
items.equipment.wands.wandofdisintegration.upgrade_stat_name_2=Max Range
items.equipment.wands.wandofdisintegration.bmage_desc=When wielded by _the Battlemage_, a staff of disintegration has increased attack range, as if it had a projecting enchantment.
items.equipment.wands.wandofdisintegration.eleblast_desc=An elemental blast with a staff of disintegration deals 100% damage and pierces through walls.

items.equipment.wands.wandoffireblast.name=wand of fireblast
items.equipment.wands.wandoffireblast.staff_name=staff of fireblast
items.equipment.wands.wandoffireblast.desc=This wand is made from red-lacquered wood with golden leaf used liberally to make it look quite regal. It crackles and hisses at the tip, eager to unleash its powerful magic.
items.equipment.wands.wandoffireblast.stats_desc=This wand blasts out a cone of fire when used. Its next attack will consume _%1$d charges_ and deal _%2$d-%3$d damage._ The more charges the wand uses, the larger and stronger the effect.
items.equipment.wands.wandoffireblast.upgrade_stat_name_1=1 Charge Damage
items.equipment.wands.wandoffireblast.upgrade_stat_name_2=2 Charge Damage
items.equipment.wands.wandoffireblast.upgrade_stat_name_3=3 Charge Damage
items.equipment.wands.wandoffireblast.bmage_desc=When _the Battlemage_ strikes an enemy with a staff of fireblast, there is a chance for it to produce an explosion that damages enemies and consumes all nearby fire! This chance increases the more fire is adjacent to the enemy.
items.equipment.wands.wandoffireblast.eleblast_desc=An elemental blast with a staff of fireblast deals 100% damage, bursts open doors, and sets enemies and terrain on fire.

items.equipment.wands.wandoffrost.name=wand of frost
items.equipment.wands.wandoffrost.staff_name=staff of frost
items.equipment.wands.wandoffrost.desc=This wand seems to be made out of some kind of magical ice. It grows brighter towards its rounded tip. It feels very cold when held, but somehow your hand stays warm.
items.equipment.wands.wandoffrost.stats_desc=This wand shoots blasts of icy energy toward your foes, dealing _%1$d-%2$d damage_ and chilling. The effect seems stronger in water. Enemies that are already chilled or frozen take less damage from this wand.
items.equipment.wands.wandoffrost.upgrade_stat_name_2=Chill Duration
items.equipment.wands.wandoffrost.bmage_desc=When _the Battlemage_ strikes a chilled enemy with a staff of frost, they have a chance to instantly freeze. This chance becomes greater the more chilled they are.
items.equipment.wands.wandoffrost.eleblast_desc=An elemental blast with a staff of frost deals 100% damage, freezes enemies, and puts out fires.

items.equipment.wands.wandoflightning.name=wand of lightning
items.equipment.wands.wandoflightning.staff_name=staff of lightning
items.equipment.wands.wandoflightning.ondeath=You killed yourself with your own Wand of Lightning...
items.equipment.wands.wandoflightning.desc=This _electrical_ wand is made out of solid metal, making it surprisingly heavy. Two prongs curve together at the tip, and electricity arcs between them.
items.equipment.wands.wandoflightning.stats_desc=This wand sends powerful lightning arcing through whatever it is shot at, dealing _%1$d-%2$d damage._ The electricity can bounce between many nearby targets, spreading damage between them, and becomes stronger in water. If you are too close, you may get shocked as well!
items.equipment.wands.wandoflightning.bmage_desc=When _the Battlemage_ strikes an enemy with a staff of lightning, he has a chance to electrically charge himself for 10 turns. While charged the Battlemage is immune to lightning damage and will arc lightning further.
items.equipment.wands.wandoflightning.eleblast_desc=An elemental blast with a staff of lightning deals 100% damage, stuns enemies for 5 turns, and electrifies water.
items.equipment.wands.wandoflightning$lightningcharge.name=Electrically charged
items.equipment.wands.wandoflightning$lightningcharge.desc=The Battlemage is currently charged with energy, granting him immunity to his staff of lightning and increasing the range that lightning can arc from it.\n\nTurns Remaining: %s.

items.equipment.wands.wandoflivingearth.name=wand of living earth
items.equipment.wands.wandoflivingearth.staff_name=staff of living earth
items.equipment.wands.wandoflivingearth.desc=This wand is made from a curious rock, with bands of glowing yellow energy. The rocks seem to shift slightly as you grip the wand, as if they can feel your hand.
items.equipment.wands.wandoflivingearth.stats_desc=This wand sends bolts of magical rock at enemies, dealing _%1$d-%2$d damage._ The rocks will then re-form around the user, granting them armor in proportion to the damage dealt. If enough armor is built, it will form into a rock guardian when the wand is next zapped.
items.equipment.wands.wandoflivingearth.upgrade_stat_name_2=Guardian Max HP
items.equipment.wands.wandoflivingearth.upgrade_stat_name_3=Guardian Blocking
items.equipment.wands.wandoflivingearth.bmage_desc=When _the Battlemage_ strikes an enemy with a staff of living earth, some of the damage dealt is returned as rock armor.
items.equipment.wands.wandoflivingearth.eleblast_desc=An elemental blast with a staff of living earth deals 50% damage, and heals an active earthen guardian for each enemy hit.
items.equipment.wands.wandoflivingearth$rockarmor.name=rock armor
items.equipment.wands.wandoflivingearth$rockarmor.desc=Magical rocks are surrounding your body, when you are attacked they will attempt to block for you, and will reduce the damage you take by 50%%. Each damage blocked scrapes away some of the rock however.\n\nRemaining Armor: %1$d.\n\nIf enough rock is built around you, the next zap from your wand of living earth will cause the rocks to form up into a guardian which will fight with you.\n\nArmor needed for Guardian: %2$d.
items.equipment.wands.wandoflivingearth$rockarmor.desc_many=This earthen guardian is also benefitting from Power of Many. Turns Remaining: %d.
items.equipment.wands.wandoflivingearth$earthguardian.name=earthen guardian
items.equipment.wands.wandoflivingearth$earthguardian.desc=The rocks from your wand of living earth have formed into a protective earthen guardian! This rocky protector will attack nearby enemies, which will force them to attack the guardian instead of you. When all nearby threats are gone, the guardian will re-form around you, and will return when you next use your wand.
items.equipment.wands.wandoflivingearth$earthguardian.wand_info=The guardian's defensive power is tied to the level of your wand. It currently blocks _%1$d-%2$d damage._
items.equipment.wands.wandoflivingearth$earthguardian.discover_hint=You can find this character with a specific wand.

items.equipment.wands.wandofmagicmissile.name=wand of magic missile
items.equipment.wands.wandofmagicmissile.staff_name=staff of magic missile
items.equipment.wands.wandofmagicmissile.desc=This fairly plain _energy_ wand launches missiles of pure magical energy.
items.equipment.wands.wandofmagicmissile.stats_desc=Each bolt from this wand deals _%1$d-%2$d damage_ and causes magic weakness.
items.equipment.wands.wandofmagicmissile.bmage_desc=When _the Battlemage_ strikes an enemy with a staff of magic missile, all of his wands will gain charge in addition to his staff.
items.equipment.wands.wandofmagicmissile.eleblast_desc=An elemental blast with a staff of magic missile deals 50% damage, and grants the mage 15 turns of recharging.
items.equipment.wands.wandofmagicmissile.discover_hint=One of the heroes starts with this item.
items.equipment.wands.wandofmagicmissile$magiccharge.name=magic charge
items.equipment.wands.wandofmagicmissile$magiccharge.desc=Your wand of magic missile has fed power back into your wands, boosting the effective level of the next zap they make.\n\nYour wands are boosted to: +%d.\n\nTurns of magic charge remaining: %s.

items.equipment.wands.wandofprismaticlight.name=wand of prismatic light
items.equipment.wands.wandofprismaticlight.staff_name=staff of prismatic light
items.equipment.wands.wandofprismaticlight.desc=This wand is made of a solid piece of translucent crystal, like a long chunk of smooth glass. Small bits of colorful light dance around the tip of the wand, eager to burst forth.
items.equipment.wands.wandofprismaticlight.stats_desc=This wand shoots rays of light which cut through the darkness of the dungeon, revealing hidden areas and traps. The beam can blind enemies, and deals _%1$d-%2$d damage._ Demonic and undead foes will burn in the bright light of the wand, taking bonus damage.
items.equipment.wands.wandofprismaticlight.upgrade_stat_name_2=Blind Chance
items.equipment.wands.wandofprismaticlight.upgrade_stat_name_3=Light Duration
items.equipment.wands.wandofprismaticlight.bmage_desc=When _the Battlemage_ strikes an enemy with a staff of prismatic light, they will be crippled for a duration that scales with staff level.
items.equipment.wands.wandofprismaticlight.eleblast_desc=An elemental blast with a staff of prismatic light deals 67% damage, reveals all terrain in the blast, and blinds enemies for 5 turns.

items.equipment.wands.wandofregrowth.name=wand of regrowth
items.equipment.wands.wandofregrowth.staff_name=staff of regrowth
items.equipment.wands.wandofregrowth.desc=This wand is made from a thin shaft of expertly carved wood. Somehow it is still alive and vibrant, bright green like a young tree's core. "When life ceases new life always begins to grow... The eternal cycle always remains!"
items.equipment.wands.wandofregrowth.stats_desc=When used, this wand will blast magical regrowth energy outward in a cone, causing grass, roots, and rare plants to spring to life. Its next zap will consume _%1$d charges_. The more charges the wand uses, the larger and stronger the effect.
items.equipment.wands.wandofregrowth.degradation=After another _%d charges_ this wand will start failing to produce plants and fresh grass. This limit is increased by leveling up or upgrading the wand.
items.equipment.wands.wandofregrowth.upgrade_stat_name_1=Grass Per Charge
items.equipment.wands.wandofregrowth.upgrade_stat_name_2=Total Grass Limit
items.equipment.wands.wandofregrowth.bmage_desc=When _the Battlemage_ strikes an enemy with a staff of regrowth, and either are standing on grass, he will gain herbal healing in proportion with the damage dealt.
items.equipment.wands.wandofregrowth.eleblast_desc=An elemental blast with a staff of regrowth roots enemies and grows grass randomly over the blasts area.
items.equipment.wands.wandofregrowth$dewcatcher.name=Dewcatcher
items.equipment.wands.wandofregrowth$dewcatcher.desc=Dewcatchers are wondrous plants that fill themselves with magical dew. They attempt to camouflage as grass to avoid attention, but their bulges of collected dew give them away.
items.equipment.wands.wandofregrowth$dewcatcher.discover_hint=You can find this plant with a specific wand.
items.equipment.wands.wandofregrowth$seedpod.name=Seed Pod
items.equipment.wands.wandofregrowth$seedpod.desc=Seed Pods are magical plants that produce seeds from other plant types, rather than any seeds of their own. They somehow manage to spread despite having no seed of their own.
items.equipment.wands.wandofregrowth$seedpod.discover_hint=You can find this plant with a specific wand.
items.equipment.wands.wandofregrowth$lotus.name=Golden Lotus
items.equipment.wands.wandofregrowth$lotus.desc=The golden lotus is a mystical plant that can only be conjured by a powerful wand of regrowth. Its aura enhances all plants and plant effects, but it burns through its energy and dies after a short time.
items.equipment.wands.wandofregrowth$lotus.wand_info=This lotus was produced by a _+%1$d_ wand of regrowth. All plants in its effect will _instantly trigger_ if they are planted on a character. Plants will also have a _%2$d%% chance_ to drop their seed, and tipped darts will use _%3$d%% less durability_.
items.equipment.wands.wandofregrowth$lotus.discover_hint=You can find this plant with a specific wand, after upgrading it several times.

items.equipment.wands.wandoftransfusion.name=wand of transfusion
items.equipment.wands.wandoftransfusion.staff_name=staff of transfusion
items.equipment.wands.wandoftransfusion.ondeath=You killed yourself with your own Wand of Transfusion...
items.equipment.wands.wandoftransfusion.charged=Your staff is charged with the life energy of your enemy!
items.equipment.wands.wandoftransfusion.desc=A fairly plainly shaped wand, it stands out due to its magenta hue and pitch black gem at the tip.
items.equipment.wands.wandoftransfusion.stats_desc=When used on allies or charmed enemies, this wand will sap _%1$d of the user's health_ to heal or shield the ally for _%2$d health._ When used on enemies, the wand briefly charms them while applying _%3$d shielding_ to the user. Hostile undead will take _%4$d-%5$d damage_ instead of being charmed.
items.equipment.wands.wandoftransfusion.upgrade_stat_name_1=Ally Healing
items.equipment.wands.wandoftransfusion.upgrade_stat_name_2=Self-Shielding
items.equipment.wands.wandoftransfusion.upgrade_stat_name_3=Undead Damage
items.equipment.wands.wandoftransfusion.bmage_desc=When _the Battlemage_ strikes a charmed enemy with a staff of transfusion, he will gain shielding and his next zap with the staff will not cost any health.
items.equipment.wands.wandoftransfusion.eleblast_desc=An elemental blast with a staff of transfusion charms enemies, heals allies, and deals 100% damage to undead enemies.

items.equipment.wands.wandofwarding.name=wand of warding
items.equipment.wands.wandofwarding.staff_name=staff of warding
items.equipment.wands.wandofwarding.no_more_wards=Your wand can't sustain any more wards.
items.equipment.wands.wandofwarding.bad_location=You can't place a ward there.
items.equipment.wands.wandofwarding.desc=This short metal wand has a bright purple gem floating above its tip.
items.equipment.wands.wandofwarding.stats_desc=Rather than directly damaging an enemy, this wand will summon stationary wards and sentries. Wards can be summoned anywhere, even through walls if you have vision. This wand can sustain _%d energy_ worth of wards at a time.
items.equipment.wands.wandofwarding.upgrade_stat_name_1=Ward Damage
items.equipment.wands.wandofwarding.upgrade_stat_name_2=Ward Energy
items.equipment.wands.wandofwarding.bmage_desc=When _the Battlemage_ strikes an enemy with a staff of warding, all active wards and sentries have a chance to be healed.
items.equipment.wands.wandofwarding.eleblast_desc=An elemental blast with a staff of warding heals all wards and sentries in the blast area.
items.equipment.wands.wandofwarding$ward.desc_generic_ward=This ward will automatically zap any enemy which comes into its range of vision.\n\nZapping this ward with your wand of warding will upgrade it.\n\nWards have a limited number of zaps before dissipating.
items.equipment.wands.wandofwarding$ward.desc_generic_sentry=This sentry has the same firepower as a ward, but has health instead of a set number of charges. It resembles the gem at the tip of your wand of warding.\n\nZapping this sentry with your wand of warding will upgrade and heal it.\n\nThis sentry will spend some health each time it zaps an enemy, but can be healed by using your wand of warding on it.
items.equipment.wands.wandofwarding$ward.name_1=lesser ward
items.equipment.wands.wandofwarding$ward.desc_1=This basic ward will automatically zap any enemy which comes into its range of vision, dealing _%1$d-%2$d damage._\n\nZapping this ward with your wand of warding will upgrade it.\n\nThis ward will only zap a single time before dissipating.\n\nYour wand of warding is using _%3$d energy_ to sustain this ward.
items.equipment.wands.wandofwarding$ward.name_2=ward
items.equipment.wands.wandofwarding$ward.desc_2=This upgraded ward has a more intricate pattern, and can attack multiple times. Each zap from this ward will deal _%1$d-%2$d damage._\n\nZapping this ward with your wand of warding will upgrade it.\n\nThis ward will zap three times before dissipating.\n\nYour wand of warding is using _%3$d energy_ to sustain this ward.
items.equipment.wands.wandofwarding$ward.name_3=greater ward
items.equipment.wands.wandofwarding$ward.desc_3=This fully upgraded ward is able to attack more times than its predecessors. Each zap from this ward will deal _%1$d-%2$d damage._\n\nZapping this ward with your wand of warding will upgrade it.\n\nThis ward will zap five times before dissipating.\n\nYour wand of warding is using _%3$d energy_ to sustain this ward.
items.equipment.wands.wandofwarding$ward.name_4=lesser sentry
items.equipment.wands.wandofwarding$ward.desc_4=This smaller sentry has the same firepower as a greater ward, but has health instead of a set number of charges. It resembles the gem at the tip of your wand of warding. Each zap from this sentry will deal _%1$d-%2$d damage._\n\nZapping this sentry with your wand of warding will upgrade and heal it.\n\nThis sentry will spend some health each time it zaps an enemy, but can be healed by using your wand of warding on it.\n\nYour wand of warding is using _%3$d energy_ to sustain this sentry.
items.equipment.wands.wandofwarding$ward.name_5=sentry
items.equipment.wands.wandofwarding$ward.desc_5=This upgraded sentry is larger and more durable than a lesser sentry. Each zap from this sentry will deal _%1$d-%2$d damage._\n\nZapping this sentry with your wand of warding will upgrade and heal it.\n\nThis sentry will spend some health each time it zaps an enemy, but can be healed by using your wand of warding on it.\n\nYour wand of warding is using _%3$d energy_ to sustain this sentry.
items.equipment.wands.wandofwarding$ward.name_6=greater sentry
items.equipment.wands.wandofwarding$ward.desc_6=This fully upgraded sentry is significantly more durable than its predecessors. Each zap from this sentry will deal _%1$d-%2$d damage._\n\nZapping this sentry with your wand of warding will heal it.\n\nThis sentry will spend some health each time it zaps an enemy, but can be healed by using your wand of warding on it.\n\nYour wand of warding is using _%3$d energy_ to sustain this sentry.
items.equipment.wands.wandofwarding$ward.discover_hint=You can find this character with a specific wand.
items.equipment.wands.wandofwarding$ward.dismiss_title=Dismiss this ward?
items.equipment.wands.wandofwarding$ward.dismiss_body=You can dispel this ward if you no longer want your wand to maintain it. Doing so immediately destroys the ward.\n\nDismiss this ward?
items.equipment.wands.wandofwarding$ward.dismiss_confirm=yes
items.equipment.wands.wandofwarding$ward.dismiss_cancel=no

###weapon curses
items.equipment.weapon.curses.annoying.name=annoying %s
items.equipment.weapon.curses.annoying.msg_1=OOH, ARE WE FIGHTING SOMETHING!?
items.equipment.weapon.curses.annoying.msg_2=YEAH, GET THEM!
items.equipment.weapon.curses.annoying.msg_3=HEY, LISTEN!
items.equipment.weapon.curses.annoying.msg_4=ARE WE AT THE BOSS YET!?
items.equipment.weapon.curses.annoying.msg_5=OUCH, DON'T SWING ME SO HARD!
items.equipment.weapon.curses.annoying.msg_6=DIE, INSECT!
items.equipment.weapon.curses.annoying.msg_7=WHEEEEEEEEEEEEEEE!
items.equipment.weapon.curses.annoying.msg_8=CAN WE TAKE A BREAK!?
items.equipment.weapon.curses.annoying.msg_9=POW, HAHA!
items.equipment.weapon.curses.annoying.msg_10=WELL STRUCK!
items.equipment.weapon.curses.annoying.msg_11=I didn't want to be a weapon, I wanted to be a lumberjack's axe.
items.equipment.weapon.curses.annoying.msg_12=Remember, overconfidence is a slow and insidious killer.
items.equipment.weapon.curses.annoying.msg_13=ALL YOUR BASE ARE BELONG TO US!
items.equipment.weapon.curses.annoying.desc=Annoying weapons are capable of speech, but they're a bit too energetic. They will often draw attention to you without meaning to.
items.equipment.weapon.curses.annoying.elestrike_desc=An elemental strike with an annoying curse has a 20% chance to amok each enemy in range for 6 turns.

items.equipment.weapon.curses.dazzling.name=dazzling %s
items.equipment.weapon.curses.dazzling.desc=Dazzling weapons will sometimes flash with dazzling light, blinding everything that can see them.
items.equipment.weapon.curses.dazzling.elestrike_desc=An elemental strike with a dazzling curse has a 50% chance to blind each enemy in range for 6 turns.

items.equipment.weapon.curses.displacing.name=displacing %s
items.equipment.weapon.curses.displacing.desc=Displacing weapons are infused with chaotic teleportation magic, possessing the ability to warp enemies around the floor randomly.
items.equipment.weapon.curses.displacing.elestrike_desc=An elemental strike with a displacing curse has a 50% chance to teleport each enemy in range.

items.equipment.weapon.curses.explosive.name=explosive %s
items.equipment.weapon.curses.explosive.warm=Warm...
items.equipment.weapon.curses.explosive.hot=Hot!
items.equipment.weapon.curses.explosive.desc=Explosive weapons steadily build up power and explode, damaging anything nearby.
items.equipment.weapon.curses.explosive.desc_cool=Your weapon is currently cool to the touch.
items.equipment.weapon.curses.explosive.desc_warm=Your weapon is building energy and getting warm...
items.equipment.weapon.curses.explosive.desc_hot=Your weapon is hot! It's about to explode!
items.equipment.weapon.curses.explosive.elestrike_desc=An elemental strike with an explosive curse has a 50% chance to cause an explosion to appear on a random enemy in range.

items.equipment.weapon.curses.friendly.name=friendly %s
items.equipment.weapon.curses.friendly.desc=Friendly weapons are best suited for pacifists, occasionally triggering magic that makes it impossible to fight.
items.equipment.weapon.curses.friendly.elestrike_desc=An elemental strike with a friendly curse has a 50% chance to charm each enemy in range for 6 turns.

items.equipment.weapon.curses.polarized.name=polarized %s
items.equipment.weapon.curses.polarized.desc=A polarized weapon is affected by magic that causes its attack to either deal 50% more damage, or no damage at all.
items.equipment.weapon.curses.polarized.elestrike_desc=An elemental strike with a polarized curse has a 50% chance to deal 24-36 damage to each enemy in range.

items.equipment.weapon.curses.pressurized.name=pressurized %s
items.equipment.weapon.curses.pressurized.desc=Pressurized weapons are capable of erupting with a forceful geyser of water which knocks everything away, including you.
items.equipment.weapon.curses.pressurized.elestrike_desc=An elemental strike with a pressurized curse will create a wave of water that destroys terrain and knocks back every enemy in range.

items.equipment.weapon.curses.sacrificial.name=sacrificial %s
items.equipment.weapon.curses.sacrificial.desc=Sacrificial weapons will demand blood from the wearer in return for attacking foes. The more healthy the wearer is, the more blood the curse will take.
items.equipment.weapon.curses.sacrificial.elestrike_desc=An elemental strike with a sacrificial curse causes the hero and each enemy in range to bleed for 12 HP.

items.equipment.weapon.curses.wayward.name=wayward %s
items.equipment.weapon.curses.wayward.desc=Wayward weapons will sometimes become extremely inaccurate. This magic lasts for a little while when it activates, but can be dispelled by landing a blow with the wayward weapon.
items.equipment.weapon.curses.wayward.elestrike_desc=An elemental strike with a wayward curse has a 50% chance to hex each enemy in range for 6 turns.
items.equipment.weapon.curses.wayward$waywardbuff.name=wayward
items.equipment.weapon.curses.wayward$waywardbuff.desc=Your wayward weapon's magic has activated, making it extremely inaccurate for a short time. Note that this does not affect attacks which are guaranteed to hit, such as surprise attacks. Successfully attacking with the wayward weapon will clear this effect immediately.\n\nTurns remaining: %s.

items.equipment.weapon.curses.wondrous.name=wondrous %s
items.equipment.weapon.curses.wondrous.desc=Wondrous weapons contain the same chaotic magic found in cursed wands. There's no telling what will happen when this curse triggers!
items.equipment.weapon.curses.wondrous.elestrike_desc=An elemental strike with a wondrous curse has a chance to apply a different cursed wand effect to every enemy in range.

###enchantments
items.equipment.weapon.enchantments.blazing.name=blazing %s
items.equipment.weapon.enchantments.blazing.desc=This enchantment causes flames to spit forth from a weapon, igniting enemies and dealing bonus damage to enemies that are already aflame.
items.equipment.weapon.enchantments.blazing.elestrike_desc=An elemental strike with a blazing enchantment spreads fire to every tile in range, which lasts 8 turns.

items.equipment.weapon.enchantments.blocking.name=blocking %s
items.equipment.weapon.enchantments.blocking.desc=Blocking weapons have a chance to briefly shield you after attacking with them.
items.equipment.weapon.enchantments.blocking.elestrike_desc=An elemental strike with a blocking enchantment grants the Duelist an extra 6 shielding for each enemy in range.
items.equipment.weapon.enchantments.blocking$blockbuff.name=blocking
items.equipment.weapon.enchantments.blocking$blockbuff.desc=Your weapon's blocking enchantment has granted you a brief boost to your defensive power!\n\nShielding remaining: %d\n\nTurns remaining: %s.

items.equipment.weapon.enchantments.blooming.name=blooming %s
items.equipment.weapon.enchantments.blooming.desc=Blooming weapons contain magic which will cause vegetation to sprout on or around those struck by them.
items.equipment.weapon.enchantments.blooming.elestrike_desc=An elemental strike with a blooming enchantment spreads grass to up to 8 tiles in range, and roots all enemies in range for 6 turns.

items.equipment.weapon.enchantments.chilling.name=chilling %s
items.equipment.weapon.enchantments.chilling.desc=Enemies struck with this enchantment are chilled, slowing their movement and attacks.
items.equipment.weapon.enchantments.chilling.elestrike_desc=An elemental strike with a chilling enchantment spreads chilling air to every tile in range, which lasts 8 turns.

items.equipment.weapon.enchantments.crystal.name=crystal %s
items.equipment.weapon.enchantments.crystal.alert_fixed=Your crystal weapon is fully repaired!
items.equipment.weapon.enchantments.crystal.alert_fixed_ghost=The ghost's crystal weapon is fully repaired!
items.equipment.weapon.enchantments.crystal.alert_noflaw=Your crystal weapon is no longer flawed.
items.equipment.weapon.enchantments.crystal.alert_noflaw_ghost=The ghost's crystal weapon is no longer flawed.
items.equipment.weapon.enchantments.crystal.alert_nocrack=Your crystal weapon is no longer cracked.
items.equipment.weapon.enchantments.crystal.alert_nocrack_ghost=The ghost's crystal weapon is no longer cracked.
items.equipment.weapon.enchantments.crystal.alert_flawed=Your crystal weapon has become slightly damaged.
items.equipment.weapon.enchantments.crystal.alert_flawed_ghost=The ghost's crystal weapon has become slightly damaged.
items.equipment.weapon.enchantments.crystal.alert_cracked=Your crystal weapon cracks, it's about to break!
items.equipment.weapon.enchantments.crystal.alert_cracked_ghost=The ghost's crystal weapon cracks, it's about to break!
items.equipment.weapon.enchantments.crystal.alert_shattered=Your crystal weapon shatters into pieces!
items.equipment.weapon.enchantments.crystal.alert_shattered_ghost=The ghost's crystal weapon shatters into pieces!
items.equipment.weapon.enchantments.crystal.desc=This powerful enchantment deals extra magic damage and enhances a weapon's value. However, the enchanted weapon can shatter if the crystals aren't repaired, or given time to self-repair.
items.equipment.weapon.enchantments.crystal.desc_thrown=Crystal thrown weapons have much less durability, but regain it slowly over time.
items.equipment.weapon.enchantments.crystal.desc_perfect=This crystal weapon is currently in perfect condition.
items.equipment.weapon.enchantments.crystal.desc_fine=This crystal weapon is currently in good condition.
items.equipment.weapon.enchantments.crystal.desc_flawed=This crystal weapon has a flaw, but isn't about to break.
items.equipment.weapon.enchantments.crystal.desc_cracked=This crystal weapon is cracking, it's at risk of permanently breaking!
items.equipment.weapon.enchantments.crystal.elestrike_desc=An elemental strike with a crystal enchantment deals 10-20 damage and repairs the weapon for every enemy in range, except the primary target.

items.equipment.weapon.enchantments.kinetic.name=kinetic %s
items.equipment.weapon.enchantments.kinetic.desc=When an enemy is killed with a kinetic weapon, any excess force is stored in the weapon and will be applied to the next successful attack.
items.equipment.weapon.enchantments.kinetic.elestrike_desc=An elemental strike with a kinetic enchantment applies 40% of stored damage to each enemy in range, except the primary target.
items.equipment.weapon.enchantments.kinetic$conserveddamage.name=conserved damage
items.equipment.weapon.enchantments.kinetic$conserveddamage.desc=Your weapon has stored the excess force from a previous killing blow, and will apply it as bonus damage to your next attack. The energy will slowly fade over time, however.\n\nConserved Damage: %d.

items.equipment.weapon.enchantments.corrupting.name=corrupting %s
items.equipment.weapon.enchantments.corrupting.desc=This powerful enchantment possesses the ability to turn enemies to your will. When an enemy is killed with this weapon, there is a chance they will become corrupted instead of dying.
items.equipment.weapon.enchantments.corrupting.elestrike_desc=An elemental strike with a corrupting enchantment has a 5-25% chance (based on missing HP) to corrupt each enemy in range, except the primary target.

items.equipment.weapon.enchantments.eldritch.name=eldritch %s
items.equipment.weapon.enchantments.eldritch.desc=Eldritch weapons strike fear into nearby enemies that witness their strikes, causing them to flee from the attacker.
items.equipment.weapon.enchantments.eldritch.elestrike_desc=An elemental strike with an eldritch enchantment applies extended fear to every enemy in range, including the primary target.

items.equipment.weapon.enchantments.elastic.name=elastic %s
items.equipment.weapon.enchantments.elastic.desc=Elastic weapons have a chance to send enemies flying back short distances.
items.equipment.weapon.enchantments.elastic.elestrike_desc=An elemental strike with an elastic enchantment knocks all enemies in range back 5 tiles.

items.equipment.weapon.enchantments.grim.name=grim %s
items.equipment.weapon.enchantments.grim.desc=This powerful enchantment possesses the power to instantly execute an enemy. The effect is more likely to occur the weaker the enemy is.
items.equipment.weapon.enchantments.grim.elestrike_desc=An elemental strike with a grim enchantment has a 6-30% chance (based on missing HP) to kill each enemy in range, except the primary target.

items.equipment.weapon.enchantments.lucky.name=lucky %s
items.equipment.weapon.enchantments.lucky.desc=Enemies which are killed by a lucky weapon have a chance to drop extra loot.
items.equipment.weapon.enchantments.lucky.elestrike_desc=An elemental strike with a lucky enchantment has a 12.5% chance to spawn loot under each enemy in range. This effect can only trigger once per enemy.

items.equipment.weapon.enchantments.projecting.name=projecting %s
items.equipment.weapon.enchantments.projecting.desc=With this enchantment melee weapons will gain extra reach. Ranged weapons will penetrate walls when aimed at nearby targets.
items.equipment.weapon.enchantments.projecting.elestrike_desc=An elemental strike with a projecting enchantment deals 30% damage to each enemy in range, except the primary target.

items.equipment.weapon.enchantments.shocking.name=shocking %s
items.equipment.weapon.enchantments.shocking.desc=Electricity arcs from a shocking weapon, dealing extra damage to all nearby enemies.
items.equipment.weapon.enchantments.shocking.elestrike_desc=An elemental strike with a shocking enchantment spreads electricity to every tile in range, which lasts 8 turns.

items.equipment.weapon.enchantments.unstable.name=unstable %s
items.equipment.weapon.enchantments.unstable.desc=This enchantment radiates chaotic energy, acting as a different enchantment with each hit.
items.equipment.weapon.enchantments.unstable.elestrike_desc=An elemental strike with an unstable enchantment applies a random enchantment effect to each enemy in range, except the primary target.

items.equipment.weapon.enchantments.vampiric.name=vampiric %s
items.equipment.weapon.enchantments.vampiric.desc=This powerful enchantment leeches life force from enemies with each blow, funneling it back into the wearer. The effect is stronger the lower the wearer's health.
items.equipment.weapon.enchantments.vampiric.elestrike_desc=An elemental strike with a vampiric enchantment heals the Duelist for 2.5 HP for each enemy in range.

items.equipment.weapon.enchantments.venomous.name=venomous %s
items.equipment.weapon.enchantments.venomous.desc=Venomous weapons inflict a delayed but deadly poison, which becomes more severe each time it is applied.
items.equipment.weapon.enchantments.venomous.elestrike_desc=An elemental strike with a venomous enchantment applies additional delayed poison to every enemy in range, except the primary target.

items.equipment.weapon.enchantments.vorpal.name=vorpal %s
items.equipment.weapon.enchantments.vorpal.desc=Vorpal weapons are especially deadly, they have a chance to strike so cleanly that they inflict bleed instead of damage to enemies that can bleed.
items.equipment.weapon.enchantments.vorpal.elestrike_desc=An elemental strike with a vorpal enchantment applies additional bleeding to every enemy in range, except the primary target.


###melee weapons
items.equipment.weapon.melee.assassinsblade.name=assassin's blade
items.equipment.weapon.melee.assassinsblade.stats_desc=This weapon is stronger against unaware enemies.
items.equipment.weapon.melee.assassinsblade.ability_name=sneak
items.equipment.weapon.melee.assassinsblade.typical_ability_desc=The Duelist can _sneak_ while wielding an assassin's blade. This ability lets the Duelist instantly blink up to 3 tiles away and typically grants her _%d turns of invisibility._
items.equipment.weapon.melee.assassinsblade.ability_desc=The Duelist can _sneak_ while wielding an assassin's blade. This ability lets the Duelist instantly blink up to 3 tiles away and grants her _%d turns of invisibility._
items.equipment.weapon.melee.assassinsblade.upgrade_ability_stat_name=Ability Duration
items.equipment.weapon.melee.assassinsblade.desc=A small wavy blade made of obsidian, difficult to use despite being lightweight, but deadly if it finds the right mark.

items.equipment.weapon.melee.battleaxe.name=battle axe
items.equipment.weapon.melee.battleaxe.stats_desc=This is a rather accurate weapon.
items.equipment.weapon.melee.battleaxe.ability_name=heavy blow
items.equipment.weapon.melee.battleaxe.typical_ability_desc=The Duelist can perform a _heavy blow_ with a battle axe. This concentrated attack typically deals _%1$d-%2$d damage_ if it surprised the enemy, and dazes them for 5 turns which reduces accuracy and evasion by 50%%. Heavy blow always hits but deals regular damage if it does not surprise the enemy.
items.equipment.weapon.melee.battleaxe.ability_desc=The Duelist can perform a _heavy blow_ with a battle axe. This concentrated attack deals _%1$d-%2$d damage_ if it surprised the enemy, and dazes them for 5 turns which reduces accuracy and evasion by 50%%. Heavy blow always hits but deals regular damage if it does not surprise the enemy.
items.equipment.weapon.melee.battleaxe.desc=The enormous steel head of this battle axe puts considerable heft behind each wide stroke.

items.equipment.weapon.melee.crossbow.name=crossbow
items.equipment.weapon.melee.crossbow.typical_stats_desc=Typically this weapon enhances thrown darts to deal _%1$d-%2$d damage_ when it is equipped, and will even grant its enchantment to them.
items.equipment.weapon.melee.crossbow.stats_desc=This weapon enhances thrown darts to deal _%1$d-%2$d damage_ when it is equipped, and will even grant its enchantment to them.
items.equipment.weapon.melee.crossbow.ability_name=charged shot
items.equipment.weapon.melee.crossbow.typical_ability_desc=The Duelist can _charge_ her crossbow, causing her next regular attack with it to always hit and apply one of three effects: melee attacks will knock enemies away, untipped darts will typically deal _+%1$d damage_, and tipped darts will apply their effect in a 7x7 area and typically last for _%2$d more uses_.
items.equipment.weapon.melee.crossbow.ability_desc=The Duelist can _charge_ her crossbow, causing her next regular attack with it to always hit and apply one of three effects: melee attacks will knock enemies away, untipped darts will deal _+%1$d damage_, and tipped darts will apply their effect in a 7x7 area and last for _%2$d more uses_.
items.equipment.weapon.melee.crossbow.desc=A fairly intricate weapon which shoots bolts at exceptional speeds. While it isn't designed for it, this crossbow's heft and sturdy construction make it a decent melee weapon as well.
items.equipment.weapon.melee.crossbow.upgrade_ability_stat_name=Ability Boost
items.equipment.weapon.melee.crossbow$chargedshot.name=charged
items.equipment.weapon.melee.crossbow$chargedshot.desc=The Duelist is focusing power into her crossbow. The next attack she makes with it will always hit and apply one of three effects:\n- Melee attacks will knock enemies a few tiles away.\n- Untipped darts will deal bonus damage.\n- Tipped darts will gain extra uses and apply their effect in a 7x7 area. Positive dart effects will only affect allies, and harmful effects will only apply to enemies. The Duelist cannot use this ability to apply positive dart effects to herself.

items.equipment.weapon.melee.cudgel.name=cudgel
items.equipment.weapon.melee.cudgel.stats_desc=This is a rather accurate weapon.
items.equipment.weapon.melee.cudgel.ability_name=heavy blow
items.equipment.weapon.melee.cudgel.typical_ability_desc=The Duelist can perform a _heavy blow_ with a cudgel. This concentrated attack typically deals _%1$d-%2$d damage_ if it surprised the enemy, and dazes them for 5 turns which reduces accuracy and evasion by 50%%. Heavy blow always hits but deals regular damage if it does not surprise the enemy.
items.equipment.weapon.melee.cudgel.ability_desc=The Duelist can perform a _heavy blow_ with a cudgel. This concentrated attack deals _%1$d-%2$d damage_ if it surprised the enemy, and dazes them for 5 turns which reduces accuracy and evasion by 50%%. Heavy blow always hits but deals regular damage if it does not surprise the enemy.
items.equipment.weapon.melee.cudgel.desc=A small brass mace, made more as a self-defense tool for nobles than as an adventuring weapon.
items.equipment.weapon.melee.cudgel.discover_hint=One of the heroes starts with this item.

items.equipment.weapon.melee.dagger.name=dagger
items.equipment.weapon.melee.dagger.stats_desc=This weapon is stronger against unaware enemies.
items.equipment.weapon.melee.dagger.ability_name=sneak
items.equipment.weapon.melee.dagger.typical_ability_desc=The Duelist can _sneak_ while wielding a dagger. This ability lets the Duelist instantly blink up to 5 tiles away and typically grants her _%d turns of invisibility._
items.equipment.weapon.melee.dagger.ability_desc=The Duelist can _sneak_ while wielding a dagger. This ability lets the Duelist instantly blink up to 5 tiles away and grants her _%d turns of invisibility._
items.equipment.weapon.melee.dagger.upgrade_ability_stat_name=Ability Duration
items.equipment.weapon.melee.dagger.desc=A simple iron dagger with a worn wooden handle.
items.equipment.weapon.melee.dagger.discover_hint=One of the heroes starts with this item.

items.equipment.weapon.melee.dirk.name=dirk
items.equipment.weapon.melee.dirk.stats_desc=This weapon is stronger against unaware enemies.
items.equipment.weapon.melee.dirk.ability_name=sneak
items.equipment.weapon.melee.dirk.typical_ability_desc=The Duelist can _sneak_ while wielding a dirk. This ability lets the Duelist instantly blink up to 4 tiles away and typically grants her _%d turns of invisibility._
items.equipment.weapon.melee.dirk.ability_desc=The Duelist can _sneak_ while wielding a dirk. This ability lets the Duelist instantly blink up to 4 tiles away and grants her _%d turns of invisibility._
items.equipment.weapon.melee.dirk.upgrade_ability_stat_name=Ability Duration
items.equipment.weapon.melee.dirk.desc=A longer thrusting dagger, gives a bit more steel to plunge into foes.

items.equipment.weapon.melee.flail.name=flail
items.equipment.weapon.melee.flail.stats_desc=This is a rather inaccurate weapon.\nThis weapon cannot surprise attack.
items.equipment.weapon.melee.flail.ability_name=spin
items.equipment.weapon.melee.flail.spin_warn=You can't spin the flail any more.
items.equipment.weapon.melee.flail.typical_ability_desc=The Duelist can _spin_ a flail to build up power for a short time. Each turn the flail is spun it will typically deal _+%d damage_ on its next regular attack, to a max of 3 times. A spinning flail is also guaranteed to hit. Only starting to spin the flail costs a charge.
items.equipment.weapon.melee.flail.ability_desc=The Duelist can _spin_ a flail to build up power for a short time. Each turn the flail is spun it will deal _+%d damage_ on its next regular attack, to a max of 3 times. A spinning flail is also guaranteed to hit. Only starting to spin the flail costs a charge.
items.equipment.weapon.melee.flail.desc=A spiked ball attached to a handle by a length of chain. Very unwieldy, but devastating if it lands a solid hit.
items.equipment.weapon.melee.flail$spinabilitytracker.name=spinning
items.equipment.weapon.melee.flail$spinabilitytracker.desc=The Duelist is spinning her flail, building damage for her next regular attack with it. Each spin takes one turn but increases damage, to a max of three spins. The flail is also guaranteed to hit while spinning.\n\nCurrent spins: %1$d%%.\nTurns remaining: %2$s.

items.equipment.weapon.melee.gauntlet.name=stone gauntlet
items.equipment.weapon.melee.gauntlet.stats_desc=This is a very fast weapon.
items.equipment.weapon.melee.gauntlet.ability_name=combo strike
items.equipment.weapon.melee.gauntlet.typical_ability_desc=The Duelist can perform a _combo strike_ with a stone gauntlet. This attack is guaranteed to hit and typically deals _+%d damage_ for each time the Duelist has hit with a regular melee or thrown weapon attack. Not hitting for 5 turns (15 after a kill) resets this combo.
items.equipment.weapon.melee.gauntlet.ability_desc=The Duelist can perform a _combo strike_ with a stone gauntlet. This attack is guaranteed to hit and deals _+%d damage_ for each time the Duelist has hit with a regular melee or thrown weapon attack. Not hitting for 5 turns (15 after a kill) resets this combo.
items.equipment.weapon.melee.gauntlet.desc=This massive gauntlet is made of crimson fabric with heavy magical stone layered on top. The fabric tightens around you, making the thick stone plates almost like a second skin. Swinging such a heavy weapon requires strength, but adds tremendous force to your blows.

items.equipment.weapon.melee.glaive.name=glaive
items.equipment.weapon.melee.glaive.stats_desc=This is a rather slow weapon.\nThis weapon has extra reach.
items.equipment.weapon.melee.glaive.ability_name=spike
items.equipment.weapon.melee.glaive.typical_ability_desc=The Duelist can use the tip of a glaive to _spike_ an enemy that is in range but not adjacent. This typically deals _%1$d-%2$d damage_, knocks the enemy back, and is guaranteed to hit.
items.equipment.weapon.melee.glaive.ability_desc=The Duelist can use the tip of a glaive to _spike_ an enemy that is in range but not adjacent. This deals _%1$d-%2$d damage_, knocks the enemy back, and is guaranteed to hit.
items.equipment.weapon.melee.glaive.desc=A massive polearm consisting of a sword blade on the end of a pole.

items.equipment.weapon.melee.gloves.name=studded gloves
items.equipment.weapon.melee.gloves.stats_desc=This is a very fast weapon.
items.equipment.weapon.melee.gloves.ability_name=combo strike
items.equipment.weapon.melee.gloves.typical_ability_desc=The Duelist can perform a _combo strike_ with studded gloves. This attack is guaranteed to hit and typically deals _+%d damage_ for each time the Duelist has hit with a regular melee or thrown weapon attack. Not hitting for 5 turns (15 after a kill) resets this combo.
items.equipment.weapon.melee.gloves.ability_desc=The Duelist can perform a _combo strike_ with studded gloves. This attack is guaranteed to hit and deals _+%d damage_ for each time the Duelist has hit with a regular melee or thrown weapon attack. Not hitting for 5 turns (15 after a kill) resets this combo.
items.equipment.weapon.melee.gloves.desc=These studded gloves don't provide any real protection, but they act as a serviceable weapon while keeping the hands free.
items.equipment.weapon.melee.gloves.discover_hint=One of the heroes starts with this item.

items.equipment.weapon.melee.greataxe.name=greataxe
items.equipment.weapon.melee.greataxe.stats_desc=This weapon is incredibly heavy.
items.equipment.weapon.melee.greataxe.ability_name=retribution
items.equipment.weapon.melee.greataxe.typical_ability_desc=The Duelist can perform a _retribution_ attack with a greataxe if she is below 50%% health. This devastating attack typically deals _%1$d-%2$d damage,_ is guaranteed to hit, and is instantaneous if it kills an enemy.
items.equipment.weapon.melee.greataxe.ability_desc=The Duelist can perform a _retribution_ attack with a greataxe if she is below 50%% health. This devastating attack deals _%1$d-%2$d damage,_ is guaranteed to hit, and is instantaneous if it kills an enemy.
items.equipment.weapon.melee.greataxe.desc=Meant to be wielded over the shoulder, this titanic axe is as powerful as it is heavy.

items.equipment.weapon.melee.greatshield.name=greatshield
items.equipment.weapon.melee.greatshield.typical_stats_desc=Typically this weapon blocks 0-%d damage. This blocking scales with upgrades.
items.equipment.weapon.melee.greatshield.stats_desc=This weapon blocks 0-%d damage. This blocking scales with upgrades.
items.equipment.weapon.melee.greatshield.ability_name=guard
items.equipment.weapon.melee.greatshield.typical_ability_desc=The Duelist can _guard_ herself with a greatshield, completely negating all physical or magical attacks made against her typically for _%d turns_. Once the Duelist has blocked an attack, attacking back or using magic will end guarding.
items.equipment.weapon.melee.greatshield.ability_desc=The Duelist can _guard_ herself with a greatshield, completely negating all physical or magical attacks made against her for _%d turns_. Once the Duelist has blocked an attack, attacking back or using magic will end guarding.
items.equipment.weapon.melee.greatshield.upgrade_ability_stat_name=Ability Duration
items.equipment.weapon.melee.greatshield.desc=More like a mobile wall than a shield, this gigantic mass of metal aids defense, but doesn't leave much room for attacking.

items.equipment.weapon.melee.greatsword.name=greatsword
items.equipment.weapon.melee.greatsword.ability_name=cleave
items.equipment.weapon.melee.greatsword.typical_ability_desc=The Duelist can _cleave_ an enemy with a greatsword. This typically deals _%1$d-%2$d damage_ and is guaranteed to hit. If cleave kills an enemy it is instantaneous and the Duelist can use cleave again within 5 turns for free.
items.equipment.weapon.melee.greatsword.ability_desc=The Duelist can _cleave_ an enemy with a greatsword. This deals _%1$d-%2$d damage_ and is guaranteed to hit. If cleave kills an enemy it is instantaneous and the Duelist can use cleave again within 5 turns for free.
items.equipment.weapon.melee.greatsword.desc=This towering blade inflicts heavy damage by investing its heft into every swing.

items.equipment.weapon.melee.handaxe.name=hand axe
items.equipment.weapon.melee.handaxe.stats_desc=This is a rather accurate weapon.
items.equipment.weapon.melee.handaxe.ability_name=heavy blow
items.equipment.weapon.melee.handaxe.typical_ability_desc=The Duelist can perform a _heavy blow_ with a hand axe. This concentrated attack typically deals _%1$d-%2$d damage_ if it surprised the enemy, and dazes them for 5 turns which reduces accuracy and evasion by 50%%. Heavy blow always hits but deals regular damage if it does not surprise the enemy.
items.equipment.weapon.melee.handaxe.ability_desc=The Duelist can perform a _heavy blow_ with a hand axe. This concentrated attack deals _%1$d-%2$d damage_ if it surprised the enemy, and dazes them for 5 turns which reduces accuracy and evasion by 50%%. Heavy blow always hits but deals regular damage if it does not surprise the enemy.
items.equipment.weapon.melee.handaxe.desc=A light axe, most commonly used for felling trees. The wide blade works well against foes as well.

items.equipment.weapon.melee.katana.name=katana
items.equipment.weapon.melee.katana.stats_desc=This weapon blocks 0-3 damage.
items.equipment.weapon.melee.katana.ability_name=lunge
items.equipment.weapon.melee.katana.typical_ability_desc=The Duelist can _lunge_ with a katana at an enemy 1 tile away. This moves toward the enemy, typically deals _%1$d-%2$d damage_, and is guaranteed to hit.
