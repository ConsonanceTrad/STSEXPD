items.waterskin.refined=The dew has been refined into clean water.
items.waterskin.desc_ex=The vial holds an additional _%d dew_ in its unlimited reserve. Reserve dew can be used for detection, planting, upgrades, and refinement.
items.waterskin.desc_v1=Level 1: equipment upgrades and planting.
items.waterskin.desc_v2=Level 2: cleansing and speed.
items.waterskin.desc_v3=Level 3: 200 base capacity and levitation while speeding.
items.waterskin$dewlight.name=dew light
items.waterskin$dewlight.desc=Turns one ordinary dew into light every 20 turns, protecting you from darkness.
items.vialupdater.name=dew vial upgrade pack
items.vialupdater.ac_use=USE
items.vialupdater.desc=Expands the dew vial and unlocks its final abilities.
items.consum.food.wateritem.name=clean water
items.consum.food.wateritem.desc=Clean water refined from dew, usually used in cooking.
items.specific.reward.boundreward.name=clearing reward
items.specific.reward.boundreward.desc=A reward for clearing every original enemy on this floor within the dew time limit. Choose one reward category.
items.specific.reward.boundreward.ac_weapon=EQUIPMENT
items.specific.reward.boundreward.ac_food=SUPPLIES
items.specific.reward.boundreward.ac_potion=MAGIC ITEMS

items.specific.keys.spsskeletonkey.name=skeleton key
items.specific.keys.spsskeletonkey.desc=A key shaped like a skull. It unlocks the exit from this chapter's transition floor.
items.specific.keys.goldenskeletonkey.name=Crystal key
items.specific.keys.goldenskeletonkey.desc=The notches on this crystal key are tiny and intricate. Maybe it can open some chest lock?

items.equipment.weapon.missiles.arrows.glassfruit.name=glass fruit
items.equipment.weapon.missiles.arrows.glassfruit.desc=An artificial crystal fruit grown by a silica flower. A direct hit causes severe bleeding; if it misses, the fruit breaks into a small cloud of corrosive gas.
items.garbage.name=garbage
items.garbage.desc=Failed forging residue. Five pieces can be reforged at an anvil.

