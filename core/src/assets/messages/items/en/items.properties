items.equipment.weapon.missiles.shootgun.desc=An alien-modified shotgun. Normal shots break armor and knock targets back. A finishing shot empties the magazine to damage the target and nearby creatures.

items.weightstone.name=weightstone
items.weightstone.ac_apply=APPLY
items.weightstone.select=Choose a weapon to enchant
items.weightstone.apply=You enchant the weapon with the weightstone.
items.weightstone.desc=This stone applies a random enchantment to a weapon, identifies it, and removes its curse.

items.misc.ppc2.name=abyss surveyor
