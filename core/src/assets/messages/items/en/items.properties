items.equipment.weapon.melee.fusion.ritualblade.desc=A restrained version of the ceremonial weapon found in Magic Ling Pixel Dungeon. Its broad arc favors reliable attacks over extreme damage.

items.equipment.weapon.melee.fusion.reedpipe.name=reed pipe
