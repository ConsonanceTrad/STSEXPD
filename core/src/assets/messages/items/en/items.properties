items.equipment.artifacts.driedrose.charged=Your rose is fully charged!
items.equipment.artifacts.driedrose.desc=Is this the rose that the ghost mentioned before disappearing? It seems to hold some spiritual power, perhaps it can be used to channel the energy of that lost warrior.
items.equipment.artifacts.driedrose.desc_no_quest=A dried aged rose that is somehow still holding together despite its age.\n\nIt seems to have some spiritual power, but you have no idea how to use it right now.
items.equipment.artifacts.driedrose.desc_hint=It seems to be missing some petals. Perhaps reattaching them will strengthen the rose.
items.equipment.artifacts.driedrose.desc_cursed=The cursed rose is bound to your hand, it feels eerily cold.
