items.equipment.weapon.melee.start.bunnydagger.name=bunny dagger
items.equipment.weapon.melee.start.bunnydagger.desc=A small knife marked with a rabbit emblem and tempered by countless battles. It deals an additional half-to-full weapon roll on every hit.
items.equipment.weapon.melee.start.bunnyspanner.name=bunny spanner
items.equipment.weapon.melee.start.bunnyspanner.desc=A huge spanner made for a rabbit warrior. Each hit has a 30%% chance to paralyze its target.
items.equipment.weapon.melee.start.xsaber.name=X energy saber
items.equipment.weapon.melee.start.xsaber.ac_add=LEARN
items.equipment.weapon.melee.start.xsaber.prompt=Choose a skill chip to install
items.equipment.weapon.melee.start.xsaber.learned=Installed skill chip: _%s_.
items.equipment.weapon.melee.start.xsaber.desc=A high-tech energy saber. It can permanently consume and learn one RockCode skill chip.
items.equipment.weapon.melee.special.ninjafan.name=ninja fan
items.equipment.weapon.melee.special.ninjafan.desc=A giant ninja fan capable of unleashing a powerful gust. Every seventh hit knocks the target back and disorients it.
items.equipment.weapon.melee.special.ninjafan.charge=Wind stored: _%1$d/%2$d_.
items.equipment.weapon.missiles.megacannon.name=Mega cannon
items.equipment.weapon.missiles.megacannon.ac_shoot=SHOOT
