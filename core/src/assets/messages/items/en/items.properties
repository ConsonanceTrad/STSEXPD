items.equipment.artifacts.hornofplenty.no_food=Your horn has no food in it to eat!
items.equipment.artifacts.hornofplenty.full=Your horn is full of food!
items.equipment.artifacts.hornofplenty.reject=Your horn rejects the uncooked blandfruit.
items.equipment.artifacts.hornofplenty.maxlevel=Your horn has consumed all the food it can!
items.equipment.artifacts.hornofplenty.levelup=The horn consumes your food offering and grows in strength!
items.equipment.artifacts.hornofplenty.feed=The horn consumes your food offering.
items.equipment.artifacts.hornofplenty.desc=This horn can't be blown into, but instead seems to fill up with food over time when equipped.
items.equipment.artifacts.hornofplenty.desc_hint=Perhaps there is a way to increase the horn's power by giving it food energy.
items.equipment.artifacts.hornofplenty.desc_cursed=The cursed horn has bound itself to your side, it seems to be eager to take food rather than produce it.

