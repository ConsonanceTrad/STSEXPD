###armor curses
items.equipment.armor.curses.antientropy.name=%s of anti-entropy
items.equipment.armor.curses.antientropy.desc=The Anti-entropy curse works against the forces of the universe, pulling energy into the wearer and away from their surroundings. This briefly sets the wearer on fire, but freezes everything around them!

items.equipment.armor.curses.bulk.name=%s of bulk
items.equipment.armor.curses.bulk.desc=Armor of bulk looks larger and more imposing, but doesn't actually have enhanced defense. Even worse, the added size makes moving into doorways very difficult.

items.equipment.armor.curses.corrosion.name=%s of corrosion
items.equipment.armor.curses.corrosion.desc=Armor of corrosion is capable of bursting with corrosive fluid, coating everything in the area with sticky acidic ooze.

items.equipment.armor.curses.displacement.name=%s of displacement
items.equipment.armor.curses.displacement.desc=The curse of displacement attempts to move the wearer to safety when they are attacked. It is a bit too effective however, randomly teleporting the user around the level.

items.equipment.armor.curses.metabolism.name=%s of metabolism
items.equipment.armor.curses.metabolism.desc=The metabolism curse directly converts satiety into health when the wearer is injured, providing a boost of healing, but quickly causing starvation.

items.equipment.armor.curses.multiplicity.name=%s of multiplicity
items.equipment.armor.curses.multiplicity.desc=Armor cursed with multiplicity contains dangerous duplication magic. It will sometimes create a mirror image of the wearer, but is equally likely to duplicate the attacker!

items.equipment.armor.curses.overgrowth.name=%s of overgrowth
items.equipment.armor.curses.overgrowth.desc=Armor of overgrowth is covered in various blooming plants. While this effect certainly looks interesting, it does nothing for defense, and these plants will randomly activate in combat!

items.equipment.armor.curses.stench.name=%s of stench
items.equipment.armor.curses.stench.desc=Armor cursed with stench will release clouds of noxious gas, which is hazardous to everything caught in the cloud.


###glyphs
items.equipment.armor.glyphs.affection.name=%s of affection
items.equipment.armor.glyphs.affection.desc=This powerful glyph manipulates the mind of attackers, charming them temporarily.

items.equipment.armor.glyphs.antimagic.name=%s of anti-magic
items.equipment.armor.glyphs.antimagic.desc=This powerful glyph allows armor to defend its wearer against magical attacks as well as physical ones. This magical defence is not affected by the armor's tier.

items.equipment.armor.glyphs.brimstone.name=%s of brimstone
items.equipment.armor.glyphs.brimstone.desc=This glyph shields the wearer and their belongings from fire, completely nullifying its damage and negative effects.

items.equipment.armor.glyphs.camouflage.name=%s of camouflage
items.equipment.armor.glyphs.camouflage.desc=This glyph allows the wearer to blend into tall grass, granting them temporary invisibility.

items.equipment.armor.glyphs.entanglement.name=%s of entanglement
items.equipment.armor.glyphs.entanglement.desc=This glyph grows earthen armor around the wearer to absorb damage, but this armor will break if the wearer moves.

items.equipment.armor.glyphs.flow.name=%s of flow
items.equipment.armor.glyphs.flow.desc=This glyph manipulates the flow of water around the wearer, making them much faster when moving through it.

items.equipment.armor.glyphs.obfuscation.name=%s of obfuscation
items.equipment.armor.glyphs.obfuscation.desc=This glyph obscures the wearer, making them more difficult to detect.

items.equipment.armor.glyphs.potential.name=%s of potential
items.equipment.armor.glyphs.potential.desc=This glyph builds energy when struck, granting charge to the wearer's wand when it activates.

items.equipment.armor.glyphs.repulsion.name=%s of repulsion
items.equipment.armor.glyphs.repulsion.desc=This glyph rebounds force against attackers, sending them flying back.

items.equipment.armor.glyphs.stone.name=%s of stone
items.equipment.armor.glyphs.stone.desc=This glyph surrounds the armor with heavy magical stone that makes dodging impossible, but blocks damage in proportion with evasion.

items.equipment.armor.glyphs.swiftness.name=%s of swiftness
items.equipment.armor.glyphs.swiftness.desc=This glyph enhances the speed of the wearer whenever they aren't near to an enemy.

items.equipment.armor.glyphs.thorns.name=%s of thorns
items.equipment.armor.glyphs.thorns.desc=This powerful glyph harms attackers, causing them to slowly bleed when they attack the wearer.

items.equipment.armor.glyphs.viscosity.name=%s of viscosity
