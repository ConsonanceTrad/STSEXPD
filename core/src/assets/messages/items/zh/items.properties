items.artifacts.holytome.name=神圣法典
items.artifacts.holytome.ac_cast=施放
items.artifacts.holytome.no_spell=你现在不足以施放该法术。
items.artifacts.holytome.cursed=你不能使用被诅咒的圣典。
items.artifacts.holytome.levelup=你的圣典变得更强大了！
items.artifacts.holytome.desc=这本圣典能够帮助牧师引导、聚焦自身的神圣魔法，从而使牧师能够施放一系列的法术。\n\n圣典会随着牧师的使用逐步变强，给予牧师更高的最大充能数并略微提升充能速度。
items.artifacts.holytome.discover_hint=某位英雄初始携带该物品。

items.artifacts.hornofplenty.name=丰饶之角
items.artifacts.hornofplenty.ac_snack=小吃一口
items.artifacts.hornofplenty.ac_eat=食用
items.artifacts.hornofplenty.ac_store=贮存
items.artifacts.hornofplenty.ac_feed=耗竭-盛宴
items.artifacts.hornofplenty.eat=你吃光了号角中的食物。
items.artifacts.hornofplenty.prompt=选择一个食物
items.artifacts.hornofplenty.no_food=你的号角里没有食物可供食用！
items.artifacts.hornofplenty.full=你的号角装满了食物！
items.artifacts.hornofplenty.reject=你的号角并不接受未经烹煮的无味果。
items.artifacts.hornofplenty.maxlevel=你的号角已经吞噬了尽可能多的食物！
items.artifacts.hornofplenty.levelup=号角吞噬了你提供的食物，变得更加强大了。
items.artifacts.hornofplenty.feed=号角吞噬了你提供的食物。
items.artifacts.hornofplenty.desc=这个号角不能被用来吹奏，不过装备时它似乎会随时间流逝逐渐填充食物。
items.artifacts.hornofplenty.desc_hint=也许可以通过给予它食物的能量来增加号角的力量。
items.artifacts.hornofplenty.desc_cursed=被诅咒的号角把自己绑在了你的身边，它似乎在渴望得到食物而不是制造食物。

items.artifacts.lloydsbeacon.name=时空道标
items.artifacts.lloydsbeacon.ac_set=设置
items.artifacts.lloydsbeacon.ac_return=返回
items.artifacts.lloydsbeacon.preventing=这里强大的魔力流使你无法使用时空道标！
items.artifacts.lloydsbeacon.creatures=邻近生物的心灵信号正在干扰你的时空道标并使其无法被使用。
items.artifacts.lloydsbeacon.return=时空道标被成功设置在了你的当前位置，现在你可以随时返回这里。
items.artifacts.lloydsbeacon.desc=时空道标是一种结构精巧的魔法装置，可以让你返回曾经到过的地方。
items.artifacts.lloydsbeacon.desc_set=信标被设置在了像素地牢第%d层的某处。

items.artifacts.masterthievesarmband.name=神偷袖章
items.artifacts.masterthievesarmband.ac_steal=偷窃
items.artifacts.masterthievesarmband.ac_goldtouch=耗竭-点金
items.artifacts.masterthievesarmband.no_charge=充能不足
items.artifacts.masterthievesarmband.cursed=它被诅咒了，正在吞食你的金币。
items.artifacts.masterthievesarmband.no_target=没有找到目标
items.artifacts.masterthievesarmband.level_up=神偷袖章升级了
items.artifacts.masterthievesarmband.prompt=选择偷窃的目标
items.artifacts.masterthievesarmband.desc=这个紫色的天鹅绒袖标是盗贼大师的标志。它不属于你，但它也不属于你拿到这个袖标时击败的人。
items.artifacts.masterthievesarmband.desc_worn=让它戴在你的手腕上，你可以明目张胆的拿取目标身上的物品，只要它充能完成。

items.artifacts.sandalsofnature.name=自然之鞋
items.artifacts.sandalsofnature.ac_feed=喂食
items.artifacts.sandalsofnature.ac_root=扎根
items.artifacts.sandalsofnature.ac_sprout=耗竭-发芽
items.artifacts.sandalsofnature.no_charge=它们现在还没有能量。
items.artifacts.sandalsofnature.prompt=选择一个种子
items.artifacts.sandalsofnature.already_fed=你的鞋子已经从这种种子里中获取过营养了。
items.artifacts.sandalsofnature.levelup=你的鞋子尺寸变大了！
items.artifacts.sandalsofnature.absorb_seed=鞋子吸收了种子，看起来更健康了。
items.artifacts.sandalsofnature.prompt_target=选择一个位置
items.artifacts.sandalsofnature.out_of_range=那个位置超出了范围。
items.artifacts.sandalsofnature.desc_0=初看像是用麻绳编成的凉鞋实际上是两株植物！它们看上去既虚弱又苍白，也许它们需要一点营养？
items.artifacts.sandalsofnature.desc_1=这双鞋子已经长大了，现在更像是一双合脚的鞋。它们已经没那么苍白了，也许还可以进一步成长？
items.artifacts.sandalsofnature.desc_2=这两株植物又长大了。像是一双树皮制成的厚靴子。植物似乎已经恢复了它们的力量，但也许仍能进一步成长？
items.artifacts.sandalsofnature.desc_3=植物们似乎已长到最大，就像是一对装甲护胫。这对深棕色护腿看上去仿如一棵非常坚毅的树。
items.artifacts.sandalsofnature.desc_hint=穿上这件神器时你感到更加亲近自然了。
items.artifacts.sandalsofnature.desc_cursed=被诅咒的鞋子切断了一切你与自然的联系。
items.artifacts.sandalsofnature.desc_ability=这双鞋已经获得了形成一种固定的天然装甲的能力，但它们需要充能。
items.artifacts.sandalsofnature.desc_seeds=你已经给鞋子喂过了%d种种子。

items.artifacts.skeletonkey.name=骷髅钥匙
items.artifacts.skeletonkey.ac_insert=插入
items.artifacts.skeletonkey.cursed=你不能使用被诅咒的骷髅钥匙。
items.artifacts.skeletonkey.prompt=选择一个目标
items.artifacts.skeletonkey.invalid_target=那里没有东西可上锁或解锁。
items.artifacts.skeletonkey.lock_no_space=你不能将一个单位锁在门内！
items.artifacts.skeletonkey.iron_charges=解开一把锁需要消耗1点充能。
items.artifacts.skeletonkey.gold_charges=解开一把金锁需要消耗2点充能。
items.artifacts.skeletonkey.lock_charges=上锁一道门需要消耗2点充能。
items.artifacts.skeletonkey.wall_charges=创造一面临时墙壁需要消耗2点充能。
items.artifacts.skeletonkey.crystal_charges=解开一把水晶锁需要消耗5点充能。
items.artifacts.skeletonkey.wont_open=钥匙出于某种原因拒绝适配这把锁。
items.artifacts.skeletonkey.locked_with_key=这扇门已被你的骷髅钥匙上锁。
items.artifacts.skeletonkey.force_lock=骷髅钥匙不在你身上，你用力把这把锁掰开了。
items.artifacts.skeletonkey.discard=你弃置了多余的钥匙。
items.artifacts.skeletonkey.levelup=你的骷髅钥匙变得更强了！
items.artifacts.skeletonkey.desc=一把匙柄处塑有头骨，与众不同的钥匙。你每次观察匙齿时其外形似乎都有不同。
items.artifacts.skeletonkey.desc_worn=不同于地牢中的其他钥匙，这把魔法钥匙似乎能随着你不断使用它而获得力量。它几乎可被插到地牢的任何锁中并将其上锁或解锁，即便是先前从未被锁住的门也可由此上锁。\n\n钥匙还可用于“锁定”你面前正向或斜向空间的空气，以创造一面持续10回合，3格宽的坚固墙壁。如果有空间可施展，锁定还会将敌人击退。
items.artifacts.skeletonkey.desc_cursed=被诅咒的钥匙似乎在全力避免适配任何一把锁，并使你更难以使用其他钥匙（但并非不能使用）。
items.artifacts.skeletonkey$keywall.desc=一面被骷髅钥匙创造的临时魔法墙壁。

items.artifacts.talismanofforesight.name=先见护符
items.artifacts.talismanofforesight.ac_scry=探查
items.artifacts.talismanofforesight.ac_notice=耗竭-预知
items.artifacts.talismanofforesight.no_charge=你的护符尚未被完全充能。
items.artifacts.talismanofforesight.scry=护符将关于本层的知识填满了你的脑海。
items.artifacts.talismanofforesight.low_charge=护符至少要充能5%才能探查。
items.artifacts.talismanofforesight.prompt=选择要探查的位置
items.artifacts.talismanofforesight.levelup=你的护符变得更强大了！
items.artifacts.talismanofforesight.full_charge=你的护符充满了能量！
items.artifacts.talismanofforesight.desc=一块奇怪的有着光滑雕刻的石头。你觉得它在关注着你周围的一切，留意任何不寻常的东西。
items.artifacts.talismanofforesight.desc_worn=当你拿着护符时你感觉你的感知力提高了。
items.artifacts.talismanofforesight.desc_cursed=被诅咒的护符目不转睛地瞪着你，使你无法集中精力。
items.artifacts.talismanofforesight$foresight.name=先见
items.artifacts.talismanofforesight$foresight.levelup=你的护符变得更强大了！你似乎预见到了某些危险。
items.artifacts.talismanofforesight$foresight.full_charge=你的护符充能满了！
items.artifacts.talismanofforesight$foresight.uneasy=你感到很不安。
items.artifacts.talismanofforesight$foresight.desc=你感到非常焦虑，仿佛周遭有未被发现的危险。

items.artifacts.timekeepershourglass.name=时光沙漏
items.artifacts.timekeepershourglass.ac_activate=激活
items.artifacts.timekeepershourglass.ac_restart=耗竭-重置
items.artifacts.timekeepershourglass.in_use=你的沙漏正在使用中。
items.artifacts.timekeepershourglass.deactivate=你取消了时间冻结。
items.artifacts.timekeepershourglass.no_charge=你的沙漏充能还不足以用来激活。
items.artifacts.timekeepershourglass.cursed=你不能使用被诅咒的沙漏。
items.artifacts.timekeepershourglass.onstasis=你周遭的世界似乎就在这一瞬间变化了。
items.artifacts.timekeepershourglass.onfreeze=你周围的一切突然都彻底静止下来。
items.artifacts.timekeepershourglass.stasis=使我彻底停滞
items.artifacts.timekeepershourglass.freeze=冻结周围时间
items.artifacts.timekeepershourglass.prompt=你想怎样使用沙漏的魔法？\n\n当你被静止，周围的时间会正常流动，而你则会冻结并变得无敌。\n\n当时间被冻结，你的行动仿佛不需要任何时间。注意，进行攻击将打破该效果。
items.artifacts.timekeepershourglass.desc=这只大型的华贵沙漏看起来却并不怎么起眼，但你仍觉得它精雕细刻的框架内蕴含着某种强大的力量。在翻转沙漏、在看着沙子流下的同时，你能感受到一种魔法正在拉扯着你，使用这种魔法肯定能给你一些控制时间的方法。
items.artifacts.timekeepershourglass.desc_hint=沙漏似乎失去了一些沙子，如果你能再找到一些...
items.artifacts.timekeepershourglass.desc_cursed=被诅咒的沙漏把它自己锁在了你的身边，你可以感觉它试图操纵你的时间流动。
items.artifacts.timekeepershourglass$timefreeze.name=时间冻结
items.artifacts.timekeepershourglass$timefreeze.desc=外界的时间已被冻结，现在你可以在一瞬间完成任何行动。该状态会一直持续下去，除非你主动取消了它，或者你的沙漏用尽了充能。实施攻击或使用魔法同样会取消该效果。\n\n距离下次消耗充能还有：%s回合
items.artifacts.timekeepershourglass$sandbag.name=一包魔力流沙
items.artifacts.timekeepershourglass$sandbag.levelup=你将沙子填入到你的沙漏中。
items.artifacts.timekeepershourglass$sandbag.maxlevel=你的沙漏填满了魔法沙子！
items.artifacts.timekeepershourglass$sandbag.no_hourglass=你没有沙漏来存放这些沙子。
items.artifacts.timekeepershourglass$sandbag.desc=这一小包细沙应该能够在你的沙漏上完美使用。\n\n每次当你需要这种东西时，店主刚好都有摆上店面的存货，这相当奇怪...

items.artifacts.unstablespellbook.name=无序魔典
items.artifacts.unstablespellbook.ac_read=阅读
items.artifacts.unstablespellbook.ac_add=加入
items.artifacts.unstablespellbook.ac_song=耗竭-圣歌
items.artifacts.unstablespellbook.blinded=你不能在失明的时候阅读书籍。
items.artifacts.unstablespellbook.no_charge=你的咒语书耗尽了能量。
items.artifacts.unstablespellbook.cursed=被诅咒的魔典锁死了书页，你无法阅读它。
items.artifacts.unstablespellbook.update=魔法书变得更加强大。
items.artifacts.unstablespellbook.dew_empty=高能露珠不足。
items.artifacts.unstablespellbook.prompt=选择一个卷轴
items.artifacts.unstablespellbook.infuse_scroll=你将卷轴的能量注入了书中。
items.artifacts.unstablespellbook.unable_scroll=你无法将这个卷轴添加到书中。
items.artifacts.unstablespellbook.unknown_scroll=你仍然不清楚这个卷轴的种类。
items.artifacts.unstablespellbook.desc=这本魔典就其年岁而言被保养得异常好。当你翻动页面时它不断地噼啪作响并发出嘶嘶声，涌动着不稳定的能量。一旦诵读这本书，没人能笃定你会释放出什么咒语。
items.artifacts.unstablespellbook.desc_cursed=被诅咒的魔典将自己绑在了你身上，并在抑制你使用大部分卷轴的能力。
items.artifacts.unstablespellbook.desc_index=下次升级该物品所需要的露珠为%s。
items.artifacts.unstablespellbook.desc_empowered=被你放进书中的卷轴闪耀着魔力的微光。你能够利用魔典进一步激发卷轴能力，展现出秘卷效果，但这样也会消耗你额外的充能。
items.artifacts.unstablespellbook.read_empowered=被你放入魔典的卷轴都充满了魔法能量。你可以自主选择导引出该卷轴的正常或秘卷能力。\n\n如果选择释放秘卷能力，则会消耗2点魔典充能。



###bags
items.bags.bag.name=背包
items.bags.bag.discover_hint=你可在商店中购买该物品。

items.bags.potionbandolier.name=药剂挎带
items.bags.potionbandolier.desc=这副厚实的挎带能像肩带一样缠在身上，上面有许多用来放药剂、水袋和液金的隔热皮带。\n\n挎带应该能为存放其中的药剂抵御寒冷。

items.bags.scrollholder.name=卷轴筒
items.bags.scrollholder.desc=这个管状的容器看起来可以装下一整份天文学家的手书，不过你的卷轴也刚好能放在里面。里面甚至有一些能用来放置法术结晶、奥术刻笔和奥术树脂的小隔间。\n\n这个容器看起来并不是很可燃，所以你的卷轴在里面一定很安全。

items.bags.velvetpouch.name=绒布袋
items.bags.velvetpouch.desc=这个小锦囊能装下许多诸如种子、符石与炼金原材料此类的小物件。
items.bags.velvetpouch.discover_hint=某位英雄初始携带该物品。

items.bags.magicalholster.name=魔法筒袋
items.bags.magicalholster.desc=（已合并法杖套）这款细长的皮制筒袋由某种异域动物的毛皮制成。强大的附魔使其拥有收纳法杖、枪械与爆炸物等道具的能力。\n\n只需伸手一探，想要的道具就会出现在你的手上。\n\n筒袋中涌动的魔力流还能小幅强化其中法杖的充能速度。投掷武器（暗器）请存放于暗器袋。



###bombs
items.bombs.arcanebomb.name=奥术炸弹
items.bombs.arcanebomb.desc=这枚炸弹里灌注了奥术能量，当其爆炸时会释放出类似于粘咕蓄力攻击的强力冲击，在2格范围内对所有单位造成_%1$d~%2$d点魔法伤害_。
items.bombs.arcanebomb.discover_hint=你可通过炼金合成该物品。

items.bombs.bomb.name=炸弹
items.bombs.bomb.ac_lightthrow=点燃并扔出
items.bombs.bomb.snuff_fuse=你迅速掐灭了炸弹引线。
items.bombs.bomb.ondeath=你被炸得粉碎...
items.bombs.bomb.rankings_desc=死于爆炸
items.bombs.bomb.desc=一枚颇大的黑火药炸弹。爆炸时，这枚炸弹会对所有临近单位造成_%1$d~%2$d点伤害_并摧毁某些地形或物品。
items.bombs.bomb.desc_fuse=看起来引信在点燃后还能烧几回合。
items.bombs.bomb.desc_burning=引信快烧完了，保持距离或者赶紧掐灭！

items.bombs.buildbomb.name=土制炸弹
items.bombs.buildbomb.desc=造成范围伤害，可用于制作其他炸弹。

items.bombs.hugebomb.name=巨大炸弹
items.bombs.hugebomb.desc=造成大范围伤害，并摧毁附近的墙壁。
items.flag.name=军旗
items.flag.desc=祝贺中华人民共和国成立70周年。
items.bombs.bomb$doublebomb.name=一对炸弹
items.bombs.bomb$doublebomb.desc=两枚装的黑火药重装炸弹，看起来多出来的那个是免费送你的！

items.bombs.firebomb.name=燃烧弹
items.bombs.firebomb.desc=这枚改造过的炸弹的爆炸范围更大，在2格范围内造成_%1$d~%2$d点伤害_并释放出持续燃烧的烈火。
items.bombs.firebomb.discover_hint=你可通过炼金合成该物品。

items.bombs.flashbangbomb.name=闪光弹
items.bombs.flashbangbomb.desc=这枚改造过的炸弹在爆炸时会爆发出一阵电闪雷鸣。在2格范围内的所有单位不仅会受到爆炸的_%1$d~%2$d点伤害_和电击的额外25%%伤害，还会被麻痹10回合。
items.bombs.flashbangbomb.discover_hint=你可通过炼金合成该物品。

items.bombs.frostbomb.name=冰霜炸弹
items.bombs.frostbomb.desc=这枚改造过的炸弹的爆炸范围更大，在2格范围内造成_%1$d~%2$d点伤害_并释放出持续冻结的冰霜。
items.bombs.frostbomb.discover_hint=你可通过炼金合成该物品。

items.bombs.holybomb.name=神圣炸弹
items.bombs.holybomb.desc=这枚改造过的炸弹会在爆炸时在大范围内闪耀出圣光。在2格范围内的所有单位会受到爆炸的_%1$d~%2$d点伤害_，并且亡灵和恶魔敌人还会受到圣光的50%%额外伤害。
items.bombs.holybomb.discover_hint=你可通过炼金合成该物品。

items.bombs.noisemaker.name=噪音地雷
items.bombs.noisemaker.desc=这枚改造过的炸弹会周而复始地发出噪音，直到其引信燃烧殆尽。当有什么东西碰到炸弹时，炸弹会爆炸并在2格范围内对所有单位造成_%1$d~%2$d点伤害_！
items.bombs.noisemaker.desc_burning=噪音地雷引信已点燃，有东西接近就会爆炸！
items.bombs.noisemaker.discover_hint=你可通过炼金合成该物品。

items.bombs.smokebomb.name=烟雾弹
items.bombs.smokebomb.desc=这枚改造过的炸弹会在爆炸时释放出一阵浓厚的气体烟云。炸弹会在2格范围内造成_%1$d~%2$d点伤害_并释放暗夜迷雾。
items.bombs.smokebomb.discover_hint=你可通过炼金合成该物品。

items.bombs.regrowthbomb.name=再生炸弹
items.bombs.regrowthbomb.desc=这枚改造过的炸弹不会爆炸，而会在3格范围内四处溅射再生药液。被药液影响的区域会迅速生长出草木与植物，而你自己和爆炸范围内的所有盟友都会受到如同饮用治疗药剂般的治疗效果。
items.bombs.regrowthbomb.discover_hint=你可通过炼金合成该物品。

items.bombs.shrapnelbomb.name=破片炸弹
items.bombs.shrapnelbomb.desc=这枚改造过的炸弹的外壳由DM-300的金属残骸制成，当其爆炸时外壳会碎裂为破片并向四周迸发，在炸弹周围的巨大范围内造成_%1$d~%2$d点伤害_。使用时你最好躲在某处掩体后面...
items.bombs.shrapnelbomb.discover_hint=你可通过炼金合成该物品。

items.bombs.woollybomb.name=绵绵炸弹
items.bombs.woollybomb.desc=这枚改造过的炸弹会在爆炸后创造出魔法羊群。爆炸会对2格范围内的所有单位造成_%1$d~%2$d点伤害_。羊群会阻挡单位的移动，并会存在相当长一段时间！然而，羊群无法在强敌面前存在太久，而且羊群也可以通过与之互动被人为地提前消除。
items.bombs.woollybomb.discover_hint=你可通过炼金合成该物品。

###food
items.food.berry.name=地牢浆果
items.food.berry.eat_msg=酸甜可口，真棒！
items.food.berry.desc=这颗小浆果是女猎手在地牢的植被里找到的，它可以被快速食用以获得少量饱腹感，还可能有实用的种子包含其中！
items.food.berry.discover_hint=你可使用某项英雄天赋找到该物品。

items.food.blandfruit.name=无味果
items.food.blandfruit.cooked=熟无味果
items.food.blandfruit.sunfruit=阳光果
items.food.blandfruit.rotfruit=腐朽果
items.food.blandfruit.earthfruit=地缚果
items.food.blandfruit.blindfruit=目盲果
items.food.blandfruit.firefruit=火焰果
items.food.blandfruit.icefruit=冰霜果
items.food.blandfruit.fadefruit=渐隐果
items.food.blandfruit.sorrowfruit=忧伤果
items.food.blandfruit.stormfruit=暴风果
items.food.blandfruit.dreamfruit=法皇果
items.food.blandfruit.starfruit=星陨果
items.food.blandfruit.swiftfruit=速行果
items.food.blandfruit.raw=你没法忍受生吃这玩意儿。
items.food.blandfruit.desc=干燥且脆弱，或许加点其他材料再煮能够增强它的效果。
items.food.blandfruit.desc_cooked=这个果实已经因为吸收锅中的汤而鼓胀，并且吸收了其中种子的属性。它具有这粒种子对应的药剂效果。
items.food.blandfruit.desc_eat=看起来已经可以吃了！
items.food.blandfruit.desc_throw=它似乎性质很不稳定，最好作为武器丢出去。
items.food.blandfruit$chunks.name=无味果块
items.food.blandfruit$chunks.desc=无味果触地爆炸，碎成了一地的普通果块。\n\n尽管上面沾上了尘土，这些大块的熟制无味果应该可以安全食用。

items.food.chargrilledmeat.name=烤肉
items.food.chargrilledmeat.desc=看起来像块好肉排。
items.food.firemeat.name=火焰肉
items.food.firemeat.desc=一块散发着温暖红光的肉。
items.food.firemeat.eat_msg=这块肉真烫！
items.food.chargrilledmeat.discover_hint=你可使用另一种食物制作该物品。

items.food.food.name=口粮
items.food.food.ac_eat=食用
items.food.food.eat_msg=吃起来不错！
items.food.food.locked=锁闭魔法阻止了你进食。
items.food.food.desc=里面都是些寻常玩意：一片肉干，几块饼干——诸如此类。

items.food.frozencarpaccio.name=冷冻生肉片
items.food.frozencarpaccio.invis=你看到自己的手隐形了！
items.food.frozencarpaccio.hard=你感到皮肤变硬了！
items.food.frozencarpaccio.refresh=神清气爽！
items.food.frozencarpaccio.better=你感觉好多了！
items.food.frozencarpaccio.desc=这是份速冻生肉，只能切成薄片取食，而且意外的好吃。
items.food.frozencarpaccio.discover_hint=你可使用另一种食物制作该物品。

items.food.meatpie.name=全肉大饼
items.food.meatpie.eat_msg=这食物味道真棒！
items.food.meatpie.desc=一份填满了美味肉馅的诱人大饼。吃下它后你会获得远高于其他食物的饱足感。
items.food.meatpie.discover_hint=你可通过炼金合成该物品。

items.food.mysterymeat.name=神秘的肉
items.food.mysterymeat.eat_msg=这玩意儿吃起来很...奇怪。
items.food.mysterymeat.hot=嗷！好烫！
items.food.mysterymeat.legs=你的腿没有知觉了！
items.food.mysterymeat.not_well=你感觉...不太好。
items.food.mysterymeat.stuffed=你吃撑了。
items.food.mysterymeat.desc=想吃可以，后果自腹！
items.food.mysterymeat.discover_hint=你可从某种敌人的掉落物中获得该物品。
items.food.mysterymeat$placeholder.name=肉

items.food.phantommeat.name=幻影鱼肉
items.food.phantommeat.desc=这块从幻影食人鱼身上切下的大块鱼肉呈半透明状，闪烁着奇光。这块充满魔力的肉无须烹饪即可食用，不但能完全填饱你的肚子，而且能赋予多种防御性增益。食用后，它会为你提供隐形、树肤和少量治疗，并净化大部分有害效果。
items.food.phantommeat.discover_hint=你可从某种敌人的掉落物中获得该物品。

items.food.pasty.name=馅饼
items.food.pasty.fish_name=清蒸荷叶鱼
items.food.pasty.amulet_name=Yendor护符？
items.food.pasty.egg_name=复活节彩蛋
items.food.pasty.rainbow_name=虹色药剂
items.food.pasty.shattered_name=绿色蛋糕
items.food.pasty.pie_name=南瓜派
items.food.pasty.vanilla_name=蓝色蛋糕
items.food.pasty.cane_name=拐杖糖
items.food.pasty.sparkling_name=气泡药剂
items.food.pasty.desc=这是份正宗康郡肉馅饼，内含牛肉加土豆的传统馅料。美味十足！
items.food.pasty.fish_desc=被荷叶包裹，以法术贮藏的清蒸鲈鱼。逢此年月，有将鱼剩下的习俗，取年年有余之意，于是你也决定不将这条蒸鱼一次吃完。\n\n新年快乐！
items.food.pasty.amulet_desc=你终于找到它了，神奇的护...噢不，这只是一块以箔纸包装的巧克力而已，它只是看起来像护符！它带不来无限的力量，但却能让你完全吃饱，还能提供短暂的神器充能效果。\n\n愚人节快乐！
items.food.pasty.egg_desc=一个硕大的巧克力蛋，被五彩斑斓的箔纸包装着。这种体量的巧克力可以轻松将你填饱，其中的糖分还能为神器提供短暂的额外充能效果。\n\n复活节快乐！
items.food.pasty.rainbow_desc=这瓶多彩的药剂是一种液态食物。它不仅可以充饥，其中还蕴含着能魅惑一名相邻非boss敌人的小型法术，能令其暂时不愿与你交战。\n\n节日快乐！
items.food.pasty.shattered_desc=这一大块香草蛋糕上裹上了一层绿色糖霜，其上洒满各色糖碎。这样的蛋糕被用于庆祝某人事物积累若干年履历的时刻，而这份履历也会在你吃下时作为经验分得一部分。\n\n破碎的像素地牢于2014年8月5日问世。祝破碎地牢生日快乐！
items.food.pasty.pie_desc=好大的一块南瓜派！甘甜又微辣，它会填饱你的肚子并让你恢复少量生命。\n\n万圣节快乐！
items.food.pasty.vanilla_desc=这一大块香草蛋糕上裹上了一层蓝色糖霜，其上洒满各色糖碎。这样的蛋糕被用于庆祝某人事物积累若干年履历的时刻，而这份履历也会在你吃下时作为经验分得一部分。\n\n原版像素地牢于2012年12月4日问世。祝像素地牢生日快乐！
items.food.pasty.cane_desc=甜度爆表的巨型拐杖糖！大到够你一次吃饱，其中的糖分或许还能让你的法杖获得少量额外充能。\n\n假日快乐！
items.food.pasty.sparkling_desc=这瓶起泡的药剂是一种液态食物。这种果腹之物尝起来和气泡酒别无二致，但实际上并不含酒精。这股流经腹部的暖流能为你提供少量护盾。\n\n元旦快乐！
items.food.pasty$fishleftover.name=余鱼
items.food.pasty$fishleftover.eat_msg=吃起来还行。
items.food.pasty$fishleftover.desc=你上一顿吃剩的鱼。你可以随时把它吃完，这能恢复你少量的饱食度。

items.food.smallration.name=小包口粮
items.food.smallration.eat_msg=吃起来还行。
items.food.smallration.desc=它看起来和普通口粮一样，就是小了点。
items.food.smallration.discover_hint=你可在商店中购买该物品。

items.food.stewedmeat.name=炖肉
items.food.stewedmeat.eat_msg=吃起来还行。
items.food.stewedmeat.desc=烹煮的过程中杀死了肉上面可能携带的任何病菌或是寄生虫。现在应该可以安全的食用它了。
items.food.stewedmeat.discover_hint=你可通过炼金合成该物品。

items.food.supplyration.name=备用口粮
items.food.supplyration.desc=这是一包由盗贼公会存放，供其成员取用的口粮。这包口粮专门被设计成可快速食用的样式，并且能为成员的隐秘行动提供诸多帮助。\n\n尽管不能像正常口粮一样填饱你，它却能被快速食用，恢复少量生命，并且回复盗贼的暗影斗篷一点神器充能。
items.food.supplyration.discover_hint=你可使用某项特定的英雄天赋找到该物品。



##journal items
items.journal.documentpage.name=被撕下的书页
items.journal.documentpage.desc=一张被遗弃的书页，似乎是从一本书上撕下来的。你需要捡起它才能阅读上面的内容。

items.journal.alchemypage.name=被撕下的炼金指南书页
items.journal.alchemypage.desc=从一本炼金指南书上撕下来的一页。\n\n在远处你只能看到一行行密密麻麻的小字，不过你仍然可以看清书页上的标题\n\n_"%s"_

items.journal.guidebook.name=地牢探索指南
items.journal.guidebook.hint_mobile=你的指南有新的建议要告诉你！点击屏幕右上角闪烁的日志按钮进行阅读。
items.journal.guidebook.hint_desktop=你的指南有新的建议要告诉你！选择屏幕右上角闪烁的日志按钮(%s)进行阅读。
items.journal.guidebook.hint_status=指南
items.journal.guidebook.desc=一本静静躺在地上的地牢探索指南，不知被谁遗弃在此。看来冒险不是很适合它的旧主人！\n\n这本精致而独特的书附有魔法，会在需要的时候主动提醒冒险家去翻阅它。\n\n除去强大的功能，这本书走红的原因还有一点：它的封面上用友好而亲切的大字写着“不 要 恐 慌 ！”

items.journal.guidepage.name=被撕下的指南书页
items.journal.guidepage.desc=从一本冒险指南书上撕下来的一页。\n\n在远处你只能看见一行行密密麻麻的小字，不过你可以看清书页上的标题：\n\n_"%s"_

items.journal.regionlorepage$sewers.name=磨旧的信笺
items.journal.regionlorepage$sewers.desc=看起来像是一封信，写在一张沾满灰尘的纸上。你需要把它捡起来才能看清上面写着什么。

items.journal.regionlorepage$prison.name=磨损的日志条目
items.journal.regionlorepage$prison.desc=写在老旧纸张上的日记条目或其他记录。这似乎比你在下水道里找到的信看起来好一些，但你仍然需要捡起它才能阅读上面的内容。

items.journal.regionlorepage$caves.name=老旧的日志条目
items.journal.regionlorepage$caves.desc=看起来是探险家日志中的一个条目，尽管它肯定很旧，但保存得出奇得好。捡起它来阅读上面的内容。

items.journal.regionlorepage$city.name=锈蚀的便签
items.journal.regionlorepage$city.desc=一块生锈的小金属板，上面神奇地刻着一条信息。尽管它年代久远，可字母仍然清晰，但你必须捡起它才能阅读上面的内容。

items.journal.regionlorepage$halls.name=发光的便签
items.journal.regionlorepage$halls.desc=一块黑色的小板，上面刻有发光的绿色字母。发光的字母在远处模糊成一团薄雾，你必须捡起它才能阅读上面的内容。


###keys
items.keys.goldenkey.name=金钥匙
items.keys.goldenkey.desc=这把黄金钥匙的齿纹精妙而复杂。或许可以用它来打开某个上锁的宝箱？

items.keys.crystalkey.name=水晶钥匙
items.keys.crystalkey.desc=这把水晶钥匙在黑暗中反射着光芒。或许可以用它来打开某样水晶制品？

items.keys.ironkey.name=铁钥匙
items.keys.ironkey.desc=这个铁钥匙的匙齿已经严重磨损；皮制系带也久经年岁摧残。它对应的是哪扇门呢?

items.keys.wornkey.name=磨损钥匙
items.keys.wornkey.desc=这把磨损而褪色的钥匙看起来非同寻常。大概它可以打开附近某道非同寻常的门。



###potions
items.potions.potion.ac_drink=饮用
items.potions.potion.turquoise=青绿药剂
items.potions.potion.crimson=猩红药剂
items.potions.potion.azure=湛蓝药剂
items.potions.potion.jade=碧绿药剂
items.potions.potion.golden=金黄药剂
items.potions.potion.magenta=品红药剂
items.potions.potion.charcoal=煤黑药剂
items.potions.potion.ivory=乳白药剂
items.potions.potion.amber=琥珀药剂
items.potions.potion.bistre=深褐药剂
items.potions.potion.indigo=靛紫药剂
items.potions.potion.silver=银灰药剂
items.potions.potion.unknown_desc=瓶子里装着些不断打旋的彩色液体。谁知道饮用或投掷它时会有什么效果呢？
items.potions.potion.harmful=有害药剂！
items.potions.potion.beneficial=有益药剂
items.potions.potion.yes=是的，我知道我在做什么
items.potions.potion.no=不，我改变主意了
items.potions.potion.sure_drink=你确定要饮用它吗？大多数情况下你该把它扔向敌人的。
items.potions.potion.sure_throw=你确定要投掷它吗？大多数情况下把它喝下去会更有用。
items.potions.potion.shatter=药瓶碎裂开，溅出了无害的液体。
items.potions.potion.discover_hint=你可在地牢中概率找到该物品，或通过炼金合成该物品。
items.potions.potion$placeholder.name=药剂
items.potions.potion$seedtopotion.name=随机药剂

items.potions.potionofexperience.name=经验药剂
items.potions.potionofexperience.desc=众多战斗积累而来的经验被浓缩为液态，这种药剂能够瞬间提升你的等级。

items.potions.potionoffrost.name=冰霜药剂
items.potions.potionoffrost.desc=一旦暴露在空气里，这种化学药剂会挥发成为一片冰冷的气雾。

items.potions.potionofhaste.name=极速药剂
items.potions.potionofhaste.energetic=你感觉充满了活力！
items.potions.potionofhaste.desc=喝下这甜到掉牙的奇怪液体后，体内会爆发一股巨大的能量，让你可以短时间内飞速奔跑。

items.potions.potionofhealing.name=治疗药剂
items.potions.potionofhealing.heal=你的伤口开始愈合。
items.potions.potionofhealing.desc=一支让你快速回满生命值并清除毒素的万能药剂。

items.potions.potionofinvisibility.name=隐形药剂
items.potions.potionofinvisibility.invisible=你看到你的手隐形了！
items.potions.potionofinvisibility.desc=饮用这种药剂会使你暂时隐形。隐形期间，敌人将无法看见你。使用物理攻击或魔法效果(例如使用卷轴或法杖)，会立即解除隐形效果。

items.potions.potionoflevitation.name=浮空药剂
items.potions.potionoflevitation.float=你漂浮到了空中！
items.potions.potionoflevitation.desc=饮用这种古怪的药剂能让你漂浮到空中，从而轻易地越过陷阱和深渊。扔出它会产生一片未被提纯的气体云雾，让其中的所有生物迷失方向。

items.potions.potionofliquidflame.name=液火药剂
items.potions.potionofliquidflame.desc=该药瓶里装着一种不稳定的化合物，一旦暴露在空气中就会猛烈地燃烧起来。

items.potions.potionofmindvision.name=灵视药剂
items.potions.potionofmindvision.see_mobs=你可以感受到其他生物的存在！
items.potions.potionofmindvision.see_none=你能判定现在本层内就只有你一个人。
items.potions.potionofmindvision.desc=喝下这个，你的心智将与大范围内的生物精神同调，让你能感受到围墙背后的生体所在。该药剂还能够让你的视野无视身边门墙的阻挡。

items.potions.potionofparalyticgas.name=麻痹药剂
items.potions.potionofparalyticgas.desc=暴露于空气时，烧瓶里的液体会气化成一片令人失去知觉的黄色云雾。任何吸入气体的生物都可能立即麻痹，直到气体消散后一段时间才能行动。可以把该物件扔到远处的敌群中，让气体覆盖影响它们。

items.potions.potionofpurity.name=净化药剂
items.potions.potionofpurity.freshness=你闻到了空气中不寻常的清新气息。
items.potions.potionofpurity.protected=你被一层薄薄的魔法屏障包裹住了！
items.potions.potionofpurity.desc=这种魔法试剂能迅速中和掉大范围内的各种有害环境。饮用它将使你暂时免疫这种环境。

items.potions.potionofstrength.name=力量药剂
items.potions.potionofstrength.msg=新生的力量在你体内喷薄而出，你现在拥有%d点力量！
items.potions.potionofstrength.desc=这种强力的液体会洗刷你的肌肉，永久性增加1点力量值。

items.potions.potionoftoxicgas.name=毒气药剂
items.potions.potionoftoxicgas.desc=打开或摔碎这个密封的药瓶将导致内容物爆发成一团剧毒的绿色云雾。你应该选择从远处将这瓶药剂扔向敌人，而不是手动开封。



###brews
items.potions.brews.brew.discover_hint=你可通过炼金合成该物品。

items.potions.brews.aquabrew.name=水爆魔药
items.potions.brews.aquabrew.desc=当这瓶药剂破裂时，会在原地迸发高压水浪。水浪仅对火属性敌人造成有效伤害，但同时会让水流向附近的地形扩散，可浸湿陷阱使其失效、扑灭火焰，并击退水浪附近的角色。

items.potions.brews.blizzardbrew.name=冰暴魔药
items.potions.brews.blizzardbrew.desc=当瓶子破裂时，这瓶魔药会释放出一阵像气体一样扩散的旋流冰暴。

items.potions.brews.causticbrew.name=淤泥魔药
items.potions.brews.causticbrew.desc=这瓶魔药在打碎时会大范围地溅出腐蚀淤泥。被腐蚀淤泥影响的单位将会缓慢融化，除非他们能及时在水中冲洗掉淤泥。

items.potions.brews.infernalbrew.name=炼狱魔药
items.potions.brews.infernalbrew.desc=当瓶子破裂时，这瓶魔药会释放出一阵像气体一样扩散的狂暴炼狱。

items.potions.brews.shockingbrew.name=雷鸣魔药
items.potions.brews.shockingbrew.desc=当瓶子破裂时，这瓶魔药会向周围释放一阵闪电风暴。

items.potions.brews.unstablebrew.name=紊乱魔药
items.potions.brews.unstablebrew.desc=这瓶魔药泛着不断流转变化的彩虹光芒。\n\n饮用它将随机获得一种有益的药剂效果，而将其投掷出去则必定释放一种有害的药剂效果。

###elixirs
items.potions.elixirs.elixir.discover_hint=你可通过炼金合成该物品。

items.potions.elixirs.elixirofarcanearmor.name=抗魔秘药
items.potions.elixirs.elixirofarcanearmor.desc=这瓶秘药会赋予饮用者持续时间很长的魔法抗性。

items.potions.elixirs.elixirofaquaticrejuvenation.name=水灵秘药
items.potions.elixirs.elixirofaquaticrejuvenation.desc=这瓶秘药中包含着被粘咕力量强化的治疗液体。它不会为你提供立即的治疗效果，而会当你站在水中时逐渐为你恢复总量更大的生命值。
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=水灵治疗
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=你暂时获得了如同粘咕一样的恢复能力。\n\n当站在水面上时，你每回合都能够恢复少量生命值。生命值全满或离开水面时会暂停该效果。\n\n剩余的恢复量：%d

items.potions.elixirs.elixirofdragonsblood.name=龙血秘药
items.potions.elixirs.elixirofdragonsblood.desc=饮用后，这瓶秘药会使饮用者的血管里充斥着烈焰的力量。这个效果能让饮用者对火焰完全免疫，并且还能通过物理攻击点燃敌人。

items.potions.elixirs.elixiroffeatherfall.name=羽落秘药
items.potions.elixirs.elixiroffeatherfall.light=你觉得自己身轻如燕！
items.potions.elixirs.elixiroffeatherfall.desc=这瓶秘药可为你提供更弱但更可控的悬浮效果，在短时间内使你身轻如燕，即便跳下悬崖深渊也能毫发无损。饮用这瓶秘药可以为你提供短时间内免除坠落伤害的效果。
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=羽落
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=你正处于羽落秘药的作用效果之下，可以跳进深渊并坠落至下一层而不受到任何伤害！\n\n效果剩余时长：%s回合

items.potions.elixirs.elixirofhoneyedhealing.name=圣愈蜜药
items.potions.elixirs.elixirofhoneyedhealing.desc=这瓶秘药不仅有着治愈效果，还混杂了蜂蜜的甜香。饮用后，它会触发与治疗药剂一样的效果并回复少量饥饿，它也能被丢出去用来治疗盟友。\n\n对喜爱蜂蜜的生物使用此物也可能安抚住它们。

items.potions.elixirs.elixiroficytouch.name=晶触秘药
items.potions.elixirs.elixiroficytouch.desc=饮用后，这瓶秘药会使饮用者获得从敌人身上抽取热量的能力。这样的效果让使用者能够在药效持续期间免疫冻伤，同时他的物理攻击也能对敌人造成冻伤效果。

items.potions.elixirs.elixirofmight.name=根骨秘药
items.potions.elixirs.elixirofmight.msg=新生的力量在你体内喷薄而出，你现在拥有%d点力量！
items.potions.elixirs.elixirofmight.desc=这种强力的液体会冲刷你的根骨，永久性增加1点力量值并在一段时间内增加%d点生命上限。增强的生命上限值取决于你当前的最大生命值，不过增强值会随着等级提升而逐渐消失。
items.potions.elixirs.elixirofmight$htboost.name=生命强化
items.potions.elixirs.elixirofmight$htboost.desc=你觉得自己不同寻常的强壮与健康。\n\n你的最大生命在一段时间内会有所提升。生命提升会随着你的升级缓慢而稳定地消失。\n\n当前生命提升量：%d\n剩余生效等级：%d

items.potions.elixirs.elixiroftoxicessence.name=毒粹秘药
items.potions.elixirs.elixiroftoxicessence.desc=这瓶秘药能够向使用者注入强大的毒素之力，饮用者在持续时间内将会在周身不断释放出致命的毒雾，此外还会在更长的一段时间内免疫毒气和毒素。



###exotic potions
items.potions.exotic.exoticpotion.turquoise=青绿合剂
items.potions.exotic.exoticpotion.crimson=猩红合剂
items.potions.exotic.exoticpotion.azure=湛蓝合剂
items.potions.exotic.exoticpotion.jade=碧绿合剂
items.potions.exotic.exoticpotion.golden=金黄合剂
items.potions.exotic.exoticpotion.magenta=品红合剂
items.potions.exotic.exoticpotion.charcoal=煤黑合剂
items.potions.exotic.exoticpotion.ivory=乳白合剂
items.potions.exotic.exoticpotion.amber=琥珀合剂
items.potions.exotic.exoticpotion.bistre=深褐合剂
items.potions.exotic.exoticpotion.indigo=靛紫合剂
items.potions.exotic.exoticpotion.silver=银灰合剂
items.potions.exotic.exoticpotion.unknown_desc=这口圆底瓶里装着些有沉淀物的彩色液体。它似乎并不属于这个世界，谁知道饮用或投掷它时会有什么效果呢？
items.potions.exotic.exoticpotion.warning=你真的想终止这瓶药剂的使用？它仍会被消耗掉。
items.potions.exotic.exoticpotion.yes=是的，我确定
items.potions.exotic.exoticpotion.no=不，我改变主意了
items.potions.exotic.exoticpotion.discover_hint=你可通过炼金合成该物品。

items.potions.exotic.potionofcleansing.name=全面净化合剂
items.potions.exotic.potionofcleansing.desc=当这种合剂被饮用时，它可以令饮用者短时间内对所有负面状态效果的免疫。它同样可以被扔向某个单位以清除该单位的负面状态效果。
items.potions.exotic.potionofcleansing$cleanse.name=全面净化
items.potions.exotic.potionofcleansing$cleanse.desc=这个角色暂时免疫所有的负面状态效果！\n\n剩余时长：%s

items.potions.exotic.potionofcorrosivegas.name=腐蚀酸雾合剂
items.potions.exotic.potionofcorrosivegas.desc=打开或摔碎这个密封的药瓶将导致内容物爆发成一团强腐蚀性的锈色酸雾。这种酸雾的扩散速度与致命性都远超毒气。不过稳定性较差，不能在空气中存留太久。

items.potions.exotic.potionofdragonsbreath.name=火龙吐息合剂
items.potions.exotic.potionofdragonsbreath.prompt=选择要灼烧的位置
items.potions.exotic.potionofdragonsbreath.desc=瓶子内奇特的化合物会在接触口腔后爆燃。迅速吐出液体就能让使用者从口中喷射火焰！

items.potions.exotic.potionofearthenarmor.name=大地护甲合剂
items.potions.exotic.potionofearthenarmor.desc=与麻痹药剂不同的是，饮用这瓶合剂能够使使用者的皮肤硬化，在一段时间内形成一道天然护甲。

items.potions.exotic.potionofdivineinspiration.name=神意启发合剂
items.potions.exotic.potionofdivineinspiration.no_more_points=你无法再获得更多的额外天赋点了。
items.potions.exotic.potionofdivineinspiration.select_tier=选择一个天赋以获得两个额外点数。该天赋所在的层阶必须已被解锁。
items.potions.exotic.potionofdivineinspiration.bonus=天赋点+2！
items.potions.exotic.potionofdivineinspiration.desc=这股神圣的力量会化作液态，灌注进饮用者的身体，赋予其钟意的天赋两个额外天赋点。\n\n这种药剂对每一层天赋只能生效一次。

items.potions.exotic.potionofmagicalsight.name=魔能透视合剂
items.potions.exotic.potionofmagicalsight.desc=饮用这瓶合剂后，你的五感将被提高到一种无法想象的地步，使你能看穿12格以内的墙壁，洞察藏在墙后的事物！

items.potions.exotic.potionofmastery.name=肌肉记忆合剂
items.potions.exotic.potionofmastery.prompt=精通一件物品
items.potions.exotic.potionofmastery.weapon_easier=你的武器变得前所未有的顺手！
items.potions.exotic.potionofmastery.armor_easier=你的护甲变得前所未有的合身！
items.potions.exotic.potionofmastery.desc=这个合剂不会直接增强你的力量，但却会为你建立使用特定物品的肌肉记忆。使你对其的运用更加得心应手，仿佛已经练习了千百遍。\n\n所选武器或护甲所需要的力量减少2点。此合剂在每个物品上只能使用一次。

items.potions.exotic.potionofshielding.name=奥术护盾合剂
items.potions.exotic.potionofshielding.desc=与治疗药剂不同的是，饮用这瓶合剂能够使周身被护盾环绕，抵挡所受到的伤害。

items.potions.exotic.potionofshroudingfog.name=暗夜迷雾合剂
items.potions.exotic.potionofshroudingfog.desc=瓶中的液体遇到空气就会迅速爆发出一团能完全阻挡敌人视线的浓雾。

items.potions.exotic.potionofsnapfreeze.name=极速冰冻合剂
items.potions.exotic.potionofsnapfreeze.desc=一旦暴露在空气里，这种化学混合物会瞬间冻结并缠绕范围内一切对象。

items.potions.exotic.potionofstamina.name=精力回复合剂
items.potions.exotic.potionofstamina.desc=喝下这甜到掉牙的奇怪液体后，体内会爆发一股巨大的能量，让你可以在长时间内飞速奔跑。

items.potions.exotic.potionofstormclouds.name=暴风骤雨合剂
items.potions.exotic.potionofstormclouds.desc=这瓶合剂被丢出后会形成一团快速膨胀的浓厚水汽，并迅速凝结为雨水降下。受雨水覆盖的大部分地形都会变为水潭，火焰会熄灭，火属性敌人会受到伤害，陷阱也会淹毁。



###quest items
items.quest.ceremonialcandle.name=仪式蜡烛
items.quest.ceremonialcandle.desc=一套配套的蜡烛，在使用中融化在了一起。\n\n单独看来它们毫无价值，但与其它蜡烛按特定排布共用时却能为召唤仪式聚集能量。
items.quest.ceremonialcandle.discover_hint=你可在某个任务中找到该物品。

items.quest.corpsedust.name=尸尘
items.quest.corpsedust.chill=一股寒意穿透了你的脊背。
items.quest.corpsedust.desc=在外观上这团尸尘和普通灰尘差不多。而你却能够感受到其中潜伏着一股充满恶意的魔力。\n\n尽快脱手为好。
items.quest.corpsedust.discover_hint=你可在某个任务中找到该物品。
items.quest.corpsedust&dustwraith.rankings_desc=被尸尘咒杀而亡

items.quest.darkgold.name=暗金矿
items.quest.darkgold.you_now_have=你现在拥有%d个暗金矿。
items.quest.darkgold.desc=这种金属名中的暗并非源于其色泽(它看起来和普通黄金一样)，而是因为它会在阳光下熔化，令其在地表上毫无用处。
items.quest.darkgold.discover_hint=你可在某个任务中找到该物品。

items.quest.dwarftoken.name=矮人徽记
items.quest.dwarftoken.discard=你弃置了多余的徽记。
items.quest.dwarftoken.desc=一块形状奇特的金属片，被宝库中的矮人守卫随身携带。或许这徽记也是将守卫禁锢于这座宝库的魔法的一部分？最好先带着它，或许还会有用。
items.quest.dwarftoken.desc_old=很多矮人和他们的造物都携带着这种小块金属，理由不详。兴许它是装饰物或什么身份识别牌。矮人都挺奇怪的。
items.quest.dwarftoken.discover_hint=你可在某个任务中找到该物品。

items.quest.embers.name=元素余烬
items.quest.embers.desc=只能从新生火焰元素身上采集到的特殊余烬.。它们散发着温暖的能量。
items.quest.embers.discover_hint=你可在某个任务中找到该物品。

items.quest.escapecrystal.name=逃脱棱晶
items.quest.escapecrystal.ac_use=使用
items.quest.escapecrystal.prompt=选择一件物品
items.quest.escapecrystal.desc=一块似乎内含着传送魔法的细长棱晶。你随时都可以使用这块棱晶离开宝库，但若是提早离开的话可别想拿到最好的报酬！
items.quest.escapecrystal.discover_hint=你可在某个任务中找到该物品。
items.quest.escapecrystal.injure_warning_1=时间的流逝似乎放缓了些，与此同时你听见了小恶魔的声音：\n\n“天哪，看起来你伤得有点重，你确定你那边一切还好吗？我是很想要那座雕像啦，但我更希望你不要把命丢掉！”
items.quest.escapecrystal.injure_warning_2=“如果你现在处境不妙的话，可以先用_初始房间里的传送道具_想办法回到那边去，休整好了再重新出去探索。”
items.quest.escapecrystal.injure_warning_3=“假如情况实在严峻到你根本没法解决了，那你还是_用我给你的棱晶逃出宝库_吧。不过你可别想着这样还能从我这里拿到多少报酬，我能让你保住小命就不错了！”
items.quest.escapecrystal.leaving_start=时间的流逝似乎放缓了些，与此同时你听见了小恶魔的声音：\n\n“听着，我完全理解你有可能会紧张，不过能不能麻烦您起码走出第一个房间出去看看？”\n\n“你大可不必担心我把你的装备偷走，我这个恶魔一向守信用，我保证你回来的时候它们都会齐齐整整物归原主。万一你真的遇到危险了，我也肯定会让你传送回来的，我向你发誓。”
items.quest.escapecrystal.leaving_early=时间的流逝似乎放缓了些，与此同时你听见了小恶魔的声音：\n\n“真的假的，这就打算跑路了吗！？想从宝库里绝大多数敌人的眼前溜走很容易，这你明明是知道的吧？”\n\n“天哪，假如你真的觉得自己现在就有生命危险了，我当然会把你传送出来，可你也别想带什么别的宝物回来了。我还以为真的能指望你帮点忙呢 =(”
items.quest.escapecrystal.leaving_partly_explored=时间的流逝似乎放缓了些，与此同时你听见了小恶魔的声音：\n\n“喔，你打算回来了吗？也行，起码你也帮我勘探了一下宝库的布局，聊胜于无了。”\n\n“唉，我当然是期待你还能多做点什么了 =( 。你需要的话我当然会把你传送回来，或许能让你一块带上个什么药剂或者卷轴回来吧。”
items.quest.escapecrystal.leaving_fully_explored=时间的流逝似乎放缓了些，与此同时你听见了小恶魔的声音：\n\n“要我把你带回来？行，至少你算是把这片宝库摸索了个大概。托你的福，我现在对宝库里的机关与地形多了不少了解，不过我还是希望你能再深入探索一下，顺带也替你自己好好搜刮点物资嘛。”\n\n“我会让你带一样东西出来的，不过升级过的物品可不行！”
items.quest.escapecrystal.leaving_partial_victory=时间的流逝似乎放缓了些，与此同时你听见了小恶魔的声音：\n\n“真不错啊，你已经替我把这座宝库的绝大部分都探索、清理过一遍了！虽然我真的还是很希望你能把那座雕像带出来就是了。”\n\n“我就直说吧，你帮了我许多，只要不是升级超过+1的物品你都可以挑出来带走，我也会按约定在楼下把店面准备好的。反正我还得花上些时间安排接下来的行动，布置一下店面也费不了多久。”
items.quest.escapecrystal.leaving_victory=时间的流逝似乎放缓了些，与此同时你听见了小恶魔的声音：\n\n“干得漂亮！！你准备回来了吗？我就在原地，记得来我这把雕像给我。”\n\n“按咱们说好的，我会把店面设在楼下不远处，你也可以任选一件东西带出宝库！你慢慢挑吧，毕竟宝库里剩下的东西你可拿不出来。”
items.quest.escapecrystal.leaving_item=你确定这就是你想带走的物品吗？
items.quest.escapecrystal.leaving_seal=_贴附在这件护甲上的破损纹章与宝库中的黑镜紧密联系，你无法将它带出宝库。_离开时，纹章会自动从护甲上剥落并使其等级降低一级，但不会带走其上原有的刻印。
items.quest.escapecrystal.leaving_staff=_这把法师魔杖与宝库中的黑镜紧密联系，其本身无法被带出宝库，但你可以带走其中原本灌注的法杖。_离开时，法杖会以比魔杖低一级的属性被自动剥离出来。
items.quest.escapecrystal.leaving_yes=离开宝库
items.quest.escapecrystal.leaving_no=留在这里
items.quest.escapecrystal.error_start=似乎你并不处于宝库层中！可能是bug或崩溃导致的。
items.quest.escapecrystal.error_no_items=你还没有把物品存放好，棱晶已经从你的背包中移除。
items.quest.escapecrystal.error_with_items=你背包里的物品已经存放好了，现在可以再度进入宝库以开始委托任务。存起来的物品会在委托结束时归还。

items.quest.gooblob.name=粘咕球
items.quest.gooblob.desc=一团晃动着的黏糊糊球体，是从粘咕尸体上崩解下的一部分。看起来像是一个大果冻球，不过大概不能食用。\n\n该物品自身并没有什么实际用途，不过它在与特定药剂或炸弹共炼后可能有妙用。再不济，它也能提供相当的炼金能量。
items.quest.gooblob.discover_hint=你可从某种敌人的掉落物中获得该物品。

items.quest.impstatue.name=黑曜石雕像
items.quest.impstatue.desc=一块小小的漆黑雕塑，由黑曜石雕成。它的外表与委托你进入宝库的那位小恶魔神似，连那闪亮的绿眼睛也颇为相像。雕像的底座上用你没有见过的语言刻着一串铭文。
items.quest.impstatue.discover_hint=你可在某个任务中找到该物品。

items.quest.vaultbeacon.name=宝库信标
items.quest.vaultbeacon.desc=这个信标内含的魔法似乎能带你回到一个特定的位置，目的地很可能就是你找到它的那个房间。\n\n你可以用它节省一点探索的时间，若是身处险境也可以用它逃出生天。
items.quest.vaultbeacon.discover_hint=你可在某个任务中找到该物品。

items.quest.metalshard.name=邪能碎片
items.quest.metalshard.desc=一块被诅咒的金属锈片，它是DM-300的装甲外壳被击碎时分离出来的。你能感受到某种尚未激活的恶毒魔力潜藏其中。\n\n该物品自身并没有什么实际用途，不过它在与特定卷轴或炸弹共炼时可能有妙用。再不济，它也能提供相当的炼金能量。
items.quest.metalshard.discover_hint=你可从某种敌人的掉落物中获得该物品。

items.quest.pickaxe.name=镐子
items.quest.pickaxe.ac_mine=采掘
items.quest.pickaxe.no_vein=附近没有可供采掘的暗金矿脉。
items.quest.pickaxe.ability_name=穿刺
items.quest.pickaxe.ability_desc=决斗家可使用镐子_穿刺_一个敌人。穿刺必定命中，同时施加3回合的易伤效果，且会对有硬质表皮的敌人造成_%1$d~%2$d点伤害_。
items.quest.pickaxe.upgrade_ability_stat_name=武技伤害
items.quest.pickaxe.desc=这是一件巨大且耐用的凿岩工具。也许能当武器用。
items.quest.pickaxe.discover_hint=你可在某个任务中找到该物品。

items.quest.ratskull.name=巨鼠头骨
items.quest.ratskull.desc=一颗大得吓人的老鼠头骨。如果你能找到一面合适的墙来挂，它会是件不错的狩猎纪念品。



###remains
items.remains.remainsitem.ac_use=使用
items.remains.remainsitem.discover_hint=你可从上一局某位英雄的遗骸中找到该物品。

items.remains.bowfragment.name=灵弓残件
items.remains.bowfragment.desc=这块枯木曾经是一位殒落于此的女猎手所持灵能弓的一部分。你仍可以感受到枯木中残留的一点自然能量，你可以激发这最后的能量，令周身长出一片高草。但是当你这样做之后，这块枯木会由于自然能量耗尽而烟消云散。

items.remains.brokenhilt.name=断折剑柄
items.remains.brokenhilt.desc=这把断折剑柄曾经应是一名败于此地的决斗者随身武器。即使如今你仍可感受到剑柄其上残留的武道气息，你可以运起这股气息，在接下来使用近战武器两次命中时造成些许额外伤害。但这意味着剑柄会随着武者气息的流失而烟消云散。

items.remains.brokenstaff.name=横断魔杖
items.remains.brokenstaff.desc=这把法师魔杖在其主死后也断做两截。你仍可以感受到魔杖中残余的魔力波动，你可以用它来给你的法杖提供一些充能。但是，这样也会使得魔杖随着魔力的流失而烟消云散。

items.remains.cloakscrap.name=残破织物
items.remains.cloakscrap.desc=这块半透明的织物残片似是源于一位盗贼同行的暗影斗篷。你可以感受到一丝神秘的能量仍残留其中，你可以用它来给你的神器提供一些充能。但是如此残片也会随着神秘能量耗尽而烟消云散。

items.remains.sealshard.name=纹章残蜡
items.remains.sealshard.desc=这些细碎的红色蜡块似是源于一名葬身于此战士的纹章。你可以感受到其上仍残留的一缕执念，你可以用它来给自己提供一些护盾。但是，伴随着这缕执念转化为护盾，这些蜡块也会烟消云散。

items.remains.tornpage.name=圣典残页
items.remains.tornpage.desc=这片书页看起来是从一位已安息主怀的牧师的圣典上撕扯下来的。其上依旧残存有一丝神力，你可以使用它恢复少许生命值。但若如此书页也会随之烟消云散。



###rings
items.rings.ring.diamond=钻石戒指
items.rings.ring.opal=蛋白石戒指
items.rings.ring.garnet=石榴石戒指
items.rings.ring.ruby=红宝石戒指
items.rings.ring.amethyst=紫水晶戒指
items.rings.ring.topaz=黄玉戒指
items.rings.ring.onyx=黑曜石戒指
items.rings.ring.tourmaline=碧玺戒指
items.rings.ring.emerald=绿宝石戒指
items.rings.ring.sapphire=蓝宝石戒指
items.rings.ring.quartz=石英戒指
items.rings.ring.agate=玛瑙戒指
items.rings.ring.equip_cursed=这枚戒指突然紧缩，箍住了你的手指！
items.rings.ring.unknown_desc=这枚金属环镶嵌着一颗在黑暗中闪烁光芒的大块宝石。谁知道戴上后会有什么效果？
items.rings.ring.known=这是一枚%s。
items.rings.ring.identify=你对你的戒指已经足够熟悉并且可以因此将其完全鉴定。
items.rings.ring.cursed_worn=由于这个戒指被诅咒，你无力将其除下。
items.rings.ring.curse_known=你能感觉到这件戒指里潜伏着一股充满恶意的魔力。
items.rings.ring.not_cursed=这枚戒指没有被诅咒。

items.rings.ringofaccuracy.name=精准戒指
items.rings.ringofaccuracy.stats=佩戴这枚戒指时，你的精准度会增加_%1$d_点，攻击距离会增加_%2$d_格。
items.rings.ringofaccuracy.typical_stats=佩戴这枚戒指时，你的精准属性通常会增加_%s%%_。
items.rings.ringofaccuracy.combined_stats=你已装备的戒指正联结它们的力量，一共增加了你_%s%%_的精准。
items.rings.ringofaccuracy.upgrade_stat_name_1=精准加成
items.rings.ringofaccuracy.desc=这枚戒指提高了你的专注力，使敌人难以躲闪你的攻击。该戒指每10级提供1格额外的攻击距离，但在30级效果达到上限。

items.rings.ringofarcana.name=奥术之戒
items.rings.ringofarcana.stats=佩戴这枚戒指时，你的附魔和刻印效果会提升_%s%%_。
items.rings.ringofarcana.typical_stats=佩戴这枚戒指时，你的附魔和刻印效果通常会提升_%s%%_。
items.rings.ringofarcana.combined_stats=你已装备的戒指正联结它们的力量，一共增强了_%s%%_的附魔与刻印效果。
items.rings.ringofarcana.upgrade_stat_name_1=奥术加成
items.rings.ringofarcana.desc=这枚戒指增强了武器上的附魔和护甲上的刻印，也包括诅咒！戒指会先提高它们的触发概率，当触发概率达到100%时，会转而增加它们效果的强度。被诅咒的戒指则会反过来削弱附魔、刻印以及诅咒。

items.rings.ringofelements.name=元素戒指
items.rings.ringofelements.stats=当佩戴这枚戒指时，增益效果提升至_%1$s%%_倍，负面效果降低至_%2$s%%_倍，承受的法术伤害降低_%3$s%%_。。
items.rings.ringofelements.upgrade_stat_name_1=法术抗性
items.rings.ringofelements.desc=这枚戒指能为你提供多种法术抗性，降低了受到的法术伤害，并改变状态效果的持续时间。在30级时这个效果达到上限。

items.rings.ringofenergy.name=能量之戒
items.rings.ringofenergy.stats=佩戴这枚戒指时，你持有的法杖，神器及英雄护甲充能速度将提高_%s%%_。
items.rings.ringofenergy.typical_stats=佩戴这枚戒指时，通常情况下，你持有的法杖，神器及英雄护甲充能速度将提高_%s%%_。
items.rings.ringofenergy.combined_stats=你已装备的戒指正联结它们的力量，一共增加了_%s%%_的充能速度。
items.rings.ringofenergy.upgrade_stat_name_1=充能加成
items.rings.ringofenergy.desc=在戒指的奥术领域笼罩下，你持有的所有魔法装备充能速度都会得到提升。被诅咒的戒指反而会减慢充能速度。

items.rings.ringofevasion.name=闪避戒指
items.rings.ringofevasion.stats=佩戴这枚戒指时，你的闪避值会增加_%d_点，潜行会增加_%2$d_点。
items.rings.ringofevasion.typical_stats=佩戴这枚戒指时，你的闪避属性通常会提升_%s%%_。
items.rings.ringofevasion.combined_stats=你已装备的戒指正联结它们的力量，一共增加了_%s%%_的闪避。
items.rings.ringofevasion.upgrade_stat_name_1=闪避加成
items.rings.ringofevasion.desc=这枚戒指会混淆配戴者的真实位置，令其更难被敌人击中。该戒指每5级提供1点额外的潜行,但在30级时这枚戒指的潜行效果达到上限。

items.rings.ringofforce.name=武力之戒
items.rings.ringofforce.stats=赤手空拳时，以你目前的力量，佩戴这枚戒指能够造成_%1$d~%2$d伤害_。当装备一件武器时，这枚戒指会为其增加_%3$d_点伤害。
items.rings.ringofforce.typical_stats=赤手空拳时，以你目前的力量，佩戴这枚戒指通常能够造成_%1$d~%2$d伤害_。当装备一件武器时，这枚戒指通常会为其增加_%3$d_点伤害。
items.rings.ringofforce.combined_stats=你已装备的戒指正联结它们的力量，在不使用武器时一共造成_%1$d~%2$d点伤害_，在使用武器时则可提升_%3$d_点伤害。
items.rings.ringofforce.upgrade_stat_name_1=徒手伤害
items.rings.ringofforce.upgrade_stat_name_2=武器伤害加成
items.rings.ringofforce.upgrade_stat_name_3=武技伤害
items.rings.ringofforce.ability_name=拳击架势
items.rings.ringofforce.typical_ability_desc=决斗家可通过这枚戒指进入_拳击架势_，使得决斗家哪怕装备了其它武器也会用这枚戒指发动普通攻击。每次攻击一般会造成_%1$d~%2$d点伤害_，并继承武器的附魔与强化效果。在这种架势下，武器的充能速度会减慢50%%。
items.rings.ringofforce.ability_desc=决斗家可通过这枚戒指进入_拳击架势_，使得决斗家哪怕装备了其它武器也会用这枚戒指发动普通攻击。每次攻击会造成_%1$d~%2$d点伤害_，并继承武器的附魔与强化效果。在这种架势下，武器的充能速度会减慢50%%。
items.rings.ringofforce.desc=这枚戒指能够增强佩戴者的打击力度。这份额外的力量在挥舞武器时相当有限，而徒手攻击则会被大幅增强。被诅咒的戒指会导致佩戴者的攻击变得软弱无力。
items.rings.ringofforce$brawlersstance.name=拳击架势
items.rings.ringofforce$brawlersstance.desc=在这种架势下，决斗家将使用装备着的武力戒指进行普通攻击，哪怕她已经装备了其他武器。这种攻击会使用武器的强化与附魔效果，还会造成额外伤害。\n\n不过，维持这个架势需要耗费精力，导致决斗家的武技充能速度降低50%。\n\n这个架势可以用武力戒指来进入和退出，不过进出这个架势会导致武技充能的减缓效果持续一小会儿。

items.rings.ringoffuror.name=狂怒戒指
items.rings.ringoffuror.stats=佩戴这枚戒指时，你的武器的攻击速度会提升_%1$s%%_，你的基础伤害提升_%2$s_点。
items.rings.ringoffuror.typical_stats=佩戴这枚戒指时，你的攻击速度通常会提升_%s%%_。
items.rings.ringoffuror.combined_stats=你已装备的戒指正联结它们的力量，一共增加了_%s%%_的攻击速度。
items.rings.ringoffuror.upgrade_stat_name_1=攻速加成
items.rings.ringoffuror.desc=这枚戒指会激发配戴者内心的怒火，使其能够更有力更迅猛地攻击。在30级时这枚戒指效果达到上限。

items.rings.ringofhaste.name=疾速戒指
items.rings.ringofhaste.stats=佩戴这枚戒指时，你的移动速度会提升_%s%%_。
items.rings.ringofhaste.typical_stats=佩戴这枚戒指时，你的移动速度通常会提升_%s%%_。
items.rings.ringofhaste.combined_stats=你已装备的戒指正联结它们的力量，一共增加了_%s%%_的移动速度。
items.rings.ringofhaste.upgrade_stat_name_1=移速加成
items.rings.ringofhaste.desc=这枚戒指减轻了配戴者在移动时的负担，使其能够飞速奔跑。在30级时这枚戒指效果达到上限。

items.rings.ringofmight.name=根骨之戒
items.rings.ringofmight.stats=佩戴这枚戒指时，你的力量会增加_%1$d_，你的最大生命值会增加_%2$s%%_。
items.rings.ringofmight.typical_stats=佩戴这枚戒指时，你的力量通常会提升_%1$d_点，并且最大生命值通常会增加_%2$s%%_。
items.rings.ringofmight.combined_stats=你已装备的戒指正联结它们的力量，一共提高了你_%1$d_点力量与_%2$s%%_点最大生命值。
items.rings.ringofmight.upgrade_stat_name_1=力量加成
items.rings.ringofmight.upgrade_stat_name_2=生命上限加成
items.rings.ringofmight.desc=这枚戒指会增强佩戴者的体质，使其拥有更强的力量与体格。被诅咒的戒指则会使人虚弱。

items.rings.ringofsharpshooting.name=神射之戒
items.rings.ringofsharpshooting.stats=佩戴这枚戒指时，你的投掷武器伤害会获得_%1$d_级的提升，耐久度则会提升_%2$s%%_。
items.rings.ringofsharpshooting.typical_stats=佩戴这枚戒指时，你的投掷武器伤害通常会获得_%1$d_级的提升，耐久度则会提升_%2$s%%_。
items.rings.ringofsharpshooting.combined_stats=你已装备的戒指正联结它们的力量，一共提高了_%1$d_级投掷武器等级，并且增加了其_%2$s%%_耐久。
items.rings.ringofsharpshooting.upgrade_stat_name_1=等级伤害加成
items.rings.ringofsharpshooting.upgrade_stat_name_2=耐久度加成
items.rings.ringofsharpshooting.desc=这枚戒指会加强佩戴者的瞄准能力，使投掷武器变得更加致命且耐用。被诅咒的戒指则会起反作用。

items.rings.ringoftenacity.name=韧性之戒
items.rings.ringoftenacity.stats=佩戴这枚戒指时，你受到的伤害至多减少_%s%%_。
items.rings.ringoftenacity.typical_stats=佩戴这枚戒指时，你受到的伤害通常至多减少_%s%%_。
items.rings.ringoftenacity.combined_stats=你已装备的戒指正联结它们的力量，一共减少了你受到伤害的最多_%s%%_。
items.rings.ringoftenacity.upgrade_stat_name_1=伤害抗性上限
items.rings.ringoftenacity.desc=这枚戒指使佩戴者能够抵御本应致命的打击。佩戴者受伤越重，对伤害的抗性就越高。被诅咒的戒指则会让敌人更容易杀死佩戴者。

items.rings.ringofwealth.name=财富之戒
items.rings.ringofwealth.stats=佩戴这枚戒指时，你的整体幸运程度会提升_%s%%_。
items.rings.ringofwealth.typical_stats=佩戴这枚戒指时，你的整体幸运程度通常会提升_%s%%_。
items.rings.ringofwealth.combined_stats=你已装备的戒指正联结它们的力量，一共增加了你_%s%%_的幸运。
items.rings.ringofwealth.upgrade_stat_name_1=幸运加成
items.rings.ringofwealth.desc=这枚戒指有如磁石般的招财功效，佩戴者有更大的机率从敌人身上或各类宝箱中取得较有价值的道具。被诅咒的戒指反而会降低发现宝物的可能性。



