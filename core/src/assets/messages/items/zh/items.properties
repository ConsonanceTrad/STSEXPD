items.changeequip.ac_change=交换
items.changeequip.change=装备切换
items.kindofweapon.empty=空栏位

items.kingscrown.name=矮人国王的皇冠
items.kingscrown.ac_wear=加冕
items.kingscrown.naked=非常遗憾，皇冠的魔力无法强化你的内衣。
items.kingscrown.upgraded=皇冠熔为曜日般的金光，而你的护甲在照耀下开始逐渐变形！
items.kingscrown.ratgraded=鼠王挥爪便召出了万丈光芒，而你的护甲在照耀下开始逐渐变形！
items.kingscrown.desc=末代矮人国王的皇冠，至强的魔法能量以光芒的形式从中辐射而出。\n\n如果你有决心将其戴上，皇冠的魔力会涌入你正在装备的护甲，将其改造为_拥有特殊技能的独特英雄护甲_。新的护甲会保留原护甲的所有属性与刻印。
items.kingscrown.discover_hint=你可从某种敌人的掉落物中获得该物品。

items.liquidmetal.name=液金
items.liquidmetal.ac_apply=修复
items.liquidmetal.prompt=选择一个投掷武器
items.liquidmetal.already_fixed=这件投掷武器已经完好无损了！
items.liquidmetal.apply=你为修复该投掷武器消耗了%d滴液金。
items.liquidmetal.desc=这种神奇的液体可以修补投掷武器的破损之处，使之焕然一新！若有一组武器完好无损但缺失其一，液金甚至可用于替换那件缺失的武器！\n\n完全修复一件1阶武器需要10瓶液金，而一件5阶武器需要30瓶液金。武器的每级升级还会增加35%的液金需求量。\n\n液金无法用于修复涂药飞镖的耐久度。
items.liquidmetal.discover_hint=你可通过炼金合成该物品。

items.lostbackpack.name=遗物
items.lostbackpack.desc=你的遗物，包含你遗留在此的所有物品。快快重新拥有它们吧！

items.merchantsbeacon.name=商人信标
items.merchantsbeacon.ac_use=使用
items.merchantsbeacon.desc=这件矮人科技的奇特产物能够让你和遥远的地方通讯。\n\n激活时，这枚信标可以让你从地牢的任意角落向像素商店出售物品。\n\n不过信标内的魔法只够支撑一次会话，请酌情使用。

items.stylus.name=奥术刻笔
items.stylus.ac_inscribe=蚀刻
items.stylus.prompt=选择一件护甲
items.stylus.identify=你需要先鉴定那件护甲有无诅咒。
items.stylus.cursed=奥术刻笔的力量无法作用在被诅咒的护甲上。
items.stylus.inscribed=你用刻笔雕刻了盔甲。
items.stylus.desc=这支奥术刻笔由一种暗黑色的坚硬石料制成。你能用它在护甲上刻下魔法刻印，不过你无法自主选择，刻笔会替你做出决定。

items.tengusmask.name=天狗的面具
items.tengusmask.ac_wear=佩戴
items.tengusmask.used=面具瓦解了，它所蕴含的能量涌入了你的身体。
items.tengusmask.desc=天狗死时，这幅面具像褪皮般从他的脸上失落地滑下。你能感受它在波动着一股神妙的魔力，仿佛在极力劝你成为它的新主人。难道天狗戴上它时也是被其力量吸引？\n\n如果你有勇气将其戴上，面具的庞大力量会转嫁到你体内，供你为英雄_选择一种职业专精_。\n\n你会选择哪条道路？
items.tengusmask.discover_hint=你可从某种敌人的掉落物中获得该物品。

items.torch.name=火把
items.torch.ac_light=点燃
items.torch.ac_set=放置
items.torch.desc=冒险必备物品，每当地牢陷入黑暗之时，火把能让你走上正确的道路。

items.waterskin.name=露珠瓶
items.waterskin.ac_drink=饮用
items.waterskin.ac_light=照明
items.waterskin.ac_detect=侦测
items.waterskin.ac_cleanse=清洗
items.waterskin.ac_haste=加速
items.waterskin.collected=你将一滴露珠收集到了水袋里。
items.waterskin.full=你的水袋装满了！
items.waterskin.empty=你的水袋一滴也不剩了！
items.waterskin.not_enough=水袋中的露珠不足以施展这项能力。
items.waterskin.lit=露珠化作稳定的微光，照亮了你的周围。
items.waterskin.detected=露珠短暂揭示了本层所有生物的位置。
items.waterskin.cleansed=露珠洗去了有害效果，并为你提供了片刻净化保护。
items.waterskin.hastened=露珠令你的脚步短暂加快。
items.waterskin.desc=牛皮缝制的液体容器，被软木塞牢牢密封着。在激烈的搏斗中也不会漏出一滴内容。
items.waterskin.desc_water=你的水袋里只有普普通通的饮用水，地牢中肯定会有更值得装的东西。
items.waterskin.desc_heal=水袋里现在装着有治愈魔力的露水。每滴露珠恢复最大生命值的2.5%%，每次只会喝掉你需要的量。
items.waterskin.desc_full=装满了的水袋散发着一股能量，也许能够用来祝福其他的生存道具？
items.waterskin.desc_utility=露珠瓶可以恢复生命、侦测生物并持续照明，后续还可解锁种植、强化、清洗、加速和提纯功能。
items.waterskin.discover_hint=某位英雄初始携带该物品。

