items.weapon.missiles.throwing.boomerang.desc=被投向敌人后，这具扁平的曲状木制投掷物能够自动回到投掷者手中。此外，这个回旋镖可以使用强化子弹强化。
items.weapon.spammo.heavyammo.name=重铅弹
items.weapon.spammo.heavyammo.desc=将两枚原石组锻造成的特殊子弹，能使武器附带更高的伤害。
items.weapon.spammo.fireammo.name=燃烧弹
items.weapon.spammo.fireammo.desc=将原石和火焰种锻造而成的特殊子弹，能使武器附带火焰伤害。
items.weapon.spammo.iceammo.name=寒霜弹
items.weapon.spammo.iceammo.desc=将原石和寒冰种锻造而成的特殊子弹，能使武器附带寒冰伤害。
items.weapon.spammo.stormammo.name=雷暴弹
items.weapon.spammo.stormammo.desc=将原石和风暴种锻造而成的特殊子弹，能使武器附带雷电伤害。
items.weapon.spammo.mossammo.name=淬毒弹
items.weapon.spammo.mossammo.desc=将原石和毒药种锻造而成的特殊子弹，能使武器附带毒液伤害。
items.weapon.spammo.blindammo.name=闪光弹
items.weapon.spammo.blindammo.desc=将原石和致盲种锻造而成的特殊子弹，能使武器附带致盲效果。
items.weapon.spammo.starammo.name=陨星弹
items.weapon.spammo.starammo.desc=将原石和星陨种锻造而成的特殊子弹，能使武器附带更高的暗属性伤害。
items.weapon.spammo.dreamammo.name=催眠弹
items.weapon.spammo.dreamammo.desc=将原石和睡眠种锻造而成的特殊子弹，能使目标破甲并减速。
items.weapon.spammo.dewammo.name=碎片弹
items.weapon.spammo.dewammo.desc=将原石和露珠种锻造而成的特殊子弹，能使武器附带多段元素伤害。
items.weapon.spammo.sunammo.name=活性弹
items.weapon.spammo.sunammo.desc=将原石和恢复种锻造而成的特殊子弹，能使目标长出吸取生命的寄生种子。
items.weapon.spammo.sandammo.name=烟尘弹
items.weapon.spammo.sandammo.desc=将原石和消逝种锻造而成的特殊子弹，能使武器附带削弱效果。
items.weapon.spammo.goldammo.name=彩票弹
items.weapon.spammo.goldammo.desc=将原石和种子荚锻造而成的特殊子弹，能消耗金币造成额外伤害。
items.weapon.spammo.emptyammo.name=空心弹
items.weapon.spammo.emptyammo.desc=将原石和无味种锻造而成的特殊子弹……这有什么用？
items.weapon.spammo.rotammo.name=腐败弹
items.weapon.spammo.rotammo.desc=将原石和腐梅种或鲜莓种锻造而成的特殊子弹，能使武器附带腐败效果。
items.weapon.spammo.evolveammo.name=退化弹
items.weapon.spammo.evolveammo.desc=将原石和转换种锻造而成的特殊子弹，能将普通目标退化为生命细胞。
items.weapon.spammo.thornammo.name=荆棘弹
items.weapon.spammo.thornammo.desc=将原石和地种组锻造成的特殊子弹，能使武器附带流血或残废效果。
items.weapon.spammo.battleammo.name=战斗弹
items.weapon.spammo.battleammo.desc=将原石和吞星种锻造而成的特殊子弹，能增强使用者的战斗能力。
items.weapon.spammo.woodenammo.name=软木弹
items.weapon.spammo.woodenammo.desc=将原石和坚果锻造而成的特殊子弹，能使目标眩晕并有概率将其麻痹。
