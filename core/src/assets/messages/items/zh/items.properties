items.weapon.missiles.meleethrow.brick.desc=一块由泥土烧成的普通砖头。劳动节辛苦了。\n高级钝器，飞掷，易碎-报酬
items.weapon.missiles.meleethrow.dragonboat.name=龙舟模型
items.weapon.missiles.meleethrow.dragonboat.desc=木制的龙舟模型，说实在的应该放在玻璃瓶里。\n钝器，飞掷，易碎-尖锐
items.weapon.melee.special.goei.name=驱魔御币
items.weapon.melee.special.goei.desc=一把驱魔御币，博丽的巫女常用它来治退妖魔鬼怪。——REN\n除秽，积蓄
items.weapon.melee.special.tekkokagi.name=攻击之爪
items.weapon.melee.special.tekkokagi.desc=看起来像金刚狼爪子的忍者武器。——Typedscroll\n致死
items.weapon.melee.special.wraithbreath.name=幽灵之息
items.weapon.melee.special.wraithbreath.desc=来自幽灵的气息。\n恐吓
items.weapon.melee.stonecross.name=十碑
items.weapon.melee.stonecross.desc=一个由Coconut制作的巨大石头十字碑。每次命中都会积蓄力量；命中二十次后，下一击造成五倍伤害。
items.weapon.melee.stonecross.charge=积蓄：%1$d / %2$d。
items.weapon.melee.mirrordoll.name=持镜人偶
items.weapon.melee.mirrordoll.desc=拿着镜子的人偶，诡异或者可爱。它能沉默目标，并对魔法护盾造成额外打击。——Coconut
items.weapon.melee.handlight.name=神拳灯
items.weapon.melee.handlight.desc=挖出来，擦一下，数个三，上勾拳。它能沉默目标，并对魔法护盾造成额外打击。——Coconut
items.weapon.melee.cursebox.name=魔箱
items.weapon.melee.cursebox.desc=这个家伙喜欢涂满番茄酱的排骨。它能沉默目标，并对魔法护盾造成额外打击。——Coconut
items.weapon.missiles.meleethrow.smallchakram.name=小圆刃
items.weapon.missiles.meleethrow.smallchakram.desc=只要能熟练使用，这种小型圆刃既能近战，也能投掷并回收。——Consideredhamster
items.weapon.missiles.meleethrow.hugeshuriken.name=巨型手里剑
items.weapon.missiles.meleethrow.hugeshuriken.desc=锋锐的巨大星形金属刃片既能近战，也能投掷并回收。——Dachhack
items.weapon.missiles.meleethrow.tamahawk.name=飞斧
items.weapon.missiles.meleethrow.tamahawk.desc=这种沉重的投掷斧也可以装备用于近战。——Watabou
items.weapon.melee.block.goblinshield.name=哥布林神盾
items.weapon.melee.block.goblinshield.desc=一面来自哥布林部落的萨满盾牌。\n奇迹，招架。
items.weapon.melee.block.goblinshield.charge=能量：%d / 10。
items.weapon.melee.block.spknuckles.name=特制指虎
items.weapon.melee.block.spknuckles.desc=指虎教徒所崇拜的指虎。\n钝器，招架。
items.orbofzot.name=储能装置
items.orbofzot.ac_activatethrow=释放能量
items.orbofzot.ac_break=提取
items.orbofzot.rest=储能装置尚未完成充能。
items.orbofzot.desc=一种储能装置，使用后会向外发射能量。不知为这个半透明的装置里面有一张纸片，想取出就要把这个装置破坏。
items.orbofzot.charge=储能装置当前充能数%d，充能上限为%d。
items.journalpages.energycore.name=Otiluck的旅行日志之能源核心
items.journalpages.energycore.desc=能源核心的地址。\n\n说明：这是一个自动攻击的生物。它由zot创造，在我打败zot后我控制了这个生物。
items.triforce.ac_port=使用
items.triforce.name=起源三角
items.triforce.desc=你已经通过了三种试炼，现在可以前去与古神之影战斗了。
items.triforceofcourage.name=勇气三角
items.triforceofcourage.desc=起源三角的一部分，代表着勇气。
items.triforceofpower.name=力量三角
items.triforceofpower.desc=起源三角的一部分，代表着力量。
items.triforceofwisdom.name=智慧三角
items.triforceofwisdom.desc=起源三角的一部分，代表着智慧。

items.weapon.melee.special.handcannon.name=奥能火炮
items.weapon.melee.special.handcannon.ac_onoff=启动/关闭
items.weapon.melee.special.handcannon.fuel=低能源警告！
items.weapon.melee.special.handcannon.off=过载关闭！
items.weapon.melee.special.handcannon.power_on=过载模式启动！
items.weapon.melee.special.handcannon.power_off=过载模式关闭。
items.weapon.melee.special.handcannon.desc=人类发明了火器，矮人强化并改进了它。作为这个世界为数不多的火器之一，这件巨炮可以从很远的地方打击目标。——Consideredhamster \n???


