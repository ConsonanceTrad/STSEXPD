###SPS armor glyphs
items.armor.glyphs.iceglyph.name=雪屋%s
items.armor.glyphs.iceglyph.desc=雪屋刻印可以增加使用者的冰冻抗性，并有几率冰冻攻击者或延缓所受的物理伤害。
items.armor.glyphs.iceglyph$defereddamage.name=延缓伤害
items.armor.glyphs.iceglyph$defereddamage.desc=伤害会随时间缓慢结算，而不是立即扣除。\n\n剩余延缓伤害：%d点。
items.armor.glyphs.fireglyph.name=火罩%s
items.armor.glyphs.fireglyph.desc=火罩刻印可以增加使用者的火焰抗性，并有几率点燃攻击者或提升使用者的攻击力。
items.armor.glyphs.earthglyph.name=残岩%s
items.armor.glyphs.earthglyph.desc=残岩刻印可以增加使用者的地面抗性，并有几率提供地根护甲或提升防御力。
items.armor.glyphs.electricityglyph.name=电网%s
items.armor.glyphs.electricityglyph.desc=电网刻印可以增加使用者的雷电抗性，并有几率麻痹攻击者或为使用者充能。
items.armor.glyphs.lightglyph.name=神圣%s
items.armor.glyphs.lightglyph.desc=神圣刻印可以增加使用者的光照抗性，并有几率魅惑、恐吓或使攻击者狂乱。
items.armor.glyphs.darkglyph.name=暗契%s
items.armor.glyphs.darkglyph.desc=暗契刻印可以增加使用者的黑暗抗性，并有几率吸取攻击者的生命。
items.armor.glyphs.revivalglyph.name=复生%s
items.armor.glyphs.revivalglyph.desc=复生刻印有几率使植被生长，并驱散使用者的负面效果。
items.armor.glyphs.changeglyph.name=变幻%s
items.armor.glyphs.changeglyph.desc=变幻刻印有几率创造一个诱饵，并使使用者远离危险。
items.armor.glyphs.crystalglyph.name=晶化%s
items.armor.glyphs.crystalglyph.desc=晶化刻印有几率在遭受重击后为使用者提供玻璃保护。
items.armor.glyphs.testglyph.name=试验%s
items.armor.glyphs.testglyph.desc=试验刻印有几率在攻击者周围制造危险气体，同时保护使用者免受气体影响。
items.armor.glyphs.adaptglyph.name=适应%s
items.armor.glyphs.adaptglyph.desc=适应刻印有几率根据使用者脚下的地形给予不同的增益效果。
items.armor.glyphs.recoilglyph.name=反冲%s
items.armor.glyphs.recoilglyph.desc=反冲刻印有几率击退攻击者，并根据伤害使其流血。
items.armor.glyphs.energyglyph.name=缓冲%s
items.armor.glyphs.energyglyph.desc=缓冲刻印将提升使用者的能量伤害抗性。

###armor curses
items.armor.curses.antientropy.name=反熵%s
items.armor.curses.antientropy.desc=反熵诅咒与宇宙法则背道而驰，会抽离周遭的热量并汇集到穿戴者身上。这会使穿戴者短暂地燃烧，并冻结周围的一切！

items.armor.curses.bulk.name=臃肿%s
items.armor.curses.bulk.desc=臃肿诅咒的护甲看上去更加厚重，但实际上防御力并没有增强。硕大的体积反而让使用者难以挤入门道。

items.armor.curses.corrosion.name=腐蚀%s
items.armor.curses.corrosion.desc=腐蚀诅咒的护甲会喷溅出腐蚀性液体，为区域内的所有东西盖上一层黏糊糊的酸性淤泥。

items.armor.curses.displacement.name=定相%s
items.armor.curses.displacement.desc=定相诅咒会在穿戴者受到攻击时试图将其传送到安全地带。不过，过强的威力反倒会导致使用者被随机传送到层内各处。

items.armor.curses.metabolism.name=代谢%s
items.armor.curses.metabolism.desc=代谢诅咒在穿戴者受伤时能直接将饱腹度转化为生命值，提供额外的治疗，但你会很快陷入饥饿之中。

items.armor.curses.multiplicity.name=分身%s
items.armor.curses.multiplicity.desc=带有分身诅咒的防具含有一种危险的复制魔法。有时候它会复制出穿戴者的镜像，但也有同等几率复制攻击者！

items.armor.curses.overgrowth.name=丛生%s
items.armor.curses.overgrowth.desc=丛生诅咒的护甲上生长着各种植物。从美学的角度来讲颇为有趣，但这些花花草草对防御力没有任何贡献，只会在战斗中随机发动效果！

items.armor.curses.stench.name=恶臭%s
items.armor.curses.stench.desc=带有恶臭诅咒的防具会释放出团团毒雾，对一切来不及逃离的对象造成伤害。


###glyphs
items.armor.glyphs.affection.name=魅惑%s
items.armor.glyphs.affection.desc=这个强力的刻印能够操控攻击者的心智，暂时地魅惑他们。

items.armor.glyphs.antimagic.name=敌法%s
items.armor.glyphs.antimagic.desc=这个强力的刻印能使护甲在防御物理伤害的同时抵御魔法伤害。这种魔法防御不受护甲等阶影响。

items.armor.glyphs.brimstone.name=狱火%s
items.armor.glyphs.brimstone.desc=这个刻印会保护穿戴者和其所有物免受火焰的伤害及其他影响。

items.armor.glyphs.camouflage.name=迷彩%s
items.armor.glyphs.camouflage.desc=这个刻印能让使用者与高草融为一体，得到短暂的隐形效果。

items.armor.glyphs.entanglement.name=缠绕%s
items.armor.glyphs.entanglement.desc=这个刻印会在使用者周围生出能吸收伤害的地根护甲。这种地根护甲会在使用者移动后散落失效。

items.armor.glyphs.flow.name=涌流%s
items.armor.glyphs.flow.desc=这个刻印能操控使用者周身的水流，让使用者在水中移动时速度大大加快。

items.armor.glyphs.obfuscation.name=晦暗%s
items.armor.glyphs.obfuscation.desc=这个刻印会掩盖使用者的气息，让使用者更难以被发现。

items.armor.glyphs.potential.name=电势%s
items.armor.glyphs.potential.desc=这个刻印在被击中时会积蓄能量，在生效时为使用者的法杖充能。

items.armor.glyphs.repulsion.name=反斥%s
items.armor.glyphs.repulsion.desc=这个刻印会将敌人攻击的冲击力反弹回去，使攻击者飞至远处。

items.armor.glyphs.stone.name=磐岩%s
items.armor.glyphs.stone.desc=这个刻印使用沉重的魔法石包裹了整个铠甲让使用者无法闪避，但会根据原有的闪避能力吸收伤害。

items.armor.glyphs.swiftness.name=迅捷%s
items.armor.glyphs.swiftness.desc=这个刻印会在近范围内没有敌人时提高使用者的移动速度。

items.armor.glyphs.thorns.name=荆棘%s
items.armor.glyphs.thorns.desc=这个强力的刻印会伤害那些攻击穿戴者的敌人，使它们缓慢流血。

items.armor.glyphs.viscosity.name=粘稠%s
items.armor.glyphs.viscosity.deferred=延缓%d点伤害
items.armor.glyphs.viscosity$defereddamage.name=延缓伤害
items.armor.glyphs.viscosity$defereddamage.ondeath=你死于延缓伤害...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=死于延迟伤害
items.armor.glyphs.viscosity$defereddamage.desc=瞬时的伤害被延缓，随着时间慢慢释放。\n\n剩余的延迟伤害：%d
items.armor.glyphs.viscosity.desc=这个刻印可以储存对使用者造成的伤害，让使用者缓慢受伤而不是一下子受到重击。



###armor
items.armor.normalarmor.normalarmor.sps_stats=这件防具的闪避倍率为_%1$s_，潜行为_%2$s_，技能能量为_%3$d_。

items.armor.normalarmor.clotharmor.name=布甲
items.armor.normalarmor.clotharmor.desc=这件轻便的护甲能提供最基本的防御。\n常规护甲
items.armor.normalarmor.woodenarmor.name=木甲
items.armor.normalarmor.woodenarmor.desc=精选上等白桦树皮所制，坚固耐用，但极不舒适。\n重型护甲
items.armor.normalarmor.vestarmor.name=背心
items.armor.normalarmor.vestarmor.desc=一件工厂生产的普通商品，虽然没法抵御伤害，但是十分适合运动。\n轻型护甲
items.armor.normalarmor.leatherarmor.name=皮甲
items.armor.normalarmor.leatherarmor.desc=用鞣制的兽皮制成的护甲。没有布甲轻，但提供更好的防御。\n常规护甲
items.armor.normalarmor.ceramicsarmor.name=陶甲
items.armor.normalarmor.ceramicsarmor.desc=粘土火中烧，结实又可靠。\n重型护甲
items.armor.normalarmor.rubberarmor.name=橡胶衣
items.armor.normalarmor.rubberarmor.desc=一种可以紧贴全身的服装，一般用于角色扮演。\n轻型护甲
items.armor.normalarmor.discarmor.name=碟甲
items.armor.normalarmor.discarmor.desc=这种盔甲只是将金属片缝在布料上。它虽然耐用，但有着很大的体积。\n常规护甲
items.armor.normalarmor.stonearmor.name=石甲
items.armor.normalarmor.stonearmor.desc=利用大地的魔法制作而成的护甲，坚硬而沉重。\n重型护甲
items.armor.normalarmor.cdarmor.name=光碟甲
items.armor.normalarmor.cdarmor.desc=一堆废弃光盘串成的护甲。很明显这是某个环保比赛的优秀作品。\n轻型护甲
items.armor.normalarmor.mailarmor.name=链甲
items.armor.normalarmor.mailarmor.desc=由金属链环环相扣制成的一套结实又不失灵活的护甲。\n常规护甲
items.armor.normalarmor.multiplelayerarmor.name=复层甲
items.armor.normalarmor.multiplelayerarmor.desc=这种护甲有内外两层，以敏捷为代价换取防御。\n重型护甲
items.armor.normalarmor.styrofoamarmor.name=塑料泡沫甲
items.armor.normalarmor.styrofoamarmor.desc=用塑料泡沫充当护甲，这能小幅减轻外来的冲击。\n轻型护甲
items.armor.normalarmor.scalearmor.name=鳞甲
items.armor.normalarmor.scalearmor.desc=在厚实的皮背心中缝入金属鳞片，形成了灵活而高防御的护甲。\n常规护甲
items.armor.normalarmor.bulletarmor.name=防弹衣
items.armor.normalarmor.bulletarmor.desc=基本上就是常规的防弹衣。\n重型护甲
items.armor.normalarmor.protectiveclothingarmor.name=防护服
items.armor.normalarmor.protectiveclothingarmor.desc=部分有毒有害工厂工人必须穿着的工装，可以有效将有毒有害的环境与自身隔离。\n轻型护甲
items.armor.normalarmor.platearmor.name=板甲
items.armor.normalarmor.platearmor.desc=厚重的金属板拼接到一起，为能承受其骇人重量的冒险者提供无与伦比的防御。\n常规护甲
items.armor.normalarmor.machinearmor.name=机械甲
items.armor.normalarmor.machinearmor.desc=常规的板甲配备核心电源，外设四只机械臂，就是会发出巨大噪音。\n重型护甲
items.armor.normalarmor.phantomarmor.name=幻影护甲
items.armor.normalarmor.phantomarmor.desc=先进高科技，外衣上装载着迷你投影仪，可以有效迷惑有眼睛的敌人。\n轻型护甲

items.armor.specialarmor.warriorarmor.name=战士重甲
items.armor.specialarmor.warriorarmor.desc=保证战士拥有正常属性的同时，受击时可以提供额外的法术防护。\n英雄护甲
items.armor.specialarmor.magearmor.name=法师长袍
items.armor.specialarmor.magearmor.desc=基于法师对时间的研究，有几率免疫受到的伤害。\n英雄护甲
items.armor.specialarmor.roguearmor.name=盗贼风衣
items.armor.specialarmor.roguearmor.desc=来自盗贼自身经验的总结，即使受伤也可以偷窃金币。\n英雄护甲
items.armor.specialarmor.huntressarmor.name=猎手披风
items.armor.specialarmor.huntressarmor.desc=自然之神给予猎手的祝福，可以利用其力量反击。\n英雄护甲
items.armor.specialarmor.performerarmor.name=演员夹克
items.armor.specialarmor.performerarmor.desc=大受欢迎的演员套装，能够迷倒万千粉丝。\n英雄护甲
items.armor.specialarmor.soldierarmor.name=星兵背心
items.armor.specialarmor.soldierarmor.desc=制式星兵服装，装载了大量便携弹夹和瞄准系统。\n英雄护甲
items.armor.specialarmor.followerarmor.name=信徒外套
items.armor.specialarmor.followerarmor.desc=看上去普通的信徒服装，能够从他人身上汲取力量。\n英雄护甲
items.armor.specialarmor.asceticarmor.name=修士躯壳
items.armor.specialarmor.asceticarmor.desc=可自由替换的修士躯壳，能够进入持续的超频状态。\n英雄护甲

