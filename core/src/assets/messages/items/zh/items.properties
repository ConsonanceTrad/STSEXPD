items.summon.chinamech.name=壁垒支援用无人机
items.summon.chinamech.ac_active=使用
items.summon.chinamech.desc=呼叫支援，呼叫支援。
items.summon.chinamech$huaweidajiang.name=HW大疆号
items.summon.chinamech$huaweidajiang.desc=壁垒用于支援开拓者的无人机，内含高级食物及若干火箭。
items.sellitem.jumperdancer.name=跳舞人偶
items.sellitem.jumperdancer.desc=你无法阻止这个人偶跳舞。