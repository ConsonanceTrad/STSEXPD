items.weapon.ranges.stonebowr.name=沉重的绑石弓
items.weapon.ranges.stonebowr.desc=将化石绑在弓背上的木弓，但是有些沉重。
items.weapon.ranges.metalbows.name=轻巧的金属弓
items.weapon.ranges.metalbows.desc=使用金属浇筑而成的弓，但是比较轻巧。
