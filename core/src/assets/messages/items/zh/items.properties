items.scrolls.scrollofidentify.desc=该卷轴能永久揭示一件物品的所有秘密。

items.scrolls.scrolloflullaby.name=催眠卷轴
items.scrolls.scrolloflullaby.sooth=卷轴发出了某种舒缓的旋律。你觉得非常困倦。
items.scrolls.scrolloflullaby.desc=阅读这张卷轴会释放出一段舒缓的旋律，让所有听到它的生物深陷魔法睡眠。这种睡眠有益于阅读者及友方单位的健康。

items.scrolls.scrollofmagicmapping.name=探地卷轴
items.scrolls.scrollofmagicmapping.layout=你熟悉了这层的地形。
items.scrolls.scrollofmagicmapping.desc=阅读这张卷轴时，一副明晰的景象会刻入你的记忆中，告知你整个楼层的精确布局并揭开所有隐藏的秘密。不过道具位置和生物分布依旧是未知状态。

items.scrolls.scrollofmirrorimage.name=镜像卷轴
items.scrolls.scrollofmirrorimage.copies=卷轴生成了你的镜像。
items.scrolls.scrollofmirrorimage.no_copies=卷轴尝试创造你的镜像，但是它们没有空间出现。
items.scrolls.scrollofmirrorimage.desc=卷轴上的咒文会创造使用者的两个镜像。这些像使用者的弱化版克隆体的镜像会对敌人展开追杀。不过镜像非常脆弱，受到伤害就会瞬间消散。

items.scrolls.scrollofretribution.name=复仇卷轴
items.scrolls.scrollofretribution.blast=强大的魔力从卷轴中爆发！
items.scrolls.scrollofretribution.desc=这张卷轴可以将使用者的所受的伤痛转化为能量释放而出。使用者的伤势越重，所释放的能量越大。使用者处于低血量的情况下所释放的这种能量足以杀死大部分敌人。\n\n即便如此，这张卷轴依然会影响使用者，使其短时间目盲并虚弱无比。

items.scrolls.scrollofrage.name=盛怒卷轴
items.scrolls.scrollofrage.roar=卷轴产生的激怒咆哮在地牢中回荡！
items.scrolls.scrollofrage.desc=大声诵读内容时，卷轴将释放出一声轰响的咆哮，将所有敌人引向你并激怒附近的单位。

items.scrolls.scrollofrecharging.name=充能卷轴
items.scrolls.scrollofrecharging.surge=一股能量在体内奔腾而过，使你的法杖力量充沛！
items.scrolls.scrollofrecharging.desc=纯正的魔法能量被禁锢在羊皮纸内，当这股能量被释放时会在短时间内持续为阅读者的所有法杖充能。

items.scrolls.scrollofremovecurse.name=祛邪卷轴
items.scrolls.scrollofremovecurse.inv_title=选择一件要净化的物品
items.scrolls.scrollofremovecurse.cleansed=你的道具闪耀着净化的光芒，一股恶毒的能量从中消散。
items.scrolls.scrollofremovecurse.not_cleansed=你的道具闪耀着净化的光芒，不过什么也没发生。
items.scrolls.scrollofremovecurse.spirit=你的卷轴让咒缚灵得以解脱！
items.scrolls.scrollofremovecurse.desc=卷轴上的咒语能够瞬间清除指定的一件武器、护甲、法杖、戒指或神器上的诅咒。

items.scrolls.scrollofteleportation.name=传送卷轴
items.scrolls.scrollofteleportation.tele=眨眼之间你就被传送到本层的另外一个位置。
items.scrolls.scrollofteleportation.no_tele=传送魔法失败了。
items.scrolls.scrollofteleportation.cant_reach=你不能传送到那个位置。
items.scrolls.scrollofteleportation.prompt=选择想要传送的地点
items.scrolls.scrollofteleportation.desc=羊皮纸上的咒语能立刻让阅读者传送到本层的另一处。卷轴会优先选择阅读者还未探索的地方，但无法将人传送到门被锁或被路障堵住入口的密室中。不过，它能帮助发现通向未知区域的隐藏门。

items.scrolls.scrollofterror.name=恐惧卷轴
items.scrolls.scrollofterror.none=这个卷轴产生了一阵明亮的红色闪光。
items.scrolls.scrollofterror.one=这个卷轴产生了一阵明亮的红色闪光的同时%s逃跑了！
items.scrolls.scrollofterror.many=这个卷轴产生了一阵明亮的红色闪光的同时怪物们逃跑了！
items.scrolls.scrollofterror.desc=被阅读的时候，该卷轴会爆射出一道可怖的红色闪光，以恐惧压垮使用者视野范围内生物的心智并使它们转身逃跑。攻击正在逃跑的敌人会缩短该效果的持续时长。

items.scrolls.scrolloftransmutation.name=嬗变卷轴
items.scrolls.scrolloftransmutation.inv_title=选择一件要嬗变的物品
items.scrolls.scrolloftransmutation.nothing=没发生什么有意思的事。
items.scrolls.scrolloftransmutation.morph=你的道具变成了另一样东西！
items.scrolls.scrolloftransmutation.desc=卷轴内存着强力的嬗变魔法，用在可行的物品上会将其转变成同类型的另一样物品。嬗变魔法还会保留原物品上的升级、附魔和刻印。卷轴或药剂将被转化为秘卷或合剂，反之亦然。

items.scrolls.scrollofupgrade.name=升级卷轴
items.scrolls.scrollofupgrade.inv_title=选择一件要升级的物品
items.scrolls.scrollofupgrade.weaken_curse=升级卷轴减弱了物品上的诅咒。
items.scrolls.scrollofupgrade.remove_curse=升级卷轴净化了物品上的诅咒！
items.scrolls.scrollofupgrade.desc=这张卷轴可以升级一件物品或一组投掷武器。法杖可获得更高的效能与更多的充能，武器与护甲可获得更强的攻防属性，投掷武器组的耐久度可获得重置与提升，而戒指的效能可获得强化。\n\n这张卷轴能弱化诅咒甚至可能将其完全净化，但是效果不如祛邪卷轴稳定。不幸地，升级魔法也可能消除高级装备的附魔或刻印。



###exotic scrolls
items.scrolls.exotic.exoticscroll.kaunan=KAUNAN秘卷
items.scrolls.exotic.exoticscroll.sowilo=SOWILO秘卷
items.scrolls.exotic.exoticscroll.laguz=LAGUZ秘卷
items.scrolls.exotic.exoticscroll.yngvi=YNGVI秘卷
items.scrolls.exotic.exoticscroll.gyfu=GYFU秘卷
items.scrolls.exotic.exoticscroll.raido=RAIDO秘卷
items.scrolls.exotic.exoticscroll.isaz=ISAZ秘卷
items.scrolls.exotic.exoticscroll.mannaz=MANNAZ秘卷
items.scrolls.exotic.exoticscroll.naudiz=NAUDIZ秘卷
items.scrolls.exotic.exoticscroll.berkanan=BERKANAN秘卷
items.scrolls.exotic.exoticscroll.odal=ODAL秘卷
items.scrolls.exotic.exoticscroll.tiwaz=TIWAZ秘卷
items.scrolls.exotic.exoticscroll.unknown_desc=这张漆黑的羊皮纸上刻满了闪耀着魔力光芒的晦涩符文。看起来这不是这个世界的物品。大声念出来会发生什么？
items.scrolls.exotic.exoticscroll.discover_hint=你可通过炼金合成该物品。

items.scrolls.exotic.scrollofsirenssong.name=魅音秘卷
items.scrolls.exotic.scrollofsirenssong.prompt=选择一个目标
items.scrolls.exotic.scrollofsirenssong.no_target=这张秘卷在没有目标的情况下激活了。
items.scrolls.exotic.scrollofsirenssong.cancel=你必须选择一个目标。
items.scrolls.exotic.scrollofsirenssong.desc=阅读此卷轴将播放出摄人心魄的音律，令目标敌人沉沦于你，永久地变成盟友！听到这歌声的其它敌人则是暂时被魅惑。\n\n特别强大的敌人可以抵抗沉沦效果，但同样会被魅惑。
items.scrolls.exotic.scrollofsirenssong$enthralled.name=沉沦
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=这个生物已因魅音秘卷的效果而沉沦。\n\n沉沦的单位将永远忠心于你，并主动攻击其遇到的所有敌人。

items.scrolls.exotic.scrollofantimagic.name=驱魔秘卷
items.scrolls.exotic.scrollofantimagic.desc=使用这张秘卷会让你被包裹在一个能够屏蔽所有魔法效果的魔力结界中，无论它是有利或是有害。屏蔽效果包括大多数魔法物品效果，例如法杖、卷轴、戒指、神器、附魔与诅咒。特别地，英雄护甲技能足够强大，因而能够不受该秘卷的限制。

items.scrolls.exotic.scrollofchallenge.name=决斗秘卷
items.scrolls.exotic.scrollofchallenge.desc=大声诵读此卷轴时，它将发出巨大的吼声，将敌人吸引到诵读者身边，同时在它们周围创建一个小型的竞技场。\n\n只要使用者在这个竞技场里，就将获得33%的伤害减免(在其它所有伤害减免计算之前)，并且不会损失饱食度。\n\n竞技场的大小将随着诵读者所在区域的大小而改变。在一些Boss战区域，竞技场会格外的小。
items.scrolls.exotic.scrollofchallenge$challengearena.name=决斗区域
items.scrolls.exotic.scrollofchallenge$challengearena.desc=一个由魔力构筑的竞技场在你周围浮现，其中翻腾着一阵猩红血雾。\n\n当你站在雾中时，饥饿值不会增加，并且受到的任何伤害都会减少33%%。如果你有任何其他减伤手段(例如护甲)，它们都会在33%%伤害减免之后生效。\n\n剩余回合数：%d回合

items.scrolls.exotic.scrollofdivination.name=预知秘卷
items.scrolls.exotic.scrollofdivination.nothing_left=没有可以鉴定的道具了！
items.scrolls.exotic.scrollofdivination.desc=这张秘卷会随机鉴定四种你尚未明确的道具。它可能帮你鉴定出某药剂的颜色，某卷轴的符文，或是某戒指的宝石。不过被鉴定的道具未必是你包裹中有的。
items.scrolls.exotic.scrollofdivination$wnddivination.desc=你的预知秘卷鉴定了下列道具：

items.scrolls.exotic.scrollofdread.name=梦魇秘卷
items.scrolls.exotic.scrollofdread.desc=诵读的时候，梦魇秘卷会爆射出一道极度可怖的红色闪光，其中的杀气仿佛已经凝成实体。这足以令你视野中所有的敌人吓得魂飞魄散，不顾一切地想要逃离这座地牢，永远也不回来了！\n\n与恐惧效果一样，逃命的敌人也会随着时间流逝逐渐冷静下来，来自外界的伤害更能加速这一过程。\n\n意志坚定的敌人，比如Boss们，将能抵抗逃命的冲动，但仍会感到恐惧。

items.scrolls.exotic.scrollofenchantment.name=注魔秘卷
items.scrolls.exotic.scrollofenchantment.inv_title=附魔一件物品
items.scrolls.exotic.scrollofenchantment.weapon=为你的武器选择附魔。
items.scrolls.exotic.scrollofenchantment.armor=为你的防具选择刻印。
items.scrolls.exotic.scrollofenchantment.cancel=取消
items.scrolls.exotic.scrollofenchantment.cancel_warn=取消该行动仍然会消耗你的注魔秘卷，你确定吗？
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=是的，我确定
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=不，我改主意了
items.scrolls.exotic.scrollofenchantment.desc=这张秘卷可以为武器或护甲注入强大的魔力。使用者甚至可以在一定程度上选择注入哪种魔力。

items.scrolls.exotic.scrollofforesight.name=先见秘卷
items.scrolls.exotic.scrollofforesight.desc=在阅读了这幅卷轴后，附近地形的细节将自发不断地映入阅读者的脑海。这种效果会持续相当长的一段时间，并且会揭示所有的隐藏门与陷阱，不再需要主动搜索。

items.scrolls.exotic.scrollofmetamorphosis.name=蜕变秘卷
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=选择一个天赋以进行蜕变
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=选择你希望蜕变出的天赋
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=取消该行动仍然会消耗你的蜕变秘卷，你确定吗？
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=蜕变天赋
items.scrolls.exotic.scrollofmetamorphosis.desc=这张秘卷充满了嬗变的魔力，不过与一般的嬗变卷轴不同。这股魔力将作用于释放者本身而不是一个物品。秘卷的魔力将允许你蜕变一个自身的天赋，使其转化为来自其他英雄的五个同层天赋之一！\n\n这个效果只适用于英雄自身的天赋，对专精天赋与护甲天赋无效。那些你无法使用的天赋将不会出现在蜕变选项里。

items.scrolls.exotic.scrollofmysticalenergy.name=魔能秘卷
items.scrolls.exotic.scrollofmysticalenergy.desc=奇异的魔法能量被禁锢在秘卷羊皮纸内，当这股能量被释放时会在短时间内持续为阅读者的所有神器充能。

items.scrolls.exotic.scrollofpassage.name=归返秘卷
items.scrolls.exotic.scrollofpassage.desc=这张羊皮纸上的咒语能瞬间将读者传送到楼上与之距离最近的区域首层。想去商店的话，用这张秘卷会非常方便。

items.scrolls.exotic.scrollofprismaticimage.name=虹卫秘卷
items.scrolls.exotic.scrollofprismaticimage.desc=这张秘卷上的咒文会创造使用者的一个虹光守卫。这个像使用者的弱化版克隆体的幻像有着相同的防御，但生命值和造成的伤害更低。\n\n虹光守卫将吸引敌人的火力从而保护使用者。\n\n当虹光守卫存在时阅读这张秘卷将会为其恢复所有生命。

items.scrolls.exotic.scrollofpsionicblast.name=灵爆秘卷
items.scrolls.exotic.scrollofpsionicblast.ondeath=灵能震爆撕碎了你的意识...
items.scrolls.exotic.scrollofpsionicblast.desc=这张秘卷封存着惊人的毁灭性能量，一旦被释放出来可摧毁视野内所有生物的心智。\n\n然而，使用者也会遭受灵爆的严重反噬，使其身受重创，双目失明，力量虚弱。灵爆秘卷击中的目标越多，其对使用者造成的伤害越低。



###spells
items.spells.alchemize.name=炼金菱晶
items.spells.alchemize.prompt=炼化一个物品
items.spells.alchemize.desc=这个菱晶包含的转化能力与炼金釜类似。允许使用者将一件物品(或一堆物品)转化为金币或炼金能量。将药剂、卷轴炼化为能量甚至可以鉴定它们！\n\n你可以在商店中中买到少许炼金菱晶，但也可以通过炼金术用种子、符石与少量炼金能量合成更多的炼金菱晶。
items.spells.alchemize$wndalchemizeitem.sell=转化为%d个金币
items.spells.alchemize$wndalchemizeitem.sell_1=转化一个为%d个金币
items.spells.alchemize$wndalchemizeitem.sell_all=转化全部为%d个金币
items.spells.alchemize$wndalchemizeitem.energize=转化为%d点能量
items.spells.alchemize$wndalchemizeitem.energize_1=转化一个为%d点能量
items.spells.alchemize$wndalchemizeitem.energize_all=转化全部为%d点能量

items.spells.beaconofreturning.name=返回晶柱
items.spells.beaconofreturning.preventing=这里强大的魔力流阻止了你的晶柱效果！
items.spells.beaconofreturning.creatures=临近生物的心灵信号干扰不允许你在此刻进行传送。
items.spells.beaconofreturning.set=信标设置在了你现在的位置。
items.spells.beaconofreturning.wnd_body=新的设置会覆盖原来的信标设置的位置。\n\n返回将会让你回到上一个设置的位置并且消耗一个菱晶。
items.spells.beaconofreturning.wnd_set=设置
items.spells.beaconofreturning.wnd_return=返回
items.spells.beaconofreturning.desc_set=信标被设置在了第%d层的某处
items.spells.beaconofreturning.desc=这个复杂的晶柱给予了使用者无视距离返回到设定地点的能力。该晶柱只会在返回时消耗。你可以随时改变它的设定位置，但该晶柱只能记忆最近一次设置的位置。

items.spells.curseinfusion.name=诅咒菱晶
items.spells.curseinfusion.inv_title=诅咒一件物品
items.spells.curseinfusion.desc=这个菱晶可以向一件装备注入和DM-300内部相同的的邪恶魔法。目标物品会立刻被诅咒，且原有的附魔与刻印会被覆盖。\n\n对武器、护甲和法杖使用时，诅咒菱晶在诅咒的基础上还会升级目标物品。诅咒菱晶造成的升级不会叠加，而且去除诅咒后升级也随之消失。\n\n对武器护甲的重复诅咒可以更换其上的诅咒种类。

items.spells.spell.ac_cast=施放
items.spells.spell.no_magic=你无法在魔法免疫的情况下使用法术结晶。
items.spells.spell.discover_hint=你可通过炼金合成该物品。

items.spells.magicalinfusion.name=注魔菱晶
items.spells.magicalinfusion.inv_title=灌注一件物品
items.spells.magicalinfusion.infuse=你的物品充满了奥术能量！
items.spells.magicalinfusion.desc=这个菱晶蕴含着和升级卷轴同样强大的魔力，不过这种魔力更为稳定。\n\n这个菱晶在升级物品的同时不会消除上面的附魔、刻印或诅咒。

items.spells.magicalporter.name=信使结晶
items.spells.magicalporter.inv_title=传送一个物品
items.spells.magicalporter.nowhere=没有传送物品的目标地点。
items.spells.magicalporter.desc=这个结晶能够通过魔法传送任何成为施法目标的物品。但不同于商人信标，这些物品会被传送到下一个boss层的入口处。

items.spells.phaseshift.name=转移结晶
items.spells.phaseshift.no_target=那里没什么可传送的东西。
items.spells.phaseshift.desc=这个充满混沌能量的结晶会将目标单位传送到本层随机位置。被传送的角色会被麻痹相当长的一段时间，而足够强大的敌人则可抵抗该效果。这个结晶可以对目标单位或施法者自身使用。

items.spells.reclaimtrap.name=陷阱晶柱
items.spells.reclaimtrap.no_trap=这里没有陷阱。
items.spells.reclaimtrap.desc_trap=施放晶柱将在目标位置产生一次_%s_的效果。
items.spells.reclaimtrap.desc=这个晶柱蕴含着DM-300残余的机械能量。当对一个未触发的陷阱使用时，陷阱的力量会附着在你身上，使你能再次使用晶柱以释放这股力量并在你指定的任何位置触发此陷阱的效果。\n\n不过，有的陷阱并不能在任何位置都生效，而且晶柱一次只能储存一个陷阱。

items.spells.recycle.name=转换菱晶
items.spells.recycle.inv_title=转换一件物品
items.spells.recycle.recycled=你的物品被转换为%s。
items.spells.recycle.desc=这个菱晶蕴含着弱化的嬗变魔力。虽然不能对装备使用，但它能将卷轴、药剂、种子、符石或涂药飞镖转换为一个随机的同类物品。

items.spells.summonelemental.name=唤魔晶柱
items.spells.summonelemental.ac_imbue=灌注
items.spells.summonelemental.imbue_prompt=灌注一件物品
items.spells.summonelemental.desc=这个晶柱联系着用于制造它的元素余烬的能量，能够召唤出一个友好的元素助你战斗！同一时间只能召唤一个元素，但是重新释放该元素不需要消耗额外能量。
items.spells.summonelemental.desc_newborn=这个晶柱尚未被灌注，只能召唤一个不会远程攻击的_新生元素_。你可以用已鉴定的液火药剂、冰霜药剂、充能卷轴或嬗变卷轴为其充能，使其之后召唤出的都是完全体元素！
items.spells.summonelemental.desc_fire=这个晶柱触感灼热，可用来召唤出一个_火焰元素_。你可以通过灌注的方法覆盖当前的充能类型。
items.spells.summonelemental.desc_frost=这个晶柱触感冰冷，可用来召唤出一个_冰霜元素_。你可以通过灌注的方法覆盖当前的充能类型。
items.spells.summonelemental.desc_shock=这个晶柱散发着静电能量，可用来召唤出一个_电光元素_。你可以通过灌注的方法覆盖当前的充能类型。
items.spells.summonelemental.desc_chaos=这个晶柱散发着混沌能量，可用来召唤出一个_混沌元素_。你可以通过灌注的方法覆盖当前的充能类型。

items.spells.targetedspell.prompt=选择一个目标
items.spells.targetedspell.inv_title=灌注一件物品

items.spells.telekineticgrab.name=念力结晶
items.spells.telekineticgrab.cant_grab=你无法抓取它。
items.spells.telekineticgrab.no_target=这里没什么可抓取的东西。
items.spells.telekineticgrab.desc=这个结晶允许使用者远程抓取一格所有的物体，或从敌人身上取回卡住的投掷武器！\n\n结晶无法用于抓取其他角色拥有的物品，也无法抓取诸如箱子这般的容器。

items.spells.unstablespell.name=无序结晶
items.spells.unstablespell.desc=这块黑色方形小水晶的每个面都浮动着变幻莫测的符文。\n\n激活时，它将随机触发一种卷轴效果，若视野内存在敌人，则必定触发战斗类卷轴效果，反之则必定触发非战斗类卷轴效果。

items.spells.wildenergy.name=强能结晶
items.spells.wildenergy.desc=这个结晶中含有部分驱动DM-300的诅咒之力。当施放时，它会为你的法杖与佩戴着的神器充能，但同时也会随机触发一种诅咒法杖效果。幸运的是你可以指定这种诅咒魔法的施放方向。


###runestones
items.stones.inventorystone.ac_use=使用

items.stones.runestone$placeholder.name=符石
items.stones.runestone.discover_hint=你可在地牢中概率找到该物品，或通过炼金合成该物品。

items.stones.stoneofaggression.name=敌意符石
items.stones.stoneofaggression.desc=当把这颗符石丢向一个盟友或敌人时，附近所有敌人都会在短时间内优先攻击该单位。\n\n敌意符石无法直接以boss为目标，但可对其随从正常发挥效果。
items.stones.stoneofaggression$aggression.name=众矢之的
items.stones.stoneofaggression$aggression.desc=支配魔法正使附近所有敌人优先攻击该单位。\n\n剩余回合数：%s

items.stones.stoneofaugmentation.name=强化符石
items.stones.stoneofaugmentation.inv_title=强化一件物品
items.stones.stoneofaugmentation.desc=这颗符石内的强力魔法可以用于强化装备的一种属性，代价是会减弱另一种属性。\n\n用于武器可以强化伤害或者速度。投掷武器的耐久度也会随着速度的增减而增减。\n\n用于护甲可以强化防御或者闪避。
items.stones.stoneofaugmentation.discover_hint=你可在商店中中购买该物品，或通过炼金合成该物品。
items.stones.stoneofaugmentation$wndaugment.choice=强化一项属性也会弱化另一项属性。你想强化哪个属性？
items.stones.stoneofaugmentation$wndaugment.already=这个物品已经被强化过了，你可以调换被强化的属性，或是直接移除强化。
items.stones.stoneofaugmentation$wndaugment.speed=攻速上升 伤害下降
items.stones.stoneofaugmentation$wndaugment.damage=伤害上升 攻速下降
items.stones.stoneofaugmentation$wndaugment.evasion=闪避上升 防御下降
items.stones.stoneofaugmentation$wndaugment.defense=防御上升 闪避下降
items.stones.stoneofaugmentation$wndaugment.none=移除强化
items.stones.stoneofaugmentation$wndaugment.cancel=算了

items.stones.stoneofblast.name=震爆符石
items.stones.stoneofblast.desc=这颗符石被扔出后会在目的地立即爆炸。和炸弹一样，爆炸会对范围内的所有东西造成伤害。

items.stones.stoneofblink.name=闪现符石
items.stones.stoneofblink.desc=这颗符石被扔出后会把使用者传送到目的地。

items.stones.stoneofclairvoyance.name=明示符石
items.stones.stoneofclairvoyance.desc=这颗符石被扔出后会瞬间搜索以目的地为中心的巨大范围内的所有地格。该搜索能力甚至不受墙壁的阻隔。

items.stones.stoneofdeepsleep.name=沉睡符石
items.stones.stoneofdeepsleep.desc=当把这颗符石掷向一个敌人时，被命中的敌人会陷入魔法睡眠。陷入魔法睡眠的敌人会永远沉睡下去，除非受到外界打扰。

items.stones.stoneofdetectmagic.name=探魔符石
items.stones.stoneofdetectmagic.inv_title=探测一件物品
items.stones.stoneofdetectmagic.detected_none=你探测出这件物品并不附有任何魔咒。
items.stones.stoneofdetectmagic.detected_both=你探测出这件物品附有附魔/升级与诅咒！
items.stones.stoneofdetectmagic.detected_good=你探测出这件物品附有附魔/升级！
items.stones.stoneofdetectmagic.detected_bad=你探测出这件物品附有诅咒！
items.stones.stoneofdetectmagic.desc=这颗符石能够侦测物品上的魔咒。对一件未鉴定物品使用此符石，可探测其是否附有诅咒，以及是否具有附魔或升级。

items.stones.stoneofdisarming.name=拆除符石
items.stones.stoneofdisarming.desc=这颗符石具有破坏隐藏于地牢各处的有害陷阱的魔力。它的魔力最多能拆除以投掷目的地为中心的一片区域内的9个陷阱。

items.stones.stoneofenchantment.name=附魔符石
items.stones.stoneofenchantment.inv_title=附魔一件物品
items.stones.stoneofenchantment.weapon=你的武器在暗中微微发光！
items.stones.stoneofenchantment.armor=你的护甲在暗中微微发光！
items.stones.stoneofenchantment.desc=这颗符石拥有施加附魔的能力。和升级卷轴不同，它不会直接加强一个道具的能力，但能给武器或者护甲施加附魔，使其拥有新的特性。

items.stones.stoneoffear.name=恐惧符石
items.stones.stoneoffear.desc=当把这颗符石掷向一个盟友或敌人时，被命中的角色会陷入深深的恐惧中，无法克制地逃离。攻击会刺激其从恐惧中更快恢复。

items.stones.stoneofflock.name=羊群符石
items.stones.stoneofflock.desc=这颗符石被扔出后会在目的地召唤一群魔法绵羊。

items.stones.stoneofintuition.name=感知符石
items.stones.stoneofintuition.inv_title=选择一件物品
items.stones.stoneofintuition.desc=这块符石含有的魔法就像一个弱化版的鉴定卷轴。和鉴定卷轴那种直接识别物品的魔法不一样，它会加强你的直觉，让你通过猜测来试图鉴定一种药水、卷轴或者戒指的种类。
items.stones.stoneofintuition.break_info=你可以在其粉碎前使用两次感知符石，_你的下次使用不会消耗符石_。
items.stones.stoneofintuition.break_warn=你之前已经使用了一次感知符石，所以_你的下次使用将会消耗符石_。
items.stones.stoneofintuition$wndguess.text=猜猜这件未鉴定道具是什么。猜对了的话就会鉴定物品种类！
items.stones.stoneofintuition$wndguess.correct=猜测正确，此类物品已被鉴定！
items.stones.stoneofintuition$wndguess.incorrect=你猜错了。
items.stones.stoneofintuition$wndguess.break=你的感知符石化为了尘土...

items.stones.stoneofshock.name=电击符石
items.stones.stoneofshock.desc=这颗符石被扔出后会爆出一阵电能量，短暂麻痹范围内所有目标并根据电到的目标数量恢复使用者的法杖充能。


###trinkets
items.trinkets.chaoticcenser.name=混沌香炉
items.trinkets.chaoticcenser.spew=你的香炉将要喷出：%s。
items.trinkets.chaoticcenser.desc=在炼金釜内炼制一段时间后，这只香炉竟开始自行生烟！这些气体会在炉内不断积聚，并间歇性随机地向敌人喷去。香炉似乎能产生各类气体，但在气体释放前你会得到片刻的预警。
items.trinkets.chaoticcenser.typical_stats_desc=这件饰物通常会每经_%d_±回合在敌人附近生成一团有害气体。气体只会在敌人存在时生成。饰物的等级越高，稀有而强力的气体生成的可能性越高。
items.trinkets.chaoticcenser.stats_desc=在当前等级下，这件饰物会每经_%d_±回合在敌人附近生成一团有害气体。气体只会在敌人存在时生成。饰物的等级越高，稀有而强力的气体生成的可能性越高。

items.trinkets.crackedspyglass.name=幻象裂镜
items.trinkets.crackedspyglass.desc=若是其前镜头完好无损，则这柄手持式望远镜可称得上一件能工巧匠的伟大之作了。望远镜似乎在为你揭示地牢中的新物品，但由于其本身的缺陷，这些被揭示的物品并不容易被看清。
items.trinkets.crackedspyglass.typical_stats_desc=这件饰物通常会有_%1$s%%_的概率在除Boss层以外的每层额外生成一件隐藏物品。
items.trinkets.crackedspyglass.stats_desc=在当前等级下，这件饰物会有_%1$s%%_的概率在除Boss层以外的每层额外生成一件隐藏物品。
items.trinkets.crackedspyglass.stats_desc_upgraded=在当前等级下，这件饰物会有_100%%_的概率在除Boss层以外的每层额外生成一件隐藏物品，并有_%1$s%%_的概率再额外生成一件隐藏物品。

items.trinkets.dimensionalsundial.name=位面日晷
items.trinkets.dimensionalsundial.warning=你的日晷不再显影，这使你倍感不安。
items.trinkets.dimensionalsundial.desc=不知为何，这块小型手持式日晷能在地牢深处显影，甚至你不将其摆正也是如此。更奇怪的是，晷影的方位似乎与这个世界的太阳无关。当晷影不再显现时，日晷似乎会招致危险。
items.trinkets.dimensionalsundial.typical_stats_desc=这件饰物通常会在昼间(8:00~20:00)降低_%1$d%%_的敌人生成速率并在夜间(20:00~8:00)提升_%2$d%%_的敌人生成速率。
items.trinkets.dimensionalsundial.stats_desc=在当前等级下，这件饰物会在昼间(8:00~20:00)降低_%1$d%%_的敌人生成速率并在夜间(20:00~8:00)提升_%2$d%%_的敌人生成速率。

items.trinkets.exoticcrystals.name=奇异能晶
items.trinkets.exoticcrystals.desc=这些小型粉色晶体有着和炼金能量晶体一样的几何外形。尽管它们不能直接为炼金实验供能，但不知为何似乎能影响你找到的药剂和卷轴。
items.trinkets.exoticcrystals.typical_stats_desc=这件饰物通常会使_%s%%_的药剂、卷轴转化为其对应的合剂、秘卷。转化不会影响力量药剂，升级卷轴与为解决特殊房间提供帮助而生成的物品。
items.trinkets.exoticcrystals.stats_desc=在当前等级下，这件饰物会使_%s%%_的药剂、卷轴转化为其对应的合剂、秘卷。转化不会影响力量药剂，升级卷轴与为解决特殊房间提供帮助而生成的物品。

items.trinkets.eyeofnewt.name=蝾螈魔眼
items.trinkets.eyeofnewt.desc=这颗黑金色的蝾螈之眼是一种常见的炼金原料，而现在已被附魔强化为一件饰物。魔眼似乎降低了你的视力，以为你换取其他形式的视觉。
items.trinkets.eyeofnewt.typical_stats_desc=这件饰物通常会降低你_%1$s%%_的视距，但也会使你获得对_%2$d_格范围内敌人的灵视感知。
items.trinkets.eyeofnewt.stats_desc=在当前等级下，这件饰物会降低你_%1$s%%_的视距，但也会使你获得对_%2$d_格范围内敌人的灵视感知。

items.trinkets.ferrettuft.name=雪貂绒束
items.trinkets.ferrettuft.desc=一簇银白色的雪貂丝绒，以黄绿色的蝴蝶结捆为一束。雪貂因其敏捷、顽皮与狡黠而闻名。这种力量似乎从这件饰物散发而出，加强了附近任何单位的闪避能力。
items.trinkets.ferrettuft.typical_stats_desc=这件饰物通常会提升所有单位_%1$s%%_的闪避。
items.trinkets.ferrettuft.stats_desc=在当前等级下，这件饰物会提升所有单位 _%1$s%%_的闪避。

items.trinkets.mimictooth.name=拟箱利齿
items.trinkets.mimictooth.desc=这颗大尖牙肯定是强行从某个非常倒霉的宝箱怪口中拔下来的。它似乎能影响地牢中的宝箱怪，使它们更常见，也更危险。
items.trinkets.mimictooth.typical_stats_desc=这件饰物通常会使所有类型的宝箱怪的出现频率变为原频率的_%1$s倍_，并使宝箱怪更难以识别，而其掉落的战利品也会更加丰厚。此外，每层地牢还会有_%2$s%%_的概率额外带有一个隐藏的黑檀宝箱怪。
items.trinkets.mimictooth.stats_desc=在当前等级下，这件饰物会使所有类型的宝箱怪的出现频率变为原频率的_%1$s倍_，并使宝箱怪更难以识别，而其掉落的战利品也会更加丰厚。此外，每层地牢还会有_%2$s%%_的概率额外带有一个隐藏的黑檀宝箱怪。

items.trinkets.mossyclump.name=苔藓丛簇
items.trinkets.mossyclump.desc=无论你如何用力挤压它，这团潮湿的苔藓似乎都能保持其水分。它似乎通过魔法与地牢本身形成链接，促使草木流水频繁出现。
items.trinkets.mossyclump.typical_stats_desc=这件饰物通常会使_%d%%_的无氛围楼层获得流水或草木氛围。\n\n这件饰物升级所消耗的炼金能量较多。
items.trinkets.mossyclump.stats_desc=在当前等级下，这件饰物会使_%d%%_的无氛围楼层获得流水或草木氛围。\n\n这件饰物升级所消耗的炼金能量较多。

items.trinkets.parchmentscrap.name=残魔余卷
items.trinkets.parchmentscrap.desc=这块小小的羊皮纸残片看起来来自一张卷轴。它仍附有一丝残存的魔力，并且似乎能影响在地牢中找到的武器和护甲。
items.trinkets.parchmentscrap.typical_stats_desc=这件饰物通常会使附魔与刻印的出现频率变为原频率的_%d倍_，而武器与护甲的诅咒的出现频率变为原频率的_%s倍_。法杖、戒指与神器的诅咒不受影响。\n\n这件饰物升级所消耗的炼金能量较多。
items.trinkets.parchmentscrap.stats_desc=在当前等级下，这件饰物会使附魔与刻印的出现频率变为原频率的_%d倍_，而武器与护甲的诅咒的出现频率变为原频率的_%s倍_。法杖、戒指与神器的诅咒不受影响。\n\n这件饰物升级所消耗的炼金能量较多。

items.trinkets.petrifiedseed.name=石化种子
items.trinkets.petrifiedseed.desc=这粒种子在缓慢的地质作用或法术作用的影响下石化了。它似乎通过魔法影响着地牢的植物群系，时不时使种子转化为符石。
items.trinkets.petrifiedseed.typical_stats_desc=这件饰物通常会有_%1$s%%_的概率使被践踏的高草掉落符石而非种子，还会使高草掉落物品的概率提升_%2$s%%_。
items.trinkets.petrifiedseed.stats_desc=在当前等级下，这件饰物会有_%1$s%%_的概率使被践踏的高草掉落符石而非种子，还会使高草掉落物品的概率提升_%2$s%%_。

items.trinkets.ratskull.name=巨鼠头骨
items.trinkets.ratskull.desc=这件可怕的饰物并不比正常老鼠的头骨大多少，但不知为何在这个地牢却很稀有。头骨的魔力似乎能吸引更多稀有的地牢住民，使它们更有可能出现。
items.trinkets.ratskull.typical_stats_desc=这件饰物通常会使稀有敌人的出现频率变为原频率的_%d倍_。然而，头骨对水晶宝箱怪与装甲石像效果减半。
items.trinkets.ratskull.stats_desc=在当前等级下，这件饰物会使稀有敌人的出现频率变为原频率的_%d倍_。然而，头骨对水晶宝箱怪与装甲石像效果减半。

items.trinkets.saltcube.name=盐晶立方
items.trinkets.saltcube.desc=这块巨大的盐晶被切割成近乎完美的立方体，而不知为何盐晶成功吸收了炼金釜中一半的水分而非溶解于其中。它似乎通过魔法脱水并保存了你所吃的食物，延长了你所得的饱腹感，但也减少了你不空腹时的生命回复。
items.trinkets.saltcube.typical_stats_desc=这件饰物通常会增加你_%1$s%%_的饥饿所需时间，但也会降低你_%2$s%%_的生命回复速率，若楼层已被封锁则上述效果无效。
items.trinkets.saltcube.stats_desc=在当前等级下，这件饰物会增加你_%1$s%%_的饥饿所需时间，但也会降低你_%2$s%%_的生命回复速率，若楼层已被封锁则上述效果无效。

items.trinkets.shardofoblivion.name=遗忘碎片
items.trinkets.shardofoblivion.desc=经过炼金釜的烹煮，这一小块邪能碎片已经化为了...一片虚空？光线似乎在碎片边缘发生了弯曲，而只要你不握住它，它就会悬停在原地。碎片似乎通过魔法从你的无知中获得力量，所以对此最好不要想太多。
items.trinkets.shardofoblivion.typical_stats_desc=这件饰物通常会使你每装备或使用一件未鉴定装备就提升20%%敌人掉落战利品的概率，效益上限为_%d_件未鉴定装备。碎片还会阻止你自动鉴定装备，但能用于手动鉴定已就绪的物品。
items.trinkets.shardofoblivion.stats_desc=在当前等级下，这件饰物会使你每装备或使用一件未鉴定装备就提升20%%敌人掉落战利品的概率，效益上限为_%d_件未鉴定装备。碎片还会阻止你自动鉴定装备，但能用于手动鉴定已就绪的物品。
items.trinkets.shardofoblivion.ac_identify=鉴定
items.trinkets.shardofoblivion.identify_prompt=鉴定一件物品
items.trinkets.shardofoblivion.identify_ready=一件物品的鉴定已就绪：%s。可使用遗忘碎片将其鉴定。
items.trinkets.shardofoblivion.identify_ready_worn=你所装备的物品的鉴定已就绪。可使用遗忘碎片将其鉴定。
items.trinkets.shardofoblivion.identify_not_yet=这个物品的鉴定尚未就绪。
items.trinkets.shardofoblivion.identify=你鉴定了这个物品！
items.trinkets.shardofoblivion$wandusetracker.name=已使用未鉴定法杖
items.trinkets.shardofoblivion$wandusetracker.desc=你近期已使用一根未鉴定法杖，短期内遗忘碎片将其视为一件已使用的未鉴定装备。\n\n剩余回合数：%s
items.trinkets.shardofoblivion$thrownusetracker.name=已使用未鉴定投武
items.trinkets.shardofoblivion$thrownusetracker.desc=你近期已使用一件未鉴定投掷武器，短期内遗忘碎片将其视为一件已使用的未鉴定装备。\n\n剩余回合数：%s

items.trinkets.thirteenleafclover.name=十三叶草
items.trinkets.thirteenleafclover.desc=不知为何，在炼金釜中烹煮竟让这株三叶草长出了许多额外的叶子！目前尚不清楚这件饰物会带来好运还是厄运，或许它会让你的运气变得更加混沌无常？
items.trinkets.thirteenleafclover.typical_stats_desc=这件饰物通常会使你有_%1$d%%_的概率造成最大伤害，而有_%2$d%%_的概率造成最小伤害。
items.trinkets.thirteenleafclover.stats_desc=在当前等级下，这件饰物会使你有_%1$d%%_的概率造成最大伤害，而有_%2$d%%_的概率造成最小伤害。

items.trinkets.trapmechanism.name=陷阱元件
items.trinkets.trapmechanism.desc=地牢中某个塌方陷阱的核心元件，被小心地从地面中挖掘而出以便携带。它似乎通过魔法与地牢本身形成链接，促使险恶地形频繁出现，并增强了你对陷阱的探查能力。
items.trinkets.trapmechanism.typical_stats_desc=这件饰物通常会使_%1$d%%_的无氛围楼层获得陷阱或深渊氛围。此外，地牢中_%2$d%%_的隐藏陷阱会变得可见。
items.trinkets.trapmechanism.stats_desc=在当前等级下，这件饰物会使_%1$d%%_的无氛围楼层获得陷阱或深渊氛围。此外，地牢中_%2$d%%_的隐藏陷阱会变得可见。

items.trinkets.vialofblood.name=凝血试管
items.trinkets.vialofblood.desc=这根细长的试管内装有一些地牢住民的血液，当你转动试管时其中的血液也会随之缓慢流动。它似乎通过魔法使治疗更为强效，但也更为缓效。
items.trinkets.vialofblood.typical_stats_desc=这件饰物通常会提升你从治疗药剂、水袋或生命之泉获得的治疗总量_%1$s%%_。但治疗速度也会更为迟滞，每回合最多回复_%2$s点_生命值(此数值会随着英雄等级的提升而提升)。
items.trinkets.vialofblood.stats_desc=在当前等级下，这件饰物会提升你从治疗药剂、水袋或生命之泉获得的治疗总量_%1$s%%_。但治疗速度也会更为迟滞，每回合最多回复_%2$s点_生命值(此数值会随着英雄等级的提升而提升)。

items.trinkets.wondrousresin.name=奇迹树脂
items.trinkets.wondrousresin.desc=这团泛着微光的蓝色树脂看起来附有某根诅咒法杖魔法的纯化精华。炼金釜中的魔力似乎在一定程度上稳定了树脂的诅咒魔法，而这种魔法现在正影响着你的法杖。
items.trinkets.wondrousresin.typical_stats_desc=这件饰物通常会有_%1$s%%_的概率迫使诅咒法杖效果变得无害或有益，还会有_%2$s%%_的概率使无诅咒的法杖施放一次额外的无害或有益的诅咒法杖效果。\n\n这件饰物升级所消耗的炼金能量较多。
items.trinkets.wondrousresin.stats_desc=在当前等级下，这件饰物会有_%1$s%%_的概率迫使诅咒法杖效果变得无害或有益，还会有_%2$s%%_的概率使无诅咒的法杖施放一次额外的无害或有益的诅咒法杖效果。\n\n这件饰物升级所消耗的炼金能量较多。

items.trinkets.trinketcatalyst.name=魔能触媒
items.trinkets.trinketcatalyst.window_title=制作一件饰物
items.trinkets.trinketcatalyst.window_text=随着魔能触媒的置入，釜中的水逐渐泛起微光。你可以就近选择一件物品，注入炼金能量并将其炼成一件魔法饰物。
items.trinkets.trinketcatalyst.desc=这团泛着微光的金色粉尘在暗无边际的地牢中熠熠生辉。魔能触媒可被置入炼金釜中，结合少许炼金能量制成一件独特饰物。\n\n饰物提供各种小幅改变地牢环境或其住民的效果。通过消耗更多炼金能量升级饰物可以进一步增幅对应效果，丢掉饰物也可以完全摆脱其施加的影响。
items.trinkets.trinketcatalyst$randomtrinket.name=随机饰物
items.trinkets.trinketcatalyst$randomtrinket.desc=就近的一件物品被塞进了一个你打不开的包裹内。\n\n炼金反应可以将包裹溶解，但是在得到饰物之前你可没法确定它到底是什么。

items.trinkets.trinket.discover_hint=该物品在你通过炼金合成饰物时有概率作为选项。
items.trinkets.trinket$placeholder.name=饰物

###wands
items.wands.cursedwand.ondeath=你死于自己的%s。
items.wands.cursedwand.nothing=什么事都没发生。
items.wands.cursedwand.mass_invuln=明耀的光芒从你的法杖迸射而出！
items.wands.cursedwand.petrify=你突然被定在了原地！
items.wands.cursedwand.grass=草木在你周围疯长而出！
items.wands.cursedwand.fire=你闻到了烧烤的味道...
items.wands.cursedwand.transmogrify_wand=你的法杖变化成了另一样东西！
items.wands.cursedwand.transmogrify_other=你的道具变化成了另一样东西！
items.wands.cursedwand.disguise=你的外貌在你眼前发生了变化！
items.wands.cursedwand.supernova=一颗灼热的能量球开始膨胀。情况不妙，走为上计！
items.wands.cursedwand.supernova_positive=一颗灼热的能量球开始膨胀，但不知何故它似乎很安全。
items.wands.cursedwand.sinkhole=你周围的地板在迅速崩塌！
items.wands.cursedwand.sinkhole_positive=地板在迅速崩塌，但你感觉脚下足够结实。
items.wands.cursedwand.gravity=重力突然开始向随机方向牵引！
items.wands.cursedwand.gravity_positive=重力突然开始向随机方向牵引，但这对你没有影响。
items.wands.cursedwand.gravity_end=重力混乱结束了。

items.wands.damagewand.upgrade_stat_name_1=魔法伤害

items.wands.wand.ac_zap=释放
items.wands.wand.fizzles=你的法杖滋滋作响；一定是没能量了。
items.wands.wand.no_magic=你的法杖滋滋作响；你不能在魔法免疫时使用法杖。
items.wands.wand.self_target=你不能瞄准你自己！
items.wands.wand.identify=你对你的法杖已经足够熟悉并将其完全鉴定。
items.wands.wand.resin_one=这根法杖已经从奥术树脂获得了_1_次升级。
items.wands.wand.resin_many=这根法杖已经从奥术树脂获得了_%d_次升级。
items.wands.wand.cursed=这根法杖受到了诅咒，导致它的魔法混乱而随机。
items.wands.wand.not_cursed=这根法杖没有被诅咒。
items.wands.wand.curse_discover=这根%s是诅咒的！
items.wands.wand.prompt=选择要释放魔法的位置
items.wands.wand$placeholder.name=法杖

items.wands.wandofblastwave.name=冲击波法杖
items.wands.wandofblastwave.staff_name=冲击波魔杖
items.wands.wandofblastwave.ondeath=你用冲击波法杖炸碎了自己...
items.wands.wandofblastwave.knockback_ondeath=你死于撞击...
items.wands.wandofblastwave.desc=这根法杖由一种大理石石材制成，嵌有金饰并在顶部镶着一个浑圆的黑宝石。它在你手中的感觉非常沉重。
items.wands.wandofblastwave.typical_stats_desc=这根法杖能射出在目标地点剧烈爆炸的魔法飞弹。爆炸的威力通常会造成_%1$d~%2$d点伤害_，并强到足以炸飞大多数敌人。
items.wands.wandofblastwave.stats_desc=这根法杖能射出一股能量，在目标位置引发强烈的爆炸。爆炸的力量会造成_%1$d~%2$d点伤害_并强到足以击飞大多数敌人。
items.wands.wandofblastwave.upgrade_stat_name_2=击退
items.wands.wandofblastwave.bmage_desc=当_战斗法师_以冲击波魔杖近战攻击已经被麻痹的目标时，将消耗目标身上剩余的麻痹回合数造成大量魔法伤害。此效果对每个目标均有短暂的冷却。
items.wands.wandofblastwave.eleblast_desc=冲击波魔杖的元素风暴造成67%伤害，并将所有目标弹出影响区域。

items.wands.wandofcorrosion.name=酸蚀法杖
items.wands.wandofcorrosion.staff_name=酸蚀魔杖
items.wands.wandofcorrosion.desc=这根法杖的灰色主干顶端镶嵌着一颗明亮的橙色宝石。
items.wands.wandofcorrosion.stats_desc=这根法杖能射出一颗会在目标位置爆炸成一团腐蚀酸雾的法球。进入酸雾的任何单位都会持续受到起始为_%d点_的持续递增伤害。
items.wands.wandofcorrosion.upgrade_stat_name_1=酸蚀伤害
items.wands.wandofcorrosion.upgrade_stat_name_2=气体总量
items.wands.wandofcorrosion.bmage_desc=当_战斗法师_以酸蚀魔杖近战攻击目标时，有概率使其沾染腐蚀淤泥。
items.wands.wandofcorrosion.eleblast_desc=酸蚀魔杖的元素风暴对所有目标造成起始伤害为6点的4回合酸蚀。

items.wands.wandofcorruption.name=腐化法杖
items.wands.wandofcorruption.staff_name=腐化魔杖
items.wands.wandofcorruption.already_corrupted=这个角色已经被你腐化。
items.wands.wandofcorruption.desc=这根法杖能发射混乱的黑暗能量，法杖尖端的那个小头骨装饰很是应景。
items.wands.wandofcorruption.stats_desc=这根法杖会释放腐坏的能量，能削弱敌人并最终将他们扭曲为你的奴仆。敌人能抵抗腐化，但虚弱的敌人明显地更容易被腐化。
items.wands.wandofcorruption.upgrade_stat_name_1=腐化强度
items.wands.wandofcorruption.upgrade_stat_name_2=减益持续时间
items.wands.wandofcorruption.bmage_desc=当_战斗法师_以腐化魔杖近战攻击目标时，有概率使其陷入狂乱。
items.wands.wandofcorruption.eleblast_desc=腐化魔杖的元素风暴对所有目标造成5回合狂乱。

items.wands.wandofdisintegration.name=解离法杖
items.wands.wandofdisintegration.staff_name=解离魔杖
items.wands.wandofdisintegration.desc=这根_无属性_法杖由一整块光滑的黑曜石制成，深紫色的光自其边缘流向法杖顶端。它闪烁着破坏性能量，准备着向前迸射。
items.wands.wandofdisintegration.stats_desc=这根法杖射出的光束能穿透任何障碍物，并将随着法杖等级的提升而射得更远。光束会造成_%1$d~%2$d点伤害_，并且会根据穿透的地形和敌人数量造成额外伤害。
items.wands.wandofdisintegration.upgrade_stat_name_2=射程上限
items.wands.wandofdisintegration.bmage_desc=当_战斗法师_以解离魔杖作为近战武器时，魔杖会像索敌附魔一样获得额外的攻击距离。
items.wands.wandofdisintegration.eleblast_desc=解离魔杖的元素风暴无视墙壁并对所有目标造成100%的伤害。

items.wands.wandoffireblast.name=焰浪法杖
items.wands.wandoffireblast.staff_name=焰浪魔杖
items.wands.wandoffireblast.desc=这根法杖由红漆木制成，饰以金叶，这使它看起来相当庄严。它的顶端噼啪作响嘶嘶而鸣，渴望着释放其强大的魔法。
items.wands.wandoffireblast.stats_desc=这根法杖在使用时会产生一股强大的焰浪，延伸出一个锥形区域。下一次使用它将消耗_%1$d点充能_并造成_%2$d~%3$d点伤害_。法杖一次消耗的充能数越多，其范围与威力就越大、越强。
items.wands.wandoffireblast.upgrade_stat_name_1=1点充能伤害
items.wands.wandoffireblast.upgrade_stat_name_2=2点充能伤害
items.wands.wandoffireblast.upgrade_stat_name_3=3点充能伤害
items.wands.wandoffireblast.bmage_desc=当_战斗法师_以焰浪魔杖近战攻击目标时，有概率吸收所有邻近的火焰并制造出一场爆炸！与敌人相邻的火焰越多，触发该效果的概率越高。
items.wands.wandoffireblast.eleblast_desc=焰浪魔杖的元素风暴造成100%伤害，冲开范围内的门，并使目标与地形起火。

items.wands.wandoffrost.name=冰霜法杖
items.wands.wandoffrost.staff_name=冰霜魔杖
items.wands.wandoffrost.desc=这根法杖似乎由某种魔法冰块制成。它的圆顶闪着亮光。握起来很冰，但不知为何你的手仍保持着温暖。
items.wands.wandoffrost.stats_desc=这根法杖能向你的敌人射击冰霜能量，造成_%1$d~%2$d点伤害_并冻伤目标，在水中的作用似乎更强。冻伤或冻结的敌人将受到更少该法杖的伤害。
items.wands.wandoffrost.upgrade_stat_name_2=冻伤持续时间
items.wands.wandoffrost.bmage_desc=当_战斗法师_以冰霜魔杖近战攻击目标时，有概率将其直接冻结。目标冻伤越严重，被冻结的概率就越高。
items.wands.wandoffrost.eleblast_desc=冰霜魔杖的元素风暴造成100%伤害，冻结敌人并熄灭火焰。

items.wands.wandoflightning.name=雷霆法杖
items.wands.wandoflightning.staff_name=雷霆魔杖
items.wands.wandoflightning.ondeath=你用雷霆法杖害死了自己...
items.wands.wandoflightning.desc=这根_电属性_法杖由实心金属制成，这使它惊人地沉重。电弧在顶端两个内弯的叉齿间跳跃。
items.wands.wandoflightning.stats_desc=这根法杖能向目标放出强大的电弧并造成_%1$d~%2$d点伤害_。电能会在附近多个目标间跳跃并分散伤害，在水里还会变得更强。要是太接近，你自己同样可能被电到！
items.wands.wandoflightning.bmage_desc=当_战斗法师_以雷霆魔杖近战攻击目标时，有概率获得10回合起电效果。起电状态下的战斗法师免疫雷电伤害，电弧的连锁范围也更广。
items.wands.wandoflightning.eleblast_desc=雷霆魔杖的元素风暴造成100%伤害，击晕目标5回合并使水带电。
items.wands.wandoflightning$lightningcharge.name=起电
items.wands.wandoflightning$lightningcharge.desc=战斗法师现已被充能，获得了对其雷霆魔杖的伤害免疫并扩大了其电弧的连锁范围。\n\n剩余回合数：%s

items.wands.wandoflivingearth.name=灵壤法杖
items.wands.wandoflivingearth.staff_name=灵壤魔杖
items.wands.wandoflivingearth.desc=这根法杖由一种奇妙的石头组成，你能从几道微微发光的黄色条纹中感受到能量波动。握住法杖时石头好像会稍稍转动，仿佛在迎合你的手。
items.wands.wandoflivingearth.stats_desc=这根法杖能向敌人发射魔法泥石，造成_%1$d~%2$d点伤害_。泥石随后会回归使用者身边，根据造成的伤害重组成灵壤护甲。灵壤护甲积累到一定程度后，下次使用法杖时会成型为一尊灵壤守卫。
items.wands.wandoflivingearth.upgrade_stat_name_2=守卫最大生命值
items.wands.wandoflivingearth.upgrade_stat_name_3=守卫防御
items.wands.wandoflivingearth.bmage_desc=当_战斗法师_以灵壤魔杖近战攻击目标时，能将部分近战伤害转化为灵壤护甲。
items.wands.wandoflivingearth.eleblast_desc=灵壤魔杖的元素风暴造成50%伤害，每击中一个目标，治疗已激活的灵壤守卫一次。
items.wands.wandoflivingearth$rockarmor.name=灵壤护甲
items.wands.wandoflivingearth$rockarmor.desc=魔法泥石环绕在你身边，当你被攻击时泥石会尽其所能进行格挡，从而为你抵消50%%所受伤害。不过，抵消伤害会消除一定量的泥石。\n\n剩余护甲量：%1$d\n\n当积攒的泥石达到一定程度时，下一次发动灵壤法杖会使泥石成型为一尊灵壤守卫为你而战。\n\n守卫成型所需护甲量：%2$d
items.wands.wandoflivingearth$rockarmor.desc_many=该灵壤守卫已被万物一心强化。剩余回合数：%d
items.wands.wandoflivingearth$earthguardian.name=灵壤守卫
items.wands.wandoflivingearth$earthguardian.desc=灵壤法杖发射的魔法泥石组成了一尊灵壤守卫！这个有棱有角的大块头会攻击附近的敌人，迫使他们去攻击守卫。当附近没有危险时，守卫会重组为你身边的灵壤护甲，等待你下次使用法杖召唤它。
items.wands.wandoflivingearth$earthguardian.wand_info=守卫的防御力与你的法杖等级相关。它当前能抵挡_%1$d~%2$d点伤害_。
items.wands.wandoflivingearth$earthguardian.discover_hint=你可通过某根法杖遇到该单位。

items.wands.wandofmagicmissile.name=魔弹法杖
items.wands.wandofmagicmissile.staff_name=魔弹魔杖
items.wands.wandofmagicmissile.desc=这根十分普通的_无属性_法杖能发射由纯魔法能量构成的飞弹。
items.wands.wandofmagicmissile.stats_desc=从法杖中发出的魔法飞弹会造成_%1$d~%2$d点伤害_，并施加魔法易伤。
items.wands.wandofmagicmissile.bmage_desc=当_战斗法师_以魔弹魔杖近战攻击目标时，魔杖外的所有的法杖都会恢复一定的充能。
items.wands.wandofmagicmissile.eleblast_desc=魔弹魔杖的元素风暴造成50%伤害，并使法师获得15回合的法杖充能效果。
items.wands.wandofmagicmissile.discover_hint=某位英雄初始携带该物品。
items.wands.wandofmagicmissile$magiccharge.name=魔力强化
items.wands.wandofmagicmissile$magiccharge.desc=你的魔弹法杖向其他法杖回馈了一股能量，提升着下一次施法的有效等级。\n\n其他法杖被强化至：+%d\n\n剩余的魔力强化时长：%s回合

items.wands.wandofprismaticlight.name=棱光法杖
items.wands.wandofprismaticlight.staff_name=棱光魔杖
items.wands.wandofprismaticlight.desc=这根法杖由一块实心半透明水晶构成，就像一块厚长光滑的玻璃。一粒粒彩色的光点在法杖顶端跳跃，随时准备迸射而出。
items.wands.wandofprismaticlight.stats_desc=这根法杖射出的光线能刺破地牢的黑暗，揭露隐藏的区域和陷阱。光线能致盲敌人并造成_%1$d~%2$d点伤害_。恶魔与亡灵生物会在法杖的强光下被灼烧而受到额外伤害。
items.wands.wandofprismaticlight.upgrade_stat_name_2=致盲概率
items.wands.wandofprismaticlight.upgrade_stat_name_3=照明持续时间
items.wands.wandofprismaticlight.bmage_desc=当_战斗法师_以棱光魔杖近战攻击目标时，能使目标陷入随魔杖等级提升而延长的残废效果。
items.wands.wandofprismaticlight.eleblast_desc=棱光魔杖的元素风暴造成67%伤害，揭示区域内所有地形，致盲所有目标5回合。

items.wands.wandofregrowth.name=再生法杖
items.wands.wandofregrowth.staff_name=再生魔杖
items.wands.wandofregrowth.desc=这根法杖由一根细长木枝巧琢而成。不知为何，它还活着而且生机盎然，像一株树苗的嫩芽般艳绿。“春兰兮秋菊，长无绝兮终古！”
items.wands.wandofregrowth.stats_desc=在施放时，这根法杖将向一个扇形区域倾洒出再生的能量。这种魔法会让草、根系甚至稀有的植物重获生命，破土而出。下一次使用它将消耗_%1$d点充能_。法杖消耗的充能越多，再生魔法的范围与效力就越大、越强。
items.wands.wandofregrowth.degradation=法杖的再生魔力将在释放_%d点充能_后开始消退，那时它将难以再次使植物或高草复生。提升英雄等级或是升级法杖能延后这种限制。
items.wands.wandofregrowth.upgrade_stat_name_1=每充能再生量
items.wands.wandofregrowth.upgrade_stat_name_2=再生充能限制
items.wands.wandofregrowth.bmage_desc=当_战斗法师_以再生魔杖近战攻击目标时，如果一方站在草地上，则战斗法师能获取伤害的一定比例的草药疗养。
items.wands.wandofregrowth.eleblast_desc=再生魔杖的元素风暴使所有目标被缠绕，并令范围内随机长出高草。
items.wands.wandofregrowth$dewcatcher.name=结露草
items.wands.wandofregrowth$dewcatcher.desc=结露草是一种蓄满了魔法露水的奇妙植物。它们想将自己伪装成杂草来避开注意，但其鼓胀的集露苞却出卖了它们。
items.wands.wandofregrowth$dewcatcher.discover_hint=你可通过某根法杖找到该植物。
items.wands.wandofregrowth$seedpod.name=种子荚
items.wands.wandofregrowth$seedpod.desc=种子荚是一种会结出其他各类植物种子的魔法植物。它们没有自己的种子，却还是以某种方式传播扩散开了。
items.wands.wandofregrowth$seedpod.discover_hint=你可通过某根法杖找到该植物。
items.wands.wandofregrowth$lotus.name=黄金莲
items.wands.wandofregrowth$lotus.desc=黄金莲是一种只能被强大的再生法杖创造的神秘植物。它的光环会增强所有植物相关效果，但它不一会就会耗尽能量枯萎。
items.wands.wandofregrowth$lotus.wand_info=这株黄金莲由一根_%1$d级_的再生法杖产出。在其作用范围内，所有被种植到某单位上的植物都会_立即触发_其效果。植物还会有_%2$d%%的概率_掉落其种子，使用涂药飞镖的耐久度消耗也会减少_%3$d%%_。
items.wands.wandofregrowth$lotus.discover_hint=你可通过经数次升级后的某根法杖找到该植物。

items.wands.wandoftransfusion.name=注魂法杖
items.wands.wandoftransfusion.staff_name=注魂魔杖
items.wands.wandoftransfusion.ondeath=你用注魂法杖耗尽了自己的生命...
items.wands.wandoftransfusion.charged=敌人的生命能量流进了你的魔杖！
items.wands.wandoftransfusion.desc=这根法杖形状很普通，是那暗红的色泽和镶在顶端的漆黑宝石让它显眼起来。
items.wands.wandoftransfusion.stats_desc=这根法杖对盟友或被魅惑的敌人释放时会消耗你_%1$d点生命_并赋予目标_%2$d点生命或护盾_；对敌人释放时会短暂魅惑敌人并回馈给你_%3$d点护盾_。敌对亡灵生物会受到_%4$d~%5$d点伤害_而不是被魅惑。
items.wands.wandoftransfusion.upgrade_stat_name_1=盟友治疗
items.wands.wandoftransfusion.upgrade_stat_name_2=自身护盾
items.wands.wandoftransfusion.upgrade_stat_name_3=亡灵伤害
items.wands.wandoftransfusion.bmage_desc=当_战斗法师_以注魂魔杖近战攻击被魅惑的目标时，能获取一定的护盾且下次释放不消耗生命。
items.wands.wandoftransfusion.eleblast_desc=注魂魔杖的元素风暴会在范围内魅惑所有敌人、治疗所有友军，对敌对亡灵生物造成100%伤害。

items.wands.wandofwarding.name=哨卫法杖
items.wands.wandofwarding.staff_name=哨卫魔杖
items.wands.wandofwarding.no_more_wards=你的法杖无法维持更多的哨卫。
items.wands.wandofwarding.bad_location=你不能在那里设置一个哨卫。
items.wands.wandofwarding.desc=这根短小的金属法杖尖端上有一颗亮紫色宝石悬空浮动。
items.wands.wandofwarding.stats_desc=这根法杖并不能直接攻击敌人，但可以召唤出哨卫元素与哨卫结晶。你可以在视野中的任何地方召唤哨卫，即使是隔着一堵墙。这根法杖最多能提供_%d点能量_以维持哨卫。
items.wands.wandofwarding.upgrade_stat_name_1=哨卫伤害
items.wands.wandofwarding.upgrade_stat_name_2=哨卫能量
items.wands.wandofwarding.bmage_desc=当_战斗法师_以哨卫魔杖近战攻击目标时，有概率为所有哨卫元素和哨卫结晶恢复一定生命值。
items.wands.wandofwarding.eleblast_desc=哨卫魔杖的元素风暴会治疗范围内的所有哨卫元素和结晶。
items.wands.wandofwarding$ward.desc_generic_ward=这个哨卫元素会自动攻击进入视野的目标。\n\n使用哨卫法杖向该哨卫施法能使其升级。\n\n哨卫能发动攻击的次数有限，次数耗尽后它们便会消散。
items.wands.wandofwarding$ward.desc_generic_sentry=这个哨卫结晶攻击力与哨卫元素相同，但以生命值取代了有限的发动次数。它的样子有点像哨卫法杖顶端的宝石。\n\n使用哨卫法杖向该哨卫施法能使其升级并治疗它。\n\n这个哨卫每次发动攻击时会消耗一定的生命值，但你可以用哨卫法杖治疗它。
items.wands.wandofwarding$ward.name_1=小哨卫元素
items.wands.wandofwarding$ward.desc_1=这个最基本的哨卫元素会自动攻击进入视野的目标，造成_%1$d~%2$d点伤害。_\n\n使用哨卫法杖向该哨卫施法能使其升级。\n\n这个哨卫在仅发动1次攻击之后就会消散。\n\n你的哨卫法杖在使用_%3$d点能量_维持这个哨卫。
items.wands.wandofwarding$ward.name_2=哨卫元素
items.wands.wandofwarding$ward.desc_2=这个升级过的哨卫元素结构更精致，而且在攻击数次后才会消散。它每次发动攻击能造成_%1$d~%2$d点伤害_。\n\n使用哨卫法杖向该哨卫施法能使其升级。\n\n这个哨卫在发动3次攻击之后才会消散。\n\n你的哨卫法杖在使用_%3$d点能量_维持这个哨卫。
items.wands.wandofwarding$ward.name_3=大哨卫元素
items.wands.wandofwarding$ward.desc_3=这个满级的哨卫元素能发动更多次攻击，而且攻击速度更快。它每次发动攻击能造成_%1$d~%2$d点伤害_。\n\n使用哨卫法杖向该哨卫施法能使其进化。\n\n这个哨卫在发动5次攻击之后才会消散。\n\n你的哨卫法杖在使用_%3$d点能量_维持这个哨卫。
items.wands.wandofwarding$ward.name_4=小哨卫结晶
items.wands.wandofwarding$ward.desc_4=这个小小的哨卫结晶攻击力与大哨卫元素相同，但以生命值取代了有限的发动次数。它的样子有点像哨卫法杖顶端的宝石。它每次发动攻击能造成_%1$d~%2$d点伤害_。\n\n使用哨卫法杖向该哨卫施法能使其升级并治疗它。\n\n这个哨卫每次发动攻击时会消耗一定的生命值，但你可以用哨卫法杖治疗它。\n\n你的哨卫法杖在使用_%3$d点能量_维持这个哨卫。
items.wands.wandofwarding$ward.name_5=哨卫结晶
items.wands.wandofwarding$ward.desc_5=这个升级过的哨卫结晶比小哨卫结晶体积更大，形体也更结实。它每次发动攻击能造成_%1$d~%2$d点伤害_。\n\n使用哨卫法杖向该哨卫施法能使其升级并治疗它。\n\n这个哨卫每次发动攻击时会消耗一定的生命值，但你可以用哨卫法杖治疗它。\n\n你的哨卫法杖在使用_%3$d点能量_维持这个哨卫。
items.wands.wandofwarding$ward.name_6=大哨卫结晶
items.wands.wandofwarding$ward.desc_6=这个满级的哨卫结晶比之前的坚固了不少。它每次发动攻击能造成_%1$d~%2$d点伤害_。\n\n使用哨卫法杖向该哨卫施法能治疗它。\n\n这个哨卫每次发动攻击时会消耗一定的生命值，但你可以用哨卫法杖治疗它。\n\n你的哨卫法杖在使用_%3$d点能量_维持这个哨卫。
items.wands.wandofwarding$ward.discover_hint=你可通过某根法杖遇到该单位。
items.wands.wandofwarding$ward.dismiss_title=要驱散这个哨卫吗？
items.wands.wandofwarding$ward.dismiss_body=不想让法杖继续维持这个哨卫的话，你可以选择驱散它立即将其破坏移除。\n\n要驱散这个哨卫吗？
items.wands.wandofwarding$ward.dismiss_confirm=是
items.wands.wandofwarding$ward.dismiss_cancel=否

###weapon curses
items.weapon.curses.annoying.name=喧闹%s
items.weapon.curses.annoying.msg_1=嘿，头儿！我们要去打谁！
items.weapon.curses.annoying.msg_2=太爽了，击溃他们！
items.weapon.curses.annoying.msg_3=嘿！听着！
items.weapon.curses.annoying.msg_4=现在是打BOSS的时间吗！？
items.weapon.curses.annoying.msg_5=我去，别这么用力！
items.weapon.curses.annoying.msg_6=死吧，虫子！
items.weapon.curses.annoying.msg_7=无理理理理理理理理理理理理理理理！
items.weapon.curses.annoying.msg_8=我们能休息一下吗！？
items.weapon.curses.annoying.msg_9=嘭，哈哈！
items.weapon.curses.annoying.msg_10=漂亮的一击！
items.weapon.curses.annoying.msg_11=我曾经不想成为武器，而是想成为伐木工人的斧头。
items.weapon.curses.annoying.msg_12=要时刻警醒：骄傲自满是位缓慢却阴险的杀手。
items.weapon.curses.annoying.msg_13=敌羞，吾去脱他衣！
items.weapon.curses.annoying.desc=喧闹诅咒的武器真的是想帮你，只不过它的吵闹无比的“帮助”总是会吸引大量敌人。
items.weapon.curses.annoying.elestrike_desc=武器拥有喧闹诅咒时，元素打击对范围内的每个敌人都有20%概率造成持续6回合的狂乱。

items.weapon.curses.dazzling.name=炫目%s
items.weapon.curses.dazzling.desc=炫目武器会不时释放刺目的强光，致盲所有视野范围内的单位。
items.weapon.curses.dazzling.elestrike_desc=武器拥有炫目诅咒时，元素打击对范围内的每个敌人都有50%概率造成持续6回合的失明。

items.weapon.curses.displacing.name=转移%s
items.weapon.curses.displacing.desc=转移诅咒的武器被灌注了混乱的传送魔法，会将敌人传送到当前层的随机位置。
items.weapon.curses.displacing.elestrike_desc=武器拥有转移诅咒时，元素打击对范围内的每个敌人都有50%概率进行传送。

items.weapon.curses.explosive.name=易爆%s
items.weapon.curses.explosive.warm=温热起来了...
items.weapon.curses.explosive.hot=好烫！
items.weapon.curses.explosive.desc=易爆诅咒的武器会缓缓积累能量并最终爆炸，爆炸会对所有邻近单位造成伤害。
items.weapon.curses.explosive.desc_cool=你的武器目前触感冰凉，尚属正常。
items.weapon.curses.explosive.desc_warm=你的武器正在积累能量，变得温热起来了...
items.weapon.curses.explosive.desc_hot=你的武器已灼热烫手！要爆炸了！
items.weapon.curses.explosive.elestrike_desc=武器拥有易爆诅咒时，元素打击有着50%的概率在范围内随机一个敌人身上产生爆炸。

items.weapon.curses.friendly.name=友善%s
items.weapon.curses.friendly.desc=友善诅咒的武器会偶尔触发让战斗无法进行的魔法，非常适合和平主义者。
items.weapon.curses.friendly.elestrike_desc=武器拥有友善诅咒时，元素打击对范围内的每个敌人都有50%概率造成持续6回合的魅惑。

items.weapon.curses.polarized.name=极化%s
items.weapon.curses.polarized.desc=极化武器受到诅咒魔力的影响，在攻击时只会出现1.5倍伤害或完全没有伤害的情况。
items.weapon.curses.polarized.elestrike_desc=武器拥有极化诅咒时，元素打击对范围内的每个敌人都有50%概率造成24~36点伤害。

items.weapon.curses.pressurized.name=激流%s
items.weapon.curses.pressurized.desc=激流诅咒的武器可以喷流出强劲的水爆，击退包括你在内的一切事物。
items.weapon.curses.pressurized.elestrike_desc=武器拥有激流诅咒时，元素打击会创造破坏地形并击退范围内所有敌人的巨浪。

items.weapon.curses.sacrificial.name=血祭%s
items.weapon.curses.sacrificial.desc=血祭诅咒会向使用者索求血液作为攻击的回报，你的状态越健康，诅咒索取的也就越多。
items.weapon.curses.sacrificial.elestrike_desc=武器拥有血祭诅咒时，元素打击对英雄自身与范围内的每一个敌人都造成初始值为12点的流血效果。

items.weapon.curses.wayward.name=妄为%s
items.weapon.curses.wayward.desc=妄为诅咒的武器会时常变得极其不精准。触发时这种魔法会持续一小会，但会在成功使用妄为武器造成伤害后立刻消散。
items.weapon.curses.wayward.elestrike_desc=武器拥有妄为诅咒时，元素打击对范围内的每个敌人都有50%概率造成持续6回合的幻惑。
items.weapon.curses.wayward$waywardbuff.name=妄为
items.weapon.curses.wayward$waywardbuff.desc=你的妄为武器上的魔法已被触发，现在它已变得极度不精准。这个魔法无法影响如伏击等必定命中的攻击行为，且成功使用妄为武器造成伤害会立刻驱散此效果。\n\n效果剩余回合：%s

items.weapon.curses.wondrous.name=奇迹%s
items.weapon.curses.wondrous.desc=奇迹诅咒的武器内含与诅咒法杖同源的混沌魔力。没人知道这个诅咒触发时到底会发生些什么！
items.weapon.curses.wondrous.elestrike_desc=武器拥有奇迹诅咒时，元素打击有概率对范围内的所有敌人施放一种不同的诅咒法杖效果。

###enchantments
items.weapon.enchantments.blazing.name=烈焰%s
items.weapon.enchantments.blazing.desc=这个附魔会使火焰从武器中喷薄而出，能够点燃敌人并对正在燃烧的敌人造成额外伤害。
items.weapon.enchantments.blazing.elestrike_desc=武器拥有烈焰附魔时，元素打击会将火焰扩散到范围内全部地块，持续8回合。

items.weapon.enchantments.blocking.name=招架%s
items.weapon.enchantments.blocking.desc=招架附魔的武器在攻击后有几率短暂为你提供保护。
items.weapon.enchantments.blocking.elestrike_desc=武器拥有招架附魔时，元素打击范围内每有一个敌人，决斗家就会获得6点护盾。
items.weapon.enchantments.blocking$blockbuff.name=招架
items.weapon.enchantments.blocking$blockbuff.desc=你的武器的招架附魔短时间内增强了你的防御能力！\n\n护盾剩余：%d\n\n剩余时间：%s

items.weapon.enchantments.blooming.name=繁茂%s
items.weapon.enchantments.blooming.desc=繁茂武器具有催生植物的魔力，在攻击目标时能使目标或周围的植被发芽生长。
items.weapon.enchantments.blooming.elestrike_desc=武器拥有繁茂附魔时，元素打击会在范围内最多8个地块上生成高草，并使范围内所有敌人缠绕6回合。

items.weapon.enchantments.chilling.name=寒霜%s
items.weapon.enchantments.chilling.desc=受该附魔成功影响的敌人会被冻伤，导致移动和攻击速度降低。
items.weapon.enchantments.chilling.elestrike_desc=武器拥有寒霜附魔时，元素打击会将寒气扩散到范围的全部地块，持续8个回合。

items.weapon.enchantments.crystal.name=魔晶%s
items.weapon.enchantments.crystal.alert_fixed=你的魔晶武器崭新如初！
items.weapon.enchantments.crystal.alert_fixed_ghost=幽灵的魔晶武器崭新如初！
items.weapon.enchantments.crystal.alert_noflaw=你的魔晶武器上的缺损得到了修复。
items.weapon.enchantments.crystal.alert_noflaw_ghost=幽灵的魔晶武器上的缺损得到了修复。
items.weapon.enchantments.crystal.alert_nocrack=你的魔晶武器上的裂纹弥合了。
items.weapon.enchantments.crystal.alert_nocrack_ghost=幽灵的魔晶武器上的裂纹弥合了。
items.weapon.enchantments.crystal.alert_flawed=你的魔晶武器略有缺损。
items.weapon.enchantments.crystal.alert_flawed_ghost=幽灵的魔晶武器略有缺损。
items.weapon.enchantments.crystal.alert_cracked=你的魔晶武器已经布满裂纹，马上就要粉碎了！
items.weapon.enchantments.crystal.alert_cracked_ghost=幽灵的魔晶武器已经布满裂纹，马上就要粉碎了！
items.weapon.enchantments.crystal.alert_shattered=你的魔晶武器化为了齑粉！
items.weapon.enchantments.crystal.alert_shattered_ghost=幽灵的魔晶武器化为了齑粉！
items.weapon.enchantments.crystal.desc=这种强力的附魔可以造成额外的魔法伤害并提升武器的价值，但是，如果不加以维修或给其时间进行自我修复，魔力结晶化的武器就会彻底粉碎。
items.weapon.enchantments.crystal.desc_thrown=魔晶投掷武器的耐久度相当低，但其可随时间流逝而自我修复。
items.weapon.enchantments.crystal.desc_perfect=这把魔晶武器目前品相完美。
items.weapon.enchantments.crystal.desc_fine=这把魔晶武器目前品相不错。
items.weapon.enchantments.crystal.desc_flawed=这把魔晶武器已有缺损，但暂无粉碎的风险。
items.weapon.enchantments.crystal.desc_cracked=这把魔晶武器上已经布满裂纹，有永久粉碎的风险！
items.weapon.enchantments.crystal.elestrike_desc=武器拥有魔晶附魔时，元素打击会对范围内除主要目标外的每个敌人造成10~20点伤害并修复武器的碎裂。

items.weapon.enchantments.kinetic.name=恒动%s
items.weapon.enchantments.kinetic.desc=使用恒动附魔的武器击杀敌人时，武器会储存溢出的威力并在下一次成功攻击时释放。
items.weapon.enchantments.kinetic.elestrike_desc=武器拥有恒动附魔时，元素打击会对范围内除主要目标外的每个敌人都造成伤害，数值为储存伤害的40%。
items.weapon.enchantments.kinetic$conserveddamage.name=伤害储存
items.weapon.enchantments.kinetic$conserveddamage.desc=你的武器储存了上个杀敌一击的过剩能量，用来加强你的下次攻击以造成额外伤害。这份能量会慢慢随时间减弱。\n\n储存伤害：%d

items.weapon.enchantments.corrupting.name=腐化%s
items.weapon.enchantments.corrupting.desc=这种强力的附魔拥有将敌人扭曲为你的奴仆的能力。使用腐化附魔的武器击杀敌人时有概率将其腐化。
items.weapon.enchantments.corrupting.elestrike_desc=武器拥有腐化附魔时，元素打击范围内除主要目标外的每个敌人都有5~25%的几率被腐化。(概率基于该敌人已损失的生命值)

items.weapon.enchantments.eldritch.name=异质%s
items.weapon.enchantments.eldritch.desc=异质附魔的武器会使目睹其攻击的附近敌人心生恐惧，使其狂乱逃离攻击者。
items.weapon.enchantments.eldritch.elestrike_desc=武器拥有异质附魔时，元素打击会为范围内包括主目标的所有敌人施加更为持久的恐惧效果。

items.weapon.enchantments.elastic.name=弹性%s
items.weapon.enchantments.elastic.desc=弹性武器在攻击时有几率把敌人击退较短的距离。
items.weapon.enchantments.elastic.elestrike_desc=武器拥有弹性附魔时，元素打击会将范围内的所有敌人都击退5格。

items.weapon.enchantments.grim.name=死神%s
items.weapon.enchantments.grim.desc=这个强力的附魔拥有瞬间斩杀敌人的力量。敌人越弱，附魔的触发几率越大。
items.weapon.enchantments.grim.elestrike_desc=武器拥有死神附魔时，元素打击范围内除主要目标外的每个敌人都有6~30%的几率被秒杀。(概率基于该敌人已损失的生命值)

items.weapon.enchantments.lucky.name=幸运%s
items.weapon.enchantments.lucky.desc=被幸运附魔武器击杀的敌人有几率掉落额外的宝物。
items.weapon.enchantments.lucky.elestrike_desc=武器拥有幸运附魔时，对于范围内的每个敌人，元素打击都有12.5%概率在其脚下生成物品。每个敌人只能触发这个效果一次。

items.weapon.enchantments.projecting.name=索敌%s
items.weapon.enchantments.projecting.desc=这个附魔会使近战武器获得额外的攻击距离。远程武器则能够在瞄准附近目标时穿透墙壁。
items.weapon.enchantments.projecting.elestrike_desc=武器拥有索敌附魔时，元素打击对范围内除主要目标外的每个敌人都造成30%的伤害。

items.weapon.enchantments.shocking.name=电击%s
items.weapon.enchantments.shocking.desc=电弧在这个武器上不断地闪烁震荡，能够对邻近所有敌人造成额外伤害。
items.weapon.enchantments.shocking.elestrike_desc=武器拥有电击附魔时，元素打击会将电火花扩散到范围的全部地块，持续8个回合。

items.weapon.enchantments.unstable.name=紊乱%s
items.weapon.enchantments.unstable.desc=紊乱附魔的武器散发着混乱能量，每一击都视作具有另一种随机附魔。
items.weapon.enchantments.unstable.elestrike_desc=武器拥有紊乱附魔时，元素打击会对范围内除主要目标以外的其他敌人都造成一种随机附魔效果。

items.weapon.enchantments.vampiric.name=血饮%s
items.weapon.enchantments.vampiric.desc=这个强力的附魔能在攻击敌人时吸取其生命能量并恢复使用者的生命。当使用者生命较少时效果更强。
items.weapon.enchantments.vampiric.elestrike_desc=武器拥有血饮附魔时，元素打击范围内每有一个敌人，决斗家就会恢复2.5点生命值。

items.weapon.enchantments.venomous.name=猛毒%s
items.weapon.enchantments.venomous.desc=猛毒附魔的武器可以施加延迟却致命的中毒效果，其每次触发都会使毒性更猛烈。
items.weapon.enchantments.venomous.elestrike_desc=武器拥有猛毒附魔时，元素打击会对范围内除主目标外的敌人会施加额外的延迟中毒效果。

items.weapon.enchantments.vorpal.name=锋锐%s
items.weapon.enchantments.vorpal.desc=锋锐附魔的武器极其致命，其干净利落的攻击有概率对可流血的敌人施加流血效果而非造成直接伤害。
items.weapon.enchantments.vorpal.elestrike_desc=武器拥有斩杀附魔时，元素打击会对范围内出主目标外的所有敌人施加额外的流血效果。


###melee weapons
items.weapon.melee.assassinsblade.name=暗杀之刃
items.weapon.melee.assassinsblade.stats_desc=这件武器对未察觉你的敌人更有效。
items.weapon.melee.assassinsblade.ability_name=潜行
items.weapon.melee.assassinsblade.typical_ability_desc=决斗家握持暗杀之刃时可以_潜行_。这个武技能够使决斗家立即闪现最多3格远，并一般会给予_%d回合隐形_。
items.weapon.melee.assassinsblade.ability_desc=决斗家握持暗杀之刃时可以_潜行_。这个武技能够使决斗家立即闪现最多3格远，并给予_%d回合隐形_。
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=武技持续时间
items.weapon.melee.assassinsblade.desc=黑曜石制的波浪形短刃，虽轻便但不易用，如果能击中要害足以致命。

items.weapon.melee.battleaxe.name=战斧
items.weapon.melee.battleaxe.stats_desc=这是一件比较精准的武器。
items.weapon.melee.battleaxe.ability_name=重击
items.weapon.melee.battleaxe.typical_ability_desc=决斗家可以用战斧使出_重击_。这用尽全力的一击如果是在伏击敌人，则一般会造成_%1$d~%2$d点伤害_并施加5回合的恍惚，使其精准与闪避均降低50%%。重击必定命中，但若非伏击则只会造成普通的伤害。
items.weapon.melee.battleaxe.ability_desc=决斗家可以用战斧使出_重击_。这用尽全力的一击如果是在伏击敌人，则会造成_%1$d~%2$d点伤害_并施加5回合的恍惚，使其精准与闪避均降低50%%。重击必定命中，但若非伏击则只会造成普通的伤害。
items.weapon.melee.battleaxe.desc=这把有着硕大钢制头部的战斧能将庞大的力量倾注在每次挥舞之中。

items.weapon.melee.crossbow.name=十字弩
items.weapon.melee.crossbow.typical_stats_desc=通常，这件武器在被装备时会强化飞镖以造成_%1$d~%2$d_点伤害，甚至能将其附魔赋予飞镖。
items.weapon.melee.crossbow.stats_desc=这件武器在被装备时会强化飞镖以造成_%1$d~%2$d_点伤害，甚至能将其附魔赋予飞镖。
items.weapon.melee.crossbow.ability_name=蓄势射击
items.weapon.melee.crossbow.typical_ability_desc=决斗家可以为十字弩_蓄势_。这个武技能使下一次攻击必定命中，并将视情况触发以下三种效果之一：近战攻击将会击退敌人；未涂药飞镖一般会造成_%1$d点额外伤害_，而涂药飞镖将会在7x7的范围内触发效果，还一般会增加_%2$d次可用次数_。
items.weapon.melee.crossbow.ability_desc=决斗家可以为十字弩_蓄势_。这个武技能使下一次攻击必定命中，并将视情况触发以下三种效果之一：近战攻击将会击退敌人；未涂药飞镖将会造成_%1$d点额外伤害_，而涂药飞镖将会在7x7的范围内触发效果，还会增加_%2$d次可用次数_。
items.weapon.melee.crossbow.desc=这是一件看起来相当精密复杂的装置，能够将飞镖一样的小型箭矢以极高的速度射出。这把十字弩掂在手里沉甸甸的，比想象中结实很多，虽然完全违背了设计初衷，不过也能够在肉搏战中起到作用。
items.weapon.melee.crossbow.upgrade_ability_stat_name=武技加成
items.weapon.melee.crossbow$chargedshot.name=蓄势待发
items.weapon.melee.crossbow$chargedshot.desc=决斗家正将能量集中于她的十字弩。这个武技能使她的下一次攻击必定命中，并将视情况触发以下三种效果之一：\n-近战攻击将会击退敌人数格。\n-未涂药飞镖将会造成额外伤害。\n-涂药飞镖将会增加可用次数，在7x7的范围内触发效果。正面效果只对盟友生效，负面效果也只对敌人生效。决斗家不能使用此武技使正面飞镖效果对她自己生效。

items.weapon.melee.cudgel.name=权杖
items.weapon.melee.cudgel.stats_desc=这是一件比较精准的武器。
items.weapon.melee.cudgel.ability_name=重击
items.weapon.melee.cudgel.typical_ability_desc=决斗家可以用权杖使出_重击_。这用尽全力的一击如果是在伏击敌人，则一般会造成_%1$d~%2$d点伤害_并施加5回合的恍惚，使其精准与闪避均降低50%%。重击必定命中，但若非伏击则只会造成普通的伤害。
items.weapon.melee.cudgel.ability_desc=决斗家可以用权杖使出_重击_。这用尽全力的一击如果是在伏击敌人，则会造成_%1$d~%2$d点伤害_并施加5回合的恍惚，使其精准与闪避均降低50%%。重击必定命中，但若非伏击则只会造成普通的伤害。
items.weapon.melee.cudgel.desc=一把小型黄铜锤，更多的作为贵族们的自卫工具而非冒险用武器使用。
items.weapon.melee.cudgel.discover_hint=某位英雄初始携带该物品。

items.weapon.melee.dagger.name=匕首
items.weapon.melee.dagger.stats_desc=这件武器对未察觉你的敌人更有效。
items.weapon.melee.dagger.ability_name=潜行
items.weapon.melee.dagger.typical_ability_desc=决斗家握持匕首时可以_潜行_。这个武技能够使决斗家立即闪现最多5格远，并一般给予_%d回合隐形_。
items.weapon.melee.dagger.ability_desc=决斗家握持匕首时可以_潜行_。这个武技能够使决斗家立即闪现最多5格远，并给予_%d回合隐形_。
items.weapon.melee.dagger.upgrade_ability_stat_name=武技持续时间
items.weapon.melee.dagger.desc=木柄被磨损的简易铁质匕首。
items.weapon.melee.dagger.discover_hint=某位英雄初始携带该物品。

items.weapon.melee.dirk.name=长匕首
items.weapon.melee.dirk.stats_desc=这件武器对未察觉你的敌人更有效。
items.weapon.melee.dirk.ability_name=潜行
items.weapon.melee.dirk.typical_ability_desc=决斗家握持长匕首时可以_潜行_。这个武技能够使决斗家立即闪现最多4格远，并一般给予_%d回合隐形_。
items.weapon.melee.dirk.ability_desc=决斗家握持长匕首时可以_潜行_。这个武技能够使决斗家立即闪现最多4格远，并给予_%d回合隐形_。
items.weapon.melee.dirk.upgrade_ability_stat_name=武技持续时间
items.weapon.melee.dirk.desc=一个长一些的刺击型匕首，可以往敌人身体里捅得更深一点。

items.weapon.melee.flail.name=链枷
items.weapon.melee.flail.stats_desc=这是一件不太精准的武器。\n这件武器不能用来伏击。
items.weapon.melee.flail.ability_name=甩动
items.weapon.melee.flail.spin_warn=你不能再继续甩动链枷了。
items.weapon.melee.flail.typical_ability_desc=决斗家可以_甩动_链枷以在短时间内积蓄力量。每甩动一次，链枷一般就会造成_%d点额外伤害_，最多3次。甩动的链枷必定命中。只有开始甩动链枷消耗1点充能。
items.weapon.melee.flail.ability_desc=决斗家可以_甩动_链枷以在短时间内积蓄力量。每甩动一次，链枷就会造成_%d点额外伤害_，最多3次。甩动的链枷必定命中。只有开始甩动链枷消耗1点充能。
items.weapon.melee.flail.desc=铁链上附着的一个带刺的钢球。笨重难用，能命中的话威力极强。
items.weapon.melee.flail$spinabilitytracker.name=蓄势
items.weapon.melee.flail$spinabilitytracker.desc=决斗家正在甩动链枷，为下一击积蓄力量。每次甩动消耗一回合但会增加伤害，最多甩动三次。只要在甩动中，链枷的攻击就必定命中。\n\n当前甩动次数：%1$d%%。\n剩余回合数：%2$s。

items.weapon.melee.gauntlet.name=魔岩拳套
items.weapon.melee.gauntlet.stats_desc=这是一件非常快的武器。
items.weapon.melee.gauntlet.ability_name=连击
items.weapon.melee.gauntlet.typical_ability_desc=决斗家可以使用魔岩拳套进行_连击_。这次攻击必定命中，并且决斗家每使用近战或者投掷武器成功命中一次，这次攻击的伤害一般就_增加%d点_。连续5回合(击杀后为15回合)未成功命中会重置连击。
items.weapon.melee.gauntlet.ability_desc=决斗家可以使用魔岩拳套进行_连击_。这次攻击必定命中，并且决斗家每使用近战或者投掷武器成功命中一次，这次攻击的伤害就_增加%d点_。连续5回合(击杀后为15回合)未成功命中会重置连击。
items.weapon.melee.gauntlet.desc=这个巨大的拳套由一匹红布和层层覆盖在布上的魔法岩石交织而成。戴上后，布料紧紧裹住你的整个前臂，让厚重的岩板变得像一层坚硬的皮肤。要有足够的力量才能将如此沉重的武器自如挥舞，但正是这种力量和重量的结合让这件武器发挥出可怕的威力。

items.weapon.melee.glaive.name=关刀
items.weapon.melee.glaive.stats_desc=这是一件相当慢的武器。\n这件武器有额外的攻击距离。
items.weapon.melee.glaive.ability_name=刺退
items.weapon.melee.glaive.typical_ability_desc=决斗家用关刀刀尖_刺退_在射程内但不与决斗家相邻的敌人，一般造成_%1$d~%2$d点伤害_，将敌人击退且必定命中。
items.weapon.melee.glaive.ability_desc=决斗家用关刀刀尖_刺退_在射程内但不与决斗家相邻的敌人，造成_%1$d~%2$d点伤害_，将敌人击退且必定命中。
items.weapon.melee.glaive.desc=一支在末端装有剑刃的重型长柄武器。

items.weapon.melee.gloves.name=镶钉手套
items.weapon.melee.gloves.stats_desc=这是一件非常快的武器。
items.weapon.melee.gloves.ability_name=连击
items.weapon.melee.gloves.typical_ability_desc=决斗家可以使用镶钉手套进行_连击_。这次攻击必定命中，并且决斗家每使用近战或者投掷武器成功命中一次，这次攻击的伤害一般就_增加%d点_。连续5回合(击杀后为15回合)未成功命中会重置连击。
items.weapon.melee.gloves.ability_desc=决斗家可以使用魔岩拳套进行_连击_。这次攻击必定命中，并且决斗家每使用近战或者投掷武器成功命中一次，这次攻击的伤害就_增加%d点_。连续5回合(击杀后为15回合)未成功命中会重置连击。
