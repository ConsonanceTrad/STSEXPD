items.weapon.ranges.alloybows.desc=使用多种金属打造而成的弩，但是比较轻巧。
items.weapon.ranges.alloybown.name=普通的合金弩
items.weapon.ranges.alloybown.desc=使用多种金属打造而成的弩，可以发射箭矢。
items.weapon.ranges.alloybowr.name=沉重的合金弩
items.weapon.ranges.alloybowr.desc=使用多种金属打造而成的弩，但是有些沉重。
items.weapon.ranges.pvcbows.name=轻巧的复合纤维弩
items.weapon.ranges.pvcbows.desc=经过复杂工序加工而成的弩，但是比较轻巧。
items.weapon.ranges.pvcbown.name=普通的复合纤维弩
items.weapon.ranges.pvcbown.desc=经过复杂工序加工而成的弩，可以发射箭矢。
items.weapon.ranges.pvcbowr.name=沉重的复合纤维弩
items.weapon.ranges.pvcbowr.desc=经过复杂工序加工而成的弩，但是有些沉重。

items.weapon.missiles.manyknive.name=十六夜的千支刀
items.weapon.missiles.manyknive.ac_shoot=投掷
items.weapon.missiles.manyknive.ac_ammo=涂油
items.weapon.missiles.manyknive.prompt=选择用于涂抹的强化弹药
items.weapon.missiles.manyknive.shoot_prompt=选择投掷目标
items.weapon.missiles.manyknive.desc=由大量普通飞刀组成的飞刀组。此外，这个飞刀组可以使用强化弹药涂油。
items.weapon.missiles.manyknive.damage=这件高攻速武器可以造成_%1$d～%2$d点伤害_。
items.weapon.missiles.manyknive.ammo=当前强化弹药：%s
items.weapon.missiles.manyknive.replace=千支刀当前涂有%1$s。是否改用%2$s？原有涂层将会消失。
items.weapon.missiles.manyknive.yes=是
items.weapon.missiles.manyknive.no=否
items.weapon.missiles.throwing.escapeknive.name=逃脱小刀
items.weapon.missiles.throwing.escapeknive.desc=简单的金属片，但可以击晕猎物，帮你从困境中逃脱。
items.quest.adventurejournal.destination_19=深层矿区
items.quest.adventurejournal.destination_20=Zot前厅
items.quest.adventurejournal.destination_21=首领连续战
items.quest.adventurejournal.destination_22=混沌领域
items.quest.adventurejournal.destination_23=Zot神殿
items.quest.adventurejournal.destination_24=Zot王座
items.quest.adventurejournal.ac_add=添加
items.quest.adventurejournal.prompt=选择一张要加入冒险日志的地点纸片。
items.quest.adventurejournal.add_page=地点记录成功。
items.quest.adventurejournal.already_added=这个地点已经记录在日志中。
items.quest.adventurejournal.missing=你还没有取得Otiluck的旅行日志。
items.dolyaslate.name=多利亚石板
items.dolyaslate.desc=利用多利亚盛产的魔法矿石制成的传送道具，用于不同地点之间的往返。它可以读取其他旅行者记录的地点，让你前往那些地方。
items.dolyaslate.charge=多利亚石板当前充能数%1$d，充能上限为%2$d。
items.dolyaslate.not_enough_charge=多利亚石板至少需要%d点充能才能打开传送通道。

items.quest.petcompendium.name=伙伴图鉴
items.quest.petcompendium.ac_call=召回伙伴
items.quest.petcompendium.ac_choose=选择伙伴
items.quest.petcompendium.ac_feed=喂食
items.quest.petcompendium.choose_family=选择一组伙伴谱系。更换选择不会立即替换当前仍在战斗的伙伴。
items.quest.petcompendium.family_0=林地伙伴
items.quest.petcompendium.family_1=城镇伙伴
items.quest.petcompendium.family_2=异域伙伴
items.quest.petcompendium.family_3=高阶伙伴
items.quest.petcompendium.choose_type=选择下一次召唤的伙伴。
items.quest.petcompendium.selected=已经选择%s作为同行伙伴。
items.quest.petcompendium.no_space=你身边没有足够空间让伙伴出现。
items.quest.petcompendium.spent=本层的召唤力量已经耗尽；进入另一层后才能再次召唤阵亡的伙伴。
items.quest.petcompendium.recalled=%s回到了你身边。
items.quest.petcompendium.called=%s响应图鉴，来到你身边。
items.quest.petcompendium.feed_prompt=选择一份普通食物喂给当前伙伴
items.quest.petcompendium.full=伙伴现在不需要进食。
items.quest.petcompendium.fed=%1$s恢复了%2$d点生命。
items.quest.petcompendium.obtained=年兽留下了一本伙伴图鉴！
items.quest.petcompendium.desc=记录特别惊喜像素地牢伙伴谱系的图鉴。当前选择：_%s_。\n\n每层可召唤一次伙伴；仍存活的伙伴可以不限次数召回。伙伴不会制造战利品，喂食会消耗一份正常食物。
items.weapon.melee.fusion.triangolo.name=三角铁
items.weapon.melee.fusion.triangolo.desc=由舞台乐器重制而成的一阶轻武器。威力不高，但每次命中都会对目标周围的敌对单位造成四分之一的脉冲伤害，不会误伤友军。
items.weapon.melee.fusion.flute.name=战斗长笛
items.weapon.melee.fusion.flute.desc=一件命中略高的二阶乐器。每次命中都会对目标周围的敌对单位造成五分之一的伤害。
items.weapon.melee.fusion.trumpet.name=战争号角
items.weapon.melee.fusion.trumpet.desc=一件沉重的四阶铜管武器。每次命中都会对目标周围的敌对单位造成六分之一的伤害，代价是命中略低。
items.weapon.melee.fusion.nunchaku.name=双节棍
items.weapon.melee.fusion.nunchaku.desc=攻击迅速但单次伤害较低的三阶武器。每次命中有八分之一概率使目标短暂恍惚。
items.weapon.melee.fusion.prayerwheel.name=转经轮
items.weapon.melee.fusion.prayerwheel.desc=一件稳重的四阶武器，会在攻击中积蓄动能。每第八次攻击造成50%额外伤害，随后清空蓄力。
items.weapon.melee.fusion.windbottle.name=风瓶
items.weapon.melee.fusion.windbottle.desc=能够释放受控气流的三阶容器。每次命中有五分之一概率把可移动的目标击退一格。

items.armor.fusion.lifearmor.name=生命护甲
items.armor.fusion.lifearmor.desc=特别惊喜中的生命护甲经重新平衡后成为四阶护甲。它的最大格挡比鳞甲低1点，但每次真正受伤时有十二分之一概率恢复1点生命。
items.armor.fusion.catsharkarmor.name=猫鲨护甲
items.armor.fusion.catsharkarmor.desc=轻便的三阶混合护甲。最大格挡比锁甲低1点，作为交换，穿戴者的行动速度提高6%。

items.wands.fusion.wandofflow.name=涌流法杖
items.wands.fusion.wandofflow.staff_name=涌流魔杖
items.wands.fusion.wandofflow.ondeath=你被自己的涌流法杖击溃了...
items.wands.fusion.wandofflow.desc=这根_冰属性_法杖比普通法杖短，但顶端的小喷泉使它看起来和普通法杖一样高。
items.wands.fusion.wandofflow.typical_stats_desc=涌流通常造成_%1$d~%2$d点伤害_，并将大多数敌人击退。
items.wands.fusion.wandofflow.stats_desc=该法杖能向目标地点喷射强劲水流，造成_%1$d~%2$d点伤害_，击退目标并将其打湿。
items.wands.fusion.wandofflow.upgrade_stat_name_2=击退
items.wands.fusion.wandofflow.bmage_desc=战斗法师以涌流魔杖攻击麻痹目标时，会消耗麻痹并造成额外魔法伤害。
items.wands.fusion.wandofflow.eleblast_desc=涌流魔杖的元素风暴造成67%伤害并击退范围外沿的敌人。
items.wands.fusion.wandofblood.name=鲜血法杖
items.wands.fusion.wandofblood.staff_name=血契魔杖
items.wands.fusion.wandofblood.ondeath=你在血契中耗尽了自己的生命...
items.wands.fusion.wandofblood.charged=敌人的生命能量流入血契魔杖！
items.wands.fusion.wandofblood.desc=这根_暗属性_法杖能发射黑暗能量，如果法杖头上装饰用的小骷髅还不够直白地揭示这一点的话。
items.wands.fusion.wandofblood.stats_desc=该法杖会释放腐坏能量，造成_%1$d~%2$d点伤害_并用于治愈自身。
items.wands.fusion.wandofblood.upgrade_stat_name_1=盟友治疗
items.wands.fusion.wandofblood.upgrade_stat_name_2=自身护盾
items.wands.fusion.wandofblood.upgrade_stat_name_3=亡灵伤害
items.wands.fusion.wandofblood.bmage_desc=战斗法师攻击被魅惑的目标时会获得护盾，并免除下一次血契的生命消耗。
items.wands.fusion.wandofblood.eleblast_desc=血契魔杖的元素风暴会魅惑敌人、治疗盟友并伤害敌对亡灵。

items.rings.ring.starstone=星石戒指
items.rings.ring.moonstone=月石戒指
items.rings.fusion.ringofmagic.name=奥术戒指
items.rings.fusion.ringofmagic.stats=佩戴这枚戒指时，你的法强值会提升_%d_点。
items.rings.fusion.ringofmagic.upgrade_stat_name_1=法强加成
items.rings.fusion.ringofmagic.desc=你的法杖在这枚戒指散布的奥术力场中会变得更加强大。在30级时这枚戒指效果达到上限。
items.rings.fusion.ringofknowledge.name=学识戒指
items.rings.fusion.ringofknowledge.stats=佩戴这枚戒指时，你施法时有25%%的几率造成_%1$s_倍伤害，有_%2$s%%_的几率在击败敌人后获得额外掉落。
items.rings.fusion.ringofknowledge.upgrade_stat_name_1=法术暴击伤害
items.rings.fusion.ringofknowledge.upgrade_stat_name_2=额外掉落进度
items.rings.fusion.ringofknowledge.desc=这枚戒指提升了配戴者的意识，增加了他造成法术暴击的几率，并允许他在击败敌人时获得额外的战利品。在30级时这枚戒指效果达到上限。

items.artifacts.fusion.eyeofskadi.name=斯嘉蒂之眼
items.artifacts.fusion.eyeofskadi.ac_add=献祭
items.artifacts.fusion.eyeofskadi.ac_blast=耗竭-冰暴
items.artifacts.fusion.eyeofskadi.ac_curse=诅咒
items.artifacts.fusion.eyeofskadi.no_charge=冰眼尚未充能完毕。
items.artifacts.fusion.eyeofskadi.prompt=选择原石作为献祭素材
items.artifacts.fusion.eyeofskadi.need_charge=冰眼还没有准备好。
items.artifacts.fusion.eyeofskadi.full_charge=冰眼已经准备完毕。
items.artifacts.fusion.eyeofskadi.exp=目前能量%s。
items.artifacts.fusion.eyeofskadi.infuse_ore=冰眼熔化了原石。
items.artifacts.fusion.eyeofskadi.desc=极度罕见的古物，原由苍空之龙看管，因时空乱流流落至此。这只眼睛仿佛有生命一般，散发出可怕的气息。
items.artifacts.fusion.noomlincrown.name=诺姆林王冠
items.artifacts.fusion.noomlincrown.desc=来自宫殿深处，冰雪山峰上的王冠。冰寒之力早已消散，只留下他的宠物和这个破旧的王冠。\n即便这东西没有力量，但它依然被视为神器。

items.food.fusion.nut.name=节庆坚果
items.food.fusion.nut.eat_msg=坚果虽小，吃起来却很扎实。
items.food.fusion.nut.desc=从异界保存下来的节庆零食。食用后可恢复少量饱食度与生命，并有小概率获得短暂的树肤保护。

items.medicine.mendingtonic.name=修复补剂
items.medicine.mendingtonic.ac_drink=饮用
items.medicine.mendingtonic.mend=补剂持续修复着你的伤口。
items.medicine.mendingtonic.desc=一种经过谨慎稀释的异界恢复药剂。它的即时治疗能力弱于治疗药剂，能提供实用补给，但不会取代主地牢原有的核心治疗资源。
items.medicine.magicpill.name=奥术药丸
items.medicine.magicpill.ac_use=服用
items.medicine.magicpill.desc=在一段时间内提升法强。\n使用_2份肉，1份种子，1份药水_炼金
items.medicine.timepill.name=时之块
items.medicine.timepill.desc=提供加速和时之沙。\n使用_1份水，4份原石_炼金
items.medicine.pill.name=药丸
items.medicine.pill.ac_eat=服用
items.medicine.pill.desc=一种来自特别惊喜像素地牢的调制药物。
items.medicine.bluemilk.name=蓝奶伞
items.medicine.bluemilk.desc=这种蘑菇像浆果一样鲜嫩多汁，食用它可以大幅度加快你的行动速度和恢复速度。而它对其他生物的效果是降低。\n使用_1份水，1份蔬菜，1份阳春草种子_炼金
items.medicine.deathcap.name=致死帽
items.medicine.deathcap.desc=这种头上布满白斑的红色菌类肯定是具有致命效果的东西。希望它也会对其他生物有效。\n使用_1份水，1份蔬菜，1份毒草种子_炼金
items.medicine.earthstar.name=地裂星
items.medicine.earthstar.desc=这种菌类并不属于地球。它可能来自虚空...或死星什么的...反正不会是小马国。食用它会撕裂这片区域所有人的身体。\n使用_1份水，1份蔬菜，1份地缚根种子_炼金
items.medicine.foamedbeverage.name=发泡饮料
items.medicine.foamedbeverage.desc=一起哈啤！\n使用_2份水，1份蔬菜，1份种子，1份水果_炼金
items.medicine.goldenjelly.name=凝胶团
items.medicine.goldenjelly.desc=与其说这是一种菌类，倒不如说这是一袋种子。它是这种菌类的繁殖的表现:受到挤压后，大量的孢子飞向四周，减缓生物的移动的同时寄生目标。\n使用_1份水，1份蔬菜，1份风暴藤种子_炼金
items.medicine.greaterpill.name=生血丸
items.medicine.greaterpill.desc=回血。\n使用_1份水果，2份药水_炼金
items.medicine.greenspore.name=绿菌孢
items.medicine.greenspore.not_time=奇怪的能量流入了你的背包，但是什么也没发生。
items.medicine.greenspore.desc=露珠研究者培育出来的新品种蘑菇，相比其他蘑菇这个完全没有副作用，并且可以让露珠产出更加频繁。\n使用_1份水，1份蔬菜，1份集露草种子_炼金
items.medicine.hardpill.name=硬化药丸
items.medicine.hardpill.desc=在一段时间内提升防御。\n使用_2份肉，1份蔬菜，1份原石_炼金
items.medicine.jackolantern.name=灯笼球
items.medicine.jackolantern.desc=这种菌类含有大量的磷。当它受到外界挤压时它会将会把体内的磷成分以白磷的形式释放，从而引起大火甚至使其变成炼狱。\n使用_1份水，1份蔬菜，1份火焰花种子_炼金
items.medicine.lingpotion.name=澪祷星瓶
items.medicine.lingpotion.desc=一瓶来自澪的圣水，能极大提升使用者的能力。\n来自澪的回礼
items.medicine.musicpill.name=节奏药丸
items.medicine.musicpill.desc=在一段时间内提升自信。\n使用_2份肉，1份种子，1份原石_炼金
items.medicine.pixieparasol.name=单色块
items.medicine.pixieparasol.desc=一种有强烈致幻作用的菌类，食用后会使人振奋，同时使其他生物陷入睡眠状态。\n使用_1份水，1份蔬菜，1份夜梦花种子_炼金
items.medicine.powerpill.name=力量药丸
items.medicine.powerpill.desc=在一段时间内提升力量。\n使用_3份肉，1份蔬菜_炼金
items.medicine.realgarwine.name=雄黄酒
items.medicine.realgarwine.desc=提供火焰抗性和剧毒抗性。\n使用_1份水，1份烈焰花种子，1份地缚根种子_炼金
items.medicine.shootpill.name=神射药丸
items.medicine.shootpill.desc=在一段时间内提升射击力。\n使用_3份肉，1份种子_炼金
items.medicine.smashpill.name=增幅药丸
items.medicine.smashpill.desc=在一段时间内提升伤害。\n使用_2份肉，1份蔬菜，1份药水_炼金
items.medicine.timepill2.name=时之块-发条型
items.medicine.timepill2.desc=提供加速和时之发条。\n使用_1份水，4份原石_锻造

items.weapon.missiles.fusion.rocketmissile.name=火箭弹
items.weapon.missiles.fusion.rocketmissile.desc=四阶投掷弹药，最大伤害低于标枪，但命中时有四分之一概率使目标短暂燃烧。
items.weapon.missiles.fusion.tempestboomerang.name=风暴回旋镖
items.weapon.missiles.fusion.tempestboomerang.desc=伤害略低的四阶回旋镖，命中时有四分之一概率使目标短暂残废，并会按正常回旋镖规则返回。

items.food.fruit.blackberry.name=粉色浆果
items.food.fruit.blackberry.desc=野生浆果的一种，富含生命能量。食用后会快速恢复生命，还有几率短暂感知本层所有生物。
items.food.fruit.blueberry.name=蓝色浆果
items.food.fruit.blueberry.desc=充满知识的神秘浆果。食用后可获得先见效果，在探索时发现附近的地形、秘密与敌人。
items.food.fruit.cloudberry.name=红色浆果
items.food.fruit.cloudberry.desc=充满风之能量的轻盈浆果。食用后可加速并恢复生命，还有几率获得漂浮效果。
items.food.fruit.fullmoonberry.name=满月浆果
items.food.fruit.fullmoonberry.desc=野生浆果的一种，富含大量维生素和矿物质，这种浆果由于受到了月亮女神的祝福，食用后将给你提供十分强大的效果。
items.food.fruit.moonberry.name=青色浆果
items.food.fruit.moonberry.desc=充满力量的青蓝色浆果。食用后可暂时增强力量，还有几率使皮肤硬化。
items.food.fruit.strawberry.name=草莓
items.food.fruit.strawberry.desc=据说生长在宫殿境内最高山峰的稀有果实。食用后身体会轻盈到足以漂浮。
items.food.fruit.cherry.name=樱桃
items.food.fruit.cherry.desc=遗迹附近守卫植物结出的果实。它的果核极不稳定，食用后会化为一枚已点燃的炸弹。
items.food.fruit.durian.name=榴莲
items.food.fruit.durian.desc=坚果林的秘密武器之一。带刺的果肉会赋予食用者强韧的树肤保护。

items.food.vegetable.nutvegetable.name=坚果藤
items.food.vegetable.nutvegetable.desc=一种常用于烹饪的蔬菜。即使生食也很可口，并能提供少量护盾。
items.food.vegetable.healgrass.name=治疗草
items.food.vegetable.healgrass.desc=阳春草的一部分，可以食用。它能恢复生命并提供暂时的奥术防护。
items.food.vegetable.battleflower.name=星花瓣
items.food.vegetable.battleflower.desc=星陨花的一部分，可以食用。它能强化物理攻击，并提供祝福与奥术防护。
items.food.vegetable.dreamleaf.name=好梦叶
items.food.vegetable.dreamleaf.desc=夜梦草的一部分，可以食用。它能清除中毒等常见负面状态。
items.food.vegetable.truffles.name=松露
items.food.vegetable.truffles.desc=生长在地下的稀有甜味菌类。食用后可永久提高生命上限。
items.food.vegetable.brewleft.name=酿造残渣
items.food.vegetable.brewleft.desc=酿造后留下的可食用残渣。营养不多，但浪费食物更加可惜。

items.reddewdrop.name=红色露珠
items.reddewdrop.desc=红色的露珠。如果水袋无法继续收集，它会立即恢复中等量的生命。
items.violetdewdrop.name=紫色露珠
items.violetdewdrop.desc=罕见的紫色露珠。如果水袋无法继续收集，它会立即恢复大量生命。
items.yellowdewdrop.name=黄色露珠
items.yellowdewdrop.desc=黄色的露珠。如果水袋无法继续收集，它会立即恢复少量生命。

items.transmutationball.name=转换笼果实
items.transmutationball.ac_use=使用
items.transmutationball.prompt=选择一件未装备的物品进行转换
items.transmutationball.desc=转换笼结出的果实。它无需消耗卷轴，就能转换一件未装备的物品。
items.upgradeeatball.name=吞星花果实
items.upgradeeatball.ac_use=使用
items.upgradeeatball.prompt=选择一件未装备的物品进行提炼
items.upgradeeatball.desc=吞星花结出的果实。它会摧毁一件物品，并尝试将其中的强化提炼为精华。
items.upgradeblob.prompt=选择一件未装备的物品进行强化
items.upgradeblob.applied=你的%s吸收了%d级强化精华。
items.upgradeblobyellow.name=黄色强化精华
items.upgradeblobyellow.ac_apply=使用
items.upgradeblobyellow.desc=吞星花产生的黄色残余物。将其用于物品可提升一个等级。
items.upgradeblobred.name=红色强化精华
items.upgradeblobred.ac_apply=使用
items.upgradeblobred.desc=吞星花产生的红色残余物。将其用于物品可提升三个等级。
items.upgradeblobviolet.name=紫色强化精华
items.upgradeblobviolet.ac_apply=使用
items.upgradeblobviolet.desc=吞星花产生的罕见紫色残余物。将其用于物品可提升五个等级。

items.potions.potionofmending.name=恢复药水
items.potions.potionofmending.desc=以坚果藤种子酿成的恢复药水。它能清除常见异常状态，并持续修复大量生命。
items.potions.potionofmight.name=根骨药水
items.potions.potionofmight.desc=以转换笼种子酿成的强身药水。它能暂时提高生命上限，并提供持久的物理防护。
items.potions.potionofmixing.name=调和药水
items.potions.potionofmixing.skillup=你的战斗本能得到提升，魔法装备也开始加速充能。
items.potions.potionofmixing.desc=以种荚种子酿成的稀有药水。它能永久提升命中与闪避，并暂时加快魔法充能。
items.potions.potionofshield.name=护盾药水
items.potions.potionofshield.desc=以硅花种子酿成的防御药水。饮用后获得物理护盾与奥术护甲，溅出的药液还能使生物短暂麻痹。
items.potions.potionofoverhealing.name=生命药水
items.potions.potionofoverhealing.desc=以吞星花种子酿成的强效药水。它能清除异常、回满生命并持续治疗，将溢出的活力转化为护盾。

items.quest.mushroom.name=露珠菌孢
items.quest.mushroom.desc=这种罕见菌孢生长在潮湿的地牢中，对等候在入口附近的研究者很有价值。

items.puddingcup.name=巧克力布丁
items.puddingcup.ac_save=记忆
items.puddingcup.saved=这一刻已经被保存。
items.puddingcup.desc=美味的布丁可以使你记住这一美好的瞬间，但仅仅是这一瞬间而已。

items.saveyourlife.name=紧急离线装置
items.saveyourlife.ac_save=离线
items.saveyourlife.desc=这是什么，这不应该在非测试模式下出现。

items.testcloak.name=实验斗篷
items.testcloak.ac_use=使用
items.testcloak.desc=一件阳说制作的斗篷，一次性使用。

items.waterskin.mode_random=露珠研究者已将水袋调整为_祝福强化_模式。
items.waterskin.mode_accurate=露珠研究者已将水袋调整为_精确强化_模式。
items.waterskin.ac_water=种植
items.waterskin.ac_splash=加速
items.waterskin.ac_bless=强化
items.waterskin.ac_pour=清洗
items.waterskin.ac_peek=侦测
items.waterskin.ac_refine=提纯
items.waterskin.peeked=露珠短暂揭示了本层的所有生物。
items.waterskin.watered=植物在你周围生长。
items.waterskin.blessed=神秘的能量强化了你的装备。
items.waterskin.select=选择一件要强化的物品
items.waterskin.upgraded=你的%1$s获得了%2$d级强化。
items.waterskin.fly=你漂浮到了空中！
items.waterskin.no_charge=你的露珠瓶空了！
items.waterskin.fast=你的移动速度大幅提升了！
items.waterskin.poured=你用露水清洗了身躯，驱散了多种负面效果。
items.waterskin.refined=露珠被提纯成了洁净的水。
items.waterskin.desc_ex=露珠瓶的无限溢出池中额外储存了_%d点露珠_。这些露珠可用于侦测、种植、强化和提纯。
items.waterskin.desc_v1=露珠瓶v1提供强化和种植功能。
items.waterskin.desc_v2=露珠瓶v2提供清洗和加速功能。
items.waterskin.desc_v3=露珠瓶v3将基础容量提升至200，并使加速附带漂浮。
items.waterskin$dewlight.name=露珠微光
items.waterskin$dewlight.desc=每20回合将1点普通露珠转化为光亮，保护你免受黑暗侵袭。
items.vialupdater.name=露珠强化器
items.vialupdater.ac_use=使用
items.vialupdater.desc=扩容，然后解锁露珠瓶的最终能力。
items.food.wateritem.name=水
items.food.wateritem.desc=通过露珠瓶净化后的水，可以用于烹饪。
items.reward.boundreward.name=清层奖励
items.reward.boundreward.desc=在露珠规定时间内消灭本层所有初始敌人获得的奖励。你可以选择一类奖品。
items.reward.boundreward.ac_weapon=装备
items.reward.boundreward.ac_food=补给
items.reward.boundreward.ac_potion=魔法物品

items.keys.spsskeletonkey.name=骷髅钥匙
items.keys.spsskeletonkey.desc=一把形似骷髅的钥匙，可以解锁本章过渡层的出口。
items.keys.goldenskeletonkey.name=水晶钥匙
items.keys.goldenskeletonkey.desc=这个水晶钥匙上的凹刻在不断地变换和移动，仿佛活的一样。或许它能用来打开某种宝箱锁？

items.weapon.missiles.arrows.glassfruit.name=水晶果
items.weapon.missiles.arrows.glassfruit.desc=硅花人工培育出的水晶果。直接命中会使目标严重流血；未命中时，果实会破裂并释放一小团腐蚀气体。
items.garbage.name=垃圾
items.garbage.desc=锻造失败留下的废料。五份垃圾可以在铁砧上重新锻造。

items.brewed.brewed.name=酿制无味果
items.brewed.brewed.ac_eat=食用
items.brewed.brewed.raw=这个果实还需要和一颗种子一起烹煮。
items.brewed.brewed.sunfruit=阳光果
items.brewed.brewed.rotfruit=鲜美果
items.brewed.brewed.earthfruit=大地果
items.brewed.brewed.blindfruit=目盲果
items.brewed.brewed.firefruit=火焰果
items.brewed.brewed.icefruit=冰霜果
items.brewed.brewed.fadefruit=渐隐果
items.brewed.brewed.sorrowfruit=忧伤果
items.brewed.brewed.stormfruit=暴风果
items.brewed.brewed.dreamfruit=梦乡果
items.brewed.brewed.starfruit=星陨果
items.brewed.brewed.mightfruit=决心果
items.brewed.brewed.heartfruit=生命果
items.brewed.brewed.nutfruit=坚果果
items.brewed.brewed.mixfruit=混合果
items.brewed.brewed.strfruit=力量果
items.brewed.brewed.glassfruit=水晶玻璃果
items.brewed.brewed.ice_msg=这个冰霜果尝起来有点冰冻生肉片的感觉。
items.brewed.brewed.fire_msg=你感觉到体内有一股烈焰在熊熊燃烧！
items.brewed.brewed.toxic_msg=你被灌注了强大的毒素力量！
items.brewed.brewed.para_msg=你感到大地的力量在体内奔腾！
items.brewed.brewed.desc=尚未烹制的无味果。
items.brewed.brewed.desc_cooked=这个果实已经因为吸收锅中的汤而鼓胀，并且吸收了其中种子的属性。\n\n看起来已经可以吃了！

items.stoneore.name=原石
items.stoneore.desc=很普通的石头，可以用于烹饪和锻造，也可以拿去卖钱。

items.greatrune.name=附魔符文
items.greatrune.ac_inscribe=附魔
items.greatrune.prompt=选择一件要附魔的装备
items.greatrune.weapon=为这件武器选择一个附魔。
items.greatrune.armor=为这件护甲选择一个刻印。
items.greatrune.cancel=放弃附魔
items.greatrune.item=你完成了附魔。
items.greatrune.desc=为武器或护甲随机提供三种附魔供你选择。它可以用磨刀石和奥术刻笔锻造而成。

items.summon.activemrdestructo.name=毁灭无人引擎
items.summon.activemrdestructo.ac_active=使用
items.summon.activemrdestructo.desc=毁灭无人机是矮人科技和恶魔能量制作出来的一种自律型炮塔。这东西只能使用一次。
items.summon.activemrdestructo$mrdestructo.name=毁灭无人机
items.summon.activemrdestructo$mrdestructo.desc=你启动了这个装置。它会用射线攻击附近的生物，每次命中也会损耗自身。
items.summon.activemrdestructo$mrdestructo2dot0.name=毁灭无人机2.0
items.summon.activemrdestructo$mrdestructo2dot0.desc=领袖的力量强化了这个装置，使它更加耐用，射线也更强。
items.summon.fairycard.name=仙女卡片
items.summon.fairycard.ac_active=使用
items.summon.fairycard.desc=进行一次抽卡，并召唤一只仙女。
items.summon.fairycard$fairy.name=生命仙女
items.summon.fairycard$fairy.desc=一只寿命短暂的仙女，会跟随你并治疗附近的伤口。
items.summon.fairycard$sugarplumfairy.name=术士仙女
items.summon.fairycard$sugarplumfairy.desc=被领袖之力强化的仙女，既能治疗主人，也能攻击附近的敌人。
items.summon.mobile.name=遥控卫星
items.summon.mobile.ac_active=使用
items.summon.mobile.desc=用于呼叫一个小型闪电卫星。
items.summon.mobile$mobilesatellite.name=蓝色卫星
items.summon.mobile$mobilesatellite.desc=这个东西貌似出现在外星飞船中，速度很快但寿命有限。
items.summon.mobile$exmobilesatellite.name=红色卫星
items.summon.mobile$exmobilesatellite.desc=由领袖改制的蓝色卫星，有更强的耐久、更高的射速和伤害。
items.food.smallmeat.name=肉干
items.food.smallmeat.desc=肉类的终极形态，丧失了肉质和肉量，但依然可以用于烹饪。
items.towel.name=湿巾
items.towel.desc=湿巾是一项十分便利的发明。它虽然使用次数有限，但可以清除多种异常状态。
items.towel.ac_towel=使用
items.towel.apply=你使用了湿巾。
items.towel.end=这块湿巾没法再用了。

items.misc.spectacles.name=眼镜
items.misc.spectacles.desc=十分普通的眼镜，但是能够强化使用者的灵能。

items.scrolls.scrollofmagicalinfusion.name=魔力灌注卷轴
items.scrolls.scrollofmagicalinfusion.desc=这张卷轴能在保留并强化附魔的同时升级一件武器或护甲。
items.scrolls.scrollofmagicalinfusion.inv_title=选择要灌注的物品
items.scrolls.scrollofmagicalinfusion.infuse=你的%s充满了魔力。
items.scrolls.scrollofregrowth.name=再生卷轴
items.scrolls.scrollofregrowth.desc=这张卷轴会用富有生机的水覆盖周围地面，并催生出多株植物。
items.scrolls.scrollofpsionicblast.name=灵能汲取卷轴
items.scrolls.scrollofpsionicblast.ondeath=灵能震爆撕碎了你的意识……
items.scrolls.scrollofpsionicblast.desc=这张卷轴蕴含神秘的能量，一旦引导出来将吸取视野内所有生物的心灵，并提升使用者的灵能。

items.misc.autopotion.name=自动药剂
items.misc.autopotion.desc=一瓶可以装备的奇特药剂。原版中自动治疗的附魔并没有实际生效。

items.knowledgebook.name=知识之书
items.knowledgebook.desc=记录了许多异常地点的书。阅读后会打开异界日志。
items.knowledgebook.ac_read=阅读

items.eggs.egg.name=魔物之魂
items.eggs.egg.desc=一个怪物的灵魂。根据吸收能量的不同，产生的结果也会不同。
items.eggs.egg.ac_break=召唤
items.eggs.egg.prevent=这里不是尝试召唤它的最佳地点。
items.eggs.egg.notready=你的宠物还没有准备好和其他宠物相处。
items.eggs.egg.yolk=一些能量四下流散。
items.eggs.egg.hatch=新的宠物诞生！
items.eggs.egg.warmhome=这个灵魂在你温暖的背包里吸收能量。
items.eggs.egg.onlyone=只有一个灵魂能在背包里面吸收能量。
