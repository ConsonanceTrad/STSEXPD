items.elevator.ac_down=下楼
items.weapon.missiles.shitball.name=污团
items.weapon.missiles.shitball.desc=这个东西装满了污物。扔到空地上会发出巨响，使视野内附近的怪物失明并将其引来；直接命中还会造成衰老与焦油效果。
items.weapon.melee.spork.name=皇家叉勺
items.weapon.melee.spork.desc=鼠王遗失的宝物。它那荒唐却锋利的边缘会在命中时为持有者恢复少量生命。
items.food.bugmeat.name=稽生虫
items.food.bugmeat.desc=占据背包空间的寄生虫，无法丢弃或投掷，会周期性使你减速；吃掉它会永久损失1点生命上限。
items.food.bugmeat.eat_msg=你强忍恶心吞下了寄生虫。
items.expore.name=经验之石
items.expore.ac_use=使用
items.expore.desc=使用后立刻获得足以提升一级的经验，并使宠物等级提高一级。
items.leveldown.name=成长核心
items.leveldown.ac_use=使用
items.leveldown.desc=使用后立刻降低一级，但不会使等级低于1级。
items.bombs.dungeonbomb.name=地牢炸弹
items.bombs.dungeonbomb.desc=装填大量黑火药的炸弹，会伤害附近所有目标并摧毁相邻墙壁。
items.bombs.dungeonbomb$doublebomb.name=一对地牢炸弹
items.bombs.dungeonbomb$doublebomb.desc=两枚重型地牢炸弹，看起来第二枚是免费赠送的。

items.misc.missileshield.name=神木圆盾
items.misc.missileshield.ac_cast=扔出
items.misc.missileshield.ac_shield=防御
items.misc.missileshield.rest=体力不足。
items.misc.missileshield.prompt=选择要瞄准的地方
items.misc.missileshield.desc=一块普通的木质盾牌，上面有一些刮痕。\n这块盾牌被打磨得十分光滑，可以将其投掷出去，消耗体力并击晕敌人。\n也可以将其举起，以减少受到的伤害。
items.misc.missileshield.damage=这块盾牌可以造成_%d-%d点伤害_，并对首领再次造成等量伤害。
items.misc.missileshield.charge=剩余体力%d / %d。
items.misc.potionofmage.name=奇迹烧瓶
items.misc.potionofmage.ac_use=施放
items.misc.potionofmage.ac_drink=饮用
items.misc.potionofmage.ac_shattered=泼洒
items.misc.potionofmage.prompt=选择要瞄准的地方
items.misc.potionofmage.break=现在烧瓶里什么都没有。
items.misc.potionofmage.charge=质量%d / %d。
items.misc.potionofmage.desc=法师多年研究成果之一，可以对自身使用来施加增益效果，也可以泼洒出去造成减益效果。
items.weapon.rockcode.gleaf.name=缠绕触须
items.weapon.rockcode.gleaf.desc=来自下水道之心的能力，向一个地方释放缠绕触须。
items.weapon.rockcode.gleaf.stats_desc=消耗4点能量中的1点，造成随英雄等级提高的自然伤害，并有概率使目标中毒、缠绕，在落点长出枯草。
items.weapon.rockcode.dpotion.name=暗黑药水
items.weapon.rockcode.dpotion.desc=来自瘟疫医生的能力，向一个地方投掷黑暗药水。
items.weapon.rockcode.dpotion.stats_desc=消耗4点能量中的1点，造成随英雄等级提高的黑暗伤害，并有概率施加延迟爆发的暗影诅咒。
items.item.reinforced=这件物品已用精金破阶，可以突破通常的强化上限。
items.skillbook.name=职业技能书
items.skillbook.ac_apply=使用
items.skillbook.desc=阅读后会生成一本与当前职业对应、可反复使用的职业技能。
items.skillbook.not_ready=这个职业的技能仍在复刻中，技能书没有被消耗。
items.skillbook.no_space=背包里没有容纳职业技能的空间。
items.skills.classskill.charge=冷却：%d。
items.skills.classskill.cooldown=职业技能仍在冷却中。
items.skills.classskill.level_required=这项技能将在%d级解锁。
items.skills.rogueskill.name=盗贼技能
items.skills.rogueskill.ac_special=暗影刺杀
items.skills.rogueskill.ac_special_two=探云手
items.skills.rogueskill.ac_special_three=宝石打磨
items.skills.rogueskill.ac_special_four=信仰之跃
items.skills.rogueskill.desc=盗贼可以施展四项职业技能。\n\n_暗影刺杀：_进入隐身，随机获得一项伤害增益，并压制附近视野内的敌人。达到56级后同时获得所有伤害增益。\n\n_探云手（21级）：_从敌人身上夺取特殊物品，并通过近战攻击获得金币。达到56级后两种效果的持续时间翻倍。\n\n_宝石打磨（31级）：_制作一枚已鉴定的+5戒指。达到56级后戒指同时破阶。\n\n_信仰之跃（41级）：_在障碍物旁为下一次攻击蓄力。达到56级后蓄力期间同时隐身。
items.skills.warriorskill.name=战士技能
items.skills.warriorskill.ac_special=武装
items.skills.warriorskill.ac_special_two=决斗
items.skills.warriorskill.ac_special_three=圣盾术
items.skills.warriorskill.ac_special_four=奇袭战术
items.skills.warriorskill.desc=_武装：_生成一件+5武器或防具，并暂时提高2点力量。达到56级后同时生成两件并将其破阶。\n\n_决斗（21级）：_削弱附近敌人，并缴械、沉默视野内的远处敌人。达到56级后大幅强化自身攻防。\n\n_圣盾术（31级）：_治疗伙伴，获得物理护盾，伤害相邻敌人并清除部分负面状态。达到56级后额外获得魔法与能量护盾。\n\n_奇袭战术（41级）：_获得鲜血灌注，并对满血或濒死敌人造成额外伤害。达到56级后永久获得1点生命上限，并暂时提高20%%生命上限。
items.skills.mageskill.name=法师技能
items.skills.mageskill.ac_special=混沌风暴
items.skills.mageskill.ac_special_two=灵魂虹吸
items.skills.mageskill.ac_special_three=时空之门
items.skills.mageskill.ac_special_four=引雷
items.skills.mageskill.desc=_混沌风暴：_对附近视野内的所有敌人造成七种元素之一的伤害并施加对应状态。达到56级后同时烧毁自身四角的墙壁。\n\n_灵魂虹吸（21级）：_击杀敌人会永久增加生命上限，同时暂时提高20%%生命上限。达到56级后冷却减半。\n\n_时空之门（31级）：_传送并失去1级和10点永久生命上限。达到56级后不再损失生命上限。\n\n_引雷（41级）：_生成一根已鉴定的+5法杖并获得充能。达到56级后法杖同时破阶。
items.skills.huntressskill.name=猎手技能
items.skills.huntressskill.ac_special=狩猎本能
items.skills.huntressskill.ac_special_two=遗迹之光
items.skills.huntressskill.ac_special_three=自然之助
items.skills.huntressskill.ac_special_four=战争古树
items.skills.huntressskill.desc=_狩猎本能：_获得瞄准射击、针刺和一种随机元素灌注。达到56级后同时获得全部元素灌注。\n\n_遗迹之光（21级）：_获得一个露珠奖励包。达到56级后破阶首件符合条件的装备。\n\n_自然之助（31级）：_获得三件投射武器并召唤一只精灵。达到56级后召唤更强的糖梅精灵。\n\n_战争古树（41级）：_缠绕附近视野内的敌人并使其寄生，随后召唤战争古树。
items.skills.performerskill.name=演员技能
items.skills.performerskill.ac_special=奇异舞步
items.skills.performerskill.ac_special_two=谢幕礼花
items.skills.performerskill.ac_special_three=魔术手法
items.skills.performerskill.ac_special_four=市场研习
items.skills.performerskill.desc=_奇异舞步：_魅惑并狂乱视野内的全部敌人，同时强化自身。达到56级后冷却减半。\n\n_谢幕礼花（21级）：_伤害、致盲并减速视野内的全部敌人，在其脚下种下种子。达到56级后额外获得一枚炸弹。\n\n_魔术手法（31级）：_转换一件选中的装备。达到56级后额外获得一个转换球。\n\n_市场研习（41级）：_击杀50个敌对单位后，永久提高攻击、闪避、魔力和生命上限。达到56级后提升翻倍。
items.skills.soldierskill.name=星兵技能
items.skills.soldierskill.ac_special=自爆幻影
items.skills.soldierskill.ac_special_two=召唤机甲
items.skills.soldierskill.ac_special_three=战斗号召
items.skills.soldierskill.ac_special_four=空投补给
items.skills.soldierskill.desc=_自爆幻影：_生成两个会在被摧毁时爆炸的战斗幻影。达到56级后同时清除部分负面状态。\n\n_召唤机甲（21级）：_获得机械护甲和物理护盾。达到56级后两者翻倍。\n\n_战斗号召（31级）：_获得随机物品或召唤物。达到56级后必定获得召唤物。\n\n_空投补给（41级）：_向自身四角投放投射武器和食物。达到56级后食物品质提高。
items.skills.soldierskill$seekingbomb.name=砰砰机器人
items.skills.soldierskill$seekingbomb.desc=携带炸药的战斗幻影，被摧毁时会发生爆炸。
items.skills.soldierskill$seekinghugebomb.name=砰砰砰砰机器人
items.skills.soldierskill$seekinghugebomb.desc=领袖强化过的自爆幻影，被摧毁时会连续爆炸两次。
items.skills.followerskill.name=信徒技能
items.skills.followerskill.ac_special=祈祷
items.skills.followerskill.ac_special_two=资金募集
items.skills.followerskill.ac_special_three=渎神
items.skills.followerskill.ac_special_four=祝福术
items.skills.followerskill.desc=_祈祷：_保持原地会逐回合提高攻击与伤害减免，强度过高后消耗金币。达到56级后蓄力速度翻倍。\n\n_资金募集（21级）：_召集全部生物，并根据其数量获得随机施舍。达到56级后同时获得金币。\n\n_渎神（31级）：_消耗40点永久生命上限，换取力量、攻击、闪避、魔力和永久伤害提升。达到56级后获得两层伤害提升。\n\n_祝福术（41级）：_强化一件选中的装备。达到56级后同时解除其诅咒。
items.skills.asceticskill.name=修士技能
items.skills.asceticskill.ac_special=超频
items.skills.asceticskill.ac_special_two=能量灌注
items.skills.asceticskill.ac_special_three=重编程
items.skills.asceticskill.ac_special_four=地震
items.skills.asceticskill.desc=_超频：_速度翻倍并提高攻击伤害，但受到的伤害略微增加。达到56级后没有冷却。\n\n_能量灌注（21级）：_生成一个高级符文。达到56级后额外生成随机物品。\n\n_重编程（31级）：_消耗1点攻击和闪避，换取2点魔力。达到56级后额外随机获得1点战斗属性。\n\n_地震（41级）：_摧毁附近墙壁、伤害敌人，并在自身周围建造门。达到56级后额外致盲并扰乱敌人。
items.weapon.missiles.buildblock.doorblock.name=造门方块
items.weapon.missiles.buildblock.doorblock.desc=将方块投向无人占据的格子，可在那里建造一扇门。水井、楼梯、炼金釜与精金制造器无法被覆盖。
items.weapon.missiles.buildblock.plantpotblock.name=种植盆
items.weapon.missiles.buildblock.plantpotblock.desc=将方块投向无人占据的格子，可在那里放置一个能够栽种植物的花盆。水井、楼梯、炼金釜与精金制造器无法被覆盖。
items.bags.shoppingcart.name=购物车
items.bags.shoppingcart.desc=容量很大的购物车，可以收纳食物和酿造药剂，但不能装入虫肉。
items.bombs.lightbomb.name=圣光炸弹
items.bombs.lightbomb.desc=这枚炸弹会释放灼目的圣光，使附近的一切陷入盲目，并对亡灵、恶魔与无机造物造成额外伤害。
items.bombs.fishingbomb.name=鱼饵炸弹
items.bombs.fishingbomb.desc=这枚炸弹会把附近的敌对生物转移到干燥地面。
items.bombs.fishingbomb.no_tp=这里已经没有可用的干燥地面了。
items.bombs.fishingbomb.tp=有什么东西被拉到了干燥地面。
items.wands.wandofacid.name=酸蚀法杖
items.wands.wandofacid.desc=这根地属性法杖的紫色主干半包住顶端一颗亮绿色宝石。
items.wands.wandofacid.stats_desc=被使用时，这根法杖会释放出翠绿的强酸，造成_%1$d~%2$d点伤害_并有概率使被命中的敌人持续受到酸蚀伤害。
items.wands.wandoffreeze.name=霜冻法杖
items.wands.wandoffreeze.desc=这根冰属性法杖似乎由某种魔法冰块制成。它的圆顶闪着亮光。握起来很冰，但不知为何你的手仍保持着温暖。
items.wands.wandoffreeze.stats_desc=该法杖能向敌人射击冰霜能量，造成_%1$d~%2$d点伤害_并施加冻伤；目标位于水中时有概率被彻底冻结，已经冻结的目标不受影响。
items.wands.wandoffirebolt.name=火球法杖
items.wands.wandoffirebolt.desc=这根火属性法杖由红漆木制成，饰以金叶，这使它看起来相当庄严。它的顶端噼啪作响、嘶嘶而鸣，渴望释放强大的魔法。
items.wands.wandoffirebolt.stats_desc=该法杖会发射一枚火球，造成_%1$d~%2$d点伤害_，使目标燃烧5回合并点燃落点。
items.wands.wandoflight.name=强光法杖
items.wands.wandoflight.desc=这根光属性法杖由一块实心半透明水晶构成，就像一块厚长光滑的玻璃。细小的彩光在法杖尖端跃动。
items.wands.wandoflight.stats_desc=该法杖会发射一道穿墙光线，造成_%1$d~%2$d点伤害_并可能致盲目标，对亡灵与恶魔造成更高伤害。
items.wands.wandofswamp.name=沼泽法杖
items.wands.wandofswamp.desc=这根地属性法杖由一根枯木枝巧琢而成。不知为何它还活着。
items.wands.wandofswamp.stats_desc=该法杖能射出一颗会在目标位置爆炸的沼泽法球，造成_%1$d~%2$d点伤害_并释放沼泽气体，使其中的生物易伤且越来越迟缓。
items.wands.wandofcharm.name=魅惑法杖
items.wands.wandofcharm.desc=这根光属性法杖形状很普通，是暗红的色泽和镶在顶端的漆黑宝石让它显眼起来。
items.wands.wandofcharm.stats_desc=该法杖会消耗当前一半充能，使敌人陷入狂乱，并暂时无法直接攻击施法者。
items.wands.wandofflock.name=招羊法杖
items.wands.wandofflock.desc=这根暗属性法杖看起来就像普通木棍一样，但两头的金色饰物使它看起来并不普通。
items.wands.wandofflock.stats_desc=该法杖会在目标地点召唤一只持续_2加法杖等级_回合的魔法绵羊。它能阻挡移动，并会在受到攻击时以暗属性伤害反击。
items.wands.wandofflock.guard=魔法引起了智慧守卫的注意。
items.wands.wandofflock$magicsheep.name=魔法绵羊
items.wands.wandofflock$magicsheep.desc=这是一只杀不死的魔法绵羊。它只会站在那里直到消失，并在受到攻击时反击。
items.wands.wandofflock$magicbombsheep.name=BABA
items.wands.wandofflock$magicbombsheep.desc=LEVEL_TOO_HARD，BABA_IS_DONE。BETTER_LOOK_OUT，BABA_HAS_GUN。
items.wands.wandofmeteorite.name=陨星法杖
items.wands.wandofmeteorite.desc=这根火属性法杖由一种陨石制成，嵌有金饰并在顶部镶着一颗浑圆的黑陨石。它在你手中的感觉非常沉重。
items.wands.wandofmeteorite.stats_desc=该法杖会在目标位置召唤陨石，撞击造成_%1$d~%2$d点伤害_，随后对3×3范围再造成一次较低伤害。撞击可能使目标麻痹，并烧焦可燃地形。
items.wands.wandoferror.name=错误法杖
items.wands.wandoferror.desc=这是个错误。
items.wands.wandoferror.stats_desc=？？？
items.wands.wandoferror.no_teleport=传送效果找不到可用的落点。
items.wands.wandoferror.teleported=%1$s把%2$s传送到了别处。
items.wands.wandoferror.nothing=什么也没有发生。
items.wands.wandoftcloud.name=雷云法杖
items.wands.wandoftcloud.desc=这根_电属性_法杖由一种导电金属制成，法杖顶端有一朵迷你乌云。很庆幸的是，握在手上并不会令人难受。
items.wands.wandoftcloud.stats_desc=这根法杖能在目标地点制造电流。充能达到十点时，则会召唤一朵自动攻击的雷云。
items.wands.wandoftcloud.more_charge=目前的充能数无法召唤雷云。
items.wands.wandoftcloud$tcloud.name=雷云
items.wands.wandoftcloud$tcloud.desc=一朵噼啪放电、会自动攻击敌人的雷云。
items.wands.wandoftcloud$stcloud.name=KEKE
items.wands.wandoftcloud$stcloud.desc=KEKE_IS_MOVE，MOB_WILL_DEAD。
items.weapon.melee.normalweapon.normalmeleeweapon.sps_stats=这件武器的命中倍率为_%1$s_，攻击延迟为_%2$s_，攻击距离为_%3$d_。
items.weapon.melee.normalweapon.dagger.name=匕首
items.weapon.melee.normalweapon.dagger.desc=配以磨损木柄的简单钢匕首。——Watabou \n穿刺
items.weapon.melee.normalweapon.knuckles.name=指虎
items.weapon.melee.normalweapon.knuckles.desc=基本上就是带有钢刃的指节套。——Watabou \n致残
items.weapon.melee.normalweapon.shortsword.name=短剑
items.weapon.melee.normalweapon.shortsword.desc=它确实相当短，不比一把匕首长出几英寸。——Watabou \n割裂
items.weapon.melee.normalweapon.magebook.name=魔典
items.weapon.melee.normalweapon.magebook.desc=一本法师高塔里的厚重魔典。内容十分难懂。——Coconut \n钝器
items.weapon.melee.normalweapon.handaxe.name=手斧
items.weapon.melee.normalweapon.handaxe.desc=一把轻斧头，通常用来砍树。当然，它的宽刃对敌人来说同样有效。——00-Evan \n割裂
items.weapon.melee.normalweapon.spear.name=长矛
items.weapon.melee.normalweapon.spear.desc=这是一根装着锋锐铁刺的细长木杆。——Watabou \n致残
items.weapon.melee.normalweapon.dualknive.name=对剑
items.weapon.melee.normalweapon.dualknive.desc=成对的刀片带来更高的伤害。——Bilboldev \n穿刺
items.weapon.melee.normalweapon.fightgloves.name=战斗拳套
items.weapon.melee.normalweapon.fightgloves.desc=简单的皮革加上金属尖块形成了这样一件武器。——Juh9870 \n钝器
items.weapon.melee.normalweapon.nunchakus.name=双截棍
items.weapon.melee.normalweapon.nunchakus.desc=两根粗短的木棍被结实的绳索连接，形成了这么一件武器。——Hmdzl001 \n高级钝器
items.weapon.melee.normalweapon.scimitar.name=弯刀
items.weapon.melee.normalweapon.scimitar.desc=一把厚重的弯刀。它的形状能让它进行更快但不甚强力的攻击。——00-Evan \n高级割裂
items.weapon.melee.normalweapon.whip.name=长鞭
items.weapon.melee.normalweapon.whip.desc=虽然这把武器另一端带倒刺的绳子伤害不高，但它的攻击范围是数一数二的。——00-Evan \n高级致残
items.weapon.melee.normalweapon.rapier.name=刺剑
items.weapon.melee.normalweapon.rapier.desc=一件又细又长又尖的武器。——Snof33 \n高级穿刺
items.weapon.melee.normalweapon.assassinsblade.name=暗杀之刃
items.weapon.melee.normalweapon.assassinsblade.desc=黑曜石制的波浪形短刃，虽轻便但不易用，如果能击中要害足以致命。——00-Evan \n穿刺
items.weapon.melee.normalweapon.battleaxe.name=战斧
items.weapon.melee.normalweapon.battleaxe.desc=这把有着硕大钢制头部的战斧能将庞大的力量倾注在每次挥舞之中。——Watabou \n割裂
items.weapon.melee.normalweapon.glaive.name=关刀
items.weapon.melee.normalweapon.glaive.desc=由一支长木杆和末端接上的利刃组成。——Watabou \n致残
items.weapon.melee.normalweapon.club.name=棒槌
items.weapon.melee.normalweapon.club.desc=一件简单而沉重的木质武器。——Snof33 \n钝器
items.weapon.melee.normalweapon.gsword.name=巨剑
items.weapon.melee.normalweapon.gsword.desc=这把大剑进行的每次沉重挥舞都能造成大量伤害。——00-Evan \n割裂
items.weapon.melee.normalweapon.halberd.name=戟斧
items.weapon.melee.normalweapon.halberd.desc=长枪和战斧组合而成的武器。——Consideredhamster \n致残
items.weapon.melee.normalweapon.warhammer.name=战锤
items.weapon.melee.normalweapon.warhammer.desc=很少有生物能抵挡这铅铁巨块的辗压，但也只有最强壮的冒险者才能有效使用它。——Watabou \n钝器
items.weapon.melee.normalweapon.lance.name=骑士枪
items.weapon.melee.normalweapon.lance.desc=结实的铁棒连接着巨大圆锥，形成了这么一件武器。——Hmdzl001 \n穿刺
items.weapon.enchantments.enchantmentdark.name=暗影%s
items.weapon.enchantments.enchantmentdark.desc=暗影附魔将造成大量的暗属性伤害，并有几率恐吓目标。
items.weapon.enchantments.enchantmentfire.name=烈焰%s
items.weapon.enchantments.enchantmentfire.desc=烈焰附魔将造成少量的火属性伤害，并有几率点燃目标。
items.weapon.enchantments.enchantmentlight.name=闪耀%s
items.weapon.enchantments.enchantmentlight.desc=闪耀附魔将造成大量的光属性伤害，并有几率致盲。
items.weapon.enchantments.enchantmentenergy.name=战意%s
items.weapon.enchantments.enchantmentenergy.desc=战意附魔将造成少量的无属性伤害，并提升使用者的攻击力。
items.weapon.enchantments.enchantmentearth.name=自然%s
items.weapon.enchantments.enchantmentearth.desc=自然附魔将造成大量的地属性伤害，并有几率对目标埋下寄生种子。
items.weapon.enchantments.enchantmentshock.name=乱流%s
items.weapon.enchantments.enchantmentshock.desc=乱流附魔将造成大量的雷属性伤害，并对多个目标造成伤害。
items.weapon.enchantments.enchantmentice.name=寒潮%s
items.weapon.enchantments.enchantmentice.desc=寒潮将造成大量的冰属性伤害，并有几率给目标施加寒冷和潮湿效果。
items.weapon.enchantments.enchantmentice2.name=冰霜%s
items.weapon.enchantments.enchantmentice2.desc=冰霜附魔将造成少量的冰属性伤害，并几率冻伤目标。
items.weapon.enchantments.enchantmentdark2.name=咒术%s
items.weapon.enchantments.enchantmentdark2.desc=咒术附魔将造成少量的暗属性伤害，并有几率咒杀目标。
items.weapon.enchantments.enchantmentfire2.name=焦油%s
items.weapon.enchantments.enchantmentfire2.desc=焦油附魔将造成大量的火属性伤害，并有几率给目标泼油。
items.weapon.enchantments.enchantmentlight2.name=圣光%s
items.weapon.enchantments.enchantmentlight2.desc=圣光附魔将造成少量的光属性伤害，并有几率以圣光打击目标。
items.weapon.enchantments.enchantmentenergy2.name=剑舞%s
items.weapon.enchantments.enchantmentenergy2.desc=剑舞附魔将造成大量的无属性伤害，并给使用者提供物理护盾。
items.weapon.enchantments.enchantmentearth2.name=酸蚀%s
items.weapon.enchantments.enchantmentearth2.desc=酸蚀附魔将造成少量的地属性伤害，并有几率给目标上腐酸。
items.weapon.enchantments.enchantmentshock2.name=电震%s
items.weapon.enchantments.enchantmentshock2.desc=电震附魔将造成少量的雷属性伤害，并有几率给目标上静电效果。
items.food.completefood.porksoup.name=排骨汤
items.food.completefood.porksoup.desc=你可以看到浮在上面的油水。\n使用_1份蔬菜、1份肉、1份水_炼制。
items.food.completefood.meatroll.name=肉卷
items.food.completefood.meatroll.desc=这意味着可以吃书了。\n使用_1份卷轴、1份肉_炼制。
items.food.completefood.ricegruel.name=米粥
items.food.completefood.ricegruel.desc=加一份水是饭，加两份水是粥，加三份水我想都不敢想。\n使用_1份主食、2份水_炼制。
items.food.completefood.vegetablekebab.name=大菜串
items.food.completefood.vegetablekebab.desc=素食主义者最喜欢的。\n使用_2份蔬菜、1份肉_炼制。
items.food.completefood.nutcookie.name=坚果饼干
items.food.completefood.nutcookie.desc=6个一组，最强的效果能抵挡6次重击。\n使用_5份坚果_锻造。
items.food.completefood.mixpizza.name=混合披萨
items.food.completefood.mixpizza.desc=这玩意如果让部落的某些人看到，你就要小心他们了。\n使用_1份主食、1份原石、1份水果、1份肉、1份蔬菜_锻造。
items.food.completefood.mooncake.name=月饼
items.food.completefood.mooncake.desc=中秋佳节赏月，是壁垒众多传统之一。\n使用_1份主食、2份坚果_炼制。
items.food.completefood.fruitcandy.name=水果硬糖
items.food.completefood.fruitcandy.desc=制作糖丸需要好多步骤，但是在这里只要这么简单就能做了。\n使用_1份水、1份水果、1份原石_锻造。
items.food.completefood.chickennugget.name=椒盐鸡块
items.food.completefood.chickennugget.desc=想吃我的香香鸡吗？\n使用_1份原石、1份肉_炼金。
items.food.completefood.chocolate.name=巧克力
items.food.completefood.chocolate.desc=超纯的巧克力，超苦的。\n使用_5份坚果_炼金。
items.food.completefood.foodfans.name=粉丝
items.food.completefood.foodfans.desc=注意煮熟后食用。\n使用_1份药水、2份坚果_炼金。
items.food.completefood.frenchfries.name=薯条
items.food.completefood.frenchfries.desc=过量淀粉警告。\n使用_1份卷轴、2份坚果_炼金。
items.food.completefood.fruitsalad.name=水果沙拉
items.food.completefood.fruitsalad.desc=事实上制作这种食物并不需要沙拉。\n使用_2份水果、1份水_炼金。
items.food.completefood.gel.name=凝胶
items.food.completefood.gel.desc=一团凝胶。\n使用_1份原石、1份水_炼金。
items.food.completefood.hamburger.name=巨无霸汉堡
items.food.completefood.hamburger.desc=啊！好大！\n使用_2份主食、1份蔬菜、2份肉_炼金。
items.food.completefood.herbmeat.name=药草酱肉
items.food.completefood.herbmeat.desc=沾草后口味更佳。\n使用_1份种子、1份肉_炼金。
items.food.completefood.honeygel.name=蜂蜜布丁
items.food.completefood.honeygel.desc=蜂蜜布满了凝胶。\n使用_1份凝胶、1份蜂蜜_炼金。
items.food.completefood.honeymeat.name=蜜汁肉排
items.food.completefood.honeymeat.desc=把蜂蜜浇在肉排上……很甜。\n使用_1份蜂蜜、1份肉_炼金。
items.food.completefood.honeyrice.name=蜂蜜拌饭
items.food.completefood.honeyrice.desc=天哪，我嘴里塞满了蜜蜂！\n使用_1份主食、1份蜂蜜_炼金。
items.food.completefood.honeywater.name=蜂糖水
items.food.completefood.honeywater.desc=稀释后的蜂蜜。\n使用_2份水、1份蜂蜜_炼金。
items.food.completefood.icecream.name=冰雪盛宴
items.food.completefood.icecream.desc=一个浇满蜂蜜的超大冰淇淋，吃了肯定很爽。\n使用_1份蜂蜜、1份水、1份冰冠花种子_炼金。
items.food.completefood.kebab.name=大肉串
items.food.completefood.kebab.desc=就是大肉串。\n使用_1份蔬菜、2份肉_炼金。
items.food.completefood.perfectfood.name=完美便当
items.food.completefood.perfectfood.desc=这是烹饪的最高杰作，完美便当。\n使用_蔬菜、原石、主食、水、水果各1份_炼金；或使用_1份鱼饼_炼金。
items.food.completefood.ricefood.name=精制米饭
items.food.completefood.ricefood.desc=有些时候精制米饭味道更好。\n使用_1份主食、1份水_炼金。
items.food.completefood.vegetableroll.name=菜卷
items.food.completefood.vegetableroll.desc=肉卷的兄弟。\n使用_1份卷轴、1份蔬菜_炼金。
items.food.completefood.vegetablesoup.name=菜汤
items.food.completefood.vegetablesoup.desc=把杂七杂八的蔬菜放到一起煮出来的汤。\n使用_1份水、2份蔬菜_炼金。
items.weapon.missiles.arrows.blindfruit.name=闪耀果
items.weapon.missiles.arrows.blindfruit.desc=人工种植的致盲草结出的果实。直接命中会使目标眩晕、沉默、锁定并缴械；落地则会释放混乱气体和伤害性的光芒。
items.weapon.missiles.throwing.empbola.name=电磁套索
items.weapon.missiles.throwing.empbola.desc=用于抓捕或狩猎的工具，会致残并电击目标、移除能量护盾，并对机械生物造成重创。
items.misc.shovel.name=铁铲
items.misc.shovel.ac_use=破坏
items.misc.shovel.ac_build=造墙
items.misc.shovel.not_wall=身边没有可以破坏的墙。
items.misc.shovel.break=铁铲的耐久不足。
items.misc.shovel.charge=耐久：%1$d / %2$d。
items.misc.shovel.desc=在大逃狱事件中，演员发现了这把铲子。它能破坏相邻墙壁或建造新墙，耐久会随时间恢复。
items.misc.gunofsoldier.name=脉冲手枪
items.misc.gunofsoldier.ac_use=射击
items.misc.gunofsoldier.prompt=选择一个目标。
items.misc.gunofsoldier.break=脉冲手枪的充能不足。
items.misc.gunofsoldier.charge=充能：%1$d / %2$d。
items.misc.gunofsoldier.desc=来自未来的先进脉冲手枪，会根据目标已损失的生命造成额外伤害。
items.bombs.spsfirebomb.name=火焰炸弹
items.bombs.spsfirebomb.desc=在爆炸范围内制造火焰和焦油雾。
items.bombs.icebomb.name=寒霜炸弹
items.bombs.icebomb.desc=在爆炸范围内制造极寒雪雾并造成冻伤。
items.bombs.stormbomb.name=风暴炸弹
items.bombs.stormbomb.desc=在爆炸范围内制造迟缓雪雾和雷电能量。
items.weapon.melee.normalweapon.woodenstaff.name=木杖
items.weapon.melee.normalweapon.woodenstaff.charge=积蓄：%1$d / %2$d。积蓄充满后，下一次攻击造成五倍伤害。
items.weapon.melee.normalweapon.woodenstaff.desc=用特殊木头雕刻而成的棍子。每次命中都会积蓄力量；命中八次后，下一击造成五倍伤害。
items.weapon.melee.normalweapon.tricksand.name=诡异沙尘
items.weapon.melee.normalweapon.tricksand.desc=价值90金币的沙尘，也许可以用来揭示隐藏单位。它能攻击两格外的目标，使其沉默，并对魔法护盾造成额外打击。
items.misc.faithsign.name=信标盒
items.misc.faithsign.ac_demon=恶魔派系
items.misc.faithsign.ac_human=神圣派系
items.misc.faithsign.ac_mech=机械派系
items.misc.faithsign.ac_life=自然派系
items.misc.faithsign.ac_balance=平衡派系
items.misc.faithsign.desc=装有五种派系标志的盒子。选择新信仰会替换当前信仰，并改变你对敌人造成和承受的伤害。
items.misc.bigbattery.name=蓄电池
items.misc.bigbattery.ac_use=充能
items.misc.bigbattery.ac_add=过载
items.misc.bigbattery.break=蓄电池的能量不足。
items.misc.bigbattery.charge=能量：%1$d / %2$d。
items.misc.bigbattery.desc=一块活着的电池，会缓慢收集静电。它可以强化使用者并为法杖充能，也可以使视野内的所有敌人陷入疲劳。
items.misc.attackshield.name=隆的波动拳
items.misc.attackshield.ac_cast=释放
items.misc.attackshield.ac_blast=爆发
items.misc.attackshield.rest=积蓄不足。
items.misc.attackshield.prompt=选择目标
items.misc.attackshield.not=无法命中该目标。
items.misc.attackshield.damage=这门武技造成_%1$d-%2$d点伤害_，并根据目标剩余生命追加伤害。
items.misc.attackshield.charge=积蓄：%1$d / %2$d。
items.misc.attackshield.desc=一种在攻击命中时积蓄力量的古老武技，可以释放波动拳或强化使用者。
items.misc.attackshoes.name=水管工皮鞋
items.misc.attackshoes.ac_jump=跳跃
items.misc.attackshoes.prompt=选择落点
items.misc.attackshoes.desc=这双鞋可以跳跃至多三格，并在落地时伤害周围的敌人。
items.misc.bshovel.name=奇迹按钮
items.misc.bshovel.ac_use=使用
items.misc.bshovel.break=积蓄不足。
items.misc.bshovel.charge=积蓄：%1$d / %2$d。
items.misc.bshovel.desc=一个奇怪的按钮，会把四周的墙变成门，并随机赋予一种效果。
items.misc.mkbox.name=蘑菇王国问号箱
items.misc.mkbox.ac_use=顶一下
items.misc.mkbox.need_gold=你需要100金币才能使用它。
items.misc.mkbox.desc=一个装着各种奖励的问号箱，每次使用消耗100金币。
items.wands.cannonofmage.name=雷诺的七彩大炮
items.wands.cannonofmage.desc=一件古老遗物，会在主要炮击前随机释放七种魔法效果之一。
items.wands.cannonofmage.stats_desc=这根法杖造成_%1$d-%2$d点伤害_，并获得法强带来的额外伤害。
items.weapon.melee.start.linksword.name=海拉鲁传奇
items.weapon.melee.start.linksword.ac_wisdom=智慧守护
items.weapon.melee.start.linksword.ac_power=力量压制
items.weapon.melee.start.linksword.ac_courage=勇气回旋
items.weapon.melee.start.linksword.charge=积蓄：%1$d / %2$d。
items.weapon.melee.start.linksword.prompt=选择目标
items.weapon.melee.start.linksword.no=无法在那里使用这项能力。
items.weapon.melee.start.linksword.desc=海拉鲁大陆上的传奇装备，拥有力量、智慧和勇气三种能力。
items.weapon.melee.start.diamondpickaxe.name=史蒂夫的钻石镐
items.weapon.melee.start.diamondpickaxe.ac_mine=挖掘
items.weapon.melee.start.diamondpickaxe.no_thing=这里没有东西可以挖掘。
items.weapon.melee.start.diamondpickaxe.break=你太饿了，无法挖掘。
items.weapon.melee.start.diamondpickaxe.desc=一把具有时运、耐久、效率、锋利、精准和杀手能力的钻石镐。
items.weapon.melee.start.pixeltorch.name=像素火把
items.weapon.melee.start.pixeltorch.ac_tlight=照明
items.weapon.melee.start.pixeltorch.desc=一支结实的火把，命中敌人会积蓄力量，并可消耗力量制造长时间照明。
items.weapon.melee.start.holymace.name=圣洁钉锤
items.weapon.melee.start.holymace.ac_add=灌注
items.weapon.melee.start.holymace.ac_light=强光
items.weapon.melee.start.holymace.ac_trial=审判
items.weapon.melee.start.holymace.prompt=选择目标
items.weapon.melee.start.holymace.prompt2=选择火把或强力符石
items.weapon.melee.start.holymace.desc=一把受祝福的钉锤，可以吸收火把和强力符石来提升能力。
items.weapon.melee.start.bravebook.name=勇者之书
items.weapon.melee.start.bravebook.ac_add=灌注
items.weapon.melee.start.bravebook.ac_improve=强化
items.weapon.melee.start.bravebook.ac_heal=圣疗
items.weapon.melee.start.bravebook.prompt=选择力量药剂或强力药丸
items.weapon.melee.start.bravebook.desc=一本被封印的书，可以把战斗积蓄转化为强化或治疗。
items.artifacts.timeoclock.name=时间怀表
items.artifacts.timeoclock.ac_activate=激活
items.artifacts.timeoclock.ac_restart=耗竭-重置
items.artifacts.timeoclock.in_use=你的怀表正在使用中。
items.artifacts.timeoclock.no_charge=怀表的充能不足。
items.artifacts.timeoclock.cursed=受诅咒的怀表无法使用。
items.artifacts.timeoclock.onstasis=你周遭的世界似乎就在这一瞬间变化了。
items.artifacts.timeoclock.onfreeze=你周围的一切突然缓慢下来。
items.artifacts.timeoclock.prompt=你想怎样使用怀表的魔法？\n\n当你被静止，周围的时间会正常流动，而你则会冻结并变得无敌。\n\n当时间被减缓，你的行动会被加快。
items.artifacts.timeoclock.stasis=使我彻底静止
items.artifacts.timeoclock.freeze=延缓周围时间
items.artifacts.timeoclock.desc=这只小型的华贵怀表看起来却并不怎么起眼，但你仍觉得它精雕细刻的框架内蕴含着某种强大的力量。在看着秒针转动的同时，你能感受到一种魔法正在拉扯着你，使用这种魔法肯定能给你一些控制时间的方法。
items.artifacts.timeoclock.desc_hint=怀表指针有些僵硬，如果你能找到一些发条……
items.artifacts.timeoclock.desc_cursed=被诅咒的怀表把它自己锁在了你的身边，你可以感觉它试图操纵你的时间流动。
items.artifacts.timeoclock$clock.name=魔法发条
items.artifacts.timeoclock$clock.levelup=你给你的怀表上了发条。
items.artifacts.timeoclock$clock.maxlevel=你的怀表已经拧不动了！
items.artifacts.timeoclock$clock.no_hourglass=你没有需要这个发条的时间怀表。
items.artifacts.timeoclock$clock.desc=这一发条应该能够在你的怀表上完美使用。
items.artifacts.alienbag.name=异星肩包
items.artifacts.alienbag.ac_shield=护盾模式
items.artifacts.alienbag.ac_bomb=耗竭-爆破模式
items.artifacts.alienbag.ac_build=制造模式
items.artifacts.alienbag.no_charge=肩包的充能不足。
items.artifacts.alienbag.full_charge=充能完毕
items.artifacts.alienbag.desc=由异星科技制造的肩包，会吸收被击败敌人的残骸，并制造防护、补给和建筑。
items.artifacts.alienbag$bagrecharge.levelup=你的异星肩包升级了。
items.weapon.missiles.buildblock.wallblock.name=墙壁方块
items.weapon.missiles.buildblock.wallblock.desc=投掷后会筑起墙壁的回收方块。
items.weapon.missiles.buildblock.bookblock.name=书架方块
items.weapon.missiles.buildblock.bookblock.desc=投掷后会筑起书架的回收方块。
items.weapon.missiles.buildblock.woodenblock.name=木制方块
items.weapon.missiles.buildblock.woodenblock.desc=投掷后会筑起路障的回收方块。
items.weapon.missiles.buildblock.stoneblock.name=石制方块
items.weapon.missiles.buildblock.stoneblock.desc=投掷后会筑起雕像的回收方块。
items.bombs.earthbomb.name=酸蚀炸弹
items.bombs.earthbomb.desc=这枚炸弹会缠绕附近的生物，并使它们沾满腐蚀淤泥。
items.bombs.darkbomb.name=暗黑炸弹
items.bombs.darkbomb.desc=这枚炸弹会散布恐惧与暗影诅咒，并对生命体造成巨额伤害。
items.weapon.missiles.throwing.skull.name=鬼骨镖
items.weapon.missiles.throwing.skull.desc=一种邪恶的投掷武器，能够标记目标的灵魂，使英雄从它身上汲取生命。
items.weapon.missiles.throwing.wave.name=声波诱饵
items.weapon.missiles.throwing.wave.desc=这种投掷武器会魅惑目标、使其狂乱，并撕去其四分之一的剩余生命。
items.armor.normalarmor.basearmor.name=基础护甲
items.armor.normalarmor.basearmor.desc=这并不是一件护甲，但是为了美观，这件物品被装备在该角色身上。\n非护甲
items.strbottle.name=力量之瓶
items.strbottle.ac_use=使用
items.strbottle.msg_1=+1力量
items.strbottle.desc=饮用后永久获得一点力量，并完全恢复生命。
items.misc.demoscroll.name=恶魔契约
items.misc.demoscroll.ac_read=鲜血交易
items.misc.demoscroll.ac_read2=灵魂转换
items.misc.demoscroll.desc=一张以鲜血达成的契约，可以用生命上限换取永久力量。英雄每升一级便可额外交易一次，击败敌人可以收集灵魂。
items.misc.demoscroll.hitup=你感觉自己的命中能力提升了。
items.misc.demoscroll.evaup=你感觉自己的闪避能力提升了。
items.misc.demoscroll.migup=你感觉自己的魔法能力提升了。
items.misc.demoscroll.htdown=你感觉自己的生命上限降低了。
items.misc.demoscroll.htup=你感觉自己的生命上限提升了。
items.misc.demoscroll.charge=灵魂数量：%d。
items.misc.demoscroll.charge2=已使用鲜血交易次数：%d。
items.misc.jumpw.name=战士之鞋
items.misc.jumpw.ac_jump=跳跃
items.misc.jumpw.prompt=选择跳跃的目的地点
items.misc.jumpw.rest=战士之鞋的充能不足。
items.misc.jumpw.charge=充能：%1$d / %2$d。
items.misc.jumpw.desc=战士的冲锋训练使其可以跳跃至多五格。落点周围的每个单位都有70%%概率被麻痹。
items.misc.gnollmark.name=仪式面具
items.misc.gnollmark.ac_choose=选择仪式
items.misc.gnollmark.ac_light=光明仪式
items.misc.gnollmark.ac_dark=黑暗仪式
items.misc.gnollmark.ac_earth=自然仪式
items.misc.gnollmark.ac_life=生命献祭
items.misc.gnollmark.break=仪式面具尚未准备妥当。
items.misc.gnollmark.charge=准备完成度：%1$d / %2$d。
items.misc.gnollmark.desc=豺狼人萨满所佩戴的仪式面具，释放法杖可以提高准备度。光明仪式会大幅提升物理力量，但暂时无法使用法杖；黑暗仪式会使法杖伤害翻倍，但令使用者虚弱且无法攻击；自然仪式会提供护盾与再生。也可以献祭生命使面具完全准备就绪。
items.misc.jumpm.name=法师之鞋
items.misc.jumpm.ac_jump=闪烁
items.misc.jumpm.prompt=选择闪烁的目的地点
items.misc.jumpm.rest=法师之鞋的充能不足。
items.misc.jumpm.charge=充能：%1$d / %2$d。
items.misc.jumpm.desc=法师的训练使其可以闪烁至多三格，并有60%%概率获得短暂的奥术专注，使法杖伤害翻倍。
items.misc.undeadbook.name=亡灵圣经
items.misc.undeadbook.ac_read=神圣庇佑
items.misc.undeadbook.ac_read2=灵魂献祭
items.misc.undeadbook.ac_bless=祈祷
items.misc.undeadbook.desc=一本用死灵语书写的圣经。受击会为圣经积蓄能量；神圣庇佑会消耗10点能量并随机赐予一种祝福。灵魂献祭会消耗50点能量，能量不足时则永久失去5点生命上限，并获得露珠爆破。每提升一级还可额外祈祷一次，获得一个复活十字架。
items.misc.undeadbook.bless=圣经以露珠回应你的阅读，但你感觉自己的身体失去了什么。
items.misc.undeadbook.1up=圣经以复活十字架回应你的祈祷。
items.misc.undeadbook.charge=能量：%d。
items.misc.undeadbook.charge2=已祈祷次数：%d。
items.misc.jumpr.name=盗贼之鞋
items.misc.jumpr.ac_jump=跳跃
items.misc.jumpr.prompt=选择跳跃的目的地点
items.misc.jumpr.rest=盗贼之鞋的充能不足。
items.misc.jumpr.charge=充能：%1$d / %2$d。
items.misc.jumpr.desc=盗贼缺乏跳跃训练，只能跳跃至多两格，但会获得短暂漂浮，并有60%%概率隐身5回合。
items.misc.jumph.name=猎手之鞋
items.misc.jumph.ac_jump=跳跃
items.misc.jumph.prompt=选择跳跃的目的地点
items.misc.jumph.rest=猎手之鞋的充能不足。
items.misc.jumph.charge=充能：%1$d / %2$d。
items.misc.jumph.desc=在自然母亲的指引下，女猎手可以跳跃至多三格，同时攻击落点七格内所有视野中的敌人。
items.weapon.missiles.taurcenbow.name=马人长弓
items.weapon.missiles.taurcenbow.ac_shoot=射击
items.weapon.missiles.taurcenbow.ac_break=破甲箭头
items.weapon.missiles.taurcenbow.ac_fire=燃烧箭头
items.weapon.missiles.taurcenbow.ac_ice=霜冻箭头
items.weapon.missiles.taurcenbow.ac_poison=腐蚀箭头
items.weapon.missiles.taurcenbow.ac_ele=电磁箭头
items.weapon.missiles.taurcenbow.prompt=选择射击目标
items.weapon.missiles.taurcenbow.desc=一把结实的复合弓，在马人族中也是上等品。可以随时切换特殊箭头，每积蓄8次命中，下一次命中会附加所选箭头的效果。
items.weapon.missiles.taurcenbow.damage=这件武器可以造成 %1$d - %2$d 点伤害。
items.weapon.missiles.taurcenbow.charge=充能：%1$d / %2$d。
items.weapon.melee.holywater.name=圣水
items.weapon.melee.holywater.desc=被祝福过的水制成的奇特武器。每次命中都会积蓄力量；满充后的下一击造成五倍伤害，并按基础伤害恢复生命。
items.weapon.melee.holywater.charge=充能：%1$d / %2$d。
items.misc.copyball.name=侵蚀核心
items.misc.copyball.ac_use=施放
items.misc.copyball.prompt=选择要瞄准的地方
items.misc.copyball.break=精华不足。
items.misc.copyball.charge=精华：%1$d / %2$d。
items.misc.copyball.desc=史莱姆可以在行动中吸收精华，并利用10点精华向目标发射核心。命中会造成额外伤害并创造一个免疫大部分状态的分身；无处生成分身时核心会爆炸。
items.misc.copyball$slimes.name=精华分身
items.misc.copyball$slimes.desc=由侵蚀核心制造的飞行分身，会跟随并协助英雄。
items.misc.jumpp.name=演员之鞋
items.misc.jumpp.ac_jump=跳跃
items.misc.jumpp.prompt=选择跳跃的目的地点
items.misc.jumpp.rest=演员之鞋的充能不足。
items.misc.jumpp.charge=充能：%1$d / %2$d。
items.misc.jumpp.desc=演员可跳跃至多三格，并获得1次玻璃护盾和5回合律动；超级明星还会进入更强的节奏。
items.misc.mechpocket.name=机械口袋
items.misc.mechpocket.ac_use=使用
items.misc.mechpocket.desc=一个充满神秘感的未来口袋。使用后会一次性倒出20件随机物品，随后消失。
items.misc.jumps.name=星兵之鞋
items.misc.jumps.ac_jump=跳跃
items.misc.jumps.prompt=选择跳跃的目的地点
items.misc.jumps.rest=星兵之鞋的充能不足。
items.misc.jumps.charge=充能：%1$d / %2$d。
items.misc.jumps.desc=星兵可以跳跃至多三格。起跳时会为持有的每把枪装填1发，并有60%%概率再装填1发并获得10回合瞄准。
items.artifacts.pylon.name=便携式水晶塔
items.artifacts.pylon.ac_zap=释放
items.artifacts.pylon.ac_set=设置
items.artifacts.pylon.ac_return=返回
items.artifacts.pylon.ac_rankup=耗竭-升阶
items.artifacts.pylon.no_charge=你的水晶塔现在没有足够的能量释放传送魔法。
items.artifacts.pylon.no_tele=传送魔法失败了。
items.artifacts.pylon.tele_fail=这个目标无法被传送。
items.artifacts.pylon.prompt=选择要释放传送魔法的位置
items.artifacts.pylon.levelup=你的水晶塔变得更强大了！
items.artifacts.pylon.rankup=晋升！
items.artifacts.pylon.preventing=这里强大的魔力流使水晶塔无法锚定空间！
items.artifacts.pylon.creatures=邻近生物的心灵信号正在干扰水晶塔的空间锚点。
items.artifacts.pylon.return=水晶塔已锚定在当前位置，现在你可以随时折跃到这里。
items.artifacts.pylon.desc=一座能够控制传送魔法的复杂水晶建筑。它可以锚定返回地点，也能消耗一点能量将自己或指定目标随机传送。达到最高等级后，可以耗竭水晶塔使持有者永久晋升。
items.artifacts.pylon.desc_set=水晶塔被设置在像素地牢第%d层的某处。
items.misc.jumpf.name=信徒之鞋
items.misc.jumpf.ac_jump=跳跃
items.misc.jumpf.prompt=选择跳跃的目的地点
items.misc.jumpf.rest=信徒之鞋的充能不足。
items.misc.jumpf.charge=充能：%1$d / %2$d。
items.misc.jumpf.desc=信徒可以跳跃至多三格。除楼梯、炼金台和基座外，起跳处会变成高草；落地时有10%%概率长出一株特殊植物。
items.armor.specialarmor.lifearmor.name=活性护甲
items.armor.specialarmor.lifearmor.desc=一株被塑造成护甲的活体植物。它会积蓄近期受到的伤害，并调整厚度以格挡至多等量伤害；20回合没有受到新伤害后，会把积蓄值转化为治疗。
items.misc.grassbook.name=自然之书
items.misc.grassbook.ac_read=自然转换
items.misc.grassbook.ac_read2=枯枝护佑
items.misc.grassbook.desc=树灵携带的智慧之书，每次使用消耗500金币。它可以创造一件自然物品，也可以提供漂浮与物理护盾，并使周围长出旧式高草。
items.misc.jumpa.name=修士之鞋
items.misc.jumpa.ac_jump=闪烁
items.misc.jumpa.prompt=选择闪烁的目的地点
items.misc.jumpa.rest=修士之鞋的充能不足。
items.misc.jumpa.charge=充能：%1$d / %2$d。
items.misc.jumpa.desc=修士可以闪烁至多四格，并有40%%概率获得4回合的双倍移动速度。
items.sellitem.sellmushroom.name=好看的蘑菇
items.sellitem.sellmushroom.no=味道一般，像是空气。
items.sellitem.sellmushroom.desc=地狱三头犬喜欢的蘑菇。
items.sellitem.apk931.name=蓝猫地牢测试组模
items.sellitem.apk931.desc=一个测试组模。说实在的在测试中的测试是无法使用的。
items.sellitem.bottleflower.name=试管玫瑰
items.sellitem.bottleflower.desc=冰杖最喜欢的物品之一。
items.sellitem.brokenhammer.name=损坏的铁锤
items.sellitem.brokenhammer.desc=虽然已经坏了，但还能换成钱。
items.sellitem.crossphoto.name=拼凑相片
items.sellitem.crossphoto.desc=一张由正常照片、照片底片和曝光底片的碎片拼凑的照片。照片上一家三口的表情显得十分怪诞。
items.sellitem.dwarfhammer.name=破魔之锤
items.sellitem.dwarfhammer.desc=矮人族在战胜古神后，用科学魔法将古神封印在地牢深处。这柄锤子已经太脆弱，不能再当武器使用。
items.sellitem.hummingtool.name=蜂鸟开锁器
items.sellitem.hummingtool.desc=这个东西原本能消耗钥匙打开门锁，但这个世界无法加载它所属的组模。
items.sellitem.hunterlens.name=眼魔的晶状体
items.sellitem.hunterlens.desc=可以用来制作召唤物或护目镜，但不是在这个世界。
items.sellitem.mirror2.name=镜像碎片
items.sellitem.mirror2.desc=看上去像镜子的碎片，但是背后写着mirror2和蒸汽。
items.sellitem.nouthsouth.name=南北手柄
items.sellitem.nouthsouth.desc=矮人所使用的手柄，用于尝试体感类的掌机游戏。
items.sellitem.sellpermit.name=经营许可证
items.sellitem.sellpermit.desc=经营商店的许可证的复印件，并不值钱。
items.sellitem.sheepfur.name=羊毛
items.sellitem.sheepfur.desc=奇怪又普通的毛发。
items.sellitem.simple360.name=简单发芽修改代码
items.sellitem.simple360.desc=一段可以让游戏变简单的代码，其作者离开了它们所在的世界。
items.sellitem.tissue.name=用餐纸巾
items.sellitem.tissue.desc=义往尘沙为你准备了纸巾，有多种用途。
items.sellitem.uncledumbbell.name=发芽的哑铃
items.sellitem.uncledumbbell.desc=长期未用的哑铃，任由杂草在上面发芽。
items.sellitem.devupplan.name=更新计划
items.sellitem.devupplan.desc=厚厚的本子里面涂满了乱七八糟的东西，其中大部分被打上了钩。
items.misc.savagehelmet.name=蛮族头盔
items.misc.savagehelmet.desc=为狩猎年兽专门准备的头盔。携带时有20%%概率减少受到的伤害，并将减伤值积蓄到下一次攻击中；装备后触发概率提升至100%%。
items.misc.horsetotem.name=赤兔图腾
items.misc.horsetotem.desc=为狩猎年兽专门准备的图腾。携带时有20%%概率提高本次攻击伤害，并获得4回合急速；装备后触发概率提升至100%%。
items.misc.rangebag.name=飞镖袋
items.misc.rangebag.ac_buy=购买
items.misc.rangebag.need_gold=你需要500金币才能购买一件投掷武器。
items.misc.rangebag.desc=为狩猎年兽专门准备的袋子。花费500金币可以购买一件旧版投掷物；装备后，致命一击有六分之一概率额外掉落一件。
items.misc.dancelion.name=舞狮手册
items.misc.dancelion.ac_choose=选择舞步
items.misc.dancelion.ac_spin=旋身
items.misc.dancelion.ac_stand=力定
items.misc.dancelion.ac_back=退守
items.misc.dancelion.ac_rush=猛冲
items.misc.dancelion.ac_jump=腾跃
items.misc.dancelion.need_charge=舞狮手册需要40点充能。
items.misc.dancelion.charge=充能：%1$d / %2$d。
items.misc.dancelion.desc=为狩猎年兽专门准备的手册。英雄每次行动获得1点充能，最多100点；消耗40点可从律动、防御、充能、攻击和漂浮五种舞步中选择一种。超级明星还会获得额外效果。
items.misc.healbag.name=医疗箱
items.misc.healbag.ac_heal=群体治疗
items.misc.healbag.ac_cook=随机调制
items.misc.healbag.need_charge=医疗箱的充能不足。
items.misc.healbag.charge=充能：%1$d / %2$d。
items.misc.healbag.desc=为狩猎年兽专门准备的医疗箱。命中敌人会为其充能；消耗15点可治疗周围伤势严重的单位并清除多种负面状态，消耗40点可随机调制药水、高级食物、药材或药丸。
items.weapon.melee.start.whisk.name=拂尘和木剑
items.weapon.melee.start.whisk.desc=道士使用的拂尘与木剑。连续命中会积蓄风力：每第十一次命中会击退目标、使其眩晕并获得一点采撷充能；完成五次蓄风后，可从怪物身上取得一件特殊战利品。
items.weapon.melee.start.whisk.charge=蓄风充能：%1$d / %2$d。
items.weapon.melee.start.whisk.chargeex=采撷充能：%1$d / %2$d。
items.wands.wand.silent=沉默状态下无法使用法杖。
items.weapon.melee.special.testweapon.name=测试武器
items.weapon.melee.special.testweapon.desc=测试用的武器。造成较高伤害时会获得试验点数。

items.wands.wandoftest.name=测试法杖
items.wands.wandoftest.ac_0=能量
items.wands.wandoftest.ac_1=火焰
items.wands.wandoftest.ac_2=寒冰
items.wands.wandoftest.ac_3=雷电
items.wands.wandoftest.ac_4=大地
items.wands.wandoftest.ac_5=光明
items.wands.wandoftest.ac_6=黑暗
items.wands.wandoftest.desc=这根法杖是测试用的，可以改变造成伤害的属性。
items.wands.wandoftest.stats_desc=这根法杖射出的飞弹能造成_%1$d~%2$d点伤害_。

items.armor.specialarmor.testarmor.name=测试护甲
items.armor.specialarmor.testarmor.desc=测试用的护甲，每次承受攻击都会记录为一点试验点数。

items.misc.rewardpaper.name=报酬清单
items.misc.rewardpaper.ac_choose=选择
items.misc.rewardpaper.ac_doup=强化
items.misc.rewardpaper.ac_dore=破阶
items.misc.rewardpaper.ac_dosp=锁定
items.misc.rewardpaper.ac_need=购买
items.misc.rewardpaper.ac_rankup=提升
items.misc.rewardpaper.prompt=选择一件物品
items.misc.rewardpaper.desc=用试验获得的点数兑换奖励。锁定与提升需要50点；强化与破阶需要100点；购买奖励需要1000金币。
items.weapon.melee.start.demonblade.name=恶魔刀锋
items.weapon.melee.start.demonblade.desc=暗夜短弓被其中的泉水腐化，如今环绕着恶魔的灼热气息。

items.weapon.missiles.elfbow.name=暗夜短弓
items.weapon.missiles.elfbow.ac_shoot=射击
items.weapon.missiles.elfbow.ac_drink=饮用
items.weapon.missiles.elfbow.need_equip=需要先装备这把弓。
items.weapon.missiles.elfbow.prompt=选择一个目标
items.weapon.missiles.elfbow.desc=暗夜精灵所使用的短弓，伤害会随法强提升。弓中还带有少量泉水，但饮用过量会腐化短弓。
items.weapon.missiles.elfbow.damage=这件武器在法强加成前可以造成_%d~%d点伤害_。

items.weapon.missiles.throwing.mindarrow.name=意识之矢
items.weapon.missiles.throwing.mindarrow.desc=利用积累的疯狂伤害并腐化目标。

items.misc.needpaper.name=通缉令
items.misc.needpaper.ac_choose=选择
items.misc.needpaper.ac_shop=黑市
items.misc.needpaper.ac_help=黑帮
items.misc.needpaper.need_charge=点数不足。
items.misc.needpaper.desc=越知名，越危险。消耗500点数可以治疗并隐蔽自身；消耗3000点数可以获得随机装备。

items.misc.ppc.name=电子放大镜
items.misc.ppc.ac_try=试探
items.misc.ppc.ac_heal=疗养
items.misc.ppc.ac_mind=追忆
items.misc.ppc.need_charge=记录数不足。
items.misc.ppc.charge=记录数：%d
items.misc.ppc.desc=每当有生物死亡，它都会留下一条记录。消耗记录可以获得灵感、摆脱一种精神异常，或制造意识之矢。

items.misc.nmhealbag.name=纳米维生包
items.misc.nmhealbag.ac_choose=选择
items.misc.nmhealbag.ac_heal=纳米医疗
items.misc.nmhealbag.ac_cook=纳米重组
items.misc.nmhealbag.ac_add=纳米增值
items.misc.nmhealbag.need_charge=纳米点数不足。
items.misc.nmhealbag.desc=纳米维生包可以帮助你控制纳米点数。纳米医疗会把全部纳米点数转化为生命并清除数种有害状态；纳米重组消耗10点制造食物或召唤物；纳米增值会把大部分生命转化为纳米点数。

items.misc.leaderflag.name=领主之旗
items.misc.leaderflag.ac_remove=拆卸
items.misc.leaderflag.ac_recruit=招募
items.misc.leaderflag.ac_exile=流放
items.misc.leaderflag.ac_levy=征收
items.misc.leaderflag.need_charge=人气不足。
items.misc.leaderflag.need_time=内政时间不足。
items.misc.leaderflag.time=内政值：%d
items.misc.leaderflag.desc=领主用于号令群体的道具。拆卸会回收周围的地形，招募会增加人气，流放会把超额人气折算成金币，征收则按人气取得物品。每天可用的内政时间有限。

items.misc.dicetower.name=骰子塔
items.misc.dicetower.ac_choose=选择
items.misc.dicetower.ac_roll=重掷
items.misc.dicetower.ac_reroll=出千
items.misc.dicetower.ac_allin=乾坤一掷
items.misc.dicetower.need_charge=充能不足。
items.misc.dicetower.charge=充能：%d/%d
items.misc.dicetower.desc=一个操纵天命点数的道具。重掷会生成新的数值；出千消耗60点充能并把天命点数设为100；乾坤一掷会耗尽金币，每5000金币转化为1点天命。

items.weapon.missiles.buildblock.waterblock.name=水块
items.weapon.missiles.buildblock.waterblock.desc=一种回收方块，投掷后会在目标位置生成水面。

items.misc.seriouspunch.name=认真拳套
items.misc.seriouspunch.ac_cast=使用
items.misc.seriouspunch.desc=一副看似普通的拳套。每次成功攻击都会积蓄力量；使用后会把全部积蓄灌注到下一次攻击中。
items.misc.seriouspunch.charge=积蓄力量：%d。

items.misc.ankhshield.name=神圣护盾
items.misc.ankhshield.ac_defence=防卫
items.misc.ankhshield.rest=护盾充能不足。
items.misc.ankhshield.charge=充能：%1$d / %2$d。
items.misc.ankhshield.desc=这个世界的缔造者为英雄准备的神圣道具。释放冲击时，近处敌人会受到伤害和神圣眩晕，视野内较远的敌人则会陷入时间警戒。

items.weapon.melee.start.elekatana.name=武士雷刀
items.weapon.melee.start.elekatana.ac_zap=一闪
items.weapon.melee.start.elekatana.silent=沉默状态下无法释放雷刀。
items.weapon.melee.start.elekatana.prompt=选择目标地点
items.weapon.melee.start.elekatana.no=雷刀需要10点充能。
items.weapon.melee.start.elekatana.blocked=这条直线上没有安全的落脚点。
items.weapon.melee.start.elekatana.charge=充能：%1$d / %2$d。
items.weapon.melee.start.elekatana.desc=附有雷电的武士刀。每次命中都会积蓄充能，并在目标身上留下不稳定电流；“一闪”消耗10点充能，斩过直线上的目标并瞬移到末端。

items.weapon.melee.start.beastknive.name=兽性匕首
items.weapon.melee.start.beastknive.ac_zap=狂怒
items.weapon.melee.start.beastknive.no=匕首需要10点充能。
items.weapon.melee.start.beastknive.charge=充能：%1$d / %2$d。
items.weapon.melee.start.beastknive.desc=浸润兽血的小刀。命中会造成额外伤害、可能施加流血并积蓄充能；“狂怒”消耗10点充能，暂时提高30%%攻击伤害。

items.weapon.missiles.shootgun.name=科技霰弹枪
items.weapon.missiles.shootgun.ac_shoot=射击
items.weapon.missiles.shootgun.ac_endshoot=终结射击
items.weapon.missiles.shootgun.ac_reload=装填
items.weapon.missiles.shootgun.reloading=正在装填……
items.weapon.missiles.shootgun.full=霰弹枪已经装满。
items.weapon.missiles.shootgun.prompt=选择一个目标
items.weapon.missiles.shootgun.damage=这件武器可以造成_%1$d~%2$d点伤害_。
items.weapon.missiles.shootgun.charge=弹药：%1$d / %2$d。
items.weapon.missiles.shootgun.desc=经过外星科技改装的霰弹枪。普通射击会破甲并击退目标；终结射击会清空弹仓，对目标及其周围生物造成伤害。

items.weightstone.name=磨刀石
items.weightstone.ac_apply=改制
items.weightstone.select=选择一件要附魔的武器
items.weightstone.apply=你用磨刀石为武器施加了附魔。
items.weightstone.desc=这块磨刀石可以为武器施加随机附魔，同时鉴定武器并解除其诅咒。

items.misc.ppc2.name=深渊调查仪
items.misc.ppc2.ac_try=探索
items.misc.ppc2.ac_heal=实验
items.misc.ppc2.ac_mind=丰收
items.misc.ppc2.no_thing=附近没有可调查的地形。
items.misc.ppc2.break=你太饿了，无法继续调查。
items.misc.ppc2.need_spp=天命点数必须高于%d点。
items.misc.ppc2.clear=目前没有可以收割的有害精神状态。
items.misc.ppc2.desc=用于调查深渊的仪器。它能拆取附近地形，消耗天命点数触发随机精神效果，或收割一种有害精神状态来恢复生命并取得天命点数。

items.weapon.melee.start.bunnydagger.name=兔人小刀
items.weapon.melee.start.bunnydagger.desc=一把带有兔人印记、久经沙场的小刀。每次命中都会额外造成一次武器伤害一半至全部的伤害。
items.weapon.melee.start.bunnyspanner.name=兔人扳手
items.weapon.melee.start.bunnyspanner.desc=兔人战士使用的巨大扳手。每次命中有30%%概率使目标麻痹。
items.weapon.melee.start.xsaber.name=X能量剑
items.weapon.melee.start.xsaber.ac_add=学习
items.weapon.melee.start.xsaber.prompt=选择要安装的技能芯片
items.weapon.melee.start.xsaber.learned=已安装技能芯片：_%s_。
items.weapon.melee.start.xsaber.desc=高科技能量剑，可以永久消耗并学习一枚洛克技能芯片。
items.weapon.melee.special.ninjafan.name=忍者蒲扇
items.weapon.melee.special.ninjafan.desc=能够施展强风的巨型忍者蒲扇。每第七次命中会击退目标并使其眩晕。
items.weapon.melee.special.ninjafan.charge=蓄风：_%1$d/%2$d_。
items.weapon.missiles.megacannon.name=洛克手炮
items.weapon.missiles.megacannon.ac_shoot=射击
items.weapon.missiles.megacannon.prompt=选择一个目标
items.weapon.missiles.megacannon.damage=每点能量造成_%1$d-%2$d点伤害_，最多储存3点能量。
items.weapon.missiles.megacannon.desc=洛克人的手炮。近战攻击不造成伤害，而是为远程射击积蓄能量。
items.misc.rockmanjumpshoes.name=洛克之鞋
items.misc.rockmanjumpshoes.ac_jump=跳跃
items.misc.rockmanjumpshoes.prompt=选择三格范围内的目的地
items.misc.rockmanjumpshoes.desc=这双鞋允许穿戴者跳跃最多三格，消耗的时间等于实际跳跃距离。
items.armor.specialarmor.renbarmor.name=兔女郎制服
items.armor.specialarmor.renbarmor.desc=REN珍藏的服装之一。承受100次攻击后会破碎，并留下一颗复活节彩蛋。
items.bombs.minibomb.name=迷你炸弹
items.bombs.minibomb.desc=一枚紧凑的小型炸弹，会在爆炸中心额外造成集中伤害。
items.weapon.rockcode.obubble.name=淤泥泡沫
items.weapon.rockcode.obubble.desc=来自黏咕的技能芯片，发射可能使目标沾满淤泥的自然泡泡。
items.weapon.rockcode.obubble.stats_desc=消耗4点能量中的1点，造成随英雄等级提高的自然伤害，并有50%%概率施加淤泥。
items.weapon.rockcode.ichain.name=钢铁锁链
items.weapon.rockcode.ichain.desc=来自典狱长的技能芯片，以钢铁锁链束缚一个目标。
items.weapon.rockcode.ichain.stats_desc=消耗4点能量中的1点，造成双倍等级伤害，并有25%%概率击晕目标。
items.weapon.rockcode.nshuriken.name=忍者手镖
items.weapon.rockcode.nshuriken.desc=来自天狗的技能芯片，投掷强力忍者手里剑。
items.weapon.rockcode.nshuriken.stats_desc=消耗4点能量中的1点，造成三倍等级伤害。
items.weapon.rockcode.trush.name=墓石冲击
items.weapon.rockcode.trush.desc=来自坦克的技能芯片，投出沉重墓碑并破坏目标地面。
items.weapon.rockcode.trush.stats_desc=消耗4点能量中的1点，造成四倍等级伤害，并将普通地形变为装饰地面。
items.weapon.rockcode.bmech.name=机械炸弹
items.weapon.rockcode.bmech.desc=来自DM-300的技能芯片，向目标发射机械爆破炸弹。
items.weapon.rockcode.bmech.stats_desc=消耗4点能量中的1点，在目标位置引爆一枚地城炸弹。
items.weapon.rockcode.sweb.name=蛛网陷阱
items.weapon.rockcode.sweb.desc=来自蜘蛛女王的技能芯片，在目标周围铺设蛛网。
items.weapon.rockcode.sweb.stats_desc=消耗4点能量中的1点，造成等级伤害，并在相邻可通行地面生成蛛网。
items.weapon.rockcode.mlaser.name=混合射线
items.weapon.rockcode.mlaser.desc=来自混源体的技能芯片，释放七元素混合射线。
items.weapon.rockcode.mlaser.stats_desc=消耗4点能量中的1点，分别造成能量、自然、火焰、寒冰、雷电、光明和黑暗伤害。
items.weapon.rockcode.zshield.name=尸块护盾
items.weapon.rockcode.zshield.desc=来自矮人国王的技能芯片，将黑暗能量转化为防护盾。
items.weapon.rockcode.zshield.stats_desc=消耗4点能量中的1点，造成等级黑暗伤害，并获得英雄等级5倍的护盾。
items.weapon.rockcode.alink.name=长老链接
items.weapon.rockcode.alink.desc=来自星灵长老的技能芯片，在目标附近制造强力镜像。
items.weapon.rockcode.alink.stats_desc=消耗4点能量中的1点，最多召唤两个镜像。
items.weapon.rockcode.lbox.name=巫妖冰盒
items.weapon.rockcode.lbox.desc=来自巫妖舞者的技能芯片，将目标冻结在冰盒中。
items.weapon.rockcode.lbox.stats_desc=消耗4点能量中的1点，造成等级寒冰伤害，并施加5回合冻伤。

items.food.staplefood.normalration.name=干粮包
items.food.staplefood.normalration.desc=里面没什么稀奇的：肉干、饼干，以及类似的旅行食物。
items.food.staplefood.overpricedration.name=干粮小包
items.food.staplefood.overpricedration.desc=容量比干粮包更小，很受年轻冒险者欢迎。
items.food.staplefood.pasty.pasty=肉馅饼
items.food.staplefood.pasty.pasty_desc=这是份正宗康郡肉烘饼，内含土豆加牛肉的传统馅料。
items.food.staplefood.pasty.assorted=春什锦
items.food.staplefood.pasty.assorted_desc=年糕、汤圆和饺子塞满了这个蒸笼。作为新春佳节的传统食物，它能完全消除你的饥饿感并让你充满决心。\n\n春节快乐！
items.food.staplefood.pasty.book=暑假作业
items.food.staplefood.pasty.book_desc=这是一份暑假作业，注意劳逸结合。\n\n暑假快乐！
items.food.staplefood.pasty.egg=七彩蛋
items.food.staplefood.pasty.egg_desc=虽然这个东西看起来不大，但吃下它能够完全消除你的饥饿感，并让你精神抖擞。\n\n复活节快乐！
items.food.staplefood.pasty.pie=南瓜派
items.food.staplefood.pasty.pie_desc=好大的一块南瓜派！甘甜又微辣，它会填饱你的肚子并让你恢复少量生命。\n\n万圣节快乐！
items.food.staplefood.pasty.turkey=烤火鸡
items.food.staplefood.pasty.turkey_desc=刚烤好的一只感恩节火鸡。吃下它可以恢复你的饥饿值并加快你的速度。\n\n感恩节快乐！
items.food.staplefood.pasty.cane=拐杖糖
items.food.staplefood.pasty.cane_desc=甜度爆表的巨型拐杖糖！大到够你一次吃饱，其中的糖分还能让你的法杖获得一点额外充能。\n\n节日快乐！
items.food.staplefood.pasty.bread=砖头糕
items.food.staplefood.pasty.bread_desc=由面粉和奶油烧制成的砖头形糕点。没准里面有金子呢。\n\n劳动节快乐！
items.food.staplefood.pasty.jelly=软糖剑
items.food.staplefood.pasty.jelly_desc=一个做成剑形状的软糖，估计只有小孩才喜欢这种味道。\n\n儿童节快乐！
items.food.staplefood.pasty.worker=辛苦了，这是报酬。
items.food.meatfood.meat.name=生肉
items.food.meatfood.meat.desc=集市里常见的肉，最好加工后再吃。
items.food.meatfood.firemeat.name=烤肉排
items.food.meatfood.firemeat.desc=烧烤是最基础的处理方式，可以延长保存时间并提供更多能量。
items.food.meatfood.icemeat.name=冻肉片
items.food.meatfood.icemeat.desc=被魔法冻住的生肉薄片。提供的能量不多，却带有一种有用的祝福。
items.food.meatfood.earthmeat.name=腌制扣肉
items.food.meatfood.earthmeat.desc=利用大地力量腌制的肉块，充满了自然的庇护。
items.food.meatfood.shockmeat.name=炸里脊
items.food.meatfood.shockmeat.desc=经过强电流加工的肉，香酥可口，食用后令人神清气爽。
items.food.meatfood.lightmeat.name=腊肉条
items.food.meatfood.lightmeat.desc=经过风干和暴晒，保质时间很长，而且总会剩下一小块。
items.food.meatfood.darkmeat.name=腐蚀肉
items.food.meatfood.darkmeat.desc=在黑暗中放置很久的肉，吃下后居然能够恢复生命。
items.food.meatfood.funnyfood.name=吮指原味稽
items.food.meatfood.funnyfood.desc=奇怪的料理，会让一切在很长时间里都显得十分滑稽。
items.food.fishcracker.name=鱼饼
items.food.fishcracker.desc=价格高昂的鱼形饼干，体积虽小却很顶饱。
items.food.honey.name=蜂蜜
items.food.honey.desc=浓稠甘甜的蜂蜜，食用后能永久增强生命力。
items.food.completefood.petfood.name=宠物口粮
items.food.completefood.petfood.desc=为地牢伙伴准备的基础食物。
items.food.completefood.fishpetfood.name=鱼味宠物口粮
items.food.completefood.fishpetfood.desc=鱼味的伙伴食物，提供的能量远多于普通宠物口粮。
items.food.meatfood.harmpoop.name=有害秽物
items.food.meatfood.harmpoop.desc=勉强可以吃，但会导致中毒和迟缓。
items.food.completefood.mediummeat.name=七分熟肉排
items.food.completefood.mediummeat.desc=精心烹制的肉排，能在一段时间内大幅提高攻击力。
