items.eggs.starkidegg.desc=召唤星芒。
items.eggs.stoneegg.name=石拳石之魂
items.eggs.stoneegg.desc=召唤石拳石。
items.eggs.flyegg.name=飞蝇之魂
items.eggs.flyegg.desc=召唤飞蝇。
items.eggs.ribbonrategg.name=缎带鼠之魂
items.eggs.ribbonrategg.desc=召唤缎带鼠。
items.eggs.bluedragonegg.name=蓝龙之魂
items.eggs.bluedragonegg.desc=冰霜所孕化的龙之灵魂。
items.eggs.bluegirlegg.name=蓝色人偶之魂
items.eggs.bluegirlegg.desc=召唤蓝色人偶。
items.eggs.bugdragonegg.name=BUG龙之魂
items.eggs.bugdragonegg.desc=召唤缺失编号之龙。
items.eggs.golddragonegg.name=金龙之魂
items.eggs.golddragonegg.desc=万物合为一体的龙之灵魂。
items.eggs.greendragonegg.name=绿龙之魂
items.eggs.greendragonegg.desc=雷电所孕化的龙之灵魂。
items.eggs.leryfireegg.name=紊乱之魂
items.eggs.leryfireegg.desc=由多种元素能量混合而成的灵魂。
items.eggs.lightdragonegg.name=白龙之魂
items.eggs.lightdragonegg.desc=黑暗所孕化的龙之灵魂。
items.eggs.reddragonegg.name=红龙之魂
items.eggs.reddragonegg.desc=烈焰所孕化的龙之灵魂。
items.eggs.scorpionegg.name=毒蛰之魂
items.eggs.scorpionegg.desc=召唤一只巨大的血蝎。
items.eggs.violetdragonegg.name=紫龙之魂
items.eggs.violetdragonegg.desc=大地所孕化的龙之灵魂。
items.eggs.randomone.randomegg.name=随机灵魂
items.eggs.randomone.randomegg.ac_use=使用
items.eggs.randomone.randomegg.desc=获得一个对应月份的基础宠物包，有几率获得彩蛋宠物包。
items.eggs.randomone.randommonthegg.name=随机月份灵魂
items.eggs.randomone.randommonthegg.ac_use=使用
