items.weapon.melee.greataxe.ability_desc=决斗家在血量低于50%%时可以使用巨斧进行_报复_攻击。这种毁灭性的攻击必定命中，且造成_%1$d~%2$d点伤害_，若是击杀了一名敌人，这一击将不消耗时间。
items.weapon.melee.greataxe.desc=这个巨型的战斧无坚不摧，重如泰山，举过肩才有空间挥舞。

items.weapon.melee.greatshield.name=巨型方盾
items.weapon.melee.greatshield.typical_stats_desc=这件武器通常能格挡0~%d点伤害。格挡量随升级而增长。
items.weapon.melee.greatshield.stats_desc=这件武器能格挡0~%d点伤害。格挡量随升级而增长。
items.weapon.melee.greatshield.ability_name=护卫
items.weapon.melee.greatshield.typical_ability_desc=决斗家可以用巨型方盾_护卫_自己，一般会在_%d回合_内完全抵挡针对自己的物理或魔法攻击。一旦决斗家抵挡过攻击，再行还击或施法，都会终止护卫状态。
items.weapon.melee.greatshield.ability_desc=决斗家可以用巨型方盾_护卫_自己，在_%d回合_内完全抵挡针对自己的物理或魔法攻击。一旦决斗家抵挡过攻击，再行还击或施法，都会终止护卫状态。
items.weapon.melee.greatshield.upgrade_ability_stat_name=武技持续时间
items.weapon.melee.greatshield.desc=与其说它是一面盾，不如说它是一堵能移动的墙。这一大块金属对于防御十分有效，但没有在攻击方面留下多少余地。

items.weapon.melee.greatsword.name=巨剑
items.weapon.melee.greatsword.ability_name=顺劈
items.weapon.melee.greatsword.typical_ability_desc=决斗家可以用巨剑_顺劈_敌人。这一般会造成_%1$d~%2$d点伤害_且必定命中。如果顺劈击杀了一名敌人，这一击将不消耗时间，并且决斗家可在5回合内额外使用一次不消耗充能数的顺劈。
items.weapon.melee.greatsword.ability_desc=决斗家可以用巨剑_顺劈_敌人，造成_%1$d~%2$d点伤害_且必定命中。如果顺劈击杀了一名敌人，这一击将不消耗时间，并且决斗家可在5回合内额外使用一次不消耗充能数的顺劈。
items.weapon.melee.greatsword.desc=这把大剑进行的每次沉重挥舞都能造成大量伤害。

items.weapon.melee.handaxe.name=手斧
items.weapon.melee.handaxe.stats_desc=这是一件比较精准的武器。
items.weapon.melee.handaxe.ability_name=重击
items.weapon.melee.handaxe.typical_ability_desc=决斗家可以用手斧使出_重击_。这用尽全力的一击如果是在伏击敌人，则一般会造成_%1$d~%2$d点伤害_并施加5回合的恍惚，使其精准与闪避均降低50%%。重击必定命中，但若非伏击则只会造成普通的伤害。
items.weapon.melee.handaxe.ability_desc=决斗家可以用手斧使出_重击_。这用尽全力的一击如果是在伏击敌人，则会造成_%1$d~%2$d点伤害_并施加5回合的恍惚，使其精准与闪避均降低50%%。重击必定命中，但若非伏击则只会造成普通的伤害。
