items.equipment.artifacts.alchemiststoolkit.energize_desc=Cada 6 cristais de energia darão ao kit de ferramentas energia suficiente para ganhar um nível, o que aumenta a taxa com que o kit de ferramentas gera energia ao longo do tempo e a rapidez com que aquece.\n\nQuanta energia você gostaria de usar?
items.equipment.artifacts.alchemiststoolkit.energize_1=6 energias: +1 nível
items.equipment.artifacts.alchemiststoolkit.energize_all=%1$d energias: +%2$d níveis
items.equipment.artifacts.alchemiststoolkit.desc=Este kit de ferramentas contém um número de reagentes e ervas, junto com um frasco pequeno de mistura, permitindo a alquimia em movimento. O frasco contém o que parece ser cristais de energia alquímica em forma líquida.
items.equipment.artifacts.alchemiststoolkit.desc_cursed=O kit de ferramentas amaldiçoado se prendeu ao seu corpo e se recusa a deixar você praticar alquimia.
items.equipment.artifacts.alchemiststoolkit.desc_warming=O kit de ferramentas está aquecendo e ficará pronto para uso depois de um tempo.
items.equipment.artifacts.alchemiststoolkit.desc_hint=O kit de ferramentas equipado está lentamente gerando energia alquímica à medida que você ganha experiência. Parece que a mistura no frasco pode ser melhorada adicionando-se cristais de energia.

items.equipment.artifacts.artifact.cannot_wear_two=Você não pode usar dois artefatos iguais.
