items.equipment.rings.ring.equip_cursed=O anel se aperta ao redor do seu dedo dolorosamente!
items.equipment.rings.ring.unknown_desc=Este anel de metal está adornado com uma grande gema que reluz no escuro. Quem sabe qual efeito terá quando usado?
items.equipment.rings.ring.known=Isto é um %s
items.equipment.rings.ring.identify=Você agora está familiarizado o suficiente com o seu anel para identificá-lo.
items.equipment.rings.ring.cursed_worn=Este anel está amaldiçoado, e por causa disso você é incapaz de removê-lo.
items.equipment.rings.ring.curse_known=Você pode sentir uma magia malévola à espreita dentro deste anel.
items.equipment.rings.ring.not_cursed=Este anel está livre de magia malévola.

items.equipment.rings.ringofaccuracy.name=anel da precisão
items.equipment.rings.ringofaccuracy.stats=Quando usado, este anel aumentará sua precisão em _%s%%._
items.equipment.rings.ringofaccuracy.typical_stats=Quando usado, este anel normalmente aumentará sua precisão em _%s%%._
items.equipment.rings.ringofaccuracy.combined_stats=Seus anéis equipados estão combinando seus poderes, aumentando sua precisão para _%s%%_ no total.
items.equipment.rings.ringofaccuracy.upgrade_stat_name_1=Aumento de precisão
items.equipment.rings.ringofaccuracy.desc=Este anel aumenta o seu foco, fazendo com que fique mais fácil acertar seus inimigos. Um anel amaldiçoado dificultará o acerto dos ataques.

items.equipment.rings.ringofarcana.name=anel arcano
items.equipment.rings.ringofarcana.stats=Quando equipado, este anel aumentará o poder de encantamentos e glifos em _%s%%._
items.equipment.rings.ringofarcana.typical_stats=Quando equipado, esse anel normalmente aumentará a potência de encantamentos e glifos em _%s%%._
items.equipment.rings.ringofarcana.combined_stats=Seus anéis equipados estão combinando seus poderes, aumentando o poder de encantamentos e glifos para _%s%%_ no total.
items.equipment.rings.ringofarcana.upgrade_stat_name_1=Impulso Arcano
items.equipment.rings.ringofarcana.desc=Este anel aprimora encantamentos mágicos em armas e glifos em armaduras, incluindo maldições! Ele primeiro aumenta a chance de ativação e, em seguida, aumenta a força do efeito quando a chance de ativação é de 100%. Um anel amaldiçoado enfraquecerá encantamentos, glifos e maldições.

items.equipment.rings.ringofelements.name=anel dos elementos
items.equipment.rings.ringofelements.stats=Quando usado, este anel fornecerá _%s%%_ de resistência elementar.
items.equipment.rings.ringofelements.typical_stats=Quando usado, este anel normalmente fornecerá _%s%%_ de resistência elementar.
items.equipment.rings.ringofelements.combined_stats=Seus anéis equipados estão combinando seus poderes, fornecendo _%s%%_ de resistência elemental no total.
items.equipment.rings.ringofelements.upgrade_stat_name_1=Resistência
items.equipment.rings.ringofelements.desc=Este anel fornece resistência à maioria dos efeitos elementares e mágicos, diminuindo o dano e a duração de efeitos negativos. Naturalmente, um anel amaldiçoado irá piorar esses efeitos.

items.equipment.rings.ringofenergy.name=anel da energia
items.equipment.rings.ringofenergy.stats=Quando usado, este anel aumentará a velocidade de carregamento de varinhas, artefatos e armadura heroica em _%s%%._
items.equipment.rings.ringofenergy.typical_stats=Quando usado, este anel normalmente aumentará a velocidade de carregamento de varinhas, artefatos e armadura heroica em _%s%%._
items.equipment.rings.ringofenergy.combined_stats=Seus anéis equipados estão combinando seus poderes, aumentando a velocidade de recarga para _%s%%_ no total.
items.equipment.rings.ringofenergy.upgrade_stat_name_1=Impulso de carga
items.equipment.rings.ringofenergy.desc=Seu equipamento mágico recarregará mais rapidamente dentro do campo arcano que irradia deste anel. Um anel amaldiçoado, do contrário, irá tornar a recarga mais lenta.

items.equipment.rings.ringofevasion.name=anel da evasão
items.equipment.rings.ringofevasion.stats=Quando usado, este anel aumentará sua evasão em _%s%%._
items.equipment.rings.ringofevasion.typical_stats=Quando usado, este anel normalmente aumentará sua evasão em _%s%%._
items.equipment.rings.ringofevasion.combined_stats=Seus anéis equipados estão combinando seus poderes, aumentando sua evasão em _%s%%_ no total.
items.equipment.rings.ringofevasion.upgrade_stat_name_1=Aumento de evasão
items.equipment.rings.ringofevasion.desc=Este anel acelera as reações do usuário, tornando-o difícil de ser acertado por ataques inimigos. Um anel amaldiçoado, em vez disso, tornará o usuário mais fácil de atacar.

items.equipment.rings.ringofforce.name=anel da força
items.equipment.rings.ringofforce.stats=Quando desarmado, com a sua força atual, este anel causará _%1$d-%2$d de dano._ Com uma arma equipada, este anel aumentará o dano em _%3$d_
items.equipment.rings.ringofforce.typical_stats=Quando desarmado, com a sua força atual, normalmente este anel causará _%1$d-%2$d de dano._ Com uma arma equipada, normalmente este anel aumentará o dano em _%3$d._
items.equipment.rings.ringofforce.combined_stats=Seus anéis equipados estão combinando seus poderes, causando um total de _%1$d-%2$d_ de dano sem uma arma ou aumentado o dano em  _%3$d_ com uma arma.
items.equipment.rings.ringofforce.upgrade_stat_name_1=Dano desarmado
items.equipment.rings.ringofforce.upgrade_stat_name_2=Aumento de dano armado
items.equipment.rings.ringofforce.upgrade_stat_name_3=Dano de Habilidade
items.equipment.rings.ringofforce.ability_name=postura de luta
items.equipment.rings.ringofforce.typical_ability_desc=A Duelista pode adotar uma _postura de luta_ com este anel, fazendo com que seus ataques regulares sempre usem este anel mesmo com uma arma equipada.  Esses ataques normalmente causarão _%1$d-%2$d de dano_ e também aplicarão o encantamento e o melhorando da arma. Esta postura diminui a velocidade de recarga da arma em 50%%.
items.equipment.rings.ringofforce.ability_desc=A Duelista pode adotar uma _postura de luta_ com este anel, fazendo com que seus ataques regulares sempre usem este anel mesmo com uma arma equipada.  Esses ataques normalmente causarão _%1$d-%2$d de dano_ e também aplicarão o encantamento e o melhorando da arma. Esta postura diminui a velocidade de recarga da arma em 50%%.
items.equipment.rings.ringofforce.desc=Este anel aumenta a força dos golpes corpo a corpo do usuário. Este poder extra é bastante fraco quando empunhando armas, mas um ataque desarmado o fará muito mais forte. Um anel amaldiçoado enfraquecerá os golpes do usuário.
items.equipment.rings.ringofforce$brawlersstance.name=postura de luta
items.equipment.rings.ringofforce$brawlersstance.desc=Enquanto estiver nesta postura, os ataques regulares da Duelista usarão um anel de força equipado, mesmo quando ela estiver com uma arma equipada. Esses ataques ganham dano adicional e ainda usarão a melhoria e o encantamento da arma.\n\nNo entanto, manter essa postura exige foco, reduzindo a velocidade de recarga da habilidade da arma em 50%.\n\nEsta postura pode ser ativada ou desativada usando um anel de força, mas a redução na velocidade de carga persistirá por um tempo se a postura for ativada e desativada rapidamente.

items.equipment.rings.ringoffuror.name=anel da fúria
items.equipment.rings.ringoffuror.stats=Quando usado, este anel aumentará a velocidade de seus ataques em _%s%%._
items.equipment.rings.ringoffuror.typical_stats=Quando usado, este anel normalmente aumentará a velocidade de seus ataques em _%s%%._
items.equipment.rings.ringoffuror.combined_stats=Seus anéis equipados estão combinando seus poderes, aumentando a velocidade do seus ataques em _%s%%_ no total.
items.equipment.rings.ringoffuror.upgrade_stat_name_1=Aumento de velocidade de ataque
items.equipment.rings.ringoffuror.desc=Este anel concede ao usuário uma fúria interna, permitindo que ele ataque mais rapidamente. Um anel amaldiçoado diminuirá a velocidade de ataque do usuário.

items.equipment.rings.ringofhaste.name=anel da pressa
items.equipment.rings.ringofhaste.stats=Quando usado, este anel aumentará sua velocidade de movimento em _%s%%._
items.equipment.rings.ringofhaste.typical_stats=Quando usado, este anel normalmente aumentará sua velocidade de movimento em _%s%%._
items.equipment.rings.ringofhaste.combined_stats=Seus anéis equipados estão combinando seus poderes, aumentando a velocidade do seu movimento em _%s%%_ no total.
items.equipment.rings.ringofhaste.upgrade_stat_name_1=Aumento de velocidade de movimento
items.equipment.rings.ringofhaste.desc=Este anel reduz o impacto do movimento sobre o usuário, permitindo-lhe correr a velocidades sobre-humanas. Um anel amaldiçoado, em vez disso, tornara o usuário pesado e lento.

items.equipment.rings.ringofmight.name=anel do poder
items.equipment.rings.ringofmight.stats=Quando usado, este anel aumentará sua força em _%1$d_ e sua vida máxima em _%2$s%%._
items.equipment.rings.ringofmight.typical_stats=Quando usado, este anel normalmente aumentará sua força em _%1$d_ e sua vida máxima em _%2$s%%._
items.equipment.rings.ringofmight.combined_stats=Seus anéis equipados estão combinando seus poderes, aumentando sua força em _%1$d_ e seu PV máximo para _%2$s%%_ no total.
items.equipment.rings.ringofmight.upgrade_stat_name_1=Aumento de Força
items.equipment.rings.ringofmight.upgrade_stat_name_2=Aumento de vida máx
items.equipment.rings.ringofmight.desc=Este anel melhora as características físicas do portador, concedendo-lhe maior força física e constituição. Um anel amaldiçoado vai enfraquecer o portador.

items.equipment.rings.ringofsharpshooting.name=anel do tiro certeiro
items.equipment.rings.ringofsharpshooting.stats=Quando usado, este anel aumentará o dano de suas armas de arremesso como se o nível delas tivesse aumentado em _%1$d_, e aumentará sua durabilidade em _%2$s%%._
items.equipment.rings.ringofsharpshooting.typical_stats=Quando usado, este anel normalmente aumentará o dano de suas armas de arremesso como se o nível delas tivesse aumentado em _%1$d_ e aumentará sua durabilidade em _%2$s%%._
items.equipment.rings.ringofsharpshooting.combined_stats=Seus anéis equipados estão combinando seus poderes, aumentando o nível efetivo de armas de arremesso para _%1$d_ e aumentando sua durabilidade para _%2$s%%_ no total.
items.equipment.rings.ringofsharpshooting.upgrade_stat_name_1=Aumento de dano de nível
items.equipment.rings.ringofsharpshooting.upgrade_stat_name_2=Aumento de durabilidade
items.equipment.rings.ringofsharpshooting.desc=Este anel aumenta a precisão e a pontaria do usuário, fazendo com que os projéteis arremessados pelo portador sejam mais duráveis e causem mais dano. Um anel amaldiçoado terá o efeito oposto.

items.equipment.rings.ringoftenacity.name=anel da tenacidade
items.equipment.rings.ringoftenacity.stats=Quando usado, este anel reduz o dano que você recebe em até _%s%%._
items.equipment.rings.ringoftenacity.typical_stats=Quando usado, este anel normalmente reduz o dano que você recebe em até _%s%%._
items.equipment.rings.ringoftenacity.combined_stats=Seus anéis equipados estão combinando seus poderes, reduzindo o dano sofrido em _%s%%_ no total.
items.equipment.rings.ringoftenacity.upgrade_stat_name_1=Resistência Máx a Dano
items.equipment.rings.ringoftenacity.desc=Quando usado, este anel permitirá que o usuário resista a ataques outrora mortais. Quanto mais ferido o utilizador está, mais resistente  será a danos. Um anel amaldiçoado, em vez disso, o tornará mais fácil para os inimigos de executá-lo.

items.equipment.rings.ringofwealth.name=anel da fortuna
items.equipment.rings.ringofwealth.stats=Quando usado, este anel aumentará sua sorte por _%s%%._
items.equipment.rings.ringofwealth.typical_stats=Quando usado, este anel normalmente aumentará sua sorte em _%s%%._
items.equipment.rings.ringofwealth.combined_stats=Seus anéis equipados estão combinando seus poderes, aumentando sua sorte em _%s%%_ no total.
items.equipment.rings.ringofwealth.upgrade_stat_name_1=Aumento de sorte
items.equipment.rings.ringofwealth.desc=Este anel funciona como um ímã para tesouros, aumentando a probabilidade de que os inimigos e baús possuam itens valiosos. Um anel amaldiçoado, ao invés disso, reduzirá sua chance de receber tesouros.



