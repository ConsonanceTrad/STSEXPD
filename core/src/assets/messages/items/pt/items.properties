items.equipment.armor.clericarmor.desc=Enquanto estiver usando esta mistura de pano e placa, o Clérigo pode realizar uma habilidade especial.

items.equipment.armor.clotharmor.name=armadura de pano
items.equipment.armor.clotharmor.desc=Esta leve armadura oferece uma proteção básica.
items.equipment.armor.clotharmor.discover_hint=Um dos heróis inicia com este item.

items.equipment.armor.duelistarmor.name=peitoral do herói
items.equipment.armor.duelistarmor.desc=Enquanto estiver usando esta armadura de placa e capa, a Duelista pode realizar uma habilidade especial.

items.equipment.armor.huntressarmor.name=capa do herói
items.equipment.armor.huntressarmor.no_enemies=Nenhum inimigo à vista
items.equipment.armor.huntressarmor.desc=Enquanto estiver usando esta capa, a Caçadora poderá executar uma habilidade especial.

items.equipment.armor.leatherarmor.name=armadura de couro
items.equipment.armor.leatherarmor.desc=Armadura feita de couro de monstro curtido. Não é tão leve quanto uma armadura de pano, mas oferece uma melhor proteção.

items.equipment.armor.magearmor.name=túnica do herói
items.equipment.armor.magearmor.desc=Enquanto estiver usando esta esplendorosa túnica, o Mago poderá executar uma habilidade especial.

items.equipment.armor.mailarmor.name=armadura de malha
items.equipment.armor.mailarmor.desc=Elos de metal interligados criam uma armadura resistente, mas flexível.

items.equipment.armor.platearmor.name=armadura de placa
items.equipment.armor.platearmor.desc=Enormes placas de metal unidas em um traje que fornece proteção inigualável a qualquer aventureiro forte o suficiente para suportar seu peso descomunal.

items.equipment.armor.roguearmor.name=traje do herói
items.equipment.armor.roguearmor.desc=Enquanto estiver usando este traje escuro, o Ladino poderá executar uma habilidade especial.

items.equipment.armor.scalearmor.name=armadura de escamas
items.equipment.armor.scalearmor.desc=Escamas de metal foram costuradas em um colete de couro para formar uma armadura flexível e reforçada.

items.equipment.armor.warriorarmor.name=armadura de placa do herói
items.equipment.armor.warriorarmor.desc=Enquanto estiver usando esta armadura de placa pesada, o Guerreiro poderá executar uma habilidade especial.



###artifacts
items.equipment.artifacts.alchemiststoolkit.name=kit de ferramentas do alquimista
items.equipment.artifacts.alchemiststoolkit.ac_brew=MISTURAR
items.equipment.artifacts.alchemiststoolkit.ac_energize=ENERGIZAR
items.equipment.artifacts.alchemiststoolkit.not_ready=Seu kit de ferramentas ainda não terminou de se aquecer.
