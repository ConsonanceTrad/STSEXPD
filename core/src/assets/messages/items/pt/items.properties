items.equipment.artifacts.etherealchains.ac_cast=LANÇAR
items.equipment.artifacts.etherealchains.rooted=Suas correntes não podem puxá-lo enquanto você estiver enraizado.
items.equipment.artifacts.etherealchains.no_charge=Suas correntes não têm carga suficiente.
items.equipment.artifacts.etherealchains.cursed=Você não pode usar correntes amaldiçoadas.
items.equipment.artifacts.etherealchains.does_nothing=Isto não vai fazer nada.
items.equipment.artifacts.etherealchains.cant_pull=Suas correntes não podem puxar este alvo.
items.equipment.artifacts.etherealchains.cant_reach=Suas correntes não podem chegar lá.
items.equipment.artifacts.etherealchains.inside_wall=Suas correntes só podem puxar você através das paredes, não adentrá-las.
items.equipment.artifacts.etherealchains.nothing_to_grab=Não há para agarrar aqui.
items.equipment.artifacts.etherealchains.prompt=Escolha um localização alvo.
items.equipment.artifacts.etherealchains.desc=Estas grandes porém leves correntes brilham com energia espiritual. Elas podem ser usadas para puxar a si mesmo pelo terreno ou puxar inimigos até você. A natureza etérea dessas correntes as permitem até mesmo se estenderem através de paredes!
items.equipment.artifacts.etherealchains.desc_cursed=As correntes amaldiçoadas se prendem a você, constantemente deslizando ao seu redor, tentando amarrar você ou fazer com que tropece.
items.equipment.artifacts.etherealchains.desc_equipped=As correntes descansam ao seu lado, lentamente sugando a energia espiritual daqueles que você derrota. Cada carga é um elo na corrente, alongando-se exatamente um quadrado por elo.
items.equipment.artifacts.etherealchains$chainsrecharge.levelup=Suas correntes ficam mais fortes!

items.equipment.artifacts.holytome.name=Tomo sagrado
items.equipment.artifacts.holytome.ac_cast=LANÇAR
items.equipment.artifacts.holytome.no_spell=Você não é capaz de usar este feitiço agora.
items.equipment.artifacts.holytome.cursed=Você não pode usar um tomo amaldiçoado
items.equipment.artifacts.holytome.levelup=Seu tomo cresceu em força!
items.equipment.artifacts.holytome.desc=Um tomo sagrado que atua como foco para a magia divina do Clérigo. Usar o tomo permite ao Clérigo lançar uma variedade de feitiços mágicos.\n\nO tomo ficará cada vez mais poderoso à medida que o Clérigo o usar, dando ao Clérigo mais cargas máximas e aumentando ligeiramente a velocidade de recarga.
items.equipment.artifacts.holytome.discover_hint=Um dos heróis inicia com este item.

items.equipment.artifacts.hornofplenty.name=chifre da fartura
items.equipment.artifacts.hornofplenty.ac_snack=LANCHAR
items.equipment.artifacts.hornofplenty.ac_eat=COMER
items.equipment.artifacts.hornofplenty.ac_store=GUARDAR
items.equipment.artifacts.hornofplenty.eat=Você comeu do chifre.
items.equipment.artifacts.hornofplenty.prompt=Escolha alguma comida
items.equipment.artifacts.hornofplenty.no_food=Não há comida no chifre para comer!
items.equipment.artifacts.hornofplenty.full=O chifre está cheio de comida!
items.equipment.artifacts.hornofplenty.reject=O chifre rejeitou a frutinsossa crua.
items.equipment.artifacts.hornofplenty.maxlevel=O chifre consumiu toda a comida que ele podia!
items.equipment.artifacts.hornofplenty.levelup=O chifre consumiu a sua oferenda de comida e cresceu em força!
items.equipment.artifacts.hornofplenty.feed=O chifre consome o alimento oferecido.
items.equipment.artifacts.hornofplenty.desc=Este chifre não pode ser soprado, mas parece se encher de comida conforme você se aventura e ganha experiência. Você pode consumir cada carga individualmente como um lanche ou comer até estar satisfeito.
items.equipment.artifacts.hornofplenty.desc_hint=Talvez haja um jeito de aumentar o poder do chifre lhe dando energia de uma comida
items.equipment.artifacts.hornofplenty.desc_cursed=O chifre amaldiçoado se prendeu a você. Ele parece estar roubando a efetividade da comida em vez de produzi-la.

items.equipment.artifacts.lloydsbeacon.name=Transmissor de Lloyd
items.equipment.artifacts.lloydsbeacon.ac_set=ATIVAR
items.equipment.artifacts.lloydsbeacon.ac_return=RETORNAR
items.equipment.artifacts.lloydsbeacon.preventing=A forte aura mágica deste lugar impede que você use o Transmissor de Lloyd!
items.equipment.artifacts.lloydsbeacon.creatures=A aura psíquica de criaturas próximas impedem você de usar o Transmissor de Lloyd neste momento.
items.equipment.artifacts.lloydsbeacon.return=O Transmissor de Lloyd está marcado na sua localização atual, agora você pode retornar aqui a qualquer momento.
items.equipment.artifacts.lloydsbeacon.desc_set=Este transmissor foi marcado em algum lugar no %d andar da masmorra.

items.equipment.artifacts.masterthievesarmband.name=braçadeira do mestre dos ladrões
items.equipment.artifacts.masterthievesarmband.ac_steal=ROUBAR
items.equipment.artifacts.masterthievesarmband.no_charge=Sua braçadeira não tem carga o suficiente.
items.equipment.artifacts.masterthievesarmband.cursed=Você não pode usar uma braçadeira amaldiçoada.
items.equipment.artifacts.masterthievesarmband.full=Sua braçadeira está totalmente carregada!
items.equipment.artifacts.masterthievesarmband.prompt=Escolha um inimigo como alvo
items.equipment.artifacts.masterthievesarmband.no_target=Você deve escolher um inimigo que esteja adjacente a você.
items.equipment.artifacts.masterthievesarmband.steal_shopkeeper=Você não pode roubar diretamente dos lojistas.
items.equipment.artifacts.masterthievesarmband.no_steal=Não há nada para roubar deste inimigo.
items.equipment.artifacts.masterthievesarmband.stole_item=Você roubou um item: %s.
items.equipment.artifacts.masterthievesarmband.failed_steal=Você não conseguiu roubar nada.
items.equipment.artifacts.masterthievesarmband.level_up=Sua braçadeira ficou mais poderosa!
items.equipment.artifacts.masterthievesarmband.desc=Esta braçadeira de veludo roxo tem a marca de um ladrão mestre. Ela não pertence a você, mas provavelmente também não pertencia ao seu último usuário.
items.equipment.artifacts.masterthievesarmband.desc_cursed=A braçadeira amaldiçoada está presa ao seu braço e, de alguma forma, sua bolsa de ouro parece estar lentamente ficando mais leve...
items.equipment.artifacts.masterthievesarmband.desc_worn=Você sente o poder aumentando na braçadeira em seu braço à medida que ganha experiência. Você pode usar esse poder para roubar lojas ou roubar inimigos!\n\nRoubar inimigos acontece instantaneamente, desorienta-os brevemente e dá a você a chance de obter qualquer item que eles tenham! Este poder é mais efetivo contra inimigos que não tenham percebido sua presença. Roubar o mesmo inimigo várias vezes não dá mais chances de saque.

items.equipment.artifacts.sandalsofnature.name=sandálias da natureza
items.equipment.artifacts.sandalsofnature.name_1=sapatos da natureza
items.equipment.artifacts.sandalsofnature.name_2=botas da natureza
items.equipment.artifacts.sandalsofnature.name_3=grevas da natureza
items.equipment.artifacts.sandalsofnature.ac_feed=ALIMENTAR
items.equipment.artifacts.sandalsofnature.ac_root=ENRAIZAR
items.equipment.artifacts.sandalsofnature.prompt=Selecione uma semente.
items.equipment.artifacts.sandalsofnature.levelup=Seus calçados cresceram em tamanho!
items.equipment.artifacts.sandalsofnature.absorb_seed=Seus calçados absorveram a semente, parecem mais saudáveis agora.
items.equipment.artifacts.sandalsofnature.no_effect=Você deve primeiro alimentar seus calçados com uma semente.
items.equipment.artifacts.sandalsofnature.low_charge=Seus calçados não têm energia suficiente para isto.
items.equipment.artifacts.sandalsofnature.prompt_target=Escolha um local
items.equipment.artifacts.sandalsofnature.out_of_range=Esse local está fora de alcance.
items.equipment.artifacts.sandalsofnature.desc_1=O que inicialmente pareciam duas sandálias feitas de vinhas são na verdade duas plantas! Elas parecem muito fracas e pálidas, talvez você tenha que lhes dar nutrientes?
items.equipment.artifacts.sandalsofnature.desc_2=Os calçados cresceram e agora mais se assemelham a dois sapatos sob medida. Um pouco de cor voltou a eles, talvez ainda possam crescer mais?
items.equipment.artifacts.sandalsofnature.desc_3=As plantas cresceram novamente e agora se assemelham a um par de botas sólidas feitas de casca de árvore. As plantas parecem ter recuperado a sua força, mas talvez ainda possam crescer mais?
items.equipment.artifacts.sandalsofnature.desc_4=As plantas parecem ter atingido seu tamanho máximo, assemelhando-se agora a um par de grevas encouraçadas. As grevas são de um marrom profundo e se aparentam a uma árvore muito robusta.
items.equipment.artifacts.sandalsofnature.desc_hint=Você se sente mais conectado com a natureza ao usar este artefato.
items.equipment.artifacts.sandalsofnature.desc_cursed=As sandálias amaldiçoadas estão bloqueando qualquer sintonia com a natureza.
items.equipment.artifacts.sandalsofnature.desc_ability=Linhas onduladas surgem nos calçados com a cor da última semente que você os alimentou. Eles podem enraizar-se brevemente no solo e produzir o efeito dessa planta em qualquer lugar em um raio de 3 quadrados.\nSemente: _%s_\nCarga necessária: _%d%%_
items.equipment.artifacts.sandalsofnature.desc_seeds=Você já alimentou os calçados com %d sementes.

items.equipment.artifacts.skeletonkey.name=chave de crânio
items.equipment.artifacts.skeletonkey.ac_insert=INSERIR
items.equipment.artifacts.skeletonkey.cursed=Você não pode usar uma chave de crânio amaldiçoada.
items.equipment.artifacts.skeletonkey.prompt=Escolha um alvo
items.equipment.artifacts.skeletonkey.invalid_target=Não há nada para trancar ou destrancar aqui.
items.equipment.artifacts.skeletonkey.lock_no_space=Você não pode trancar um personagem dentro de uma porta!
items.equipment.artifacts.skeletonkey.iron_charges=Abrir uma fechadura comum requer 1 carga.
items.equipment.artifacts.skeletonkey.gold_charges=Abrir uma fechadura dourada requer 2 cargas.
items.equipment.artifacts.skeletonkey.lock_charges=Trancar uma porta requer 2 cargas.
items.equipment.artifacts.skeletonkey.wall_charges=Criar uma parede temporária requer 2 cargas.
items.equipment.artifacts.skeletonkey.crystal_charges=Abrir uma fechadura de cristal requer 5 cargas.
items.equipment.artifacts.skeletonkey.wont_open=A chave se recusa a entrar nesta fechadura por algum motivo.
items.equipment.artifacts.skeletonkey.locked_with_key=Esta porta foi trancada pela sua chave de crânio.
items.equipment.artifacts.skeletonkey.force_lock=A fechadura ficou mais frágil sem a sua chave de crânio. Você consegue forçá-la para abrir.
items.equipment.artifacts.skeletonkey.discard=Você descarta as chaves em excesso.
items.equipment.artifacts.skeletonkey.levelup=Sua chave de crânio cresce em força!
items.equipment.artifacts.skeletonkey.desc=Uma chave de aparência importante, com a cabeça em formato de crânio. Seus dentes parecem diferentes a cada vez que olha para ela.
items.equipment.artifacts.skeletonkey.desc_worn=Esta chave mágica parece ganhar poder conforme você a usa em vez de usar as chaves comuns da masmorra. Ela pode ser inserida em quase todas as fechaduras da masmorra para abri-las ou fechá-las, incluindo portas que nunca foram trancadas antes.\n\nA chave pode até ser usada em um espaço vazio em uma direção cardinal ou diagonal para "trancar" o ar à sua frente, criando uma parede sólida de 3 quadrados de largura que dura 10 turnos. Travar o ar repelirá os inimigos se houver espaço para isso.
items.equipment.artifacts.skeletonkey.desc_cursed=A chave amaldiçoada parece estar deliberadamente evitando entrar em qualquer fechadura, e até mesmo dificultando (mas não impossibilitando) o uso de suas outras chaves.
items.equipment.artifacts.skeletonkey$keywall.desc=Uma parede mágica temporária foi colocada aqui pela chave de crânio.

items.equipment.artifacts.talismanofforesight.name=talismã da vidência
items.equipment.artifacts.talismanofforesight.ac_scry=REVELAR
items.equipment.artifacts.talismanofforesight.low_charge=O talismã requer pelo menos 5% de carga para revelar.
items.equipment.artifacts.talismanofforesight.prompt=Escolha um local para escanear.
items.equipment.artifacts.talismanofforesight.levelup=Seu Talismã ficou mais forte!
items.equipment.artifacts.talismanofforesight.full_charge=Seu Talismã está totalmente carregado!
items.equipment.artifacts.talismanofforesight.desc=Uma pedra lisa com gravuras estranhas. Você sente como se estivesse observando tudo à sua volta, vigiando tudo o que está escondido.
items.equipment.artifacts.talismanofforesight.desc_worn=Quando segura o talismã, você sente como se seus sentidos estivessem mais aguçados. O talismã está lentamente acumulando cargas à medida que o tempo passa e quando você descobre portas ou armadilhas escondidas.\n\nO talismã pode gastar sua carga para 'revelar' em forma de cone, fazendo com que todos os azulejos e segredos na área analisada sejam expostos. Também lhe concederá visão dos inimigos e itens por um curto período de tempo.
items.equipment.artifacts.talismanofforesight.desc_cursed=O talismã amaldiçoado está olhando fixamente para você, enfraquecendo os seus sentidos.
items.equipment.artifacts.talismanofforesight$foresight.name=vidência
items.equipment.artifacts.talismanofforesight$foresight.uneasy=Você se sente apreensivo.
items.equipment.artifacts.talismanofforesight$foresight.desc=Você se sente muito apreensivo, como se tivesse algum perigo por perto.

items.equipment.artifacts.timekeepershourglass.name=ampulheta do guardião do tempo
items.equipment.artifacts.timekeepershourglass.ac_activate=ATIVAR
items.equipment.artifacts.timekeepershourglass.deactivate=Você desativou o congelamento do tempo.
items.equipment.artifacts.timekeepershourglass.no_charge=Sua ampulheta ainda não recarregou o suficiente para ser usada.
items.equipment.artifacts.timekeepershourglass.cursed=Você não pode usar uma ampulheta amaldiçoada.
items.equipment.artifacts.timekeepershourglass.onstasis=O mundo parece mudar ao seu redor em um instante.
items.equipment.artifacts.timekeepershourglass.onfreeze=Tudo ao seu redor subitamente congela.
items.equipment.artifacts.timekeepershourglass.stasis=Coloque-me em estase
items.equipment.artifacts.timekeepershourglass.freeze=Pare o tempo ao meu redor
items.equipment.artifacts.timekeepershourglass.prompt=Como você gostaria de usar a magia da ampulheta?\n\nDurante a estase, o tempo correrá normalmente enquanto você fica congelado e completamente invulnerável, consumindo até 2 cargas por vez.\n\nQuando o tempo está congelado, você pode se mover como se suas ações não tomassem tempo. Isso pode ser desativado a qualquer momento usando a ampulheta ou atacando.
items.equipment.artifacts.timekeepershourglass.desc=Esta grande e ornamentada ampulheta parece relativamente modesta, mas você sente um grande poder em sua moldura finamente esculpida. Ao girar a ampulheta e ver a areia derramar você pode sentir a sua magia puxando você. Certamente, usar essa magia daria a você algum controle sobre o tempo.
items.equipment.artifacts.timekeepershourglass.desc_hint=A ampulheta parece ter perdido muita areia. Se você pudesse encontrar mais...
items.equipment.artifacts.timekeepershourglass.desc_cursed=A ampulheta amaldiçoada está presa ao seu corpo, você pode senti-la tentando manipular o seu fluxo de tempo.
items.equipment.artifacts.timekeepershourglass$timefreeze.name=Congelamento de tempo
items.equipment.artifacts.timekeepershourglass$timefreeze.desc=O tempo está congelado ao seu redor, permitindo que você execute ações instantaneamente. O efeito durará até que seja cancelado ou sua ampulheta fique sem carga. Atacar ou usar magia também quebrará esse efeito.\n\nTurnos até o uso de carga: %s.
items.equipment.artifacts.timekeepershourglass$sandbag.name=saco de areia mágica
items.equipment.artifacts.timekeepershourglass$sandbag.levelup=Você adicionou a areia a sua ampulheta.
items.equipment.artifacts.timekeepershourglass$sandbag.maxlevel=Sua ampulheta está cheia de areia mágica!
items.equipment.artifacts.timekeepershourglass$sandbag.no_hourglass=Você não tem uma ampulheta para colocar esta areia.
items.equipment.artifacts.timekeepershourglass$sandbag.desc=Esta pequena bolsa de areia mágica parece funcionar perfeitamente com sua ampulheta.\n\nParece muito conveniente que o lojista tenha especificamente este item bem quando você precisa...

items.equipment.artifacts.unstablespellbook.name=livro de feitiços instável
items.equipment.artifacts.unstablespellbook.ac_read=LER
items.equipment.artifacts.unstablespellbook.ac_add=ADICIONAR
items.equipment.artifacts.unstablespellbook.blinded=Você não pode ler o livro enquanto está cegado.
items.equipment.artifacts.unstablespellbook.no_charge=Seu livro de feitiços está sem energia agora.
items.equipment.artifacts.unstablespellbook.cursed=Você não pode ler o livro de feitiços amaldiçoado.
items.equipment.artifacts.unstablespellbook.prompt=Selecione um pergaminho
items.equipment.artifacts.unstablespellbook.infuse_scroll=Você infundiu a energia do pergaminho no livro.
items.equipment.artifacts.unstablespellbook.unable_scroll=Você é incapaz de adicionar este pergaminho ao livro.
items.equipment.artifacts.unstablespellbook.unknown_scroll=Você ainda não tem certeza de que tipo de pergaminho é este para adicionar ao livro.
items.equipment.artifacts.unstablespellbook.desc=Este livro está em surpreendentes boas condições dada a sua idade. Ele chia e estala conforme você move as páginas, brilhando com energia instável. Se ler deste livro, não há como dizer que feitiço você irá lançar.
items.equipment.artifacts.unstablespellbook.desc_cursed=O livro amaldiçoado se prendeu a você e está inibindo a sua habilidade de usar pergaminhos.
items.equipment.artifacts.unstablespellbook.desc_index=Este livro está incompleto. Seu índice está atualmente apontando para as seguintes folhas em branco:
items.equipment.artifacts.unstablespellbook.desc_empowered=Os pergaminhos que você adicionou ao livro estão brilhando com poder. Você poderá escolher a versão exótica dos efeitos desses pergaminhos, mas ao custo de uma carga adicional.
items.equipment.artifacts.unstablespellbook.read_empowered=O pergaminho que você adicionou ao livro de feitiços surge com energia. Você pode canalizar a versão regular ou exótica do efeito desse pergaminho.\n\nA escolha da variante exótica custará 2 cargas ao invés de 1.



###bags
items.equipment.bags.bag.name=mochila
items.equipment.bags.bag.discover_hint=Você pode comprar este item em uma loja.

items.equipment.bags.potionbandolier.name=bandoleira de poções
items.equipment.bags.potionbandolier.desc=Esta bandoleira grossa se encaixa em torno de seu peito como um cinto, ela tem várias tiras isoladas para armazenar frascos de poção, seu odre de água ou frascos de metal líquido.\n\nEnquanto estiverem dentro da bandoleira, suas poções estarão protegidas do frio.

items.equipment.bags.scrollholder.name=canudo de pergaminhos
items.equipment.bags.scrollholder.desc=Este recipiente tubular parece poder armazenar ferramentas e gráficos de um astrônomo, mas parece servir muito bem para guardar seus pergaminhos. Há até alguns compartimentos laterais os quais os seus cristais, suas canetas arcanas e resinas arcanas também parecem poder se ajustar bem.\n\nO suporte não parece ser inflamável, portanto seus pergaminhos devem estar seguros do fogo dentro dele.

items.equipment.bags.velvetpouch.name=bolsa de veludo
items.equipment.bags.velvetpouch.desc=Esta pequena bolsa de veludo pode armazenar muitos itens pequenos, como sementes, pedras rúnicas e alguns ingredientes de alquimia.
items.equipment.bags.velvetpouch.discover_hint=Um dos heróis inicia com este item.

items.equipment.bags.magicalholster.name=coldre mágico
items.equipment.bags.magicalholster.desc=Este coldre fino é feito de alguma pele de animal exótico e possui uma magia poderosa que permite armazenar uma grande quantidade de armas de longo alcance.\n\nVocê pode simplesmente colocar a mão no coldre e sempre pegar o item que estava procurando.\n\nDevido à magia do coldre, as varinhas carregam um pouco mais rápido e as armas de longo alcance duram um pouco mais dentro dele.



###bombs
items.equipment.bombs.arcanebomb.name=bomba arcana
items.equipment.bombs.arcanebomb.desc=Esta bomba foi imbuída com propriedades arcanas. Ela irá detonar em uma explosão poderosa semelhante ao ataque carregado de Goo, causando _%1$d-%2$d de dano mágico_ a qualquer coisa dentro de 2 quadrados.
items.equipment.bombs.arcanebomb.discover_hint=Você pode fabricar este item através de alquimia.

items.equipment.bombs.bomb.name=bomba
items.equipment.bombs.bomb.ac_lightthrow=ACENDER & JOGAR
items.equipment.bombs.bomb.snuff_fuse=Você rapidamente apaga o pavio da bomba.
items.equipment.bombs.bomb.ondeath=A explosão matou você...
items.equipment.bombs.bomb.rankings_desc=Morto por uma explosão
items.equipment.bombs.bomb.desc=Uma bomba de pólvora preta bem pesada. Uma explosão desta bomba causa _%1$d-%2$d de dano_ a qualquer coisa adjacente a ela e irá destruir itens ou terrenos adjacentes.
items.equipment.bombs.bomb.desc_fuse=Parece que o fusível levará algumas rodadas para queimar quando estiver aceso.
items.equipment.bombs.bomb.desc_burning=O fusível da bomba está queimando, mantenha distância ou apague-o!
items.equipment.bombs.bomb$doublebomb.name=duas bombas
items.equipment.bombs.bomb$doublebomb.desc=Um par de bombas pretas e pesadas. Parece que você vai ganhar uma de graça!

items.equipment.bombs.firebomb.name=bomba de fogo
items.equipment.bombs.firebomb.desc=Esta bomba foi modificada para explodir em uma área extensa, causando _%1$d-%2$d de dano_ e espalhando chamas de longa duração em 2 blocos.
items.equipment.bombs.firebomb.discover_hint=Você pode fabricar este item através de alquimia.

items.equipment.bombs.flashbangbomb.name=bomba de luz
items.equipment.bombs.flashbangbomb.desc=Esta bomba personalizada irá irromper em um clarão de luz, som e eletricidade quando explodir. Qualquer coisa dentro de 2 quadrados receberá _%1$d-%2$d de dano_ da explosão, um dano adicional de 25%% da eletricidade e ficará atordoado por 10 turnos.
items.equipment.bombs.flashbangbomb.discover_hint=Você pode fabricar este item através de alquimia.

items.equipment.bombs.frostbomb.name=bomba de gelo
items.equipment.bombs.frostbomb.desc=Esta bomba foi modificada para explodir em uma área extensa, causando _%1$d-%2$d de dano_ e espalhando uma rajada de ar congelante de longa duração dentro de 2 quadrados ao seu redor.
items.equipment.bombs.frostbomb.discover_hint=Você pode fabricar este item através de alquimia.

items.equipment.bombs.holybomb.name=bomba sagrada
items.equipment.bombs.holybomb.desc=Esta bomba foi modificada para produzir um clarão de luz sagrada em uma extensa área quando explode. Qualquer coisa dentro de 2 quadrados receberá _%1$d-%2$d de dano_ da explosão, e inimigos mortos-vivos ou demoníacos receberão 50%% de dano adicional da luz sagrada.
items.equipment.bombs.holybomb.discover_hint=Você pode fabricar este item através de alquimia.

items.equipment.bombs.noisemaker.name=barulhenta
items.equipment.bombs.noisemaker.desc=Esta bomba personalizada emitirá ruídos repetidamente quando o fusível queimar. Quando algo tocar na bomba, ela explodirá e causará _%1$d-%2$d de dano_ a qualquer coisa dentro de 2 quadrados!
items.equipment.bombs.noisemaker.desc_burning=A barulhenta está fazendo tic-toc. Ela vai explodir quando algo se aproximar!
items.equipment.bombs.noisemaker.discover_hint=Você pode fabricar este item através de alquimia.

items.equipment.bombs.smokebomb.name=Bomba de fumaça
items.equipment.bombs.smokebomb.desc=Esta bomba foi modificada para expelir uma espessa nuvem de gás ao mesmo tempo em que explode. Ela causará _%1$d-%2$d de dano_ e espalhará névoa dentro de 2 quadrados.
items.equipment.bombs.smokebomb.discover_hint=Você pode fabricar este item através de alquimia.

items.equipment.bombs.regrowthbomb.name=bomba de maturação
items.equipment.bombs.regrowthbomb.desc=Esta bomba personalizada irá espalhar líquido que dá vida a tudo dentro de 3 quadrados ao invés de explodir. A área atingida pelo impacto rapidamente brotará grama e plantas. Você e quaisquer aliados pegos na zona de impacto serão curados, como se tivessem tomado uma poção de cura.
items.equipment.bombs.regrowthbomb.discover_hint=Você pode fabricar este item através de alquimia.

items.equipment.bombs.shrapnelbomb.name=bomba de estilhaços
items.equipment.bombs.shrapnelbomb.desc=Esta bomba foi modificada com restos de metal do DM-300, que se fragmentarão e voarão para todos os lados quando explodirem, causando _%1$d-%2$d de dano_ em uma área muito extensa ao redor da bomba. É melhor se abrigar atrás de algo ao usá-la...
items.equipment.bombs.shrapnelbomb.discover_hint=Você pode fabricar este item através de alquimia.

items.equipment.bombs.woollybomb.name=bomb-á-á
items.equipment.bombs.woollybomb.desc=Esta bomba personalizada criará um extenso rebanho de ovelhas mágicas após explodir. A explosão causará _%1$d-%2$d de dano_ a qualquer coisa dentro de 2 quadrados. As ovelhas bloquearão o movimento e persistirão por muito tempo! Porém, as ovelhas não durarão muito na presença de inimigos poderosos. Podem ser dissipadas manualmente mais cedo interagindo-se com elas.
items.equipment.bombs.woollybomb.discover_hint=Você pode fabricar este item através de alquimia.

###food
items.consum.food.berry.name=baga da masmorra
items.consum.food.berry.eat_msg=A baga estava saborosa!
items.consum.food.berry.desc=Esta pequena baga foi encontrada pela Caçadora entre a vegetação da masmorra. Pode ser comida rapidamente, restaura uma pequena quantidade de saciedade e pode conter uma semente utilizável!
items.consum.food.berry.discover_hint=Você pode encontrar este item usando um talento de herói específico.

items.consum.food.blandfruit.name=frutinsossa
items.consum.food.blandfruit.cooked=frutinsossa cozida
items.consum.food.blandfruit.sunfruit=fruta-solar
items.consum.food.blandfruit.rotfruit=podre-fruta
items.consum.food.blandfruit.earthfruit=fruta-terra
items.consum.food.blandfruit.blindfruit=fruta-cegante
items.consum.food.blandfruit.firefruit=fruta-fogo
items.consum.food.blandfruit.icefruit=fruta-gelo
items.consum.food.blandfruit.fadefruit=fruta-fantasma
items.consum.food.blandfruit.sorrowfruit=sofrifruta
items.consum.food.blandfruit.stormfruit=fruta-tempestuosa
items.consum.food.blandfruit.dreamfruit=fruta-magi
items.consum.food.blandfruit.starfruit=fruta-estrela
items.consum.food.blandfruit.swiftfruit=fruta-ligeira
items.consum.food.blandfruit.raw=Você não suporta comer isto cru.
items.consum.food.blandfruit.desc=Muito seca e sem gosto. Talvez cozinhá-la com outro ingrediente melhorasse o seu gosto.
items.consum.food.blandfruit.desc_cooked=A fruta inchou no tempo em que ficou de molho no pote e até absorveu as propriedades da semente com a qual foi cozida. Terá o efeito de qualquer poção à qual a semente corresponda.
items.consum.food.blandfruit.desc_eat=Parece pronto para comer!
items.consum.food.blandfruit.desc_throw=Parece muito volátil, talvez seja melhor arremessar.
items.consum.food.blandfruit$chunks.name=pedaços de frutinsossa
items.consum.food.blandfruit$chunks.desc=A frutinsossa explodiu no impacto, deixando pedaços inertes para trás.\n\nApesar de um pouco sujos, estes grandes pedaços de frutinsossa cozida parecem perfeitamente comestíveis.

items.consum.food.chargrilledmeat.name=carne grelhada
items.consum.food.chargrilledmeat.desc=Tem a aparência de um bife decente.
items.consum.food.chargrilledmeat.discover_hint=Você pode criar isto usando outro alimento.

items.consum.food.food.name=ração
items.consum.food.food.ac_eat=COMER
items.consum.food.food.eat_msg=A comida estava deliciosa!
items.consum.food.food.desc=Nada de mais aqui: carne seca, alguns biscoitos - coisas desse tipo.

items.consum.food.frozencarpaccio.name=carpaccio congelado
items.consum.food.frozencarpaccio.invis=Você vê suas mãos tornarem-se invisíveis!
items.consum.food.frozencarpaccio.hard=Você sente sua pele endurecer!
items.consum.food.frozencarpaccio.refresh=Revigorante!
items.consum.food.frozencarpaccio.better=Você se sente melhor!
items.consum.food.frozencarpaccio.desc=É um pedaço de carne crua congelada. A única maneira de comer é cortando em fatias bem finas. E desta forma, fica surpreendentemente bom.
items.consum.food.frozencarpaccio.discover_hint=Você pode criar isto usando outro alimento.

items.consum.food.meatpie.name=torta de carne
items.consum.food.meatpie.eat_msg=A comida estava incrível!
items.consum.food.meatpie.desc=Uma deliciosa torta recheada de carne saborosa. Isso vai saciá-lo muito mais do que qualquer outra refeição.
items.consum.food.meatpie.discover_hint=Você pode fabricar este item através de alquimia.

items.consum.food.mysterymeat.name=carne misteriosa
items.consum.food.mysterymeat.eat_msg=A comida estava com um gosto... esquisito.
items.consum.food.mysterymeat.hot=Ah! Está quente!
items.consum.food.mysterymeat.legs=Você não sente suas pernas!
items.consum.food.mysterymeat.not_well=Você não se sente bem.
items.consum.food.mysterymeat.stuffed=Você está estufado.
items.consum.food.mysterymeat.desc=Coma por sua própria conta e risco.
items.consum.food.mysterymeat.discover_hint=Você pode obter este item como um saque de certos inimigos.
items.consum.food.mysterymeat$placeholder.name=carne

items.consum.food.phantommeat.name=carne fantasma
items.consum.food.phantommeat.desc=Um grande e brilhante bife translúcido, cortado de uma piranha fantasma. Esta carne mágica não precisa ser cozida e concede uma série de benefícios defensivos, além de saciá-lo completamente. Quando comida, concede invisibilidade, pele arbórea, restaura certa quantidade de PV e cura muitos efeitos nocivos.
items.consum.food.phantommeat.discover_hint=Você pode obter este item como um saque de certos inimigos.

items.consum.food.pasty.name=salgado
items.consum.food.pasty.fish_name=peixe ao vapor
items.consum.food.pasty.amulet_name=amuleto de yendor?
items.consum.food.pasty.egg_name=ovo de páscoa
items.consum.food.pasty.rainbow_name=poção arco-íris
items.consum.food.pasty.shattered_name=bolo verde
items.consum.food.pasty.pie_name=torta de abóbora
items.consum.food.pasty.vanilla_name=bolo azul
items.consum.food.pasty.cane_name=bengala doce
items.consum.food.pasty.sparkling_name=poção espumante
items.consum.food.pasty.desc=Um autêntico salgado da Cornualha com um recheio tradicional de carne bovina e batata. Delicioso!
items.consum.food.pasty.fish_desc=Um peixe inteiro cozido ao vapor, magicamente preservado em uma cama de verduras. É tradição guardar um pouco de peixe para mais tarde nesta época do ano, então você vai guardar algumas sobras em vez de comer tudo de uma vez.\n\nFeliz Ano Novo Lunar!
items.consum.food.pasty.amulet_desc=Você finalmente o encontrou, o amuleto mágico de... espera um minuto, isto é apenas um chocolate embrulhado em papel alumínio feito para parecer o amuleto! Ele não irá dar a você poder ilimitado, mas pelo menos te deixará cheio e lhe dará uma pequena carga de artefato.\n\n1° de Abril!
items.consum.food.pasty.egg_desc=Um ovo bem grande de chocolate, envolto em papel alumínio amarelo colorido. Há chocolate de sobra aqui para deixá-lo cheio e o açúcar pode dar aos seus artefatos um pouquinho de carga extra.\n\nFeliz Páscoa!
items.consum.food.pasty.rainbow_desc=Esta poção colorida é uma espécie de alimento líquido. Além de satisfazer sua fome, contém um pouco de magia que acalmará um inimigo adjacente que não seja chefe, fazendo-o temporariamente hesitante em lutar contra você.\n\nFeliz Orgulho Gay!
items.consum.food.pasty.shattered_desc=Esta fatia grande de bolo de baunilha tem granulados coloridos e cobertura verde. O bolo foi feito para comemorar anos de experiência e vai lhe conceder um pouco dessa experiência quando comido.\n\nShattered Pixel Dungeon foi lançado pela primeira vez em 5 de agosto de 2014. Feliz aniversário, Shattered Pixel Dungeon!
items.consum.food.pasty.pie_desc=Um pedaço bem grande de torta de abóbora! Seu sabor doce e apimentado irá deixar você cheio e lhe dará um pouco de cura.\n\nFeliz Dia das Bruxas!
items.consum.food.pasty.vanilla_desc=Esta fatia grande de bolo de baunilha tem granulados coloridos e cobertura azul. O bolo foi feito para comemorar anos de experiência e vai lhe conceder um pouco dessa experiência quando comido.\n\nO Pixel Dungeon original foi lançado em 4 de dezembro de 2012. Feliz aniversário, Pixel Dungeon!
items.consum.food.pasty.cane_desc=Uma enorme e açucarada bengala doce! É grande o suficiente para matar sua fome, e o açúcar pode dar à suas varinhas um pouquinho de carga extra também.\n\nFeliz Natal!
items.consum.food.pasty.sparkling_desc=Esta poção espumante é uma espécie de alimento líquido. Sacia a fome e simula vinho espumante, mas na verdade não é alcoólico.  A sensação de calor na barriga lhe dará um pouco de proteção.\n\nFeliz Ano Novo!
items.consum.food.pasty$fishleftover.name=Sobras de peixe
items.consum.food.pasty$fishleftover.eat_msg=A comida estava razoável.
items.consum.food.pasty$fishleftover.desc=Algum peixe que sobrou da sua refeição anterior. Você pode comer a qualquer momento para saciar um pouco de fome.

items.consum.food.smallration.name=ração pequena
items.consum.food.smallration.eat_msg=A comida estava razoável.
items.consum.food.smallration.desc=Parece exatamente como uma ração comum, mas um pouco menor.
items.consum.food.smallration.discover_hint=Você pode comprar este item em uma loja.

items.consum.food.stewedmeat.name=carne cozida
items.consum.food.stewedmeat.eat_msg=A comida estava razoável.
items.consum.food.stewedmeat.desc=Ensopar a carne limpou-a de qualquer doença ou parasita. Deve ser seguro comer.
items.consum.food.stewedmeat.discover_hint=Você pode fabricar este item através de alquimia.

items.consum.food.supplyration.name=ração de suprimento
items.consum.food.supplyration.desc=Esta ração foi deixada na masmorra por membros e para membros da guilda dos ladrões. Ela foi projetada especificamente para ser consumida em viagem e para ajudar em trapaças em geral.\n\nEmbora não o sacie tanto quanto uma ração normal, pode ser comida rapidamente, fornece um pouco de cura direta e restaurará uma carga da capa das sombras do Ladino.
items.consum.food.supplyration.discover_hint=Você pode encontrar este item usando um talento de herói específico.



##journal items
items.specific.journal.documentpage.name=página rasgada
items.specific.journal.documentpage.desc=Uma página sólitaria, provavelmente rasgada de algum livro. Voce precisa pegar para poder lê-la.

items.specific.journal.alchemypage.name=página do livro de alquimia rasgada
items.specific.journal.alchemypage.desc=Uma página rasgada de um guia sobre alquimia.\n\nA maior parte do texto é pequeno demais para ler a distância, mas você pode ver o título da página:\n\n_"%s"_

items.specific.journal.guidebook.name=tomo de maestria da masmorra
items.specific.journal.guidebook.hint_mobile=Seu guia tem conselhos para você! Toque no botão piscante do diário no canto superior direito para lê-lo.
items.specific.journal.guidebook.hint_desktop=Seu guia tem conselhos para você! Selecione o botão de diário piscante (%s) no canto superior direito para lê-lo.
items.specific.journal.guidebook.hint_status=Guia
items.specific.journal.guidebook.desc=Um guia do aventureiro, deixado aqui por alguém que decidiu que se aventurar não era para ele! Este livro em particular é mágico e pode incitar aventureiros a ler uma página no momento certo.\n\nApesar dessa funcionalidade, o livro é popular por causa das grandes palavras "Não entre em Pânico" escritas em grandes letras amigáveis na capa.

items.specific.journal.guidepage.name=página rasgada do guia
items.specific.journal.guidepage.desc=Uma página rasgada de um guia de aventura.\n\nA maior parte do texto é muito pequena para ser lida a distância, mas você consegue ler o título da página:\n\n_"%s"_

items.specific.journal.regionlorepage$sewers.name=carta deteriorada
items.specific.journal.regionlorepage$sewers.desc=Parece ser uma carta, escrita em um pedaço de papel sujo de terra. Você precisa pegá-la para conseguir entender o que está escrito.

items.specific.journal.regionlorepage$prison.name=página de diário desgastada
items.specific.journal.regionlorepage$prison.desc=Uma nota, ou algum outro tipo de registro, escrita em um velho pedaço de papel. Parece ter sofrido menos do que as cartas que você encontrou nos esgotos, mas você ainda precisa pegá-la para ler o que está escrito.

items.specific.journal.regionlorepage$caves.name=página de registro antiga
items.specific.journal.regionlorepage$caves.desc=Parece ser uma página de um diário pertencente a algum explorador, incrivelmente bem preservada, apesar do quão antiga deva ser. Pegue-a para ler.

items.specific.journal.regionlorepage$city.name=tabuleta enferrujada
items.specific.journal.regionlorepage$city.desc=Uma pequena e enferrujada tabuleta de metal com uma mensagem magicamente entalhada nela. As letras ainda estão claras mesmo tendo sido escritas anos atrás, mas você precisa pegá-la para ler o que está escrito.

items.specific.journal.regionlorepage$halls.name=tabuleta brilhante
items.specific.journal.regionlorepage$halls.desc=Uma pequena tabuleta preta, com letras verdes brilhantes entalhadas nela. As brilhantes letras juntas formam um borrão quando vistas de longe. Você precisa pegar a tabuleta para lê-la.


###keys
items.specific.keys.goldenkey.name=chave dourada
items.specific.keys.goldenkey.desc=Os entalhes desta chave de ouro são pequenos e intrincados. Talvez ela abra um baú trancado?

items.specific.keys.crystalkey.name=Chave de Cristal
items.specific.keys.crystalkey.desc=As superfícies cortadas desta chave cristalina brilham na escuridão. Talvez abra algo feito de cristal?

items.specific.keys.ironkey.name=chave de ferro
items.specific.keys.ironkey.desc=Os entalhes nesta chave de ferro antiga estão bem desgastados; seu cordão de couro está desgastado pela idade. Que porta poderia abrir?

items.specific.keys.wornkey.name=chave desgastada
items.specific.keys.wornkey.desc=Esta chave está gasta e desbotada, mas parece importante. Provavelmente consegue abrir alguma porta importante por perto.



###potions
items.consum.potions.potion.ac_drink=BEBER
items.consum.potions.potion.turquoise=poção turquesa
items.consum.potions.potion.crimson=poção escarlate
items.consum.potions.potion.azure=poção azul
items.consum.potions.potion.jade=poção verde
items.consum.potions.potion.golden=poção dourada
items.consum.potions.potion.magenta=poção magenta
items.consum.potions.potion.charcoal=poção grafite
items.consum.potions.potion.ivory=poção marfim
items.consum.potions.potion.amber=poção âmbar
items.consum.potions.potion.bistre=poção marrom
items.consum.potions.potion.indigo=poção roxa
items.consum.potions.potion.silver=poção prateada
items.consum.potions.potion.unknown_desc=Este frasco contém um líquido borbulhante. Quem sabe o que irá provocar quando ingerido ou arremessado?
items.consum.potions.potion.harmful=Poção prejudicial!
items.consum.potions.potion.beneficial=Poção benéfica!
items.consum.potions.potion.yes=Sim, sei o que faço
items.consum.potions.potion.no=Não, mudei de ideia
items.consum.potions.potion.sure_drink=Você tem certeza de que quer beber isso? Na maioria dos casos, você deve arremessar tais poções em seus inimigos.
items.consum.potions.potion.sure_throw=Tem certeza de que quer jogar isso? Na maioria dos casos, faria mais sentido beber.
items.consum.potions.potion.shatter=O frasco se despedaçou, e o líquido respinga inofensivamente.
items.consum.potions.potion.discover_hint=Você pode encontrar este item aleatoriamente na masmorra ou criá-lo por meio de alquimia.
items.consum.potions.potion$placeholder.name=poção
items.consum.potions.potion$seedtopotion.name=Poção Aleatória

items.consum.potions.potionofexperience.name=poção de experiência
items.consum.potions.potionofexperience.desc=As experiências célebres de muitas batalhas reduzidas à forma líquida, este líquido vai aumentar instantaneamente o seu nível de experiência.

items.consum.potions.potionoffrost.name=poção gélida
items.consum.potions.potionoffrost.desc=O produto químico contido nesta poção evaporará em uma nuvem congelante após ser exposta ao ar.

items.consum.potions.potionofhaste.name=poção da pressa
items.consum.potions.potionofhaste.energetic=Você se sente enérgico!
items.consum.potions.potionofhaste.desc=Beber este líquido estranhamente doce vai imbuir você com uma tremenda energia por um curto período de tempo, permitindo que você corra em alta velocidade.

items.consum.potions.potionofhealing.name=poção da cura
items.consum.potions.potionofhealing.heal=Suas feridas começam a fechar.
items.consum.potions.potionofhealing.desc=Este elixir irá restaurar rapidamente sua vida e curar instantaneamente muitos efeitos negativos.

items.consum.potions.potionofinvisibility.name=poção de invisibilidade
items.consum.potions.potionofinvisibility.invisible=Você vê as suas mãos ficarem invisíveis!
items.consum.potions.potionofinvisibility.desc=Beber esta poção irá torná-lo temporariamente invisível. Enquanto estiver invisível, os inimigos não serão capazes de enxergar você. Ataques físicos e efeitos mágicos (como pergaminhos e varinhas) irão imediatamente cancelar a invisibilidade.

items.consum.potions.potionoflevitation.name=poção de levitação
items.consum.potions.potionoflevitation.float=Você flutua no ar!
items.consum.potions.potionoflevitation.desc=Beber este líquido curioso fará com que você flutue no ar, sendo capaz de pairar sem esforço sobre armadilhas e buracos. Jogar esta poção irá criar uma nuvem de gás bruto, desorientando qualquer coisa que for pego nela.

items.consum.potions.potionofliquidflame.name=poção da chama líquida
items.consum.potions.potionofliquidflame.desc=Este frasco contém um composto instável que vai estourar violentamente em chamas ao ser exposto ao ar.

items.consum.potions.potionofmindvision.name=poção de visão mental
items.consum.potions.potionofmindvision.see_mobs=De alguma forma, você consegue sentir a presença das mentes de outras criaturas!
items.consum.potions.potionofmindvision.see_none=De alguma maneira, você tem certeza de que está sozinho neste nível no momento.
items.consum.potions.potionofmindvision.desc=Após beber isto, sua mente se tornará sintonizada à assinatura psíquica de criaturas distantes, possibilitando a você pressentir presenças biológicas através de paredes. Além disso, esta poção te permitirá ver através de paredes e portas próximas.

items.consum.potions.potionofparalyticgas.name=poção de gás paralítico
items.consum.potions.potionofparalyticgas.desc=Após ser exposto ao ar, o líquido deste frasco irá vaporizar em uma névoa amarela entorpecente. Qualquer um que inale da nuvem será paralisado instantaneamente, incapaz de se mover por algum tempo. Este item pode ser jogado em inimigos distantes para envolvê-los no efeito do gás.

items.consum.potions.potionofpurity.name=poção de pureza
items.consum.potions.potionofpurity.freshness=Você sente um frescor incomum no ar.
items.consum.potions.potionofpurity.protected=Uma película protetora te envolve!
items.consum.potions.potionofpurity.desc=Este reagente mágico neutralizará rapidamente todos os efeitos nocivos em uma grande área. Beber isso lhe dará imunidade temporária a tais efeitos.

items.consum.potions.potionofstrength.name=poção da força
items.consum.potions.potionofstrength.msg=Uma nova força surge em seu corpo, agora você tem %d de força!
items.consum.potions.potionofstrength.desc=Este líquido poderoso vai percorrer seus músculos, permanentemente aumentando sua força em um ponto.

items.consum.potions.potionoftoxicgas.name=poção de gás tóxico
items.consum.potions.potionoftoxicgas.desc=Removendo a rolha ou quebrando este vidro pressurizado irá fazer com que seu conteúdo exploda numa nuvem mortal de gás tóxico esverdeado. Você pode optar por arremessar esta poção em inimigos distantes em vez de abri-la manualmente.



###brews
items.consum.potions.brews.brew.discover_hint=Você pode fabricar este item através de alquimia.

items.consum.potions.brews.aquabrew.name=composto aquático
items.consum.potions.brews.aquabrew.desc=Quando quebrado, este composto liberará uma explosão de água pressurizada no local. Só é forte o suficiente para causar danos a inimigos de fogo, mas também espalha água em terrenos próximos, desabilita armadilhas, apaga incêndios e arremessa personagens próximos à explosão.

items.consum.potions.brews.blizzardbrew.name=composto nevado
items.consum.potions.brews.blizzardbrew.desc=Quando quebrada, esta mistura desencadeará uma nevasca rodopiante que se espalhará rapidamente como um gás.

items.consum.potions.brews.causticbrew.name=composto cáustico
items.consum.potions.brews.causticbrew.desc=Esta mistura espalhará muco corrosivo em uma ampla área ao redor do local em que se estilhaçar. Qualquer coisa pega pelo muco derreterá lentamente se não puder lavá-lo na água.

items.consum.potions.brews.infernalbrew.name=composto Infernal
items.consum.potions.brews.infernalbrew.desc=Quando quebrada, esta mistura desencadeará um inferno em chamas que se espalhará rapidamente como um gás.

items.consum.potions.brews.shockingbrew.name=composto eletrizado
items.consum.potions.brews.shockingbrew.desc=Quando quebrada, esta mistura desencadeará uma tempestade elétrica em uma ampla área ao redor do local de impacto.

items.consum.potions.brews.unstablebrew.name=composto instável
items.consum.potions.brews.unstablebrew.desc=Este composto mágico brilha alternando entre as cores do arco-íris.\n\nQuando bebido ou jogado, ativará o efeito de uma poção aleatória. O efeito da poção sempre será benéfico se for bebida e sempre será prejudicial se for jogada.

###elixirs
items.consum.potions.elixirs.elixir.discover_hint=Você pode fabricar este item através de alquimia.

items.consum.potions.elixirs.elixirofarcanearmor.name=elixir de armadura arcana
items.consum.potions.elixirs.elixirofarcanearmor.desc=Este elixir proporcionará, àquele que o beber, resistência duradoura a danos mágicos.

items.consum.potions.elixirs.elixirofaquaticrejuvenation.name=elixir de rejuvenescimento aquático
items.consum.potions.elixirs.elixirofaquaticrejuvenation.desc=Este elixir contém os restos de Goo misturados junto com uma poção de cura. Embora não proporcione cura imediata, ela restaurará constantemente uma grande quantidade de vida enquanto você estiver na água.
items.consum.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=cura aquática
items.consum.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Você ganhou temporariamente propriedades restauradoras semelhantes as de Goo.\n\nEnquanto estiver na água, você recuperará uma pequena quantidade de saúde por turno. O efeito é pausado quando você está com a saúde completa ou sem água.\n\nCura restante: %d.

items.consum.potions.elixirs.elixirofdragonsblood.name=elixir de sangue de dragão
items.consum.potions.elixirs.elixirofdragonsblood.desc=Quando consumido, este elixir enviará poder incendiário pelas veias daquele que o bebeu. Esse efeito deixará a pessoa imune ao fogo e permitirá que incendeie os inimigos com ataques físicos.

items.consum.potions.elixirs.elixiroffeatherfall.name=elixir de queda suave
items.consum.potions.elixirs.elixiroffeatherfall.light=Você se sente leve como uma pena!
items.consum.potions.elixirs.elixiroffeatherfall.desc=Este elixir oferece um efeito de levitação mais fraco, porém mais controlado, permitindo àquele que bebe cair grandes distâncias sem sofrer danos por um curto período de tempo.
items.consum.potions.elixirs.elixiroffeatherfall$featherbuff.name=queda suave
items.consum.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Você está sob o efeito de um elixir de queda suave, permitindo com que caia de abismos sem sofrer danos!\n\nTurnos restantes: %s.

items.consum.potions.elixirs.elixirofhoneyedhealing.name=elixir da cura com mel
items.consum.potions.elixirs.elixirofhoneyedhealing.desc=Este elixir combina a cura com a doçura do mel. Quando ingerido, aplicará o mesmo efeito de uma poção de cura e irá satisfazer uma pequena quantidade de fome, também pode ser arremessado para curar um aliado.\n\nCriaturas com afinidade por mel podem ser pacificadas se este item for usado nelas.

items.consum.potions.elixirs.elixiroficytouch.name=elixir do toque gelado
items.consum.potions.elixirs.elixiroficytouch.desc=Quando consumido, este elixir permitirá àquele que o bebeu absorver o calor dos inimigos ao atacá-los. Esse efeito deixará o mesmo imune ao frio e permitirá que ele resfrie os inimigos com ataques físicos.

items.consum.potions.elixirs.elixirofmight.name=elixir de poder
items.consum.potions.elixirs.elixirofmight.msg=Uma nova força surge em seu corpo, agora você tem %d de força!
items.consum.potions.elixirs.elixirofmight.desc=Este líquido poderoso irá correr pelos seus músculos, aumentando permanentemente a sua força em um ponto, aumentando também temporariamente a sua saúde máxima em %d pontos. O impulso de vida depende da sua vida máxima, mas diminuirá lentamente à medida em que você vai subindo de nível.
items.consum.potions.elixirs.elixirofmight$htboost.name=aumento de saúde máximo
items.consum.potions.elixirs.elixirofmight$htboost.desc=Você sente seu corpo anormalmente forte e saudável.\n\nA sua saúde máxima é aumentada por um longo período de tempo. À medida que você aumenta de nível, o impulso vai se dissipando constantemente.\n\nQuantidade de impulso atual: %d.\nNíveis restantes: %d.

items.consum.potions.elixirs.elixiroftoxicessence.name=elixir da essência tóxica
items.consum.potions.elixirs.elixiroftoxicessence.desc=Quando consumido, este elixir irá imbuir quem o bebe com energia tóxica. O mesmo espalhará continuamente gases tóxicos à medida que se move e ficará imune a gases tóxicos e venenos por um pouco mais tempo do que a duração do efeito.



###exotic potions
items.consum.potions.exotic.exoticpotion.turquoise=poção turquesa exótica
items.consum.potions.exotic.exoticpotion.crimson=poção carmesim exótica
items.consum.potions.exotic.exoticpotion.azure=poção azul exótica
items.consum.potions.exotic.exoticpotion.jade=poção de jade exótica
items.consum.potions.exotic.exoticpotion.golden=poção dourada exótica
items.consum.potions.exotic.exoticpotion.magenta=poção magenta exótica
items.consum.potions.exotic.exoticpotion.charcoal=poção grafite exótica
items.consum.potions.exotic.exoticpotion.ivory=poção marfim exótica
items.consum.potions.exotic.exoticpotion.amber=poção âmbar exótico
items.consum.potions.exotic.exoticpotion.bistre=poção marrom exótica
items.consum.potions.exotic.exoticpotion.indigo=poção roxa exótica
items.consum.potions.exotic.exoticpotion.silver=poção prata exótica
items.consum.potions.exotic.exoticpotion.unknown_desc=Este frasco redondo contém um líquido borbulhante. Parece não ser desta terra, quem sabe o que pode fazer quando bebido ou jogado?
items.consum.potions.exotic.exoticpotion.warning=Você realmente quer cancelar o uso desta poção? Ela será consumida de qualquer maneira.
items.consum.potions.exotic.exoticpotion.yes=Sim, eu tenho certeza
items.consum.potions.exotic.exoticpotion.no=Não, eu mudei de ideia
items.consum.potions.exotic.exoticpotion.discover_hint=Você pode fabricar este item através de alquimia.

items.consum.potions.exotic.potionofcleansing.name=poção da limpeza
items.consum.potions.exotic.potionofcleansing.desc=Este poderoso reagente tornará aquele que o bebe imune a todos os efeitos prejudiciais por alguns turnos. Também pode ser jogado em um alvo para purificá-lo.
items.consum.potions.exotic.potionofcleansing$cleanse.name=purificado
items.consum.potions.exotic.potionofcleansing$cleanse.desc=Este personagem está temporariamente imune a todos os efeitos de status nocivos!\n\nTurnos restantes: %s.

items.consum.potions.exotic.potionofcorrosivegas.name=poção de gás corrosivo
items.consum.potions.exotic.potionofcorrosivegas.desc=Tirar a rolha ou quebrar este frasco pressurizado fará com que seu conteúdo exploda em uma nuvem mortal de gás corrosivo de cor ferrugem. O gás se espalha mais rápido do que o gás tóxico e é mais mortal, mas também não durará muito.

items.consum.potions.exotic.potionofdragonsbreath.name=poção bafo de dragão
items.consum.potions.exotic.potionofdragonsbreath.prompt=Escolha um local para queimar
items.consum.potions.exotic.potionofdragonsbreath.desc=Este frasco contém um composto incomum que se inflama logo após a mistura com a saliva. Cuspir rapidamente o líquido permitirá que o usuário cuspa chamas de sua boca!

items.consum.potions.exotic.potionofearthenarmor.name=poção da armadura de barro
items.consum.potions.exotic.potionofearthenarmor.desc=Em vez de paralisar, este líquido tem um efeito endurecedor na pele, que a transforma em uma armadura natural temporária.

items.consum.potions.exotic.potionofdivineinspiration.name=poção da inspiração divina
items.consum.potions.exotic.potionofdivineinspiration.no_more_points=Você não pode mais ganhar pontos de bônus de talento.
items.consum.potions.exotic.potionofdivineinspiration.select_tier=Escolha um tier de talento para ganhar dois pontos bônus nele. Você precisa ter desbloqueado o tier para ser capaz de gastar os pontos.
items.consum.potions.exotic.potionofdivineinspiration.bonus=+2 Pontos de Talento!
items.consum.potions.exotic.potionofdivineinspiration.desc=O poder da energia sagrada reduzido à forma líquida, este líquido irá imbuir aquele que o bebe com poder divino, concedendo-lhe dois pontos de talento bônus em um tier de sua escolha.\n\nEsta poção só pode ser usada uma vez por tier de talento.

items.consum.potions.exotic.potionofmagicalsight.name=poção da visão mágica
items.consum.potions.exotic.potionofmagicalsight.desc=Após tomar isto, seus sentidos serão brevemente elevados a níveis incríveis, permitindo que você veja através das paredes em um raio de 12 quadrados!

items.consum.potions.exotic.potionofmastery.name=poção da maestria
items.consum.potions.exotic.potionofmastery.prompt=Domine um Item
items.consum.potions.exotic.potionofmastery.weapon_easier=Sua arma tornou-se mais fácil de empunhar!
items.consum.potions.exotic.potionofmastery.armor_easier=Sua armadura tornou-se mais fácil de usar!
items.consum.potions.exotic.potionofmastery.desc=Em vez de conceder força bruta, esta poção irá harmonizar os músculos do usuário a um item específico. Isso fará com que esse item fique mais fácil de usar, como se aquele que a bebeu tivesse praticado e construído memória muscular.\n\nA arma ou armadura escolhida exigirá menos 2 de força para ser usada. Esta poção só pode ser usada uma vez em cada item.

items.consum.potions.exotic.potionofshielding.name=poção da blindagem
items.consum.potions.exotic.potionofshielding.desc=Ao invés de curar, esta poção irá projetar um escudo durável ao redor do corpo do usuário, bloqueando uma quantidade considerável de dano.

items.consum.potions.exotic.potionofshroudingfog.name=poção da neblina
items.consum.potions.exotic.potionofshroudingfog.desc=Quando exposto ao ar, o líquido neste frasco irá produzir uma espessa névoa de fumaça que se espalhará rapidamente, bloqueando a visão dos seus inimigos.

items.consum.potions.exotic.potionofsnapfreeze.name=poção do congelamento instantâneo
items.consum.potions.exotic.potionofsnapfreeze.desc=A substância química contida nesta poção reagirá rapidamente com o ar, instantaneamente congelando e enraizando tudo dentro do seu efeito.

items.consum.potions.exotic.potionofstamina.name=poção do vigor
items.consum.potions.exotic.potionofstamina.desc=Beber este líquido estranhamente doce irá imbuir você com um aumento de energia de longa duração, permitindo que você corra em um ritmo acelerado por um longo período de tempo.

items.consum.potions.exotic.potionofstormclouds.name=poção de nuvens tempestuosas
items.consum.potions.exotic.potionofstormclouds.desc=Jogar esta poção criará uma nuvem de vapor concentrado que se espalhará rapidamente, a qual se condensará e precipitará no ambiente. A maior parte do terreno será convertida em água, inimigos de fogo sofrerão dano, o fogo será apagado e as armadilhas serão esmagadas e quebradas.



###quest items
items.quest.ceremonialcandle.name=vela cerimonial
items.quest.ceremonialcandle.desc=Um conjunto de velas, derretidas e fundidas pelo uso.\n\nSozinhas são inúteis, mas se usadas com outras velas em um padrão, podem canalizar a energia para um ritual de invocação.
items.quest.ceremonialcandle.discover_hint=Você pode encontrar este item durante uma missão especifica.

items.quest.corpsedust.name=pó de cadáver
items.quest.corpsedust.chill=Um frio desce pela sua espinha.
items.quest.corpsedust.desc=Esta bola de pó de cadáver não é muito diferente de uma bola de pó normal. Mas você pode sentir uma magia maligna pulsando dentro dela.\n\nLivrar-se disto o mais rápido possível é uma boa ideia.
items.quest.corpsedust.discover_hint=Você pode encontrar este item durante uma missão especifica.
items.quest.corpsedust&dustwraith.rankings_desc=Amaldiçoado pelo Pó de Cadáver

items.quest.darkgold.name=minério de ouro escuro
items.quest.darkgold.you_now_have=Agora você tem %d de minério de ouro escuro.
items.quest.darkgold.desc=Este metal não é chamado de escuro por causa de sua cor (que não é diferente de ouro normal), mas porque ele derrete na luz do sol, tornando-o inútil na superfície.
items.quest.darkgold.discover_hint=Você pode encontrar este item durante uma missão especifica.

items.quest.dwarftoken.name=insígnia do anão
items.quest.dwarftoken.discard=Você descarta as insígnias em excesso.
items.quest.dwarftoken.desc=Um pedaço de metal de formato estranho que estava sendo segurado por um habitante do cofre dos anões. Talvez faça parte da magia que o prendia ao cofre? É melhor guardá-lo, pode vir a ser útil.
items.quest.dwarftoken.desc_old=Muitos anões e algumas de suas criações maiores carregam estas pequenas peças de metal de propósito desconhecido. Talvez sejam algum tipo de joalheria ou um documento de identificação. Anões são um povo estranho.
items.quest.dwarftoken.discover_hint=Você pode encontrar este item durante uma missão especifica.

items.quest.embers.name=brasas elementais
items.quest.embers.desc=Brasas especiais que só podem ser obtidas de um elemental de fogo jovem. Elas irradiam energia térmica.
items.quest.embers.discover_hint=Você pode encontrar este item durante uma missão especifica.

items.quest.escapecrystal.name=cristal de escape
items.quest.escapecrystal.ac_use=USAR
items.quest.escapecrystal.prompt=Selecione um item
items.quest.escapecrystal.desc=Um cristal mágico fino que parece conter magia de teletransporte. Você pode usar o cristal a qualquer momento para sair do cofre dos anões, mas, se sair antes da hora, não receberá a recompensa inteira!
items.quest.escapecrystal.discover_hint=Você pode encontrar este item durante uma missão específica.
items.quest.escapecrystal.injure_warning_1=O tempo parece desacelerar e você ouve a voz do Imp:\n\n"Ei, você parece estar bem ferido, está tudo bem aí em baixo? Eu quero a minha estátua, mas não a ponto de querer que você morra tentando pegá-la!"
items.quest.escapecrystal.injure_warning_2="Se você estiver preso em uma situação complicada, pode usar um daqueles _itens de teletransporte da sala inicial_ para escapar de volta para lá e tentar novamente."
items.quest.escapecrystal.injure_warning_3="Se a situação ficar realmente crítica, você pode _escapar usando aquele cristal que eu te dei_. Não vou lhe dar a recompensa completa, mas certamente é melhor do que morrer!"
items.quest.escapecrystal.leaving_start=O tempo parece desacelerar enquanto você ouve a voz do Imp:\n\n"Escute, eu entendo se você está nervoso, mas por favor, saia pelo menos da primeira sala!"\n\n"Você não precisa se preocupar com seu equipamento, eu sou um Imp de palavra, prometo que tudo estará esperando por você quando voltar. Também prometo que deixarei você usar o cristal para escapar se estiver realmente em perigo."
items.quest.escapecrystal.leaving_early=O tempo parece desacelerar quando você ouve a voz do Imp:\n\n"Sério, já está fugindo!? Você sabe que dá para escapar da maioria dos inimigos desse lugar, né?"\n\n"Olha, se a sua vida estiver em perigo, eu posso tirar você daí, mas não vou te deixar trazer nada de volta consigo. Eu esperava muito mais de você =("
items.quest.escapecrystal.leaving_partly_explored=O tempo parece desacelerar e você ouve a voz do Imp:\n\n"Ah, você já está indo embora? Bem, suponho que você tenha ajudado a mapear o lugar, e isso é melhor do que nada."\n\n"Mesmo assim, eu esperava mais de você =(. Claro que eu vou te tirar daí se precisar. Vou deixar você levar algo como uma poção ou um pergaminho, talvez."
items.quest.escapecrystal.leaving_fully_explored=O tempo parece desacelerar e você ouve a voz do Imp:\n\n"Precisa ir embora? Bom, pelo menos você explorou bastante o cofre. Eu esperava que você se saísse melhor saqueando-o, mas agora tenho uma ideia muito melhor de como o lugar funciona."\n\n"Vou deixar você levar alguma coisa, mas nada magicamente aprimorado!"
items.quest.escapecrystal.leaving_partial_victory=O tempo parece desacelerar e você ouve a voz do Imp:\n\n"Eu esperava que você conseguisse pegar a minha estatueta, mas fez um ótimo trabalho explorando e limpando a maior parte do cofre!"\n\n"Quer saber? Vou deixar você ficar com um item, contanto que ele não seja aprimorado além de +1, e ainda vou montar meu ponto de venda mais a fundo na masmorra. De qualquer forma, preciso de um tempo para planejar meus próximos passos."
items.quest.escapecrystal.leaving_victory=O tempo parece desacelerar e você ouve a voz do Imp:\n\n"Excelente trabalho!! Está pronto para ir embora? Pegarei a estatueta de você quando retornar."\n\n"Como prometido, montarei minha loja mais a fundo e deixarei que você leve o que quiser! Escolha com calma e leve o tempo que precisar, todo o resto ficará dentro do cofre."
items.quest.escapecrystal.leaving_item=Tem certeza de que este é o item que quer levar com você?
items.quest.escapecrystal.leaving_seal=_O Selo Quebrado afixado a esta armadura está vinculado ao espelho e não pode ser levado com você._ O selo será removido automaticamente da armadura. Isso reduzirá o nível da armadura em 1, mas não removerá nenhum glifo que ela possua.
items.quest.escapecrystal.leaving_staff=_Este Cajado do Mago está vinculado ao espelho e não pode ser levado com você, mas a varinha nele imbuída, sim. A varinha será removida automaticamente do cajado e entregue a você com o nível do cajado -1.
items.quest.escapecrystal.leaving_yes=Sair do Cofre
items.quest.escapecrystal.leaving_no=Ficar aqui
items.quest.escapecrystal.error_start=Parece que você não está no andar do Cofre! Isso pode ter acontecido devido a um bug ou falha.
items.quest.escapecrystal.error_no_items=Nenhum dos seus itens estão sendo armazenados, então o cristal foi removido do seu inventário.
items.quest.escapecrystal.error_with_items=Seus itens estão sendo armazenados no momento, então você deveria tentar descer ao cofre de novo para começar a missão. Seus itens armazenados serão devolvidos pra você quando a missão terminar.

items.quest.gooblob.name=bolha de gosma
items.quest.gooblob.desc=Um pedaço gelatinoso de gosma, separou-se de Goo enquanto ele morria. É quase como uma grande bola de geleia, apesar de você não se atrever a comê-la. \n\nPor si só não faz nada, mas pode ser útil se combinada com certas poções ou uma bomba. No mínimo, deve se converter em uma quantidade decente de energia.
items.quest.gooblob.discover_hint=Você pode obter este item como um saque de certos inimigos.

items.quest.impstatue.name=Estatueta de obsidiana
items.quest.impstatue.desc=Uma pequena estatueta negra como o azeviche, esculpida em obsidiana. Ela se parece com o Imp que o enviou para cá, tem até os mesmos olhos verdes brilhantes. Há uma inscrição na base da estatueta, em um idioma que você nunca viu antes.
items.quest.impstatue.discover_hint=Você pode encontrar este item durante uma missão específica.

items.quest.vaultbeacon.name=Sinalizador do Cofre
items.quest.vaultbeacon.desc=Este dispositivo de feitiço de retorno parece já ter um local definido, provavelmente a sala de entrada onde você o encontrou.\n\nVocê pode usá-lo para economizar tempo enquanto explora ou como uma forma de escapar caso esteja em perigo.
items.quest.vaultbeacon.discover_hint=Você pode encontrar este item durante uma missão específica.

items.quest.metalshard.name=pedaço de metal amaldiçoado
items.quest.metalshard.desc=Um fragmento de metal enferrujado amaldiçoado que se soltou do DM-300 quando foi destruído. Você consegue sentir uma magia malévola inativa dentro dele.\n\nPor si só não faz nada, mas pode ser útil quando combinado com certos pergaminhos ou uma bomba. No mínimo, pode ser convertido em uma quantidade decente de energia.
items.quest.metalshard.discover_hint=Você pode obter este item como um saque de certos inimigos.

items.quest.pickaxe.name=picareta
items.quest.pickaxe.ability_name=perfurar
items.quest.pickaxe.ability_desc=A Duelista pode _perfurar_ um inimigo com uma picareta. O ataque é garantido, aplica vulnerabilidade por 3 turnos e causa _%1$d-%2$d de dano aos inimigos com pele rígida.
items.quest.pickaxe.upgrade_ability_stat_name=Dano de Habilidade
items.quest.pickaxe.desc=Esta é uma ferramenta pesada e robusta, utilizada para quebrar pedras. Você não precisa equipar a picareta para minerar com ela, mas, provavelmente, pode ser usada como uma arma em caso de necessidade.
items.quest.pickaxe.discover_hint=Você pode encontrar este item durante uma missão especifica.



###remains
items.ground.remains.remainsitem.ac_use=USAR
items.ground.remains.remainsitem.discover_hint=Você pode encontrar este item nos restos mortais de um herói específico de uma partida anterior perdida.

items.ground.remains.bowfragment.name=fragmento de arco
items.ground.remains.bowfragment.desc=Este fragmento quebrado de madeira já foi parte do arco espiritual de uma Caçadora perdida. Ainda é possível sentir um pouco de energia da natureza restante no fragmento, você pode usar o fragmento para fazer crescer um pouco de grama alta ao seu redor. Fazer isso, no entanto, destruirá o fragmento.

items.ground.remains.brokenhilt.name=Cabo quebrado
items.ground.remains.brokenhilt.desc=Este cabo quebrado parece ter vindo da arma de uma Duelista derrotada. Ainda é possível sentir um pouco de poder marcial restante no cabo, você pode usá-lo para obter um pequeno dano bônus em seus próximos dois golpes corpo a corpo. Fazer isso, no entanto, destruirá o cabo.

items.ground.remains.brokenstaff.name=Cajado quebrado
items.ground.remains.brokenstaff.desc=Este Cajado de mago foi quebrado ao meio depois que seu dono encontrou seu fim. Ainda é possível sentir alguma energia mágica restante no cajado, você pode usá-la para dar um pequeno impulso de carga em suas varinhas. Fazer isso, no entanto, irá destruir o cajado.

items.ground.remains.cloakscrap.name=retalho de tecido
items.ground.remains.cloakscrap.desc=Este pedaço de tecido translúcido parece ter vindo da capa das sombras de um Ladino que já se foi. Ainda é possível sentir um pouco de energia mística nele, você pode usá-lo para dar um impulso de carga aos seus artefatos. Fazer isso, no entanto, irá destruir o tecido.

items.ground.remains.sealshard.name=fragmentos de Selo
items.ground.remains.sealshard.desc=Estes pequenos fragmentos de cera vermelha parecem ter vindo do selo de um guerreiro caído. Ainda é possível sentir um pouco de determinação agarrada ao selo, você pode usá-lo para ganhar um pouco de blindagem. Fazer isso, no entanto, irá destruir os fragmentos de selo.

items.ground.remains.tornpage.name=página rasgada
items.ground.remains.tornpage.desc=Esta página parece ter sido rasgada do tomo sagrado de um clérigo já falecido. Ainda há um pouco de energia divina agarrada a ela, você pode usá-la para recuperar um pouco de saúde. Entretanto, fazer isso destruirá a página.



