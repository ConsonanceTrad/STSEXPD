items.equipment.weapon.melee.shortsword.name=espada curta
items.equipment.weapon.melee.shortsword.ability_name=cortar
items.equipment.weapon.melee.shortsword.typical_ability_desc=A Duelista pode _cortar_ um inimigo com uma espada curta. Isso normalmente causa _%1$d-%2$d de dano_ e tem acerto garantido. Se a habilidade matar um inimigo, a ação é instantânea e a Duelista pode usar cortar novamente em 5 turnos sem custo.
items.equipment.weapon.melee.shortsword.ability_desc=A Duelista pode _cortar_ um inimigo com uma espada curta. Isso causa _%1$d-%2$d de dano_ e tem acerto garantido. Se a habilidade matar um inimigo, a ação é instantânea e a Duelista pode usar cortar novamente em 5 turnos sem custo.
items.equipment.weapon.melee.shortsword.desc=Uma espada levemente curta, apenas alguns centímetros maior que um punhal.

items.equipment.weapon.melee.quarterstaff.name=bastão
items.equipment.weapon.melee.quarterstaff.stats_desc=Esta arma bloqueia 0-2 de danos.
items.equipment.weapon.melee.quarterstaff.ability_name=Postura defensiva
items.equipment.weapon.melee.quarterstaff.typical_ability_desc=A Duelista pode assumir uma _postura defensiva_ com um bastão. Essa postura não leva tempo para ser ativada e normalmente triplica sua evasão por _%d turnos._
items.equipment.weapon.melee.quarterstaff.ability_desc=A Duelista pode assumir uma _postura defensiva_ com um bastão. Essa postura não leva tempo para ser ativada e triplica sua evasão por _%d turnos._
items.equipment.weapon.melee.quarterstaff.upgrade_ability_stat_name=Duração de habilidade
items.equipment.weapon.melee.quarterstaff.desc=Um bastão de madeira dura, suas pontas são revestidas de ferro.
items.equipment.weapon.melee.quarterstaff$defensivestance.name=postura defensiva
items.equipment.weapon.melee.quarterstaff$defensivestance.desc=A Duelista está usando seu bastão para desviar de golpes e projéteis. Enquanto ela estiver nessa postura, sua evasão contra todos os ataques é triplicada.\n\nTurnos restantes: %s.

items.equipment.weapon.melee.rapier.name=florete
items.equipment.weapon.melee.rapier.stats_desc=Esta arma bloqueia 0-1 de dano.
items.equipment.weapon.melee.rapier.ability_name=estocada
items.equipment.weapon.melee.rapier.typical_ability_desc=A Duelista pode realizar uma _estocada_ com o florete em um inimigo a 1 espaço de distância. Esse movimento a aproxima do inimigo, normalmente causa _%1$d-%2$d de dano_ e é um acerto garantido.
items.equipment.weapon.melee.rapier.ability_desc=A Duelista pode realizar uma _estocada_ com o florete em um inimigo a 1 espaço de distância. Esse movimento a aproxima do inimigo, causa _%1$d-%2$d de dano_ e é um acerto garantido.
items.equipment.weapon.melee.rapier.desc=Uma espada reta e fina que oferece certa proteção em detrimento de poder de corte.
items.equipment.weapon.melee.rapier.discover_hint=Um dos heróis inicia com este item.

items.equipment.weapon.melee.roundshield.name=Escudo redondo
items.equipment.weapon.melee.roundshield.typical_stats_desc=Normalmente, esta arma bloqueia 0-%d de dano. Este bloqueio aumenta com aprimoramentos.
items.equipment.weapon.melee.roundshield.stats_desc=Esta arma bloqueia 0-%d de dano. Este bloqueio aumenta com aprimoramentos.
items.equipment.weapon.melee.roundshield.ability_name=defender
items.equipment.weapon.melee.roundshield.typical_ability_desc=A Duelista pode se _defender_ com um escudo redondo, negando completamente todos os ataques físicos ou mágicos feitos contra ela normalmente por _%d turnos_. Depois que a Duelista bloquear um ataque, revidar ou usar magia encerrará a defesa.
items.equipment.weapon.melee.roundshield.ability_desc=A Duelista pode se _defender_ com um escudo redondo, negando completamente todos os ataques físicos ou mágicos feitos contra ela por _%d turnos_. Depois que a Duelista bloquear um ataque, revidar ou usar magia encerrará a defesa.
items.equipment.weapon.melee.roundshield.upgrade_ability_stat_name=Duração de habilidade
items.equipment.weapon.melee.roundshield.desc=Este grande escudo bloqueia ataques efetivamente e é uma arma decente em situações de perigo.
items.equipment.weapon.melee.roundshield$guardtracker.name=defendendo
items.equipment.weapon.melee.roundshield$guardtracker.guarded=defendido
items.equipment.weapon.melee.roundshield$guardtracker.desc=A Duelista preparou seu escudo em antecipação a ataques iminentes. Ataques físicos ou mágicos feitos contra ela serão completamente negados.\n\nTurnos restantes: %s.

items.equipment.weapon.melee.runicblade.name=lâmina Rúnica
items.equipment.weapon.melee.runicblade.stats_desc=Esta arma se beneficia mais dos aprimoramentos.
items.equipment.weapon.melee.runicblade.ability_name=corte rúnico
items.equipment.weapon.melee.runicblade.typical_ability_desc=A Duelista pode realizar um _corte rúnico_ com a lâmina rúnica. Esse ataque é garantido e normalmente causa  _+%d%% do poder de encantamento._
items.equipment.weapon.melee.runicblade.ability_desc=A Duelista pode realizar um _corte rúnico_ com a lâmina rúnica. Esse ataque é garantido e causa  _+%d%% do poder de encantamento._
items.equipment.weapon.melee.runicblade.upgrade_ability_stat_name=Poder da habilidade
items.equipment.weapon.melee.runicblade.desc=Uma arma misteriosa de uma terra distante, com uma lâmina de brilho azul.

items.equipment.weapon.melee.sai.name=sai
items.equipment.weapon.melee.sai.stats_desc=Esta é uma arma muito rápida.
items.equipment.weapon.melee.sai.ability_name=combinação de ataques
items.equipment.weapon.melee.sai.typical_ability_desc=A Duelista pode realizar uma _combinação de ataques_ com a sai. Este ataque tem garantia de acerto e normalmente causa _+%d de dano_ para cada vez que a Duelista tiver acertado com um ataque corpo a corpo regular ou com uma arma de arremesso. Não acertar nada em 5 turnos (15 depois de uma morte) reinicia este combo.
items.equipment.weapon.melee.sai.ability_desc=A Duelista pode realizar uma _combinação de ataques_ com a sai. Este ataque tem garantia de acerto e causa _+%d de dano_ para cada vez que a Duelista tiver acertado com um ataque corpo a corpo regular ou com uma arma de arremesso. Não acertar nada em 5 turnos (15 depois de uma morte) reinicia este combo.
items.equipment.weapon.melee.sai.desc=Duas lâminas finas destinadas a serem empunhadas cada uma em uma mão. Excelente para destruir os inimigos com uma série de cortes.
items.equipment.weapon.melee.sai$combostriketracker.name=combinação de ataques
items.equipment.weapon.melee.sai$combostriketracker.desc=A Duelista está acumulando combo que pode ser usado para aumentar o dano da habilidade combinação de ataques. Cada golpe regular bem-sucedido com uma arma corpo a corpo ou de arremesso contará, mas não acertar ataques por 5 turnos (15 depois de uma morte) resetará esse combo.\n\nGolpes recentes: %1$d.\n\nTurnos até a perda dos golpes: %2$s.

items.equipment.weapon.melee.scimitar.name=cimitarra
items.equipment.weapon.melee.scimitar.stats_desc=Esta é uma arma rápida.
items.equipment.weapon.melee.scimitar.ability_name=dança da espada
items.equipment.weapon.melee.scimitar.typical_ability_desc=O Duelista pode realizar a _dança de espada_ com uma cimitarra.  Esta postura não leva tempo para ser ativada e concede a Duelista +60%% de velocidade de ataque e +50%% de precisão normalmente por _%d turnos._
items.equipment.weapon.melee.scimitar.ability_desc=O Duelista pode realizar a _dança de espada_ com uma cimitarra.  Esta postura não leva tempo para ser ativada e concede a Duelista +60%% de velocidade de ataque e +50%% de precisão por _%d turnos._
items.equipment.weapon.melee.scimitar.upgrade_ability_stat_name=Duração da habilidade
items.equipment.weapon.melee.scimitar.desc=Uma lâmina curvada e fina. Seu formato permite ataques rápidos, porém menos poderosos.
items.equipment.weapon.melee.scimitar$sworddance.name=dança da espada
items.equipment.weapon.melee.scimitar$sworddance.desc=A Duelista está realizando ataques rápidos baseados em impulso, como uma espécie de dança. Enquanto esta postura estiver ativa, ela ataca 60%% mais rápido (o suficiente para atacar exatamente duas vezes por turno com uma cimitarra), e tem +50%% de precisão.\n\nTurnos restantes: %s.

items.equipment.weapon.melee.sickle.name=foice
items.equipment.weapon.melee.sickle.stats_desc=Esta é uma arma pouco precisa.
items.equipment.weapon.melee.sickle.ability_name=ceifar
items.equipment.weapon.melee.sickle.typical_ability_desc=A Duelista pode _ceifar_ um inimigo com uma foice. Este ataque devastador tem garantia de acerto e normalmente causa _ %d de dano_. Esse dano é aplicado como sangramento se o alvo não for imune.
items.equipment.weapon.melee.sickle.ability_desc=A Duelista pode _ceifar_ um inimigo com uma foice. Este ataque devastador tem garantia de acerto e causa _ %d de dano_. Esse dano é aplicado como sangramento se o alvo não for imune.
items.equipment.weapon.melee.sickle.desc=Uma ferramenta agrícola manual que pode funcionar como uma arma forte, mas de difícil manejo.

items.equipment.weapon.melee.spear.name=lança
items.equipment.weapon.melee.spear.stats_desc=Esta arma é lenta.\nEsta arma tem alcance estendido.
items.equipment.weapon.melee.spear.ability_name=Espetar
items.equipment.weapon.melee.spear.typical_ability_desc=A Duelista pode usar a ponta de uma lança para _espetar_ um inimigo que esteja dentro do alcance, mas não adjacente. Isso normalmente causa _%1$d-%2$d de dano_, empurra o inimigo para trás e garante o acerto.
items.equipment.weapon.melee.spear.ability_desc=A Duelista pode usar a ponta de uma lança para _espetar_ um inimigo que esteja dentro do alcance, mas não adjacente. Isso causa _%1$d-%2$d de dano_, empurra o inimigo para trás e garante o acerto.
items.equipment.weapon.melee.spear.desc=Um bastão de madeira com aço afiado na ponta.

items.equipment.weapon.melee.sword.name=espada
items.equipment.weapon.melee.sword.ability_name=cortar
items.equipment.weapon.melee.sword.typical_ability_desc=A Duelista pode _cortar_ um inimigo com uma espada. Isso normalmente causa _%1$d-%2$d de dano_ e tem acerto garantido. Se a habilidade matar um inimigo, a ação é instantânea e a Duelista pode usar cortar novamente em 5 turnos sem custo.
items.equipment.weapon.melee.sword.ability_desc=A Duelista pode _cortar_ um inimigo com uma espada. Isso causa _%1$d-%2$d de dano_ e tem acerto garantido. Se a habilidade matar um inimigo, a ação é instantânea e a Duelista pode usar cortar novamente em 5 turnos sem custo.
items.equipment.weapon.melee.sword.desc=Uma espada bem balanceada. Não é muito grande, mas ainda é notavelmente maior do que uma espada curta.
items.equipment.weapon.melee.sword$cleavetracker.name=cortar
items.equipment.weapon.melee.sword$cleavetracker.desc=A Duelista está pronta para dar continuidade ao seu corte anterior. O próximo uso de cortar não custará nenhuma carga de habilidade de arma.\n\nTurnos restantes: %s.

items.equipment.weapon.melee.warhammer.name=martelo de guerra
items.equipment.weapon.melee.warhammer.stats_desc=Esta é uma arma precisa.
items.equipment.weapon.melee.warhammer.ability_name=Golpe pesado
items.equipment.weapon.melee.warhammer.typical_ability_desc=A Duelista pode realizar um _golpe pesado_ com um martelo de guerra. Esse ataque concentrado normalmente causa _%1$d-%2$d de dano_ se acertar o inimigo de surpresa e atordoa por 5 turnos, reduzindo a precisão e evasão em 50%%. Golpe pesado tem acerto garantido, mas causa dano regular se o inimigo não for pego de surpresa.
items.equipment.weapon.melee.warhammer.ability_desc=A Duelista pode realizar um _golpe pesado_ com um martelo de guerra. Esse ataque concentrado causa _%1$d-%2$d de dano_ se acertar o inimigo de surpresa e atordoa por 5 turnos, reduzindo a precisão e evasão em 50%%. Golpe pesado tem acerto garantido, mas causa dano regular se o inimigo não for pego de surpresa.
items.equipment.weapon.melee.warhammer.desc=Poucas criaturas conseguem suportar o golpe esmagador desta massa imponente de chumbo e aço, mas é preciso muita força para usá-la com eficiência.

items.equipment.weapon.melee.warscythe.name=foice de guerra
items.equipment.weapon.melee.warscythe.stats_desc=Esta é uma arma pouco precisa.
items.equipment.weapon.melee.warscythe.ability_name=ceifar
items.equipment.weapon.melee.warscythe.typical_ability_desc=A Duelista pode _ceifar_ um inimigo com uma foice de guerra. Este ataque devastador tem garantia de acerto e normalmente causa _ %d de dano_. Esse dano é aplicado como sangramento se o alvo não for imune.
items.equipment.weapon.melee.warscythe.ability_desc=A Duelista pode _ceifar_ um inimigo com uma foice de guerra. Este ataque devastador tem garantia de acerto e causa _ %d de dano_. Esse dano é aplicado como sangramento se o alvo não for imune.
items.equipment.weapon.melee.warscythe.desc=Esta ferramenta grande e pesada foi reforçada para torná-la melhor em cortar inimigos do que colheitas.

items.equipment.weapon.melee.whip.name=chicote
items.equipment.weapon.melee.whip.stats_desc=Esta arma possui um tremendo alcance.
items.equipment.weapon.melee.whip.ability_name=chicotear
items.equipment.weapon.melee.whip.typical_ability_desc=A Duelista pode _chicotear_ todos os inimigos envolta dela com o chicote. Essa habilidade normalmente causa _%1$d-%2$d de dano_, atinge todos os inimigos na área de alcance e tem acerto garantido.
items.equipment.weapon.melee.whip.ability_desc=A Duelista pode _chicotear_ todos os inimigos envolta dela com o chicote. Essa habilidade causa _%1$d-%2$d de dano_, atinge todos os inimigos na área de alcance e tem acerto garantido.
items.equipment.weapon.melee.whip.desc=Embora o comprimento de corda farpado no fim desta arma inflija pouco dano, nada se compara ao seu alcance.

items.equipment.weapon.melee.wornshortsword.name=espada curta desgastada
items.equipment.weapon.melee.wornshortsword.ability_name=cortar
items.equipment.weapon.melee.wornshortsword.typical_ability_desc=A Duelista pode _cortar_ um inimigo com uma espada curta desgastada. Isso normalmente causa _%1$d-%2$d de dano_ e tem acerto garantido. Se a habilidade matar um inimigo, a ação é instantânea e a Duelista pode usar cortar novamente em 5 turnos sem custo.
items.equipment.weapon.melee.wornshortsword.ability_desc=A Duelista pode _cortar_ um inimigo com uma espada curta desgastada. Isso causa _%1$d-%2$d de dano_ e tem acerto garantido. Se a habilidade matar um inimigo, a ação é instantânea e a Duelista pode usar cortar novamente em 5 turnos sem custo.
items.equipment.weapon.melee.wornshortsword.desc=Uma espada levemente curta, um pouco deteriorada por muito uso. É fraca e mais leve que uma espada curta em melhores condições.
items.equipment.weapon.melee.wornshortsword.discover_hint=Um dos heróis inicia com este item.


###missile weapons
items.equipment.weapon.missiles.darts.adrenalinedart.name=dardo de adrenalina
items.equipment.weapon.missiles.darts.adrenalinedart.desc=Estes dardos são embebidos num composto à base de cardo-ligeiro que aumentará a velocidade de movimento e ataque dos aliados ou diminuirá brevemente a velocidade de movimento dos inimigos. O dardo em si ainda é prejudicial aos inimigos, mas não prejudicará os aliados.

items.equipment.weapon.missiles.darts.blindingdart.name=dardo cegante
items.equipment.weapon.missiles.darts.blindingdart.desc=Estes dardos são embebidos em um composto à base de ceguerva que irá cegar seu alvo por um curto período de tempo. Eles não desorientam, portanto, um inimigo ainda saberá onde viu você pela última vez.

items.equipment.weapon.missiles.darts.chillingdart.name=dardo congelante
items.equipment.weapon.missiles.darts.chillingdart.desc=Estes dardos são embebidos em um composto à base de muda-de-gelo que irá esfriar significativamente o seu alvo.

items.equipment.weapon.missiles.darts.cleansingdart.name=Dardo da limpeza
items.equipment.weapon.missiles.darts.cleansingdart.desc=Estes dardos são embebidos num composto à base de magi-real que tornará temporariamente os aliados imunes a todos os efeitos negativos ou limpará os efeitos positivos dos inimigos. Os inimigos podem até esquecer brevemente que estão atacando ou fugindo de você. O dardo em si ainda é prejudicial aos inimigos, mas não prejudicará os aliados.

items.equipment.weapon.missiles.darts.dart.name=dardo
items.equipment.weapon.missiles.darts.dart.ac_tip=EMBEBER
items.equipment.weapon.missiles.darts.dart.prompt=selecione uma semente.
items.equipment.weapon.missiles.darts.dart.tip_title=Dardos Embebidos
items.equipment.weapon.missiles.darts.dart.tip_desc=Uma semente pode ser combinada com um ou dois dardos para embebê-los. Cada tipo de semente produz seu próprio tipo de dardo embebido, com um efeito especial de uso único.\n\nEmbeber dardos com este tipo de semente produzirá _%s._
items.equipment.weapon.missiles.darts.dart.tip_all=embeber %1$d dardos com %2$d sementes
items.equipment.weapon.missiles.darts.dart.tip_two=embeber 2 dardos com 1 semente
items.equipment.weapon.missiles.darts.dart.tip_one=embeber 1 dardo com 1 semente
items.equipment.weapon.missiles.darts.dart.tip_cancel=cancelar
items.equipment.weapon.missiles.darts.dart.desc=Estes pedaços simples de madeira pontiaguda são feitos para voar e ferir suas presas com um movimento do pulso. Eles podem ser embebidos com sementes para ganhar efeitos bônus quando lançados.
items.equipment.weapon.missiles.darts.dart.unlimited_uses=Devido a sua construção simples, os dardos duram para sempre.

items.equipment.weapon.missiles.darts.displacingdart.name=dardos de deslocamento
items.equipment.weapon.missiles.darts.displacingdart.desc=Estes dardos são embebidos em um composto à base de folha-fantasma que irá teletransportar seu alvo a uma curta distância.

items.equipment.weapon.missiles.darts.healingdart.name=dardo de cura
items.equipment.weapon.missiles.darts.healingdart.desc=Estes dardos são embebidos com um composto à base de grama-solar que concede uma explosão de cura ao seu alvo. O dardo em si ainda é prejudicial aos inimigos, mas não irá prejudicar aliados.

items.equipment.weapon.missiles.darts.holydart.name=dardo sagrado
items.equipment.weapon.missiles.darts.holydart.desc=Estes dardos são embebidos num composto à base de flor-estrela que infunde energia sagrada em seu alvo. Aliados e inimigos normais serão abençoados, mas inimigos mortos-vivos ou demoníacos sofrerão grandes danos. O dardo em si ainda é prejudicial aos inimigos, mas não prejudicará os aliados.

items.equipment.weapon.missiles.darts.incendiarydart.name=dardo incendiário
items.equipment.weapon.missiles.darts.incendiarydart.desc=Estes dardos são embebidos com um composto à base de flor-de-fogo que explodirá em chamas brilhantes no impacto.

items.equipment.weapon.missiles.darts.paralyticdart.name=dardo paralítico
items.equipment.weapon.missiles.darts.paralyticdart.desc=Estes dardos são embebidos com um composto à base de terraíz que paralisará seu alvo por um curto período de tempo.

items.equipment.weapon.missiles.darts.poisondart.name=dardo envenenado
items.equipment.weapon.missiles.darts.poisondart.desc=Estes dardos são embebidos com um composto à base de sofrimusgo que envenenará seu alvo.

items.equipment.weapon.missiles.darts.rotdart.name=dardo corrosivo
items.equipment.weapon.missiles.darts.rotdart.desc=Estes perversos dardos são embebidos com um composto ácido à base de putrifruta, que corroerá agressivamente qualquer coisa com que o dardo entre em contato. Inimigos poderosos resistirão à maior parte do efeito, mas a corrosão é forte o suficiente para matar facilmente a maioria dos inimigos padrão. Duram mais do que outros dardos embebidos, mas sua durabilidade não pode ser aumentada.
items.equipment.weapon.missiles.darts.rotdart.discover_hint=Você pode criar este item usando uma semente de uma missão específica.

items.equipment.weapon.missiles.darts.shockingdart.name=dardo chocante
items.equipment.weapon.missiles.darts.shockingdart.desc=Estes dardos são embebidos com um composto à base de vinha-tempestuosa que irá causar um choque desagradável ao seu alvo.

items.equipment.weapon.missiles.darts.tippeddart.ac_clean=LIMPAR
items.equipment.weapon.missiles.darts.tippeddart.clean_title=Dardos Limpos
items.equipment.weapon.missiles.darts.tippeddart.clean_desc=Esta ação removerá o efeito das sementes nos seus dardos, revertendo-os de volta a dardos normais.
items.equipment.weapon.missiles.darts.tippeddart.clean_all=limpar tudo
items.equipment.weapon.missiles.darts.tippeddart.clean_one=limpar um
items.equipment.weapon.missiles.darts.tippeddart.cancel=cancelar
items.equipment.weapon.missiles.darts.tippeddart.uses_left=Esta pilha de dardos tem _%d/%d_ usos antes de expirar.
items.equipment.weapon.missiles.darts.tippeddart.unlimited_uses=_Mas estes são de tal qualidade que duram para sempre._
items.equipment.weapon.missiles.darts.tippeddart.about_to_break=A ponta do seu dardo está prestes a expirar.
items.equipment.weapon.missiles.darts.tippeddart.has_broken=A ponta do seu dardo expirou.
items.equipment.weapon.missiles.darts.tippeddart.discover_hint=Você pode comprar este item em uma loja ou criá-lo usando uma semente.


items.equipment.weapon.missiles.bolas.name=boleadeiras
items.equipment.weapon.missiles.bolas.stats_desc=Esta arma causa aleijamento no alvo.
items.equipment.weapon.missiles.bolas.desc=Estas armas de arremesso incomuns não causam muito dano, mas fazem um excelente trabalho ao retardar seu alvo.

items.equipment.weapon.missiles.boomerang.name=bumerangue
items.equipment.weapon.missiles.boomerang.desc=Ao ser jogado no inimigo, este projétil de madeira curvada irá retornar às mãos do jogador.
items.equipment.weapon.missiles.boomerang.durability=Devido à sua construção sólida, este bumerangue não vai quebrar com o uso.

items.equipment.weapon.missiles.fishingspear.name=lança de pesca
items.equipment.weapon.missiles.fishingspear.desc=Pequenas lanças de arremesso que funcionam bem como armas improvisadas, apesar de terem sido projetadas para pesca.

items.equipment.weapon.missiles.forcecube.name=cubo de força
items.equipment.weapon.missiles.forcecube.ondeath=Você se matou com o seu próprio Cubo de Força...
items.equipment.weapon.missiles.forcecube.stats_desc=Esta arma espalha a força do seu impacto sobre uma pequena área, atingindo tudo o que estiver por perto.
items.equipment.weapon.missiles.forcecube.desc=Estes cubos mágicos de formato estranho são pequenos o suficiente para segurar na mão, mas são incrivelmente pesados.

items.equipment.weapon.missiles.heavyboomerang.name=bumerangue pesado
items.equipment.weapon.missiles.heavyboomerang.stats_desc=Esta arma retorna ao local de onde foi arremessada após cinco turnos.
items.equipment.weapon.missiles.heavyboomerang.desc=Este bumerangue grande é difícil de manejar efetivamente, mas causará danos consideráveis.

items.equipment.weapon.missiles.javelin.name=javelin
items.equipment.weapon.missiles.javelin.desc=Estas grandes lanças de arremesso têm seu peso balanceado para manterem a sua ponta de ferro à frente enquanto viajam pelo ar.

items.equipment.weapon.missiles.kunai.name=kunai
items.equipment.weapon.missiles.kunai.stats_desc=Esta arma é mais forte contra inimigos distraídos.
items.equipment.weapon.missiles.kunai.desc=Estas facas pequenas são muito poderosas nas mãos de um usuário habilidoso.

items.equipment.weapon.missiles.missileweapon.stats_known=Este conjunto de armas de arremesso de _tier-%1$d_ causa _%2$d-%3$d de dano_ e requer _ %4$d de força_ para serem usadas.
items.equipment.weapon.missiles.missileweapon.stats_unknown=Normalmente, este conjunto de armas de arremesso de _tier-%1$d_ causa _%2$d-%3$d de dano_ e requer _%4$d de força_ para serem usadas.
items.equipment.weapon.missiles.missileweapon.stats_desc=
items.equipment.weapon.missiles.missileweapon.probably_too_heavy=Esta arma provavelmente é muito pesada para você.
items.equipment.weapon.missiles.missileweapon.distance=Armas de arremesso são mais precisas a distância, mas menos precisas de perto.
items.equipment.weapon.missiles.missileweapon.durability=Armas arremessadas se desgastam e quebram quando são usadas.
items.equipment.weapon.missiles.missileweapon.uses_left=Este conjunto de armas de arremesso tem _%d/ %d_ usos restantes antes que uma delas se quebre.
items.equipment.weapon.missiles.missileweapon.unlimited_uses=_Este conjunto é de tal qualidade que dura para sempre._
items.equipment.weapon.missiles.missileweapon.unknown_uses=Normalmente, este conjunto de armas de arremesso terá _%d_ usos antes de uma quebrar.
items.equipment.weapon.missiles.missileweapon.curse_discover=Esta arma de arremesso está amaldiçoada!
items.equipment.weapon.missiles.missileweapon.about_to_break=Sua arma de arremesso está prestes a quebrar.
items.equipment.weapon.missiles.missileweapon.has_broken=Uma de suas armas de arremesso quebrou.
items.equipment.weapon.missiles.missileweapon.dust=A arma de arremesso vira pó quando você a toca.
items.equipment.weapon.missiles.missileweapon.break_upgraded_warn_desc=Se a última arma de arremesso do seu conjunto de armas de arremesso aprimoradas quebrar, o conjunto será perdido permanentemente. Tem certeza de que deseja arremessá-la?
items.equipment.weapon.missiles.missileweapon.break_upgraded_warn_yes=Sim
items.equipment.weapon.missiles.missileweapon.break_upgraded_warn_no=Não
items.equipment.weapon.missiles.missileweapon$placeholder.name=arma de arremesso

items.equipment.weapon.missiles.shuriken.name=shuriken
items.equipment.weapon.missiles.shuriken.stats_desc=Shurikens podem ser lançadas instantaneamente com um tempo de recarga de 20 turnos.
items.equipment.weapon.missiles.shuriken.desc=Estas peças de metal em formato de estrela com lâminas afiadas podem ser arremessadas rapidamente em movimento.
items.equipment.weapon.missiles.shuriken$shurikeninstanttracker.name=Tempo de recarga da Shuriken
items.equipment.weapon.missiles.shuriken$shurikeninstanttracker.desc=Você lançou uma shuriken instantaneamente recentemente e deve esperar antes de fazê-lo novamente. Shurikens ainda podem ser lançadas, mas na velocidade normal da arma.\n\nTurnos Restantes: %s.

items.equipment.weapon.missiles.throwingclub.name=bastão de arremesso
items.equipment.weapon.missiles.throwingclub.stats_desc=Esta arma não se prende aos inimigos e pode ser coletada instantaneamente.
items.equipment.weapon.missiles.throwingclub.desc=Uma arma de arremesso relativamente simples, mas durável, essencialmente uma grande rocha presa a um bastão.

items.equipment.weapon.missiles.throwinghammer.name=martelo de arremesso
items.equipment.weapon.missiles.throwinghammer.stats_desc=Esta arma não se prende aos inimigos e pode ser coletada instantaneamente.
items.equipment.weapon.missiles.throwinghammer.desc=Estes martelos pesados são projetados para serem jogados em um inimigo. Sua construção lisa toda em metal significa que são bastante duráveis.

items.equipment.weapon.missiles.throwingknife.name=faca de arremesso
items.equipment.weapon.missiles.throwingknife.stats_desc=Esta arma é mais forte contra inimigos distraídos.
items.equipment.weapon.missiles.throwingknife.desc=Estas facas leves são balanceadas para cortar o ar diretamente até o alvo.
items.equipment.weapon.missiles.throwingknife.discover_hint=Um dos heróis inicia com este item.

items.equipment.weapon.missiles.throwingspear.name=lança de arremesso
items.equipment.weapon.missiles.throwingspear.desc=Estas lanças leves têm armações finas que são projetadas para serem lançadas e não empunhadas.

items.equipment.weapon.missiles.throwingspike.name=agulha de arremesso
items.equipment.weapon.missiles.throwingspike.desc=Estas agulhas pontiagudas de metal duráveis são feitas para serem arremessadas em inimigos distantes.
items.equipment.weapon.missiles.throwingspike.discover_hint=Um dos heróis inicia com este item.

items.equipment.weapon.missiles.throwingstone.name=pedra de arremesso
items.equipment.weapon.missiles.throwingstone.desc=Estas pedras são lixadas para que possam ser jogadas com mais força do que uma pedra comum.
items.equipment.weapon.missiles.throwingstone.discover_hint=Um dos heróis inicia com este item.

items.equipment.weapon.missiles.tomahawk.name=tomahawk
items.equipment.weapon.missiles.tomahawk.stats_desc=Esta arma causa _%1$d-%2$d de sangramento_ ao seu alvo.
items.equipment.weapon.missiles.tomahawk.typical_stats_desc=Esta arma normalmente causa _%1$d-%2$d de sangramento_ ao seu alvo.
items.equipment.weapon.missiles.tomahawk.desc=Estes machados de arremesso têm lâminas serrilhadas que vão rasgando o inimigo quando se cravam nele.

items.equipment.weapon.missiles.trident.name=tridente
items.equipment.weapon.missiles.trident.desc=Lanças de arremesso maciças com três dentes mortais na ponta. Elas são poderosas, mas bem pesadas.


items.equipment.weapon.spiritbow.name=arco espiritual
items.equipment.weapon.spiritbow.ac_shoot=ATIRAR
items.equipment.weapon.spiritbow.prompt=Escolha um alvo
items.equipment.weapon.spiritbow.stats=O arco não pode ser aprimorado diretamente, ele ficará mais forte à medida que você sobe de nível. No seu nível atual, as flechas disparadas do arco causarão _%1$d-%2$d de dano_ e exige _%3$d de força_ para ser usado apropriadamente.
items.equipment.weapon.spiritbow.desc=Um arco feito de madeira mágica antiga. As cordas e gravuras do arco brilham com uma luz azul clara. Quando a corda é puxada, este arco irá conjurar uma flecha mágica que pode ser disparada contra um inimigo.
items.equipment.weapon.spiritbow.discover_hint=Um dos heróis inicia com este item.

items.equipment.weapon.weapon.identify=Você agora está suficientemente familiarizado com a sua arma para poder identificá-la.
items.equipment.weapon.weapon.too_heavy=Devido à sua força inadequada, a sua velocidade, precisão e habilidade de ataque surpresa serão menores enquanto usar esta arma.
items.equipment.weapon.weapon.excess_str=Por causa do seu excesso de força, você causará _0-%d de dano extra_ com esta arma.
items.equipment.weapon.weapon.hardening_gone=O endurecimento desta arma acabou!
items.equipment.weapon.weapon.incompatible=A interação de diferentes tipos de magia anulou o encantamento desta arma!
items.equipment.weapon.weapon.cursed_worn=Esta arma está amaldiçoada, você é incapaz de removê-la.
items.equipment.weapon.weapon.cursed=Você sente uma magia maligna à espreita dentro desta arma.
items.equipment.weapon.weapon.weak_cursed=Apesar da maldição, você consegue desequipar esta arma.
items.equipment.weapon.weapon.not_cursed=Esta arma está livre de magia malévola.
items.equipment.weapon.weapon.faster=Possui alteração para aumentar a _velocidade._
items.equipment.weapon.weapon.stronger=Possui alteração para aumentar o _dano._
items.equipment.weapon.weapon.enchanted=Está com _%s._
items.equipment.weapon.weapon.enchant_hardened=Foi _endurecido._
items.equipment.weapon.weapon.hardened_no_enchant=Esta arma foi _endurecida_, mas não está encantada no momento.
items.equipment.weapon.weapon$enchantment.enchant=encantamento
items.equipment.weapon.weapon$enchantment.rankings_desc=Morto por um encantamento
items.equipment.weapon.weapon$enchantment.discover_hint=Você pode encontrar um item com este efeito aleatoriamente na masmorra ou tentar aplicá-lo a um item você mesmo.


###misc items
items.amulet.name=amuleto de yendor
items.amulet.ac_end=TERMINAR O JOGO
items.amulet.desc=O Amuleto de Yendor é o artefato mais poderoso conhecido por humanos ou anões. Seus cristais reluzentes contêm um incrível e assombroso poder.
items.amulet.desc_origins=As origens do amuleto são desconhecidas. A história diz que o Rei dos Anões se gabou de ter descoberto o artefato pouco antes de a civilização anã cortar todo o contato. Como ele encontrou? Como Yog-Dzewa tomou dele? Perguntas para outro momento talvez, tudo o que importa agora é que o amuleto é seu!
items.amulet.desc_ascent=As origens do amuleto são desconhecidas, mas claramente foi fortemente influenciada pelo poder de Yog-Dzewa. A masmorra parece estar se submetendo à vontade de Yog conforme você se move por ela, tornando os inimigos muito mais abundantes e poderosos! Você também não pode mais ativar ou descartar o amuleto, quase como se estivesse amaldiçoado.
items.amulet.ascent_title=Ascensão
items.amulet.ascent_desc=Você começa a sentir o grande e terrível poder de Yog-Dzewa irradiando do amuleto. Subir de volta pela masmorra como um mortal pode ser mais difícil do que você pensava!\n\nSe você continuar subindo com o amuleto, a masmorra se tornará mais perigosa, os teletransportes entre os andares serão desativados e você só poderá vencer o jogo derrotando os inimigos enquanto sobe pela masmorra!\n\nVocê pode deixar o amuleto aqui por enquanto se quiser subir sem iniciar este desafio, ou ativar o amuleto antes de subir para terminar o jogo normalmente.
items.amulet.ascent_yes=Continuar!
items.amulet.ascent_no=Parar por agora
items.amulet.discover_hint=Você pode encontrar este item no fundo da masmorra...

items.ankh.name=ankh
items.ankh.ac_bless=ABENÇOAR
items.ankh.bless=Você abençoa o ankh com água mágica.
items.ankh.desc=Este antigo símbolo de imortalidade concede a habilidade de retornar à vida após a morte. A maioria de seus itens serão deixados onde você morreu, mas poderão ser recuperados se você os pegar. Utilizando um odre cheio, o ankh pode ser abençoado com força adicional.
items.ankh.desc_blessed=Este antigo símbolo de imortalidade concede a habilidade de retornar da vida-após-a-morte. Este ankh foi abençoado com força extra e é agora muito mais forte. Agora o ankh irá se sacrificar para salvar você em um momento de perigo mortal.
items.ankh.discover_hint=Você pode comprar este item em uma loja.

items.arcaneresin.name=resina arcana
items.arcaneresin.prompt=Selecione uma varinha
items.arcaneresin.ac_apply=APLICAR
items.arcaneresin.level_too_high=Esta varinha é muito poderosa para ser melhorada pela resina.
items.arcaneresin.not_enough=Você não tem resina suficiente para isso!
items.arcaneresin.apply=Você reveste sua varinha com resina, aumentando seu poder!
items.arcaneresin.desc=Este fino pó reluz entre tons de branco e roxo. Ele pode agir como um amplificador de energia mágica, melhorando o nível de suas varinhas quando aplicado a elas!\n\nAprimorar uma varinha custa 1, 2 ou 3 de resina dependendo do nível inicial dela. Resina pode melhorar varinhas para um máximo de +3.\n\nEntretanto, os aprimoramentos através da resina são _sobrescritos por outras fontes de aprimoramento_ (como pergaminhos do aprimoramento) e não se aplicam quando a varinha é imbuída ao cajado do Mago.
items.arcaneresin.discover_hint=Você pode fabricar este item através de alquimia.

items.brokenseal.name=selo quebrado
items.brokenseal.ac_affix=AFIXAR
items.brokenseal.prompt=Escolha uma armadura
items.brokenseal.unknown_armor=Você deve primeiro identificar se a armadura está ou não amaldiçoada.
items.brokenseal.cursed_armor=O selo não se aplica a armaduras amaldiçoadas.
items.brokenseal.affix=Você equipa o selo na armadura!
items.brokenseal.desc=Um selo de cera, afixado à armadura como símbolo de valor. Possui uma runa desbotada de proteção gravada no centro e está rachado ao meio.\n\nUma lembrança de seu lar, o selo ajuda o guerreiro a seguir em frente. Enquanto estiver usando o selo, o guerreiro ganhará blindagem instantaneamente quando estiver prestes a sofrer dano para metade da sua vida ou menos..\n\nO selo pode ser _afixado à armadura_ e movido entre armaduras. Pode levar um único aprimoramento consigo, desde que o aprimoramento tenha sido aplicado à armadura enquanto o selo estava afixado nela.
items.brokenseal.inscribed=O selo está inscrito com _%s._
items.brokenseal.choose_title=Escolha um Glifo
items.brokenseal.choose_desc=Tanto esta armadura quanto o selo quebrado carregam um glifo. Escolha qual glifo deve ser mantido.\n\nGlifo da armadura: %1$s\nGlifo do Selo Quebrado: %2$s\n\nObserve que se você escolher o glifo que está atualmente na armadura, o selo não poderá transferi-lo depois.
items.brokenseal.discover_hint=Um dos heróis inicia com este item.
items.brokenseal$warriorshield.name=Blindagem do Guerreiro
items.brokenseal$warriorshield.desc_active=O selo quebrado do Guerreiro está atualmente ajudando-o a perseverar, concedendo-lhe escudo além de sua vida. Antes de poder ser usado novamente, há um tempo de recarga após a blindagem ter sido inicialmente ativada.\n\nEsta blindagem não se deteriora com o tempo, mas terminará se não houver inimigos por perto por alguns turnos. Quando acabar, qualquer unidade de blindagem não utilizada reduzirá o tempo de recarga, até um máximo de 50%%.\n\nBlindagem restante: %1$d.\n\nTempo de recarga atual: %2$d.
items.brokenseal$warriorshield.desc_cooldown=O Guerreiro ganhou recentemente blindagem de seu selo quebrado e deve esperar até que possa se beneficiar de seu efeito de proteção novamente.\n\nTurnos restantes: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=O tempo de recarga de blindagem do Guerreiro está atualmente negativo, significando que, quando seu escudo é ativado, o tempo de recarga será menor que os 150 turnos usuais. O tempo de recarga de blindagem pode ser reduzido para até -150 turnos, o que significa que estará disponível imediatamente após ser ativada.\n\nTempo de recarga atual: %d.

items.dewdrop.name=gota de orvalho
items.dewdrop.already_full=Você já está com a vida cheia.
items.dewdrop.desc=Uma gota de orvalho clara como cristal.\n\nGraças à magia deste lugar, a água pura tem um pouco de propriedades curativas.

items.equipableitem.curse_detected=Você sentiu que o item estava amaldiçoado assim que ia equipá-lo!
items.equipableitem.unequip_cursed=Você não pode remover um item amaldiçoado!
items.equipableitem.ac_equip=EQUIPAR
items.equipableitem.ac_unequip=DESEQUIPAR

items.energycrystal.name=cristal de energia
items.energycrystal.desc=Uma coleção de pequenos cristais mágicos, cheios de energia alquímica.\n\nEstes cristais são os ingredientes mais comuns em receitas alquímicas e podem ser produzidos em um pote de alquimia reciclando itens consumíveis.

items.gold.name=ouro
items.gold.desc=Uma pilha de moedas de ouro. Colete moedas de ouro para gastá-las mais tarde em uma loja.

items.heap.for_sale=%1$dg: %2$s
items.heap.chest=Baú
items.heap.chest_desc=Você não conseguirá saber o que tem dentro até abri-lo!
items.heap.locked_chest=Baú trancado
items.heap.locked_chest_desc=Você não vai saber o que tem dentro enquanto não abrir! Mas para abrir é necessário uma chave dourada.
items.heap.crystal_chest=Baú de cristal
items.heap.crystal_chest_desc=Você pode ver _%s_ dentro, mas para abrir o baú você precisa de uma chave de cristal.
items.heap.artifact=um artefato
items.heap.wand=uma varinha
items.heap.ring=um anel
items.heap.tomb=Tumba
items.heap.tomb_desc=Esta tumba antiga pode conter algo útil, mas seu dono certamente irá se opor à sua perturbação.
items.heap.skeleton=Restos de esqueleto
items.heap.skeleton_desc=Isto é tudo o que resta de algum aventureiro desafortunado. Talvez valha a pena verificar se há alguma coisa de valor.
items.heap.remains=Restos de um herói
items.heap.remains_desc=Isto é tudo o que resta de algum de seus predecessores. Talvez valha a pena verificar se há algo de valor.

items.honeypot.name=pote de mel
items.honeypot.ac_shatter=QUEBRAR
items.honeypot.desc=Este grande pote de mel, na verdade, só é revestido com mel e abriga uma abelha gigante! Esse tipo de abelha enorme costuma ficar em sua colmeia. Será que esse pote é uma espécie de gaiola feita por um caçador especializado? A abelha parece bastante feliz dentro do pote com seu mel, mas zuni com desconfiança quando você olha dentro dele.
items.honeypot$shatteredpot.name=pote rachado
items.honeypot$shatteredpot.desc=Este pote está rachado, e apenas o mel grudento que o reveste está segurando sua estrutura. Ele está se despedaçando aos poucos\n\nApesar de suas rachaduras irreparáveis, a abelha ainda parece querer proteger o pote.

items.item.prompt=Selecione uma direção para jogar.
items.item.ac_drop=DESCARTAR
items.item.ac_throw=JOGAR
items.item.rankings_desc=Morto por: %s
items.item.curse=maldição
items.item.custom_note_type=Este tipo de item tem uma anotação personalizada: "_%s_"
items.item.custom_note=Este item possui uma anotação personalizada: "_%s_"
items.item.discover_hint=Você pode encontrar este item aleatoriamente na masmorra.

items.kindofmisc.unequip_title=Desequipe um item
items.kindofmisc.unequip_message=Você deve desequipar um desses itens primeiro. Selecione um item com o qual deseja trocar.

items.kindofweapon.swift_equip=Você rapidamente equipa sua arma.
items.kindofweapon.equip_cursed=Involuntariamente, você agarra a arma com mais força.
items.kindofweapon.which_equip_msg=Em qual slot de arma você gostaria de equipar este item?\n\nA Campeã ataca diretamente com sua arma primária, mas pode usar a habilidade de qualquer uma das armas. Ambas as armas compartilham a mesma contagem de carga.\n\nA Campeã também pode trocar sua arma primária e secundária instantaneamente.
items.kindofweapon.which_equip_primary=Primária (%s)
items.kindofweapon.which_equip_secondary=Secundária (%s)
items.kindofweapon.empty=vazio

items.kingscrown.name=Coroa do Rei Anão
items.kingscrown.ac_wear=VESTIR
items.kingscrown.naked=Infelizmente, a coroa não pode transformar suas roupas de baixo.
items.kingscrown.upgraded=A coroa emite um brilho forte e se desintegra enquanto a sua armadura se transforma!
items.kingscrown.ratgraded=As patas do Rei Rato brilham enquanto sua armadura se transforma!
items.kingscrown.desc=A coroa do último rei dos anões, ela brilha com tremenda energia mágica.\n\nQuando colocada, a magia da coroa irá fluir para a armadura que você esta vestindo, transformando-a em uma _épica armadura única com habilidades especiais._ A nova armadura vai manter todas as propriedades da armadura original.
items.kingscrown.discover_hint=Você pode obter este item como um saque de certos inimigos.

items.liquidmetal.name=metal líquido
items.liquidmetal.ac_apply=APLICAR
items.liquidmetal.prompt=Selecione uma arma de arremesso
items.liquidmetal.already_fixed=Esta arma de arremesso já está em perfeitas condições!
items.liquidmetal.apply=Você utiliza %d metal líquido para reparar sua arma de arremesso.
items.liquidmetal.desc=Este líquido mágico pode preencher rachaduras e trincados em uma arma de arremesso, restaurando-a à condição perfeita! Se um conjunto de armas estiver com armas a menos, mas totalmente reparado, o metal líquido pode até ser usado para substituir uma arma faltante do conjunto!\n\nUma arma de tier 1 requer 10 de metal líquido para ser totalmente reparada, uma arma de tier 5 requer 30. Cada aprimoramento também aumenta a quantidade de metal necessária em 35%.\n\nO metal líquido não pode ser usado para reparar as pontas de dardos embebidos.
items.liquidmetal.discover_hint=Você pode fabricar este item através de alquimia.

items.lostbackpack.name=mochila perdida
items.lostbackpack.desc=Este é o seu inventário perdido. Colete-o para recuperar todos os itens que você perdeu!

items.merchantsbeacon.name=transmissor do mercante
items.merchantsbeacon.ac_use=USAR
items.merchantsbeacon.desc=Esta velha peça de tecnologia permite a você se comunicar a grandes distancias.\n\nAo ser ativado, esse farol irá permitir que você venda itens para a Loja Pixel Mart em qualquer lugar da masmorra.\n\nPorém a magia dentro do transmissor só vai durar uma sessão, então use sabiamente.

items.stylus.name=caneta arcana
items.stylus.ac_inscribe=GRAVAR
items.stylus.prompt=Escolha uma armadura
items.stylus.identify=Primeiro você deve identificar se essa armadura está amaldiçoada.
items.stylus.cursed=A magia da caneta não funciona em armaduras amaldiçoadas.
items.stylus.inscribed=Você inscreveu a sua armadura com a caneta arcana.
items.stylus.desc=Esta caneta arcana é feito de alguma pedra escura e muito dura. Através dela você pode inscrever um glifo mágico em sua armadura, mas você não terá nenhum poder para escolher que glifo será, a caneta vai decidir isso por você.

items.tengusmask.name=Máscara do Tengu
items.tengusmask.ac_wear=VESTIR
items.tengusmask.used=A máscara se desintegra e seu poder flui para você!
items.tengusmask.desc=Esta máscara caiu do rosto de Tengu quando ele morreu, você pode sentir um grande poder mágico emanando dela. Seria a máscara a fonte do poder de Tengu?\n\nQuando usada, seu tremendo poder vai ser transferido para você, permitindo a _escolha de uma subclasse para seu herói._\n\nQual subclasse você irá escolher?
items.tengusmask.discover_hint=Você pode obter este item como um saque de certos inimigos.

items.torch.name=tocha
items.torch.ac_light=ACENDER
items.torch.desc=Uma dica básica para aventureiros, quando a masmorra fica escura, uma tocha pode ajudar a mostrar o caminho.

items.waterskin.name=odre
items.waterskin.ac_drink=BEBER
items.waterskin.collected=Você bota a gota de orvalho em seu odre.
items.waterskin.full=Seu odre está cheio!
items.waterskin.empty=Seu odre está vazio!
items.waterskin.desc=Um recipiente para líquido, feito de couro e corda, fechado com uma rolha.
items.waterskin.desc_water=No momento, o odre contém apenas um pouco de água potável. Certamente há algo na masmorra que o odre poderia armazenar.
items.waterskin.desc_heal=O odre está sendo usado para armazenar água curativa. Quanto mais cheio o odre estiver, mais você será curado imediatamente quando beber dele. Você só irá beber a quantia que precisar.
items.waterskin.desc_full=O odre cheio parece irradiar energia, talvez ele possa abençoar outro item de sobrevivência?
items.waterskin.discover_hint=Um dos heróis inicia com este item.
