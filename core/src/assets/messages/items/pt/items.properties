items.equipment.artifacts.artifact.need_to_equip=Você precisa equipar o seu artefato para fazer isso.

items.equipment.artifacts.capeofthorns.name=capa dos espinhos
items.equipment.artifacts.capeofthorns.desc=Estas chapas de metal colapsadas do DM-300 formaram uma rígida capa. Elas parece armazenar uma energia profunda, talvez tenha algum poder do DM-300?
items.equipment.artifacts.capeofthorns.desc_inactive=Você sente a capa tranquilamente pesada em seus ombros, parece estar ganhando energia com os danos que você recebe.
items.equipment.artifacts.capeofthorns.desc_active=A capa parece estar liberando energia armazenada, ela está irradiando um poder protetor.
items.equipment.artifacts.capeofthorns$thorns.inert=Sua Capa se torna inerte novamente.
items.equipment.artifacts.capeofthorns$thorns.radiating=Sua Capa começa a irradiar energia, você se sente protegido!
