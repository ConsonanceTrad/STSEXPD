items.equipment.artifacts.driedrose$ghosthero.discover_hint=Você pode encontrar este personagem com um artefato específico.

items.equipment.artifacts.driedrose$ghosthero.hello=Olá novamente %s.
items.equipment.artifacts.driedrose$ghosthero.introduce=Meu espírito está ligado a esta rosa, foi muito preciosa para mim, um presente do meu amor que deixei na superfície.\n\nEu não posso voltar para ele, mas graças a você eu tenho uma segunda chance para completar minha jornada. Quando eu puder, responderei ao seu chamado e lutarei junto a você.\n\nContanto que tenha a rosa, eu posso ouvir a sua voz, então você pode usá-la para me liderar de longe.\n\nEspero que você possa ter sucesso onde eu falhei...

items.equipment.artifacts.driedrose$ghosthero.dialogue_sewers_1=Estes esgotos costumavam ser seguros, as pessoas até moravam aqui no inverno.
items.equipment.artifacts.driedrose$ghosthero.dialogue_sewers_2=Eu fico imaginando o que aconteceu com os guardas que patrulhavam estes corredores... Será que desistiram?
items.equipment.artifacts.driedrose$ghosthero.dialogue_sewers_3=Eu tinha uma família na superfície, espero que estejam seguros.
items.equipment.artifacts.driedrose$ghosthero.dialogue_sewers_4=Os guardas não conseguiram derrotar esses monstros, mas talvez nós possamos.
items.equipment.artifacts.driedrose$ghosthero.dialogue_sewers_5=Se até os esgotos são perigosos, eu me pergunto o que há abaixo...
items.equipment.artifacts.driedrose$ghosthero.dialogue_sewers_6=O que poderia ter causado o crescimento assombroso desses ratos e caranguejos?
items.equipment.artifacts.driedrose$ghosthero.dialogue_prison_1=Eu já ouvi histórias sobre este lugar, nada bom.
items.equipment.artifacts.driedrose$ghosthero.dialogue_prison_2=Este lugar sempre foi mais uma masmorra do que uma prisão.
items.equipment.artifacts.driedrose$ghosthero.dialogue_prison_3=Eu não consigo imaginar o que aconteceu quando este lugar foi abandonado.
items.equipment.artifacts.driedrose$ghosthero.dialogue_prison_4=Parece que tanto os prisioneiros como os guardas foram transformados em monstros.
items.equipment.artifacts.driedrose$ghosthero.dialogue_prison_5=O que poderia ser responsável por todos esses esqueletos?
items.equipment.artifacts.driedrose$ghosthero.dialogue_prison_6=Essas pessoas não tinham que acabar assim...
items.equipment.artifacts.driedrose$ghosthero.dialogue_caves_1=Nenhum humano ou anão esteve aqui há muito tempo.
items.equipment.artifacts.driedrose$ghosthero.dialogue_caves_2=O que faria com que os anões abandonassem uma mina de ouro?
items.equipment.artifacts.driedrose$ghosthero.dialogue_caves_3=É uma pena que todo o ouro aqui seja inútil na superfície.
items.equipment.artifacts.driedrose$ghosthero.dialogue_caves_4=As criaturas aqui são distorcidas, assim como nos esgotos.
items.equipment.artifacts.driedrose$ghosthero.dialogue_caves_5=Até os morcegos são sanguinários aqui.
items.equipment.artifacts.driedrose$ghosthero.dialogue_caves_6=Nenhum sinal de qualquer equipamento de mineração, os anões recuperaram tudo?
items.equipment.artifacts.driedrose$ghosthero.dialogue_city_1=Os anões eram engenhosos, mas gananciosos.
items.equipment.artifacts.driedrose$ghosthero.dialogue_city_2=Então a metrópole dos anões realmente caiu.
items.equipment.artifacts.driedrose$ghosthero.dialogue_city_3=Espero que a superfície nunca acabe como este lugar.
items.equipment.artifacts.driedrose$ghosthero.dialogue_city_4=Anões não deveriam parecer tão pálidos.
items.equipment.artifacts.driedrose$ghosthero.dialogue_city_5=Eu não sei o que é pior, os anões ou suas criações.
items.equipment.artifacts.driedrose$ghosthero.dialogue_city_6=Parece que os anões também são monstros irracionais agora.
items.equipment.artifacts.driedrose$ghosthero.dialogue_halls_1=O que é este lugar?
items.equipment.artifacts.driedrose$ghosthero.dialogue_halls_2=Este lugar é aterrorizante...
items.equipment.artifacts.driedrose$ghosthero.dialogue_halls_3=O que os anões estavam pensando, brincando com um poder como esse?
items.equipment.artifacts.driedrose$ghosthero.dialogue_halls_4=Os monstros aqui são de outro mundo, de onde eles vieram?
items.equipment.artifacts.driedrose$ghosthero.dialogue_halls_5=Consegue sentir? É como se algo estivesse nos observando.
items.equipment.artifacts.driedrose$ghosthero.dialogue_halls_6=Graças aos céus há tochas, é muito escuro aqui!
items.equipment.artifacts.driedrose$ghosthero.dialogue_ascension_1=Por que isto está acontecendo, eu pensei que tínhamos conseguido?
items.equipment.artifacts.driedrose$ghosthero.dialogue_ascension_2=Como pode aquela coisa ainda ser capaz de ter influência sobre este mundo?
items.equipment.artifacts.driedrose$ghosthero.dialogue_ascension_3=Espero que você saiba o que está fazendo com esse amuleto.
items.equipment.artifacts.driedrose$ghosthero.dialogue_ascension_4=Suponho que ainda não terminamos.
items.equipment.artifacts.driedrose$ghosthero.dialogue_ascension_5=Já chegamos tão longe, nós podemos conseguir!
items.equipment.artifacts.driedrose$ghosthero.dialogue_ascension_6=Só mais um pouco. Nós vamos conseguir sair daqui!

items.equipment.artifacts.driedrose$ghosthero.seen_goo_1=Cuidado com o Goo!
items.equipment.artifacts.driedrose$ghosthero.seen_goo_2=Muitos dos meus amigos morreram para essa coisa, hora da vingança!
items.equipment.artifacts.driedrose$ghosthero.seen_goo_3=Tal abominação não pode viver!
items.equipment.artifacts.driedrose$ghosthero.seen_tengu_1=O prisioneiro que restou é um assassino mortal. Mas é claro...
items.equipment.artifacts.driedrose$ghosthero.seen_tengu_2=Ele nos prendeu!
items.equipment.artifacts.driedrose$ghosthero.seen_tengu_3=Eu ouvi histórias de horror sobre essa máscara...
items.equipment.artifacts.driedrose$ghosthero.seen_dm300_1=Somente anões constroem uma máquina de mineração que mata intrusos.
items.equipment.artifacts.driedrose$ghosthero.seen_dm300_2=Essa coisa é enorme...
items.equipment.artifacts.driedrose$ghosthero.seen_dm300_3=Como essa coisa permaneceu ativa por tanto tempo?
items.equipment.artifacts.driedrose$ghosthero.seen_king_1=Quando as pessoas dizem que o poder corrompe, é isso que querem dizer.
items.equipment.artifacts.driedrose$ghosthero.seen_king_2=Ele é mais um lich que um rei agora.
items.equipment.artifacts.driedrose$ghosthero.seen_king_3=Mesmo na morte, os anões obedecem ao seu mestre.
items.equipment.artifacts.driedrose$ghosthero.seen_yog_1=Ah, isso não parece bom.
items.equipment.artifacts.driedrose$ghosthero.seen_yog_2=Então é assim que um deus se parece?
items.equipment.artifacts.driedrose$ghosthero.seen_yog_3=Isto vai doer...

items.equipment.artifacts.driedrose$ghosthero.defeated_by_enemy_1=Boa sorte...
items.equipment.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Cansado... por agora...
items.equipment.artifacts.driedrose$ghosthero.defeated_by_enemy_3=Eu retornarei...
items.equipment.artifacts.driedrose$ghosthero.defeated_by_boss_1=Desculpe-me... boa sorte...
items.equipment.artifacts.driedrose$ghosthero.defeated_by_boss_2=Termine... sem mim...
items.equipment.artifacts.driedrose$ghosthero.defeated_by_boss_3=Não... Eu não posso...
items.equipment.artifacts.driedrose$ghosthero.blessed_ankh_1=Como você sobreviveu a isso?
items.equipment.artifacts.driedrose$ghosthero.blessed_ankh_2=Eu queria ter tido um desses...
items.equipment.artifacts.driedrose$ghosthero.blessed_ankh_3=Abençoado seja! Você ainda vive!
items.equipment.artifacts.driedrose$ghosthero.player_killed_1=Não!...
items.equipment.artifacts.driedrose$ghosthero.player_killed_2=Eu não pude ajudar você...
items.equipment.artifacts.driedrose$ghosthero.player_killed_3=Não desse jeito...

items.equipment.artifacts.driedrose$ghosthero.direct_prompt=O que devo fazer?
items.equipment.artifacts.driedrose$ghosthero.directed_follow_1=Está bem, eu vou seguir você.
items.equipment.artifacts.driedrose$ghosthero.directed_follow_2=Eu ficarei na sua retaguarda.
items.equipment.artifacts.driedrose$ghosthero.directed_follow_3=Seguindo você...
items.equipment.artifacts.driedrose$ghosthero.directed_follow_4=Está bem, vamos lá!
items.equipment.artifacts.driedrose$ghosthero.directed_follow_5=Eu cubro a sua retaguarda.
items.equipment.artifacts.driedrose$ghosthero.directed_attack_1=Entendido, eu vou atacar esse.
items.equipment.artifacts.driedrose$ghosthero.directed_attack_2=Eu tomo conta desse.
items.equipment.artifacts.driedrose$ghosthero.directed_attack_3=Engajando...
items.equipment.artifacts.driedrose$ghosthero.directed_attack_4=Vamos pegá-los!
items.equipment.artifacts.driedrose$ghosthero.directed_attack_5=Eu fico com esse.
items.equipment.artifacts.driedrose$ghosthero.directed_position_1=Está bem, eu vou guardar essa posição.
items.equipment.artifacts.driedrose$ghosthero.directed_position_2=Eu irei até lá e defenderei.
items.equipment.artifacts.driedrose$ghosthero.directed_position_3=Reposicionando...
items.equipment.artifacts.driedrose$ghosthero.directed_position_4=A caminho!
items.equipment.artifacts.driedrose$ghosthero.directed_position_5=Eu irei para lá.

items.equipment.artifacts.driedrose$ghosthero.desc=Uma figura etérea frágil com uma forma humanoide. Seu poder parece atrelado à rosa que você tem.\n\nEste fantasma pode não ser muito, mas parece ser seu único amigo de verdade aqui embaixo.

##back to artifacts
