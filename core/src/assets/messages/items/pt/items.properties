###armor curses
items.equipment.armor.curses.antientropy.name=%s de antientropia
items.equipment.armor.curses.antientropy.desc=A maldição antientropia funciona contra as forças do universo, puxando energia para o usuário e de seus arredores. Isso incendeia brevemente o usuário, mas congela tudo ao seu redor!

items.equipment.armor.curses.bulk.name=%s volumosa
items.equipment.armor.curses.bulk.desc=Armaduras volumosas parecem maiores e mais imponentes, mas na verdade não oferecem defesa aprimorada. Pior ainda, o tamanho excessivo dificulta bastante a passagem por portas.

items.equipment.armor.curses.corrosion.name=%s de corrosão
items.equipment.armor.curses.corrosion.desc=Uma armadura de corrosão é capaz de expelir violentamente um líquido corrosivo, cobrindo tudo na área com um muco ácido pegajoso.

items.equipment.armor.curses.displacement.name=%s de deslocamento
items.equipment.armor.curses.displacement.desc=A maldição de deslocamento move o usuário para um lugar seguro quando o mesmo é atacado. É efetivo até demais, teletransportando aleatoriamente o usuário pelo andar.

items.equipment.armor.curses.metabolism.name=%s metabolizante
items.equipment.armor.curses.metabolism.desc=A maldição metabolizante converte diretamente saciedade em vida quando o usuário é atingido, provendo um bônus de regeneração, porém fazendo com que você fique faminto mais rápido.

items.equipment.armor.curses.multiplicity.name=%s da multiplicidade
items.equipment.armor.curses.multiplicity.desc=Armadura amaldiçoada com multiplicidade contém uma perigosa magia de duplicação. Ela irá, às vezes, criar uma imagem espelhada do usuário quando atacado, mas tem a mesma chance de duplicar o atacante!

items.equipment.armor.curses.overgrowth.name=%s de super crescimento
items.equipment.armor.curses.overgrowth.desc=Sua armadura de super crescimento é coberta com várias plantas florescendo. Embora este efeito certamente pareça interessante, elas não ajudam nada para defesa, e essas plantas serão ativadas aleatoriamente em combate!

items.equipment.armor.curses.stench.name=%s de fedor
items.equipment.armor.curses.stench.desc=Armadura amaldiçoada com fedor liberará nuvens de gás tóxico, que são perigosas para tudo que entra em contato.


###glyphs
items.equipment.armor.glyphs.affection.name=%s da afeição
items.equipment.armor.glyphs.affection.desc=Este poderoso glifo manipula a mente dos atacantes, encantando-os temporariamente.

items.equipment.armor.glyphs.antimagic.name=%s de antimagia
items.equipment.armor.glyphs.antimagic.desc=Este poderoso glifo permite que a armadura defenda seu usuário contra ataques mágicos e físicos. Esta defesa mágica não é afetada pelo tier da armadura.

items.equipment.armor.glyphs.brimstone.name=%s de enxofre
items.equipment.armor.glyphs.brimstone.desc=Este glifo protege o usuário e seus pertences do fogo, anulando completamente seus danos e efeitos negativos.

items.equipment.armor.glyphs.camouflage.name=%s de camuflagem
items.equipment.armor.glyphs.camouflage.desc=Este glifo permite que o usuário se camufle em grama alta, garantindo invisibilidade temporária.

items.equipment.armor.glyphs.entanglement.name=%s do emaranhamento
items.equipment.armor.glyphs.entanglement.desc=Este glifo cresce armadura de terra ao redor do usuário para absorver dano, mas esta armadura vai quebrar se o usuário se mover.

items.equipment.armor.glyphs.flow.name=%s de fluxo
items.equipment.armor.glyphs.flow.desc=Este glifo manipula o fluxo de água em volta do usuário, fazendo com que o mesmo se movimente mais rápido ao andar sobre ela.

items.equipment.armor.glyphs.obfuscation.name=%s de ofuscamento
items.equipment.armor.glyphs.obfuscation.desc=Esse glifo obscurece o usuário, dificultando sua detecção.

items.equipment.armor.glyphs.potential.name=%s do potencial
items.equipment.armor.glyphs.potential.desc=Este glifo gera energia quando atingido, concedendo carga à varinha do usuário quando ativado.

items.equipment.armor.glyphs.repulsion.name=%s de repulsão
items.equipment.armor.glyphs.repulsion.desc=Este glifo rebate com força contra atacantes, fazendo-os voarem para trás.

items.equipment.armor.glyphs.stone.name=%s de pedra
items.equipment.armor.glyphs.stone.desc=Este glifo cobre a armadura com uma pedra mágica pesada que faz com que esquivar seja impossível, mas bloqueia os danos em proporção à evasão.

items.equipment.armor.glyphs.swiftness.name=%s de rapidez
items.equipment.armor.glyphs.swiftness.desc=Este glifo aumenta a velocidade do usuário sempre que ele não está perto de um inimigo.

items.equipment.armor.glyphs.thorns.name=%s de espinhos
items.equipment.armor.glyphs.thorns.desc=Este poderoso glifo fere os atacantes, fazendo com que eles sangrem lentamente quando atacam o usuário.

items.equipment.armor.glyphs.viscosity.name=%s da viscosidade
items.equipment.armor.glyphs.viscosity.deferred=%d adiado
items.equipment.armor.glyphs.viscosity$defereddamage.name=dano adiado
items.equipment.armor.glyphs.viscosity$defereddamage.ondeath=O dano adiado matou você...
items.equipment.armor.glyphs.viscosity$defereddamage.rankings_desc=Morto por dano adiado
items.equipment.armor.glyphs.viscosity$defereddamage.desc=Os danos são causados lentamente ao longo do tempo, em vez de imediatamente.\n\nDano adiado restante: %d.
items.equipment.armor.glyphs.viscosity.desc=Este glifo é capaz de armazenar dano infligido ao usuário, distribuindo o dano lentamente em vez de uma única vez.



