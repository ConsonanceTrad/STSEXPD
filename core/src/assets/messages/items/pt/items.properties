items.equipment.artifacts.capeofthorns$thorns.name=espinhos
items.equipment.artifacts.capeofthorns$thorns.desc=Sua capa está irradiando energia, cercando você com um campo de força defletora!\n\nTodo o dano recebido é reduzido enquanto o efeito dos espinhos esta ativado. Adicionalmente, se o atacante está próximo a você, o dano reduzido é defletido de volta ao atacante!\n\nTurnos de espinhos restantes: %s.

items.equipment.artifacts.chaliceofblood.name=cálice de sangue
items.equipment.artifacts.chaliceofblood.ac_prick=FURAR
items.equipment.artifacts.chaliceofblood.yes=Sim, sei o que faço
items.equipment.artifacts.chaliceofblood.no=Não, eu mudei de ideia
items.equipment.artifacts.chaliceofblood.prick_warn=A cada vez que usa o cálice, ele drena mais da sua energia vital, mas, em troca, potencializa mais sua regeneração natural de vida.\n\nAtualmente, espetar-se causará _%1$d-%2$d de dano_, embora esse dano possa ser reduzido por _bloqueios tanto físicos quanto mágicos, ou por redução de dano. Sem considerar os efeitos de redução de dano, espetar-se tem uma chance de _%3$s%%_ de drenar completamente sua energia vital.\n\nTem certeza de que deseja oferecer mais energia vital ao cálice?
items.equipment.artifacts.chaliceofblood.onprick=Você se fura e sua essência vital é drenada para dentro do cálice.
items.equipment.artifacts.chaliceofblood.ondeath=O Cálice drenou completamente a sua essência vital...
items.equipment.artifacts.chaliceofblood.desc=Este reluzente cálice de prata é estranhamente adornado com gemas preciosas afiadas na borda.
items.equipment.artifacts.chaliceofblood.desc_cursed=O cálice amaldiçoado se prendeu à sua mão e está inibindo a sua habilidade de regenerar vida.
items.equipment.artifacts.chaliceofblood.desc_1=Enquanto segura o cálice, você se sente estranhamente compelido a se furar nas gemas afiadas.
items.equipment.artifacts.chaliceofblood.desc_2=Um pouco do seu sangue está acumulado dentro do cálice, você sente o cálice sutilmente nutrindo você com energia vital, potencializando sua regeneração natural de vida. Você ainda quer se cortar no cálice, mesmo sabendo que irá doer.
items.equipment.artifacts.chaliceofblood.desc_3=O cálice está cheio até a borda com a sua essência vital. Você pode sentir o cálice transbordando energia vital de volta para você.

items.equipment.artifacts.cloakofshadows.name=capa das sombras
items.equipment.artifacts.cloakofshadows.ac_stealth=INVISÍVEL
items.equipment.artifacts.cloakofshadows.cooldown=Sua capa precisa de mais %d para se reenergizar.
items.equipment.artifacts.cloakofshadows.cursed=Você não pode usar uma capa amaldiçoada.
items.equipment.artifacts.cloakofshadows.no_charge=Sua capa ainda não carregou o suficiente para ser utilizada.
items.equipment.artifacts.cloakofshadows.desc=Uma capa mágica de valor inestimável, roubada do arsenal real há muitos anos pelo Ladino. Quando usada, ela se torna completamente invisível por um curto período de tempo .\n\nQuanto mais for usada, mais forte ela se tornará, permitindo ao ladino se tornar invisível mais frequentemente e por períodos maiores.
items.equipment.artifacts.cloakofshadows.discover_hint=Um dos heróis inicia com este item.
items.equipment.artifacts.cloakofshadows$cloakstealth.no_charge=A capa ficou sem energia
items.equipment.artifacts.cloakofshadows$cloakstealth.levelup=Sua capa cresceu em força
items.equipment.artifacts.cloakofshadows$cloakstealth.name=encoberto
items.equipment.artifacts.cloakofshadows$cloakstealth.desc=Sua capa das sombras está lhe garantindo invisibilidade enquanto você está encoberto por ela. Você permanecerá invisível até que a invisibilidade seja interrompida ou sua capa fique sem carga.\n\nEnquanto você estiver invisível, inimigos são incapazes de atacar ou segui-lo . Ataques físicos e efeitos mágicos (tais como pergaminhos e varinhas) irão interromper imediatamente a invisibilidade.\n\nTurnos até o uso de carga: %d.

