items.consum.scrolls.scroll.odal=pergaminho de ODAL
items.consum.scrolls.scroll.tiwaz=pergaminho de TIWAZ
items.consum.scrolls.scroll.unknown_desc=Uma runa mágica indecifrável está escrita neste pergaminho. Quem sabe o que vai fazer quando lido em voz alta?
items.consum.scrolls.scroll.blinded=Você não pode ler um pergaminho enquanto estiver cego.
items.consum.scrolls.scroll.no_magic=Você não pode ler um pergaminho enquanto está imune à magia.
items.consum.scrolls.scroll.cursed=O livro de feitiços amaldiçoado impede que você invoque a magia deste pergaminho! Um pergaminho de remoção de maldição, porém, talvez seja forte o suficiente para funcionar...
items.consum.scrolls.scroll$placeholder.name=pergaminho

items.consum.scrolls.inventoryscroll.warning=Você deseja realmente cancelar o uso deste pergaminho? Ele não foi identificado anteriormente, então será consumido de qualquer forma.
items.consum.scrolls.inventoryscroll.yes=Sim, eu tenho certeza
items.consum.scrolls.inventoryscroll.no=Não, eu mudei de ideia

items.consum.scrolls.scrollofidentify.name=pergaminho de identificação
items.consum.scrolls.scrollofidentify.inv_title=Identificar um item
items.consum.scrolls.scrollofidentify.it_is=Seu item foi identificado: %s.
items.consum.scrolls.scrollofidentify.desc=Este pergaminho revela todos os segredos de um único item permanentemente.

items.consum.scrolls.scrolloflullaby.name=pergaminho do acalento
items.consum.scrolls.scrolloflullaby.sooth=O pergaminho emite uma melodia suave. Você se sente muito sonolento.
items.consum.scrolls.scrolloflullaby.desc=A leitura deste pergaminho emite uma melodia suave que irá colocar todos os que a ouvirem num profundo sono mágico. Para o leitor e seus aliados, o sono é restaurador.

items.consum.scrolls.scrollofmagicmapping.name=pergaminho de mapeamento mágico
items.consum.scrolls.scrollofmagicmapping.layout=Você agora sabe o formato deste andar.
items.consum.scrolls.scrollofmagicmapping.desc=Quando este pergaminho for lido, uma imagem de clareza cristalina será entalhada em sua memória, alertando você sobre a configuração precisa deste nível e revelando todos os seus segredos ocultos. A localização de itens e de criaturas permanecerão desconhecidos.

items.consum.scrolls.scrollofmirrorimage.name=pergaminho da imagem espelhada
items.consum.scrolls.scrollofmirrorimage.copies=O pergaminho forma imagens espelhadas de você.
items.consum.scrolls.scrollofmirrorimage.no_copies=O pergaminho tenta criar imagens espelhadas de você, mas elas não têm para aonde ir.
items.consum.scrolls.scrollofmirrorimage.desc=O encantamento neste pergaminho criará dois gêmeos ilusórios do leitor. Essas imagens espelhadas agem como clones mais fracos do leitor e perseguem seus inimigos. No entanto, eles não têm durabilidade e irão desaparecer ao sofrer dano.

items.consum.scrolls.scrollofretribution.name=pergaminho da retribuição
items.consum.scrolls.scrollofretribution.blast=Uma poderosa energia mágica irrompe do pergaminho!
items.consum.scrolls.scrollofretribution.desc=Este pergaminho contém energia destrutiva que canaliza o sofrimento do leitor para o exterior numa explosão de poder. Quanto mais fraco o leitor estiver, mais danos ele irá causar. Com a saúde muito baixa, este pergaminho pode matar a maioria dos inimigos instantaneamente.\n\nNo entanto, o uso do pergaminho afeta o usuário, cegando-o e enfraquecendo-o.

items.consum.scrolls.scrollofrage.name=pergaminho da fúria
items.consum.scrolls.scrollofrage.roar=O pergaminho emite um rugido enfurecedor que ecoa pela masmorra!
items.consum.scrolls.scrollofrage.desc=Ao ser lido em voz alta, este pergaminho irá liberar um grande rugido que atrairá a atenção de todos os inimigos para o leitor, e colocará em estado de cólera aqueles que estiverem próximos.

items.consum.scrolls.scrollofrecharging.name=pergaminho da recarga
items.consum.scrolls.scrollofrecharging.surge=Um surto de energia percorre seu corpo, revigorando suas varinhas!
items.consum.scrolls.scrollofrecharging.desc=O poder mágico bruto ligado a este pergaminho irá, quando liberado, carregar todas as varinhas do usuário ao longo do tempo.

items.consum.scrolls.scrollofremovecurse.name=pergaminho de remover maldição
items.consum.scrolls.scrollofremovecurse.inv_title=Purifique um item
items.consum.scrolls.scrollofremovecurse.cleansed=O seu item brilha com uma luz purificante e a energia maléfica dissipa-se!
items.consum.scrolls.scrollofremovecurse.not_cleansed=O seu item brilha com uma luz purificadora, mas nada acontece.
items.consum.scrolls.scrollofremovecurse.spirit=Seu pergaminho liberta o espírito atormentado!
items.consum.scrolls.scrollofremovecurse.desc=O encantamento neste pergaminho removerá instantaneamente quaisquer maldições de uma arma, anel, varinha, armadura ou artefato.

items.consum.scrolls.scrollofteleportation.name=pergaminho de teletransportação
items.consum.scrolls.scrollofteleportation.tele=Em um piscar de olhos, você foi teletransportado para outro lugar no andar.
items.consum.scrolls.scrollofteleportation.no_tele=A magia de teletransporte falhou.
items.consum.scrolls.scrollofteleportation.cant_reach=Você não pode se teletransportar para lá.
items.consum.scrolls.scrollofteleportation.prompt=Escolha uma localização para se teletransportar
items.consum.scrolls.scrollofteleportation.desc=O feitiço deste pergaminho transporta instantaneamente o leitor para um local diferente no andar da masmorra. O pergaminho prioriza áreas para as quais o leitor não esteve antes, porém não é capaz de se teletransportar através de portas trancadas ou barricadas. Ele pode, no entanto, revelar portas escondidas que levam a novas áreas.

items.consum.scrolls.scrollofterror.name=pergaminho do terror
items.consum.scrolls.scrollofterror.none=O pergaminho emite uma brilhante luz vermelha.
items.consum.scrolls.scrollofterror.one=O pergaminho emite uma brilhante luz vermelha e %s foge!
items.consum.scrolls.scrollofterror.many=O pergaminho emite uma brilhante luz vermelha e os monstros fogem!
items.consum.scrolls.scrollofterror.desc=Quando lido, este pergaminho emitirá um flash de luz vermelho que irá envolver todos os inimigos em seu campo de visão com terror, fazendo-os fugir. Atacar um inimigo em fuga encurtará o efeito.

items.consum.scrolls.scrolloftransmutation.name=pergaminho de transmutação
items.consum.scrolls.scrolloftransmutation.inv_title=Transmutar um item
items.consum.scrolls.scrolloftransmutation.nothing=Nada de interessante acontece.
items.consum.scrolls.scrolloftransmutation.morph=Seu item se transforma em algo diferente!
items.consum.scrolls.scrolloftransmutation.desc=Este pergaminho contém uma poderosa magia de transmutação. Quando usado em um item elegível, irá transformá-lo em um item diferente do mesmo tipo. A magia preservará até mesmo  aprimoramentos, encantamentos e glifos. Pergaminhos e poções serão transmutados em suas variantes exóticas e vice-versa.

items.consum.scrolls.scrollofupgrade.name=Pergaminho do Aprimoramento
items.consum.scrolls.scrollofupgrade.inv_title=Aprimorar um item
items.consum.scrolls.scrollofupgrade.weaken_curse=O pergaminho de aprimoramento enfraquece a maldição em seu item.
items.consum.scrolls.scrollofupgrade.remove_curse=O pergaminho de aprimoramento purificou seu item da maldição!
items.consum.scrolls.scrollofupgrade.desc=Este pergaminho aprimorará um único item ou um conjunto de armas de arremesso. Varinhas aumentarão em poder e número de cargas, armas e armaduras causarão e bloquearão mais dano, conjuntos de armas de arremesso serão completamente reparados e serão mais duráveis e os efeitos dos anéis se intensificarão.\n\nSeu encantamento pode até enfraquecer ou às vezes dissipar totalmente maldições, embora não seja tão potente quanto um pergaminho de remover maldição. A magia do pergaminho, de forma inoportuna, também pode interferir e apagar encantamentos de armas e glifos nas armaduras de níveis altos.



###exotic scrolls
items.consum.scrolls.exotic.exoticscroll.kaunan=Pergaminho exótico KAUNAN
items.consum.scrolls.exotic.exoticscroll.sowilo=Pergaminho exótico SOWILO
items.consum.scrolls.exotic.exoticscroll.laguz=Pergaminho exótico LAGUZ
items.consum.scrolls.exotic.exoticscroll.yngvi=Pergaminho exótico YNGVI
items.consum.scrolls.exotic.exoticscroll.gyfu=Pergaminho exótico GYFU
items.consum.scrolls.exotic.exoticscroll.raido=Pergaminho exótico RAIDO
items.consum.scrolls.exotic.exoticscroll.isaz=Pergaminho exótico ISAZ
items.consum.scrolls.exotic.exoticscroll.mannaz=Pergaminho exótico MANNAZ
items.consum.scrolls.exotic.exoticscroll.naudiz=Pergaminho exótico NAUDIZ
items.consum.scrolls.exotic.exoticscroll.berkanan=Pergaminho exótico BERKANAN
items.consum.scrolls.exotic.exoticscroll.odal=Pergaminho exótico ODAL
items.consum.scrolls.exotic.exoticscroll.tiwaz=Pergaminho exótico TIWAZ
items.consum.scrolls.exotic.exoticscroll.unknown_desc=Uma brilhante runa mágica indecifrável está escrita neste pergaminho preto. Parece não ser desta terra, quem sabe o que vai fazer quando lido em voz alta?
items.consum.scrolls.exotic.exoticscroll.discover_hint=Você pode fabricar este item através de alquimia.

items.consum.scrolls.exotic.scrollofsirenssong.name=Pergaminho do canto da sereia
items.consum.scrolls.exotic.scrollofsirenssong.prompt=Escolha um alvo
items.consum.scrolls.exotic.scrollofsirenssong.no_target=O pergaminho é ativado sem um alvo.
items.consum.scrolls.exotic.scrollofsirenssong.cancel=Você deve escolher um alvo.
items.consum.scrolls.exotic.scrollofsirenssong.desc=A leitura deste pergaminho emitirá uma melodia sedutora que dominará o inimigo visado, transformando-o permanentemente em um aliado! Outros inimigos que ouvirem serão encantados temporariamente.\n\nInimigos particularmente fortes podem resistir ao efeito de dominação e, em vez disso, ficarão encantados.
items.consum.scrolls.exotic.scrollofsirenssong$enthralled.name=dominado
items.consum.scrolls.exotic.scrollofsirenssong$enthralled.desc=Esta criatura foi enfeitiçada pela magia do pergaminho do canto da sereia.\n\nUm personagem dominado é seu aliado permanentemente e irá lutar com qualquer inimigo que encontre.

items.consum.scrolls.exotic.scrollofantimagic.name=pergaminho antimagia
items.consum.scrolls.exotic.scrollofantimagic.desc=O encantamento deste pergaminho irá envolver você com uma aura mágica que te deixará temporariamente imune a todos os efeitos mágicos, sejam prejudiciais ou benéficos. Isso inclui a maioria dos efeitos de itens mágicos, como varinhas, pergaminhos, anéis, artefatos, encantamentos e maldições. Mesmo assim, as habilidades de armadura heroica ainda são fortes o suficiente para funcionar.

items.consum.scrolls.exotic.scrollofchallenge.name=Pergaminho do desafio
items.consum.scrolls.exotic.scrollofchallenge.desc=Quando lido em voz alta, este pergaminho desencadeará um grande rugido que atrairá os inimigos até o usuário, ao mesmo tempo em que cria uma pequena arena em volta dele.\n\nEnquanto o leitor permanecer nesta arena, irá receber 33% a menos de dano de qualquer fonte (isso é aplicado antes de outras formas de redução de dano) e não irá perder saciedade.\n\nO tamanho da arena será dimensionado com a área em que o leitor se encontra. Será particularmente pequena em algumas áreas de chefões.
items.consum.scrolls.exotic.scrollofchallenge$challengearena.name=arena de desafio
items.consum.scrolls.exotic.scrollofchallenge$challengearena.desc=Uma arena mágica apareceu ao seu redor, indicada pela névoa vermelha ondulante.\n\nEnquanto estando nesta névoa, sua fome não aumentará e você receberá 33%% a menos de dano de todas as fontes. Se você tiver qualquer fonte de redução de dano (como uma armadura), ela será aplicada após a redução de 33%%. \n\nTurnos restantes: %d.

items.consum.scrolls.exotic.scrollofdivination.name=pergaminho da adivinhação
items.consum.scrolls.exotic.scrollofdivination.nothing_left=Não há mais nada para identificar!
items.consum.scrolls.exotic.scrollofdivination.desc=Este pergaminho identificará aleatoriamente quatro tipos de itens que você não conhece atualmente. Os tipos identificados podem ser a cor de uma poção, a runa de um pergaminho ou a gema de um anel.  Os itens identificados não serão necessariamente aqueles que você está carregando.
items.consum.scrolls.exotic.scrollofdivination$wnddivination.desc=Seu pergaminho de adivinhação identificou os seguintes itens:

items.consum.scrolls.exotic.scrollofdread.name=Pergaminho do pavor
items.consum.scrolls.exotic.scrollofdread.desc=Quando lido, este pergaminho emitirá um flash de luz vermelho que introduzirá um incrível terror em todos os inimigos no seu campo de visão. Tão grande é esse efeito que eles tentarão fugir rapidamente da masmorra inteira, para nunca mais serem vistos!\n\nAssim como o terror, este efeito pode expirar com o tempo ou quando o inimigo for atacado.\n\nInimigos obstinados, como os chefões, porém, serão afligidos com terror normal.

items.consum.scrolls.exotic.scrollofenchantment.name=pergaminho do encantamento
items.consum.scrolls.exotic.scrollofenchantment.inv_title=Encante um item
items.consum.scrolls.exotic.scrollofenchantment.weapon=Selecione um encantamento para aplicar em sua arma.
items.consum.scrolls.exotic.scrollofenchantment.armor=Selecione um glifo para aplicar à sua armadura.
items.consum.scrolls.exotic.scrollofenchantment.cancel=cancelar
items.consum.scrolls.exotic.scrollofenchantment.cancel_warn=O cancelamento ainda consumirá seu pergaminho de encantamento, tem certeza?
items.consum.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Sim, tenho certeza.
items.consum.scrolls.exotic.scrollofenchantment.cancel_warn_no=Não, mudei de ideia
items.consum.scrolls.exotic.scrollofenchantment.desc=Este pergaminho infundirá uma arma ou armadura com poderosa energia mágica. O leitor ainda tem algum grau de controle sobre qual mágica será imbuída.

items.consum.scrolls.exotic.scrollofforesight.name=pergaminho da vidência
items.consum.scrolls.exotic.scrollofforesight.desc=Após ler este pergaminho, os detalhes de terrenos próximos serão constantemente alimentados à mente do leitor com clareza cristalina. Este efeito dura por uma quantidade considerável de tempo e revelará todas as portas e armadilhas escondidas, fazendo a procura desnecessária.

items.consum.scrolls.exotic.scrollofmetamorphosis.name=pergaminho da metamorfose
items.consum.scrolls.exotic.scrollofmetamorphosis.choose_desc=Escolha um talento para metamorfosear.
items.consum.scrolls.exotic.scrollofmetamorphosis.replace_desc=Escolha um novo talento para repor o seu talento metamorfoseado.
items.consum.scrolls.exotic.scrollofmetamorphosis.cancel_warn=O cancelamento ainda consumirá seu pergaminho da metamorfose, tem certeza?
items.consum.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=talento de metamorfose
items.consum.scrolls.exotic.scrollofmetamorphosis.desc=Este pergaminho contém uma magia poderosa de transmutação, que será aplicada ao conjurador ao invés de a um item. A magia deste pergaminho permitirá que você selecione um talento e o substitua por um dos cinco talentos de mesmo tier de diferente classes de herói!\n\nEste efeito somente pode ser aplicado a talentos de classe e não a talentos ganhos de subclasses ou habilidades de armadura. Talentos que você não pode usar não serão dados como opções.

items.consum.scrolls.exotic.scrollofmysticalenergy.name=pergaminho da energia mística
items.consum.scrolls.exotic.scrollofmysticalenergy.desc=O poder mágico bruto ligado a este pergaminho irá, quando liberado, carregar os artefatos equipados do usuário ao longo do tempo.

items.consum.scrolls.exotic.scrollofpassage.name=pergaminho da passagem
items.consum.scrolls.exotic.scrollofpassage.desc=O feitiço deste pergaminho transporta instantaneamente o leitor para o primeiro andar da região mais próxima acima dele. Muito útil para chegar rapidamente a uma loja.

items.consum.scrolls.exotic.scrollofprismaticimage.name=pergaminho da imagem prismática
items.consum.scrolls.exotic.scrollofprismaticimage.desc=O encantamento neste pergaminho criará um gêmeo ilusório colorido do leitor. Esta imagem prismática atua como um clone mais fraco do leitor, com defesa semelhante, mas menos PV e dano.\n\nA imagem prismática se mostrará quando os inimigos estiverem presentes e tentará defender o leitor.\n\nSe uma imagem prismática já existir, o uso desse pergaminho irá curar a imagem.

items.consum.scrolls.exotic.scrollofpsionicblast.name=pergaminho da explosão psiônica
items.consum.scrolls.exotic.scrollofpsionicblast.ondeath=A Explosão Psiônica explode sua mente...
items.consum.scrolls.exotic.scrollofpsionicblast.desc=Este pergaminho contém incrível energia destrutiva que pode ser canalizada para destruir as mentes de todas as criaturas visíveis.\n\nNo entanto, a leitura deste poderoso feitiço tem uma taxa sobre quem o lança e o leitor também sofrerá dano, será cegado e enfraquecido. Quanto mais alvos o pergaminho acertar, menor será o dano ao leitor.



###spells
items.consum.spells.alchemize.name=alquimizar
items.consum.spells.alchemize.prompt=Alquimizar um item
items.consum.spells.alchemize.desc=Este feitiço contém poderes transmutativos semelhantes aos encontrados em um pote de alquimia. Cada uso permite ao usuário transformar um item (ou pilha de itens) em ouro ou energia alquímica. Transformar poções ou pergaminhos em energia irá até mesmo identificá-los!\n\nAlguns Alquimizar são vendidos em lojas, mas muitos mais podem ser feitos usando alquimia combinando uma semente, uma pedra rúnica e um pouco de energia alquímica.
items.consum.spells.alchemize$wndalchemizeitem.sell=Torne em %d moedas
items.consum.spells.alchemize$wndalchemizeitem.sell_1=Torne 1 em %d moedas
items.consum.spells.alchemize$wndalchemizeitem.sell_all=Torne tudo em %d moedas
items.consum.spells.alchemize$wndalchemizeitem.energize=Torne em %d energias
items.consum.spells.alchemize$wndalchemizeitem.energize_1=Torne 1 em %d energias
items.consum.spells.alchemize$wndalchemizeitem.energize_all=Torne tudo em %d energias

items.consum.spells.beaconofreturning.name=sinalizador de retorno
items.consum.spells.beaconofreturning.preventing=A forte aura mágica deste lugar impede você de usar o feitiço!
items.consum.spells.beaconofreturning.creatures=A aura psíquica das criaturas vizinhas não permite que você se teletransporte neste momento.
items.consum.spells.beaconofreturning.set=O sinalizador foi definido em sua localização atual.
items.consum.spells.beaconofreturning.wnd_body=A configuração substituirá o local em que o sinalizador foi definido anteriormente.\n\nRetornar retornará ao seu último local definido e consumirá um uso do feitiço.
items.consum.spells.beaconofreturning.wnd_set=Definir
items.consum.spells.beaconofreturning.wnd_return=Retorna
items.consum.spells.beaconofreturning.desc_set=Este sinalizador foi definido em algum lugar no chão %d.
items.consum.spells.beaconofreturning.desc=Esta magia intrincada concede ao usuário a capacidade de retornar a um local definido, independentemente da distância. O feitiço só será consumido ao retornar, então ele pode ser definido quantas vezes quiser, mas ele só se lembrará do local mais recente para o qual ele foi definido.

items.consum.spells.curseinfusion.name=infusão de maldição
items.consum.spells.curseinfusion.inv_title=Amaldiçoar um item
items.consum.spells.curseinfusion.desc=Este feitiço infunde um equipamento com a mesma magia maligna poderosa presente no DM-300. O item em que é usado será imediatamente amaldiçoado e qualquer encantamento ou glifo que possa ter será sobreposto.\n\nNo caso de armas, armaduras e varinhas, além de ser amaldiçoado, o item será aprimorado. Aprimoramentos por infusão de maldição não se acumulam e serão perdidos se o item se tornar não-amaldiçoado.\n\nMúltiplas infusões de maldição também podem ser usadas para alterar a maldição de uma arma ou armadura.

items.consum.spells.spell.ac_cast=LANÇAR
items.consum.spells.spell.no_magic=Você não pode lançar feitiços enquanto está imune à magia.
items.consum.spells.spell.discover_hint=Você pode fabricar este item através de alquimia.

items.consum.spells.magicalinfusion.name=infusão mágica
items.consum.spells.magicalinfusion.inv_title=Infundir um item
items.consum.spells.magicalinfusion.infuse=Seu item é infundido com energia arcana!
items.consum.spells.magicalinfusion.desc=Este feitiço possui o mesmo poder mágico de um pergaminho de aprimoramento, mas em uma forma mais estável.\n\nAlém de aprimorar um item normalmente, nunca apagará um encantamento, glifo ou maldição.

items.consum.spells.magicalporter.name=transportador mágico
items.consum.spells.magicalporter.inv_title=Transportar um item
items.consum.spells.magicalporter.nowhere=Não há nenhum lugar para que você possa transportar um item.
items.consum.spells.magicalporter.desc=Este feitiço irá magicamente transportar qualquer item em que for lançado. Ao contrário do transmissor de um comerciante, no entanto, os itens serão transportados para a entrada do próximo andar de chefão.

items.consum.spells.phaseshift.name=mudança de fase
items.consum.spells.phaseshift.no_target=Não há nada para teleportar aqui.
items.consum.spells.phaseshift.desc=Este feitiço caótico irá teleportar qualquer personagem para um local aleatório no andar atual e atordoá-lo por um período significativo de tempo. Inimigos poderosos serão capazes de resistir ao efeito atordoante. Este feitiço pode ser direcionado a um alvo ou ao próprio usuário.

items.consum.spells.reclaimtrap.name=armazenar armadilha
items.consum.spells.reclaimtrap.no_trap=Não há armadilha lá.
items.consum.spells.reclaimtrap.desc_trap=O feitiço está atualmente pronto para ativar uma _%s._
items.consum.spells.reclaimtrap.desc=Esta magia contém resquícios da energia mecânica do DM-300. Quando lançado em uma armadilha ativa, o poder da armadilha será preso a você, permitindo que você use o feitiço de novo para expelir esse poder e ativar o efeito da armadilha em qualquer lugar que queira.\n\nNo entanto, algumas armadilhas podem não funcionar em todos os lugares, e apenas uma armadilha por vez pode ser armazenada.

items.consum.spells.recycle.name=reciclar
items.consum.spells.recycle.inv_title=Reciclar um item
items.consum.spells.recycle.recycled=Seu item foi reciclado para: %s.
items.consum.spells.recycle.desc=Este feitiço possui uma forma inferior de magia de transmutação. Embora não funcione em equipamentos, este feitiço irá transformar pergaminhos, poções, sementes, pedras rúnicas ou dardos embebidos em um item aleatório do mesmo tipo.

items.consum.spells.summonelemental.name=invocar elemental
items.consum.spells.summonelemental.ac_imbue=IMBUIR
items.consum.spells.summonelemental.imbue_prompt=Imbuir um item
items.consum.spells.summonelemental.desc=Este feitiço canaliza a energia das brasas elementais e permite que você invoque um elemental para lutar ao seu lado! Apenas um elemental pode ser invocado por vez, mas o feitiço pode ser relançado, retornando o elemental para você sem nenhum custo.
items.consum.spells.summonelemental.desc_newborn=Este feitiço não está atualmente imbuído e irá invocar um _elemental recém-invocado_ sem habilidade de ataque a distância. Você pode imbuir uma poção identificada de chama líquida, poção gélida, pergaminho de recarga ou pergaminho de transmutação para aumentar o poder do feitiço, fazendo com que futuras invocações sejam um elemental de poder total!
items.consum.spells.summonelemental.desc_fire=O feitiço está quente ao toque, irá invocar um _elemental de fogo_. Você pode imbuir um item diferente, mas o feitiço perderá seu elemento atual.
items.consum.spells.summonelemental.desc_frost=O feitiço está gelado ao toque, irá invocar um _elemental de gelo_. Você pode imbuir um item diferente, mas o feitiço perderá seu elemento atual.
items.consum.spells.summonelemental.desc_shock=O feitiço está irradiando energia estática, irá invocar um _elemental elétrico_. Você pode imbuir um item diferente, mas o feitiço perderá seu elemento atual.
items.consum.spells.summonelemental.desc_chaos=O feitiço está irradiando energia caótica, irá invocar um _elemental caótico_. Você pode imbuir um item diferente, mas o feitiço perderá seu elemento atual.

items.consum.spells.targetedspell.prompt=Escolha um alvo
items.consum.spells.targetedspell.inv_title=Infundir um item

items.consum.spells.telekineticgrab.name=pegar telecinético
items.consum.spells.telekineticgrab.cant_grab=Você não pode pegar isso.
items.consum.spells.telekineticgrab.no_target=Não há nada para pegar aqui.
items.consum.spells.telekineticgrab.desc=Este feitiço permite que o conjurador pegue remotamente todos os itens em um local ou todas as armas lançadas presas a um inimigo!\n\nNão pode ser usado para pegar itens que pertencem a outros ou para pegar recipientes como baús.

items.consum.spells.unstablespell.name=feitiço instável
items.consum.spells.unstablespell.desc=Este pequeno cristal quadrado preto possui símbolos rúnicos em constante mudança em cada uma de suas superfícies.\n\nQuando ativado, irá desencadear o efeito de um pergaminho aleatório. O efeito do pergaminho sempre será focado em combate se houver inimigos no seu campo de visão e, do contrário, sempre será focado em efeitos de não-combate.

items.consum.spells.wildenergy.name=energia selvagem
items.consum.spells.wildenergy.desc=Este feitiço contém uma porção da energia amaldiçoada que alimentava o DM-300. Quando lançado, ele recarregará suas varinhas e artefatos usados, ao mesmo tempo em que acionará um efeito de varinha amaldiçoada aleatório. No entanto, você pode escolher a direção para onde atirar esta magia amaldiçoada.


###runestones
items.consum.stones.inventorystone.ac_use=USAR

items.consum.stones.runestone$placeholder.name=pedra rúnica
items.consum.stones.runestone.discover_hint=Você pode encontrar este item aleatoriamente na masmorra ou criá-lo por meio de alquimia.

items.consum.stones.stoneofaggression.name=pedra da agressão
items.consum.stones.stoneofaggression.desc=Quando esta pedra é jogada em um aliado ou inimigo, todos os inimigos próximos preferirão atacar esse personagem por um curto período.\n\nNo entanto, chefões não podem ser afetados por esse efeito diretamente, mas ele funciona nos seus lacaios
items.consum.stones.stoneofaggression$aggression.name=Alvo
items.consum.stones.stoneofaggression$aggression.desc=A magia manipuladora está fazendo com que todos os inimigos próximos prefiram atacar este personagem.\n\nTurnos restantes: %s.

items.consum.stones.stoneofaugmentation.name=pedra de alteração
items.consum.stones.stoneofaugmentation.inv_title=Alterar um item
items.consum.stones.stoneofaugmentation.desc=Esta pedra rúnica possui magia potente que pode alterar o equipamento para melhorar uma propriedade à custa de outra.\n\nUsar em uma arma permitirá aumentar a velocidade ou o dano. Armas de arremesso também ganharão ou perderão durabilidade em proporção a sua velocidade.\n\nUsar em uma armadura permitirá que você aprimore a defesa ou a evasão.
items.consum.stones.stoneofaugmentation.discover_hint=Você pode comprar este item em uma loja ou criá-lo por meio de alquimia.
items.consum.stones.stoneofaugmentation$wndaugment.choice=Aumentar uma propriedade reduzirá a outra. Qual propriedade você gostaria de aumentar?
items.consum.stones.stoneofaugmentation$wndaugment.already=Este item já teve uma propriedade aumentada, você pode trocar o aumento ou removê-lo.
items.consum.stones.stoneofaugmentation$wndaugment.speed=+Velocidade -Dano
items.consum.stones.stoneofaugmentation$wndaugment.damage=+Dano -Velocidade
items.consum.stones.stoneofaugmentation$wndaugment.evasion=+Evasão -Defesa
items.consum.stones.stoneofaugmentation$wndaugment.defense=+Defesa -Evasão
items.consum.stones.stoneofaugmentation$wndaugment.none=Remover alteração
items.consum.stones.stoneofaugmentation$wndaugment.cancel=Deixa pra lá

items.consum.stones.stoneofblast.name=pedra de explosão
items.consum.stones.stoneofblast.desc=Esta pedra rúnica explodirá instantaneamente no local para onde for lançada. Assim como uma bomba, a explosão causará dano a qualquer coisa próxima.

items.consum.stones.stoneofblink.name=pedra de teletransporte
items.consum.stones.stoneofblink.desc=Esta pedra rúnica irá teletransportar o usuário para o local onde for lançada.

items.consum.stones.stoneofclairvoyance.name=pedra da clarividência
items.consum.stones.stoneofclairvoyance.desc=Esta pedra revelará instantaneamente todos os quadrados em uma área muito extensa em torno de onde for jogada. Seu efeito alcançará até mesmo através das paredes.

items.consum.stones.stoneofdeepsleep.name=pedra do sono profundo
items.consum.stones.stoneofdeepsleep.desc=Quando esta pedra for atirada em um inimigo, irá colocá-lo em um sono mágico profundo. Inimigos dormindo magicamente dormirão para sempre até que sejam perturbados.

items.consum.stones.stoneofdetectmagic.name=pedra de detecção mágica
items.consum.stones.stoneofdetectmagic.inv_title=Detectar um item
items.consum.stones.stoneofdetectmagic.detected_none=Você não detecta nenhuma magia afetando este item.
items.consum.stones.stoneofdetectmagic.detected_both=Você detecta magia benéfica e maléfica afetando este item!
items.consum.stones.stoneofdetectmagic.detected_good=Você detecta magia benéfica afetando este item!
items.consum.stones.stoneofdetectmagic.detected_bad=Você detecta magia maléfica afetando este item!
items.consum.stones.stoneofdetectmagic.desc=Esta pedra rúnica é capaz de detectar magia afetando um item. Usar esta pedra em um item não identificado dirá se ele é afetado por uma maldição maléfica e se ele é afetado por magia benéfica, como um encantamento ou melhorias.

items.consum.stones.stoneofdisarming.name=pedra de desarmar
items.consum.stones.stoneofdisarming.desc=Esta pedra rúnica contém magia que pode desabilitar armadilhas maliciosas escondidas em toda a masmorra. Desarmará até 9 armadilhas ao redor da área em que for lançada.

items.consum.stones.stoneofenchantment.name=pedra de encantamento
items.consum.stones.stoneofenchantment.inv_title=Encante um item
items.consum.stones.stoneofenchantment.weapon=Sua arma brilha na escuridão!
items.consum.stones.stoneofenchantment.armor=Sua armadura brilha na escuridão!
items.consum.stones.stoneofenchantment.desc=Esta pedra rúnica contém poder de encantamento. Ao contrário de um pergaminho de aprimoramento, não aumentará o poder direto de um item, em vez disso, imbuirá uma arma ou armadura com um encantamento, concedendo-lhes um novo poder.

items.consum.stones.stoneoffear.name=pedra do medo
items.consum.stones.stoneoffear.desc=Quando esta pedra for atirada em um personagem, irá envolvê-lo com um terror avassalador, fazendo-o fugir de você. Atacar um inimigo em fuga irá encurtar o efeito.

items.consum.stones.stoneofflock.name=pedra do rebanho
items.consum.stones.stoneofflock.desc=Esta pedra rúnica invoca ovelhas mágicas por um curto período de tempo em torno do local onde é lançada.

items.consum.stones.stoneofintuition.name=pedra de intuição
items.consum.stones.stoneofintuition.inv_title=Selecione um item
items.consum.stones.stoneofintuition.desc=Esta pedra rúnica contém uma versão mais fraca da magia encontrada em pergaminhos da identificação. Ao invés de identificar um item diretamente, ela irá trabalhar usando sua intuição, permitindo que você tente identificar o tipo de um pergaminho, anel ou poção através da adivinhação.
items.consum.stones.stoneofintuition.break_info=Você pode usar pedras de intuição duas vezes antes que elas quebrem. _Seu próximo uso não consumirá a pedra_.
items.consum.stones.stoneofintuition.break_warn=Você já usou a pedra de intuição anteriormente, então _seu próximo uso irá consumi-la_.
items.consum.stones.stoneofintuition$wndguess.text=Adivinhe que tipo o item não identificado é. Se você acertar corretamente, ele será identificado!
items.consum.stones.stoneofintuition$wndguess.correct=Correto. O tipo de item foi identificado!
items.consum.stones.stoneofintuition$wndguess.incorrect=Seu palpite está incorreto.
items.consum.stones.stoneofintuition$wndguess.break=Sua pedra de intuição se desintegra e vira pó...

items.consum.stones.stoneofshock.name=pedra de choque
items.consum.stones.stoneofshock.desc=Esta pedra rúnica desencadeia uma explosão de energia elétrica que atordoa brevemente todos os alvos próximos e concede carga às varinhas do lançador para cada alvo atingido.


###trinkets
items.equipment.trinkets.chaoticcenser.name=incensário caótico
items.equipment.trinkets.chaoticcenser.spew=Seu incensário está prestes a liberar: %s.
items.equipment.trinkets.chaoticcenser.desc=Depois de algum tempo no pote de alquimia, este incensário parece estar produzindo fumaça sozinho! Os gases se acumulam e serão expelidos do incensário em direção aos inimigos em intervalos semi-aleatórios. Parece capaz de produzir todos os tipos de gases, mas você receberá um momento de aviso antes de o incensário ser ativado.
items.equipment.trinkets.chaoticcenser.typical_stats_desc=Normalmente, este acessório gerará um gás nocivo próximo a um inimigo a cada _%d_ turnos. O gás apenas aparece quando inimigos estão presentes. Em níveis mais altos, os gases têm mais probabilidade de serem exóticos e poderosos.
items.equipment.trinkets.chaoticcenser.stats_desc=No nível atual, este acessório gerará um gás nocivo próximo a um inimigo a cada _%d_ turnos. O gás apenas aparece quando inimigos estão presentes. Em níveis mais altos, os gases têm mais probabilidade de serem exóticos e poderosos.

items.equipment.trinkets.crackedspyglass.name=luneta trincada
items.equipment.trinkets.crackedspyglass.desc=Este telescópio de mão seria a demonstração de um formidável e preciso trabalho artesanal, não fosse sua lente frontal trincada. A luneta parece estar ajudando você, revelando novos itens na masmorra, mas devido à sua falha, os itens revelados são bastante difíceis de enxergar!
items.equipment.trinkets.crackedspyglass.typical_stats_desc=Normalmente, este acessório tem uma _chance de %1$s%%_ de criar um item oculto extra em cada andar que não seja de chefe.
items.equipment.trinkets.crackedspyglass.stats_desc=No nível atual, este acessório tem uma _chance de %1$s%%_ de criar um item oculto extra em cada andar que não seja de chefe.
items.equipment.trinkets.crackedspyglass.stats_desc_upgraded=No nível atual, este acessório tem _100%%_ de chance de criar um item oculto extra em cada andar que não seja de chefe, e _%1$s%% de chance_ de criar um segundo item oculto extra.

items.equipment.trinkets.dimensionalsundial.name=relógio de sol dimensional
items.equipment.trinkets.dimensionalsundial.warning=Seu relógio de sol não está projetando sombra, você se sente apreensivo.
items.equipment.trinkets.dimensionalsundial.desc=Este pequeno relógio de sol de mão é de alguma forma capaz de projetar uma sombra nas profundezas da masmorra, mesmo se você não o estiver segurando na posição vertical.  Ainda mais estranho é que a posição da sombra parece não ter relação com o sol deste mundo. Quando nenhuma sombra é projetada, o relógio de sol parece atrair o perigo.
items.equipment.trinkets.dimensionalsundial.typical_stats_desc=Normalmente, este acessório reduzirá a taxa de geração de inimigos em _%1$d%%_ durante o dia na vida real (8h-20h) e aumentará a taxa de geração de inimigos em _%2$d%%_ durante a noite (20h-8h).
items.equipment.trinkets.dimensionalsundial.stats_desc=No nível atual, este acessório reduzirá a taxa de geração de inimigos em _%1$d%%_ durante o dia na vida real (8h-20h) e aumentará a taxa de geração de inimigos em _%2$d%%_ durante a noite (20h-8h).

items.equipment.trinkets.exoticcrystals.name=cristais exóticos
items.equipment.trinkets.exoticcrystals.desc=Estes pequenos cristais rosa têm o mesmo formato dos cristais de energia alquímica. Embora eles não possam ser usados diretamente para obter energia, eles parecem estar influenciando de alguma forma as poções e pergaminhos que você encontra.
items.equipment.trinkets.exoticcrystals.typical_stats_desc=Normalmente, este acessório substituirá _%s%%_ das poções ou dos pergaminhos dropados por seus equivalentes exóticos. Este efeito não afeta poções de força, pergaminhos de aprimoramento ou itens que são gerados para ajudar a resolver salas puzzles.
items.equipment.trinkets.exoticcrystals.stats_desc=No nível atual, este acessório substituirá _%s%%_ das poções ou dos pergaminhos dropados por seus equivalentes exóticos. Este efeito não afeta poções de força, pergaminhos de aprimoramento ou itens que são gerados para ajudar a resolver salas puzzles.

items.equipment.trinkets.eyeofnewt.name=Olho de salamandra
items.equipment.trinkets.eyeofnewt.desc=Este olho de salamandra dourado e preto é um ingrediente comum, agora transformado em um acessório. O olho parece estar reduzindo a sua visão em troca de permitir que você veja as coisas de outras maneiras.
items.equipment.trinkets.eyeofnewt.typical_stats_desc=Normalmente, este acessório reduzirá seu alcance de visão em _%1$s%%_, mas também lhe concederá visão mental de inimigos dentro de _%2$d_ quadrados.
items.equipment.trinkets.eyeofnewt.stats_desc=No nível atual, este acessório reduzirá seu alcance de visão em _%1$s%%_, mas também lhe concederá visão mental de inimigos dentro de _%2$d_ quadrados.

items.equipment.trinkets.ferrettuft.name=tufo de furão
items.equipment.trinkets.ferrettuft.desc=Um tufo de pelo branco e sedoso de furão, preso por uma fita verde-limão amarrada em um laço. Os furões são conhecidos por sua agilidade, travessura e falta de integridade. Parte desse poder parece irradiar do acessório, aumentando a capacidade de evasão de qualquer coisa por perto.
items.equipment.trinkets.ferrettuft.typical_stats_desc=Normalmente, este acessório aumentará a evasão de todos os personagens em _%1$s%%_.
items.equipment.trinkets.ferrettuft.stats_desc=No seu nível atual, este acessório aumentará a evasão de todos os personagens em _%1$s%%_.

items.equipment.trinkets.mimictooth.name=dente de mímico
items.equipment.trinkets.mimictooth.desc=Este grande dente afiado deve ter sido arrancado de um mímico muito infeliz. Parece estar influenciando os mímicos da masmorra, tornando-os mais frequentes e perigosos.
items.equipment.trinkets.mimictooth.typical_stats_desc=Normalmente, este acessório tornará todos os tipos de mímicos _%1$sx_ mais comuns e muito mais difíceis de detectar, mas também aumentará a quantidade de itens que eles dropam. Cada andar de masmorra também terá uma chance de _%2$s%%_ conter um mímico de ébano furtivo extra.
items.equipment.trinkets.mimictooth.stats_desc=No nível atual, este acessório tornará todos os tipos de mímicos _%1$sx_ mais comuns e muito mais difíceis de detectar, mas também aumentará a quantidade de itens que eles dropam. Cada andar de masmorra também terá uma chance de _%2$s%%_ de conter um mímico de ébano furtivo extra.

items.equipment.trinkets.mossyclump.name=moita de musgo
items.equipment.trinkets.mossyclump.desc=Este aglomerado de musgo úmido parece reter sua umidade, não importa o quão forte você o aperte. Parece estar magicamente ligado à própria masmorra, tornando mais provável o aparecimento de grama e água.
items.equipment.trinkets.mossyclump.typical_stats_desc=Normalmente, este acessório fará com que _%d%%_ dos andares comuns fiquem cheios de água ou grama.\n\nEste acessório custa uma quantidade grande de energia para aprimorar.
items.equipment.trinkets.mossyclump.stats_desc=No nível atual, este acessório fará com que _%d%%_ dos andares comuns fiquem cheios de água ou grama.\n\nEste acessório custa uma quantidade grande de energia para aprimorar.

items.equipment.trinkets.parchmentscrap.name=pedaço de papiro
items.equipment.trinkets.parchmentscrap.desc=Este pequeno pedaço de papiro parece ter saído de um pergaminho.  Ele manteve um pouco de sua magia e parece estar influenciando as armas e armaduras encontradas na masmorra.
items.equipment.trinkets.parchmentscrap.typical_stats_desc=Normalmente, este acessório tornará encantamentos e glifos _%dx_ mais comuns e maldições em armas e armaduras _%sx_ mais comuns. Maldições em varinhas, anéis ou artefatos não são afetados.\n\nEste acessório custa uma quantidade grande de energia para aprimorar.
items.equipment.trinkets.parchmentscrap.stats_desc=No nível atual, este acessório tornará encantamentos e glifos _%dx_ mais comuns, e maldições em armas e armaduras _%sx_ mais comuns. Maldições em varinhas, anéis ou artefatos não são afetados.\n\nEste acessório custa uma quantidade grande de energia para aprimorar.

items.equipment.trinkets.petrifiedseed.name=semente petrificada
items.equipment.trinkets.petrifiedseed.desc=Esta semente foi fossilizada, seja por processos geológicos lentos ou seja por magia. A semente parece estar influenciando magicamente a flora da masmorra, ocasionalmente substituindo sementes de plantas por pedras rúnicas.
items.equipment.trinkets.petrifiedseed.typical_stats_desc=Normalmente, este acessório fará com que a grama pisoteada drope runas em vez de sementes _%1$s%%_ das vezes, e também fará com que a grama alta drope itens com _%2$s%%_ mais frequência.
items.equipment.trinkets.petrifiedseed.stats_desc=No nível atual, este acessório fará com que a grama pisoteada drope runas em vez de sementes _%1$s%%_ das vezes, e também fará com que a grama alta drope itens com _%2$s%%_ mais frequência.

items.equipment.trinkets.ratskull.name=crânio de rato
items.equipment.trinkets.ratskull.desc=Este acessório macabro não é muito maior que o crânio de um rato normal, o que é de alguma forma uma raridade nesta masmorra. A influência mágica da caveira parece atrair os habitantes mais raros da masmorra, fazendo-os aparecer com muito mais frequência.
items.equipment.trinkets.ratskull.typical_stats_desc=Normalmente, este acessório fará com que inimigos exóticos raros tenham _%dx_ mais probabilidade de aparecer. No entanto, o crânio tem apenas metade da eficácia em atrair mímicos de cristal e estátuas encouraçadas.
items.equipment.trinkets.ratskull.stats_desc=No nível atual, este acessório fará com que inimigos exóticos raros tenham _%dx_ mais probabilidade de aparecer. No entanto, o crânio tem apenas metade da eficácia em atrair mímicos de cristal e estátuas encouraçadas.

items.equipment.trinkets.saltcube.name=cubo de sal
items.equipment.trinkets.saltcube.desc=Este grande cristal de sal foi cortado em um formato de cubo quase perfeito, e de alguma forma conseguiu drenar metade da água do pote de alquimia em vez de dissolver. Parece estar magicamente desidratando e preservando a comida que você come, estendendo a saciedade que você obtém, mas também diminuindo sua regeneração de vida quando não está morrendo de fome.
items.equipment.trinkets.saltcube.typical_stats_desc=Normalmente, este acessório aumentará o tempo até que fique com fome em _%1$s%%_, mas também reduzirá sua taxa de regeneração de vida em _%2$s%%_, a não ser que o andar esteja trancado.
items.equipment.trinkets.saltcube.stats_desc=No nível atual, este acessório aumentará o tempo até que fique com fome em _%1$s%%_, mas também reduzirá sua taxa de regeneração de vida em _%2$s%%_, a não ser que o andar esteja trancado.

items.equipment.trinkets.shardofoblivion.name=fragmento do esquecimento
items.equipment.trinkets.shardofoblivion.desc=Depois de cozinhar no pote de alquimia, este pequeno fragmento de metal amaldiçoado mudou para ser feito de... nada? A luz parece se curvar ao redor dele, e ele flutua estático no lugar quando você não o está segurando. O fragmento parece estar magicamente extraindo poder da sua ignorância, então provavelmente é melhor não pensar muito sobre isso.
items.equipment.trinkets.shardofoblivion.typical_stats_desc=Normalmente, este acessório aumentará a taxa que os inimigos dropam loot em 20%% para cada equipamento não identificado que você equipou ou usou recentemente, até um máximo de _%d item(ns)_. O fragmento também impedirá que você identifique equipamentos, mas pode ser usado para identificar manualmente os itens que estão prontos para isso.
items.equipment.trinkets.shardofoblivion.stats_desc=No nível atual, este acessório aumentará a taxa que os inimigos dropam loot em 20%% para cada equipamento não identificado que você equipou ou usou recentemente, até um máximo de _%d item(ns)_. O fragmento também impedirá que você identifique equipamentos, mas pode ser usado para identificar manualmente os itens que estão prontos para isso.
items.equipment.trinkets.shardofoblivion.ac_identify=IDENTIFICAR
items.equipment.trinkets.shardofoblivion.identify_prompt=Identificar um item
items.equipment.trinkets.shardofoblivion.identify_ready=Um item está pronto para ser identificado: %s. Use seu Fragmento do Esquecimento para identificá-lo.
items.equipment.trinkets.shardofoblivion.identify_ready_worn=Seus itens equipados estão prontos para serem identificados, use seu Fragmento do Esquecimento neles para identificá-los.
items.equipment.trinkets.shardofoblivion.identify_not_yet=Este item ainda não está pronto para ser identificado.
items.equipment.trinkets.shardofoblivion.identify=Você identifica o item!
items.equipment.trinkets.shardofoblivion$wandusetracker.name=Varinha não identificada utilizada
items.equipment.trinkets.shardofoblivion$wandusetracker.desc=Você usou recentemente uma varinha não identificada, que por um período de tempo conta como uma peça de equipamento não identificada usada para o fragmento do esquecimento.\n\nTurnos restantes: %s.
items.equipment.trinkets.shardofoblivion$thrownusetracker.name=Arma de arremesso não identificada usada
items.equipment.trinkets.shardofoblivion$thrownusetracker.desc=Você usou recentemente uma arma de arremesso não identificada, que conta, por um tempo, como uma peça de equipamento não identificado usada para o Fragmento do Esquecimento.\n\nTurnos restantes: %s.

items.equipment.trinkets.thirteenleafclover.name=Trevo de treze folhas
items.equipment.trinkets.thirteenleafclover.desc=De alguma forma, cozinhar no pote de alquimia fez com que este trevo crescesse um monte de folhas extras!  Não está muito claro se este acessório dá sorte ou azar, talvez torne sua sorte mais caótica?
items.equipment.trinkets.thirteenleafclover.typical_stats_desc=Normalmente, este acessório fará com que você cause dano máximo _%1$d%%_ do tempo e dano mínimo _%2$d%%_ do tempo.
items.equipment.trinkets.thirteenleafclover.stats_desc=No nível atual, este acessório fará com que você cause dano máximo _%1$d%%_ do tempo e dano mínimo _%2$d%%_ do tempo.

items.equipment.trinkets.trapmechanism.name=mecanismo de armadilha
items.equipment.trinkets.trapmechanism.desc=O mecanismo central de uma das armadilhas de queda da masmorra, cuidadosamente escavado do chão para que possa ser carregado. Parece estar magicamente ligado à própria masmorra, tornando os terrenos perigosos mais comuns, mas também aumentando a sua afinidade com eles.
items.equipment.trinkets.trapmechanism.typical_stats_desc=Normalmente, este acessório fará com que _%1$d%%_ dos andares comuns fiquem cheios de armadilhas ou abismos. Além disso, _%2$d%%_ das armadilhas escondidas da masmorra estarão visíveis.
items.equipment.trinkets.trapmechanism.stats_desc=No nível atual, este acessório fará com que _%1$d%%_ dos andares comuns fiquem cheios de armadilhas ou abismos. Além disso, _%2$d%%_ das armadilhas escondidas da masmorra estarão visíveis.

items.equipment.trinkets.vialofblood.name=frasco de sangue
items.equipment.trinkets.vialofblood.desc=Este frasco fino contém o sangue de algum habitante da masmorra, ele se move lentamente conforme você gira o frasco. Parece estar magicamente aumentando efeitos de cura mais fortes, mas também os retardando.
items.equipment.trinkets.vialofblood.typical_stats_desc=Normalmente, este acessório aumentará a vida geral que você ganha ao beber poções de cura, odres de água ou de poços de saúde em _%1$s%%_. No entanto, esses efeitos de cura também ocorrerão mais lentamente, regenerando um máximo de _%2$s_ PV por turno (aumentando de acordo com o nível do herói).
items.equipment.trinkets.vialofblood.stats_desc=No nível atual, este acessório aumentará a saúde geral que você ganha ao beber poções de cura, odres de água ou poços de saúde em _%1$s%%_. No entanto, esses efeitos de cura também ocorrerão mais lentamente, regenerando um máximo de _%2$s_ PV por turno (a quantidade aumenta com o nível do herói).

items.equipment.trinkets.wondrousresin.name=resina maravilhosa
items.equipment.trinkets.wondrousresin.desc=Esta resina azul cintilante parece ter a essência destilada da magia de uma varinha amaldiçoada. A magia do pote de alquimia parece ter estabilizado essa essência e ela agora está afetando suas varinhas.
items.equipment.trinkets.wondrousresin.typical_stats_desc=Normalmente, este acessório forçará os efeitos de varinha amaldiçoada a se tornarem neutros ou positivos _%1$s%%_ do tempo, e fará com que as varinhas não amaldiçoadas façam um disparo amaldiçoado neutro ou positivo adicional _%2$s%%_ do tempo.\n\nEste acessório custa uma quantidade grande de energia para aprimorar.
items.equipment.trinkets.wondrousresin.stats_desc=No nível atual, este acessório forçará os efeitos de varinha amaldiçoada a se tornarem neutros ou positivos _%1$s%%_ do tempo, e fará com que as varinhas não amaldiçoadas façam um disparo amaldiçoado neutro ou positivo adicional _%2$s%%_ do tempo.\n\nEste acessório custa uma quantidade grande de energia para aprimorar.

items.equipment.trinkets.trinketcatalyst.name=catalisador mágico
items.equipment.trinkets.trinketcatalyst.window_title=criar acessório
items.equipment.trinkets.trinketcatalyst.window_text=A água começa a brilhar conforme você adiciona o catalisador.  Existem alguns itens próximos que você pode imbuir com energia para transformá-los em um acessório mágico.
items.equipment.trinkets.trinketcatalyst.desc=Esta bola de pó dourado mágico brilha na escuridão da masmorra.  Este catalisador pode ser usado em um pote de alquimia com um pouco de energia alquímica para produzir um acessório único.\n\nOs acessórios fornecem vários efeitos diferentes que alteram ligeiramente a masmorra ou seus habitantes. Os acessórios podem ser aprimorados com mais energia para tornar seus efeitos mais poderosos ou descartados para renunciar totalmente ao efeito.
items.equipment.trinkets.trinketcatalyst$randomtrinket.name=Acessório aleatório
items.equipment.trinkets.trinketcatalyst$randomtrinket.desc=Um item próximo está preso dentro de uma bolsa que você não consegue abrir.\n\nO processo de alquimia dissolverá a bolsa, mas você não saberá qual acessório receberá até fazê-lo!

items.equipment.trinkets.trinket.discover_hint=Este item tem a chance de ser uma opção sempre que você criar um acessório por meio de alquimia.
items.equipment.trinkets.trinket$placeholder.name=acessório

###wands
items.equipment.wands.cursedwand.ondeath=Você causou sua própria morte com %s.
items.equipment.wands.cursedwand.nothing=Nada acontece.
items.equipment.wands.cursedwand.mass_invuln=Uma luz brilhante irrompe de sua varinha!
items.equipment.wands.cursedwand.petrify=Subitamente, você congela no lugar!
items.equipment.wands.cursedwand.grass=Grama cresce descontroladamente ao seu redor!
items.equipment.wands.cursedwand.fire=Você sente cheiro de queimado...
items.equipment.wands.cursedwand.transmogrify_wand=Sua varinha foi metamorfoseada para um item diferente!
items.equipment.wands.cursedwand.transmogrify_other=Seu item metamorfoseia em algo diferente!
items.equipment.wands.cursedwand.disguise=Sua aparência muda diante de seus olhos!
items.equipment.wands.cursedwand.supernova=Uma esfera de energia incandescente começa a crescer. Talvez você queira correr!
items.equipment.wands.cursedwand.supernova_positive=Uma esfera de energia incandescente começa a crescer, mas de alguma forma parece segura.
items.equipment.wands.cursedwand.sinkhole=O chão começa a ceder em torno de você!
items.equipment.wands.cursedwand.sinkhole_positive=O chão começa a ceder, mas parece sólido o suficiente embaixo de você.
items.equipment.wands.cursedwand.gravity=A gravidade repentinamente começa a atuar em direções aleatórias!
items.equipment.wands.cursedwand.gravity_positive=A gravidade de repente começa a atuar em direções aleatórias, mas não parece afetar você.
items.equipment.wands.cursedwand.gravity_end=O caos gravitacional termina.

items.equipment.wands.damagewand.upgrade_stat_name_1=Dano mágico

items.equipment.wands.wand.ac_zap=ATIRAR
items.equipment.wands.wand.fizzles=Sua varinha chiou; ela não deve ter cargas suficiente.
items.equipment.wands.wand.no_magic=Sua varinha chiou; você não pode usar varinhas enquanto está imune a magia.
items.equipment.wands.wand.self_target=Você não consegue mirar em si mesmo!
items.equipment.wands.wand.identify=Agora você está familiarizado o suficiente com sua varinha para identificá-la.
items.equipment.wands.wand.resin_one=Esta varinha ganhou _1 nível_ através da resina arcana.
items.equipment.wands.wand.resin_many=Esta varinha ganhou _%d níveis_ através da resina arcana.
items.equipment.wands.wand.cursed=Esta varinha está amaldiçoada, fazendo com que sua magia seja caótica e aleatória.
items.equipment.wands.wand.not_cursed=Esta varinha está livre de magia malévola.
items.equipment.wands.wand.curse_discover=Este item %s está amaldiçoado!
items.equipment.wands.wand.prompt=Escolha uma direção para atirar
items.equipment.wands.wand$placeholder.name=varinha

items.equipment.wands.wandofblastwave.name=varinha da onda de choque
items.equipment.wands.wandofblastwave.staff_name=cajado da onda de choque
items.equipment.wands.wandofblastwave.ondeath=Você se matou com sua própria Varinha da Onda de Choque...
items.equipment.wands.wandofblastwave.knockback_ondeath=A colisão matou você...
items.equipment.wands.wandofblastwave.desc=Esta varinha é feita com um tipo de pedra de mármore, com uma borda dourada e uma gema negra na ponta. Ela pesa na sua mão.
items.equipment.wands.wandofblastwave.typical_stats_desc=Esta varinha atira um raio que detona violentamente ao chegar ao destino. A força desta explosão normalmente inflige _%1$d-%2$d de dano_ e é poderosa o suficiente para lançar a maioria dos inimigos voando.
items.equipment.wands.wandofblastwave.stats_desc=Esta varinha atira um raio que detona violentamente ao chegar ao destino. A força desta explosão inflige _%1$d-%2$d de dano_ e é poderosa o suficiente para mandar a maioria dos inimigos voando para trás.
items.equipment.wands.wandofblastwave.upgrade_stat_name_2=Empurrão
items.equipment.wands.wandofblastwave.bmage_desc=Quando _o Mago de Batalha_ atinge um inimigo paralisado com um cajado de onda de choque, ele consome a paralisia para causar uma explosão de dano mágico adicional. Tem um curto tempo de recarga por inimigo.
items.equipment.wands.wandofblastwave.eleblast_desc=Uma explosão elementar com o cajado de onda de choque causa 67% de dano e arremessa todos os inimigos para fora da área de explosão.

items.equipment.wands.wandofcorrosion.name=varinha da corrosão
items.equipment.wands.wandofcorrosion.staff_name=cajado de corrosão
items.equipment.wands.wandofcorrosion.desc=Esta varinha tem um corpo cinzento que se abre para revelar uma gema laranja brilhante.
items.equipment.wands.wandofcorrosion.stats_desc=Esta varinha dispara uma rajada que explode em uma nuvem de gás altamente corrosivo no local escolhido. Qualquer coisa dentro desta nuvem sofrerá dano crescente ao longo do tempo, começando em _%d de dano_
items.equipment.wands.wandofcorrosion.upgrade_stat_name_1=Dano de corrosão
items.equipment.wands.wandofcorrosion.upgrade_stat_name_2=Volume de gás
items.equipment.wands.wandofcorrosion.bmage_desc=Quando _o Mago de Batalha_ atinge um inimigo com um cajado da corrosão, o inimigo tem chance de ser encoberto com muco corrosivo.
items.equipment.wands.wandofcorrosion.eleblast_desc=Uma explosão elementar com um cajado da corrosão afeta os inimigos com 4 turnos de corrosão, iniciando em 6 de dano.

items.equipment.wands.wandofcorruption.name=varinha da corrupção
items.equipment.wands.wandofcorruption.staff_name=cajado da corrupção
items.equipment.wands.wandofcorruption.already_corrupted=O personagem não pode ser mais influenciado.
items.equipment.wands.wandofcorruption.desc=Esta varinha irradia energia caótica escura, se isso já não estava óbvio ao olhar pela pequena caveira decorativa em sua ponta.
items.equipment.wands.wandofcorruption.stats_desc=Esta varinha lançará uma rajada de energia corruptora capaz de enfraquecer os inimigos e, eventualmente, submetê-los a sua vontade. Os inimigos são capazes de resistir à corrupção, mas os inimigos feridos são muito mais fáceis de corromper do que os saudáveis.
items.equipment.wands.wandofcorruption.upgrade_stat_name_1=Poder corruptor
items.equipment.wands.wandofcorruption.upgrade_stat_name_2=Duração do debuff
items.equipment.wands.wandofcorruption.bmage_desc=Quando _o Mago de Batalha_ atinge um inimigo com um cajado da corrupção, o inimigo tem chance de entrar em estado de cólera.
items.equipment.wands.wandofcorruption.eleblast_desc=Uma explosão elementar com o cajado de corrupção afeta os inimigos com 5 turnos de cólera.

items.equipment.wands.wandofdisintegration.name=varinha de desintegração
items.equipment.wands.wandofdisintegration.staff_name=cajado da desintegração
items.equipment.wands.wandofdisintegration.desc=Esta varinha é feita de um pedaço maciço e liso de obsidiana, com uma luz roxa escura subindo pela lateral, terminando na ponta. Ela brilha com energia destrutiva, aguardando para ser disparada.
items.equipment.wands.wandofdisintegration.stats_desc=Esta varinha atira um raio que atravessa qualquer obstáculo, e irá mais longe cada vez que for aprimorada. O raio inflige _%1$d-%2$d  de dano,_ e também infligirá dano extra para cada inimigo e parede que penetrar.
items.equipment.wands.wandofdisintegration.upgrade_stat_name_2=Alcance máx
items.equipment.wands.wandofdisintegration.bmage_desc=Quando empunhado pelo _Mago de Batalha_, um cajado da desintegração tem distância de ataque aumentada, como se tivesse o encantamento projetante.
items.equipment.wands.wandofdisintegration.eleblast_desc=Uma explosão elementar com o cajado de desintegração causa 100% de dano e atravessa paredes.

items.equipment.wands.wandoffireblast.name=varinha da rajada de fogo
items.equipment.wands.wandoffireblast.staff_name=cajado da rajada de fogo
items.equipment.wands.wandoffireblast.desc=Esta varinha é feita de madeira vermelha envernizada com uma folha dourada usada deliberadamente para torná-la mais pomposa. Ela crepita e assovia na ponta, pronta para liberar sua poderosa magia.
items.equipment.wands.wandoffireblast.stats_desc=Esta varinha produz uma labareda em formato de cone. Seu próximo ataque irá consumir _%1$d de sua carga_ e irá causar _%2$d-%3$d de dano._ Quanto mais cargas a varinha usar, maior e mais forte será o efeito.
items.equipment.wands.wandoffireblast.upgrade_stat_name_1=Dano de 1 carga
items.equipment.wands.wandoffireblast.upgrade_stat_name_2=Dano de 2 cargas
items.equipment.wands.wandoffireblast.upgrade_stat_name_3=Dano de 3 cargas
items.equipment.wands.wandoffireblast.bmage_desc=Quando o _Mago de Batalha_ atinge um inimigo com um cajado de rajada de fogo, há uma chance dele produzir uma explosão que causa dano aos inimigos e consome todo o fogo nas proximidades! Essa chance aumenta quanto mais fogo estiver adjacente ao inimigo.
items.equipment.wands.wandoffireblast.eleblast_desc=Uma explosão elementar com o cajado de rajada de fogo causa 100% de dano, arromba portas e ateia fogo em inimigos e terrenos.

items.equipment.wands.wandoffrost.name=varinha da geada
items.equipment.wands.wandoffrost.staff_name=cajado da geada
items.equipment.wands.wandoffrost.desc=Esta varinha parece ser feita de algum tipo de gelo mágico. Seu brilho se intensifica em direção a sua ponta arredondada. Ela passa uma sensação muito fria quando empunhada, mas de algum jeito sua mão permanece quente.
items.equipment.wands.wandoffrost.stats_desc=Esta varinha atira rajadas de energia gelada em direção aos seus inimigos, causando _%1$d-%2$d de dano_ e os resfriando. Esse efeito é mais forte na água. Inimigos que já estão gelados ou congelados levam menos dano desta varinha.
items.equipment.wands.wandoffrost.upgrade_stat_name_2=Duração de resfriamento
items.equipment.wands.wandoffrost.bmage_desc=Quando _o Mago de Batalha_ atinge um inimigo gelado com um cajado da geada, ele tem uma chance de instantaneamente congelar. Essa chance é maior quanto mais gelado o inimigo estiver.
items.equipment.wands.wandoffrost.eleblast_desc=Uma explosão elementar com o cajado da geada causa 100% de dano, congela inimigos, e apaga incêndios.

items.equipment.wands.wandoflightning.name=varinha do relâmpago
items.equipment.wands.wandoflightning.staff_name=cajado do relâmpago
items.equipment.wands.wandoflightning.ondeath=Você se matou com sua própria Varinha do Relâmpago...
items.equipment.wands.wandoflightning.desc=Esta varinha é feita de metal sólido, tornando-a surpreendentemente pesada. Duas alças se curvam uma em direção a outra na ponta, e eletricidade arqueia entre elas.
items.equipment.wands.wandoflightning.stats_desc=Esta varinha lança arcos de relâmpago poderosos na direção que é disparada, infligindo _%1$d-%2$d de dano._ Esta eletricidade pode pular para outros inimigos próximos e se espalha mais facilmente na água. Você pode ser ferido pela magia desta varinha, mas seus aliados não.
items.equipment.wands.wandoflightning.bmage_desc=Quando _o Mago de Batalha_ atinge um inimigo com um cajado de relâmpago, ele tem a chance de se carregar eletricamente por 10 turnos. Enquanto estiver carregado, o Mago de Batalha é imune a danos elétricos e os arcos de eletricidade irão ainda mais longe.
items.equipment.wands.wandoflightning.eleblast_desc=Uma explosão elementar com o cajado de relâmpago causa 100% de dano, atordoa inimigos por 5 turnos e deixa a água eletrificada.
items.equipment.wands.wandoflightning$lightningcharge.name=Eletricamente carregado
items.equipment.wands.wandoflightning$lightningcharge.desc=O Mago de Batalha está atualmente carregado de energia, o que lhe concede imunidade ao seu cajado de relâmpagos e aumenta o alcance do arco de eletricidade.\n\nTurnos Restantes: %s.

items.equipment.wands.wandoflivingearth.name=varinha de terra viva
items.equipment.wands.wandoflivingearth.staff_name=cajado de terra viva
items.equipment.wands.wandoflivingearth.desc=Esta varinha é feita de uma rocha curiosa, com faixas de energia amarela brilhante. As rochas parecem se mover levemente quando você segura a varinha, como se pudessem sentir sua mão.
items.equipment.wands.wandoflivingearth.stats_desc=Esta varinha lança raios de rocha mágica nos inimigos, causando _%1$d-%2$d de dano._ As rochas se formarão novamente ao redor do usuário, concedendo-lhe armadura em proporção ao dano causado. Se armadura suficiente for construída, ela se transformará em um guardião de rocha na próxima vez que for usada.
items.equipment.wands.wandoflivingearth.upgrade_stat_name_2=PV Máx. do Guardião
items.equipment.wands.wandoflivingearth.upgrade_stat_name_3=Bloqueio do guardião
items.equipment.wands.wandoflivingearth.bmage_desc=Quando _o Mago de Batalha_ atinge um inimigo com um cajado da terra viva, parte do dano é retornado como armadura de pedra.
items.equipment.wands.wandoflivingearth.eleblast_desc=Uma explosão elementar com o cajado de terra viva causa 50% de dano, e cura o guardião de terra para cada inimigo atingido.
items.equipment.wands.wandoflivingearth$rockarmor.name=armadura de pedra
items.equipment.wands.wandoflivingearth$rockarmor.desc=Pedras mágicas estão envolvendo seu corpo, quando você for atacado elas irão tentar defender você e irão reduzir o dano causado a você em 50%%. No entanto, cada dano bloqueado raspa um pouco da pedra.\n\nArmadura restante: %1$d.\n\nSe uma quantidade suficiente de rochas forem construídas em volta de você, o próximo tiro da sua varinha da terra viva irá fazer com que as rochas se formem em um guardião que irá lutar junto a você.\n\nArmadura necessária para o Guardião: %2$d.
items.equipment.wands.wandoflivingearth$rockarmor.desc_many=O guardião de terra também está se beneficiando do Poder de Muitos. Turnos restantes: %d.
items.equipment.wands.wandoflivingearth$earthguardian.name=guardião de terra
items.equipment.wands.wandoflivingearth$earthguardian.desc=As pedras da sua varinha de terra viva se transformaram em um guardião protetor de terra! Este protetor rochoso atacará inimigos próximos, o que os forçará a atacar o guardião em vez de você. Quando todas as ameaças próximas desaparecerem, o guardião se reformará ao seu redor e retornará quando você usar sua varinha da próxima vez.
items.equipment.wands.wandoflivingearth$earthguardian.wand_info=O poder defensivo do guardião está vinculado ao nível da sua varinha. Atualmente, ele bloqueia _%1$d-%2$d de dano._
items.equipment.wands.wandoflivingearth$earthguardian.discover_hint=Você pode encontrar este personagem com uma varinha específica.

items.equipment.wands.wandofmagicmissile.name=varinha de míssil mágico
items.equipment.wands.wandofmagicmissile.staff_name=cajado do míssil mágico
items.equipment.wands.wandofmagicmissile.desc=Esta varinha bastante simples lança mísseis de pura energia mágica. Enquanto a varinha em si não possui nenhum efeito especial, ela tem mais cargas disponíveis e pode, por um curto período de tempo, empoderar outras varinhas quando aprimorada.
items.equipment.wands.wandofmagicmissile.stats_desc=Cada raio desta varinha causa de _%1$d-%2$d danos,_ e se for aprimorada, dará um breve poder as outras varinhas.
items.equipment.wands.wandofmagicmissile.bmage_desc=Quando _o Mago de Batalha_ atinge um inimigo com o cajado de míssil mágico, todas as suas varinhas irão ganhar cargas além do seu cajado.
items.equipment.wands.wandofmagicmissile.eleblast_desc=Uma explosão elementar com o cajado de míssil mágico causa 50% de dano e concede 15 turnos de recarga.
items.equipment.wands.wandofmagicmissile.discover_hint=Um dos heróis inicia com este item.
items.equipment.wands.wandofmagicmissile$magiccharge.name=carga mágica
items.equipment.wands.wandofmagicmissile$magiccharge.desc=Sua varinha de míssil mágico alimentou suas varinhas com poder, aumentando o nível efetivo do próximo disparo que elas fizerem.\n\nSuas varinhas são impulsionadas para: +%d.\n\nTurnos de carga mágica restantes: %s.

items.equipment.wands.wandofprismaticlight.name=varinha de luz prismática
items.equipment.wands.wandofprismaticlight.staff_name=cajado da luz prismática
items.equipment.wands.wandofprismaticlight.desc=Esta varinha é feita de um pedaço maciço de cristal translúcido, como um grande pedaço de vidro polido. Pequenas fagulhas de luzes coloridas dançam em volta da ponta da varinha, ansiando para irromperem.
items.equipment.wands.wandofprismaticlight.stats_desc=Esta varinha dispara feixes de luz que cortam através da escuridão da masmorra, revelando áreas escondidas e armadilhas. O feixe pode cegar inimigos e infligir _%1$d-%2$d de dano._ Inimigos demoníacos e mortos-vivos irão queimar devido a luz, levando dano extra.
items.equipment.wands.wandofprismaticlight.upgrade_stat_name_2=Chance de cegar
items.equipment.wands.wandofprismaticlight.upgrade_stat_name_3=Duração de luz
items.equipment.wands.wandofprismaticlight.bmage_desc=Quando _o Mago de Batalha_ atinge um inimigo com um cajado da luz prismática, ele será aleijado por uma duração que aumenta de acordo com o nível do cajado.
items.equipment.wands.wandofprismaticlight.eleblast_desc=Um disparo elementar com o cajado de luz prismática causa 67% de dano, revela todo o terreno por onde o disparo passa e cega inimigos por 5 turnos.

items.equipment.wands.wandofregrowth.name=varinha da maturação
items.equipment.wands.wandofregrowth.staff_name=cajado da maturação
items.equipment.wands.wandofregrowth.desc=Esta varinha é feita de uma haste fina de madeira habilmente esculpida. De alguma forma, ainda está viva e vibrante, reluz um verde vivo como o núcleo de uma árvore jovem. "Quando a vida cessa, uma nova vida sempre começa a crescer... O ciclo eterno sempre permanece!"
items.equipment.wands.wandofregrowth.stats_desc=Quando usada, esta varinha irá disparar energia mágica de crescimento em forma de cone, fazendo com que a grama, raízes e plantas raras ganhem vida. Seu próximo disparo irá consumir _%1$d cargas_. Quanto mais cargas a varinha consumir, uma maior área será coberta e mais poderoso será o efeito.
items.equipment.wands.wandofregrowth.degradation=Após _%d cargas_ esta varinha irá começar a falhar em produzir plantas e gramas frescas. Este limite pode ser aumentado subindo de nível ou aprimorando a varinha.
items.equipment.wands.wandofregrowth.upgrade_stat_name_1=Grama por carga
items.equipment.wands.wandofregrowth.upgrade_stat_name_2=Limite de grama total
items.equipment.wands.wandofregrowth.bmage_desc=Quando _o Mago de Batalha_ atinge o inimigo com um cajado da maturação, e também estando em cima da grama, ele ganha cura herbácea em proporção ao dano dado.
items.equipment.wands.wandofregrowth.eleblast_desc=Uma explosão elementar com o cajado da maturação enraíza inimigos e cresce grama aleatoriamente na área da explosão.
items.equipment.wands.wandofregrowth$dewcatcher.name=Orvalheira
items.equipment.wands.wandofregrowth$dewcatcher.desc=Orvalheiras são plantas maravilhosas que se enchem de orvalho mágico. Elas tentam se camuflar como grama para não chamar atenção, mas suas protuberâncias de orvalho coletado as entregam.
items.equipment.wands.wandofregrowth$dewcatcher.discover_hint=Você pode encontrar esta planta com uma varinha específica.
items.equipment.wands.wandofregrowth$seedpod.name=Vagem de Sementes
items.equipment.wands.wandofregrowth$seedpod.desc=As vagens de sementes são plantas mágicas que produzem sementes de outros tipos de plantas, ao invés de sementes próprias. Elas conseguem de alguma forma se espalhar apesar de não possuírem sementes próprias.
items.equipment.wands.wandofregrowth$seedpod.discover_hint=Você pode encontrar esta planta com uma varinha específica.
items.equipment.wands.wandofregrowth$lotus.name=Lótus Dourado
items.equipment.wands.wandofregrowth$lotus.desc=A lótus dourada é uma planta mística que só pode ser conjurada por uma poderosa varinha da maturação. Sua aura melhora todas as plantas e os efeitos delas, mas queima sua energia e morre após um curto período de tempo.
items.equipment.wands.wandofregrowth$lotus.wand_info=Esta lótus foi produzida por uma varinha da maturação _+%1$d_. Todas as plantas em seu efeito _desencadearão instantaneamente_ se forem plantadas sob um personagem. As plantas também terão _%2$d%%de chance_ de dropar suas sementes, e os dardos embebidos usarão _%3$d%% menos durabilidade_.
items.equipment.wands.wandofregrowth$lotus.discover_hint=Você pode encontrar esta planta com uma varinha específica, após aprimorá-la diversas vezes.

items.equipment.wands.wandoftransfusion.name=varinha de transfusão
items.equipment.wands.wandoftransfusion.staff_name=cajado da transfusão
items.equipment.wands.wandoftransfusion.ondeath=Você se matou com sua própria Varinha de Transfusão...
items.equipment.wands.wandoftransfusion.charged=O seu cajado está carregado com energia vital de seu inimigo!
items.equipment.wands.wandoftransfusion.desc=Uma varinha de formato simples. Ela se destaca por seu tom magenta e uma joia bem escura na ponta.
items.equipment.wands.wandoftransfusion.stats_desc=Quando usada em aliados ou inimigos encantados, esta varinha irá drenar _%1$d da vida do usuário_ para curar ou dar um escudo ao aliado em _%2$d de vida._ Quando usada em inimigos, esta varinha os encanta brevemente e concede _%3$d de escudo_ ao usuário. Mortos-vivos hostis irão receber _%4$d-%5$d de dano_ ao invés de serem encantados.
items.equipment.wands.wandoftransfusion.upgrade_stat_name_1=Cura a aliados
items.equipment.wands.wandoftransfusion.upgrade_stat_name_2=Auto-Blindagem
items.equipment.wands.wandoftransfusion.upgrade_stat_name_3=Dano a mortos-vivos
items.equipment.wands.wandoftransfusion.bmage_desc=Quando _o Mago de Batalha_ atinge um inimigo encantado com um cajado de transfusão, ele ganha escudo e seu próximo disparo com o cajado não irá custar vida.
items.equipment.wands.wandoftransfusion.eleblast_desc=Uma explosão elementar com o cajado de transfusão encanta inimigos, cura aliados, e causa 100% de dano em inimigos mortos-vivos.

items.equipment.wands.wandofwarding.name=varinha da proteção
items.equipment.wands.wandofwarding.staff_name=cajado da proteção
items.equipment.wands.wandofwarding.no_more_wards=A sua varinha não suporta mais guardas.
items.equipment.wands.wandofwarding.bad_location=Você não pode colocar uma guarda lá.
items.equipment.wands.wandofwarding.desc=Esta curta varinha de metal tem uma gema roxa brilhante flutuando acima da sua ponta.
items.equipment.wands.wandofwarding.stats_desc=Em vez de causar danos diretos a um inimigo, esta varinha irá invocar guardas e sentinelas estacionários. As proteções podem ser invocadas em qualquer lugar, mesmo através de paredes, se você tiver visão. Esta varinha pode suportar energia equivalente a _ %d proteções de cada vez._
items.equipment.wands.wandofwarding.upgrade_stat_name_1=Dano da guarda
items.equipment.wands.wandofwarding.upgrade_stat_name_2=Energia da guarda
items.equipment.wands.wandofwarding.bmage_desc=Quando _o Mago de Batalha_ atinge um inimigo com um cajado da proteção, todas as guardas e sentinelas ativas têm uma chance de serem curadas.
items.equipment.wands.wandofwarding.eleblast_desc=Uma explosão elementar com o cajado de proteção cura todas as guardas e sentinelas na área da explosão.
items.equipment.wands.wandofwarding$ward.desc_generic_ward=Esta guarda irá automaticamente disparar em qualquer inimigo que entre em seu alcance de visão.\n\nDisparar nesta guarda com sua varinha da proteção irá aprimorá-la.\n\nAs guardas têm um número limitado de disparos antes de se dissiparem.
items.equipment.wands.wandofwarding$ward.desc_generic_sentry=Esta sentinela tem o mesmo poder de fogo de uma guarda, mas tem vida em vez de um determinado número de cargas. Assemelha-se à gema na ponta da sua varinha de proteção.\n\nAtirar nesta sentinela com sua varinha da proteção irá aprimorá-la e curá-la.\n\nEsta sentinela gastará um pouco de vida cada vez que atingir um inimigo, mas pode ser curada usando sua varinha de proteção nela.
items.equipment.wands.wandofwarding$ward.name_1=guarda menor
items.equipment.wands.wandofwarding$ward.desc_1=Esta guarda básica irá automaticamente atacar qualquer inimigo que entre em seu alcance de visão, causando _%1$d-%2$d danos._\n\nAtirar nesta guarda com sua varinha fará com que ela seja melhorada.\n\nEsta guarda só fará um único disparo antes de se dissipar.\n\nSua varinha da proteção está usando _%3$d de energia_ para manter esta guarda.
items.equipment.wands.wandofwarding$ward.name_2=guarda
items.equipment.wands.wandofwarding$ward.desc_2=Esta guarda melhorada tem um padrão mais complexo, podendo atacar várias vezes. Cada tiro desta guarda irá causar _%1$d-%2$d de dano._\n\nAtirar nesta guarda com sua varinha fará com que ela seja melhorada.\n\nEsta guarda fará três disparos antes de se dissipar.\n\nSua varinha da proteção está usando _%3$d de energia_ para manter esta guarda.
items.equipment.wands.wandofwarding$ward.name_3=guarda superior
items.equipment.wands.wandofwarding$ward.desc_3=Esta guarda totalmente aprimorada é capaz de atacar mais vezes do que suas antecessoras. Cada disparo desta guarda irá causar _%1$d-%2$d de dano._\n\nAtirar nesta guarda com sua varinha fará com que ela seja melhorada.\n\nEsta guarda fará cinco disparos antes de se dissipar.\n\nSua varinha da proteção está usando _%3$d de energia_ para manter esta guarda.
items.equipment.wands.wandofwarding$ward.name_4=sentinela menor
items.equipment.wands.wandofwarding$ward.desc_4=Esta sentinela menor tem o mesmo poder de fogo de uma guarda superior, mas possui vida ao invés de um número definido de cargas. Ela se assemelha à gema na ponta da sua varinha de proteção. Cada disparo desta sentinela irá causar _%1$d-%2$d de dano._\n\nAtirar nesta sentinela com sua varinha de proteção irá aprimorá-la e curá-la.\n\nEsta sentinela irá gastar um pouco de vida a cada vez que atirar em um inimigo, mas pode ser curada usando sua varinha de proteção nela.\n\nSua varinha de proteção está utilizando _%3$d de energia_ para sustentar esta sentinela.
items.equipment.wands.wandofwarding$ward.name_5=sentinela
items.equipment.wands.wandofwarding$ward.desc_5=Esta sentinela melhorada é maior e mais durável do que uma sentinela menor. Cada disparo desta sentinela irá causar _%1$d-%2$d de dano._\n\nAtirar nesta sentinela com sua varinha fará com que ela seja curada e melhorada.\n\nEsta sentinela gastará um pouco de vida cada vez que fizer um disparo num inimigo, mas pode ser curada usando sua varinha.\n\nSua varinha da proteção está usando _%3$d de energia_ para manter esta sentinela.
items.equipment.wands.wandofwarding$ward.name_6=sentinela superior
items.equipment.wands.wandofwarding$ward.desc_6=Esta sentinela totalmente atualizada é significativamente mais durável do que suas antecessoras. Cada disparo desta sentinela irá causar _%1$d-%2$d de dano._\n\nAtirar nesta sentinela com sua varinha fará com que ela seja curada.\n\nEsta sentinela gastará um pouco de vida cada vez que atirar em um inimigo, mas pode ser curada usando sua varinha.\n\nSua varinha da proteção está usando _%3$d de energia_ para manter esta sentinela.
items.equipment.wands.wandofwarding$ward.discover_hint=Você pode encontrar este personagem com uma varinha específica.
items.equipment.wands.wandofwarding$ward.dismiss_title=Dispensar esta guarda?
items.equipment.wands.wandofwarding$ward.dismiss_body=Você pode dissipar esta guarda se não quiser que sua varinha a mantenha mais. Fazer isso imediatamente destruirá a guarda.\n\nDispensar esta guarda?
items.equipment.wands.wandofwarding$ward.dismiss_confirm=sim
items.equipment.wands.wandofwarding$ward.dismiss_cancel=não

###weapon curses
items.equipment.weapon.curses.annoying.name=%s irritante
items.equipment.weapon.curses.annoying.msg_1=OOH, ESTAMOS LUTANDO COM ALGO!?
items.equipment.weapon.curses.annoying.msg_2=ISSO, PEGA ELES!
items.equipment.weapon.curses.annoying.msg_3=EI, ESCUTA!
items.equipment.weapon.curses.annoying.msg_4=JÁ CHEGAMOS NO CHEFÃO?!
items.equipment.weapon.curses.annoying.msg_5=AI, NÃO ME BALANÇA TÃO FORTE!
items.equipment.weapon.curses.annoying.msg_6=MORRA, INSETO!
items.equipment.weapon.curses.annoying.msg_7=IUPIIIIIIIIIIIIII!
items.equipment.weapon.curses.annoying.msg_8=A GENTE PODE DESCANSAR!?
items.equipment.weapon.curses.annoying.msg_9=POW, HAHA!
items.equipment.weapon.curses.annoying.msg_10=ESSE FOI CERTEIRO!
items.equipment.weapon.curses.annoying.msg_11=Eu não queria ser uma arma, queria ser um machado de um lenhador.
items.equipment.weapon.curses.annoying.msg_12=Lembre-se, o excesso de confiança é um assassino lento e insidioso.
items.equipment.weapon.curses.annoying.msg_13=VOCÊ É UM COCÔ E NÓS VAMOS MATAR VOCÊ!
items.equipment.weapon.curses.annoying.desc=Armas irritantes são capazes de falar, mas são empolgadas até demais. Elas frequentemente atrairão atenção indesejada até você, mesmo que sem a intenção.
items.equipment.weapon.curses.annoying.elestrike_desc=Um ataque elementar com uma maldição irritante tem 20% de chance de encolerizar todos os inimigos no alcance por 6 turnos.

items.equipment.weapon.curses.dazzling.name=%s ofuscante
items.equipment.weapon.curses.dazzling.desc=Armas ofuscantes às vezes emitirão clarões de luz ofuscantes, cegando tudo o que pode vê-las.
items.equipment.weapon.curses.dazzling.elestrike_desc=Um ataque elementar com uma maldição ofuscante tem 50% de chance de cegar todos os inimigos no alcance por 6 turnos.

items.equipment.weapon.curses.displacing.name=%s de deslocamento
items.equipment.weapon.curses.displacing.desc=Armas de deslocamento são infundidas com magia de teletransporte caótica, possuindo a habilidade de mudar os inimigos de lugar pelo andar aleatoriamente.
items.equipment.weapon.curses.displacing.elestrike_desc=Um ataque elementar com uma maldição de deslocamento tem 50% de chance de teleportar todos os inimigos no alcance.

items.equipment.weapon.curses.explosive.name=%s de explosão
items.equipment.weapon.curses.explosive.warm=Morno...
items.equipment.weapon.curses.explosive.hot=Quente!
items.equipment.weapon.curses.explosive.desc=Armas explosivas acumulam poder constantemente e explodem, causando dano a tudo que esteja por perto.
items.equipment.weapon.curses.explosive.desc_cool=Sua arma está fria ao toque.
items.equipment.weapon.curses.explosive.desc_warm=Sua arma está acumulando energia e esquentando...
items.equipment.weapon.curses.explosive.desc_hot=Sua arma está quente! Está prestes a explodir!
items.equipment.weapon.curses.explosive.elestrike_desc=Um ataque elementar com uma maldição de explosão tem 50% de chance de causar uma explosão em um inimigo aleatório no alcance.

items.equipment.weapon.curses.friendly.name=%s amigável
items.equipment.weapon.curses.friendly.desc=Armas amigáveis são mais adequadas para pacifistas, ocasionalmente ativando magia que as fazem impossível lutar.
items.equipment.weapon.curses.friendly.elestrike_desc=Um ataque elementar com uma maldição amigável tem 50% de chance de encantar todos os inimigos no alcance por 6 turnos.

items.equipment.weapon.curses.polarized.name=%s polarizante
items.equipment.weapon.curses.polarized.desc=Uma arma polarizada é afetada pela magia que faz com que seu ataque cause 50% a mais de dano ou que não cause dano algum.
items.equipment.weapon.curses.polarized.elestrike_desc=Um ataque elementar com uma maldição polarizante tem 50% de chance de causar 24-36 de dano a todos os inimigos no alcance.

items.equipment.weapon.curses.pressurized.name=%s pressurizante
items.equipment.weapon.curses.pressurized.desc=Armas pressurizadas são capazes de disparar um jato de água poderoso, como um gêiser, que empurra tudo para longe, inclusive você.
items.equipment.weapon.curses.pressurized.elestrike_desc=Um ataque elementar com uma maldição pressurizante vai criar uma onda de água que destrói terreno e empurra todos os inimigos no alcance para longe.

items.equipment.weapon.curses.sacrificial.name=%s sacrificante
items.equipment.weapon.curses.sacrificial.desc=Armas sacrificantes exigirão sangue do usuário em troca de atacar inimigos. Quanto mais saudável o usuário for, mais sangue a maldição tomará.
items.equipment.weapon.curses.sacrificial.elestrike_desc=Um ataque elementar com uma maldição sacrificante causa sangramento de 12 PV ao herói e a todos os inimigos no alcance.

items.equipment.weapon.curses.wayward.name=%s inconstante
items.equipment.weapon.curses.wayward.desc=Armas inconstantes às vezes se tornam extremamente imprecisas. Essa magia dura por um tempo quando ativada, mas pode ser dissipada acertando um golpe com a arma inconstante.
items.equipment.weapon.curses.wayward.elestrike_desc=Um ataque elementar com uma maldição inconstante tem 50% de chance de enfeitiçar todos os inimigos no alcance por 6 turnos.
items.equipment.weapon.curses.wayward$waywardbuff.name=inconstante
items.equipment.weapon.curses.wayward$waywardbuff.desc=A magia da sua arma inconstante foi ativada, tornando-a extremamente imprecisa por um curto período de tempo. Observe que isso não afeta os ataques que são garantidos, como ataques surpresa. Atacar com sucesso com a arma inconstante eliminará esse efeito imediatamente.\n\nTurnos restantes: %s.

items.equipment.weapon.curses.wondrous.name=%s mirabolante
items.equipment.weapon.curses.wondrous.desc=Armas mirabolantes contêm a mesma magia caótica encontrada em varinhas amaldiçoadas. É impossível prever o que acontecerá quando esta maldição for ativada!
items.equipment.weapon.curses.wondrous.elestrike_desc=Um ataque elementar com uma maldição mirabolante tem a chance de aplicar um efeito de varinha amaldiçoada diferente para cada inimigo no alcance.

###enchantments
items.equipment.weapon.enchantments.blazing.name=%s flamejante
items.equipment.weapon.enchantments.blazing.desc=Este encantamento faz com que saiam chamas de uma arma, incendiando inimigos e causando dano adicional aos que já estão em chamas.
items.equipment.weapon.enchantments.blazing.elestrike_desc=Um ataque elementar com um encantamento flamejante espalha fogo em todo os espaços no alcance, dura 8 turnos.

items.equipment.weapon.enchantments.blocking.name=%s bloqueante
items.equipment.weapon.enchantments.blocking.desc=Armas bloqueantes têm a chance de protegê-lo brevemente após atacar com elas.
items.equipment.weapon.enchantments.blocking.elestrike_desc=Um ataque elementar com um encantamento bloqueante garante a Duelista 6 de escudo extra para cada inimigo no alcance.
items.equipment.weapon.enchantments.blocking$blockbuff.name=proteção
items.equipment.weapon.enchantments.blocking$blockbuff.desc=O encantamento bloqueante da sua arma concedeu a você um breve impulso ao seu poder defensivo!\n\nProteção restante: %d\n\nTurnos restantes: %s.

items.equipment.weapon.enchantments.blooming.name=%s florescente
items.equipment.weapon.enchantments.blooming.desc=Armas florescentes contêm magia que fará com que a vegetação brote sobre ou em torno daqueles atingidos por elas.
items.equipment.weapon.enchantments.blooming.elestrike_desc=Um ataque elementar com um encantamento florescente espalha grama alta em 8 espaços no alcance e enraíza todos os inimigos no alcance por 6 turnos.

items.equipment.weapon.enchantments.chilling.name=%s congelante
items.equipment.weapon.enchantments.chilling.desc=Inimigos atingidos com este encantamento são resfriados, diminuindo seus movimentos e ataques.
items.equipment.weapon.enchantments.chilling.elestrike_desc=Um ataque elementar com um encantamento congelante espalha ar frio em todos os espaços no alcance, dura 8 turnos.

items.equipment.weapon.enchantments.crystal.name=%s de cristal
items.equipment.weapon.enchantments.crystal.alert_fixed=Sua arma de cristal está totalmente reparada!
items.equipment.weapon.enchantments.crystal.alert_fixed_ghost=A arma de cristal do fantasma está totalmente reparada!
items.equipment.weapon.enchantments.crystal.alert_noflaw=Sua arma de cristal não tem mais falhas.
items.equipment.weapon.enchantments.crystal.alert_noflaw_ghost=A arma de cristal do fantasma não tem mais falhas.
items.equipment.weapon.enchantments.crystal.alert_nocrack=Sua arma de cristal não está mais rachada.
items.equipment.weapon.enchantments.crystal.alert_nocrack_ghost=A arma de cristal do fantasma não está mais rachada.
items.equipment.weapon.enchantments.crystal.alert_flawed=Sua arma de cristal ficou um pouco danificada.
items.equipment.weapon.enchantments.crystal.alert_flawed_ghost=A arma de cristal do fantasma ficou um pouco danificada.
items.equipment.weapon.enchantments.crystal.alert_cracked=Sua arma de cristal rachou, está prestes a quebrar!
items.equipment.weapon.enchantments.crystal.alert_cracked_ghost=A arma de cristal do fantasma rachou, está prestes a quebrar!
items.equipment.weapon.enchantments.crystal.alert_shattered=Sua arma de cristal se estilhaça!
items.equipment.weapon.enchantments.crystal.alert_shattered_ghost= A arma de cristal do fantasma se estilhaça!
items.equipment.weapon.enchantments.crystal.desc=Este encantamento poderoso causa dano mágico adicional e aumenta o valor da arma. No entanto, a arma encantada pode se estilhaçar se os cristais não forem reparados ou se não tiverem tempo para se autorreparar.
items.equipment.weapon.enchantments.crystal.desc_thrown=Armas de arremesso de cristal têm muito menos durabilidade, mas se recuperam lentamente com o tempo.
items.equipment.weapon.enchantments.crystal.desc_perfect=Esta arma de cristal está atualmente em perfeitas condições.
items.equipment.weapon.enchantments.crystal.desc_fine=Esta arma de cristal está atualmente em boas condições.
items.equipment.weapon.enchantments.crystal.desc_flawed=Esta arma de cristal tem falhas, mas não está prestes a quebrar.
items.equipment.weapon.enchantments.crystal.desc_cracked=Esta arma de cristal está rachando, corre o risco de quebrar permanentemente!
items.equipment.weapon.enchantments.crystal.elestrike_desc=Um ataque elementar com uma arma de cristal causa 10-20 de dano e repara a arma para cada inimigo no alcance, exceto o alvo primário.

items.equipment.weapon.enchantments.kinetic.name=%s inercial
items.equipment.weapon.enchantments.kinetic.desc=Quando um inimigo é morto por uma arma com encantamento inercial, qualquer dano em excesso é conservado na arma e será aplicado ao próximo ataque bem-sucedido.
items.equipment.weapon.enchantments.kinetic.elestrike_desc=Um ataque elementar com um encantamento inercial aplica 40% do dano conservado a cada inimigo no alcance, exceto ao alvo primário.
items.equipment.weapon.enchantments.kinetic$conserveddamage.name=dano conservado
items.equipment.weapon.enchantments.kinetic$conserveddamage.desc=Sua arma armazenou o excesso de força de um golpe fatal anterior e o aplicará como dano adicional ao seu próximo ataque. No entanto, a energia irá diminuir lentamente ao longo do tempo.\n\nDano Conservado: %d.

items.equipment.weapon.enchantments.corrupting.name= %s de corrupção
items.equipment.weapon.enchantments.corrupting.desc=Este poderoso encantamento possui a capacidade de subjugar os inimigos à sua vontade. Quando um inimigo é morto com esta arma, há uma chance de que ele seja corrompido em vez de morrer.
items.equipment.weapon.enchantments.corrupting.elestrike_desc=Um ataque elementar com um encantamento de corrupção possui 5-25% de chance (baseado no PV perdido) de corromper inimigos no alcance, exceto o alvo primário.

items.equipment.weapon.enchantments.eldritch.name=%s eldritch
items.equipment.weapon.enchantments.eldritch.desc=Armas eldritch incutem medo aos inimigos próximos que testemunham seus ataques, fazendo com que fujam do atacante.
items.equipment.weapon.enchantments.eldritch.elestrike_desc=Um ataque elementar com o encantamento eldritch aplica medo prolongado para cada inimigo no alcance, incluindo o alvo primário.

items.equipment.weapon.enchantments.elastic.name= %s de elasticidade
items.equipment.weapon.enchantments.elastic.desc=Armas elásticas têm a chance de lançar inimigos para trás por curtas distâncias.
items.equipment.weapon.enchantments.elastic.elestrike_desc=Um ataque elementar com um encantamento de elasticidade arremessa todos os inimigos no alcance 5 espaços para longe.

items.equipment.weapon.enchantments.grim.name=%s mortal
items.equipment.weapon.enchantments.grim.desc=Este poderoso encantamento possui o poder de instantaneamente executar um inimigo. O efeito é mais comum de ocorrer quanto mais fraco o inimigo estiver.
items.equipment.weapon.enchantments.grim.elestrike_desc=Um ataque elementar com um encantamento mortal possui 6-30% de chance (baseado no PV perdido) de executar todos os inimigos no alcance, exceto o alvo primário.

items.equipment.weapon.enchantments.lucky.name=%s da sorte
items.equipment.weapon.enchantments.lucky.desc=Inimigos que são mortos por uma arma da sorte têm a chance de soltar itens extras.
items.equipment.weapon.enchantments.lucky.elestrike_desc=Um ataque elementar com um encantamento da sorte tem 12,5% de chance de gerar itens sob todos os inimigos no alcance. Esse efeito é ativado apenas uma vez por inimigo.

items.equipment.weapon.enchantments.projecting.name=%s projetante
items.equipment.weapon.enchantments.projecting.desc=Com este encantamento, armas de combate corpo a corpo ganharão alcance extra. Armas de longo alcance penetrarão paredes quando miradas em alvos próximos.
items.equipment.weapon.enchantments.projecting.elestrike_desc=Um ataque elementar com um encantamento projetante aplica 30% de dano a todos os inimigo no alcance, exceto ao alvo primário.

items.equipment.weapon.enchantments.shocking.name=%s chocante
items.equipment.weapon.enchantments.shocking.desc=Arcos de eletricidade de uma arma chocante, causando dano extra a todos os inimigos próximos.
items.equipment.weapon.enchantments.shocking.elestrike_desc=Um ataque elementar com um encantamento chocante espalha eletricidade em todos os espaços no alcance, dura 8 turnos.

items.equipment.weapon.enchantments.unstable.name=%s instável
items.equipment.weapon.enchantments.unstable.desc=Este encantamento irradia energia caótica, ativando um encantamento diferente a cada golpe.
items.equipment.weapon.enchantments.unstable.elestrike_desc=Um ataque elementar com um encantamento instável aplica um efeito de encantamento aleatório a todos os inimigos no alcance, exceto ao alvo primário.

items.equipment.weapon.enchantments.vampiric.name=%s do vampirismo
items.equipment.weapon.enchantments.vampiric.desc=Este poderoso encantamento drena a força vital dos inimigos a cada golpe, canalizando-a de volta para o usuário. O efeito é mais forte quanto menor a vida atual do usuário.
items.equipment.weapon.enchantments.vampiric.elestrike_desc=Um ataque elementar com um encantamento de vampirismo cura a Duelista em 2,5 PV para cada inimigo no alcance.

items.equipment.weapon.enchantments.venomous.name=%s pestilente
items.equipment.weapon.enchantments.venomous.desc=Armas pestilentes infligem um veneno de efeito retardado, porém letal, que se torna mais severo a cada aplicação.
items.equipment.weapon.enchantments.venomous.elestrike_desc=Um ataque elementar com o encantamento pestilente aplica efeito venenoso retardado adicional para todo inimigo no alcance, exceto o alvo primário.

items.equipment.weapon.enchantments.vorpal.name=%s vorpal
items.equipment.weapon.enchantments.vorpal.desc=Armas vorpal são especialmente letais, elas têm a chance de desferir um golpe tão preciso que infligem sangramento, em vez de dano comum, a inimigos suscetíveis a essa condição.
items.equipment.weapon.enchantments.vorpal.elestrike_desc=Um ataque elementar com um encantamento vorpal aplica sangramento adicional a cada inimigo no alcance, exceto ao alvo primário.


###melee weapons
items.equipment.weapon.melee.assassinsblade.name=lâmina assassina
items.equipment.weapon.melee.assassinsblade.stats_desc=Esta arma é mais forte contra inimigos distraídos.
items.equipment.weapon.melee.assassinsblade.ability_name=furtivo
items.equipment.weapon.melee.assassinsblade.typical_ability_desc=A Duelista pode entrar em modo _furtivo_ enquanto empunha uma lâmina assassina. Esta habilidade permite que a Duelista lampeje instantaneamente até 3 espaços de distância e normalmente concede a ela _%d turnos de invisibilidade._
items.equipment.weapon.melee.assassinsblade.ability_desc=A Duelista pode entrar em modo _furtivo_ enquanto empunha uma lâmina assassina. Esta habilidade permite que a Duelista lampeje instantaneamente até 3 espaços de distância e concede a ela _%d turnos de invisibilidade._
items.equipment.weapon.melee.assassinsblade.upgrade_ability_stat_name=Duração de habilidade
items.equipment.weapon.melee.assassinsblade.desc=Uma pequena lâmina ondulada feita de obsidiana, difícil de usar apesar de ser leve, mas mortal se atingir em cheio.

items.equipment.weapon.melee.battleaxe.name=machado de batalha
items.equipment.weapon.melee.battleaxe.stats_desc=Está é uma arma precisa.
items.equipment.weapon.melee.battleaxe.ability_name=Golpe pesado
items.equipment.weapon.melee.battleaxe.typical_ability_desc=A Duelista pode realizar um _golpe pesado_ com um machado de batalha. Esse ataque concentrado normalmente causa _%1$d-%2$d de dano_ se acertar o inimigo de surpresa e atordoa por 5 turnos, reduzindo a precisão e evasão em 50%%. Golpe pesado tem acerto garantido, mas causa dano regular se o inimigo não for pego de surpresa.
items.equipment.weapon.melee.battleaxe.ability_desc=A Duelista pode realizar um _golpe pesado_ com um machado de batalha. Esse ataque concentrado causa _%1$d-%2$d de dano_ se acertar o inimigo de surpresa e atordoa por 5 turnos, reduzindo a precisão e evasão em 50%%. Golpe pesado tem acerto garantido, mas causa dano regular se o inimigo não for pego de surpresa.
items.equipment.weapon.melee.battleaxe.desc=A cabeça de aço enorme deste machado de combate confere imenso peso a cada golpe amplo.

items.equipment.weapon.melee.crossbow.name=besta
items.equipment.weapon.melee.crossbow.typical_stats_desc=Normalmente, esta arma aumenta a potência dos dardos arremessados para causar _%1$d-%2$d de dano_ quando equipada, e até mesmo concede seu encantamento a eles.
items.equipment.weapon.melee.crossbow.stats_desc=Esta arma aumenta a potência dos dardos arremessados para causar _%1$d-%2$d de dano_ quando equipada, e ainda concede seu encantamento a eles.
items.equipment.weapon.melee.crossbow.ability_name=tiro carregado
items.equipment.weapon.melee.crossbow.typical_ability_desc=A Duelista pode _carregar_ sua besta, fazendo com que seu próximo ataque regular sempre acerte e aplique um dos três efeitos: ataques corpo a corpo lançarão os inimigos para trás, dardos não embebidos normalmente causarão _+%1$d de dano_ e dardos embebidos aplicarão seus efeitos em um formato 7x7 de área e normalmente duram por _mais %2$d usos_.
items.equipment.weapon.melee.crossbow.ability_desc=A Duelista pode _carregar_ sua besta, fazendo com que seu próximo ataque regular sempre acerte e aplique um dos três efeitos: ataques corpo a corpo lançarão inimigos para trás, dardos não embebidos causarão _+%1$d de dano_ e dardos embebidos aplicarão seu efeito em uma área de 7x7 e durarão por _mais %2$d usos _.
items.equipment.weapon.melee.crossbow.desc=Uma arma bastante intrincada que atira dardos em velocidades excepcionais. Embora não tenha sido projetada para tal fim, o peso e a construção robusta desta besta a tornam também numa arma de combate corpo a corpo decente.
items.equipment.weapon.melee.crossbow.upgrade_ability_stat_name=Impulso de habilidade
items.equipment.weapon.melee.crossbow$chargedshot.name=Carregado
items.equipment.weapon.melee.crossbow$chargedshot.desc=A Duelista está concentrando poder em sua besta. O próximo ataque que ela fizer sempre acertará e aplicará um dos três efeitos:\n- Ataques corpo a corpo lançarão os inimigos a alguns espaços de distância. \n- Dardos não embebidos causarão dano adicional.\n- Dardos embebidos ganharão usos extras e aplicarão seus efeitos em uma área 7x7. Os efeitos positivos dos dardos afetarão apenas aliados e efeitos prejudiciais só afetarão inimigos. A Duelista não pode usar esta habilidade para aplicar efeitos positivos de dardos a si mesma.

items.equipment.weapon.melee.cudgel.name=maça
items.equipment.weapon.melee.cudgel.stats_desc=Esta é uma arma precisa.
items.equipment.weapon.melee.cudgel.ability_name=Golpe pesado
items.equipment.weapon.melee.cudgel.typical_ability_desc=A Duelista pode realizar um _golpe pesado_ com uma maça. Esse ataque concentrado normalmente causa _%1$d-%2$d de dano_ se acertar o inimigo de surpresa e atordoa por 5 turnos, reduzindo a precisão e evasão em 50%%. Golpe pesado tem acerto garantido, mas causa dano regular se o inimigo não for pego de surpresa.
items.equipment.weapon.melee.cudgel.ability_desc=A Duelista pode realizar um _golpe pesado_ com uma maça. Esse ataque concentrado causa _%1$d-%2$d de dano_ se acertar o inimigo de surpresa e atordoa por 5 turnos, reduzindo a precisão e evasão em 50%%. Golpe pesado tem acerto garantido, mas causa dano regular se o inimigo não for pego de surpresa.
items.equipment.weapon.melee.cudgel.desc=Uma pequena maça de bronze, feito mais como uma ferramenta de autodefesa para nobres do que como uma arma de aventura.
items.equipment.weapon.melee.cudgel.discover_hint=Um dos heróis inicia com este item.

items.equipment.weapon.melee.dagger.name=adaga
items.equipment.weapon.melee.dagger.stats_desc=Esta arma é mais forte contra inimigos distraídos.
items.equipment.weapon.melee.dagger.ability_name=furtivo
items.equipment.weapon.melee.dagger.typical_ability_desc=A Duelista pode entrar em modo _furtivo_ enquanto empunha uma adaga. Esta habilidade permite que a Duelista lampeje instantaneamente até 5 espaços de distância e normalmente concede a ela _%d turnos de invisibilidade._
items.equipment.weapon.melee.dagger.ability_desc=A Duelista pode entrar em modo _furtivo_ enquanto empunha uma adaga. Esta habilidade permite que a Duelista lampeje instantaneamente até 5 espaços de distância e concede a ela _%d turnos de invisibilidade._
items.equipment.weapon.melee.dagger.upgrade_ability_stat_name=Duração de habilidade
items.equipment.weapon.melee.dagger.desc=Uma simples adaga de ferro com punho de madeira desgastado.
items.equipment.weapon.melee.dagger.discover_hint=Um dos heróis inicia com este item.

items.equipment.weapon.melee.dirk.name=punhal
items.equipment.weapon.melee.dirk.stats_desc=Esta arma é mais forte contra inimigos distraídos.
items.equipment.weapon.melee.dirk.ability_name=furtivo
items.equipment.weapon.melee.dirk.typical_ability_desc=A Duelista pode entrar em modo _furtivo_ enquanto empunha um punhal. Esta habilidade permite que a Duelista lampeje instantaneamente até 4 espaços de distância e normalmente concede a ela _%d turnos de invisibilidade._
items.equipment.weapon.melee.dirk.ability_desc=A Duelista pode entrar em modo _furtivo_ enquanto empunha um punhal. Esta habilidade permite que a Duelista lampeje instantaneamente até 4 espaços de distância e concede a ela _%d turnos de invisibilidade._
items.equipment.weapon.melee.dirk.upgrade_ability_stat_name=Duração de habilidade
items.equipment.weapon.melee.dirk.desc=Uma adaga alongada, dá um pouco mais de aço para perfurar os inimigos.

items.equipment.weapon.melee.flail.name=mangual
items.equipment.weapon.melee.flail.stats_desc=Esta é uma arma pouco precisa. Ataques surpresas não podem ser efetuados com ela.
items.equipment.weapon.melee.flail.ability_name=Girar
items.equipment.weapon.melee.flail.spin_warn=Você não pode mais girar o mangual.
items.equipment.weapon.melee.flail.typical_ability_desc=A Duelista pode _girar_ um mangual para aumentar o seu poder por um curto período de tempo. Cada vez que o mangual for girado, normalmente causará _+%d de dano_, no seu próximo ataque regular, até um máximo de 3 vezes. Girar o mangual também garante o acerto. Apenas para começar a girar o mangual é que custará uma carga.
items.equipment.weapon.melee.flail.ability_desc=A Duelista pode _girar_ um mangual para aumentar o seu poder por um curto período de tempo. Cada vez que o mangual for girado, causará _+%d de dano_, no seu próximo ataque regular, até um máximo de 3 vezes. Girar o mangual também garante o acerto. Apenas para começar a girar o mangual é que custará uma carga.
items.equipment.weapon.melee.flail.desc=Uma esfera com espinhos pontiagudos ligada a um cabo por uma corrente. Muito difícil de manejar, mas devastadora se atingir o alvo em cheio.
items.equipment.weapon.melee.flail$spinabilitytracker.name=Girando
items.equipment.weapon.melee.flail$spinabilitytracker.desc=A Duelista está girando seu mangual, acumulando dano para seu próximo ataque regular com ele.  Cada giro leva um turno e aumenta o dano, até um máximo de três giros. O mangual também tem garantia de acertar enquanto gira.\n\nGiro atual: %1$d%%.\nTurnos restantes: %2$s.

items.equipment.weapon.melee.gauntlet.name=manopla de pedra
items.equipment.weapon.melee.gauntlet.stats_desc=Esta é uma arma muito rápida.
items.equipment.weapon.melee.gauntlet.ability_name=combinação de ataques
items.equipment.weapon.melee.gauntlet.typical_ability_desc=A Duelista pode executar uma _combinação de ataques_ com uma manopla de pedra. Este ataque tem garantia de acerto e normalmente causa _+%d de dano_ para cada vez que a Duelista tiver acertado com um ataque corpo a corpo regular ou com uma arma de arremesso. Não acertar nada em 5 turnos (15 depois de uma morte) reinicia este combo.
items.equipment.weapon.melee.gauntlet.ability_desc=A Duelista pode executar uma _combinação de ataques_ com uma manopla de pedra. Este ataque tem garantia de acerto e causa _+%d de dano_ para cada vez que a Duelista tiver acertado com um ataque corpo a corpo regular ou com uma arma de arremesso. Não acertar nada em 5 turnos (15 depois de uma morte) reinicia este combo.
items.equipment.weapon.melee.gauntlet.desc=Esta manopla maciça é feita de tecido carmesim com pedra mágica pesada em camadas no topo. O tecido aperta em torno de você, fazendo as placas de pedra grossas quase como uma segunda pele. Balançar uma arma tão pesada requer força, mas adiciona força tremenda aos seus golpes.

items.equipment.weapon.melee.glaive.name=gládio
items.equipment.weapon.melee.glaive.stats_desc=Esta arma é lenta.\nEsta arma tem alcance estendido.
items.equipment.weapon.melee.glaive.ability_name=Espetar
items.equipment.weapon.melee.glaive.typical_ability_desc=A Duelista pode usar a ponta de uma gládio para _espetar_ um inimigo que esteja dentro do alcance, mas não adjacente. Isso normalmente causa _%1$d-%2$d de dano_, empurra o inimigo para trás e garante o acerto.
items.equipment.weapon.melee.glaive.ability_desc=A Duelista pode usar a ponta de uma gládio para _espetar_ um inimigo que esteja dentro do alcance, mas não adjacente. Isso causa _%1$d-%2$d de dano_, empurra o inimigo para trás e garante o acerto.
items.equipment.weapon.melee.glaive.desc=Uma arma longa, consistindo de uma lâmina de espada ao final de um bastão.

items.equipment.weapon.melee.gloves.name=luvas cravejadas
items.equipment.weapon.melee.gloves.stats_desc=Esta é uma arma muito rápida.
items.equipment.weapon.melee.gloves.ability_name=combinação de ataques
items.equipment.weapon.melee.gloves.typical_ability_desc=A Duelista pode realizar uma _combinação de ataques_ com luvas cravejadas. Este ataque tem garantia de acerto e normalmente causa _+%d de dano_ para cada vez que a Duelista tiver acertado com um ataque corpo a corpo regular ou com uma arma de arremesso. Não acertar nada em 5  turnos (15 após uma morte) reinicia este combo.
items.equipment.weapon.melee.gloves.ability_desc=A Duelista pode realizar uma _combinação de ataques_ com luvas cravejadas. Este ataque tem garantia de acerto e causa _+%d de dano_ para cada vez que a Duelista tiver acertado com um ataque corpo a corpo regular ou com uma arma de arremesso. Não acertar nada em 5 turnos (15 após uma morte) reinicia este combo.
items.equipment.weapon.melee.gloves.desc=Estas luvas cravejadas não fornecem qualquer proteção real, mas agem como uma arma útil, mantendo as mãos livres.
items.equipment.weapon.melee.gloves.discover_hint=Um dos heróis inicia com este item.

items.equipment.weapon.melee.greataxe.name=machado grande
items.equipment.weapon.melee.greataxe.stats_desc=Esta arma é incrivelmente pesada.
items.equipment.weapon.melee.greataxe.ability_name=Retribuição
items.equipment.weapon.melee.greataxe.typical_ability_desc=A Duelista pode realizar um ataque de _retribuição_ com um machado grande se estiver com menos de 50%% de vida. Este ataque devastador tem acerto garantido e normalmente causa _%1$d-%2$d de dano_ e é instantâneo se matar o inimigo.
items.equipment.weapon.melee.greataxe.ability_desc=A Duelista pode realizar um ataque de _retribuição_ com um machado grande se estiver com menos de 50%% de vida. Este ataque devastador tem acerto garantido e causa _%1$d-%2$d  de dano_ e é instantâneo se matar o inimigo.
items.equipment.weapon.melee.greataxe.desc=Feito para ser empunhado sobre os ombros, este machado titânico é tão poderoso quanto pesado.

items.equipment.weapon.melee.greatshield.name=escudo grande
items.equipment.weapon.melee.greatshield.typical_stats_desc=Normalmente, esta arma bloqueia 0-%d de dano. Este bloqueio aumenta com aprimoramentos.
items.equipment.weapon.melee.greatshield.stats_desc=Esta arma bloqueia 0-%d de dano. Este bloqueio aumenta com aprimoramentos.
items.equipment.weapon.melee.greatshield.ability_name=defender
items.equipment.weapon.melee.greatshield.typical_ability_desc=A Duelista pode se _defender_ com um escudo grande, negando completamente todos os ataques físicos ou mágicos feitos contra ela normalmente por _%d turnos_. Depois que a Duelista bloquear um ataque, revidar ou usar magia encerrará a defesa.
items.equipment.weapon.melee.greatshield.ability_desc=A Duelista pode se _defender_ com um escudo grande, negando completamente todos os ataques físicos ou mágicos feitos contra ela por _%d turnos_. Depois que a Duelista bloquear um ataque, revidar ou usar magia encerrará a defesa.
items.equipment.weapon.melee.greatshield.upgrade_ability_stat_name=Duração de habilidade
items.equipment.weapon.melee.greatshield.desc=Parece mais uma parede portátil do que um escudo, esta gigantesca massa de metal ajuda na defesa, mas não deixa muito espaço para atacar.

items.equipment.weapon.melee.greatsword.name=Espada larga
items.equipment.weapon.melee.greatsword.ability_name=cortar
items.equipment.weapon.melee.greatsword.typical_ability_desc=A Duelista pode _cortar_ um inimigo com uma espada larga. Isso normalmente causa _%1$d-%2$d de dano_ e tem acerto garantido. Se a habilidade matar um inimigo, a ação é instantânea e a Duelista pode usar cortar novamente em 5 turnos sem custo.
items.equipment.weapon.melee.greatsword.ability_desc=A Duelista pode _cortar_ um inimigo com uma espada larga. Isso causa _%1$d-%2$d de dano_ e tem acerto garantido. Se a habilidade matar um inimigo, a ação é instantânea e a Duelista pode usar cortar novamente em 5 turnos sem custo.
items.equipment.weapon.melee.greatsword.desc=Esta lâmina imponente inflige muito dano ao usar seu peso em cada golpe.

items.equipment.weapon.melee.handaxe.name=machadinha
items.equipment.weapon.melee.handaxe.stats_desc=Esta é uma arma precisa.
items.equipment.weapon.melee.handaxe.ability_name=Golpe pesado
items.equipment.weapon.melee.handaxe.typical_ability_desc=A Duelista pode realizar um _golpe pesado_ com uma machadinha. Esse ataque concentrado normalmente causa _%1$d-%2$d de dano_ se acertar o inimigo de surpresa e atordoa por 5 turnos, reduzindo a precisão e evasão em 50%%. Golpe pesado tem acerto garantido, mas causa dano regular se o inimigo não for pego de surpresa.
items.equipment.weapon.melee.handaxe.ability_desc=A Duelista pode realizar um _golpe pesado_ com uma machadinha. Esse ataque concentrado causa _%1$d-%2$d de dano_ se acertar o inimigo de surpresa e atordoa por 5 turnos, reduzindo a precisão e evasão em 50%%. Golpe pesado tem acerto garantido, mas causa dano regular se o inimigo não for pego de surpresa.
items.equipment.weapon.melee.handaxe.desc=Um machado leve, geralmente usado para derrubar árvores. A larga lâmina também funciona bem contra inimigos.

items.equipment.weapon.melee.katana.name=katana
items.equipment.weapon.melee.katana.stats_desc=Esta arma bloqueia 0-3 de dano.
items.equipment.weapon.melee.katana.ability_name=estocada
items.equipment.weapon.melee.katana.typical_ability_desc=A Duelista pode realizar uma _estocada_ com a katana em um inimigo a 1 espaço de distância. Esse movimento a aproxima do inimigo, normalmente causa _%1$d-%2$d de dano_ e é um acerto garantido.
items.equipment.weapon.melee.katana.ability_desc=A Duelista pode realizar uma _estocada_ com a katana em um inimigo a 1 espaço de distância. Esse movimento a aproxima do inimigo, causa _%1$d-%2$d de dano_ e é um acerto garantido.
items.equipment.weapon.melee.katana.desc=Uma espada fina com uma grande proteção de metal acima do cabo.

items.equipment.weapon.melee.longsword.name=espada longa
items.equipment.weapon.melee.longsword.ability_name=cortar
items.equipment.weapon.melee.longsword.typical_ability_desc=A Duelista pode _cortar_ um inimigo com uma espada longa. Isso normalmente causa _%1$d-%2$d de dano_ e tem acerto garantido. Se a habilidade matar um inimigo, a ação é instantânea e a Duelista pode usar cortar novamente em 5 turnos sem custo.
items.equipment.weapon.melee.longsword.ability_desc=A Duelista pode _cortar_ um inimigo com uma espada longa. Isso causa _%1$d-%2$d de dano_ e tem acerto garantido. Se a habilidade matar um inimigo, a ação é instantânea e a Duelista pode usar cortar novamente em 5 turnos sem custo.
items.equipment.weapon.melee.longsword.desc=A longa lâmina de aço afiada desta espada reluz de forma reconfortante, embora o seu tamanho a faça parecer bastante pesada.

items.equipment.weapon.melee.mace.name=clava
items.equipment.weapon.melee.mace.stats_desc=Esta é uma arma precisa.
items.equipment.weapon.melee.mace.ability_name=Golpe pesado
items.equipment.weapon.melee.mace.typical_ability_desc=A Duelista pode realizar um _golpe pesado_ com uma clava. Esse ataque concentrado normalmente causa _%1$d-%2$d de dano_ se acertar o inimigo de surpresa e atordoa por 5 turnos, reduzindo a precisão e evasão em 50%%. Golpe pesado tem acerto garantido, mas causa dano regular se o inimigo não for pego de surpresa.
items.equipment.weapon.melee.mace.ability_desc=A Duelista pode realizar um _golpe pesado_ com uma clava. Esse ataque concentrado causa _%1$d-%2$d de dano_ se acertar o inimigo de surpresa e atordoa por 5 turnos, reduzindo a precisão e evasão em 50%%. Golpe pesado tem acerto garantido, mas causa dano regular se o inimigo não for pego de surpresa.
items.equipment.weapon.melee.mace.desc=A grande cabeça de ferro desta arma inflige dano substancial.

items.equipment.weapon.melee.magesstaff.name=cajado do mago
items.equipment.weapon.melee.magesstaff.ac_imbue=IMBUIR
