items.summon.chinamech.name=Дрон поддержки Барьера
items.summon.chinamech.ac_active=ИСПОЛЬЗОВАТЬ
items.summon.chinamech.desc=Вызываем поддержку, вызываем поддержку.
items.summon.chinamech$huaweidajiang.name=HW Дадзян
items.summon.chinamech$huaweidajiang.desc=Дрон Барьера для поддержки первопроходцев, внутри высококачественная еда и несколько ракет.
items.specific.sellitem.jumperdancer.name=Танцующая кукла
items.specific.sellitem.jumperdancer.desc=Вы не можете остановить танец этой куклы.