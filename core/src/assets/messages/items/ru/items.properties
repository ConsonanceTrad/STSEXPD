items.equipment.weapon.melee.meleeweapon.prompt=Выберите Цель
items.equipment.weapon.melee.meleeweapon.swap=Поменять Оружия
items.equipment.weapon.melee.meleeweapon.swap_full=Вы не можете делать это с полным инвентарем.


items.equipment.weapon.melee.shortsword.name=короткий меч
items.equipment.weapon.melee.shortsword.ability_name=рассечь
items.equipment.weapon.melee.shortsword.typical_ability_desc=Дуэлянт может _рассечь_ врага коротким мечом. Эта атака обычно наносит _%1$d-%2$d урона_ и гарантированно попадает в цель. Если, рассекая противника, Дуэлянт убивает его, то она может использовать эту атаку ещё раз бесплатно на протяжении 5 ходов.
items.equipment.weapon.melee.shortsword.ability_desc=Дуэлянт может _рассечь_ врага коротким мечом. Эта атака наносит _%1$d-%2$d урона_ и гарантированно попадает в цель. Если, рассекая противника, Дуэлянт убивает его, то она может использовать эту атаку ещё раз бесплатно на протяжении 5 ходов.
items.equipment.weapon.melee.shortsword.desc=Довольно короткий меч, всего на несколько дюймов длиннее кинжала.

items.equipment.weapon.melee.quarterstaff.name=боевой посох
items.equipment.weapon.melee.quarterstaff.stats_desc=Это оружие блокирует от 0 до 2 урона.
items.equipment.weapon.melee.quarterstaff.ability_name=встать в стойку
items.equipment.weapon.melee.quarterstaff.typical_ability_desc=Дуэлянт может принять _защитную стойку_ со своим боевым посохом. Стойка не требует времени на активацию и утраивает её уклонение обычно на _%d ходов_.
items.equipment.weapon.melee.quarterstaff.ability_desc=Дуэлянт может принять _защитную стойку_ со своим боевым посохом. Стойка не требует времени на активацию и утраивает её уклонение на _%d ходов_.
items.equipment.weapon.melee.quarterstaff.upgrade_ability_stat_name=Длительность Способности
items.equipment.weapon.melee.quarterstaff.desc=Посох из крепкого дерева с нехилыми железными набалдашниками на обоих концах.
items.equipment.weapon.melee.quarterstaff$defensivestance.name=встать в стойку
items.equipment.weapon.melee.quarterstaff$defensivestance.desc=Дуэлянт использует свой боевой посох для защиты от ударов и выстрелов. Пока она в своей стойке, шанс уклонения от атак утроен.\n\nХодов осталось: %s.

items.equipment.weapon.melee.rapier.name=шпага
items.equipment.weapon.melee.rapier.stats_desc=Это оружие блокирует от 0 до 1 урона.
items.equipment.weapon.melee.rapier.ability_name=выпад
items.equipment.weapon.melee.rapier.typical_ability_desc=Дуэлянт может шпагой сделать _выпад_ во врага, который находится на расстоянии в 1 клетку. Выпад сближает с противником, обычно нанося ему _%1$d-%2$d урона_ и гарантированно попадает в цель.
items.equipment.weapon.melee.rapier.ability_desc=Дуэлянт может шпагой сделать _выпад_ во врага, который находится на расстоянии в 1 клетку. Выпад сближает с противником, нанося ему _%1$d-%2$d урона_ и гарантированно попадает в цель.
items.equipment.weapon.melee.rapier.desc=Тонкий и длинный меч, который обеспечивает защиту взамен на рубящую силу.
items.equipment.weapon.melee.rapier.discover_hint=Один из героев начинает с этим предметом.

items.equipment.weapon.melee.roundshield.name=круглый щит
items.equipment.weapon.melee.roundshield.typical_stats_desc=Обычно это оружие блокирует от 0 до %d урона. Этот блок зависит от уровня оружия.
items.equipment.weapon.melee.roundshield.stats_desc=Это оружие блокирует от 0 до %d урона. Этот блок зависит от уровня оружия.
items.equipment.weapon.melee.roundshield.ability_name=защититься
items.equipment.weapon.melee.roundshield.typical_ability_desc=Дуэлянт может _защитить_ себя круглым щитом, становясь полностью неуязвимой к физическим и магическим атакам обычно в течение _%d ходов_. Как только Дуэлянт заблокирует атаку, атакование в ответ или использование магии разрушит её защиту.
items.equipment.weapon.melee.roundshield.ability_desc=Дуэлянт может _защитить_ себя круглым щитом, становясь полностью неуязвимой к физическим и магическим атакам в течение _%d ходов_. Как только Дуэлянт заблокирует атаку, атакование в ответ или использование магии разрушит её защиту.
items.equipment.weapon.melee.roundshield.upgrade_ability_stat_name=Длительность Способности
items.equipment.weapon.melee.roundshield.desc=Этот большой щит хорошо защищает от ударов и, в трудную минуту, может даже послужить вместо оружия.
items.equipment.weapon.melee.roundshield$guardtracker.name=защищается
items.equipment.weapon.melee.roundshield$guardtracker.guarded=под защитой
items.equipment.weapon.melee.roundshield$guardtracker.desc=Дуэлянт подготовила свой щит в ожидании атак. Она неуязвима к физическим или магическим атакам.\n\nХодов осталось: %s.

items.equipment.weapon.melee.runicblade.name=рунный клинок
items.equipment.weapon.melee.runicblade.stats_desc=Урон этого оружия гораздо сильнее возрастает при улучшении.
items.equipment.weapon.melee.runicblade.ability_name=рунический удар
items.equipment.weapon.melee.runicblade.typical_ability_desc=Дуэлянт может совершить _рунический удар_ рунным клинком. Атака гарантированно попадает по цели и обычно увеличивает на _+%d%% силу зачарования._
items.equipment.weapon.melee.runicblade.ability_desc=Дуэлянт может совершить _рунический удар_ рунным клинком. Атака гарантированно попадает по цели и увеличивает на _+%d%% силу зачарования._
items.equipment.weapon.melee.runicblade.upgrade_ability_stat_name=Сила Способности
items.equipment.weapon.melee.runicblade.desc=Загадочное оружие из дальней страны со светло-голубым лезвием.

items.equipment.weapon.melee.sai.name=сай
items.equipment.weapon.melee.sai.stats_desc=Это очень быстрое оружие.
items.equipment.weapon.melee.sai.ability_name=двойной удар
items.equipment.weapon.melee.sai.typical_ability_desc=Дуэлянт может совершить _двойной удар_ используя сай. Эта атака гарантированно попадёт в цель и обычно наносит на _%d больше урона_ за каждый раз, когда Дуэлянт удачно попала в противника в ближнем бою или метательным оружием. Комбо сбрасывается, если ей не удаётся провести успешную атаку в течение 5 ходов или 15 ходов после убийства.
items.equipment.weapon.melee.sai.ability_desc=Дуэлянт может совершить _двойной удар_ используя сай. Эта атака гарантированно попадёт в цель и наносит на _%d больше урона_ за каждый раз, когда Дуэлянт удачно попала в противника в ближнем бою или метательным оружием. Комбо сбрасывается, если ей не удаётся провести успешную атаку в течение 5 ходов или 15 ходов после убийства.
items.equipment.weapon.melee.sai.desc=Два тонких клинка, предназначенных для ношения в каждой руке. Превосходно подходит для уничтожения врагов шквалом порезов.
items.equipment.weapon.melee.sai$combostriketracker.name=двойной удар
items.equipment.weapon.melee.sai$combostriketracker.desc=Дуэлянт совершает комбо, которое может быть использовано для увеличения урона от способности "двойной удар". Засчитывается каждая удачная обычная атака рукопашным или метательным оружием, но непопадание по противникам в течение 5 ходов или 15 ходов после убийства сбрасывает это комбо.\n\nКоличество попаданий: %1$d.\n\nХодов до сброса комбо: %2$s.

items.equipment.weapon.melee.scimitar.name=скимитар
items.equipment.weapon.melee.scimitar.stats_desc=Это довольно быстрое оружие.
items.equipment.weapon.melee.scimitar.ability_name=танец меча
items.equipment.weapon.melee.scimitar.typical_ability_desc=Дуэлянт со скимитаром в руках может исполнить боевой _танец с мечом_. Активация этой способности не требует времени и дарует Дуэлянту +60%% к скорости атаки и +50%% к точности. Обычно эффект продолжается _%d ходов._
items.equipment.weapon.melee.scimitar.ability_desc=Дуэлянт со скимитаром в руках может исполнить боевой _танец с мечом_. Активация этой способности не требует времени и дарует Дуэлянту +60%% к скорости атаки и +5%% к точности на _%d ходов._
items.equipment.weapon.melee.scimitar.upgrade_ability_stat_name=Длительность Способности
items.equipment.weapon.melee.scimitar.desc=Широкий изогнутый клинок. Его форма позволяет наносить быстрые, но менее сильные атаки.
items.equipment.weapon.melee.scimitar$sworddance.name=танец меча
items.equipment.weapon.melee.scimitar$sworddance.desc=Дуэлянт делает быстрые импульсные удары своим оружием, будто танцуя. Благодаря этому, она атакует на 60%% быстрее (этого достаточно, чтобы атаковать скимитаром дважды за ход) и увеличивает точность ударов на +50%%.\n\nХодов осталось: %s.

items.equipment.weapon.melee.sickle.name=серп
items.equipment.weapon.melee.sickle.stats_desc=Это довольно неточное оружие.
items.equipment.weapon.melee.sickle.ability_name=жатва
items.equipment.weapon.melee.sickle.typical_ability_desc=Дуэлянт может совершить _разрез_ серпом. Эта разрушительная атака гарантированно попадает по врагу и обычно наносит _%d урона_. Этот урон применяется как кровотечение, если цель не имеет иммунитет.
items.equipment.weapon.melee.sickle.ability_desc=Дуэлянт может совершить _разрез_ серпом. Эта разрушительная атака гарантированно попадает по врагу и наносит _%d урона_. Этот урон применяется как кровотечение, если цель не имеет иммунитет.
items.equipment.weapon.melee.sickle.desc=Ручной сельскохозяйственный инструмент, который можно использовать как мощное, но громоздкое оружие.

items.equipment.weapon.melee.spear.name=копьё
items.equipment.weapon.melee.spear.stats_desc=Это довольно медленное оружие.\nЭто оружие имеет повышенную дальность атаки.
items.equipment.weapon.melee.spear.ability_name=пронзить
items.equipment.weapon.melee.spear.typical_ability_desc=Дуэлянт, используя наконечник копья, может _пронзить_ врага в зоне досягаемости, но не стоящего вплотную. Эта атака обычно наносит _%1$d-%2$d урона_, отталкивает противника и гарантированно попадает в цель.
items.equipment.weapon.melee.spear.ability_desc=Дуэлянт, используя наконечник копья, может _пронзить_ врага в зоне досягаемости, но не стоящего вплотную. Эта атака наносит _%1$d-%2$d урона_, отталкивает противника и гарантированно попадает в цель.
items.equipment.weapon.melee.spear.desc=Тонкая длинная палка с куском заостренного железа на конце.

items.equipment.weapon.melee.sword.name=меч
items.equipment.weapon.melee.sword.ability_name=рассечь
items.equipment.weapon.melee.sword.typical_ability_desc=Дуэлянт может _рассечь_ врага мечом. Эта атака обычно наносит _%1$d-%2$d урона_ и гарантированно попадает в цель. Если, рассекая противника, Дуэлянт убивает его, то она может использовать эту атаку ещё раз бесплатно на протяжении 5 ходов.
items.equipment.weapon.melee.sword.ability_desc=Дуэлянт может _рассечь_ врага мечом. Эта атака наносит _%1$d-%2$d урона_ и гарантированно попадает в цель. Если, рассекая противника, Дуэлянт убивает его, то она может использовать эту атаку ещё раз бесплатно на протяжении 5 ходов.
items.equipment.weapon.melee.sword.desc=Прекрасно сбалансированный меч. Не очень большой, но всё же длиннее короткого меча.
items.equipment.weapon.melee.sword$cleavetracker.name=рассекание
items.equipment.weapon.melee.sword$cleavetracker.desc=Дуэлянт готова продолжать рассекать врагов! Следующее рассекание не будет требовать заряд оружия.\n\nХодов осталось: %s.

items.equipment.weapon.melee.warhammer.name=боевой молот
items.equipment.weapon.melee.warhammer.stats_desc=Это довольно меткое оружие.
items.equipment.weapon.melee.warhammer.ability_name=мощный удар
items.equipment.weapon.melee.warhammer.typical_ability_desc=Дуэлянт может совершить _мощный удар_ боевым молотом. Эта концентрированная атака обычно наносит _%1$d-%2$d урона_, если враг был застигнут врасплох, а также ошеломляет его на 5 ходов, чем снижает точность и уклонение на 50%%. Мощный удар всегда попадает в цель, но наносит обычный урон, если он не застает врага врасплох.
items.equipment.weapon.melee.warhammer.ability_desc=Дуэлянт может совершить _мощный удар_ боевым молотом. Эта концентрированная атака наносит _%1$d-%2$d урона_, если враг был застигнут врасплох, а также ошеломляет его на 5 ходов, чем снижает точность и уклонение на 50%%. Мощный удар всегда попадает в цель, но наносит обычный урон, если он не застает врага врасплох.
items.equipment.weapon.melee.warhammer.desc=Мало кто сможет устоять перед сокрушительной мощью этой громады из свинца и стали, но только сильнейшие способны использовать его в полную силу.

items.equipment.weapon.melee.warscythe.name=боевая коса
items.equipment.weapon.melee.warscythe.stats_desc=Это довольно неточное оружие.
items.equipment.weapon.melee.warscythe.ability_name=жатва
items.equipment.weapon.melee.warscythe.typical_ability_desc=Дуэлянт может совершить _разрез_ боевой косой. Эта разрушительная атака гарантированно попадает по врагу и обычно наносит _%d урона_. Этот урон применяется как кровотечение, если цель не имеет иммунитет.
items.equipment.weapon.melee.warscythe.ability_desc=Дуэлянт может совершить _разрез_ боевой косой. Эта разрушительная атака гарантированно попадает по врагу и наносит _%d урона_. Этот урон применяется как кровотечение, если цель не имеет иммунитет.
items.equipment.weapon.melee.warscythe.desc=Это крупный и громоздкий инструмент был усилен так, чтобы он лучше справлялся с уничтожением врагов, а не со сбором урожая.

items.equipment.weapon.melee.whip.name=кнут
items.equipment.weapon.melee.whip.stats_desc=Это оружие имеет огромную дальность атаки.
items.equipment.weapon.melee.whip.ability_name=хлестнуть
items.equipment.weapon.melee.whip.typical_ability_desc=Дуэлянт может _хлестнуть_ кнутом всех врагов вокруг. Эта способность обычно наносит _%1$d-%2$d урона_, атакует всех врагов в зоне действия кнута и гарантированно попадает.
items.equipment.weapon.melee.whip.ability_desc=Дуэлянт может _хлестнуть_ кнутом всех врагов вокруг. Эта способность наносит _%1$d-%2$d урона_, атакует всех врагов в зоне действия кнута и гарантированно попадает.
items.equipment.weapon.melee.whip.desc=Хотя этот покрытый шипами хлыст и трудно назвать настоящим оружием, его дальность атаки не имеет аналогов.

items.equipment.weapon.melee.wornshortsword.name=изношенный короткий меч
items.equipment.weapon.melee.wornshortsword.ability_name=рассечь
items.equipment.weapon.melee.wornshortsword.typical_ability_desc=Дуэлянт может _рассечь_ врага изношенным коротким мечом. Эта атака обычно наносит _%1$d-%2$d урона_ и гарантированно попадает в цель. Если, рассекая противника, Дуэлянт убивает его, то она может использовать эту атаку ещё раз бесплатно на протяжении 5 ходов.
items.equipment.weapon.melee.wornshortsword.ability_desc=Дуэлянт может _рассечь_ врага изношенным коротким мечом. Эта атака наносит _%1$d-%2$d урона_ и гарантированно попадает в цель. Если, рассекая противника, Дуэлянт убивает его, то она может использовать эту атаку ещё раз бесплатно на протяжении 5 ходов.
items.equipment.weapon.melee.wornshortsword.desc=Довольно короткий меч, уже сильно изношенный из-за длительного использования. Он слабее и немного легче обычного короткого меча лучшего состояния.
items.equipment.weapon.melee.wornshortsword.discover_hint=Один из героев начинает с этим предметом.


###missile weapons
items.equipment.weapon.missiles.darts.adrenalinedart.name=адреналиновый дротик
items.equipment.weapon.missiles.darts.adrenalinedart.desc=Эти дротики покрыты веществом на основе Скорополоха, которое увеличивает скорость передвижения и атаки союзников или ненадолго снижает скорость передвижения врагов. Сам дротик всё ещё наносит урон врагам, но для союзников он безопасен.

items.equipment.weapon.missiles.darts.blindingdart.name=ослепляющий дротик
items.equipment.weapon.missiles.darts.blindingdart.desc=Эти дротики, покрытые веществом на основе Слепняка, на некоторое время ослепляют жертву. Но они не дезориентируют её, так что противник запомнит ваше последнее известное местонахождение.

items.equipment.weapon.missiles.darts.chillingdart.name=замораживающий дротик
items.equipment.weapon.missiles.darts.chillingdart.desc=Эти дротики, покрытые веществом на основе Ледяной лилии, замораживают цель при попадании.

items.equipment.weapon.missiles.darts.cleansingdart.name=очищающий дротик
items.equipment.weapon.missiles.darts.cleansingdart.desc=Наконечник этих дротиков покрыт веществом на основе Магорозы, которое временно делает союзников невосприимчивыми ко всем негативным эффектам или снимает положительные эффекты с врагов. Враги могут даже ненадолго забыть, что они нападают на вас или убегают от вас. Сам дротик по-прежнему вреден для врагов, но не причинит вреда союзникам.

items.equipment.weapon.missiles.darts.dart.name=дротик
items.equipment.weapon.missiles.darts.dart.ac_tip=СМАЗАТЬ
items.equipment.weapon.missiles.darts.dart.prompt=Выберите семя
items.equipment.weapon.missiles.darts.dart.tip_title=Смазанные дротики
items.equipment.weapon.missiles.darts.dart.tip_desc=Один или два дротика можно отварить с семенами для того, чтобы покрыть их соответствующим составом. Составы стираются после одного попадания, но каждый из них имеет свой, уникальный эффект.\n\nСмазав дротик с этими семенами, вы получите _%s._
items.equipment.weapon.missiles.darts.dart.tip_all=Смазать %1$d дротиков %2$d семенами
items.equipment.weapon.missiles.darts.dart.tip_two=Смазать 2 дротика с 1 семенем
items.equipment.weapon.missiles.darts.dart.tip_one=Смазать 1 дротик с 1 семенем
items.equipment.weapon.missiles.darts.dart.tip_cancel=Отменить
items.equipment.weapon.missiles.darts.dart.desc=Эти простые деревянные стержни с заострённым наконечником сбалансированы так, что даже легкое движение кистью способно отправить их на значительное расстояние. Они могут быть смазаны семенами для получения дополнительных эффектов при попадании.
items.equipment.weapon.missiles.darts.dart.unlimited_uses=Благодаря своей простой конструкции дротики не сломаются никогда.

items.equipment.weapon.missiles.darts.displacingdart.name=телепортирующий дротик
items.equipment.weapon.missiles.darts.displacingdart.desc=Эти дротики, покрытые веществом на основе Ведьминого стебля, телепортируют цель назад на короткое расстояние.

items.equipment.weapon.missiles.darts.healingdart.name=исцеляющий дротик
items.equipment.weapon.missiles.darts.healingdart.desc=Эти дротики, покрытые веществом на основе Солнечника, ускоряют выздоровление цели. Сам дротик всё ещё наносит урон врагам, для союзников, однако, он безопасен.

items.equipment.weapon.missiles.darts.holydart.name=освященный дротик
items.equipment.weapon.missiles.darts.holydart.desc=Эти дротики, покрытые веществом на основе Звездоцвета, которое наполняют цель святой энергией. Союзники и обычные враги получат благословение, но такие враги, как нежить или демон, получат большой урон. Сам дротик всё еще наносит урон врагам, для союзников, однако, он безопасен.

items.equipment.weapon.missiles.darts.incendiarydart.name=поджигающий дротик
items.equipment.weapon.missiles.darts.incendiarydart.desc=Эти дротики, покрытые веществом на основе Огнецвета, при попадании загораются ярким пламенем.

items.equipment.weapon.missiles.darts.paralyticdart.name=парализующий дротик
items.equipment.weapon.missiles.darts.paralyticdart.desc=Эти дротики, покрытые веществом на основе Земляного корня, на некоторое время парализуют жертву.

items.equipment.weapon.missiles.darts.poisondart.name=отравленный дротик
items.equipment.weapon.missiles.darts.poisondart.desc=Эти дротики, покрытые веществом на основе Грустномоха, отравляют цель при попадании.

items.equipment.weapon.missiles.darts.rotdart.name=гнилостный дротик
items.equipment.weapon.missiles.darts.rotdart.desc=Эти коварные дротики покрыты веществом на основе гнилоягоды, разъедающим всё, чего коснётся кончик дротика. Сильные противники будут сопротивляться большей части эффекта, но коррозия достаточно сильна, чтобы убить большую часть обычных монстров. Эти дротики сохраняют эффект дольше, чем другие, однако длительность эффекта не может быть увеличена.
items.equipment.weapon.missiles.darts.rotdart.discover_hint=Вы можете создать этот предмет используя семечко с определённого задания.

items.equipment.weapon.missiles.darts.shockingdart.name=электрический дротик
items.equipment.weapon.missiles.darts.shockingdart.desc=Эти дротики, покрытые веществом на основе Грозовой лозы, при попадании ударят цель электрическим разрядом.

items.equipment.weapon.missiles.darts.tippeddart.ac_clean=ОЧИСТИТЬ
items.equipment.weapon.missiles.darts.tippeddart.clean_title=Очищенные дротики
items.equipment.weapon.missiles.darts.tippeddart.clean_desc=Это действие очистит дротик от эффекта семени, нанесенного на него, превратив его обратно в обычный дротик.
items.equipment.weapon.missiles.darts.tippeddart.clean_all=Очистить все
items.equipment.weapon.missiles.darts.tippeddart.clean_one=Очистить один
items.equipment.weapon.missiles.darts.tippeddart.cancel=Отменить
items.equipment.weapon.missiles.darts.tippeddart.uses_left=Осталось _%d/%d_ бросков перед тем, как один из дротиков потеряет эффект.
items.equipment.weapon.missiles.darts.tippeddart.unlimited_uses=_Но эти настолько хороши, что могут использоваться вечно._
items.equipment.weapon.missiles.darts.tippeddart.about_to_break=Ваш дротик скоро потеряет эффект.
items.equipment.weapon.missiles.darts.tippeddart.has_broken=Ваш дротик потерял эффект.
items.equipment.weapon.missiles.darts.tippeddart.discover_hint=Вы можете купить этот предмет в магазине или создать его с помощью семечка.


items.equipment.weapon.missiles.bolas.name=болас
items.equipment.weapon.missiles.bolas.stats_desc=Это оружие наносит хромоту на свою цель.
items.equipment.weapon.missiles.bolas.desc=Это необычное метательное оружие наносит не слишком много урона, но зато замедляет передвижение цели при попадании.

items.equipment.weapon.missiles.boomerang.name=бумеранг
items.equipment.weapon.missiles.boomerang.desc=Этот плоский изогнутый деревянный снаряд вернется к хозяину, если кинуть его во врага.
items.equipment.weapon.missiles.boomerang.durability=Благодаря своей конструкции, бумеранг не изнашивается при использовании.

items.equipment.weapon.missiles.fishingspear.name=рыболовное копьё
items.equipment.weapon.missiles.fishingspear.desc=Маленькие метательные копья, предназначенные для рыбалки. Вполне годятся и в качестве импровизированного оружия.

items.equipment.weapon.missiles.forcecube.name=силовой куб
items.equipment.weapon.missiles.forcecube.ondeath=Вы убили себя собственным Силовым Кубом...
items.equipment.weapon.missiles.forcecube.stats_desc=Это оружие распределяет силу своего удара, задевая все вокруг себя.
items.equipment.weapon.missiles.forcecube.desc=Эти странные кубики достаточно малы для того, чтобы держать их в руке, но невероятно тяжелые.

items.equipment.weapon.missiles.heavyboomerang.name=тяжелый бумеранг
items.equipment.weapon.missiles.heavyboomerang.stats_desc=Это оружие возвратится обратно туда, откуда оно было брошено, через пять ходов.
items.equipment.weapon.missiles.heavyboomerang.desc=Этот увесистый бумеранг трудно использовать эффективно, однако он наносит значительный урон.

items.equipment.weapon.missiles.javelin.name=пилум
items.equipment.weapon.missiles.javelin.desc=Эти увесистые метательные копья сбалансированы так, чтобы удерживать остриё точно впереди, пока оно пронзает воздух.

items.equipment.weapon.missiles.kunai.name=кунаи
items.equipment.weapon.missiles.kunai.stats_desc=Это оружие эффективнее при скрытных атаках.
items.equipment.weapon.missiles.kunai.desc=Эти маленькие ножи невероятно опасны в умелых руках.

items.equipment.weapon.missiles.missileweapon.stats_known=Этот комплект метательного оружия _%1$d-ого уровня_ наносит _%2$d-%3$d урона_ и требует _%4$d очков силы_ для использования.
items.equipment.weapon.missiles.missileweapon.stats_unknown=Как правило, этот комплект метательного оружия _%1$d-ого уровня_ наносит _%2$d-%3$d урона_ и требует _%4$d очков силы_ для использования.
items.equipment.weapon.missiles.missileweapon.stats_desc=
items.equipment.weapon.missiles.missileweapon.probably_too_heavy=Вероятно, это оружие будет слишком тяжело для вас.
items.equipment.weapon.missiles.missileweapon.distance=Шанс попадания метательным оружием уменьшается, если использовать его в ближнем бою.
items.equipment.weapon.missiles.missileweapon.durability=Метательные оружия постепенно изнашиваются при использовании.
items.equipment.weapon.missiles.missileweapon.uses_left=Осталось _%d/%d_ бросков перед тем, как сломается одно из метательных оружий.
items.equipment.weapon.missiles.missileweapon.unlimited_uses=Этот комплект настолько хорош, что его можно использовать вечно.
items.equipment.weapon.missiles.missileweapon.unknown_uses=Как правило, этот комплект метательных оружий будет иметь _%d_ бросков перед тем, как одно из них сломается.
items.equipment.weapon.missiles.missileweapon.curse_discover=Это метательное оружие проклято!
items.equipment.weapon.missiles.missileweapon.about_to_break=Брошенное вами оружие вот-вот сломается.
items.equipment.weapon.missiles.missileweapon.has_broken=Одно из ваших метательных оружий сломалось.
items.equipment.weapon.missiles.missileweapon.dust=Метательное оружие рассыпается в пыль при прикосновении.
items.equipment.weapon.missiles.missileweapon.break_upgraded_warn_desc=Если последнее метательное оружие в зачарованном комплекте сломается, комплект будет навсегда утерян. Вы уверены, что хотите его бросить?
items.equipment.weapon.missiles.missileweapon.break_upgraded_warn_yes=Да
items.equipment.weapon.missiles.missileweapon.break_upgraded_warn_no=Нет
items.equipment.weapon.missiles.missileweapon$placeholder.name=метательное оружие

items.equipment.weapon.missiles.shuriken.name=сюрикен
items.equipment.weapon.missiles.shuriken.stats_desc=Сюрикены можно бросать мгновенно с перезарядкой в 20 ходов.
items.equipment.weapon.missiles.shuriken.desc=Эти заточенные в форме звёздочек кусочки металла можно быстро использовать на ходу.
items.equipment.weapon.missiles.shuriken$shurikeninstanttracker.name=Перезарядка сюрикена
items.equipment.weapon.missiles.shuriken$shurikeninstanttracker.desc=Вы недавно использовали сюрикен мгновенно и должны подождать перед тем, как сделать это снова. Сюрикены всё ещё можно бросать, но с обычной скоростью.\n\nХодов осталось: %s.

items.equipment.weapon.missiles.throwingclub.name=метательная дубина
items.equipment.weapon.missiles.throwingclub.stats_desc=Это оружие не впивается во врага, его можно подобрать моментально.
items.equipment.weapon.missiles.throwingclub.desc=Это незамысловатое, но прочное метательное оружие, по сути, является просто большим камнем на палке.

items.equipment.weapon.missiles.throwinghammer.name=метательный молот
items.equipment.weapon.missiles.throwinghammer.stats_desc=Это оружие не впивается во врага, его можно подобрать моментально.
items.equipment.weapon.missiles.throwinghammer.desc=Эти здоровенные молоты предназначены для метания во врага. Их гладкая цельнометаллическая конструкция обеспечивает особенную прочность.

items.equipment.weapon.missiles.throwingknife.name=метательный нож
items.equipment.weapon.missiles.throwingknife.stats_desc=Это оружие эффективнее при скрытных атаках.
items.equipment.weapon.missiles.throwingknife.desc=Эти легковесные ножи сбалансированы так, чтобы по дугообразной траектории попадать прямо в цель.
items.equipment.weapon.missiles.throwingknife.discover_hint=Один из героев начинает с этим предметом.

items.equipment.weapon.missiles.throwingspear.name=метательное копьё
items.equipment.weapon.missiles.throwingspear.desc=Эти лёгкие и тонкие копья предназначены для метания, а не для ближнего боя.

items.equipment.weapon.missiles.throwingspike.name=метательная игла
items.equipment.weapon.missiles.throwingspike.desc=Эти прочные острые иглы предназначены для метания во врагов на расстоянии.
items.equipment.weapon.missiles.throwingspike.discover_hint=Один из героев начинает с этим предметом.

items.equipment.weapon.missiles.throwingstone.name=метательный камень
items.equipment.weapon.missiles.throwingstone.desc=Эти камни отшлифованы так, чтобы их можно было бросать сильнее обычных камней.
items.equipment.weapon.missiles.throwingstone.discover_hint=Один из героев начинает с этим предметом.

items.equipment.weapon.missiles.tomahawk.name=томагавк
items.equipment.weapon.missiles.tomahawk.stats_desc=Это оружие причиняет _%1$d-%2$d кровотечения_ цели.
items.equipment.weapon.missiles.tomahawk.typical_stats_desc=Это оружие обычно причиняет _%1$d-%2$d кровотечения_ цели.
items.equipment.weapon.missiles.tomahawk.desc=Эти метательные топоры имеют зазубренные края, которые впиваются во врага.

items.equipment.weapon.missiles.trident.name=трезубец
items.equipment.weapon.missiles.trident.desc=Массивные метательные копья с тремя смертоносными зубцами на конце. Мощные, но тяжеловатые.


items.equipment.weapon.spiritbow.name=Лук Духов
items.equipment.weapon.spiritbow.ac_shoot=ВЫСТРЕЛ
items.equipment.weapon.spiritbow.prompt=Выберите цель
items.equipment.weapon.spiritbow.stats=Лук не может быть улучшен напрямую, но вместо этого он будет постепенно улучшаться с получением новых уровней. На данном уровне, его стрелы будут наносить _%1$d-%2$d урона_ и требовать _%3$d очков силы_ для эффективного использования.
items.equipment.weapon.spiritbow.desc=Лук сделан из древнего волшебного дерева. Тетива лука и узоры светятся слабым голубоватым светом. Натянув тетиву, лук создаст волшебную стрелу, которую можно выпустить во врага.
items.equipment.weapon.spiritbow.discover_hint=Один из героев начинает с этим предметом.

items.equipment.weapon.weapon.identify=Вы достаточно долго знакомы с оружием, чтобы опознать его.
items.equipment.weapon.weapon.too_heavy=Из-за недостаточной силы, точность и скорость ваших атак с этим оружием будут снижены. Кроме того, вы не сможете совершать неожиданные атаки данным оружием.
items.equipment.weapon.weapon.excess_str=Благодаря избыточной силе, ваши атаки данным оружием будут наносить  _0-%d ед. доп. урона._
items.equipment.weapon.weapon.hardening_gone=Закалка на этом оружии стерлась!
items.equipment.weapon.weapon.incompatible=Взаимодействие несовместимой магии развеяло зачарование на этом оружии!
items.equipment.weapon.weapon.cursed_worn=Поскольку это оружие проклято, вы не в силах убрать его.
items.equipment.weapon.weapon.cursed=Вы чувствуете, что это оружие скрывает в себе какую-то темную магию.
items.equipment.weapon.weapon.weak_cursed=Даже несмотря на то, что это оружие проклято, вы можете убрать его.
items.equipment.weapon.weapon.not_cursed=Это оружие не проклято.
items.equipment.weapon.weapon.faster=Это оружие сбалансировано, чтобы увеличивать _скорость._
items.equipment.weapon.weapon.stronger=Это оружие сбалансировано, чтобы увеличивать _урон._
items.equipment.weapon.weapon.enchanted=наложено _%s._
items.equipment.weapon.weapon.enchant_hardened=Подверглось _закалке._
items.equipment.weapon.weapon.hardened_no_enchant=Это оружие прошло _закалку,_ но сейчас на нём не наложено зачарование.
items.equipment.weapon.weapon$enchantment.enchant=зачарование
items.equipment.weapon.weapon$enchantment.rankings_desc=Убит зачарованием
items.equipment.weapon.weapon$enchantment.discover_hint=Вы можете случайно найти предмет с этим эффектом в подземелье или попытаться самому нанести его на предмет.


###misc items
items.amulet.name=Амулет Индора
items.amulet.ac_end=ЗАКОНЧИТЬ ИГРУ
items.amulet.desc=Амулет Индора - мощнейший из известных человеческому и дворфскому роду артефактов. Его мерцающие кристаллы содержат неимоверную и удивительную магическую силу.
items.amulet.desc_origins=Неизвестно, откуда произошел амулет. Но история свидетельствует, что Король дворфов обнаружил его незадолго до того, как цивилизация дворфов отказалась от всех внешних контактов. Как он его обнаружил? Каким образом Йог-Джева получил от него амулет? Такие вопросы оставим на позже; все, что важно сейчас - амулет в ваших руках!
items.amulet.desc_ascent=Неизвестно, откуда произошел амулет, но очевидно, что на него сильно повлияла сила Йог-Джева. Подземелье, кажется, подчиняется воле Йога, когда вы проходите по нему, делая врагов намного более многочисленными и могущественными! Вы также больше не можете активировать или выбросить амулет, как будто он стал проклятым.
items.amulet.ascent_title=Восхождение
items.amulet.ascent_desc=Вы начинаете ощущать великую и ужасную силу Йог-Джевы, излучаемую амулетом. Восхождение обратно через подземелье в качестве смертного может оказаться сложнее, чем вы думали!\n\nЕсли вы продолжите восхождение с амулетом, подземелье станет более опасным, телепорты между этажами будут отключены, и вы сможете выиграть игру только, если выберетесь из подземелья, побеждая врагов!\n\nВы можете пока оставить амулет здесь, если хотите подняться, не начиная это испытание, или активировать амулет для восхождения, чтобы завершить игру в обычном режиме.
items.amulet.ascent_yes=Продолжить!
items.amulet.ascent_no=Остановиться сейчас
items.amulet.discover_hint=Вы можете найти этот предмет в самом низу подземелья...

items.ankh.name=анх
items.ankh.ac_bless=ОСВЯТИТЬ
items.ankh.bless=Вы освящаете анх волшебной водой.
items.ankh.desc=Этот древний символ дарует возможность возродиться после смерти. Большинство ваших предметов будет сохранено на месте смерти, и их можно будет подобрать, когда вы вернетесь на это место. Используя полный бурдюк с водой, можно освятить анх, придав ему дополнительные силы.
items.ankh.desc_blessed=Древний символ бессмертия даёт возможность возродиться после смерти. Анх освящён и обладает большей силой. Анх пожертвует собой, чтобы спасти вас от смерти.
items.ankh.discover_hint=Вы можете купить этот предмет в магазине.

items.arcaneresin.name=магическая смола
items.arcaneresin.prompt=Выберите палочку
items.arcaneresin.ac_apply=ИСПОЛЬЗОВАТЬ
items.arcaneresin.level_too_high=Эта палочка слишком сильна, смола не может её улучшить.
items.arcaneresin.not_enough=Недостаточно магической смолы!
items.arcaneresin.apply=Вы обволакиваете палочку смолой, делая её мощнее!
items.arcaneresin.desc=Этот порошок переливается всеми цветами от белого до фиолетового. Он может быть использован как усилитель магических свойств предмета, например, палочек.\n\nУлучшение палочек смолой потратит вплоть до трёх единиц, основываясь на изначальном уровне палочки. Смола может улучшить палочку до уровня +3.\n\nОднако, улучшения из смолы _стираются другими источниками улучшений_ (такими как свитки улучшения) и не применяются при слиянии волшебной палочки с посохом Мага.
items.arcaneresin.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.brokenseal.name=сломанная печать
items.brokenseal.ac_affix=ПРИКРЕПИТЬ
items.brokenseal.prompt=Выберите броню
items.brokenseal.unknown_armor=Сперва вам необходимо определить, проклята ли эта броня.
items.brokenseal.cursed_armor=Невозможно прикрепить печать к проклятой броне.
items.brokenseal.affix=Вы прикрепили печать к броне!
items.brokenseal.desc=Восковая печать, прикреплённая к броне как символ отваги. В её центре высечена поблёкшая руна защиты, а сама печать расколота надвое.\n\nБудучи памятью о доме, эта печать укрепляет воина. Когда он её носит, он будет мгновенно получать щит, как только будет ранен ниже половины здоровья.\n\nПечать можно _прикрепить к броне_, а так же переместить на другую. Она способна перенести один уровень улучшения, если улучшение было наложено на броню с печатью.
items.brokenseal.inscribed=На печати начертана _%s._
items.brokenseal.choose_title=Выберите руну
items.brokenseal.choose_desc=И эта броня и сломанная печать несут руну. Выберите, какую руну необходимо сохранить. \n\nРуна на броне: %1$s.\nРуна на сломанной печати: %2$s.\n\nОбратите внимание, что если вы выберите руну, которая сейчас на броне, печать не сможет перенести ее позже.
items.brokenseal.discover_hint=Один из героев начинает с этим предметом.
items.brokenseal$warriorshield.name=Щит Воина
items.brokenseal$warriorshield.desc_active=Сломанная печать Воина сейчас укрепляет его, даруя ему щит поверх собственного здоровья. Щит нельзя сразу же получить повторно – требуется время на перезарядку.\n\nЭтот щит не уменьшается со временем, но закончится, если рядом в течение нескольких ходов не будет врагов. Когда он заканчивается, весь оставшийся щит уменьшит перезарядку, вплоть до 50%%.\n\nЩита осталось: %1$d.\n\nТекущая перезарядка: %2$d.
items.brokenseal$warriorshield.desc_cooldown=Воин недавно получил щит от своей сломанной печати и должен подождать перед повторным получением эффекта.\n\nХодов осталось: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=Откат щита Воина сейчас отрицательный, что значит, что когда его щит активируется, его перезарядка займёт меньше обычных 150 ходов. Откат щита может быть понижен до -150 ходов, что значит, что он мгновенно перезарядится при активации.\n\nТекущая перезарядка: %d

items.dewdrop.name=капля росы
items.dewdrop.already_full=Вы и так здоровы.
items.dewdrop.desc=Кристально чистая капля росы.\n\nБлагодаря магии этого места чистая вода обладает слабыми исцеляющими способностями.

items.equipableitem.curse_detected=Вы чувствуете что этот предмет проклят, прямо перед тем как его надеть!
items.equipableitem.unequip_cursed=Вы не можете снять проклятый предмет!
items.equipableitem.ac_equip=НАДЕТЬ
items.equipableitem.ac_unequip=СНЯТЬ

items.energycrystal.name=Энергетический кристалл
items.energycrystal.desc=Коллекция маленьких магических кристаллов, наполненных алхимической энергией.\n\nЭти кристаллы самый частый ингредиент в алхимических рецептах и могут быть получены в алхимическом котле путём расщепления расходных предметов.

items.gold.name=золото
items.gold.desc=Кучка золотых монет. Собирайте их, чтобы затем потратить в магазине.

items.heap.for_sale=%1$d зол.: %2$s
items.heap.mimic=Этот сундук оказался мимиком!
items.heap.chest=Сундук
items.heap.chest_desc=Вы не узнаете, что там, пока не откроете!
items.heap.locked_chest=Запертый сундук
items.heap.locked_chest_desc=Вы не узнаете, что там, пока не откроете! Но для этого вам понадобится золотой ключ.
items.heap.crystal_chest=Хрустальный сундук
items.heap.crystal_chest_desc=Внутри вы видите _%s_. Но, чтобы открыть этот сундук, вам потребуется хрустальный ключ.
items.heap.artifact=артефакт
items.heap.wand=палочку
items.heap.ring=кольцо
items.heap.tomb=Могила
items.heap.tomb_desc=В этой древней могиле может лежать что-то полезное, но её владелец вряд ли ждёт гостей.
items.heap.skeleton=Куча костей
items.heap.skeleton_desc=Это всё, что осталось от неудачливого путешественника. Пожалуй, стоит проверить, вдруг там есть что-то ценное.
items.heap.remains=Останки героя
items.heap.remains_desc=Это всё, что осталось от одного из твоих предшественников. Пожалуй, стоит проверить, вдруг там есть что-то ценное.

items.honeypot.name=горшок с мёдом
items.honeypot.ac_shatter=РАЗБИТЬ
items.honeypot.desc=Этот большой горшок только по краям обмазан мёдом, а внутри живёт огромная пчела! Этот вид больших пчёл обычно живёт в ульях, может, горшок - разновидность ловушки для пчёл? Пчела неплохо чувствует себя внутри, однако, когда вы туда заглядываете, она начинает угрожающе жужжать.
items.honeypot$shatteredpot.name=расколотый горшок с мёдом
items.honeypot$shatteredpot.desc=Горшок расколот. Липкий мёд не даёт ему развалиться, но и тот скоро засохнет.\n\nХотя горшок разбит, пчела всё ещё его защищает.

items.item.prompt=Выберите цель для броска
items.item.ac_drop=ВЫЛОЖИТЬ
items.item.ac_throw=БРОСИТЬ
items.item.rankings_desc=Убит (%s)
items.item.curse=проклятие
items.item.custom_note_type=У этого типа предметов есть заметка: "_%s_"
items.item.custom_note=На предмете есть заметка: "_%s_"
items.item.discover_hint=Вы можете случайно найти этот предмет в подземелье.

items.kindofmisc.unequip_title=Необходимо снять один предмет
items.kindofmisc.unequip_message=Сначала вы должны снять один из предметов. Выберите предмет для замены.

items.kindofweapon.swift_equip=Вы быстро надели ваше оружие.
items.kindofweapon.equip_cursed=Ваша рука непроизвольно вцепляется в оружие.
items.kindofweapon.which_equip_msg=В какой слот для оружия вы бы хотели надеть этот предмет?\n\nЧемпион атакует своим основным оружием, но может использовать способности дополнительного. Оба оружия имеют общее количество зарядов.\n\nЧемпион может мгновенно поменять местами основное и дополнительное оружия.
items.kindofweapon.which_equip_primary=Основное (%s)
items.kindofweapon.which_equip_secondary=Дополнительное (%s)
items.kindofweapon.empty=пусто

items.kingscrown.name=Корона Короля дворфов
items.kingscrown.ac_wear=НОСИТЬ
items.kingscrown.naked=К сожалению, корона не сможет преобразить ваше нижнее бельё.
items.kingscrown.upgraded=Корона ярко светится, а затем распадается, трансформируя вашу броню!
items.kingscrown.ratgraded=Лапы Крысиного Короля ярко светятся, когда твоя броня преображается!
items.kingscrown.desc=Корона последнего короля дворфов, она светится и излучает магическую силу.\n\nПри ношении корона передаст свою магическую мощь вашей броне, превращая ее в _уникальную эпическую броню со специальными способностями._ Новая броня сохранит все свойства оригинальной.
items.kingscrown.discover_hint=Вы можете получить этот предмет как трофей с определённых врагов.

items.liquidmetal.name=жидкий металл
items.liquidmetal.ac_apply=ИСПОЛЬЗОВАТЬ
items.liquidmetal.prompt=Выберите метательное оружие
items.liquidmetal.already_fixed=Это метательное оружие уже в превосходном состоянии!
items.liquidmetal.apply=Вы используете %d жидкого металла для починки вашего метательного оружия.
items.liquidmetal.desc=Эта магическая жидкость заглаживает трещины и просечки, возникшие от использования, и метательное оружие восстанавливается до идеального состояния! Если комплект оружия полностью восстановлен, но в нём недостаёт оружия, то жидкий металл может восстановить недостающее оружие из комплекта!\n\nДля оружия с редкостью 1 уровня потребуется 10 жидкого металла для полного восстановления, для оружия с редкостью 5 уровня потребуется 30. Каждое улучшение увеличивает требуемое количество металла на 35%.\n\nЖидкий металл нельзя использовать для починки наконечников на дротиках.
items.liquidmetal.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.lostbackpack.name=потерянный рюкзак
items.lostbackpack.desc=Этот рюкзак - ничто иное, как ваш утерянный инвентарь! Возьмите его, чтобы вернуть все утерянные предметы.

items.merchantsbeacon.name=маяк торговца
items.merchantsbeacon.ac_use=ПРОДАЖА
items.merchantsbeacon.desc=Это странная дворфийская технология позволяет общаться на расстоянии.\n\nПри активации этот маяк позволит вам продать вещи в Пиксель-Маркет из любой точки подземелья.\n\nМагии маяка хватит всего на одно использование, так что используйте его с умом.

items.stylus.name=мистический грифель
items.stylus.ac_inscribe=НАЧЕРТАТЬ
items.stylus.prompt=Выберите доспех
items.stylus.identify=Сперва вам нужно опознать эту броню, чтобы узнать проклята ли она.
items.stylus.cursed=Магия грифеля не работает на проклятой броне.
items.stylus.inscribed=Вы нанесли начертание грифелем на своей броне.
items.stylus.desc=Этот грифель сделан из тёмного, очень твёрдого камня и он явно не так прост, как кажется. С его помощью вы можете начертить магическую руну на вашей броне, однако вы не сможете выбрать, какую именно - грифель решит это за вас.

items.tengusmask.name=маска Тенгу
items.tengusmask.ac_wear=НОСИТЬ
items.tengusmask.used=Маска распадается, передавая вам свою силу!
items.tengusmask.desc=Эта маска упала с лица Тенгу после его смерти, и вы чувствуете огромную магическую силу, исходящую от неё. Была ли маска источником силы Тенгу?\n\nПри ношении маска передаст вам свою огромную силу, что позволит вам _выбрать подкласс своего героя._\n\nКакой подкласс вы выберете?
items.tengusmask.discover_hint=Вы можете получить этот предмет как трофей с определённых врагов.

items.torch.name=факел
items.torch.ac_light=ЗАЖЕЧЬ
items.torch.ac_set=УСТАНОВИТЬ
items.torch.desc=Верный спутник героя, разгоняющий тьму, когда подземелье становится слишком мрачным.

items.waterskin.name=бурдюк
items.waterskin.ac_drink=ВЫПИТЬ
items.waterskin.collected=Вы собираете каплю росы в свой бурдюк.
items.waterskin.full=Ваш бурдюк заполнен!
items.waterskin.empty=Ваш бурдюк пуст!
items.waterskin.desc=Контейнер для жидкости, сделанный из кожи и бечевки, запечатанный деревянной пробкой.
items.waterskin.desc_water=Прямо сейчас в бурдюке есть лишь обычная вода. Однако наверняка в подземелье есть что-то, что можно было бы хранить в бурдюке кроме воды.
items.waterskin.desc_heal=Сейчас в бурдюке хранится целебная вода. Чем полнее бурдюк, тем больше здоровья вы восстановите, выпив из него. Вы выпьете ровно столько, сколько вам нужно.
items.waterskin.desc_full=Полный бурдюк, кажется, излучает какую-то энергию. Возможно, ей получится благословить какой-то другой предмет, дарующий жизнь.
items.waterskin.discover_hint=Один из героев начинает с этим предметом.

items.equipment.weapon.melee.special.handcannon.name=Ручная пушка
items.equipment.weapon.melee.special.handcannon.ac_onoff=ВКЛ/ВЫКЛ
items.equipment.weapon.melee.special.handcannon.fuel=Внимание низкий уровень энергии!
items.equipment.weapon.melee.special.handcannon.off=Перегрузка выключена!
items.equipment.weapon.melee.special.handcannon.power_on=Режим перегрузки включен!
items.equipment.weapon.melee.special.handcannon.power_off=Режим перегрузки выключен.
items.equipment.weapon.melee.special.handcannon.desc=Люди изобрели огнестрельное оружие, а гномы усилили и усовершенствовали его. Одна из немногих видов огнестрельного оружия в мире, эта гигантская пушка может поражать цели издалека.\n— Consideredhamster\n\n???
items.equipment.artifacts.fusion.eyeofskadi.name=Глаз Скади
items.equipment.artifacts.fusion.eyeofskadi.ac_add=ДОБАВИТЬ
items.equipment.artifacts.fusion.eyeofskadi.ac_blast=ЛЕДЯНОЙ ВЗРЫВ (ИСТ.)
items.equipment.artifacts.fusion.eyeofskadi.ac_curse=ПРОКЛЯСТЬ
items.equipment.artifacts.fusion.eyeofskadi.no_charge=Ледяной глаз ещё не заряжен.
items.equipment.artifacts.fusion.eyeofskadi.prompt=Выберете горную руду
items.equipment.artifacts.fusion.eyeofskadi.need_charge=Ледяной глаз все еще не заряжен.
items.equipment.artifacts.fusion.eyeofskadi.full_charge=Ледяной глаз заряжен.
items.equipment.artifacts.fusion.eyeofskadi.exp=Текущая сила: %s.
items.equipment.artifacts.fusion.eyeofskadi.infuse_ore=Ледяной глаз поглотил горную руду.
items.equipment.artifacts.fusion.eyeofskadi.desc=Чрезвычайно редкий артефакт, изначально находился под присмотром небесного дракона, попал сюда из-за бурного течения времени и пространства. В глазе кажется, присутствует энергия, излучающая ужасающую ауру.
items.equipment.artifacts.fusion.noomlincrown.name=Корона Нумлина
items.equipment.artifacts.fusion.noomlincrown.desc=Корона с ледяных горных вершин, некогда хранившаяся в глубинах ДВОРЦА. Сила холода давно рассеялась, оставив лишь его питомца и эту изношенную корону.\nХотя в ней больше нет силы, её по-прежнему почитают как божественный артефакт.

items.consum.medicine.timepill.name=Фрагмент времени
items.consum.medicine.timepill.desc=Обеспечивает скоростью и накапливает песок времени.\n\nРецепт в алхимии:\n- 1 чистая вода\n- 4 горной руды
items.consum.medicine.timepill2.name=Фрагмент времени - пружина
items.consum.medicine.timepill2.desc=Обеспечивает скоростью и часовой пружиной.
items.consum.medicine.realgarwine.name=Вино Реальгар
items.consum.medicine.realgarwine.desc=Обеспечивает сопротивлением к огню и яду.\n\nРецепт в алхимии:\n- 1 чистая вода\n- 1 семя огнецвета\n- 1 семя земляного корня
items.consum.medicine.powerpill.name=Таблетка могущества
items.consum.medicine.powerpill.desc=Увеличивает силу на некоторое время.\n\nРецепт в алхимии:\n- 3 мяса\n- 1 овощ
items.consum.medicine.hardpill.name=Таблетка твердости
items.consum.medicine.hardpill.desc=Повышает защиту на некоторое время.\n\nРецепт в алхимии:\n- 2 мяса\n- 1 овощ\n- 1 горная руда
items.consum.medicine.smashpill.name=Таблетка сокрушения
items.consum.medicine.smashpill.desc=Увеличивает урон на некоторое время.\n\nРецепт в алхимии:\n- 2 мяса\n- 1 овощ\n- 1 зелье
items.consum.medicine.musicpill.name=Таблетка ритма
items.consum.medicine.musicpill.desc=Повышает уверенность в себе на некоторое время.\n\nРецепт в алхимии:\n- 2 мяса\n- 1 семя\n- 1 горная руда
items.consum.medicine.magicpill.name=Таблетка таинств
items.consum.medicine.magicpill.desc=Увеличивает магическую силу на некоторое время.\n\nРецепт в алхимии:\n- 2 мяса\n- 1 семя\n- 1 зелья
items.consum.medicine.shootpill.name=Таблетка божественной стрельбы
items.consum.medicine.shootpill.desc=Повышает силу стрельбы на некоторое время.\n\nРецепт в алхимии:\n- 3 мяса\n- 1 семя
items.consum.medicine.greaterpill.name=Большая таблетка
items.consum.medicine.greaterpill.desc=Восстанавливает здоровье.\n\nРецепт в алхимии:\n- 1 фрукт\n- 2 зелья
items.consum.medicine.bluemilk.name=Млечник голубой
items.consum.medicine.bluemilk.desc=Этот гриб такой же нежный и сочный, как ягода, и его употребление может увеличить вашу скорость передвижения и восстановления здоровья. И его воздействие также замедляет других существ.\n\nРецепт в алхимии:\n- 1 чистая вода\n- 1 овощ\n- 1 семя солнечника
items.consum.medicine.deathcap.name=Бледная поганка
items.consum.medicine.deathcap.desc=Этот вид красного гриба с белыми пятнами на головке определенно обладает смертельным воздействием. Надеюсь, он действует и на других существах...\n\nРецепт в алхимии:\n- 1 чистая вода\n- 1 овощ\n- 1 семя семенного стручка
items.consum.medicine.earthstar.name=Звездовик тройной
items.consum.medicine.earthstar.desc=Этот гриб не принадлежит этому миру. Может быть он из Бездны... Или со Звезды Смерти, или что-то в этом роде... Съев его, вы нанесете урон всем существам, кто находится на текущем уровне.\n\nРецепт в алхимии:\n- 1 чистая вода\n- 1 овощ\n- 1 семя земляного корня
items.consum.medicine.goldenjelly.name=Дрожалка оранжевая
items.consum.medicine.goldenjelly.desc=Это не столько гриб, сколько мешочек с семенами. Является проявлением размножения этого гриба: после выдавливания большое количество спор, они разлетается вокруг, замедляя движение существа.\n\nРецепт в алхимии:\n- 1 чистая вода\n- 1 овощ\n- 1 семя грозовой лозы
items.consum.medicine.jackolantern.name=Омфалот маслиновый
items.consum.medicine.jackolantern.desc=Этот гриб содержит много фосфора. Когда его сдавливает внешний мир, он высвобождает фосфорный компонент в виде белого фосфора, вызывая сильный пожар.\n\nРецепт в алхимии:\n- 1 чистая вода\n- 1 овощ\n- 1 семя огнецвета
items.consum.medicine.pixieparasol.name=Голубая мицена
items.consum.medicine.pixieparasol.desc=Мощный галлюциногенный гриб, который при употреблении, поднимает настроение и одновременно усыпляет других существ.\n\nРецепт в алхимии:\n- 1 чистая вода\n- 1 овощ\n- 1 семя снолиста
items.consum.medicine.greenspore.name=Споровой хлорофиллум
items.consum.medicine.greenspore.not_time=В ваш рюкзак потекла странная энергия, но ничего не произошло.
items.consum.medicine.greenspore.desc=Новый сорт грибов, выращенный исследователями росинок, вообще не имеет побочных эффектов по сравнению с другими грибами и может увеличить появление капель росы.\n\nРецепт в алхимии:\n- 1 чистая вода\n- 1 овощ\n- 1 семя росистой травы
items.consum.medicine.foamedbeverage.name=Пиво
items.consum.medicine.foamedbeverage.desc=Выпивайте пиво в копании друзей!\n\nРецепт в алхимии:\n- 2 чистой воды\n- 1 овощ \n- 1 семя\n- 1 фрукт


