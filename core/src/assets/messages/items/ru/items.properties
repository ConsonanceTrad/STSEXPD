###armor curses
items.equipment.armor.curses.antientropy.name=%s анти-энтропии
items.equipment.armor.curses.antientropy.desc=Проклятие анти-энтропии работает против законов вселенной, втягивая энергию в носителя из его окружения. Оно слегка поджигает носителя, но замораживает все вокруг!

items.equipment.armor.curses.bulk.name=%s неповоротливости
items.equipment.armor.curses.bulk.desc=Доспех неповоротливости может и выглядит больше и внушительнее обычного, но защищает вовсе не лучше. Куда хуже, больший размер сильно мешает проходить через двери.

items.equipment.armor.curses.corrosion.name=%s коррозии
items.equipment.armor.curses.corrosion.desc=Из доспехов коррозии выделяется едкая жидкость и всё вокруг покрывается липкой кислотой.

items.equipment.armor.curses.displacement.name=%s телепортации
items.equipment.armor.curses.displacement.desc=Проклятие телепортации пытается защитить своего владельца от опасности, перенося его на новое место при получении повреждений. Впрочем, его эффект является скорее помехой, потому что способен телепортировать владельца по всему уровню.

items.equipment.armor.curses.metabolism.name=%s метаболизма
items.equipment.armor.curses.metabolism.desc=Проклятие метаболизма ускоряет работу организма своего владельца, ускоряя как скорость регенерации, так и скорость истощения.

items.equipment.armor.curses.multiplicity.name=%s копирования
items.equipment.armor.curses.multiplicity.desc=Доспех, на который наложено проклятие копирования, способен доставить немало проблем. Иногда удар по такому доспеху создаст копию владельца, но с таким же успехом он может создать и копию атакующего!

items.equipment.armor.curses.overgrowth.name=%s цветения
items.equipment.armor.curses.overgrowth.desc=Доспех цветения покрыт различными растениями. Хоть это и выглядит красиво, но никак не улучшает защиту, а в бою эти растения будут активироваться в случайном порядке!

items.equipment.armor.curses.stench.name=%s зловония
items.equipment.armor.curses.stench.desc=Доспех, на который наложено проклятие зловония, способен испускать облака ядовитого газа, опасного как для владельца, так и для всех, кто окажется рядом.


###glyphs
items.equipment.armor.glyphs.affection.name=%s очарования
items.equipment.armor.glyphs.affection.desc=Эта могущественная руна способна подчинить разум атакующего, временно очаровывая его.

items.equipment.armor.glyphs.antimagic.name=%s антимагии
items.equipment.armor.glyphs.antimagic.desc=Эта могущественная руна позволяет доспеху защищать своего носителя от магических атак. Количество поглощаемого урона не зависит от уровня редкости доспеха.

items.equipment.armor.glyphs.brimstone.name=%s жара
items.equipment.armor.glyphs.brimstone.desc=Эта руна защищает носителя и его вещи от языков пламени, давая полную неуязвимость к огню.

items.equipment.armor.glyphs.camouflage.name=%s маскировки
items.equipment.armor.glyphs.camouflage.desc=Эта руна позволяет своему владельцу становится незаметным на фоне высокой травы, даруя ему кратковременную невидимость.

items.equipment.armor.glyphs.entanglement.name=%s опутывания
items.equipment.armor.glyphs.entanglement.desc=Эта руна наращивает земляную броню вокруг носителя, поглощая урон, но такая броня разрушится, если носитель сдвинется с места.

items.equipment.armor.glyphs.flow.name=%s амфибии
items.equipment.armor.glyphs.flow.desc=Эта руна манипулирует течением воды вокруг владельца, значительно увеличивая его скорость передвижения в воде.

items.equipment.armor.glyphs.obfuscation.name=%s темноты
items.equipment.armor.glyphs.obfuscation.desc=Доспех, на который нанесена эта руна, размывает очертания владельца, делая его менее заметным.

items.equipment.armor.glyphs.potential.name=%s напряжения
items.equipment.armor.glyphs.potential.desc=Эта руна накапливает энергию при попадании по ней, заряжая палочки носителя при активации.

items.equipment.armor.glyphs.repulsion.name=%s отталкивания
items.equipment.armor.glyphs.repulsion.desc=Эта руна способна отразить силу удара в сторону атакующего, отталкивая его назад.

items.equipment.armor.glyphs.stone.name=%s гранита
items.equipment.armor.glyphs.stone.desc=Эта руна покрывает доспех толстым слоем камня, что делает уклонение невозможным, но увеличивает защиту пропорционально уклонению.

items.equipment.armor.glyphs.swiftness.name=%s скорости
items.equipment.armor.glyphs.swiftness.desc=Эта руна увеличивает скорость владельца, но только, пока вблизи нет врага.

items.equipment.armor.glyphs.thorns.name=%s шипов
items.equipment.armor.glyphs.thorns.desc=Эта могущественная руна вызывает кровотечение у тех, кто посмел поднять руку на владельца.

items.equipment.armor.glyphs.viscosity.name=%s вязкости
items.equipment.armor.glyphs.viscosity.deferred=отложено %d
items.equipment.armor.glyphs.viscosity$defereddamage.name=отложенный урон
items.equipment.armor.glyphs.viscosity$defereddamage.ondeath=Вы погибли от отложенного урона...
items.equipment.armor.glyphs.viscosity$defereddamage.rankings_desc=Погиб от отложенного урона
items.equipment.armor.glyphs.viscosity$defereddamage.desc=Урон наносится постепенно, вместо того, чтобы наноситься сразу.\n\nОсталось ходов с отложенным уроном: %d.
items.equipment.armor.glyphs.viscosity.desc=Руна способна накапливать получаемый носителем урон, отдавая его со временем, а не весь сразу.



###armor
items.equipment.armor.armor.ac_detach=ОТКРЕПИТЬ
items.equipment.armor.armor.detach_seal=Вы открепили печать от брони.
items.equipment.armor.armor.equip_cursed=Броня больно сжимает ваше тело.
items.equipment.armor.armor.identify=Вы использовали ваш доспех достаточно долго для того, чтобы опознать его.
items.equipment.armor.armor.hardening_gone=Закалка на этой броне стерлась!
items.equipment.armor.armor.incompatible=Взаимодействие разных типов магии стерло руну с этой брони!
items.equipment.armor.armor.curr_absorb=Эта броня _%1$d-го уровня_ поглощает _%2$d-%3$d урона_ за удар и требует _%4$d очков силы_ для комфортного использования.
items.equipment.armor.armor.avg_absorb=Как правило, такая броня _%1$d-го уровня_ поглощает _%2$d-%3$d урона_ за удар и требует _%4$d очков силы_ для комфортного использования.
items.equipment.armor.armor.too_heavy=Вы недостаточно сильны для того, чтобы носить эту броню, поэтому в ней ваша защита, уклонение и скорость передвижения будут понижены.
items.equipment.armor.armor.probably_too_heavy=Вероятно, эта броня будет слишком тяжела для вас.
items.equipment.armor.armor.excess_str=Благодаря избыточной силе вы _лучше уклоняетесь_ в этой броне.
items.equipment.armor.armor.evasion=Этот доспех сбалансирован, чтобы увеличивать _уклонение._
items.equipment.armor.armor.defense=Этот доспех сбалансирован, чтобы увеличивать _защиту._
items.equipment.armor.armor.inscribed=носит начертание _%s._
items.equipment.armor.armor.glyph_hardened=Подверглось _закалке_.
items.equipment.armor.armor.hardened_no_glyph=Эта броня прошла _закалку,_ но сейчас на ней не начертана руна.
items.equipment.armor.armor.cursed_worn=Ваша броня проклята, и вы не в силах снять её.
items.equipment.armor.armor.cursed=Вы чувствуете недобрую магию, таящуюся в этой броне.
items.equipment.armor.armor.weak_cursed=Даже несмотря на то, что броня проклята, вы можете снять её.
items.equipment.armor.armor.not_cursed=Эта броня не проклята.
items.equipment.armor.armor.seal_attached=Сломанная печать Воина прикреплена к этой броне. Когда он будет ранен ниже половины здоровья, она даст ему _%d щита_.
items.equipment.armor.armor.seal_transfer=Сломанная печать Воина должна быть прикреплена к его доспехам, которые он носит в данный момент, чтобы принести ему пользу. Хотите ли вы автоматически снять печать с доспехов, которые вы снимаете, и прикрепить ее к доспехам, которые вы экипируете?
items.equipment.armor.armor.seal_transfer_yes=Да
items.equipment.armor.armor.seal_transfer_no=Нет
items.equipment.armor.armor$glyph.glyph=руны
items.equipment.armor.armor$glyph.killed=%s убила вас...
items.equipment.armor.armor$glyph.rankings_desc=Убит руной
items.equipment.armor.armor$glyph.discover_hint=Вы можете случайно найти предмет с этим эффектом в подземелье или попытаться самому нанести его на предмет.

items.equipment.armor.classarmor.ac_ability=ВЫБЕРИТЕ СПОСОБНОСТЬ
items.equipment.armor.classarmor.ac_transfer=ПЕРЕНОС
items.equipment.armor.classarmor.no_ability=Ваша броня не имеет способности в данный момент, вы можете выбрать одну из них!
items.equipment.armor.classarmor.not_equipped=Вам надо надеть эту броню, чтобы использовать даруемые ей способности!
items.equipment.armor.classarmor.low_charge=У брони недостаточно заряда, чтобы использовать ее особые способности!
items.equipment.armor.classarmor.charge_use=Применяя способность сейчас, вы потратите _%s_ заряда.
items.equipment.armor.classarmor.transfer_title=Перенести Броню
items.equipment.armor.classarmor.transfer_desc=Магия короны короля дворфов может быть перенесена на другую броню. Заметьте, что прошлая броня будет уничтожена в процессе.
items.equipment.armor.classarmor.transfer_prompt=Выберете Броню
items.equipment.armor.classarmor.transfer_cancel=Отменить
items.equipment.armor.classarmor.transfer_complete=Свойства вашей героической брони были перенесены!
items.equipment.armor.classarmor.discover_hint=Вы можете найти этот предмет после победы над боссом 20 этажа определённым героем.

items.equipment.armor.clericarmor.name=облачение героя
items.equipment.armor.clericarmor.desc=Носив эту смесь ткани и доспехов, Клирик может использовать особую способность.

items.equipment.armor.clotharmor.name=тканая броня
items.equipment.armor.clotharmor.desc=Эта легкая броня обеспечивает минимальную защиту. Лучше, чем ничего.
items.equipment.armor.clotharmor.discover_hint=Один из героев начинает с этим предметом.

items.equipment.armor.duelistarmor.name=нагрудник героя
items.equipment.armor.duelistarmor.desc=Пока надеты эти броня и плащ, Дуэлянт может использовать особую способность.

items.equipment.armor.huntressarmor.name=плащ героя
items.equipment.armor.huntressarmor.no_enemies=Нет врагов в поле зрения
items.equipment.armor.huntressarmor.desc=Пока Охотница носит этот плащ, она может использовать особую способность.

items.equipment.armor.leatherarmor.name=кожаная броня
items.equipment.armor.leatherarmor.desc=Броня из выделанной шкуры какого-то животного. Она не так легка, как тканевая, но зато обеспечивает большую защиту.

items.equipment.armor.magearmor.name=мантия героя
items.equipment.armor.magearmor.desc=В этом великолепном одеянии Маг может использовать особую способность.

items.equipment.armor.mailarmor.name=кольчужная броня
items.equipment.armor.mailarmor.desc=Переплетенные металлические кольца позволяют сочетать хорошую защиту с достаточной гибкостью.

items.equipment.armor.platearmor.name=латная броня
items.equipment.armor.platearmor.desc=Эти толстые металлические пластины, скрепленные в один доспех, способны обеспечить несравнимую защиту тому, кто в силах вынести их невероятную тяжесть.

items.equipment.armor.roguearmor.name=одежда героя
items.equipment.armor.roguearmor.desc=Надевая это темное одеяние, Разбойник может использовать особую способность.

items.equipment.armor.scalearmor.name=пластинчатая броня
items.equipment.armor.scalearmor.desc=Вшитые в кожаный жилет железные полоски создают гибкую, но надежную броню.

items.equipment.armor.warriorarmor.name=латная броня героя
items.equipment.armor.warriorarmor.desc=Пока надеты тяжёлые латные доспехи, Воин может использовать особую способность.



###artifacts
items.equipment.artifacts.alchemiststoolkit.name=набор алхимика
items.equipment.artifacts.alchemiststoolkit.ac_brew=СВАРИТЬ
items.equipment.artifacts.alchemiststoolkit.ac_cooking=ПРИГОТОВИТЬ
items.equipment.artifacts.alchemiststoolkit.ac_create=СОЗДАТЬ (ИСТ.)
items.equipment.artifacts.alchemiststoolkit.prompt=Выберите зелье для варки
items.equipment.artifacts.alchemiststoolkit.waste=Ни одно из использованных зелий, похоже, не создало нужную реакцию.
items.equipment.artifacts.alchemiststoolkit.prefect=Созданная вами комбинация кажется идеальной!
items.equipment.artifacts.alchemiststoolkit.bestbrew=Эта комбинация лучше предыдущей!
items.equipment.artifacts.alchemiststoolkit.bdorder= зелий отреагировали хорошо, 
items.equipment.artifacts.alchemiststoolkit.right= зелий находятся на нужных местах.
items.equipment.artifacts.alchemiststoolkit.desc=Этот набор сделал великий алхимик. Он содержит реагенты, растения и сосуд для смешивания, позволяя заниматься алхимией и готовкой где угодно.\n\nПри движении колбочки сталкиваются и тихо позвякивают.
items.equipment.artifacts.alchemiststoolkit.desc_cursed=Этот набор проклят и заставляет вас тратить больше семян на приготовление зелий.
items.equipment.artifacts.alchemiststoolkit.level_zero=Набору нужна смесь реагентов. Чтобы создать её, найдите 3 разных зелья и расположите их в правильном порядке.
items.equipment.artifacts.alchemiststoolkit.level_ten=Созданный вами реагент идеален, и набор работает с максимальной эффективностью.
items.equipment.artifacts.alchemiststoolkit.make_from=Ваша лучшая текущая смесь сделана из: 
items.equipment.artifacts.alchemiststoolkit.need_fix=Смесь реагентов в наборе неполна, её нужно испытать снова.
items.equipment.artifacts.alchemiststoolkit.addpotion=Вы добавляете зелье в набор.
items.equipment.artifacts.alchemiststoolkit.have_add=Это зелье уже есть в вашей смеси.
items.equipment.artifacts.alchemiststoolkit.know_first=Сначала нужно опознать это зелье.

items.equipment.artifacts.artifact.cannot_wear_two=Вы не можете использовать два одинаковых артефакта.
items.equipment.artifacts.artifact.equip_cursed=Артефакт больно впивается в ваше тело.
items.equipment.artifacts.artifact.curse_known=Вы чувствуете недобрую магию, таящуюся в этом артефакте.
items.equipment.artifacts.artifact.not_cursed=Этот артефакт не проклят.
items.equipment.artifacts.artifact.need_to_equip=Вам необходимо надеть артефакт, чтобы его использовать.

items.equipment.artifacts.capeofthorns.name=шипастый плащ
items.equipment.artifacts.capeofthorns.ac_needling=ПРОБУДИТЬ ШИПЫ (ИСТ.)
items.equipment.artifacts.capeofthorns.desc=Груда металлических листов, оставшихся от DM-300, собралась в грубый плащ. В нём таится какая-то энергия, быть может, часть сил DM-300?\n\nПо отчетам исследований лаборатории гномов, он может вытягивать энергию из вражеских атак и возвращает её атакующему. От также увеличивает шанс найти семена.
items.equipment.artifacts.capeofthorns.desc_inactive=Тяжесть плаща успокаивает вас. Похоже, он питается энергией от полученных вами ударов.
items.equipment.artifacts.capeofthorns.desc_active=Плащ излучает накопленную энергию, защищая владельца.
items.equipment.artifacts.capeofthorns$thorns.inert=Ваш Плащ вернулся в нормальное состояние.
items.equipment.artifacts.capeofthorns$thorns.radiating=Ваш Плащ начал излучать энергию, которая защищает вас!
items.equipment.artifacts.capeofthorns$thorns.levelup=Ваш Плащ стал сильнее!
items.equipment.artifacts.capeofthorns$thorns.name=шипы
items.equipment.artifacts.capeofthorns$thorns.desc=Ваш плащ излучает энергию, окружая вас отражающим полем!\n\nВо время действия эффекта весь получаемый урон снижен. К тому же, если атакующий стоит рядом с вами, он получит обратно отражённый урон.\n\nХодов осталось: %s.

items.equipment.artifacts.chaliceofblood.name=кровавая чаша
items.equipment.artifacts.chaliceofblood.ac_prick=УКОЛОТЬСЯ
items.equipment.artifacts.chaliceofblood.yes=Да, я знаю, что я делаю
items.equipment.artifacts.chaliceofblood.no=Нет, я передумал
items.equipment.artifacts.chaliceofblood.prick_warn=С каждым использованием чаши, она истощает все больше ваших жизненных сил, но взамен дарует ускоренную регенерацию здоровья.\n\nЧаша нанесет _%1$d-%2$d урона_ при уколе, хотя урон может быть уменьшен как _физическим, так и магическим блоком, или уменьшением урона._ Без учета уменьшающих урон эффектов, укол, на текущий момент, имеет _шанс в %3$s%%_ истощить ваши жизненные силы полностью. \n\nВы уверены, что хотите предложить чаше больше своих жизненных сил?
items.equipment.artifacts.chaliceofblood.onprick=Вы роняете каплю своей крови в чашу, отдавая ей часть своей жизненной энергии.
items.equipment.artifacts.chaliceofblood.ondeath=Чаша осушила вас до конца...
items.equipment.artifacts.chaliceofblood.desc=Блестящая серебряная чаша с острыми кристаллами на кромке.
items.equipment.artifacts.chaliceofblood.desc_cursed=Эта чаша проклята и не позволит выпустить себя из рук. Её влияние замедляет естественное заживление ран.
items.equipment.artifacts.chaliceofblood.desc_1=Держа чашу в руках, вы чувствуете странное желание уколоть себя этими острыми кристаллами.
items.equipment.artifacts.chaliceofblood.desc_2=Часть вашей крови собралась в чаше, едва заметно можно почувствовать, как чаша питает вас жизненной силой, увеличивая естественную регенерацию здоровья. Вы все еще хотите пустить больше крови в чашу, хотя вы знаете, что это будет больно.
items.equipment.artifacts.chaliceofblood.desc_3=Чаша до краёв наполнена вашей энергией. Вы чувствуете, как она возвращает её вам.

items.equipment.artifacts.cloakofshadows.name=Плащ теней
items.equipment.artifacts.cloakofshadows.ac_stealth=УКРЫТЬСЯ
items.equipment.artifacts.cloakofshadows.ac_shadow=ОКУТАТЬСЯ ТЕНЬЮ (ИСТ.)
items.equipment.artifacts.cloakofshadows.cooldown=Плащу требуется ещё %d ходов для перезарядки.
items.equipment.artifacts.cloakofshadows.cursed=Вы не можете использовать проклятый плащ.
items.equipment.artifacts.cloakofshadows.no_charge=Ваш плащ недостаточно заряжен, чтобы его можно было использовать.
items.equipment.artifacts.cloakofshadows.desc=Бесценный волшебный плащ, много лет назад украденный Разбойником из королевской оружейной. Носящий плащ может на короткое время становиться невидимым.\n\nЧем больше плащ используется. тем сильнее он становится, позволяя Разбойнику становиться невидимым чаще и на больший срок.
items.equipment.artifacts.cloakofshadows.discover_hint=Один из героев начинает с этим предметом.
items.equipment.artifacts.cloakofshadows$cloakstealth.no_charge=Ваш плащ полностью разрядился.
items.equipment.artifacts.cloakofshadows$cloakstealth.levelup=Ваш плащ стал сильнее!
items.equipment.artifacts.cloakofshadows$cloakstealth.name=Маскировка
items.equipment.artifacts.cloakofshadows$cloakstealth.desc=Укрывшись под плащом теней, вы получили временную невидимость.\n\nВ этом состоянии враги не атакуют и не преследуют вас. Атака или использование магии (например, свитка или палочки) немедленно рассеет невидимость.\n\nВы останетесь скрыты, пока не отмените эффект или у плаща не иссякнет энергия.

items.equipment.artifacts.driedrose.name=засохшая роза
items.equipment.artifacts.driedrose.ac_summon=ПРИЗВАТЬ
items.equipment.artifacts.driedrose.ac_direct=НАПРАВИТЬ
items.equipment.artifacts.driedrose.ac_outfit=СНАРЯДИТЬ
items.equipment.artifacts.driedrose.ac_soulbless=БЛАГОСЛОВИТЬ ДУШУ (ИСТ.)
items.equipment.artifacts.driedrose.spawned=Вы уже призвали призрака.
items.equipment.artifacts.driedrose.no_charge=Ваша роза ещё не заряжена.
items.equipment.artifacts.driedrose.cursed=Вы не можете использовать проклятую розу.
items.equipment.artifacts.driedrose.no_space=Рядом с вами нет свободного места.
items.equipment.artifacts.driedrose.charged=Ваша роза полностью заряжена!
items.equipment.artifacts.driedrose.desc=Не та ли это роза, о которой упоминал тот призрак перед тем как исчезнуть? Кажется, в ней есть какая-то духовная сила. Возможно, с её помощью можно призвать дух того погибшего воина...
items.equipment.artifacts.driedrose.desc_no_quest=Старая засохшая роза, которая каким-то образом уцелела через столько лет.\n\nВы чувствуете, что в ней теплится какая-то сила, однако понятия не имеете, как эту силу использовать.
items.equipment.artifacts.driedrose.desc_hint=Не хватает нескольких лепестков. Наверное, роза станет могущественнее, если их вернуть.
items.equipment.artifacts.driedrose.desc_cursed=Проклятая роза оплетает вашу руку. От неё сильно веет холодом.
items.equipment.artifacts.driedrose.desc_weapon=Оружие призрака: %s
items.equipment.artifacts.driedrose.desc_armor=Броня призрака: %s
items.equipment.artifacts.driedrose.desc_strength=Сила призрака: %s
items.equipment.artifacts.driedrose$petal.name=засохший лепесток
items.equipment.artifacts.driedrose$petal.no_rose=У вас нет розы, к которой можно прикрепить этот лепесток.
items.equipment.artifacts.driedrose$petal.no_room=Для этого лепестка не осталось места, вы его выбрасываете.
items.equipment.artifacts.driedrose$petal.maxlevel=Теперь все лепестки на месте!
items.equipment.artifacts.driedrose$petal.levelup=Вы прикрепляете лепесток к розе.
items.equipment.artifacts.driedrose$petal.desc=Хрупкий высушенный лепесток. Как он оказался здесь в целости и сохранности?
items.equipment.artifacts.driedrose$wndghosthero.title=Экипировка призрака
items.equipment.artifacts.driedrose$wndghosthero.desc=Призрак не особенно силен сам по себе, но он достаточно осязаем, чтобы носить оружие и доспехи. Он сможет использовать их точно так же, как и вы.\n\nВ данный момент призрак может экипировать вещи, требующие не более _%d ед. силы._
items.equipment.artifacts.driedrose$wndghosthero.weapon_prompt=Выберите оружие
items.equipment.artifacts.driedrose$wndghosthero.armor_prompt=Выберите доспехи
items.equipment.artifacts.driedrose$wndghosthero.cant_unique=Призрак не способен использовать уникальные предметы.
items.equipment.artifacts.driedrose$wndghosthero.cant_unidentified=Вам ничего толком не известно об этом предмете.
items.equipment.artifacts.driedrose$wndghosthero.cant_cursed=Призрак может использовать только ту экипировку, которая, вы уверены, не проклята.
items.equipment.artifacts.driedrose$wndghosthero.cant_strength_unknown=Призрак может быть слишком слаб для того, чтобы это использовать.
items.equipment.artifacts.driedrose$wndghosthero.cant_strength=Призрак слишком слаб для того, чтобы это использовать.

##ghost hero
items.equipment.artifacts.driedrose$ghosthero.name=печальный призрак
items.equipment.artifacts.driedrose$superghosthero.name=Безумный призрак
items.equipment.artifacts.driedrose$superghosthero.desc=Бесплотная фигура, очертаниями напоминающая женщину. Похоже, её сила зависит от розы, что вы держите в руках.\n\nЭтот призрак женщины, чище меня...
items.equipment.artifacts.driedrose$ghosthero.def_verb=уклоняется
items.equipment.artifacts.driedrose$ghosthero.discover_hint=Вы можете найти этого персонажа с помощью определённого артефакта.

items.equipment.artifacts.driedrose$ghosthero.hello=И снова здравствуй, %s.
items.equipment.artifacts.driedrose$ghosthero.introduce=Мой дух связан с этой розой. Она была очень дорога мне - это подарок от очень важного для меня человека, чью любовь я оставил на поверхности.\n\nЯ не могу к нему вернуться, но благодаря тебе у меня появился второй шанс завершить свой путь. Я отвечу на твой зов и буду биться за тебя, когда смогу.\n\nПока роза у тебя, я могу слышать твой голос, таким образом ты можешь использовать её, чтобы направить меня издалека.\n\nНадеюсь, ты справишься там, где не справился я...

items.equipment.artifacts.driedrose$ghosthero.dialogue_sewers_1=Эти канализации когда-то были безопасны, люди даже жили тут во время зимы.
items.equipment.artifacts.driedrose$ghosthero.dialogue_sewers_2=Интересно, что случилось с теми, кто патрулировал это место?
items.equipment.artifacts.driedrose$ghosthero.dialogue_sewers_3=У меня была семья на поверхности. Я надеюсь, что они в безопасности.
items.equipment.artifacts.driedrose$ghosthero.dialogue_sewers_4=Стражники не смогли одолеть этих монстров... Но, может, это сможем мы.
items.equipment.artifacts.driedrose$ghosthero.dialogue_sewers_5=Если даже канализация настолько опасна, боюсь представить, что творится ниже...
items.equipment.artifacts.driedrose$ghosthero.dialogue_sewers_6=Что заставило этих крыс и крабов вырасти до таких размеров?
items.equipment.artifacts.driedrose$ghosthero.dialogue_prison_1=Я слышал разные истории об этом месте, но ни одной хорошей.
items.equipment.artifacts.driedrose$ghosthero.dialogue_prison_2=Это место всегда было скорее лабиринтом, чем тюрьмой.
items.equipment.artifacts.driedrose$ghosthero.dialogue_prison_3=Боюсь даже представить, что тут началось, когда это место объявили заброшенным.
items.equipment.artifacts.driedrose$ghosthero.dialogue_prison_4=Похоже на то, что и заключенные, и стражники превратились в монстров.
items.equipment.artifacts.driedrose$ghosthero.dialogue_prison_5=Что же могло вернуть этих мертвецов к жизни?
items.equipment.artifacts.driedrose$ghosthero.dialogue_prison_6=Эти люди не должны были закончить вот так...
items.equipment.artifacts.driedrose$ghosthero.dialogue_caves_1=Здесь не было ни людей, ни дворфов в течении очень долгого времени.
items.equipment.artifacts.driedrose$ghosthero.dialogue_caves_2=Что могло заставить дворфов покинуть золотые рудники?
items.equipment.artifacts.driedrose$ghosthero.dialogue_caves_3=Жалко, что всё золото здесь будет бесполезным на поверхности.
items.equipment.artifacts.driedrose$ghosthero.dialogue_caves_4=Существа в этих пещерах мутировали, прямо как в канализации.
items.equipment.artifacts.driedrose$ghosthero.dialogue_caves_5=Даже летучие мыши здесь стали кровожадными.
items.equipment.artifacts.driedrose$ghosthero.dialogue_caves_6=Ни следа горного оборудования, неужели дворфы все разворовали?
items.equipment.artifacts.driedrose$ghosthero.dialogue_city_1=Дворфы были трудолюбивыми, но жадными.
items.equipment.artifacts.driedrose$ghosthero.dialogue_city_2=Значит, столица дворфов действительно пала.
items.equipment.artifacts.driedrose$ghosthero.dialogue_city_3=Надеюсь, что город наверху никогда таким не станет.
items.equipment.artifacts.driedrose$ghosthero.dialogue_city_4=Дворфы не должны выглядеть настолько бледными.
items.equipment.artifacts.driedrose$ghosthero.dialogue_city_5=Я не знаю, что хуже - дворфы или их творения.
items.equipment.artifacts.driedrose$ghosthero.dialogue_city_6=Похоже, дворфы сейчас такие же безмозглые монстры.
items.equipment.artifacts.driedrose$ghosthero.dialogue_halls_1=Что это за место?
items.equipment.artifacts.driedrose$ghosthero.dialogue_halls_2=Это место вызывает ужас...
items.equipment.artifacts.driedrose$ghosthero.dialogue_halls_3=О чём думали дворфы, играясь с такой силой?
items.equipment.artifacts.driedrose$ghosthero.dialogue_halls_4=Монстры здесь будто не из нашего мира, откуда они взялись?
items.equipment.artifacts.driedrose$ghosthero.dialogue_halls_5=Ты чувствуешь это? За нами будто что-то наблюдает.
items.equipment.artifacts.driedrose$ghosthero.dialogue_halls_6=Слава богу, здесь есть факелы, тут так темно!
items.equipment.artifacts.driedrose$ghosthero.dialogue_ascension_1=Почему это происходит, я думал, у нас все получилось?
items.equipment.artifacts.driedrose$ghosthero.dialogue_ascension_2=Каким образом эта штука все еще способна влиять на этот мир?
items.equipment.artifacts.driedrose$ghosthero.dialogue_ascension_3=Надеюсь, вы знаете, что нужно сделать с этим амулетом.
items.equipment.artifacts.driedrose$ghosthero.dialogue_ascension_4=Полагаю, мы еще не закончили путешествие.
items.equipment.artifacts.driedrose$ghosthero.dialogue_ascension_5=Мы уже зашли так далеко, мы сможем довести это до конца!
items.equipment.artifacts.driedrose$ghosthero.dialogue_ascension_6=Еще чуть-чуть, и мы сможем выбраться отсюда!

items.equipment.artifacts.driedrose$ghosthero.seen_goo_1=Остерегайся Слизня!
items.equipment.artifacts.driedrose$ghosthero.seen_goo_2=Много моих друзей погибло от этой твари, настало время отмщения!
items.equipment.artifacts.driedrose$ghosthero.seen_goo_3=Нельзя позволить такой мерзости жить!
items.equipment.artifacts.driedrose$ghosthero.seen_tengu_1=Единственный оставшийся заключенный - смертельный убийца. Ну конечно...
items.equipment.artifacts.driedrose$ghosthero.seen_tengu_2=Мы в ловушке!
items.equipment.artifacts.driedrose$ghosthero.seen_tengu_3=Я слышал ужасные истории об этой маске...
items.equipment.artifacts.driedrose$ghosthero.seen_dm300_1=Только дворфы могли создать шахтерскую машину и оставить её убивать незваных гостей.
items.equipment.artifacts.driedrose$ghosthero.seen_dm300_2=Эта штука огромна...
items.equipment.artifacts.driedrose$ghosthero.seen_dm300_3=Как эта штука оставалась активной так долго?
items.equipment.artifacts.driedrose$ghosthero.seen_king_1=Когда люди говорят, что власть развращает, это именно то, что они имеют в виду.
items.equipment.artifacts.driedrose$ghosthero.seen_king_2=Теперь он больше лич, чем король.
items.equipment.artifacts.driedrose$ghosthero.seen_king_3=Даже после смерти дворфы подчиняются своему хозяину.
items.equipment.artifacts.driedrose$ghosthero.seen_yog_1=Ох, это не выглядит хорошо.
items.equipment.artifacts.driedrose$ghosthero.seen_yog_2=Так вот как выглядит бог?
items.equipment.artifacts.driedrose$ghosthero.seen_yog_3=Это будет больно...

items.equipment.artifacts.driedrose$ghosthero.defeated_by_enemy_1=Удачи...
items.equipment.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Устал...пока что...
items.equipment.artifacts.driedrose$ghosthero.defeated_by_enemy_3=Я вернусь...
items.equipment.artifacts.driedrose$ghosthero.defeated_by_boss_1=Прости... удачи...
items.equipment.artifacts.driedrose$ghosthero.defeated_by_boss_2=Прикончи это... без меня...
items.equipment.artifacts.driedrose$ghosthero.defeated_by_boss_3=Нет... Я не могу...
items.equipment.artifacts.driedrose$ghosthero.blessed_ankh_1=Как ты пережил это?
items.equipment.artifacts.driedrose$ghosthero.blessed_ankh_2=Хотел бы я себе такой...
items.equipment.artifacts.driedrose$ghosthero.blessed_ankh_3=Боже мой! Ты еще жив!
items.equipment.artifacts.driedrose$ghosthero.player_killed_1=Нет!...
items.equipment.artifacts.driedrose$ghosthero.player_killed_2=Я не смог ничем помочь...
items.equipment.artifacts.driedrose$ghosthero.player_killed_3=Только не это...

items.equipment.artifacts.driedrose$ghosthero.direct_prompt=Что мне делать?
items.equipment.artifacts.driedrose$ghosthero.directed_follow_1=Хорошо, я пойду за тобой.
items.equipment.artifacts.driedrose$ghosthero.directed_follow_2=Я буду рядом.
items.equipment.artifacts.driedrose$ghosthero.directed_follow_3=Следую за тобой...
items.equipment.artifacts.driedrose$ghosthero.directed_follow_4=Хорошо, идем!
items.equipment.artifacts.driedrose$ghosthero.directed_follow_5=Я тебя прикрою.
items.equipment.artifacts.driedrose$ghosthero.directed_attack_1=Хорошо, я нападу на него.
items.equipment.artifacts.driedrose$ghosthero.directed_attack_2=Я займусь этим.
items.equipment.artifacts.driedrose$ghosthero.directed_attack_3=Вступаю в бой...
items.equipment.artifacts.driedrose$ghosthero.directed_attack_4=За ними!
items.equipment.artifacts.driedrose$ghosthero.directed_attack_5=Положись на меня.
items.equipment.artifacts.driedrose$ghosthero.directed_position_1=Хорошо, я займу эту позицию.
items.equipment.artifacts.driedrose$ghosthero.directed_position_2=Я пойду туда и буду обороняться.
items.equipment.artifacts.driedrose$ghosthero.directed_position_3=Меняю позицию...
items.equipment.artifacts.driedrose$ghosthero.directed_position_4=В пути!
items.equipment.artifacts.driedrose$ghosthero.directed_position_5=Я пойду туда.

items.equipment.artifacts.driedrose$ghosthero.desc=Бесплотная фигура, очертаниями напоминающая истощенного человека. Похоже, её сила зависит от розы, что вы держите в руках.\n\nЭтот призрак, может, и не такой уж могущественный союзник, но он - единственный, кого вы можете назвать своим другом в этом подземелье.

##back to artifacts
items.equipment.artifacts.etherealchains.name=призрачные цепи
items.equipment.artifacts.etherealchains.ac_cast=КИНУТЬ
items.equipment.artifacts.etherealchains.ac_locked=ЗАПЕЧАТАТЬ (ИСТ.)
items.equipment.artifacts.etherealchains.rooted=Цепи не могут вас перенести, пока вы оплетены.
items.equipment.artifacts.etherealchains.no_charge=Ваши цепи слишком короткие для этого.
items.equipment.artifacts.etherealchains.cursed=Вы не можете использовать проклятые цепи.
items.equipment.artifacts.etherealchains.does_nothing=Это бесполезно.
items.equipment.artifacts.etherealchains.cant_pull=Ваши цепи не способны притянуть этого врага.
items.equipment.artifacts.etherealchains.cant_reach=Ваши цепи сюда не дотянутся.
items.equipment.artifacts.etherealchains.inside_wall=Ваши цепи не способны перенести вас внутрь стены.
items.equipment.artifacts.etherealchains.nothing_to_grab=Здесь не к чему притянуться.
items.equipment.artifacts.etherealchains.prompt=Выберите место или цель.
items.equipment.artifacts.etherealchains.desc=Эти толстые, но лёгкие цепи мерцают духовной энергией. Их можно использовать для того, чтобы быстро переместить себя к стене или притянуть кого-то другого поближе. Благодаря призрачной сущности цепей вы сможете даже проходить сквозь стены!
items.equipment.artifacts.etherealchains.desc_cursed=Проклятые цепи обмотались вокруг вас, они постоянно раскачиваются, пытаясь свалить вас с ног или зацепиться за что-нибудь.
items.equipment.artifacts.etherealchains.desc_equipped=Цепи свисают с вас, медленно поглощая души убитых вами врагов. Каждый заряд - это звено в цепи, способное преодолеть ровно одну клетку.
items.equipment.artifacts.etherealchains$chainsrecharge.levelup=Ваши цепи стали длиннее!

items.equipment.artifacts.holytome.name=священный том
items.equipment.artifacts.holytome.ac_cast=ПРИМЕНИТЬ
items.equipment.artifacts.holytome.no_spell=Вы не можете применить это заклинание прямо сейчас.
items.equipment.artifacts.holytome.cursed=Вы не можете использовать проклятый том.
items.equipment.artifacts.holytome.levelup=Ваш том стал сильнее!
items.equipment.artifacts.holytome.desc=Священный том, который служит фокусом для божественной магии Клирика. Использование тома позволяет Клирику накладывать различные магические заклинания.\n\nТом будет постепенно становиться более мощным по мере его использования, увеличивая максимальное количество зарядов и немного ускоряя восстановление зарядов.
items.equipment.artifacts.holytome.discover_hint=Один из героев начинает с этим предметом.

items.equipment.artifacts.hornofplenty.name=рог изобилия
items.equipment.artifacts.hornofplenty.ac_snack=ПЕРЕКУСИТЬ
items.equipment.artifacts.hornofplenty.ac_eat=СЪЕСТЬ
items.equipment.artifacts.hornofplenty.ac_store=ПОЛОЖИТЬ
items.equipment.artifacts.hornofplenty.ac_feed=ПИРОВАТЬ (ИСТ.)
items.equipment.artifacts.hornofplenty.eat=Вы едите из рога.
items.equipment.artifacts.hornofplenty.prompt=Выберите еду
items.equipment.artifacts.hornofplenty.no_food=Рог пуст!
items.equipment.artifacts.hornofplenty.full=Рог полон еды!
items.equipment.artifacts.hornofplenty.reject=Рог отвергает сырой пустофрукт.
items.equipment.artifacts.hornofplenty.maxlevel=Рог поглотил всю еду, что мог!
items.equipment.artifacts.hornofplenty.levelup=Рог поглощает вашу еду, становясь сильнее!
items.equipment.artifacts.hornofplenty.feed=Рог поглощает пожертвованную еду.
items.equipment.artifacts.hornofplenty.desc=Подудеть в этот рог не получится, но зато он постепенно наполняется едой.
items.equipment.artifacts.hornofplenty.desc_hint=Возможно, рог можно усилить, скормив ему что-нибудь.
items.equipment.artifacts.hornofplenty.desc_cursed=Проклятый рог связан с вами, и он скорее будет пожирать еду, нежели производить её.

items.equipment.artifacts.lloydsbeacon.name=маяк Ллойда
items.equipment.artifacts.lloydsbeacon.ac_set=УСТАНОВИТЬ
items.equipment.artifacts.lloydsbeacon.ac_return=ВЕРНУТЬСЯ
items.equipment.artifacts.lloydsbeacon.preventing=Сильная магия этого места не позволяет использовать маяк Ллойда!
items.equipment.artifacts.lloydsbeacon.creatures=Аура ближайших существ не позволяет вам использовать маяк Ллойда.
items.equipment.artifacts.lloydsbeacon.return=Маяк Ллойда установлен на вашу текущую позицию, вы сможете вернуться сюда в любое время.
items.equipment.artifacts.lloydsbeacon.desc=Маяк Ллойда - хитроумное магическое устройство, позволяющее вернуться в уже посещённое место.
items.equipment.artifacts.lloydsbeacon.desc_set=Маяк установлен на %d уровень в Pixel Dungeon.

items.equipment.artifacts.masterthievesarmband.name=нарукавник гильдии воров
items.equipment.artifacts.masterthievesarmband.ac_steal=УКРАСТЬ
items.equipment.artifacts.masterthievesarmband.ac_goldtouch=ПОЛУЧАТЬ ЗОЛОТО (ИСТ.)
items.equipment.artifacts.masterthievesarmband.no_charge=У вашего нарукавника недостаточно заряда.
items.equipment.artifacts.masterthievesarmband.cursed=Вы не можете использовать проклятый нарукавник.
items.equipment.artifacts.masterthievesarmband.no_target=Вы должны выбрать врага в непосредственной близости от вас
items.equipment.artifacts.masterthievesarmband.level_up=Ваш нарукавник становится мощнее!
items.equipment.artifacts.masterthievesarmband.prompt=Выберите врага в качестве цели.
items.equipment.artifacts.masterthievesarmband.desc=Этот фиолетовый нарукавник из бархата несёт на себе знак мастера воровского дела. Вам он не принадлежит, равно как и прошлому владельцу
items.equipment.artifacts.masterthievesarmband.desc_worn=Пока её носят на запястье, вы можете нагло забирать предметы у цели, пока она полностью заряжена.

items.equipment.artifacts.sandalsofnature.name=Сандалии природы
items.equipment.artifacts.sandalsofnature.ac_feed=УДОБРИТЬ
items.equipment.artifacts.sandalsofnature.ac_root=УКОРЕНИТСЯ
items.equipment.artifacts.sandalsofnature.ac_sprout=ПРОРАСТИТЬ (ИСТ.)
items.equipment.artifacts.sandalsofnature.no_charge=У них недостаточно энергии.
items.equipment.artifacts.sandalsofnature.prompt=Выберите семя
items.equipment.artifacts.sandalsofnature.already_fed=Ваша обувь уже удобрялась семенем этого растения.
items.equipment.artifacts.sandalsofnature.levelup=Ваша обувь увеличивается!
items.equipment.artifacts.sandalsofnature.absorb_seed=Обувь поглощает семя, расцветая на глазах.
items.equipment.artifacts.sandalsofnature.prompt_target=Выберите место
items.equipment.artifacts.sandalsofnature.out_of_range=Это место вне досягаемости.
items.equipment.artifacts.sandalsofnature.desc_0=То, что на первый взгляд казалось парой сандалий, оказалось двумя растениями! Они выглядят слабыми и вялыми, может, их стоит удобрить?
items.equipment.artifacts.sandalsofnature.desc_1=Обувь выросла и теперь больше похожа на пару тканых туфель. К ним отчасти вернулся цвет, может, они могут вырасти ещё больше?
items.equipment.artifacts.sandalsofnature.desc_2=Обувь выросла и теперь больше похожа на пару ботинок из коры. Растения выглядят сильными - может, и это не предел?
items.equipment.artifacts.sandalsofnature.desc_3=Растения стали огромными, теперь они похожи на пару бронированных сапог. Они глубокого коричневого цвета и похожи на крепкое дерево.
items.equipment.artifacts.sandalsofnature.desc_hint=Вы чувствуете связь с природой, нося этот артефакт.
items.equipment.artifacts.sandalsofnature.desc_cursed=Проклятые сандалии блокируют всю связь с природой.
items.equipment.artifacts.sandalsofnature.desc_ability=Обувь получила способность формировать подобие неподвижной естественной брони, но ей нужно набраться сил.
items.equipment.artifacts.sandalsofnature.desc_seeds=Вы дали вашей обуви семена %d.

items.equipment.artifacts.skeletonkey.name=костяной ключ
items.equipment.artifacts.skeletonkey.ac_insert=ВСТАВИТЬ
items.equipment.artifacts.skeletonkey.cursed=Ты не можешь использовать проклятый костяной ключ.
items.equipment.artifacts.skeletonkey.prompt=Выберите цель
items.equipment.artifacts.skeletonkey.invalid_target=Здесь нечего запирать или отпирать.
items.equipment.artifacts.skeletonkey.lock_no_space=Ты не можешь запереть персонажа внутри двери!
items.equipment.artifacts.skeletonkey.iron_charges=Вскрытие обычного замка требует 1 заряд.
items.equipment.artifacts.skeletonkey.gold_charges=Вскрытие золотого замка требует 2 заряда.
items.equipment.artifacts.skeletonkey.lock_charges=Чтобы запереть дверь нужно 2 заряда.
items.equipment.artifacts.skeletonkey.wall_charges=Создание временной стены требует 2 заряда.
items.equipment.artifacts.skeletonkey.crystal_charges=Вскрытие хрустального замка требует 5 зарядов.
items.equipment.artifacts.skeletonkey.wont_open=По какой-то причине ключ отказывается помещаться в этот замок.
items.equipment.artifacts.skeletonkey.locked_with_key=Эта дверь была заперта вашим костяным ключом.
items.equipment.artifacts.skeletonkey.force_lock=Замок ослаб и без использования вашего костяного ключа. Вам удалось силой открыть его.
items.equipment.artifacts.skeletonkey.discard=Вы избавляетесь от лишних ключей.
items.equipment.artifacts.skeletonkey.levelup=Ваш костяной ключ становится сильнее!
items.equipment.artifacts.skeletonkey.desc=Важно выглядящий ключ с кольцом в виде черепа. Его лезвие выглядит разным каждый раз, как вы на него смотрите.
items.equipment.artifacts.skeletonkey.desc_worn=Этот магический ключ, кажется, получает силу каждый раз, как вы используете его вместо обычных ключей подземелья. Он может быть вставлен практически в каждый замок, чтобы отпереть, или запереть его, включая двери, которые никогда не были заперты до этого.\n\nКлюч даже может быть использован на пустое место в прямом или диагональном направлении, чтобы "запереть" воздух впереди вас, создавая 3 клетки широкой, плотной стены, которая существует 10 ходов. Запирание оттолкнёт врагов, если есть свободное место.
items.equipment.artifacts.skeletonkey.desc_cursed=Проклятый ключ, кажется, активно сопротивляется помещаться в любой замок и даже мешает (не до невозможности) использовать другие ключи.
items.equipment.artifacts.skeletonkey$keywall.desc=Временная магическая стена была размещена здесь костяным ключом.

items.equipment.artifacts.talismanofforesight.name=талисман предвидения
items.equipment.artifacts.talismanofforesight.ac_scry=ИСПОЛЬЗОВАТЬ
items.equipment.artifacts.talismanofforesight.ac_notice=ПРЕДВИДЕТЬ (ИСТ.)
items.equipment.artifacts.talismanofforesight.no_charge=Ваш Талисман еще не полностью заряжен.
items.equipment.artifacts.talismanofforesight.scry=Талисман наполняет ваш разум знаниями об этом уровне.
items.equipment.artifacts.talismanofforesight.low_charge=Талисман требует как минимум 5% заряда для сканирования.
items.equipment.artifacts.talismanofforesight.prompt=Выберите место для сканирования.
items.equipment.artifacts.talismanofforesight.levelup=Ваш Талисман стал сильнее!
items.equipment.artifacts.talismanofforesight.full_charge=Ваш Талисман полностью заряжен!
items.equipment.artifacts.talismanofforesight.desc=Гладкий камень со странной гравировкой. Вам кажется, что он осматривается вокруг в поисках чего-нибудь скрытого.
items.equipment.artifacts.talismanofforesight.desc_worn=Когда вы держите талисман, вы ощущаете, что ваши чувства усиливаются.
items.equipment.artifacts.talismanofforesight.desc_cursed=Проклятый талисман пристально смотрит на вас, притупляя ваши чувства.
items.equipment.artifacts.talismanofforesight$foresight.name=Прозрение
items.equipment.artifacts.talismanofforesight$foresight.levelup=Ваш Талисман стал сильнее! Кажется, теперь он может предвидеть опасность.
items.equipment.artifacts.talismanofforesight$foresight.full_charge=Ваш Талисман полностью заряжен!
items.equipment.artifacts.talismanofforesight$foresight.uneasy=Вам стало не по себе.
items.equipment.artifacts.talismanofforesight$foresight.desc=Вы сильно нервничаете, будто рядом есть незримая опасность.

items.equipment.artifacts.timekeepershourglass.name=песочные часы хранителя времени
items.equipment.artifacts.timekeepershourglass.ac_activate=ПЕРЕВЕРНУТЬ
items.equipment.artifacts.timekeepershourglass.ac_restart=ПЕРЕЗАГРУЗИТЬ (ИСТ.)
items.equipment.artifacts.timekeepershourglass.in_use=Ваши песочные часы уже используются.
items.equipment.artifacts.timekeepershourglass.deactivate=Вы деактивируете песочные часы.
items.equipment.artifacts.timekeepershourglass.no_charge=В песочных часах недостаточно зарядов для использования.
items.equipment.artifacts.timekeepershourglass.cursed=Вы не можете использовать проклятые песочные часы.
items.equipment.artifacts.timekeepershourglass.onstasis=Мир вокруг вас мгновенно изменился.
items.equipment.artifacts.timekeepershourglass.onfreeze=Мир вокруг вас остановился.
items.equipment.artifacts.timekeepershourglass.stasis=Уйти в стазис
items.equipment.artifacts.timekeepershourglass.freeze=Остановить время
items.equipment.artifacts.timekeepershourglass.prompt=Как вы хотите использовать магию песочных часов?\n\nВ стазисе время вокруг вас идет своим чередом, пока вы недвижимы и неуязвимы.\n\nОстановив время, вы сможете двигаться так, как будто ваши действия мгновенны. Повторное использование часов или атака прервут действие эффекта. 
items.equipment.artifacts.timekeepershourglass.desc=Большие резные песочные часы выглядят просто, но вы чувствуете сильную магию внутри. Поворачивая часы и смотря на текущий песок, вы чувствуете их магию. Она определённо позволит вам управлять временем.
items.equipment.artifacts.timekeepershourglass.desc_hint=В часах не хватает песка, вот бы найти немного...
items.equipment.artifacts.timekeepershourglass.desc_cursed=Проклятые песочные часы прилипли к вам, пытаясь манипулировать временем вокруг вас.
items.equipment.artifacts.timekeepershourglass$timefreeze.name=Заморозка Времени
items.equipment.artifacts.timekeepershourglass$timefreeze.desc=Время застыло вокруг вас, позволяя выполнять действия мгновенно. Эффект будет действовать, пока вы его не отмените или когда у часов закончится энергия. Атака или магия также прервут эффект часов.\n\nХодов осталось: %s.
items.equipment.artifacts.timekeepershourglass$sandbag.name=мешочек с волшебным песком
items.equipment.artifacts.timekeepershourglass$sandbag.levelup=Вы добавили песок в часы.
items.equipment.artifacts.timekeepershourglass$sandbag.maxlevel=Часы полны волшебного песка!
items.equipment.artifacts.timekeepershourglass$sandbag.no_hourglass=У вас нет часов, чтобы поместить в них песок.
items.equipment.artifacts.timekeepershourglass$sandbag.desc=Этот маленький мешочек чистого песка отлично подойдёт к вашим часам.\n\nСтранно, что он появился у торговца как раз тогда, когда понадобился...

items.equipment.artifacts.unstablespellbook.name=нестабильная книга заклинаний
items.equipment.artifacts.unstablespellbook.ac_read=ЧИТАТЬ
items.equipment.artifacts.unstablespellbook.ac_add=ДОБАВИТЬ
items.equipment.artifacts.unstablespellbook.ac_song=ВОСПЕТЬ (ИСТ.)
items.equipment.artifacts.unstablespellbook.blinded=Вы ослеплены и не можете разобрать текст.
items.equipment.artifacts.unstablespellbook.no_charge=Ваша книга заклинаний истощена.
items.equipment.artifacts.unstablespellbook.cursed=Вы не можете читать проклятую книгу.
items.equipment.artifacts.unstablespellbook.update=Книга заклинаний стала сильнее.
items.equipment.artifacts.unstablespellbook.dew_empty=Недостаточно росы.
items.equipment.artifacts.unstablespellbook.prompt=Выберите свиток
items.equipment.artifacts.unstablespellbook.infuse_scroll=Вы наполнили книгу энергией свитка.
items.equipment.artifacts.unstablespellbook.unable_scroll=Вы не можете добавить этот свиток в книгу.
items.equipment.artifacts.unstablespellbook.unknown_scroll=Вы не знаете, что это за свиток.
items.equipment.artifacts.unstablespellbook.desc=Книга выглядит неплохо для своего возраста. Она искрит и потрескивает, когда вы листаете страницы, излучая нестабильную энергию. Вы не можете прочитать конкретное заклинание из книги.
items.equipment.artifacts.unstablespellbook.desc_cursed=Проклятая книга привязалась к вам, она не позволит использовать большинство свитков.
items.equipment.artifacts.unstablespellbook.desc_index=Для следующего улучшения нужно росы: %s.
items.equipment.artifacts.unstablespellbook.desc_empowered=Свитки, что вы добавили в книгу, начали излучать магический свет. Вы можете использовать особую версию эффекта добавленных свитков, но ценой дополнительного заряда.
items.equipment.artifacts.unstablespellbook.read_empowered=Свиток, добавленный вами в книгу излучает энергию. Вы можете направить его энергию в обычный или особый вариант этого же свитка.\n\nВыбор особого свитка потратит две единицы заряда вместо одного.



###bags
items.equipment.bags.bag.name=рюкзак
items.equipment.bags.bag.discover_hint=Вы можете купить этот предмет в магазине.

items.equipment.bags.potionbandolier.name=пояс для зелий
items.equipment.bags.potionbandolier.desc=Этот широкий пояс надевается на грудь, как патронташ. В нём много маленьких кармашков для бутыльков с зельями и жидким металлом. Даже есть место для бурдюка.\n\nКарманы достаточно плотные для того, чтобы не дать бутылькам потрескаться от холода.

items.equipment.bags.scrollholder.name=футляр для свитков
items.equipment.bags.scrollholder.desc=Похоже, раньше этот футляр использовался для хранения астрономических карт, но и для свитков он вполне подойдёт. Здесь есть даже несколько боковых отделений, которые прекрасно подойдут для ваших заклинаний, мистических грифелей и магической смолы.\n\nПохоже, этот футляр огнеупорен, так что сможет защитить ваши свитки от огня.

items.equipment.bags.velvetpouch.name=бархатный мешочек
items.equipment.bags.velvetpouch.desc=В этой небольшой сумочке из бархата можно хранить множество мелких предметов, таких как семена, рунные камни и некоторые алхимические ингредиенты.
items.equipment.bags.velvetpouch.discover_hint=Один из героев начинает с этим предметом.

items.equipment.bags.magicalholster.name=волшебный чехол
items.equipment.bags.magicalholster.desc=Этот зачарованный чехол, сделанный из шкуры какого-то экзотического зверя, позволяет хранить в нем огромное количество метательных оружий.\n\nДостаточно просто запустить руку в чехол, и вы всегда достанете именно то, что искали.\n\nБлагодаря магии чехла, хранящиеся в нём палочки будут перезаряжаться немного быстрее, а метательные оружия будут дольше служить.



###bombs
items.equipment.bombs.arcanebomb.name=магическая бомба
items.equipment.bombs.arcanebomb.desc=Эта бомба была наделена магическими свойствами. Её взрыв будет схож с атакой накачавшегося Слизня, который наносит _%1$d-%2$d магического урона_ всем кто находится в пределах 2 клеток.
items.equipment.bombs.arcanebomb.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.equipment.bombs.bomb.name=бомба
items.equipment.bombs.bomb.ac_lightthrow=ПОДЖЕЧЬ И БРОСИТЬ
items.equipment.bombs.bomb.snuff_fuse=Вы спешно задуваете фитиль бомбы.
items.equipment.bombs.bomb.ondeath=Вас разорвало взрывной волной...
items.equipment.bombs.bomb.rankings_desc=Убит взрывом
items.equipment.bombs.bomb.desc=Довольно крупная бомба, под завязку начиненная черным порохом. Взрыв этой бомбы наносит _%1$d-%2$d урона_ всему, что находится рядом с ней, и разрушает некоторую прилегающую местность или предметы.
items.equipment.bombs.bomb.desc_fuse=Похоже, что фитиль будет гореть несколько ходов, если его зажечь.
items.equipment.bombs.bomb.desc_burning=Фитиль горит, лучше избавиться от бомбы или затушить его!
items.equipment.bombs.bomb$doublebomb.name=две бомбы
items.equipment.bombs.bomb$doublebomb.desc=Две здоровенные пороховые бомбы по цене одной!

items.equipment.bombs.firebomb.name=зажигательная бомба
items.equipment.bombs.firebomb.desc=Эта бомба была модифицирована таким образом, чтобы при взрыве наносить _%1$d-%2$d урона_ на большей области, поджигая всё в радиусе 2 клеток от точки взрыва.
items.equipment.bombs.firebomb.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.equipment.bombs.flashbangbomb.name=световая граната
items.equipment.bombs.flashbangbomb.desc=Это бомба была модифицирована таким образом, чтобы при взрыве излучить звуковую вспышку света с электрическим разрядом. Сам взрыв наносит _%1$d-%2$d урона_ всем кто находится в пределах 2 клеток, и дополнительно наносит электричеством 25%% урона, оглушая на 10 ходов.
items.equipment.bombs.flashbangbomb.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.equipment.bombs.frostbomb.name=замораживающая бомба
items.equipment.bombs.frostbomb.desc=Эта бомба была модифицирована таким образом, чтобы при взрыве наносить _%1$d-%2$d урона_ на большой области, создавая облако замораживающего газа в радиусе 2 клеток.
items.equipment.bombs.frostbomb.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.equipment.bombs.holybomb.name=освящённая бомба
items.equipment.bombs.holybomb.desc=Это бомба была модифицирована таким образом, чтобы при взрыве излучать вспышки святой энергии. Сам взрыв наносит _%1$d-%2$d урона_ всем кто находится в пределах 2 клеток, а если под него попадает нежить или демон, они получают дополнительно 50%% урона от святой энергии.
items.equipment.bombs.holybomb.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.equipment.bombs.noisemaker.name=шумовая бомба
items.equipment.bombs.noisemaker.desc=Эта модифицированная бомба будет безостановочно издавать шум, когда фитиль догорит. Если что-либо коснется бомбы, она тут же взорвется и нанесет _%1$d-%2$d урона_ всем кто в радиусе 2 клеток!
items.equipment.bombs.noisemaker.desc_burning=Генератор шума тикает, взрыв произойдет, если что-либо приблизится на достаточное расстояние!
items.equipment.bombs.noisemaker.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.equipment.bombs.smokebomb.name=дымовая бомба
items.equipment.bombs.smokebomb.desc=Эта бомба была модифицирована таким образом, чтобы при взрыве высвобождать облако газа. Она нанесет _%1$d-%2$d урона_ и распространит окутывающий туман в радиусе 2 клеток от точки взрыва.
items.equipment.bombs.smokebomb.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.equipment.bombs.regrowthbomb.name=восстанавливающая бомба
items.equipment.bombs.regrowthbomb.desc=Эта модифицированная бомба вместо взрыва разбрызгивает в радиусе 3 клеток особый исцеляющий состав, провоцирующий ускоренный рост трав и растений, а так же лечащий вас и ваших союзников, будто вы выпили зелье исцеления.
items.equipment.bombs.regrowthbomb.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.equipment.bombs.shrapnelbomb.name=осколочная бомба
items.equipment.bombs.shrapnelbomb.desc=Эта бомба была наполнена осколками DM-300, которые разлетятся во все стороны при взрыве, нанося _%1$d-%2$d урона_ всем в огромном радиусе вокруг бомбы. Лучше будет спрятаться за что-нибудь перед тем, как она взорвётся...
items.equipment.bombs.shrapnelbomb.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.equipment.bombs.woollybomb.name=шерстяная бомба
items.equipment.bombs.woollybomb.desc=Эта бомба создаст широкое поле волшебных овец после взрыва, который наносит _%1$d-%2$d урона_ всему, что находится в пределах 2 клеток. Они не позволят кому-либо пройти, и будут стоять очень долго! Правда, в присутствии сильных врагов овцы буду исчезать быстрее, и их можно отогнать при взаимодействии с ними.
items.equipment.bombs.woollybomb.discover_hint=Вы можете создать этот предмет с помощью алхимии.

###food
items.consum.food.berry.name=подземельная ягода
items.consum.food.berry.eat_msg=Эта ягода была вкусной!
items.consum.food.berry.desc=Это небольшая ягода, найденная охотницей среди растительности. Ее можно очень быстро съесть, она восполняет небольшое количество сытости, а также может содержать полезное семя!
items.consum.food.berry.discover_hint=Вы можете найти этот предмет, используя определённый талант героя.

items.consum.food.blandfruit.name=пустофрукт
items.consum.food.blandfruit.cooked=сваренный пустофрукт
items.consum.food.blandfruit.sunfruit=солнцефрукт
items.consum.food.blandfruit.rotfruit=гнилофрукт
items.consum.food.blandfruit.earthfruit=землефрукт
items.consum.food.blandfruit.blindfruit=бледнофрукт
items.consum.food.blandfruit.firefruit=огнефрукт
items.consum.food.blandfruit.icefruit=хладофрукт
items.consum.food.blandfruit.fadefruit=мыслефрукт
items.consum.food.blandfruit.sorrowfruit=кислофрукт
items.consum.food.blandfruit.stormfruit=грозофрукт
items.consum.food.blandfruit.dreamfruit=магофрукт
items.consum.food.blandfruit.starfruit=звёздофрукт
items.consum.food.blandfruit.swiftfruit=скорофрукт
items.consum.food.blandfruit.raw=Вы не в силах заставить себя съесть его сырым.
items.consum.food.blandfruit.desc=Не имеет ни вкуса, ни запаха. Может, если его сварить с чем-то ещё, он станет получше?
items.consum.food.blandfruit.desc_cooked=Во время варки в котле этот фрукт разбух и даже впитал в себя некоторые свойства ингредиентов, с которыми был сварен. Он будет обладать свойствами любого зелья, которому соответствовало семя.
items.consum.food.blandfruit.desc_eat=Похоже, теперь его можно есть!
items.consum.food.blandfruit.desc_throw=Похоже, что он может взорваться, если его бросить.
items.consum.food.blandfruit$chunks.name=остатки пустофрукта
items.consum.food.blandfruit$chunks.desc=Пустофрукт лопнул при ударе, развалившись на несколько небольших кусков.\n\nНесмотря на то, что они немного испачканы, они выглядят вполне съедобными.

items.consum.brewed.brewed.name=заваренный пустофрукт
items.consum.brewed.brewed.ac_eat=СЪЕСТЬ
items.consum.brewed.brewed.raw=Этот фрукт всё ещё нужно сварить с семенем.
items.consum.brewed.brewed.sunfruit=солнцефрукт
items.consum.brewed.brewed.rotfruit=вкуснофрукт
items.consum.brewed.brewed.earthfruit=землефрукт
items.consum.brewed.brewed.blindfruit=бледнофрукт
items.consum.brewed.brewed.firefruit=огнефрукт
items.consum.brewed.brewed.icefruit=хладофрукт
items.consum.brewed.brewed.fadefruit=мыслефрукт
items.consum.brewed.brewed.sorrowfruit=кислофрукт
items.consum.brewed.brewed.stormfruit=грозофрукт
items.consum.brewed.brewed.dreamfruit=чистофрукт
items.consum.brewed.brewed.starfruit=звёздофрукт
items.consum.brewed.brewed.mightfruit=могучофрукт
items.consum.brewed.brewed.heartfruit=сердцефрукт
items.consum.brewed.brewed.nutfruit=орехофрукт
items.consum.brewed.brewed.mixfruit=гибридофрукт
items.consum.brewed.brewed.strfruit=силофрукт
items.consum.brewed.brewed.glassfruit=хрусталофрукт
items.consum.brewed.brewed.ice_msg=Хладофрукт на вкус немного напоминает замороженное карпаччо.
items.consum.brewed.brewed.fire_msg=Вы чувствуете, как внутри вас горит невообразимый огонь!
items.consum.brewed.brewed.toxic_msg=Вы пропитаны мерзкой ядовитой силой!
items.consum.brewed.brewed.para_msg=Вы чувствуете, как сила земли течёт по вашему телу!
items.consum.brewed.brewed.desc=Несваренный пустофрукт.
items.consum.brewed.brewed.desc_cooked=Во время варки в котле этот фрукт разбух и впитал свойства семени, с которым был сварен.\n\nПохоже, теперь его можно есть!

items.consum.food.chargrilledmeat.name=прожаренное мясо
items.consum.food.chargrilledmeat.desc=Пахнет как неплохой стейк.
items.consum.food.chargrilledmeat.discover_hint=Вы можете создать это, используя другой предмет пищи.

items.consum.food.food.name=рацион пищи
items.consum.food.food.ac_eat=СЪЕСТЬ
items.consum.food.food.eat_msg=Эта еда была просто превосходна!
items.consum.food.food.desc=Ничего особенного - вяленое мясо, немного сухариков и всё такое.

items.consum.food.frozencarpaccio.name=замороженное мясо
items.consum.food.frozencarpaccio.invis=Вы видите, как ваши руки становятся невидимыми!
items.consum.food.frozencarpaccio.hard=Вы чувствуете, что ваша кожа затвердела!
items.consum.food.frozencarpaccio.refresh=Освежающе!
items.consum.food.frozencarpaccio.better=Вы чувствуете себя лучше!
items.consum.food.frozencarpaccio.desc=Это кусок насквозь промороженного мяса. Его можно есть, только нарезая тонкими ломтиками, как карпаччо. Впрочем, так оно получается на вкус даже лучше, чем обычно.
items.consum.food.frozencarpaccio.discover_hint=Вы можете создать это, используя другой предмет пищи.

items.consum.food.meatpie.name=мясной пирог
items.consum.food.meatpie.eat_msg=Это было чертовски вкусно!
items.consum.food.meatpie.desc=Аппетитный пирог, полный вкусного мяса. Такое лакомство способно насытить куда лучше любой другой пищи.
items.consum.food.meatpie.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.consum.food.mysterymeat.name=загадочное мясо
items.consum.food.mysterymeat.eat_msg=Эта еда была какой-то странной на вкус.
items.consum.food.mysterymeat.hot=Ой! Горячо!
items.consum.food.mysterymeat.legs=Вы не чувствуете своих ног!
items.consum.food.mysterymeat.not_well=Вы чувствуете себя не очень хорошо.
items.consum.food.mysterymeat.stuffed=Вы наелись.
items.consum.food.mysterymeat.desc=Ешьте на свой страх и риск!
items.consum.food.mysterymeat.discover_hint=Вы можете получить этот предмет как трофей с определённых врагов.
items.consum.food.mysterymeat$placeholder.name=мясо

items.consum.food.phantommeat.name=призрачное мясо
items.consum.food.phantommeat.desc=Большой и блестящий полупрозрачный стейк, вырезанный из призрачной пираньи. Это волшебное мясо не нуждается в приготовлении и обладает рядом защитных свойств в дополнение большой питательности. Одного кусочка хватит, чтобы полностью насытить вас, затянуть раны и излечить от вредных эффектов. Кроме того, мясо сделает вас невидимым и наложит эффект дубовой кожи.
items.consum.food.phantommeat.discover_hint=Вы можете получить этот предмет как трофей с определённых врагов.

items.consum.food.pasty.name=пирог
items.consum.food.pasty.fish_name=рыба на пару
items.consum.food.pasty.amulet_name=Амулет Индора?
items.consum.food.pasty.egg_name=пасхальное яйцо
items.consum.food.pasty.rainbow_name=радужное зелье
items.consum.food.pasty.shattered_name=зеленый тортик
items.consum.food.pasty.pie_name=тыквенный пирог
items.consum.food.pasty.vanilla_name=синий тортик
items.consum.food.pasty.cane_name=новогодний леденец
items.consum.food.pasty.sparkling_name=игристое зелье
items.consum.food.pasty.desc=Настоящий корнуэльский пирог с начинкой из говядины и картофеля. Восхитительно!
items.consum.food.pasty.fish_desc=Рыба на пару, волшебно поданная на зелени. В это время года есть традиция сохранять кусочек рыбы на потом, поэтому вы оставите немного объедков, вместо того, чтобы съесть всё сразу.\n\nСчастливого Лунного Нового Года!
items.consum.food.pasty.amulet_desc=Вы наконец-то нашли его, великий Амулет Инд- погодите-ка, это ведь обычная шоколадка в фольге, которая просто похожа на амулет! Она не наделит вас безграничной силой, но, по меньшей мере, поможет насытиться и немного зарядить ваши артефакты.\n\nС Днём Дураков! ;)
items.consum.food.pasty.egg_desc=Огромное шоколадное яйцо, завёрнутое в яркую жёлтую фольгу. В нём достаточно шоколада, чтобы насытить вас, а сахар даст вашим артефактам немного дополнительного заряда.\n\nС Пасхой!
items.consum.food.pasty.rainbow_desc=Это разноцветное зелье является подобием жидкой еды. В дополнение к питательной ценности зелье обладает небольшим количеством магии, которая успокоит всех смежных врагов кроме боссов, заставляя их подумать прежде чем атаковать вас.\n\nС днём Гордости!
items.consum.food.pasty.shattered_desc=Этот большой кусок ванильного торта украшен разноцветной посыпкой и зеленой глазурью. Торт испечен со знанием дела опытными руками, и даже передаст частичку опыта тому, кто его попробует.\n\nShattered Pixel Dungeon впервые была выпущена 5 августа 2014 года. С днем рождения, Shattered Pixel Dungeon!
items.consum.food.pasty.pie_desc=Здоровенный кусок тыквенного пирога. Его сладкий и пряный вкус способен не только полностью утолить голод, но и восстановить немного здоровья.\n\nСчастливого Дня Всех Святых!
items.consum.food.pasty.vanilla_desc=Этот большой кусок ванильного торта украшен разноцветной посыпкой и синей глазурью. Торт испечен со знанием дела опытными руками, и даже передаст частичку опыта тому, кто его попробует.\n\nОригинальная версия Pixel Dungeon была впервые выпущена 4 декабря 2012 года. С днем рождения, Pixel Dungeon!
items.consum.food.pasty.cane_desc=Огромная сладкая карамельная трость. Она достаточно большая для того, чтобы полностью утолить голод, а избыток сахара может ещё и добавить энергии для ваших волшебных палочек.\n\nС праздником!
items.consum.food.pasty.sparkling_desc=Это зелье, играющее пузырьками, представляет собой разновидность жидкой пищи. Оно утоляет голод и напоминает игристое вино, хотя и не является алкогольным. Ощущение тепла в животе дарует ощущение защиты.\n\nС Новым годом!
items.consum.food.pasty$fishleftover.name=рыбные объедки
items.consum.food.pasty$fishleftover.eat_msg=На вкус так себе.
items.consum.food.pasty$fishleftover.desc=Немного остатков рыбы после вашего предыдущего приёма пищи. Вы в любой момент можете съесть их, чтобы слегка восполнить сытость.

items.consum.food.smallration.name=урезанный рацион
items.consum.food.smallration.eat_msg=На вкус так себе.
items.consum.food.smallration.desc=Он выглядит как обычный рацион, но поменьше.
items.consum.food.smallration.discover_hint=Вы можете купить этот предмет в магазине.

items.consum.food.stewedmeat.name=тушёное мясо
items.consum.food.stewedmeat.eat_msg=На вкус так себе.
items.consum.food.stewedmeat.desc=Тушёное мясо очищено от любой инфекции и паразитов. Его можно спокойно есть.
items.consum.food.stewedmeat.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.consum.food.supplyration.name=паёк
items.consum.food.supplyration.desc=Этот паёк был оставлен в подземелье членами гильдии воров для её же участников. Он был специально разработан для перекуса на ходу и для помощи в тёмных делах.\n\nХотя он и не насытит вас так же, как и обычный рацион, паёк может быть съеден моментально. Он восстановит немного здоровья и один заряд Плаща Теней Разбойника.
items.consum.food.supplyration.discover_hint=Вы можете найти этот предмет используя определённый талант героя.



##journal items
items.specific.journal.documentpage.name=вырванная страница
items.specific.journal.documentpage.desc=Эту страницу, кажется, вырвали из какой-то книги. Чтобы разобрать, что на ней написано, придётся её подобрать.

items.specific.journal.alchemypage.name=вырванная страница учебника алхимии
items.specific.journal.alchemypage.desc=Вырванная страница из учебника алхимии.\n\nБольшая часть текста слишком мелкая, чтобы прочесть её издалека, но можно вполне разглядеть заголовок:\n\n_"%s"_

items.specific.journal.guidebook.name=альманах путешественника
items.specific.journal.guidebook.hint_mobile=В справочнике новый совет для вас! Нажмите в правом верхнем углу на мигающую кнопку журнала, чтобы прочитать его.
items.specific.journal.guidebook.hint_desktop=В справочнике новый совет для вас! Нажмите в правом верхнем углу на мигающую кнопку журнала (%s), чтобы прочитать его.
items.specific.journal.guidebook.hint_status=Справочник
items.specific.journal.guidebook.desc=Путеводитель путешественника, забытый тут кем-то, кто решил, что приключения - не его удел. Эта конкретная книга - магическая, она может обратить внимание путешественника на определенную страницу в нужное время.\n\nКнига крайне популярна не только лишь из-за её содержания, но и из-за красиво выведенной надписи "Не паникуй!" на обложке.

items.specific.journal.guidepage.name=вырванная страница справочника
items.specific.journal.guidepage.desc=Вырванная страница из справочника путешественника.\n\nБольшая часть текста слишком мелкая, чтобы прочесть её издалека, но можно вполне разглядеть заголовок:\n\n_"%s"_

items.specific.journal.regionlorepage$sewers.name=потертое письмо
items.specific.journal.regionlorepage$sewers.desc=Похоже на письмо, написанное на заляпанной бумаге. Вам придется его поднять, чтобы прочесть, что там написано.

items.specific.journal.regionlorepage$prison.name=потертая запись из дневника
items.specific.journal.regionlorepage$prison.desc=Это запись в дневнике или какая-то иная запись, написанная на старом листе бумаги. Похоже, она сохранилась лучше, чем те письма, которые вы находили в канализации, но вам, все же, придется его поднять, чтобы его прочитать.

items.specific.journal.regionlorepage$caves.name=старая запись из журнала
items.specific.journal.regionlorepage$caves.desc=Это выглядит как запись из журнала исследователя, и она удивительным образом хорошо сохранилась. Поднимите ее, чтобы прочесть.

items.specific.journal.regionlorepage$city.name=ржавая табличка
items.specific.journal.regionlorepage$city.desc=Маленькая, ржавая металлическая пластина с выжженным на ней сообщением. Несмотря на возраст пластины, буквы отчетливо видны, но вам придется поднять ее, чтобы прочитать текст.

items.specific.journal.regionlorepage$halls.name=светящаяся табличка
items.specific.journal.regionlorepage$halls.desc=Это маленькая, черная скрижаль со светящейся, выжженной на ней надписью. Издалека свет, исходящий от начертания, сливается в дымку, так что вам придется поднять скрижаль, чтобы прочитать текст.


###keys
items.specific.keys.goldenkey.name=золотой ключ
items.specific.keys.goldenkey.desc=У этого ключа очень маленькая и изящная бородка. Возможно, это ключ от какого-то сундука?

items.specific.keys.crystalkey.name=Хрустальный ключ
items.specific.keys.crystalkey.desc=Вырезанные из цельного куска хрусталя, изгибы этого ключа мерцают в темноте. Может, он откроет что-то сделанное из хрусталя?

items.specific.keys.ironkey.name=железный ключ
items.specific.keys.ironkey.desc=Бородка этого ключа уже изношена, а кожаный ремешок очень старый. Интересно, какую дверь им можно открыть?

items.specific.keys.wornkey.name=изношенный ключ
items.specific.keys.wornkey.desc=Этот ключ изношен и выцвел, но выглядит серьёзным. Скорее всего, он может открыть какую-нибудь серьёзную дверь неподалёку.



###potions
items.consum.potions.potion.ac_drink=ВЫПИТЬ
items.consum.potions.potion.turquoise=бирюзовое зелье
items.consum.potions.potion.crimson=багряное зелье
items.consum.potions.potion.azure=лазурное зелье
items.consum.potions.potion.jade=зелёное зелье
items.consum.potions.potion.golden=золотистое зелье
items.consum.potions.potion.magenta=пурпурное зелье
items.consum.potions.potion.charcoal=серое зелье
items.consum.potions.potion.ivory=белёсое зелье
items.consum.potions.potion.amber=янтарное зелье
items.consum.potions.potion.bistre=коричневое зелье
items.consum.potions.potion.indigo=фиолетовое зелье
items.consum.potions.potion.silver=серебристое зелье
items.consum.potions.potion.unknown_desc=Этот пузырёк содержит какое-то зелье. Интересно, что будет, если его выпить или разбить?
items.consum.potions.potion.harmful=Вредное зелье!
items.consum.potions.potion.beneficial=Полезное зелье
items.consum.potions.potion.yes=Да, все правильно
items.consum.potions.potion.no=Нет, я передумал
items.consum.potions.potion.sure_drink=Вы уверены, что хотите выпить это зелье? Возможно, стоит кинуть им в кого-нибудь другого.
items.consum.potions.potion.sure_throw=Вы уверены, что хотите бросить это зелье? Возможно, его лучше выпить.
items.consum.potions.potion.shatter=Бутыль разлетается на мелкие осколки, а её содержимое безо всякого эффекта растекается по полу.
items.consum.potions.potion.discover_hint=Вы можете случайно найти этот предмет в подземелье или создать его с помощью алхимии.
items.consum.potions.potion$placeholder.name=зелье
items.consum.potions.potion$seedtopotion.name=Случайное Зелье

items.consum.potions.potionofexperience.name=зелье Опыта
items.consum.potions.potionofexperience.desc=Это зелье содержит концентрированный опыт множества сражений. Если его выпить, ваш уровень будет немедленно повышен.

items.consum.potions.potionoffrost.name=зелье Холода
items.consum.potions.potionoffrost.desc=При контакте с воздухом этот химикат мгновенно испаряется, замораживая всех, кто попал в облако его паров.

items.consum.potions.potionofhaste.name=зелье Ускорения
items.consum.potions.potionofhaste.energetic=Вы чувствуете прилив энергии!
items.consum.potions.potionofhaste.desc=Глоток этой удивительно сладкой жидкости наполнит вас огромной энергией, ненадолго позволив перемещаться гораздо быстрее.

items.consum.potions.potionofhealing.name=зелье Исцеления
items.consum.potions.potionofhealing.heal=Ваши раны начинают заживать.
items.consum.potions.potionofhealing.desc=Этот эликсир стремительно заживляет любые раны и моментально исцеляет многие недуги.

items.consum.potions.potionofinvisibility.name=зелье Невидимости
items.consum.potions.potionofinvisibility.invisible=Вы видите, как ваши руки становятся невидимыми!
items.consum.potions.potionofinvisibility.desc=Выпив это зелье, вы станете совершенно невидимы для противников на какое-то время. Впрочем, физические атаки и магические эффекты (такие как свитки и палочки) моментально рассеют невидимость.

items.consum.potions.potionoflevitation.name=зелье Левитации
items.consum.potions.potionoflevitation.float=Вы взмываете в воздух!
items.consum.potions.potionoflevitation.desc=Если выпить этот занятный состав, то некоторое время вы будете парить в воздухе и сможете пересечь пропасть или перелететь через ловушку.\n\nЕсли бросить это зелье, оно создаст облако неочищенного газа, дезориентирующего любого, кто в него попадёт.

items.consum.potions.potionofliquidflame.name=зелье Алхимического огня
items.consum.potions.potionofliquidflame.desc=Этот сосуд содержит нестабильный реактив, который при малейшем контакте с воздухом резко загорается, поджигая всё вокруг.

items.consum.potions.potionofmindvision.name=зелье Ментального зрения
items.consum.potions.potionofmindvision.see_mobs=Вы каким-то образом можете чувствовать присутствие других существ!
items.consum.potions.potionofmindvision.see_none=Вы каким-то образом понимаете, что на этом уровне подземелья нет никого, кроме вас.
items.consum.potions.potionofmindvision.desc=Глоток этого зелья помогает настроить ваш разум на психические частоты других существ, позволяя вам определять местоположение других существ сквозь любые препятствия.\n\nТакже в этом состоянии вы можете видеть сквозь ближайшие стены и двери.

items.consum.potions.potionofparalyticgas.name=зелье Парализующего газа
items.consum.potions.potionofparalyticgas.desc=При контакте с открытым воздухом жидкость в этой бутыли испарится, превращаясь в обездвиживающий жёлтый газ. Любой, кто вдохнёт его, будет мгновенно парализован, теряя возможность сопротивляться до тех пор, пока облако не развеется.\n\nЭто зелье лучше кидать во врагов, находящихся на расстоянии.

items.consum.potions.potionofpurity.name=зелье Очищения
items.consum.potions.potionofpurity.freshness=Вы чувствуете, что на вас неожиданно пахнуло свежим воздухом.
items.consum.potions.potionofpurity.protected=Некое подобие защитной пленки обволакивает вас!
items.consum.potions.potionofpurity.desc=Этот магический реагент способен моментально нейтрализовать все вредоносные газы в большой зоне. Выпив его, вы получите временный иммунитет к газам любого рода.

items.consum.potions.potionofstrength.name=зелье Силы
items.consum.potions.potionofstrength.msg=По вашему телу распространяется новоприобретённая сила, теперь у вас %d силы!
items.consum.potions.potionofstrength.desc=Это редкое зелье влияет на мускулатуру всего вашего тела, навсегда увеличивая вашу силу на единицу.

items.consum.potions.potionoftoxicgas.name=зелье Токсического газа
items.consum.potions.potionoftoxicgas.desc=Разбивание или раскупоривание этого герметичного флакона заставит его содержимое взорваться смертоносным облаком отравляющего газа. Возможно, лучше бросить это зелье в кого-то, находящегося на расстоянии, а не открывать его самому.



###brews
items.consum.potions.brews.brew.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.consum.potions.brews.aquabrew.name=экстракт Водянистости
items.consum.potions.brews.aquabrew.desc=Если его разбить, то этот экстракт высвободит водный всплеск в точке приземления. Оно достаточно мощное, чтобы нанести урон огненным существам, но оно также затопит местность вокруг, обезвредит ловушки, потушит пламя и откинет врагов, которые оказались рядом со всплеском.

items.consum.potions.brews.blizzardbrew.name=экстракт Снежного вихря
items.consum.potions.brews.blizzardbrew.desc=Если его разбить, то этот экстракт выпустит на свободу вихрь замораживающей пурги, который будет быстро распространяться подобно газам.

items.consum.potions.brews.causticbrew.name=экстракт Едкой слизи
items.consum.potions.brews.causticbrew.desc=Если разбить этот экстракт, то он покроет всех вокруг чрезвычайно едкой кислотой. Кислота будет наносить урон всем, кто попадёт под неё, пока её не смоют водой.

items.consum.potions.brews.infernalbrew.name=экстракт Адского пламени
items.consum.potions.brews.infernalbrew.desc=Если его разбить, то этот экстракт выпустит на свободу бушующее адское пламя, которое будет быстро распространяться подобно газам.

items.consum.potions.brews.shockingbrew.name=экстракт Грозового облака
items.consum.potions.brews.shockingbrew.desc=Если его разбить, то этот экстракт выпустит на свободу электрический шторм на большом пространстве вокруг того места, где был разбит экстракт.

items.consum.potions.brews.unstablebrew.name=нестабильный экстракт
items.consum.potions.brews.unstablebrew.desc=Этот волшебный напиток переливается цветами радуги.\n\nКогда его выпьют или бросят, он активирует эффект случайного зелья. Эффект напитка всегда будет положительный, если его выпить, и всегда будет отрицательный, если бросить.

###elixirs
items.consum.potions.elixirs.elixir.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.consum.potions.elixirs.elixirofarcanearmor.name=эликсир Мистической брони
items.consum.potions.elixirs.elixirofarcanearmor.desc=Данный эликсир дарует выпившему длительное сопротивление магическому урону.

items.consum.potions.elixirs.elixirofaquaticrejuvenation.name=эликсир Водной регенерации
items.consum.potions.elixirs.elixirofaquaticrejuvenation.desc=Этот эликсир содержит в себе остатки Слизня, смешанные с лечебным зельем. Вместо моментального исцеления он дарует выпившему его способность восстанавливать здоровье при соприкосновении с водой.
items.consum.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=водная регенерация
items.consum.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Вы временно получили способности Слизня к регенерации.\n\nНаходясь в воде, вы восстанавливаете небольшое количество здоровья каждый ход. Эффект приостанавливается, когда у вас полное здоровье или вы находитесь вне воды.\n\nЛечения осталось: %d.

items.consum.potions.elixirs.elixirofdragonsblood.name=эликсир Крови дракона
items.consum.potions.elixirs.elixirofdragonsblood.desc=Будучи выпитым, эликсир наделит героя силой огня, протекающей по его венам. Этот эффект подарит ему иммунитет к огню и позволит поджигать врагов своими ударами.

items.consum.potions.elixirs.elixiroffeatherfall.name=эликсир Антигравитации
items.consum.potions.elixirs.elixiroffeatherfall.light=Вы чувствуете себя легким, как пёрышко!
items.consum.potions.elixirs.elixiroffeatherfall.desc=Этот эликсир дарует частичный контроль над гравитацией, позволяя выпившему его падать в пропасти без риска для здоровья.
items.consum.potions.elixirs.elixiroffeatherfall$featherbuff.name=антигравитация
items.consum.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Вы под эффектом эликсира Антигравитации, который позволяет вам падать в пропасти и не получить урон!\n\nОсталось ходов: %s.

items.consum.potions.elixirs.elixirofhoneyedhealing.name=эликсир Медового исцеления
items.consum.potions.elixirs.elixirofhoneyedhealing.desc=Этот эликсир не только исцеляет раны, но ещё и очень сладкий! Он немного утоляет голод и применяет тот же эффект, что и зелье регенерации, если его выпить. Но можно и бросить его в союзника, чтобы вылечить его раны.\n\nС помощью этого эликсира можно укротить тех существ, которые любят мёд.

items.consum.potions.elixirs.elixiroficytouch.name=эликсир Ледяного касания
items.consum.potions.elixirs.elixiroficytouch.desc=Тот, кто выпьет такой эликсир, сможет высасывать тепло из врагов одним своим прикосновением. Это даст полный иммунитет к холоду, а также позволит накладывать окоченение своими физическими атаками.

items.consum.potions.elixirs.elixirofmight.name=эликсир Могущества
items.consum.potions.elixirs.elixirofmight.msg=По вашему телу распространяется новоприобретённая сила, теперь у вас %d силы!
items.consum.potions.elixirs.elixirofmight.desc=Это мощное зелье растечётся по вашим мышцам, навсегда увеличив вашу силу на одно очко и здоровье на %d очков. Бонус к здоровью зависит зависит от вашего максимального здоровья, но при получении уровней будет постепенно спадать.
items.consum.potions.elixirs.elixirofmight$htboost.name=увеличение запаса здоровья
items.consum.potions.elixirs.elixirofmight$htboost.desc=Вы чувствуете непривычную силу и живучесть.\n\nВаше максимальное здоровье увеличено на долгое время. Когда вы получаете уровни, этот бонус будет понемногу снижаться.\n\nУвеличение жизни на данный момент: %d.\nУровней осталось: %d.

items.consum.potions.elixirs.elixiroftoxicessence.name=эликсир Зловония
items.consum.potions.elixirs.elixiroftoxicessence.desc=Этот эликсир дарует выпившему токсическую силу. Испивший будет источать токсичный газ, а так же будет невосприимчив к отравлению и токсичному газу даже чуть дольше, чем длится эффект.



###exotic potions
items.consum.potions.exotic.exoticpotion.turquoise=особое бирюзовое зелье
items.consum.potions.exotic.exoticpotion.crimson=особое багряное зелье
items.consum.potions.exotic.exoticpotion.azure=особое лазурное зелье
items.consum.potions.exotic.exoticpotion.jade=особое зелёное зелье
items.consum.potions.exotic.exoticpotion.golden=особое золотистое зелье
items.consum.potions.exotic.exoticpotion.magenta=особое пурпурное зелье
items.consum.potions.exotic.exoticpotion.charcoal=особое серое зелье
items.consum.potions.exotic.exoticpotion.ivory=особое белёсое зелье
items.consum.potions.exotic.exoticpotion.amber=особое янтарное зелье
items.consum.potions.exotic.exoticpotion.bistre=особое коричневое зелье
items.consum.potions.exotic.exoticpotion.indigo=особое фиолетовое зелье
items.consum.potions.exotic.exoticpotion.silver=особое серебристое зелье
items.consum.potions.exotic.exoticpotion.unknown_desc=Этот округлый пузырёк содержит странную разноцветную жидкость, совсем не похожую на обычные зелья. Интересно, что будет, если его выпить или разбить?
items.consum.potions.exotic.exoticpotion.warning=Вы действительно хотите отменить использование этого зелья? Оно все равно будет истрачено.
items.consum.potions.exotic.exoticpotion.yes=Да, я уверен
items.consum.potions.exotic.exoticpotion.no=Нет, я передумал
items.consum.potions.exotic.exoticpotion.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.consum.potions.exotic.potionofcleansing.name=зелье Избавления
items.consum.potions.exotic.potionofcleansing.desc=Этот мощный реагент сделает выпившего его невосприимчивым ко всем отрицательным эффектам на несколько ходов при употреблении. Его также можно кинуть в цель, чтобы очистить её.
items.consum.potions.exotic.potionofcleansing$cleanse.name=очищенные
items.consum.potions.exotic.potionofcleansing$cleanse.desc=Этот персонаж имеет временный иммунитет против любых вредных эффектов!\n\nХодов осталось: %s.

items.consum.potions.exotic.potionofcorrosivegas.name=зелье Коррозийного газа
items.consum.potions.exotic.potionofcorrosivegas.desc=Бросок или откупоривание этой находящейся под давлением бутыли спровоцирует формирование из содержимого облака едкого газа цвета ржавчины. Его концентрация, однако, будет невысока и облако не слишком долго продержится.

items.consum.potions.exotic.potionofdragonsbreath.name=зелье Драконьего дыхания
items.consum.potions.exotic.potionofdragonsbreath.prompt=Выберите цель
items.consum.potions.exotic.potionofdragonsbreath.desc=Этот пузырёк содержит необычный реактив, который мгновенно воспламеняется при смешении со слюной. Вовремя выплюнув жидкость, вы сможете выпускать пламя изо рта!

items.consum.potions.exotic.potionofearthenarmor.name=зелье Природной брони
items.consum.potions.exotic.potionofearthenarmor.desc=Вместо того, чтобы парализовать, эта жидкость заставляет кожу затвердеть, что временно наделит вас природной бронёй.

items.consum.potions.exotic.potionofdivineinspiration.name=зелье Небесного вдохновения
items.consum.potions.exotic.potionofdivineinspiration.no_more_points=Вы не можете получить больше бонусных очков таланта.
items.consum.potions.exotic.potionofdivineinspiration.select_tier=Выберите уровень талантов к которому будут добавлены два очка. Уровень должен быть открытым.
items.consum.potions.exotic.potionofdivineinspiration.bonus=+2 очка талантов!
items.consum.potions.exotic.potionofdivineinspiration.desc=Будучи святой энергией в жидкой форме, это зелье наделит выпившего двумя дополнительным очками талантов того уровня, который он выберет.\n\nЭто зелье может быть использовано единожды для каждого уровня талантов.

items.consum.potions.exotic.potionofmagicalsight.name=зелье Волшебного взора
items.consum.potions.exotic.potionofmagicalsight.desc=После того, как вы это выпьете, ваши чувства ненадолго обострятся до невероятного уровня, увеличивая дальность обзора до 12 клеток и позволяя видеть сквозь стены!

items.consum.potions.exotic.potionofmastery.name=зелье Мастерства
items.consum.potions.exotic.potionofmastery.prompt=Освоить предмет
items.consum.potions.exotic.potionofmastery.weapon_easier=Вашим оружием стало проще пользоваться!
items.consum.potions.exotic.potionofmastery.armor_easier=Ваша броня становится легче!
items.consum.potions.exotic.potionofmastery.desc=Вместо того, чтобы увеличивать силу, это зелье настраивает мышцы на определенный предмет. Это упростит использование этого предмета, как если бы пьющий практиковался с ним и развил мышечную память.\n\nДля использования выбранного оружия или доспехов потребуется на 2 единицы силы меньше. Это зелье можно использовать только один раз для каждого предмета.

items.consum.potions.exotic.potionofshielding.name=зелье Защиты
items.consum.potions.exotic.potionofshielding.desc=Вместо того, чтобы исцелять, это зелье создаёт волшебный барьер вокруг выпившего. Этот барьер может поглотить значительное количество повреждений.

items.consum.potions.exotic.potionofshroudingfog.name=зелье Густого тумана
items.consum.potions.exotic.potionofshroudingfog.desc=При контакте с воздухом жидкость в этом пузырьке превратится в густой клубящийся туман, полностью блокирующий обзор.

items.consum.potions.exotic.potionofsnapfreeze.name=зелье Заморозки
items.consum.potions.exotic.potionofsnapfreeze.desc=Химикаты в этом зелье моментально реагируют с воздухом, мгновенно замораживая и обездвиживая всех вокруг.

items.consum.potions.exotic.potionofstamina.name=зелье Выносливости
items.consum.potions.exotic.potionofstamina.desc=Глоток этой странно сладковатой жидкости дарует длительный прилив энергии, надолго увеличивая скорость перемещения.

items.consum.potions.exotic.potionofstormclouds.name=зелье Грозовых туч
items.consum.potions.exotic.potionofstormclouds.desc=Если бросить это зелье, оно образует быстро распространяющееся облако концентрированного пара, конденсат которого опустится на окрестности. Большая часть местности будет затоплена, огненные существа получат урон, пламя потушится, а ловушки выйдут из строя и сломаются.



###quest items
items.quest.ceremonialcandle.name=ритуальная свеча
items.quest.ceremonialcandle.desc=Несколько свеч, слепившихся в одну из-за использования.\n\nСами по себе они бесполезны, но если использовать их в определенной последовательности, они способны сконцентрировать энергию, необходимую для ритуала призыва.
items.quest.ceremonialcandle.discover_hint=Вы можете найти этот предмет во время определённого задания.

items.quest.corpsedust.name=прах мертвеца
items.quest.corpsedust.chill=Холодок пробегает по вашей спине.
items.quest.corpsedust.desc=Эта кучка праха не сильно отличается от любой другой в этом подземелье, но вы чувствуете таящуюся в ней темную энергию.\n\nПожалуй, лучше от неё избавиться, да как можно скорее.
items.quest.corpsedust.discover_hint=Вы можете найти этот предмет во время определённого задания.
items.quest.corpsedust&dustwraith.rankings_desc=Проклят прахом мертвеца

items.quest.darkgold.name=руда тёмного золота
items.quest.darkgold.you_now_have=Теперь у вас есть %d руды тёмного золота.
items.quest.darkgold.desc=Этот металл называется темным не из-за его цвета (который не отличается от обычного золота), а из-за того, что при воздействии солнечного света он плавится.\n\nДумаю, не стоит говорить, что темное золото не очень-то ценится городскими жителями.
items.quest.darkgold.discover_hint=Вы можете найти этот предмет во время определённого задания.

items.quest.dwarftoken.name=дворфский жетон
items.quest.dwarftoken.discard=Вы выбрасываете лишний жетон.
items.quest.dwarftoken.desc=Странной формы кусочек металла, который держал в руках один из обитателей дворфского хранилища. Возможно, это часть магии, которая удерживала его в хранилище? Лучше его оставить, он может вам пригодиться.
items.quest.dwarftoken.desc_old=По неизвестным причинам многие дворфы и некоторые из их творений носят с собой эти маленькие кусочки металла. Может быть, это какие-то украшения или опознавательные символы... Кто их поймет, этих бородатых.
items.quest.dwarftoken.discover_hint=Вы можете найти этот предмет во время определённого задания.

items.quest.embers.name=пепел элементаля
items.quest.embers.desc=Особый вид пепла, который можно получить только с молодых огненных элементалей. Даже сейчас он излучает тепло.
items.quest.embers.discover_hint=Вы можете найти этот предмет во время определённого задания.

items.quest.escapecrystal.name=кристалл побега
items.quest.escapecrystal.ac_use=ПРИМЕНИТЬ
items.quest.escapecrystal.prompt=Выберите предмет
items.quest.escapecrystal.desc=Тонкий магический кристалл, кажется, содержит телепортационную магию. Вы можете использовать его в любое время, чтобы покинуть хранилище дворфов, но если уйдете раньше, то не получите полную награду!
items.quest.escapecrystal.discover_hint=Вы можете найти этот предмет во время определённого задания.
items.quest.escapecrystal.injure_warning_1=Время будто замедляется и слышен голос беса:\n\n«Эх и досталось же тебе, как у тебя там дела? Мне, конечно, нужна моя статуя, но не настолько, чтобы тебе из-за неё помирать!»
items.quest.escapecrystal.injure_warning_2=«Если окажешься в дурном положении, можешь использовать _телепортирующие предметы из начальной комнаты_, чтобы вернуться туда и попытаться снова»
items.quest.escapecrystal.injure_warning_3=«В отчаяном положении можно _сбежать использовав кристал, который я дал тебе._ Полноценной награды ты от меня не получишь, но всё же лучше, чем помереть!»
items.quest.escapecrystal.leaving_start=Время будто замедляется, когда вы слышите голос Беса:\n"Послушай, я понимаю что ты нервничаешь и все такое, но пожалуйста, выйди хотя бы из первой комнаты!"\n\n"Тебе не нужно беспокоиться насчет твоих вещей. Я Бес слова, я обещаю тебе, оно будет ждать тебя, когда ты вернешься. И я обещаю, что ты сможешь использовать Кристал Побега, если тебе действительно угрожает опасность."
items.quest.escapecrystal.leaving_early=Время будто замедляется, когда вы слышите голос Беса:\n\n"Серьёзно, уже? Ты же знаешь, что от большинства врагов можно просто убежать?"\n\n"Смотри, если твоя жизнь в опасности, я могу достать тебя оттуда, но я тебе взамен ничего не дам. Я ожидал большего от тебя =("
items.quest.escapecrystal.leaving_partly_explored=Время будто замедляется, когда вы слышите голос Беса:\n\n"Оу, ты уже уходишь? Ну, я полагаю, ты помог составить карту этого места, и это лучше, чем ничего."\n\n"Честно, я ожидал большего от тебя =(. Конечно, я вытащу тебя. Я дам тебе что нибудь, типа зелья или свитка с собой."
items.quest.escapecrystal.leaving_fully_explored=Время будто замедляется, когда вы слышите голос Беса:\n\n"Тебе нужно уйти? Ну, по крайней мере ты неплохо исследовал хранилище. Я надеялся, что ты разграбишь его попроще, но, теперь у меня есть идея получше, как работать с этим местом сейчас."\n\n"Я могу тебе дать что нибудь с собой, но ничего магически улучшенного!"
items.quest.escapecrystal.leaving_partial_victory=Время будто замедляется, когда вы слышите голос Беса:\n\n"Я надеялся, что ты вытащишь мою статуэтку, но ты хорошо поработал, исследуя и зачищая хранилище!"\n\n"Знаешь что, я отдам тебе любой предмет, но только если он улучшен не выше +1, а так же открою лавку в подземелье. Мне нужно немного времени, что бы понять, что делать дальше."
items.quest.escapecrystal.leaving_victory=Время будто замедляется, когда вы слышите голос Беса:\n\n"Великолепная работа! Ты готов уйти? Я заберу статую у тебя, когда ты вернешься."\n\n"Как я и обещал, я открою лавку дальше, а так же дам тебе выбрать все отсюда, что захочешь! Не торопись, но имей ввиду, все остальное останется в хранилище."
items.quest.escapecrystal.leaving_item=Вы уверены, что это именно та вещь, которую вы хотите взять с собой?
items.quest.escapecrystal.leaving_seal=_Сломанная печать, закрепленная на этом доспехе, связана с зеркалом, и вы не можете забрать ее с собой._ Печать будет автоматически удалена с брони. Это понизит уровень доспеха на 1, но не удалит нанесенную на него руну.
items.quest.escapecrystal.leaving_staff=_Этот Посох Мага связан с зеркалом, и его нельзя забрать с собой, однако, палочку, которой наделен посох - можно._ Палочка будет автоматически извлечена из посоха, а вы получите её с уровнем -1 от текущего.
items.quest.escapecrystal.leaving_yes=Покинуть хранилище
items.quest.escapecrystal.leaving_no=Остаться здесь
items.quest.escapecrystal.error_start=Похоже, вы не находитесь на этаже хранилища! Возможно, это произошло из-за ошибки или сбоя.
items.quest.escapecrystal.error_no_items=Ваши предметы больше не на хранении, поэтому кристалл был удален из вашего инвентаря.
items.quest.escapecrystal.error_with_items=Ваши предметы сейчас находятся на хранении, поэтому вам следует снова спуститься в хранилище, чтобы начать задание. Все хранящиеся предметы будут возвращены вам по завершении задания.

items.quest.gooblob.name=сгусток слизи
items.quest.gooblob.desc=Желеобразный комочек, оставшийся после Слизня. Похоже на большой желейный шарик, но вы бы не рискнули попробовать его на вкус.\n\nСам по себе он бесполезен, но может проявить свои свойства в комбинации с зельем или бомбой. В крайнем случае, его можно просто продать или конвертировать в энергетические кристаллы.
items.quest.gooblob.discover_hint=Вы можете получить этот предмет как трофей с определённых врагов.

items.quest.impstatue.name=обсидиановая статуэтка
items.quest.impstatue.desc=Небольшая статуэтка угольно черного цвета, вырезанная из обсидиана. Она напоминает беса, который отправил вас сюда; у неё даже такие же светящиеся зелёные глаза как у него. А на постаменте статуэтки выгравирована надпись на языке, которого вы раньше никогда не встречали.
items.quest.impstatue.discover_hint=Вы можете найти этот предмет во время определённого задания.

items.quest.vaultbeacon.name=маяк хранилища
items.quest.vaultbeacon.desc=Похоже, у этого заклинания с маяком возвращения уже установлено какое-то местоположение - вероятно, это та самая комната, в которой вы его нашли.\n\nЕго можно использовать, чтобы сэкономить время во время путешествия, или как способ спасения в случае опасности.
items.quest.vaultbeacon.discover_hint=Вы можете найти этот предмет во время определённого задания.

items.quest.metalshard.name=проклятый осколок
items.quest.metalshard.desc=Ржавый осколок проклятого металла - это всё, что осталось от DM-300. Вы чувствуете в нём скрытую тёмную магию.\n\nСам по себе он бесполезен, но может проявить свои свойства в сочетании с бомбой или свитком. В крайнем случае, его можно просто продать или конвертировать в энергетические кристаллы.
items.quest.metalshard.discover_hint=Вы можете получить этот предмет как трофей с определённых врагов.

items.quest.pickaxe.name=кирка
items.quest.pickaxe.ac_mine=ДОБЫТЬ
items.quest.pickaxe.no_vein=Рядом нет жил тёмного золота.
items.quest.pickaxe.ability_name=пробить
items.quest.pickaxe.ability_desc=Дуэлянт может _пробить_ врага киркой. Это гарантирует попадание, добавляет уязвимость на 3 хода и наносит _%1$d-%2$d урона_ врагам с жёсткой кожей.
items.quest.pickaxe.upgrade_ability_stat_name=Урон Способности
items.quest.pickaxe.desc=Это большой и прочный инструмент для добычи руды. В крайнем случае, эта кирка может использоваться и как оружие.
items.quest.pickaxe.discover_hint=Вы можете найти этот предмет во время определённого задания.

items.quest.ratskull.name=Череп гигантской крысы
items.quest.ratskull.desc=Удивительно огромный крысиный череп. Из него вышел бы неплохой трофей, если бы вам было куда его вешать.



###remains
items.ground.remains.remainsitem.ac_use=ПРИМЕНИТЬ
items.ground.remains.remainsitem.discover_hint=Вы можете найти этот предмет в останках определённого героя с прошлого проигранного забега.

items.ground.remains.bowfragment.name=частичка лука
items.ground.remains.bowfragment.desc=Этот сломанный кусок древесины когда-то был частью Лука Духов, принадлежащего заблудшей Охотнице. Вы всё ещё чувствуете еле сохранившуюся крупицу энергии природы, которую вы можете использовать, чтобы вырастить вокруг вас высокую траву. Однако, это разрушит частичку лука.

items.ground.remains.brokenhilt.name=сломанная рукоять
items.ground.remains.brokenhilt.desc=Это сломанная рукоять, видимо, часть оружия, которое принадлежало побеждённой Дуэлянту. Вы всё ещё чувствуете частичку боевой энергии, которая осталась в этом эфесе, которую вы можете использовать, чтобы получить небольшой бонус к урону для следующих двух рукопашных атак. Однако, это уничтожит сломанную рукоять.

items.ground.remains.brokenstaff.name=разломанный посох
items.ground.remains.brokenstaff.desc=Этот Посох Мага был сломан пополам после того, как его владелец встретил свою кончину. Вы всё ещё чувствуете оставшиеся потоки магической энергии в этом посохе, которые вы можете использовать, чтобы дать вашим палочкам небольшой бонус к зарядке. Однако, это уничтожит разломанный посох.

items.ground.remains.cloakscrap.name=обрывок ткани
items.ground.remains.cloakscrap.desc=Этот кусок полупрозрачной ткани явно раньше принадлежал Плащу Теней Разбойника. Вы всё ещё ощущаете загадочную энергию, циркулирующую по нему, которую вы можете использовать, чтобы дать вашим артефактам небольшой бонус к зарядке. Однако, это уничтожит обрывок ткани.

items.ground.remains.sealshard.name=осколки печати
items.ground.remains.sealshard.desc=Эти мелкие осколки красного воска, вероятно, когда-то были печатью павшего Воина. Вы всё ещё ощущаете часть воли, заключённой в печати, которую вы можете использовать, чтобы создать немного защиты поверх здоровья. Однако это уничтожит осколки печати.

items.ground.remains.tornpage.name=вырванная страница
items.ground.remains.tornpage.desc=Эта страница выглядит так, как будто её вырвали из исчерпанного священного тома Клирика. На ней всё ещё остаётся немного божественной энергии, которую можно использовать, чтобы восстановить немного здоровья. Однако использование этой энергии приведет к уничтожению разорванной страницы.



###rings
items.equipment.rings.ring.diamond=кольцо с бриллиантом
items.equipment.rings.ring.opal=кольцо с опалом
items.equipment.rings.ring.garnet=кольцо с гранатом
items.equipment.rings.ring.ruby=кольцо с рубином
items.equipment.rings.ring.amethyst=кольцо с аметистом
items.equipment.rings.ring.topaz=кольцо с топазом
items.equipment.rings.ring.onyx=кольцо с ониксом
items.equipment.rings.ring.tourmaline=кольцо с турмалином
items.equipment.rings.ring.emerald=кольцо с изумрудом
items.equipment.rings.ring.sapphire=кольцо с сапфиром
items.equipment.rings.ring.quartz=кольцо с кварцем
items.equipment.rings.ring.agate=кольцо с агатом
items.equipment.rings.ring.equip_cursed=Кольцо болезненно сжимает ваш палец!
items.equipment.rings.ring.unknown_desc=Эта круглая полоска металла украшена сверкающим драгоценным камнем. Кто знает, что будет, если её надеть?
items.equipment.rings.ring.known=Это %s
items.equipment.rings.ring.identify=Вы достаточно долго знакомы с кольцом, чтобы опознать его.
items.equipment.rings.ring.cursed_worn=Ваше кольцо проклято, вы не в силах его снять.
items.equipment.rings.ring.curse_known=Вы чувствуете, что это кольцо скрывает в себе какую-то темную магию.
items.equipment.rings.ring.not_cursed=Это кольцо не проклято.

items.equipment.rings.ringofaccuracy.name=кольцо меткости
items.equipment.rings.ringofaccuracy.stats=Пока это кольцо надето, оно будет увеличивать точность на _%s%%._
items.equipment.rings.ringofaccuracy.typical_stats=Пока это кольцо надето, оно должно будет увеличивать точность на _%s%%._
items.equipment.rings.ringofaccuracy.combined_stats=Ваши надетые кольца объединили свою силу и теперь вместе увеличивают точность на _%s%%._
items.equipment.rings.ringofaccuracy.upgrade_stat_name_1=Усиление Меткости
items.equipment.rings.ringofaccuracy.desc=Это кольцо повышает вашу сосредоточенность, снижая шансы врагов уклониться от атаки. Проклятое кольцо, напротив, будут увеличивать шанс промахнуться.

items.equipment.rings.ringofarcana.name=кольцо волшебства
items.equipment.rings.ringofarcana.stats=Пока это кольцо надето, оно будет увеличивать силу зачарований и рун на _%s %%._
items.equipment.rings.ringofarcana.typical_stats=Пока это кольцо надето, оно обычно увеличивает силу зачарований и рун на _%s%%._
items.equipment.rings.ringofarcana.combined_stats=Ваши надетые кольца объединили свою силу и теперь вместе увеличивают силу зачарований и рун на _%s%%._
items.equipment.rings.ringofarcana.upgrade_stat_name_1=Усиление Волшебства
items.equipment.rings.ringofarcana.desc=Это кольцо усиливает магические зачарования на оружии и руны на броне, включая проклятия! Сначала это увеличивает шанс активации, а затем увеличивает силу эффекта, как только шанс активации достигает 100%. Вместо этого проклятое кольцо ослабит зачарования, руны и проклятия.

items.equipment.rings.ringofelements.name=кольцо стихий
items.equipment.rings.ringofelements.stats=Пока это кольцо надето, оно будет давать _%s%%_ защиты от стихий.
items.equipment.rings.ringofelements.typical_stats=Пока это кольцо надето, оно должно будет давать _%s%%_ защиты от стихий.
items.equipment.rings.ringofelements.combined_stats=Ваши надетые кольца объединили свою силу и теперь вместе дают _%s%%_ защиты от стихий.
items.equipment.rings.ringofelements.upgrade_stat_name_1=Сопротивление
items.equipment.rings.ringofelements.desc=Это кольцо обеспечивает сопротивление большинству стихийных и магических эффектов, уменьшая урон и длительность дебаффов. Естественно, проклятое кольцо вместо этого усилит силу негативных эффектов.

items.equipment.rings.ringofenergy.name=кольцо энергии
items.equipment.rings.ringofenergy.stats=При ношении это кольцо увеличит скорость заряда палочек, артефактов и героической брони на _%s%%._
items.equipment.rings.ringofenergy.typical_stats=При ношении это кольцо обычно увеличивает скорость заряда палочек, артефактов и героической брони на _%s%%._
items.equipment.rings.ringofenergy.combined_stats=Ваши надетые кольца объединили свою силу и теперь вместе увеличивают скорость зарядов на _%s%%._
items.equipment.rings.ringofenergy.upgrade_stat_name_1=Усиление Зарядки
items.equipment.rings.ringofenergy.desc=Ваше магическое снаряжение будет быстрее заряжаться в магическом поле, излучаемом этим кольцом. Вместо этого проклятое кольцо замедлит перезарядку.

items.equipment.rings.ringofevasion.name=кольцо уклонения
items.equipment.rings.ringofevasion.stats=Пока это кольцо надето, оно будет увеличивать ваш шанс увернуться на _%s%%._
items.equipment.rings.ringofevasion.typical_stats=Пока это кольцо надето, оно должно будет увеличивать ваш шанс увернуться на _%s%%._
items.equipment.rings.ringofevasion.combined_stats=Ваши надетые кольца объединили свою силу и теперь вместе увеличивают ваш шанс увернуться на _%s%%._
items.equipment.rings.ringofevasion.upgrade_stat_name_1=Усиление Уклонения
items.equipment.rings.ringofevasion.desc=Это кольцо ускоряет реакцию владельца, и по нему становится сложнее попасть. Проклятое кольцо, наоборот, понижает шанс увернуться.

items.equipment.rings.ringofforce.name=кольцо урона
items.equipment.rings.ringofforce.stats=При вашей текущей силе, если вы безоружны, это кольцо будет наносить _%1$d-%2$d урона,_ а если вы вооружены, урон вашего оружия увеличится на _%3$d._
items.equipment.rings.ringofforce.typical_stats=При вашей текущей силе, если вы безоружны, это кольцо должно будет наносить _%1$d-%2$d урона,_ а если вы вооружены, урон вашего оружия должен увеличиться на _%3$d._
items.equipment.rings.ringofforce.combined_stats=Ваши надетые кольца объединили свою силу и теперь вместе будут наносить _%1$d-%2$d урона_ если вы безоружны или увеличат урон на _%3$d_ если вы вооружены.
items.equipment.rings.ringofforce.upgrade_stat_name_1=Безоружный Урон
items.equipment.rings.ringofforce.upgrade_stat_name_2=Усиление Урона Оружием
items.equipment.rings.ringofforce.upgrade_stat_name_3=Урон Способности
items.equipment.rings.ringofforce.ability_name=боевая стойка
items.equipment.rings.ringofforce.typical_ability_desc=Дуэлянт может встать в _боевую стойку_ при помощи кольца урона. Пока Дуэлянт находится в стойке, её атаки будут использовать кольцо урона, даже с экипированным оружием. Эти атаки обычно наносят _%1$d-%2$d урона_, а так же перенимают эффект камня баланса и зачарование оружия. Стойка замедляет восстановление зарядов оружия на 50%%.
items.equipment.rings.ringofforce.ability_desc=Дуэлянт может встать в _боевую стойку_ при помощи кольца урона. Пока Дуэлянт находится в стойке, её атаки будут использовать кольцо урона, даже с экипированным оружием. Эти атаки наносят _%1$d-%2$d урона_, а так же перенимают эффект камня баланса и зачарование оружия. Стойка замедляет восстановление зарядов оружия на 50%%.
items.equipment.rings.ringofforce.desc=Это кольцо увеличивает силу ударов владельца. Эффект не так значителен при использовании оружия, но при атаке голыми руками вы будете наносить значительно больший урон. Проклятое же кольцо, напротив, ослабит удары.
items.equipment.rings.ringofforce$brawlersstance.name=боевая стойка
items.equipment.rings.ringofforce$brawlersstance.desc=Находясь в стойке, обычные атаки Дуэлянта будут использовать экипированное Кольцо Урона даже если у неё экипировано оружие. Атаки получат дополнительный урон и будут подвержены эффектам Камня Баланса и зачарованиям оружия.\n\nПоддержание стойки помогает сфокусироваться, но уменьшает скорость перезарядки зарядов оружия на 50%.\n\nМожно встать и выйти из стойки используя Кольцо Урона, но уменьшение скорости перезарядки будет наложено даже если стойка была быстро активирована и деактивирована.

items.equipment.rings.ringoffuror.name=кольцо неистовства
items.equipment.rings.ringoffuror.stats=Пока это кольцо надето, оно будет увеличивать скорость ваших атак на _%s%%._
items.equipment.rings.ringoffuror.typical_stats=Пока это кольцо надето, оно должно будет увеличивать скорость ваших атак на _%s%%._
items.equipment.rings.ringoffuror.combined_stats=Ваши надетые кольца объединили свою силу и теперь вместе увеличивают скорость ваших атак на _%s%%._
items.equipment.rings.ringoffuror.upgrade_stat_name_1=Усиление Скорости Атаки
items.equipment.rings.ringoffuror.desc=Это кольцо порождает во владельце ярость, позволяя ему наносить удары быстрее, чем обычно. Проклятое же кольцо, напротив, будет замедлять атаки.

items.equipment.rings.ringofhaste.name=кольцо ускорения
items.equipment.rings.ringofhaste.stats=Пока это кольцо надето, оно будет увеличивать скорость передвижения на _%s%%._
items.equipment.rings.ringofhaste.typical_stats=Пока это кольцо надето, оно должно будет увеличивать скорость передвижения на _%s%%._
items.equipment.rings.ringofhaste.combined_stats=Ваши надетые кольца объединили свою силу и теперь вместе увеличивают скорость передвижения на _%s%%._
items.equipment.rings.ringofhaste.upgrade_stat_name_1=Усиление Скорости Передвижения
items.equipment.rings.ringofhaste.desc=Это кольцо снижает утомление от бега и даёт владельцу способность перемещаться быстрее человеческих возможностей. Проклятое же кольцо, напротив, уменьшает скорость передвижения.

items.equipment.rings.ringofmight.name=кольцо мощи
items.equipment.rings.ringofmight.stats=Пока это кольцо надето, оно будет увеличивать вашу силу на _%1$d_ и максимальное количество здоровья на _%2$s%%._
items.equipment.rings.ringofmight.typical_stats=Пока это кольцо надето, оно должно будет увеличивать вашу силу на _%1$d_ и максимальное количество здоровья на _%2$s%%._
items.equipment.rings.ringofmight.combined_stats=Ваши надетые кольца объединили свою силу и теперь вместе увеличивают вашу силу на _%1$d_ и максимальное количество здоровья на _%2$s%%._
items.equipment.rings.ringofmight.upgrade_stat_name_1=Усиление силы
items.equipment.rings.ringofmight.upgrade_stat_name_2=Усиление макс. ОЗ
items.equipment.rings.ringofmight.desc=Это кольцо улучшает физические параметры своего владельца, даруя ему повышенную силу и выносливость. Проклятое же кольцо, напротив, снижает силу и здоровье владельца.

items.equipment.rings.ringofsharpshooting.name=кольцо стрельбы
items.equipment.rings.ringofsharpshooting.stats=Пока это кольцо надето, оно будет увеличивать урон от ваших метательных оружий настолько, будто их уровень увеличен на _%1$d_, и их прочность будет увеличена на _%2$s%%._
items.equipment.rings.ringofsharpshooting.typical_stats=Пока это кольцо надето, оно должно будет увеличивать урон от ваших метательных оружий настолько, будто их уровень увеличен на _%1$d_, и их прочность будет увеличена на _%2$s%%._
items.equipment.rings.ringofsharpshooting.combined_stats=Ваши надетые кольца объединили свою силу и теперь вместе увеличивают урон от ваших метательных оружий настолько, будто их уровень увеличен на _%1$d_, и их прочность будет увеличена на _%2$s%%._
items.equipment.rings.ringofsharpshooting.upgrade_stat_name_1=Повышение уровня урона
items.equipment.rings.ringofsharpshooting.upgrade_stat_name_2=Усиление прочности
items.equipment.rings.ringofsharpshooting.desc=Это кольцо улучшает меткость и глазомер владельца, увеличивая урон и срок службы любых метательных оружий. Проклятое кольцо даёт обратный эффект.

items.equipment.rings.ringoftenacity.name=кольцо живучести
items.equipment.rings.ringoftenacity.stats=Пока это кольцо надето, оно будет снижать получаемый урон не более чем на _%s%%_.
items.equipment.rings.ringoftenacity.typical_stats=Пока это кольцо надето, оно должно будет снижать получаемый урон не более чем на _%s%%._
items.equipment.rings.ringoftenacity.combined_stats=Ваши надетые кольца объединили свою силу и теперь вместе снижают получаемый урон не более чем на _%s%%._
items.equipment.rings.ringoftenacity.upgrade_stat_name_1=Максимальное сопротивление к урону
items.equipment.rings.ringoftenacity.desc=Будучи надетым, это кольцо позволит владельцу переживать ранения, которые в ином случае стали бы для него смертельными. Чем сильнее ранен владелец, тем сильнее будет этот эффект. Проклятое же кольцо, напротив, будет делать владельца более уязвимым к добиванию.

items.equipment.rings.ringofwealth.name=кольцо богатства
items.equipment.rings.ringofwealth.stats=Пока это кольцо надето, оно будет увеличивать вашу удачу на _%s%%._
items.equipment.rings.ringofwealth.typical_stats=Пока это кольцо надето, оно должно будет увеличивать вашу удачу на _%s%%._
items.equipment.rings.ringofwealth.combined_stats=Ваши надетые кольца объединили свою силу и теперь вместе увеличивают вашу удачу на _%s%%._
items.equipment.rings.ringofwealth.upgrade_stat_name_1=Усиление удачи
items.equipment.rings.ringofwealth.desc=Это кольцо действует как магнит для сокровищ, увеличивая вероятность того, что враги и сундуки будут содержать ценные предметы. Проклятое кольцо, вместо этого, уменьшит ваши шансы получить добычу.



###scrolls
items.consum.scrolls.scroll.ac_read=ЧИТАТЬ
items.consum.scrolls.scroll.kaunan=свиток КЕНАЗ
items.consum.scrolls.scroll.sowilo=свиток СОВИЛО
items.consum.scrolls.scroll.laguz=свиток ЛАГУЗ
items.consum.scrolls.scroll.yngvi=свиток ИНГУЗ
items.consum.scrolls.scroll.gyfu=свиток ГЕБО
items.consum.scrolls.scroll.raido=свиток РАЙДО
items.consum.scrolls.scroll.isaz=свиток ИСА
items.consum.scrolls.scroll.mannaz=свиток МАННАЗ
items.consum.scrolls.scroll.naudiz=свиток НАУТИЗ
items.consum.scrolls.scroll.berkanan=свиток БЕРКАНА
items.consum.scrolls.scroll.ncosrane=свиток НКОСРАНЕ
items.consum.scrolls.scroll.odal=свиток ОДАЛ
items.consum.scrolls.scroll.tiwaz=свиток ТЕЙВАЗ
items.consum.scrolls.scroll.nendil=свиток НЕНДИЛ
items.consum.scrolls.scroll.libra=свиток ЛИБРА
items.consum.scrolls.scroll.unknown_desc=Этот манускрипт покрыт непонятными письменами, озаглавленными неизвестной вам руной. Кто знает, что будет, если прочитать его вслух?
items.consum.scrolls.scroll.blinded=Вы ослеплены и не можете разобрать, что написано на этом свитке.
items.consum.scrolls.scroll.no_magic=Вы не можете использовать свитки под действием антимагии.
items.consum.scrolls.scroll.cursed=Ваша проклятая нестабильная книга заклинаний не дает вам использовать силу этого свитка! Возможно, свиток Рассеяния все равно сможет сработать...
items.consum.scrolls.scroll$placeholder.name=свиток

items.consum.scrolls.inventoryscroll.warning=Вы действительно хотите отменить использование этого свитка? Он все равно будет истрачен, так как не был опознан.
items.consum.scrolls.inventoryscroll.yes=Да, я уверен
items.consum.scrolls.inventoryscroll.no=Нет, я передумал

items.consum.scrolls.scrollofidentify.name=свиток Опознания
items.consum.scrolls.scrollofidentify.inv_title=Какой предмет опознать?
items.consum.scrolls.scrollofidentify.it_is=Ваш предмет был опознан: %s.
items.consum.scrolls.scrollofidentify.desc=Этот свиток способен навсегда открыть все тайны одного предмета.

items.consum.scrolls.scrolloflullaby.name=свиток Колыбельной
items.consum.scrolls.scrolloflullaby.sooth=В воздухе раздается убаюкивающая мелодия. Вы чувствуете, что хотите спать.
items.consum.scrolls.scrolloflullaby.desc=Чтение этого свитка вслух вызывает тихую мелодию, которая погрузит всех, кто её слышал, в глубокий волшебный сон. Для прочитавшего этот свиток и его союзников, этот сон будет оздоровляющим.

items.consum.scrolls.scrollofmagicmapping.name=свиток Магической карты
items.consum.scrolls.scrollofmagicmapping.layout=Теперь вы знакомы с планировкой этого уровня.
items.consum.scrolls.scrollofmagicmapping.desc=После прочтения этого свитка в ваш разум впишется ясная картина уровня. Вам станут известны все коридоры и ловушки, в том числе скрытые. Однако местоположение предметов и существ останется неизвестным.

items.consum.scrolls.scrollofmirrorimage.name=свиток Зеркальных копий
items.consum.scrolls.scrollofmirrorimage.copies=Свиток сформировал зеркальные копии по вашему образу и подобию.
items.consum.scrolls.scrollofmirrorimage.no_copies=Свиток пытается воссоздать по вашему образу зеркальные копии, но им негде появиться.
items.consum.scrolls.scrollofmirrorimage.desc=При использовании, этот свиток создаст две зеркальных копии прочитавшего. Эти иллюзии слабее оригинала, но будут существовать до тех пор, пока не получат урон.

items.consum.scrolls.scrollofretribution.name=свиток Возмездия
items.consum.scrolls.scrollofretribution.blast=Свиток извергает мощную магическую энергию!
items.consum.scrolls.scrollofretribution.desc=Этот свиток содержит могущественную магию, способную передавать свои страдания всем окружающим. Сила эффекта зависит от того, насколько мало здоровья осталось у читающего, и в крайних случаях может даже мгновенно убить большинство врагов.\n\nОднако использование свитка не проходит без последствий, ослепляя и ослабляя прочитавшего.

items.consum.scrolls.scrollofrage.name=свиток Ярости
items.consum.scrolls.scrollofrage.roar=Свиток издаёт яростный рёв, эхом отдающийся в подземелье!
items.consum.scrolls.scrollofrage.desc=При прочтении вслух этот свиток издаст яростный рёв, привлекающий внимание врагов и вводящий в ярость тех, кто уже здесь.

items.consum.scrolls.scrollofrecharging.name=свиток Перезарядки
items.consum.scrolls.scrollofrecharging.surge=Сквозь ваше тело проходит поток энергии, заряжая ваши палочки!
items.consum.scrolls.scrollofrecharging.desc=В этом свитке заключена чистая магическая энергия, которая при высвобождении начнёт постепенно заряжать все палочки прочитавшего.

items.consum.scrolls.scrollofremovecurse.name=свиток Рассеяния проклятия
items.consum.scrolls.scrollofremovecurse.inv_title=Какой предмет очищать?
items.consum.scrolls.scrollofremovecurse.cleansed=Ваш предмет окутывает сияние, и тёмная энергия покидает его!
items.consum.scrolls.scrollofremovecurse.not_cleansed=Ваш предмет окутывает сияние, но ничего не происходит.
items.consum.scrolls.scrollofremovecurse.spirit=Ваш свиток освобождает измученного призрака!
items.consum.scrolls.scrollofremovecurse.desc=Магия этого свитка позволит снять проклятие с одного оружия, кольца, палочки, доспеха или артефакта.

items.consum.scrolls.scrollofteleportation.name=свиток Телепортации
items.consum.scrolls.scrollofteleportation.tele=В мгновенье ока вы оказываетесь в другом месте уровня.
items.consum.scrolls.scrollofteleportation.no_tele=Телепортация не удалась.
items.consum.scrolls.scrollofteleportation.cant_reach=Вы не можете телепортироваться сюда.
items.consum.scrolls.scrollofteleportation.prompt=Куда телепортироваться?
items.consum.scrolls.scrollofteleportation.desc=Магия этого свитка мгновенно переносит прочитавшего в случайную локацию на этом же этаже. Свиток чаще всего переносит в те места, в которых прочитавший ещё не был до этого, но не может телепортировать за закрытые двери или баррикады. Он, однако, способен показать скрытые двери, которые ведут в новые области.

items.consum.scrolls.scrollofterror.name=свиток Ужаса
items.consum.scrolls.scrollofterror.none=Свиток излучает яркий красный свет.
items.consum.scrolls.scrollofterror.one=Свиток излучает яркий красный свет, и %s убегает!
items.consum.scrolls.scrollofterror.many=Свиток излучает яркий красный свет, и монстры убегают!
items.consum.scrolls.scrollofterror.desc=Вспышка красного света наполнит всех видимых существ ужасом и они попытаются убежать. Любой удар по убегающему врагу ослабит этот эффект.

items.consum.scrolls.scrolloftransmutation.name=свиток Превращения
items.consum.scrolls.scrolloftransmutation.inv_title=Превратить предмет
items.consum.scrolls.scrolloftransmutation.nothing=Ничего не произошло.
items.consum.scrolls.scrolloftransmutation.morph=Ваш предмет превращается во что-то другое!
items.consum.scrolls.scrolloftransmutation.desc=Этот свиток содержит могущественное заклинание превращения. Если использовать на подходящем предмете, свиток превратит его в другой предмет такого же типа. При этом сохранятся все улучшения и зачарования. Свитки и зелья будут превращены в их особый эквивалент или в обратную сторону.

items.consum.scrolls.scrollofupgrade.name=свиток Улучшения
items.consum.scrolls.scrollofupgrade.inv_title=Какой предмет улучшить?
items.consum.scrolls.scrollofupgrade.weaken_curse=Свиток улучшения ослабляет проклятие на этом предмете.
items.consum.scrolls.scrollofupgrade.remove_curse=Свиток улучшения развеивает проклятие на этом предмете!
items.consum.scrolls.scrollofupgrade.desc=Этот свиток улучшит один предмет или комплект метательного оружия. У палочки возрастёт мощь и количество зарядов, оружие и броня будут наносить и поглощать больше урона, комплекты метательного оружия будут полностью восстановлены и станут более прочными, а эффективность колец увеличится.\n\nЭтот свиток способен ослабить или даже снять проклятие, хотя он и не столь эффективен, как свиток Рассеяния проклятия. Магия этого свитка, к сожалению, способна снять зачарование на оружии или рун на брони более высоких уровней.



###exotic scrolls
items.consum.scrolls.exotic.exoticscroll.kaunan=особый свиток КЕНАЗ
items.consum.scrolls.exotic.exoticscroll.sowilo=особый свиток СОВИЛО
items.consum.scrolls.exotic.exoticscroll.laguz=особый свиток ЛАГУЗ
items.consum.scrolls.exotic.exoticscroll.yngvi=особый свиток ИНГУЗ
items.consum.scrolls.exotic.exoticscroll.gyfu=особый свиток ГЕБО
items.consum.scrolls.exotic.exoticscroll.raido=особый свиток РАЙДО
items.consum.scrolls.exotic.exoticscroll.isaz=особый свиток ИСА
items.consum.scrolls.exotic.exoticscroll.mannaz=особый свиток МАННАЗ
items.consum.scrolls.exotic.exoticscroll.naudiz=особый свиток НАУТИЗ
items.consum.scrolls.exotic.exoticscroll.berkanan=особый свиток БЕРКАНА
items.consum.scrolls.exotic.exoticscroll.odal=особый свиток ОДАЛ
items.consum.scrolls.exotic.exoticscroll.tiwaz=особый свиток ТЕЙВАЗ
items.consum.scrolls.exotic.exoticscroll.unknown_desc=Этот чёрный манускрипт покрыт непонятными светящимися письменами и совсем не похож на обычные свитки. Кто знает, что будет, если прочитать его вслух?
items.consum.scrolls.exotic.exoticscroll.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.consum.scrolls.exotic.scrollofsirenssong.name=свиток Песни Сирены
items.consum.scrolls.exotic.scrollofsirenssong.prompt=Выберите цель
items.consum.scrolls.exotic.scrollofsirenssong.no_target=Свиток был использован без цели.
items.consum.scrolls.exotic.scrollofsirenssong.cancel=Нужно выбрать цель.
items.consum.scrolls.exotic.scrollofsirenssong.desc=После чтения этого свитка раздастся приятная мелодия, которая зачарует и превратить одного выбранного противника в вашего постоянного союзника! Остальные враги, услышавшие мелодию, будут временно очарованы.\n\nОднако, сильные противники могут противостоять этому эффекту. При выборе их в качестве цели они будут просто очарованы.
items.consum.scrolls.exotic.scrollofsirenssong$enthralled.name=зачарованный
items.consum.scrolls.exotic.scrollofsirenssong$enthralled.desc=Это существо было околдовано магией свитка очарования.\n\nТеперь это существо - ваш союзник и оно будет сражаться за вас.

items.consum.scrolls.exotic.scrollofantimagic.name=свиток Антимагии
items.consum.scrolls.exotic.scrollofantimagic.desc=Заклинание в этом свитке окружит вас волшебной аурой, временно блокирующей любые вредные и полезные магические эффекты. Это включает большинство эффектов магических предметов, таких как палочки, свитки, кольца, артефакты, зачарования и проклятия. Однако способности героической брони настолько сильные, что могут работать даже под воздействием этого эффекта.

items.consum.scrolls.exotic.scrollofchallenge.name=свиток Вызова
items.consum.scrolls.exotic.scrollofchallenge.desc=Когда прочтён, свиток издаст громкий рёв, который привлечёт врагов к прочитавшему, создавая тем временем маленькую арену вокруг него.\n\nПока прочитавший остаётся в этой арене, он будет получать на 33% меньше урона от всех источников оного (это сопротивление будет учитываться перед всеми остальными формами сопротивлению урона), и не будет терять сытости.\n\nРазмер арены будет зависеть от размера комнаты, в котором находится прочитавший. Размер будет особенно меньше в комнатах некоторых боссов.
items.consum.scrolls.exotic.scrollofchallenge$challengearena.name=арена вызова
items.consum.scrolls.exotic.scrollofchallenge$challengearena.desc=Магическая арена появилась вокруг вас, очерченную клубящимся красным туманом.\n\nПока вы стоите в тумане, ваш голод не будет увеличиваться и вы будете получать на 33%% меньше урона от всех источников оного. Если у вас есть другое сопротивление урону (например, броня), оно будет учитываться после 33%% сопротивления.\n\nХодов осталось: %d.

items.consum.scrolls.exotic.scrollofdivination.name=свиток Предсказания
items.consum.scrolls.exotic.scrollofdivination.nothing_left=Больше нечего опознавать!
items.consum.scrolls.exotic.scrollofdivination.desc=Этот свиток опознает четыре случайных неопознанных предмета. Это может быть цвет зелья, руна свитка или камень кольца. Опознанные предметы необязательно будут предметами из вашего инвентаря.
items.consum.scrolls.exotic.scrollofdivination$wnddivination.desc=Ваш свиток предсказания распознал следующие предметы:

items.consum.scrolls.exotic.scrollofdread.name=свиток Кошмара
items.consum.scrolls.exotic.scrollofdread.desc=Когда прочтён, свиток выпустит волну красного света, которая внушит неописуемый ужас всем врагам в поле зрения. Эффект настолько сильный, что враги попытаются удрать из подземелья без оглядки!\n\nТак же как и ужас, этот эффект ослабевает со временем, или когда враг атакован.\n\nНа врагов с сильной волей, например боссов, будет наложен обычный ужас.

items.consum.scrolls.exotic.scrollofenchantment.name=свиток Зачарования
items.consum.scrolls.exotic.scrollofenchantment.inv_title=Зачаровать предмет
items.consum.scrolls.exotic.scrollofenchantment.weapon=Выберите, какое зачарование применить к вашему оружию.
items.consum.scrolls.exotic.scrollofenchantment.armor=Выберите, какую руну нанести на вашу броню.
items.consum.scrolls.exotic.scrollofenchantment.cancel=Отменить
items.consum.scrolls.exotic.scrollofenchantment.cancel_warn=При отмене свиток зачарования будет истрачен зря, вы уверены?
items.consum.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Да, я уверен
items.consum.scrolls.exotic.scrollofenchantment.cancel_warn_no=Нет, я передумал
items.consum.scrolls.exotic.scrollofenchantment.desc=Этот свиток наполнит оружие или броню мощной волшебной энергией. Прочитавший даже сможет в некоторой степени контролировать тип накладываемого зачарования.

items.consum.scrolls.exotic.scrollofforesight.name=свиток Предвидения
items.consum.scrolls.exotic.scrollofforesight.desc=В разум прочитавшего этот свиток с предельной ясностью начнет поступать информация об окружающей местности. Это позволит автоматически обнаруживать любые секреты в радиусе своего поиска.

items.consum.scrolls.exotic.scrollofmetamorphosis.name=свиток Метаморфозы
items.consum.scrolls.exotic.scrollofmetamorphosis.choose_desc=Выберите талант для преобразования.
items.consum.scrolls.exotic.scrollofmetamorphosis.replace_desc=Выберите новый талант на замену преобразованному.
items.consum.scrolls.exotic.scrollofmetamorphosis.cancel_warn=При отмене свиток превращения будет истрачен зря, вы уверены?
items.consum.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=Преобразовать талант
items.consum.scrolls.exotic.scrollofmetamorphosis.desc=Этот свиток содержит мощную магию трансмутации, которая будет применена к заклинателю вместо предмета. Магия этого свитка позволит вам выбрать талант и заменить его одним из пяти талантов других классов такого же уровня.\n\nЭтот эффект может применяться только к талантам класса, не талантам подклассов или способностям брони. Таланты, которые вы не можете использовать не будут даны для выбора.

items.consum.scrolls.exotic.scrollofmysticalenergy.name=свиток Мистической энергии
items.consum.scrolls.exotic.scrollofmysticalenergy.desc=Необузданная магическая сила, заключенная в этом манускрипте, при высвобождении будет в течение некоторого времени заряжать экипированные артефакты.

items.consum.scrolls.exotic.scrollofpassage.name=свиток Прохода
items.consum.scrolls.exotic.scrollofpassage.desc=Заклинание на этом пергаменте мгновенно переносит читателя в ближайшую область на первом этаже над ними. Очень удобно для быстрого доступа в магазин.

items.consum.scrolls.exotic.scrollofprismaticimage.name=свиток Зеркальной копии
items.consum.scrolls.exotic.scrollofprismaticimage.desc=Заклятие в этом свитке создаст радужную копию прочитавшего. Эта иллюзия имеет меньший урон и живучесть, но примерно такую же защиту, что и оригинал.\n\nКопия появляется только при встрече с врагами, скрываясь из виду всё остальное время.\n\nЕсли радужная копия уже существует, она будет полностью исцелена.

items.consum.scrolls.exotic.scrollofpsionicblast.name=свиток Ментального удара
items.consum.scrolls.exotic.scrollofpsionicblast.ondeath=Ментальный удар разрывает ваш разум...
items.consum.scrolls.exotic.scrollofpsionicblast.desc=Этот свиток содержит невероятную разрушительную энергию, которая может быть направлена на уничтожение разумов видимых существ.\n\nОтдача, однако, настолько велика, что прочитавший также получит урон, будет ослеплён и ослаблен. Чем больше целей поразит свиток, тем меньше урона будет получено.
items.consum.scrolls.scrollofpsionicblast.name=Свиток Ментального удара
items.consum.scrolls.scrollofpsionicblast.ondeath=Ментальный удар разрывает ваш разум...
items.consum.scrolls.scrollofpsionicblast.desc=Этот свиток содержит невероятную разрушительную энергию, которая может быть направлена на уничтожение разумов видимых существ и усиливает псионическую силу пользователя.



###spells
items.consum.spells.alchemize.name=Трансмутация
items.consum.spells.alchemize.prompt=Расщепить предмет
items.consum.spells.alchemize.desc=Это заклинание содержит силы трансмутации, схожие с иными в алхимическом котле. Каждое заклинание позволяет превратить предмет (или несколько предметов) в золото или алхимическую энергию. Превращение зелий или свитков в энергию опознаёт их!\n\nНесколько готовых заклинаний Трансмутации продаётся в магазинах, но намного больше можно сделать с помощью алхимии, соединив в котле семя, рунный камень и немного алхимической энергии.
items.consum.spells.alchemize$wndalchemizeitem.sell=Превратить в %d золота
items.consum.spells.alchemize$wndalchemizeitem.sell_1=Превратить 1 в %d золота
items.consum.spells.alchemize$wndalchemizeitem.sell_all=Превратить всё в %d золота
items.consum.spells.alchemize$wndalchemizeitem.energize=Превратить в %d энергии
items.consum.spells.alchemize$wndalchemizeitem.energize_1=Превратить 1 в %d энергии
items.consum.spells.alchemize$wndalchemizeitem.energize_all=Превратить всё в %d энергии

items.consum.spells.beaconofreturning.name=Маяк возвращения
items.consum.spells.beaconofreturning.preventing=Сильная магия этого места не позволяет вам использовать заклинание!
items.consum.spells.beaconofreturning.creatures=Психическая аура близлежащих существ не позволяет вам телепортироваться.
items.consum.spells.beaconofreturning.set=Маяк был установлен в данном месте.
items.consum.spells.beaconofreturning.wnd_body=Установка перезапишет место установки.\n\nВозвращение вернёт вас в последнее установленное место.
items.consum.spells.beaconofreturning.wnd_set=Установить
items.consum.spells.beaconofreturning.wnd_return=Вернуться
items.consum.spells.beaconofreturning.desc_set=Маяк установлен где-то на %d этаже.
items.consum.spells.beaconofreturning.desc=Это сложное заклинание позволит пользователю вернуться в установленную местность, вне зависимости от расстояния. Заклинание тратится только при возвращении, оно может быть установлено сколько угодно раз. Но помните, что оно вернёт вас только в последнюю установленную точку.

items.consum.spells.curseinfusion.name=Проклятие
items.consum.spells.curseinfusion.inv_title=Проклясть предмет
items.consum.spells.curseinfusion.desc=Это заклинание наделит предмет вашей экипировки той же тёмной магией, что когда-то жила в DM-300. Любые зачарования или руны будут развеяны, а предмет станет проклят.\n\nОружия, доспехи и палочки при этом получат бонусы к уровню улучшения, но этот бонус исчезнет, если снять проклятие с предмета. Этот бонус нельзя применить повторно.\n\nЕго также можно использовать для изменения самого типа проклятия на оружии или доспехе.

items.consum.spells.spell.ac_cast=ПРИМЕНИТЬ
items.consum.spells.spell.no_magic=Вы не можете использовать заклинания под действием антимагии.
items.consum.spells.spell.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.consum.spells.magicalinfusion.name=Зачарование
items.consum.spells.magicalinfusion.inv_title=Какой предмет зачаровать?
items.consum.spells.magicalinfusion.infuse=Ваш предмет наполнен мистической энергией!
items.consum.spells.magicalinfusion.desc=Это заклинание практически аналогично свитку улучшения, но его энергия более стабильна.\n\nПри улучшении этим заклинанием оружия или доспеха, оно никогда не сотрет зачарование, руну или проклятье.

items.consum.spells.magicalporter.name=Транспортация
items.consum.spells.magicalporter.inv_title=Переместить предмет
items.consum.spells.magicalporter.nowhere=Тебе некуда переносить предмет.
items.consum.spells.magicalporter.desc=Это заклинание позволяет телепортировать любую вещь, но не к торговцу, а ко входу на этаже следующего босса.

items.consum.spells.phaseshift.name=Искажение
items.consum.spells.phaseshift.no_target=Здесь нечего телепортировать.
items.consum.spells.phaseshift.desc=Это хаотичное заклинание телепортирует свою цель в случайную точку этажа и оглушит её на продолжительный период. Однако, сильные враги, оглушение не получат. Оно может быть направлено как на себя, так и на кого-то другого.

items.consum.spells.reclaimtrap.name=Конвертация
items.consum.spells.reclaimtrap.no_trap=Тут нет ловушек.
items.consum.spells.reclaimtrap.desc_trap=Сейчас это заклинание готово к активации _%s._
items.consum.spells.reclaimtrap.desc=Это заклинание содержит остатки механической энергии DM-300. При использовании на активную ловушку, сила ловушки прикрепляется к вам, что позволяет использовать заклинание снова для высвобождения этой силы и активации эффекта ловушки в любом месте, на ваш выбор.\n\nТем не менее, некоторые ловушки могут не работать в некоторых местах, и можно хранить только одну ловушку за раз.

items.consum.spells.recycle.name=Переработка
items.consum.spells.recycle.inv_title=Переработать предмет
items.consum.spells.recycle.recycled=Предмет был переработан в: %s.
items.consum.spells.recycle.desc=Заклинание содержит слабую версию магии трансмутации. Пускай это не работает на экипировке, это заклинание может превратить свиток, зелье, семя, рунный камень или дротик с наконечником в случайный предмет того же типа.

items.consum.spells.summonelemental.name=вызов элементаля
items.consum.spells.summonelemental.ac_imbue=НАДЕЛИТЬ
items.consum.spells.summonelemental.imbue_prompt=Наделить предмет
items.consum.spells.summonelemental.desc=Это заклинание проводит энергию элементального пепла, использованного при изготовлении, и позволяет вам призвать союзного элементаля сражаться за вас! Только один элементаль может существовать одновременно, но заклинание можно использовать снова, чтобы призвать элементаля к вам.
items.consum.spells.summonelemental.desc_newborn=Заклинание в данный момент не наделено, и призовёт _молодого элементаля_ без дальнобойной атаки. Вы можете использовать опознанное Зелье Алхимического огня, Зелье Холода, Свиток Перезарядки или Свиток Превращения, для наполнения заклинания, чтобы в будущем призывать сильного элементаля!
items.consum.spells.summonelemental.desc_fire=Заклинание сейчас горячее на ощупь. Оно будет вызывать _огненного элементаля_. Вы можете наделить заклинание другим предметом, но оно потеряет текущее наполнение.
items.consum.spells.summonelemental.desc_frost=Заклинание сейчас холодное на ощупь. Оно будет вызывать _ледяного элементаля_. Вы можете наделить заклинание другим предметом, но оно потеряет текущее наполнение.
items.consum.spells.summonelemental.desc_shock=Заклинание сейчас излучает статическую энергию. Оно будет вызывать _электрического элементаля_. Вы можете наделить заклинание другим предметом, но оно потеряет текущее наполнение.
items.consum.spells.summonelemental.desc_chaos=Заклинание сейчас излучает хаотическую энергию. Оно будет вызывать _хаотического элементаля_. Вы можете наделить заклинание другим предметом, но оно потеряет текущее наполнение.

items.consum.spells.targetedspell.prompt=Выберите цель
items.consum.spells.targetedspell.inv_title=Какой предмет зачаровать?

items.consum.spells.telekineticgrab.name=Телекинетический захват
items.consum.spells.telekineticgrab.cant_grab=Вы не можете схватить это.
items.consum.spells.telekineticgrab.no_target=Здесь нечего хватать.
items.consum.spells.telekineticgrab.desc=Это заклинание позволяет захватывать все объекты на расстоянии или даже все застрявшее во враге метательное оружие!\n\nНо его нельзя использовать на чужих предметах или сундуках.

items.consum.spells.unstablespell.name=нестабильное заклинание
items.consum.spells.unstablespell.desc=Это маленький черный квадратный кристалл с движущимися руническими символами, начертанными на каждой из его поверхностей.\n\nПри активации он вызывает эффект случайного свитка. Эффект свитка всегда будет ориентирован на сражение, если в вашем поле зрения есть враги, и наоборот.

items.consum.spells.wildenergy.name=дикая энергия
items.consum.spells.wildenergy.desc=Это заклинание содержит часть проклятой энергии, которая питала DM-300. При активации оно перезарядит ваши палочки и экипированные артефакты, но вызовет случайный эффект, как если бы вы использовали проклятую палочку. Впрочем, вы всё же сможете выбрать направление выстрела.


###runestones
items.consum.stones.inventorystone.ac_use=ПРИМЕНИТЬ

items.consum.stones.runestone$placeholder.name=рунный камень
items.consum.stones.runestone.discover_hint=Вы можете случайно найти этот предмет в подземелье или создать его с помощью алхимии.

items.consum.stones.stoneofaggression.name=камень Агрессии
items.consum.stones.stoneofaggression.desc=Если бросить этот камень в кого-либо, все находящиеся рядом враги предпочтут атаковать этого персонажа в течение короткого времени.\n\nЭтот эффект не может напрямую воздействовать на боссов, но на удивление действует на их приспешников.
items.consum.stones.stoneofaggression$aggression.name=метка агрессии
items.consum.stones.stoneofaggression$aggression.desc=Волшебная энергия, которая заставляет всех ближайших врагов атаковать данную цель.\n\nОсталось ходов: %s.

items.consum.stones.stoneofaugmentation.name=камень Баланса
items.consum.stones.stoneofaugmentation.inv_title=Балансировать предмет
items.consum.stones.stoneofaugmentation.desc=Этот рунный камень обладает могучими чарами, которые могут балансировать экипировку, увеличивая одно свойство за счёт другого.\n\nДля оружия он позволяет улучшить либо урон, либо скорость атаки. Метательные оружия также или обретут, или потеряют прочность в зависимости от скорости атаки.\n\nДля доспехов он позволяет улучшить либо защиту, либо уклонение.
items.consum.stones.stoneofaugmentation.discover_hint=Вы можете купить этот предмет в магазине или создать его с помощью алхимии.
items.consum.stones.stoneofaugmentation$wndaugment.choice=Увеличение одного свойства приведет к уменьшению другого. Что вы хотели бы улучшить?
items.consum.stones.stoneofaugmentation$wndaugment.already=Этот предмет уже имеет улучшение, вы можете заменить его другим или вовсе удалить.
items.consum.stones.stoneofaugmentation$wndaugment.speed=+Скорость -Урон
items.consum.stones.stoneofaugmentation$wndaugment.damage=+Урон -Скорость
items.consum.stones.stoneofaugmentation$wndaugment.evasion=+Уклонение -Защита
items.consum.stones.stoneofaugmentation$wndaugment.defense=+Защита -Уклонение
items.consum.stones.stoneofaugmentation$wndaugment.none=Убрать балансирование
items.consum.stones.stoneofaugmentation$wndaugment.cancel=Я передумал

items.consum.stones.stoneofblast.name=камень Взрыва
items.consum.stones.stoneofblast.desc=Этот рунный камень моментально взорвётся при броске. Прямо как бомба, взрыв нанесёт урон всем, кто находится рядом.

items.consum.stones.stoneofblink.name=камень Перемещения
items.consum.stones.stoneofblink.desc=Если бросить этот рунный камень на пол, то он перенесёт своего владельца на место своего падения.

items.consum.stones.stoneofclairvoyance.name=камень Ясновидения
items.consum.stones.stoneofclairvoyance.desc=Этот камень мгновенно откроет все клетки в очень большой области вокруг того места, куда он был брошен. Этому эффекту не препятствуют даже стены.

items.consum.stones.stoneofdeepsleep.name=камень Непробудного сна
items.consum.stones.stoneofdeepsleep.desc=Этот камень, брошенный во врага, погрузит его в глубокий магический сон. Такой сон нельзя потревожить, пока враг не получил какой-либо урон.

items.consum.stones.stoneofdetectmagic.name=камень Обнаружения магии
items.consum.stones.stoneofdetectmagic.inv_title=Проверить предмет
items.consum.stones.stoneofdetectmagic.detected_none=Вы не обнаружили никакой магии, воздействующей на этот предмет.
items.consum.stones.stoneofdetectmagic.detected_both=Вы обнаружили как благотворную, так и недобрую магию, таящуюся в этом предмете.
items.consum.stones.stoneofdetectmagic.detected_good=Вы обнаружили благотворную магию, таящуюся в этом предмете.
items.consum.stones.stoneofdetectmagic.detected_bad=Вы обнаружили недобрую магию, таящуюся в этом предмете.
items.consum.stones.stoneofdetectmagic.desc=Этот рунный камень способен обнаруживать магию, воздействующую на предмет. Применив этот камень к неопознанному предмету, можно узнать, находится ли он под воздействием темного проклятия или благотворной магии, такой как зачарование или улучшение.

items.consum.stones.stoneofdisarming.name=камень Обезвреживания
items.consum.stones.stoneofdisarming.desc=Этот рунный камень содержит магию, которая способна обезвредить вредоносные ловушки, спрятанные в подземелье. Он может обезвредить до 9 ловушек вокруг того места, куда будет брошен.

items.consum.stones.stoneofenchantment.name=камень Зачарования
items.consum.stones.stoneofenchantment.inv_title=Зачаровать предмет
items.consum.stones.stoneofenchantment.weapon=Ваше оружие светится в темноте!
items.consum.stones.stoneofenchantment.armor=Ваша броня светится в темноте!
items.consum.stones.stoneofenchantment.desc=Этот рунный камень содержит зачаровывающую магию. В отличие от аналогичных свитков, он не может быть использован для улучшения предметов. Но зато может наложить на оружие или броню случайное зачарование, наделив предмет новыми силами.

items.consum.stones.stoneoffear.name=камень Страха
items.consum.stones.stoneoffear.desc=Этот камень так сильно испугает персонажа, в которого он был брошен, что ему захочется убраться куда подальше. Любой урон, нанесённый убегающему, снизит длительность эффекта.

items.consum.stones.stoneofflock.name=камень Стада
items.consum.stones.stoneofflock.desc=Этот рунный камень на короткое время призовёт стадо волшебных овец в том месте, куда он был брошен.

items.consum.stones.stoneofintuition.name=камень Интуиции
items.consum.stones.stoneofintuition.inv_title=Выберите предмет
items.consum.stones.stoneofintuition.desc=Этот рунный камень содержит ослабленную версию той магии, что присутствует в свитках опознания. Вместо того, чтобы напрямую раскрыть секреты предмета, он воздействует на вашу интуицию, позволяя угадать назначение зелья или свитка.
items.consum.stones.stoneofintuition.break_info=Вы можете использовать камень интуиции дважды, прежде чем он сломается, _ваше следующее использование не потратит камень_.
items.consum.stones.stoneofintuition.break_warn=Вы ранее использовали камень интуиции, потому _ваше следующее использование потратит камень_.
items.consum.stones.stoneofintuition$wndguess.text=Угадай тип неопознанного предмета. Если отгадаешь, то он будет опознан!
items.consum.stones.stoneofintuition$wndguess.correct=Вы угадали. Предмет был опознан!
items.consum.stones.stoneofintuition$wndguess.incorrect=Вы не угадали.
items.consum.stones.stoneofintuition$wndguess.break=Камень интуиции рассыпался в пыль...

items.consum.stones.stoneofshock.name=камень Шока
items.consum.stones.stoneofshock.desc=Этот рунный камень вызывает электрический взрыв, который ненадолго оглушает все ближайшие цели и дает заряд волшебной палочки за каждую цель, которая была задета.


###trinkets
items.equipment.trinkets.chaoticcenser.name=хаотичное кадило
items.equipment.trinkets.chaoticcenser.spew=Ваше кадило вот-вот начнет источаться: %s.
items.equipment.trinkets.chaoticcenser.desc=Побывав в котле какое-то время, это кадило для благовоний начало создавать дым само по себе! Эти газы накапливаются и будут выбрасываться из кадила в направлениях врагов и полуслучайных интервалах. Судя по всему, оно способно производить все виды газов, но перед тем, как оно активируется, вы получите предзнаменование.
items.equipment.trinkets.chaoticcenser.typical_stats_desc=Обычно этот аксессуар будет производить поблизости вредный газ каждые _%d_ ходов. Газ будет появляться, только когда поблизости присутствуют враги. При более высоких уровнях эти газы будут более экзотическими и мощными.
items.equipment.trinkets.chaoticcenser.stats_desc=На текущем уровне этот аксессуар будет производить поблизости вредный газ каждые _%d_ ходов. Газ будет появляться, только когда поблизости присутствуют враги. При более высоких уровнях эти газы будут более экзотическими и мощными.

items.equipment.trinkets.crackedspyglass.name=сломанная подзорная труба
items.equipment.trinkets.crackedspyglass.desc=Этот ручной телескоп был бы демонстрацией великой и тонкой работы, не будь у него трещины в передней линзе. Подзорная труба, кажется, помогает, раскрывая новые предметы в подземелье. Но из-за ее изъяна, раскрытые предметы не очень просто увидеть!
items.equipment.trinkets.crackedspyglass.typical_stats_desc=Обычно этот аксессуар имеет _%1$s%% шанс_ создать дополнительный скрытый предмет на каждом этаже без босса.
items.equipment.trinkets.crackedspyglass.stats_desc=На текущем уровне этот аксессуар имеет _%1$s%% шанс_ создать дополнительный скрытый предмет на каждом этаже без босса.
items.equipment.trinkets.crackedspyglass.stats_desc_upgraded=На текущем уровне этот аксессуар имеет _100%% шанс_ создать дополнительный скрытый предмет на каждом этаже без босса, а также _%1$s%% шанс_ на создание второго дополнительного скрытого предмета.

items.equipment.trinkets.dimensionalsundial.name=межпространственные солнечные часы
items.equipment.trinkets.dimensionalsundial.warning=Солнечные часы перестали отбрасывать тень. Вы ощущаете тревогу.
items.equipment.trinkets.dimensionalsundial.desc=Эти портативные солнечные часы каким-то образом способны отбрасывать тень в глубинах подземелья, даже если вы не держите их правильно. Еще более странно положение тени, которая, похоже, не имеет никакого отношения к солнцу в этом мире. Когда тень не отбрасывается, кажется, что солнечные часы привлекают опасность.
items.equipment.trinkets.dimensionalsundial.typical_stats_desc=Обычно этот аксессуар уменьшает количество противников днём (8:00-20:00) на _%1$d%%_ и увеличивает ночью (20:00-8:00) на _%2$d%%_.
items.equipment.trinkets.dimensionalsundial.stats_desc=На текущем уровне этот аксессуар уменьшает количество противников днём (8:00-20:00) на _%1$d%%_ и увеличивает ночью (20:00-8:00) на _%2$d%%_.

items.equipment.trinkets.exoticcrystals.name=экзотические кристаллы
items.equipment.trinkets.exoticcrystals.desc=Эти мелкие розоватые кристаллы имеют такую же форму, что и кристаллы алхимической энергии. Хотя их и нельзя напрямую использовать для получения энергии, те, видимо, каким-то образом влияют на зелья и свитки, которые вы находите.
items.equipment.trinkets.exoticcrystals.typical_stats_desc=Обычно этот аксессуар будет заменять _%s%%_ появляющихся зелий и свитков их особыми версиями. Эффект не затрагивает зелья Силы, свитки Улучшения и предметы, которые требуются для решения головоломок.
items.equipment.trinkets.exoticcrystals.stats_desc=На текущем уровне этот аксессуар будет заменять _%s%%_ появляющихся зелий и свитков их особыми версиями. Эффект не затрагивает зелья Силы, свитки Улучшения и предметы, которые требуются для решения головоломок.

items.equipment.trinkets.eyeofnewt.name=глаз тритона
items.equipment.trinkets.eyeofnewt.desc=Этот золотисто-черный глаз тритона — обычный ингредиент, теперь превращённый в аксессуар. Глаз, по-видимому, ухудшает зрение в обмен на то, что позволяет видеть вещи по-другому.
items.equipment.trinkets.eyeofnewt.typical_stats_desc=Обычно этот аксессуар уменьшает дальность обзора на _%1$s%%_, но также даёт возможность ментально видеть врагов в пределах _%2$d_ клеток.
items.equipment.trinkets.eyeofnewt.stats_desc=На текущем уровне этот аксессуар уменьшит дальность обзора на _%1$s%%_, но также даст возможность ментально видеть врагов в пределах _%2$d_ клеток.

items.equipment.trinkets.ferrettuft.name=мех хорька
items.equipment.trinkets.ferrettuft.desc=Пучок шелковистого белого меха хорька, скреплённый лаймово-зелёной лентой, завязанной в бант. Хорьки известны своим проворством, озорством и отстутствием добросовестности. Часть этой энергии исходит от аксессуара, увеличивая уклонение всего вокруг.
items.equipment.trinkets.ferrettuft.typical_stats_desc=Обычно этот аксессуар увеличивает уклонение всех персонажей на _%1$s%%_.
items.equipment.trinkets.ferrettuft.stats_desc=На текущем уровне этот аксессуар увеличивает уклонение всех персонажей на _%1$s%%_.

items.equipment.trinkets.mimictooth.name=зуб мимика
items.equipment.trinkets.mimictooth.desc=Видимо, этот огромный клык вырвали у неудачливого мимика. Кажется, он каким-то образом влияет на мимиков, из-за чего они появляются чаще и становятся опаснее.
items.equipment.trinkets.mimictooth.typical_stats_desc=Обычно этот аксессуар призывает мимиков в _%1$s_ раз чаще, но усложняет их обнаружение, а также увеличивает выпадение предметов с них. Кроме того, на каждом уровне будет шанс появления очень скрытных эбонитовых мимиков, равный _%2$s%%_.
items.equipment.trinkets.mimictooth.stats_desc=На текущем уровне этот аксессуар призывает мимиков в _%1$s_ раз чаще, но усложняет их обнаружение, а также увеличивает выпадение предметов с них. Кроме того, на каждом уровне будет шанс появления очень скрытных эбонитовых мимиков, равный _%2$s%%_.

items.equipment.trinkets.mossyclump.name=комок мха
items.equipment.trinkets.mossyclump.desc=Этот сгусток мокрого мха остаётся влажным, как сильно вы бы его не сжимали. Судя по всему, он магически связан с самим подземельем, из-за чего вода и трава будут появляться чаще.
items.equipment.trinkets.mossyclump.typical_stats_desc=Обычно этот аксессуар заполнит _%d%%_ нетематических этажей либо водой или травой.\n\nУлучшение этого аксессуара требует большого количества энергии.
items.equipment.trinkets.mossyclump.stats_desc=На текущем уровне этот аксессуар заполнит _%d%%_ нетематических этажей либо водой, либо травой.\n\nУлучшение этого аксессуара требует большого количества энергии.

items.equipment.trinkets.parchmentscrap.name=обрывок пергамента
items.equipment.trinkets.parchmentscrap.desc=Этот маленький клочок пергамента выглядит так, будто его вырезали из свитка. Он сохранил часть своей магии, и, похоже, влияет на оружие и доспехи, найденные в подземелье.
items.equipment.trinkets.parchmentscrap.typical_stats_desc=Как правило, этот аксессуар увеличивает шанс появления зачарований и рун в _%d_ раз, и изменяет шанс появления проклятий на оружии и доспехах в _%s_ раз. При этом шанс появления проклятий на палочках, кольцах или артефактах не изменится.\n\nУлучшение этого аксессуара требует большого количества энергии.
items.equipment.trinkets.parchmentscrap.stats_desc=На текущем уровне этот аксессуар увеличивает шанс появления зачарований и рун в _%d_ раз, и изменяет шанс появления проклятий на оружии и доспехах в _%s_ раз. При этом шанс появления проклятий на палочках, кольцах или артефактах не изменится.\n\nУлучшение этого аксессуара требует большого количества энергии.

items.equipment.trinkets.petrifiedseed.name=окаменевшее семя
items.equipment.trinkets.petrifiedseed.desc=Это семя превратилось в окаменелость либо в результате медленных геологических процессов, либо с помощью магии. Похоже, что семя магическим образом влияет на флору подземелья, иногда заменяя семена растений руническими камнями.
items.equipment.trinkets.petrifiedseed.typical_stats_desc=Обычно этот аксессуар сделает так, что из растоптанной травы будут выпадать рунные камни вместо семян в _%1$s%%_ случаев. Он так же увеличит шанс выпадения предметов из высокой травы на _%2$s%%_.
items.equipment.trinkets.petrifiedseed.stats_desc=На текущем уровне этот аксессуар сделает так, что из растоптанной травы будут выпадать рунные камни вместо семян в _%1$s%%_ случаев. Он так же увеличит шанс выпадения предметов из высокой травы на _%2$s%%_.

items.equipment.trinkets.ratskull.name=череп крысы
items.equipment.trinkets.ratskull.desc=Этот жутковатый аксессуар не намного больше черепа обычной крысы, что является большой редкостью в этом подземелье. Магическое влияние черепа, похоже, привлекает более редких обитателей подземелья, заставляя их появляться гораздо чаще.
items.equipment.trinkets.ratskull.typical_stats_desc=Обычно этот аксессуар увеличит шанс появления особых врагов в _%d_ раз. Однако череп в два раза менее эффективен в привлечении кристаллических мимиков и живых статуй.
items.equipment.trinkets.ratskull.stats_desc=На текущем уровне этот аксессуар увеличит шанс появления особых врагов в _%d_ раз. Однако череп в два раза менее эффективен в привлечении кристаллических мимиков и живых статуй.

items.equipment.trinkets.saltcube.name=куб соли
items.equipment.trinkets.saltcube.desc=Этот крупный кристалл соли был вырезан в форме почти идеального куба, и ему каким-то образом удалось слить половину воды из алхимического котла вместо того, чтобы раствориться. Кажется, что это волшебным образом обезвоживает и сохраняет пищу, которую вы едите, продлевая чувство сытости, но также уменьшая восстановление вашего здоровья, когда вы не голодаете.
items.equipment.trinkets.saltcube.typical_stats_desc=Обычно этот аксессуар увеличит ваше время сытости на _%1$s%%_, но уменьшит эффективность восстановления здоровья на _%2$s%%_, если этаж не закрыт.
items.equipment.trinkets.saltcube.stats_desc=На текущем уровне этот аксессуар увеличит ваше время сытости на _%1$s%%_, но уменьшит эффективность восстановления здоровья на _%2$s%%_, если этаж не закрыт.

items.equipment.trinkets.shardofoblivion.name=осколок небытия
items.equipment.trinkets.shardofoblivion.desc=После варки в алхимическом котле этот маленький осколок проклятого металла превратился в... ничто? Кажется, что свет огибает его, и он парит на месте, когда вы его не держите. Осколок, похоже, волшебным образом черпает силу из вашего невежества, так что, наверное, лучше не думать об этом слишком много.
items.equipment.trinkets.shardofoblivion.typical_stats_desc=Обычно этот аксессуар увеличит шанс выпадения сокровищ из врагов на 20%% для каждого неопознанного предмета экипировки, что вы экипировали или недавно использовали, вплоть до _%d предметов_. Осколок так же предотвращает опознание экипировки, но его можно использовать, чтобы вручную опознать предметы, которые готовы к этому.
items.equipment.trinkets.shardofoblivion.stats_desc=На текущем уровне этот аксессуар увеличит шанс выпадения сокровищ из врагов на 20%% за каждый неопознанный предмет экипировки, что вы экипировали или недавно использовали, вплоть до _%d предметов_. Осколок так же предотвращает опознание экипировки, но его можно использовать, чтобы вручную опознать предметы, которые готовы к этому.
items.equipment.trinkets.shardofoblivion.ac_identify=ОПОЗНАТЬ
items.equipment.trinkets.shardofoblivion.identify_prompt=Опознать предмет
items.equipment.trinkets.shardofoblivion.identify_ready=Предмет готов к опознанию: %s. Используйте осколок бытия на нём, чтобы его опознать.
items.equipment.trinkets.shardofoblivion.identify_ready_worn=Все ваши носимые вещи готовы к опознанию. Используйте осколок небытия на них, чтобы их опознать.
items.equipment.trinkets.shardofoblivion.identify_not_yet=Этот предмет ещё не готов быть опознанным.
items.equipment.trinkets.shardofoblivion.identify=Вы опознали предмет!
items.equipment.trinkets.shardofoblivion$wandusetracker.name=Использована неопознанная палочка
items.equipment.trinkets.shardofoblivion$wandusetracker.desc=Вы недавно использовали неопознанную волшебную палочку, которая на некоторое время считается частью неопознанного снаряжения, используемого осколком небытия.\n\nХодов осталось: %s.
items.equipment.trinkets.shardofoblivion$thrownusetracker.name=Использовано неопознанное метательное оружие
items.equipment.trinkets.shardofoblivion$thrownusetracker.desc=Вы недавно использовали неопознанное метательное оружие, которое на некоторое время считается частью неопознанного снаряжения, используемого осколком небытия.\n\nХодов осталось: %s.

items.equipment.trinkets.thirteenleafclover.name=тринадцатилистный клевер
items.equipment.trinkets.thirteenleafclover.desc=Каким-то образом при варке в алхимическом котле у этого клевера выросла куча дополнительных листьев! На самом деле не совсем понятно, приносит ли этот аксессуар удачу или нет, возможно, этот клевер сделает вашу удачу более хаотичной?
items.equipment.trinkets.thirteenleafclover.typical_stats_desc=Обычно этот аксессуар заставит вас наносить переменчивый урон, делая его максимальным в _%1$d%%_ случаев, и минимальным в _%2$d%%_ случаев.
items.equipment.trinkets.thirteenleafclover.stats_desc=На текущем уровне этот аксессуар заставит вас наносить переменчивый урон, делая его максимальным в _%1$d%%_ случаев, и минимальным в _%2$d%%_ случаев.

items.equipment.trinkets.trapmechanism.name=механизм ловушки
items.equipment.trinkets.trapmechanism.desc=Основной механизм одной из ловушек в подземелье, аккуратно вырезанный в полу, чтобы его можно было переносить. Кажется, что он магическим образом связан с самим подземельем, что делает опасную местность более распространенной для вас, но при этом увеличивая ваше чутьё к ним.
items.equipment.trinkets.trapmechanism.typical_stats_desc=Обычно этот аксессуар повысит на _%1$d%%_ шанс появления ловушек и пропастей на нетематических этажах.\n\nКроме того, _%2$d%%_ скрытых ловушек подземелья станут видимыми.
items.equipment.trinkets.trapmechanism.stats_desc=На текущем уровне этот аксессуар повысит на _%1$d%%_ шанс появления ловушек и пропастей на нетематических этажах.\n\nКроме того, _%2$d%%_ скрытых ловушек подземелья станут видимыми.

items.equipment.trinkets.vialofblood.name=флакон крови
items.equipment.trinkets.vialofblood.desc=Этот тонкий флакон содержит кровь какого-то обитателя подземелья, она медленно перемещается, когда вы вращаете флакон. Похоже, что это волшебным образом усиливает целебные эффекты, но также их замедляет.
items.equipment.trinkets.vialofblood.typical_stats_desc=Обычно этот аксессуар увеличивает общее количество здоровья, которое вы получаете, выпивая целебные зелья, бурдюки с водой или колодцы здоровья, на _%1$s%%_. Однако эти лечебные эффекты также проявляются медленнее, восстанавливая максимум _%2$s_ здоровья за ход (это зависит от уровня героя).
items.equipment.trinkets.vialofblood.stats_desc=На текущем уровне этот аксессуар увеличит общее количество здоровья, которое вы получаете, выпивая целебные зелья, бурдюки с водой или колодцы здоровья, на _%1$s%%_. Однако эти лечебные эффекты также будут проявляться медленнее, восстанавливая максимум _%2$s_ здоровья за ход (это зависит от уровня героя).

items.equipment.trinkets.wondrousresin.name=чудотворная смола
items.equipment.trinkets.wondrousresin.desc=Эта мерцающая голубая смола, по-видимому, содержит в себе дистиллированную эссенцию магии проклятой палочки. Магия алхимического котла, видимо, несколько стабилизировала ее, и теперь она воздействует на ваши палочки.
items.equipment.trinkets.wondrousresin.typical_stats_desc=Обычно этот аксессуар сделает эффекты проклятой палочки нейтральными или положительными в _%1$s%%_ случаев, а так же при выстрелах не проклятыми палочками, те будут в _%2$s%%_ случаев выстреливать нейтральным или положительным проклятым зарядом.\n\nУлучшение этого аксессуара требует большого количества энергии.
items.equipment.trinkets.wondrousresin.stats_desc=На текущем уровне это аксессуар сделает эффекты проклятой палочки нейтральными или положительными в _%1$s%%_ случаев, а так же при выстрелах не проклятыми палочками, те будут в _%2$s%%_ случаев выстреливать нейтральным или положительным проклятым зарядом.\n\nУлучшение этого аксессуара требует большого количества энергии.

items.equipment.trinkets.trinketcatalyst.name=магический катализатор
items.equipment.trinkets.trinketcatalyst.window_title=создать аксессуар
items.equipment.trinkets.trinketcatalyst.window_text=Как только вы добавляете катализатор, вода в котле начинает сиять. Выберите один из предметов, чтобы наполнить его энергией и превратить в магический аксессуар.
items.equipment.trinkets.trinketcatalyst.desc=Этот золотистый комок пыли сверкает во тьме подземелья. Такой катализатор можно объединить с небольшим количеством алхимической энергии, чтобы создать уникальный аксессуар.\n\nАксессуары дают различные эффекты, которые помогают немного разнообразить подземелье и его обитателей. Аксессуары можно улучшить при помощи энергии, чтобы сделать их эффекты более сильными. Если вы хотите полностью избавиться от их эффектов, то аксессуары достаточно просто выбросить.
items.equipment.trinkets.trinketcatalyst$randomtrinket.name=случайный аксессуар
items.equipment.trinkets.trinketcatalyst$randomtrinket.desc=Один из предметов, находящихся поблизости, спрятан в мешочке, который вы не можете открыть.\n\nВ процессе алхимии мешочек растворится, но вы не узнаете, какой аксессуар получите, пока не сделаете его!

items.equipment.trinkets.trinket.discover_hint=Этот предмет может появиться в выборе, когда вы создаёте аксессуар с помощью алхимии.
items.equipment.trinkets.trinket$placeholder.name=аксессуар

###wands
items.equipment.wands.cursedwand.ondeath=Вас убил ваш собственный %s.
items.equipment.wands.cursedwand.nothing=Ничего не произошло.
items.equipment.wands.cursedwand.mass_invuln=Яркий свет извергается из вашей палочки!
items.equipment.wands.cursedwand.petrify=Вы внезапно замерзаете на месте!
items.equipment.wands.cursedwand.grass=Вокруг вас внезапно появляются заросли травы!
items.equipment.wands.cursedwand.fire=Вы чувствуете запах гари...
items.equipment.wands.cursedwand.transmogrify_wand=Ваша палочка превратилась в другой предмет!
items.equipment.wands.cursedwand.transmogrify_other=Ваш предмет превращается во что-то другое!
items.equipment.wands.cursedwand.disguise=Ваш облик меняется у вас на глазах!
items.equipment.wands.cursedwand.supernova=Раскаленный шар энергии начинает расти. Лучше бежать!
items.equipment.wands.cursedwand.supernova_positive=Пылающий энергетический шар начинает расти, но кажется безопасным.
items.equipment.wands.cursedwand.sinkhole=Почва вокруг вас начинает обрушиваться!
items.equipment.wands.cursedwand.sinkhole_positive=Почва начинает обрушиваться, но кажется довольно твёрдой под вашими ногами.
items.equipment.wands.cursedwand.gravity=Гравитация тянет в случайных направлениях!
items.equipment.wands.cursedwand.gravity_positive=Гравитация тянет в случайных направлениях, но не касается вас.
items.equipment.wands.cursedwand.gravity_end=Гравитационный хаос закончился.

items.equipment.wands.damagewand.upgrade_stat_name_1=Магический урон

items.equipment.wands.wand.ac_zap=ИСПОЛЬЗОВАТЬ
items.equipment.wands.wand.fizzles=Ваша палочка искрит. Видимо, у нее кончились заряды.
items.equipment.wands.wand.no_magic=Вы не можете использовать палочки под действием антимагии.
items.equipment.wands.wand.self_target=Нельзя выбрать себя в качестве цели!
items.equipment.wands.wand.identify=Вы достаточно долго знакомы с палочкой, чтобы опознать ее.
items.equipment.wands.wand.resin_one=Палочка получила _1 уровень_ от магической смолы.
items.equipment.wands.wand.resin_many=Палочка получила _%d уровня_ от магической смолы.
items.equipment.wands.wand.cursed=Эта палочка проклята, ее сила хаотична и непредсказуема.
items.equipment.wands.wand.not_cursed=Эта палочка не проклята.
items.equipment.wands.wand.curse_discover=Этот %s проклят!
items.equipment.wands.wand.prompt=Выберите цель
items.equipment.wands.wand$placeholder.name=палочка

items.equipment.wands.wandofblastwave.name=палочка Взрывной волны
items.equipment.wands.wandofblastwave.staff_name=посох Взрывной волны
items.equipment.wands.wandofblastwave.ondeath=Вы убили себя собственной палочкой Взрывной волны...
items.equipment.wands.wandofblastwave.knockback_ondeath=Столкновение убило вас...
items.equipment.wands.wandofblastwave.desc=Эта палочка с золотой отделкой и навершием из черного самоцвета сделана из мрамора. Довольно увесистая.
items.equipment.wands.wandofblastwave.typical_stats_desc=Эта палочка выпускает заряд, создающий мощный взрыв в точке удара. Взрыв обычно наносит _%1$d-%2$d урона,_ и способен отправить большинство врагов в полёт.
items.equipment.wands.wandofblastwave.stats_desc=Эта палочка выпускает заряд, создающий мощный взрыв в точке удара. Взрыв наносит _%1$d-%2$d урона,_ и способен отправить большинство врагов в полёт.
items.equipment.wands.wandofblastwave.upgrade_stat_name_2=Отталкивание
items.equipment.wands.wandofblastwave.bmage_desc=Когда _Боевой маг_ поражает парализованного противника зарядом из посоха Взрывной волны, это поглотит паралич и нанесет дополнительный магический урон. У этой способности есть небольшая перезарядка при использовании на одном враге.
items.equipment.wands.wandofblastwave.eleblast_desc=Стихийный взрыв с посохом взрывной волны наносит 67% урона и сбивает всех врагов за пределами области взрыва.

items.equipment.wands.wandofcorrosion.name=палочка Коррозии
items.equipment.wands.wandofcorrosion.staff_name=посох Коррозии
items.equipment.wands.wandofcorrosion.desc=Мертвенно-бледная рукоять этой палочки украшена сияющим драгоценным камнем ярко-оранжевого цвета.
items.equipment.wands.wandofcorrosion.stats_desc=При использовании эта палочка стреляет зарядом, который взрывается в облако крайне едкого газа в месте попадания. Урон, наносимый этим газом, растет в зависимости от того, сколько времени цель находилась в облаке, начиная с _%d ед. урона._
items.equipment.wands.wandofcorrosion.upgrade_stat_name_1=Урон коррозии
items.equipment.wands.wandofcorrosion.upgrade_stat_name_2=Объём Газа
items.equipment.wands.wandofcorrosion.bmage_desc=Когда _Боевой маг_ поражает врага посохом Коррозии, у врага есть шанс покрыться едкой слизью.
items.equipment.wands.wandofcorrosion.eleblast_desc=Стихийный взрыв с посохом коррозии накладывает на врагов 4 хода коррозии, которая начинается с 6 урона.

items.equipment.wands.wandofcorruption.name=палочка Порчи
items.equipment.wands.wandofcorruption.staff_name=посох Порчи
items.equipment.wands.wandofcorruption.already_corrupted=Эта цель уже под вашим контролем.
items.equipment.wands.wandofcorruption.desc=Даже без маленького черепа на навершии можно понять, что эта вещь не для всяких рук - палочка просто источает темную магию.
items.equipment.wands.wandofcorruption.stats_desc=Эта палочка выпускает разряд Порчи, пытаясь подчинить врагов вашей воле. В противном случае, палочка наложит на цель случайный негативный эффект. Но чем больше негативных эффектов на цели, тем больше шансов на то, что она будет подчинена.
items.equipment.wands.wandofcorruption.upgrade_stat_name_1=Сила Порчи
items.equipment.wands.wandofcorruption.upgrade_stat_name_2=Длительность Ослабления
items.equipment.wands.wandofcorruption.bmage_desc=Когда _Боевой маг_ поражает врага посохом Порчи, у врага есть шанс впасть в буйство.
items.equipment.wands.wandofcorruption.eleblast_desc=Стихийный взрыв с посохом порчи накладывает на врагов 5 ходов буйства.

items.equipment.wands.wandofdisintegration.name=палочка Дезинтеграции
items.equipment.wands.wandofdisintegration.staff_name=посох Дезинтеграции
items.equipment.wands.wandofdisintegration.desc=Эта палочка сделана из цельного куска обсидиана, внутри которого течет фиолетовый свет, заканчивающийся у навершия. Она мерцает разрушительной энергией, ожидая, когда ей воспользуются.
items.equipment.wands.wandofdisintegration.stats_desc=Палочка испускает луч, пронзающий любые препятствия на своём пути. Дальность луча увеличивается с улучшением палочки. Луч наносит _%1$d-%2$d урона,_ и чем больше луч пронзает врагов и препятствий, тем больше дополнительный урон.
items.equipment.wands.wandofdisintegration.upgrade_stat_name_2=Максимальная дистанция
items.equipment.wands.wandofdisintegration.bmage_desc=Когда _Боевой маг_ использует посох Дезинтеграции, дальность атаки увеличивается так, будто в нём есть зачарование проекции.
items.equipment.wands.wandofdisintegration.eleblast_desc=Стихийный взрыв с посохом дезинтеграции наносит 100% урона и пробивает стены насквозь.

items.equipment.wands.wandoffireblast.name=палочка Огненной вспышки
items.equipment.wands.wandoffireblast.staff_name=посох Огненной вспышки
items.equipment.wands.wandoffireblast.desc=Эта палочка сделана из лакированного красного дерева с навершием в виде золотого листа, из-за чего выглядит, как королевский скипетр. Она шипит и искрит, готовая выпустить свою неудержимую магию.
items.equipment.wands.wandoffireblast.stats_desc=При использовании эта палочка выпускает конус огня. Его следующая поглотит _%1$d зарядов_ и нанесёт _%2$d-%3$d урона_. Чем больше зарядов используется, тем больше и сильнее эффект.
items.equipment.wands.wandoffireblast.upgrade_stat_name_1=Урон 1 Заряда
items.equipment.wands.wandoffireblast.upgrade_stat_name_2=Урон 2 Заряда
items.equipment.wands.wandoffireblast.upgrade_stat_name_3=Урон 3 Заряда
items.equipment.wands.wandoffireblast.bmage_desc=Когда _Боевой маг_ поражает врага посохом Огненной вспышки, есть шанс, что произойдёт взрыв, который нанесет урон врагам и поглотит весь огонь поблизости! Чем больше огня вокруг врага, тем больше этот шанс.
items.equipment.wands.wandoffireblast.eleblast_desc=Стихийный взрыв с посохом огненной вспышки наносит 100% урона, прорывается через открытые двери и поджигает врагов и местность.

items.equipment.wands.wandoffrost.name=палочка Холода
items.equipment.wands.wandoffrost.staff_name=посох Холода
items.equipment.wands.wandoffrost.desc=Кажется, эта палочка сделана из какого-то волшебного льда. Она становится ярче около навершия. На ощупь довольно холодная, но ваша рука почему-то остается тёплой.
items.equipment.wands.wandoffrost.stats_desc=Эта палочка стреляет в ваших врагов потоком льда, нанося _%1$d-%2$d урона_ и замораживает их. В воде эффект сильнее. Замороженные враги, получают меньше урона от этой палочки.
items.equipment.wands.wandoffrost.upgrade_stat_name_2=Длительность Окоченения
items.equipment.wands.wandoffrost.bmage_desc=Когда _Боевой маг_ поражает охлажденного противника посохом Холода, у противника есть шанс моментально замерзнуть. Чем более охлажден противник, тем больше этот шанс.
items.equipment.wands.wandoffrost.eleblast_desc=Стихийный взрыв с посохом холода наносит 100% урона, замораживает врагов и тушит пожары.

items.equipment.wands.wandoflightning.name=палочка Молний
items.equipment.wands.wandoflightning.staff_name=посох Молний
items.equipment.wands.wandoflightning.ondeath=Вы убили себя собственной палочкой Молний...
items.equipment.wands.wandoflightning.desc=Эта палочка сделана из цельного металла, из-за чего она довольно тяжёлая. На навершии есть два зубца, между которыми проскакивают электрические дуги.
items.equipment.wands.wandoflightning.stats_desc=Эта палочка испускает мощные молнии, которые пронизывают все, против чего они направлены, и причиняют _%1$d-%2$d урона_. Это электричество переходит на близкие персонажи и свободнее распространяется в воде. Молнии из этой палочки могут нанести вам вред, но не затрагивают ваших союзников.
items.equipment.wands.wandoflightning.bmage_desc=Когда _Боевой маг_ поражает противника посохом Молний, есть шанс электрически зарядить себя на 10 ходов. Будучи заряженным Боевой маг невосприимчив к электрическому урону и его молнии будут бить дальше.
items.equipment.wands.wandoflightning.eleblast_desc=Стихийный взрыв с посохом молнии наносит 100% урона, оглушает врагов на 5 ходов и электризует воду.
items.equipment.wands.wandoflightning$lightningcharge.name=Электрически заряжен
items.equipment.wands.wandoflightning$lightningcharge.desc=Боевой маг сейчас заряжен энергией, что даёт ему иммунитет к его посоху Молний и увеличивает дальность атаки молнией.\n\nХодов осталось: %s.

items.equipment.wands.wandoflivingearth.name=палочка Живой земли
items.equipment.wands.wandoflivingearth.staff_name=посох Живой земли
items.equipment.wands.wandoflivingearth.desc=Эта палочка сделана из странного камня с полосами светящейся желтой энергии. Камни, кажется, слегка сдвигаются, когда вы держите палочку, как будто они чувствуют вашу руку.
items.equipment.wands.wandoflivingearth.stats_desc=Эта палочка создает снаряды из магических камней, нанося _%1$d-%2$d урона._ Затем камни возвращаются к владельцу палочки, чтобы создать вокруг него броню. Если брони достаточно, то при следующем использовании палочки она превратится в каменного стража.
items.equipment.wands.wandoflivingearth.upgrade_stat_name_2=Макс. ОЗ Стража
items.equipment.wands.wandoflivingearth.upgrade_stat_name_3=Блокирование Стража
items.equipment.wands.wandoflivingearth.bmage_desc=Когда _Боевой маг_ поражает врага посохом Живой земли, часть нанесенного урона возвращается в виде каменной брони.
items.equipment.wands.wandoflivingearth.eleblast_desc=Стихийный взрыв с посохом живой земли наносит 50% урона и лечит активного земляного стража за каждого пораженного врага.
items.equipment.wands.wandoflivingearth$rockarmor.name=каменная броня
items.equipment.wands.wandoflivingearth$rockarmor.desc=Магические камни окружают ваше тело и пытаются защитить вас при вражеской атаке, уменьшая урон по вам на 50%%. Броня снижается при поглощении урона.\n\nБрони осталось: %1$d\n\nЕсли на вашем теле достаточно камня, то следующее использование вашей палочки Живой земли заставит камни собраться в стража, который будет сражаться за вас.\n\nНужно брони для призыва стража: %2$d.
items.equipment.wands.wandoflivingearth$rockarmor.desc_many=Этот земляной страж также получает бонус от силы многих. Ходов осталось: %d.
items.equipment.wands.wandoflivingearth$earthguardian.name=земляной страж
items.equipment.wands.wandoflivingearth$earthguardian.desc=Камни из вашей палочки живой земли превратились в защитного земляного стража! Этот каменный защитник будет атаковать ближайших врагов, что заставит их атаковать стража вместо вас. Когда все угрозы поблизости исчезнут, страж вновь сформируется вокруг вас и вернется, когда вы в следующий раз воспользуетесь своей палочкой.
items.equipment.wands.wandoflivingearth$earthguardian.wand_info=Защитная сила стража связана с уровнем вашей палочки. На данный момент он блокирует _%1$d-%2$d урона._
items.equipment.wands.wandoflivingearth$earthguardian.discover_hint=Вы можете найти этого персонажа с помощью определённой палочки.

items.equipment.wands.wandofmagicmissile.name=палочка Магической стрелы
items.equipment.wands.wandofmagicmissile.staff_name=посох Магической стрелы
items.equipment.wands.wandofmagicmissile.desc=Довольно простая палочка, стреляющая стрелами чистой магической энергии. Хоть палочка и не обладает какими-либо особыми эффектами, она имеет довольно много доступных зарядов и может на некоторое время усилить другие палочки после улучшения.
items.equipment.wands.wandofmagicmissile.stats_desc=Каждый выстрел из этой палочки наносит _%1$d-%2$d урона_ и на некоторое время усиливает другие палочки, если она улучшена.
items.equipment.wands.wandofmagicmissile.bmage_desc=Когда _Боевой маг_ поражает врага посохом Магической стрелы, все его палочки получают дополнительный заряд.
items.equipment.wands.wandofmagicmissile.eleblast_desc=Стихийный взрыв с посохом магической стрелы наносит 50% урона и дает магу 15 ходов перезарядки.
items.equipment.wands.wandofmagicmissile.discover_hint=Один из героев начинает с этим предметом.
items.equipment.wands.wandofmagicmissile$magiccharge.name=магический заряд
items.equipment.wands.wandofmagicmissile$magiccharge.desc=Палочка Магической стрелы наполнила ваши палочки энергией, увеличив их уровень.\n\nВаши палочки улучшены на: +%d.\n\nХодов осталось: %s.

items.equipment.wands.wandofprismaticlight.name=палочка Чистого света
items.equipment.wands.wandofprismaticlight.staff_name=посох Чистого света
items.equipment.wands.wandofprismaticlight.desc=Эта палочка сделан из цельного куска прозрачного хрусталя. Она напоминает длинный кусок гладкого стекла. Цветные лучики света играют у навершия, стремясь вырваться вперёд.
items.equipment.wands.wandofprismaticlight.stats_desc=Эта палочка испускает луч света, наносящий _%1$d-%2$d урона_ и ослепляющий врагов. Свет также пронзает тьму подземелья, раскрывая скрытые двери и ловушки. Демоны и нежить загорятся чистым пламенем этой палочки, получая значительно больше урона.
items.equipment.wands.wandofprismaticlight.upgrade_stat_name_2=Шанс Ослепления
items.equipment.wands.wandofprismaticlight.upgrade_stat_name_3=Длительность Света
items.equipment.wands.wandofprismaticlight.bmage_desc=Когда _Боевой маг_ поражает противника посохом Чистого света, то противник становится покалеченным на время, которое увеличивается в зависимости от уровня посоха.
items.equipment.wands.wandofprismaticlight.eleblast_desc=Стихийный взрыв с посохом чистого света наносит 67% урона, раскрывает местность и ослепляет врагов на 5 ходов.

items.equipment.wands.wandofregrowth.name=палочка Восстановления
items.equipment.wands.wandofregrowth.staff_name=посох Восстановления
items.equipment.wands.wandofregrowth.desc=Эта искусно обработанная палочка сделана из тонкого и искусно обработанного дерева. Каким-то образом дерево всё ещё живое и имеет ярко-зелёную окраску, как сердцевина молодого дерева. "Когда угасает жизнь, всегда начинается новая жизнь... Вечный цикл всегда остается!"
items.equipment.wands.wandofregrowth.stats_desc=При использовании эта палочка выстрелит зарядом возрождающей энергии в конусовидной области, взывая траву, корни и редкие растения к жизни. Следующее использование поглотит _%1$d зарядов_. Чем больше зарядов потребляет эта палочка, тем больше и сильнее становится эффект.
items.equipment.wands.wandofregrowth.degradation=После использования еще _%d зарядов_ эта палочка перестанет производить растения и новую траву. Это ограничение можно повысить, повышая свой уровень или уровень палочки.
items.equipment.wands.wandofregrowth.upgrade_stat_name_1=Травы За Заряд
items.equipment.wands.wandofregrowth.upgrade_stat_name_2=Общий Лимит Травы
items.equipment.wands.wandofregrowth.bmage_desc=Когда _Боевой маг_ поражает врага посохом Восстановления и хотя бы один из них стоит на траве, он получает Травяное исцеление пропорционально нанесенному урону.
items.equipment.wands.wandofregrowth.eleblast_desc=Стихийный взрыв с посохом восстановления опутывает врагов и беспорядочно выращивает траву в области взрыва.
items.equipment.wands.wandofregrowth$dewcatcher.name=Росянка
items.equipment.wands.wandofregrowth$dewcatcher.desc=Росянки - удивительные растения, наполняющиеcя волшебной росой. Чтобы не привлекать внимание, они маскируются под траву, но их выдают наполненные росой выпуклости.
items.equipment.wands.wandofregrowth$dewcatcher.discover_hint=Вы можете найти это растение с помощью определённой палочки.
items.equipment.wands.wandofregrowth$seedpod.name=Семяловка
items.equipment.wands.wandofregrowth$seedpod.desc=Семяловки - это волшебные растения, которые производят семена других видов растений, вместо своих собственных. Каким-то образом им удается распространяться, несмотря на отсутствие собственных семян.
items.equipment.wands.wandofregrowth$seedpod.discover_hint=Вы можете найти это растение с помощью определённой палочки.
items.equipment.wands.wandofregrowth$lotus.name=Золотой Лотос
items.equipment.wands.wandofregrowth$lotus.desc=Золотой лотос — это мистическое растение, которое может быть вызвано только мощной палочкой восстановления. Его аура усиливает все растения и их эффекты, но он быстро сжигает свою энергию и скоропостижно умирает.
items.equipment.wands.wandofregrowth$lotus.wand_info=Этот лотос был создан палочкой Восстановления, усиленной на _%1$d_. Эффекты всех растений _работают моментально_, если они были посажены на клетку с персонажем. Кроме того, есть _%2$d%% шанс_ получить семя с растения, а также смазанные дротики будут использовать на _%3$d%% меньше прочности_.
items.equipment.wands.wandofregrowth$lotus.discover_hint=Вы можете найти это растение с помощью определённой палочки, после её улучшения несколько раз.

items.equipment.wands.wandoftransfusion.name=палочка Трансфузии
items.equipment.wands.wandoftransfusion.staff_name=посох Трансфузии
items.equipment.wands.wandoftransfusion.ondeath=Вы убились собственной палочкой Трансфузии...
items.equipment.wands.wandoftransfusion.charged=Ваш посох заряжен жизненной энергией вашего противника!
items.equipment.wands.wandoftransfusion.desc=Хотя эта палочка довольно проста на вид, она выделяется за счёт пурпурного оттенка и угольно-чёрного камня на ее навершии.
items.equipment.wands.wandoftransfusion.stats_desc=При использовании на союзниках или очарованных врагах эта палочка забирает _%1$d здоровья пользователя_, чтобы вылечить или защитить союзника на _%2$d здоровья._ При использовании на врагов палочка на короткое время зачаровывает их, одновременно применяя _%3$d защиты_ к пользователю. Враждебная нежить получит _%4$d-%5$d урона_ вместо того, чтобы быть очарованной.
items.equipment.wands.wandoftransfusion.upgrade_stat_name_1=Исцеление Союзника
items.equipment.wands.wandoftransfusion.upgrade_stat_name_2=Самозащита
items.equipment.wands.wandoftransfusion.upgrade_stat_name_3=Урон по Нежити
items.equipment.wands.wandoftransfusion.bmage_desc=Когда _Боевой маг_ попадает в зачарованного врага своим посохом Трансфузии, он наделяется щитом и его следующий выстрел этим посохом не будет стоить ему здоровья.
items.equipment.wands.wandoftransfusion.eleblast_desc=Стихийный взрыв с посохом трансфузии очаровывает врагов, лечит союзников и наносит 100% урона нежити.

items.equipment.wands.wandofwarding.name=палочка Стражей
items.equipment.wands.wandofwarding.staff_name=посох Стражей
items.equipment.wands.wandofwarding.no_more_wards=Ваша палочка не может поддерживать большее количество стражей.
items.equipment.wands.wandofwarding.bad_location=Вы не можете разместить здесь стража.
items.equipment.wands.wandofwarding.desc=Это короткая металлическая палочка с ярко-фиолетовым драгоценным камнем, парящим возле ее наконечника.
items.equipment.wands.wandofwarding.stats_desc=Вместо того, чтобы наносить прямой урон, эта палочка будет призывать стражей и часовых. Стражи могут быть размещены в любом видимом для вас месте, даже через стены. Эта палочка имеет только _%d ед. энергии_ на поддержку стражей.
items.equipment.wands.wandofwarding.upgrade_stat_name_1=Урон стража
items.equipment.wands.wandofwarding.upgrade_stat_name_2=Энергия стража
items.equipment.wands.wandofwarding.bmage_desc=Когда _Боевой маг_ поражает врага посохом Стражей, все активные стражи и часовые имеют шанс исцелиться.
items.equipment.wands.wandofwarding.eleblast_desc=Стихийный взрыв посохом стражей лечит всех стражей и часовых в зоне взрыва.
items.equipment.wands.wandofwarding$ward.desc_generic_ward=Этот страж будет автоматически атаковать любого врага, что попадет в его поле зрения.\n\nИспользование палочки стражей на вашего стража улучшит его.\n\nСтражи атакуют ограниченное количество раз, а затем исчезают.
items.equipment.wands.wandofwarding$ward.desc_generic_sentry=Этот часовой обладает такой же боевой мощью, что и страж, но имеет очки здоровья вместо установленного количества зарядов. Он напоминает драгоценный камень на кончике вашей палочки стражей.\n\nИспользование палочки стражей на вашего часового улучшит и исцелит его.\n\nЧасовой будет тратить немного здоровья каждый раз, когда атакует врага, но его можно вылечить, используя палочку стражей.
items.equipment.wands.wandofwarding$ward.name_1=малый страж
items.equipment.wands.wandofwarding$ward.desc_1=Этот стандартный страж будет автоматически атаковать любого врага, что попадет в его поле зрения, нанося _%1$d-%2$d урона._\n\nИспользование палочки Стражей на вашего стража улучшит его.\n\nЭтот страж атакует лишь раз, а затем исчезнет.\n\nПалочка Стражей использует _%3$d ед. энергии_ для поддержания этого стража.
items.equipment.wands.wandofwarding$ward.name_2=средний страж
items.equipment.wands.wandofwarding$ward.desc_2=Этот улучшенный страж имеет более сложное поведение и способен атаковать несколько раз. Каждая атака будет наносить _%1$d-%2$d урона._\n\nИспользование палочки Стражей на вашего стража улучшит его.\n\nЭтот страж атакует три раза, а затем исчезнет.\n\nПалочка Стражей использует _%3$d ед. энергии_ для поддержания этого стража.
items.equipment.wands.wandofwarding$ward.name_3=большой страж
items.equipment.wands.wandofwarding$ward.desc_3=Этот максимально улучшенный страж способен атаковать большее количество раз, чем его предшественники. Каждая атака будет наносить _%1$d-%2$d урона._\n\nИспользование палочки Стражей на вашего стража улучшит его.\n\nЭтот страж атакует пять раз, а затем исчезнет.\n\nПалочка Стражей использует _%3$d ед. энергии_ для поддержания этого стража.
items.equipment.wands.wandofwarding$ward.name_4=малый часовой
items.equipment.wands.wandofwarding$ward.desc_4=Этот небольшой часовой обладает такой же боевой мощью, что и большой страж, но имеет очки здоровья вместо установленного количества зарядов. Он напоминает драгоценный камень на кончике вашей палочки стражей. Каждая его атака будет наносить _%1$d-%2$d урона._\n\nИспользование палочки стражей на вашего часового улучшит и исцелит его.\n\nЧасовой будет тратить немного здоровья каждый раз, когда атакует врага, но его можно вылечить, используя палочку стражей.\n\nПалочка стражей использует _%3$d ед. энергии_ для поддержания этого часового.
items.equipment.wands.wandofwarding$ward.name_5=средний часовой
items.equipment.wands.wandofwarding$ward.desc_5=Этот улучшенный часовой больше и немного прочнее, чем малый часовой. Каждая его атака будет наносить _%1$d-%2$d урона._\n\nИспользование палочки Стражей на вашего часового улучшит и исцелит его.\n\nЧасовой будет тратить немного здоровья каждый раз, когда атакует врага, но его можно вылечить, используя палочку Стражей.\n\nПалочка Стражей использует _%3$d ед. энергии_ для поддержания этого часового.
items.equipment.wands.wandofwarding$ward.name_6=большой часовой
items.equipment.wands.wandofwarding$ward.desc_6=Этот максимально улучшенный часовой значительно прочнее, чем его предшественники. Каждая его атака будет наносить _%1$d-%2$dурона._\n\nИспользование палочки Стражей на вашего часового исцелит его.\n\nЧасовой будет тратить немного здоровья каждый раз, когда атакует врага, но его можно вылечить, используя палочку Стражей.\n\nПалочка Стражей использует _%3$d ед. энергии_ для поддержания этого часового.
items.equipment.wands.wandofwarding$ward.discover_hint=Вы можете найти этого персонажа с помощью определённой палочки.
items.equipment.wands.wandofwarding$ward.dismiss_title=Отозвать этого стража?
items.equipment.wands.wandofwarding$ward.dismiss_body=Вы можете уничтожить этого стража, если больше не хотите, чтобы ваша палочка тратила энергию на его поддержку.\n\nОтозвать этого стража?
items.equipment.wands.wandofwarding$ward.dismiss_confirm=Да
items.equipment.wands.wandofwarding$ward.dismiss_cancel=Нет

###weapon curses
items.equipment.weapon.curses.annoying.name=%s болтливости
items.equipment.weapon.curses.annoying.msg_1=О-О-О, МЫ ЩАС БУДЕМ ДРАТЬСЯ?!
items.equipment.weapon.curses.annoying.msg_2=ДА, ВДАРЬ ИМ!
items.equipment.weapon.curses.annoying.msg_3=ЭЙ, ПОСЛУШАЙ!
items.equipment.weapon.curses.annoying.msg_4=МЫ УЖЕ У БОССА?!
items.equipment.weapon.curses.annoying.msg_5=ОЙ, НЕ МАХАЙ МНОЙ ТАК СИЛЬНО!
items.equipment.weapon.curses.annoying.msg_6=УМРИ, БУКАШКА!
items.equipment.weapon.curses.annoying.msg_7=УУУУУУУУУУУУУУУХ!
items.equipment.weapon.curses.annoying.msg_8=ДАВАЙ ПЕРЕДОХНЕМ!?
items.equipment.weapon.curses.annoying.msg_9=БАЦ, ХАХА!
items.equipment.weapon.curses.annoying.msg_10=ДОБРОТНЫЙ УДАР!
items.equipment.weapon.curses.annoying.msg_11=Я не собирался быть оружием, я хотел просто быть топором дровосека.
items.equipment.weapon.curses.annoying.msg_12=Не забывайте: чрезмерная самоуверенность это медленный и коварный убийца.
items.equipment.weapon.curses.annoying.msg_13=ВСЕ ВАША БАЗА ПРИНАДЛЕЖАТЬ НАМ!
items.equipment.weapon.curses.annoying.desc=Болтливое оружие способно разговаривать. Точнее, оно ОБОЖАЕТ разговаривать, чем нередко может привлечь излишнее внимание.
items.equipment.weapon.curses.annoying.elestrike_desc=Стихийный удар с проклятием болтливости с вероятностью 20% может привести в бешенство каждого врага в радиусе действия на 6 ходов.

items.equipment.weapon.curses.dazzling.name=%s ослепления
items.equipment.weapon.curses.dazzling.desc=Ослепляющие орудия иногда создают вспышку света, ослепляющую всех, кто её увидит.
items.equipment.weapon.curses.dazzling.elestrike_desc=Стихийный удар с проклятием ослепления с вероятностью 50% ослеплит всех врагов в радиусе действия на 6 ходов.

items.equipment.weapon.curses.displacing.name=%s телепортации
items.equipment.weapon.curses.displacing.desc=Оружие телепортации наполнено непредсказуемой магией, оно может переместить врага в случайное место.
items.equipment.weapon.curses.displacing.elestrike_desc=Стихийный удар с проклятием телепортации с вероятностью 50% переносит каждого врага в радиусе действия.

items.equipment.weapon.curses.explosive.name=%s подрыва
items.equipment.weapon.curses.explosive.warm=Тепло...
items.equipment.weapon.curses.explosive.hot=Горячо!
items.equipment.weapon.curses.explosive.desc=Взрывные орудия накапливают заряд и взрываются, нанося урон всему вокруг них.
items.equipment.weapon.curses.explosive.desc_cool=Сейчас ваше оружие холодное на ощупь.
items.equipment.weapon.curses.explosive.desc_warm=Ваше орудие накапливает энергию и становится теплее...
items.equipment.weapon.curses.explosive.desc_hot=Ваше орудие горячее! Оно вот-вот взорвется!
items.equipment.weapon.curses.explosive.elestrike_desc=Стихийный удар с проклятием подрыва с вероятностью 50% взрывает случайного врага в радиусе действия.

items.equipment.weapon.curses.friendly.name=%s дружелюбия
items.equipment.weapon.curses.friendly.desc=Оружия дружелюбия больше всего подходят пацифистам, иногда накладывая чары, предотвращающие конфликт.
items.equipment.weapon.curses.friendly.elestrike_desc=Стихийный удар с проклятием дружелюбия с вероятностью 50% может очаровать всех врагов в радиусе действия на 6 ходов.

items.equipment.weapon.curses.polarized.name=%s поляризации
items.equipment.weapon.curses.polarized.desc=Поляризованное оружие при атаке наносит либо на 50% больше урона, либо не наносит урона вообще.
items.equipment.weapon.curses.polarized.elestrike_desc=Стихийный удар с проклятием поляризации с вероятностью 50% наносит 24-36 урона каждому врагу в радиусе действия.

items.equipment.weapon.curses.pressurized.name=%s давления
items.equipment.weapon.curses.pressurized.desc=Оружие испытывающее давление способно выбрасывать мощный гейзер воды, который отталкивает всех на своём пути, включая вас самого.
items.equipment.weapon.curses.pressurized.elestrike_desc=Стихийный удар с проклятием давления создает волну воды, которая разрушает местность и отталкивает всех врагов в радиусе действия.

items.equipment.weapon.curses.sacrificial.name=%s страданий
items.equipment.weapon.curses.sacrificial.desc=Оружие страданий требует крови атакующего за то, что само наносит урон. Чем здоровее атакующий, тем больше крови оно потребует.
items.equipment.weapon.curses.sacrificial.elestrike_desc=Стихийный удар с проклятием страданий даёт герою и каждому врагу в радиусе действия кровотечение на 12 здоровья.

items.equipment.weapon.curses.wayward.name=%s упрямства
items.equipment.weapon.curses.wayward.desc=Оружие упрямства иногда уводит ваши удары в сторону. Эта магия действует некоторое время после её активации, но может быть рассеяна при нанесении удара этим орудием.
items.equipment.weapon.curses.wayward.elestrike_desc=Стихийный удар с проклятьем упрямства имеет 50% шанс активироваться на каждом враге в радиусе действия на 6 ходов.
items.equipment.weapon.curses.wayward$waywardbuff.name=упрямство
items.equipment.weapon.curses.wayward$waywardbuff.desc=Магия вашего орудия упрямости активировалась, из-за чего нанести удар будет сложно некоторое время. Однако это не влияет на гарантированные атаки, например неожиданные атаки. Успешная атака с помощью этого орудия уберет этот эффект.\n\nОсталось ходов: %s.

items.equipment.weapon.curses.wondrous.name=%s чудотворства
items.equipment.weapon.curses.wondrous.desc=Чудотворное оружие содержит ту же хаотическую магию, что и проклятые палочки. Неизвестно, что произойдет, когда это проклятие сработает!
items.equipment.weapon.curses.wondrous.elestrike_desc=Стихийный удар с проклятием чудотворства, имеет шанс применить разный эффект проклятой палочки к каждому врагу в радиусе действия.

###enchantments
items.equipment.weapon.enchantments.blazing.name=%s пламени
items.equipment.weapon.enchantments.blazing.desc=Эти чары заставляют оружие извергать пламя, поджигая врагов и нанося дополнительный урон противникам, которые уже горят.
items.equipment.weapon.enchantments.blazing.elestrike_desc=Стихийный удар с зачарованием пламени поджигает все клетки в радиусе действия на 8 ходов.

items.equipment.weapon.enchantments.blocking.name=%s обороны
items.equipment.weapon.enchantments.blocking.desc=Это зачарование может ненадолго защитить вас после атаке этим оружием.
items.equipment.weapon.enchantments.blocking.elestrike_desc=Стихийный удар с зачарованием обороны даёт Дуэлянту 6 зарядов щита за каждого врага в радиусе действия.
items.equipment.weapon.enchantments.blocking$blockbuff.name=оборона
items.equipment.weapon.enchantments.blocking$blockbuff.desc=Зачарование обороны на вашем оружии ненадолго усилило вашу броню щитом!\n\nОсталось щита: %d.\n\nОсталось ходов: %s.

items.equipment.weapon.enchantments.blooming.name=%s цветения
items.equipment.weapon.enchantments.blooming.desc=При каждом ударе цветущим оружием есть шанс, что рядом с целью вырастет трава.
items.equipment.weapon.enchantments.blooming.elestrike_desc=Стихийный удар с зачарованием цветения сажает траву в зоне до 8 клеток и обездвиживает всех врагов в радиусе действия на 6 ходов.

items.equipment.weapon.enchantments.chilling.name=%s холода
items.equipment.weapon.enchantments.chilling.desc=Враги, пораженные этим зачарованием, коченеют от холода, их скорость атаки и передвижения снижается.
items.equipment.weapon.enchantments.chilling.elestrike_desc=Стихийный удар с зачарованием холода на 8 ходов выпустит потоки леденящего воздуха на все клетки в радиусе действия.

items.equipment.weapon.enchantments.crystal.name=%s кристаллизации
items.equipment.weapon.enchantments.crystal.alert_fixed=Ваше кристаллизованное оружие полностью отремонтировано!
items.equipment.weapon.enchantments.crystal.alert_fixed_ghost=Кристаллизованное оружие у призрака полностью отремонтировано!
items.equipment.weapon.enchantments.crystal.alert_noflaw=Ваше кристаллизованное оружие больше не имеет дефектов.
items.equipment.weapon.enchantments.crystal.alert_noflaw_ghost=Кристаллизованное оружие у призрака больше не имеет дефектов.
items.equipment.weapon.enchantments.crystal.alert_nocrack=На вашем кристаллизованном оружии больше нет трещин.
items.equipment.weapon.enchantments.crystal.alert_nocrack_ghost=На кристаллизованном оружии у призрака больше нет трещин.
items.equipment.weapon.enchantments.crystal.alert_flawed=Ваше кристаллизованное оружие получило незначительные повреждения.
items.equipment.weapon.enchantments.crystal.alert_flawed_ghost=Кристаллизованное оружие у призрака получило незначительные повреждения.
items.equipment.weapon.enchantments.crystal.alert_cracked=Ваше кристаллизованное оружие трескается, оно вот-вот сломается!
items.equipment.weapon.enchantments.crystal.alert_cracked_ghost=Кристаллизованное оружие у призрака трескается, оно вот-вот сломается!
items.equipment.weapon.enchantments.crystal.alert_shattered=Ваше кристаллизованное оружие разлетелось на осколки!
items.equipment.weapon.enchantments.crystal.alert_shattered_ghost=Кристаллизованное оружие у призрака разлетелось на осколки!
items.equipment.weapon.enchantments.crystal.desc=Это мощное зачарование наносит дополнительный магический урон и повышает ценность оружия. Однако это зачарование способно разрушить оружие, если кристаллизация не будет восстановлена или ей не дадут время для самовосстановления.
items.equipment.weapon.enchantments.crystal.desc_thrown=Кристаллизованное метательное оружие обладает более низкой прочностью, но со временем медленно восстанавливает её.
items.equipment.weapon.enchantments.crystal.desc_perfect=Это кристаллизованное оружие сейчас находится в идеальном состоянии.
items.equipment.weapon.enchantments.crystal.desc_fine=Это кристаллизованное оружие сейчас находится в хорошем состоянии.
items.equipment.weapon.enchantments.crystal.desc_flawed=Это кристаллизованное оружие имеет дефекты, но оно пока может сломаться.
items.equipment.weapon.enchantments.crystal.desc_cracked=Это кристаллизованное оружие трескается, есть риск, что оно окончательно сломается!
items.equipment.weapon.enchantments.crystal.elestrike_desc=Стихийный удар с зачарованием кристаллизации наносит 10-20 урона и восстанавливает оружие за каждого врага в радиусе действия, кроме основной цели.

items.equipment.weapon.enchantments.kinetic.name=%s инерции
items.equipment.weapon.enchantments.kinetic.desc=Когда оружие инерции убивает врага, оно сохраняет избыточный урон чтобы добавить его к следующей успешной атаке.
items.equipment.weapon.enchantments.kinetic.elestrike_desc=Стихийный удар с зачарованием инерции нанесёт 40% от избыточного урона каждому врагу в радиусе, кроме основной цели.
items.equipment.weapon.enchantments.kinetic$conserveddamage.name=инерция
items.equipment.weapon.enchantments.kinetic$conserveddamage.desc=Ваше оружие сохранило избыточный урон от предыдущего убийства и добавит его к вашей следующей атаке. Со временем, этот бонус будет постепенно уменьшаться.\n\nСохраненный урон: %d.

items.equipment.weapon.enchantments.corrupting.name=%s подчинения
items.equipment.weapon.enchantments.corrupting.desc=Это мощное зачарование обладает способностью подчинять врагов вашей воле. Когда враг убит этим оружием, есть вероятность, что вместо смерти он будет подчинен.
items.equipment.weapon.enchantments.corrupting.elestrike_desc=Стихийный удар с зачарованием подчинения имеет 5-25% шанс (в зависимости от недостающего здоровья) подчинить каждого врага в радиусе, кроме основной цели.

items.equipment.weapon.enchantments.eldritch.name=%s ужаса
items.equipment.weapon.enchantments.eldritch.desc=Устрашающее оружие вселяет страх в находящихся поблизости врагов, ставших свидетелями его ударов, заставляя их убегать от атакующего.
items.equipment.weapon.enchantments.eldritch.elestrike_desc=Стихийный удар с зачарованием ужаса накладывает длительную панику всем врагам в радиусе действия, включая основную цель.

items.equipment.weapon.enchantments.elastic.name=%s отталкивания
items.equipment.weapon.enchantments.elastic.desc=Отталкивающее оружие дает шанс отбросить противника на некоторое расстояние.
items.equipment.weapon.enchantments.elastic.elestrike_desc=Стихийный удар с зачарованием отталкивания откидывает всех врагов на 5 клеток.

items.equipment.weapon.enchantments.grim.name=%s погибели
items.equipment.weapon.enchantments.grim.desc=Это могущественное зачарование имеет силы мгновенно прикончить врага. Чем он слабее - тем выше вероятность срабатывания.
items.equipment.weapon.enchantments.grim.elestrike_desc=Стихийный удар с зачарованием погибели имеет шанс в 6-30% (в зависимости от недостающего здоровья) убить всех врагов в радиусе, кроме основной цели.

items.equipment.weapon.enchantments.lucky.name=%s удачи
items.equipment.weapon.enchantments.lucky.desc=Убитые оружием удачи враги могут оставлять дополнительные трофеи.
items.equipment.weapon.enchantments.lucky.elestrike_desc=Стихийный удар с зачарованием удачи имеет 12.5% шанс создать предмет под каждым задетым врагом. Этот эффект не может сработать на одном противнике дважды.

items.equipment.weapon.enchantments.projecting.name=%s проекции
items.equipment.weapon.enchantments.projecting.desc=С этим зачарованием оружие ближнего боя сможет бить дальше, а дальнего - проходить сквозь ближайшие стены, когда нацелено на ближайшие цели.
items.equipment.weapon.enchantments.projecting.elestrike_desc=Стихийный удар с зачарованием проекции наносит 30% урона каждому врагу в радиусе, кроме главной цели.

items.equipment.weapon.enchantments.shocking.name=%s молний
items.equipment.weapon.enchantments.shocking.desc=Разряды электричества от оружия молний наносят дополнительный урон врагам поблизости.
items.equipment.weapon.enchantments.shocking.elestrike_desc=Стихийный удар с зачарованием молний выпустит электрическую бурю, которая распространится на каждую клетку в радиусе и будет длиться 8 ходов.

items.equipment.weapon.enchantments.unstable.name=%s хаоса
items.equipment.weapon.enchantments.unstable.desc=Это зачарование излучает хаотическую энергию, давая непредвиденный результат при каждой атаке.
items.equipment.weapon.enchantments.unstable.elestrike_desc=Стихийный удар с зачарованием хаоса вызовет случайный эффект зачарования у каждого врага в радиусе действия, кроме основной цели.

items.equipment.weapon.enchantments.vampiric.name=%s вампиризма
items.equipment.weapon.enchantments.vampiric.desc=Это могущественное зачарование с каждым ударом вытягивает жизненные силы врагов и передает их владельцу. Чем меньше здоровья у того, кто его носит, тем сильнее этот эффект.
items.equipment.weapon.enchantments.vampiric.elestrike_desc=Стихийный удар с зачарованием вампиризма вылечит Дуэлянта на 2.5 ОЗ за каждого врага в области поражения.

items.equipment.weapon.enchantments.venomous.name=%s отравы
items.equipment.weapon.enchantments.venomous.desc=Отравляющее оружие наносит отложенный, но смертельный яд, действие которого усиливается с каждым новым попаданием.
items.equipment.weapon.enchantments.venomous.elestrike_desc=Стихийный удар с зачарованием отравы накладывает дополнительное отравление всем врагам в радиусе действия, кроме основной цели.

items.equipment.weapon.enchantments.vorpal.name=%s рассечения
items.equipment.weapon.enchantments.vorpal.desc=Рассекающее оружие отличается особой смертоносностью: при определённом шансом оно наносит настолько точный удар, что вместо урона вызывает кровотечение у врагов, способных кровоточить.
items.equipment.weapon.enchantments.vorpal.elestrike_desc=Стихийный удар с зачарованием рассечения накладывает дополнительное кровотечение всем врагам в радиусе действия, кроме основной цели.


###melee weapons
items.equipment.weapon.melee.assassinsblade.name=клинок убийцы
items.equipment.weapon.melee.assassinsblade.stats_desc=Это оружие эффективнее при скрытных атаках.
items.equipment.weapon.melee.assassinsblade.ability_name=спрятаться
items.equipment.weapon.melee.assassinsblade.typical_ability_desc=Дуэлянт с клинком убийцы может _спрятаться_. Эта способность позволяет мгновенно совершить скачок до 3 клеток и обычно даёт _%d хода невидимости._
items.equipment.weapon.melee.assassinsblade.ability_desc=Дуэлянт с клинком убийцы может _спрятаться_. Эта способность позволяет мгновенно совершить скачок до 3 клеток и даёт _%d хода невидимости._
items.equipment.weapon.melee.assassinsblade.upgrade_ability_stat_name=Длительность Способности
items.equipment.weapon.melee.assassinsblade.desc=Небольшое волнистое лезвие из обсидиана. Несмотря на лёгкий вес, оно неудобно в применении, но смертоносно при точном ударе.

items.equipment.weapon.melee.battleaxe.name=боевой топор
items.equipment.weapon.melee.battleaxe.stats_desc=Это довольно меткое оружие.
items.equipment.weapon.melee.battleaxe.ability_name=мощный удар
items.equipment.weapon.melee.battleaxe.typical_ability_desc=Дуэлянт может совершить _мощный удар_ боевым топором. Эта концентрированная атака обычно наносит _%1$d-%2$d урона_, если враг был застигнут врасплох, а также ошеломляет его на 5 ходов, чем снижает точность и уклонение на 50%%. Мощный удар всегда попадает в цель, но наносит обычный урон, если он не застает врага врасплох.
items.equipment.weapon.melee.battleaxe.ability_desc=Дуэлянт может совершить _мощный удар_ боевым топором. Эта концентрированная атака наносит _%1$d-%2$d урона_, если враг был застигнут врасплох, а также ошеломляет его на 5 ходов, чем снижает точность и уклонение на 50%%. Мощный удар всегда попадает в цель, но наносит обычный урон, если он не застает врага врасплох.
items.equipment.weapon.melee.battleaxe.desc=Огромное стальное лезвие этого топора позволяет наносить удары с устрашающей силой.

items.equipment.weapon.melee.crossbow.name=арбалет
items.equipment.weapon.melee.crossbow.typical_stats_desc=Когда экипировано, это оружие обычно позволяет наносить дротикам на _%1$d-%2$d_ больше урона и даже наделяет их своим зачарованием.
items.equipment.weapon.melee.crossbow.stats_desc=Когда экипировано, это оружие позволяет наносить дротикам на _%1$d-%2$d_ больше урона и даже наделяет их своим зачарованием.
items.equipment.weapon.melee.crossbow.ability_name=заряженный выстрел
items.equipment.weapon.melee.crossbow.typical_ability_desc=Дуэлянт может _зарядить_ её арбалет, благодаря чему её следующая атака им гарантированно попадёт в цель и применит один из трёх эффектов: рукопашная атака откинет врага, несмазанные дротики обычно будут наносить на _%1$d больше_ урона, а смазанные применят их эффект на площади 7х7 и могут остаться смазанными на _%2$d больше применений_.
items.equipment.weapon.melee.crossbow.ability_desc=Дуэлянт может _зарядить_ её арбалет, благодаря чему её следующая атака им гарантированно попадёт в цель и применит один из трёх эффектов: рукопашная атака откинет врага, несмазанные дротики будут наносить на _%1$d больше_ урона, а смазанные применят их эффект на площади 7х7 и останутся смазанными на _%2$d больше применений_.
items.equipment.weapon.melee.crossbow.desc=Замысловатое оружие, позволяющее стрелять дротиками со значительной силой. Хоть арбалет и не предназначен для ближнего боя, но его вес и прочность позволяют использовать его как дубину.
items.equipment.weapon.melee.crossbow.upgrade_ability_stat_name=Усиление Способности
items.equipment.weapon.melee.crossbow$chargedshot.name=заряжен
items.equipment.weapon.melee.crossbow$chargedshot.desc=Дуэлянт концентрируется и усиливает свой арбалет. Следующая атака им гарантированно попадёт в цель и применит один из трёх эффектов:\n- Рукопашная атака откинет врагов на несколько клеток.\n- Несмазанные дротики нанесут дополнительный урон.\n- Смазанные дротики получат дополнительные использования и применят свои эффекты по площади 7х7. Положительные эффекты дротиков применяются только к союзникам, а отрицательные только к противникам. Дуэлянт не может использовать эту способность, чтобы наложить на себя положительные эффекты дротиков.

items.equipment.weapon.melee.cudgel.name=палица
items.equipment.weapon.melee.cudgel.stats_desc=Это довольно меткое оружие.
items.equipment.weapon.melee.cudgel.ability_name=мощный удар
items.equipment.weapon.melee.cudgel.typical_ability_desc=Дуэлянт может совершить _мощный удар_ палицей. Эта концентрированная атака обычно наносит _%1$d-%2$d урона_, если враг был застигнут врасплох, а также ошеломляет его на 5 ходов, чем снижает точность и уклонение на 50%%. Мощный удар всегда попадает в цель, но наносит обычный урон, если он не застает врага врасплох.
items.equipment.weapon.melee.cudgel.ability_desc=Дуэлянт может совершить _мощный удар_ палицей. Эта концентрированная атака наносит _%1$d-%2$d урона_, если враг был застигнут врасплох, а также ошеломляет его на 5 ходов, чем снижает точность и уклонение на 50%%. Мощный удар всегда попадает в цель, но наносит обычный урон, если он не застает врага врасплох.
items.equipment.weapon.melee.cudgel.desc=Маленькая латунная дубина, предназначенная больше как средство самообороны для знати, чем как оружие для приключений.
items.equipment.weapon.melee.cudgel.discover_hint=Один из героев начинает с этим предметом.

items.equipment.weapon.melee.dagger.name=кинжал
items.equipment.weapon.melee.dagger.stats_desc=Это оружие эффективнее при скрытных атаках.
items.equipment.weapon.melee.dagger.ability_name=спрятаться
items.equipment.weapon.melee.dagger.typical_ability_desc=Дуэлянт с кинжалом может _спрятаться_. Эта способность позволяет мгновенно совершить скачок до 5 клеток и обычно даёт _%d хода невидимости._
items.equipment.weapon.melee.dagger.ability_desc=Дуэлянт с кинжалом может _спрятаться_. Эта способность позволяет мгновенно совершить скачок до 5 клеток и даёт _%d хода невидимости._
items.equipment.weapon.melee.dagger.upgrade_ability_stat_name=Длительность Способности
items.equipment.weapon.melee.dagger.desc=Простой деревянный кинжал с изношенной деревянной рукоятью.
items.equipment.weapon.melee.dagger.discover_hint=Один из героев начинает с этим предметом.

items.equipment.weapon.melee.dirk.name=кортик
items.equipment.weapon.melee.dirk.stats_desc=Это оружие эффективнее при скрытных атаках.
items.equipment.weapon.melee.dirk.ability_name=спрятаться
items.equipment.weapon.melee.dirk.typical_ability_desc=Дуэлянт с кортиком может _спрятаться_. Эта способность позволяет мгновенно совершить скачок до 4 клеток и обычно даёт _%d хода невидимости._
items.equipment.weapon.melee.dirk.ability_desc=Дуэлянт с кортиком может _спрятаться_. Эта способность позволяет мгновенно совершить скачок до 4 клеток и даёт _%d хода невидимости._
items.equipment.weapon.melee.dirk.upgrade_ability_stat_name=Длительность Способности
items.equipment.weapon.melee.dirk.desc=Кортик длиннее обычного кинжала, поэтому позволяет наносить более глубокие раны.

items.equipment.weapon.melee.flail.name=кистень
items.equipment.weapon.melee.flail.stats_desc=Это оружие не отличается особой точностью.\nИм нельзя осуществить неожиданную атаку.
items.equipment.weapon.melee.flail.ability_name=вращать
items.equipment.weapon.melee.flail.spin_warn=Вы больше не можете вращать кистень.
items.equipment.weapon.melee.flail.typical_ability_desc=Дуэлянт может _вращать_ кистень, чтобы увеличить его силу на короткое время. Обычно, пока кистень вращается, следующая атака им может вплоть до 3 раз получить _+%d дополнительного урона_. Вращающийся кистень гарантированно попадает в цель. Только начать крутить кистень стоит заряд оружия.
items.equipment.weapon.melee.flail.ability_desc=Дуэлянт может _вращать_ кистень, чтобы увеличить его силу на короткое время. Пока кистень вращается, следующая атака им может вплоть до 3 раз получить _+%d дополнительного урона_. Вращающийся кистень гарантированно попадает в цель. Только начать крутить кистень стоит заряд оружия.
items.equipment.weapon.melee.flail.desc=Шипастый шар на цепи, присоединённой к рукояти. Крайне неуклюжее оружие, но сокрушительное при точном попадании.
items.equipment.weapon.melee.flail$spinabilitytracker.name=вращение
items.equipment.weapon.melee.flail$spinabilitytracker.desc=Дуэлянт раскручивает свой кистень, увеличивая урон следующей обычной атаки этим оружием. Каждое вращение занимает 1 ход, но увеличивает урон до максимум трех вращений. Раскрученный кистень гарантированно попадет в цель.\n\nТекущая раскрутка: %1$d%%.\nХодов осталось: %2$s.

items.equipment.weapon.melee.gauntlet.name=каменная перчатка
items.equipment.weapon.melee.gauntlet.stats_desc=Это очень быстрое оружие.
items.equipment.weapon.melee.gauntlet.ability_name=двойной удар
items.equipment.weapon.melee.gauntlet.typical_ability_desc=Дуэлянт может совершить _двойной удар_ каменной перчаткой. Эта атака гарантированно попадёт в цель и обычно наносит на _%d больше урона_ за каждый раз, когда Дуэлянт удачно попала в противника в ближнем бою или метательным оружием. Комбо сбрасывается, если ей не удаётся провести успешную атаку в течение 5 ходов или 15 ходов после убийства.
items.equipment.weapon.melee.gauntlet.ability_desc=Дуэлянт может совершить _двойной удар_ каменной перчаткой. Эта атака гарантированно попадёт в цель и наносит на _%d больше урона_ за каждый раз, когда Дуэлянт удачно попала в противника в ближнем бою или метательным оружием. Комбо сбрасывается, если ей не удаётся провести успешную атаку в течение 5 ходов или 15 ходов после убийства.
items.equipment.weapon.melee.gauntlet.desc=Эта зачарованная перчатка сделана из ткани багрового цвета и покрыта каменными пластинами. Она отлично облегает вашу руку, из-за чего толстые пластины чувствуются как вторая кожа. Использование такого оружия требует большой силы, зато придаёт вашим ударам невероятную мощь.

items.equipment.weapon.melee.glaive.name=глефа
items.equipment.weapon.melee.glaive.stats_desc=Это довольно медленное оружие.\nЭто оружие имеет повышенную дальность атаки.
items.equipment.weapon.melee.glaive.ability_name=пронзить
items.equipment.weapon.melee.glaive.typical_ability_desc=Дуэлянт, используя наконечник глефы, может _пронзить_ врага в зоне досягаемости, но не стоящего вплотную. Эта атака обычно наносит _%1$d-%2$d урона_, отталкивает противника и гарантированно попадает в цель.
items.equipment.weapon.melee.glaive.ability_desc=Дуэлянт, используя наконечник глефы, может _пронзить_ врага в зоне досягаемости, но не стоящего вплотную. Эта атака наносит _%1$d-%2$d урона_, отталкивает противника и гарантированно попадает в цель.
items.equipment.weapon.melee.glaive.desc=Крупное древковое оружие с длинным клинком на конце.

items.equipment.weapon.melee.gloves.name=шипованные перчатки
items.equipment.weapon.melee.gloves.stats_desc=Это очень быстрое оружие.
items.equipment.weapon.melee.gloves.ability_name=двойной удар
items.equipment.weapon.melee.gloves.typical_ability_desc=Дуэлянт может совершить _двойной удар_ шипованными перчатками. Эта атака гарантированно попадёт в цель и обычно наносит на _%d больше урона_ за каждый раз, когда Дуэлянт удачно попала в противника в ближнем бою или метательным оружием. Комбо сбрасывается, если ей не удаётся провести успешную атаку в течение 5 ходов или 15 ходов после убийства.
items.equipment.weapon.melee.gloves.ability_desc=Дуэлянт может совершить _двойной удар_ шипованными перчатками. Эта атака гарантированно попадёт в цель и наносит на _%d больше урона_ за каждый раз, когда Дуэлянт удачно попала в противника в ближнем бою или метательным оружием. Комбо сбрасывается, если ей не удаётся провести успешную атаку в течение 5 ходов или 15 ходов после убийства.
items.equipment.weapon.melee.gloves.desc=Эти шипованные перчатки не обеспечивают никакой защиты, но они выступают в качестве неплохого оружия, оставляя руки свободными.
items.equipment.weapon.melee.gloves.discover_hint=Один из героев начинает с этим предметом.

items.equipment.weapon.melee.greataxe.name=секира
items.equipment.weapon.melee.greataxe.stats_desc=Это невероятно тяжёлое оружие.
items.equipment.weapon.melee.greataxe.ability_name=возмездие
items.equipment.weapon.melee.greataxe.typical_ability_desc=Дуэлянт может совершить _удар возмездия_ секирой, если у неё меньше 50%% здоровья. Эта уничтожающая всё и вся атака обычно наносит _%1$d-%2$d урона_, гарантированно попадает в цель и моментальна, если убивает врага.
items.equipment.weapon.melee.greataxe.ability_desc=Дуэлянт может совершить _удар возмездия_ секирой, если у неё меньше 50%% здоровья. Эта уничтожающая всё и вся атака наносит _%1$d-%2$d урона_, гарантированно попадает в цель и моментальна, если убивает врага.
items.equipment.weapon.melee.greataxe.desc=Предназначенный для ношения на плече, этот массивный топор настолько же опасен, насколько тяжёл.

items.equipment.weapon.melee.greatshield.name=ростовой щит
items.equipment.weapon.melee.greatshield.typical_stats_desc=Обычно это оружие блокирует от 0 до %d урона. Этот блок зависит от уровня оружия.
items.equipment.weapon.melee.greatshield.stats_desc=Это оружие блокирует от 0 до %d урона. Этот блок зависит от уровня оружия.
items.equipment.weapon.melee.greatshield.ability_name=защититься
items.equipment.weapon.melee.greatshield.typical_ability_desc=Дуэлянт может _защитить_ себя ростовым щитом, становясь полностью неуязвимой к физическим и магическим атакам обычно в течение _%d ходов_. Как только Дуэлянт заблокирует атаку, атакование в ответ или использование магии разрушит её защиту.
items.equipment.weapon.melee.greatshield.ability_desc=Дуэлянт может _защитить_ себя ростовым щитом, становясь полностью неуязвимой к физическим и магическим атакам в течение _%d ходов_. Как только Дуэлянт заблокирует атаку, атакование в ответ или использование магии разрушит её защиту.
items.equipment.weapon.melee.greatshield.upgrade_ability_stat_name=Длительность Способности
items.equipment.weapon.melee.greatshield.desc=Больше похожий на переносную стену, этот гигантский лист металла обеспечивает отличную защиту, но не слишком подходит для нападения.

items.equipment.weapon.melee.greatsword.name=двуручный меч
items.equipment.weapon.melee.greatsword.ability_name=рассечь
items.equipment.weapon.melee.greatsword.typical_ability_desc=Дуэлянт может _рассечь_ врага двуручным мечом. Эта атака обычно наносит _%1$d-%2$d урона_ и гарантированно попадает в цель. Если, рассекая противника, Дуэлянт убивает его, то она может использовать эту атаку ещё раз бесплатно на протяжении 5 ходов.
items.equipment.weapon.melee.greatsword.ability_desc=Дуэлянт может _рассечь_ врага двуручным мечом. Эта атака наносит _%1$d-%2$d урона_ и гарантированно попадает в цель. Если, рассекая противника, Дуэлянт убивает его, то она может использовать эту атаку ещё раз бесплатно на протяжении 5 ходов.
items.equipment.weapon.melee.greatsword.desc=Внушительный клинок этого меча придает его взмахам огромную силу.

items.equipment.weapon.melee.handaxe.name=ручной топор
items.equipment.weapon.melee.handaxe.stats_desc=Это довольно меткое оружие.
items.equipment.weapon.melee.handaxe.ability_name=мощный удар
items.equipment.weapon.melee.handaxe.typical_ability_desc=Дуэлянт может совершить _мощный удар_ ручным топором. Эта концентрированная атака обычно наносит _%1$d-%2$d урона_, если враг был застигнут врасплох, а также ошеломляет его на 5 ходов, чем снижает точность и уклонение на 50%%. Мощный удар всегда попадает в цель, но наносит обычный урон, если он не застает врага врасплох.
items.equipment.weapon.melee.handaxe.ability_desc=Дуэлянт может совершить _мощный удар_ ручным топором. Эта концентрированная атака наносит _%1$d-%2$d урона_, если враг был застигнут врасплох, а также ошеломляет его на 5 ходов, чем снижает точность и уклонение на 50%%. Мощный удар всегда попадает в цель, но наносит обычный урон, если он не застает врага врасплох.
items.equipment.weapon.melee.handaxe.desc=Лёгкий топор, часто применяемый для рубки деревьев. Его широкое топорище неплохо справится и с врагами.

items.equipment.weapon.melee.katana.name=катана
items.equipment.weapon.melee.katana.stats_desc=Это оружие блокирует от 0 до 3 урона.
items.equipment.weapon.melee.katana.ability_name=выпад
items.equipment.weapon.melee.katana.typical_ability_desc=Дуэлянт с катаной может сделать _выпад_ в сторону врага, который находится на расстоянии в 1 клетку. Выпад сближает с противником, обычно нанося ему _%1$d-%2$d урона_ и гарантированно попадает в цель.
items.equipment.weapon.melee.katana.ability_desc=Дуэлянт с катаной может сделать _выпад_ в сторону врага, который находится на расстоянии в 1 клетку. Выпад сближает с противником, нанося ему _%1$d-%2$d урона_ и гарантированно попадает в цель.
items.equipment.weapon.melee.katana.desc=Тонкий меч с большой металлической гардой над рукоятью.

items.equipment.weapon.melee.longsword.name=длинный меч
items.equipment.weapon.melee.longsword.ability_name=рассечь
items.equipment.weapon.melee.longsword.typical_ability_desc=Дуэлянт может _рассечь_ врага длинным мечом. Эта атака обычно наносит _%1$d-%2$d урона_ и гарантированно попадает в цель. Если, рассекая противника, Дуэлянт убивает его, это происходит мгновенно, то она может использовать эту атаку ещё раз бесплатно на протяжении 5 ходов.
items.equipment.weapon.melee.longsword.ability_desc=Дуэлянт может _рассечь_ врага длинным мечом. Эта атака наносит _%1$d-%2$d урона_ и гарантированно попадает в цель. Если, рассекая противника, Дуэлянт убивает его, это происходит мгновенно, то она может использовать эту атаку ещё раз бесплатно на протяжении 5 ходов.
items.equipment.weapon.melee.longsword.desc=Длинный бритвенно-острый клинок этого меча успокаивающе блестит, хотя из-за своего размера он довольно тяжёл.

items.equipment.weapon.melee.mace.name=булава
items.equipment.weapon.melee.mace.stats_desc=Это довольно меткое оружие.
items.equipment.weapon.melee.mace.ability_name=мощный удар
items.equipment.weapon.melee.mace.typical_ability_desc=Дуэлянт может совершить _мощный удар_ булавой. Эта концентрированная атака обычно наносит _%1$d-%2$d урона_, если враг был застигнут врасплох, а также ошеломляет его на 5 ходов, чем снижает точность и уклонение на 50%%. Мощный удар всегда попадает в цель, но наносит обычный урон, если он не застает врага врасплох.
items.equipment.weapon.melee.mace.ability_desc=Дуэлянт может совершить _мощный удар_ булавой. Эта концентрированная атака наносит _%1$d-%2$d урона_, если враг был застигнут врасплох, а также ошеломляет его на 5 ходов, чем снижает точность и уклонение на 50%%. Мощный удар всегда попадает в цель, но наносит обычный урон, если он не застает врага врасплох.
items.equipment.weapon.melee.mace.desc=Железное навершие этого оружия способно нанести значительные повреждения.

items.equipment.weapon.melee.magesstaff.name=посох Мага
items.equipment.weapon.melee.magesstaff.ac_imbue=НАДЕЛИТЬ
items.equipment.weapon.melee.magesstaff.ac_zap=ИСПОЛЬЗОВАТЬ
items.equipment.weapon.melee.magesstaff.prompt=Выберите палочку
items.equipment.weapon.melee.magesstaff.imbue=Вы используете %s для того, чтобы наделить ваш посох его силой.
items.equipment.weapon.melee.magesstaff.preserved=Предыдущая палочка была сохранена!
items.equipment.weapon.melee.magesstaff.imbue_desc=Вы уверены, что хотите наделить свой посох силой этой палочки?\n\nЕсли наделяемая палочка имеет тот же или более высокий уровень, что и посох, посох унаследует уровень этой палочки плюс одно из его собственных улучшений.
items.equipment.weapon.melee.magesstaff.imbue_level=Таким образом, получится посох _+%d уровня._
items.equipment.weapon.melee.magesstaff.imbue_unknown=Вы не знаете уровень этой палочки, но в результате получится посох хотя бы _+%d уровня._
items.equipment.weapon.melee.magesstaff.imbue_cursed=_Если вы наделите свой посох силой проклятой палочки, то и ваш посох станет проклятым!_
items.equipment.weapon.melee.magesstaff.imbue_lost=Палочка, силой которой в данный момент наполнен ваш посох, _будет потеряна_.
items.equipment.weapon.melee.magesstaff.imbue_talent=Палочка, силой которой в данный момент наполнен ваш посох, _будет возвращена как +0_.
items.equipment.weapon.melee.magesstaff.yes=Да, я уверен
items.equipment.weapon.melee.magesstaff.no=Нет, я передумал
items.equipment.weapon.melee.magesstaff.desc=Созданный самим Магом, этот посох является уникальным волшебным оружием, которое может быть наделено силой любой палочки.
items.equipment.weapon.melee.magesstaff.no_wand=Сейчас посох не имеет особой магии, его нужно _наделить силой палочки,_ чтобы получить возможность использовать заклинания.
items.equipment.weapon.melee.magesstaff.has_wand=Сейчас этот посох наделён той же силой, что и _%s._
items.equipment.weapon.melee.magesstaff.cursed_wand=Посох проклят, что делает его магию хаотичной и случайной.
items.equipment.weapon.melee.magesstaff.discover_hint=Один из героев начинает с этим предметом.

items.equipment.weapon.melee.meleeweapon.ac_ability=СПОСОБНОСТЬ
items.equipment.weapon.melee.meleeweapon.stats_known=Это оружие ближнего боя _%1$d-го уровня_ наносит _%2$d-%3$d ед. урона_ и требует _%4$d очков силы_ для эффективного использования.
items.equipment.weapon.melee.meleeweapon.stats_unknown=Это оружие ближнего боя _%1$d-го уровня_ обычно наносит _%2$d-%3$d ед. урона_ и требует _%4$d очков силы_ для эффективного использования.
items.equipment.weapon.melee.meleeweapon.probably_too_heavy=Вероятно, это оружие будет слишком тяжело для вас.
items.equipment.weapon.melee.meleeweapon.stats_desc=
items.equipment.weapon.melee.meleeweapon.ability_need_equip=Вы должны экипировать это оружие, чтобы использовать его способность.
items.equipment.weapon.melee.meleeweapon.ability_low_str=Вы недостаточно сильны чтобы использовать способность этого оружия.
items.equipment.weapon.melee.meleeweapon.ability_no_charge=У вас недостаточно энергии чтобы использовать эту способность.
items.equipment.weapon.melee.meleeweapon.ability_cant_use=Вы не можете использовать эту способность сейчас.
items.equipment.weapon.melee.meleeweapon.ability_no_target=Там нет цели.
items.equipment.weapon.melee.meleeweapon.ability_target_range=Эта цель недосягаема.
items.equipment.weapon.melee.meleeweapon.ability_occupied=Это место занято.
