##ghost hero
items.equipment.artifacts.driedrose$ghosthero.name=droevige geest
items.equipment.artifacts.driedrose$ghosthero.def_verb=ontweken
items.equipment.artifacts.driedrose$ghosthero.discover_hint=Je kunt dit personage met een specifiek artefact vinden.

items.equipment.artifacts.driedrose$ghosthero.hello=Welkom terug %s.
items.equipment.artifacts.driedrose$ghosthero.introduce=Mijn geest is verbonden met deze roos, hij was erg kostbaar voor mij, een geschenk van mijn liefde die ik aan de oppervlakte heb achtergelaten.\n\nIk kan niet naar hem terugkeren, maar dankzij jou heb ik een tweede kans om mijn reis te voltooien. Als ik voldoende sterk ben reageer ik op je oproepen en met je vechten.\n\nZolang je de roos hebt, kan ik je stem horen, dus je kunt hem gebruiken om me van ver te sturen.\n\nHopelijk lukt het jou waar ik faalde...

items.equipment.artifacts.driedrose$ghosthero.dialogue_sewers_1=Vroeger waren deze riolen veilig, hier woonden zelfs 's winters mensen.
items.equipment.artifacts.driedrose$ghosthero.dialogue_sewers_2=Ik vraag me af wat er met de bewakingspatrouilles is gebeurd, hebben ze het opgegeven?
items.equipment.artifacts.driedrose$ghosthero.dialogue_sewers_3=Ik had familie aan de oppervlakte, ik hoop dat ze veilig zijn.
items.equipment.artifacts.driedrose$ghosthero.dialogue_sewers_4=De bewakers konden deze monsters niet verslaan, maar misschien kunnen wij dat wel.
items.equipment.artifacts.driedrose$ghosthero.dialogue_sewers_5=Als zelfs de riolen zo gevaarlijk zijn, vraag ik me af wat er beneden is...
items.equipment.artifacts.driedrose$ghosthero.dialogue_sewers_6=Wat kan ervoor gezorgd hebben dat deze ratten en krabben zo groot zijn geworden?
items.equipment.artifacts.driedrose$ghosthero.dialogue_prison_1=Ik heb verhalen gehoord over deze plek, geen goede verhalen.
items.equipment.artifacts.driedrose$ghosthero.dialogue_prison_2=Deze plaats was altijd meer een kerker dan een gevangenis.
items.equipment.artifacts.driedrose$ghosthero.dialogue_prison_3=Ik kan me niet voorstellen wat er gebeurde toen deze plek werd verlaten.
items.equipment.artifacts.driedrose$ghosthero.dialogue_prison_4=Het lijkt erop dat zowel de gevangenen als de bewakers in monsters zijn veranderd.
items.equipment.artifacts.driedrose$ghosthero.dialogue_prison_5=Wat zou verantwoordelijk zijn voor al deze skeletten?
items.equipment.artifacts.driedrose$ghosthero.dialogue_prison_6=Deze mensen hoefden niet zo te eindigen...
items.equipment.artifacts.driedrose$ghosthero.dialogue_caves_1=Er is hier al heel lang geen mens of dwerg meer geweest.
items.equipment.artifacts.driedrose$ghosthero.dialogue_caves_2=Wat zou de dwergen ertoe brengen een goudmijn te verlaten?
items.equipment.artifacts.driedrose$ghosthero.dialogue_caves_3=Het is jammer dat al het goud hier nutteloos is aan de oppervlakte.
items.equipment.artifacts.driedrose$ghosthero.dialogue_caves_4=De wezens hier zijn verdorven, net als in de riolen.
items.equipment.artifacts.driedrose$ghosthero.dialogue_caves_5=Zelfs de vleermuizen zijn hier bloeddorstig.
items.equipment.artifacts.driedrose$ghosthero.dialogue_caves_6=Geen spoor van mijnuitrusting, hebben de dwergen alles meegenomen?
items.equipment.artifacts.driedrose$ghosthero.dialogue_city_1=De dwergen waren ijverig, maar hebzuchtig.
items.equipment.artifacts.driedrose$ghosthero.dialogue_city_2=Dus, de dwergenmetropool is echt gevallen.
items.equipment.artifacts.driedrose$ghosthero.dialogue_city_3=Ik hoop dat de oppervlakte nooit zo eindigt als deze plek.
items.equipment.artifacts.driedrose$ghosthero.dialogue_city_4=Dwergen horen er niet zo bleek uit te zien.
items.equipment.artifacts.driedrose$ghosthero.dialogue_city_5=Ik weet niet wat erger is: de dwergen, of hun creaties.
items.equipment.artifacts.driedrose$ghosthero.dialogue_city_6=Het lijkt erop dat de dwergen nu ook hersenloze monsters zijn.
items.equipment.artifacts.driedrose$ghosthero.dialogue_halls_1=Wat is dit voor plek?
items.equipment.artifacts.driedrose$ghosthero.dialogue_halls_2=Deze plek is angstaanjagend...
items.equipment.artifacts.driedrose$ghosthero.dialogue_halls_3=Wat dachten de dwergen, toen ze met deze krachten speelden?
items.equipment.artifacts.driedrose$ghosthero.dialogue_halls_4=De monsters hier zijn niet van deze aarde, waar komen ze vandaan?
items.equipment.artifacts.driedrose$ghosthero.dialogue_halls_5=Voel je het? Het is alsof iets ons in de gaten houdt.
items.equipment.artifacts.driedrose$ghosthero.dialogue_halls_6=Gelukkig zijn er fakkels, het is hier zo donker!
items.equipment.artifacts.driedrose$ghosthero.dialogue_ascension_1=Waarom gebeurt dit, ik dacht dat het ons was gelukt?
items.equipment.artifacts.driedrose$ghosthero.dialogue_ascension_2=Hoe kan dat ding deze wereld nog beïnvloeden?
items.equipment.artifacts.driedrose$ghosthero.dialogue_ascension_3=Ik hoop dat je weet wat je aan het doen bent met dat amulet.
items.equipment.artifacts.driedrose$ghosthero.dialogue_ascension_4=Ik denk dat we nog niet helemaal klaar zijn.
items.equipment.artifacts.driedrose$ghosthero.dialogue_ascension_5=We zijn al zo ver, we kunnen dit afmaken!
items.equipment.artifacts.driedrose$ghosthero.dialogue_ascension_6=Nog even verder, we komen hier wel uit!

items.equipment.artifacts.driedrose$ghosthero.seen_goo_1=Pas op Smurrie!
items.equipment.artifacts.driedrose$ghosthero.seen_goo_2=Veel van mijn vrienden stierven aan dit ding, tijd voor wraak!
items.equipment.artifacts.driedrose$ghosthero.seen_goo_3=Zo'n gruwel mag niet blijven bestaan!
items.equipment.artifacts.driedrose$ghosthero.seen_tengu_1=De enige overgebleven gevangene is een dodelijke moordenaar. Natuurlijk...
items.equipment.artifacts.driedrose$ghosthero.seen_tengu_2=Hij heeft ons opgesloten!
items.equipment.artifacts.driedrose$ghosthero.seen_tengu_3=Ik heb horrorverhalen gehoord over dat masker...
items.equipment.artifacts.driedrose$ghosthero.seen_dm300_1=Alleen dwergen zouden een mijnbouwmachine bouwen die indringers doodt.
items.equipment.artifacts.driedrose$ghosthero.seen_dm300_2=Dat ding is enorm...
items.equipment.artifacts.driedrose$ghosthero.seen_dm300_3=Hoe is dit ding zo lang actief gebleven?
items.equipment.artifacts.driedrose$ghosthero.seen_king_1=Als mensen zeggen dat macht corrumpeert, bedoelen ze dit.
items.equipment.artifacts.driedrose$ghosthero.seen_king_2=Hij is nu meer een kadaver dan een koning.
items.equipment.artifacts.driedrose$ghosthero.seen_king_3=Zelfs in de dood gehoorzamen de dwergen hun meester.
items.equipment.artifacts.driedrose$ghosthero.seen_yog_1=Oh, dit ziet er niet goed uit.
items.equipment.artifacts.driedrose$ghosthero.seen_yog_2=Dus zo ziet een god eruit?
items.equipment.artifacts.driedrose$ghosthero.seen_yog_3=Dit gaat pijn doen...

items.equipment.artifacts.driedrose$ghosthero.defeated_by_enemy_1=Veel geluk...
items.equipment.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Moe... voorlopig...
items.equipment.artifacts.driedrose$ghosthero.defeated_by_enemy_3=Ik keer terug...
items.equipment.artifacts.driedrose$ghosthero.defeated_by_boss_1=Het spijt me... veel succes...
items.equipment.artifacts.driedrose$ghosthero.defeated_by_boss_2=Maak het af... zonder mij...
items.equipment.artifacts.driedrose$ghosthero.defeated_by_boss_3=Nee... ik kan het niet...
items.equipment.artifacts.driedrose$ghosthero.blessed_ankh_1=Hoe heb je dat overleefd?
items.equipment.artifacts.driedrose$ghosthero.blessed_ankh_2=Ik wou dat ik er zo een had...
items.equipment.artifacts.driedrose$ghosthero.blessed_ankh_3=Wow! Je leeft nog!
items.equipment.artifacts.driedrose$ghosthero.player_killed_1=Nee!...
items.equipment.artifacts.driedrose$ghosthero.player_killed_2=Ik kon ze niet helpen...
items.equipment.artifacts.driedrose$ghosthero.player_killed_3=Niet zoals dit...

items.equipment.artifacts.driedrose$ghosthero.direct_prompt=Wat moet ik doen?
items.equipment.artifacts.driedrose$ghosthero.directed_follow_1=Oké, ik volg je.
items.equipment.artifacts.driedrose$ghosthero.directed_follow_2=Ik volg je.
items.equipment.artifacts.driedrose$ghosthero.directed_follow_3=Ik volg je...
items.equipment.artifacts.driedrose$ghosthero.directed_follow_4=Oke, laten we gaan!
items.equipment.artifacts.driedrose$ghosthero.directed_follow_5=Ik geef je rugdekking.
items.equipment.artifacts.driedrose$ghosthero.directed_attack_1=Oké, ik val die aan.
items.equipment.artifacts.driedrose$ghosthero.directed_attack_2=Ik pak die aan.
items.equipment.artifacts.driedrose$ghosthero.directed_attack_3=Aanvallen...
items.equipment.artifacts.driedrose$ghosthero.directed_attack_4=Laten we ze aanpakken!
items.equipment.artifacts.driedrose$ghosthero.directed_attack_5=Die is voor mij.
items.equipment.artifacts.driedrose$ghosthero.directed_position_1=Oké, ik verdedig die positie.
items.equipment.artifacts.driedrose$ghosthero.directed_position_2=Ik ga erheen om te verdedigen.
items.equipment.artifacts.driedrose$ghosthero.directed_position_3=Herpositioneren...
items.equipment.artifacts.driedrose$ghosthero.directed_position_4=Ik ben onderweg!
items.equipment.artifacts.driedrose$ghosthero.directed_position_5=Ik ga erheen.

items.equipment.artifacts.driedrose$ghosthero.desc=Een fragiel ogend etherische schim met een menselijke vorm. Zijn kracht lijkt verbonden met de roos die je hebt.\n\nDeze geest stelt misschien niet veel voor, toch lijkt het je enige echte vriend hier beneden te zijn.

