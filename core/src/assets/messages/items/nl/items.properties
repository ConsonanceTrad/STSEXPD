###armor curses
items.equipment.armor.curses.antientropy.name=%s van anti-entropie
items.equipment.armor.curses.antientropy.desc=De vloek van anti-entropie werkt tegen de krachten van het universum, en sluist energie uit de omgeving door naar de drager. Dit zet de drager even in brand, maar bevriest alles om de drager heen!

items.equipment.armor.curses.bulk.name=%s van bulk
items.equipment.armor.curses.bulk.desc=Een harnas van bulk lijkt groter en indrukwekkender, maar biedt geen daadwerkelijke verbeterde verdediging. Sterker nog, de extra omvang maakt het erg moeilijk om door deuropeningen te komen.

items.equipment.armor.curses.corrosion.name=%s van corrosie
items.equipment.armor.curses.corrosion.desc=Een harnas van corrosie kan uitbarsten met een bijtende vloeistof, dat alles in de omgeving bedekt met kleverig zuur.

items.equipment.armor.curses.displacement.name=%s van verplaatsing
items.equipment.armor.curses.displacement.desc=De vloek van verplaatsing probeert de drager in veiligheid te brengen als deze aangevallen wordt. De vloek is echter iets te effectief en teleporteert de gebruiker naar een willekeurig plek op de verdieping.

items.equipment.armor.curses.metabolism.name=%s van stofwisseling
items.equipment.armor.curses.metabolism.desc=De stofwisselingsvloek zet verzadiging direct om in gezondheid wanneer de drager gewond is. Dit zorgt voor extra genezing, maar veroorzaakt snel honger.

items.equipment.armor.curses.multiplicity.name=%s van vermenigvuldiging
items.equipment.armor.curses.multiplicity.desc=Een harnas vervloekt met vermenigvuldiging bevat gevaarlijke duplicatiemagie. Soms maakt het een spiegelbeeld van de drager, maar je hebt eenzelfde kans dat de aanvaller verdubbeld wordt!

items.equipment.armor.curses.overgrowth.name=%s van overgroeiing
items.equipment.armor.curses.overgrowth.desc=Een harnas van overgroeiing is bedekt met diverse bloeiende planten. Alhoewel dit er zeker interessant uit ziet, draagt het niet bij aan bescherming en deze planten worden lukraak actief tijdens gevechten.

items.equipment.armor.curses.stench.name=%s van stank
items.equipment.armor.curses.stench.desc=Een harnas met een stankvervloeking laat wolken met schadelijk gas vrijkomen, die gevaarlijk zijn voor alles wat in ze wordt gevangen.


###glyphs
items.equipment.armor.glyphs.affection.name=%s van liefde
items.equipment.armor.glyphs.affection.desc=Dit krachtige symbool beïnvloedt de geest van aanvallers en maakt hen tijdelijk gecharmeerd.

items.equipment.armor.glyphs.antimagic.name=%s van anti-magie
items.equipment.armor.glyphs.antimagic.desc=Dit krachtige symbool staat het harnas toe zowel magische als fysieke aanvallen te blokkeren. De magische verdediging wordt niet beïnvloed door de klasse van het harnas.

items.equipment.armor.glyphs.brimstone.name=%s van zwavel
items.equipment.armor.glyphs.brimstone.desc=Dit symbool beschermt de drager en zijn bezittingen tegen vuur, en heft alle schade en negatieve effecten ervan op.

items.equipment.armor.glyphs.camouflage.name=%s van camouflage
items.equipment.armor.glyphs.camouflage.desc=Dit symbool laat de drager ervan opgaan in het hoge gras, waardoor deze tijdelijk onzichtbaar wordt.

items.equipment.armor.glyphs.entanglement.name=%s van verstrikking
items.equipment.armor.glyphs.entanglement.desc=Dit symbool laat een aardachtige bepantsering rond de drager groeien, dat schade kan opvangen. Deze bepantsering breekt echter zodra de drager beweegt.

items.equipment.armor.glyphs.flow.name=%s van stroming
items.equipment.armor.glyphs.flow.desc=Dit symbool kan invloed uitoefenen op de stroming van het water rond de drager, hierdoor loopt de drager er veel sneller doorheen.

items.equipment.armor.glyphs.obfuscation.name=%s van verduistering
items.equipment.armor.glyphs.obfuscation.desc=Dit symbool verbergt de drager, waardoor deze moeilijker te detecteren is.

items.equipment.armor.glyphs.potential.name=%s van potentie
items.equipment.armor.glyphs.potential.desc=Dit symbool bouwt energie op als de drager geraakt wordt. Hierdoor laden de toverstokken van de drager op.

items.equipment.armor.glyphs.repulsion.name=%s van afstoting
items.equipment.armor.glyphs.repulsion.desc=Dit symbool kaatst de ontvangen kracht terug naar de aanvaller, waardoor ze achteruit worden geduwd.

items.equipment.armor.glyphs.stone.name=%s van steen
items.equipment.armor.glyphs.stone.desc=Dit symbool omringt het harnas met zware magische stenen waardoor ontwijken onmogelijk wordt, maar houdt daarentegen schade tegen in verhouding met ontwijking.

items.equipment.armor.glyphs.swiftness.name=%s van snelheid
items.equipment.armor.glyphs.swiftness.desc=Dit symbool maakt de drager sneller als deze niet in de buurt van een vijand is.

items.equipment.armor.glyphs.thorns.name=%s van doornen
items.equipment.armor.glyphs.thorns.desc=Dit krachtige symbool brengt schade toe aan aanvallers als ze de drager aanvallen, waardoor ze langzaam gaan bloeden.

items.equipment.armor.glyphs.viscosity.name=%s van taaiheid
items.equipment.armor.glyphs.viscosity.deferred=uitgesteld %d
items.equipment.armor.glyphs.viscosity$defereddamage.name=uitgestelde schade
items.equipment.armor.glyphs.viscosity$defereddamage.ondeath=De uitgestelde schade heeft je gedood...
items.equipment.armor.glyphs.viscosity$defereddamage.rankings_desc=Gedood door uitgestelde schade
items.equipment.armor.glyphs.viscosity$defereddamage.desc=Schade wordt langzaam over tijd uitgedeeld, in plaats van in een keer.\n\nResterende uitgestelde schade: %d.
items.equipment.armor.glyphs.viscosity.desc=Dit symbool maakt het mogelijk om schade aan de drager op te slaan en deze langzaam in plaats van in één keer toe te dienen.



###armor
items.equipment.armor.armor.ac_detach=MAAK LOS
items.equipment.armor.armor.detach_seal=Je hebt het zegel van je harnas gehaald.
items.equipment.armor.armor.equip_cursed=Het harnas trekt zich pijnlijk strak om je heen.
items.equipment.armor.armor.identify=Je draagt je harnas nu lang genoeg om het te identificeren.
items.equipment.armor.armor.hardening_gone=De verharding van dit harnas is uitgewerkt!
items.equipment.armor.armor.incompatible=Interactie van verschillende soorten magie heeft het symbool op dit harnas gewist!
items.equipment.armor.armor.curr_absorb=Dit _klasse-%1$d_ harnas blokkeert _%2$d-%3$d schade_ en vereist _%4$d kracht_ om goed gebruikt te worden.
items.equipment.armor.armor.avg_absorb=Normaal gesproken blokkeert dit _klasse-%1$d_ harnas _%2$d-%3$d schade_ en vereist _%4$d kracht_ om goed gebruikt te worden.
items.equipment.armor.armor.too_heavy=Omdat je niet genoeg kracht hebt om dit harnas te dragen, kun je minder makkelijk bewegen, ontwijken en verdedigen.
items.equipment.armor.armor.probably_too_heavy=Waarschijnlijk is dit harnas te zwaar voor je.
items.equipment.armor.armor.excess_str=Omdat je zo sterk bent, kun je aanvallen _beter ontwijken_ als je dit harnas draagt.
items.equipment.armor.armor.evasion=Het is aangepast om het _ontwijken_ te verbeteren.
items.equipment.armor.armor.defense=Het is aangepast om je _verdediging_ te verbeteren.
items.equipment.armor.armor.inscribed=het is beschreven met een _%s._
items.equipment.armor.armor.glyph_hardened=Het is _verhard._
items.equipment.armor.armor.hardened_no_glyph=Dit harnas is _verhard,_ maar is momenteel niet voorzien van een symbool.
items.equipment.armor.armor.cursed_worn=Omdat dit harnas vervloekt is ben je machteloos om het te uit te trekken.
items.equipment.armor.armor.cursed=Je voelt een kwaadaardige magie in dit harnas schuilen.
items.equipment.armor.armor.weak_cursed=Ondanks de vloek ben je in staat om dit harnas uit te trekken.
items.equipment.armor.armor.not_cursed=Dit harnas is vrij van kwaadaardige magie.
items.equipment.armor.armor.seal_attached=Het gebroken zegel van de Krijger is aan dit harnas vastgemaakt, Wanneer zijn gezondheid onder de helft dreigt te dalen, zal het hem _%d bescherming_ geven.
items.equipment.armor.armor.seal_transfer=Het gebroken zegel van de Krijger moet worden bevestigd aan zijn momenteel gedragen pantser om hem te helpen. Wil je het zegel automatisch losmaken van het pantser dat je verwijdert en bevestigen aan het pantser dat je aan het uitrusten bent?
items.equipment.armor.armor.seal_transfer_yes=ja
items.equipment.armor.armor.seal_transfer_no=nee
items.equipment.armor.armor$glyph.glyph=symbool
items.equipment.armor.armor$glyph.killed=%s doodde je...
items.equipment.armor.armor$glyph.rankings_desc=Gedood door een magisch symbool
items.equipment.armor.armor$glyph.discover_hint=Je kunt een item met dit effect zomaar in de kerker vinden, of probeer het zelf op een item toe te passen.

items.equipment.armor.classarmor.ac_ability=KIES SPECIALE KRACHT
items.equipment.armor.classarmor.ac_transfer=OVERDRAGEN
items.equipment.armor.classarmor.no_ability=Je harnas heeft momenteel geen speciale kracht, je moet er één kiezen!
items.equipment.armor.classarmor.not_equipped=Je moet dit harnas dragen om zijn speciale kracht te gebruiken!
items.equipment.armor.classarmor.low_charge=Dit harnas is niet genoeg opgeladen om zijn speciale kracht te gebruiken.
items.equipment.armor.classarmor.charge_use=Als je de speciale kracht nu gebruikt kost dit _%s_ lading.
items.equipment.armor.classarmor.transfer_title=Harnas Overdragen
items.equipment.armor.classarmor.transfer_desc=De magie van de kroon van de dwergenkoning kan worden overgebracht naar een ander harnas. Merk op dat het originele harnas tijdens het proces wordt vernietigd.
items.equipment.armor.classarmor.transfer_prompt=Kies een Harnas
items.equipment.armor.classarmor.transfer_cancel=Annuleren
items.equipment.armor.classarmor.transfer_complete=De eigenschappen van je heroïsche harnas zijn overgedragen!
items.equipment.armor.classarmor.discover_hint=Dit voorwerp vind je nadat je de baas op verdieping 20 met een specifieke held hebt verslagen.

items.equipment.armor.clericarmor.name=heldenparament
items.equipment.armor.clericarmor.desc=Terwijl de Geestelijke dit mengsel van stof en plaat draagt, kan hij een speciale vaardigheid uitoefenen.

items.equipment.armor.clotharmor.name=stoffen kleding
items.equipment.armor.clotharmor.desc=Dit lichte harnas biedt basisbescherming.
items.equipment.armor.clotharmor.discover_hint=Een van de helden begint met dit voorwerp.

items.equipment.armor.duelistarmor.name=heldenborstplaat
items.equipment.armor.duelistarmor.desc=Tijdens het dragen van dit plaatharnas en deze cape, kan de Duellist een speciale vaardigheid uitvoeren.

items.equipment.armor.huntressarmor.name=heldenmantel
items.equipment.armor.huntressarmor.no_enemies=Geen vijanden in zicht
items.equipment.armor.huntressarmor.desc=Tijdens het dragen van deze mantel kan de Jaagster een speciale vaardigheid uitvoeren.

items.equipment.armor.leatherarmor.name=leren harnas
items.equipment.armor.leatherarmor.desc=Harnas gemaakt van gelooide monsterhuid. Het is niet zo licht als stoffen kleding, maar het geeft meer bescherming.

items.equipment.armor.magearmor.name=heldengewaad
items.equipment.armor.magearmor.desc=Als hij dit prachtige gewaad draagt, kan de Magiër een speciale vaardigheid uitvoeren.

items.equipment.armor.mailarmor.name=maliënkolder
items.equipment.armor.mailarmor.desc=In elkaar grijpende metalen schakels zorgen voor een stevig maar flexibel harnas.

items.equipment.armor.platearmor.name=plaatharnas
items.equipment.armor.platearmor.desc=Enorme platen van metaal zijn vastgemaakt tot een harnas dat ongeëvenaarde bescherming biedt aan elke avonturier die sterk genoeg is om zijn duizelingwekkende gewicht te dragen.

items.equipment.armor.roguearmor.name=heldenkleding
items.equipment.armor.roguearmor.desc=Terwijl hij deze donkere kleding draagt, kan de Schurk een speciale vaardigheid uitvoeren.

items.equipment.armor.scalearmor.name=geschaald harnas
items.equipment.armor.scalearmor.desc=De metalen plaatjes die op een leren vest zijn genaaid, maken een flexibel, maar beschermend harnas.

items.equipment.armor.warriorarmor.name=heldenplaatpantser
items.equipment.armor.warriorarmor.desc=Terwijl hij dit zware platenharnas draagt, kan de Krijger een speciale vaardigheid uitvoeren.



###artifacts
items.equipment.artifacts.alchemiststoolkit.name=gereedschapsset van de alchemist
items.equipment.artifacts.alchemiststoolkit.ac_brew=BROUW
items.equipment.artifacts.alchemiststoolkit.ac_energize=BEKRACHTIG
items.equipment.artifacts.alchemiststoolkit.not_ready=Je gereedschapsset is nog niet klaar met opwarmen.
items.equipment.artifacts.alchemiststoolkit.cursed=Je vervloekte gereedschapsset houdt tegen dat je alchemie gebruikt!
items.equipment.artifacts.alchemiststoolkit.need_energy=Daar heb je minimaal 6 energie voor nodig.
items.equipment.artifacts.alchemiststoolkit.energize_desc=Elke 6 energiekristallen geven de gereedschapsset voldoende energie om een volgend niveau te bereiken, waardoor de snelheid van het genereren van energie en het opwarmen van de gereedsschapsset toeneemt.\n\nHoeveel energie wil je gebruiken?
items.equipment.artifacts.alchemiststoolkit.energize_1=6 energie: +1 niveau
items.equipment.artifacts.alchemiststoolkit.energize_all=%1$d energie: +%2$d niveaus
items.equipment.artifacts.alchemiststoolkit.desc=Deze gereedschapsset bevat een aantal reactiestoffen en kruiden samen met een kleine mengflacon, waardoor het toepassen van alchemie overal mogelijk is. Het flesje bevat iets wat lijkt op alchemistische energiekristallen in vloeibare vorm.
items.equipment.artifacts.alchemiststoolkit.desc_cursed=De vervloekte gereedschapsset heeft zich aan jou gebonden, en weerhoudt je ervan om alchemie toe te passen.
items.equipment.artifacts.alchemiststoolkit.desc_warming=De gereedschapsset is momenteel aan het opwarmen en is na een tijdje klaar voor gebruik.
items.equipment.artifacts.alchemiststoolkit.desc_hint=De gehanteerde gereedschapsset genereert langzaam alchemistische energie terwijl je ervaring opdoet. Het lijkt erop dat het mengsel in de mengflacon verbeterd kan worden door er energiekristallen aan toe te voegen.

items.equipment.artifacts.artifact.cannot_wear_two=Je kan niet twee dezelfde artefacten dragen.
items.equipment.artifacts.artifact.equip_cursed=Het artefact bindt zich pijnlijk aan je vast.
items.equipment.artifacts.artifact.curse_known=Je voelt dat er kwaadaardige magie in dit artefact schuilt.
items.equipment.artifacts.artifact.not_cursed=Dit artefact is vrij van kwaadaardige energie.
items.equipment.artifacts.artifact.need_to_equip=Je moet je artefact hanteren om dat te doen.

items.equipment.artifacts.capeofthorns.name=mantel van doornen
items.equipment.artifacts.capeofthorns.desc=Deze in elkaar geschoven metalen platen van de DM-300 hebben samen een stevige mantel gevormd. Het lijkt een diepe energie op te slaan, misschien heeft het iets van de kracht van de DM-300?
items.equipment.artifacts.capeofthorns.desc_inactive=De mantel voelt geruststellend zwaar op je schouders, hij lijkt energie te krijgen van de schade die je oploopt.
items.equipment.artifacts.capeofthorns.desc_active=De mantel lijkt opgeslagen energie vrij te geven, hij straalt een beschermende kracht uit.
items.equipment.artifacts.capeofthorns$thorns.inert=Je mantel wordt weer inactief.
items.equipment.artifacts.capeofthorns$thorns.radiating=Je mantel begint energie uit te stralen, je voelt je beschermd!
items.equipment.artifacts.capeofthorns$thorns.levelup=Je mantel wordt sterker!
items.equipment.artifacts.capeofthorns$thorns.name=doornen
items.equipment.artifacts.capeofthorns$thorns.desc=Je mantel straalt energie uit en omringt je in een veld van beschermende kracht!\n\nAlle schade die je ontvangt wordt verminderd terwijl het doorneneffect actief is. Bovendien, als de aanvaller naast je staat, wordt de verminderde schade teruggestuurd naar de aanvaller.\n\nResterende beurten doornenmantel: %s.

items.equipment.artifacts.chaliceofblood.name=kelk van bloed
items.equipment.artifacts.chaliceofblood.ac_prick=PRIK
items.equipment.artifacts.chaliceofblood.yes=Ja, ik weet wat ik doe
items.equipment.artifacts.chaliceofblood.no=Nee, ik heb me bedacht
items.equipment.artifacts.chaliceofblood.prick_warn=Elke keer dat je de kelk gebruikt, zal deze meer levensenergie verbruiken, maar in ruil daarvoor zal je natuurlijke gezondheidsregeneratie verder toenemen.\n\nJezelf prikken zal momenteel _%1$dü%2$dschade_ aanrichten, hoewel deze schade kan worden verminderd door _zowel fysieke als magische blokkering of schadevermindering._ Zonder rekening te houden met de effecten van schadevermindering, bestaat er een _%3$s%%kans_ dat je levensenergie volledig wordt verbruikt als je jezelf prikt.\n\nWeet je zeker dat je de kelk meer levensenergie wilt geven?
items.equipment.artifacts.chaliceofblood.onprick=Je prikt jezelf, en je levensessentie loopt weg in de kelk.
items.equipment.artifacts.chaliceofblood.ondeath=De Kelk zuigt je levensessentie compleet op...
items.equipment.artifacts.chaliceofblood.desc=Deze glanzende zilveren kelk is vreemd versierd met scherpe edelstenen aan de rand.
items.equipment.artifacts.chaliceofblood.desc_cursed=Deze vervloekte kelk is vergroeid met je hand en hindert je vermogen om vanzelf gezond te worden.
items.equipment.artifacts.chaliceofblood.desc_1=Terwijl je de kelk vasthoudt, voel je je vreemd genoeg gedwongen om jezelf aan de scherpe edelstenen te prikken.
items.equipment.artifacts.chaliceofblood.desc_2=Een deel van je bloed verzamelt zich in de kelk, je voelt subtiel hoe de kelk je voedt met levensenergie, wat je natuurlijke gezondheidsherstel bevordert. Je wilt jezelf nog steeds aan de kelk snijden, ook al weet je dat het pijn zal doen.
items.equipment.artifacts.chaliceofblood.desc_3=De kelk is tot de rand gevuld met je levensessentie. Je kunt voelen dat de kelk de levensenergie in je laat terugstromen.

items.equipment.artifacts.cloakofshadows.name=schaduwmantel
items.equipment.artifacts.cloakofshadows.ac_stealth=SLUIP
items.equipment.artifacts.cloakofshadows.cooldown=Je mantel heeft %d beurten nodig om nieuwe energie op te doen.
items.equipment.artifacts.cloakofshadows.cursed=Je kunt geen vervloekte mantel gebruiken.
items.equipment.artifacts.cloakofshadows.no_charge=Je mantel is nog niet voldoende opgeladen om bruikbaar te zijn.
items.equipment.artifacts.cloakofshadows.desc=Een onschatbare magische mantel, vele jaren geleden gestolen uit het koninklijk arsenaal door de Schurk. Tijdens het dragen wordt de drager voor een korte tijd volledig onzichtbaar.\n\nHoe meer de mantel wordt gebruikt, hoe sterker deze wordt, waardoor de Schurk vaker en voor langere tijd onzichtbaar wordt.
items.equipment.artifacts.cloakofshadows.discover_hint=Een van de helden begint met dit voorwerp.
items.equipment.artifacts.cloakofshadows$cloakstealth.no_charge=Je mantel heeft geen energie meer.
items.equipment.artifacts.cloakofshadows$cloakstealth.levelup=Je mantel wordt sterker!
items.equipment.artifacts.cloakofshadows$cloakstealth.name=verhuld
items.equipment.artifacts.cloakofshadows$cloakstealth.desc=Je schaduwmantel verleent je onzichtbaarheid terwijl je erdoor gehuld bent. Je blijft verhuld totdat je het zelf opheft of totdat je mantel geen lading meer heeft.\n\nTerwijl je onzichtbaar bent kunnen vijanden je niet aanvallen of volgen. Fysieke aanvallen en magische effecten (zoals rollen en toverstokken) zullen de onzichtbaarheid onmiddellijk opheffen.\n\nBeurten tot de lading van de mantel leeg is: %d

items.equipment.artifacts.driedrose.name=gedroogde roos
items.equipment.artifacts.driedrose.ac_summon=ROEP OP
items.equipment.artifacts.driedrose.ac_direct=STUUR AAN
items.equipment.artifacts.driedrose.ac_outfit=RUST UIT
items.equipment.artifacts.driedrose.spawned=Je hebt de geest al opgeroepen.
items.equipment.artifacts.driedrose.no_charge=Je roos is nog niet volledig opgeladen.
items.equipment.artifacts.driedrose.cursed=Je kunt geen vervloekte roos gebruiken.
items.equipment.artifacts.driedrose.no_space=Er is geen vrije plaats naast jou.
items.equipment.artifacts.driedrose.charged=Je roos is volledig opgeladen!
items.equipment.artifacts.driedrose.desc=Is dit de roos die de geest noemde voordat hij verdween? Het lijkt spirituele kracht te bevatten, misschien kan het worden gebruikt om de energie van die verloren krijger te kanaliseren.
items.equipment.artifacts.driedrose.desc_no_quest=Een gedroogde, verouderde roos die ondanks zijn leeftijd nog steeds bij elkaar blijft.\n\nHet lijkt een spirituele kracht te hebben, maar je hebt geen idee hoe je het nu moet gebruiken.
items.equipment.artifacts.driedrose.desc_hint=Het lijkt erop dat er enkele bloembladen ontbreken. Misschien versterkt het opnieuw bevestigen van de bladen de roos.
items.equipment.artifacts.driedrose.desc_cursed=De vervloekte roos is aan je hand gebonden, het voelt akelig koud aan.
items.equipment.artifacts.driedrose.desc_weapon=Geest's wapen: %s
items.equipment.artifacts.driedrose.desc_armor=Geest's harnas:  %s
items.equipment.artifacts.driedrose.desc_strength=Geest's kracht: %s
items.equipment.artifacts.driedrose$petal.name=gedroogd bloemblad
items.equipment.artifacts.driedrose$petal.no_rose=Je hebt geen roos om dit bloemblad aan toe te voegen.
items.equipment.artifacts.driedrose$petal.no_room=Er is geen ruimte meer voor dit bloemblad, dus je gooit het weg.
items.equipment.artifacts.driedrose$petal.maxlevel=De roos is compleet!
items.equipment.artifacts.driedrose$petal.levelup=Je voegt het bloemblad toe aan de roos.
items.equipment.artifacts.driedrose$petal.desc=Een zwak opgedroogd bloemblad, dat het op de een of andere manier zo diep in de kerker heeft overleefd.
items.equipment.artifacts.driedrose$wndghosthero.title=Uitrusting van de Geest
items.equipment.artifacts.driedrose$wndghosthero.desc=De geest is op zichzelf zwak, maar hun vorm is stevig genoeg om te worden uitgerust met een wapen en harnas. Zij kunnen deze voorwerpen net als jij gebruiken.\n\nDe geest kan momenteel voorwerpen hanteren die tot _%d sterkte nodig hebben._
items.equipment.artifacts.driedrose$wndghosthero.weapon_prompt=Kies een wapen
items.equipment.artifacts.driedrose$wndghosthero.armor_prompt=Kies een harnas
