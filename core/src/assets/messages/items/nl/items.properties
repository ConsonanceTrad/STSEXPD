items.equipment.weapon.melee.glaive.ability_desc=De Duellist kan de punt van een lans gebruiken om een vijand te _spiezen_ die binnen bereik maar niet aangrenzend is. Dit richt _%1$d-%2$d schade_ aan, duwt de vijand terug en raakt gegarandeerd.
items.equipment.weapon.melee.glaive.desc=Een enorm paalwapen bestaande uit een zwaardblad aan het uiteinde van een paal.

