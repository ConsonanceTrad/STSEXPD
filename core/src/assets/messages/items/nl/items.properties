items.equipment.weapon.melee.gauntlet.ability_desc=De Duellist kan een _combo strike_ uitvoeren met een stenen handschoen. Deze aanval zal gegarandeerd raken en veroorzaakt _+%d schade_ voor elke keer dat de Duellist een aanval uitvoert met een gewone slag- of geworpen wapenaanval. Als de Duellist gedurende 5 beurten (15 na een kill) niet raakt, wordt deze combo gereset.
items.equipment.weapon.melee.gauntlet.desc=Deze enorme handschoen is gemaakt van karmozijnrode stof met daarop een zware magische steen. De stof trekt strak om je heen, waardoor de dikke stenen platen bijna een tweede huid zijn. Slaan met zo'n zwaar wapen vereist kracht, maar voegt een enorm gewicht toe aan je slagen.

