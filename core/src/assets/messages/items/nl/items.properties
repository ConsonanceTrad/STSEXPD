items.equipment.artifacts.etherealchains.name=etherische kettingen
items.equipment.artifacts.etherealchains.ac_cast=WERP UIT
items.equipment.artifacts.etherealchains.rooted=Je kettingen kunnen je niet trekken terwijl je geworteld bent.
items.equipment.artifacts.etherealchains.no_charge=Je kettingen zijn niet genoeg opgeladen.
items.equipment.artifacts.etherealchains.cursed=Je kunt geen vervloekte kettingen gebruiken.
items.equipment.artifacts.etherealchains.does_nothing=Dat haalt niets uit.
items.equipment.artifacts.etherealchains.cant_pull=Je kettingen kunnen dat doel niet trekken.
items.equipment.artifacts.etherealchains.cant_reach=Je kettingen kunnen daar niet komen.
items.equipment.artifacts.etherealchains.inside_wall=Je kettingen kunnen je alleen door muren trekken, niet erin.
items.equipment.artifacts.etherealchains.nothing_to_grab=Er valt daar niets te pakken.
items.equipment.artifacts.etherealchains.prompt=Kies een plek als doelwit.
items.equipment.artifacts.etherealchains.desc=Deze grote maar lichtgewicht kettingen gloeien van spirituele energie. Ze kunnen worden gebruikt om je naar terrein te trekken, of om vijanden naar je toe te trekken. Door de etherische aard van de kettingen kunnen ze zelfs door muren heen gaan!
items.equipment.artifacts.etherealchains.desc_cursed=De vervloekte kettingen zijn aan je zijde vastgeklonken. Ze zwaaien constant rond, proberen je te laten struikelen of je vast te binden.
items.equipment.artifacts.etherealchains.desc_equipped=De ketting rust rond je heup, en hevelt langzaam de spirituele energie over van degene die je verslaat. Elke lading is één schakel in de ketting, die zich er precies één tegel mee uitstrekt.
items.equipment.artifacts.etherealchains$chainsrecharge.levelup=Je kettingen worden sterker!

items.equipment.artifacts.holytome.name=heilig boek
items.equipment.artifacts.holytome.ac_cast=SPREEK UIT
items.equipment.artifacts.holytome.no_spell=Je kunt die spreuk nu niet uitspreken.
items.equipment.artifacts.holytome.cursed=Je kunt geen vervloekt boek gebruiken.
items.equipment.artifacts.holytome.levelup=Je boek wordt sterker!
items.equipment.artifacts.holytome.desc=Een heilig boek dat fungeert als focus voor de goddelijke magie van de Geestelijke. Door het boek te gebruiken, kan de Geestelijke verschillende magische spreuken uitspreken.\n\nHet boek zal gestaag krachtiger worden naarmate de Geestelijke het gebruikt, waardoor de Geestelijke meer maximale ladingen krijgt en de oplaadsnelheid iets toeneemt.
items.equipment.artifacts.holytome.discover_hint=Een van de helden begint met dit voorwerp.

items.equipment.artifacts.hornofplenty.name=Hoorn van overvloed
items.equipment.artifacts.hornofplenty.ac_snack=SNACK
items.equipment.artifacts.hornofplenty.ac_eat=EET
items.equipment.artifacts.hornofplenty.ac_store=SLA OP
items.equipment.artifacts.hornofplenty.eat=Je eet uit de hoorn.
items.equipment.artifacts.hornofplenty.prompt=Kies wat eten
items.equipment.artifacts.hornofplenty.no_food=Je hoorn bevat geen voedsel om te eten!
items.equipment.artifacts.hornofplenty.full=Je hoorn zit vol met eten!
items.equipment.artifacts.hornofplenty.reject=Je hoorn wijst het ongekookte flauwfruit af.
items.equipment.artifacts.hornofplenty.maxlevel=Je hoorn kan niet meer voedsel verorberen!
items.equipment.artifacts.hornofplenty.levelup=De hoorn verorbert je voedseloffer en groeit in kracht!
items.equipment.artifacts.hornofplenty.feed=De hoorn verorbert je voedseloffer.
items.equipment.artifacts.hornofplenty.desc=In deze hoorn kan niet worden geblazen, maar in plaats daarvan lijkt het zich te vullen met voedsel terwijl je op avontuur gaat en ervaring opdoet. Je kunt een deel van de inhoud consumeren als snack, of eten tot je vol zit.
items.equipment.artifacts.hornofplenty.desc_hint=Misschien is er een manier om de kracht van de hoorn te vergroten door hem voedselenergie te geven.
items.equipment.artifacts.hornofplenty.desc_cursed=De vervloekte hoorn heeft zich aan je zijde gebonden, het lijkt liever voedsel op te nemen dan het te produceren.

items.equipment.artifacts.lloydsbeacon.name=lloyd's baken
items.equipment.artifacts.lloydsbeacon.ac_set=STEL IN
items.equipment.artifacts.lloydsbeacon.ac_return=KEER TERUG
items.equipment.artifacts.lloydsbeacon.preventing=De sterke magische uitstraling van deze plek verhindert dat je het lloyd's baken gebruikt!
items.equipment.artifacts.lloydsbeacon.creatures=Het paranormale aura van naburige wezens verhindert je op dit moment om het lloyd's baken te gebruiken.
items.equipment.artifacts.lloydsbeacon.return=Het lloyd's baken is met succes ingesteld op je huidige plek, nu kun je hier op elk moment terugkeren.
items.equipment.artifacts.lloydsbeacon.desc_set=Dit baken was ergens ingesteld op verdieping %d van de kerker.

items.equipment.artifacts.masterthievesarmband.name=armband van de meesterdief
items.equipment.artifacts.masterthievesarmband.ac_steal=STEEL
items.equipment.artifacts.masterthievesarmband.no_charge=Je armband is niet voldoende opgeladen.
items.equipment.artifacts.masterthievesarmband.cursed=Je kunt geen vervloekte armband gebruiken.
items.equipment.artifacts.masterthievesarmband.full=Je armband is volledig opgeladen!
items.equipment.artifacts.masterthievesarmband.prompt=Kies een vijand om op te richten
items.equipment.artifacts.masterthievesarmband.no_target=Je moet je richten op een vijand die naast je staat.
items.equipment.artifacts.masterthievesarmband.steal_shopkeeper=Je kunt niet rechtstreeks van winkeliers stelen.
items.equipment.artifacts.masterthievesarmband.no_steal=Die vijand heeft niets te stelen.
items.equipment.artifacts.masterthievesarmband.stole_item=Je hebt een voorwerp gestolen: %s.
items.equipment.artifacts.masterthievesarmband.failed_steal=Het is je niet gelukt om iets te stelen.
items.equipment.artifacts.masterthievesarmband.level_up=Je armband wordt sterker!
items.equipment.artifacts.masterthievesarmband.desc=Deze paarsfluwelen armband draagt het merkteken van een meesterdief. Dit is niet jouw bezit, maar het behoorde waarschijnlijk ook niet toe aan de laatste gebruiker.
items.equipment.artifacts.masterthievesarmband.desc_cursed=De vervloekte armband is aan je pols gebonden en op de een of andere manier lijkt je buidel met goud langzaam lichter te worden...
items.equipment.artifacts.masterthievesarmband.desc_worn=Je voelt kracht opbouwen in de armband om je pols terwijl je ervaring opdoet. Je kunt deze kracht gebruiken om uit winkels te stelen of om vijanden te beroven!\n\nHet beroven van vijanden gebeurt onmiddellijk, desoriënteert ze even en geeft je de kans om de buit te pakken die ze hebben! Deze kracht is effectiever tegen onbewuste vijanden. Het meerdere keren beroven van dezelfde vijand geeft niet meer kans op buit.

items.equipment.artifacts.sandalsofnature.name=sandalen van de natuur
items.equipment.artifacts.sandalsofnature.name_1=schoenen van de natuur
items.equipment.artifacts.sandalsofnature.name_2=laarzen van de natuur
items.equipment.artifacts.sandalsofnature.name_3=scheenplaten van de natuur
items.equipment.artifacts.sandalsofnature.ac_feed=VOED
items.equipment.artifacts.sandalsofnature.ac_root=VERWORTEL
items.equipment.artifacts.sandalsofnature.prompt=Kies een zaad
items.equipment.artifacts.sandalsofnature.levelup=Je schoenen worden groter!
items.equipment.artifacts.sandalsofnature.absorb_seed=Het schoeisel absorbeert het zaad, ze lijken er gezonder van te worden.
items.equipment.artifacts.sandalsofnature.no_effect=Je moet eerst een zaadje aan je schoeisel voeren.
items.equipment.artifacts.sandalsofnature.low_charge=Daar heeft je schoeisel niet genoeg energie voor.
items.equipment.artifacts.sandalsofnature.prompt_target=Kies een plek
items.equipment.artifacts.sandalsofnature.out_of_range=Die plek is buiten bereik.
items.equipment.artifacts.sandalsofnature.desc_1=Wat in eerste instantie leek op sandalen gemaakt van touw, zijn eigenlijk twee planten! Ze lijken erg zwak en bleek, misschien moeten ze voedingsstoffen krijgen?
items.equipment.artifacts.sandalsofnature.desc_2=Het schoeisel is gegroeid en lijkt nu meer op twee op maat gemaakte schoenen. Er is weer wat kleur in ze teruggekeerd, misschien kunnen ze nog verder groeien?
items.equipment.artifacts.sandalsofnature.desc_3=De planten zijn weer gegroeid en lijken nu op een paar stevige laarzen gemaakt van schors. De planten lijken weer op krachten te zijn gekomen, maar misschien kunnen ze nog verder groeien?
items.equipment.artifacts.sandalsofnature.desc_4=De planten lijken hun maximale grootte te hebben bereikt, ze lijken op een paar gepantserde scheenplaten. De scheenplaten zijn diepbruin en lijken op een zeer stevige boom.
items.equipment.artifacts.sandalsofnature.desc_hint=Je voelt je meer verbonden met de natuur tijdens het dragen van dit artefact.
items.equipment.artifacts.sandalsofnature.desc_cursed=De vervloekte sandalen blokkeren elke afstemming op de natuur.
items.equipment.artifacts.sandalsofnature.desc_ability=Het schoeisel heeft de kleur van het laatste zaadje dat je ze hebt gegeven. Ze kunnen kort in de grond wortelen en het effect van die plant in een straal van 3 tegels produceren.\nZaadje: _%s_\nLading nodig: _%d%%_
items.equipment.artifacts.sandalsofnature.desc_seeds=Je hebt het schoeisel %d zaden gevoed.

items.equipment.artifacts.skeletonkey.name=skelettensleutel
items.equipment.artifacts.skeletonkey.ac_insert=INVOEGEN
items.equipment.artifacts.skeletonkey.cursed=Je kunt geen vervloekte loper gebruiken.
items.equipment.artifacts.skeletonkey.prompt=Kies een doel
items.equipment.artifacts.skeletonkey.invalid_target=Er valt daar niets te vergrendelen of ontgrendelen.
items.equipment.artifacts.skeletonkey.lock_no_space=Je kunt een personage niet in een deur opsluiten!
items.equipment.artifacts.skeletonkey.iron_charges=Voor het openen van een normaal slot is 1 lading nodig.
items.equipment.artifacts.skeletonkey.gold_charges=Om een gouden slot te openen heb je 2 ladingen nodig.
items.equipment.artifacts.skeletonkey.lock_charges=Om een deur op slot te doen zijn 2 ladingen nodig.
items.equipment.artifacts.skeletonkey.wall_charges=Voor het maken van een tijdelijke muur zijn 2 ladingen nodig.
items.equipment.artifacts.skeletonkey.crystal_charges=Om een kristallen slot te openen heb je 5 ladingen nodig.
items.equipment.artifacts.skeletonkey.wont_open=Om één of andere reden past de sleutel niet in het slot.
items.equipment.artifacts.skeletonkey.locked_with_key=Die deur werd met jouw loper op slot gedaan.
items.equipment.artifacts.skeletonkey.force_lock=Het slot is zonder je loper kapot gegaan. Je krijgt het open met geweld.
items.equipment.artifacts.skeletonkey.discard=Je gooit je overtollige sleutels weg.
items.equipment.artifacts.skeletonkey.levelup=Je loper wordt sterker!
items.equipment.artifacts.skeletonkey.desc=Een belangrijke sleutel met een kop in de vorm van een schedel. De tanden lijken elke keer anders als je ernaar kijkt.
items.equipment.artifacts.skeletonkey.desc_worn=Deze magische sleutel lijkt aan kracht te winnen naarmate je hem gebruikt in plaats van de gewone sleutels van de kerker. Hij kan in bijna alle sloten van de kerker worden gestoken om ze te openen of te sluiten, inclusief deuren die voorheen nooit op slot zaten.\n\nDe sleutel kan zelfs op een lege ruimte in alle windrichtingen of diagonale richting worden gebruikt om de lucht voor je te 'vergrendelen', waardoor een massieve muur van 3 tegels breed ontstaat die 10 beurten meegaat. Door de sleutel te vergrendelen, worden vijanden weggeduwd als er ruimte is.
items.equipment.artifacts.skeletonkey.desc_cursed=Het lijkt erop dat de vervloekte sleutel er actief alles aan doet om niet in een slot te passen. Hij zorgt er zelfs voor dat het moeilijk (maar niet onmogelijk) is om je andere sleutels te gebruiken.
items.equipment.artifacts.skeletonkey$keywall.desc=Op deze plek is door de loper een tijdelijke magische muur geplaatst.

items.equipment.artifacts.talismanofforesight.name=talisman van vooruitziende blik
items.equipment.artifacts.talismanofforesight.ac_scry=Kristalkijken
items.equipment.artifacts.talismanofforesight.low_charge=De talisman heeft minimaal 5% lading nodig om kristal te kijken.
items.equipment.artifacts.talismanofforesight.prompt=Kies een plek om een blik te werpen.
items.equipment.artifacts.talismanofforesight.levelup=Je Talisman wordt sterker!
items.equipment.artifacts.talismanofforesight.full_charge=Je Talisman is volledig opgeladen!
items.equipment.artifacts.talismanofforesight.desc=Een gladde steen met vreemde gravures erop. Je hebt het gevoel dat het alles om je heen in de gaten houdt, met aandacht voor alles wat verborgen is.
items.equipment.artifacts.talismanofforesight.desc_worn=Als je de talisman vasthoudt, heb je het gevoel dat je zintuigen geprikkeld worden. De talisman bouwt langzaam lading op naarmate de tijd verstrijkt en wanneer je verborgen deuren of vallen ontdekt.\n\nDe talisman kan zijn lading gebruiken om 'kristal te kijken' in een kegelvorm, wat alle tegels en geheimen in het bekeken gebied onthult, en je voor een korte tijd geestzicht op vijanden en voorwerpen geeft.
items.equipment.artifacts.talismanofforesight.desc_cursed=De vervloekte talisman staart je aandachtig aan en verdooft je zintuigen.
items.equipment.artifacts.talismanofforesight$foresight.name=vooruitziendheid
items.equipment.artifacts.talismanofforesight$foresight.uneasy=Je voelt je ongemakkelijk.
items.equipment.artifacts.talismanofforesight$foresight.desc=Je voelt je erg nerveus, alsof er dichtbij ongezien gevaar is.

items.equipment.artifacts.timekeepershourglass.name=zandloper van de tijdwaarnemer
items.equipment.artifacts.timekeepershourglass.ac_activate=ACTIVEER
items.equipment.artifacts.timekeepershourglass.deactivate=Je deactiveert de tijdbevriezing.
items.equipment.artifacts.timekeepershourglass.no_charge=Je zandloper is nog niet voldoende opgeladen om te kunnen gebruiken.
items.equipment.artifacts.timekeepershourglass.cursed=Je kunt geen vervloekte zandloper gebruiken.
items.equipment.artifacts.timekeepershourglass.onstasis=De wereld lijkt in een oogwenk om je heen te verschuiven.
items.equipment.artifacts.timekeepershourglass.onfreeze=Alles om je heen bevriest ineens.
items.equipment.artifacts.timekeepershourglass.stasis=Breng mezelf tot stilstand
items.equipment.artifacts.timekeepershourglass.freeze=Bevries de tijd om mij heen
items.equipment.artifacts.timekeepershourglass.prompt=Hoe wil je de magie van de zandloper gebruiken?\n\nWanneer je tot stilstand komt, beweegt de tijd normaal terwijl je bevroren en volledig onkwetsbaar bent, dit verbruikt tot 2 ladingen tegelijk.\n\nWanneer de tijd is bevroren, kun je bewegen alsof je acties geen tijd kosten. Dit kan op elk moment worden gedeactiveerd door de zandloper te gebruiken of aan te vallen.
items.equipment.artifacts.timekeepershourglass.desc=Deze grote sierlijke zandloper ziet er vrij bescheiden uit, maar je voelt een grote kracht in zijn fijn gesneden houtwerk. Terwijl je de zandloper draait en het zand ziet weglopen, voel je de magie aan je trekken - het gebruik van deze magie geeft je zeker enige controle over de tijd.
items.equipment.artifacts.timekeepershourglass.desc_hint=De zandloper lijkt wat zand te hebben verloren, als je maar wat kon vinden...
items.equipment.artifacts.timekeepershourglass.desc_cursed=De vervloekte zandloper zit aan je zijde vast, je kunt voelen dat hij je stroom van tijd probeert te manipuleren.
items.equipment.artifacts.timekeepershourglass$timefreeze.name=Tijd Bevriezen
items.equipment.artifacts.timekeepershourglass$timefreeze.desc=De tijd is bevroren om je heen, waardoor je acties direct kunt uitvoeren. Het effect houdt aan totdat het wordt afgebroken of totdat je zandloper leeg raakt. Door aan te vallen of magie te gebruiken, wordt dit effect ook verbroken.\n\nBeurten tot de zandloper leeg is: %s
items.equipment.artifacts.timekeepershourglass$sandbag.name=zakje met magisch zand
items.equipment.artifacts.timekeepershourglass$sandbag.levelup=Je voegt het zand toe aan je zandloper.
items.equipment.artifacts.timekeepershourglass$sandbag.maxlevel=Je zandloper is gevuld met magisch zand!
items.equipment.artifacts.timekeepershourglass$sandbag.no_hourglass=Je hebt geen zandloper om dit zand in te plaatsen.
items.equipment.artifacts.timekeepershourglass$sandbag.desc=Dit kleine zakje fijn zand zou perfect moeten werken met je zandloper.\n\nHet lijkt vreemd dat de winkelier dit specifieke voorwerp precies heeft wanneer je het nodig hebt...

items.equipment.artifacts.unstablespellbook.name=onstabiel spreukenboek
items.equipment.artifacts.unstablespellbook.ac_read=LEES
items.equipment.artifacts.unstablespellbook.ac_add=VOEG TOE
items.equipment.artifacts.unstablespellbook.blinded=Je kunt niet uit het boek lezen als je blind bent.
items.equipment.artifacts.unstablespellbook.no_charge=Je spreukenboek heeft geen lading meer over.
items.equipment.artifacts.unstablespellbook.cursed=Je kunt niet lezen uit een vervloekt spreukenboek.
items.equipment.artifacts.unstablespellbook.prompt=Kies een rol
items.equipment.artifacts.unstablespellbook.infuse_scroll=Je brengt de energie van de rol over in het boek.
items.equipment.artifacts.unstablespellbook.unable_scroll=Je kunt deze rol niet aan het boek toevoegen.
items.equipment.artifacts.unstablespellbook.unknown_scroll=Je weet nog niet zeker wat voor rol dit is.
items.equipment.artifacts.unstablespellbook.desc=Dit spreukenboek verkeert in een verrassend goede staat gezien zijn leeftijd. Het bruist en knettert als je de pagina's omslaat, woelend van onstabiele energie. Als je uit dit boek leest, is het niet te zeggen welke spreuk je uitvoert.
items.equipment.artifacts.unstablespellbook.desc_cursed=Het vervloekte boek heeft zich aan jou gebonden, het belemmert je vermogen om de meeste rollen te gebruiken.
items.equipment.artifacts.unstablespellbook.desc_index=Het boek is incompleet. De inhoudsopgave wijst momenteel naar de volgende blanco pagina's:
items.equipment.artifacts.unstablespellbook.desc_empowered=De rollen die je aan het boek hebt toegevoegd, gloeien van kracht. Je kunt de exotische versie van de effecten van deze rol kiezen, tegen een meerprijs.
items.equipment.artifacts.unstablespellbook.read_empowered=De rol die je aan het spreukenboek hebt toegevoegd, bruist van energie. Je kunt de reguliere of exotische versie van het effect van deze rol kanaliseren.\n\nAls je de exotische variant kiest, kost dat 2 ladingen in plaats van 1.



###bags
items.equipment.bags.bag.name=rugzak
items.equipment.bags.bag.discover_hint=Je kunt dit voorwerp in een winkel kopen.

items.equipment.bags.potionbandolier.name=toverdrank patroontas
items.equipment.bags.potionbandolier.desc=Deze dikke patroontas past om je borst als een sjerp, hij heeft veel geïsoleerde banden om drankjesflesjes, je waterzak of flesjes vloeibaar metaal vast te houden.\n\nIn deze patroontas worden je drankjes beschermd tegen de kou.

items.equipment.bags.scrollholder.name=rolhouder
items.equipment.bags.scrollholder.desc=Deze buisvormige container ziet eruit alsof hij de gereedschappen en kaarten van een astronoom zou bevatten, maar je rollen passen er net zo goed in. Er zijn zelfs een paar zijvakken waar spreukkristallen, mysterieuze stiften en mysterieus hars mooi in passen.\n\nDe houder ziet er niet erg ontvlambaar uit, waardoor je rollen zijn beschermd tegen vuur.

items.equipment.bags.velvetpouch.name=fluwelen buidel
items.equipment.bags.velvetpouch.desc=In deze kleine fluwelen buidel kun je allerlei kleine voorwerpen bewaren, zoals zaden, runenstenen en een aantal alchemie-ingrediënten.
items.equipment.bags.velvetpouch.discover_hint=Een van de helden begint met dit voorwerp.

items.equipment.bags.magicalholster.name=magische holster
items.equipment.bags.magicalholster.desc=Deze slanke holster is gemaakt van een exotische dierenhuid en beschikt over krachtige magie waardoor er een enorme hoeveelheid afstandswapens in kan worden opgeborgen.\n\nJe grijpt eenvoudig in de tas en pakt altijd het voorwerp dat je zoekt.\n\nVanwege de magie van de holster laden toverstokken iets sneller op en gaan werpwapens er iets langer in mee.



###bombs
items.equipment.bombs.arcanebomb.name=mysterieuze bom
items.equipment.bombs.arcanebomb.desc=Deze bom is doordrenkt met mysterieuze eigenschappen. Hij zal ontploffen in een krachtige explosie die lijkt de opgepompte aanval van Smurrie, en _%1$d-%2$d magische schade_ toebrengen aan alles binnen 2 tegels.
items.equipment.bombs.arcanebomb.discover_hint=Je kunt dit voorwerp maken met behulp van alchemie.

items.equipment.bombs.bomb.name=bom
items.equipment.bombs.bomb.ac_lightthrow=STEEK AAN & GOOI
items.equipment.bombs.bomb.snuff_fuse=Je dooft snel de lont van de bom.
items.equipment.bombs.bomb.ondeath=De explosie heeft je gedood...
items.equipment.bombs.bomb.rankings_desc=Gedood door een explosie
items.equipment.bombs.bomb.desc=Een vrij zware zwarte buskruitbom. Een explosie van deze bom veroorzaakt _%1$d-%2$d schade_ aan alles wat ernaast ligt, en zal wat aangrenzend terrein of items vernietigen.
items.equipment.bombs.bomb.desc_fuse=Het lijkt erop dat de lont een paar beurten nodig heeft om op te branden als hij eenmaal is aangestoken.
items.equipment.bombs.bomb.desc_burning=De lont van de bom brandt op, blijf op afstand of doof hem!
items.equipment.bombs.bomb$doublebomb.name=twee bommen
items.equipment.bombs.bomb$doublebomb.desc=Een stapel van twee flinke buskruitbommen, zo te zien krijg je er één gratis!

items.equipment.bombs.firebomb.name=vuurbom
items.equipment.bombs.firebomb.desc=Deze bom is aangepast zodat hij in een groter gebied ontploft, _%1$d-%2$d schade_ aanricht en aanhoudende vlammen binnen 2 tegels verspreidt.
items.equipment.bombs.firebomb.discover_hint=Je kunt dit voorwerp maken met behulp van alchemie.

items.equipment.bombs.flashbangbomb.name=flitsbom
items.equipment.bombs.flashbangbomb.desc=Deze op maat gemaakte bom zal ontploffen in een explosie van licht, geluid en elektriciteit wanneer hij ontploft. Alles binnen 2 tegels zal _%1$d-%2$d schade_ oplopen van de explosie, nog eens 25%% schade door elektriciteit en 10 beurten verdoofd worden.
items.equipment.bombs.flashbangbomb.discover_hint=Je kunt dit voorwerp maken met behulp van alchemie.

items.equipment.bombs.frostbomb.name=vorstbom
items.equipment.bombs.frostbomb.desc=Deze bom is aangepast om in een groter gebied te ontploffen, waardoor er _%1$d-%2$d schade_ ontstaat en er een aanhoudende windvlaag van ijskoude lucht binnen 2 tegels ontstaat.
items.equipment.bombs.frostbomb.discover_hint=Je kunt dit voorwerp maken met behulp van alchemie.

items.equipment.bombs.holybomb.name=heilige bom
items.equipment.bombs.holybomb.desc=Deze bom is aangepast om te ontploffen met een flits van heilig licht in een groter gebied. Alles binnen 2 tegels zal _%1$d-%2$d schade_ oplopen van de explosie, en ondode of demonische vijanden zullen 50%% extra schade oplopen van het heilige licht.
items.equipment.bombs.holybomb.discover_hint=Je kunt dit voorwerp maken met behulp van alchemie.

items.equipment.bombs.noisemaker.name=lawaaimaker
items.equipment.bombs.noisemaker.desc=Deze op maat gemaakte bom maakt herhaaldelijk geluid als de lont op is. Wanneer iets de bom aanraakt, zal deze ontploffen en _%1$d-%2$d schade_ toebrengen aan alles binnen 2 tegels!
items.equipment.bombs.noisemaker.desc_burning=De lawaaimaker tikt weg, hij ontploft als er iets in de buurt komt!
items.equipment.bombs.noisemaker.discover_hint=Je kunt dit voorwerp maken met behulp van alchemie.

items.equipment.bombs.smokebomb.name=rookbom
items.equipment.bombs.smokebomb.desc=Deze bom is aangepast om een dikke gaswolk uit te spuwen en tegelijkertijd te exploderen. Hij zal _%1$d-%2$d schade_ aanrichten en verhullende mist verspreiden binnen 2 tegels.
items.equipment.bombs.smokebomb.discover_hint=Je kunt dit voorwerp maken met behulp van alchemie.

items.equipment.bombs.regrowthbomb.name=hergroeibom
items.equipment.bombs.regrowthbomb.desc=Deze op maat gemaakte bom zal overal binnen 3 tegels levengevende vloeistof spetteren in plaats van te exploderen. Het gebied dat door de explosie wordt geraakt, zal snel gras en planten laten groeien. Jijzelf en alle bondgenoten die door de explosie worden geraakt, zullen worden genezen alsof ze een genezend drankje hebben gedronken.
items.equipment.bombs.regrowthbomb.discover_hint=Je kunt dit voorwerp maken met behulp van alchemie.

items.equipment.bombs.shrapnelbomb.name=schervenbom
items.equipment.bombs.shrapnelbomb.desc=Deze bom is aangepast met stukjes metaal van de DM-300, die zullen fragmenteren en overal heen vliegen als hij ontploft, en _%1$d-%2$d schade_ aanrichten in een groot bereik rond de bom. Je kunt je beter ergens achter verschuilen als je het gebruikt...
items.equipment.bombs.shrapnelbomb.discover_hint=Je kunt dit voorwerp maken met behulp van alchemie.

items.equipment.bombs.woollybomb.name=wollige bom
items.equipment.bombs.woollybomb.desc=Deze op maat gemaakte bom zal een groot veld van magische schapen creëren na het exploderen. De explosie zal _%1$d-%2$d schade_ toebrengen aan alles binnen 2 tegels. De schapen zullen beweging blokkeren en heel lang blijven bestaan! De schapen zullen echter niet zo lang in de aanwezigheid van krachtige vijanden blijven, en kunnen handmatig eerder worden verdreven door interactie met hen.
items.equipment.bombs.woollybomb.discover_hint=Je kunt dit voorwerp maken met behulp van alchemie.

###food
items.consum.food.berry.name=kerkerbes
items.consum.food.berry.eat_msg=Die bes was lekker!
items.consum.food.berry.desc=Deze kleine bes werd gevonden door de Jaagster tussen de begroeiing van de kerker. Het kan snel worden gegeten, geeft een kleine hoeveelheid verzadiging en misschien bevat het een bruikbaar zaadje!
items.consum.food.berry.discover_hint=Je kunt dit item vinden door een specifiek heldentalent te gebruiken.

items.consum.food.blandfruit.name=flauwfruit
items.consum.food.blandfruit.cooked=gekookt flauwfruit
items.consum.food.blandfruit.sunfruit=zonnefruit
items.consum.food.blandfruit.rotfruit=rotfruit
items.consum.food.blandfruit.earthfruit=aardfruit
items.consum.food.blandfruit.blindfruit=blindfruit
items.consum.food.blandfruit.firefruit=vuurfruit
items.consum.food.blandfruit.icefruit=ijsfruit
items.consum.food.blandfruit.fadefruit=vaagfruit
items.consum.food.blandfruit.sorrowfruit=treurfruit
items.consum.food.blandfruit.stormfruit=stormfruit
items.consum.food.blandfruit.dreamfruit=magefruit
items.consum.food.blandfruit.starfruit=sterrenfruit
items.consum.food.blandfruit.swiftfruit=fluksfruit
items.consum.food.blandfruit.raw=Je durft het niet rauw te eten.
items.consum.food.blandfruit.desc=Het is nu zo droog en onbeduidend, dat het misschien zou verbeteren door het te stoven met een ander ingrediënt.
items.consum.food.blandfruit.desc_cooked=De vrucht is tijdens het koken in de ketel opgezwollen en heeft zelfs de eigenschappen van het zaad waarmee hij gekookt was geabsorbeerd. Het heeft het effect van de toverdrank waarmee het zaad overeenkwam.
items.consum.food.blandfruit.desc_eat=Het lijkt klaar om gegeten te worden!
items.consum.food.blandfruit.desc_throw=Het lijkt nogal vluchtig, misschien is het het beste om het te gooien.
items.consum.food.blandfruit$chunks.name=stukjes flauwfruit
items.consum.food.blandfruit$chunks.desc=Het flauwfruit is geëxplodeerd bij de impact en laat enkele brokken achter.\n\nOok al zijn ze een beetje vuil geworden, deze grote brokken gekookt flauwfruit lijken perfect eetbaar.

items.consum.food.chargrilledmeat.name=geflambeerd vlees
items.consum.food.chargrilledmeat.desc=Het ziet er uit als een fatsoenlijke steak.
items.consum.food.chargrilledmeat.discover_hint=Je kunt dit maken met een ander voedselproduct.

items.consum.food.food.name=voedselrantsoen
items.consum.food.food.ac_eat=EET
items.consum.food.food.eat_msg=Dat voedsel smaakte heerlijk!
items.consum.food.food.desc=Niets bijzonders: gedroogd vlees, wat koekjes - dat soort dingen.

items.consum.food.frozencarpaccio.name=bevroren carpaccio
items.consum.food.frozencarpaccio.invis=Je ziet je handen voor je ogen verdwijnen!
items.consum.food.frozencarpaccio.hard=Je voelt je huid harder worden!
items.consum.food.frozencarpaccio.refresh=Verfrissend!
items.consum.food.frozencarpaccio.better=Je voelt je beter!
items.consum.food.frozencarpaccio.desc=Het is een stuk bevroren rauw vlees. De enige manier om het te eten is door er dunne plakjes van te snijden. En op deze manier is het verrassend goed.
items.consum.food.frozencarpaccio.discover_hint=Je kunt dit maken met een ander voedselproduct.

items.consum.food.meatpie.name=vleestaart
items.consum.food.meatpie.eat_msg=Dat eten smaakte ongelooflijk!
items.consum.food.meatpie.desc=Een heerlijke taart gevuld met hartig vlees. Dit verzadigt je veel meer dan welke andere maaltijd ook.
items.consum.food.meatpie.discover_hint=Je kunt dit voorwerp maken met behulp van alchemie.

items.consum.food.mysterymeat.name=mysterieus vlees
items.consum.food.mysterymeat.eat_msg=Dat eten smaakte... vreemd.
items.consum.food.mysterymeat.hot=Ah, het is heet!!
items.consum.food.mysterymeat.legs=Je kan je benen niet meer voelen!
items.consum.food.mysterymeat.not_well=Je voelt je niet zo goed.
items.consum.food.mysterymeat.stuffed=Je zit vol.
items.consum.food.mysterymeat.desc=Eet op eigen risico!
items.consum.food.mysterymeat.discover_hint=Je kunt dit voorwerp krijgen doordat bepaalde vijanden het laten vallen.
items.consum.food.mysterymeat$placeholder.name=vlees

items.consum.food.phantommeat.name=spookvlees
items.consum.food.phantommeat.desc=Een grote, glinsterende, doorschijnende biefstuk, gesneden uit een spookpiranha. Dit magische vlees hoeft niet gekookt te worden en biedt naast een volledig verzadigingsgevoel een aantal defensieve voordelen. Wanneer het wordt gegeten, zal het onzichtbaarheid, schorshuid, enige genezing schenken en vele schadelijke effecten genezen.
items.consum.food.phantommeat.discover_hint=Je kunt dit voorwerp krijgen doordat bepaalde vijanden het laten vallen.

items.consum.food.pasty.name=pastei
items.consum.food.pasty.fish_name=gestoomde vis
items.consum.food.pasty.amulet_name=amulet van yendor?
items.consum.food.pasty.egg_name=Paasei
items.consum.food.pasty.rainbow_name=regenboog drankje
items.consum.food.pasty.shattered_name=groene cake
items.consum.food.pasty.pie_name=pompoentaart
items.consum.food.pasty.vanilla_name=blauwe cake
items.consum.food.pasty.cane_name=zuurstok
items.consum.food.pasty.sparkling_name=sprankelend drankje
items.consum.food.pasty.desc=Een authentieke pastei uit Cornish met een traditionele vulling van rundvlees en aardappel. Heerlijk!
items.consum.food.pasty.fish_desc=Een hele gestoomde vis, op magische wijze bewaard op een bedje van groen. Het is traditie om rond deze tijd van het jaar wat vis te bewaren voor later, zodat je wat restjes overhoudt in plaats van alles in één keer op te eten.\n\nGelukkig nieuw maanjaar!
items.consum.food.pasty.amulet_desc=Je hebt het eindelijk gevonden, het magische amulet van - wacht even, dit is gewoon een in folie verpakte chocolade die zo is gemaakt dat hij op het amulet lijkt! Het geeft je geen onbeperkte kracht, maar het zal je in ieder geval vullen en je een beetje artefactlading geven.\n\n1 April!
items.consum.food.pasty.egg_desc=Een geweldig groot chocolade-ei, verpakt in kleurrijke gele folie. Er is genoeg chocolade om je te vullen, en de suiker kan je artefacten een klein beetje extra lading geven.\n\nVrolijk Pasen!
items.consum.food.pasty.rainbow_desc=Dit kleurrijke drankje is een soort vloeibaar voedsel. Naast het stillen van je honger, bevat het ook een beetje magie die een aangrenzende niet-baas vijand zal kalmeren, waardoor ze tijdelijk aarzelen om tegen je te vechten.\n\nHappy Pride!
items.consum.food.pasty.shattered_desc=Dit grote stuk vanillecake heeft kleurrijke hagelslag en groen glazuur. De taart is gemaakt om jarenlange ervaring te vieren, en zal je een klein deel van die ervaring schenken als je hem eet.\n\nShattered Pixel Dungeon werd voor het eerst uitgebracht op 5 augustus 2014. Gefeliciteerd met je verjaardag Shattered Pixel Dungeon!
items.consum.food.pasty.pie_desc=Een heel groot stuk pompoentaart. De zoete en kruidige smaak zal je vullen en je een klein beetje genezing geven.\n\nFijne Halloween!
items.consum.food.pasty.vanilla_desc=Dit grote stuk vanillecake heeft kleurrijke hagelslag en blauw glazuur. De taart is gemaakt om jarenlange ervaring te vieren, en zal je een klein deel van die ervaring schenken als je hem eet.\n\nDe originele Pixel Dungeon werd voor het eerst uitgebracht op 4 december 2012. Gefeliciteerd Pixel Dungeon!
items.consum.food.pasty.cane_desc=Een enorm suikerzoet snoepgoed. Het is groot genoeg om je te vullen, en de suiker kan je toverstokken ook een klein beetje extra lading geven.\n\nPrettige Feestdagen!
items.consum.food.pasty.sparkling_desc=Dit sprankelende drankje is een soort vloeibaar voedsel. Het stilt de honger en simuleert mousserende wijn, maar is niet echt alcoholisch. Het warme gevoel in je buik zorgt voor een beetje bescherming.\n\nGelukkig nieuwjaar!
items.consum.food.pasty$fishleftover.name=visresten
items.consum.food.pasty$fishleftover.eat_msg=Dat eten smaakte oké.
items.consum.food.pasty$fishleftover.desc=Wat overtollige vis van je vorige maaltijd. Je kunt het op elk gewenst moment eten om een beetje honger te stillen.

items.consum.food.smallration.name=klein voedselrantsoen
items.consum.food.smallration.eat_msg=Dat eten smaakte oké.
items.consum.food.smallration.desc=Het ziet eruit als een standaard voedselrantsoen maar dan kleiner.
items.consum.food.smallration.discover_hint=Je kunt dit voorwerp in een winkel kopen.

items.consum.food.stewedmeat.name=gestoofd vlees
items.consum.food.stewedmeat.eat_msg=Dat eten smaakte oké.
items.consum.food.stewedmeat.desc=Door het vlees te stoven, is het gereinigd van alle ziekten of parasieten. Het is veilig om te eten.
items.consum.food.stewedmeat.discover_hint=Je kunt dit voorwerp maken met behulp van alchemie.

items.consum.food.supplyration.name=bevoorradingsrantsoen
items.consum.food.supplyration.desc=Dit rantsoen werd door en voor leden van het dievengilde in de kerker achtergelaten. Het is speciaal ontworpen om onderweg te worden gegeten en helpt bij algemeen bedrog.\n\nHoewel het je niet zoveel verzadigt als een normaal rantsoen, kan het snel worden gegeten, zorgt het voor een beetje directe genezing en zal het de lading van de schaduwenmantel van de Schurk herstellen.
items.consum.food.supplyration.discover_hint=Je kunt dit item vinden door een specifiek heldentalent te gebruiken.



##journal items
items.specific.journal.documentpage.name=gescheurde pagina
items.specific.journal.documentpage.desc=Een enkele pagina, waarschijnlijk gescheurd uit een of ander boek. Je moet het oppakken om het te lezen.

items.specific.journal.alchemypage.name=gescheurde alchemie boekpagina
items.specific.journal.alchemypage.desc=Een gescheurde pagina uit een alchemiegids.\n\nDe meeste tekst is te klein om op afstand te lezen, maar je kunt de titel van de pagina wel onderscheiden:\n\n_"%s"_

items.specific.journal.guidebook.name=boek van kerkermeesterschap
items.specific.journal.guidebook.hint_mobile=Je gids heeft advies voor je! Tik op de knipperende dagboekknop rechtsboven om het te lezen.
items.specific.journal.guidebook.hint_desktop=Je reisgids heeft advies voor je! Tik op de knipperende dagboekknop (%s) rechtsboven om het te lezen.
items.specific.journal.guidebook.hint_status=Gids
items.specific.journal.guidebook.desc=Een gidsboek voor avonturiers, hier achtergelaten door iemand die besloot dat avontuur niets voor hen was! Dit specifieke boek is magisch en kan avonturiers ertoe aanzetten een pagina op het juiste moment te lezen.\n\nOndanks die functie is het boek erg populair vanwege de grote woorden "Geen Paniek!" die in grote vriendelijke letters op de omslag is geschreven.

items.specific.journal.guidepage.name=gescheurde gidspagina
items.specific.journal.guidepage.desc=Een gescheurde pagina uit een avonturengids.\n\nDe meeste tekst is te klein om op afstand te lezen, maar je kunt de titel van de pagina wel onderscheiden:\n\n_"%s"_

items.specific.journal.regionlorepage$sewers.name=versleten brief
items.specific.journal.regionlorepage$sewers.desc=Het lijkt op een brief, geschreven op een vuil stuk papier. Je moet het oppakken om te kunnen lezen wat erop staat.

items.specific.journal.regionlorepage$prison.name=versleten dagboekpagina
items.specific.journal.regionlorepage$prison.desc=Een dagboekpagina, of een ander soort verslag, geschreven op een oud stuk papier. Het is beter bewaard gebleven dan de brieven die je in de riolen vond, maar je moet het nog steeds oppakken om het te lezen.

items.specific.journal.regionlorepage$caves.name=oude logboekvermelding
items.specific.journal.regionlorepage$caves.desc=Het lijkt op een aantekening in het logboek van een ontdekkingsreiziger, verrassend goed bewaard gebleven ondanks hoe oud het moet zijn. Pak het op om het te lezen.

items.specific.journal.regionlorepage$city.name=verroeste tablet
items.specific.journal.regionlorepage$city.desc=Een kleine verroeste metalen tablet met een magische boodschap erin geëtst. De letters zijn nog steeds duidelijk ondanks de leeftijd van het tablet, maar je moet het oppakken om het te lezen.

items.specific.journal.regionlorepage$halls.name=gloeiende tablet
items.specific.journal.regionlorepage$halls.desc=Een kleine zwarte tablet met gloeiende groene letters erin geëtst. De gloeiende letters vervagen op afstand tot een waas, je moet het oppakken om het te lezen.


###keys
items.specific.keys.goldenkey.name=gouden sleutel
items.specific.keys.goldenkey.desc=De inkepingen van deze gouden sleutel zijn klein en ingewikkeld. Misschien opent het een kist die op slot zit?

items.specific.keys.crystalkey.name=Kristallen sleutel
items.specific.keys.crystalkey.desc=De snijvlakken van deze kristallijne sleutel glinsteren in de duisternis. Misschien opent het iets van kristal?

items.specific.keys.ironkey.name=ijzeren sleutel
items.specific.keys.ironkey.desc=De tanden van deze oude ijzeren sleutel zijn goed versleten; zijn leren koord is gehavend door de leeftijd. Welke deur zou het kunnen openen?

items.specific.keys.wornkey.name=versleten sleutel
items.specific.keys.wornkey.desc=Deze sleutel is versleten en verkleurd, maar ziet er ernstig uit. Waarschijnlijk kan hij een serieuze deur in de buurt openen.



###potions
items.consum.potions.potion.ac_drink=DRINK
items.consum.potions.potion.turquoise=lichtblauwe toverdrank
items.consum.potions.potion.crimson=rode toverdrank
items.consum.potions.potion.azure=donkerblauwe toverdrank
items.consum.potions.potion.jade=groene toverdrank
items.consum.potions.potion.golden=gouden toverdrank
items.consum.potions.potion.magenta=roze toverdrank
items.consum.potions.potion.charcoal=zwarte toverdrank
items.consum.potions.potion.ivory=witte toverdrank
items.consum.potions.potion.amber=oranje toverdrank
items.consum.potions.potion.bistre=bruine toverdrank
items.consum.potions.potion.indigo=paarse toverdrank
items.consum.potions.potion.silver=zilveren toverdrank
items.consum.potions.potion.unknown_desc=Deze fles bevat een wervelende kleurige vloeistof. Wie weet wat voor effect het heeft als het wordt gegooid of gedronken?
items.consum.potions.potion.harmful=Schadelijke toverdrank!
items.consum.potions.potion.beneficial=Heilzame toverdrank
items.consum.potions.potion.yes=Ja, ik weet wat ik doe
items.consum.potions.potion.no=Nee, ik heb me bedacht
items.consum.potions.potion.sure_drink=Weet je zeker dat je het wilt opdrinken? In de meeste gevallen wil je zo'n toverdrank naar je vijanden gooien.
items.consum.potions.potion.sure_throw=Weet je zeker dat je het wilt gooien? In de meeste gevallen wil je zo'n toverdrank opdrinken.
items.consum.potions.potion.shatter=De fles breekt en de vloeistof spat ongevaarlijk op de grond.
items.consum.potions.potion.discover_hint=Je kunt dit item zomaar in de kerker vinden, of maak het met alchemie.
items.consum.potions.potion$placeholder.name=toverdrank
items.consum.potions.potion$seedtopotion.name=Willekeurige Toverdrank

items.consum.potions.potionofexperience.name=toverdrank van ervaring
items.consum.potions.potionofexperience.desc=De legendarische ervaringen van vele veldslagen is teruggebracht tot vloeibare vorm. Deze toverdrank verhoogt onmiddellijk je ervaringsniveau.

items.consum.potions.potionoffrost.name=toverdrank van vorst
items.consum.potions.potionoffrost.desc=De chemische stof in dit drankje verdampt tot een ijskoude wolk bij blootstelling aan open lucht.

items.consum.potions.potionofhaste.name=toverdrank van haast
items.consum.potions.potionofhaste.energetic=Je voelt je energiek!
items.consum.potions.potionofhaste.desc=Het drinken van deze vreemd zoete vloeistof geeft je voor een korte tijd enorme energie, waardoor je op hoge snelheden kunt rennen.

items.consum.potions.potionofhealing.name=toverdrank van genezing
items.consum.potions.potionofhealing.heal=Je wonden beginnen te sluiten.
items.consum.potions.potionofhealing.desc=Dit elixer herstelt je gezondheid snel en geneest vele kwalen onmiddellijk.

items.consum.potions.potionofinvisibility.name=toverdrank van onzichtbaarheid
items.consum.potions.potionofinvisibility.invisible=Je ziet je handen voor je ogen verdwijnen!
items.consum.potions.potionofinvisibility.desc=Als je dit drankje drinkt, word je tijdelijk onzichtbaar. Hoewel onzichtbaar, zullen vijanden je niet kunnen zien. Fysieke aanvallen en magische effecten (zoals rollen en toverstokken) zullen de onzichtbaarheid onmiddellijk opheffen.

items.consum.potions.potionoflevitation.name=toverdrank van levitatie
items.consum.potions.potionoflevitation.float=Je zweeft de lucht in!
items.consum.potions.potionoflevitation.desc=Als je deze merkwaardige vloeistof drinkt, zweef je de lucht in en vlieg je moeiteloos over vallen en kuilen. Als je dit drankje gooit, ontstaat er een wolk van ongezuiverd gas waarin iedereen wordt gedesoriënteerd.

items.consum.potions.potionofliquidflame.name=toverdrank van vloeibare vlam
items.consum.potions.potionofliquidflame.desc=Deze fles bevat een onstabiel ingrediënt dat bij blootstelling aan open lucht met geweld vlam vat.

items.consum.potions.potionofmindvision.name=toverdrank van geestvisie
items.consum.potions.potionofmindvision.see_mobs=Je kunt op de een of andere manier de aanwezigheid van de geest van andere wezens voelen!
items.consum.potions.potionofmindvision.see_none=Je kunt op de een of andere manier zien dat je op dit moment alleen bent op deze verdieping.
items.consum.potions.potionofmindvision.desc=Nadat je dit hebt gedronken, wordt je geest afgestemd op de psychische signatuur van verre wezens, waardoor je biologische aanwezigheid door muren heen kunt voelen. Met dit drankje kun je ook door nabijgelegen muren en deuren kijken.

items.consum.potions.potionofparalyticgas.name=toverdrank van verlammend gas
items.consum.potions.potionofparalyticgas.desc=Bij blootstelling aan open lucht verdampt de vloeistof in deze fles tot een verdovende gele waas. Iedereen die de wolk inademt, is onmiddellijk verlamd en kan enige tijd niet bewegen totdat de wolk is verdwenen. Dit voorwerp kan naar verre vijanden worden gegooid om ze in het gas te vangen.

items.consum.potions.potionofpurity.name=toverdrank van zuiverheid
items.consum.potions.potionofpurity.freshness=Je voelt een ongewone frisheid in de lucht.
items.consum.potions.potionofpurity.protected=Een beschermend vlies omhult je!
items.consum.potions.potionofpurity.desc=Deze magische reactiestof neutraliseert snel alle schadelijke gebiedsgebonden effecten in een groot gebied. Als je het drinkt, krijgt je tijdelijke immuniteit tegen dergelijke effecten.

items.consum.potions.potionofstrength.name=toverdrank van kracht
items.consum.potions.potionofstrength.msg=Hernieuwde kracht stroomt door je lichaam, je krachtniveau is nu %d
items.consum.potions.potionofstrength.desc=Deze krachtige vloeistof stroomt door je spieren en vergroot je kracht permanent met één punt.

items.consum.potions.potionoftoxicgas.name=toverdrank van giftig gas
items.consum.potions.potionoftoxicgas.desc=Als je dit glas onder druk ontkurkt of verbrijzelt, explodeert de inhoud in een dodelijke wolk van giftig groen gas. Je kunt ervoor kiezen om dit drankje naar verre vijanden te gooien in plaats van het met de hand te ontkurken.



###brews
items.consum.potions.brews.brew.discover_hint=Je kunt dit voorwerp maken met behulp van alchemie.

items.consum.potions.brews.aquabrew.name=waterbrouwsel
items.consum.potions.brews.aquabrew.desc=Wanneer dit brouwsel wordt verbrijzeld, zal er op de locatie een uitbarsting van water onder druk vrijkomen. Het is alleen krachtig genoeg om vuurtype vijanden te beschadigen, maar het verspreidt ook water naar nabijgelegen terreinen, ontwapent vallen, blust branden en slaat personages terug in de buurt van de uitbarsting.

items.consum.potions.brews.blizzardbrew.name=sneeuwstorm brouwsel
items.consum.potions.brews.blizzardbrew.desc=Wanneer het wordt verbrijzeld, ontketent dit brouwsel een kolkende sneeuwstorm die zich snel als een gas verspreidt.

items.consum.potions.brews.causticbrew.name=bijtend brouwsel
items.consum.potions.brews.causticbrew.desc=Dit brouwsel verspreid bijtend slijk in een groot gebied rond de plaats waar het verbrijzelt. Alles waar het slijk mee in aanraking komt smelt langzaam weg als het niet in water wordt afgespoeld.

items.consum.potions.brews.infernalbrew.name=hels brouwsel
items.consum.potions.brews.infernalbrew.desc=Wanneer het wordt verbrijzeld, ontketent dit brouwsel een razende vuurzee die zich snel als een gas verspreidt.

items.consum.potions.brews.shockingbrew.name=schokkend brouwsel
items.consum.potions.brews.shockingbrew.desc=Wanneer het wordt verbrijzeld, veroorzaakt dit brouwsel een elektrische storm in een groot gebied rond de plek waar het is gebroken.

items.consum.potions.brews.unstablebrew.name=onstabiel brouwsel
items.consum.potions.brews.unstablebrew.desc=Dit magische brouwsel gloeit met de veranderende kleuren van de regenboog.\n\nWanneer het wordt gedronken of gegooid, activeert het het effect van een willekeurig drankje.Het effect van het drankje is altijd gunstig als het wordt gedronken, maar schadelijk als het wordt gegooid.

###elixirs
items.consum.potions.elixirs.elixir.discover_hint=Je kunt dit voorwerp maken met behulp van alchemie.

items.consum.potions.elixirs.elixirofarcanearmor.name=elixer van mysterieus pantser
items.consum.potions.elixirs.elixirofarcanearmor.desc=Dit elixer geeft de drinker een langdurige weerstand tegen magische schade.

items.consum.potions.elixirs.elixirofaquaticrejuvenation.name=elixer van aquatische verjonging
items.consum.potions.elixirs.elixirofaquaticrejuvenation.desc=Dit elixer bevat de overblijfselen van Smurrie versterkt met een geneeskrachtig drankje. Hoewel het geen onmiddellijke genezing biedt, herstelt het gestaag een grotere hoeveelheid gezondheid terwijl je in het water staat.
items.consum.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=aquatische genezing
items.consum.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Je hebt tijdelijk herstellende eigenschappen gekregen die vergelijkbaar zijn met die van Smurrie.\n\nAls je in water staat, krijg je per beurt een kleine hoeveelheid gezondheid terug. Het effect wordt gepauzeerd wanneer je volledig gezond bent of niet meer in water staat.\n\nResterende genezing: %d.

items.consum.potions.elixirs.elixirofdragonsblood.name=elixer van drakenbloed
items.consum.potions.elixirs.elixirofdragonsblood.desc=Wanneer het wordt gedronken, laat dit elixer vurige kracht door de aderen van de drinker stromen. Dit effect maakt de drinker immuun voor vuur en stelt hem in staat vijanden in brand te steken met fysieke aanvallen.

items.consum.potions.elixirs.elixiroffeatherfall.name=elixer van verenval
items.consum.potions.elixirs.elixiroffeatherfall.light=Je voelt je zo licht als een veertje!
items.consum.potions.elixirs.elixiroffeatherfall.desc=Dit elixer heeft een zwakker maar beter gecontroleerd zweefeffect, waardoor de drinker een tijdje ongedeerd grote afstanden kan vallen.
items.consum.potions.elixirs.elixiroffeatherfall$featherbuff.name=vederlicht
items.consum.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Je bent onder de invloed van een elixer van verenval, waardoor je in afgronden kunt vallen zonder schade op te lopen!\n\nResterende beurten: %s.

items.consum.potions.elixirs.elixirofhoneyedhealing.name=elixer van honingzoete genezing
items.consum.potions.elixirs.elixirofhoneyedhealing.desc=Dit elixer combineert genezing met de zoetheid van honing. Wanneer het wordt gedronken stilt het een kleine hoeveelheid honger, maar het kan ook worden geworpen naar een bondgenoot om deze te genezen.\n\nWezens die houden van honing kunnen rustig worden gemaakt als dit voorwerp op hen wordt gebruikt.

items.consum.potions.elixirs.elixiroficytouch.name=elixer van ijzige aanraking
items.consum.potions.elixirs.elixiroficytouch.desc=Wanneer het wordt gedronken, stelt dit elixer de drinker in staat om de warmte van vijanden die ze aanvallen te stelen. Dit effect maakt de drinker immuun voor kou en laat vijanden afkoelen wanneer je ze fysiek aanvalt.

items.consum.potions.elixirs.elixirofmight.name=elixer van macht
items.consum.potions.elixirs.elixirofmight.msg=Hernieuwde kracht stroomt door je lichaam, je krachtniveau is nu %d
items.consum.potions.elixirs.elixirofmight.desc=Deze krachtige vloeistof stroomt door je spieren en vergroot je kracht permanent met één punt en verhoogt tijdelijk je maximale gezondheid met %d punten. De gezondheidsverhoging schaalt mee met je maximale gezondheid, maar neemt langzaam af naarmate je meer niveaus bereikt.
items.consum.potions.elixirs.elixirofmight$htboost.name=maximale gezondheidsverhoging
items.consum.potions.elixirs.elixirofmight$htboost.desc=Je lichaam voelt onnatuurlijk sterk en gezond aan.\n\nJe maximale gezondheid wordt langdurig verhoogd. Naarmate je niveau stijgt, neemt de verhoging geleidelijk af.\n\nHuidige verhoging: %d.\nResterende niveaus: %d.

items.consum.potions.elixirs.elixiroftoxicessence.name=elixer van giftige essentie
items.consum.potions.elixirs.elixiroftoxicessence.desc=Wanneer het wordt geconsumeerd, zal dit elixer de drinker doordrenken met giftige energie. De drinker zal voortdurend giftig gas verspreiden terwijl hij beweegt, en zal iets langer immuun zijn voor giftig gas en gif dan de duur van het effect.



###exotic potions
items.consum.potions.exotic.exoticpotion.turquoise=exotisch lichtblauwe toverdrank
items.consum.potions.exotic.exoticpotion.crimson=exotisch rode toverdrank
items.consum.potions.exotic.exoticpotion.azure=exotisch donkerblauwe toverdrank
items.consum.potions.exotic.exoticpotion.jade=exotisch groene toverdrank
items.consum.potions.exotic.exoticpotion.golden=exotisch gouden toverdrank
items.consum.potions.exotic.exoticpotion.magenta=exotisch roze toverdrank
items.consum.potions.exotic.exoticpotion.charcoal=exotisch zwarte toverdrank
items.consum.potions.exotic.exoticpotion.ivory=exotisch witte toverdrank
items.consum.potions.exotic.exoticpotion.amber=exotisch oranje toverdrank
items.consum.potions.exotic.exoticpotion.bistre=exotisch bruine toverdrank
items.consum.potions.exotic.exoticpotion.indigo=exotisch paarse toverdrank
items.consum.potions.exotic.exoticpotion.silver=exotisch zilveren toverdrank
items.consum.potions.exotic.exoticpotion.unknown_desc=Deze ronde fles bevat een korrelige kleurrijke vloeistof. Het lijkt uitheems, wie weet wat het doet als het wordt gedronken of gegooid?
items.consum.potions.exotic.exoticpotion.warning=Wil je deze toverdrank echt niet toepassen? Het wordt hoe dan ook gebruikt.
items.consum.potions.exotic.exoticpotion.yes=Ja, ik weet het zeker
items.consum.potions.exotic.exoticpotion.no=Nee, ik heb me bedacht
items.consum.potions.exotic.exoticpotion.discover_hint=Je kunt dit voorwerp maken met behulp van alchemie.

items.consum.potions.exotic.potionofcleansing.name=toverdrank van reiniging
items.consum.potions.exotic.potionofcleansing.desc=Deze krachtige reactiestof maakt de drinker gedurende een paar beurten immuun voor alle schadelijke statuseffecten wanneer het wordt gedronken. Het kan ook naar een doelwit worden gegooid om het te reinigen.
items.consum.potions.exotic.potionofcleansing$cleanse.name=gereinigd
items.consum.potions.exotic.potionofcleansing$cleanse.desc=Dit personage is tijdelijk immuun voor alle schadelijke statuseffecten!\n\nResterende beurten: %s.

items.consum.potions.exotic.potionofcorrosivegas.name=toverdrank van bijtend gas
items.consum.potions.exotic.potionofcorrosivegas.desc=Als je deze onder druk staande fles ontkurkt of verbrijzelt, explodeert de inhoud in een dodelijke wolk van bijtend roestkleurig gas. Het gas verspreidt zich sneller dan giftig gas en is dodelijker, maar het effect duurt ook minder lang.

items.consum.potions.exotic.potionofdragonsbreath.name=toverdrank van drakenadem
items.consum.potions.exotic.potionofdragonsbreath.prompt=Kies een plek om in brand te steken
items.consum.potions.exotic.potionofdragonsbreath.desc=Deze fles bevat een ongebruikelijke verbinding die kort na vermenging met speeksel in brand vliegt. Door de vloeistof snel uit te spuwen, kan de gebruiker vlammen uit zijn mond spuwen!

items.consum.potions.exotic.potionofearthenarmor.name=toverdrank van aarden bepantsering
items.consum.potions.exotic.potionofearthenarmor.desc=In plaats van te verlammen, heeft deze vloeistof een verhardend effect op de huid waardoor deze in een tijdelijk natuurlijk pantser verandert.

items.consum.potions.exotic.potionofdivineinspiration.name=toverdrank van goddelijke inspiratie
items.consum.potions.exotic.potionofdivineinspiration.no_more_points=Je kunt geen bonus talentpunten meer verdienen.
items.consum.potions.exotic.potionofdivineinspiration.select_tier=Kies een talentklasse waar je twee bonuspunten vooruit in wilt gaan. Je moet de klasse hebben ontgrendeld om de punten te kunnen besteden.
items.consum.potions.exotic.potionofdivineinspiration.bonus=+2 Talentpunten!
items.consum.potions.exotic.potionofdivineinspiration.desc=De kracht van heilige energie teruggebracht tot vloeibare vorm. Deze drank geeft de drinker goddelijke kracht, waardoor ze twee bonus talentpunten krijgen in een klasse naar keuze.\n\nDit drankje kan slechts één keer worden gebruikt voor elk talentklasse.

items.consum.potions.exotic.potionofmagicalsight.name=toverdrank van magisch zicht
items.consum.potions.exotic.potionofmagicalsight.desc=Nadat je dit hebt gedronken, worden je zintuigen kortstondig tot ongelooflijke niveaus verhoogd, waardoor je door muren heen kunt kijken in een straal van 12 tegels!

items.consum.potions.exotic.potionofmastery.name=toverdrank van meesterschap
items.consum.potions.exotic.potionofmastery.prompt=Beheers een Voorwerp
items.consum.potions.exotic.potionofmastery.weapon_easier=Je wapen wordt gemakkelijker te hanteren!
items.consum.potions.exotic.potionofmastery.armor_easier=Je harnas wordt gemakkelijker te dragen!
items.consum.potions.exotic.potionofmastery.desc=In plaats van ruwe kracht te geven, stemt dit drankje in plaats daarvan de spieren van de gebruiker af op een bepaald voorwerp. Dit maakt dat voorwerp gemakkelijker te gebruiken, alsof de drinker ermee heeft geoefend en spiergeheugen heeft opgebouwd.\n\nHet gekozen wapen of harnas vereist daarna 2 minder kracht om te gebruiken. Dit drankje kan maar één keer op een voorwerp worden gebruikt.

items.consum.potions.exotic.potionofshielding.name=toverdrank van bescherming
items.consum.potions.exotic.potionofshielding.desc=In plaats van te genezen, projecteert dit drankje een duurzaam schild rond het lichaam van de gebruiker, waarmee een aanzienlijke hoeveelheid schade wordt geblokkeerd.

items.consum.potions.exotic.potionofshroudingfog.name=toverdrank van verhullende mist
items.consum.potions.exotic.potionofshroudingfog.desc=Bij blootstelling aan lucht produceert de vloeistof in deze fles een dikke rokerige mist die zich snel verspreidt en het zicht van je vijanden blokkeert.

items.consum.potions.exotic.potionofsnapfreeze.name=toverdrank van instant bevriezen
items.consum.potions.exotic.potionofsnapfreeze.desc=De chemische stof in dit drankje reageert snel met de lucht en laat alles onmiddellijk bevriezen en wortel schieten wat erin gevangen is.

items.consum.potions.exotic.potionofstamina.name=toverdrank van uithoudingsvermogen
items.consum.potions.exotic.potionofstamina.desc=Als je deze vreemd zoete vloeistof drinkt, krijg je een langdurige energieverhoging, waardoor je langere tijd in een versneld tempo kunt rennen.

items.consum.potions.exotic.potionofstormclouds.name=toverdrank van onweerswolken
items.consum.potions.exotic.potionofstormclouds.desc=Als je dit drankje gooit, ontstaat er een snel verspreidende wolk van geconcentreerde damp, die zal condenseren en naar de omgeving zal stromen. Het meeste terrein zal worden omgezet in water, vurige vijanden zullen schade oplopen, het vuur zal worden geblust en vallen zullen overweldigd worden en kapot gaan.



###quest items
items.quest.ceremonialcandle.name=ceremoniële kaars
items.quest.ceremonialcandle.desc=Een set kaarsen, samengesmolten door gebruik.\n\nAlleen zijn ze waardeloos, maar als ze samen met andere kaarsen in een patroon worden gebruikt, kunnen ze de energie opwekken voor een oproepingsritueel.
items.quest.ceremonialcandle.discover_hint=Je kunt dit item vinden tijdens een specifieke missie.

items.quest.corpsedust.name=lijkstof
items.quest.corpsedust.chill=Een koude rilling loopt over je rug.
items.quest.corpsedust.desc=Van de buitenkant verschilt de bal van lijkstof niet van een gewone stofbal. Maar je voelt dat er een kwaadaardige energie in schuilt.\n\nHet is een goed idee om er zo snel mogelijk vanaf te komen.
items.quest.corpsedust.discover_hint=Je kunt dit item vinden tijdens een specifieke missie.
items.quest.corpsedust&dustwraith.rankings_desc=Vervloekt door lijkstof

items.quest.darkgold.name=donker gouderts
items.quest.darkgold.you_now_have=Je hebt nu %d donker gouderts.
items.quest.darkgold.desc=Dit metaal wordt niet donker genoemd vanwege zijn kleur (het verschilt niet van normaal goud), maar omdat het smelt in daglicht waardoor het onbruikbaar is aan de oppervlakte.
items.quest.darkgold.discover_hint=Je kunt dit item vinden tijdens een specifieke missie.

items.quest.dwarftoken.name=dwerg fiche
items.quest.dwarftoken.discard=Je gooit de overtollige fiches weg.
items.quest.dwarftoken.desc=Een vreemd gevormd stuk metaal, vastgehouden door een bewoner van de dwergenkluis. Misschien maakt het deel uit van de magie die het aan de kluis bindt? Het is verstandig om het te bewaren, het zou nog van pas kunnen komen.
items.quest.dwarftoken.desc_old=Veel dwergen en sommige van hun grotere bouwsels dragen deze kleine stukjes metaal met een onbekend doel. Misschien zijn het sieraden of misschien een soort identiteitsbewijs. Dwergen zijn vreemde wezens.
items.quest.dwarftoken.discover_hint=Je kunt dit item vinden tijdens een specifieke missie.

items.quest.embers.name=elementale sintels
items.quest.embers.desc=Speciale sintels die alleen kunnen worden verkregen uit jonge vuurelementalen. Ze stralen warmte-energie uit.
items.quest.embers.discover_hint=Je kunt dit item vinden tijdens een specifieke missie.

items.quest.escapecrystal.name=ontsnappingskristal
items.quest.escapecrystal.ac_use=GEBRUIK
items.quest.escapecrystal.prompt=Kies een voorwerp
items.quest.escapecrystal.desc=Een dun, magisch spreukkristal dat teleportatiemagie lijkt te bevatten. Je kunt het kristal op elk moment gebruiken om de dwergenkluis te verlaten, maar als je te vroeg vertrekt, ontvang je niet de volledige beloning!
items.quest.escapecrystal.discover_hint=Je kunt dit item vinden tijdens een specifieke missie.
items.quest.escapecrystal.injure_warning_1=De tijd lijkt te vertragen als je de stem van de Kobold hoort:\n\n"Hé, je lijkt behoorlijk gewond te zijn, gaat alles goed daaronder? Ik wil mijn standbeeld graag hebben, maar niet zo graag dat je ervoor moet sterven!"
items.quest.escapecrystal.injure_warning_2="Als je in een lastige situatie terechtkomt, kun je een van die _teleportatie items uit de startkamer_ gebruiken om terug te keren naar die plek en het opnieuw proberen."
items.quest.escapecrystal.injure_warning_3="Als het er echt hopeloos uitziet, kun je ontsnappen met behulp van dat kristal dat ik je gaf. Ik ga je niet de volledige beloning geven, maar het is zeker beter dan doodgaan!"
items.quest.escapecrystal.leaving_start=De tijd lijkt te vertragen als je de stem van de Kobold hoort:\n\n"Luister, ik begrijp dat je nerveus bent, maar verlaat alsjeblieft in ieder geval de eerste kamer!"\n\n"Je hoeft je geen zorgen te maken over je spullen, ik ben een Kobold van mijn woord, ik beloof dat alles op je wacht als je terugkomt. Ik beloof ook dat je het kristal mag gebruiken om te ontsnappen als je echt in gevaar bent."
items.quest.escapecrystal.leaving_early=De tijd lijkt te vertragen als je de stem van de Kobold hoort:\n\n"Echt, nu al vluchten!? Je weet toch dat je van de meeste vijanden daar kunt wegrennen?"\n\n"Kijk, als je leven in gevaar is, kan ik je eruit trekken, maar je mag niets meenemen. Ik had veel meer van je verwacht =("
items.quest.escapecrystal.leaving_partly_explored=De tijd lijkt te vertragen en je hoort de stem van de Kobold:\n\n"Oh, ga je nu al weg? Nou ja, je hebt in ieder geval geholpen de plek in kaart te brengen, en dat is beter dan niets."\n\n"Toch had ik meer van je verwacht =(. Natuurlijk trek ik je eruit als je me nodig hebt. Ik laat je wel iets meenemen, zoals een toverdrank of een rol."
items.quest.escapecrystal.leaving_fully_explored=De tijd lijkt te vertragen en je hoort de stem van de Kobold:\n\n"Moet je weg? Nou, je hebt de kluis in ieder geval al aardig verkend. Ik had gehoopt dat je er meer succes mee zou hebben als je hem daadwerkelijk zou plunderen, maar ik heb nu een veel beter idee hoe de plek werkt."\n\n"Je mag wel iets meenemen, maar niets dat op magische wijze is verbeterd!"
items.quest.escapecrystal.leaving_partial_victory=De tijd lijkt te vertragen en je hoort de stem van de Kobold:\n\n"Ik had gehoopt dat je mijn beeldje zou vinden, maar je hebt geweldig werk verricht door de kluis grotendeels te verkennen en leeg te halen!"\n\n"Weet je wat, ik laat je een voorwerp houden zolang het niet verder dan +1 is verbeterd, en ik zet mijn basis verderop in de kerker wel op. Ik heb sowieso wat tijd nodig om mijn volgende stappen te plannen."
items.quest.escapecrystal.leaving_victory=De tijd lijkt te vertragen en je hoort de stem van de Kobold:\n\n"Uitstekend werk!! Ben je klaar om te vertrekken? Ik neem het beeld van je over als je terugkomt."\n\n"Zoals beloofd zet ik verderop mijn winkeltje op en mag je alles meenemen wat je wilt! Neem gerust de tijd om te kiezen, de rest blijft in de kluis."
items.quest.escapecrystal.leaving_item=Weet je zeker dat dit het artikel is dat je wilt meenemen?
items.quest.escapecrystal.leaving_seal=_Het gebroken zegel dat aan dit pantser is bevestigd, is verbonden aan de spiegel en kan niet worden meegenomen._ Het zegel wordt automatisch van het pantser verwijderd. Hierdoor daalt het pantserniveau met 1, maar de bijbehorende symbolen blijven behouden.
items.quest.escapecrystal.leaving_staff=_Deze tovenaarsstaf is aan de spiegel gebonden en kan niet meegenomen worden, maar de toverstaf die erin is verwerkt wel._ De toverstaf wordt automatisch van de staf verwijderd en aan je gegeven op niveau -1 van de staf.
items.quest.escapecrystal.leaving_yes=Verlaat de Kluis
items.quest.escapecrystal.leaving_no=Blijf Hier
items.quest.escapecrystal.error_start=Het lijkt erop dat je niet in het kluisniveau bent! Dit kan komen door een bug of een crash.
items.quest.escapecrystal.error_no_items=Er worden geen items van je opgeslagen, dus het kristal is uit je inventaris verwijderd.
items.quest.escapecrystal.error_with_items=Je spullen worden momenteel opgeslagen, dus probeer opnieuw af te dalen in de kluis om de missie te starten. Je opgeslagen spullen worden aan je teruggegeven zodra de missie is voltooid.

items.quest.gooblob.name=klodder smurrie
items.quest.gooblob.desc=Een wiebelende klodder rotzooi die van Smurrie afviel toen het stierf. Het lijkt op een grote bal gelei, hoewel je het niet zou durven eten.\n\nHet doet niets op zichzelf, maar het kan handig zijn in combinatie met bepaalde drankjes of een bom. Het kan op zijn minst worden omgezet in een behoorlijke hoeveelheid energie.
items.quest.gooblob.discover_hint=Je kunt dit voorwerp krijgen doordat bepaalde vijanden het laten vallen.

items.quest.impstatue.name=obsidiaan beeldje
items.quest.impstatue.desc=Een klein, gitzwart beeldje, gehouwen uit obsidiaan. Het lijkt op de kobold die je hierheen heeft gestuurd; het heeft zelfs zijn gloeiende groene ogen. Op de sokkel van het beeldje staat een inscriptie in een taal die je nog nooit eerder hebt gezien.
items.quest.impstatue.discover_hint=Je kunt dit item vinden tijdens een specifieke missie.

items.quest.vaultbeacon.name=kluis baken
items.quest.vaultbeacon.desc=Deze terugkeerspreuk lijkt al een locatie te hebben, waarschijnlijk de ingangskamer waar je hem vond.\n\nJe kunt hem gebruiken om tijd te besparen tijdens het verkennen, of als ontsnappingsroute als je in gevaar bent.
items.quest.vaultbeacon.discover_hint=Je kunt dit item vinden tijdens een specifieke missie.

items.quest.metalshard.name=vervloekte metalen scherf
items.quest.metalshard.desc=Een scherf van verroest vervloekt metaal, die van DM-300 afbrak toen het werd vernietigd. Je voelt er een kwaadaardige magie in schuilen.\n\nHet doet niets op zichzelf, maar het kan handig zijn in combinatie met bepaalde rollen of een bom. Het kan op zijn minst worden omgezet in een behoorlijke hoeveelheid energie.
items.quest.metalshard.discover_hint=Je kunt dit voorwerp krijgen doordat bepaalde vijanden het laten vallen.

items.quest.pickaxe.name=pikhouweel
items.quest.pickaxe.ability_name=doorboren
items.quest.pickaxe.ability_desc=De Duellist kan een vijand doorboren met een houweel. Dit zal gegarandeerd raken, is kwetsbaar gedurende 3 beurten en richt _%1$d-%2$dschade _ toe aan vijanden met een sterke huid.
items.quest.pickaxe.upgrade_ability_stat_name=Vaardigheid Schade
items.quest.pickaxe.desc=Dit is een stevig en zwaar stuk gereedschap voor het breken van stenen. Je hoeft de houweel er niet mee uit te rusten, maar in een mum van tijd kan hij waarschijnlijk als wapen worden uitgerust.
items.quest.pickaxe.discover_hint=Je kunt dit item vinden tijdens een specifieke missie.



###remains
items.ground.remains.remainsitem.ac_use=GEBRUIK
items.ground.remains.remainsitem.discover_hint=Je kunt dit item vinden in de overblijfselen van een specifieke held uit een eerdere verloren verkenning.

items.ground.remains.bowfragment.name=fragment van een boog
items.ground.remains.bowfragment.desc=Dit gebroken stuk hout maakte ooit deel uit van de geestenboog van een gevallen jaagster. Je voelt nog steeds een beetje natuurenergie in het fragment achterblijven, je kunt het fragment gebruiken om wat hoog gras om je heen te laten groeien. Als je dit doet, wordt het fragment echter vernietigd.

items.ground.remains.brokenhilt.name=gebroken handgreep
items.ground.remains.brokenhilt.desc=Deze gebroken handgreep ziet eruit alsof het afkomstig is van het wapen van een verslagen Duellist. Je kunt nog steeds een beetje krijgskracht in de handgreep voelen, je kunt het gebruiken om wat bonusschade te doen bij je volgende twee slagaanvallen. Als je dit doet, wordt het handgreep echter vernietigd.

items.ground.remains.brokenstaff.name=gebroken staf
items.ground.remains.brokenstaff.desc=Deze staf van de Magiër is in tweeën gebroken nadat de eigenaar overleed. Je voelt nog steeds wat magische energie in de staf, je kunt het gebruiken om je toverstokken een kleine oplaadboost te geven. Als je dit doet, wordt het staffragment echter vernietigd.

items.ground.remains.cloakscrap.name=stukje stof
items.ground.remains.cloakscrap.desc=Dit stukje doorschijnende stof ziet eruit alsof het afkomstig is van de schaduwmantel van een gevallen schurk. Je voelt nog steeds een beetje mystieke energie erin, je kunt het gebruiken om je artefacten een kleine oplaadboost te geven. Als je dit doet, wordt de stof echter vernietigd.

items.ground.remains.sealshard.name=scherven van een zegel
items.ground.remains.sealshard.desc=Deze kleine stukjes rode was zien eruit alsof ze afkomstig zijn van het zegel van een gevallen krijger. Je voelt nog steeds een beetje wilskracht aan het zegel kleven, je kunt het gebruiken om jezelf een beetje bescherming te geven. Als je dit doet, worden de zegel scherven echter vernietigd.

items.ground.remains.tornpage.name=gescheurde pagina
items.ground.remains.tornpage.desc=Deze pagina ziet eruit alsof hij uit een verlopen heilig boek van een Geestelijke is gescheurd. Er kleeft nog steeds een beetje goddelijke energie aan, je kunt het gebruiken om een beetje gezondheid terug te krijgen. Als je dit doet, wordt de uitgescheurde pagina echter vernietigd.



###rings
items.equipment.rings.ring.diamond=ring van diamant
items.equipment.rings.ring.opal=ring van opaal
items.equipment.rings.ring.garnet=ring van granaatsteen
items.equipment.rings.ring.ruby=ring van robijn
items.equipment.rings.ring.amethyst=ring van amethist
items.equipment.rings.ring.topaz=ring van topaas
items.equipment.rings.ring.onyx=ring van onyx
items.equipment.rings.ring.tourmaline=ring van toermalijn
items.equipment.rings.ring.emerald=ring van smaragd
items.equipment.rings.ring.sapphire=ring van saffier
items.equipment.rings.ring.quartz=ring van kwarts
items.equipment.rings.ring.agate=ring van agaat
items.equipment.rings.ring.equip_cursed=De ring versmalt pijnlijk strak om je vinger!
items.equipment.rings.ring.unknown_desc=Deze metalen band is versierd met een grote edelsteen die schittert in de duisternis. Wie weet welk effect het heeft als het wordt gedragen?
items.equipment.rings.ring.known=Dit is een %s
items.equipment.rings.ring.identify=Je bent nu voldoende bekend met je ring om hem te identificeren.
items.equipment.rings.ring.cursed_worn=Omdat deze ring vervloekt is, ben je machteloos om hem af te doen.
items.equipment.rings.ring.curse_known=Je voelt een kwaadaardige magie schuilen in deze ring.
items.equipment.rings.ring.not_cursed=Deze ring is vrij van kwaadaardige magie.

items.equipment.rings.ringofaccuracy.name=ring van nauwkeurigheid
items.equipment.rings.ringofaccuracy.stats=Wanneer deze ring wordt gedragen neemt je nauwkeurigheid toe met _%s%%._
items.equipment.rings.ringofaccuracy.typical_stats=Wanneer deze ring wordt gedragen neemt je nauwkeurigheid doorgaans toe met _%s%%._
items.equipment.rings.ringofaccuracy.combined_stats=Je uitgeruste ringen combineren hun kracht, waardoor je nauwkeurigheid in totaal met _%s%%_ toeneemt.
items.equipment.rings.ringofaccuracy.upgrade_stat_name_1=Nauwkeurigheidsverbetering
items.equipment.rings.ringofaccuracy.desc=Deze ring verhoogt je focus, waardoor je aanvallen gemakkelijker hun doel vinden. Een vervloekte ring maakt het in plaats daarvan moeilijker om een doel te raken bij een aanval.

items.equipment.rings.ringofarcana.name=ring van geheimzinnigheid
items.equipment.rings.ringofarcana.stats=Wanneer deze ring wordt gedragen, neemt de kracht van betoveringen en symbolen toe met _%s%%._
items.equipment.rings.ringofarcana.typical_stats=Wanneer deze ring wordt gedragen, neemt de kracht van betoveringen en symbolen doorgaans toe met _%s%%._
items.equipment.rings.ringofarcana.combined_stats=Je uitgeruste ringen combineren hun kracht, waardoor de kracht van betoveringen en symbolen in totaal met _%s%%_ toeneemt.
items.equipment.rings.ringofarcana.upgrade_stat_name_1=Arcana verbetering
items.equipment.rings.ringofarcana.desc=Deze ring verbetert magische betoveringen op wapens en symbolen op harnassen, inclusief vloeken! Het vergroot eerst de activeringskans en verhoogt vervolgens de kracht van het effect zodra de activeringskans 100% is. Een vervloekte ring verzwakt in plaats daarvan betoveringen, symbolen en vloeken.

items.equipment.rings.ringofelements.name=ring van elementen
items.equipment.rings.ringofelements.stats=Wanneer deze ring wordt gedragen biedt hij _%s%%_ elementale weerstand.
items.equipment.rings.ringofelements.typical_stats=Wanneer deze ring wordt gedragen biedt hij doorgaans _%s%%_ elementale weerstand.
items.equipment.rings.ringofelements.combined_stats=Je uitgeruste ringen combineren hun krachten en bieden in totaal _%s%%_ elementale weerstand.
items.equipment.rings.ringofelements.upgrade_stat_name_1=Weerstand
items.equipment.rings.ringofelements.desc=Deze ring biedt weerstand tegen de meeste elementale en magische effecten, waardoor schade en duur van het effect worden verminderd. Natuurlijk verergert een vervloekte ring juist deze effecten.

items.equipment.rings.ringofenergy.name=ring van energie
items.equipment.rings.ringofenergy.stats=Wanneer deze ring wordt gedragen, verhoogt deze de oplaadsnelheid van toverstokken, artefacten en het heldhaftige harnas met _%s%%._
items.equipment.rings.ringofenergy.typical_stats=Wanneer deze ring wordt gedragen, verhoogt deze doorgaans de oplaadsnelheid van toverstokken, artefacten en het heldhaftige harnas met _%s%%._
items.equipment.rings.ringofenergy.combined_stats=Je uitgeruste ringen combineren hun krachten, waardoor de oplaadsnelheid in totaal met _%s%%_ toeneemt.
items.equipment.rings.ringofenergy.upgrade_stat_name_1=Laadversterking
items.equipment.rings.ringofenergy.desc=Je magische uitrusting laadt sneller op in het geheimzinnige veld dat uit deze ring straalt. Een vervloekte ring vertraagt in plaats daarvan het opladen.

items.equipment.rings.ringofevasion.name=ring van ontwijking
items.equipment.rings.ringofevasion.stats=Wanneer deze ring wordt gedragen neemt je ontwijking toe met _%s%%._
items.equipment.rings.ringofevasion.typical_stats=Wanneer deze ring wordt gedragen neemt je ontwijking doorgaans toe met _%s%%._
items.equipment.rings.ringofevasion.combined_stats=Je uitgeruste ringen combineren hun kracht, waardoor je ontwijking in totaal met _%s%%_ toeneemt.
items.equipment.rings.ringofevasion.upgrade_stat_name_1=Ontwijkings verbetering
items.equipment.rings.ringofevasion.desc=Deze ring versnelt de reacties van de drager, waardoor het moeilijker wordt om de drager te raken. Een vervloekte ring maakt de gebruiker in plaats daarvan gemakkelijker te slaan.

items.equipment.rings.ringofforce.name=ring van kracht
items.equipment.rings.ringofforce.stats=Wanneer deze ring ongewapend wordt gedragen richten slagaanvallen met je huidige sterkte _%1$d-%2$d schade aan._ De schade van een gehanteerd wapen verhoogt deze ring met _%3$d._
items.equipment.rings.ringofforce.typical_stats=Wanneer deze ring ongewapend wordt gedragen richten slagaanvallen met je huidige sterkte doorgaans _%1$d-%2$d schade aan._ De schade van een gehanteerd wapen verhoogt deze ring doorgaans met _%3$d._
items.equipment.rings.ringofforce.combined_stats=Je uitgeruste ringen combineren hun krachten, richten in totaal _%1$d- %2$d schade_ aan zonder wapen, of verhogen de schade met _%3$d_ met een gehanteerd wapen.
items.equipment.rings.ringofforce.upgrade_stat_name_1=Ongewapende Schade
items.equipment.rings.ringofforce.upgrade_stat_name_2=Versterking van gewapende schade
items.equipment.rings.ringofforce.upgrade_stat_name_3=Vaardigheid Schade
items.equipment.rings.ringofforce.ability_name=vechtershouding
items.equipment.rings.ringofforce.typical_ability_desc=De Duellist kan met deze ring de houding van een vechter aannemen, waardoor haar reguliere aanvallen altijd deze ring gebruiken, zelfs als ze een wapen heeft. Deze aanvallen zullen doorgaans _%1$d-%2$d schade_ aanrichten en zullen ook de betovering en verbetering van het wapen overnemen. Deze houding vertraagt de oplaadsnelheid van het wapen met 50 %%.
items.equipment.rings.ringofforce.ability_desc=De Duellist kan met deze ring de houding van een vechter aannemen, waardoor haar reguliere aanvallen altijd deze ring gebruiken, zelfs als ze een wapen heeft. Deze aanvallen zullen _%1$d-%2$d schade_ aanrichten en zullen ook de betovering en verbetering van het wapen erven. Deze houding vertraagt de oplaadsnelheid van het wapen met 50%%.
items.equipment.rings.ringofforce.desc=Deze ring versterkt de kracht van slagaanvallen van de drager. Deze extra kracht is vrij zwak bij het hanteren van wapens, maar een ongewapende aanval wordt veel sterker gemaakt. Een vervloekte ring verzwakt in plaats daarvan de slagen van de drager.
items.equipment.rings.ringofforce$brawlersstance.name=vechtershouding
items.equipment.rings.ringofforce$brawlersstance.desc=In deze houding zullen de reguliere aanvallen van de Duellist gebruik maken van een uitgeruste ring van kracht, zelfs als ze een wapen heeft. Deze aanvallen leveren bonusschade op en maken nog steeds gebruik van de verbetering en betovering van het wapen.\n\nHet behouden van deze houding vergt echter focus, waardoor de oplaadsnelheid van het wapenvermogen met 50% wordt verminderd.\n\nDeze stand kan worden in- of uitgeschakeld door gebruik te maken van een  ring van kracht, maar de verlaging van de laadsnelheid zal een tijdje aanhouden als de stand snel wordt geactiveerd en gedeactiveerd.

items.equipment.rings.ringoffuror.name=ring van woede
items.equipment.rings.ringoffuror.stats=Wanneer deze ring wordt gedragen verhoogt hij de snelheid van je aanvallen met _%s%%._
items.equipment.rings.ringoffuror.typical_stats=Wanneer deze ring wordt gedragen verhoogt hij doorgaans de snelheid van je aanvallen met _%s%%._
items.equipment.rings.ringoffuror.combined_stats=Je uitgeruste ringen combineren hun krachten, waardoor de snelheid van je aanvallen in totaal met _%s%%_ toeneemt.
items.equipment.rings.ringoffuror.upgrade_stat_name_1=Verbetering van aanvalssnelheid
items.equipment.rings.ringoffuror.desc=Deze ring bezorgt de drager een innerlijke geestdrift, waardoor hij sneller kan aanvallen. Een vervloekte ring vertraagt in plaats daarvan de aanvalssnelheid van de drager.

items.equipment.rings.ringofhaste.name=ring van haast
items.equipment.rings.ringofhaste.stats=Wanneer deze ring wordt gedragen verhoogt hij je bewegingssnelheid met _%s%%._
items.equipment.rings.ringofhaste.typical_stats=Wanneer deze ring wordt gedragen verhoogt hij doorgaans je bewegingssnelheid met _%s%%._
items.equipment.rings.ringofhaste.combined_stats=Je uitgeruste ringen combineren hun kracht, waardoor je bewegingssnelheid in totaal met _%s%%_ toeneemt.
items.equipment.rings.ringofhaste.upgrade_stat_name_1=Verbetering van beweegsnelheid
items.equipment.rings.ringofhaste.desc=Deze ring vermindert de bewegingsdruk op de drager, waardoor deze met bovenmenselijke snelheden kan rennen. Een vervloekte ring vertraagt in plaats daarvan de drager.

items.equipment.rings.ringofmight.name=ring van macht
items.equipment.rings.ringofmight.stats=Wanneer je deze ring draagt, neemt je kracht met _%1$d_ en je maximale gezondheid met _%2$s%%_ toe.
items.equipment.rings.ringofmight.typical_stats=Wanneer je deze ring draagt, neemt je kracht doorgaans met _%1$d_ en je maximale gezondheid met _%2$s%%_ toe.
items.equipment.rings.ringofmight.combined_stats=Je uitgeruste ringen combineren hun kracht, waardoor je kracht in totaal met _%1$d_ en je maximale gezondheid met _%2$s%%_ toeneemt.
items.equipment.rings.ringofmight.upgrade_stat_name_1=Krachtversterking
items.equipment.rings.ringofmight.upgrade_stat_name_2=Maximale gezondheid-verbetering
items.equipment.rings.ringofmight.desc=Deze ring verbetert de fysieke eigenschappen van de drager en geeft hem meer fysieke kracht en lichaamsbouw. Een vervloekte ring verzwakt de drager.

items.equipment.rings.ringofsharpshooting.name=ring van scherpschieten
items.equipment.rings.ringofsharpshooting.stats=Wanneer deze ring wordt gedragen, verhoogt hij de schade van je werpwapens alsof hun niveau is verhoogd met _%1$d_, en verhoogt de duurzaamheid ervan met _%2$s%%._
items.equipment.rings.ringofsharpshooting.typical_stats=Wanneer deze ring wordt gedragen, verhoogt hij doorgaans de schade van je werpwapens alsof hun niveau is verhoogd met _%1$d_, en verhoogt doorgaans de duurzaamheid ervan met _%2$s%%._
items.equipment.rings.ringofsharpshooting.combined_stats=Je uitgeruste ringen combineren hun kracht, verhogen het effectieve werpwapen niveau met _%1$d_ en verhogen hun duurzaamheid met _%2$s%%_ in totaal.
items.equipment.rings.ringofsharpshooting.upgrade_stat_name_1=Niveau schadeversterking
items.equipment.rings.ringofsharpshooting.upgrade_stat_name_2=Duurzaamheidsverbetering
items.equipment.rings.ringofsharpshooting.desc=Deze ring verbetert de precisie en het richtvermogen van de drager, waardoor alle projectielwapens schadelijker en duurzamer worden. Een vervloekte ring heeft het tegenovergestelde effect.

items.equipment.rings.ringoftenacity.name=ring van vasthoudendheid
items.equipment.rings.ringoftenacity.stats=Wanneer je deze ring draagt vermindert hij de schade die je oploopt tot _%s%%._
items.equipment.rings.ringoftenacity.typical_stats=Wanneer je deze ring draagt vermindert hij doorgaans de schade die je oploopt tot _%s%%._
items.equipment.rings.ringoftenacity.combined_stats=Je uitgeruste ringen combineren hun krachten, waardoor de schade die je oploopt in totaal met maximaal _%s%%_ wordt verminderd.
items.equipment.rings.ringoftenacity.upgrade_stat_name_1=Max Schade Weerstand
items.equipment.rings.ringoftenacity.desc=Deze ring stelt de drager in staat om normaalgesproken dodelijke aanvallen te weerstaan. Hoe meer gewond de drager is, hoe meer deze bestand is tegen schade. Een vervloekte ring maakt het in plaats daarvan gemakkelijker voor vijanden om de drager te doden.

items.equipment.rings.ringofwealth.name=ring van rijkdom
items.equipment.rings.ringofwealth.stats=Wanneer je deze ring draagt, vergroot je je geluk met _%s%%._
items.equipment.rings.ringofwealth.typical_stats=Wanneer je deze ring draagt, vergroot je doorgaans je geluk met _%s%%._
items.equipment.rings.ringofwealth.combined_stats=Je uitgeruste ringen combineren hun kracht, waardoor je geluk in totaal met _%s%%_ toeneemt.
items.equipment.rings.ringofwealth.upgrade_stat_name_1=Meer Geluk
items.equipment.rings.ringofwealth.desc=Deze ring werkt als een magneet voor schatten, waardoor de kans groter wordt dat vijanden en schatkisten waardevolle voorwerpen bij zich hebben. Een vervloekte ring verkleint in plaats daarvan je kans op het ontvangen van buit.



###scrolls
items.consum.scrolls.scroll.ac_read=LEES
items.consum.scrolls.scroll.kaunan=rol van KAUNAN
items.consum.scrolls.scroll.sowilo=rol van SOWILO
items.consum.scrolls.scroll.laguz=rol van LAGUZ
items.consum.scrolls.scroll.yngvi=rol van YNGVI
items.consum.scrolls.scroll.gyfu=rol van GYFU
items.consum.scrolls.scroll.raido=rol van RAIDO
items.consum.scrolls.scroll.isaz=rol van ISAZ
items.consum.scrolls.scroll.mannaz=rol van MANNAZ
items.consum.scrolls.scroll.naudiz=rol van NAUDIZ
items.consum.scrolls.scroll.berkanan=rol van BERKANAN
items.consum.scrolls.scroll.odal=rol van ODAL
items.consum.scrolls.scroll.tiwaz=rol van TIWAZ
items.consum.scrolls.scroll.unknown_desc=Op dit perkament zijn niet te ontcijferen magische runen geschreven. Wie weet wat het doet als het hardop wordt voorgelezen?
items.consum.scrolls.scroll.blinded=Je kunt geen rol lezen als je verblind bent.
items.consum.scrolls.scroll.no_magic=Je kunt geen rol lezen terwijl je magisch immuum bent.
items.consum.scrolls.scroll.cursed=Je vervloekte spreukenboek zorgt ervoor dat je de magie van deze rol niet kunt oproepen! Een rol van vloekverwijdering kan echter sterk genoeg zijn om nog steeds te werken...
items.consum.scrolls.scroll$placeholder.name=rol

items.consum.scrolls.inventoryscroll.warning=Wil je deze rol echt niet gebruiken? De rol is niet eerder geïdentificeerd, dus wordt deze toch verbruikt.
items.consum.scrolls.inventoryscroll.yes=Ja, ik weet het zeker
items.consum.scrolls.inventoryscroll.no=Nee, ik heb me bedacht

items.consum.scrolls.scrollofidentify.name=rol van identificatie
items.consum.scrolls.scrollofidentify.inv_title=Identificeer een voorwerp
items.consum.scrolls.scrollofidentify.it_is=Je voorwerp is geïdentificeerd: %s.
items.consum.scrolls.scrollofidentify.desc=Deze rol onthult voor altijd alle geheimen van een enkel voorwerp.

items.consum.scrolls.scrolloflullaby.name=rol van slaaplied
items.consum.scrolls.scrolloflullaby.sooth=De rol laat een rustgevende melodie horen. Je voelt je erg slaperig.
items.consum.scrolls.scrolloflullaby.desc=Bij het lezen van deze rol komt een rustgevende melodie vrij die iedereen die het hoort in een diepe magische slaap sust. Voor de lezer en bondgenoten is de slaap herstellend.

items.consum.scrolls.scrollofmagicmapping.name=rol van magische kaartkennis
items.consum.scrolls.scrollofmagicmapping.layout=Je bent nu op de hoogte van de indeling op deze verdieping.
items.consum.scrolls.scrollofmagicmapping.desc=Wanneer deze rol wordt gelezen, wordt een kristalhelder beeld in je geheugen gegrift, waardoor je de precieze indeling van de verdieping en alle verborgen geheimen weet. De plekken van voorwerpen en wezens blijven onbekend.

items.consum.scrolls.scrollofmirrorimage.name=rol van spiegelbeeld
items.consum.scrolls.scrollofmirrorimage.copies=De rol laat spiegelbeelden van jou ontstaan.
items.consum.scrolls.scrollofmirrorimage.no_copies=De rol probeert spiegelbeelden van jou te laten ontstaan, maar ze kunnen nergens heen.
items.consum.scrolls.scrollofmirrorimage.desc=De bezwering op deze rol maakt twee denkbeeldige tweelingen van de lezer. Deze spiegelbeelden fungeren als zwakkere klonen van de lezer en achtervolgen zijn vijanden. Ze hebben echter geen duurzaamheid en vervagen als ze schade worden toegebracht.

items.consum.scrolls.scrollofretribution.name=rol van vergelding
items.consum.scrolls.scrollofretribution.blast=Krachtige magische energie barst uit de rol!
items.consum.scrolls.scrollofretribution.desc=Deze rol bevat destructieve energie die het lijden van de lezer naar buiten kanaliseert in een uitbarsting van kracht. Hoe zwakker de lezer is, hoe meer schade hij aanricht. Bij een zeer lage gezondheid kan deze rol de meeste vijanden onmiddellijk doden.\n\nHet gebruik van de rol eist echter zijn tol van de gebruiker, het verblindt en verzwakt hem.

items.consum.scrolls.scrollofrage.name=rol van woede
items.consum.scrolls.scrollofrage.roar=De rol laat een woedend gebrul horen dat door de kerker weergalmt!
items.consum.scrolls.scrollofrage.desc=Wanneer hardop voorgelezen, ontketent deze rol een groot gebrul dat alle vijanden naar de lezer trekt en nabije vijanden woedend maakt.

items.consum.scrolls.scrollofrecharging.name=rol van opladen
items.consum.scrolls.scrollofrecharging.surge=Een golf van energie stroomt door je lichaam en geeft je toverstokken energie!
items.consum.scrolls.scrollofrecharging.desc=De ruwe magische kracht die in dit perkament zit, zal na verloop van tijd alle toverstokken van de gebruiker opladen wanneer deze worden losgelaten.

items.consum.scrolls.scrollofremovecurse.name=rol van vloekverwijdering
items.consum.scrolls.scrollofremovecurse.inv_title=Een voorwerp opschonen
items.consum.scrolls.scrollofremovecurse.cleansed=Je voorwerp gloeit van een reinigend licht en een kwaadaardige energie verdwijnt in de lucht!
items.consum.scrolls.scrollofremovecurse.not_cleansed=Je voorwerp gloeit van een reinigend licht, maar er gebeurt niets.
items.consum.scrolls.scrollofremovecurse.spirit=Jouw rol bevrijdt de gekwelde geest!
items.consum.scrolls.scrollofremovecurse.desc=De bezwering op deze rol verwijdert onmiddellijk alle vloeken van een enkel wapen, ring, toverstok, harnas of artefact.

items.consum.scrolls.scrollofteleportation.name=rol van teleportatie
items.consum.scrolls.scrollofteleportation.tele=In een oogwenk werd je geteleporteerd naar een andere plek op de verdieping.
items.consum.scrolls.scrollofteleportation.no_tele=De teleportatiemagie mislukt.
items.consum.scrolls.scrollofteleportation.cant_reach=Je kunt daar niet naartoe teleporteren.
items.consum.scrolls.scrollofteleportation.prompt=Kies een plek om naartoe te teleporteren
items.consum.scrolls.scrollofteleportation.desc=De spreuk op dit perkament brengt de lezer onmiddellijk naar een andere plek op de kerkerverdieping. De rol geeft prioriteit aan gebieden waar de lezer nog niet eerder is geweest, hoewel hij niet langs gesloten deuren of barricades kan teleporteren. Het kan echter verborgen deuren onthullen die naar nieuwe gebieden leiden.

items.consum.scrolls.scrollofterror.name=rol van terreur
items.consum.scrolls.scrollofterror.none=De rol straalt een schitterende flits van rood licht uit.
items.consum.scrolls.scrollofterror.one=De rol straalt een schitterende flits van rood licht uit en de %s vlucht!
items.consum.scrolls.scrollofterror.many=De rol straalt een schitterende flits van rood licht uit en de monsters vluchten!
items.consum.scrolls.scrollofterror.desc=Wanneer de rol wordt gelezen, straalt deze een flits van rood licht uit die alle vijanden in je gezichtsveld met angst overweldigt, waarna ze zich omdraaien en vluchten. Het aanvallen van een vluchtende vijand verkort het effect.

items.consum.scrolls.scrolloftransmutation.name=rol van transmutatie
items.consum.scrolls.scrolloftransmutation.inv_title=Een voorwerp transmuteren
items.consum.scrolls.scrolloftransmutation.nothing=Er gebeurt niets interessants.
items.consum.scrolls.scrolloftransmutation.morph=Je voorwerp verandert in iets anders!
items.consum.scrolls.scrolloftransmutation.desc=Deze rol bevat krachtige transmutatiemagie. Bij gebruik op een in aanmerking komend voorwerp verandert het in een ander voorwerp van hetzelfde type. De magie behoudt zelfs opwaarderingen, betoveringen en symbolen. Rollen en drankjes zullen worden omgezet in hun exotische equivalent, en omgekeerd.

items.consum.scrolls.scrollofupgrade.name=rol van opwaardering
items.consum.scrolls.scrollofupgrade.inv_title=Een voorwerp opwaarderen
items.consum.scrolls.scrollofupgrade.weaken_curse=De rol van opwaardering verzwakt de vloek op je voorwerp.
items.consum.scrolls.scrollofupgrade.remove_curse=De rol van opwaardering reinigt de vloek op je voorwerp!
items.consum.scrolls.scrollofupgrade.desc=Met deze rol wordt één item of een set van werpwapens opgewaardeerd. Toverstokken zullen in kracht en aantal ladingen toenemen, wapens en harnassen zullen meer schade aanrichten en blokkeren, en de effecten van ringen zullen toenemen.\n\nHet kan zelfs vloeken verzwakken of soms volledig verdrijven, hoewel het niet zo krachtig is als een rol van vloekverwijdering. Helaas kan de opwaardeermagie ook betoveringen of symbolen op uitrusting van een hoger niveau wissen.



###exotic scrolls
items.consum.scrolls.exotic.exoticscroll.kaunan=exotische rol van KAUNAN
items.consum.scrolls.exotic.exoticscroll.sowilo=exotische rol van SOWILO
items.consum.scrolls.exotic.exoticscroll.laguz=exotische rol van LAGUZ
items.consum.scrolls.exotic.exoticscroll.yngvi=exotische rol van YNGVI
items.consum.scrolls.exotic.exoticscroll.gyfu=exotische rol van GYFU
items.consum.scrolls.exotic.exoticscroll.raido=exotische rol van RAIDO
items.consum.scrolls.exotic.exoticscroll.isaz=exotische rol van ISAZ
items.consum.scrolls.exotic.exoticscroll.mannaz=exotische rol van MANNAZ
items.consum.scrolls.exotic.exoticscroll.naudiz=exotische rol van NAUDIZ
items.consum.scrolls.exotic.exoticscroll.berkanan=exotische rol van BERKANAN
items.consum.scrolls.exotic.exoticscroll.odal=exotische rol van ODAL
items.consum.scrolls.exotic.exoticscroll.tiwaz=exotische rol van TIWAZ
items.consum.scrolls.exotic.exoticscroll.unknown_desc=Op dit zwarte perkament zijn glimmende, niet te ontcijferen magische runen geschreven. Het lijkt uitheems, wie weet wat het doet als het wordt voorgelezen?
items.consum.scrolls.exotic.exoticscroll.discover_hint=Je kunt dit voorwerp maken met behulp van alchemie.

items.consum.scrolls.exotic.scrollofsirenssong.name=rol van het lied van de sirenen
items.consum.scrolls.exotic.scrollofsirenssong.prompt=Kies een doel
items.consum.scrolls.exotic.scrollofsirenssong.no_target=De rol wordt geactiveerd zonder een doel.
items.consum.scrolls.exotic.scrollofsirenssong.cancel=Je moet een doel kiezen.
items.consum.scrolls.exotic.scrollofsirenssong.desc=Als je deze rol leest, klinkt er een verleidelijke melodie die een gerichte vijand boeit en hem permanent in een bondgenoot verandert! Andere vijanden die het horen, zijn tijdelijk gecharmeerd.\n\nBijzonder sterke vijanden kunnen het betoverende effect weerstaan en worden in plaats daarvan gecharmeerd.
items.consum.scrolls.exotic.scrollofsirenssong$enthralled.name=geboeid
items.consum.scrolls.exotic.scrollofsirenssong$enthralled.desc=Dit wezen is betoverd door de magie van een rol van het lied van de sirenen.\n\nEen betoverd personage is permanent je bondgenoot en vecht tegen alle vijanden die je tegenkomt.

items.consum.scrolls.exotic.scrollofantimagic.name=rol van anti-magie
items.consum.scrolls.exotic.scrollofantimagic.desc=De bezwering op deze rol zal je omringen met een magische aura die tijdelijk alle magische effecten blokkeert, schadelijk of nuttig. Dit omvat de meeste magische itemeffecten zoals toverstokken, rollen, ringen, artefacten, betoveringen en vloeken. Heroïsche harnasvaardigheden zijn echter sterk genoeg om hoe dan ook te werken.

items.consum.scrolls.exotic.scrollofchallenge.name=rol van uitdaging
items.consum.scrolls.exotic.scrollofchallenge.desc=Wanneer deze rol hardop wordt voorgelezen, ontketent er een geweldig gebrul dat vijanden naar de lezer trekt en tegelijkertijd een kleine arena om hen heen creëert.\n\nZolang de lezer in deze arena blijft, loopt hij 33% minder schade op van alle bronnen (dit wordt toegepast vóór andere vormen van schadebeperking), en hij verliest geen verzadiging.\n\nDe grootte van de arena groeit mee met de grootte van het gebied waarin de lezer zich bevindt. Het is bijzonder klein in sommige baas-gebieden.
items.consum.scrolls.exotic.scrollofchallenge$challengearena.name=uitdagingsarena
items.consum.scrolls.exotic.scrollofchallenge$challengearena.desc=Er is een magische arena om je heen ontstaan, gemarkeerd door een rode mist.\n\n.Terwijl je in de mist staat, neemt je honger niet toe en loop je 33%% minder schade op van alle bronnen. Als je andere bronnen van schadebeperking hebt (zoals harnassen), zijn deze van toepassing na de 33%% reductie.\n\nResterende beurten: %d.

items.consum.scrolls.exotic.scrollofdivination.name=rol van waarzeggerij
items.consum.scrolls.exotic.scrollofdivination.nothing_left=Er valt niets meer te identificeren!
items.consum.scrolls.exotic.scrollofdivination.desc=Deze rol identificeert willekeurig vier soorten items die je momenteel niet kent. De geïdentificeerde typen kunnen de kleur van een toverdrank zijn, de runen van een rol of de edelsteen van een ring. De geïdentificeerde voorwerpen zijn niet noodzakelijk de voorwerpen die je bij je draagt.
items.consum.scrolls.exotic.scrollofdivination$wnddivination.desc=Je rol van waarzeggerij heeft de volgende voorwerpen geïdentificeerd:

items.consum.scrolls.exotic.scrollofdread.name=rol van angst
items.consum.scrolls.exotic.scrollofdread.desc=Wanneer gelezen, straalt deze rol een flits van rood licht uit die ongelooflijke angst inboezemt bij alle vijanden in je gezichtsveld. Dit effect is zo groot dat de vijanden snel proberen de kerker te ontvluchten, om nooit meer terug gezien te worden!\n\nNet als bij de rol van terreur verdwijnt dit effect na verloop van tijd, of als de vijand wordt aangevallen.\n\nOp vijanden met een sterke wil, zoals eindbazen, werkt het als een rol van terreur.

items.consum.scrolls.exotic.scrollofenchantment.name=rol van betovering
items.consum.scrolls.exotic.scrollofenchantment.inv_title=Een voorwerp betoveren
items.consum.scrolls.exotic.scrollofenchantment.weapon=Kies een betovering om op je wapen toe te passen.
items.consum.scrolls.exotic.scrollofenchantment.armor=Kies een symbool om op je harnas toe te passen.
items.consum.scrolls.exotic.scrollofenchantment.cancel=annuleer
items.consum.scrolls.exotic.scrollofenchantment.cancel_warn=De rol wordt alsnog verbruikt als het effect niet wordt toegepast, weet je het zeker?
items.consum.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Ja, ik weet het zeker
items.consum.scrolls.exotic.scrollofenchantment.cancel_warn_no=Nee, ik heb me bedacht
items.consum.scrolls.exotic.scrollofenchantment.desc=Deze rol voorziet een wapen of harnas van krachtige magische energie. De lezer heeft zelfs een zekere mate van controle over welke magie wordt toegepast.

items.consum.scrolls.exotic.scrollofforesight.name=rol van vooruitziende blik
items.consum.scrolls.exotic.scrollofforesight.desc=Na het lezen van deze rol, worden de details van het nabijgelegen terrein kristalhelder aan de geest van de lezer gevoed. Dit effect houdt een aanzienlijke hoeveelheid tijd aan en onthult alle verborgen deuren of vallen, waardoor zoeken overbodig wordt.

items.consum.scrolls.exotic.scrollofmetamorphosis.name=rol van metamorfose
items.consum.scrolls.exotic.scrollofmetamorphosis.choose_desc=Kies een talent om te metamorfoseren.
items.consum.scrolls.exotic.scrollofmetamorphosis.replace_desc=Kies een nieuw talent om je gemetamorfoseerde talent mee te vervangen.
items.consum.scrolls.exotic.scrollofmetamorphosis.cancel_warn=De rol van metamorfose wordt alsnog verbruikt als het effect niet wordt toegepast, weet je het zeker?
items.consum.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=metamorfoseer talent
items.consum.scrolls.exotic.scrollofmetamorphosis.desc=Deze rol bevat krachtige transmutatiemagie, die van toepassing is op de lezer in plaats van op een voorwerp. Dankzij de magie van deze rol kun je één talent selecteren en vervangen door een van de vijf talenten van hetzelfde niveau uit verschillende heldenklassen!\n\nDit effect kan alleen van toepassing zijn op klassetalenten, niet op talenten die zijn verkregen uit subklassen of harnasvaardigheden. Talenten die je niet kunt gebruiken, worden niet als opties gegeven.

items.consum.scrolls.exotic.scrollofmysticalenergy.name=rol van mystieke energie
items.consum.scrolls.exotic.scrollofmysticalenergy.desc=De ruwe magische kracht die dit perkament bezit laadt, wanneer het wordt vrijgegeven, de gehanteerde artefacten van een gebruiker in de loop van de tijd op.

items.consum.scrolls.exotic.scrollofpassage.name=rol van passage
items.consum.scrolls.exotic.scrollofpassage.desc=De spreuk op dit perkament brengt de lezer onmiddellijk naar de dichtstbijzijnde regio van de verdieping erboven. Erg handig om snel naar een winkel te gaan.

items.consum.scrolls.exotic.scrollofprismaticimage.name=rol van prismatisch beeld
items.consum.scrolls.exotic.scrollofprismaticimage.desc=De bezwering op deze rol creëert een kleurrijke denkbeeldige tweeling van de lezer. Dit prismatische beeld fungeert als een zwakkere kloon van de lezer, met vergelijkbare verdediging maar lagere gezondheid en schade.\n\nHet prismatische beeld toont zichzelf wanneer er vijanden aanwezig zijn en probeert de lezer te verdedigen.\n\nAls er al een prismatisch beeld bestaat, wordt deze door het gebruik van de rol volledig genezen.

items.consum.scrolls.exotic.scrollofpsionicblast.name=rol van paranormale ontploffing
items.consum.scrolls.exotic.scrollofpsionicblast.ondeath=De paranormale ontploffing verscheurt je geest...
items.consum.scrolls.exotic.scrollofpsionicblast.desc=Deze rol bevat ongelooflijke destructieve energie die kan worden gekanaliseerd om de geest van alle zichtbare wezens te vernietigen.\n\nEr is echter een flinke terugslag: de lezer raakt ook beschadigd, verblind en verzwakt. Hoe meer doelen de rol raakt, hoe minder zelfbeschadiging er wordt veroorzaakt.



###spells
items.consum.spells.alchemize.name=alchemiseren
items.consum.spells.alchemize.prompt=Alchemiseer een Voorwerp
items.consum.spells.alchemize.desc=Deze spreuk bevat transmutatieve krachten die vergelijkbaar zijn met die in een alchemiepot. Met elke betovering kan de gebruiker een item (of een stapel items) in goud of alchemistische energie veranderen. Door drankjes of rollen in energie om te zetten, kun je ze zelfs identificeren!\n\nEen paar alchemistische toepassingen worden in winkels verkocht, maar er kunnen er nog veel meer worden gemaakt met behulp van alchemie door een zaadje, runensteen en een beetje alchemistische energie te combineren.
items.consum.spells.alchemize$wndalchemizeitem.sell=Verander in %dg
items.consum.spells.alchemize$wndalchemizeitem.sell_1=Verander 1 in %dg
items.consum.spells.alchemize$wndalchemizeitem.sell_all=Zet alles om in %dg
items.consum.spells.alchemize$wndalchemizeitem.energize=Verander in %d energie
items.consum.spells.alchemize$wndalchemizeitem.energize_1=Verander 1 in %d energie
items.consum.spells.alchemize$wndalchemizeitem.energize_all=Zet alles om in %d energie

items.consum.spells.beaconofreturning.name=baken van terugkeer
items.consum.spells.beaconofreturning.preventing=De sterke magische uitstraling van deze plek verhindert dat je de spreuk gebruikt!
items.consum.spells.beaconofreturning.creatures=De psychische uitstraling van naburige wezens staat je op dit moment niet toe om te teleporteren.
items.consum.spells.beaconofreturning.set=Het baken is ingesteld op je huidige plek.
items.consum.spells.beaconofreturning.wnd_body=De instelling overschrijft de plek waarop het baken eerder was ingesteld.\n\nTerugkeren keert terug naar je laatst ingestelde plek en kost één keer gebruik van de spreuk.
items.consum.spells.beaconofreturning.wnd_set=Instellen
items.consum.spells.beaconofreturning.wnd_return=Terugkeren
items.consum.spells.beaconofreturning.desc_set=Dit baken stond ergens op verdieping %d.
items.consum.spells.beaconofreturning.desc=Deze ingewikkelde spreuk geeft de gebruiker de mogelijkheid om terug te keren naar een ingestelde plek, ongeacht de afstand. De spreuk wordt alleen gebruikt wanneer wordt teruggekeerd. Hij kan zo vaak worden ingesteld als je wilt, maar hij onthoudt alleen de meest recente plek waarop hij was ingesteld.

items.consum.spells.curseinfusion.name=vloek-infusie
items.consum.spells.curseinfusion.inv_title=Vervloek een voorwerp
items.consum.spells.curseinfusion.desc=Deze spreuk voegt aan uitrusting dezelfde krachtige kwaadaardige magie toe die aanwezig is in DM-300. Het voorwerp waarop het wordt gebruikt, wordt onmiddellijk vervloekt en elke betovering of symbool die het heeft gehad, wordt opgeheven.\n\nIn het geval van wapens, harnassen en toverstokken, krijgt het voorwerp behalve vervloeking ook opwaarderingen. Vloek-infusie-opwaarderingen stapelen zich niet op en de opwaarderingen gaan verloren als het voorwerp niet meer vervloekt is.\n\nEr kunnen ook meerdere vloek-infusies worden gebruikt om de vloek op een wapen of harnas te veranderen.

items.consum.spells.spell.ac_cast=SPREEK UIT
items.consum.spells.spell.no_magic=Je kunt geen spreuken uitspreken terwijl je magisch immuun bent.
items.consum.spells.spell.discover_hint=Je kunt dit voorwerp maken met behulp van alchemie.

items.consum.spells.magicalinfusion.name=magische samenvoeging
items.consum.spells.magicalinfusion.inv_title=Een voorwerp samenvoegen
items.consum.spells.magicalinfusion.infuse=Je voorwerp is verrijkt met mysterieuze energie!
items.consum.spells.magicalinfusion.desc=Deze spreuk heeft dezelfde magische kracht als een rol van opwaardering, maar in een stabielere vorm.\n\nNaast het normale effect van het opwaarderen van een voorwerp, wist het nooit een betovering, symbool of een vloek.

items.consum.spells.magicalporter.name=magische drager
items.consum.spells.magicalporter.inv_title=Een voorwerp laten dragen
items.consum.spells.magicalporter.nowhere=Je kunt nergens een voorwerp naartoe laten dragen.
items.consum.spells.magicalporter.desc=Deze spreuk vervoert op magische wijze elk voorwerp waar het op wordt uitgesproken. In tegenstelling tot het baken van de koopman worden de voorwerpen naar de ingang van de volgende baasverdieping getransporteerd.

items.consum.spells.phaseshift.name=faseverschuiving
items.consum.spells.phaseshift.no_target=Er valt daar niets te teleporteren.
items.consum.spells.phaseshift.desc=Deze chaotische spreuk teleporteert elk personage waarop het is gericht naar een willekeurige plek op de huidige verdieping en verdooft ze voor een aanzienlijke tijd. Krachtige vijanden kunnen het verdovende effect weerstaan. Deze spreuk kan gericht zijn op een doelwit of op de gebruiker zelf.

items.consum.spells.reclaimtrap.name=val-absorbering
items.consum.spells.reclaimtrap.no_trap=Er is daar geen val.
items.consum.spells.reclaimtrap.desc_trap=De spreuk is momenteel klaar om een _%s_ te activeren.
items.consum.spells.reclaimtrap.desc=Deze spreuk bevat overblijfselen van de mechanische energie van DM-300. Als je het gebruikt op een actieve val, wordt de kracht van de val aan jou gehecht, zodat je het effect van de val op elke gewenste plek weer kunt activeren.\n\nSommige vallen werken echter niet overal en de spreuk kan slechts één val tegelijk absorberen.

items.consum.spells.recycle.name=recyclen
items.consum.spells.recycle.inv_title=Een voorwerp recyclen
items.consum.spells.recycle.recycled=Je voorwerp is gerecycled tot: %s.
items.consum.spells.recycle.desc=Deze spreuk bevat een mindere vorm van transmutatiemagie. Hoewel het niet werkt op uitrusting, transformeert deze spreuk een rol, toverdrank, zaadje, runensteen of getipt pijltje in een willekeurig voorwerp van hetzelfde type.

items.consum.spells.summonelemental.name=elementaal oproepen
items.consum.spells.summonelemental.ac_imbue=VERRIJK
items.consum.spells.summonelemental.imbue_prompt=Verrijken met een voorwerp
items.consum.spells.summonelemental.desc=Deze spreuk kanaliseert de energie van de elementale sintels die zijn gebruikt om het te maken, en stelt je in staat een vriendelijke elementaal op te roepen om met je te vechten! Er kan slechts één elementaal tegelijk worden opgeroepen, maar de spreuk kan opnieuw worden uitgesproken om het elementaal zonder kosten naar je terug te laten keren.
items.consum.spells.summonelemental.desc_newborn=De spreuk is momenteel niet verrijkt en roept een _pasgeboren elementaal_ op zonder afstand aanval. Je kunt het met een geïdentificeerde toverdrank van vloeibare vlam, toverdrank van vorst, rol van opladen of rol van transmutatie verrijken om de spreuk te versterken, waardoor de volgende oproepen een elementaal met volledige kracht wordt!
items.consum.spells.summonelemental.desc_fire=De spreuk is momenteel heet om aan te raken en zal een _vuur elementaal_ oproepen. Je kunt het met een ander voorwerp verrijken, maar de spreuk verliest dan zijn huidige invloed.
items.consum.spells.summonelemental.desc_frost=De spreuk voelt momenteel koud aan en zal een _vorst elementaal_ oproepen. Je kunt het met een ander voorwerp verrijken, maar de spreuk verliest dan zijn huidige invloed.
items.consum.spells.summonelemental.desc_shock=De spreuk straalt momenteel statische energie uit en zal een _schok elementaal_ oproepen. Je kunt het met een ander voorwerp verrijken, maar de spreuk verliest dan zijn huidige invloed.
items.consum.spells.summonelemental.desc_chaos=De spreuk straalt momenteel chaotische energie uit en zal een _chaos elementaal_ oproepen. Je kunt het met een ander voorwerp verrijken, maar de spreuk verliest dan zijn huidige invloed.

items.consum.spells.targetedspell.prompt=Kies een doel
items.consum.spells.targetedspell.inv_title=Een voorwerp samenvoegen

items.consum.spells.telekineticgrab.name=telekinetische grijper
items.consum.spells.telekineticgrab.cant_grab=Dat kun je niet pakken.
items.consum.spells.telekineticgrab.no_target=Er valt daar niets te pakken.
items.consum.spells.telekineticgrab.desc=Met deze spreuk kan de gebruiker op afstand elk voorwerp van de grond pakken, of elk werpwapen dat aan een vijand vastzit!\n\nHet kan niet worden gebruikt om voorwerpen te grijpen die iemand anders bezit, of om voorwerpen met inhoud zoals kisten te grijpen.

items.consum.spells.unstablespell.name=onstabiele spreuk
items.consum.spells.unstablespell.desc=Dit kleine zwarte vierkante kristal heeft bewegende runensymbolen op elk oppervlak.\n\nIndien geactiveerd, activeert het het effect van een willekeurige rol. Het rol-effect zal gevechtsgericht zijn als er vijanden in je gezichtsveld zijn, en zal anders altijd niet-gevechtsgericht zijn.

items.consum.spells.wildenergy.name=wilde energie
items.consum.spells.wildenergy.desc=Deze spreuk bevat een deel van de vervloekte energie die de DM-300 aandreef. Wanneer het wordt gebruikt, laadt het je toverstokken en versleten artefacten op, terwijl het ook een willekeurig vervloekt toverstokeffect activeert. Je kunt echter een richting kiezen waarin deze vervloekte magie moet schieten.


###runestones
items.consum.stones.inventorystone.ac_use=GEBRUIK

items.consum.stones.runestone$placeholder.name=runensteen
items.consum.stones.runestone.discover_hint=Je kunt dit item zomaar in de kerker vinden, of maak het met alchemie.

items.consum.stones.stoneofaggression.name=steen van agressie
items.consum.stones.stoneofaggression.desc=Wanneer deze steen naar een bondgenoot of vijand wordt gegooid, zullen alle vijanden in de buurt gedurende een korte tijd de voorkeur geven aan het aanvallen van dat personage.\n\nBaasvijanden kunnen niet rechtstreeks door dit effect worden getroffen, maar het werkt wel op hun handlangers.
items.consum.stones.stoneofaggression$aggression.name=doelwit
items.consum.stones.stoneofaggression$aggression.desc=Manipulatieve magie zorgt ervoor dat alle vijanden in de buurt voorkeur geven om dit personage aan te vallen.\n\nResterende beurten: %s.

items.consum.stones.stoneofaugmentation.name=steen van verbetering
items.consum.stones.stoneofaugmentation.inv_title=Een voorwerp verbeteren
items.consum.stones.stoneofaugmentation.desc=Deze runensteen bezit krachtige magie die uitrusting kan versterken om de ene eigenschap te versterken ten koste van de andere. \n\nGebruik op een wapen om de snelheid of schade te verhogen. Werpwapens zullen ook aan duurzaamheid winnen of verliezen in verhouding tot hun snelheid. \n\nGebruik op een harnas om de verdediging of ontwijking te verbeteren.
items.consum.stones.stoneofaugmentation.discover_hint=Je kunt dit voorwerp in een winkel kopen of zelf maken met behulp van alchemie.
items.consum.stones.stoneofaugmentation$wndaugment.choice=Verbetering van de ene eigenschap zal de andere verminderen. Welke eigenschap wil je verbeteren?
items.consum.stones.stoneofaugmentation$wndaugment.already=Dit item is al verbeterd; je kunt de verbetering wisselen of verwijderen.
items.consum.stones.stoneofaugmentation$wndaugment.speed=+Snelheid -Schade
items.consum.stones.stoneofaugmentation$wndaugment.damage=+Schade -Snelheid
items.consum.stones.stoneofaugmentation$wndaugment.evasion=+Ontwijking -Verdediging
items.consum.stones.stoneofaugmentation$wndaugment.defense=+Verdediging -Ontwijking
items.consum.stones.stoneofaugmentation$wndaugment.none=Verwijder verbetering
items.consum.stones.stoneofaugmentation$wndaugment.cancel=Laat maar

items.consum.stones.stoneofblast.name=steen van ontploffing
items.consum.stones.stoneofblast.desc=Deze runensteen ontploft onmiddellijk op de plek waar hij naartoe wordt gegooid. Net als een bom brengt de explosie schade toe aan alles in de buurt.

items.consum.stones.stoneofblink.name=steen van toesnellen
items.consum.stones.stoneofblink.desc=Deze runensteen teleporteert de gebruiker naar de plek waar de steen naartoe wordt gegooid.

items.consum.stones.stoneofclairvoyance.name=steen van helderziendheid
items.consum.stones.stoneofclairvoyance.desc=Deze steen onthult onmiddellijk alle tegels in een zeer groot gebied rondom waar hij wordt gegooid. Het effect reikt zelfs door muren.

items.consum.stones.stoneofdeepsleep.name=steen van diepe slaap
items.consum.stones.stoneofdeepsleep.desc=Wanneer deze steen naar een vijand wordt gegooid, brengt hij het in een diepe magische slaap. Magisch slapende vijanden slapen voor altijd totdat ze gestoord worden.

items.consum.stones.stoneofdetectmagic.name=steen van magie detectie
items.consum.stones.stoneofdetectmagic.inv_title=Detecteer een voorwerp
items.consum.stones.stoneofdetectmagic.detected_none=Er is geen magie waargenomen die dit voorwerp beïnvloedt.
items.consum.stones.stoneofdetectmagic.detected_both=Je voelt beide goede en kwaadaardige magie invloed hebben op dit voorwerp!
items.consum.stones.stoneofdetectmagic.detected_good=Je voelt dat positieve magie dit item beïnvloedt!
items.consum.stones.stoneofdetectmagic.detected_bad=Je voelt dat een kwaadaardige magie invloed heeft op dit voorwerp!
items.consum.stones.stoneofdetectmagic.desc=Deze runensteen kan magie detecteren die een item beïnvloedt. Als je deze steen gebruikt op een onbekend item, weet je of het item is beïnvloed door een kwaadaardige vloek en of het is beïnvloed door positieve magie zoals een betovering of opwaarderingen.

items.consum.stones.stoneofdisarming.name=steen van ontwapening
items.consum.stones.stoneofdisarming.desc=Deze runensteen bevat magie die kwaadaardige vallen kan uitschakelen die in de kerker verborgen zijn. Het ontwapent tot 9 vallen rond het gebied waarnaar het wordt gegooid.

items.consum.stones.stoneofenchantment.name=steen van betovering
items.consum.stones.stoneofenchantment.inv_title=Betover een voorwerp
items.consum.stones.stoneofenchantment.weapon=Je wapen gloeit in de duisternis!
items.consum.stones.stoneofenchantment.armor=Je harnas gloeit in de duisternis!
items.consum.stones.stoneofenchantment.desc=Deze runensteen bezit betoverende magie. In tegenstelling tot een rol van opwaardering, vergroot het de directe kracht van een voorwerp niet. In plaats daarvan verrijkt het een wapen of harnas met een betovering, waardoor het een nieuwe kracht krijgt.

items.consum.stones.stoneoffear.name=steen van angst
items.consum.stones.stoneoffear.desc=Wanneer deze steen op een personage wordt gegooid, worden ze overweldigd door angst en zullen zich omdraaien en vluchten. Als je een vluchtend personage aanvalt, duurt het effect minder lang.

items.consum.stones.stoneofflock.name=steen van kudde
items.consum.stones.stoneofflock.desc=Deze runensteen roept magische schapen op voor een korte tijd rond de plek waar het naartoe wordt gegooid.

items.consum.stones.stoneofintuition.name=steen van intuïtie
items.consum.stones.stoneofintuition.inv_title=Kies een voorwerp
items.consum.stones.stoneofintuition.desc=Deze runensteen bevat een zwakkere versie van de magie die te vinden is in rollen van identificatie. In plaats van een item direct te identificeren, werkt het op je intuïtie, waardoor je kunt proberen het type van een drankje, rol of ring te identificeren door te raden.
items.consum.stones.stoneofintuition.break_info=Je kunt stenen van intuïtie twee keer gebruiken voordat er één kapot gaat. _Bij het volgende gebruik zul je geen steen verbruiken_.
items.consum.stones.stoneofintuition.break_warn=Je hebt eerder een steen van intuïtie gebruikt, dus _je volgende gebruik zal een steen verbruiken_.
items.consum.stones.stoneofintuition$wndguess.text=Raad wat het type van het niet-geïdentificeerde voorwerp is. Als je het goed raadt, wordt het type geïdentificeerd!
items.consum.stones.stoneofintuition$wndguess.correct=Juist. Het type van het voorwerp is geïdentificeerd!
items.consum.stones.stoneofintuition$wndguess.incorrect=Je gok was onjuist.
items.consum.stones.stoneofintuition$wndguess.break=Jouw steen van intuïtie vergaat tot stof...

items.consum.stones.stoneofshock.name=steen van schok
items.consum.stones.stoneofshock.desc=Deze runensteen ontketent een explosie van elektrische energie die alle nabije doelen kort verdooft en de toverstok van de werper oplaadt voor elke treffer.


###trinkets
items.equipment.trinkets.chaoticcenser.name=chaotisch wierookvat
items.equipment.trinkets.chaoticcenser.spew=Je wierookvat staat op het punt om uit te spuwen: %s.
items.equipment.trinkets.chaoticcenser.desc=Na enige tijd in de alchemiepot lijkt het erop dat deze wierookbrandende wierookvat helemaal zelf rook produceert! Deze gassen hopen zich op en zullen in willekeurige richtingen en semi-willekeurige intervallen uit de wierookvat spuiten. Het lijkt in staat om allerlei soorten gassen te produceren, maar je krijgt een waarschuwing vlak voordat de wierookvat wordt geactiveerd.
items.equipment.trinkets.chaoticcenser.typical_stats_desc=Doorgaans zal deze snuisterij ongeveer elke _%d_ beurten een schadelijk gas in de buurt van een vijand voortbrengen. Het gas verschijnt alleen als er vijanden aanwezig zijn. Op hogere niveaus is de kans groter dat deze gassen exotisch en krachtig zijn.
items.equipment.trinkets.chaoticcenser.stats_desc=Op zijn huidig niveau zal deze snuisterij ongeveer elke _%d_ beurten een schadelijk gas in de buurt van een vijand voortbrengen. Het gas verschijnt alleen als er vijanden aanwezig zijn. Op hogere niveaus is de kans groter dat deze gassen exotisch en krachtig zijn.

items.equipment.trinkets.crackedspyglass.name=gebarsten verrekijker
items.equipment.trinkets.crackedspyglass.desc=Deze handtelescoop zou een toonbeeld van groot en nauwkeurig vakmanschap zijn, ware het niet dat er een barst in de lens zit. De verrekijker lijkt je te helpen door nieuwe voorwerpen in de kerker te onthullen, maar door de scheur in de lens zijn de onthulde voorwerpen vrij moeilijk te zien!
items.equipment.trinkets.crackedspyglass.typical_stats_desc=Normaal gesproken heeft deze snuisterij een _%1$s%% kans_ om een extra verborgen item te creëren op elke verdieping die geen eindbaas heeft.
items.equipment.trinkets.crackedspyglass.stats_desc=Op zijn huidig niveau heeft deze snuisterij een _%1$s%% kans_ om een extra verborgen item te creëren op elke verdieping die geen eindbaas heeft.
items.equipment.trinkets.crackedspyglass.stats_desc_upgraded=Op het huidige niveau heeft dit snuisterijtje een _kans van 100%%_ om op elke verdieping die geen eindbaas is een extra verborgen voorwerp te creëren, en een _%1$s%% kans_ om een tweede extra verborgen voorwerp te creëren.

items.equipment.trinkets.dimensionalsundial.name=dimensionale zonnewijzer
items.equipment.trinkets.dimensionalsundial.warning=Je zonnewijzer werpt geen schaduw, je voelt je ongemakkelijk.
items.equipment.trinkets.dimensionalsundial.desc=Deze kleine draagbare zonnewijzer kan op de een of andere manier een schaduw werpen in de diepten van de kerker, zelfs als je hem niet rechtop houdt. Nog vreemder is dat de positie van de schaduw geen relatie lijkt te hebben met de zon in deze wereld. Als er geen schaduw wordt geworpen, lijkt de zonnewijzer gevaar aan te trekken
items.equipment.trinkets.dimensionalsundial.typical_stats_desc=Doorgaans vermindert deze snuisterij de verschijnsnelheid van vijanden met _%1$d%%_ overdag in het echte leven (8.00 - 20.00 uur), en verhoogt de verschijnsnelheid van vijanden met _%2$d%%_ 's nachts (20.00 - 8.00 uur).
items.equipment.trinkets.dimensionalsundial.stats_desc=Op het huidige niveau vermindert deze snuisterij de verschijnsnelheid van vijanden met _%1$d%%_ overdag in het echte leven (8.00 - 20.00 uur), en verhoogt de verschijnsnelheid van vijanden met _%2$d%%_ 's nachts (20.00 - 8.00 uur).

items.equipment.trinkets.exoticcrystals.name=exotische kristallen
items.equipment.trinkets.exoticcrystals.desc=Deze kleine roze kristallen hebben dezelfde vorm als kristallen van alchemistische energie. Hoewel ze niet rechtstreeks voor energie kunnen worden gebruikt, lijken ze op de een of andere manier de drankjes en rollen die je tegenkomt te beïnvloeden
items.equipment.trinkets.exoticcrystals.typical_stats_desc=Doorgaans zal deze snuisterij _%s%%_ van drankjes of rollen die je tegenkomt vervangen door hun exotische equivalenten. Dit heeft geen invloed op toverdrank van kracht, rol van opwaardering of items die worden gegenereerd om gevarenkamers op te lossen.
items.equipment.trinkets.exoticcrystals.stats_desc=Op het huidige niveau zal deze snuisterij _%s%%_ van drankjes of rollen die je tegenkomt vervangen door hun exotische equivalenten. Dit heeft geen invloed op toverdrank van kracht, rol van opwaardering of items die worden gegenereerd om gevarenkamers op te lossen.

items.equipment.trinkets.eyeofnewt.name=oog van een salamander
items.equipment.trinkets.eyeofnewt.desc=Het oog van deze goud-zwarte salamander is een veelgebruikt ingrediënt, nu verbeterd tot een snuisterij. Het oog lijkt je gezichtsvermogen te verminderen in ruil voor het feit dat je de dingen op andere manieren kunt zien.
items.equipment.trinkets.eyeofnewt.typical_stats_desc=Doorgaans verkleint deze snuisterij je zichtbereik met _%1$s%%_, maar geeft je ook geestvisie op vijanden binnen _%2$d_ tegels.
items.equipment.trinkets.eyeofnewt.stats_desc=Op het huidige niveau verkleint deze snuisterij je zichtbereik met _%1$s%%_, maar geeft je ook geestvisie op vijanden binnen _%2$d_ tegels.

items.equipment.trinkets.ferrettuft.name=frettenplukje
items.equipment.trinkets.ferrettuft.desc=Een plukje zachte witte frettenvacht, bij elkaar gehouden door een limoenkleurig lintje vastgebonden in een strik. Fretten staan bekend om hun behendigheid, ondeugendheid en gebrek aan integriteit. Een deel van die kracht lijkt van de snuisterij af te stralen, waardoor ontwijking van alles in de buurt verbeterd.
items.equipment.trinkets.ferrettuft.typical_stats_desc=Doorgaans zal deze snuisterij de ontwijkingskans van alle personages met _%1$s%%_ verhogen.
items.equipment.trinkets.ferrettuft.stats_desc=Op het huidige niveau zal deze  snuisterij de ontwijkingskans van alle personages met _%1$s%%_ verhogen.

items.equipment.trinkets.mimictooth.name=tand van een nabootser
items.equipment.trinkets.mimictooth.desc=Deze grote scherpe tand moet getrokken zijn uit een zeer ongelukkige nabootser. Het lijkt de nabootsers van de kerker te beïnvloeden, waardoor ze frequenter en gevaarlijker worden.
items.equipment.trinkets.mimictooth.typical_stats_desc=Doorgaans zal deze snuisterij allerlei soorten nabootsers _%1$sx_ gebruikelijker maken, nabootsers veel moeilijker te detecteren maken en elke verdieping een _%2$s%%_ kans geven om een extra onopvallende ebbenhouten nabootser te bevatten.
items.equipment.trinkets.mimictooth.stats_desc=Op het huidige niveau zal deze snuisterij allerlei soorten nabootsers _%1$sx_ gebruikelijker maken, nabootsers veel moeilijker te detecteren maken en elke verdieping een _%2$s%%_ kans geven om een extra onopvallende ebbenhouten nabootser te bevatten.

items.equipment.trinkets.mossyclump.name=bemoste massa
items.equipment.trinkets.mossyclump.desc=Deze massa nat mos lijkt zijn vocht vast te houden, hoe hard je er ook in knijpt. Het lijkt op magische wijze verbonden te zijn met de kerker zelf, waardoor de kans groter is dat gras en water verschijnen
items.equipment.trinkets.mossyclump.typical_stats_desc=Doorgaans zal deze snuisterij ervoor zorgen dat _%d%%_ van themaloze vloeren gevuld worden met water of gras..\n\nDeze snuisterij kost een grotere hoeveelheid energie om op te waarderen.
items.equipment.trinkets.mossyclump.stats_desc=Op het huidige niveau zal deze snuisterij ervoor zorgen dat _%d%%_ van themaloze vloeren gevuld worden met water of gras..\n\nDeze snuisterij kost een grotere hoeveelheid energie om op te waarderen.

items.equipment.trinkets.parchmentscrap.name=perkament rest
items.equipment.trinkets.parchmentscrap.desc=Dit kleine stukje perkament ziet eruit alsof het uit een boekrol komt. Het heeft een deel van zijn magie behouden en lijkt de wapens en bepantsering in de kerker te beïnvloeden
items.equipment.trinkets.parchmentscrap.typical_stats_desc=Doorgaans zal deze snuisterij betoveringen en symbolen _%dx_ vaker laten voorkomen, en vloeken op wapens en bepantsering _%sx_ vaker laten voorkomen. Vervloekingen op toverstokken, ringen of artefacten worden niet beïnvloed.\n\nDeze snuisterij kost een grotere hoeveelheid energie om op te waarderen.
items.equipment.trinkets.parchmentscrap.stats_desc=Op het huidige niveau zal deze snuisterij betoveringen en symbolen _%dx_ vaker laten voorkomen, en vloeken op wapens en bepantsering _%sx_ vaker laten voorkomen. Vervloekingen op toverstokken, ringen of artefacten worden niet beïnvloed.\n\nDeze snuisterij kost een grotere hoeveelheid energie om op te waarderen.

items.equipment.trinkets.petrifiedseed.name=versteend zaad
items.equipment.trinkets.petrifiedseed.desc=Dit zaad is gefossiliseerd, hetzij door langzame geologische processen, hetzij door magie. Het zaad lijkt op magische wijze de flora van de kerker te beïnvloeden, waarbij af en toe plantenzaden worden vervangen door runenstenen.
items.equipment.trinkets.petrifiedseed.typical_stats_desc=Doorgaans zal deze snuisterij  ervoor zorgen dat vertrapt gras in _%1$s%%_ van de gevallen runenstenen laat vallen in plaats van zaden, en ook dat hoog gras in _%2$s%%_ van de gevallen voorwerpen laat vallen.
items.equipment.trinkets.petrifiedseed.stats_desc=Op zijn huidige niveau zal deze snuisterij ervoor zorgen dat vertrapt gras in _%1$s%%_ van de gevallen runenstenen laat vallen in plaats van zaden, en ook dat hoog gras in _%2$s%%_ van de gevallen voorwerpen laat vallen.

items.equipment.trinkets.ratskull.name=schedel van een rat
items.equipment.trinkets.ratskull.desc=Deze macabere snuisterij is niet veel groter dan de schedel van een normale rat, wat op de een of andere manier een zeldzaamheid is in deze kerker. De magische invloed van de schedel lijkt de zeldzamere bewoners van de kerker aan te trekken, waardoor ze veel vaker verschijnen.
items.equipment.trinkets.ratskull.typical_stats_desc=Doorgaans zal deze snuisterij ervoor zorgen dat zeldzame exotische vijanden _%dx_ zo waarschijnlijk kunnen verschijnen. De schedel is echter slechts half zo effectief in het aantrekken van kristallen nabootsers en gepantserde beelden.
items.equipment.trinkets.ratskull.stats_desc=Op het huidige niveau zal deze snuisterij ervoor zorgen dat zeldzame exotische vijanden _%dx_ zo waarschijnlijk kunnen verschijnen. De schedel is echter slechts half zo effectief in het aantrekken van kristallen nabootsers en gepantserde beelden.

items.equipment.trinkets.saltcube.name=zout blokje
items.equipment.trinkets.saltcube.desc=Deze grote zoutkristal werd in een bijna perfecte kubusvorm gesneden en slaagde er op de een of andere manier in om de helft van het water uit de alchemiepot te laten lopen in plaats van op te lossen. Het lijkt op magische wijze het voedsel dat je eet te dehydrateren en te conserveren, waardoor je langer een vol gevoel hebt, maar ook je herstel van je gezondheid wordt vertraagd als je niet verhongert.
items.equipment.trinkets.saltcube.typical_stats_desc=Doorgaans zal deze snuisterij de tijd voordat je honger krijgt met _%1$s%%_ verlengen, maar het zal ook de mate waarin je gezondheid herstelt met _%2$s%%_ verminderen. Tenzij de verdieping vergrendeld is.
items.equipment.trinkets.saltcube.stats_desc=Op het huidige niveau zal deze snuisterij de tijd voordat je honger krijgt met _%1$s%%_ verlengen, maar ook de snelheid waarmee je gezondheid herstelt met _%2$s%%_ verlagen. Tenzij de verdieping vergrendeld is.

items.equipment.trinkets.shardofoblivion.name=scherf van vergetelheid
items.equipment.trinkets.shardofoblivion.desc=Na het stoven in de alchemiepot is dit kleine scherfje vervloekt metaal veranderd in... niets? Licht lijkt eromheen te buigen en het blijft op zijn plaats zweven als je het niet vasthoudt. Het scherfje lijkt op magische wijze kracht te putten uit je onwetendheid, dus het is waarschijnlijk het beste om er niet te veel over na te denken.
items.equipment.trinkets.shardofoblivion.typical_stats_desc=Doorgaans verhoogt deze snuisterij de ratio waarmee vijanden buit laten vallen met 20%% voor elk ongeïdentificeerd item dat je hebt uitgerust of recent hebt gebruikt, tot een maximum van _%d voorwerp(en)_. De scherf voorkomt ook dat je automatisch uitrusting identificeert, maar kan worden gebruikt om handmatig items te identificeren die er klaar voor zijn.
items.equipment.trinkets.shardofoblivion.stats_desc=Op het huidige niveau verhoogt deze snuisterij de ratio waarmee vijanden buit laten vallen met 20%% voor elk ongeïdentificeerd item dat je hebt uitgerust of recent hebt gebruikt, tot een maximum van _%d voorwerp(en)_. De scherf voorkomt ook dat je automatisch uitrusting identificeert, maar kan worden gebruikt om handmatig items te identificeren die er klaar voor zijn.
items.equipment.trinkets.shardofoblivion.ac_identify=IDENTIFICEREN
items.equipment.trinkets.shardofoblivion.identify_prompt=Identificeer een Item
items.equipment.trinkets.shardofoblivion.identify_ready=Een item is klaar om te geïdentificeerd te worden: %s. Gebruik je scherf van vergetelheid erop om het te identificeren.
items.equipment.trinkets.shardofoblivion.identify_ready_worn=Je gedragen items zijn nu allemaal klaar om te geïdentificeerd te worden. Gebruik je scherf van vergetelheid op items om ze te identificeren.
items.equipment.trinkets.shardofoblivion.identify_not_yet=Dat item kan nog niet geïdentificeerd worden.
items.equipment.trinkets.shardofoblivion.identify=Je identificeert het item!
items.equipment.trinkets.shardofoblivion$wandusetracker.name=Ongeïdentificeerde Toverstaf Gebruikt
items.equipment.trinkets.shardofoblivion$wandusetracker.desc=Je hebt onlangs een ongeïdentificeerde toverstok gebruikt, die voor een tijdje geldt als een stuk gebruikte, ongeïdentificeerde uitrusting voor de scherf van de vergetelheid.\n\nResterende beurten: %s.
items.equipment.trinkets.shardofoblivion$thrownusetracker.name=Onbekend werpwapen gebruikt
items.equipment.trinkets.shardofoblivion$thrownusetracker.desc=Je hebt onlangs een ongeïdentificeerd werpwapen gebruikt, wat een tijdje telt als één stuk ongeïdentificeerde uitrusting voor de scherf van vergetelheid.\n\nResterende beurten: %s.

items.equipment.trinkets.thirteenleafclover.name=klavertje dertien
items.equipment.trinkets.thirteenleafclover.desc=Op de een of andere manier heeft het stomen in de alchemiepot ervoor gezorgd dat deze klaver een bosje extra bladeren heeft gekregen! Het is niet echt duidelijk of deze snuisterij geluk of pech brengt, misschien zal deze snuisterij je geluk chaotischer maken?
items.equipment.trinkets.thirteenleafclover.typical_stats_desc=Doorgaans zorgt deze snuisterij ervoor dat je _%1$d%%_ van de tijd maximale schade aanricht, en _%2$d%%_ van de tijd de minimale schade.
items.equipment.trinkets.thirteenleafclover.stats_desc=Op het huidige niveau zorgt deze snuisterij ervoor dat je _%1$d%%_ van de tijd maximale schade aanricht, en _%2$d%%_ van de tijd de minimale schade.

items.equipment.trinkets.trapmechanism.name=valmechanisme
items.equipment.trinkets.trapmechanism.desc=Het kernmechanisme van een van de valkuilen van de kerker, zorgvuldig uit de vloer gesneden zodat deze kan worden gedragen. Het lijkt op magische wijze verbonden te zijn met de kerker zelf, waardoor gevaarlijk terrein vaker voorkomt, maar ook je affiniteit ermee toeneemt.
items.equipment.trinkets.trapmechanism.typical_stats_desc=Dorgaans zal deze snuisterij ervoor zorgen dat _%1$d%%_ van de themaloze vloeren gevuld worden met vallen of afgronden. Bovendien zullen _%2$d%%_ van de verborgen vallen van de kerker zichtbaar zijn.
items.equipment.trinkets.trapmechanism.stats_desc=Op het huidige niveau zal deze snuisterij ervoor zorgen dat _%1$d%%_ van de themaloze vloeren gevuld worden met vallen of afgronden. Bovendien zullen _%2$d%%_ van de verborgen vallen van de kerker zichtbaar zijn.

items.equipment.trinkets.vialofblood.name=flesje met bloed
items.equipment.trinkets.vialofblood.desc=Dit dunne flesje bevat het bloed van een bewoner van de kerker, het beweegt langzaam als je het flesje draait. Het lijkt op magische wijze helende effecten te versterken, maar ze ook te vertragen.
items.equipment.trinkets.vialofblood.typical_stats_desc=Doorgaans verhoogt deze snuisterij de algehele gezondheid die je krijgt door het drinken van genezingsdrankjes, waterzakken of bronnen met _%1$s%%_. Deze helende effecten zullen echter ook langzamer optreden, en regenereren maximaal _%2$s_ gezondheid per beurt (dit schaalt met heldenniveau).
items.equipment.trinkets.vialofblood.stats_desc=Op het huidige niveau verhoogt deze snuisterij de algehele gezondheid die je krijgt door het drinken van genezingsdrankjes, waterzakken of bronnen met _%1$s%%_. Deze helende effecten zullen echter ook langzamer optreden, en regenereren maximaal _%2$s_ gezondheid per beurt (dit schaalt met heldenniveau).

items.equipment.trinkets.wondrousresin.name=wonderbaarlijk hars
items.equipment.trinkets.wondrousresin.desc=Deze glinsterende blauwe hars lijkt de gedistilleerde essentie van de magie van een vervloekte toverstok te hebben. De magie van de alchemiepot leek het enigszins te stabiliseren, en het heeft nu invloed op je toverstokken
items.equipment.trinkets.wondrousresin.typical_stats_desc=Doorgaans zal deze snuisterij ervoor zorgen dat de effecten van vervloekte toverstokken _%1$s%%_ van de tijd neutraal of positief worden, en zal ervoor zorgen dat onvervloekte toverstokken _%2$s%%_ van de tijd een neutrale of positief vervloekte schicht afvuren.\n\nDeze snuisterij kost een grotere hoeveelheid energie om op te waarderen.
items.equipment.trinkets.wondrousresin.stats_desc=Op het huidige niveau zal deze snuisterij ervoor zorgen dat de effecten van vervloekte toverstokken _%1$s%%_ van de tijd neutraal of positief worden, en zal ervoor zorgen dat onvervloekte toverstokken _%2$s%%_ van de tijd een neutrale of positief vervloekte schicht afvuren.\n\nDeze snuisterij kost een grotere hoeveelheid energie om op te waarderen.

items.equipment.trinkets.trinketcatalyst.name=magische katalysator
items.equipment.trinkets.trinketcatalyst.window_title=een snuisterij maken
items.equipment.trinkets.trinketcatalyst.window_text=Het water begint te gloeien terwijl je de katalysator toevoegt. Er zijn een paar items in de buurt die je van energie kunt voorzien om er een magische snuisterij van te maken.
items.equipment.trinkets.trinketcatalyst.desc=Deze bal van magisch goudkleurig stof glinstert in de duisternis van de kerker. Deze katalysator kan met een beetje alchemistische energie in een alchemiepot worden gebruikt om een unieke snuisterij te produceren.\n\nSnuisterijen bieden verschillende effecten die de kerker of zijn bewoners enigszins veranderen. Snuisterijen kunnen worden opgewaardeerd met meer energie om hun effect krachtiger te maken, of men kan het laten vallen om het effect volledig te laten verdwijnen.
items.equipment.trinkets.trinketcatalyst$randomtrinket.name=willekeurige snuisterij
items.equipment.trinkets.trinketcatalyst$randomtrinket.desc=Een item in de buurt zit vast in een zakje dat je niet open krijgt.\n\nHet alchemieproces zal het zakje oplossen, maar je weet niet welke snuisterij je krijgt totdat je het doet!

items.equipment.trinkets.trinket.discover_hint=Dit voorwerp kan een optie zijn wanneer je een snuisterij maakt via alchemie.
items.equipment.trinkets.trinket$placeholder.name=snuisterij

###wands
items.equipment.wands.cursedwand.ondeath=Je bent gedood door je eigen %s.
items.equipment.wands.cursedwand.nothing=Er gebeurt niets.
items.equipment.wands.cursedwand.mass_invuln=Er straalt schitterend licht uit jouw toverstaf!
items.equipment.wands.cursedwand.petrify=Je bevriest plotseling vast op je plek!
items.equipment.wands.cursedwand.grass=Gras groeit wild om je heen!
items.equipment.wands.cursedwand.fire=Je ruikt iets branden...
items.equipment.wands.cursedwand.transmogrify_wand=Je toverstok verandert in een ander voorwerp!
items.equipment.wands.cursedwand.transmogrify_other=Je voorwerp verandert in iets anders!
items.equipment.wands.cursedwand.disguise=Je uiterlijk verandert voor je ogen!
items.equipment.wands.cursedwand.supernova=Een vlammende bal van energie begint te groeien. Misschien is het beter om te vluchten!
items.equipment.wands.cursedwand.supernova_positive=Er begint een gloeiende energiebal te groeien, maar het voelt op de een of andere manier veilig.
items.equipment.wands.cursedwand.sinkhole=De grond begint weg te zakken om je heen!
items.equipment.wands.cursedwand.sinkhole_positive= De grond begint te bezwijken, maar voelt stevig genoeg onder je.
items.equipment.wands.cursedwand.gravity=De zwaartekracht begint plotseling in willekeurige richtingen te trekken!
items.equipment.wands.cursedwand.gravity_positive=De zwaartekracht begint plotseling in willekeurige richtingen te trekken, maar dit lijkt geen invloed op jou te hebben.
items.equipment.wands.cursedwand.gravity_end=De zwaartekrachtchaos is voorbij.

items.equipment.wands.damagewand.upgrade_stat_name_1=Magische Schade

items.equipment.wands.wand.ac_zap=SCHIET
items.equipment.wands.wand.fizzles=Je toverstok sputtert; het heeft niet genoeg lading.
items.equipment.wands.wand.no_magic=Je toverstok sputtert; je kunt geen toverstokken gebruiken terwijl je magisch immuun bent.
items.equipment.wands.wand.self_target=Je kan niet op jezelf richten!
items.equipment.wands.wand.identify=Je hebt je toverstok voldoende gebruikt om hem te identificeren.
items.equipment.wands.wand.resin_one=Deze toverstok heeft _1 niveau_ gewonnen door mysterieuze hars.
items.equipment.wands.wand.resin_many=Deze toverstok heeft _%d niveaus_ gewonnen door mysterieuze hars.
items.equipment.wands.wand.cursed=Deze toverstok is vervloekt, waardoor zijn magie chaotisch en willekeurig is.
items.equipment.wands.wand.not_cursed=Deze toverstok is vrij van kwaadaardige magie.
items.equipment.wands.wand.curse_discover=Deze %s is vervloekt!
items.equipment.wands.wand.prompt=Kies een plek om te schieten
items.equipment.wands.wand$placeholder.name=toverstok

items.equipment.wands.wandofblastwave.name=toverstok van schokgolf
items.equipment.wands.wandofblastwave.staff_name=staf van schokgolf
items.equipment.wands.wandofblastwave.ondeath=Je hebt zelfmoord gepleegd met je eigen toverstaf van schokgolf...
items.equipment.wands.wandofblastwave.knockback_ondeath=De botsing doodde je...
items.equipment.wands.wandofblastwave.desc=Deze toverstok is gemaakt van een soort gemarmerde steen, met gouden bies en een ronde zwarte edelsteen aan de punt. Hij voelt erg zwaar in je hand.
items.equipment.wands.wandofblastwave.typical_stats_desc=Deze toverstaf schiet een bliksemschicht af die met geweld op een doellocatie ontploft. De kracht van deze explosie veroorzaakt doorgaans _%1$d-%2$dschade_ en is sterk genoeg om de meeste vijanden door de lucht te laten vliegen.
items.equipment.wands.wandofblastwave.stats_desc=Deze toverstok schiet een schicht af die met geweld ontploft op de doellocatie. De kracht van deze explosie richt _%1$d-%2$d schade_ aan en is sterk genoeg om de meeste vijanden weg te duwen.
items.equipment.wands.wandofblastwave.upgrade_stat_name_2=Terugslag
items.equipment.wands.wandofblastwave.bmage_desc=Wanneer _de Strijdmagiër_ een verlamde vijand raakt met een staf van schokgolf, zal hij de verlamming consumeren en een explosie van bonusmagische schade toebrengen. Dit heeft een korte afkoeltijd per vijand.
items.equipment.wands.wandofblastwave.eleblast_desc=Een elementale explosie met een staf van schokgolf richt 67% schade aan en slaat alle vijanden buiten het explosiegebied.

items.equipment.wands.wandofcorrosion.name=toverstok van corrosie
items.equipment.wands.wandofcorrosion.staff_name=staf van corrosie
items.equipment.wands.wandofcorrosion.desc=Deze toverstok heeft een asgrauwe buitenkant die uitmondt in een schitterende oranje edelsteen.
items.equipment.wands.wandofcorrosion.stats_desc=Deze toverstok schiet een schicht af die explodeert in een wolk van zeer bijtend gas op een gerichte plek. Alles wat binnen deze wolk wordt gevangen, loopt in de tijd toenemende schade op, beginnend bij _%d schade._
items.equipment.wands.wandofcorrosion.upgrade_stat_name_1=Corrosieschade
items.equipment.wands.wandofcorrosion.upgrade_stat_name_2=Gas Volume
items.equipment.wands.wandofcorrosion.bmage_desc=Wanneer _de Strijdmagiër_ een vijand treft met een staf van corrosie, heeft de vijand een kans om besmeurd te raken.
items.equipment.wands.wandofcorrosion.eleblast_desc=Een elementale explosie met een staf van corrosie bezorgt vijanden 4 beurten van corrosie, beginnend bij 6 schade.

items.equipment.wands.wandofcorruption.name=toverstok van corruptie
items.equipment.wands.wandofcorruption.staff_name=staf van corruptie
items.equipment.wands.wandofcorruption.already_corrupted=Dat personage is niet verder te beïnvloeden.
items.equipment.wands.wandofcorruption.desc=Deze toverstok straalt chaotische donkere energie uit, wat ook duidelijk wordt door de kleine decoratieve schedel die is vormgegeven op zijn punt.
items.equipment.wands.wandofcorruption.stats_desc=Deze toverstok geeft een explosie van corrupte energie vrij die vijanden zwakker maakt en ze uiteindelijk naar je hand zet. Vijanden kunnen de corruptie weerstaan, maar verzwakte vijanden zijn veel gemakkelijker te corrumperen dan gezonde.
items.equipment.wands.wandofcorruption.upgrade_stat_name_1=Corrumperende Macht
items.equipment.wands.wandofcorruption.upgrade_stat_name_2=Negatief Effect Duur
items.equipment.wands.wandofcorruption.bmage_desc=Wanneer _de Strijdmagiër_ een vijand treft met een staf van corruptie, heeft de vijand een kans om razend te worden.
items.equipment.wands.wandofcorruption.eleblast_desc=Een elementale explosie met een staf van corruptie bezorgt vijanden 5 beurten razenij.

items.equipment.wands.wandofdisintegration.name=toverstok van desintegratie
items.equipment.wands.wandofdisintegration.staff_name=staf van desintegratie
items.equipment.wands.wandofdisintegration.desc=Deze toverstaf is gemaakt van een stevig, glad stuk obsidiaan, met een dieppaars licht dat langs de zijkant loopt en eindigt bij de punt. Het gloeit van destructieve energie, wachtend om te gaan schieten.
items.equipment.wands.wandofdisintegration.stats_desc=Deze toverstok schiet een straal af die elk obstakel doorboort, en reikt verder naarmate hij meer wordt opgewaardeerd. De straal richt _%1$d-%2$d schade aan,_ en brengt ook bonusschade toe voor elke vijand en muur die hij doordringt.
items.equipment.wands.wandofdisintegration.upgrade_stat_name_2=Maximaal Bereik
items.equipment.wands.wandofdisintegration.bmage_desc=Wanneer gebruikt door _de Strijdmagiër_, krijgt een staf van desintegratie een vergroot aanvalsbereik, alsof het een projecterende betovering heeft.
items.equipment.wands.wandofdisintegration.eleblast_desc=Een elementale explosie met een staf van desintegratie richt 100% schade aan en doorboort muren.

items.equipment.wands.wandoffireblast.name=toverstok van vuurstraal
items.equipment.wands.wandoffireblast.staff_name=staf van vuurstraal
items.equipment.wands.wandoffireblast.desc=Deze toverstok is gemaakt van rood gelakt hout met gouden blad dat rijkelijk is gebruikt om het er vorstelijk uit te laten zien. Het knettert en sist aan de punt, gretig om zijn krachtige magie te ontketenen.
items.equipment.wands.wandoffireblast.stats_desc=Deze toverstok schiet vuur in een kegelvorm wanneer hij wordt gebruikt. De volgende aanval verbruikt _%1$d ladingen_ en richt _%2$d-%3$d schade aan._ Hoe meer ladingen de toverstok gebruikt, hoe groter en sterker het effect.
items.equipment.wands.wandoffireblast.upgrade_stat_name_1=1 Lading Schade
items.equipment.wands.wandoffireblast.upgrade_stat_name_2=2 Ladingen Schade
items.equipment.wands.wandoffireblast.upgrade_stat_name_3=3 Ladingen Schade
items.equipment.wands.wandoffireblast.bmage_desc=Wanneer _de Strijdmagiër_ een vijand raakt met een staf van vuurstraal, bestaat de kans dat hij een explosie veroorzaakt die vijanden beschadigt en al het vuur in de buurt consumeert! Deze kans neemt toe naarmate er meer vuur in de buurt van de vijand is.
items.equipment.wands.wandoffireblast.eleblast_desc=Een elementale explosie met een staf van vuurstraal richt 100% schade aan, breekt deuren open en zet vijanden en terrein in brand.

items.equipment.wands.wandoffrost.name=toverstaf van vorst
items.equipment.wands.wandoffrost.staff_name=staf van vorst
items.equipment.wands.wandoffrost.desc=Deze toverstok lijkt gemaakt te zijn van een soort magisch ijs. Het wordt helderder naar zijn afgeronde punt toe. Het voelt erg koud aan als je het vasthoudt, maar op de een of andere manier blijft je hand warm.
items.equipment.wands.wandoffrost.stats_desc=Deze toverstok schiet ijzige energie naar je vijanden, brengt _%1$d-%2$d schade_ en koelt ze af. Het effect lijkt sterker in water. Vijanden die al gekoeld of bevroren zijn, krijgen minder schade van deze toverstok.
items.equipment.wands.wandoffrost.upgrade_stat_name_2=Bevriezing duur
items.equipment.wands.wandoffrost.bmage_desc=Wanneer _de Strijdmagiër_ een gekoelde vijand slaat met een staf van ijs, hebben ze een kans om onmiddellijk te bevriezen. Deze kans wordt groter naarmate ze gekoeld zijn.
items.equipment.wands.wandoffrost.eleblast_desc=Een elementale ontploffing met een staf van ijs richt 100% schade aan, bevriest vijanden en dooft branden.

items.equipment.wands.wandoflightning.name=toverstok van bliksem
items.equipment.wands.wandoflightning.staff_name=staf van bliksem
items.equipment.wands.wandoflightning.ondeath=Je hebt zelfmoord gepleegd met je eigen staf van bliksem...
items.equipment.wands.wandoflightning.desc=Deze toverstaf is gemaakt van massief metaal, waardoor hij verrassend zwaar is. Twee uitsteeksels buigen samen aan de punt en elektriciteit springt in bogen heen en weer.
items.equipment.wands.wandoflightning.stats_desc=Deze toverstok vuurt krachtige bliksemstralen af waar hij op wordt gericht, waarbij _%1$d-%2$d schade wordt aangericht._ Deze elektriciteit vormt een boog naar nabije personages en verspreidt zich gemakkelijker in water. De bogen van deze toverstok kunnen je beschadigen, maar doen je bondgenoten geen pijn.
items.equipment.wands.wandoflightning.bmage_desc=Wanneer _de Strijdmagiër_ een vijand met een staf van bliksem raakt, heeft hij de kans om zichzelf 10 beurten lang elektrisch op te laden. Zolang de Strijdmagiër is opgeladen, is hij immuun voor bliksemschade en zal hij de bliksem verder afvuren.
items.equipment.wands.wandoflightning.eleblast_desc=Een elementale explosie met een bliksemstaf richt 100% schade aan, verdooft vijanden gedurende 5 beurten en zet water onder stroom.
items.equipment.wands.wandoflightning$lightningcharge.name=Elektrisch geladen
items.equipment.wands.wandoflightning$lightningcharge.desc=De Strijdmagiër is momenteel opgeladen met energie, waardoor hij immuun is voor schade door zijn staf van bliksem en het bereik van de bliksem die ervan af kan schieten wordt vergroot.\n\nResterende beurten: %s.

items.equipment.wands.wandoflivingearth.name=toverstok van levende aarde
items.equipment.wands.wandoflivingearth.staff_name=staf van levende aarde
items.equipment.wands.wandoflivingearth.desc=Deze toverstok is gemaakt van een merkwaardige rots, met banden van gloeiende gele energie. De rotsen lijken iets te verschuiven als je de toverstok vastpakt, alsof ze je hand kunnen voelen.
items.equipment.wands.wandoflivingearth.stats_desc=Deze toverstok stuurt schichten van magische rots naar vijanden, waarbij _%1$d-%2$d schade wordt toegebracht._ De rotsen vormen zich daarna rond de gebruiker, waardoor deze bepantsering krijgt in verhouding tot de toegebrachte schade. Als er genoeg bepantsering is opgebouwd, verandert het zich in een rotsen beschermer wanneer er de volgende keer met de toverstok wordt geschoten.
items.equipment.wands.wandoflivingearth.upgrade_stat_name_2=Bewaker Maximale gezondheid
items.equipment.wands.wandoflivingearth.upgrade_stat_name_3=Blokkering door Bewaker
items.equipment.wands.wandoflivingearth.bmage_desc=Wanneer _de Strijdmagiër_ een vijand treft met een staf van levende aarde, wordt een deel van de toegebrachte schade teruggegeven als rotspantser.
items.equipment.wands.wandoflivingearth.eleblast_desc=Een elementale explosie met een staf van levende aarde richt 50% schade aan en geneest een actieve aarden beschermer voor elke vijandelijke treffer.
items.equipment.wands.wandoflivingearth$rockarmor.name=rotspantser
items.equipment.wands.wandoflivingearth$rockarmor.desc=Magische rotsen omringen je lichaam. Wanneer je wordt aangevallen proberen ze te blokkeren en verminderen ze de schade die je oploopt met 50%%. Elke geblokkeerde schade schraapt echter een deel van de steen weg.\n\nResterend pantser: %1$d.\n\nAls er genoeg steen om je heen is gebouwd, zorgt het volgende gebruik van je toverstok van levende aarde ervoor dat de rotsen zich vormen tot een beschermer die voor je vecht.\n\nBepantsering nodig voor Beschermer: %2$d.
items.equipment.wands.wandoflivingearth$rockarmor.desc_many=Deze aarden beschermer profiteert ook van de Kracht van Velen. Resterende beurten: %d.
items.equipment.wands.wandoflivingearth$earthguardian.name=aarden beschermer
items.equipment.wands.wandoflivingearth$earthguardian.desc=De rotsen van je toverstok van levende aarde hebben zich gevormd tot een aarden beschermer! Deze rotsachtige beschermer valt vijanden in de buurt aan, waardoor ze de beschermer moeten aanvallen in plaats van jou. Als alle bedreigingen in de buurt zijn verdwenen, vormt de bewaker zich opnieuw om je heen en keert terug wanneer je je toverstok de volgende keer gebruikt.
items.equipment.wands.wandoflivingearth$earthguardian.wand_info=De verdedigingskracht van de beschermer is gekoppeld aan het niveau van je toverstok. Het blokkeert momenteel _%1$d-%2$d schade._
items.equipment.wands.wandoflivingearth$earthguardian.discover_hint=Je kunt dit personage vinden met een specifieke toverstok.

items.equipment.wands.wandofmagicmissile.name=toverstok van magisch projectiel
items.equipment.wands.wandofmagicmissile.staff_name=staf van magisch projectiel
items.equipment.wands.wandofmagicmissile.desc=Deze vrij eenvoudige toverstok lanceert projectielen van pure magische energie. Hoewel de toverstok zelf geen speciale effecten heeft, heeft hij meer beschikbare ladingen en kan hij andere toverstokken kort versterken wanneer hij wordt opgewaardeerd.
items.equipment.wands.wandofmagicmissile.stats_desc=Elk projectiel van deze toverstok richt _%1$d-%2$d schade aan,_ en versterkt andere toverstokken kort als deze wordt opgewaardeerd.
items.equipment.wands.wandofmagicmissile.bmage_desc=Wanneer _de Strijdmagiër_ een vijand slaat met een staf van magisch projectiel, worden naast zijn staf al zijn toverstokken opgeladen.
items.equipment.wands.wandofmagicmissile.eleblast_desc=Een elementale explosie met een staf van magisch projectiel richt 50% schade aan en geeft de magiër 15 oplaadbeurten.
items.equipment.wands.wandofmagicmissile.discover_hint=Een van de helden begint met dit voorwerp.
items.equipment.wands.wandofmagicmissile$magiccharge.name=magische lading
items.equipment.wands.wandofmagicmissile$magiccharge.desc=Je toverstok van magisch projectiel heeft kracht teruggevoerd naar je toverstokken, waardoor het effectieve niveau van de volgende schicht die ze maken is verhoogd.\n\nJe toverstok krijgt een verhoging tot: +%d.\n\nResterende beurten van magische lading: %s.

items.equipment.wands.wandofprismaticlight.name=toverstok van prismatisch licht
items.equipment.wands.wandofprismaticlight.staff_name=staf van prismatisch licht
items.equipment.wands.wandofprismaticlight.desc=Deze toverstaf is gemaakt van een enkel stuk doorschijnend kristal, als een lang stuk glad glas. Kleine stukjes kleurrijk licht dansen rond de punt van de toverstok, enthousiast om naar buiten te schieten.
items.equipment.wands.wandofprismaticlight.stats_desc=Deze toverstok schiet lichtstralen die door de duisternis van de kerker snijden en verborgen gebieden en vallen onthullen. De straal kan vijanden verblinden en richt _%1$d-%2$d schade aan._ Demonische en ondode vijanden branden in het felle licht van de toverstok en lopen bonusschade op.
items.equipment.wands.wandofprismaticlight.upgrade_stat_name_2=Verblindingskans
items.equipment.wands.wandofprismaticlight.upgrade_stat_name_3=Lichtduur
items.equipment.wands.wandofprismaticlight.bmage_desc=Wanneer _de Strijdmagiër_ een vijand slaat met een staf van prismatisch licht, worden ze kreupel gemaakt voor een duur die gelijk loopt met het niveau van de staf.
items.equipment.wands.wandofprismaticlight.eleblast_desc=Een elementale explosie met een staf van prismatisch licht richt 67% schade aan, onthult alle terreinen in de explosie en verblindt vijanden gedurende 5 beurten.

items.equipment.wands.wandofregrowth.name=toverstok van hergroei
items.equipment.wands.wandofregrowth.staff_name=staf van hergroei
items.equipment.wands.wandofregrowth.desc=Deze toverstok is gemaakt van een dunne schacht van vakkundig gesneden hout. Op de een of andere manier is het nog steeds levend en levendig, heldergroen als de kern van een jonge boom. "Als het leven stopt, begint het nieuwe leven altijd te groeien... De eeuwige cyclus blijft altijd bestaan!"
items.equipment.wands.wandofregrowth.stats_desc=Bij gebruik schiet deze toverstok magische hergroei-energie naar buiten in een kegelvorm, waardoor gras, wortels en zeldzame planten tot leven komen. Het volgende gebruik kost _%1$d lading_. Hoe meer ladingen de toverstaf gebruikt, hoe groter en sterker het effect.
items.equipment.wands.wandofregrowth.degradation=Na nog eens _%d ladingen_ produceert deze toverstok geen planten en vers gras meer. Deze limiet wordt verhoogd door een volgend ervaringsniveau te bereiken of de toverstok op te waarderen.
items.equipment.wands.wandofregrowth.upgrade_stat_name_1=Gras Per Lading
items.equipment.wands.wandofregrowth.upgrade_stat_name_2=Totaal Gras Limiet
items.equipment.wands.wandofregrowth.bmage_desc=Wanneer _de Strijdmagiër_ een vijand treft met een staf van hergroei, en hij of de vijand op gras staat, krijgt de magiër kruidengenezing in verhouding tot de toegebrachte schade.
items.equipment.wands.wandofregrowth.eleblast_desc=Een elementale ontploffing met een staf van hergroei wortelt vijanden en laat willekeurig gras groeien in het ontploffingsgebied.
items.equipment.wands.wandofregrowth$dewcatcher.name=Dauwvanger
items.equipment.wands.wandofregrowth$dewcatcher.desc=Dauwvangers zijn wonderlijke planten die zich vullen met magische dauw. Ze proberen zich te camoufleren als gras om de aandacht te ontwijken, maar hun uitstulpingen van verzamelde dauw verraden ze.
items.equipment.wands.wandofregrowth$dewcatcher.discover_hint=Je kunt deze plant vinden met een specifieke toverstok.
items.equipment.wands.wandofregrowth$seedpod.name=Zaadhuisje
items.equipment.wands.wandofregrowth$seedpod.desc=Zaadhuisjes zijn magische planten die zaden produceren van andere plantensoorten, in plaats van eigen zaden. Ze slagen er op de een of andere manier in om zich te verspreiden ondanks dat ze geen eigen zaad hebben.
items.equipment.wands.wandofregrowth$seedpod.discover_hint=Je kunt deze plant vinden met een specifieke toverstok.
items.equipment.wands.wandofregrowth$lotus.name=Gouden Lotus
items.equipment.wands.wandofregrowth$lotus.desc=De Gouden Lotus is een mystieke plant die alleen kan worden opgeroepen door een krachtige staf van hergroei. Zijn aura versterkt alle planten en planteffecten, maar hij gaat snel door zijn energie heen en sterft na een korte tijd.
items.equipment.wands.wandofregrowth$lotus.wand_info=Deze lotus werd geproduceerd door een _+%1$d_ toverstok van hergroei. Alle planten binnen zijn bereik worden _onmiddellijk geactiveerd_ als ze op een personage worden geplant. Planten hebben ook een _%2$d%%  kans_ om hun zaad te laten vallen, en getipte pijltjes krijgen _%3$d%% minder duurzaamheid_.
items.equipment.wands.wandofregrowth$lotus.discover_hint=Je kunt deze plant vinden met een specifieke toverstok, na het meerdere keren op te waarderen.

items.equipment.wands.wandoftransfusion.name=toverstaf van transfusie
items.equipment.wands.wandoftransfusion.staff_name=staf van transfusie
items.equipment.wands.wandoftransfusion.ondeath=Je hebt zelfmoord gepleegd met je eigen staf van transfusie...
items.equipment.wands.wandoftransfusion.charged=Je staf is geladen met de levensenergie van je vijand!
items.equipment.wands.wandoftransfusion.desc=Een vrij eenvoudig gevormde toverstaf, die opvalt door zijn magenta tint en pikzwarte edelsteen aan de punt.
items.equipment.wands.wandoftransfusion.stats_desc=Bij gebruik op bondgenoten of gecharmeerde vijanden, gebruikt deze toverstok _%1$d van de gezondheid van de gebruiker_ om de bondgenoot te genezen of te beschermen voor _%2$d gezondheid._ Bij gebruik op vijanden charmeert de toverstok hen kort terwijl hij _%3$d bescherming_ aan de gebruiker geeft. Vijandige ondoden krijgen _%4$d-%5$d schade_ in plaats van gecharmeerd te worden.
items.equipment.wands.wandoftransfusion.upgrade_stat_name_1=Bondgenoot genezing
items.equipment.wands.wandoftransfusion.upgrade_stat_name_2=Zelfbeschermend
items.equipment.wands.wandoftransfusion.upgrade_stat_name_3=Ondode schade
items.equipment.wands.wandoftransfusion.bmage_desc=Wanneer _de Strijdmagiër_ een gecharmeerde vijand slaat met een transfusiestaf, krijgt de magiër bescherming en zijn volgende schot van de staf kost geen gezondheid.
items.equipment.wands.wandoftransfusion.eleblast_desc=Een elementale explosie met een transfusiestaf charmeert vijanden, geneest bondgenoten en richt 100% schade aan ondode vijanden aan.

items.equipment.wands.wandofwarding.name=toverstaf van bewaking
items.equipment.wands.wandofwarding.staff_name=staf van bewaking
items.equipment.wands.wandofwarding.no_more_wards=Je toverstok kan geen bewaking meer aan.
items.equipment.wands.wandofwarding.bad_location=Je kunt daar geen bewaking plaatsen.
items.equipment.wands.wandofwarding.desc=Deze korte metalen toverstok heeft een felpaarse edelsteen die boven de punt zweeft.
items.equipment.wands.wandofwarding.stats_desc=In plaats van een vijand direct te beschadigen, roept deze toverstok onbeweeglijke bewaking en schildwachten op. Bewaking kan overal worden opgeroepen, zelfs door muren als je daar zicht op hebt. Deze toverstok kan _%d energie_ aan bewaking tegelijk ondersteunen.
items.equipment.wands.wandofwarding.upgrade_stat_name_1=Bewaking schade
items.equipment.wands.wandofwarding.upgrade_stat_name_2=Beschermingsenergie
items.equipment.wands.wandofwarding.bmage_desc=Wanneer _de Strijdmagiër_ een vijand treft met een staf van bewaking, hebben alle actieve beschermers en schildwachten een kans om genezen te worden.
items.equipment.wands.wandofwarding.eleblast_desc=Een elementale explosie met een staf van bescherming geneest alle beschermers en schildwachten in het explosiegebied.
items.equipment.wands.wandofwarding$ward.desc_generic_ward=Deze bewaker zal automatisch op elke vijand die binnen zijn gezichtsveld komt schieten.\n\nAls je op deze bewaker schiet met je toverstok van bewaking, zal deze worden opgewaardeerd.\n\nBewakers hebben een beperkt aantal schoten voordat ze verdwijnen.
items.equipment.wands.wandofwarding$ward.desc_generic_sentry=Deze schildwacht heeft dezelfde vuurkracht als een bewaker, maar heeft gezondheid in plaats van een bepaald aantal aanvallen. Het lijkt op de edelsteen aan het uiteinde van je toverstok van bewaking.\n\nAls je op deze schildwacht schiet met je toverstok, wordt hij opgewaardeerd en genezen.\n\nDeze schildwacht zal elke keer dat hij op een vijand schiet, wat gezondheid verliezen, maar kan worden genezen door je toverstaf erop te gebruiken.
items.equipment.wands.wandofwarding$ward.name_1=lagere bewaker
items.equipment.wands.wandofwarding$ward.desc_1=Deze eenvoudige bewaker schiet automatisch op elke vijand die in zijn gezichtsveld komt, waarbij _%1$d-%2$d schade wordt toegebracht._\n\nAls je op deze bewaker met je toverstok van bewaking schiet, wordt deze opgewaardeerd.\n\nDeze bewaker schiet maar één keer voordat het verdwijnt.\n\nJe toverstok gebruikt _%3$d energie_ om deze bewaker in stand te houden.
items.equipment.wands.wandofwarding$ward.name_2=bewaker
items.equipment.wands.wandofwarding$ward.desc_2=Deze verbeterde bewaker heeft een ingewikkelder patroon en kan meerdere keren aanvallen. Elk schot van deze bewaker richt _%1$d-%2$d schade aan._\n\nAls je op deze bewaker met je toverstok van bewaking schiet, wordt deze opgewaardeerd.\n\nDeze bewaker schiet drie keer voordat hij verdwijnt.\n\nJe toverstaf gebruikt _%3$d energie_ om deze bewaker te ondersteunen.
items.equipment.wands.wandofwarding$ward.name_3=hogere bewaker
items.equipment.wands.wandofwarding$ward.desc_3=Deze volledig opgewaardeerde bewaker kan vaker aanvallen dan zijn voorgangers. Elk schot van deze bewaker richt _%1$d-%2$d schade aan._\n\nAls je op deze bewaker met je toverstok van bewaking schiet, wordt deze opgewaardeerd.\n\nDeze bewaker schiet vijf keer voordat hij verdwijnt.\n\ nJe toverstaf gebruikt _%3$d energie_ om deze bewaker te ondersteunen.
items.equipment.wands.wandofwarding$ward.name_4=lagere schildwacht
items.equipment.wands.wandofwarding$ward.desc_4=Deze kleinere schildwacht heeft dezelfde vuurkracht als een hogere bewaker, maar heeft gezondheid in plaats van een bepaald aantal ladingen. Het lijkt op de edelsteen aan het uiteinde van je toverstaf van bewaking. Elk schot van deze schildwacht richt _%1$d-%2$d schade aan._\n\nAls je op deze bewaker met je toverstok van bewaking schiet, wordt deze opgewaardeerd en genezen.\n\nDeze schildwacht geeft wat gezondheid uit voor elke keer dat hij op een vijand schiet, maar kan worden genezen door je toverstaf van bewaking erop te gebruiken.\n\nJe toverstaf van bewaking gebruikt _%3$d energie_ om deze schildwacht te ondersteunen.
items.equipment.wands.wandofwarding$ward.name_5=schildwacht
items.equipment.wands.wandofwarding$ward.desc_5=Deze verbeterde schildwacht is groter en duurzamer dan een lagere schildwacht. Elk schot van deze schildwacht richt _%1$d-%2$d schade aan._\n\nnAls je op deze bewaker met je toverstok van bewaking schiet, wordt deze opgewaardeerd en genezen.\n\nDeze schildwacht geeft wat gezondheid uit voor elke keer dat hij op een vijand schiet, maar kan worden genezen door je toverstaf van bewaking erop te gebruiken.\n\nJe toverstaf van bewaking gebruikt _%3$d energie_ om deze schildwacht te ondersteunen.
items.equipment.wands.wandofwarding$ward.name_6=hogere schildwacht
items.equipment.wands.wandofwarding$ward.desc_6=Deze volledig verbeterde schildwacht is aanzienlijk duurzamer dan zijn voorgangers. Elk schot van deze schildwacht richt _%1$d-%2$d schade aan._\n\nnAls je op deze bewaker met je toverstok van bewaking schiet, wordt deze genezen.\n\nDeze schildwacht geeft wat gezondheid uit voor elke keer dat hij op een vijand schiet, maar kan worden genezen door je toverstaf van bewaking erop te gebruiken.\n\nJe toverstaf van bewaking gebruikt _%3$d energie_ om deze schildwacht te ondersteunen.
items.equipment.wands.wandofwarding$ward.discover_hint=Je kunt dit personage vinden met een specifieke toverstok.
items.equipment.wands.wandofwarding$ward.dismiss_title=Deze bewaker wegsturen?
items.equipment.wands.wandofwarding$ward.dismiss_body=Je kunt deze bewaker wegsturen als je niet langer wilt dat je toverstok hem onderhoudt. Hierdoor wordt de bewaker onmiddellijk vernietigd.\n\nDeze bewaker wegsturen?
items.equipment.wands.wandofwarding$ward.dismiss_confirm=ja
items.equipment.wands.wandofwarding$ward.dismiss_cancel=nee

###weapon curses
items.equipment.weapon.curses.annoying.name=vervelende %s
items.equipment.weapon.curses.annoying.msg_1=OOH, ZIJN WE AAN HET VECHTEN!?
items.equipment.weapon.curses.annoying.msg_2=JA, PAK ZE!
items.equipment.weapon.curses.annoying.msg_3=HE, LUISTER!
items.equipment.weapon.curses.annoying.msg_4=ZIJN WE NOG NIET BIJ DE BAAS!?
items.equipment.weapon.curses.annoying.msg_5=AU, SLA NIET ZO HARD MET ME!
items.equipment.weapon.curses.annoying.msg_6=STERF, INSECTEN!
items.equipment.weapon.curses.annoying.msg_7=WHEEEEEEEEEEEEEEE!
items.equipment.weapon.curses.annoying.msg_8=KUNNEN WE EEN PAUZE NEMEN!?
items.equipment.weapon.curses.annoying.msg_9=PAUW, HAHA!
items.equipment.weapon.curses.annoying.msg_10=GOED GESLAGEN!
items.equipment.weapon.curses.annoying.msg_11=Ik wilde geen wapen zijn, ik wilde de bijl van een houthakker zijn.
items.equipment.weapon.curses.annoying.msg_12=Onthoud dat overmoed een langzame en verraderlijke moordenaar is.
items.equipment.weapon.curses.annoying.msg_13=AL UW BASIS IS VAN ONS!
items.equipment.weapon.curses.annoying.desc=Vervelende wapens zijn in staat tot spreken, maar ze zijn iets te energiek. Ze vestigen vaak de aandacht op je zonder dat ze dat bedoelen.
items.equipment.weapon.curses.annoying.elestrike_desc=Een elementale aanval met een vervelende vloek heeft een kans van 20% om elke vijand binnen bereik gedurende 6 beurten razend te maken.

items.equipment.weapon.curses.dazzling.name=oogverblindende %s
items.equipment.weapon.curses.dazzling.desc=Oogverblindende wapens flitsen soms met verblindend licht en verblindt dan iedereen die het kan zien.
items.equipment.weapon.curses.dazzling.elestrike_desc=Een elementale aanval met een oogverblindende vloek heeft een kans van 50% om elke vijand binnen bereik gedurende 6 beurten te verblinden.

items.equipment.weapon.curses.displacing.name=verplaatsende %s
items.equipment.weapon.curses.displacing.desc=Verplaatsende wapens zijn samengevoegd met chaotische teleportatiemagie, die vijanden naar een willekeurig plek op de verdieping kan verplaatsen.
items.equipment.weapon.curses.displacing.elestrike_desc=Een elementale aanval met een verplaatsende vloek heeft een kans van 50% om elke vijand binnen bereik te teleporteren.

items.equipment.weapon.curses.explosive.name=explosieve %s
items.equipment.weapon.curses.explosive.warm=Warm...
items.equipment.weapon.curses.explosive.hot=Heet!
items.equipment.weapon.curses.explosive.desc=Explosieve wapens bouwen gestaag kracht op en exploderen, waarbij ze alles in de buurt beschadigen.
items.equipment.weapon.curses.explosive.desc_cool=Je wapen voelt momenteel koel aan.
items.equipment.weapon.curses.explosive.desc_warm=Je wapen bouwt energie op en wordt warm...
items.equipment.weapon.curses.explosive.desc_hot=Je wapen is heet! Het staat op ontploffen!
items.equipment.weapon.curses.explosive.elestrike_desc=Een elementale aanval met een explosieve vloek heeft een kans van 50% om een explosie te veroorzaken bij een willekeurige vijand binnen bereik.

items.equipment.weapon.curses.friendly.name=vriendelijke %s
items.equipment.weapon.curses.friendly.desc=Vriendelijke wapens zijn het meest geschikt voor pacifisten, en veroorzaken af en toe magie die het onmogelijk maakt om te vechten.
items.equipment.weapon.curses.friendly.elestrike_desc=Een elementale aanval met een vriendelijke vloek heeft 50% kans om elke vijand binnen bereik te bekoren gedurende 6 beurten.

items.equipment.weapon.curses.polarized.name=gepolariseerde %s
items.equipment.weapon.curses.polarized.desc=Een gepolariseerd wapen wordt beïnvloed door magie die ervoor zorgt dat zijn aanval 50% meer schade aanricht, of helemaal geen schade.
items.equipment.weapon.curses.polarized.elestrike_desc=Een elementale aanval met een gepolariseerde vloek heeft een kans van 50% om 24-36 schade toe te brengen aan elke vijand binnen bereik.

items.equipment.weapon.curses.pressurized.name=geiser %s
items.equipment.weapon.curses.pressurized.desc=Geiser wapens kunnen een krachtige waterstraal uitstoten die alles wegblaast, inclusief jezelf.
items.equipment.weapon.curses.pressurized.elestrike_desc=Een elementale aanval met een geiser vloek creëert een watergolf die terrein vernietigt en alle vijanden binnen bereik terugstoot.

items.equipment.weapon.curses.sacrificial.name=opofferende %s
items.equipment.weapon.curses.sacrificial.desc=Opofferingswapens eisen bloed van de drager als een vijand wordt aangevallen. Hoe gezonder de drager is, hoe meer bloed de vloek opeist.
items.equipment.weapon.curses.sacrificial.elestrike_desc=Een elementale aanval met een offervloek zorgt ervoor dat de held en elke vijand binnen bereik bloeden voor 12 gezondheid.

items.equipment.weapon.curses.wayward.name=eigenzinnige %s
items.equipment.weapon.curses.wayward.desc=Eigenzinnige wapens worden soms extreem onnauwkeurig. Deze magie duurt een tijdje wanneer het wordt geactiveerd, maar kan worden verdreven door een rake slag uit te delen met het eigenzinnige wapen.
items.equipment.weapon.curses.wayward.elestrike_desc=Een elementale aanval met een eigenzinnige vloek heeft een kans van 50% om elke vijand binnen bereik gedurende 6 beurten te beheksen.
items.equipment.weapon.curses.wayward$waywardbuff.name=eigenzinnig
items.equipment.weapon.curses.wayward$waywardbuff.desc=De magie van je eigenzinnige wapen is geactiveerd, waardoor het voor een korte tijd extreem onnauwkeurig is. Merk op dat dit geen invloed heeft op aanvallen die gegarandeerd slagen, zoals verrassingsaanvallen. Succesvol aanvallen met het eigenzinnige wapen stopt dit effect onmiddellijk.\n\nResterende beurten: %s.

items.equipment.weapon.curses.wondrous.name=wonderlijk %s
items.equipment.weapon.curses.wondrous.desc=Wonderijke wapens bevatten dezelfde chaotische magie als vervloekte toverstokken. Je weet nooit wat er zal gebeuren als deze vloek geactiveerd wordt!
items.equipment.weapon.curses.wondrous.elestrike_desc=Een elementale aanval met een wonderlijke vloek heeft een kans om een ander vervloekt toverstafeffect toe te passen op elke vijand binnen bereik.

###enchantments
items.equipment.weapon.enchantments.blazing.name=brandende %s
items.equipment.weapon.enchantments.blazing.desc=Deze betovering zorgt ervoor dat vlammen uit een wapen spuwen, wat vijanden in brand steekt en bonusschade toebrengt aan vijanden die al in brand staan.
items.equipment.weapon.enchantments.blazing.elestrike_desc=Een elementale aanval met een vlammende betovering verspreidt vuur naar elke tegel binnen bereik, wat 8 beurten duurt.

items.equipment.weapon.enchantments.blocking.name=blokkerende %s
items.equipment.weapon.enchantments.blocking.desc=Blokkerende wapens hebben een kans om je kort te beschermen na een aanval met dit wapen.
items.equipment.weapon.enchantments.blocking.elestrike_desc=Een elementale aanval met een blokkerende betovering geeft de Duellist 6 extra bescherming voor elke vijand binnen bereik.
items.equipment.weapon.enchantments.blocking$blockbuff.name=blokkerend
items.equipment.weapon.enchantments.blocking$blockbuff.desc=De blokkeringsbetovering van je wapen heeft je een korte verhoging van verdedigingskracht gegeven!\n\nResterende bescherming: %d\n\nResterende beurten: %s.

items.equipment.weapon.enchantments.blooming.name=bloeiende %s
items.equipment.weapon.enchantments.blooming.desc=Bloeiende wapens bevatten magie die begroeiing laat opkomen op of rond degenen die erdoor worden geraakt.
items.equipment.weapon.enchantments.blooming.elestrike_desc=Een elementale aanval met een bloeiende betovering verspreidt gras tot 8 tegels binnen bereik en wortelt alle vijanden binnen bereik gedurende 6 beurten.

items.equipment.weapon.enchantments.chilling.name=afkoelende %s
items.equipment.weapon.enchantments.chilling.desc=Vijanden die met deze betovering worden getroffen, worden afgekoeld, waardoor hun bewegingen en aanvallen worden vertraagd.
items.equipment.weapon.enchantments.chilling.elestrike_desc=Een elementale aanval met een afkoelende betovering verspreidt afkoelende lucht naar elke tegel binnen bereik, gedurende 8 beurten.

items.equipment.weapon.enchantments.crystal.name=Kristal %s
items.equipment.weapon.enchantments.crystal.alert_fixed=Je kristallen wapen is volledig gerepareerd!
items.equipment.weapon.enchantments.crystal.alert_fixed_ghost=Het kristallen wapen van de geest is volledig gerepareerd!
items.equipment.weapon.enchantments.crystal.alert_noflaw=Je kristallen wapen is niet langer gebrekkig.
items.equipment.weapon.enchantments.crystal.alert_noflaw_ghost=Het kristallen wapen van de geest is niet langer gebrekkig.
items.equipment.weapon.enchantments.crystal.alert_nocrack=Je kristallen wapen is niet langer gebarsten.
items.equipment.weapon.enchantments.crystal.alert_nocrack_ghost=Het kristallen wapen van de geest is niet langer gebarsten.
items.equipment.weapon.enchantments.crystal.alert_flawed=Je kristallen wapen is licht beschadigd geraakt.
items.equipment.weapon.enchantments.crystal.alert_flawed_ghost=Het kristallen wapen van de geest is licht beschadigd geraakt.
items.equipment.weapon.enchantments.crystal.alert_cracked=Je kristallen wapen vertoont barsten, het staat op het punt te breken!
items.equipment.weapon.enchantments.crystal.alert_cracked_ghost=Het kristallen wapen van de geest vertoont barsten, het staat op het punt te breken!
items.equipment.weapon.enchantments.crystal.alert_shattered=Je kristallen wapen spat in stukken uiteen!
items.equipment.weapon.enchantments.crystal.alert_shattered_ghost=Het kristallen wapen van de geest spat in stukken uiteen!
items.equipment.weapon.enchantments.crystal.desc=Deze krachtige betovering brengt extra magische schade toe en verhoogt de waarde van een wapen. Het betoverde wapen kan echter breken als de kristallen niet worden gerepareerd of de tijd krijgen om zichzelf te herstellen.
items.equipment.weapon.enchantments.crystal.desc_thrown=Werpwapens van kristal hebben een veel lagere duurzaamheid, maar herstellen zich langzaam na verloop van tijd.
items.equipment.weapon.enchantments.crystal.desc_perfect=Dit kristallen wapen verkeert momenteel in perfecte staat.
items.equipment.weapon.enchantments.crystal.desc_fine=Dit kristallen wapen verkeert momenteel in goede staat.
items.equipment.weapon.enchantments.crystal.desc_flawed=Dit kristallen wapen heeft een gebrek, maar zal niet zomaar breken.
items.equipment.weapon.enchantments.crystal.desc_cracked=Dit kristallen wapen vertoont scheuren en dreigt permanent te breken!
items.equipment.weapon.enchantments.crystal.elestrike_desc=Een elementale aanval met een kristallen betovering richt 10-20 schade aan en repareert het wapen voor elke vijand binnen bereik, behalve het primaire doelwit.

items.equipment.weapon.enchantments.kinetic.name=kinetische %s
items.equipment.weapon.enchantments.kinetic.desc=Wanneer een vijand wordt gedood met een kinetisch wapen, wordt overtollige kracht opgeslagen in het wapen en wordt dit toegepast op de volgende succesvolle aanval.
items.equipment.weapon.enchantments.kinetic.elestrike_desc=Een elementale aanval met een kinetische betovering brengt 40% van de opgeslagen schade toe aan elke vijand binnen bereik, behalve het primaire doelwit.
items.equipment.weapon.enchantments.kinetic$conserveddamage.name=opgeslagen schade
items.equipment.weapon.enchantments.kinetic$conserveddamage.desc=Je wapen heeft de overtollige kracht van een eerdere dodelijke slag opgeslagen en past het toe als bonusschade bij je volgende aanval. De energie neemt in de loop van de tijd echter langzaam af.\n\nOpgeslagen schade: %d.

items.equipment.weapon.enchantments.corrupting.name=corrumperende %s
items.equipment.weapon.enchantments.corrupting.desc=Deze krachtige betovering bezit het vermogen om vijanden naar je hand te zetten. Wanneer een vijand met dit wapen wordt gedood, bestaat de kans dat ze corrupt raken in plaats van dood te gaan.
items.equipment.weapon.enchantments.corrupting.elestrike_desc=Een elementale aanval met een corrumperende betovering heeft een kans van 5-25% (op basis van het gezondheidsniveau) om elke vijand binnen bereik te corrumperen, behalve het primaire doelwit.

items.equipment.weapon.enchantments.eldritch.name=bovennatuurlijk %s
items.equipment.weapon.enchantments.eldritch.desc=Bovennatuurlijke wapens boezemen angst in bij vijanden in de buurt die getuige zijn van hun aanvallen, waardoor ze op de vlucht slaan voor de aanvaller.
items.equipment.weapon.enchantments.eldritch.elestrike_desc=Een elementale aanval met een bovennatuurlijke betovering zorgt voor langdurige angst bij elke vijand binnen bereik, inclusief het primaire doelwit.

items.equipment.weapon.enchantments.elastic.name=elastische %s
items.equipment.weapon.enchantments.elastic.desc=Elastische wapens hebben een kans om vijanden over korte afstanden terug te duwen.
items.equipment.weapon.enchantments.elastic.elestrike_desc=Een elementale aanval met een elastische betovering duwt alle vijanden binnen bereik 5 tegels terug.

items.equipment.weapon.enchantments.grim.name=grimmige %s
items.equipment.weapon.enchantments.grim.desc=Deze krachtige betovering bezit de kracht om een vijand onmiddellijk te executeren. Het effect is groter naarmate de vijand zwakker is.
items.equipment.weapon.enchantments.grim.elestrike_desc=Een elementale aanval met een grimmige betovering heeft een kans van 6-30% (op basis van ontbrekende gezondheid) om elke vijand binnen bereik te doden, behalve het primaire doelwit.

items.equipment.weapon.enchantments.lucky.name=gelukkige %s
items.equipment.weapon.enchantments.lucky.desc=Vijanden die worden gedood door een gelukswapen hebben een kans om extra buit te laten vallen.
items.equipment.weapon.enchantments.lucky.elestrike_desc=Een elementale aanval met een gelukkige betovering heeft een kans van 12,5% om buit te laten verschijnen onder elke vijand binnen bereik. Dit effect kan maar één keer per vijand worden geactiveerd.

items.equipment.weapon.enchantments.projecting.name=projecterende %s
items.equipment.weapon.enchantments.projecting.desc=Met deze betovering krijgen slagwapens extra bereik. Afstandswapens kunnen nabijgelegen muren doordringen als op nabije doelwitten wordt gericht.
items.equipment.weapon.enchantments.projecting.elestrike_desc=Een elementale aanval met een projecterende betovering brengt 30% schade toe aan elke vijand binnen bereik, behalve het primaire doelwit.

items.equipment.weapon.enchantments.shocking.name=schokkende %s
items.equipment.weapon.enchantments.shocking.desc=Elektriciteit schiet met bogen uit een schokkend wapen en brengt extra schade toe aan alle nabije vijanden.
items.equipment.weapon.enchantments.shocking.elestrike_desc=Een elementale aanval met een schokkende betovering verspreidt elektriciteit naar elke tegel binnen bereik, gedurende 8 beurten.

items.equipment.weapon.enchantments.unstable.name=onstabiele %s
items.equipment.weapon.enchantments.unstable.desc=Deze betovering straalt chaotische energie uit en werkt bij elke slag als een andere betovering.
items.equipment.weapon.enchantments.unstable.elestrike_desc=Een elementale aanval met een onstabiele betovering past een willekeurig betoveringseffect toe op elke vijand binnen bereik, behalve het primaire doelwit.

items.equipment.weapon.enchantments.vampiric.name=vampierachtige %s
items.equipment.weapon.enchantments.vampiric.desc=Deze krachtige betovering pakt bij elke slag levenskracht van vijanden af en leidt het terug naar de drager. Het effect is sterker naarmate de gezondheid van de drager lager is.
items.equipment.weapon.enchantments.vampiric.elestrike_desc=Een elementale aanval met een vampierachtige betovering geneest de Duellist voor 2,5 gezondheid voor elke vijand binnen bereik.

items.equipment.weapon.enchantments.venomous.name=giftig%s
items.equipment.weapon.enchantments.venomous.desc=Giftige wapens brengen een vertraagd, maar dodelijk gif toe, dat bij elke toepassing ernstiger wordt.
items.equipment.weapon.enchantments.venomous.elestrike_desc=Een elementale aanval met een giftige betovering brengt extra, vertraagde vergiftiging aan op elke vijand binnen bereik, behalve het primaire doelwit.

items.equipment.weapon.enchantments.vorpal.name=vorpalen %s
items.equipment.weapon.enchantments.vorpal.desc=Vorpalen wapens zijn bijzonder dodelijk; ze hebben de kans om zo zuiver toe te slaan dat ze bloedingen veroorzaken in plaats van schade toe te brengen aan vijanden die kunnen bloeden.
items.equipment.weapon.enchantments.vorpal.elestrike_desc=Een elementale aanval met een vorpalen betovering brengt extra bloeding toe aan elke vijand binnen bereik, behalve aan het primaire doelwit.


###melee weapons
items.equipment.weapon.melee.assassinsblade.name=moordenaarsmes
items.equipment.weapon.melee.assassinsblade.stats_desc=Dit wapen is sterker tegen onbewuste vijanden.
items.equipment.weapon.melee.assassinsblade.ability_name=sluipen
items.equipment.weapon.melee.assassinsblade.typical_ability_desc=De Duellist kan _sluipen_ terwijl hij een moordenaarszwaard hanteert. Met deze vaardigheid kan de Duellist onmiddellijk tot 3 tegels weg springen en krijgt ze doorgaans _ %dbeurten van onzichtbaarheid._
items.equipment.weapon.melee.assassinsblade.ability_desc=De Duellist kan _sluipen_ terwijl hij een moordenaarszwaard hanteert. Met deze vaardigheid kan de Duellist onmiddellijk tot 3 tegels weg springen en krijgt ze _ %d beurten van onzichtbaarheid._
items.equipment.weapon.melee.assassinsblade.upgrade_ability_stat_name=Vermogensduur
items.equipment.weapon.melee.assassinsblade.desc=Een klein golvend mes gemaakt van obsidiaan, wat moeilijk te gebruiken ondanks het lichte gewicht, maar dodelijk als het de juiste plek vindt.

items.equipment.weapon.melee.battleaxe.name=strijdbijl
items.equipment.weapon.melee.battleaxe.stats_desc=Dit is een vrij nauwkeurig wapen.
items.equipment.weapon.melee.battleaxe.ability_name=zware klap
items.equipment.weapon.melee.battleaxe.typical_ability_desc=De Duellist kan een _zware slag_ uitvoeren met een strijdbijl. Deze geconcentreerde aanval richt gewoonlijk _ %1$d-%2$d schade_ aan als hij de vijand verrast, en verdooft hem gedurende 5 beurten, wat de nauwkeurigheid en ontwijking met 50%% vermindert. Zware slagen treffen altijd, maar richten regelmatig schade aan als de vijand niet wordt verrast.
items.equipment.weapon.melee.battleaxe.ability_desc=De Duellist kan een _zware slag_ uitvoeren met een strijdbijl. Deze geconcentreerde aanval richt _ %1$d-%2$dschade_ aan als hij de vijand verrast, en verdooft hem gedurende 5 beurten, wat de nauwkeurigheid en ontwijking met 50%% vermindert. Zware slagen treffen altijd, maar richten normale schade aan als de vijand niet wordt verrast.
items.equipment.weapon.melee.battleaxe.desc=De enorme stalen kop van deze strijdbijl legt een aanzienlijk gewicht achter elke brede slag.

items.equipment.weapon.melee.crossbow.name=kruisboog
items.equipment.weapon.melee.crossbow.typical_stats_desc=Normaal gesproken zorgt dit wapen ervoor dat gegooide pijlen _%1$d-%2$d schade_ aanrichten als het is uitgerust. Het wapen verleent de pijlen zelfs zijn betovering.
items.equipment.weapon.melee.crossbow.stats_desc=Dit wapen zorgt ervoor dat gegooide pijlen _%1$d-%2$d schade_ aanrichten als het is uitgerust. Het wapen verleent de pijlen zelfs zijn betovering.
items.equipment.weapon.melee.crossbow.ability_name=geladen schot
items.equipment.weapon.melee.crossbow.typical_ability_desc=De Duellist kan haar kruisboog _opladen_, waardoor haar volgende aanval altijd raak is en een van de drie volgende effecten heeft: slagaanvallen slaan vijanden weg, pijltjes zonder punt brengen doorgaans _+%1$d schade_ toe en pijltjes met punten hebben hun effect in een gebied van 7x7 en gaan _%2$d meer keren_ mee.
items.equipment.weapon.melee.crossbow.ability_desc=De Duellist kan haar kruisboog _opladen_, waardoor haar volgende aanval altijd raak is en een van de drie volgende effecten heeft: slagaanvallen slaan vijanden weg, pijltjes zonder punt brengen _+%1$d schade_ toe en pijltjes met punten hebben hun effect in een gebied van 7x7 en gaan _%2$d meer keren_ mee.
items.equipment.weapon.melee.crossbow.desc=Een vrij ingewikkeld wapen dat met uitzonderlijke snelheid kan schieten. Hoewel het er niet voor is ontworpen, maakt het gewicht en de stevige constructie van deze kruisboog het ook een fatsoenlijk slagwapen.
items.equipment.weapon.melee.crossbow.upgrade_ability_stat_name=Vaardigheidsverhoging
items.equipment.weapon.melee.crossbow$chargedshot.name=opgeladen
items.equipment.weapon.melee.crossbow$chargedshot.desc=De Duellist concentreert kracht op haar kruisboog. De volgende aanval die ze ermee uitvoert, zal altijd raken en een van de drie effecten toepassen:\n- slagaanvallen slaan vijanden een paar tegels weg.\n- Ongetipte pijltjes veroorzaken bonusschade.\n- Getipte pijltjes krijgen extra toepassingen en passen hun effect toe in een gebied van 7x7. Positieve pijleffecten hebben alleen effect op bondgenoten en schadelijke effecten zijn alleen van toepassing op vijanden. De Duellist kan deze vaardigheid niet gebruiken om positieve pijleffecten op zichzelf toe te passen.

items.equipment.weapon.melee.cudgel.name=knuppel
items.equipment.weapon.melee.cudgel.stats_desc=Dit is een vrij nauwkeurig wapen.
items.equipment.weapon.melee.cudgel.ability_name=zware klap
items.equipment.weapon.melee.cudgel.typical_ability_desc=De Duellist kan een _zware klap_ uitvoeren met een knuppel. Deze geconcentreerde aanval veroorzaakt doorgaans_%1$d-%2$d schade_ als het de vijand verrast, en verdooft ze 5 beurten lang, wat de nauwkeurigheid en ontwijking met 50%% vermindert. Zware klap raakt altijd, maar veroorzaakt normale schade als het de vijand niet verrast.
items.equipment.weapon.melee.cudgel.ability_desc=De Duellist kan een _zware klap_ uitvoeren met een knuppel. Deze geconcentreerde aanval veroorzaakt _%1$d-%2$d schade_ als het de vijand verrast, en verdooft ze 5 beurten lang, wat de nauwkeurigheid en ontwijking met 50%% vermindert. Zware klap raakt altijd, maar veroorzaakt normale schade als het de vijand niet verrast.
items.equipment.weapon.melee.cudgel.desc=Een kleine koperen strijdknots, meer bedoeld als zelfverdedigingsmiddel voor edelen dan als wapen geschikt voor avonturen.
items.equipment.weapon.melee.cudgel.discover_hint=Een van de helden begint met dit voorwerp.

items.equipment.weapon.melee.dagger.name=dolk
items.equipment.weapon.melee.dagger.stats_desc=Dit wapen is sterker tegen onbewuste vijanden.
items.equipment.weapon.melee.dagger.ability_name=sluipen
items.equipment.weapon.melee.dagger.typical_ability_desc=De Duellist kan _sluipen_ terwijl hij een dolk hanteert. Met deze vaardigheid kan de Duellist onmiddellijk tot 5 tegels weg springen en krijgt ze doorgaans _ %d beurten van onzichtbaarheid._
items.equipment.weapon.melee.dagger.ability_desc=De Duellist kan _sluipen_ terwijl hij een dolk hanteert. Met deze vaardigheid kan de Duellist onmiddellijk tot 5 tegels weg springen en krijgt ze _ %d beurten van onzichtbaarheid._
items.equipment.weapon.melee.dagger.upgrade_ability_stat_name=Vaardigheidsduur
items.equipment.weapon.melee.dagger.desc=Een eenvoudige ijzeren dolk met een versleten houten handvat.
items.equipment.weapon.melee.dagger.discover_hint=Een van de helden begint met dit voorwerp.

items.equipment.weapon.melee.dirk.name=lange dolk
items.equipment.weapon.melee.dirk.stats_desc=Dit wapen is sterker tegen onbewuste vijanden.
items.equipment.weapon.melee.dirk.ability_name=sluipen
items.equipment.weapon.melee.dirk.typical_ability_desc=De Duellist kan _sluipen_ terwijl hij een lange dolk hanteert. Met deze vaardigheid kan de duellist onmiddellijk tot vier tegels weg springen en krijgt ze meestal _ %d beurten van onzichtbaarheid._
items.equipment.weapon.melee.dirk.ability_desc=De Duellist kan _sluipen_ terwijl hij een lange dolk hanteert. Met deze vaardigheid kan de duellist onmiddellijk tot vier tegels weg springen en krijgt ze _ %d beurten van onzichtbaarheid._
items.equipment.weapon.melee.dirk.upgrade_ability_stat_name=Vaardigheidsduur
items.equipment.weapon.melee.dirk.desc=Een dolk met een langer lemmet, wat een beetje meer staal geeft om in vijanden te steken.

items.equipment.weapon.melee.flail.name=strijdvlegel
items.equipment.weapon.melee.flail.stats_desc=Dit is een nogal onnauwkeurig wapen.\nDit wapen kan geen verrassingsaanval uitvoeren.
items.equipment.weapon.melee.flail.ability_name=draaien
items.equipment.weapon.melee.flail.spin_warn=Je kunt de strijdvlegel niet meer ronddraaien.
items.equipment.weapon.melee.flail.typical_ability_desc=De Duellist kan een dorsvlegel _ronddraaien_ om gedurende korte tijd kracht op te bouwen. Elke draai die de dorsvlegel draait, zal doorgaans _+%d schade_ aanrichten, tot een maximum van 3 keer. Een ronddraaiende strijdvlegel zal ook gegarandeerd zijn doel treffen. De strijdvlegel laten draaien kost 1 lading.
items.equipment.weapon.melee.flail.ability_desc=De Duellist kan een dorsvlegel _ronddraaien_ om gedurende korte tijd kracht op te bouwen. Elke draai die de dorsvlegel draait, zal _+%d schade_ aanrichten, tot een maximum van 3 keer. Een ronddraaiende strijdvlegel zal ook gegarandeerd zijn doel treffen. De strijdvlegel laten draaien kost 1 lading.
items.equipment.weapon.melee.flail.desc=Een puntige bal die is bevestigd aan een handvat met een stuk ketting. Zeer onhandelbaar, maar verwoestend als je raak slaat.
items.equipment.weapon.melee.flail$spinabilitytracker.name=draaien
items.equipment.weapon.melee.flail$spinabilitytracker.desc=De Duellist draait haar dorsvlegel, en bouwt daarmee schade op voor haar volgende normale aanval. Elke draai duurt één beurt, maar verhoogt de schade, tot maximaal drie draaien. De dorsvlegel raakt ook gegarandeerd tijdens het draaien.\n\nHuidige draaien: %1$d%%.\nResterende beurten: %2$s.

items.equipment.weapon.melee.gauntlet.name=stenen handschoen
items.equipment.weapon.melee.gauntlet.stats_desc=Dit is een zeer snel wapen.
items.equipment.weapon.melee.gauntlet.ability_name=combo slag
