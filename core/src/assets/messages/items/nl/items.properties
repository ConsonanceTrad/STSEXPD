items.equipment.weapon.melee.scimitar.stats_desc=Dit is een vrij snel wapen.
items.equipment.weapon.melee.scimitar.ability_name=zwaarddans
items.equipment.weapon.melee.scimitar.typical_ability_desc=De Duellist kan een _zwaarddans_ uitvoeren met een kromzwaard. Deze houding kost geen tijd om te activeren en geeft de Duellist +60%%aanvalssnelheid en +50%% nauwkeurigheid, doorgaans voor _%d beurten_.
items.equipment.weapon.melee.scimitar.ability_desc=De Duellist kan een _zwaarddans_ uitvoeren met een kromzwaard. Deze houding kost geen tijd om te activeren en geeft de Duellist +60%% aanvalssnelheid en +50%% nauwkeurigheid voor _%d beurten_.
items.equipment.weapon.melee.scimitar.upgrade_ability_stat_name=Vermogensduur
items.equipment.weapon.melee.scimitar.desc=Een dik gebogen lemmet. De vorm zorgt voor snellere, maar minder krachtige aanvallen.
items.equipment.weapon.melee.scimitar$sworddance.name=zwaarddans
items.equipment.weapon.melee.scimitar$sworddance.desc=De Duellist maakt snelle, op momentum gebaseerde aanvallen met haar wapen, in een soort dans. Terwijl deze houding actief is, valt ze 60%% sneller aan (genoeg om precies twee keer per beurt met een kromzwaard aan te vallen), en heeft een nauwkeurigheid van +50%%.\n\nResterende beurten: %s.

items.equipment.weapon.melee.sickle.name=sikkel
items.equipment.weapon.melee.sickle.stats_desc=Dit is een vrij onnauwkeurig wapen.
items.equipment.weapon.melee.sickle.ability_name=oogsten
items.equipment.weapon.melee.sickle.typical_ability_desc=De Duellist kan een vijand _oogsten_ met een sikkel. Deze verwoestende aanval raakt gegarandeerd en veroorzaakt doorgaans _%d schade_. Deze schade wordt toegepast als bloeding als het doelwit niet immuun is.
items.equipment.weapon.melee.sickle.ability_desc=De Duellist kan een vijand _oogsten_ met een sikkel. Deze verwoestende aanval raakt gegarandeerd en veroorzaakt _%d schade_. Deze schade wordt toegepast als bloeding als het doelwit niet immuun is.
items.equipment.weapon.melee.sickle.desc=Een handzaam landbouwwerktuig dat kan dienen als een sterk maar log wapen.

items.equipment.weapon.melee.spear.name=speer
items.equipment.weapon.melee.spear.stats_desc=Dit is een vrij langzaam wapen.\nDit wapen heeft extra bereik.
items.equipment.weapon.melee.spear.ability_name=spies
items.equipment.weapon.melee.spear.typical_ability_desc=De Duellist kan de punt van een speer gebruiken om een vijand te _spiezen_ die binnen bereik is maar niet op een aangrenzende tegel staat. Dit richt doorgaans _%1$d-%2$d schade_ aan, duwt de vijand terug en is gegarandeerd raak.
items.equipment.weapon.melee.spear.ability_desc=De Duellist kan de punt van een speer gebruiken om een vijand te _spiezen_ die binnen bereik is maar niet op een aangrenzende tegel staat. Dit richt _ %1$d-%2$d schade_ aan, duwt de vijand terug en is gegarandeerd raak.
items.equipment.weapon.melee.spear.desc=Een slanke houten staaf met een punt van geslepen ijzer.

items.equipment.weapon.melee.sword.name=zwaard
items.equipment.weapon.melee.sword.ability_name=klieven
items.equipment.weapon.melee.sword.typical_ability_desc=De Duellist kan een vijand _doorklieven_ met een zwaard. Dit richt doorgaans _%1$d-%2$dschade_ aan en is gegarandeerd raak. Als klieven een vijand doodt, gebeurt dat onmiddellijk en kan de Duellist binnen 5 beurten gratis opnieuw klieven gebruiken.
items.equipment.weapon.melee.sword.ability_desc=De Duellist kan een vijand _doorklieven_ met een zwaard. Dit richt _%1$d-%2$d schade_ aan en is gegarandeerd raak. Als klieven een vijand doodt, gebeurt dat onmiddellijk en kan de Duellist binnen 5 beurten gratis opnieuw klieven gebruiken.
items.equipment.weapon.melee.sword.desc=Een mooi uitgebalanceerd zwaard. Niet te groot, maar toch opvallend langer dan een kortzwaard.
items.equipment.weapon.melee.sword$cleavetracker.name=klieven
items.equipment.weapon.melee.sword$cleavetracker.desc=De Duellist is klaar om haar vorige klieven op te volgen. Het volgende gebruik van klieven kost geen lading.\n\nResterende beurten: %s.

items.equipment.weapon.melee.warhammer.name=oorlogshamer
items.equipment.weapon.melee.warhammer.stats_desc=Dit is een vrij nauwkeurig wapen.
items.equipment.weapon.melee.warhammer.ability_name=zware klap
items.equipment.weapon.melee.warhammer.typical_ability_desc=De Duellist kan een _zware slag_ uitvoeren met een oorlogshamer. Deze geconcentreerde aanval richt doorgaans _ %1$d-%2$d schade_ aan als hij de vijand verrast, en verdooft hem gedurende 5 beurten, wat de nauwkeurigheid en ontwijking met 50%% vermindert. Zware slagen treffen altijd, maar richten normale schade aan als de vijand niet wordt verrast.
items.equipment.weapon.melee.warhammer.ability_desc=De Duellist kan een _zware slag_ uitvoeren met een oorlogshamer. Deze geconcentreerde aanval richt _ %1$d-%2$d schade_ aan als hij de vijand verrast, en verdooft hem gedurende 5 beurten, wat de nauwkeurigheid en ontwijking met 50%% vermindert. Zware slagen treffen altijd, maar richten normale schade aan als de vijand niet wordt verrast.
items.equipment.weapon.melee.warhammer.desc=Weinig wezens kunnen de verpletterende klap van deze torenhoge massa lood en staal weerstaan, maar er is veel kracht voor nodig om het effectief te gebruiken.

items.equipment.weapon.melee.warscythe.name=oorlogszeis
items.equipment.weapon.melee.warscythe.stats_desc=Dit is een vrij onnauwkeurig wapen.
items.equipment.weapon.melee.warscythe.ability_name=oogsten
items.equipment.weapon.melee.warscythe.typical_ability_desc=De Duellist kan een vijand _oogsten_ met een oorlogszeis. Deze verwoestende aanval raakt gegarandeerd en veroorzaakt doorgaans _%d schade._ Deze schade wordt toegepast als bloeding als het doelwit niet immuun is
items.equipment.weapon.melee.warscythe.ability_desc=De Duellist kan een vijand _oogsten_ met een oorlogszeis. Deze verwoestende aanval raakt gegarandeerd en veroorzaakt _%d schade_.  Deze schade wordt toegepast als bloeding als het doelwit niet immuun is.
items.equipment.weapon.melee.warscythe.desc=Dit grote en onhandige stuk gereedschap is versterkt, zodat het beter vijanden dan gewassen kan afsnijden.

items.equipment.weapon.melee.whip.name=zweep
items.equipment.weapon.melee.whip.stats_desc=Dit wapen heeft een enorm bereik.
items.equipment.weapon.melee.whip.ability_name=zweepslag
items.equipment.weapon.melee.whip.typical_ability_desc=De Duellist kan alle vijanden om haar heen met een _zweepslag_ van haar zweep slaan. Deze vaardigheid richt normaal_%1$d-%2$d schade_ aan, valt alle vijanden binnen aanvalsbereik aan en zal gegarandeerd raken.
items.equipment.weapon.melee.whip.ability_desc=De Duellist kan alle vijanden om haar heen met een _zweepslag_ van haar zweep slaan. Deze vaardigheid richt _%1$d-%2$d schade_ aan, valt alle vijanden binnen aanvalsbereik aan en zal gegarandeerd raken.
items.equipment.weapon.melee.whip.desc=Hoewel dit stuk touw met weerhaken aan het einde weinig schade aanricht, kan het bereik niet worden geëvenaard.

items.equipment.weapon.melee.wornshortsword.name=versleten kortzwaard
items.equipment.weapon.melee.wornshortsword.ability_name=klieven
items.equipment.weapon.melee.wornshortsword.typical_ability_desc=De Duellist kan een vijand _doorklieven_ met een versleten kortzwaard. Dit richt normaal _%1$d-%2$d schade_ aan en is gegarandeerd raak. Als klieven een vijand doodt, is dat onmiddellijk en kan de Duellist binnen 5 beurten gratis opnieuw klieven gebruiken.
items.equipment.weapon.melee.wornshortsword.ability_desc=De Duellist kan een vijand _doorklieven_ met een versleten kortzwaard. Dit richt _%1$d-%2$dschade_ aan en is gegarandeerd raak. Als klieven een vijand doodt, is dat onmiddellijk en kan de Duellist binnen 5 beurten gratis opnieuw klieven gebruiken.
items.equipment.weapon.melee.wornshortsword.desc=Een vrij kort zwaard, versleten door intensief gebruik. Het is zowel zwakker als een beetje lichter dan een kortzwaard in betere staat.
items.equipment.weapon.melee.wornshortsword.discover_hint=Een van de helden begint met dit voorwerp.


###missile weapons
items.equipment.weapon.missiles.darts.adrenalinedart.name=adrenalinepijltje
items.equipment.weapon.missiles.darts.adrenalinedart.desc=Deze pijltjes zijn getipt met een op fluksdistel gebaseerde samenstelling die de bewegings- en aanvalssnelheid van bondgenoten verhoogt, of de bewegingssnelheid van vijanden kort verlaagt. Het pijltje zelf is nog steeds schadelijk voor vijanden, maar schaadt bondgenoten niet.

items.equipment.weapon.missiles.darts.blindingdart.name=verblindend pijltje
items.equipment.weapon.missiles.darts.blindingdart.desc=Deze pijltjes zijn getipt met een op blindkruid gebaseerde verbinding die hun doelwit voor een korte tijd verblindt. Ze desoriënteren echter niet, dus een vijand weet nog steeds waar hij je voor het laatst heeft gezien.

items.equipment.weapon.missiles.darts.chillingdart.name=koelend pijltje
items.equipment.weapon.missiles.darts.chillingdart.desc=Deze pijltjes zijn getipt met een op het ijsklokje gebaseerde samenstelling die hun doelwit aanzienlijk afkoelt.

items.equipment.weapon.missiles.darts.cleansingdart.name=reinigingspijltje
items.equipment.weapon.missiles.darts.cleansingdart.desc=Deze pijltjes zijn voorzien van een op mageroyaal gebaseerde verbinding die bondgenoten tijdelijk immuun maakt voor alle negatieve effecten, of positieve effecten van vijanden zuivert. Vijanden kunnen zelfs even vergeten dat ze je aanvallen of van je wegvluchten. Het pijltje zelf is nog steeds schadelijk voor vijanden, maar schaadt bondgenoten niet.

items.equipment.weapon.missiles.darts.dart.name=pijltje
items.equipment.weapon.missiles.darts.dart.ac_tip=TIP
items.equipment.weapon.missiles.darts.dart.prompt=Kies een zaad
items.equipment.weapon.missiles.darts.dart.tip_title=Pijltjes Tippen
items.equipment.weapon.missiles.darts.dart.tip_desc=Een zaadje kan worden gecombineerd met een of twee pijltjes om ze te tippen. Elk type zaadje produceert zijn eigen type getipte pijltje, met een uniek effect voor eenmalig gebruik.\n\nAls je een pijltje met deze zaden tipt, krijg je een _%s._
items.equipment.weapon.missiles.darts.dart.tip_all=tip %1$d pijltjes met %2$d zaden
items.equipment.weapon.missiles.darts.dart.tip_two=tip 2 pijltjes met 1 zaadje
items.equipment.weapon.missiles.darts.dart.tip_one=tip 1 pijltje met 1 zaadje
items.equipment.weapon.missiles.darts.dart.tip_cancel=annuleren
items.equipment.weapon.missiles.darts.dart.desc=Deze eenvoudige staken van hout met spijkerpunt zijn verzwaard om uit de losse pols te werpen, strak te vliegen en hun doelwit te steken. Ze kunnen worden getipt met zaden om bonuseffecten te krijgen wanneer ze worden gegooid.
items.equipment.weapon.missiles.darts.dart.unlimited_uses=Dankzij hun eenvoudige constructie gaan de pijltjes vrijwel eeuwig mee.

items.equipment.weapon.missiles.darts.displacingdart.name=verplaatsende pijltje
items.equipment.weapon.missiles.darts.displacingdart.desc=Deze pijltjes zijn getipt met een op vaagblad gebaseerde verbinding die hun doelwit op korte afstand teleporteert.

items.equipment.weapon.missiles.darts.healingdart.name=genezend pijltje
items.equipment.weapon.missiles.darts.healingdart.desc=Deze pijltjes zijn getipt met een op zonnegras gebaseerde verbinding die een flinke hoeveelheid genezing aan hun doelwit geeft. De pijl zelf is nog steeds schadelijk voor vijanden, maar schaadt bondgenoten niet.

items.equipment.weapon.missiles.darts.holydart.name=heilig pijltje
items.equipment.weapon.missiles.darts.holydart.desc=Deze pijltjes zijn getipt met een op sterbloem gebaseerde samenstelling die heilige energie aan hun doelwit geeft. Bondgenoten en gewone vijanden worden gezegend, maar ondode of demonische vijanden lopen zware schade op. De pijl zelf is nog steeds schadelijk voor vijanden, maar schaadt bondgenoten niet.

items.equipment.weapon.missiles.darts.incendiarydart.name=brandend pijltje
items.equipment.weapon.missiles.darts.incendiarydart.desc=Deze pijltjes zijn getipt met een op vuurbloem gebaseerde samenstelling die bij impact in briljante vlammen uitbarst.

items.equipment.weapon.missiles.darts.paralyticdart.name=verlammend pijltje
items.equipment.weapon.missiles.darts.paralyticdart.desc=Deze pijltjes zijn getipt met een op aardwortel gebaseerde verbinding die hun doelwit voor een korte tijd verlamt.

items.equipment.weapon.missiles.darts.poisondart.name=giftig pijltje
items.equipment.weapon.missiles.darts.poisondart.desc=Deze pijltjes zijn getipt met een op treurmos gebaseerde verbinding die hun doelwit vergiftigt.

items.equipment.weapon.missiles.darts.rotdart.name=rot pijltje
items.equipment.weapon.missiles.darts.rotdart.desc=Deze gemene pijltjes zijn getipt met een bijtende verbinding op basis van de rotbes, die zich agressief door alles heen wegvreet waarmee de pijl in contact komt. Krachtige vijanden weerstaan het grootste deel van het effect, maar de corrosie is sterk genoeg om de meeste standaardvijanden gemakkelijk te doden. Deze pijltjes gaan langer mee dan andere getipte pijltjes, maar hun duurzaamheid kan niet worden verbeterd.
items.equipment.weapon.missiles.darts.rotdart.discover_hint=Je kunt dit voorwerp maken met behulp van een zaadje uit een specifieke missie.

items.equipment.weapon.missiles.darts.shockingdart.name=schokkende pijl
items.equipment.weapon.missiles.darts.shockingdart.desc=Deze pijltjes zijn getipt met een op stormrank gebaseerde verbinding die een vervelende schok aan hun doelwit geeft.

items.equipment.weapon.missiles.darts.tippeddart.ac_clean=SCHOONMAKEN
items.equipment.weapon.missiles.darts.tippeddart.clean_title=Pijltjes Schoonmaken
items.equipment.weapon.missiles.darts.tippeddart.clean_desc=Met deze actie wordt de zaadtip van je pijltjes verwijderd en veranderen ze in gewone pijltjes.
items.equipment.weapon.missiles.darts.tippeddart.clean_all=alles schoonmaken
items.equipment.weapon.missiles.darts.tippeddart.clean_one=één schoonmaken
items.equipment.weapon.missiles.darts.tippeddart.cancel=annuleer
items.equipment.weapon.missiles.darts.tippeddart.uses_left=Deze stapel pijltjes kan nog _%d/%d_ keer gebruikt worden voordat de tip opgebruikt is.
items.equipment.weapon.missiles.darts.tippeddart.unlimited_uses=_Maar deze zijn van zo'n hoge kwaliteit dat ze voor altijd meegaan._
items.equipment.weapon.missiles.darts.tippeddart.about_to_break=De tip van je pijltje is bijna verlopen.
items.equipment.weapon.missiles.darts.tippeddart.has_broken=De tip van je pijltje is verlopen.
items.equipment.weapon.missiles.darts.tippeddart.discover_hint=Je kunt dit voorwerp in een winkel kopen, of zelf maken met behulp van een zaadje.


items.equipment.weapon.missiles.bolas.name=bola's
items.equipment.weapon.missiles.bolas.stats_desc=Dit wapen veroorzaakt verlamming bij het doelwit.
items.equipment.weapon.missiles.bolas.desc=Deze ongebruikelijke afstandswapens zijn niet erg schadelijk, maar ze weten hun doelen uitstekend te vertragen.

items.equipment.weapon.missiles.boomerang.name=boemerang
items.equipment.weapon.missiles.boomerang.desc=Dit platte gebogen houten projectiel keert terug naar de handen van zijn werper nadat het naar de vijand is gegooid.
items.equipment.weapon.missiles.boomerang.durability=Door zijn stevige constructie gaat deze boemerang niet kapot door gebruik.

items.equipment.weapon.missiles.fishingspear.name=visspeer
items.equipment.weapon.missiles.fishingspear.desc=Kleine werpsperen die prima functioneren als geïmproviseerd wapen, ondanks dat ze ontworpen zijn om mee te vissen.

items.equipment.weapon.missiles.forcecube.name=krachtkubus
items.equipment.weapon.missiles.forcecube.ondeath=Je hebt zelfmoord gepleegd met je eigen krachtkubus...
items.equipment.weapon.missiles.forcecube.stats_desc=Dit wapen verspreidt de kracht van de inslag over een klein gebied, waardoor alles in de buurt wordt geraakt.
items.equipment.weapon.missiles.forcecube.desc=Deze wonderlijk gevormde magische kubussen zijn klein genoeg om in je hand te houden, maar ze zijn ontzettend zwaar.

items.equipment.weapon.missiles.heavyboomerang.name=zware boemerang
items.equipment.weapon.missiles.heavyboomerang.stats_desc=Dit wapen gaat na vijf beurten terug naar de locatie waar het vandaan werd gegooid.
items.equipment.weapon.missiles.heavyboomerang.desc=Deze grote boemerang is moeilijk om effectief te hanteren, maar richt aanzienlijke schade aan.

items.equipment.weapon.missiles.javelin.name=werpspies
items.equipment.weapon.missiles.javelin.desc=Deze grotere speren zijn verzwaard om de spies op hun punt vooraan te houden terwijl ze door de lucht glijden.

items.equipment.weapon.missiles.kunai.name=kunai
items.equipment.weapon.missiles.kunai.stats_desc=Dit wapen is sterker tegen onbewuste vijanden.
items.equipment.weapon.missiles.kunai.desc=Deze kleine messen zijn zeer krachtig in de handen van een ervaren gebruiker.

items.equipment.weapon.missiles.missileweapon.stats_known=Deze set van _klasse-%1$d_ werpwapens veroorzaakt _%2$d-%3$d schade_ en vereist _%4$d kracht_ om te gebruiken.
items.equipment.weapon.missiles.missileweapon.stats_unknown=Normaal gesproken veroorzaakt deze set van _klasse-%1$d_ werpwapens  _%2$d-%3$d schade_ en vereist _%4$d kracht_ om te gebruiken.
items.equipment.weapon.missiles.missileweapon.stats_desc=
items.equipment.weapon.missiles.missileweapon.probably_too_heavy=Waarschijnlijk is dit wapen te zwaar voor je.
items.equipment.weapon.missiles.missileweapon.distance=Werpwapens zijn nauwkeuriger op afstand, maar minder nauwkeurig van dichtbij.
items.equipment.weapon.missiles.missileweapon.durability=Werpwapens slijten en breken als ze worden gebruikt.
items.equipment.weapon.missiles.missileweapon.uses_left=Deze set van werpwapens kan nog _%d/%d_ keer worden gebruikt voordat er één breekt.
items.equipment.weapon.missiles.missileweapon.unlimited_uses=De kwaliteit van deze set is zo hoog dat hij vrijwel eeuwig meegaat.
items.equipment.weapon.missiles.missileweapon.unknown_uses=Normaal gesproken kun je deze set werpwapens _%d_ keer gebruiken voordat er één kapotgaat.
items.equipment.weapon.missiles.missileweapon.curse_discover=Dit werwapen is vervloekt!
items.equipment.weapon.missiles.missileweapon.about_to_break=Je werpwapen staat op het punt te breken.
items.equipment.weapon.missiles.missileweapon.has_broken=Eén van je werpwapens is kapot.
items.equipment.weapon.missiles.missileweapon.dust=Het werpwapen verpulvert tot stof zodra je het aanraakt.
items.equipment.weapon.missiles.missileweapon.break_upgraded_warn_desc=Als het laatst werpwapen in je verbeterde set werpwapens kapotgaat, dan gaat de set permanent verloren. Weet je zeker dat je het wilt gooien?
items.equipment.weapon.missiles.missileweapon.break_upgraded_warn_yes=Ja
items.equipment.weapon.missiles.missileweapon.break_upgraded_warn_no=Nee
items.equipment.weapon.missiles.missileweapon$placeholder.name=werpwapen

items.equipment.weapon.missiles.shuriken.name=werpster
items.equipment.weapon.missiles.shuriken.stats_desc=werpsterren kunnen direct worden gegooid en hebben een afkoeltijd van 20 beurten.
items.equipment.weapon.missiles.shuriken.desc=Deze stervormige stukjes metaal met vlijmscherpe messen kunnen snel worden gegooid terwijl je beweegt.
items.equipment.weapon.missiles.shuriken$shurikeninstanttracker.name=Werpster afkoelperiode
items.equipment.weapon.missiles.shuriken$shurikeninstanttracker.desc=Je hebt onlangs direct een werpster gegooid en moet wachten voordat je dit opnieuw doet. Werpsterren kunnen nog steeds worden gegooid, maar dan met normale wapensnelheid. \n\nResterende beurten: %s.

items.equipment.weapon.missiles.throwingclub.name=werpknuppel
items.equipment.weapon.missiles.throwingclub.stats_desc=Dit wapen blijft niet aan vijanden vastzitten en kan direct verzameld worden.
items.equipment.weapon.missiles.throwingclub.desc=Een vrij eenvoudig maar duurzaam werpwapen, in feite een grote steen bevestigd aan een stok.

items.equipment.weapon.missiles.throwinghammer.name=werphamer
items.equipment.weapon.missiles.throwinghammer.stats_desc=Dit wapen blijft niet aan vijanden vastzitten en kan direct verzameld worden.
items.equipment.weapon.missiles.throwinghammer.desc=Deze forse hamers zijn ontworpen om naar een vijand te gooien. Dankzij hun soepele, volledig metalen constructie zijn ze zeer duurzaam.

items.equipment.weapon.missiles.throwingknife.name=werpmes
items.equipment.weapon.missiles.throwingknife.stats_desc=Dit wapen is sterker tegen onbewuste vijanden.
items.equipment.weapon.missiles.throwingknife.desc=Deze lichtgewicht messen zijn zo uitgebalanceerd dat ze met een boog door de lucht schieten, recht op hun doel af.
items.equipment.weapon.missiles.throwingknife.discover_hint=Een van de helden begint met dit voorwerp.

items.equipment.weapon.missiles.throwingspear.name=werpspeer
items.equipment.weapon.missiles.throwingspear.desc=Deze lichtgewicht speren hebben een dun frame en zijn ontworpen om mee te werpen en niet om mee te steken.

items.equipment.weapon.missiles.throwingspike.name=werpspijker
items.equipment.weapon.missiles.throwingspike.desc=Deze duurzame, puntige metalen pijlen zijn bedoeld om naar vijanden op afstand te werpen.
items.equipment.weapon.missiles.throwingspike.discover_hint=Een van de helden begint met dit voorwerp.

items.equipment.weapon.missiles.throwingstone.name=werpsteen
items.equipment.weapon.missiles.throwingstone.desc=Deze stenen zijn geschuurd zodat ze met meer kracht kunnen worden gegooid dan een gewone steen.
items.equipment.weapon.missiles.throwingstone.discover_hint=Een van de helden begint met dit voorwerp.

items.equipment.weapon.missiles.tomahawk.name=tomahawk
items.equipment.weapon.missiles.tomahawk.stats_desc=Dit wapen veroorzaakt _%1$d-%2$d bloeding_ bij zijn doelwit.
items.equipment.weapon.missiles.tomahawk.typical_stats_desc=Dit wapen veroorzaakt normaal gesproken _%1$d-%2$d bloeding_ bij zijn doelwit.
items.equipment.weapon.missiles.tomahawk.desc=Deze werpbijlen hebben een gekartelde rand die voor scheuring zorgt als ze aan een vijand blijven plakken

items.equipment.weapon.missiles.trident.name=drietand
items.equipment.weapon.missiles.trident.desc=Enorme werpsperen met drie dodelijke tanden aan het uiteinde. Ze zijn krachtig, maar behoorlijk zwaar.


items.equipment.weapon.spiritbow.name=geestboog
items.equipment.weapon.spiritbow.ac_shoot=SCHIET
items.equipment.weapon.spiritbow.prompt=Kies een doel
items.equipment.weapon.spiritbow.stats=De boog kan niet direct worden opgewaardeerd, maar wordt in plaats daarvan gestaag sterker naarmate je niveau omhoog gaat. Op je huidige niveau richten pijlen die met de boog worden geschoten _%1$d-%2$d schade_ aan en heeft de boog _%3$d sterkte_ nodig om goed te kunnen gebruiken.
items.equipment.weapon.spiritbow.desc=Een boog gemaakt van oud magisch hout. De pees en het reliëf op de boog gloeit met een bleekblauw licht. Wanneer de pees wordt gespannen, roept deze boog een magische pijl op die op een vijand kan worden afgevuurd.
items.equipment.weapon.spiritbow.discover_hint=Een van de helden begint met dit voorwerp.

items.equipment.weapon.weapon.identify=Je hebt je wapen voldoende gebruikt om het te identificeren.
items.equipment.weapon.weapon.too_heavy=Vanwege je ontoereikende kracht belemmert dit wapen je aanvalssnelheid, nauwkeurigheid en je vermogen om verrassingsaanvallen uit te voeren.
items.equipment.weapon.weapon.excess_str=Vanwege je overmatige kracht breng je tot _0-%d bonusschade_ met dit wapen toe.
items.equipment.weapon.weapon.hardening_gone=De verharding van dit wapen is uitgewerkt!
items.equipment.weapon.weapon.incompatible=Interactie van verschillende soorten magie heeft de betovering van dit wapen ongedaan gemaakt!
items.equipment.weapon.weapon.cursed_worn=Omdat dit wapen vervloekt is, ben je machteloos om het terug te nemen.
items.equipment.weapon.weapon.cursed=Je voelt een kwaadaardige magie schuilen in dit wapen.
items.equipment.weapon.weapon.weak_cursed=Ondanks de vloek kun je dit wapen terugnemen.
items.equipment.weapon.weapon.not_cursed=Dit wapen is vrij van kwaadaardige magie.
items.equipment.weapon.weapon.faster=Het is aangepast om de _snelheid_ te verhogen.
items.equipment.weapon.weapon.stronger=Het is aangepast om meer _schade_ toe te brengen.
items.equipment.weapon.weapon.enchanted=het heeft een _%s._
items.equipment.weapon.weapon.enchant_hardened=Het is _verhard._
items.equipment.weapon.weapon.hardened_no_enchant=Dit wapen is _gehard_, maar is momenteel niet betoverd.
items.equipment.weapon.weapon$enchantment.enchant=betovering
items.equipment.weapon.weapon$enchantment.rankings_desc=Gedood door een betovering
items.equipment.weapon.weapon$enchantment.discover_hint=Je kunt een item met dit effect zomaar in de kerker vinden, of probeer het zelf op een item toe te passen.


###misc items
items.amulet.name=amulet van yendor
items.amulet.ac_end=EINDIG HET SPEL
items.amulet.desc=Het Amulet van Yendor is het meest krachtige artefact dat de mens of de dwerg kent. De glinsterende kristallen bevatten een ongelooflijke en wonderbaarlijke kracht.
items.amulet.desc_origins=De oorsprong van het amulet is onbekend. De geschiedenis zegt dat de koning van de dwergen pochte dat hij het artefact had ontdekt kort voordat de dwergenbeschaving alle contact verbrak. Hoe heeft hij het gevonden? Hoe nam Yog-Dzewa het van hem af? Vragen voor een andere keer, het enige dat er nu toe doet, is dat het amulet van jou is!
items.amulet.desc_ascent=De oorsprong van het amulet is onbekend, maar het is duidelijk sterk beïnvloed door de kracht van Yog-Dzewa. De kerker lijkt naar de wil van Yog te buigen als je er doorheen loopt, waardoor vijanden veel overvloediger en krachtiger worden! Je kunt het amulet ook niet meer activeren of weggooien, bijna alsof het vervloekt is.
items.amulet.ascent_title=Opgang
items.amulet.ascent_desc=Je voelt Yog-Dzewa's grote en verschrikkelijke kracht uit het amulet stralen. Terug omhoog gaan door de kerker als een sterveling is misschien moeilijker dan je dacht!\n\nAls je doorgaat met omhoog gaan met het amulet, wordt de kerker gevaarlijker, worden teleportaties tussen verdiepingen uitgeschakeld en kun je het spel alleen winnen door vijanden te verslaan terwijl je omhoog gaat!\n\nJe kunt het amulet hier voorlopig laten als je omhoog wilt gaan zonder deze uitdaging aan te gaan, of het amulet activeren voordat je omhoog gaat om het spel normaal te beëindigen.
items.amulet.ascent_yes=Doorgaan!
items.amulet.ascent_no=Stop voor Nu
items.amulet.discover_hint=Dit voorwerp vind je onderaan de kerker...

items.ankh.name=ankh
items.ankh.ac_bless=ZEGEN
items.ankh.bless=Je zegent de ankh met magisch water.
items.ankh.desc=Dit oude symbool van onsterfelijkheid geeft het vermogen om na de dood weer tot leven te komen. De meeste voorwerpen vallen neer waar je stierf, maar kunnen weer worden verkregen als je naar ze terugkeert. Met een volle waterzak kan de ankh gezegend worden met extra kracht.
items.ankh.desc_blessed=Dit oude symbool van onsterfelijkheid geeft je het vermogen om na de dood weer tot leven te komen. De ankh is gezegend en is nu veel sterker. De Ankh offert zichzelf op om je te redden in een moment van dodelijk gevaar.
items.ankh.discover_hint=Je kunt dit voorwerp in een winkel kopen.

items.arcaneresin.name=mysterieuze hars
items.arcaneresin.prompt=Kies een toverstok
items.arcaneresin.ac_apply=TOEPASSEN
items.arcaneresin.level_too_high=Die toverstok is te krachtig om te verbeteren met hars.
items.arcaneresin.not_enough=Daar heb je niet genoeg hars voor!
items.arcaneresin.apply=Je bedekt je toverstok met hars, waardoor de kracht ervan toeneemt!
items.arcaneresin.desc=Dit fijne poeder glinstert tussen de tinten paars en wit. Het kan fungeren als een versterker voor magische energie, waardoor het niveau van toverstokken wordt verhoogd wanneer het erop wordt toegepast!\n\nHet opwaarderen van een toverstaf kost 1, 2 of 3 hars, afhankelijk van het startniveau van de toverstaf. Hars kan toverstokken opwaarderen tot een maximum van +3.\n\nOpwaarderingen van hars worden echter _overschreven door andere opwaardeerbronnen_ (zoals rollen van opwaardering) en zijn niet van toepassing wanneer de staf van de Magiër wordt verrijkt met de toverstaf.
items.arcaneresin.discover_hint=Je kunt dit voorwerp maken met behulp van alchemie.

items.brokenseal.name=gebroken zegel
items.brokenseal.ac_affix=BEVESTIG
items.brokenseal.prompt=Kies een harnas
items.brokenseal.unknown_armor=Je moet eerst identificeren of dat harnas vervloekt is of niet.
items.brokenseal.cursed_armor=Het zegel kan niet worden bevestigd op vervloekte harnassen.
items.brokenseal.affix=Je bevestigt het zegel op je harnas!
items.brokenseal.desc=Een zegel van was, bevestigd aan een harnas als symbool van moed. In het midden zit een vervaagde rune van bescherming gegraveerd, en is doormidden gebarsten.\n\nAls aandenken aan zijn thuis helpt het zegel de krijger om te volharden. Tijdens het dragen van het zegel krijgt de krijger direct bescherming wanneer hij bijna tot de helft van zijn gezondheid of minder beschadigd raakt.\n\nHet zegel kan _op een harnas worden bevestigd_ en tussen verschillende harnassen worden verplaatst. Het kan een enkele opwaardering met zich meedragen, zolang die opwaardering maar op het harnas is toegepast terwijl het zegel eraan was bevestigd.
items.brokenseal.inscribed=Het zegel is voorzien van een _%s._
items.brokenseal.choose_title=Kies een symbool
items.brokenseal.choose_desc=Zowel dit harnas als het verbroken zegel dragen een symbool. Kies welk symbool moet worden behouden.\n\nPantsersymbool: %1$s\nGebroken Zegelsymbool: %2$s\n\nHoud er rekening mee dat als je het symbool kiest dat op dat moment op het harnas staat, het zegel dit later niet kan overdragen.
items.brokenseal.discover_hint=Een van de helden begint met dit voorwerp.
items.brokenseal$warriorshield.name=Krijgersschild
items.brokenseal$warriorshield.desc_active=Het gebroken zegel van de Krijger helpt hem momenteel om te volharden en geeft hem naast zijn gezondheid ook een schild. Nadat het schild voor het eerst is geactiveerd is er een afkoeltijd voordat het opnieuw kan worden gebruikt.\n\nDit schild vervalt niet na verloop van tijd, maar zal verdwijnen als er een paar beurten geen vijanden in de buurt zijn. Wanneer het verdwijnt, zal elk ongebruikt schild de afkoeltijd verkorten, tot een maximum van 50%%.\n\nResterend schild: %1$d.\n\nHuidige afkoeltijd: %2$d.
items.brokenseal$warriorshield.desc_cooldown=De Krijger heeft onlangs bescherming gekregen door zijn gebroken zegel en moet wachten tot hij weer van het beschermende effect kan profiteren.\n\nResterende beurten: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=De afkoeltijd van het schild van de Krijger is momenteel negatief, wat betekent dat wanneer zijn schild wordt geactiveerd, de afkoeltijd korter zal zijn dan de gebruikelijke 150 beurten. De afkoeltijd van het schild kan worden teruggebracht tot wel -150 beurten, wat betekent dat het direct weer beschikbaar is zodra het wordt geactiveerd.\n\nHuidige afkoeltijd: %d.

items.dewdrop.name=dauwdruppel
items.dewdrop.already_full=Je hebt al een volledige gezondheid.
items.dewdrop.desc=Een kristalheldere dauwdruppel.\n\nDoor de magie van deze plek heeft zuiver water kleine herstellende eigenschappen.

items.equipableitem.curse_detected=Je voelt dat het voorwerp vervloekt is vlak voordat je het uitrust!
items.equipableitem.unequip_cursed=Je kunt een vervloekt voorwerp niet terugnemen!
items.equipableitem.ac_equip=HANTEER
items.equipableitem.ac_unequip=NEEM TERUG

items.energycrystal.name=energiekristal
items.energycrystal.desc=Een verzameling kleine magische kristallen, gevuld met alchemistische energie.\n\nDeze kristallen zijn het meest voorkomende ingrediënt in alchemierecepten en kunnen worden geproduceerd in een alchemieketel met bruikbare voorwerpen.

items.gold.name=goud
items.gold.desc=Een stapel gouden munten. Verzamel gouden munten om ze later uit te geven in een winkel.

items.heap.for_sale=%1$dg: %2$s
items.heap.chest=Kist
items.heap.chest_desc=Je weet pas wat erin zit als je het opent!
items.heap.locked_chest=Afgesloten kist
items.heap.locked_chest_desc=Je weet pas wat erin zit als je het opent! Maar om hem te openen heb je een gouden sleutel nodig.
items.heap.crystal_chest=Kristallen kist
items.heap.crystal_chest_desc=Je kunt _%s_ binnenin zien, maar om de kist te openen heb je een kristallen sleutel nodig.
items.heap.artifact=een artefact
items.heap.wand=een toverstaf
items.heap.ring=een ring
items.heap.tomb=Graftombe
items.heap.tomb_desc=Deze oude graftombe kan iets nuttigs bevatten, maar de eigenaar heeft zeker bezwaar tegen het controleren.
items.heap.skeleton=Skeletresten
items.heap.skeleton_desc=Dit is alles wat er over is van een ongelukkige avonturier. Misschien is het de moeite waard om te controleren op waardevolle spullen.
items.heap.remains=Heldenresten
items.heap.remains_desc=Dit is alles wat er over is van een van je voorgangers. Misschien is het de moeite waard om te controleren op waardevolle spullen.

items.honeypot.name=honingpot
items.honeypot.ac_shatter=BREEK
items.honeypot.desc=Deze grote honingpot is alleen bekleed met honing, binnenin herbergt het een gigantische bij! Dit soort enorme bijen blijven meestal in hun bijenkorven, misschien is de pot een soort gespecialiseerde kooi van een stroper? De bij lijkt behoorlijk tevreden in de pot met zijn honing, en zoemt je behoedzaam toe als je ernaar kijkt.
items.honeypot$shatteredpot.name=gebroken honingpot
items.honeypot$shatteredpot.desc=De pot is verbrijzeld, alleen de kleverige bekleding van honing houdt hem bij elkaar en hij valt langzaam uit elkaar.\n\nOndanks zijn gebroken staat, lijkt de bij de pot nog steeds te willen beschermen.

items.item.prompt=Kies richting van worp
items.item.ac_drop=LEG NEER
items.item.ac_throw=GOOI
items.item.rankings_desc=Gedood door: %s
items.item.curse=vloek
items.item.custom_note_type=Dit type voorwerp heeft een notitie: "_%s_"
items.item.custom_note=Dit item heeft een aangepaste notitie: "_%s_"
items.item.discover_hint=Je kunt dit item zomaar in de kerker vinden.

items.kindofmisc.unequip_title=Een voorwerp terugnemen
items.kindofmisc.unequip_message=Je moet eerst een van deze voorwerpen terugnemen in je inventaris. Kies een voorwerp om mee te ruilen.

items.kindofweapon.swift_equip=Je rust vlug je wapen uit.
items.kindofweapon.equip_cursed=Je greep wordt zonder dat je het wilt strakker rond het wapen.
items.kindofweapon.which_equip_msg=In welk wapenslot zou je dit voorwerp willen uitrusten?\n\nDe Kampioen valt rechtstreeks aan met haar primaire wapen, maar kan de vaardigheid van beide wapens gebruiken. Beide wapens delen dezelfde lading.\n\nDe Kampioen kan ook direct haar primaire en secundaire wapen wisselen.
items.kindofweapon.which_equip_primary=Primair (%s)
items.kindofweapon.which_equip_secondary=Secundair (%s)
items.kindofweapon.empty=leeg

items.kingscrown.name=Kroon van de Dwergenkoning
items.kingscrown.ac_wear=ZET OP
items.kingscrown.naked=Helaas kan de kroon je ondergoed niet transformeren.
items.kingscrown.upgraded=De kroon gloeit helder en valt dan uiteen als je harnas verandert!
items.kingscrown.ratgraded=De poten van Rattenkoning gloeien helder terwijl je harnas verandert!
items.kingscrown.desc=De kroon van de laatste dwergenkoning, gloeiend met een enorme magische energie.\n\nWanneer het wordt gedragen, vloeit de magie van de kroon in het harnas dat je momenteel draagt, en transformeert het in een _uniek episch harnas met speciale vaardigheden._ Het nieuwe harnas behoudt alle eigenschappen van het originele harnas.
items.kingscrown.discover_hint=Je kunt dit voorwerp krijgen doordat bepaalde vijanden het laten vallen.

items.liquidmetal.name=vloeibaar metaal
items.liquidmetal.ac_apply=PAS TOE
items.liquidmetal.prompt=Kies een werpwapen
items.liquidmetal.already_fixed=Dat werpwapen is al in perfecte staat!
items.liquidmetal.apply=Je gebruikt %d vloeibaar metaal om je werpwapen te repareren.
items.liquidmetal.desc=Deze magische vloeistof kan de scheuren en barsten van een geworpen wapen opvullen en het in perfecte staat herstellen! Als een wapenset een wapen mist, maar verder volledig gerepareerd is, kan vloeibaar metaal zelfs gebruikt worden om een ontbrekend wapen uit de set te vervangen!\n\nEen wapen van niveau 1 vereist 10 vloeibaar metaal om volledig gerepareerd te worden, een wapen van niveau 5 vereist 30. Elke upgrade verhoogt ook de benodigde hoeveelheid metaal met 35%.\n\nVloeibaar metaal kan niet gebruikt worden om de punten van dartpijlen te repareren.
items.liquidmetal.discover_hint=Je kunt dit voorwerp maken met behulp van alchemie.

items.lostbackpack.name=verloren rugzak
items.lostbackpack.desc=Dit is je verloren inventaris. Pak het om alle verloren voorwerpen terug te krijgen!

items.merchantsbeacon.name=baken van de handelaar
items.merchantsbeacon.ac_use=GEBRUIK
items.merchantsbeacon.desc=Dit vreemde stukje dwergtechnologie stelt je in staat om vanaf grote afstanden te communiceren.\n\nNa activering kun je met dit baken voorwerpen verkopen aan Pixel Markt vanaf elke plek in de kerker.\n\nDe magie in het baken duurt echter alleen één sessie, dus gebruik het verstandig.

items.stylus.name=mysterieuze stift
items.stylus.ac_inscribe=SCHRIJF
items.stylus.prompt=Kies een harnas
items.stylus.identify=Je moet eerst vaststellen of het harnas vervloekt is.
items.stylus.cursed=De magie van de stift werkt niet op een vervloekt harnas.
items.stylus.inscribed=Je hebt je op je harnas geschreven met de stift.
items.stylus.desc=Deze mysterieuze stift is gemaakt van een donkere, zeer harde steen. Hiermee kun je een magisch symbool op je harnas schrijven, maar je kunt niet kiezen wat voor symbool het wordt, dit beslist de stift voor je.

items.tengusmask.name=Tengu's masker
items.tengusmask.ac_wear=ZET OP
items.tengusmask.used=Het masker valt uiteen als zijn kracht in je stroomt!
items.tengusmask.desc=Dit masker viel van Tengu's gezicht toen hij stierf. Je voelt een grote magische kracht die ervan uitgaat. Was het masker Tengu's krachtbron?\n\nAls je het masker draagt, wordt de enorme kracht van het masker op je overgedragen, zodat je een subklasse voor je held kunt kiezen._\n\nWelke subklasse kies je?
items.tengusmask.discover_hint=Je kunt dit voorwerp krijgen doordat bepaalde vijanden het laten vallen.

items.torch.name=fakkel
items.torch.ac_light=STEEK AAN
items.torch.desc=Een hoofdbestanddeel van ieder avontuur: wanneer een kerker donker wordt, helpt een fakkel de weg te wijzen.

items.waterskin.name=waterzak
items.waterskin.ac_drink=DRINK
items.waterskin.collected=Je verzamelt de dauwdruppel in je waterzak.
items.waterskin.full=Je waterzak is vol!
items.waterskin.empty=Je waterzak is leeg!
items.waterskin.desc=Een houder voor vloeistof, gemaakt van leer en touw, afgesloten met een kurken stop.
items.waterskin.desc_water=Op dit moment bevat de waterzak gewoon wat drinkwater. Er is vast wel iets in de kerker dat je in de waterzak zou kunnen bewaren.
items.waterskin.desc_heal=De waterzak wordt momenteel gebruikt om geneeskrachtig water op te slaan. Hoe voller de waterzak is, hoe meer je direct genezen bent als je ervan drinkt. Je drinkt alleen zoveel als je nodig hebt.
items.waterskin.desc_full=De volle waterzak lijkt energie uit te stralen, misschien kan het gebruikt worden om een ander voorwerp voor overleving te zegenen?
items.waterskin.discover_hint=Een van de helden begint met dit voorwerp.
