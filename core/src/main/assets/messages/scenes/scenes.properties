# SPS: supporter scene source tabs
scenes.supporterscene.tab_pd=PD (Shattered)
scenes.supporterscene.tab_sps=SPS (Special Surprise)
scenes.supporterscene.tab_spsex=SPSEX (Port)
scenes.supporterscene.sps_msg=Special Surprise Pixel Dungeon (SPS) by hmdzl is a massive fan expansion of classic Pixel Dungeon: loads of items and equipment, pets and eggs, a town with merchants, legacy classes and skills, and rich side content. It is open source under GPLv3.\n\nSPS is the content source of this port project. Thanks to all Pixel Dungeon mod authors!
scenes.supporterscene.spsex_msg=SPSEXPD, maintained by ConsonanceTrad, ports SPS 0.9.8 onto the Shattered Pixel Dungeon 4.0.0 engine, blending selected low-pressure quality-of-life features of SPS into the Shattered base.\n\nThe project is open source (GPLv3) and under active development. If you enjoy it, playtesting, feedback, or a GitHub Star is the best support!
scenes.supporterscene.spsex_link=Project repository (GitHub)
scenes.supporterscene.spsex_url=https://github.com/ConsonanceTrad/STSEXPD

# SPS: changes scene source tabs
scenes.changesscene.tab_pd=PD (Shattered)
scenes.changesscene.tab_sps=SPS (Special Surprise)
scenes.changesscene.tab_spsex=SPSEX (Port)
scenes.changesscene.sps_title=Special Surprise (SPS 0.9.8) - content source
scenes.changesscene.sps_body=The content baseline of this port. SPS by hmdzl massively expands classic Pixel Dungeon:\n_items_: 1000+ items, special weapons and skill books, mushrooms and cooking, plants and potions;\n_pets and town_: pet eggs and companions, town merchants and collectors, donations and minigames;\n_classes and challenges_: legacy classes and combat styles, adventure routes and challenges, chapter bosses and the endgame.\nPort coverage is listed under the SPSEX tab.
scenes.changesscene.spsex_title=SPSEXPD 0.1.0-alpha - port progress
scenes.changesscene.spsex_body=Engine and content:\n_- All main floors 0-26 ported_ (floor 0 special starting floor: scholar, quest mushroom shop, starting gold);\n_- 12 hero classes_ (incl. Duelist) and 1034+ item classes;\n_- Fixed levels and boss timelines_, adventure routes, challenge rewards, tutorial level;\n_- SPS item systems_: mushrooms, cooking, plants, medicine, runic chips, pet eggs and more.
scenes.changesscene.spsex_title2=Recent changes (0.1.0-alpha)
scenes.changesscene.spsex_body2=- _Backpack and equipment rework_: 35-slot backpack (5x7), two equipment rows (main/off weapon, main/off armor, 5 universal accessory slots, badge slot);\n- _Bags_: unified capacity 34, duplicates convert to dark gold;\n- _Tri-zone quickslots_: fixed 18-slot bar plus adjustable side bars;\n- _Original splash art_ for fusion classes and a new main menu (demon blade continue button, source tabs);\n- _Bug fixes_: key pickup crash, water edge rendering, UI thread crashes and more.