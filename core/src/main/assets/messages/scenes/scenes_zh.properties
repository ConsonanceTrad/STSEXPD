scenes.titlescene.patreon_body=《破碎像素地牢》是一款完全免费的游戏，有玩家的大方捐献支持我才能一直坚持开发。\n\n如果想支持我，最好的方法是使用Patreon平台。Patreon能提供一个稳定的收入源，也让我有方法回馈我的支持者！\n\nPatreon支持者每周都可以看一篇独家文章，抢先于其他所有人了解我的下一步开发想法！\n\n你可以访问我的Patreon页面获悉最新的回馈详情。感谢你的支持！\n\n(Patreon奖励只能提供英语内容，请见谅)
scenes.titlescene.patreon_button=Patreon赞助页面

scenes.welcomescene.update_intro=SPS-SPD 已经更新！
scenes.welcomescene.update_msg=SPS-SPD 4.0.0-sps.1 已建立特别惊喜像素地牢基于破碎 4.0 的独立移植工程。现有异界路线、挑战、伙伴、装备、九格快捷栏和水袋操作均予保留，其余旧版系统将依据可核验的内容台账继续迁移。
scenes.welcomescene.patch_intro=破碎的像素地牢补丁已经成功安装！
