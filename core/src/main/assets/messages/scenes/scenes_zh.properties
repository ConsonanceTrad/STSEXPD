scenes.supporterscene.tab_spsex=SPSEX 移植版
scenes.supporterscene.sps_msg=特别惊喜像素地牢（Special Surprise Pixel Dungeon，简称 SPS）由 hmdzl 制作，是一款在经典像素地牢基础上大幅扩展的同人作品：海量物品与装备、宠物与蛋、城镇与商人、传承职业与技能、丰富的支线与挑战内容，并以 GPLv3 开源发布。\n\nSPS 是本移植项目的内容源头。向所有像素地牢同人作品的创作者致谢！
scenes.supporterscene.spsex_msg=特别惊喜移植版（SPSEXPD）由协音Trad 维护：将 SPS 0.9.8 的内容移植到破碎像素地牢 4.0.0 引擎，并选取 SPS 的低压体验特性融入破碎基底。\n\n项目以 GPLv3 协议开源、持续开发中。若你喜欢这个项目，欢迎参与测试、反馈问题，或在 GitHub 上点个 Star——这就是最好的支持！
scenes.supporterscene.spsex_link=项目仓库（GitHub）
scenes.supporterscene.spsex_url=https://github.com/ConsonanceTrad/STSEXPD

# SPS: 改动窗口三来源标签页
scenes.changesscene.tab_pd=PD 破碎
scenes.changesscene.tab_sps=SPS 特别惊喜
scenes.changesscene.tab_spsex=SPSEX 移植版
scenes.changesscene.sps_title=特别惊喜（SPS 0.9.8）· 内容源头
scenes.changesscene.sps_body=本移植项目的内容基准。SPS 由 hmdzl 在经典像素地牢基础上大幅扩展：\n_海量物品_：1000+ 物品、特殊武器与技能书、药蘑菇与料理、植物与药剂；\n_宠物与城镇_：宠物蛋与伙伴、城镇商人与收藏家、捐献与小游戏；\n_职业与挑战_：传承职业与战斗风格、异界路线与挑战、章节 Boss 与终局。\n移植程度详见「SPSEX 移植版」标签页。
scenes.changesscene.spsex_title=SPSEXPD 0.1.0-alpha · 移植进度
scenes.changesscene.spsex_body=引擎与内容：\n_- 主线 0-26 层全部接入_（0 层特殊初始层：学者、任务蘑菇商店、开局金币）；\n_- 12 个职业_（含决斗家）与 1034+ 物品类；\n_- 固定层与 Boss 时间线_、异界路线、挑战奖励、教学层；\n_- SPS 物品系统_：药蘑菇、料理、植物、药剂、洛克芯片、宠物蛋等。
scenes.changesscene.spsex_title2=近期改动（0.1.0-alpha）
scenes.changesscene.spsex_body2=- _背包与装备重构_：主背包 35 格（5x7）、装备区两排（主/副武器、主/副护甲、5 通用饰品槽、徽章槽）；\n- _包裹袋_：容量统一 34（打开 9 行满格）、重复拾取折算暗金；\n- _三区快捷栏_：18 槽固定段 + 左右侧栏数量可调；\n- _融合职业原创立绘_与新主菜单（恶魔刀锋继续按钮、三来源标签页）；\n- _BUG 修复_：钥匙拾取崩溃、水边缘渲染错位、UI 线程崩溃等。