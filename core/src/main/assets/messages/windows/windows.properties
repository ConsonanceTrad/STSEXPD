windows.wndegoalinfo.title=test by egoal
windows.wndegoalinfo.info1=Meow. adventurer. A peaceful town, isn't it? I can't feel any pressure in your face, because your journey is very easy?\n\nSo my question is: \n_Egoal_ is a good person, right?
windows.wndegoalinfo.yes=Right
windows.wndegoalinfo.tell1=I'm glad of your answer, but I don't have a present for you this time. Good luck.
windows.wndegoalinfo.no=Who is he?
windows.wndegoalinfo.tell2=Meow, do you know _darkest pixel dungeon_? I hope you can go there to continue your adventure. You will do that, right? Good luck.
