actors.buffs.actbuff.nmimbue.name=纳米环绕
actors.buffs.actbuff.nmimbue.burnsup=%s被同化了！
actors.buffs.actbuff.nmimbue.desc=纳米机器人环绕着你。它们形成的云雾会伤害敌人，但也会定期同化携带的装备以继续增殖。
actors.buffs.actbuff.nmstop.name=纳米熔断
actors.buffs.actbuff.nmstop.desc=纳米机器人停止增殖并逐步分解。\n\n剩余时长：%s回合
