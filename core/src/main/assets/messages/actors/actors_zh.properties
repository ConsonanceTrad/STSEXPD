actors.mobs.adventureguardian.boss_name_23=Zot投影
actors.mobs.adventureguardian.boss_name_24=Zot
actors.mobs.fiend.name=邪魔
actors.mobs.fiend.desc=邪魔本身由暗影能量组成...但它的斗篷是哪来的?
actors.mobs.goldorc.name=金眼猪人
actors.mobs.goldorc.def_verb=格挡
actors.mobs.goldorc.desc=黑暗能量腐蚀了猪人，使纯洁的猪人变成了危险的怪物。
actors.mobs.bluewraith.name=怨灵战士
actors.mobs.bluewraith.desc=相较其他怨灵而言，怨灵战士更喜欢近距离作战而不是远程打击。它们的行动速度也比其他怨灵快。
actors.mobs.orc.name=猪人
actors.mobs.orc.desc=凶悍的猪面战士，受到重创时会释放腐化气体。
actors.mobs.orc.killcount=已击败猪人：%d
actors.mobs.flyingprotector.name=智慧守卫
actors.mobs.flyingprotector.desc=智慧试炼的守护者。
actors.mobs.flyingprotector.zap_kill=智慧守卫的闪电击杀了你……
actors.mobs.shadowyog.name=Yog-Dzewa之影
actors.mobs.shadowyog.desc=Yog之影是Yog在另一世界的投影。击败它或许可以知晓穿越世界的秘密。
actors.mobs.shadowyog.blink=Yog之影转移了！
actors.mobs.shadowyog.die=……
actors.mobs.shadowyog.illusion=光明已逝，暗影降临……
actors.mobs.tenguden.name=匿藏的天狗
actors.mobs.tenguden.desc=逃离监牢的著名刺客。他以诡诈的身法和精准攻击消灭所有找到隐匿处的人。
actors.mobs.tenguden.notice=你是怎么找到我的？！
actors.mobs.tenguden.die=诅咒你永世不得好死！
actors.mobs.skeletonhand1.name=王之右手
actors.mobs.skeletonhand1.desc=骷髅王的右手，王者的右手。
actors.mobs.skeletonhand2.name=亡之左手
actors.mobs.skeletonhand2.desc=骷髅王的左手，亡者的左手。
actors.mobs.skeletonking.name=奥瑞克莱
actors.mobs.skeletonking.desc=骷髅王是一个十分强大的存在。
actors.mobs.skeletonking.notice=你会被亡灵的怒火吞没，%s！
actors.mobs.skeletonking.die=魔法不够了……
actors.mobs.crabking.name=远古巨蟹
actors.mobs.crabking.desc=远古巨蟹收集保护类魔法和物品，以保护它的子民免受黑暗或贪婪者的袭击。它藏在一副强大的甲壳中。
actors.mobs.crabking.notice=请离开这里，否则我就对你不客气了！
actors.mobs.crabking.die=抱歉……我的子民……
actors.mobs.crabking.heal=远古巨蟹从高压电壳中吸取了能量！
actors.mobs.shell.name=高压电壳
actors.mobs.shell.desc=高压电壳中涌动着从巨蟹王随从所受攻击里吸收的能量。
actors.mobs.shell.zap=高压电壳释放了电能！
actors.mobs.spshermitcrab.name=寄居蟹
actors.mobs.spshermitcrab.desc=传奇巨蟹的随从。这些坚韧的螃蟹会用甲壳吸收强力攻击，并把能量传给高压电壳。
actors.mobs.spshermitcrab.absorb=寄居蟹将攻击的能量传入了高压电壳。
actors.mobs.adventureguardian.tactic_6=它以火焰攻击压迫走位，并在阶段转换时加速。
actors.mobs.adventureguardian.tactic_7=它从远处射击，重型外壳会在阶段转换时产生护盾。
actors.mobs.adventureguardian.tactic_9=它会施加毒素，并在每次阶段转换时孵化一只回响。
actors.mobs.adventureguardian.tactic_10=它以致盲飞镖牵制，并在阶段转换时转移位置。
actors.mobs.adventureguardian.tactic_11=它会削弱近身者，并两次召来陵墓回响。
actors.mobs.adventureguardian.tactic_12=它擅长迟滞敌人，并依靠比其他首领更厚的阶段护盾作战。
actors.mobs.adventureguardian.tactic_13=它从远处致盲目标，并在受创后呼叫一名同党。
actors.mobs.adventureguardian.tactic_14=它会削弱敌人，并在阶段转换时召集原野回响。
actors.mobs.adventureguardian.tactic_15=它能扰乱移动方向，陶片护盾会在阶段转换时重组。
actors.mobs.adventureguardian.tactic_16=它从远处散播毒素，并在阶段转换时遁入地图另一处。
actors.mobs.adventureguardian.tactic_17=它会发动远程火焰攻击，并在每个阶段唤来幼龙回响。
actors.mobs.adventureguardian.tactic_18=它以致盲攻击拖延追兵，并会两次改变逃亡位置。
actors.mobs.adventureguardian.tactic_19=它使用远程迟滞攻击，阶段护盾比一般首领更厚。
actors.mobs.adventureguardian.tactic_20=它会从远处暴露目标弱点，并在阶段转换时传送。
actors.mobs.adventureguardian.tactic_21=四名首领回响会依次接战，分别使用残废、致盲、虚弱与减速攻击；总生命受到终局预算限制。
actors.mobs.adventureguardian.tactic_22=它的异常效果会变化，并在阶段转换时随机换位。
actors.mobs.adventureguardian.tactic_23=它从远处暴露弱点，并在阶段转换时制造Zot回响。
actors.mobs.adventureguardian.tactic_24=它交替使用毒素与寒冷，并同时具有召唤和传送能力。

actors.mobs.npcs.sokobanblock.name=推箱石块
actors.mobs.npcs.sokobanblock.desc=沉重的谜题石块。从上下左右与其交互，可以将它向前推动一格。把所有石块推到有标记的基座上即可完成地图。
actors.hero.heroclass.performer=演员
actors.hero.heroclass.performer_desc_short=演员在获得经验后进入短暂的_节奏_，以长距离武器和战斗技巧灵活周旋。
actors.hero.heroclass.performer_desc=演员每次获得经验时都会得到短暂的_节奏祝福_，升级时还会获得少量护盾。初始装备为匕首和芦苇管；芦苇管需要达到力量要求后，才能作为长距离武器正常发挥。\n\n演员可转职为_巨星_或_戏法师_。\n\n演员开局鉴定的物品有：\n_-_催眠卷轴\n_-_净化药剂
actors.hero.heroclass.performer_unlock=融合版中演员开局即解锁。
actors.hero.heroclass.soldier=星兵
actors.hero.heroclass.soldier_desc_short=星兵拥有略高的_命中、闪避与生命成长_，但不会突破破碎装备的正常强度。
actors.hero.heroclass.soldier_desc=星兵初始携带一柄刺剑和三枚投掷尖刺。训练使其命中与闪避提高5%，初始生命上限提高2点，每次升级额外提高1点生命上限。\n\n星兵可转职为_特工_或_领袖_。\n\n星兵开局鉴定的物品有：\n_-_盛怒卷轴\n_-_治疗药剂
actors.hero.heroclass.soldier_unlock=融合版中星兵开局即解锁。
actors.hero.heroclass.follower=信徒
actors.hero.heroclass.follower_desc_short=信徒依靠_稳健的补给和更合理的价格_冒险，开局带有治疗物资和少量旅费。
actors.hero.heroclass.follower_desc=信徒初始携带短棍、一瓶治疗药剂和50金币。商店购入价格降低10%，卖出价格与随机掉落不受影响。\n\n信徒可转职为_工匠_或_牧者_。\n\n信徒开局鉴定的物品有：\n_-_恐惧卷轴\n_-_治疗药剂
actors.hero.heroclass.follower_unlock=融合版中信徒开局即解锁。
actors.hero.heroclass.ascetic=苦修者
actors.hero.heroclass.ascetic_desc_short=苦修者在_近身格斗与受控施法_之间切换，不依靠免费的高额强化。
actors.hero.heroclass.ascetic_desc=苦修者初始携带拳套和魔弹法杖。两件装备均没有免费升级，因此开局强度与破碎的其他职业保持同一预算。\n\n苦修者可转职为_戒律者_或_黑客_。\n\n苦修者开局鉴定的物品有：\n_-_充能卷轴\n_-_镜像卷轴
actors.hero.heroclass.ascetic_unlock=融合版中苦修者开局即解锁。
actors.hero.heroclass.newplayer=新手
actors.hero.heroclass.newplayer_desc_short=仅供 SPS-PD 新手教程使用的隐藏职业。
actors.hero.heroclass.newplayer_desc=新手不携带任何装备进入教程，生命上限为50点，当前生命为10点。
actors.hero.heroclass.newplayer_unlock=该职业只能通过新手教程进入。

actors.mobs.npcs.leadercn.name=领航椰子
actors.mobs.npcs.leadercn.desc=跟着这只猫完成这个教程吧。
actors.mobs.npcs.leadercn.yell1=欢迎，欢迎来到测试，拿起这把钥匙，然后打开前面的门。
actors.mobs.npcs.leadercn.yell2=你现在啥都没有，捡起周围的装备，打开右下角的背包，点击物品然后装备吧。之后可以直接击败前面的家伙。
actors.mobs.npcs.leadercn.yell3=找不到路了？看左下角的按钮，有一个放大镜，双击放大镜可以进行搜索，在周围的墙边找找，没准会有发现。
actors.mobs.npcs.leadercn.yell4=哦，你踩到了一个陷阱。看吧，左上角，你的生命已经很差了，找找周围的宝箱，或者土堆，里面可能有好东西。
actors.mobs.npcs.leadercn.yell5=不出所料，你有些饿了，那几个张网里面可能会有吃的，但我不建议你直接开。看到中间的那个奇怪的空地吗，把这个扔过去。
actors.mobs.npcs.leadercn.yell6=一个法杖，你已经可以造成魔法伤害了，前面的那家伙可不吃物理伤害，找到合适的属性来击败它吧。
actors.mobs.npcs.leadercn.yell7=好了，你已经了解到这个程序基本的运行方法了，那么，靠你自己完成接下来的内容吧。这是一枚可以破坏墙壁的炸弹。
actors.mobs.npcs.leadercn.yell8=恭喜你，你找到了最后一个分身。捡起这个布丁，教程就结束了。再见了，期待之后和你见面。

actors.hero.herosubclass.superstar=巨星
actors.hero.herosubclass.superstar_short_desc=_巨星_能让演员的节奏祝福持续更久。
actors.hero.herosubclass.superstar_desc=巨星每次获得经验后，节奏祝福由3回合延长至5回合；三阶天赋侧重移动与战斗节奏。
actors.hero.herosubclass.joker=戏法师
actors.hero.herosubclass.joker_short_desc=_戏法师_能用投掷武器妨碍敌人行动。
actors.hero.herosubclass.joker_desc=投掷攻击有20%概率使目标残废2回合；三阶天赋侧重远程布置与强化共享。
actors.hero.herosubclass.agent=特工
actors.hero.herosubclass.agent_short_desc=_特工_使用投掷武器时拥有更高命中。
actors.hero.herosubclass.agent_desc=特工使用投掷武器时命中提高15%；三阶天赋强化射程、移动和悬赏作战。
actors.hero.herosubclass.leader=领袖
actors.hero.herosubclass.leader_short_desc=_领袖_在正面受击时更加沉着。
actors.hero.herosubclass.leader_desc=领袖在计算护甲前受到的伤害降低10%；三阶天赋侧重防护和支援。
actors.hero.herosubclass.artisan=工匠
actors.hero.herosubclass.artisan_short_desc=_工匠_能够更有效率地驾驭高要求装备。
actors.hero.herosubclass.artisan_desc=计算装备力量需求时，工匠视为额外拥有1点力量；三阶天赋侧重装备灵活性。
actors.hero.herosubclass.pastor=牧者
actors.hero.herosubclass.pastor_short_desc=_牧者_在饱腹时恢复生命的效率更高。
actors.hero.herosubclass.pastor_desc=牧者的自然恢复速度提高25%。与旧版机制不同，这项恢复不能超过生命上限。
actors.hero.herosubclass.ascetic_monk=戒律者
actors.hero.herosubclass.ascetic_monk_short_desc=_戒律者_专精于节制而稳定的拳套战斗。
actors.hero.herosubclass.ascetic_monk_desc=戒律者使用拳套时额外造成1点伤害。该路线沿用武僧天赋族，但与决斗家的武僧专精相互独立。
actors.hero.herosubclass.hacker=黑客
actors.hero.herosubclass.hacker_short_desc=_黑客_能将充能状态转换为近战力量。
actors.hero.herosubclass.hacker_desc=处于充能状态时，黑客造成的物理伤害提高10%；三阶天赋侧重法杖充能与强化打击。
actors.mobs.npcs.adventureguide.name_0=居所记录员
actors.mobs.npcs.adventureguide.desc_0=记录员负责维持返回主地牢的稳定路线。安全居所不会生成可反复获取的补给。
actors.mobs.npcs.adventureguide.dialogue_0=异界日志已经与居所路标同步，推箱练习场的路线已被记录。
actors.mobs.npcs.adventureguide.name_5=多利亚镇委托人
actors.mobs.npcs.adventureguide.desc_5=委托人负责登记城镇远征。完成这次交谈后，春节庭院与矿区路线会依次开放。
actors.mobs.npcs.adventureguide.dialogue_5=城镇档案已经认可你的异界日志，春节庭院被登记为下一项委托。
actors.mobs.npcs.adventureguide.name_8=新居看守者
actors.mobs.npcs.adventureguide.desc_8=看守者守护着从和平地图通往危险远征链的路线。
actors.mobs.npcs.adventureguide.dialogue_8=准备已经完成，寄生虫巢被登记为第一项战斗远征。
actors.mobs.npcs.adventureguide.town_shop=查看有限补给
actors.mobs.npcs.adventureguide.town_leave=暂时离开
actors.mobs.npcs.adventureguide.shop_title=多利亚镇补给
actors.mobs.npcs.adventureguide.shop_desc=这些货物每局各有一件，售出后不会补货。信徒职业享受九折价格。
actors.mobs.npcs.adventureguide.stock_0=治疗药剂 - %d金币
actors.mobs.npcs.adventureguide.stock_1=食物 - %d金币
actors.mobs.npcs.adventureguide.stock_2=魔法地图卷轴 - %d金币
actors.mobs.npcs.adventureguide.stock_3=鉴定卷轴 - %d金币
actors.mobs.npcs.adventureguide.sold=（已售出）
actors.mobs.npcs.adventureguide.not_enough=你的金币不够。
actors.mobs.npcs.adventureguide.bought=你用%2$d金币购买了%1$s。
actors.mobs.npcs.adventureguide.forge=异界锻造 - %d金币
actors.mobs.npcs.adventureguide.forge_spent=异界锻造（本局已使用）
actors.mobs.npcs.adventureguide.forge_prompt=选择一件未强化的融合武器
actors.mobs.npcs.adventureguide.forge_already=这件武器已经强化过，无法接受这次有限锻造。
actors.mobs.npcs.adventureguide.forged=%s被稳定强化到+1。异界锻炉在本局中已经熄灭。

actors.mobs.npcs.fusionpet.name_0=缎带鼠
actors.mobs.npcs.fusionpet.name_1=月兔
actors.mobs.npcs.fusionpet.name_2=温顺蟹
actors.mobs.npcs.fusionpet.name_3=沼泽蛙
