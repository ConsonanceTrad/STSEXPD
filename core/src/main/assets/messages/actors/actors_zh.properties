actors.mobs.npcs.tinkerer1.name=露珠研究者
actors.mobs.npcs.tinkerer1.desc=一名来自多利亚的研究者。他似乎在等待什么东西上门。
actors.mobs.npcs.tinkerer1.tell1=我想找一个特殊的蘑菇做研究，但是我不敢继续往下走。
actors.mobs.npcs.tinkerer1.tell2=你需要先带来水袋，我才能改进它。

actors.mobs.npcs.tinkerer2.name=符文学者-莲恩
actors.mobs.npcs.tinkerer2.desc=居住在多利亚的研究者之一，对不同魔法之间的联系有着强烈兴趣。
actors.mobs.npcs.tinkerer2.tell1=我想不同种类的魔法之间肯定有什么联系……没准某种东西可以帮助我。

actors.buffs.armorbreak.name=护甲破坏
actors.buffs.armorbreak.desc=受到的所有伤害增加_%2$d%%_。\n\n剩余时间：%1$s回合。

actors.buffs.dewcharge.name=露珠爆炸
actors.buffs.dewcharge.desc=当你击杀任何目标时，在它周围生成任意数量的露珠。\n\n剩余的露珠爆破效果时长：%s回合
actors.buffs.rhythm2.name=超级律动
actors.buffs.rhythm2.desc=你的速度与伤害提高20%%，受到的伤害降低10%%。\n\n剩余：%s回合。

actors.buffs.tentsleep.name=帐篷睡眠
actors.buffs.tentsleep.desc=你正在帐篷中休息，期间处于隐蔽状态并免疫有害地形。\n\n剩余时间：%s回合
actors.mobs.npcs.spssokobansheep.name=推箱绵羊
actors.mobs.npcs.spssokobansheep.desc=这只特殊的绵羊可以被推过地板，用于解开机关。
actors.mobs.npcs.spssokobansheep$corner.name=斜推绵羊
actors.mobs.npcs.spssokobansheep$corner.desc=这只绵羊也可以沿斜线推动。
actors.mobs.npcs.spssokobansheep$switch.name=换位绵羊
actors.mobs.npcs.spssokobansheep$switch.desc=与这只绵羊互动会交换你们的位置。
actors.mobs.npcs.spssokobansheep$black.name=黑色绵羊
actors.mobs.npcs.spssokobansheep$black.desc=这只绵羊会跳向附近的剪毛陷阱。
actors.mobs.npcs.spssokobansheep$stop.name=停驻绵羊
actors.mobs.npcs.spssokobansheep$stop.desc=这只绵羊已经无法推动。

actors.mobs.sokobansentinel.name=推箱关守卫
actors.mobs.sokobansentinel.desc=一种没有思维、行动缓慢的幻影，手持幻影_%s_，会攻击进入守卫区域的生物。
actors.mobs.sentinel.name=魔法守卫
actors.mobs.sentinel.desc=手持_%s_的附魔守卫。它会静止不动，受到惊扰后便用所守护的武器攻击。
actors.mobs.monsterbox.name=怪物盒
actors.mobs.monsterbox.desc=一个会模仿你战斗能力的活盒子。被摧毁时，它可能生成一件与你当前所穿戴装备同类型的全新物品。

actors.mobs.pets.legacypet.levelup=仪器确定你的宠物等级已提升。
actors.mobs.pets.butterflypet.name=萤石粉蝶
actors.mobs.pets.butterflypet.desc=翅膀能够散发微光的蝴蝶，少数在地下世界生存的品种，对于温度非常敏锐，也因此它们经常会追随人类的冒险者一起行动。
actors.mobs.pets.chocobo.name=陆行鸟
actors.mobs.pets.chocobo.desc=在地表世界常见的一种鸟类，成年后的个体甚至能载人飞奔，有力的双足和温和的个性是它们的特点，为了保护主人有时也会展现出好战的一面。
actors.mobs.pets.datura.name=曼陀罗
actors.mobs.pets.datura.desc=通过浇灌牛奶使其获得活动能力的植物类魔法生物，喜欢跟随着体积大的生物身后奔跑，但同时又非常害怕牲畜，所以一般会选择跟在人类的身后。与记载中不同，它是一种非常安静的生物。
actors.mobs.pets.dogpet.name=忠犬
actors.mobs.pets.dogpet.desc=在地表世界追随你旅行的大狗，无论是在何处，哪怕是怪物丛生的地下，它依旧会尽忠尽责地守护你的安全。
actors.mobs.pets.dwarfboy.name=矮人学徒
actors.mobs.pets.dwarfboy.desc=一个勇敢的矮人，但不知为何打扮成羊的样子。
actors.mobs.pets.foxhelper.name=狐女仆
actors.mobs.pets.foxhelper.desc=有事她会干，没事嘛……她会定期给你带来升级卷轴。
actors.mobs.pets.frogpet.name=呆头蛙
actors.mobs.pets.frogpet.desc=这只绿色的青蛙能攻击较远的敌人，并可能在完成致命一击时找到物品。
actors.mobs.pets.gentlecrab.name=绅士蟹
actors.mobs.pets.gentlecrab.desc=为什么这只螃蟹和你那么好？因为对你而言，它很熟。它的钳击还能破坏护甲。
actors.mobs.pets.kodora.name=柯多拉
actors.mobs.pets.kodora.desc=希望成为出色巨龙的幼龙，懂得很多知识但依旧还是个菜鸟，甚至不能自如地吐出火焰，但是只要得到鼓励就会充满干劲。
actors.mobs.pets.litdemon.name=链锯魔
actors.mobs.pets.litdemon.desc=这个长着电锯的恶魔好可爱啊。它能用电锯连续切割敌人。
actors.mobs.pets.monkey.name=绿皮猴
actors.mobs.pets.monkey.desc=严格意义上它并不是猴子，它只是名字上带猴而已。
actors.mobs.pets.snake.name=毒蛇
actors.mobs.pets.snake.desc=这条蛇过去常常和它的兄弟在月光的柔和光辉下享受生活，直到它决定跟随流浪的欲望进入伟大的未知世界。
actors.mobs.pets.spider.name=植蛛
actors.mobs.pets.spider.desc=一只小小的、毛茸茸的植物，似乎喜欢藏在你的盔甲下。然而，尽管它顽固地害羞，它已经准备好了。
actors.mobs.pets.starkid.name=星芒
actors.mobs.pets.starkid.desc=星之子，能够用光属性力量攻击敌人。
actors.mobs.pets.stone.name=石拳石
actors.mobs.pets.stone.desc=破碎中的一把武器是它的亲戚，但是它的父母来自精灵宝可梦。
actors.mobs.pets.fly.name=飞蝇
actors.mobs.pets.fly.desc=这只苍蝇嗡嗡作响，雄心勃勃，梦想有一天变成一只美丽的蝴蝶。受到攻击时还会招来同伴。
actors.mobs.pets.fly$flytwo.name=离群飞蝇
actors.mobs.pets.fly$flytwo.desc=由飞蝇吸引来的家伙。
actors.mobs.pets.ribbonrat.name=缎带鼠
actors.mobs.pets.ribbonrat.desc=这个可爱的小老鼠戴着一条它非常珍惜的丝带。它似乎随时准备召来同伴，向你展示它的骄傲。
actors.mobs.pets.ribbonrat$ribbonrattwo.name=缎带鼠群
actors.mobs.pets.ribbonrat$ribbonrattwo.desc=由缎带鼠叫来的帮手。
actors.mobs.pets.bluedragon.name=蓝龙
actors.mobs.pets.bluedragon.desc=蓝龙精通冰寒之力，也是原先性价比最高的龙。
actors.mobs.pets.bluegirl.name=蓝色人偶
actors.mobs.pets.bluegirl.desc=来自Ren像素地牢里的玩具，身着护甲，手戴拳套，看上去很擅长战斗。
actors.mobs.pets.bugdragon.name=BUG龙
actors.mobs.pets.bugdragon.desc=??????
actors.mobs.pets.golddragon.name=黄金龙
actors.mobs.pets.golddragon.desc=图鉴里面并没有这条龙的信息。
actors.mobs.pets.greendragon.name=绿龙
actors.mobs.pets.greendragon.desc=绿龙一般精通闪电的力量。但由于原来没有那么多的闪电来源，所以绿龙十分稀缺。
actors.mobs.pets.leryfire.name=修齐元素
actors.mobs.pets.leryfire.desc=早期破碎翻译组的修齐所制作的元素。它十分不稳定。
actors.mobs.pets.lightdragon.name=光龙
actors.mobs.pets.lightdragon.desc=光龙，顾名思义，是发光的龙。
actors.mobs.pets.reddragon.name=红龙
actors.mobs.pets.reddragon.desc=红龙一般擅长喷射火焰，所以它们非常常见。
actors.mobs.pets.scorpion.name=血蝎
actors.mobs.pets.scorpion.desc=一个大号嗜血的蝎子。它的尾巴镶嵌着一个危险的蜇刺。
actors.mobs.pets.shadowdragon.name=暗影龙
actors.mobs.pets.shadowdragon.desc=暗影龙属于黑暗，但需要光明才能将它召唤。
actors.mobs.pets.violetdragon.name=紫龙
actors.mobs.pets.violetdragon.desc=紫龙属于地龙的一种，它释放恶臭毒素。

actors.buffs.growseed.name=寄生生长
actors.buffs.growseed.heromsg=带刺的植物从你的身体里钻了出来！
actors.buffs.growseed.desc=一颗魔法种子正在受害者体内生长，持续造成伤害，并为附近的生物恢复生命。

# 特别惊喜像素地牢：多利亚小镇居民
actors.mobs.npcs.udawos.name=Udawos
actors.mobs.npcs.udawos.desc=先锋的制作者。先锋是以像素地牢的源代码制作的。
actors.mobs.npcs.udawos.yell1=我的新游戏叫做chernog：FOMTMA。你可以在网上下载这个游戏。
actors.mobs.npcs.udawos.yell2=先锋不同于传统地牢游戏，它是一个rpg游戏，和塞尔达传说1类似。
actors.mobs.npcs.typedscroll.name=TypedScroll
actors.mobs.npcs.typedscroll.desc=LCPD的制作者。虽然他的确有不错的编程能力，但是他的没有仔细考虑程序总会有许多bug。
actors.mobs.npcs.typedscroll.yell1=嘿，为什么我长成这样，为什么和我说话，我不知道该和你说什么。
actors.mobs.npcs.typedscroll.yell2=LCPD已经上架谷歌商店啦，快去下载吧！
actors.mobs.npcs.consideredhamster.name=ConsideredHamster的宝箱怪
actors.mobs.npcs.consideredhamster.desc=YAPD的作者的宠物。恕我直言，打不通YAPD简单难度的都是垃圾。
actors.mobs.npcs.consideredhamster.yell1=嘿，我现在很饿，能给我喂1美刀吗?
actors.mobs.npcs.consideredhamster.yell2=Pineapples!
actors.mobs.npcs.bilboldev.name=Bilboldev
actors.mobs.npcs.bilboldev.desc=技巧地牢的制作者。他人非常好，因为据说他曾帮助typedscroll修复bug。
actors.mobs.npcs.bilboldev.yell1=对我的技巧地牢多点耐心，伙计xD。
actors.mobs.npcs.bilboldev.yell2=我计划未来对技能系统和故事系统做一次巨大的更新。
actors.mobs.npcs.bilboldev.yell3=Hatsune的牺牲会被人所铭记!
actors.mobs.npcs.nyrds.name=Nyrdie
actors.mobs.npcs.nyrds.desc=混合地牢的制作者???一个带墨镜的白牙肌肉块。
actors.mobs.npcs.nyrds.yell1=嘿，我是nyrdie
actors.mobs.npcs.nyrds.yell2=美牙建议:不要忘了每天早上刷牙哦!
actors.mobs.npcs.sfb.name=流浪法师-破碎暴风火杖
actors.mobs.npcs.sfb.desc=破碎地牢的翻译者之一。
actors.mobs.npcs.sfb.yell1=打牌吗，跑团吗，带我一个带我一个。
actors.mobs.npcs.sfb.yell2=火属性是最具有破坏力的属性。它的输出也是最高的
actors.mobs.npcs.flyling.name=澪
actors.mobs.npcs.flyling.desc=谁也不知道她从何处来，她偶尔会去雪景旅馆休息。\n\n如果你遇到她了，不妨试试和她搭讪看看吧。
actors.mobs.npcs.flyling.yell1=嗯？你好啊。欢迎你来到这里，我是澪。
actors.mobs.npcs.flyling.yell2=你问我是谁？谁知道呢，但我偶尔会来这里休息，并在这里祝福每一个冒险者。
actors.mobs.npcs.flyling.yell3=你会获得救赎吗？愿世界祝福你……
actors.mobs.npcs.omicronrg9.name=Ømicrónrg9
actors.mobs.npcs.omicronrg9.desc=这个看上去像十字军战士的长发男子，是一个研究平行世界的学者。他正在收集这个世界的信息的时候受到了来自高塔的邀请，在蜜蜂罐罐的引导下来的这个世界，并和这个世界的其他人分享关于其他世界的信息。由于看上去有些失眠，所以他可能有攻击性。
actors.mobs.npcs.omicronrg9.yell1=别挡道，伙计!我可没时间弄些杂七杂八的事情，mod表可是不会自己生成的。
actors.mobs.npcs.omicronrg9.yell2=食人鱼这种这种生物是在是太棒了，它们能轻易撕碎各种动物，特别是没有外壳的。
actors.mobs.npcs.omicronrg9.yell3=你知道吗，在所有像素地牢的衍生mod中，超过24种是以p字母打头的。
actors.mobs.npcs.omicronrg9.yell4=为了更好地寻找和收集mod，我把我的一只眼睛换成了钛合金电子眼。这很酷，也很值得。
actors.mobs.npcs.omicronrg9.yell5=希望这东西...无论在哪，依然是个幻象。
actors.mobs.npcs.omicronrg9.yell6=这个世界包容了超过9个不同世界的不同产物，真出乎我的意料!
actors.mobs.npcs.atv9.name=AekaTsrnVeskyinja999
actors.mobs.npcs.atv9.desc=这个是9，也可以称之为9[带圈的那个9] 参与绘制明日方舟地牢。彻头彻尾的酒鬼。
actors.mobs.npcs.atv9.yell1=喵喵喵
actors.mobs.npcs.atv9.yell2=如果你觉得这个绘制在哪里看过请想办法与我联系
actors.mobs.npcs.atv9.yell3=蜂蜜罐罐是我妈！
actors.mobs.npcs.sp931.name=被放逐者-931451545
actors.mobs.npcs.sp931.desc=破碎地牢的翻译者之一。虽然我对他了解不多，但是目前他人对他的评价呈两级分化状态。
actors.mobs.npcs.sp931.yell1=嘿，还在看空洞无聊的文本贴图吗，来试试我的蓝猫地牢吧。
actors.mobs.npcs.sp931.yell2=人生如果不装B的话还有什么意思呢?
actors.mobs.npcs.evan.name=Evan
actors.mobs.npcs.evan.desc=破碎地牢的制作者。说实在的我无法确定这代表evan还是破碎...他们的图标是一样的。
actors.mobs.npcs.evan.yell1=欢迎，冒险者。这个地牢可不太平呢。-来自00-Evan
actors.mobs.npcs.evan.yell2=我比较低调，所以当我听到hmdzl001和我说要我考虑台词的时候，其实我是拒绝的。
actors.mobs.npcs.hexa.name=UNIST HeXA
actors.mobs.npcs.hexa.desc=UNIST地牢的作者。UNIST地牢还行，只是只有看韩文你才能理解里面的梗。
actors.mobs.npcs.hexa.yell1=我是UNIST地牢的制作者。我觉得你应该没听说过这个mod。
actors.mobs.npcs.hexa.yell2=目前我只在韩国发布了这个地牢mod。
actors.mobs.npcs.coconut.name=椰子
actors.mobs.npcs.coconut.desc=一只背着单肩包头戴护目镜的橘色猫，看起来他携带有很多炸弹。
actors.mobs.npcs.coconut.yell1=欢迎来到我的炸弹商店，我这儿卖各种爆炸物。
actors.mobs.npcs.coconut.yell2=看起来炸弹翻译器的运行效果不错啊，小心它还可能爆炸哦。
actors.mobs.npcs.coconut.yell3=你找坚果，那个hmdzl001?他在训练各种boss。短时间内你是找不到他了。
actors.mobs.npcs.locastan.name=Locastan
actors.mobs.npcs.locastan.desc=哥布林地牢的制作者。他相当喜欢哥布林这部漫画。神灯是释放地牢的标志。
actors.mobs.npcs.locastan.yell1=这个门被锁住了...这个房间肯定不止一个门...没准我可以打开它...
actors.mobs.npcs.locastan.yell2=嘿，这可不是什么废铁，这是一件非常有用的工具。
actors.mobs.npcs.locastan.yell3=只要我能释放这个神灯的力量，我的世界就会更加精彩纷呈。
actors.mobs.npcs.dachhack.name=Dachhack
actors.mobs.npcs.dachhack.desc=发芽地牢的作者。上面那个光环是代表自然之神地牢。
actors.mobs.npcs.dachhack.yell1=对发芽地牢的崩溃我表示抱歉，目前我在尝试修复他们。
actors.mobs.npcs.dachhack.yell2=我不明白为什么hmdzl001这个家伙会把我设计成这样...下面那是什么玩意...
actors.mobs.npcs.dachhack.yell3=最新的发芽你可以在我的谷歌硬盘上找到，虽然还是预览版，但是基本框架我是已经弄好了的。
actors.mobs.npcs.laji.name=原罪学者-司徒
actors.mobs.npcs.laji.desc=这是一个祭师，同时也是小镇的维修者。
actors.mobs.npcs.laji.yell1=这位客人，能不能让我耽误你一点时间讲一讲我们的天父克苏鲁。
actors.mobs.npcs.laji.yell2=梦与白昼者所知晓之诸多事物常为梦于黑夜者所忘却。
actors.mobs.npcs.laji.yell3=另外...维护这个小镇很累的......
actors.mobs.npcs.kostis12345.name=秘书kostis12345
actors.mobs.npcs.kostis12345.desc=小镇的秘书，负责小镇宣传以及其他杂物。偶尔高层也会让她出去考察实习。
actors.mobs.npcs.kostis12345.yell1=你看见过我们的镇长了吗?我们还有许多事情要做。
actors.mobs.npcs.kostis12345.yell2=如果你对这一切有疑问的话，你可以在pixeldungeon.wikia.com寻找SpeciaSurprisePixelDungeon.还等什么，赶紧上船吧!
actors.mobs.npcs.apostle.name=apostle
actors.mobs.npcs.apostle.desc=一个闪着光芒的立方体，发声机械而又有磁性，可能是其他世界的测试者。
actors.mobs.npcs.apostle.yell1=只有，魔法，才能，战胜，魔法。
actors.mobs.npcs.apostle.yell2=魔法，战胜，才能，魔法，只有。
actors.mobs.npcs.nutpainter.name=坚果教教主
actors.mobs.npcs.nutpainter.desc=一个测试画家，十分喜欢画坚果。
actors.mobs.npcs.nutpainter.yell1=坚果nb!!!
actors.mobs.npcs.nutpainter.yell2=坚果万岁!!
actors.mobs.npcs.juh9870.name=Juh9870
actors.mobs.npcs.juh9870.desc=月光地牢的制作者。
actors.mobs.npcs.juh9870.yell1=我记得我的祖父曾在月光下对我说过，严禁空想，脚踏实地。
actors.mobs.npcs.juh9870.yell2=所以...我希望我能在这找到更多有意义的东西。
actors.mobs.npcs.sadsaltan.name=SadSaltan
actors.mobs.npcs.sadsaltan.desc=月光地牢的绘图者。标识有“月光”的名牌挂在他的胸前。
actors.mobs.npcs.sadsaltan.yell1=哦，难得一见的新的探险者。人们来这里就是为了寻找财宝的，没有富人会无聊到来这个地方。
actors.mobs.npcs.sadsaltan.yell2=我在其他地方开设着一个酒吧，我是过来宣传它的。想找到那里十分容易，只要对卫兵说“月光”他就会为你带路。
actors.mobs.npcs.sadsaltan.yell3=收下我的名片，以后你到那里的时候没准我可以请你喝一杯。
actors.mobs.npcs.shower.name=shower
actors.mobs.npcs.shower.desc=指虎教派的成员之一，来这里测试新的指虎武器。
actors.mobs.npcs.shower.yell1=初次见面，我是shower。你也可以叫我沐沐。虽然两个叫法都行，但是叫我沐沐我会更开心的。
actors.mobs.npcs.shower.yell2=看到东边的池塘了吗?我想你可以在那洗澡...前提在那养鱼之前。
actors.mobs.npcs.shower.yell3=这是个很棒的小镇，有很多很好的人，我想我会在这玩上一段时间。没准会碰上熟人呢。
actors.mobs.npcs.tinkerer4.name=镇长Noodlemire
actors.mobs.npcs.tinkerer4.desc=小镇的镇长，著有chancel一书。因为经济萧条所以工作十分轻松。
actors.mobs.npcs.tinkerer4.tell1=哦，欢迎来到这个小镇。容我介绍一下，我是这个小镇的镇长。这里以前还是一个著名景点，但现在就完全不行了。
actors.mobs.npcs.tinkerer4.tell2=东边的那幢屋子是一个私人工会，东南方是鱼塘和墓地，西南方是矿洞遗址，西方是武器商店，西北方是杂货店，西方是酒馆，东北方是一间在建旅馆，正中心是教堂。如果你想问居民睡哪里的话，我只能说无可奉告。
actors.mobs.npcs.g2159687.name=G2159687
actors.mobs.npcs.g2159687.desc=简单发芽的作者及汉化者，国人，现在处于弃坑状态。
actors.mobs.npcs.g2159687.yell1=我是G2159687，喜欢我的简单发芽吗?我可没有其他台词。
actors.mobs.npcs.g2159687.yell2=我想应该有一些玩家会认为地牢类游戏比较难，所以我弄了几个简单版本。
actors.mobs.npcs.xixizero.name=西西0.12
actors.mobs.npcs.xixizero.desc=黑暗地牢的制作者。
actors.mobs.npcs.xixizero.yell1=你好啊，我是黑暗地牢的制作者。你也可以叫我Egoal。
actors.mobs.npcs.millilitre.name=millilitre isaac
actors.mobs.npcs.millilitre.desc=因为意外来到这里的测试者之一，他被吓得不轻。
actors.mobs.npcs.millilitre.yell1=不要管我，让我静静。
actors.mobs.npcs.millilitre.yell2=这个世界太可怕了...妈妈...我想回家...
actors.mobs.npcs.hbb.name=工会主席-巨无霸卡比
actors.mobs.npcs.hbb.desc=破碎地牢的翻译者之一，同时也是像素地牢吧的吧主，小马的爱好者。
actors.mobs.npcs.hbb.yell1="The-world's-still-the-same, there's-just...less-in-it."
actors.mobs.npcs.hbb.yell2="Friendship-is-magic!"
actors.mobs.npcs.hbb.yell3="I-am-a-magical-princess-from-another-dimension."
actors.mobs.npcs.honeypoooot.name=蜜蜂罐罐
actors.mobs.npcs.honeypoooot.desc=一个老练的冒险者，是工会主席的助手，负责帮忙处理各种工会任务，包括各类新道具的测试。
actors.mobs.npcs.honeypoooot.yell1=看见那边的那只黑猫了吗，它是我的头儿。
actors.mobs.npcs.honeypoooot.yell2=这件蜂蜜袍子很好看?拜托这是兜帽唉。
actors.mobs.npcs.blacksmith.shadoweater=这仨是啥玩意……我看看……天哪，我做了什么？！
actors.mobs.npcs.jinkeloid.name=公会会长Jinkeloid
actors.mobs.npcs.jinkeloid.desc=这是mispd作者所创建的镜像。mispd作者同时也是破碎地牢的中文审核者。
actors.mobs.npcs.jinkeloid.yell1=现在工会不对外营业，当然欢迎你们前来参观。
actors.mobs.npcs.jinkeloid.yell2=你知道冰冻效果吗，它能控制住目标并使其受到更多的伤害。
actors.mobs.npcs.dreamplayer.name=小萌新大梦想
actors.mobs.npcs.dreamplayer.desc=一团七彩元素，是一个测试产物。
actors.mobs.npcs.dreamplayer.yell1=要比比看，谁更滑稽吗?
actors.mobs.npcs.dreamplayer.yell2=圆润地滑稽走。
actors.mobs.npcs.ice13.name=佣兵-寒雾十三
actors.mobs.npcs.ice13.desc=一个看上去有点神经质的术士，他依靠着一张损坏的多利亚小镇的地图和蜂蜜罐罐的指引来到了这里，他待在这里的目的是为了让这里更加——按他的说法——混乱。
actors.mobs.npcs.ice13.yell1=你好，我叫寒雾十三，是一位普普通通的佣兵，如果我没记错的话，我们不是第一次见面，对吧？
actors.mobs.npcs.ice13.yell2=我的配色很奇怪吗？呵，这只是三原色而已。
actors.mobs.npcs.ice13.yell3=记住，拥抱过去，创造未来。
actors.mobs.npcs.ice13.yell4=为这个世界的造物主——坚果欢呼吧，坚果是至高无上的神!
actors.mobs.npcs.ice13.yell5=元素没有正邪之分，但它的使用者有。
actors.mobs.npcs.ice13.yell6=这个世界依旧存在一些差错，但它至少不会搞出一只黑色的野兽。
actors.mobs.npcs.goblinplayer.name=神盾哥布林
actors.mobs.npcs.goblinplayer.desc=一个参加测试的哥布林，他手里拿着一块炫彩盾牌。
actors.mobs.npcs.goblinplayer.yell1=这个世界蛮不错，但比起哥布林族的试炼来说还是太简单了。
actors.mobs.npcs.goblinplayer.yell2=看见这块盾牌了吗，这是神盾。我们教派的支柱。
actors.mobs.npcs.oldnewstwist.name=Oldnewstwist
actors.mobs.npcs.oldnewstwist.desc=一个豺狼流浪者，看来豺狼一族里面也是有纷争的。
actors.mobs.npcs.oldnewstwist.yell1=啊!别伤害我，我和那群邪恶的豺狼人不一样。
actors.mobs.npcs.oldnewstwist.yell2=我试图在我所在的部落宣扬和平，虽然有些居民支持我，但是掌权者却把我赶出了部落，还剃光了我的体毛。
actors.mobs.npcs.oldnewstwist.yell3=嗯呐...我感觉有点冷，你能帮我找件衣服吗?
actors.mobs.npcs.hatesokoban.name=讨厌的羊关
actors.mobs.npcs.hatesokoban.desc=这是一个对发芽改有贡献的玩家，同时也是小马的爱好者。
actors.mobs.npcs.hatesokoban.yell1=你明白这是个游戏对吧，对吧。我需要完整的中文版发芽改，而不是这个半成品。
actors.mobs.npcs.hatesokoban.yell2=关于招羊法杖，虽然绝大部分时候没什么用，但是它能很好解决推箱关的难题。
actors.mobs.npcs.tinkerer5.name=地质勘探员Xavier251998
actors.mobs.npcs.tinkerer5.desc=一名勘探小镇地质的家伙，他人很好。
actors.mobs.npcs.tinkerer5.tell1=我正在做一个课题，研究地壳变动和人为开矿的关系。可惜的是矿洞遗址里面有条龙再那，我没法进入矿洞查看。
actors.mobs.npcs.tinkerer5.tell2=据说小镇曾经有过辉煌的时候，大量的魔法矿石出口并给小镇带来可观的收入。但这一切已经结束了。
actors.mobs.npcs.tinkerer5.tell3=你该不会饿了吧，拿上这块肉，伙计。
actors.mobs.minesentinel.name=钢铁守卫
actors.mobs.npcs.evan.yell3=我需要尽我全力来使破碎地牢更加好玩，更加有趣，更加合理，更加有挑战性。
actors.mobs.npcs.jinkeloid.yell3=听说你完成了所有挑战目标，那么这个你有资格前往这个地方。
actors.mobs.npcs.oldnewstwist.desc_gnollmission=既然他已经有衣服穿了，他已经可以做一些其他事了。
actors.mobs.npcs.oldnewstwist.yell4=我听说你击败了豺狼王，你真的太厉害了!你有没有找到什么东西 可以穿上保暖的那种?
actors.mobs.npcs.oldnewstwist.yell5=我对你非常感谢。你的强大，善良，智慧，令我钦佩。
actors.mobs.npcs.oldnewstwist.yell6=哦，我这里卖各种特殊武器。它们来自于其他时间。
actors.mobs.npcs.sfb.hello=看我!
actors.mobs.npcs.apostle.yell3=看来你通过了这轮测试。和其他测试者聊聊吧，没准能得到什么。
actors.blobs.steamwarn.desc=蒸汽在这产生，随后就有火焰生成。
actors.buffs.firefollower.name=火焰跟随
actors.buffs.firefollower.desc=你的脚下冒着蒸汽。\n\n剩余时间：%s。
actors.mobs.minesentinel.desc=钢铁守卫和普通活化石像的区别就是材质不同。它手上握着_%s_，看起来非常危险。
actors.mobs.littower.name=Otiluke守护石像
actors.mobs.littower.desc=Otiluke用他的石像代替他来守护核心。石像是无敌的，但是切断魔力来源可以使它停止。
actors.mobs.littower.zap=远离核心，这不是你该来的地方！
actors.mobs.otiluke.name=被腐化的Otiluke镜像
actors.mobs.otiluke.desc=Otiluke的镜像，但是已经被Zot腐化。看起来它在为石像提供能源。
actors.mobs.otiluke.bolt_kill=腐化镜像的暗影箭杀死了你……
actors.mobs.npcs.otilukenpc.desc=Otiluke，一位极具天赋的巫师。 他做了许多事情。其中之一就是带走了Amulet护符。
actors.mobs.npcs.otilukenpc.name=Otiluke
actors.mobs.npcs.otilukenpc.yell1=我们终于相见了，同时我重新看到了热闹的家乡，就和我小时候一样。
actors.mobs.npcs.otilukenpc.yell2=我十分感谢你的所作所为。我会把你引荐到高塔的。
actors.mobs.npcs.otilukenpc.yell3=好吧，我知道你要什么。Amulet护符现在被封印在高塔里面，没法拿出来了。但是我可以给你一个仿制品，它和Amulet护符功能一样。
actors.mobs.npcs.rennpc.desc=REN是最早使用了穿梭法术而闻名的“玩家”，据说他拿到过超过140枚Yendor护符并且分别来自不同的世界中。\n\n同时，REN也是多个地牢的创造者，虽然他现在似乎正在醉心于制作有很多美少女的地牢的样子……最好还是不要问他以前有关于“鸟船”的问题。
actors.mobs.npcs.rennpc.name=穿越者REN
actors.mobs.npcs.rennpc.yell1=有关“鸟船”，我不会再透露更多！
actors.mobs.npcs.rennpc.yell2=我有枚Yendor找不到了！它应该就在附近。
actors.mobs.npcs.rennpc.yell3=你好，我是REN，留下消息你应当看到了。我的“日志”可以复原并模拟这座地牢里传送的魔力，填满它，我会给你一件来自其他地牢的宝物。
actors.mobs.npcs.rennpc.yell4=我曾打造过一座充满了威士忌的地牢……听起来很浪漫不是吗？
actors.mobs.npcs.rennpc.yell5=感谢你完成了我留下的“日志”，虽然很不想清空老物件，但还是把这个给你吧。
actors.mobs.npcs.rennpc.yell6=你不会想要带着这玩意的。
actors.mobs.npcs.alivefish.desc=这是一个“淹死”的玩家。
actors.mobs.npcs.alivefish.name=淹死的食人鱼
actors.mobs.npcs.alivefish.yell1=（水泡声）（水泡声）（水泡声）
actors.mobs.npcs.alivefish.yell2=涌流法杖...水泡声...水泡声...
actors.mobs.npcs.fruitcat.desc=这是一个很可爱的玩家。
actors.mobs.npcs.fruitcat.name=工会荣誉商人-菜猫
actors.mobs.npcs.fruitcat.yell1=自从椰子走后，这家店就由我来管理。放心好了，我可不会涨价。
actors.mobs.npcs.fruitcat.yell2=信不信由你，在椰子离开之前，他没有带任何东西，只是把它们堆起来让它们吔尘！无论如何，你可能比我更需要它们。
actors.mobs.npcs.lery.desc=破碎地牢的翻译者之一，同时也是最早期像素地牢更新日志的翻译者之一。
actors.mobs.npcs.lery.name=驯兽师-论坛修齐
actors.mobs.npcs.lery.yell1=你足够冷酷吗?
actors.mobs.npcs.lery.yell2=我这里出售各种蛋。如果你是一个出色的训练家的话，你也可以训练出像我那么强大的怪物的。
actors.mobs.npcs.lyn.desc=破碎地牢的翻译者之一，是个脚男。
actors.mobs.npcs.lyn.name=受咒ankh
actors.mobs.npcs.lyn.yell1=燃烧!净化!为了萨格拉斯的伟大远征!
actors.mobs.npcs.lyn.yell2=来杯魔能饮料吗?哦，你想知道宠物吃什么吗?想想它们是什么，是常规生物还是奇幻事物，是素食还是肉食。当然，没有宠物可以拒绝口粮，那是特制的。
actors.mobs.npcs.lynn.desc=十分出色的符文研究者，对各种派系的魔法都有研究。其中最为出色的研究就是多利亚出产的魔法石。
actors.mobs.npcs.lynn.name=符文学者-莲恩
actors.mobs.npcs.lynn.yell1=我已经修好了这个合成台，现在你应该可以使用魔法石合成武器了。
actors.mobs.npcs.lynn.yell2=我的下一个研究目标应该是什么呢?
actors.mobs.npcs.lynn.yell3=这不是你该有的东西~~~
actors.mobs.npcs.memoryofsand.desc=这是一个对发芽改有重大贡献的玩家。
actors.mobs.npcs.memoryofsand.name=义往尘沙
actors.mobs.npcs.memoryofsand.yell1=嗨，酒馆现在开放了。随便选个食物尝尝吧。
actors.mobs.npcs.memoryofsand.yell2=原来我也是个冒险者，直到我试了试发芽改...
actors.mobs.npcs.raintrainer.desc=这是一个早期的计划npc，但是他并没有加入到游戏中。现在，他准备好了。
actors.mobs.npcs.raintrainer.name=训练家Rain
actors.mobs.npcs.raintrainer.yell1=训练家只要眼神对上了就要战...抱歉说错了。
actors.mobs.npcs.raintrainer.yell2=你可以用那个稻草人练手,不用担心,它很结实。
actors.mobs.npcs.rustyblade.desc=混合地牢的翻译者之一，同时也是破碎地牢翻译的协助者。
actors.mobs.npcs.rustyblade.name=战斗大师-无聊
actors.mobs.npcs.rustyblade.yell1=嗨，我是无聊，为什么我在这儿。
actors.mobs.npcs.rustyblade.yell2=攻击提升，攻击下降，防御提升，防御下降，你见过这些buff吗?
actors.mobs.npcs.stormandrain.desc=这是一个对发芽改有重大贡献的玩家。
actors.mobs.npcs.stormandrain.name=雷雨交加
actors.mobs.npcs.stormandrain.yell1=嗨，需要买些密宝吗。这些可是高级货。
actors.mobs.npcs.stormandrain.yell2=严格意义上我并不属于人类...但没人规定只有人类才能当财宝猎人。
actors.mobs.npcs.tempest102.desc=破碎地牢的翻译者之一，同时也是搞音乐的。
actors.mobs.npcs.tempest102.name=音乐家tempest102
actors.mobs.npcs.tempest102.yell1=原来我只搭了个帐篷，但现在我有了自己的商店。
actors.mobs.npcs.tempest102.yell2=欢迎光临我的乐器工作室。想买点什么吗?
actors.mobs.npcs.watabou.desc=像素地牢的创造者。
actors.mobs.npcs.watabou.name=Watabou
actors.mobs.npcs.watabou.yell1=为什么不试试我的其他游戏呢?
actors.mobs.npcs.watabou.yell2=像素地牢现在停止更新了......
actors.mobs.npcs.arealman.name=炼金矮人
actors.mobs.npcs.arealman.desc=工会中的一个奇特的存在，擅长炼金术和收藏独立游戏。
actors.mobs.npcs.whiteghost.name=白幽妹
actors.mobs.npcs.whiteghost.yell1=我很高兴还有人记得我。
actors.mobs.npcs.whiteghost.desc=由于高塔的实验，她已经失去了原有的形体。
actors.mobs.npcs.uncles.name=斯堡罗提德大叔
actors.mobs.npcs.uncles.yell1=小子，想和我锻炼一下吗
actors.mobs.npcs.uncles.desc=工会里的力士，是个猛男。
actors.mobs.npcs.saidbysun.name=阳说
actors.mobs.npcs.saidbysun.yell1=我想下一步应该这么做...等等，我搞错了...
actors.mobs.npcs.saidbysun.yell2=他们叫我帮忙测试，我就来这儿了...哦我什么都没说...
actors.mobs.npcs.saidbysun.desc=一只猫，用不安的眼神盯着旁边的炼金设备。没准那里有它讨厌的食物。
actors.mobs.npcs.afly.name=阿飞，阿比和阿比斯
actors.mobs.npcs.afly.yell1=你好啊，我是阿飞，旁边两个分别是阿比和阿比斯。
actors.mobs.npcs.afly.desc=不思议地牢的制作者
actors.mobs.npcs.ravenwolf.name=ravenwolf
actors.mobs.npcs.ravenwolf.yell1=......
actors.mobs.npcs.ravenwolf.yell2=......
actors.mobs.npcs.ravenwolf.desc=无名地牢的作者
actors.mobs.npcs.blackmeow.name=黑喵
actors.mobs.npcs.blackmeow.yell1=哦！你好冒险者，你看上去身手不凡，不知道你有没有兴趣到我的领土上去做做客？
actors.mobs.npcs.blackmeow.yell2=嗯…我的意思是说我的领土上也有一个地牢听说里面也有一个护符，不过里面十分危险你可能会受伤。你可以帮我带上来吗，我可以给你很多财富！
actors.mobs.npcs.blackmeow.desc=黑喵地牢的领袖
actors.mobs.npcs.catsheep.name=彩虹猫
actors.mobs.npcs.catsheep.yell1=喵
actors.mobs.npcs.catsheep.yell2=喵
actors.mobs.npcs.catsheep.desc=彩虹猫
actors.mobs.npcs.ashwolf.name=阿萨男爵
actors.mobs.npcs.ashwolf.desc=地牢游戏和像素画爱好者，RM制作者，兽控，正在制作异域冒险传。
actors.mobs.npcs.ashwolf.yell1=看，我给你种个宝贝。
actors.mobs.npcs.ashwolf.yell2=16*16的范围里也可以做出很萌的家伙，另外，为什么豺狼人不能成为伙伴呢？！
actors.mobs.npcs.ashwolf.yell3=万圣节强制彩蛋，南瓜灯换糖!!!
actors.mobs.npcs.ashwolf.yell4=看看新的房屋，转换一下心态。
actors.mobs.npcs.bonestar.desc=星辰地牢的开发者，不过因为开源包问题已经弃坑。这个家伙简直就是全副武装，然而他却没有打算探索地牢的冲动，真是可惜了这身装备。然而有趣的是，当人们询问他关于这个地牢的故事时，他们只得到了一个回复“我已经通关了”，然而没有任何人见过他除了站在那里还有什么其他的动作。除了对在他面前停留已久的冒险者一个白眼除外……不过值得一提的是，星辰对人还算不错。每当有新的冒险者来交谈的时候，他总会从背包里摸出两块石头给你，当然，两个石子的可能性也并不是没有……看起来从前的他是个热情的冒险者，然而现在的他只想和远道而来的冒险者们唠唠家常话，消磨一下时光，这就够了。
actors.mobs.npcs.bonestar.name=星辰
actors.mobs.npcs.bonestar.yell1=嘿，又来了一个新家伙！看起来你准备的非常充分，祝你一路顺风！
actors.mobs.npcs.hmdzl001.name=hmdzl001
actors.mobs.npcs.hmdzl001.desc=这个游戏的缔造者，同时也是一位玩家。
actors.mobs.npcs.hmdzl001.yell1=我该说欢迎吗，这是为2019春节专门准备的地图，但是就算是2022年，世界依然没有好转。
actors.mobs.npcs.hmdzl001.yell2=椰子...它会处理之后的一切。作为一台机器，它很可爱，但它并不能缓解我的忙碌。
actors.mobs.npcs.hmdzl001.yell3=2022春节...操蛋极了，我一天都没好好休息。现在就算不是春节这里也会持续开放。
actors.mobs.npcs.coconut2.name=椰子
actors.mobs.npcs.coconut2.desc=由hmdzl所创造的一只生物...大概。
actors.mobs.npcs.coconut2.yell1=我急了我急了，这之后该怎么办啊。
actors.mobs.npcs.coconut2.yell2=讲道理啊，人员引进和安排都是由我处理的，也不给我放个假什么的。
actors.mobs.npcs.coconut2.yell3=之后的计划???谁知道之后会发生什么呢。
actors.mobs.npcs.newplayer.name=你
actors.mobs.npcs.newplayer.desc=？？？
actors.mobs.npcs.newplayer.yell1=这是你。
actors.mobs.npcs.newplayer.yell2=这就是你。
actors.mobs.npcs.thanklist.name=感谢名单
actors.mobs.npcs.thanklist.yell1=以及所有游玩这个游戏的玩家。
actors.mobs.npcs.thanklist.desc=朴实无华的感谢列表。
actors.buffs.beold.name=老化
actors.buffs.beold.desc=你的躯体老化了。 \n\n老化每回合造成少量伤害，但会阻止正常生命恢复。 \n\n剩余的老化效果时长：%s回合
actors.buffs.beold.heromsg=你老化了！
actors.buffs.locked.name=锁闭
actors.buffs.locked.desc=一把无形的锁锁死了你的背包，是你无法使用消耗类道具，持续%s回合。
actors.buffs.silent.name=沉默
actors.buffs.silent.desc=沉默使人安静，并且让他无法诵读卷轴或释放咒语。持续%s回合。
actors.buffs.hiddenshadow.name=潜行
actors.buffs.hiddenshadow.desc=无法被近战攻击。\n\n剩余时间：%s。
actors.buffs.darkfallen.name=暗影降临
actors.buffs.darkfallen$darkliver.name=夜影
actors.buffs.darkfallen$darkliver.desc=和时间相关，只在晚上攻击。
actors.mobs.adultdragonviolet.name=守卫巨龙
actors.mobs.adultdragonviolet.atk=离这远点!入侵者!
actors.mobs.adultdragonviolet.desc=守卫巨龙通常是被召唤而来，但是对普通人来说它和野生巨龙没什么两样。
actors.mobs.adultdragonviolet.die=为了...Otiluke大人!!
actors.mobs.testmob.desc=试试看，你能打多少伤害。
actors.mobs.testmob.name=稻草人
actors.mobs.testmob2.desc=这个稻草人很危险，千万不要触动它。
actors.mobs.testmob2.name=发条稻草人
actors.mobs.yearbeast2.name=年兽
actors.mobs.yearbeast2.disarm=年兽解除了你的武装！
actors.mobs.yearbeast2.desc=传说中的生物，有着人类的智慧，虎的敏捷，熊的力量，凤的魅力。当然，这一切都是传说而已。
actors.mobs.yearbeast2.notice=谁把我吵醒了？！
actors.mobs.yearbeast2.die=啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊！！！
actors.mobs.yearbeast.name=年兽
actors.mobs.yearbeast.disarm=年兽解除了你的武装！
actors.mobs.yearbeast.desc=传说中的生物，有着人类的智慧，虎的敏捷，熊的力量，凤的魅力。当然，这一切都是传说而已。
actors.mobs.yearbeast.notice=我自由啦！
actors.mobs.yearbeast.die=居然能战胜我！这是给你的奖励。
actors.mobs.yearbeast.escape=现在时候不对，我先溜了。
actors.mobs.pets.yearpet.name=年兽宝宝
actors.mobs.pets.yearpet.desc=一只年兽宝宝，没什么战斗力。
actors.buffs.aflybless.name=不思议智慧
actors.buffs.aflybless.desc=不思议的智慧带给你启发，少量提升你的当前力量和幸运。\n\n持续时间：%s回合。
actors.mobs.pets.abi.name=阿比
actors.mobs.pets.abi.desc=由阿飞制作的哨子召唤出的精灵。
actors.buffs.berryregeneration.name=浆果再生
actors.buffs.berryregeneration.desc=自然能量每回合恢复少量生命。\n\n剩余时间：%s回合。
actors.mobs.dragonking.name=异界龙王
actors.mobs.dragonking.desc=一只普通的巨龙。它身上的魔法十分不稳定，击败它后可能打开通往异界首领的通道。
actors.mobs.ugoo.name=领主黏咕
actors.mobs.ugoo.desc=虚空中的一只黏咕投影。它可比这个世界的任何一只黏咕都要强。
actors.mobs.ugoo$earthgoo.name=黏土黏咕
actors.mobs.ugoo$firegoo.name=火焰黏咕
actors.mobs.ugoo$icegoo.name=冰霜黏咕
actors.mobs.ugoo$shockgoo.name=雷云黏咕
actors.mobs.utengu.name=年轻的天狗
actors.mobs.utengu.desc=年轻时的天狗，既擅长远程攻击也擅长近战攻击。
actors.mobs.udm300.name=杀人巨械
actors.mobs.udm300.desc=这种机器人专为攻城和杀戮制造，内部装有许多致命装置。
actors.mobs.udm300$seekbomb.name=追猎炸弹
actors.mobs.uking.name=植物领主
actors.mobs.uking.desc=这个家伙是植物的王者。
actors.mobs.uicecorps.name=术士冬痕
actors.mobs.uicecorps.desc=一只兔人族的术士，向四周散发着寒气。
actors.mobs.uicecorps$firerabbit.name=烈焰兔人
actors.mobs.uicecorps2.name=术士冬痕-终结形态
actors.mobs.uicecorps2.desc=兔人术士燃烧仅存的生命力，准备完成最后一战。
actors.mobs.uyog.name=始祖之眼
actors.mobs.uyog.desc=一只叫作始祖的眼睛……它看上去很眼熟。
actors.mobs.gnollarcher.name=豺狼弓箭手
actors.mobs.gnollarcher.desc=这个豺狼隐藏在树叶后。你的出现让它很烦躁。
actors.mobs.gnollarcher.killcount=已击败豺狼弓箭手：%d
actors.mobs.gnollking.name=哈格
actors.mobs.gnollking.desc=哈格是豺狼人的头领，守着大量财宝，还会召唤亲卫协助战斗。
actors.mobs.gnollking.angry=你惹火我了！
actors.mobs.gnollking.notice=谁敢擅闯我的宝库？！
actors.mobs.gnollking.die=我的……财宝……
actors.mobs.gnollking$gnollkeeper.name=豺狼卫士
actors.mobs.gnollking$gnollkeeper.desc=豺狼王的亲卫队，绝大多数时间都在看守宝库。
actors.mobs.gnollking$gnollkeeper.safe=放弃抵抗！
actors.blobs.corruptgas.name=腐化气体
actors.blobs.corruptgas.desc=一团黑紫色的腐化气体盘绕在这里。它会造成流血、减缓移动，并按生命上限造成伤害。
actors.blobs.corruptgas.rankings_desc=被腐化气体吞噬
actors.blobs.corruptgas.ondeath=你被腐化气体吞噬了……
actors.buffs.stoneice.name=石化冰冻
actors.buffs.stoneice.desc=坚硬的结晶冰附着在你的身体上。在它融化前移动会受到重创。\n\n剩余回合：%s
actors.buffs.stoneice.rankings_desc=被结晶冰撕裂
actors.buffs.stoneice.ondeath=结晶冰撕裂了你的身体……
actors.mobs.uamulet.name=希望暗影
actors.mobs.uamulet.desc=BossRush的最后一战。
actors.mobs.magiceye.name=青色邪眼
actors.mobs.magiceye.desc=这种邪眼似乎完全由Zot的魔力构成。
actors.mobs.zot.name=Zot
actors.mobs.zot.desc=Zot是虚空中强大的领主之一，可以自由操控黑暗与邪能。如果不是Otiluke将它拉到这个位面，你可能根本无法伤到它。
actors.mobs.zot.notice=你这是自寻死路！
actors.mobs.zot.pain=感受这被囚禁的愤怒吧！
actors.mobs.zot.die=……
actors.mobs.zotphase.name=Zot的虚像
actors.mobs.zotphase.desc=Zot的虚像，看上去与本体一样真实。
actors.mobs.spstengu.name=天狗
actors.mobs.spstengu.desc=一位以面具为名、行踪诡秘的著名刺客。
actors.mobs.spstengu.notice=你是怎么找到我的？！
actors.mobs.spstengu.die=诅咒你！
actors.mobs.prisonwander.name=典狱长
actors.mobs.prisonwander.desc=监狱的最高管理者，结实而强大。
actors.mobs.prisonwander.notice=我看到你了！
actors.mobs.prisonwander.die=我还会回来的！
actors.mobs.prisonwander.scorpion=没人能从我手上逃离！！！
actors.mobs.prisonwander$seekbombp.name=追猎炸弹
actors.mobs.prisonwander$seekbombp.desc=会追踪目标，并在倒计时结束后爆炸的炸弹。
actors.mobs.tank.name=TANK
actors.mobs.tank.desc=一般来说，不死族给人的印象都是迟缓、脆弱而又源源不断。但是这只不死生物的体型、速度和力量都远超普通亡灵。
actors.mobs.tank.notice=啊啊啊啊啊嗷嗷嗷嗷嗷嗷！！！
actors.mobs.tank.die=啊啊啊啊啊嗷嗷嗷嗷嗷嗷……
actors.mobs.tank.rock=TANK丢出了巨石！
actors.buffs.glassshield.name=玻璃保护
actors.buffs.glassshield.desc=来自玻璃之神的祝福。当你受到不少于10点的伤害时，将伤害改为10。剩余保护次数：%s次。
actors.buffs.attackdown.name=乏力
actors.buffs.attackdown.desc=剩余%1$s回合，物理攻击伤害降低%2$s%%。
actors.buffs.strdown.name=虚弱
actors.buffs.strdown.desc=你感觉自己的装备突然变得沉重起来。虚弱魔法使你的有效力量降低3点。\n\n剩余时间：%s回合。
actors.buffs.strdown.heromsg=你感到力量正在被抽走！
actors.mobs.spsgoo.name=黏咕
actors.mobs.spsgoo.desc=我们对黏咕所知甚少。它甚至可能不是生物，而是下水道中的污秽物质在黑暗魔法作用下获得了基本智能。它的凝胶躯体储存着大量黑暗能量，蓄满力量的一击极其危险。
actors.mobs.spsgoo.atk=黏咕正在不断地抽动！
actors.mobs.spsgoo.notice=咕-咕！
actors.mobs.spsgoo.die=咕……咕……
actors.mobs.spsgoo$poisongoo.name=毒性黏咕
actors.mobs.spsgoo$poisongoo.desc=从黏咕身上分裂出的迅捷有毒碎块。只要本体还活着，它就能继续分裂。
actors.mobs.spsgoo$poisongoo.notice=咕-咕！
actors.mobs.spsgoo$poisongoo.die=咕……咕……
actors.mobs.hybrid.name=混源体
actors.mobs.hybrid.desc=由异能者、虫群、亡灵和机械等不同生命形态混合而成的未知生物。
actors.mobs.hybrid.notice=我是埃蒙忠实的仆从。
actors.mobs.hybrid.die=为了……虚空……
actors.mobs.hybrid.shield=埃蒙的力量保护着我。
actors.mobs.hybrid$mixers.name=混源体分裂物
actors.mobs.hybrid$mixers.desc=混源体在最终阶段受创后脱落的危险组织。
actors.mobs.spsdm300.name=DM-300
actors.mobs.spsdm300.desc=数个世纪前矮人制造了这台用于建设、挖掘和城防的机器。附近的老旧生产器仍在为它提供战斗能力。
actors.mobs.spsdm300.notice=检测到未经授权的人员。
actors.mobs.spsdm300.die=任务失败。系统关闭。
actors.mobs.spsdm300.heal=DM-300修复了它自己！
actors.mobs.spsdm300$tower.name=老旧的生产器
actors.mobs.spsdm300$tower.desc=这套矮人生产设备早已失于维护，但仍能制造防御机器人并为DM-300提供动力。
actors.mobs.spsdm300$tower.alert=生产线遭受攻击！应急保护措施启动！
actors.mobs.spsdm300$tower.robots=自动防御……自动防御……
actors.mobs.spsdm300$brokenrobot.name=破损机械
actors.mobs.spsdm300$brokenrobot.desc=虽然机器人的程序没有老化，它的躯体却抵抗不住时间的侵蚀。
actors.mobs.spsdm300$brokenrobot.explode=自毁启动！
actors.mobs.brokenrobot.name=破损机械
actors.mobs.brokenrobot.broken=系统...关闭...
actors.mobs.brokenrobot.desc=虽然这个机器人的程序没有老化，但它的身躯抵抗不住时间的侵蚀。
actors.mobs.brokenrobot.explode=自毁启动！
actors.mobs.brownbat.name=小蝙蝠
actors.mobs.brownbat.desc=小蝙蝠呈棕色，是一种没什么威胁的生物。当然如果你杀死了它的话，它有几率发出很大的响声。
actors.mobs.brownbat.die=凄惨的叫声惊醒了附近的敌人！
actors.mobs.banditking.name=蓝衣神偷
actors.mobs.banditking.desc=传言，盗贼中有一群另类，他们对金银珠宝没有兴趣，倒是对生物的生命情有独钟。并且，他们可以在神不知鬼不觉的情况下偷走敌人的生命。他们也接受各种委托，但代价一般都是...生命。
actors.mobs.banditking.die=算了，这次先放过你。
actors.mobs.banditking.dis=蓝衣神偷消失了。
actors.mobs.banditking.spork=啊！我偷到的叉勺呢！
actors.mobs.bluecat.name=布鲁凯特
actors.mobs.bluecat.desc=一名觊觎护符的蓝衣怪盗。它会快速出手，偷走护符后立刻逃跑。
actors.mobs.bluecat.stole=布鲁凯特从你身上偷走了%s！
actors.mobs.bluecat.carries=\n\n布鲁凯特正带着_%s_。显然是偷来的。
actors.mobs.spiderqueen.name=蜘蛛皇后
actors.mobs.spiderqueen.desc=蜘蛛们会聚集起来建立巢穴；当巢穴足够庞大时，它们便推选一只女王扩张领地。
actors.mobs.spiderqueen.notice=谁在撕扯我的网？！
actors.mobs.spiderqueen.die=我……输了……
actors.mobs.spiderqueen.egg=蛛后孵化了新的巢穴。
actors.mobs.spiderqueen$spideregg.name=巢穴
actors.mobs.spiderqueen$spideregg.desc=蛛卵存活越久，孵化出的蜘蛛就越强。
actors.mobs.spiderqueen$spiderworker.name=蜘蛛工人
actors.mobs.spiderqueen$spiderworker.desc=蜘蛛大军中最常见的工蛛。
actors.mobs.spiderqueen$spidermind.name=灵能蜘蛛
actors.mobs.spiderqueen$spidermind.desc=会散播致盲黑雾，并通过攻击恢复生命的灵能蜘蛛。
actors.mobs.spiderqueen$spiderjumper.name=跳蛛卫士
actors.mobs.spiderqueen$spiderjumper.desc=能够沿直线跃迁接近猎物的迅捷卫士。
actors.mobs.spiderqueen$spidergold.name=禁卫金蛛
actors.mobs.spiderqueen$spidergold.desc=孵化最久才能出现的强大金蛛，会散播混乱气体并强化防御。
actors.buffs.tar.name=迟缓焦油
actors.buffs.tar.desc=粘稠油脂覆盖全身，使火焰难以熄灭；进入水中可以洗掉焦油。
actors.buffs.tar.heromsg=你身上覆盖满了粘稠的油脂。
actors.buffs.defenceup.name=防御提升
actors.buffs.defenceup.desc=剩余%1$s回合，受到的伤害降低%2$s%%。
actors.buffs.energyarmor.name=能量护盾
actors.buffs.energyarmor.desc=能量护盾会吸收所有类型的伤害。剩余护盾：%s。
actors.buffs.shieldarmor.name=物理护盾
actors.buffs.shieldarmor.desc=物理护盾会吸收由其他角色直接造成的伤害。剩余护盾：%s。
actors.blobs.slowweb.desc=这里覆盖着粘稠的蛛网，会持续拖慢身处其中的生物。
actors.blobs.darkgas.desc=这里盘绕着黑色浓烟，会使烟雾中的生物暂时失明。
actors.blobs.targas.desc=这里盘绕着粘稠油雾，会在接触到的生物身上凝结出焦油。
actors.mobs.lichdancer.name=巫妖舞者
actors.mobs.lichdancer.desc=舞者，24岁，是个艺人。自愿接受亡灵的交易，成为了一个巫妖。
actors.mobs.lichdancer.notice=在我表演的一生中，我明白一个道理：作为人类而言，我们演员是有极限的。所以……我不做人啦！
actors.mobs.lichdancer.die=演出……结束了……
actors.mobs.lichdancer$batterytomb.name=死灵电池
actors.mobs.lichdancer$batterytomb.desc=一个奇怪的电池，不断释放着死灵能量。
actors.mobs.lichdancer$linkbomb.name=炸弹
actors.mobs.lichdancer$linkbomb.desc=小心，它要炸了！
actors.mobs.elderavatar.name=长老化身
actors.mobs.elderavatar.notice=效忠于我，或者死去。
actors.mobs.elderavatar.disarm=长老剥离了你的护甲。
actors.mobs.elderavatar.die=就算我死了，也有其他人接替我的位置……
actors.mobs.elderavatar.shield=尖碑给予我生命的力量。
actors.mobs.elderavatar.desc=异能者的领袖与指挥者。他正四处寻找可以延续自身寿命的基因组。
actors.mobs.elderavatar$obelisk.name=三角尖碑
actors.mobs.elderavatar$obelisk.impossible=检测到长老生命信号，伤害吸收。
actors.mobs.elderavatar$obelisk.desc=一种生命储存装置。
actors.mobs.elderavatar$thehunter.name=猎手
actors.mobs.elderavatar$thehunter.desc=异能者的迅捷猎手。
actors.mobs.elderavatar$thewarlock.name=术士
actors.mobs.elderavatar$thewarlock.desc=侍奉长老的异能术士。
actors.mobs.elderavatar$themonk.name=圣堂
actors.mobs.elderavatar$themonk.desc=异能者的迅捷圣堂武士。
actors.mobs.elderavatar$themech.name=裁决
actors.mobs.elderavatar$themech.desc=异能者的重装裁决者。
actors.mobs.king.name=矮人国王
actors.mobs.king.arise=以我之名，复苏吧！奴隶们！
actors.mobs.king.cannot=我还没有输！
actors.mobs.king.liches=巫师们，起来吧！
actors.mobs.king.meeting=何人来此喧哗？！
actors.mobs.king.desc=最后的矮人国王精通生死之道。他通过可怕的仪式获得了永生，以及一支亡灵军队。
actors.mobs.king$undead.name=矮人亡灵
actors.mobs.king$undead.desc=由矮人国王的意志唤醒的昔日议会成员，外形如同长着浓密胡须的骷髅。
actors.mobs.king$dwarfkingtomb.name=永恒之墓
actors.mobs.king$dwarfkingtomb.desc=由骨骼和未知材料制成的墓碑，与矮人国王联系密切。
actors.mobs.king$dwarfkingtomb.impossible=那毫无作用。
actors.mobs.dwarflich.name=不朽矮人
actors.mobs.dwarflich.desc=为维系亡灵国王而牺牲的强大巫师，能够调用死亡之力伤害敌人。
actors.mobs.spsyog.name=Yog-Dzewa
actors.mobs.spsyog.desc=Yog-Dzewa是一位来自混沌领域的上古之神，在远古战争后被封印于矮人城市下方。
actors.mobs.spsyog.notice=希望的存在只是一种幻觉……
actors.mobs.spsyog.die=我……永生……
actors.mobs.spsyog.blink=Yog消失了！
actors.mobs.spsyog$burningfist.name=火焰之拳
actors.mobs.spsyog$burningfist.desc=由活体火焰构成的巨拳。
actors.mobs.spsyog$rottingfist.name=大地之拳
actors.mobs.spsyog$rottingfist.desc=由大地与腐化物构成的巨拳。
actors.mobs.spsyog$infectingfist.name=酸蚀之拳
actors.mobs.spsyog$infectingfist.desc=会散播剧毒气体的腐蚀巨拳。
actors.mobs.spsyog$pinningfist.name=剧毒之拳
actors.mobs.spsyog$pinningfist.desc=能够远程攻击并束缚目标的巨拳。
actors.mobs.spsyog$larva.name=古神幼虫
actors.mobs.spsyog$larva.desc=从受伤古神体内脱落的幼虫。
actors.mobs.yog.name=Yog-Dzewa
actors.mobs.yog.desc=Yog-Dzewa是一位上古之神，来自混沌的强大存在。一个世纪前，古代矮人在与恶魔军队的战争中惨胜，却无法将古神杀死。于是他们把它封印在城市下的大堂里，认为过于虚弱的它永远都不会复苏。
actors.mobs.yog.notice=希望的存在只是一种幻觉…
actors.mobs.yog.die=我...永生...
actors.mobs.yog.blink=Yog消失了！
actors.mobs.yog$burningfist.name=火焰之拳
actors.mobs.yog$burningfist.desc=火焰之拳
actors.mobs.yog$infectingfist.name=酸蚀之拳
actors.mobs.yog$infectingfist.desc=酸蚀之拳
actors.mobs.yog$larva.name=古神幼虫
actors.mobs.yog$larva.desc=古神幼虫
actors.mobs.yog$pinningfist.name=剧毒之拳
actors.mobs.yog$pinningfist.desc=剧毒之拳
actors.mobs.yog$rottingfist.name=大地之拳
actors.mobs.yog$rottingfist.desc=大地之拳
actors.mobs.spssewermobs$brownbat.name=小蝙蝠
actors.mobs.spssewermobs$brownbat.desc=小蝙蝠呈棕色，是一种没什么威胁的生物。不过杀死它时，它有几率发出很大的响声。
actors.mobs.spssewermobs$brownbat.die=凄惨的叫声惊醒了附近的敌人！
actors.mobs.spssewermobs$dustelement.name=尘埃元素
actors.mobs.spssewermobs$dustelement.desc=年久失修的下水道中的尘埃与向外扩散的黑暗力量融合，生成了这种羸弱的元素。
actors.mobs.spssewermobs$dustelement.blind=灰尘阻碍了你的视线。
actors.mobs.spssewermobs$ratboss.name=领头鼠
actors.mobs.spssewermobs$ratboss.desc=领头鼠是鼠群的头领。虽然它不像鼠王一样有威信，但依然可以叫来鼠群。
actors.mobs.spssewermobs$ratboss.spawn=这里出现了一群老鼠！
actors.mobs.spssewermobs$shit.name=马桶精灵
actors.mobs.spssewermobs$shit.desc=住在下水道的精灵，与腐坏和垃圾一起生活。
actors.mobs.spssewermobs$livemoss.name=寄生苔藓
actors.mobs.spssewermobs$livemoss.desc=扭曲的植物占据了死去老鼠的躯体，并向外抛洒寄生孢子。
actors.mobs.spssewermobs$patroluav.name=巡逻无人机
actors.mobs.spssewermobs$patroluav.desc=一种高科技无人机，曾被用于清理下水道垃圾。
actors.mobs.spssewermobs$vagrant.name=流浪者
actors.mobs.spssewermobs$vagrant.desc=住在下水道的流浪者，有着极强的恢复能力。
actors.mobs.spssewermobs$exvagrant.name=感染流浪者
actors.mobs.spssewermobs$exvagrant.desc=被源石感染的流浪者，有着极强的恢复能力和生命偷取能力，并会在死亡时污染周围环境。
actors.buffs.attackup.name=攻击提升
actors.buffs.attackup.desc=剩余%1$s回合，物理攻击伤害提高%2$s%%。
actors.buffs.wet.name=潮湿
actors.buffs.wet.desc=水浸湿了身体，会令某些元素效果更加危险。剩余回合：%s。
actors.buffs.countdown.name=死亡倒计时
actors.buffs.countdown.desc=倒计时归零时，目标会失去最大生命值四分之一的生命。剩余回合：%s。
actors.blobs.spselementaldamage$ice.desc=此处残留着寒冰能量，会持续伤害其中的生物。
actors.blobs.spselementaldamage$fire.desc=此处残留着火焰能量，会持续伤害其中的生物。
actors.blobs.effectblobs.fire.desc=SPS火焰场会在三回合内灼烧生物与易燃物品。
actors.blobs.effectblobs.frostcloud.desc=SPS寒冰场会在三回合内冻结生物与物品。
actors.blobs.effectblobs.electrishock.desc=SPS雷电场会在三回合内电击生物与物品。
actors.blobs.effectblobs.acidwater.desc=SPS酸蚀场会在三回合内让生物与物品沾上淤泥。
actors.blobs.effectblobs.holylight.desc=SPS圣光场会在三回合内标记生物与物品。
actors.blobs.effectblobs.shadowgas.desc=SPS暗影场会在三回合内诅咒生物与物品。
actors.mobs.ratking.thanks=有个蓝衣神偷拿走了我的皇家叉勺。帮我找回来！
actors.mobs.ratking.havefun=你找到了我的叉勺。拿去玩吧！
actors.mobs.spsprisonmobs$ghostphoto.name=霉画
actors.mobs.spsprisonmobs$ghostphoto.desc=用于装饰监狱办公室的油画，被黑魔法污染后开始四处游荡。
actors.mobs.spsprisonmobs$assassin.name=暗杀者
actors.mobs.spsprisonmobs$assassin.desc=由天狗训练出的忍者之一，极其擅长快速远程攻击。
actors.mobs.spsprisonmobs$trollwarrior.name=巨魔战士
actors.mobs.spsprisonmobs$trollwarrior.desc=监狱沦陷前，巨魔是其中最强大的势力之一，就连守卫也不愿招惹他们。
actors.mobs.spsprisonmobs$trollwarrior.angry=你竟敢攻击我？！
actors.mobs.spsprisonmobs$firerabbit.name=堕天使
actors.mobs.spsprisonmobs$firerabbit.desc=兔人火焰兵，训练方便且造价低廉，被派遣至此清剿亡灵。
actors.mobs.spsprisonmobs$firerabbit.yell=ko~ko~da~yo
actors.mobs.spsprisonmobs$bamboomob.name=竹子
actors.mobs.spsprisonmobs$bamboomob.desc=监狱长饲养的奇怪植物，能够反弹物理伤害。
actors.mobs.spsprisonmobs$goldcollector.name=税收官
actors.mobs.spsprisonmobs$goldcollector.desc=背着巨大口袋的哥布林税收官，会偷走你的金币并将其转化为护盾。
actors.mobs.spsprisonmobs$zombie.name=丧尸
actors.mobs.spsprisonmobs$zombie.desc=这并不是行动迟缓、毫无思维的普通尸体，而是一名感染者。
actors.mobs.spsprisonmobs$banditking.name=蓝衣神偷
actors.mobs.spsprisonmobs$banditking.desc=会在受害者身上留下致命倒计时，随后迅速逃离的蓝衣神偷。
actors.mobs.spsprisonmobs$banditking.die=算了，这次先放过你。
actors.mobs.spsprisonmobs$banditking.dis=蓝衣神偷消失了。
actors.mobs.spsprisonmobs$banditking.spork=啊！我偷到的叉勺呢！
actors.buffs.dry.name=干燥
actors.buffs.dry.desc=你的身体严重缺水。剩余回合：%s。
actors.buffs.watchout.name=警戒
actors.buffs.watchout.desc=这个生物周围的时间变得不稳定。剩余回合：%s。
actors.buffs.frostice.name=霜冻
actors.buffs.frostice.desc=结晶寒霜会在附着时及目标每次移动后撕裂身体。剩余回合：%s。
actors.mobs.spscavemobs$gnollshaman.name=豺狼萨满
actors.mobs.spscavemobs$gnollshaman.desc=最具智慧的豺狼能够掌握战斗魔法，用法术弥补力量上的不足。
actors.mobs.spscavemobs$sandmob.name=沙怪
actors.mobs.spscavemobs$sandmob.desc=一种由沙子组成的元素生物，死亡后会分裂成更小的个体。
actors.mobs.spscavemobs$sandmob$minisand.name=小型沙怪
actors.mobs.spscavemobs$sandmob$minisand.desc=沙怪死亡后分裂出的较小个体。
actors.mobs.spscavemobs$icebug.name=冰足虫
actors.mobs.spscavemobs$icebug.desc=生活在冰冷环境中的虫子，咬伤会造成结晶霜冻。
actors.mobs.spscavemobs$timekeeper.name=时序守卫
actors.mobs.spscavemobs$timekeeper.desc=守护时间线的卫士，能够挪移生物并逃过致命攻击。
actors.mobs.spscavemobs$timekeeper.yell=愚蠢！
actors.buffs.bugslow.name=稽生
actors.buffs.bugslow.desc=宿主会被寄生虫周期性减速。清空背包中的寄生虫即可解除此效果。
actors.buffs.lightshootattack.name=圣光打击
actors.buffs.lightshootattack.desc=强力光芒持续打击这个地点，远离这个区域可以回避后续伤害。剩余打击时长：%s回合。
actors.mobs.spscitymobs$dragonrider.name=龙骑兵
actors.mobs.spscitymobs$dragonrider.desc=与龙一起战斗的士兵。龙死亡后，骑兵仍会留下继续作战。
actors.mobs.spscitymobs$spiderbot.name=贪食者
actors.mobs.spscitymobs$spiderbot.desc=战争后期出现在城区内的生物。它们以尸体为食，并将幼体射到敌对生物身上。死亡时，体内的幼体还会洒落一地。
actors.mobs.spscitymobs$spiderbot.yell=奇怪的虫子爬进了你的背包。
actors.mobs.spscitymobs$musketeer.name=矮人射手
actors.mobs.spscitymobs$musketeer.desc=与矮人国王不同，矮人将军认为火器才是正确的研究方向，于是这些射手加入了矮人王国的巡逻队。
actors.mobs.dragonrider.name=龙骑兵
actors.mobs.dragonrider.desc=与龙一起战斗的士兵。龙死亡后，骑兵仍会留下继续作战。
actors.mobs.spiderbot.name=贪食者
actors.mobs.spiderbot.desc=战争后期出现在城区内的生物。它们以尸体为食，并将幼体射到敌对生物身上。死亡时，体内的幼体还会洒落一地。
actors.mobs.spiderbot.yell=奇怪的虫子爬进了你的背包。
actors.mobs.musketeer.name=矮人射手
actors.mobs.musketeer.desc=与矮人国王不同，矮人将军认为火器才是正确的研究方向，于是这些射手加入了矮人王国的巡逻队。
actors.mobs.spscitymobs$manyskeleton.name=骷髅球
actors.mobs.spscitymobs$manyskeleton.desc=由一大堆骷髅组成的球，每次受到有力攻击都会掉出一只骷髅。
actors.mobs.spscitymobs$summonedskeleton.name=被召唤的亡灵
actors.mobs.spscitymobs$summonedskeleton.desc=这不过是一个被魔法召唤来的亡灵。
actors.mobs.spscitymobs$levelchecker.name=裁决者
actors.mobs.spscitymobs$levelchecker.desc=外形如同天平的巨型机械裁决者，会依据受害者的阅历作出裁决。
actors.mobs.spscitymobs$greatmoss.name=孢子巨人
actors.mobs.spscitymobs$greatmoss.desc=植物与元素生命的巨大混合物，受击时会释放危险孢子。
actors.mobs.spscitymobs$redwraith.name=混沌幽灵
actors.mobs.spscitymobs$redwraith.desc=蕴含强烈混沌能量的红色幽灵。相传有些戒指的魔力就来源于它。
actors.mobs.manyskeleton.name=骷髅球
actors.mobs.manyskeleton.desc=由一大堆骷髅组成的球，每次受到有力攻击都会掉出一只骷髅。
actors.mobs.levelchecker.name=裁决者
actors.mobs.levelchecker.desc=外形如同天平的巨型机械裁决者，会依据受害者的阅历作出裁决。
actors.mobs.greatmoss.name=孢子巨人
actors.mobs.greatmoss.desc=植物与元素生命的巨大混合物，受击时会释放危险孢子。
actors.mobs.redwraith.name=混沌幽灵
actors.mobs.redwraith.desc=蕴含强烈混沌能量的红色幽灵。相传有些戒指的魔力就来源于它。
actors.mobs.redwraith.def_verb=躲避
actors.mobs.gnollshaman.name=豺狼萨满
actors.mobs.gnollshaman.desc=那些最具有智慧的豺狼可以掌握萨满魔法，豺狼萨满由于缺少力量所以更喜欢使用战斗法术。任何敢于质疑它们在部落里地位的人都会被萨满用法术毫不留情地消灭。
actors.mobs.sandmob.name=沙怪
actors.mobs.sandmob.desc=一种由沙子组成的怪物，死亡后会分裂。\n元素
actors.mobs.sandmob$minisand.name=迷你沙怪
actors.mobs.sandmob$minisand.desc=迷你沙怪
actors.mobs.icebug.name=冰足虫
actors.mobs.icebug.desc=冰冷环境下生存的虫子。
actors.mobs.timekeeper.name=时序守卫
actors.mobs.timekeeper.desc=守护时间线的卫士，来去自如。
actors.mobs.timekeeper.yell=愚蠢!!!
actors.mobs.dustelement.name=尘埃元素
actors.mobs.dustelement.blind=灰尘阻碍了你的视线。
actors.mobs.dustelement.desc=年久失修的下水道里面的尘埃和向外扩散的黑暗力量融合，生成了这一种羸弱的元素。
actors.mobs.ratboss.name=领头鼠
actors.mobs.ratboss.desc=领头鼠是鼠群的头领。虽然它不像鼠王一样有威信，但它依然可以叫来鼠群。
actors.mobs.ratboss.spawn=这里出现了一群老鼠！
actors.mobs.shit.name=马桶精灵
actors.mobs.shit.desc=住在下水道的精灵，与腐坏一起生活。
actors.mobs.livemoss.name=寄生苔藓
actors.mobs.livemoss.desc=由于黑暗力量的侵蚀，下水道诡异的生物逐渐增多。这个生物就是其中的一种:扭曲的植物占据了死去的老鼠躯体，并向外抛洒寄生孢子。
actors.mobs.patroluav.name=巡逻无人机
actors.mobs.patroluav.desc=一种高科技的无人机，被用于清理下水道垃圾。\n机械
actors.mobs.vagrant.name=流浪者
actors.mobs.vagrant.desc=住在下水道的流浪者，有着极高的恢复能力。
actors.mobs.exvagrant.name=感染流浪者
actors.mobs.exvagrant.desc=被源石感染的流浪者，有着极高的恢复能力生命偷取，并且会在死亡时污染周围的环境。
actors.mobs.ghostphoto.name=霉画
actors.mobs.ghostphoto.desc=用于装饰监狱办公室的油画，被黑魔法污染后开始四处游荡。
actors.mobs.goldcollector.name=税收官
actors.mobs.goldcollector.desc=背着巨大口袋的哥布林税收官，会偷走你的金币并将其转化为护盾。
actors.mobs.firerabbit.name=堕天使
actors.mobs.firerabbit.desc=兔人火焰兵，训练方便且造价低廉，被派遣至此清剿亡灵。
actors.mobs.firerabbit.yell=ko~ko~da~yo
actors.mobs.trollwarrior.name=巨魔战士
actors.mobs.trollwarrior.desc=监狱沦陷前，巨魔是其中最强大的势力之一，就连守卫也不愿招惹他们。
actors.mobs.trollwarrior.angry=你竟敢攻击我？！
actors.mobs.zombie.name=丧尸
actors.mobs.zombie.desc=这并不是行动迟缓、毫无思维的普通尸体，而是一名感染者。
actors.mobs.fireelemental.name=火元素
actors.mobs.fireelemental.desc=这些游荡的火元素是在召唤某种更强大存在时产生的副产品。其特性太过紊乱，以至于最强大的恶魔学者都无法驱使。
actors.mobs.greyrat.name=灰毛鼠
actors.mobs.greyrat.desc=灰毛鼠是棕毛鼠的变种，它可以免疫大量负面状态。

actors.buffs.becorrupt.name=侵蚀
actors.buffs.becorrupt.desc=你被侵蚀了。侵蚀会阻止生命恢复，并将生命变化转化为额外伤害。剩余侵蚀效果：%s。
actors.mobs.spshallsmobs$demongoo.name=暗黑黏咕
actors.mobs.spshallsmobs$demongoo.desc=恶魔黏咕通常由熔岩、黏液、暗能量与恶意构成，其中绝大部分都是黑暗。不要任其分裂，即使最弱的碎块也能再次变强。
actors.mobs.spshallsmobs$demongoo.divide=暗黑黏咕分裂了！
actors.mobs.spshallsmobs$thiefimp.name=强盗小鬼
actors.mobs.spshallsmobs$thiefimp.desc=小鬼是地狱中最底层的居民。它们没有固定收入，所以经常到其他地方偷窃。
actors.mobs.spshallsmobs$thiefimp.stole=小鬼偷走了%s！
actors.mobs.spshallsmobs$thiefimp.carries=\n\n这个小鬼携带着_%s_。明显是偷来的。
actors.mobs.spshallsmobs$demonflower.name=恶魔花
actors.mobs.spshallsmobs$demonflower.desc=生长在地狱中的花。它不仅能够移动，还能连续攻击并削弱目标的攻击与护甲。
actors.mobs.spshallsmobs$demonflower.debuff=恶魔花释放了虚弱孢子。
actors.mobs.spshallsmobs$sufferer.name=受难者
actors.mobs.spshallsmobs$sufferer.desc=这些高估自己的术士尝试控制高等恶魔，却反被腐化和奴役，永远留在了这里。
actors.mobs.thiefimp.name=强盗小鬼
actors.mobs.thiefimp.desc=小鬼是地狱中最底层的居民。它们没有固定收入，所以经常到其他地方偷窃。
actors.mobs.thiefimp.stole=小鬼偷走了%s！
actors.mobs.thiefimp.carries=\n\n这个小鬼携带着_%s_。明显是偷来的。
actors.mobs.sufferer.name=受难者
actors.mobs.sufferer.desc=这些高估自己的术士尝试控制高等恶魔，却反被腐化和奴役，永远留在了这里。
actors.mobs.spshallsmobs$demonrabbit.name=血兔射手
actors.mobs.spshallsmobs$demonrabbit.desc=被恶魔血转化的兔人射手，会使用流血弹射击，并在命中处留下腐化气体。
actors.mobs.demongoo.name=暗黑黏咕
actors.mobs.demongoo.desc=恶魔黏咕通常由熔岩、黏液、暗能量与恶意构成，其中绝大部分都是黑暗。不要任其分裂，即使最弱的碎块也能再次变强。
actors.mobs.demongoo.divide=暗黑黏咕分裂了！
actors.mobs.demonflower.name=恶魔花
actors.mobs.demonflower.desc=生长在地狱中的花。它不仅能够移动，还能连续攻击并削弱目标的攻击与护甲。
actors.mobs.demonflower.debuff=恶魔花释放了虚弱孢子。
actors.mobs.demonrabbit.name=血兔射手
actors.mobs.demonrabbit.desc=被恶魔血转化的兔人射手，会使用流血弹射击，并在命中处留下腐化气体。

actors.mobs.sewerheart.name=下水道之心
actors.mobs.sewerheart.desc=监狱典狱长曾培育过许多奇怪植物，其中一种莓果逃到这里自由生长。如今它坚硬的果实包裹着巨大器官，还能驱使根须并发射致命光束。
actors.mobs.sewerheart.blink=下水道之心逃走了！
actors.mobs.sewerheart$sewerlasher.name=藤鞭
actors.mobs.sewerheart$sewerlasher.desc=这东西应该是成熟莓果的一段根茎。它不能移动，却会猛烈攻击任何靠近的生物。
actors.mobs.plaguedoctor.name=瘟疫医生
actors.mobs.plaguedoctor.desc=这是一个不被认可的研究者。在被带到这个世界后，他彻底疯了，并会随着战斗进行变得愈发危险。
actors.mobs.plaguedoctor.notice=所以……你是来帮我做研究的吗？
actors.mobs.plaguedoctor.yell=放心，这不会痛的……我会证明给你看……
actors.mobs.plaguedoctor.yell2=老鼠……它们到处都是……我们完了……
actors.mobs.plaguedoctor.crazy=瘟疫医生的信念正在经受考验……狂乱！
actors.mobs.plaguedoctor$shadowrat.name=瘟疫之影
actors.mobs.plaguedoctor$shadowrat.desc=一种奇怪的影子，外形和老鼠差不多。

actors.buffs.arcane.name=奥术强化
actors.buffs.arcane.desc=魔法力量暂时得到强化。\n\n剩余回合：%s。
actors.buffs.highlight.name=强光
actors.buffs.highlight.desc=明亮光线将视野扩大到10格。\n\n剩余回合：%s。
actors.buffs.hot.name=灼热
actors.buffs.hot.desc=灼热状态会使受到的所有伤害提高20%%。\n\n剩余回合：%s。
actors.buffs.rhythm.name=节奏
actors.buffs.rhythm.desc=节奏使命中提高到三倍，并使闪避提高50%%。\n\n剩余回合：%s。
actors.buffs.shocked.name=电击
actors.buffs.shocked.desc=电击首次发作时会造成基于生命上限的伤害。
actors.buffs.shadowcurse.name=暗影诅咒
actors.buffs.shadowcurse.desc=诅咒会立即造成基于生命上限的伤害，并在四次发作后再次爆发。
actors.buffs.newcombo.name=隆拳连击
actors.buffs.newcombo.combo=%d连！
actors.buffs.newcombo.bad_target=目标必须是攻击距离内的敌人。
actors.buffs.newcombo.clobber_prompt=选择要击垮的目标
actors.buffs.newcombo.clobber_desc=_击垮_造成1.6倍伤害，将目标击退并使其晕向。
actors.buffs.newcombo.cleave_prompt=选择要劈斩的目标
actors.buffs.newcombo.cleave_desc=_劈斩_造成2.5倍伤害。若成功杀敌，连击会保留并增加。
actors.buffs.newcombo.slam_prompt=选择要重击的目标
actors.buffs.newcombo.slam_desc=_重击_取两次伤害中的较高值，造成2.6倍伤害并获得物理护盾。
actors.buffs.newcombo.crush_prompt=选择要粉碎的目标
actors.buffs.newcombo.crush_desc=_粉碎_取四次伤害中的最高值并造成3.5倍伤害。
actors.buffs.newcombo.desc=徒手攻击命中会积累连击。超过四回合未命中或连续两次落空会中断连击；2、4、6、8连时会解锁对应终结技。
actors.buffs.goldtouch.name=点金
actors.buffs.goldtouch.desc=臂章里的金币覆盖了你的手臂，使你在近战攻击时获得金币。\n\n剩余效果时长：%s回合。
actors.buffs.hastebuff.name=极速
actors.buffs.hastebuff.desc=你的移动速度提升为两倍。\n\n剩余效果时长：%s回合。
actors.buffs.disarm.name=缴械
actors.buffs.disarm.desc=无形的麻绳锁住了你的双手，使你无法进行普通攻击。\n\n剩余效果时长：%s回合。
actors.buffs.disarm.cant_attack=缴械状态下无法攻击。
actors.buffs.moonfury.name=强力
actors.buffs.moonfury.desc=奇妙的力量充斥着你的身体，使你下一次成功攻击造成三倍伤害。
actors.buffs.highattack.name=攀墙伏击
actors.buffs.highattack.desc=在障碍物旁蓄力，获得少量闪避提升和下次攻击伤害加成；离开障碍物会失去效果。\n\n下次伤害加成倍率：%s。
actors.buffs.skillrecharge.name=技能充能
actors.buffs.skillrecharge.desc=技能冷却期间仍可使用职业技能。\n\n剩余效果时长：%s回合。
actors.blobs.memoryfire.desc=翠绿色的火焰保存着此刻的完整记忆。踏入其中，可以把当前冒险复制到另一个存档位。
actors.buffs.muscle.name=肌肉强化
actors.buffs.muscle.desc=力量提高2点。\n\n剩余效果时长：%s回合。
actors.buffs.bloodimbue.name=鲜血灌注
actors.buffs.bloodimbue.desc=成功攻击时可能使目标残废、缠绕或麻痹，并免疫多种妨碍状态。\n\n剩余效果时长：%s回合。
actors.buffs.needling.name=针刺
actors.buffs.needling.desc=成功攻击会使目标护甲降低50%%或严重流血。\n\n剩余效果时长：%s回合。
actors.buffs.targetshoot.name=瞄准射击
actors.buffs.targetshoot.desc=投射武器伤害提高50%%。\n\n剩余效果时长：%s回合。
actors.buffs.speedimbue.name=速度灌注
actors.buffs.speedimbue.desc=速度提高到两倍，攻击伤害提高50%%，但受到的伤害提高10%%。\n\n剩余效果时长：%s回合。
actors.buffs.spattack.name=特殊攻击
actors.buffs.spattack.desc=攻击满血敌人时造成三倍伤害，攻击生命低于四分之一的敌人时额外造成50%%伤害。\n\n剩余效果时长：%s回合。
actors.buffs.feed.name=生命摄取
actors.buffs.feed.desc=每杀死一个敌对单位，永久获得1点生命上限。\n\n剩余效果时长：%s回合。
actors.buffs.magicweak.name=魔法易伤
actors.buffs.magicweak.desc=受到的魔法与状态伤害提高50%%。\n\n剩余效果时长：%s回合。
actors.buffs.magicarmor.name=魔法护盾
actors.buffs.magicarmor.desc=护盾会吸收魔法与状态效果造成的伤害。剩余护盾：%s。
actors.buffs.htimprove.name=生命强化
actors.buffs.htimprove.desc=未经装备修正的生命上限暂时提高20%%。\n\n剩余效果时长：%s回合。
actors.buffs.paryattack.name=原地格挡
actors.buffs.paryattack.desc=保持原地会逐回合提高攻击并降低所受伤害；移动或金币不足时状态结束。当前强度：%s%%。
actors.buffs.blasphemy.name=亵渎
actors.buffs.blasphemy.desc=每层永久使全部攻击伤害提高10%%。当前层数：%s。
actors.buffs.highvoice.name=高音
actors.buffs.highvoice.desc=演奏有时会强化攻击，并削弱受到的伤害。\n\n剩余效果时长：%s回合。
actors.buffs.learnskill.name=学习技能
actors.buffs.learnskill.desc=再击杀%s个敌对单位后，攻击、闪避、魔力与生命上限将永久提高。
actors.buffs.mecharmor.name=机械护甲
actors.buffs.mecharmor.desc=机械护甲会吸收全部伤害，但每回合也会损失1点。剩余护甲：%s。
actors.mobs.npcs.mtree.name=战争古树
actors.mobs.npcs.mtree.desc=由猎手召来的远古守卫，沉重攻击会将敌人缠绕在原地。

actors.mobs.thiefking.name=金城领主
actors.mobs.thiefking.desc=传说中最神秘的盗贼，同时也是这个城市的领主。
actors.mobs.thiefking.notice=你就是让我们组织吃瘪的那个人，%s？那么现在，受死吧。
actors.mobs.thiefking.die=你的生命，我买不起……
actors.mobs.normalcell.name=普通细胞
actors.mobs.normalcell.desc=由不稳定的退化弹转变而成的奇异活细胞。
actors.buffs.holystun.name=护盾打击
actors.buffs.holystun.desc=无法被伤害提前解除的超强控制效果。\n\n剩余效果时长：%s回合
actors.mobs.forestprotector.name=森林巫医
actors.mobs.forestprotector.desc=一株打扮得像豺狼巫医的植物，会使用些许法术，但更擅长近战。
actors.mobs.mossyskeleton.name=青苔骷髅
actors.mobs.mossyskeleton.desc=青苔覆盖了这具骷髅，并由此支配着骷髅的行动。
actors.mobs.mossyskeleton.killcount=已击败青苔骷髅：%d
actors.mobs.graveprotector.name=独眼士官
actors.mobs.graveprotector.desc=巨魔中的独眼巨人，拥有强大的远程战力，但不擅长近战。
actors.mobs.albinopiranha.name=原生肉食鱼
actors.mobs.albinopiranha.desc=生活在这里的肉食鱼经过数百年演变，视觉早已退化，其他感官却异常灵敏，能察觉周围水流最细微的变化。
actors.mobs.albinopiranha.killcount=已击败原生肉食鱼：%d
actors.mobs.fishprotector.name=冰霜巨人
actors.mobs.fishprotector.desc=从时间缝隙中幸存的元素生物，死亡时会改变脚下的地形。
actors.mobs.goldthief.name=黄金小盗
actors.mobs.goldthief.desc=不同于其他小偷，它只关心闪闪发光的金币，并会在得手后立刻逃跑。
actors.mobs.goldthief.stole=黄金小盗从你那里偷走了%d枚金币！
actors.mobs.goldthief.killcount=已击败黄金小盗：%d
actors.mobs.vaultprotector.name=赏金猎人
actors.mobs.vaultprotector.desc=只要目标足够有名，赏金猎人就会闻讯而来。
actors.mobs.iceball.name=大雪球
actors.mobs.iceball.desc=巨大的冰球滚过来了。
actors.buffs.spsacidooze.name=酸蚀
actors.buffs.spsacidooze.desc=翠绿强酸正在持续侵蚀目标，进入水中可以将其洗去。
actors.buffs.acidooze.name=腐酸
actors.buffs.acidooze.desc=这种粘稠的酸性淤泥正在紧贴你的骨肉，并缓慢地将它们腐蚀融化。\n\n淤泥会一直造成稳定伤害直至被水冲洗。\n\n淤泥本身不会自然消失，必须在水中才能洗掉。
actors.buffs.acidooze.heromsg=污泥在腐蚀你的身体。洗掉它！
actors.blobs.swampgas.desc=这里盘绕着棕色的沼泽气体。它会使其中的生物易伤且越来越迟缓，并且非常易燃。
actors.buffs.speedslow.name=衰减缓速
actors.buffs.speedslow.desc=效果逐渐降低的减速，但累加会造成僵直。\n\n减速程度取决于剩余的效果时间，最严重时等同于迟缓效果。\n\n剩余效果时长：%1$s回合\n当前速度降低：%2$s%%
actors.buffs.standdown.name=僵直
actors.buffs.standdown.desc=僵直效果类似于麻痹，使目标不能行动。与麻痹不同的是，僵直会在目标受到伤害时立即消失。\n\n剩余效果时长：%s回合
actors.buffs.spscharm.name=魅惑
actors.buffs.spscharm.heromsg=你被魅惑了！
actors.buffs.spscharm.desc=被魅惑的单位无法直接攻击魅惑施行者，但依然可以攻击其他敌人。与现代魅惑不同，受到伤害不会缩短此效果。\n\n魅惑效果剩余时间：%s回合
actors.buffs.damageup.name=伤害积蓄
actors.buffs.damageup.desc=你提升了下一次攻击所造成的伤害。\n\n伤害提升值：%s。
actors.buffs.superarcane.name=奥术灌注
actors.buffs.superarcane.desc=魔力流遍了你的全身，增加%1$s点法强。\n\n剩余效果时长：%2$s回合。
actors.buffs.notice.name=敏锐
actors.buffs.notice.desc=敏锐的直觉使被动搜索必定发现范围内所有可搜索的隐藏事物。\n\n剩余效果时长：%s回合。
actors.buffs.wargroove.name=战意律动
actors.buffs.wargroove.desc=下一次成功的物理攻击造成50%%额外伤害。
actors.blobs.slowgas.desc=这里盘绕着一片极寒雪雾，会持续拖慢身处其中的生物。
actors.buffs.betired.name=疲劳
actors.buffs.betired.desc=每次受到攻击都会累积一层疲劳。在状态结束前累积十六层时，会受到最大生命值10%%的伤害。\n\n剩余回合：%1$s。还需受击：%2$d。
actors.buffs.boxstar.name=无敌星
actors.buffs.boxstar.desc=接下来%s回合内免疫所有伤害。
actors.buffs.mirrorshield.name=智慧守护
actors.buffs.mirrorshield.desc=接下来%s回合内免疫所受伤害，并将其中一部分反射给攻击者。
actors.buffs.faithbuff.mechfaith.name=信仰-机械派系
actors.buffs.faithbuff.mechfaith.desc=来自机械派系的伤害降低25%%，对自然派系造成的伤害提高50%%。
actors.buffs.faithbuff.lifefaith.name=信仰-自然派系
actors.buffs.faithbuff.lifefaith.desc=来自自然派系的伤害降低25%%，对机械派系造成的伤害提高50%%。
actors.buffs.faithbuff.demonfaith.name=信仰-恶魔派系
actors.buffs.faithbuff.demonfaith.desc=来自恶魔派系的伤害降低25%%，对神圣派系造成的伤害提高50%%。
actors.buffs.faithbuff.humanfaith.name=信仰-神圣派系
actors.buffs.faithbuff.humanfaith.desc=来自神圣派系的伤害降低25%%，对恶魔派系造成的伤害提高50%%。
actors.buffs.faithbuff.balancefaith.name=信仰-平衡派系
actors.buffs.faithbuff.balancefaith.desc=来自首领和小首领的伤害降低25%%，对其造成的伤害提高50%%。
actors.buffs.infjump.name=无限跳跃
actors.buffs.infjump.desc=跳跃不会消耗鞋子的充能。\n\n剩余效果时长：%s回合。
actors.buffs.forevershadow.name=永影
actors.buffs.forevershadow.desc=斗篷将它与你结合，短时间内使你无法被任何人察觉，即使你做出惊动他人的动作。\n\n剩余的效果时长：%s回合。
actors.buffs.mindbuff.terrormind.name=疯狂-恐惧
actors.buffs.mindbuff.terrormind.desc=闪避率降低。
actors.buffs.mindbuff.amokmind.name=疯狂-混乱
actors.buffs.mindbuff.amokmind.desc=命中率降低。
actors.buffs.mindbuff.crazymind.name=疯狂-绝望
actors.buffs.mindbuff.crazymind.desc=攻击变得不稳定。
actors.buffs.mindbuff.losemind.name=疯狂-失神
actors.buffs.mindbuff.losemind.desc=法强降低。
actors.buffs.mindbuff.weakmind.name=疯狂-脆弱
actors.buffs.mindbuff.weakmind.desc=受到的伤害提升。
actors.buffs.onepunch.name=认真一拳
actors.buffs.onepunch.desc=下一次成功攻击额外造成%d%%伤害。
actors.buffs.shocked2.name=环绕乱流
actors.buffs.shocked2.desc=电流消散前移动会受到伤害并被缠绕。剩余回合：%d。
actors.buffs.mindbuff.hopemind.name=疯狂-希望
actors.buffs.mindbuff.hopemind.desc=以后每次升级都会额外增加1点生命上限。
actors.buffs.mindbuff.keepmind.name=疯狂-坚定
actors.buffs.mindbuff.keepmind.desc=免疫蛛网和有害天气效果。

actors.buffs.bunnycombo.name=兔兔连击
actors.buffs.bunnycombo.bad_target=目标必须是攻击距离以内的敌人。
actors.buffs.bunnycombo.a_prompt=选择一个要击残的目标
actors.buffs.bunnycombo.a_desc=_击残_已经就绪。这一击会使目标致残5回合。
actors.buffs.bunnycombo.b_prompt=选择一个要致盲的目标
actors.buffs.bunnycombo.b_desc=_抛沙_已经就绪。这一击会使目标致盲5回合。
actors.buffs.bunnycombo.c_prompt=选择一个要割裂的目标
actors.buffs.bunnycombo.c_desc=_割裂_已经就绪。这一击会使目标流血。
actors.buffs.bunnycombo.d_prompt=选择一个要击退的目标
actors.buffs.bunnycombo.d_desc=_冲击_已经就绪。这一击会击退目标并使其眩晕。
actors.buffs.bunnycombo.e_prompt=选择一个要终结的目标
actors.buffs.bunnycombo.e_desc=_终结_已经就绪。这一击会按照累积连击数倍增伤害，并重置连击。
actors.buffs.bunnycombo.desc=成功攻击会积累连击。连续两次攻击落空或4回合内没有继续攻击都会重置连击。在2、4、6、8、10连击时会解锁不同的必中处决技，只有最高级处决技会重置连击。
actors.buffs.funnybuff.name=滑稽
actors.buffs.funnybuff.desc=一切都显得十分滑稽。\n\n剩余时间：%s回合。
actors.buffs.exprotect.name=精英保护
actors.buffs.exprotect.desc=免疫受到的第一次伤害。在这层保护被打破前，守卫会保持沉睡。
actors.buffs.dburning.name=深度燃烧
actors.buffs.dburning.desc=猛烈的魔法火焰会按照目标的生命上限持续造成伤害。\n\n剩余时间：%s回合。
actors.blobs.sandstorm.desc=这里盘绕着干燥的沙尘暴，会使生物陷入干燥，并以土元素影响地上的物品。
actors.mobs.spsexitmobs$guardalbino.name=白化老鼠
actors.mobs.spsexitmobs$guardalbino.desc=这是一只罕见的白色老鼠，会在身边散布腐化气体和干燥沙尘。
actors.mobs.spsexitmobs$guardvagrant.name=感染流浪者
actors.mobs.spsexitmobs$guardvagrant.desc=被源石感染的流浪者，有着极强的恢复能力和生命偷取能力。
actors.mobs.spsexitmobs$guardbandit.name=紫衣大盗
actors.mobs.spsexitmobs$guardbandit.desc=紫衣大盗会偷走金币、散布黑暗气体，并使被害者中毒。
actors.mobs.spsexitmobs$guardbamboo.name=竹子精
actors.mobs.spsexitmobs$guardbamboo.desc=竹子的进化体，会吸取周围的生命能量并缠绕附近的生物。
actors.mobs.spsexitmobs$guardbombbug.name=霜石虫
actors.mobs.spsexitmobs$guardbombbug.desc=包裹着冰石的虫子，会冻结附近的生物，并在重伤时分裂。
actors.mobs.spsexitmobs$guardshielded.name=持盾豺狼
actors.mobs.spsexitmobs$guardshielded.desc=这个豺狼人带着一块沉重的盾牌，会反击攻击并多次恢复防护。
actors.mobs.spsexitmobs$guardsenior.name=武僧大师
actors.mobs.spsexitmobs$guardsenior.desc=相较普通武僧而言，武僧大师变秃了，也变强了！
actors.mobs.spsexitmobs$guardfiresuccubus.name=烈焰魅魔
actors.mobs.spsexitmobs$guardfiresuccubus.desc=被火焰环绕的强大魅魔，受到攻击后会进一步增强攻势。
actors.mobs.spsexitmobs$guardacidic.name=酸液蝎子
actors.mobs.spsexitmobs$guardacidic.desc=酸液蝎子更加危险，会释放恶臭气体，并在受击时喷溅腐蚀性液体。

actors.mobs.pets.haro.name=哈罗
actors.mobs.pets.haro.desc=阿萨修好的机器。
actors.mobs.pets.pigpet.name=像素猪
actors.mobs.pets.pigpet.desc=半大不小的粉红猪，山区居民会训练它寻找地下黑色珍蘑。只要对它好，它也会努力做出回报。
actors.mobs.pets.cococat.name=椰子猫
actors.mobs.pets.cococat.desc=椰子所培养的宠物猫。它和椰子一样携带着大量的炸弹。
actors.mobs.pets.velocirooster.name=公鸡
actors.mobs.pets.velocirooster.desc=这只公鸡比同类更加凶猛。它在地牢中穿行，并用尖锐的爪子和喙攻击。
actors.mobs.pets.velocirooster.yell1=鸡你太美！！！
actors.mobs.pets.velocirooster.yell2=你~干~嘛~

actors.mobs.npcs.giftnpc.talk=对话
actors.mobs.npcs.giftnpc.gift=送礼
actors.mobs.npcs.giftnpc.gift_prompt=选择一件礼物
actors.mobs.npcs.giftnpc.npc_item=对方很喜欢%s。
actors.mobs.npcs.giftnpc.npc_not_item=看起来对方不喜欢这个礼物。
actors.mobs.npcs.giftren.desc=看起来REN似乎等待着有人送他一些来自这座地牢的礼物。
actors.mobs.npcs.giftren.name=等待礼物的REN
actors.mobs.npcs.giftren.normal=你好，请问有什么事情吗？我正在收集一些存在于这座地牢的物件，我想将它们珍藏在我的某个世界里……嚄，最好是很有特征的宝物！
actors.mobs.npcs.giftren.yell1=有什么问题吗？
actors.mobs.npcs.giftren.yell2=我喜欢来自地牢的礼物！
actors.mobs.npcs.giftren.yell3=我有些喜欢你了。
actors.mobs.npcs.giftren.yell4=看起来这座地牢还有不少好东西！
actors.mobs.npcs.giftren.thank1=成色不错！非常开门。
actors.mobs.npcs.giftren.thank2=嚄，谢谢……
actors.mobs.npcs.giftren.thank3=哦哟……谢谢！
actors.mobs.npcs.giftren.reward1=这是别的世界的钱币，交换给你！
actors.mobs.npcs.giftren.reward2=我在附近捡到的闪闪发光的东西，给。
actors.mobs.npcs.giftren.reward3=我收集了很多这些，给你一点！
actors.mobs.npcs.giftren.reward4=回给你这个！
actors.mobs.npcs.giftren.reward5=嚄……谢谢你一直以来的礼物。穿上这件衣服之后，能够“防止”你被其他世界的REN袭击。
actors.mobs.npcs.giftashwolf.desc=阿萨正在拍摄地牢求生这一节目，一同拍摄的还有他领地内部各种生物。
actors.mobs.npcs.giftashwolf.name=地牢求生的阿萨男爵
actors.mobs.npcs.giftashwolf.normal=来到地下城冒险可没法带上能吃一辈子的粮食，合理利用就地取材吧。
actors.mobs.npcs.giftashwolf.yell1=再怎么饥不择食，也尽量别吃生肉，合理利用陷阱或魔法吧。
actors.mobs.npcs.giftashwolf.yell2=打干粮包虽然不错，但你会发现把它们煮一下再吃更美味。
actors.mobs.npcs.giftashwolf.yell3=用蜂蜜制作的料理营养丰富，可以有效地提高你的耐力。
actors.mobs.npcs.giftashwolf.yell4=有时你会发现，在孤独的旅程中，一个伙伴是多么的重要。
actors.mobs.npcs.giftashwolf.thank1=呵呵呵，你怎么会知道我刚好需要这个。
actors.mobs.npcs.giftashwolf.thank2=闻起来味道很不错，那我就不客气了。
actors.mobs.npcs.giftashwolf.reward1=刚好采到了不少这个，应该挺值钱的，送你一些。
actors.mobs.npcs.giftashwolf.reward2=这个小家伙很粘人，相信它更愿意陪你出去冒险。
actors.mobs.npcs.giftcoconut.desc=一只正在测试各种东西的橙色猫。
actors.mobs.npcs.giftcoconut.name=实地实验的椰子
actors.mobs.npcs.giftcoconut.normal=你好啊，有什么事吗？
actors.mobs.npcs.giftcoconut.yell1=想吃蛋糕啊。
actors.mobs.npcs.giftcoconut.yell2=还有啥黑科技呢？
actors.mobs.npcs.giftcoconut.yell3=我的小机器人去哪了？
actors.mobs.npcs.giftcoconut.yell4=实验感觉如何，我这儿炸弹管够。
actors.mobs.npcs.giftcoconut.thank1=谢了。
actors.mobs.npcs.giftcoconut.reward1=新鲜的炸弹在此。
actors.mobs.npcs.giftcoconut.reward2=这是新的命中药水，尝一下吧。
actors.mobs.npcs.giftcoconut.reward3=这是新的闪避凝胶，擦一下吧。
actors.mobs.npcs.giftcoconut.reward4=这是新的法强发蜡，涂一下吧。
actors.mobs.npcs.giftcoconut.reward5=这是杠铃，这是火堆，来，举重吧。
actors.mobs.npcs.giftbegger.desc=四处流浪的乞讨者，来者不拒。
actors.mobs.npcs.giftbegger.name=无名的乞丐
actors.mobs.npcs.giftbegger.normal=行行好吧。
actors.mobs.npcs.giftbegger.yell1=行行好吧。
actors.mobs.npcs.giftbegger.yell2=行行好吧。
actors.mobs.npcs.giftbegger.yell3=行行好吧。
actors.mobs.npcs.giftbegger.yell4=愿神保佑你。
actors.mobs.npcs.giftbegger.thank1=太感谢了，我水都出来了。
actors.mobs.npcs.giftbegger.reward1=我不知道该怎么谢你。这只鸡本来是午饭，现在就作为回礼给你吧。
actors.mobs.npcs.giftafly.desc=春季野营是一个不错的选择，前提是带足可口食物。
actors.mobs.npcs.giftafly.name=野营的阿飞、阿比和阿比斯
actors.mobs.npcs.giftafly.normal=天气不错，一起来吃点什么吧。
actors.mobs.npcs.giftafly.yell1=怎么那么多灵视药水啊，食物呢？
actors.mobs.npcs.giftafly.yell2=怎么那么多灵能汲取卷轴啊，纸巾呢？
actors.mobs.npcs.giftafly.yell3=怎么连袜子都混进去了？
actors.mobs.npcs.giftafly.yell4=嘛，至少野营是顺利的，不是吗。
actors.mobs.npcs.giftafly.thank1=是……是食物，太好了。
actors.mobs.npcs.giftafly.reward1=白拿这么多吃的太不好意思了，这药水和卷轴就给你好了。
actors.mobs.npcs.giftafly.reward2=多亏了你，野营顺利结束了。这3个饭团带有属于我们的专属祝福。
actors.mobs.npcs.giftbamech.desc=壁垒用于开拓不明地区的装置。
actors.mobs.npcs.giftbamech.name=壁垒专属开拓探机
actors.mobs.npcs.giftbamech.normal=滴……滴……滴……滴……
actors.mobs.npcs.giftbamech.yell1=土.壤.环.境.调.查
actors.mobs.npcs.giftbamech.yell2=生.物.环.境.调.查
actors.mobs.npcs.giftbamech.yell3=气.候.环.境.调.查
actors.mobs.npcs.giftbamech.yell4=调.查.完.成.分.析.中
actors.mobs.npcs.giftbamech.thank1=指.标.上.传.已.完.成
actors.mobs.npcs.giftbamech.reward1=补.给.已.配.送
actors.mobs.npcs.giftbamech.reward2=开.拓.完.成.点.数.传.输.中
actors.mobs.npcs.giftfruitworker.desc=水果和蔬菜，他都喜欢。
actors.mobs.npcs.giftfruitworker.name=物色田地的果农
actors.mobs.npcs.giftfruitworker.normal=抡起镐子开干吧，不管是贫瘠的大地还是富养的花盆。
actors.mobs.npcs.giftfruitworker.yell1=哦，有事吗。
actors.mobs.npcs.giftfruitworker.yell2=你的背包飘出了肥料的气息，你一定也是个开拓者。
actors.mobs.npcs.giftfruitworker.yell3=花盆里面总能种出好东西，可能和花盆里的土壤有关系。
actors.mobs.npcs.giftfruitworker.yell4=出色的孩子啊，愿你旅途坦荡。
actors.mobs.npcs.giftfruitworker.thank1=这成色，这口感，我喜欢。
actors.mobs.npcs.giftfruitworker.reward1=孩子，要多吃东西。
actors.mobs.npcs.giftfruitworker.reward2=算下来你也送了我好多东西了。这些是稀有的种子，都给你了。
actors.mobs.npcs.giftmeatseller.desc=他卖肉，不卖身。喜欢有价值的东西。
actors.mobs.npcs.giftmeatseller.name=卖肉的游商
actors.mobs.npcs.giftmeatseller.normal=瞧一瞧看一看，新鲜的肉，拿东西来换吧。
actors.mobs.npcs.giftmeatseller.yell1=走过路过不要错过啊。
actors.mobs.npcs.giftmeatseller.yell2=过了这个村就没这个店了啊。
actors.mobs.npcs.giftmeatseller.yell3=有钱的捧个钱场，没钱的捧个人场啊。
actors.mobs.npcs.giftmeatseller.yell4=看你我有缘，以后我会罩着你的啊。
actors.mobs.npcs.giftmeatseller.thank1=谢谢惠顾。
actors.mobs.npcs.giftmeatseller.reward1=拿好这个小券，欢迎下次再来。
actors.mobs.npcs.giftmeatseller.reward2=肉的制作方法很多，我最喜欢的是蜂蜜肉。这些蜜蜂肉就免费给你了。
actors.mobs.npcs.gifttorch.desc=普通的火堆。
actors.mobs.npcs.gifttorch.name=燃烧的火堆
actors.mobs.npcs.gifttorch.normal=（火星炸裂的声音）
actors.mobs.npcs.gifttorch.yell1=（火苗普通地燃烧）
actors.mobs.npcs.gifttorch.yell2=（火苗猛烈地燃烧）
actors.mobs.npcs.gifttorch.yell3=（火堆普通地燃烧）
actors.mobs.npcs.gifttorch.yell4=（火苗猛烈地燃烧）
actors.mobs.npcs.gifttorch.thank1=（火焰稍微旺了点，你获得了火把）
actors.mobs.npcs.gifttorch.reward1=（火苗猛烈地燃烧，一块碳块掉了出来）
actors.mobs.npcs.gifttorch.reward2=（火苗猛烈地燃烧，一堆宝石掉了出来）
actors.mobs.npcs.giftflyling.desc=春季野营是一个不错的选择，前提是带足可口食物。
actors.mobs.npcs.giftflyling.name=发呆的澪
actors.mobs.npcs.giftflyling.normal=在我那个世界里，也有和你一样不怕困难、舍身前往黄金之城实验室的人。所以我认为，每个冒险者都值得尊重。
actors.mobs.npcs.giftflyling.yell1=嗯，不用感谢我。只是帮助你一下。
actors.mobs.npcs.giftflyling.yell2=嗯，不用感谢我。只是帮助你一下。
actors.mobs.npcs.giftflyling.yell3=嗯，不用感谢我。只是帮助你一下。
actors.mobs.npcs.giftflyling.yell4=不用谢我。另外，路上小心，祝你一路顺风。
actors.mobs.npcs.giftflyling.thank1=谢谢你的礼物，我会好好珍惜的。
actors.mobs.npcs.giftflyling.thank2=这……这礼物是送给我的吗？！非常谢谢你，我非常喜欢这礼物！
actors.mobs.npcs.giftflyling.thank3=你不仅身手了得，而且也如此可爱。这礼物我非常喜欢，我也会送你一个礼物。
actors.mobs.npcs.giftflyling.reward1=觉得你很有战斗的潜力，我想这瓶药剂可以帮到你。
actors.mobs.npcs.giftflyling.reward2=你很可爱，我想送你一件礼物。这个法杖会帮助到你。
actors.mobs.npcs.giftflyling.reward3=我将为你祷告并祝福你，这个水晶项链你也拿去。
actors.mobs.npcs.giftbunnykeeper.desc=她正在把兔子叠起来。为啥呢，不知道。
actors.mobs.npcs.giftbunnykeeper.name=叠兔子的养兔人
actors.mobs.npcs.giftbunnykeeper.normal=你好啊，愿意帮我收集兔子吗？
actors.mobs.npcs.giftbunnykeeper.yell1=这些兔子会乱跑，你需要智慧来抓住它们。
actors.mobs.npcs.giftbunnykeeper.yell2=如果让它们跑到洞里的话，也没啥关系。
actors.mobs.npcs.giftbunnykeeper.yell3=兔子毕竟是有限的，但如果你把它们赶到一起的话……嘿嘿。
actors.mobs.npcs.giftbunnykeeper.yell4=请支持Paquerette-Down-the-Bunburrows，谢谢。
actors.mobs.npcs.giftbunnykeeper.thank1=兔~兔~
actors.mobs.npcs.giftbunnykeeper.reward1=看，新的兔兔。
actors.mobs.npcs.giftbunnykeeper.reward2=看，大兔兔。
actors.buffs.lokispoison.name=猛毒
actors.buffs.lokispoison.desc=强烈的毒素传遍全身，并随剩余时间造成伤害。\n\n剩余中毒时长：%s回合
actors.buffs.lokispoison.heromsg=你中毒了！
actors.buffs.bloodangry.name=血怒
actors.buffs.bloodangry.desc=圣杯里的血液和你交融，降低了你当前的生命上限，但大幅度提升了你的速度和伤害。\n\n剩余的效果时长：%s回合。
actors.buffs.fullmoonstrength.name=满月之力
actors.buffs.fullmoonstrength.desc=你变得非常强大，获得2.5倍的伤害加成。
actors.buffs.fullmoonstrength.heromsg=你变强了！
actors.buffs.lingbless.name=澪祷之愿
actors.buffs.lingbless.desc=澪给你祝福，少量的提升了你的当前闪避和速度。\n\n持续时间：%s。
actors.buffs.magicimmunity.name=奥术护盾
actors.buffs.magicimmunity.desc=奥术护盾可以为目标提供一定抗性。\n\n剩余的护盾效果时长：%s回合
actors.mobs.orbofzotmob.name=zot牌能源球
actors.mobs.orbofzotmob.desc=你启动了zot牌能源球。它在攻击附近的怪物！
actors.mobs.orbofzotmob.die=机体过热，关闭...
actors.mobs.npcs.blacksmith.gold_1=嘿，人类！不想当个没用的废物，对吗？拿着这把镐子，给我挖_15块暗金矿_就够了。什么？要我如何报答你？真贪心……\n好吧，好吧，我没钱付给你，但我可以给你打打铁。想想你运气有多好吧，我可是这附近唯一的铁匠。
actors.mobs.npcs.blacksmith.gold_2=_暗金矿_。15块。说真的，有那么难？
actors.mobs.npcs.blacksmith.keeppickaxe=拿好这把镐子。它非常好用。
actors.mobs.npcs.blacksmith.completed=噢，你终于回来了……算了，总比回不来好。
actors.mobs.npcs.blacksmith.same_item=选择两个不同的物品，不能把同一件物品选两次！
actors.mobs.npcs.blacksmith.un_ided=我得知道拿什么干活，先把它们鉴定出来！
actors.mobs.npcs.blacksmith.cursed=我可不碰诅咒的东西！
actors.mobs.npcs.blacksmith.degraded=这就是垃圾，质量太差了！
actors.mobs.npcs.blacksmith.need_reinforced=这件物品承受不了那么高的升级，我没法帮你合成。
actors.mobs.npcs.blacksmith.cant_reforge=我不能重铸这些物品！
actors.mobs.npcs.blacksmith.triforce=你居然找到了这三个碎片！好吧，我把它们合在一起。

actors.mobs.npcs.blacksmith2.name=巨魔焊工
actors.mobs.npcs.blacksmith2.desc=这个巨魔焊工又高又瘦，皮肤的色泽和纹理都像石头。他正拿着一把与体形极不相称的电焊枪焊接着什么。
actors.mobs.npcs.blacksmith2.himself=和你看到的一样，我是那个顽固铁匠的弟弟。我认为科学技术也能帮巨魔谋生。带来对应的_精金组件_和_50枚暗金_，我就能给你一个惊喜。
actors.mobs.npcs.blacksmith2.adamantite=这种精金组件能让物品承受任意次数的强化。给我_50枚暗金_，我就能把它们焊接起来。
actors.mobs.npcs.blacksmith2.same_item=同一件东西可没法焊接！
actors.mobs.npcs.blacksmith2.un_ided=未知的东西我可没法处理！
actors.mobs.npcs.blacksmith2.cursed=诅咒的东西我可没法处理！
actors.mobs.npcs.blacksmith2.already_reforge=这件物品已经焊接过组件了！
actors.mobs.npcs.blacksmith2.degraded=负等级的东西我可没法处理！
actors.mobs.npcs.blacksmith2.cant_reforge=没法升级的东西我可没法处理！
actors.mobs.npcs.blacksmith2.cant_work=组件和物品不匹配，我可没法处理！
actors.mobs.npcs.blacksmith2.looks_better=你的%s现在可以承受任意次数的强化了。

actors.mobs.exbamboomob.name=竹子精
actors.mobs.exbamboomob.desc=竹子的进化体，向四周吸取其他生命能量。
actors.mobs.shielded.name=持盾豺狼
actors.mobs.shielded.desc=这个豺狼人带着一块盾牌。说真的它还是带把大剑强点。
actors.mobs.shielded.def_verb=格挡
actors.mobs.firesuccubus.name=魅魔
actors.mobs.firesuccubus.desc=魅魔是外表诱人(稍有某种哥特风格)的女性恶魔。通过使用魔法，魅魔可以魅惑英雄，使英雄在魅惑消退前无法攻击它。

actors.mobs.bombbug.name=霜石虫
actors.mobs.bombbug.desc=包裹着冰石的虫子。

actors.mobs.assassin.name=暗杀者
actors.mobs.assassin.desc=由天狗所训练出来的忍者之一，极其擅长远程攻击。

actors.mobs.bamboomob.name=竹子
actors.mobs.bamboomob.desc=监狱长养的奇怪植物。

actors.blobs.nmgas.desc=这里盘绕着纳米无人机云。除宿主外，所有吸入云雾的生物都会受到伤害。
actors.blobs.nmgas.rankings_desc=被纳米无人机云吞噬
actors.blobs.nmgas.ondeath=你被纳米无人机云吞噬了……
actors.blobs.curseweb.desc=这里布置着暗影咒丝。咒丝会诅咒踏入其中的生物。
actors.blobs.torchlight.desc=火把的光芒照亮了周围的环境。
actors.blobs.damageblobs.energyeffectdamage.desc=这片区域会持续造成能量伤害。
