actors.buffs.gasesimmunity.name=气体免疫
actors.buffs.gasesimmunity.desc=一种奇特的力量正在过滤你周边的空气。效果持续时，你免疫有害气体和天气。\n\n剩余时间：%s回合。
actors.buffs.delayprotect.name=延时保护
actors.buffs.delayprotect.desc=效果结束时获得一层玻璃保护。\n\n剩余时间：%s回合。

###blobs
actors.blobs.blizzard.name=暴雪
actors.blobs.blizzard.desc=这里刮起了一阵暴风雪。

actors.blobs.confusiongas.name=致眩气体
actors.blobs.confusiongas.desc=这里盘绕着一片致眩气体。

actors.blobs.electricity.name=电场
actors.blobs.electricity.desc=火花在这片电场中不断闪烁着。
actors.blobs.electricity.rankings_desc=触电
actors.blobs.electricity.ondeath=你因触电而亡...

actors.blobs.fire.name=火焰
actors.blobs.fire.desc=一团火焰正在这里肆虐。

actors.blobs.foliage.name=落叶
actors.blobs.foliage.desc=光柱刺破了地下花园中的黑暗。

actors.blobs.freezing.name=冰霜
actors.blobs.freezing.desc=这里的空气寒冷刺骨，很不寻常。

actors.blobs.goowarn.name=黑暗能量
actors.blobs.goowarn.desc=黑暗能量正在这里涌动！

actors.blobs.inferno.name=狱火
actors.blobs.inferno.desc=一阵狱火正在这里肆虐。

actors.blobs.paralyticgas.name=麻痹气体
actors.blobs.paralyticgas.desc=这里盘绕着一片麻痹气体。

actors.blobs.regrowth.name=草木再生

actors.blobs.sacrificialfire.name=献祭之火
actors.blobs.sacrificialfire.desc=这是一个承载着献祭之火的祭坛。在此殒命的生物都将成为献给地牢幽魂的祭品。\n\n或许献祭够多，就能得到回报？
actors.blobs.sacrificialfire.worthy=火焰吞噬了你的祭品，燃烧得愈加旺盛。
actors.blobs.sacrificialfire.unworthy=火焰吞噬了你的祭品，然而没有任何变化。
actors.blobs.sacrificialfire.reward=火焰骤然升腾，继而消散，并留下一份奖励！

actors.blobs.smokescreen.name=烟幕
actors.blobs.smokescreen.desc=这里翻腾着一团浓密的黑烟。

actors.blobs.stenchgas.name=腐臭气体
actors.blobs.stenchgas.desc=这里盘绕着一片腐烂的臭气。

actors.blobs.stormcloud.name=暴雨
actors.blobs.stormcloud.desc=这里盘绕着一片翻腾的水汽。

actors.blobs.toxicgas.name=毒气
actors.blobs.toxicgas.desc=这里盘绕着一片发绿的毒气。
actors.blobs.toxicgas.rankings_desc=窒息而死
actors.blobs.toxicgas.ondeath=你被毒气毒死了...
actors.blobs.venomgas.desc=这里盘绕着一片鲜彩毒雾。它具有强烈的腐蚀性，会不断侵蚀其中的生物。
actors.blobs.weather.weatherofdead.desc=这里怨念很重，小心亡灵出现！
actors.blobs.weather.weatherofquite.desc=这里异常安静，让人更容易集中精神。
actors.blobs.weather.weatherofrain.desc=这里下着小雨，会降低生物的命中和闪避。
actors.blobs.weather.weatherofsand.desc=这里飞扬着沙尘，会使生物干燥并降低伤害。
actors.blobs.weather.weatherofsnow.desc=这里降着小雪，会使生物寒冷并减缓移动。
actors.blobs.weather.weatherofsun.desc=这里阳光灼热，会使生物陷入炎热状态。

actors.blobs.corrosivegas.name=腐蚀酸雾
actors.blobs.corrosivegas.desc=这里盘绕着一片致命的腐蚀酸雾。

actors.blobs.waterofawareness.name=觉察之泉
actors.blobs.waterofawareness.procced=在你小酌一口时，你感觉到知识涌入了你的头脑。
actors.blobs.waterofawareness.desc=知识的力量正在从这口井的水里涌出。饮下井中的水将会鉴定所有已装备的物品、探测背包中所有物品的诅咒并揭示本层所有物品的位置。

actors.blobs.waterofhealth.name=生命之泉
actors.blobs.waterofhealth.procced=你小酌一口后，立刻感到所有伤口都痊愈了。
actors.blobs.waterofhealth.desc=生命的力量正在从这口井的水里涌出。饮下井中的水可以治疗伤口、解除饥饿并净化所有已装备物品的诅咒。

actors.blobs.wateroftransmutation.name=嬗变之泉
actors.blobs.wateroftransmutation.desc=变化的力量正在从这口井的水里涌出。\n扔进一个物品以将其转化为其他物品。

actors.blobs.web.name=蛛网
actors.blobs.web.desc=这里所有东西都被厚厚的蜘蛛网覆盖着。任何接触或丢向蛛网的东西都会打破它，但也都会被固定在原地。



###buffs
actors.buffs.adrenaline.name=激素涌动
actors.buffs.adrenaline.desc=由肾上腺素带来的纯粹的潜能爆发，激素涌动能够增强一名角色的移动和攻击速度。\n\n激素涌动允许角色拥有2倍的移动速度和1.5倍的攻击速度。\n\n激素涌动持续时间：%s回合

actors.buffs.adrenalinesurge.name=力量激发
actors.buffs.adrenalinesurge.desc=一股强大的力量，不过很可惜不是永久的。\n\n力量加成：+%d\n距离效果衰减还有：%s回合

actors.buffs.amok.name=狂乱
actors.buffs.amok.desc=狂乱会导致目标陷入极度愤怒和混乱的状态。\n\n狂乱的生物会不分敌我地攻击任何靠近它们的人。\n\n狂乱效果的剩余时长：%s回合

actors.buffs.arcanearmor.name=奥术护甲
actors.buffs.arcanearmor.desc=一层淡薄的护盾环绕着你，可为你抵挡一定的魔法伤害。\n\n当前你的魔法护甲为：0~%d\n\n距离奥术护甲衰减还有：%s回合

actors.buffs.artifactrecharge.name=神器充能
actors.buffs.artifactrecharge.desc=魔力在你体内奔腾而过，提高你手中神器的充能速率。\n\n每件神器受到的影响都不尽相同，但它们的充能速率都会大幅提升。\n\n神器充能剩余时长：%s回合

actors.buffs.ascensionchallenge.name=护符诡咒
actors.buffs.ascensionchallenge.desc=不知为何古神仍能借护符维系自己对这个世界的影响，祂正借此设法阻止你向上返程！\n\n古神运用祂的力量使你的敌人变得更为众多、强大，整座地牢也因此变得更危险了！所幸你可以通过击败古神所加强过的敌人来削弱他的力量，若是置之不理则只会使古神之力愈发强大。
actors.buffs.ascensionchallenge.desc_clear=护符中散发出的黑暗能量现今已被最大程度的削弱了。
actors.buffs.ascensionchallenge.desc_beckon=护符正在_呼唤远处的敌人_，向它们通告你的位置。
actors.buffs.ascensionchallenge.desc_haste=护符正在_为远处的敌人加速_，令它们得以更快接近你！
actors.buffs.ascensionchallenge.desc_slow=护符正在_使你减速_，并阻止了一切加速效果！
actors.buffs.ascensionchallenge.desc_damage=护符中涌动的黑暗能量已极为强大，它正在_直接对你造成伤害_！
actors.buffs.ascensionchallenge.beckon=护符开始呼唤远处的敌人前来。
actors.buffs.ascensionchallenge.haste=护符开始为周遭的敌人提升移速！
actors.buffs.ascensionchallenge.slow=你背包中的护符此刻恍如重逾千钧！
actors.buffs.ascensionchallenge.damage=护符开始释放黑暗能量。此物灼烫难忍！
actors.buffs.ascensionchallenge.weaken_info=护符的诅咒可通过击败更多敌人来削弱。
actors.buffs.ascensionchallenge.weaken_info_no_kills=如果你击败敌人，护符的诅咒就会被削弱！
actors.buffs.ascensionchallenge.weaken=你能感受到护符上的诅咒正缓慢地消退。
actors.buffs.ascensionchallenge.break=你稍作喘息，感受到身上的伤口开始愈合！
actors.buffs.ascensionchallenge.almost=你能感觉到古神对护符的掌控愈发微弱了起来，胜利的曙光已然在你面前！
actors.buffs.ascensionchallenge.on_kill=黑暗能量吞噬了你...

actors.buffs.barkskin.name=树肤
actors.buffs.barkskin.desc=你的皮肤硬化了，摸起来如同树皮般粗糙而坚固。\n\n硬化的皮肤增强了你的护甲，使你能更好地抵御物理攻击。\n\n当前增加的护甲：0~%d\n距离效果衰减还有：%s回合\n\n从多个来源获得树肤效果时，只有效果最强的那一个会起效。

actors.buffs.barrier.name=奥术屏障
actors.buffs.barrier.desc=一团可以抵挡全部伤害的能量屏障。\n\n只要奥术屏障的能量仍然存在，它将完全抵挡单位所受到的任何伤害。同时这种能量会随时间逐渐衰减。\n\n护盾能量剩余：%d

actors.buffs.berserk.angered=愤怒
actors.buffs.berserk.berserk=狂暴
actors.buffs.berserk.exhausted=力竭
actors.buffs.berserk.recovering=恢复
actors.buffs.berserk.angered_desc=狂战士受伤的严重程度会增强他的攻击。每当狂战士受到物理伤害时，他会积累怒气并获得额外伤害，被护甲格挡的伤害仍可作为怒气积累。\n\n怒气会随时间消逝，狂战士生命值越低，怒气留存时间越长。\n\n狂战士可以100%%的怒气进入狂暴，使他获得基于护甲等级与已损生命值的护盾。狂暴时，他的护盾会随时间衰减，而且其一旦耗尽则他必须稍作休息之后才能再次积累怒气。\n\n当前怒气：_%1$.0f%%_\n_+%2$.0f%%_伤害\n\n当前护甲与生命值的狂暴护盾：_%3$d_
actors.buffs.berserk.berserk_desc=恐惧与疑虑已然随流出的鲜血一齐消散，此身惟余满腔怒火。在这种狂暴状态下，狂战士将无比强大，_造成50%%额外伤害并获得额外护盾_，但每回合都会损失部分护盾。\n\n当其所有护盾归零时，狂暴将会结束。\n\n狂暴过后，狂战士需要稍作休息才能再次积累怒气。\n\n剩余护盾值：%d
actors.buffs.berserk.recovering_desc=内在潜力是有限的。狂战士必须充分休息才能再次释放他的怒火。\n\n恢复状态下的狂战士无法从伤痛中积累怒气。
actors.buffs.berserk.recovering_desc_turns=恢复所需回合数：%d
actors.buffs.berserk.recovering_desc_levels=恢复所需等级：%.2f
actors.buffs.berserk.rankings_desc=暴走至死
actors.buffs.berserk.action_name=狂暴
actors.buffs.berserk.no_seal=你需要破损纹章才能进入狂暴！

actors.buffs.bleeding.name=流血
actors.buffs.bleeding.ondeath=你因失血过多而死...
actors.buffs.bleeding.heromsg=你正在流血！
actors.buffs.bleeding.rankings_desc=流血致死
actors.buffs.bleeding.desc=伤口正在令人不安地涌出大量血液。\n\n流血每回合都会造成伤害。每回合这个伤害数值都会随机减少，直到出血最终停止。\n\n当前流血伤害：%d

actors.buffs.bless.name=赐福
actors.buffs.bless.desc=你的集中力正在喷薄而出，有人说这是神赐的礼物。\n\n赐福状态能够提高自己25%%的精准与闪避属性，使被赐福者在战斗中势如破竹。\n\n赐福效果剩余时长：%s回合

actors.buffs.blindness.name=失明
actors.buffs.blindness.heromsg=你失明了！
actors.buffs.blindness.desc=失明使周遭的一切陷入黑暗。\n\n失明时，单位的视距被减少至一格，致使远程攻击难堪大用，并使其很容易失去对远处敌人的追踪。此外，失明的英雄无法阅读卷轴或书籍。\n\n失明效果剩余时长：%s回合

actors.buffs.buff.heromsg=

actors.buffs.burning.name=燃烧
actors.buffs.burning.heromsg=你着火了！
actors.buffs.burning.burnsup=%s被烧毁了！
actors.buffs.burning.ondeath=你被燃烧至死...
actors.buffs.burning.rankings_desc=燃烧殆尽
actors.buffs.burning.desc=没什么比被火焰吞没更痛苦了。\n\n火焰每回合都会造成伤害，直到它被液体扑灭或者自行消散。火会在你进入水中时熄灭，打碎药瓶产生的水花也具有同样的效果。\n\n此外，火焰还会点燃所有接触到的可燃地形与可燃物。\n\n燃烧效果剩余时长：%s回合

actors.buffs.championenemy.warn=你感受到了强敌的气场。
actors.buffs.championenemy$blazing.name=烈焰精英
actors.buffs.championenemy$blazing.desc=烈焰精英造成25%额外近战伤害，会点燃攻击目标，免疫火焰，且会在死亡时引燃周遭。不过，它们的火焰无法向水上蔓延。
actors.buffs.championenemy$projecting.name=索敌精英
actors.buffs.championenemy$projecting.desc=索敌精英拥有25%额外近战伤害，且拥有额外的3格近战攻击距离。
actors.buffs.championenemy$antimagic.name=敌法精英
actors.buffs.championenemy$antimagic.desc=敌法精英拥有50%的伤害减免，且完全免疫所有魔法效果。
actors.buffs.championenemy$giant.name=巨型精英
actors.buffs.championenemy$giant.desc=巨型精英拥有80%的伤害减免与额外的1格近战攻击距离，但无法进入狭窄的空间。
actors.buffs.championenemy$blessed.name=天佑精英
actors.buffs.championenemy$blessed.desc=天佑精英拥有4倍精准与闪避。
actors.buffs.championenemy$growing.name=成长精英
actors.buffs.championenemy$growing.desc=成长精英可额外获得稳定增长的精准、闪避、物理伤害与伤害减免。\n\n当前精准/闪避/伤害加成：%1$d%%\n当前伤害减免：%2$d%%

actors.buffs.charm.name=魅惑
actors.buffs.charm.heromsg=你被魅惑了！
actors.buffs.charm.cant_attack=你被目标敌人魅惑了，因此无法对其发起攻击。
actors.buffs.charm.desc=魅惑是一种能让一对夙敌暂时陷入互相倾慕的控制类魔法。\n\n被魅惑的单位将无法对魅惑施行者进行直接攻击，但依然可以攻击其他敌人。伤痛会激醒被魅惑单位，减少魅惑状态的持续时间。\n\n魅惑效果剩余时间：%s回合

actors.buffs.chill.name=冻伤
actors.buffs.chill.freezes=%s冻住了！
actors.buffs.chill.desc=还没有完全冻住，不过已经非常冷了。\n\n冻伤的目标所有行动都会更加缓慢，减速程度取决于剩余的冻伤效果时间。最严重的冻伤情况等同于迟缓效果。\n\n冻伤效果剩余时长：%1$s回合\n当前减少的速度：%2$s%%

actors.buffs.combo.name=连击
actors.buffs.combo.action_name=连击
actors.buffs.combo.combo=%d连击！
actors.buffs.combo.bad_target=你的目标必须是攻击距离以内的敌人。
actors.buffs.combo.prompt=选择一个攻击目标
actors.buffs.combo.desc=角斗士在成功击中对手时会积累战斗气势。每次攻击命中都会增加1次连击，但长时间不进行攻击，连击数就会归零。只要角斗士仍在积攒连击，其破碎纹章提供的护盾就不会衰减。\n积攒连击可以激活必定命中的连击战技！当连击数到达2、4、6、8、10时可分别激活不同的连击战技。部分连击战技会重置连击数，部分则不会，但每种连击战技在每次连击中只能使用一次。\n\n当前连击：%1$d\n\n连击归零剩余回合：%2$s
actors.buffs.combo$combomove.clobber.name=冲击
actors.buffs.combo$combomove.clobber.desc=将一名敌人击退2格，但不造成伤害，也不能将其击落深渊。提升1点连击数。
actors.buffs.combo$combomove.clobber.empower_desc=将一名敌人_击退3格，施加眩晕，并且可以将其击落深渊_，但不造成伤害。提升1点连击数。
actors.buffs.combo$combomove.slam.name=撞击
actors.buffs.combo$combomove.slam.desc=造成等同于自身防御%d%%(连击数x20%%)的额外伤害。使用后重置连击数。
actors.buffs.combo$combomove.slam.empower_desc=_跳跃最多%1$d格以接近目标_，并对其造成等同于自身防御%2$d%%(连击数x20%%)的额外伤害。使用后重置连击数。
actors.buffs.combo$combomove.parry.name=招架
actors.buffs.combo$combomove.parry.desc=使用后，招架下一回合内受到的首次攻击，并立即进行反击。若未触发招架，则重置连击数。
actors.buffs.combo$combomove.parry.empower_desc=使用后，招架下一回合内受到的_所有攻击_，并立即进行反击。若未触发招架，则重置连击数。
actors.buffs.combo$combomove.crush.name=横扫
actors.buffs.combo$combomove.crush.desc=对目标造成%d%%(连击数x25%%)的伤害，并对7x7范围内的其它敌人造成一半伤害。使用后重置连击数。
actors.buffs.combo$combomove.crush.empower_desc=_跳跃最多%1$d格以接近目标_，对主要目标造成%2$d%%（连击数x25%%）的伤害，并对7x7范围内的其它敌人造成一半伤害。使用后重置连击数。
actors.buffs.combo$combomove.fury.name=暴雨
actors.buffs.combo$combomove.fury.desc=你每有1点连击数便对一个敌人攻击一次，每次攻击造成60%伤害，并可触发武器附魔。使用后重置连击数。
actors.buffs.combo$combomove.fury.empower_desc=_跳跃最多%d格以接近目标_，并根据你当前的连击数对敌人发动同等次数的攻击，每次攻击造成60%%的伤害并可触发附魔效果。使用后重置连击数。

actors.buffs.corruption.name=腐化
actors.buffs.corruption.desc=腐化魔法会侵入生物体的生命本质，扭转他们原有的天性。\n\n被腐化的生物会攻击他们的盟友，还会忽视其原先的敌人。腐化效果同时也是有伤害性的，会导致其目标缓慢走向死亡。\n\n腐化是永久性的，死后才能解脱。

actors.buffs.cripple.name=残废
actors.buffs.cripple.heromsg=你残废了！
actors.buffs.cripple.desc=你很确定自己的腿不该折成那样。\n\n残废会减半移动速度，移动一格会消耗二回合而不是正常情况下的一回合。\n\n残废效果剩余时长：%s回合

actors.buffs.daze.name=恍惚
actors.buffs.daze.heromsg=你感到头晕目眩！
actors.buffs.daze.desc=耳畔嗡鸣，视野模糊，战斗因此变得十分困难。\n\n在恍惚状态下，精准和闪避都会减少50%%，使得命中和躲避都变得更加困难。\n\n剩余回合数：%s

actors.buffs.degrade.name=降级
actors.buffs.degrade.heromsg=你的装备被暂时弱化了！
actors.buffs.degrade.desc=强大的黑暗魔法正在吞噬升级卷轴注入你装备的魔力！\n\n降级状态下的装备会被视作比起原有等级更低的状态。_超过3级的每次升级都会遭受愈加严重的反噬。_物品的描述也会根据降级的影响而改变。\n\n不过，降级不会影响装备的力量需求，法杖充能，投武耐久以及神器。\n\n降级效果剩余时长：%s回合\n\n使用一张升级卷轴或祛邪卷轴可以立即驱散这种黑暗魔法。

actors.buffs.doom.name=定命
actors.buffs.doom.desc=当整个宇宙都看起来想置你于死地时，继续斗争还有什么意义呢？\n\n被定命的角色受到的任何伤害都会提升67%。\n\n定命是永久性的，死后才能解脱。

actors.buffs.dread.name=魂飞魄散
actors.buffs.dread.desc=令人魂飞魄散的恐慌正在驱使目标尝试逃出这座地牢！\n\n魂飞魄散状态下的生物将快速逃离它们的敌人，并且会在脱离敌人视野后立即消失在整座地牢中。逃离的敌人不会掉落道具，只会给予玩家减半的经验值奖励。伤害所造成的痛楚将促使其镇定下来。\n\n魂飞魄散效果剩余时长：%d回合

actors.buffs.drowsy.name=催眠
actors.buffs.drowsy.desc=一股魔法力量使目标很难保持清醒，几个回合后，目标将会深陷魔法睡眠。\n\n对于英雄，若在本应睡着的那一回合为满生命值或在这个过程中受到了伤害，魔法睡眠则不会生效。\n\n入睡所需回合数：%s回合

actors.buffs.earthimbue.name=大地之力
actors.buffs.earthimbue.desc=你被灌注了大地的力量！\n\n直到该效果结束前，你所有的物理攻击都会使敌人脚下的地面发生变化，使它们残废一段时间。\n\n大地之力剩余时长：%s回合

actors.buffs.enhancedrings.name=戒指强化
actors.buffs.enhancedrings.desc=盗贼在使用神器时强化了他的戒指，使它们获得+1升级。\n\n剩余回合数：%s

actors.buffs.fireimbue.name=烈焰之力
actors.buffs.fireimbue.desc=你被灌注了烈焰的力量！\n\n所有物理攻击都有机会使敌人燃烧。与此同时你对火焰完全免疫。\n\n烈焰之力剩余时长：%s回合

actors.buffs.foresight.name=危险预知
actors.buffs.foresight.desc=不知为何，你的脑海中映射出了周遭的地形。\n\n危险预知状态持续时，你周遭大范围的地格都会被揭示，包括隐藏门与陷阱。\n\n危险预知效果剩余时长：%s回合

actors.buffs.frost.name=冻结
actors.buffs.frost.freezes=%s冻住了！
actors.buffs.frost.desc=不要与冻成冰雕混淆，这种温和的冰冻只是把目标包裹在冰里。\n\n冻结效果类似于麻痹，使目标不能行动。与麻痹不同的是，冻结效果会在目标受到伤害时立即消失，因为冰会碎。\n\n剩余的冻结效果时长：%s回合

actors.buffs.frostimbue.name=寒霜之力
actors.buffs.frostimbue.desc=你被灌注了寒霜的力量！\n\n所有的物理攻击都会在敌人身上累加冻伤效果。与此同时你对寒冷完全免疫。\n\n寒霜之力剩余时长：%s回合

actors.buffs.fury.name=愤怒
actors.buffs.fury.heromsg=你陷入了暴怒之中！
actors.buffs.fury.desc=你非常暴怒，很明显敌人并不喜欢这样的你。\n\n一股猛烈的怒火在你体内燃烧，增加你50%%的物理攻击伤害。\n\n只要你的生命还低于上限的50%%，该效果就会存在。

actors.buffs.blobimmunity.name=净化屏障
actors.buffs.blobimmunity.desc=一种奇怪的能量环绕在你的周围，为你阻挡有害的环境效果。\n\n在净化屏障的持续时间内，你将免疫所有负面环境效果。\n\n免疫效果剩余时长：%s回合

actors.buffs.gravitychaostracker.name=重力混乱
actors.buffs.gravitychaostracker.desc_intro=每经几回合，当前楼层的所有单位都会被抛向某个随机方向。
actors.buffs.gravitychaostracker.desc_positive=然而你和你的盟友似乎对此免疫。
actors.buffs.gravitychaostracker.desc_duration=重力混乱会持续多久不得而知，但其不会一直持续下去。

actors.buffs.greaterhaste.name=飞影
actors.buffs.greaterhaste.desc=惊人的速度加成效果使得一切都好像在此刻静止了。\n\n在飞影的效果下，移动完全不消耗回合，但其它行动的速度仍旧。每一格移动都会消耗一回合飞影。\n\n飞影剩余回合数：%d

actors.buffs.haste.name=极速
actors.buffs.speedup.name=加速
actors.buffs.speedup.desc=你的移动和行动速度提升了50%%。\n\n加速效果剩余时长：%s回合
actors.buffs.haste.desc=强大的能量灌入到你的双腿肌肉上，允许你以不可思议的速度移动！\n\n在极速状态下，你将拥有3倍的移动速度，但是其他行动速度仍然和原来一样。\n\n极速效果剩余时长：%s回合

actors.buffs.healing.name=治疗
actors.buffs.healing.desc=一股治愈魔力让你的伤口开始愈合。\n\n你的生命将逐回合稳定回复，直到治疗效果终止。治疗量将随着时间逐渐减少。\n\n下一回合治疗量：%d\n\n剩余治疗量：%d。

actors.buffs.herodisguise.name=伪装
actors.buffs.herodisguise.desc=幻术魔法改变了你的外貌！虽然此效果是完全装饰性的，但无论如何感觉起来还是很奇怪。\n\n伪装效果剩余时长：%s回合

actors.buffs.hex.name=幻惑
actors.buffs.hex.heromsg=你的精神受到了魔法的干扰！
actors.buffs.hex.desc=干扰集中力的黑暗魔法，使目标无法准确地判断方位。\n\n幻惑状态会降低目标20%%的精准与闪避属性，使其在战斗中更容易处于下风。\n\n幻惑效果剩余时长：%s回合

actors.buffs.holdfast.name=不动如山
actors.buffs.holdfast.desc=战士正在据守此处，提升其%1$d~%2$d点护甲并将连击与护盾的衰减速度减缓%3$d%%，直至他移动为止。

actors.buffs.hunger.hungry=饥饿
actors.buffs.hunger.starving=极度饥饿
actors.buffs.hunger.onhungry=你有点饿了。
actors.buffs.hunger.onstarving=你已经饥肠辘辘！
actors.buffs.hunger.ondeath=你活活饿死了...
actors.buffs.hunger.cursedhorn=就在你吃东西的时候被诅咒的号角偷走了一部分食物的能量。
actors.buffs.hunger.rankings_desc=饥饿致死
actors.buffs.hunger.desc_intro_hungry=你能感受到自己的肚子在不断寻求食物，不过还不算那么严重。
actors.buffs.hunger.desc_intro_starving=你的饥饿程度已经危及生命了。
actors.buffs.hunger.desc=\n\n饥饿会在你在地牢里花费时间的同时缓慢累计，直到你饿得难以忍受。在你极度饥饿时生命值会停止回复并且开始缓慢减少。\n\n合理利用食物非常重要！如果你有足够的生命值来维持饥饿，你就该等到一会儿食物更多的时候再吃。正确的配给可以让食物更有效地发挥作用！

actors.buffs.invisibility.name=隐形
actors.buffs.invisibility.desc=你和周围的地形完全融为一体，使你不可能被看到。\n\n当你在隐形时敌人无法追踪或攻击你。大部分物理攻击和魔法(比如卷轴和法杖)会立即解除隐形效果。\n\n隐形效果剩余时长：%s回合

actors.buffs.invulnerability.name=无敌
actors.buffs.invulnerability.desc=这个单位充满了金刚不坏之力，获得了短暂的无敌效果！\n\n剩余回合数：%s回合

actors.buffs.levitation.name=飘浮
actors.buffs.levitation.desc=一股魔力把你从地面托起，让你觉得自己身轻如燕。\n\n飘浮中的角色能够悄无声息地移动，并会无视所有以地面为基础的效果。陷阱不会被触发、火焰不会被水扑灭、植物不会被踩踏、根系无法缠绕你、并且深渊能被跨越。小心，在效果结束时上述效果都会失效！\n\n飘浮效果剩余时长：%s回合

actors.buffs.lifelink.name=生命联结
actors.buffs.lifelink.ondeath=你因生命联结的共享伤害而亡...
actors.buffs.lifelink.desc=该单位的生命力与附近的另一个单位相连。双方会共同承担所有所受伤害。\n\n每当该单位受伤时，半数伤害会转移到与该单位有生命联结的单位上。\n\n生命联结剩余回合数：%s

actors.buffs.light.name=发光
actors.buffs.light.desc=即使是在最黑暗的地牢中，身边有一个稳定的光源也总是令人欣慰。 \n\n光照能驱散黑暗，使你能够无视周遭的黑暗环境并拥有一个合理的视野范围。 \n\n发光效果剩余时长：%s回合

actors.buffs.lockedfloor.name=背水一战
actors.buffs.lockedfloor.desc=当前楼层被彻底封锁，你无法离开这里！\n\n封锁持续期间，你不会更加饥饿，或因极度饥饿减少生命值。此外，如果你没有在与Boss战斗，所有的被动回复都会停止。\n\n另外，如果你在楼层封锁时被未祝福的重生十字架复活了，封锁效果将被重置。\n\n击杀本层Boss以解除封锁。

actors.buffs.lostinventory.name=遗落行囊
actors.buffs.lostinventory.desc=你的行囊被遗落在了地牢中的某处！\n在找回你的行囊之前，你将无法拾起或使用绝大多数道具。

actors.buffs.magicalsight.name=魔能透视
actors.buffs.magicalsight.desc=不知为何，即使闭上眼睛你也可以用心灵洞察到周围发生的一切。\n\n当处于魔能透视状态时，你的视线将透过墙体与地形，并且视距的半径也会扩展为 12 格。\n\n魔能透视剩余时长：%s 回合

actors.buffs.magicalsleep.name=魔法睡眠
actors.buffs.magicalsleep.toohealthy=你十分健康，因此抵抗住了强烈的嗜睡感。
actors.buffs.magicalsleep.fallasleep=你深深地陷入了魔法睡眠。
actors.buffs.magicalsleep.wakeup=你醒来后，感觉浑身清爽并且十分健康。
actors.buffs.magicalsleep.desc=目标已深深陷入了魔法睡眠，不会自然醒来。\n\n魔法睡眠与一般的睡眠基本一样，但只有受伤会致使目标醒来。\n\n对于英雄和他们的盟友，魔法睡眠有一些恢复性的效果，使他们能够在睡眠中迅速愈合伤口。

actors.buffs.magicimmune.name=魔法免疫
actors.buffs.magicimmune.desc=任何魔法都奈何不了你，你对魔法完全免疫。\n\n在魔法免疫状态下，所有魔法效果无论益害都无法影响你，包括但不限于诅咒、附魔、刻印、法杖、卷轴、戒指、神器等。但英雄护甲的能力足够强大，能够不受这种效果影响，正常发挥作用。\n\n魔法免疫剩余时长：%s回合

actors.buffs.mindvision.name=灵视
actors.buffs.mindvision.desc=你可以在脑海中以某种方式看到这一层的所有生物。这种感觉非常奇异。\n\n只要灵视效果依然存在，这层的所有生物都会在你的视野当中。通过灵视看到的生物同样算作视野中的目标，可以被很多魔法效果影响。\n\n灵视效果剩余时长：%s回合

actors.buffs.momentum.momentum=动量积蓄
actors.buffs.momentum.running=逸动
actors.buffs.momentum.resting=恢复
actors.buffs.momentum.action_name=逸动
actors.buffs.momentum.momentum_desc=移动的时候，疾行者会逐渐积蓄动量。疾行者可以消耗动量以开启逸动状态。\n\n每一点动量可以支持两个回合的逸动，最多可以储存10点动量。当疾行者停止移动时动量会快速消散。\n\n现存的动量：%d
actors.buffs.momentum.running_desc=移动的时候，疾行者会逐渐积蓄动量。疾行者可以消耗动量以开启逸动状态。\n\n处于逸动状态时，疾行者能够以两倍速移动，并且基于自身等级获得额外的闪避属性。\n\n效果剩余时长：%d回合
actors.buffs.momentum.resting_desc=移动的时候，疾行者会逐渐积蓄动量。疾行者可以消耗动量以开启逸动状态。\n\n疾行者现在需要休息一会恢复体力才能重新积蓄动量。\n\n还需要休息%d回合。

actors.buffs.monkenergy.name=内力
actors.buffs.monkenergy.action=武功
actors.buffs.monkenergy.desc=每当武僧击败一个敌人，她都会获得可用于施展多门武功的内力。击败大多数种类的敌人时只会获得1点内力，并且武僧不会随时间流失内力。\n\n现有内力：%1$d/%2$d
actors.buffs.monkenergy.desc_cooldown=武僧刚刚才施展过一次武功，再次施展前必须等待。\n\n剩余冷却时间：%d回合
actors.buffs.monkenergy$monkability$flurry.name=空振
actors.buffs.monkenergy$monkability$flurry.desc=两次不耗回合的攻击，每次造成%1$d~%2$d点伤害并且忽略护甲。这门武功不能被重复使用。
actors.buffs.monkenergy$monkability$flurry.empower_desc=两次不耗回合的攻击，每次造成%1$d~%2$d点伤害，_可触发武器上的附魔_并且忽略护甲。如果武僧刚刚成功命中过敌人，这门武功不能被重复使用。
actors.buffs.monkenergy$monkability$focus.name=凝神
actors.buffs.monkenergy$monkability$focus.desc=武僧消耗一回合来进入凝神状态，招架下一次受到的攻击。
actors.buffs.monkenergy$monkability$focus.empower_desc=武僧_立即进入凝神状态_，招架下一次受到的攻击。
actors.buffs.monkenergy$monkability$focus$focusbuff.name=凝神
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=武僧正专注于她周遭的一切，可以预料到对她发起的下一次攻击。当处于凝神状态时，她将必定招架下一次来袭的攻击。
actors.buffs.monkenergy$monkability$dash.name=登云
actors.buffs.monkenergy$monkability$dash.prompt=选择一个地点
actors.buffs.monkenergy$monkability$dash.desc=立刻冲向一个最多4格远的位置。这一武功可以越过危险地形，但不能穿过敌人或者坚实墙壁。
actors.buffs.monkenergy$monkability$dash.empower_desc=立刻冲向一个最多_8格_远的位置。这一武功可以越过危险地形，但不能穿过敌人或者坚实墙壁。
actors.buffs.monkenergy$monkability$dragonkick.name=盘龙
actors.buffs.monkenergy$monkability$dragonkick.desc=一次致命的踢击，造成%1$d~%2$d点伤害，无视护甲，并将敌人击退，还会对敌人施加与击退距离相等回合数的麻痹。
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=一次致命的踢击，造成_%1$d~%2$d点伤害_，无视护甲，并将_所有邻近目标_击退，还会对敌人施加与击退距离相等回合数的麻痹。
actors.buffs.monkenergy$monkability$meditate.name=冥思
actors.buffs.monkenergy$monkability$meditate.desc=武僧消耗5回合来运转内力，将大部分的负面效果逼出体外，并获得8回合的法杖和神器充能。
actors.buffs.monkenergy$monkability$meditate.empower_desc=武僧消耗5回合来运转内力，将大部分的负面效果逼出体外，并获得8回合的法杖和神器充能。_冥思期间还会获得80%伤害抗性，并缓慢恢复共20%已损失生命值。_

actors.buffs.ooze.name=腐蚀淤泥
actors.buffs.ooze.heromsg=淤泥在腐蚀你的身体。洗掉它！
actors.buffs.ooze.ondeath=你被彻底融化掉了...
actors.buffs.ooze.rankings_desc=被溶解
actors.buffs.ooze.desc=这种粘稠的酸性淤泥正在紧贴你的骨肉，并缓慢地将它们腐蚀融化。\n\n腐蚀淤泥会对受害者持续造成伤害，不过能够立刻在水中洗掉。\n\n腐蚀淤泥剩余时长：%s回合

actors.buffs.paralysis.name=麻痹
actors.buffs.paralysis.heromsg=你被麻痹了！
actors.buffs.paralysis.out=解脱麻痹
actors.buffs.paralysis.desc=通常最坏的事就是什么事都做不出来。\n\n麻痹会制止目标的一切行动，迫使目标静等到效果消失。受伤导致的疼痛也有助于目标摆脱麻痹。\n\n麻痹效果剩余时长：%s回合

actors.buffs.physicalempower.name=体能增幅
actors.buffs.physicalempower.desc=你的攻击已被强化，接下来的几次物理攻击击中敌人时将会造成额外伤害。\n\n额外伤害：%1$d\n剩余次数：%2$d

actors.buffs.pincushion.name=中矢
actors.buffs.pincushion.desc=你击中这个角色的投掷武器正卡在他们身上，打败他们后投掷武器将会掉在地上。\n\n被卡住的物品如下：

actors.buffs.poison.name=中毒
actors.buffs.poison.heromsg=你中毒了！
actors.buffs.poison.ondeath=你被毒死了...
actors.buffs.poison.rankings_desc=毒发身亡
actors.buffs.poison.desc=毒素传遍全身，缓慢地损伤着各个脏器。\n\n毒素每回合造成的伤害与其剩余的回合数成正比。\n\n中毒效果剩余时长：%s回合
actors.buffs.venom.name=剧毒
actors.buffs.venom.desc=剧毒在体内滞留得越久，造成的伤害就越高。\n\n剧毒效果剩余：%1$s回合。\n当前剧毒伤害：%2$d。
actors.buffs.cold.name=寒冷
actors.buffs.cold.desc=寒冷会减缓你的移动。\n\n剩余效果时长：%s回合。
actors.buffs.deadraise.name=怨念环绕
actors.buffs.deadraise.desc=你感觉身边充满了强烈的怨念，仿佛有什么东西即将出现。\n\n剩余效果时长：%s回合。
actors.buffs.itemsteal.name=物品盗取
actors.buffs.itemsteal.desc=你的下一次成功攻击会从目标身上盗取一件物品。\n\n剩余效果时长：%s回合。

actors.buffs.preparation.name=准备阶段
actors.buffs.preparation.action_name=蓄意打击
actors.buffs.preparation.desc=刺客正耐心地等待着，准备从暗影中给出致命一击。
actors.buffs.preparation.desc_dmg=他的下一次攻击会造成_%1$d%%的额外伤害_，并斩杀生命低于_%2$d%%_的普通敌人，或生命低于_%3$d%%_的Boss。
actors.buffs.preparation.desc_dmg_likely=这一击也更有可能造成偏高的伤害。
actors.buffs.preparation.desc_blink=他可以瞬间冲刺到敌人身边再攻击，最大冲刺距离为%d格。
actors.buffs.preparation.desc_invis_time=刺客已经隐形了_%d_回合。
actors.buffs.preparation.desc_invis_next=这一击在_%d_回合后会变得更强。
actors.buffs.preparation.prompt=选择一个攻击的目标！\n最大冲刺距离：%d格
actors.buffs.preparation.no_target=这里没有可攻击的目标。
actors.buffs.preparation.out_of_reach=你无法冲刺到目标距离。
actors.buffs.preparation.assassinated=斩杀

actors.buffs.prismaticguard.name=虹光守卫
actors.buffs.prismaticguard.desc=你正在被一个目前看不见的虹光守卫所保护。当有敌人出现时这个虹光守卫将出现并为你战斗！\n\n当虹光守卫未激活时，它将逐渐恢复所有所受到的伤害。\n\n当前生命值：%d/%d
actors.buffs.prismaticguard.desc_many=该虹光幻像已被万物一心强化。剩余回合数：%d

actors.buffs.recharging.name=充能
actors.buffs.recharging.desc=魔力在你体内奔腾而过，提高你的法杖与魔杖的充能速率。\n\n此效果将会在正常充能速率的基础上每回合为你额外回复0.25点法杖充能。\n\n充能效果剩余时长：%s回合

actors.buffs.revealedarea.name=区域揭示
actors.buffs.revealedarea.desc=揭示地牢中一片区域的视野，无论你身处这层中的何处都能对那里一览无遗。\n\n效果剩余时长：%s回合

actors.buffs.revealedchar.name=已揭示
actors.buffs.revealedchar.desc=这个单位已被揭示，无论它在哪里都将是可见的。\n\n效果剩余时长：%s回合。

actors.buffs.roots.name=缠绕
actors.buffs.roots.heromsg=你不能移动了！
actors.buffs.roots.desc=一些根系(不论是自然或魔法产生)缠到了脚上，牢牢将其缚在地面。\n\n根系会让目标被困在当前区域，使其不能移动或使用大部分移动技能。其他行动不受干扰，包括传送效果。\n\n缠绕效果剩余时长：%s回合

actors.buffs.scrollempower.name=卷轴赋能
actors.buffs.scrollempower.desc=法师阅读卷轴时产生的能量会暂时强化他的法杖！\n\n法杖强化：+%1$d级\n剩余有效施法次数：%2$d

actors.buffs.shadows.name=暗影融合
actors.buffs.shadows.desc=你和周围的阴影融为一体，使你隐形并减缓你的新陈代谢。\n\n当你在隐形时敌人无法追踪或攻击你。大部分物理攻击和魔法(比如卷轴和法杖)会立即解除隐形效果。此外，当你处于暗影融合状态下时，饥饿值增加的速率会降低。\n\n暗影融合状态会一直持续直到你离开阴影或与敌人直接接触。

actors.buffs.slow.name=迟缓
actors.buffs.slow.desc=减速魔法影响了目标的时间流速，在目标眼中所有的事物都移动得飞快。\n\n迟缓下的角色执行所有行动花费的时间是正常状态下的两倍。\n\n迟缓效果剩余时长：%s回合

actors.buffs.snipersmark.name=狙击标记
actors.buffs.snipersmark.action_name_snapshot=速射
actors.buffs.snipersmark.action_name_volley=连射
actors.buffs.snipersmark.action_name_sniper=狙杀
actors.buffs.snipersmark.desc=狙击手专注于最近射击的目标。她能够用灵能弓进行一次特殊攻击，攻击方式取决于弓的强化方式。\n\n未被强化的弓可以施展_速射_，进行一次低伤害但不消耗回合的射击。\n\n强化速度的弓可以施展三箭_连射_。每支箭矢伤害虽低，但仍能触发附魔效果。连射消耗1回合。\n\n强化伤害的弓可以施展_狙杀_。这支箭矢必定命中，根据目标距离造成额外伤害。狙杀消耗2回合。\n\n效果剩余时长：%s回合

actors.buffs.soulmark.name=灵魂标记
actors.buffs.soulmark.desc=术士已经击穿了目标的灵魂。其在受到物理伤害时将会恢复术士的生命。\n\n灵魂标记剩余时长：%s回合

actors.buffs.stamina.name=体力充沛
actors.buffs.stamina.desc=你感受到了体内无尽的精力，让你可以以更快的速度移动！\n\n当你处于体力充沛状态下你的移动速度将提升50%%，但是此效果不影响其他行动的耗时。\n\n体力充沛剩余时长：%s回合

actors.buffs.swarminteltracker.name=集群智能
actors.buffs.swarminteltracker.desc=集群智能会使敌人在发现你或你的盟友时吸引其他敌人至你所在的位置。\n\n集群智能的吸引距离是有限的，但你暴露于敌方视野中越久，此吸引距离成长的就越多，直到达到12格的上限。即使是一瞬的视野阻断也可以重置吸引范围。\n\n当前最大吸引距离：%d格

actors.buffs.vulnerable.name=易伤
actors.buffs.vulnerable.heromsg=你感到外界的伤害愈加疼痛！
actors.buffs.vulnerable.desc=易伤魔法会使得目标受到所有被护甲减免过的物理伤害增加33%%。\n\n易伤效果剩余时长：%s回合

actors.buffs.terror.name=恐惧
actors.buffs.terror.desc=恐惧是使敌人陷入不可控制的恐慌的操纵性魔法。\n\n恐惧中的角色会远离自己的敌人，试图和敌人隔开尽可能多的门或墙。然而疼痛的刺激会减少恐惧的持续时间。\n\n恐惧效果剩余时长：%s

actors.buffs.toxicimbue.name=毒素之力
actors.buffs.toxicimbue.desc=你被灌注了毒素的力量！\n\n在你移动时毒气会从你的身体中翻腾而出，伤害你的敌人。持续期间，甚至直到效果结束后的数回合内，你都免疫毒气和中毒效果。\n\n毒素之力剩余时长：%s回合

actors.buffs.corrosion.name=酸蚀
actors.buffs.corrosion.heromsg=你正在被强酸溶解！
actors.buffs.corrosion.ondeath=你被彻底溶解掉了...
actors.buffs.corrosion.rankings_desc=被溶解
actors.buffs.corrosion.desc=强酸能以惊人的速度腐蚀掉血肉、金属和骨头。\n\n目标被腐蚀的时间越长，酸蚀伤害越高。\n\n酸蚀效果剩余时长：%1$s回合\n当前酸蚀伤害：%2$d

actors.buffs.vertigo.name=眩晕
actors.buffs.vertigo.desc=如果整个世界都在旋转的话，想走直线会变得十分困难。 \n\n眩晕效果持续时，目标的移动将会向一个随机区域进行，而不是目标原本想到达的地方。\n\n眩晕效果剩余时长：%s回合

actors.buffs.wandempower.name=盈能法杖
actors.buffs.wandempower.desc=你的伤害型法杖已被强化，接下来的几次攻击会造成额外伤害。\n\n额外伤害：%1$d\n剩余攻击次数：%2$d

actors.buffs.weakness.name=虚弱
actors.buffs.weakness.heromsg=你感到力量正在被抽走！
actors.buffs.weakness.desc=你感觉自己的装备突然变得沉重起来。\n\n虚弱魔法会减弱角色的肉体力量，使其造成的伤害减少33%%。\n\n虚弱效果剩余时长：%s回合

actors.buffs.wellfed.name=饱腹
actors.buffs.wellfed.desc=你感觉自己吃的非常饱。\n\n当你处于饱腹状态时，你的饥饿值不会增加，并且会随着时间的推移恢复额外的生命值。\n\n状态剩余时长：%d回合



###hero

##abilities
actors.hero.abilities.armorability.self_target=你不能瞄准你自己！
actors.hero.abilities.armorability.no_target=这里没有任何目标！
actors.hero.abilities.armorability.prompt=选择释放能力的位置
actors.hero.abilities.armorability.cost=充能消耗：_%d_

actors.hero.abilities.warrior.heroicleap.name=英勇之跃
actors.hero.abilities.warrior.heroicleap.prompt=选择要飞跃到的地方
actors.hero.abilities.warrior.heroicleap.short_desc=战士能向指定地点使用_英勇之跃_，越过所有的敌人与危险地形。
actors.hero.abilities.warrior.heroicleap.desc=战士向指定地点跳跃，越过路径上的所有敌人与危险地形。不过战士无法越过墙壁或是其它实体地形。
actors.hero.abilities.warrior.shockwave.name=震地冲击
actors.hero.abilities.warrior.shockwave.short_desc=战士大力锤击地面，向一个锥形区域施以_震地冲击_。被冲击波击中的敌人会受到一定伤害并陷入残废。
actors.hero.abilities.warrior.shockwave.desc=战士大力锤击地面产生冲击波，震击前方60度扇形范围5格距离内的区域。\n\n被冲击波击中的敌人会陷入5回合残废并受到5~10点伤害。战士每点超过10的力量会使得该伤害增加1~2点。
actors.hero.abilities.warrior.endure.name=苦痛坚忍
actors.hero.abilities.warrior.endure$enduretracker.name=苦痛之怒
actors.hero.abilities.warrior.endure$enduretracker.desc=战士将忍受的原始伤害织成愤怒，将大量的额外伤害倾泻给敌人。\n\n额外伤害：%1$d\n剩余攻击次数：%2$d
actors.hero.abilities.warrior.endure.short_desc=战士_苦痛坚忍_，跳过若干回合并大幅抵抗伤害。接下来战士会根据忍受的原始伤害造成额外伤害。
actors.hero.abilities.warrior.endure.desc=战士首先忍耐3回合，将任何受到的伤害减少一半。此减伤效果优先于其它减伤计算。\n\n在此之后，战士在10回合内的下一次攻击将造成额外伤害。额外伤害等同于在忍耐期间所有受到的原始伤害的一半。\n\n如果战士处于连击状态，此能力将补偿3回合连击时间。

actors.hero.abilities.mage.elementalblast.name=元素风暴
actors.hero.abilities.mage.elementalblast.no_staff=你不能在没有魔杖的情况下使用这个能力。
actors.hero.abilities.mage.elementalblast.short_desc=法师从魔杖中释放_元素风暴_，席卷以自身为中心的一大片圆形区域，基于灌注的法杖引发不同的效果。
actors.hero.abilities.mage.elementalblast.desc=法师释放出风暴般的魔力，席卷半径为4的圆形区域，对其中的目标造成15~25点伤害。元素风暴引发的特效随魔杖灌注的法杖而变。
actors.hero.abilities.mage.elementalblast.generic_desc=元素风暴引发的效果与法杖向目标施法的效果类似。
actors.hero.abilities.mage.wildmagic.name=狂野魔法
actors.hero.abilities.mage.wildmagic.no_wands=你没有法杖可供施法！
actors.hero.abilities.mage.wildmagic.short_desc=法师引导出法杖中的_狂野魔法_，在单回合内对指定目标随机释放这些法杖多次。
actors.hero.abilities.mage.wildmagic.desc=法师引导出法杖的魔力，在一回合内随机释放法杖至多4次。该能力不会释放法师魔杖。\n\n以这个能力使用法杖时，法杖视为上升2级，最高可至+3。用该能力释放法术只消耗一半的充能，每根法杖最多随机释放两次。
actors.hero.abilities.mage.warpbeacon.name=空间信标
actors.hero.abilities.mage.warpbeacon.depths=你无法传送到其它楼层！
actors.hero.abilities.mage.warpbeacon.locked_floor=楼层被封锁了，你无法离开！
actors.hero.abilities.mage.warpbeacon.too_far=这个位置太远了！
actors.hero.abilities.mage.warpbeacon.invalid_beacon=你不能将信标放在那里！
actors.hero.abilities.mage.warpbeacon.window_desc=你的信标目前设置在了第%d层。
actors.hero.abilities.mage.warpbeacon.window_tele=返回信标位置
actors.hero.abilities.mage.warpbeacon.window_clear=移除信标
actors.hero.abilities.mage.warpbeacon.window_cancel=取消
actors.hero.abilities.mage.warpbeacon.short_desc=法师在当前位置设置了一个_空间信标_，他能瞬间传送回信标所在位置。
actors.hero.abilities.mage.warpbeacon.desc=法师设置了一个可以随时返回的信标。信标设置需要1回合，但传送回不消耗时间。\n\n法师在初始条件下无法传送至别的楼层，不能将其放入不可达的区域如上锁的房间。法师返回时若是目标地点有敌人，则会将其弹开。

actors.hero.abilities.rogue.smokebomb.name=烟幕爆炸
actors.hero.abilities.rogue.smokebomb.fov=你只能跳到视野范围内的空格子里。
actors.hero.abilities.rogue.smokebomb.prompt=选择要跳到的位置
actors.hero.abilities.rogue.smokebomb$ninjalog.name=木桩替身
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=不知为何敌人坚信这就是盗贼本身。
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=你可通过某个英雄护甲技能遇到该单位。
actors.hero.abilities.rogue.smokebomb.short_desc=盗贼在原地制造一场_烟幕爆炸_后闪现离去，并使原点周围的敌人失明。
actors.hero.abilities.rogue.smokebomb.desc=盗贼在原地制造一场烟幕爆炸，并闪现最多6格的距离。闪现无视敌人与危险地形，但仍会被实体地形如墙壁阻挡。\n\n邻近盗贼原位置的敌人将失明5回合。
actors.hero.abilities.rogue.deathmark.name=夺命印记
actors.hero.abilities.rogue.deathmark.ally_target=你只能标记敌人
actors.hero.abilities.rogue.deathmark.short_desc=盗贼向选中的敌人施加_夺命印记_。被标记的敌人将受到额外伤害，但不会在标记期间死亡。
actors.hero.abilities.rogue.deathmark.desc=盗贼标记选中的敌人，使其受到额外25%的伤害。标记不耗费时间且持续5回合。\n\n被标记的敌人受到额外伤害，但并不会在标记期间死亡。当标记结束时，生命值为0的敌人会立即死亡。
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=夺命印记
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=这名被标记的敌人受到25%%的额外伤害，但不会在标记期间死亡。\n\n标记剩余时长：%s回合
actors.hero.abilities.rogue.shadowclone.name=暗影映像
actors.hero.abilities.rogue.shadowclone.short_desc=盗贼召唤一个_暗影映像_，并能使唤其帮助自己战斗。
actors.hero.abilities.rogue.shadowclone.desc=盗贼召唤一个暗影映像，并可以指使它作战。指使映像不会消耗充能。\n\n映像拥有80点生命与10~20点近战伤害，没有护甲。在激活天赋后这些属性可受到其主人武器与护甲的增益。
actors.hero.abilities.rogue.shadowclone$shadowally.name=暗影映像
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=你的映像去了那个位置。
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=你的映像正在跟随你。
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=你的映像正在发动攻击！
actors.hero.abilities.rogue.shadowclone$shadowally.desc=一具无形暗影塑造出的盗贼复制体，它一动不动双目空空，烟雾般的黑暗在周围缓缓升腾。\n\n它虽说不上是个完美的复制体，但也是个合格的杀手，并且在特定天赋加持下能从其主人的装备中获益。
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=你可通过某个英雄护甲技能遇到该单位。

actors.hero.abilities.huntress.spectralblades.name=灵魂飞刃
actors.hero.abilities.huntress.spectralblades.short_desc=女猎手向一个目标掷出_灵魂飞刃_，根据装备的近战武器造成伤害。
actors.hero.abilities.huntress.spectralblades.desc=女猎手向一名敌人掷出灵能飞刃，就像用近战武器进行远程攻击。该攻击保留包括附魔的所有近战攻击效果。
actors.hero.abilities.huntress.naturespower.name=自然之力
actors.hero.abilities.huntress.naturespower.short_desc=女猎手呼唤_自然之力_的协助，在短时间内增加其移动速度与灵能弓射击速度。
actors.hero.abilities.huntress.naturespower.desc=女猎手与她的弓注入了自然的力量！这种力量持续8回合。\n\n在自然之力的加持下，女猎手拥有双倍的移动速度与+33%的灵能弓射击速度。这种力量不影响狙击手专精的追加攻击。
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=自然之力
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=女猎手拥有了暂时的自然之力，增加其移动速度与灵能弓射击速度。\n\n剩余回合数：%s
actors.hero.abilities.huntress.spirithawk.name=灵能飞鹰
actors.hero.abilities.huntress.spirithawk.no_space=你附近没有可用于召唤的空地。
actors.hero.abilities.huntress.spirithawk.short_desc=女猎手召唤一只_灵能飞鹰_使魔，协助侦查并吸引敌人注意。
actors.hero.abilities.huntress.spirithawk.desc=女猎手召唤一只灵能飞鹰，飞鹰存在时使用此能力可指引其行动。飞鹰将存在100回合，指引飞鹰不消耗任何充能。\n\n灵能飞鹰脆弱且缺乏攻击力，但其迅捷的移动、灵敏的躲避与精准的攻击对这些缺点有所弥补。飞鹰与女猎手共享视野，免疫所有环境效果，例如火焰、毒气等。飞鹰只在女猎手指引下发起攻击。
actors.hero.abilities.huntress.spirithawk$hawkally.name=灵能飞鹰
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=你的灵能飞鹰移动到了那个位置。
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=你的飞鹰正在跟随你。
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=你的飞鹰正在发动攻击！
actors.hero.abilities.huntress.spirithawk$hawkally.desc=一只女猎手召唤的灵能飞鹰，全身散发着明亮而空灵的蓝光。它不断扭头探查着周围环境。\n\n飞鹰并不适合武力战斗，但其速度与视距使其能够胜任高效的侦查与危险的诱敌任务。
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=剩余回合数：%d回合
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=飞鹰将必定闪避接下来的%d次攻击。
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=你可通过某个英雄护甲技能遇到该单位。

actors.hero.abilities.duelist.challenge.name=公平决斗
actors.hero.abilities.duelist.challenge.prompt=选择一名敌人以发起决斗
actors.hero.abilities.duelist.challenge.already_dueling=你在同一时间里只能进行一场决斗。
actors.hero.abilities.duelist.challenge.ally_target=你只能向敌人发起决斗。
actors.hero.abilities.duelist.challenge.unreachable_target=你不能选择无法接近的目标。
actors.hero.abilities.duelist.challenge.distant_target=那个敌人离得太远，无法发起决斗。
actors.hero.abilities.duelist.challenge.short_desc=决斗家向一名附近的敌人发起_公平决斗_，在短时间内停止所有其它敌人的时间。
actors.hero.abilities.duelist.challenge.desc=决斗家向一名附近的敌人发起决斗。被选中的敌人会被迫应战，而其它敌人暂时陷入时间冻结。\n\n决斗家只能向5格范围内且可接近的敌人发起决斗。如果出现以下情况的任意一种：决斗进行10回合、敌人死亡或决斗家与敌人的距离超过5格，决斗就会终止。\n\n时间被冻结的敌人处于无敌状态。决斗家的友方单位不会被此能力冻结，但同理，如果对一名头目使用此能力，它的随从亦不会被冻结。
actors.hero.abilities.duelist.challenge$duelparticipant.name=决斗之中
actors.hero.abilities.duelist.challenge$duelparticipant.desc=这个角色正处于一场决斗之中。决斗双方及它们的友方单位或随从能够正常活动，其它角色的时间则被冻结，无法行动。\n\n如果出现以下情况：决斗超过一定时间、决斗双方之一死亡、决斗双方距离超过5格，决斗就会终止。\n\n剩余回合数：%d
actors.hero.abilities.duelist.elementalstrike.name=元素打击
actors.hero.abilities.duelist.elementalstrike.short_desc=决斗家施展一次_元素打击_，基于所持武器的附魔在扇形范围内施加效果。
actors.hero.abilities.duelist.elementalstrike.desc=决斗家打击一名敌人或一个地点，进行一次必定命中的普通攻击，并在65度角4格半径的扇形范围内制造一次魔法效果。魔法的具体效果取决于决斗家主武器的附魔。
actors.hero.abilities.duelist.elementalstrike.generic_desc=不带有附魔的元素打击将会造成一次小型的魔力爆发，对范围内的所有敌人造成6~12点伤害。
actors.hero.abilities.duelist.feint.name=虚晃一招
actors.hero.abilities.duelist.feint.prompt=选择要冲到的位置
actors.hero.abilities.duelist.feint.too_far=那个位置不与你相邻。
actors.hero.abilities.duelist.feint.bad_location=你无法移动到那个位置。
actors.hero.abilities.duelist.feint.short_desc=决斗家_虚晃一招_，在假装进行攻击的同时冲向一个邻近位置。诱导敌人攻击她的残影，致使敌人露出破绽。
actors.hero.abilities.duelist.feint.desc=决斗家在假装进行攻击的同时冲向一个邻近位置，在原位留下一个残影。正在攻击决斗家的敌人会攻击到残影。\n\n攻击了残影的敌人会被迷惑，取消原本的下一个动作，并且可以被伏击。

actors.hero.abilities.cleric.ascendedform.name=超凡升天
actors.hero.abilities.cleric.ascendedform.short_desc=牧师_超凡升天_而进入神格，可获得全新法术、攻击距离与护盾。
actors.hero.abilities.cleric.ascendedform.desc=牧师释放神圣能量，进入持续10回合的神格。在此形态下，牧师可施放全新法术，增加2格攻击距离与30点护盾。且每消耗1点圣典充能进行施法都能使牧师获得10点护盾。\n\n通过超凡升天及其法术赋予的护盾不会自然衰减，但在超凡升天结束时这种护盾会立即消失。重新使用该技能可刷新超凡升天的持续时间。
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=超凡升天
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=神圣能量自牧师周身流转。进入神格时，牧师可通过其神圣能量索敌以获得2格攻击距离，并且每使用一点圣书充能牧师都能获得10点护盾。此外，牧师还可以施放通过超凡升天相关天赋解锁的法术。\n\n通过超凡升天及其法术获得的护盾不会正常衰减，但在超凡升天结束时这种护盾会立即消失。\n\n当前护盾值: %1$d\n剩余回合数: %2$d
actors.hero.abilities.cleric.trinity.name=三位一体
actors.hero.abilities.cleric.trinity.no_imbue=三位一体当前尚未获得任何位格的效果集，使用位格法术以使其获得效果集！
actors.hero.abilities.cleric.trinity.no_duplicate=三位一体无法复制你已经装备的装备效果！
actors.hero.abilities.cleric.trinity.ench_glyph_use=三位一体会消耗_%2$s充能_以获得该附魔或刻印的效果_%1$d回合_。
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=三位一体会消耗_%2$s充能_以获得该_强力_附魔或刻印的效果_%1$d回合_。
actors.hero.abilities.cleric.trinity.wand_use=三位一体会消耗_%2$s充能_以使用该法杖的_%1$d级_效果。
actors.hero.abilities.cleric.trinity.wand_multi_use=三位一体会消耗_%2$s充能_以使用该_复充能_法杖的_%1$d级_效果。
actors.hero.abilities.cleric.trinity.thrown_use=三位一体会消耗_%2$s充能_以使用该投武的_%1$d级_效果。
actors.hero.abilities.cleric.trinity.ring_use=三位一体会消耗_%2$s充能_以获得20回合_%1$d等级_该戒指的效果。
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=三位一体会消耗_%2$s充能_以使用该神器的远端炼金效果。
actors.hero.abilities.cleric.trinity.chaliceofblood_use=三位一体会消耗_%2$s充能_以获得该神器的_%1$d级_被动生命回复效果20回合。
actors.hero.abilities.cleric.trinity.driedrose_use=三位一体会消耗_%2$s充能_以使用该神器召唤_%1$d级_幽灵生命值的友好腐化怨灵的效果。
actors.hero.abilities.cleric.trinity.etherealchains_use=三位一体会消耗_%2$s充能_以使用该神器_%1$d格_范围的锁链施放效果。
actors.hero.abilities.cleric.trinity.hornofplenty_use=三位一体会消耗_%2$s充能_以使用该神器的小吃一口效果。
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=三位一体会消耗_%2$s充能_以使用该神器的_%1$d级_敌人窃取效果。
actors.hero.abilities.cleric.trinity.sandalsofnature_use=三位一体会消耗_%2$s充能_以使用该神器的随机有害种子扎根效果。
actors.hero.abilities.cleric.trinity.skeletonkey_use=三位一体会消耗_%2$s充能_以使用该神器的插入效果。
actors.hero.abilities.cleric.trinity.talismanofforesight_use=三位一体会消耗_%2$s充能_以使用该神器的_%1$d级_探查效果。
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=三位一体会消耗_%2$s充能_以获得该神器持续_%1$d_回合的时间冻结效果。
actors.hero.abilities.cleric.trinity.unstablespellbook_use=三位一体会消耗_%2$s充能_以使用该神器_%1$d/10_无额外消耗使用秘卷概率的随机卷轴效果。
actors.hero.abilities.cleric.trinity.cost=该护甲技能充能消耗不定，但通常为_%d_。
actors.hero.abilities.cleric.trinity.short_desc=牧师获得_三位一体_的技能，可模拟其已鉴定的装备并通过使用全新法术进行装备分配。
actors.hero.abilities.cleric.trinity.desc=牧师获得一套_三位一体_的护甲技能，通过使用三种全新法术选择并使用各式各样的物品效果。每种位格法术都专用于模拟牧师本局已鉴定的不同种类装备效果：体之位格(武器与护甲)、智之位格(法杖与投武)、魂之位格(戒指与神器)。\n\n每种位格法术同时只能模拟一种效果，而牧师使用三位一体时可以选择所使用的位格法术的种类。三位一体无法复制你已装备的装备效果。
actors.hero.abilities.cleric.trinity$wndusetrinity.text=选择三位一体所使用的位格法术。不同位格的效果可同时生效。
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_体之位格：%s_
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_智之位格：%s_
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_魂之位格：%s_
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=选择三位一体所模拟的物品效果。附加信息将在确认之前显示。
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=选择体之位格效果
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=选择智之位格效果
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=选择魂之位格效果
actors.hero.abilities.cleric.powerofmany.name=万物一心
actors.hero.abilities.cleric.powerofmany.prompt_default=选择一个盟友或位置
actors.hero.abilities.cleric.powerofmany.prompt_ally=指挥你的圣天誓盟
actors.hero.abilities.cleric.powerofmany.ally_exists=你已经有一位强化盟友了。
actors.hero.abilities.cleric.powerofmany.no_vision=你无法以视野外的位置为目标。
actors.hero.abilities.cleric.powerofmany.only_allies=你只能强化盟友。
actors.hero.abilities.cleric.powerofmany.short_desc=牧师引导_万物一心_的力量，可强化一位已有盟友或召唤一位全新盟友。
actors.hero.abilities.cleric.powerofmany.desc=牧师引导_万物一心_的力量，可强化一位已有盟友或召唤一位持续100回合的全新盟友。牧师对空格施放该护甲技能即可召唤一位名为圣天誓盟的全新盟友。\n\n被万物一心强化时，任何盟友都会获得25%伤害加成与25%伤害减免，并与牧师共享视野。使用护甲技能还会使盟友获得25点护盾。\n\n牧师还会获得三种仅能对强化盟友施放的全新法术。万物一心不会在上述法术之一的效果期间内结束。
actors.hero.abilities.cleric.powerofmany$powerbuff.name=万物一心
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=该盟友已被万物一心强化，获得25%%伤害加成与25%%伤害减免。盟友还会与牧师共享视野，并可获益于万物一心法术\n\n万物一心会在盟友消散时(例如虹卫)维持强化效果，然而强化效果的持续时长仍会进行倒计时。\n\n剩余回合数：%s
actors.hero.abilities.cleric.powerofmany$lightally.name=圣天誓盟
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=你的盟友移动到了那个位置。
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=你的盟友正在跟随你。
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=你的盟友正在发动攻击！
actors.hero.abilities.cleric.powerofmany$lightally.desc=一位牧师冒险伙伴的克隆人，通体由凝聚态圣光制成。即使圣天誓盟具有另一位英雄的外形，却不具有他们的任何独特能力。只要万物一心的强化效果仍在，该盟友就会维持其存在。\n\n该盟友可通过再次使用万物一心护甲技能不消耗充能地指挥。
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=你可通过某个英雄护甲技能遇到该单位。


actors.hero.abilities.ratmogrify.name=鼠化术
actors.hero.abilities.ratmogrify.cant_transform=这个目标无法被鼠化！
actors.hero.abilities.ratmogrify.too_strong=这名敌人过于强大，鼠化术无效！
actors.hero.abilities.ratmogrify.short_desc=你可以施展_鼠化术_将目标敌人变形！敌人会暂时变为失去所有特殊能力的老鼠。
actors.hero.abilities.ratmogrify.desc=你能将敌人变为老鼠6回合！不过你无法变形Boss，盟友或是老鼠本身。\n\n鼠化的敌人会继承原属性值，但失去所有特殊能力。
actors.hero.abilities.ratmogrify$transmograt.name=鼠化%s
actors.hero.abilities.ratmogrify$transmograt.desc=这名敌人被变成了一只老鼠。对我来说的话，都是好事！——鼠王
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=死于：鼠化敌人

##Cleric Spells
actors.hero.spells.auraofprotection.name=守御灵光
actors.hero.spells.auraofprotection.short_desc=强化圣骑士与附近盟友的防御。
actors.hero.spells.auraofprotection.desc=圣骑士开始辐射出保护性能量，在自身周围形成一片持续20回合的守御灵光。在圣骑士2格范围内的任何盟友(包括圣骑士自身)都会获得%1$d%%的伤害减免与%2$d%%的圣骑士护甲刻印强化。\n\n该伤害减免优先于其他减伤效果(例如护甲)生效。刻印强化会始终生效，但如果某单位(例如圣骑士自身、虹卫)已从圣骑士的刻印中获得效益，则该法术无法使其再次从中获得效益。
actors.hero.spells.auraofprotection$aurabuff.name=守御灵光
actors.hero.spells.auraofprotection$aurabuff.desc=圣骑士正在自身周围辐射出保护性能量。\n\n附近的任何盟友(包括圣骑士自身)都会获得伤害减免与圣骑士护甲刻印强化。\n\n剩余回合数：%s

actors.hero.spells.beamingray.name=光灵召唤
actors.hero.spells.beamingray.no_space=那里没有空间让你的盟友出现。
actors.hero.spells.beamingray.out_of_range=那个位置超出了范围。
actors.hero.spells.beamingray.short_desc=传送你的盟友并使其获得伤害加成。
actors.hero.spells.beamingray.desc=牧师引导其盟友的力量为可将传送盟友至某个位置的光束。若光束投射到敌人上，传送光束会将盟友传送至敌人附近并将其作为攻击目标。\n\n传送光束的最大传送距离为%1$d格，并使万物一心对4格范围内最近敌人的伤害加成提升至%2$d%%，持续10回合。该法术还可以传送通常情况下无法移动的盟友，但若如此则传送光束最大传送距离减半。
actors.hero.spells.beamingray$beamingrayboost.name=光灵召唤
actors.hero.spells.beamingray$beamingrayboost.desc=该盟友近期被光灵召唤的传送光束传送，获得对传送后最近敌人的伤害加成。万物一心不会在该增益的效果期间内结束。\n\n剩余回合数：%s

actors.hero.spells.blessspell.name=神圣祝福
actors.hero.spells.blessspell.short_desc=使牧师获得祝福和护盾，使其他单位获得祝福和治疗。
actors.hero.spells.blessspell.desc=牧师赐自身或视野内一个单位神圣祝福。\n\n当神圣祝福以牧师自身为目标时效果更弱，使其获得%1$d回合赐福与%2$d点护盾。\n\n当神圣祝福以其他单位为目标时效果更强，使其获得%3$d回合赐福与%4$d点治疗。溢出治疗将被转化为护盾。

actors.hero.spells.bodyform.name=体之位格
actors.hero.spells.bodyform.short_desc=为三位一体选择附魔或刻印。
actors.hero.spells.bodyform.desc=牧师选择一个本局已鉴定的附魔或刻印并使三位一体模拟其效果。\n\n使用三位一体时，牧师会获得所选附魔或刻印的效果%d回合。该临时附魔或刻印具有正常附魔或刻印本应具有的任何效果。\n\n该法术会刷新三位一体当前已模拟的任何体之位格效果。
actors.hero.spells.bodyform$bodyformbuff.name=体之位格
actors.hero.spells.bodyform$bodyformbuff.desc=位格法术体之位格正使你获得附魔或刻印的效果，仿佛你已将其装备于当前的武器或护甲。\n\n注意，体之位格无法复制你已经装备的装备效果。\n\n当前的效果：%1$s\n\n剩余回合数：%2$s

actors.hero.spells.cleanse.name=神圣净化
actors.hero.spells.cleanse.short_desc=清除减益并获得护盾。
actors.hero.spells.cleanse.desc=牧师清除自身和视野内盟友的所有负面状态效果。此后所有受影响的单位还将获得%1$d回合的全面净化和%2$d点护盾。

actors.hero.spells.clericspell.prompt=选择一个目标
actors.hero.spells.clericspell.no_target=那里没有任何目标。
actors.hero.spells.clericspell.invalid_target=你无法以那个位置为目标。
actors.hero.spells.clericspell.invalid_enemy=你无法以那个敌人为目标。
actors.hero.spells.clericspell.charge_cost=充能消耗：%d

actors.hero.spells.divinesense.name=神圣感知
actors.hero.spells.divinesense.short_desc=短时间内获得大范围的灵视感知。
actors.hero.spells.divinesense.desc=牧师将其感知集中在周遭环境上，获得持续50回合，%d格范围的灵视感知。该法术施法不耗时。
actors.hero.spells.divinesense$divinesensetracker.name=神圣感知
actors.hero.spells.divinesense$divinesensetracker.desc=该单位暂时能以其灵视感知看到附近其他生物！\n\n剩余回合数：%s

actors.hero.spells.divineintervention.name=神圣干预
actors.hero.spells.divineintervention.short_desc=大幅强化牧师与盟友的护盾。
actors.hero.spells.divineintervention.desc=牧师借助圣典向自身与盟友体内注入无懈可击的神力，提升全体护盾至%1$d点并延长%2$d回合超凡升天。该法术无可匹敌的防御力与其极高的充能消耗相匹配。\n\n与超凡升天提供的其他护盾一样，这种护盾不会正常衰减，但在超凡升天结束时会立即消失。

actors.hero.spells.flash.name=天堂阶梯
actors.hero.spells.flash.prompt=选择一个位置
actors.hero.spells.flash.short_desc=传送至附近一个位置。
actors.hero.spells.flash.desc=牧师在附近的位置引导出超凡升天的神力并传送到那里。天堂阶梯可以将牧师传送至任何在范围内且未被占据的已探索区域。在同次超凡升天中，每次使用该法术时都会消耗更多的圣典充能。

actors.hero.spells.guidinglight.name=神导之光
actors.hero.spells.guidinglight.short_desc=造成远程魔法必中伤害。
actors.hero.spells.guidinglight.desc=牧师发射一束魔能光矢攻击目标，造成2~8点伤害并施加光耀。对光耀敌人的下一次不超力的物理攻击必定命中。
actors.hero.spells.guidinglight.desc_priest=_祭司施放该法术时效果更强。_ 每50回合首次施放该法术不消耗圣典充能，并且光耀可以被辐光、法杖、其他单位和直接作用于敌人的神器消耗。如此使用光耀时，可造成等同于祭司等级+5的额外魔法伤害。
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=神导之光
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=祭司每经50回合可以免费施放一次神导之光。\n\n剩余回合数：%s
actors.hero.spells.guidinglight$illuminated.name=光耀
actors.hero.spells.guidinglight$illuminated.desc=该单位因被神导之光击中而获得光耀。光耀的照度不足以照亮周围区域，但其魔法会使牧师对敌人的攻击更容易命中。
actors.hero.spells.guidinglight$illuminated.desc_priest=祭司可通过破晓辐光、法杖施法、盟友攻击或某些神器效果触发消耗光耀。如此使用光耀可造成等同于祭司等级+5的额外魔法伤害。
actors.hero.spells.guidinglight$illuminated.desc_generic=其他英雄仍可通过炽热之光天赋对敌人造成额外伤害，但无法从中获得任何精准加成。

actors.hero.spells.hallowedground.name=神圣领域
actors.hero.spells.hallowedground.prompt=选择一个位置
actors.hero.spells.hallowedground.short_desc=治疗盟友，减速敌人并在范围内扩散植被。
actors.hero.spells.hallowedground.desc=祭司将其神圣魔法聚集在附近的地面上，创造一片%1$dx%1$d范围，持续20回合的神圣领域。\n\n施法时，法术会立即治疗所有盟友15点生命值(未受伤的的盟友和祭司会获得护盾)，短暂缠绕敌人并扩散矮草。\n\n神圣领域每回合会治疗盟友1点生命值(未受伤的的盟友和祭司会获得护盾)，残疾敌人并随机催生高草。\n\n神圣领域会被火焰摧毁。并且如果被动恢复效果被禁用或祭司长时间未获得经验值，神圣领域将只会产生枯草。
actors.hero.spells.hallowedground$hallowedterrain.desc=此处已经化为神圣领域。神圣领域会减速敌人、治疗盟友并扩散植被。

actors.hero.spells.holyintuition.name=神圣预知
actors.hero.spells.holyintuition.prompt=选择一个物品
actors.hero.spells.holyintuition.cursed=你感觉到这件物品里潜伏着一股充满恶意的魔力。
actors.hero.spells.holyintuition.uncursed=这个物品没有被诅咒。
actors.hero.spells.holyintuition.short_desc=鉴定一个物品有无诅咒。
actors.hero.spells.holyintuition.desc=牧师将其感知集中在一个物品上，不必装备物品就能判断其诅咒有无。

actors.hero.spells.holylance.name=神圣标枪
actors.hero.spells.holylance.short_desc=造成高额远程魔法伤害。
actors.hero.spells.holylance.desc=祭司将大量能量聚集为一柄致命的投掷用圣枪。圣枪造成%1$d~%2$d点伤害，并且必定对亡灵和恶魔目标造成最大伤害。\n\n该法术充能消耗极高，还有30回合的冷却。
actors.hero.spells.holylance$lancecooldown.name=神圣标枪-冷却
actors.hero.spells.holylance$lancecooldown.desc=祭司近期施放了神圣标枪，必须等待一段时间才能再次施放。\n\n剩余回合数：%s

actors.hero.spells.holyward.name=神圣护甲
actors.hero.spells.holyward.glyph_name=神圣%s
actors.hero.spells.holyward.glyph_desc=这个刻印略微增加了护甲可防御的伤害量。
actors.hero.spells.holyward.short_desc=临时覆盖刻印以强化护甲防御。
actors.hero.spells.holyward.desc=牧师赋予其身穿护甲神圣刻印，增加护甲1点防御。该法术施法不耗时。\n\n该刻印持续50回合，并会在持续时间内覆盖任何护甲已有的正面刻印。牧师即使没有护甲也能触发神圣刻印效果。
actors.hero.spells.holyward.desc_paladin=_圣骑士施放该法术时效果更强。_神圣护甲的额外伤害防御提升至3点并不再覆盖已有的附魔，而在神圣护甲生效时施放其他法术所使用的每点充能都会延长10回合的法术效果。
actors.hero.spells.holyward$holyarmbuff.name=神圣护甲
actors.hero.spells.holyward$holyarmbuff.desc=牧师已赋予其身穿护甲神圣刻印，临时覆盖任何已有刻印并使护甲额外防御1点伤害。\n\n剩余回合数：%s
actors.hero.spells.holyward$holyarmbuff.desc_paladin=圣骑士已赋予其身穿护甲神圣刻印，使护甲额外防御3点伤害。\n\n神圣护甲生效时施放其他法术所消耗的每点充能都会延长法术效果10回合。\n\n剩余回合数：%s

actors.hero.spells.holyweapon.name=神圣武器
actors.hero.spells.holyweapon.ench_name=神圣%s
actors.hero.spells.holyweapon.ench_desc=被神圣武器攻击的敌人会受到额外魔法伤害。
actors.hero.spells.holyweapon.short_desc=临时覆盖附魔以强化武器伤害。
actors.hero.spells.holyweapon.desc=牧师赋予其手持武器神圣附魔，使武器每次攻击敌人额外造成2点魔法伤害。该法术施法不耗时。\n\n该附魔持续50回合，并会在持续时间内覆盖任何武器已有的正面附魔。赤手空拳攻击敌人也能触发神圣附魔效果。
actors.hero.spells.holyweapon.desc_paladin=_圣骑士施放该法术时效果更强。_神圣武器的额外魔法伤害提升至6点并不再覆盖已有的附魔，而在神圣武器生效时施放其他法术所使用的每点充能都会延长10回合的法术效果。
actors.hero.spells.holyweapon$holywepbuff.name=神圣武器
actors.hero.spells.holyweapon$holywepbuff.desc=牧师已赋予其手持武器神圣附魔，临时覆盖任何已有附魔并使武器每次攻击额外造成2点魔法伤害。\n\n剩余回合数：%s
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=圣骑士已赋予其手持武器神圣附魔，使其攻击额外造成6点魔法伤害。\n\n神圣武器生效时施放其他法术所消耗的每点充能都会延长10回合的法术效果。\n\n剩余回合数：%s

actors.hero.spells.judgement.name=终末天启
actors.hero.spells.judgement.short_desc=对视野内所有敌人造成伤害。
actors.hero.spells.judgement.desc=牧师撕裂苍穹，以圣光之名审判视野内所有敌人。法术会在造成%1$d~%2$d点伤害的基础之上，再根据牧师自进入超凡升天以来(或自上次施放终末天启以来)的每次施法额外造成33%%伤害。\n\n当前终末天启会造成%3$d~%4$d点伤害。

actors.hero.spells.layonhands.name=圣疗之触
actors.hero.spells.layonhands.short_desc=立即治疗附近一个单位或使圣骑士获得护盾。
actors.hero.spells.layonhands.desc=圣骑士以其双手引导出神圣能量，治疗或保护其所触的任何单位。\n\n圣骑士可施放该法术使附近任何单位获得%1$d点治疗，或使自身获得%1$d点护盾。该法术的溢出治疗将被转化为护盾。\n\n该法术可被立即施放、重复施放，但无法立即施加超过三次施法数值的护盾。

actors.hero.spells.lifelinkspell.name=血色羁绊
actors.hero.spells.lifelinkspell.short_desc=与盟友共享所受伤害，并使其获得伤害减免。
actors.hero.spells.lifelinkspell.desc=牧师强化自身与其强化盟友之间的生命联结。该强化版生命联结持续%1$d回合，会使英雄与其盟友共享任何所受伤害，并使万物一心的伤害减免提升至%2$d%%。注意，伤害共享的优先级低于护甲，但高于万物一心的伤害减免。\n\n生命联结效果生效时，对任何一方施放3阶及以下的增益型牧师法术对双方均有效果。
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=血色羁绊
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=牧师近期对该盟友施放了血色羁绊以建立生命联结。\n\n除生命联结的通常效果外，该单位还会获得伤害减免，任何增益型牧师法术对牧师与该盟友施放时对双方均生效，并且万物一心不会在该增益的效果期间内结束。\n\n\n剩余回合数：%s

actors.hero.spells.mindform.name=智之位格
actors.hero.spells.mindform.short_desc=为三位一体选择法杖或投武。
actors.hero.spells.mindform.desc=牧师选择一个本局已鉴定的法杖或投武并使三位一体模拟其效果。\n\n使用三位一体时，牧师会使用所选物品单次攻击的%d级效果。该次攻击触发正常使用该物品本应触发的所有效果。\n\n该法术会刷新三位一体当前已有的任何智之位格效果。

actors.hero.spells.mnemonicprayer.name=祈愿诗篇
actors.hero.spells.mnemonicprayer.short_desc=延长盟友/敌人的增益/减益效果， 并重新施加光耀。
actors.hero.spells.mnemonicprayer.desc=祭司念诵出延长%1$d回合特定目标所有增益或减益效果的经文。该法术施法不耗时。增益对盟友(包括祭司自身)持续时间更久，减益对敌人持续时间更久。\n\n祈愿诗篇只能延长一次特定目标的增益或减益效果，并且不能延长来自护甲技能的增益效果。

actors.hero.spells.radiance.name=破晓辐光
actors.hero.spells.radiance.short_desc=为视野内敌人触发并施加光耀而将其暂时击晕。
actors.hero.spells.radiance.desc=祭司通体迸出圣光，击晕所有视野内敌人3回合。若敌人已获得光耀，法术会触发光耀的额外伤害并在此之后施加光耀。若本层视野较暗，法术还会使祭司发光100回合。

actors.hero.spells.recallinscription.name=卷藏咒言
actors.hero.spells.recallinscription.short_desc=重复最近使用的符石或卷轴效果。
actors.hero.spells.recallinscription.desc=牧师使用神圣魔法复制最近使用的符文以再次触发%s回合前使用的卷轴或符石的魔法效果。\n\n卷藏咒言不能复制升级卷轴，充能消耗根据最近一次使用的物品变化而变化：符石2点充能、卷轴3点充能、秘卷4点充能。复制嬗变卷轴或嬗变/升级卷轴的符石/秘卷时，充能消耗还会翻倍。
actors.hero.spells.recallinscription$useditemtracker.name=近期已使用符文
actors.hero.spells.recallinscription$useditemtracker.desc=牧师近期已使用一个兼容卷藏咒言法术效果的物品，可以通过施法再次触发物品效果。\n\n已使用物品：%1$s\n\n剩余回合数：%2$s

actors.hero.spells.shieldoflight.name=神圣护盾
actors.hero.spells.shieldoflight.short_desc=获得仅对单个目标生效的临时护甲。
actors.hero.spells.shieldoflight.desc=牧师在自身与敌人间创造了一面薄弱的圣盾，增加其护甲对该敌人持续5回合的%1$d~%2$d点防御。\n\n该法术施法不耗时，但不能同时对多个目标使用。
actors.hero.spells.shieldoflight$shieldoflighttracker.name=神圣护盾
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=一面薄弱的圣盾立于该单位与敌人之间。圣盾的强度不足以完全防御攻击，但能将其减弱。\n\n剩余回合数：%s

actors.hero.spells.spiritform.name=魂之位格
actors.hero.spells.spiritform.short_desc=为三位一体选择戒指或神器。
actors.hero.spells.spiritform.desc=牧师选择本局已鉴定的戒指或神器(神圣法典除外)并使三位一体模拟其效果。\n\n如果所选物品为戒指，三位一体会获得所选戒指的%1$d级效果20回合。\n\n如果所选物品为神器，三位一体会复制所选神器的%2$d级效果。三位一体使用神器时的具体效果与护甲充能消耗因神器而异。\n\n该法术会刷新三位一体当前已模拟的任何魂之位格效果。
actors.hero.spells.spiritform$spiritformbuff.name=魂之位格
actors.hero.spells.spiritform$spiritformbuff.desc=位格法术魂之位格正使你获得物品的效果，仿佛你已将其装备于装备栏。\n\n注意，魂之位格无法复制你已经装备的装备效果。\n\n当前的效果：%1$s\n\n剩余回合数：%2$s

actors.hero.spells.smite.name=至圣斩击
actors.hero.spells.smite.short_desc=一次带有额外伤害与附魔强化的必中攻击。
actors.hero.spells.smite.desc=圣骑士为一次致命的近战攻击注入正义之力。\n\n在造成正常近战伤害的基础上，至圣斩使不超力的攻击必定命中，附有300%%的附魔强化并造成%1$d~%2$d点额外魔法伤害。\n\n至圣斩的额外魔法伤害随圣骑士的等级成长而成长，并且至圣斩必定对恶魔和亡灵敌人造成最大额外魔法伤害。

actors.hero.spells.stasis.name=星界投射
actors.hero.spells.stasis.short_desc=将盟友移出地牢并凝滞其状态。
actors.hero.spells.stasis.desc=牧师将其与盟友的联系集中于自身，使盟友暂时化为牧师体内的某种凝滞状态的能量。盟友最多会被凝滞%d回合，而在凝滞状态下，其所有的正面效果均不受时间影响。\n\n法术效果自然结束时盟友会出现在牧师附近，牧师也可无消耗地立即再次施放该法术以提前结束法术效果。星界投射还可移动无法移动的盟友，但无法将其跨层移动。
actors.hero.spells.stasis$stasisbuff.name=星界投射
actors.hero.spells.stasis$stasisbuff.left_behind=你无法移动的盟友被落在了后面。
actors.hero.spells.stasis$stasisbuff.desc=牧师当前已有盟友被星界投射凝滞状态。该盟友包括万物一心在内的所有正面效果都会被凝滞，并且法术效果结束时盟友会在牧师附近再次出现。法术效果还可被再次施放星界投射提前结束。\n\n已凝滞盟友：%1$s\n剩余回合数：%2$s

actors.hero.spells.sunray.name=阳炎射线
actors.hero.spells.sunray.short_desc=造成远程魔法伤害并致盲目标一次。
actors.hero.spells.sunray.desc=牧师向目标发射致盲光束，造成%1$d~%2$d伤害并使其失明%3$d回合。阳炎射线必定对亡灵和恶魔目标造成最大伤害。\n\n被该法术击中后敌人会调节其视觉，以防被射线再次致盲。然而，如果在被该法术致盲后再次被该法术击中，那么压倒性的强光会将其麻痹而非致盲。

actors.hero.spells.walloflight.name=神圣屏障
actors.hero.spells.walloflight.short_desc=创造一面阻挡敌人的屏障。
actors.hero.spells.walloflight.desc=圣骑士将圣光凝聚为墙壁，在自身面前创造一面1格厚，%1$d格宽，持续20回合的神圣屏障。\n\n神圣屏障除不遮挡视野外与正常墙壁无异。在屏障被创造时，屏障所困住的敌人会被短暂击晕并在条件允许的情况下被击退。屏障所卡住的任何东西都可被取出。\n\n神圣屏障可被正向或斜向施放。如果已有屏障存在，则该法术可被免费再次使用以立即驱散屏障。
actors.hero.spells.walloflight.early_end=你驱散了神圣屏障。
actors.hero.spells.walloflight$lightwall.desc=神圣屏障阻挡了此处的通路。

##main hero
actors.hero.hero.name=你
actors.hero.hero.leave=从没有人愿意这么轻易地离开像素地牢。
actors.hero.hero.level_up=升级！
actors.hero.hero.new_level=升级！精准+，闪避+，最大生命值+5！
actors.hero.hero.new_talent=天赋点+1！
actors.hero.hero.unspent=你还有尚未使用的天赋点！
actors.hero.hero.level_cap=你不能变得更强了，不过你的经验给了你一股力量！
actors.hero.hero.you_now_have=你获得了：%s。
actors.hero.hero.you_cant_have=你无法携带：%s。
actors.hero.hero.locked_chest=箱子锁着而你没有对应的钥匙。
actors.hero.hero.locked_door=你没有对应的钥匙。
actors.hero.hero.noticed_smth=你注意到了些什么。
actors.hero.hero.wait=...
actors.hero.hero.fuurai_change=你的武器变化成了另一种形态！
actors.hero.hero.search=搜索
actors.hero.hero.search_distracted=你没办法集中精力，探索周边异常费力。
actors.hero.hero.key_distracted=你没能打开这把锁，还得再试试。
actors.hero.hero.pain_resist=疼痛使你得以抵抗睡意。
actors.hero.hero.revive=重生十字章迸裂出苏生的能量！

##classes
actors.hero.heroclass.warrior=战士
actors.hero.heroclass.warrior_desc_short=战士用他的_破损纹章_生成护盾以额外减免伤害。纹章可以在护甲之间转移，并且可以_携带一级升级_。
actors.hero.heroclass.warrior_desc=战士初始携带一枚_独特的破损纹章_，可使他在生命值半数以下时获得爆发性护盾。纹章可以在护甲之间转移，并且可以携带一级升级。\n\n同时，战士初始携带一柄_破旧的短剑_，_三块投石_，布甲，水袋与绒布包。\n\n战士开局鉴定的物品有：\n_-_鉴定卷轴\n_-_治疗药剂\n_-_盛怒卷轴
actors.hero.heroclass.warrior_unlock=战士开局即解锁。

actors.hero.heroclass.mage=法师
actors.hero.heroclass.mage_desc_short=法师是一位奥术专家，开局持有一根强于法杖的_魔杖_。魔杖可以灌注法师找到的_任何魔杖_。
actors.hero.heroclass.mage_desc=法师初始携带一根_独特的魔杖_。魔杖的自动充能速度显著快于一般法杖，并且有1点额外最大充能数。法师可以将地牢中找到的各式法杖灌注到魔杖中。\n\n同时，法师初始携带一根已灌注于魔杖中的_魔弹法杖_、布甲、水袋与绒布包。\n\n法师开局鉴定的物品有：\n_-_鉴定卷轴\n_-_液火药剂\n_-_升级卷轴
actors.hero.heroclass.mage_unlock=_使用一张升级卷轴强化一个物品_以解锁法师。

actors.hero.heroclass.rogue=盗贼
actors.hero.heroclass.rogue_desc_short=盗贼能借助他的_暗影斗篷_来躲避和偷袭敌人。他还可以从更远的距离_探测秘密与陷阱_。
actors.hero.heroclass.rogue_desc=盗贼初始携带一件_独特的暗影斗篷_。披上后，盗贼可以随时隐形。\n\n盗贼能从更远的距离_探测秘密与陷阱_。\n\n同时，盗贼初始携带_一柄匕首_，_三把飞刀_，布甲，水袋与绒布包。\n\n盗贼开局鉴定的物品有：\n_-_鉴定卷轴\n_-_隐形药剂\n_-_探地卷轴
actors.hero.heroclass.rogue_unlock=_在一场游戏中进行十次伏击_以解锁盗贼。

actors.hero.heroclass.huntress=女猎手
actors.hero.heroclass.huntress_desc_short=女猎手精通投掷武器，并且具有一把能无限射击的_灵能弓_。女猎手可以穿过高草丛而_不将其践踏成草地_。
actors.hero.heroclass.huntress_desc=女猎手初始携带一把_独特的灵能弓_，可以无限发射魔法箭矢。\n\n女猎手可以穿过高草而_不会践踏高草_。\n\n同时，女猎手初始携带一副_镶钉手套_，布甲，水袋与绒布包。\n\n女猎手开局鉴定的道具有：\n_-_鉴定卷轴\n_-_灵视药剂\n_-_催眠卷轴
actors.hero.heroclass.huntress_unlock=_在一场游戏中使用投掷武器命中十次敌人_以解锁女猎手。

actors.hero.heroclass.duelist=决斗家
actors.hero.heroclass.duelist_desc_short=决斗家是一名武器大师，她能够用武器使出_独特的武技_。使出的武技_依不同武器而异_。
actors.hero.heroclass.duelist_desc=决斗家初始携带一柄_独特的刺剑_，拥有随时间自然充能的特殊武技。\n\n决斗家持有地牢中的任何武器时都将拥有_不同的武技_。\n\n决斗家初始还携带有_两根飞刺_、布甲、水袋以及绒布袋。\n\n决斗家开局鉴定的物品有：\n_-_鉴定卷轴\n_-_力量药剂\n_-_镜像卷轴
actors.hero.heroclass.duelist_unlock=_在力量达到需求的情况下装备一把2阶或更高阶的武器_以解锁决斗家。

actors.hero.heroclass.cleric=牧师
actors.hero.heroclass.cleric_desc_short=牧师是一名使用其独特的_神圣法典_引导神圣魔法的神圣施法者。其能通过天赋_学习并升级法术_。
actors.hero.heroclass.cleric_desc=牧师初始携带一本_独特的神圣法典_，可以使其施放各种各样的法术。\n\n牧师的大多数天赋专注于学习或升级法术上。\n\n牧师初始还携带有_一柄权杖_、布甲、水袋以及绒布袋。\n\n牧师开局鉴定的物品有：\n_-_鉴定卷轴\n_-_净化药剂\n_-_祛邪卷轴
actors.hero.heroclass.cleric_unlock=_完全净化任何一件被诅咒装备的诅咒_以解锁牧师

actors.hero.heroclass.spellsword=魔剑士
actors.hero.heroclass.spellsword_desc_short=魔剑士将_法杖魔法与近身战斗_结合，以较低的单项强度换取每回合灵活选择。
actors.hero.heroclass.spellsword_desc=魔剑士初始携带一柄_独特的魔剑_和一根_魔弹法杖_。魔剑较为精准，但伤害低于破旧短剑，因此需要在近战与魔法之间合理切换。\n\n在使用专精之书时，魔剑士可以选择_术士_或_武僧_路线。\n\n魔剑士还初始携带布甲、水袋与绒布包。\n\n魔剑士开局鉴定的物品有：\n_-_鉴定卷轴\n_-_升级卷轴\n_-_力量药剂
actors.hero.heroclass.spellsword_unlock=融合版中魔剑士开局即解锁。

actors.hero.herosubclass.berserker=狂战士
actors.hero.herosubclass.berserker_short_desc=_狂战士_在受到伤害的时候会积累怒气，怒气能提高狂战士的攻击力，并可在其达到100%时激活以获得额外护盾。
actors.hero.herosubclass.berserker_desc=狂战士会在他受到物理伤害时获得怒气，甚至包括被其护甲所格挡的伤害！怒气会随时间稳定流逝，但会在狂战士生命值较低时流逝更慢。\n\n怒气可使狂战士造成最多50%额外伤害。怒气为满时，狂战士可以进行狂暴，获得爆发性护盾，而只要狂战士仍有护盾剩余，其怒气也会保持不变。护盾会随狂战士护甲等级的增长而增长，并且在其生命值较低时护盾可被大幅强化。在他进行狂暴之后，狂战士需要时间稍作休息。
actors.hero.herosubclass.gladiator=角斗士
actors.hero.herosubclass.gladiator_short_desc=_角斗士_会在成功进行攻击时积累连击数。角斗士可以消耗连击数以使用特殊战技。
actors.hero.herosubclass.gladiator_desc=每当角斗士以近战武器或投掷武器成功击中目标时，他都会积累一点连击。如果角斗士在5回合之内(击杀后15回合之内)未能成功命中目标，那么其连击会被重置。\n\n随着角斗士积累连击，他可以使用一系列必中的连击战技：\n2连击：击退敌人，保留连击\n4连击：造成基于护甲的伤害\n6连击：招架攻击，保留连击\n8连击：攻击目标与附近敌人\n10连击：每连击一次就攻击一次
actors.hero.herosubclass.battlemage=战斗法师
actors.hero.herosubclass.battlemage_short_desc=_战斗法师_在使用魔杖近战攻击时会附带额外的法术效果。这些效果取决于魔杖内灌注的法杖种类。
actors.hero.herosubclass.battlemage_desc=战斗法师使用魔杖近战时会附带类似附魔的额外效果，效果取决于魔杖所灌注的法杖种类，每种法杖各不相同。用魔杖近战打击还会为其恢复0.5点充能。
actors.hero.herosubclass.warlock=术士
actors.hero.herosubclass.warlock_short_desc=_术士_在使用法杖时有概率标记敌人的灵魂。每当术士对被标记的敌人造成物理伤害，自身就会恢复生命值。
actors.hero.herosubclass.warlock_desc=术士在对角色使用法杖时有概率为其施加灵魂标记。施加灵魂标记的概率与标记的持续时间随法杖等级增加而上升。\n\n术士攻击被标记的敌人时，每造成5点伤害，就恢复2点生命值。此效果只对物理攻击有效，对法杖施法的伤害无效！
actors.hero.herosubclass.assassin=刺客
actors.hero.herosubclass.assassin_short_desc=隐形时，_刺客_会准备一次致命的攻击。耐心等得越久，这一击的威力越强。
actors.hero.herosubclass.assassin_desc=刺客会在隐形时准备强力的一击。他准备的时间越长，下次攻击就越致命。准备阶段最多累计9回合。\n\n准备充分后，刺客的下一次攻击会造成额外伤害，能闪现向目标，甚至还能直接斩杀足够虚弱的敌人。
actors.hero.herosubclass.freerunner=疾行者
actors.hero.herosubclass.freerunner_short_desc=_疾行者_在奔跑时会累积动量。动量可以用于开启逸动效果，使他在短时间内获得速度和闪避加成。
actors.hero.herosubclass.freerunner_desc=_疾行者_在奔跑时会累积动量。他每次移动获得1点动量，最多累积10点，在不移动时动量会迅速衰减。动量可用于开启逸动状态，每点动量获取2回合逸动。\n\n逸动状态下的疾行者以双倍速度跑动，并获得正比于自身等级的额外闪避。逸动状态结束后，疾行者需休息一会以重新积累动量。
actors.hero.herosubclass.sniper=狙击手
actors.hero.herosubclass.sniper_short_desc=_狙击手_的远程攻击能穿透护甲。用投掷武器击中目标后，狙击手能以灵能弓进行一次特殊追击。
actors.hero.herosubclass.sniper_desc=狙击手是远程战斗大师，她的远程攻击无视敌人护甲。使用投掷武器击中敌人后，女猎手能对目标施以狙击标记，以使用灵能弓对此敌人发射一次追击。追击的形式取决于弓的强化方式。\n\n未强化的弓会射出一支伤害稍低的速射箭矢，但射击不耗时。强化速度的弓会连射出三箭，每支箭的伤害较低但能触发附魔，射击耗时1回合。强化伤害的弓会射出一支必中的狙杀箭矢，造成基于距离的额外伤害，射击耗时2回合。
actors.hero.herosubclass.warden=守望者
actors.hero.herosubclass.warden_short_desc=_守望者_具有穿透高草的视野，而且在种植和踩踏植物时会获得额外效果。
actors.hero.herosubclass.warden_desc=守望者与自然之力有强大的联结，这赋予了她多项有关植物的能力。守望者具有穿透高草与枯草的视野。\n\n守望者种下的种子周围会生出草，在踩踏植物时会获得额外效果取代原本效果，使得所有植株对其完全无害。
actors.hero.herosubclass.champion=勇士
actors.hero.herosubclass.champion_short_desc=_勇士_可以双持武器，并拥有更多武技充能。她用主武器进行普通攻击，但她也可以自如地切换主、副武器，并施展两武器各自的武技。
actors.hero.herosubclass.champion_desc=勇士善使近战武器，除了主武器，她还能再装备一件副武器。勇士用主武器进行普通攻击，但她可以不耗时地切换主、副武器，也能施放两武器各自的武技。\n\n她还额外有2点武技充能上限，且武技充能回复速率提升50%。
actors.hero.herosubclass.monk=武僧
actors.hero.herosubclass.monk_short_desc=_武僧_在战斗时能够积蓄内力，这些内力可用于施展诸多武功。
actors.hero.herosubclass.monk_desc=武僧的武术造诣十分深厚。她在击败敌人时能够积蓄内力，并用于施放诸多防御性和功能性的能力。内力不会随时间流失，但具有基于武僧等级的存储上限。\n\n1点内力：疾速出拳，连续打击目标\n2点内力：聚精会神，闪避下次受击\n3点内力：瞬间位移，冲向附近位置\n4点内力：蓄力飞踢，击退附近敌人\n5点内力：清除状态，充能法杖神器
actors.hero.herosubclass.priest=祭司
actors.hero.herosubclass.priest_short_desc=_祭司_会获得全新的远程法术和强化版神导之光。
actors.hero.herosubclass.priest_desc=祭司获得一系列全新升级的法术，其主要强调远程攻击与魔法物品兼容。\n\n祭司每经50回合可以免费施放一次_神导之光_，可通过其任何直接作用于敌人的法术施加光耀，并可通过盟友、法杖和某些神器消耗光耀以造成等同于祭司等级+5的额外伤害。\n\n祭司还会获得法术_破晓辐光_，消耗2点充能以驱散黑暗，为视野内所有敌人触发并施加光耀，并将其短暂击晕。
actors.hero.herosubclass.paladin=圣骑士
actors.hero.herosubclass.paladin_short_desc=_圣骑士_会获得全新的近程法术和强化版神圣武器、神圣护甲。
actors.hero.herosubclass.paladin_desc=圣骑士获得一系列全新升级的法术，其主要强调近战攻击与武器护甲兼容。\n\n圣骑士的法术_神圣武器_与_神圣护甲_的攻防加成获得大幅强化，其不再覆盖已有的附魔与刻印，并可通过施放其他法术延长其时效。\n\n圣骑士还会获得法术_至圣斩击_，进行一次带有额外伤害与附魔强度的必中近战攻击。

##talents
actors.hero.talent$provokedangertracker.name=受衅怒火
actors.hero.talent$provokedangertracker.desc=战士刚刚失去护盾，他的下一次物理攻击将造成额外伤害。\n\n剩余回合数：%s
actors.hero.talent$lingeringmagictracker.name=波涌余威
actors.hero.talent$lingeringmagictracker.desc=法师刚刚使用了魔杖或法杖，他的下一次物理攻击将造成额外伤害。\n\n剩余回合数：%s
actors.hero.talent$followupstriketracker.name=追加打击
actors.hero.talent$followupstriketracker.desc=女猎手最近使用投掷武器发动过一次攻击，她对同一目标发动的下一次近战攻击将获得伤害加成。\n\n剩余回合数：%s
actors.hero.talent$patientstriketracker.name=沉稳一击
actors.hero.talent$patientstriketracker.desc=决斗家刚刚等待了一回合，她的下一次近战攻击将会造成额外伤害。
actors.hero.talent$improvisedprojectilecooldown.name=即兴投掷-冷却
actors.hero.talent$improvisedprojectilecooldown.desc=你刚刚发动过这个天赋，需要稍等才能再次发动。\n\n剩余冷却：%s回合
actors.hero.talent$rejuvenatingstepscooldown.name=复春步伐-冷却
actors.hero.talent$rejuvenatingstepscooldown.desc=你刚刚发动过这个天赋，需要稍等才能再次发动。\n\n剩余冷却：%s回合
actors.hero.talent$seershotcooldown.name=探地之矢-冷却
actors.hero.talent$seershotcooldown.desc=你刚刚发动过这个天赋，需要稍等才能再次发动。\n\n剩余冷却：%s回合
actors.hero.talent$aggressivebarriercooldown.name=烈气护盾-冷却
actors.hero.talent$aggressivebarriercooldown.desc=你刚刚发动过这个天赋，需要稍等才能再次发动。\n\n剩余冷却：%s回合
actors.hero.talent$liquidagilacctracker.name=液蕴机敏
actors.hero.talent$liquidagilacctracker.desc=决斗家的下一次普通近战攻击将获得额外精准。\n\n剩余回合数：%s
actors.hero.talent$lethalhastecooldown.name=夺命余势-冷却
actors.hero.talent$lethalhastecooldown.desc=你刚刚发动过这个天赋，需要稍等才能再次发动。\n\n剩余冷却：%s回合
actors.hero.talent$swiftequipcooldown.name=迅疾配装-冷却
actors.hero.talent$swiftequipcooldown.desc=你刚刚发动过这个天赋，需要稍等才能再次发动。\n\n剩余冷却：%s回合
actors.hero.talent$preciseassaulttracker.name=精准打击
actors.hero.talent$preciseassaulttracker.desc=决斗家的下一次普通近战攻击将获得精准加成。\n\n剩余回合数：%s
actors.hero.talent$deadlyfollowuptracker.name=夺命追击
actors.hero.talent$deadlyfollowuptracker.desc=决斗家最近使用投掷武器命中了一个敌人，她对同一目标发动的近战攻击将获得伤害加成。\n\n剩余回合数：%s
actors.hero.talent$combinedlethalityabilitytracker.executed=处决
actors.hero.talent$satiatedspellstracker.name=施法护盾
actors.hero.talent$satiatedspellstracker.desc=牧师下一次施法会为其提供少量护盾。
actors.hero.talent$searinglightcooldown.name=炽热之光
actors.hero.talent$searinglightcooldown.desc=你刚刚发动过这个天赋，需要稍等才能再次发动。\n\n剩余冷却：%s回合

#warrior
actors.hero.talent.hearty_meal.title=丰盛一餐
actors.hero.talent.hearty_meal.desc=_+1：_ 战士在生命值不高于33%时进食将恢复_4点生命_。\n\n_+2：_ 战士在生命值不高于33%时进食将恢复_6点生命_。
actors.hero.talent.veterans_intuition.title=老兵直觉
actors.hero.talent.veterans_intuition.desc=_+1：_战士鉴定武器的速度提升至原来的_1.75倍_，鉴定护甲的速度提升至原来的_2.5倍_。\n\n_+2：_战士鉴定武器的速度提升至原来的_2.5倍_，且能在_装备护甲时_将其直接鉴定。
actors.hero.talent.provoked_anger.title=受衅怒火
actors.hero.talent.provoked_anger.desc=_+1：_当 战士所获的任何护盾效果被伤害击碎时，他的下一次物理攻击将造成_3点额外伤害_。\n\n_+2：_当战士所获的任何护盾效果被伤害击碎时，他的下一次物理攻击将造成_5点额外伤害_。
actors.hero.talent.iron_will.title=钢铁意志
actors.hero.talent.iron_will.desc=_+1：_战士的纹章所提供的护盾_增加1点_。\n\n_+2：_战士的纹章所提供的护盾_增加2点_。
actors.hero.talent.iron_will.meta_desc=_如果这个天赋被其它英雄获得_，那么它会提供1或2点最大护盾版本的战士的破损纹章效果。

actors.hero.talent.iron_stomach.title=钢铁之胃
actors.hero.talent.iron_stomach.desc=_+1：_战士进食只花费1回合，并在进食过程中获得_75%的伤害抗性_。\n\n_+2：_战士进食只花费1回合，并在进食过程中获得_100%的伤害抗性_。
actors.hero.talent.liquid_willpower.title=液蕴意志
actors.hero.talent.liquid_willpower.desc=_+1：_当战士饮用或投掷一瓶药剂、魔药或秘药时，他会获得他_最大生命值6.5%的护盾_。\n\n_+2：_当战士饮用或投掷一瓶药剂、魔药或秘药时，他会获得他_最大生命值10%的护盾_。\n\n如果使用的是力量药剂、经验药剂或须用前述药剂炼制的炼金物品，则获得的护盾量翻倍。\n\n对产量较高的炼金物品(如水爆魔药)，这项天赋会基于该物品的单次产出数量概率触发。
actors.hero.talent.runic_transference.title=刻印转移
actors.hero.talent.runic_transference.desc=_+1：_战士的破损纹章可以像携带一层升级一样携带_常见刻印_。\n\n_+2：_战士的破损纹章可以像携带一层升级一样携带_常见、强力或诅咒刻印_。\n\n破损纹章只能携带护甲贴附有纹章时刻在上面的刻印。
actors.hero.talent.runic_transference.meta_desc=_如果这个天赋被其它英雄获得_，那么它会使护甲刻印必定不会被升级卷轴消除的上限等级提高。天赋+1时，护甲在+6开始有概率消除刻印(原来在+4)，天赋+2时则为+7(原来在+4)。+8时仍然必定消除。
actors.hero.talent.lethal_momentum.title=手起刀落
actors.hero.talent.lethal_momentum.desc=_+1：_战士使用物理武器击杀敌人的一击有_67%的概率_不消耗回合数。\n\n_+2：_战士使用物理武器击杀敌人的一击有_100%的概率_不消耗回合数。
actors.hero.talent.improvised_projectiles.title=即兴投掷
actors.hero.talent.improvised_projectiles.desc=_+1：_战士向敌人扔出非投掷武器的物品时会对其造成_2回合_的致盲效果。这个天赋有50回合的冷却时间。\n\n_+2：_战士向敌人扔出非投掷武器的物品时会对其造成_3回合_的致盲效果。这个天赋有50回合的冷却时间。

actors.hero.talent.hold_fast.title=不动如山
actors.hero.talent.hold_fast.desc=_+1：_当战士装备着其纹章等待时，他可获得_1~2点护甲_并将连击和护盾的衰减速度减缓_50%_，直至他移动为止。\n\n_+2：_当战士装备着其纹章等待时，他可获得_2~4点护甲_并将连击和护盾的衰减速度减缓_75%_，直至他移动为止。\n\n_+3：_当战士装备着其纹章等待时，他可获得_3~6点护甲_并将连击和护盾的衰减速度减缓_100%_，直至他移动为止。
actors.hero.talent.hold_fast.meta_desc=_如果这个天赋被其它英雄获得_，那么它不再需要战士纹章，且最多只能为你提供不超过你已装备的护甲的阶级加等级点护甲。
actors.hero.talent.strongman.title=力大无穷
actors.hero.talent.strongman.desc=_+1：_战士的力量提升_8%_，向下取整。\n\n_+2：_战士的力量提升_13%_，向下取整。\n\n_+3：_战士的力量提升_18%_，向下取整。

actors.hero.talent.endless_rage.title=洪荒之怒
actors.hero.talent.endless_rage.desc=_+1：_狂战士的怒气上限提升至_116%_。\n\n_+2：_狂战士的怒气上限提升至_133%_。\n\n_+3：_狂战士的怒气上限提升至_150%_。\n\n怒气值超过100%时，每1%额外怒气将会提升1%护盾，并降低1%的狂暴冷却，但伤害提升效果不会超过50%。
actors.hero.talent.deathless_fury.title=不朽骤雨
actors.hero.talent.deathless_fury.desc=_+1：_当狂战士即将死亡，且怒气值至少达到100%时，将自动狂暴化。触发后该效果需要_3个英雄等级_来冷却。\n\n_+2：_当狂战士即将死亡，且怒气值至少达到100%时，将自动狂暴化。触发后该效果需要_2个英雄等级_来冷却。\n\n_+3：_当狂战士即将死亡，且怒气值至少达到100%时，将自动狂暴化。触发后该效果需要_1个英雄等级_来冷却。\n\n注意，当狂暴结束时，若狂战士的生命为0，则仍会死亡。
actors.hero.talent.enraged_catalyst.title=怒气导魔
actors.hero.talent.enraged_catalyst.desc=_+1：_狂战士拥有越多怒气，他武器上的附魔或诅咒触发的概率越高，在100%怒气达到最大效果，触发概率_提升至1.15倍_。\n\n_+2：_狂战士拥有越多怒气，他武器上的附魔或诅咒触发的概率越高，在100%怒气达到最大效果，触发概率_提升至1.30倍_。\n\n_+3：_狂战士拥有越多怒气，他武器上的附魔或诅咒触发的概率越高，在100%怒气达到最大效果，触发概率_提升至1.45倍_。

actors.hero.talent.cleave.title=连战热忱
actors.hero.talent.cleave.desc=_+1：_当角斗士击杀一名敌人时，_30回合_内再次攻击仍继承连击数。\n\n_+2：_当角斗士击杀一名敌人时，_45回合_内再次攻击仍继承连击数。\n\n_+3：_当角斗士击杀一名敌人时，_60回合_内再次攻击仍继承连击数。
actors.hero.talent.lethal_defense.title=以战养战
actors.hero.talent.lethal_defense.desc=_+1：_当角斗士使用连击战技击杀一名敌人时，破损纹章护盾的剩余冷却时间会减少_50回合_。\n\n_+2：_当角斗士使用连击战技击杀一名敌人时，破损纹章护盾的剩余冷却时间会减少_100回合_。\n\n_+3：_当角斗士使用连击战技击杀一名敌人时，破损纹章护盾的剩余冷却时间会减少_150回合_。\n\n该天赋可将护盾剩余冷却时间减至最低-150回合，意味着护盾可在生效后立刻冷却完毕，以便再次激活护盾。
actors.hero.talent.enhanced_combo.title=战技强化
actors.hero.talent.enhanced_combo.desc=_+1：_当角斗士的连击数达到7或以上时，冲击的击退距离提升至3且附带眩晕，并可将敌人击落深渊。\n\n_+2：_除+1的增益外，当角斗士的连击数达到9或以上时，招架反击对一回合内的多次攻击有效。\n\n_+3：_除+1和+2的增益外，角斗士在使用撞击，横扫和暴雨时可跃过 连击数/3 格的地格来接近敌人。

actors.hero.talent.body_slam.title=肉弹冲击
actors.hero.talent.body_slam.desc=_+1：_战士英勇之跃落地时，对所有相邻敌人造成_1~4+25%护甲_的伤害。\n\n_+2：_战士英勇之跃落地时，对所有相邻敌人造成_2~8+50%护甲_的伤害。\n\n_+3：_战士英勇之跃落地时，对所有相邻敌人造成_3~12+75%护甲_的伤害。\n\n_+4：_战士英勇之跃落地时，对所有相邻敌人造成_4~16+100%护甲_的伤害。
actors.hero.talent.impact_wave.title=堕天一击
actors.hero.talent.impact_wave.desc=_+1：_战士英勇之跃落地时，击退所有相邻敌人_2格_，有_25%概率_使其获得5回合易伤。\n\n_+2：_战士英勇之跃落地时，击退所有相邻敌人_3格_，有_50%概率_使其获得5回合易伤。\n\n_+3：_战士英勇之跃落地时，击退所有相邻敌人_4格_，有_75%概率_使其获得5回合易伤。\n\n_+4：_战士英勇之跃落地时，击退所有相邻敌人_5格_，有_100%概率_使其获得5回合易伤。
actors.hero.talent.double_jump.title=二段跳跃
actors.hero.talent.double_jump.desc=_+1：_战士使用英勇跳跃后，3回合内下一次使用充能消耗减少_16%_。\n\n_+2：_战士使用英勇跳跃后，3回合内下一次使用充能消耗减少_30%_。\n\n_+3：_战士使用英勇跳跃后，3回合内下一次使用充能消耗减少_40%_。\n\n_+4：_战士使用英勇跳跃后，3回合内下一次使用充能消耗减少_50%_。

actors.hero.talent.expanding_wave.title=广域冲击
actors.hero.talent.expanding_wave.desc=_+1：_震地冲击的射程由5格扩大至_6格_，角度由60度展宽至_75度_。\n\n_+2：_震地冲击的射程由5格扩大至_7格_，角度由60度展宽至_90度_。\n\n_+3：_震地冲击的射程由5格扩大至_8格_，角度由60度展宽至_105度_。\n\n_+4：_震地冲击的射程由5格扩大至_9格_，角度由60度展宽至_120度_。
actors.hero.talent.striking_wave.title=复合震波
actors.hero.talent.striking_wave.desc=_+1：_使用震地冲击时，有_30%_概率使用附魔与连击等攻击效果。\n\n_+2：_使用震地冲击时，有_60%_概率使用附魔与连击等攻击效果。\n\n_+3：_使用震地冲击时，有_90%_概率使用附魔与连击等攻击效果。\n\n_+4：_使用震地冲击时，有_100%_概率使用附魔与连击等攻击效果，且获得_20%的附魔强化_。
actors.hero.talent.shock_force.title=强力冲击
actors.hero.talent.shock_force.desc=_+1：_震地冲击伤害增加_20%_，有_25%_概率将目标击晕而非残废。\n\n_+2：_震地冲击伤害增加_40%_，有_50%_概率将目标击晕而非残废。\n\n_+3：_震地冲击伤害增加_60%_，有_75%_概率将目标击晕而非残废。\n\n_+4：_震地冲击伤害增加_80%_，有_100%_概率将目标击晕而非残废。

actors.hero.talent.sustained_retribution.title=持续反击
actors.hero.talent.sustained_retribution.desc=_+1：_反击由一次额外伤害100%的攻击变为_2次_额外伤害_115%_的攻击。\n\n_+2：_反击由一次额外伤害100%的攻击变为_3次_额外伤害_130%_的攻击。\n\n_+3：_反击由一次额外伤害100%的攻击变为_4次_额外伤害_145%_的攻击。\n\n_+4：_反击由一次额外伤害100%的攻击变为_5次_额外伤害_160%_的攻击。
actors.hero.talent.shrug_it_off.title=痛觉阈值
actors.hero.talent.shrug_it_off.desc=_+1：_战士在苦痛坚忍中的减伤由50%提升至_60%_。\n\n_+2：_战士在苦痛坚忍中的减伤由50%提升至_68%_。\n\n_+3：_战士在苦痛坚忍中的减伤由50%提升至_74%_。\n\n_+4：_战士在苦痛坚忍中的减伤由50%提升至_80%_。
actors.hero.talent.even_the_odds.title=情势反转
actors.hero.talent.even_the_odds.desc=_+1：_战士在苦痛坚忍结束时，周围两格每有一名敌人，增加_5%额外伤害_。\n\n_+2：_战士在苦痛坚忍结束时，周围两格每有一名敌人，增加_10%额外伤害_。\n\n_+3：_战士在苦痛坚忍结束时，周围两格每有一名敌人，增加_15%额外伤害_。\n\n_+4：_战士在苦痛坚忍结束时，周围两格每有一名敌人，增加_20%额外伤害_。

#mage
actors.hero.talent.empowering_meal.title=盈能一餐
actors.hero.talent.empowering_meal.desc=_+1：_进食会为法师接下来3次法杖造成的伤害增加_2点额外伤害_。\n\n_+2：_进食会为法师接下来3次法杖造成的伤害增加_3点额外伤害_。
actors.hero.talent.scholars_intuition.title=学者直觉
actors.hero.talent.scholars_intuition.desc=_+1：_法师鉴定法杖的速度提升至原来的_3倍_。\n\n_+2：_法师能在_使用法杖时_将其直接鉴定。
actors.hero.talent.lingering_magic.title=波涌余威
actors.hero.talent.lingering_magic.desc=_+1：_当法师用魔杖或法杖施法后，他的下一次物理攻击将造成_1~2点额外伤害_。\n\n_+2：_当法师用魔杖或法杖施法后，他的下一次物理攻击将造成_2点额外伤害_。
actors.hero.talent.backup_barrier.title=备用屏障
actors.hero.talent.backup_barrier.desc=_+1：_每当法师释放魔杖最后一点充能，他获得_3点护盾_。\n\n_+2：_每当法师释放魔杖最后一点充能，他获得_5点护盾_。
actors.hero.talent.backup_barrier.meta_desc=_如果这个天赋被其它英雄获得_，那么它会由持有的等级最高的法杖触发。

actors.hero.talent.energizing_meal.title=充能一餐
actors.hero.talent.energizing_meal.desc=_+1：_法师进食只花费1回合，并获得_5回合的法杖充能_。\n\n_+2：_法师进食只花费1回合，并获得_8回合的法杖充能_。
actors.hero.talent.inscribed_power.title=卷藏秘能
actors.hero.talent.inscribed_power.desc=_+1：_当法师阅读卷轴或使用法术结晶后，他接下来的_2次法杖施法_提升2级。\n\n_+2：_当法师阅读卷轴或使用法术结晶后，他接下来的_3次法杖施法_提升2级。\n\n如果使用的是升级卷轴、嬗变卷轴或须用前述卷轴炼制的炼金物品，则法杖的强化施法次数翻倍。\n\n对产量较高的炼金物品(如大多数结晶)，这项天赋会基于该物品的单次产出数量概率触发。
actors.hero.talent.wand_preservation.title=法杖回收
actors.hero.talent.wand_preservation.desc=_+1：_当法师将新的法杖注入魔杖时，旧法杖会被回收为0级法杖，_但仅能执行一次法杖回收_。\n\n_+2：_当法师将新的法杖注入魔杖时，旧法杖会被回收为0级法杖，_英雄每升一级就能执行一次法杖回收_。
actors.hero.talent.wand_preservation.meta_desc=_如果这个天赋被其它英雄获得_，那么它会增加法杖于炼金釜中转化为奥术树脂的数量。+1时法杖转化的树脂数量增加1，+2时则增加2。
actors.hero.talent.arcane_vision.title=奥术感知
actors.hero.talent.arcane_vision.desc=_+1：_当法师对敌人施法时，获得对它们的灵视感知，持续_10回合_。\n\n_+2：_当法师对敌人施法时，获得对它们的灵视感知，持续_15回合_。
actors.hero.talent.shield_battery.title=储能护盾
actors.hero.talent.shield_battery.desc=_+1：_法师能以自身为目标施法，将法杖的每点充能转化为_4%最大生命值_的护盾。\n\n_+2：_法师能以自身为目标施法，将法杖的每点充能转化为_6%最大生命值_的护盾。

actors.hero.talent.desperate_power.title=绝境迫能
actors.hero.talent.desperate_power.desc=_+1：_法师的法杖和魔杖使用最后一点充能的施法效果获得_1级额外等级_。\n\n_+2：_法师的法杖和魔杖使用最后一点充能的施法效果获得_2级额外等级_。\n\n_+3：_法师的法杖和魔杖使用最后一点充能的施法效果获得_3级额外等级_。
actors.hero.talent.ally_warp.title=移形换位
actors.hero.talent.ally_warp.desc=_+1：_法师可以选取一名_2格范围内_的友方单位，与其瞬间交换位置。\n\n_+2：_法师可以选取一名_4格范围内_的友方单位，与其瞬间交换位置。\n\n_+3：_法师可以选取一名_6格范围内_的友方单位，与其瞬间交换位置。\n\n法师不能与无法移动的友方单位交换位置。

actors.hero.talent.empowered_strike.title=蓄能打击
actors.hero.talent.empowered_strike.desc=_+1：_战斗法师使用魔杖施法后，魔杖的首次近战攻击将造成_16%额外伤害_，且额外效果具有_50%强度提升_。\n\n_+2：_战斗法师使用魔杖施法后，魔杖的首次近战攻击将造成_33%额外伤害_，且额外效果具有_100%强度提升_。\n\n_+3：_战斗法师使用魔杖施法后，魔杖的首次近战攻击将造成_50%额外伤害_，且额外效果具有_150%强度提升_。
actors.hero.talent.mystical_charge.title=充能秘术
actors.hero.talent.mystical_charge.desc=_+1：_当战斗法师用魔杖近战击中敌人时，会获得相当于_0.5回合_的神器充能效果。\n\n_+2：_当战斗法师用魔杖近战击中敌人时，会获得相当于_1回合_的神器充能效果。\n\n_+3：_当战斗法师用魔杖近战击中敌人时，会获得相当于_1.5回合_的神器充能效果。
actors.hero.talent.excess_charge.title=盈能屏障
actors.hero.talent.excess_charge.desc=_+1：_战斗法师的魔杖满充能时，其上的每级升级都会在他下一次使用魔杖施法时使自身获得_0.67点护盾_。\n\n_+2：_战斗法师的魔杖满充能时，其上的每级升级都会在他下一次使用魔杖施法时使自身获得_1.33点护盾_。\n\n_+3：_战斗法师的魔杖满充能时，其上的每级升级都会在他下一次使用魔杖施法时使自身获得_2点护盾_。

actors.hero.talent.soul_siphon.title=灵魂分食
actors.hero.talent.soul_siphon.desc=_+1：_其他单位造成的物理伤害会以_13%效率_触发术士的灵魂标记。\n\n_+2：_其他单位造成的物理伤害会以_27%效率_触发术士的灵魂标记。\n\n_+3：_其他单位造成的物理伤害会以_40%效率_触发术士的灵魂标记。
actors.hero.talent.soul_eater.title=噬魂秘法
actors.hero.talent.soul_eater.desc=_+1：_灵魂标记单位受到的每点物理伤害都会提供_0.33回合_饥饿值；被灵魂标记的敌人死亡时，术士有_10%概率_触发进食特效。\n\n_+2：_灵魂标记单位受到的每点物理伤害都会提供_0.67回合_饥饿值；被灵魂标记的敌人死亡时，术士有_20%概率_触发进食特效。\n\n_+3：_灵魂标记单位受到的每点物理伤害都会提供_1回合_饥饿值；被灵魂标记的敌人死亡时，术士有_30%概率_触发进食特效。
actors.hero.talent.necromancers_minions.title=怨灵爪牙
actors.hero.talent.necromancers_minions.desc=_+1：_被灵魂标记的敌人死亡时，术士有_13%概率_将其唤起成为腐化的怨灵。\n\n_+2：_被灵魂标记的敌人死亡时，术士有_27%概率_将其唤起成为腐化的怨灵。\n\n_+3：_被灵魂标记的敌人死亡时，术士有_40%概率_将其唤起成为腐化的怨灵。

actors.hero.talent.blast_radius.title=广域打击
actors.hero.talent.blast_radius.desc=_+1：_元素风暴的半径由4格扩大至_5格_。\n\n_+2：_元素风暴的半径由4格扩大至_6格_。\n\n_+3：_元素风暴的半径由4格扩大至_7格_。\n\n_+4：_元素风暴的半径由4格扩大至_8格_。
actors.hero.talent.elemental_power.title=元素之力
actors.hero.talent.elemental_power.desc=_+1：_元素风暴的威力提升_25%_。\n\n_+2：_元素风暴的威力提升_50%_。\n\n_+3：_元素风暴的威力提升_75%_。\n\n_+4：_元素风暴的威力提升_100%_。
actors.hero.talent.reactive_barrier.title=反应屏障
actors.hero.talent.reactive_barrier.desc=_+1：_每有一个角色受元素风暴影响，法师获得_2.5点护盾_，最多计算5个角色。\n\n_+2：_每有一个角色受元素风暴影响，法师获得_5点护盾_，最多计算6个角色。\n\n_+3：_每有一个角色受元素风暴影响，法师获得_7.5点护盾_，最多计算7个角色。\n\n_+4：_每有一个角色受元素风暴影响，法师获得_10点护盾_，最多计算8个角色。

actors.hero.talent.wild_power.title=狂野魔力
actors.hero.talent.wild_power.desc=_+1：_释放狂野魔法时，法杖会被视为具有额外_2或3级_，最多可提升至_+4_。\n\n_+2：_释放狂野魔法时，法杖会被视为具有额外_3级_，最多可提升至_+5_。\n\n_+3：_释放狂野魔法时，法杖会被视为具有额外_3或4级_，最多可提升至_+6_。\n\n_+4：_释放狂野魔法时，法杖会被视为具有额外_4级_，最多可提升至_+7_。
actors.hero.talent.fire_everything.title=法力倾泻
actors.hero.talent.fire_everything.desc=_+1：_狂野魔法将释放法杖由4次提升至_5次_，并且每一根法杖有_25%的概率_可被释放3次。\n\n_+2：_狂野魔法将释放法杖由4次提升至_6次_，并且每一根法杖有_50%的概率_可被释放3次。\n\n_+3：_狂野魔法将释放法杖由4次提升至_7次_，并且每一根法杖有_75%的概率_可被释放3次。\n\n_+4：_狂野魔法将释放法杖由4次提升至_8次_，并且每一根法杖有_100%的概率_可被释放3次。
actors.hero.talent.conserved_magic.title=节能施法
actors.hero.talent.conserved_magic.desc=_+1：_狂野魔法每次释放法杖消耗的充能由0.5点下降至_0.33点_，并且狂野魔法有_25%概率_不花费时间。\n\n_+2：_狂野魔法每次释放法杖消耗的充能由0.5点下降至_0.225点_，并且狂野魔法有_50%概率_不花费时间。\n\n_+3：_狂野魔法每次释放法杖消耗的充能由0.5点下降至_0.15点_，并且狂野魔法有_75%概率_不花费时间。\n\n_+4：_狂野魔法每次释放法杖消耗的充能由0.5点下降至_0.1点_，并且狂野魔法有_100%概率_不花费时间。

actors.hero.talent.telefrag.title=传送挤压
actors.hero.talent.telefrag.desc=_+1：_当法师传送回信标与另一角色发生碰撞时，法师对其造成_10~15点_伤害，但自己会受到_5点伤害_。\n\n_+2：_当法师传送回信标与另一角色发生碰撞时，法师对其造成_20~30点_伤害，但自己会受到_10点伤害_。\n\n_+3：_当法师传送回信标与另一角色发生碰撞时，法师对其造成_30~45点_伤害，但自己会受到_15点伤害_。\n\n_+4：_当法师传送回信标与另一角色发生碰撞时，法师对其造成_40~60点_伤害，但自己会受到_20点伤害_。\n\n玩家不会死于自伤，且该伤害可由魔法抵抗效果减免。
actors.hero.talent.remote_beacon.title=彼方信标
actors.hero.talent.remote_beacon.desc=_+1：_法师可以在_4格_内的任意一处放置一个信标。\n\n_+2：_法师可以在_8格_内的任意一处放置一个信标。\n\n_+3：_法师可以在_12格_内的任意一处放置一个信标。\n\n_+4：_法师可以在_16格_内的任意一处放置一个信标。\n\n法师无法在其不可抵达的位置放置信标。
actors.hero.talent.longrange_warp.title=长途传送
actors.hero.talent.longrange_warp.desc=_+1：_法师能够跨层传送，但消耗_150%的充能_。\n\n_+2：_法师能够跨层传送，但消耗_117%的充能_。\n\n_+3：_法师能够跨层传送，且仅消耗_83%的充能_。\n\n_+4：_法师能够跨层传送，且仅消耗_50%的充能_。\n\n法师不能借助此能力离开封锁的楼层。

#rogue
actors.hero.talent.cached_rations.title=备用口粮
actors.hero.talent.cached_rations.desc=_+1：_盗贼在探索后续几层地牢时，可以于箱子中找出_2包备用口粮_。\n\n_+2：_盗贼在探索后续几层地牢时，可以于箱子中找出_3包备用口粮_。\n\n备用口粮可快速食用，能回复中等饱食度、恢复5点生命值，并为暗影斗篷回复1点充能。
actors.hero.talent.thiefs_intuition.title=窃贼直觉
actors.hero.talent.thiefs_intuition.desc=_+1：_盗贼鉴定戒指的速度提升至原来的_2倍_，且能在_装备戒指时_鉴定其种类。\n\n_+2：_盗贼能在_装备戒指时_将其直接鉴定，且能在_拾取戒指时_鉴定其种类。
actors.hero.talent.sucker_punch.title=阴险打击
actors.hero.talent.sucker_punch.desc=_+1：_初次伏击一名敌人时盗贼将造成_1~2点额外伤害_。\n\n_+2：_初次伏击一名敌人时盗贼将造成_2点额外伤害_。
actors.hero.talent.protective_shadows.title=暗影庇护
actors.hero.talent.protective_shadows.desc=_+1：_盗贼在隐形时，每_2回合_获得一点护盾，最多积累_3点_。\n\n_+2：_盗贼在隐形时，每_1回合_获得一点护盾，最多积累_5点_。

actors.hero.talent.mystical_meal.title=秘术祭食
actors.hero.talent.mystical_meal.desc=_+1：_盗贼进食只花费1回合(食用备用口粮不花费回合)，并获得_3回合的神器充能_。\n\n_+2：_盗贼进食只花费1回合(食用备用口粮不花费回合)，并获得_5回合的神器充能_。\n\n这项天赋不能使丰饶之角对其本身充能。
actors.hero.talent.inscribed_stealth.title=卷藏匿影
actors.hero.talent.inscribed_stealth.desc=_+1：_盗贼阅读卷轴或使用法术结晶后会获得_3回合_的隐形。\n\n_+2：_盗贼阅读卷轴或使用法术结晶后会获得_5回合_的隐形。\n\n如果使用的是升级卷轴、嬗变卷轴或须用前述卷轴炼制的炼金物品，则获得的隐形效果时长翻倍。\n\n对产量较高的炼金物品(如大多数结晶)，这项天赋会基于该物品的单次产出数量概率触发。
actors.hero.talent.wide_search.title=广域搜索
actors.hero.talent.wide_search.desc=_+1：_盗贼的搜索范围由方形5x5增幅至_圆形7x7_。\n\n_+2：_盗贼的搜索范围由方形5x5增幅至_方形7x7_。
actors.hero.talent.wide_search.meta_desc=_如果这个天赋被其它英雄获得_，那么它会在+1时增幅搜索范围至5x5的圆形，+2时增幅至5x5的方形。
actors.hero.talent.silent_steps.title=无声步伐
actors.hero.talent.silent_steps.desc=_+1：_盗贼不会惊醒_距其3格或更远的敌人_。\n\n_+2：_盗贼不会惊醒_未与其相邻的敌人_。
actors.hero.talent.rogues_foresight.title=盗贼直觉
actors.hero.talent.rogues_foresight.desc=_+1：_当盗贼进入有隐藏房间的新楼层时，有_75%的概率察觉_该层有隐藏房间。\n\n_+2：_当盗贼进入有隐藏房间的新楼层时，有_100%的概率察觉_该层有隐藏房间。

actors.hero.talent.light_cloak.title=轻便斗篷
actors.hero.talent.light_cloak.desc=_+1：_盗贼不装备暗影斗篷也能使用其功能，但未装备时斗篷的充能速率会降至_25%_。\n\n_+2：_盗贼不装备暗影斗篷也能使用其功能，但未装备时斗篷的充能速率会降至_50%_。\n\n_+3：_盗贼不装备暗影斗篷也能使用其功能，但未装备时斗篷的充能速率会降至_75%_。
actors.hero.talent.light_cloak.meta_desc=_如果这个天赋被其它英雄获得_，那么它会在+1/+2/+3等级时提高7/13/20%的所有神器充能速度。
actors.hero.talent.enhanced_rings.title=戒指强化
actors.hero.talent.enhanced_rings.desc=_+1：_使用神器后的_3回合_内，盗贼的所有戒指都会提升1级。\n\n_+2：_使用神器后的_6回合_内，盗贼的所有戒指都会提升1级。\n\n_+3：_使用神器后的_9回合_内，盗贼的所有戒指都会提升1级。

actors.hero.talent.enhanced_lethality.title=直击要害
actors.hero.talent.enhanced_lethality.desc=_+1：_刺客每级阶段准备可以直接斩杀敌人的生命值阈值由3/10/20/50%提升至_4/13/27/67%_。\n\n_+2：_刺客每级阶段准备可以直接斩杀敌人的生命值阈值由3/10/20/50%提升至_5/17/33/83%_。\n\n_+3：_刺客每级阶段准备可以直接斩杀敌人的生命值阈值由3/10/20/50%提升至_6/20/40/100%_。
actors.hero.talent.assassins_reach.title=超距索命
actors.hero.talent.assassins_reach.desc=_+1：_刺客每级阶段准备的闪现距离由1/2/3/4格延长至_1/3/4/6格_。\n\n_+2：_刺客每级阶段准备的闪现距离由1/2/3/4格延长至_2/4/6/8格_。\n\n_+3：_刺客每级阶段准备的闪现距离由1/2/3/4格延长至_2/5/7/10格_。\n\n这种闪现可以越过危险地形或敌人，但不能穿透墙壁等坚固地形。
actors.hero.talent.bounty_hunter.title=赏金猎手
actors.hero.talent.bounty_hunter.desc=_+1：_被刺客用技能斩杀的敌人，依据准备阶段的等级，其战利品掉落概率提升_2/4/8/16%_。\n\n_+2：_被刺客用技能斩杀的敌人，依据准备阶段的等级，其战利品掉落概率提升_4/8/16/32%_。\n\n_+3：_被刺客用技能斩杀的敌人，依据准备阶段的等级，其战利品掉落概率提升_6/12/24/48%_。

actors.hero.talent.evasive_armor.title=灵猴之护
actors.hero.talent.evasive_armor.desc=_+1：_处于逸动状态时，每点超出护甲需求的力量使疾行者额外获得_1点闪避_。\n\n_+2：_处于逸动状态时，每点超出护甲需求的力量使疾行者额外获得_2点闪避_。\n\n_+3：_处于逸动状态时，每点超出护甲需求的力量使疾行者额外获得_3点闪避_。
actors.hero.talent.projectile_momentum.title=飞速投掷
actors.hero.talent.projectile_momentum.desc=_+1：_处于逸动状态时，疾行者的投掷武器具有额外的_50%精准与15%伤害_。\n\n_+2：_处于逸动状态时，疾行者的投掷武器具有额外的_100%精准与30%伤害_。\n\n_+3：_处于逸动状态时，疾行者的投掷武器具有额外的_150%精准与45%伤害_。
actors.hero.talent.speedy_stealth.title=无人之境
actors.hero.talent.speedy_stealth.desc=_+1：_疾行者在隐形时，每回合获得2层动量。\n\n_+2：_除获得+1的增益外，当疾行者隐形时，逸动效果持续的回合数不会下降。\n\n_+3：_除获得+1，+2的增益外，当疾行者隐形时，不论其是否处于逸动状态，他的移动速度都会翻倍。

actors.hero.talent.hasty_retreat.title=猜我在哪
actors.hero.talent.hasty_retreat.desc=_+1：_盗贼在闪现后获得_1回合_的极速与隐形。\n\n_+2：_盗贼在闪现后获得_2回合_的极速与隐形。\n\n_+3：_盗贼在闪现后获得_3回合_的极速与隐形。\n\n_+4：_盗贼在闪现后获得_4回合_的极速与隐形。
actors.hero.talent.body_replacement.title=替身掩护
actors.hero.talent.body_replacement.desc=_+1：_闪现时，盗贼会留下一个有_20点生命与1~3点护甲_的替身木桩。\n\n_+2：_闪现时，盗贼会留下一个有_40点生命与2~6点护甲_的替身木桩。\n\n_+3：_闪现时，盗贼会留下一个有_60点生命与3~9点护甲_的替身木桩。\n\n_+4：_闪现时，盗贼会留下一个有_80点生命与4~12点护甲_的替身木桩。\n\n同一时间只可存在一个替身木桩。
actors.hero.talent.shadow_step.title=烟幕潜行
actors.hero.talent.shadow_step.desc=_+1：_盗贼隐形时，烟幕爆炸可以瞬间发动，并且充能花费会_降低16%_。隐形时的烟幕爆炸不会致盲敌人，也不会触发其他天赋。\n\n_+2：_盗贼隐形时，烟幕爆炸可以瞬间发动，并且充能花费会_降低30%_。隐形时的烟幕爆炸不会致盲敌人，也不会触发其他天赋。\n\n_+3：_盗贼隐形时，烟幕爆炸可以瞬间发动，并且充能花费会_降低41%_。隐形时的烟幕爆炸不会致盲敌人，也不会触发其他天赋。\n\n_+4：_盗贼隐形时，烟幕爆炸可以瞬间发动，并且充能花费会_降低50%_。隐形时的烟幕爆炸不会致盲敌人，也不会触发其他天赋。

actors.hero.talent.fear_the_reaper.title=恐惧蔓延
actors.hero.talent.fear_the_reaper.desc=_+1：_具有夺命印记的敌人在生命值降为0时会获得_残废_效果。\n\n_+2：_具有夺命印记的敌人在生命值降为0时会获得_残废与恐惧_效果。\n\n_+3：_具有夺命印记的敌人在生命值降为0时会获得_残废与恐惧_效果，并且3格距离内的其他敌人也会获得_残废_效果。\n\n_+4：_具有夺命印记的敌人在生命值降为0时会获得_残废与恐惧_效果，并且3格距离内的其他敌人也会获得_残废与恐惧_效果。
actors.hero.talent.deathly_durability.title=死神外衣
actors.hero.talent.deathly_durability.desc=_+1：_死于夺命印记的敌人会赋予盗贼其被印记时生命值_13%_的护盾。\n\n_+2：_死于夺命印记的敌人会赋予盗贼其被印记时生命值_25%_的护盾。\n\n_+3：_死于夺命印记的敌人会赋予盗贼其被印记时生命值_38%_的护盾。\n\n_+4：_死于夺命印记的敌人会赋予盗贼其被印记时生命值_50%_的护盾。
actors.hero.talent.double_mark.title=双重印记
actors.hero.talent.double_mark.desc=_+1：_标记一个目标后立即标记另一目标时，标记的充能消耗降低_30%_。\n\n_+2：_标记一个目标后立即标记另一目标时，标记的充能消耗降低_50%_。\n\n_+3：_标记一个目标后立即标记另一目标时，标记的充能消耗降低_65%_。\n\n_+4：_标记一个目标后立即标记另一目标时，标记的充能消耗降低_75%_。

actors.hero.talent.shadow_blade.title=影铸之刃
actors.hero.talent.shadow_blade.desc=_+1：_暗影映像获得其主人每回合伤害的_8%_，有_25%_概率使用主人武器的附魔。\n\n_+2：_暗影映像获得其主人每回合伤害的_16%_，有_50%_概率使用主人武器的附魔。\n\n_+3：_暗影映像获得其主人每回合伤害的_24%_，有_75%_概率使用主人武器的附魔。\n\n_+4：_暗影映像获得其主人每回合伤害的_32%_，有_100%_概率使用主人武器的附魔。
actors.hero.talent.cloned_armor.title=影塑之甲
actors.hero.talent.cloned_armor.desc=_+1：_暗影映像获得其主人护甲值的_12%_，有_25%_概率使用主人护甲的刻印。\n\n_+2：_暗影映像获得其主人护甲值的_24%_，有_50%_概率使用主人护甲的刻印。\n\n_+3：_暗影映像获得其主人护甲值的_36%_，有_75%_概率使用主人护甲的刻印。\n\n_+4：_暗影映像获得其主人护甲值的_48%_，有_100%_概率使用主人护甲的刻印。
actors.hero.talent.perfect_copy.title=完美克隆
actors.hero.talent.perfect_copy.desc=_+1：_暗影映像额外获得其主人_10%_的最大生命值。并且盗贼可以瞬间与_1格_距离以内的映像交换位置。\n\n_+2：_暗影映像额外获得其主人_20%_的最大生命值，并且盗贼可以瞬间与_2格_距离以内的映像交换位置。\n\n_+3：_暗影映像额外获得其主人_30%_的最大生命值，并且盗贼可以瞬间与_3格_距离以内的映像交换位置。\n\n_+4：_暗影映像额外获得其主人_40%_的最大生命值，并且盗贼可以瞬间与_4格_距离以内的映像交换位置。

#huntress
actors.hero.talent.natures_bounty.title=自然馈赠
actors.hero.talent.natures_bounty.desc=_+1：_女猎手在探索后续几层地牢时，可以于高草丛中找出隐藏的_4颗浆果_。\n\n_+2：_女猎手在探索后续几层地牢时，可以于高草丛中找出隐藏的_6颗浆果_。\n\n浆果可快速食用，能回复少量饱食度，还可能吃出一粒实用的种子。
actors.hero.talent.survivalists_intuition.title=生存直觉
actors.hero.talent.survivalists_intuition.desc=_+1：_女猎手鉴定投掷武器的速度提升至原来的_3倍_。\n\n_+2：_女猎手能在_使用投掷武器击中敌人时_将其直接鉴定。
actors.hero.talent.followup_strike.title=追加打击
actors.hero.talent.followup_strike.desc=_+1：_当女猎手用她的弓或其它投掷武器击中敌人时，她对该敌人的下一次近战攻击将造成_2点额外伤害_。\n\n_+2：_当女猎手用她的弓或其他投掷武器击中敌人时。她对该敌人的下一次近战攻击将造成_3点额外伤害_。
actors.hero.talent.natures_aid.title=自然助力
actors.hero.talent.natures_aid.desc=_+1：_视野内的植物的效果触发时，女猎手会获得_每3回合_衰减一次的0~2点树肤。\n\n_+2：_视野内的植物的效果触发时，女猎手会获得_每5回合_衰减一次的0~2点树肤。

actors.hero.talent.invigorating_meal.title=活力一餐
actors.hero.talent.invigorating_meal.desc=_+1：_女猎手进食只花费1回合(食用浆果不花费回合)，并获得_1回合的极速_。\n\n_+2：_女猎手进食只花费1回合(食用浆果不花费回合)，并获得_2回合的极速_。
actors.hero.talent.liquid_nature.title=液蕴自然
actors.hero.talent.liquid_nature.desc=_+1：_当女猎手饮用或投掷一瓶药剂、魔药或秘药时，周围会生出_最多4格高草丛_，且周围的敌人会被缠绕_1回合_。\n\n_+2：_当女猎手饮用或投掷一瓶药剂、魔药或秘药时，周围会生出_最多6格高草丛_，且周围的敌人会被缠绕_2回合_。\n\n如果使用的是力量药剂、经验药剂或须用前述药剂炼制的炼金物品，则高草丛的生长量和缠绕的时长均翻倍。\n\n对产量较高的炼金物品(如水爆魔药)，这项天赋会基于制成该物品的多少而有概率触发。
actors.hero.talent.rejuvenating_steps.title=复春步伐
actors.hero.talent.rejuvenating_steps.desc=_+1：_当女猎手踏上矮草或余烬时，它们会复生为高草，并立即被女猎手踩踏。这个天赋_有10回合的冷却时间_。\n\n_+2：_当女猎手踏上矮草或余烬时，它们会复生为高草，并立即被女猎手踩踏。这个天赋_有5回合的冷却时间_。\n\n若被动恢复效果被禁用或者英雄长时间内没有获得经验，此天赋只会生出枯草。
actors.hero.talent.heightened_senses.title=敏锐感知
actors.hero.talent.heightened_senses.desc=_+1：_女猎手能获得对_她周围2格范围内_所有单位的灵视感知。\n\n_+2：_女猎手能获得对_她周围3格范围内_所有单位的灵视感知。
actors.hero.talent.durable_projectiles.title=矢石保养
actors.hero.talent.durable_projectiles.desc=_+1：_女猎手手中的投掷武器获得_50%额外耐久_。\n\n_+2：_女猎手手中的投掷武器获得_75%额外耐久_。

actors.hero.talent.point_blank.title=抵近射击
actors.hero.talent.point_blank.desc=_+1：_当女猎手在近战距离使用投掷武器或灵能弓时，精准修正从-50%提升至_-25%_。\n\n_+2：_当女猎手在近战距离使用投掷武器或灵能弓时，精准修正从-50%提升至_正常精准_。\n\n_+3：_当女猎手在近战距离使用投掷武器或灵能弓时，精准修正从-50%提升至_+25%_。\n\n注意，非近战距离使用投掷武器或灵能弓时，总是获得+50%的精准修正。
actors.hero.talent.seer_shot.title=探地之矢
actors.hero.talent.seer_shot.desc=_+1：_当女猎手射箭击中地面时，会提供落点周围3x3的视野，_持续5回合_。这个天赋有20回合的冷却时间。\n\n_+2：_当女猎手射箭击中地面时，会提供落点周围3x3的视野，_持续10回合_。这个天赋有20回合的冷却时间。\n\n_+3：_当女猎手射箭击中地面时，会提供落点周围3x3的视野，_持续15回合_。这个天赋有20回合的冷却时间。
actors.hero.talent.seer_shot.meta_desc=_如果这个天赋被其它英雄获得_，那么它可被任何投掷武器触发。

actors.hero.talent.farsight.title=鹰眼远视
actors.hero.talent.farsight.desc=_+1：_狙击手的视野范围_扩大25%_。\n\n_+2：_狙击手的视野范围_扩大50%_。\n\n_+3：_狙击手的视野范围_扩大75%_。
actors.hero.talent.shared_enchantment.title=联动附魔
actors.hero.talent.shared_enchantment.desc=_+1：_投掷武器_有33%概率_附带狙击手灵能弓上的附魔。\n\n_+2：_投掷武器_有67%概率_附带狙击手灵能弓上的附魔。\n\n_+3：_投掷武器_有100%概率_附带狙击手灵能弓上的附魔。\n\n无论投掷武器附有哪种附魔，均能正常触发灵能弓的附魔。
actors.hero.talent.shared_upgrades.title=联动升级
actors.hero.talent.shared_upgrades.desc=当狙击手以一件已升级的投掷武器攻击时，其每级升级都会延长1回合狙击标记持续时间并增加16%特殊攻击伤害。\n\n_+1：_狙击手的投掷武器被限制为最多提供_2级_加成，以延长_2回合_狙击标记持续时间并增加_33%_特殊攻击伤害。\n\n_+2：_狙击手的投掷武器被限制为最多提供_4级_加成，以延长_4回合_狙击标记持续时间并增加_67%_特殊攻击伤害。\n\n_+3：_狙击手的投掷武器被限制为最多提供_6级_加成，以延长_6回合_狙击标记持续时间并增加_100%_特殊攻击伤害。

actors.hero.talent.durable_tips.title=持久药液
actors.hero.talent.durable_tips.desc=_+1：_守望者的涂药飞镖拥有_2倍耐久_。\n\n_+2：_守望者的涂药飞镖拥有_3倍耐久_。\n\n_+3：_守望者的涂药飞镖拥有_4倍耐久_。
actors.hero.talent.barkskin.title=树肤韧甲
actors.hero.talent.barkskin.desc=_+1：_踏上未枯萎的高草或植物时，守望者获得_她等级0~33%_点，每回合衰减的树肤护甲。\n\n_+2：_踏上未枯萎的高草或植物时，守望者获得_她等级0~67%_点，每回合衰减的树肤护甲。\n\n_+3：_踏上未枯萎的高草或植物时，守望者获得_她等级0~100%_点，每回合衰减的树肤护甲。
actors.hero.talent.shielding_dew.title=露水护体
actors.hero.talent.shielding_dew.desc=_+1：_当守望者生命值满时，拾取露珠可以为守望者提供护盾，上限为守望者_20%的最大生命值_。\n\n_+2：_当守望者生命值满时，拾取露珠可以为守望者提供护盾，上限为守望者_40%的最大生命值_。\n\n_+3：_当守望者生命值满时，拾取露珠可以为守望者提供护盾，上限为守望者_60%的最大生命值_。

actors.hero.talent.fan_of_blades.title=千叶刀扇
actors.hero.talent.fan_of_blades.desc=_+1：_灵魂飞刃最多能命中_1个额外目标_，造成50%的伤害。目标须在视野内且与原目标同处于_30度_扇形内。\n\n_+2：_灵魂飞刃最多能命中_2个额外目标_，造成50%的伤害。目标须在视野内且与原目标同处于_60度_扇形内。\n\n_+3：_灵魂飞刃最多能命中_3个额外目标_，造成50%的伤害。目标须在视野内且与原目标同处于_90度_扇形内。\n\n_+4：_灵魂飞刃最多能命中_4个额外目标_，造成50%的伤害。目标须在视野内且与原目标同处于_120度_扇形内。
actors.hero.talent.projecting_blades.title=索敌飞刃
actors.hero.talent.projecting_blades.desc=_+1：_灵魂飞刃精准提升_25%_，最多能穿透_2格坚实地形_。\n\n_+2：_灵魂飞刃精准提升_50%_，最多能穿透_4格坚实地形_。\n\n_+3：_灵魂飞刃精准提升_75%_，最多能穿透_6格坚实地形_。\n\n_+4：_灵魂飞刃精准提升_100%_，最多能穿透_8格坚实地形_。
actors.hero.talent.spirit_blades.title=灵能飞刃
actors.hero.talent.spirit_blades.desc=_+1：_灵魂飞刃有_30%_的概率额外使用灵能弓的附魔。\n\n_+2：_灵魂飞刃有_60%_的概率额外使用灵能弓的附魔。\n\n_+3：_灵魂飞刃有_90%_的概率额外使用灵能弓的附魔。\n\n_+4：_灵魂飞刃有_100%_的概率额外使用灵能弓的附魔，且每种附魔都获得_10%的附魔强化_。

actors.hero.talent.growing_power.title=茁壮之力
actors.hero.talent.growing_power.desc=_+1：_自然之力对射击速度与移动速度的加成由33%与100%提升至_38%_与_125%_。\n\n_+2：_自然之力对射击速度与移动速度的加成由33%与100%提升至_42%_与_150%_。\n\n_+3：_自然之力对射击速度与移动速度的加成由33%与100%提升至_46%_与_175%_。\n\n_+4：_自然之力对射击速度与移动速度的加成由33%与100%提升至_50%_与_200%_。
actors.hero.talent.natures_wrath.title=自然之怒
actors.hero.talent.natures_wrath.desc=_+1：_在自然之力的加持下，灵能弓的射击有_8%的概率_触发一个随机的有害植物效果。\n\n_+2：_在自然之力的加持下，灵能弓的射击有_17%的概率_触发一个随机的有害植物效果。\n\n_+3：_在自然之力的加持下，灵能弓的射击有_25%的概率_触发一个随机的有害植物效果。\n\n_+4：_在自然之力的加持下，灵能弓的射击有_33%的概率_触发一个随机的有害植物效果。\n\n可能触发的植物有：致盲草、烈焰花、冰冠花、断肠苔、风暴藤。
actors.hero.talent.wild_momentum.title=自然飞矢
actors.hero.talent.wild_momentum.desc=_+1：_使用灵能弓射杀一名敌人时，延长_1回合_自然之力，最多延长_2回合_。\n\n_+2：_使用灵能弓射杀一名敌人时，延长_2回合_自然之力，最多延长_4回合_。\n\n_+3：_使用灵能弓射杀一名敌人时，延长_3回合_自然之力，最多延长_6回合_。\n\n_+4：_使用灵能弓射杀一名敌人时，延长_4回合_自然之力，最多延长_8回合_。

actors.hero.talent.eagle_eye.title=鹰之瞭望
actors.hero.talent.eagle_eye.desc=_+1：_飞鹰的视野范围由6格提升至_7格_。\n\n_+2：_飞鹰的视野范围由6格提升至_8格_。\n\n_+3：_飞鹰的视野范围由6格提升至_9格_，并获得_2格_的灵视感知。\n\n_+4：_飞鹰的视野范围由6格提升至_10格_，并获得_3格_的灵视感知。
actors.hero.talent.go_for_the_eyes.title=夺目利爪
actors.hero.talent.go_for_the_eyes.desc=_+1：_飞鹰在攻击时会扑抓敌人的眼睛并令其致盲_2回合_。\n\n_+2：_飞鹰在攻击时会扑抓敌人的眼睛并令其致盲_5回合_。\n\n_+3：_飞鹰在攻击时会扑抓敌人的眼睛并令其致盲_5回合_，并附加_2回合_的残废。\n\n_+4：_飞鹰在攻击时会扑抓敌人的眼睛并令其致盲_5回合_，并附加_5回合_的残废。
actors.hero.talent.swift_spirit.title=疾风之魄
actors.hero.talent.swift_spirit.desc=_+1：_飞鹰的移动速度由每回合2格提升至_2.5格_，必定闪避其遭到的前_2次攻击_。\n\n_+2：_飞鹰的移动速度由每回合2格提升至_3格_，必定闪避其遭到的前_4次攻击_。\n\n_+3：_飞鹰的移动速度由每回合2格提升至_3.5格_，必定闪避其遭到的前_6次攻击_。\n\n_+4：_飞鹰的移动速度由每回合2格提升至_4格_，必定闪避其遭到的前_8次攻击_。

#duelist
actors.hero.talent.strengthening_meal.title=强健一餐
actors.hero.talent.strengthening_meal.desc=_+1：_进食会使决斗家接下来对敌人造成的_2次物理攻击_增加3点额外伤害。\n\n_+2：_进食会使决斗家接下来对敌人造成的_3次物理攻击_增加3点额外伤害。
actors.hero.talent.adventurers_intuition.title=探险直觉
actors.hero.talent.adventurers_intuition.desc=_+1：_决斗家鉴定武器的速度提升至原来的_2.5倍_，鉴定护甲的速度提升至原来的_1.75倍_。\n_+2：_决斗家能在_装备武器时_将其直接鉴定，且鉴定护甲的速度提升至原来的_2.5倍_。
actors.hero.talent.patient_strike.title=沉稳一击
actors.hero.talent.patient_strike.desc=_+1：_如果决斗家在进行一次近战攻击前进行等待，该次攻击将会造成_1~2点额外伤害_。\n_+2：_如果决斗家在进行一次近战攻击前进行等待，该次攻击将会造成_2点额外伤害_。
actors.hero.talent.aggressive_barrier.title=烈气护盾
actors.hero.talent.aggressive_barrier.desc=_+1：_决斗家在生命值不高于50%最大生命值时，使用武技会获得_3点护盾_。\n\n_+2：_决斗家在生命值不高于50%最大生命值时，使用武技会获得_5点护盾_。
actors.hero.talent.aggressive_barrier.meta_desc=_如果这个天赋被其它英雄获得_，那么此天赋变为在低生命值时使用近战攻击获得此护盾。此时这个天赋有50回合的冷却时间。

actors.hero.talent.focused_meal.title=专注一餐
actors.hero.talent.focused_meal.desc=_+1：_决斗家进食只花费1回合，并获得_0.67点武技充能_。\n\n_+2：_决斗家进食只花费1回合，并获得_1点武技充能_。
actors.hero.talent.focused_meal.meta_desc=_如果这个天赋被其它英雄获得_，那么它会在+1等级时使英雄的下一次物理攻击额外造成英雄等级/3点伤害，+2等级时额外造成英雄等级/2点伤害。
actors.hero.talent.liquid_agility.title=液蕴机敏
actors.hero.talent.liquid_agility.desc=_+1：_决斗家在饮用或投掷一瓶药剂、魔药或秘药的期间拥有_4倍闪避_，并且她在5回合内的下一次近战攻击拥有_3倍精准_。\n\n_+2：_决斗家在饮用或投掷一瓶药剂、魔药或秘药的期间拥有_无限闪避_，并且她在5回合内的下一次近战攻击拥有_无限精准_。\n\n如果使用的是力量药剂、经验药剂或须用前述药剂炼制的炼金物品，则闪避加成会额外持续一回合，精准加成会额外持续一次攻击。\n\n对产量较高的炼金物品(如水爆魔药)，这项天赋会基于该物品的单次产出数量概率触发。
actors.hero.talent.weapon_recharging.title=武器充能
actors.hero.talent.weapon_recharging.desc=_+1：_决斗家在处于法杖或神器充能状态时，每_15回合_恢复1点武技充能。\n\n_+2：_决斗家在处于法杖或神器充能状态时，每_10回合_恢复1点武技充能。
actors.hero.talent.weapon_recharging.meta_desc=_如果这个天赋被其它英雄获得_，那么处于任一充能状态的情况下，+1时造成额外5%近战伤害，+2时造成额外7.5%近战伤害。
actors.hero.talent.lethal_haste.title=夺命余势
actors.hero.talent.lethal_haste.desc=_+1：_决斗家用武技击杀一名敌人后，获得_3回合_瞬间移动效果。\n\n_+2：_决斗家用武技击杀一名敌人后，获得_5回合_瞬间移动效果。
actors.hero.talent.lethal_haste.meta_desc=_如果这个天赋被其它英雄获得_，那么此天赋可以由常规的武器攻击触发，但会有100回合的冷却时间。
actors.hero.talent.swift_equip.title=迅疾配装
actors.hero.talent.swift_equip.desc=_+1：_决斗家每20回合可以瞬时更换_一次_装备的武器。\n\n_+2：_决斗家每20回合可以瞬时更换_两次_装备的武器。\n\n当决斗家获得此天赋，且其不处于冷却时间时，点击快捷栏中的未装备武器时会瞬时装备。

actors.hero.talent.precise_assault.title=精准打击
actors.hero.talent.precise_assault.desc=_+1：_当决斗家使用了一个武技，她在5回合内的下一次近战攻击将具有_2倍精准_。\n\n_+2：_当决斗家使用了一个武技，她在5回合内的下一次近战攻击将具有_5倍精准_。\n\n_+3：_当决斗家使用了一个武技，她在5回合内的下一次近战攻击将具有_无限精准_。
actors.hero.talent.precise_assault.meta_desc=_如果这个天赋被其它英雄获得_，那么它会在+1/+2/+3等级时提升10/20/30%的近战精准。
actors.hero.talent.deadly_followup.title=夺命追击
actors.hero.talent.deadly_followup.desc=_+1：_当决斗家使用投掷武器命中敌人，她在随后5回合对其造成的近战伤害增加_10%_。\n\n_+2：_当决斗家使用投掷武器命中敌人，她在随后5回合对其造成的近战伤害增加_20%_。\n\n_+3：_当决斗家使用投掷武器命中敌人，她在随后5回合对其造成的近战伤害增加_30%_。

actors.hero.talent.varied_charge.title=异技充能
actors.hero.talent.varied_charge.desc=_+1：_当勇士分别使用了两种不同的武技时，她将立即获得_0.17点武技充能_。使用两种武技间隔的回合数没有限制。\n\n_+2：_当勇士分别使用了两种不同的武技时，她将立即获得_0.33点武技充能_。使用两种武技间隔的回合数没有限制。\n\n_+3：_当勇士分别使用了两种不同的武技时，她将立即获得_0.5点武技充能_。使用两种武技间隔的回合数没有限制。
actors.hero.talent.twin_upgrades.title=伴生强化
actors.hero.talent.twin_upgrades.desc=_+1：_如果勇士所双持的武器，其中一把等级较低且阶数比另一把_低出至少2阶_，则将其等级加强至与另一把相同。\n\n_+2：_如果勇士所双持的武器，其中一把等级较低且阶数比另一把_低出至少1阶_，则将其等级加强至与另一把相同。\n\n_+3：_如果勇士所双持的武器，其中一把等级较低且阶数_不高于_另一把，则将其等级加强至与另一把相同。
actors.hero.talent.combined_lethality.title=复合损伤
actors.hero.talent.combined_lethality.desc=_+1：_如果勇士在使用一把武器的武技后立刻使用不同的近战武器进行攻击，则此次攻击将处决_生命值低于13%_的非Boss敌人。\n\n_+2：_如果勇士在使用一把武器的武技后立刻用不同的近战武器进行攻击，则此次攻击将处决_生命值低于27%_的非Boss敌人\n\n_+3：_如果勇士在使用一把武器的武技后立刻用不同的近战武器进行攻击，则此次攻击将处决_生命值低于40%_的非Boss敌人。\n\n此次攻击可以是一次普通的近战武器攻击，也可以是武技中的一部分。

actors.hero.talent.unencumbered_spirit.title=无羁之魂
actors.hero.talent.unencumbered_spirit.desc=_+1：_每使用一件_3阶及以下_的装备，武僧获取的内力就会_+50%_。\n\n_+2：_每使用一件_2阶及以下_的装备，武僧获取的内力就会_+75%_。3阶装备收益不变。\n\n_+3：_每使用一件_1阶_的装备，武僧获取的内力就会_+100%_。2，3阶装备收益不变。她还会免费获得一件布甲与一副镶钉手套。\n\n注意，使用赤手空拳或武力之戒攻击时该天赋无收益。
actors.hero.talent.monastic_vigor.title=道心盎然
actors.hero.talent.monastic_vigor.desc=_+1：_如果武僧拥有_100%的内力_，则各门武功会得到突破。\n\n_+2：_如果武僧拥有_80%的内力_，则各门武功会得到突破。\n\n_+3：_如果武僧拥有_60%的内力_，则各门武功会得到突破。\n\n当处于突破状态：\n-空振使用你的武器附魔。\n-凝神不消耗回合。\n-登云的冲刺距离+4。\n-盘龙造成的伤害+50%，可击退并击晕所有邻近的敌人。\n-冥思可缓慢回复20%的已损生命值并提供80%的伤害抗性。
actors.hero.talent.combined_energy.title=阴阳调和
actors.hero.talent.combined_energy.desc=_+1：_如果武僧在5回合内使用了一次武技与一门_4+内力消耗_的武功，她就会回复1点内力。\n\n_+2：_如果武僧在5回合内使用了一次武技与一门_3+内力消耗_的武功，她就会回复1点内力。\n\n_+3：_如果武僧在5回合内使用了一次武技与一门_2+内力消耗_的武功，她就会回复1点内力。

actors.hero.talent.close_the_gap.title=跨越彼端
actors.hero.talent.close_the_gap.desc=_+1：_发起决斗时，决斗家会向她的目标闪现_至多2格_距离。\n\n_+2：_发起决斗时，决斗家会向她的目标闪现_至多3格_距离。\n\n_+3：_发起决斗时，决斗家会向她的目标闪现_至多4格_距离。\n\n_+4：_发起决斗时，决斗家会向她的目标闪现_至多5格_距离。\n\n这种闪现可以越过危险地形或敌人，但不能穿透墙壁等坚固地形。闪现距离也会纳入决斗发起距离的判定。
actors.hero.talent.invigorating_victory.title=凯旋复苏
actors.hero.talent.invigorating_victory.desc=_+1：_如果决斗家在决斗结束前击败了目标，则恢复_5+30%决斗中承伤_的生命值。\n\n_+2：_如果决斗家在决斗结束前击败了目标，则恢复_10+50%决斗中承伤_的生命值。\n\n_+3：_如果决斗家在决斗结束前击败了目标，则恢复_15+65%决斗中承伤_的生命值。\n\n_+4：_如果决斗家在决斗结束前击败了目标，则恢复_20+75%决斗中承伤_的生命值。
actors.hero.talent.elimination_match.title=连续淘汰
actors.hero.talent.elimination_match.desc=_+1：_如果决斗家在决斗结束之后的3回合内再次发起决斗，那么该次决斗消耗的充能_减少16%_。\n\n_+2：_如果决斗家在决斗结束之后的3回合内再次发起决斗，那么该次决斗消耗的充能_减少30%_。\n\n_+3：_如果决斗家在决斗结束之后的3回合内再次发起决斗，那么该次决斗消耗的充能_减少40%_。\n\n_+4：_如果决斗家在决斗结束之后的3回合内再次发起决斗，那么该次决斗消耗的充能_减少50%_。

actors.hero.talent.elemental_reach.title=元素延展
actors.hero.talent.elemental_reach.desc=_+1：_元素打击的效果范围由4格扩大至_5格_，扩散角度由65度展宽至_75度_。\n\n_+2：_元素打击的效果范围由4格扩大至_6格_，扩散角度由65度展宽至_85度_。\n\n_+3：_元素打击的效果范围由4格扩大至_7格_，扩散角度由65度展宽至_95度_。\n\n_+4：_元素打击的效果范围由4格扩大至_8格_，扩散角度由65度展宽至_105度_。
actors.hero.talent.striking_force.title=强力打击
actors.hero.talent.striking_force.desc=_+1：_元素打击的效果强度提升_30%_。\n\n_+2：_元素打击的效果强度提升_60%_。\n\n_+3：_元素打击的效果强度提升_90%_。\n\n_+4：_元素打击的效果强度提升_120%_。
actors.hero.talent.directed_power.title=能量导引
actors.hero.talent.directed_power.desc=_+1：_元素打击效果范围内每有一个敌人，对主要目标的直接攻击就会获得_+30%附魔强度_。\n\n_+2：_元素打击效果范围内每有一个敌人，对主要目标的直接攻击就会获得_+60%附魔强度_。\n\n_+3：_元素打击效果范围内每有一个敌人，对主要目标的直接攻击就会获得_+90%附魔强度_。\n\n_+4：_元素打击效果范围内每有一个敌人，对主要目标的直接攻击就会获得_+120%附魔强度_。

actors.hero.talent.feigned_retreat.title=佯装撤退
actors.hero.talent.feigned_retreat.desc=_+1：_如果一个敌人攻击了决斗家的残影，那么决斗家会获得_2回合_极速。\n\n_+2：_如果一个敌人攻击了决斗家的残影，那么决斗家会获得_4回合_极速。\n\n_+3：_如果一个敌人攻击了决斗家的残影，那么决斗家会获得_6回合_极速。\n\n_+4：_如果一个敌人攻击了决斗家的残影，那么决斗家会获得_8回合_极速。
actors.hero.talent.expose_weakness.title=弱点看破
actors.hero.talent.expose_weakness.desc=_+1：_攻击了决斗家残影的敌人会获得_2回合_虚弱和易伤。\n\n_+2：_攻击了决斗家残影的敌人会获得_4回合_虚弱和易伤。\n\n_+3：_攻击了决斗家残影的敌人会获得_6回合_虚弱和易伤。\n\n_+4：_攻击了决斗家残影的敌人会获得_8回合_虚弱和易伤。
actors.hero.talent.counter_ability.title=武技反击
actors.hero.talent.counter_ability.desc=_+1：_如果决斗家在残影受到攻击后的3回合内使用了一次武技，那么她将立即回复_0.38点武技充能_。\n\n_+2：_如果决斗家在残影受到攻击后的3回合内使用了一次武技，那么她将立刻回复_0.77点武技充能_。\n\n_+3：_如果决斗家在残影受到攻击后的3回合内使用了一次武技，那么她将立刻回复_1.13点武技充能_。\n\n_+4：_如果决斗家在残影受到攻击后的3回合内使用了一次武技，那么她将立刻回复_1.5点武技充能_。

#cleric
actors.hero.talent.satiated_spells.title=圣餐礼文
actors.hero.talent.satiated_spells.desc=_+1：_进食会使牧师在下一次施法时为其提供_3点护盾_。\n\n_+2：_进食会使牧师在下一次施法时为其提供_5点护盾_。
actors.hero.talent.satiated_spells.meta_desc=_如果这个天赋被其它英雄获得_，那么它会立即给予将在10回合后开始正常衰减的护盾。
actors.hero.talent.holy_intuition.title=神圣预知
actors.hero.talent.holy_intuition.desc=_+1：_牧师可以施放法术_神圣预知_，消耗_3点充能_以揭示物品有无诅咒。\n\n_+2：_牧师可以施放法术_神圣预知_，消耗_2点充能_以揭示物品有无诅咒。
actors.hero.talent.holy_intuition.meta_desc=_如果这个天赋被其它英雄获得_，那么它会在+1/+2等级时使英雄有15%/25%的概率在装备诅咒装备之前将其鉴定。
actors.hero.talent.searing_light.title=灼热之光
actors.hero.talent.searing_light.desc=_+1：_牧师对被_神导之光_施加光耀的敌人的物理攻击造成_3点额外伤害_。\n\n_+2：_牧师对被_神导之光_施加光耀的敌人的物理攻击造成_5点额外伤害_。
actors.hero.talent.searing_light.meta_desc=_如果这个天赋被其它英雄获得_，那么它会使攻击在对敌人使用法杖或神器后造成额外伤害，带有20回合的冷却时间。
actors.hero.talent.shield_of_light.title=神圣护盾
actors.hero.talent.shield_of_light.desc=_+1：_牧师可以施放法术_神圣护盾_，消耗1点充能以立即获得在5回合内仅对指定目标有效的_2~4点护甲_。\n\n_+2：_牧师可以施放法术_神圣护盾_，消耗1点充能以立即获得在5回合内仅对指定目标有效的_3~6点护甲_。
actors.hero.talent.shield_of_light.meta_desc=_如果这个天赋被其它英雄获得_，那么它会在+1/+2等级时有33/50%的概率减少作为你的攻击目标的敌人所造成的1点物理伤害。

actors.hero.talent.enlightening_meal.title=启蒙圣餐
actors.hero.talent.enlightening_meal.desc=_+1：_牧师进食只花费1回合，并获得_0.67点圣典充能_。\n\n_+2：_牧师进食只花费1回合，并获得_1点圣典充能_。
actors.hero.talent.enlightening_meal.meta_desc=_如果这个天赋被其它英雄获得_，那么它会在+1/+2等级时使英雄获得2/3回合的法杖充能和神器充能效果。这项天赋不能使丰饶之角对其本身充能。
actors.hero.talent.recall_inscription.title=卷藏咒言
actors.hero.talent.recall_inscription.refunded=你的物品已被返还！
actors.hero.talent.recall_inscription.desc=_+1：_牧师可以施放法术_卷藏咒言_，以再次触发_10回合_内最近一次使用的符石或卷轴效果。\n\n_+2：_牧师可以施放法术_卷藏咒言_，以再次触发_300回合_内最近一次使用的符石或卷轴效果。\n\n卷藏咒言不能复制升级卷轴，充能消耗根据最近一次使用的物品变化而变化：符石2点充能、卷轴3点充能、秘卷4点充能。复制嬗变卷轴或嬗变/升级卷轴的符石/秘卷时，充能消耗还会翻倍。
actors.hero.talent.recall_inscription.meta_desc=_如果这个天赋被其它英雄获得_，那么它会在+1/+2等级时有10%/15%的概率返还升级卷轴除外的任何卷轴或符石。
actors.hero.talent.sunray.title=阳炎射线
actors.hero.talent.sunray.desc=_+1：_牧师可以施放法术_阳炎射线_，消耗1点充能造成_4~8_点伤害并使目标失明_4回合_。\n\n_+2：_牧师可以施放法术_阳炎射线_，消耗1点充能造成_6~12_点伤害并使目标失明_6回合_。\n\n阳炎射线只能致盲目标一次，但若目标已被阳炎射线致盲则会以麻痹代之。阳炎射线必定对恶魔和亡灵敌人造成最大伤害。
actors.hero.talent.sunray.meta_desc=_如果这个天赋被其它英雄获得_，那么它会在+1/+2等级时使法杖或神器有15%/25%的概率致盲敌人4回合。
actors.hero.talent.divine_sense.title=神圣感知
actors.hero.talent.divine_sense.desc=_+1：_牧师可以施放法术_神圣感知_，消耗2点充能以不耗时获得持续50回合，_8格范围_的灵视感知。\n\n_+2：_牧师可以施放法术_神圣感知_，消耗2点充能以不耗时获得持续50回合，_12格范围_的灵视感知。
actors.hero.talent.divine_sense.meta_desc=_如果这个天赋被其它英雄获得_，那么它会在+1/+2等级时使英雄在使用法杖或神器后暂时获得3/5格内的灵视感知。
actors.hero.talent.bless.title=神圣祝福
actors.hero.talent.bless.desc=_+1：_牧师可以施放法术_神圣祝福_，消耗1点充能以使自身获得_6回合赐福与10点护盾_或使其他单位获得_10回合赐福与10点治疗_。\n\n_+2：_牧师可以施放法术_神圣祝福_，消耗1点充能以使自身获得_10回合赐福与15点护盾_或使其他单位获得_15回合赐福与15点治疗_。\n\n该法术的溢出治疗将被转化为护盾。
actors.hero.talent.bless.meta_desc=_如果这个天赋被其它英雄获得_，那么它会在+1/+2等级时提升英雄和所有盟友3%/5%的精准和闪避。

actors.hero.talent.cleanse.title=神圣净化
actors.hero.talent.cleanse.desc=_+1：_牧师可以施放法术_神圣净化_，消耗2点充能以使自身和附近任何盟友_清除负面状态效果_并获得_10点护盾_。\n\n_+2：_牧师可以施放法术_神圣净化_，消耗2点充能以使自身和附近任何盟友获得_3回合全面净化_与_20点护盾_。\n\n_+3：_牧师可以施放法术_神圣净化_，消耗2点充能以使自身和附近任何盟友获得_5回合全面净化_与_30点护盾_。
actors.hero.talent.cleanse.meta_desc=_如果这个天赋被其它英雄获得_，那么它会在+1/+2/+3等级时使英雄在使用法杖或神器后有10/20/30%的概率净化负面状态效果。
actors.hero.talent.light_reading.title=轻量阅读
actors.hero.talent.light_reading.desc=_+1：_牧师不装备圣典也能使用其功能，但未装备时圣典的充能速率会降至_25%_。\n\n_+2：_牧师不装备圣典也能使用其功能，但未装备时圣典的充能速率会降至_50%_。\n\n_+3：_牧师不装备圣典也能使用其功能，但未装备时圣典的充能速率会降至_75%_。
actors.hero.talent.light_reading.meta_desc=_如果这个天赋被其它英雄获得_，那么它会在+1/+2/+3等级时提升7/13/20%的所有法杖充能速度。

actors.hero.talent.holy_lance.title=神圣标枪
actors.hero.talent.holy_lance.desc=_+1：_祭司可以施放法术_神圣标枪_，消耗4点充能以造成致命的_30~55点伤害_。\n\n_+2：_祭司可以施放法术_神圣标枪_，消耗4点充能以造成致命的_45~83点伤害_。\n\n_+3：_祭司可以施放法术_神圣标枪_，消耗4点充能以造成致命的_60~110点伤害_。\n\n圣枪必定对恶魔和亡灵敌人造成最大伤害。圣枪有30回合的冷却，之后才能再次施放。
actors.hero.talent.hallowed_ground.title=神圣领域
actors.hero.talent.hallowed_ground.desc=_+1：_祭司可以施放法术_神圣领域_，消耗2点充能以创造_3x3范围_，持续20回合的神圣领域。\n\n_+2：_祭司可以施放法术_神圣领域_，消耗2点充能以创造_5x5范围_，持续20回合的神圣领域。\n\n_+3：_祭司可以施放法术_神圣领域_，消耗2点充能以创造_7x7范围_，持续20回合的神圣领域。\n\n施放时，法术会立即治疗盟友15点生命值，短暂缠绕敌人并扩散矮草。之后，神圣领域会缓慢治疗盟友、残疾敌人并随机催生高草。神圣领域会为祭司提供护盾而非治疗，并且神圣领域会被火焰摧毁。
actors.hero.talent.mnemonic_prayer.title=祈愿诗篇
actors.hero.talent.mnemonic_prayer.desc=_+1：_祭司可以施放法术_祈愿诗篇_，消耗1点充能以延长_3回合_盟友/敌人的增益/减益效果。\n\n_+2：_祭司可以施放法术_祈愿诗篇_，消耗1点充能以延长_4回合_盟友/敌人的增益/减益效果。\n\n_+3：_祭司可以施放法术_祈愿诗篇_，消耗1点充能以延长_5回合_盟友/敌人的增益/减益效果。\n\n祈愿诗篇施法不耗时。祈愿诗篇只能延长一次特定目标的增益或减益效果，并且不能延长来自护甲技能的增益效果。

actors.hero.talent.lay_on_hands.title=圣疗之触
actors.hero.talent.lay_on_hands.desc=_+1：_圣骑士可以施放法术_圣疗之触_，消耗1点充能以立即治疗附近一个单位_15点生命值_，或使圣骑士获得_15点护盾_。\n\n_+2：_圣骑士可以施放法术_圣疗之触_，消耗1点充能以立即治疗附近一个单位_20点生命值_，或使圣骑士获得_20点护盾_。\n\n_+3：_圣骑士可以施放法术_圣疗之触_，消耗1点充能以立即治疗附近一个单位_25点生命值_，或使圣骑士获得_25点护盾_。\n\n该法术的溢出治疗将被转化为护盾。圣疗可被重复施放，但无法立即施加超过三次施法数值的护盾。
actors.hero.talent.aura_of_protection.title=守御灵光
actors.hero.talent.aura_of_protection.desc=_+1：_圣骑士可以施放法术_守御灵光_，消耗2点充能以使圣骑士与2格范围内的所有盟友获得_20%伤害减免_与圣骑士护甲_50%刻印强化_。\n\n_+2：_圣骑士可以施放法术_守御灵光_，消耗2点充能以使圣骑士与2格范围内的所有盟友获得_30%伤害减免_与圣骑士护甲_75%刻印强化_。\n\n_+3：_圣骑士可以施放法术_守御灵光_，消耗2点充能以使圣骑士与2格范围内的所有盟友获得_40%伤害减免_与圣骑士护甲_100%刻印强化_。
actors.hero.talent.wall_of_light.title=神圣屏障
actors.hero.talent.wall_of_light.desc=_+1：_圣骑士可以施放法术_神圣屏障_，消耗3点充能以在圣骑士面前创造一面持续20回合，_3格宽_，可击退敌人的坚固墙壁。\n\n_+2：_圣骑士可以施放法术_神圣屏障_，消耗3点充能以在圣骑士面前创造一面持续20回合，_5格宽_，可击退敌人的坚固墙壁。\n\n_+3：_圣骑士可以施放法术_神圣屏障_，消耗3点充能以在圣骑士面前创造一面持续20回合，_7格宽_，可击退敌人的坚固墙壁。\n\n神圣屏障可被正向或斜向施放，同时只能存在一面屏障。

actors.hero.talent.divine_intervention.title=神圣干预
actors.hero.talent.divine_intervention.desc=_+1：_开启超凡升天时，牧师可以施放法术_神圣干预_，以强化牧师与所有盟友的护盾至_150点_并延长超凡升天_3回合_。\n\n_+2：_开启超凡升天时，牧师可以施放法术_神圣干预_，以强化牧师与所有盟友的护盾至_200点_并延长超凡升天_4回合_。\n\n_+3：_开启超凡升天时，牧师可以施放法术_神圣干预_，以强化牧师与所有盟友的护盾至_250点_并延长超凡升天_5回合_。\n\n_+4：_开启超凡升天时，牧师可以施放法术_神圣干预_，以强化牧师与所有盟友的护盾至_300点_并延长超凡升天_6回合_。\n\n神圣干预消耗高达5点圣典充能，并且在同次超凡升天中只能施放一次神圣干预。
actors.hero.talent.judgement.title=终末天启
actors.hero.talent.judgement.desc=_+1：_开启超凡升天时，牧师可以施放法术_终末天启_，以对视野内所有敌人造成_10~20点伤害_。\n\n_+2：_开启超凡升天时，牧师可以施放法术_终末天启_，以对视野内所有敌人造成_15~30点伤害_。\n\n_+3：_开启超凡升天时，牧师可以施放法术_终末天启_，以对视野内所有敌人造成_20~40点伤害_。\n\n_+4：_开启超凡升天时，牧师可以施放法术_终末天启_，以对视野内所有敌人造成_25~50点伤害_。\n\n终末天启消耗3点圣典充能。牧师自进入超凡升天以来或自上次施放终末天启以来的每次施法都会额外造成33%伤害。
actors.hero.talent.flash.title=天堂阶梯
actors.hero.talent.flash.desc=_+1：_开启超凡升天时，牧师可以施放法术_天堂阶梯_，以传送至最多_3格_外。\n\n_+2：_开启超凡升天时，牧师可以施放法术_天堂阶梯_，以传送至最多_4格_外。\n\n_+3：_开启超凡升天时，牧师可以施放法术_天堂阶梯_，以传送至最多_5格_外。\n\n_+4：_开启超凡升天时，牧师可以施放法术_天堂阶梯_，以传送至最多_6格_外。\n\n天堂阶梯初始消耗2点圣典充能，并且在同次开启超凡升天时每次施放都会+1充能消耗。

actors.hero.talent.body_form.title=体之位格
actors.hero.talent.body_form.desc=牧师可以施放法术_体之位格_，消耗2点充能以使三位一体模拟牧师本局已鉴定的附魔或刻印。\n\n_+1：_使用三位一体时，牧师会获得所选附魔或刻印的效果_20回合_。\n\n_+2：_使用三位一体时，牧师会获得所选附魔或刻印的效果_27回合_。\n\n_+3：_使用三位一体时，牧师会获得所选附魔或刻印的效果_33回合_。\n\n_+4：_使用三位一体时，牧师会获得所选附魔或刻印效果_40回合_。\n\n三位一体同时只能模拟一种体之位格效果。选择罕见而强力的刻印时，三位一体的护甲充能消耗更高。
actors.hero.talent.mind_form.title=智之位格
actors.hero.talent.mind_form.desc=牧师可以施放法术_智之位格_，消耗3点充能以使三位一体模拟牧师本局已使用的法杖或投武。\n\n_+1：_使用三位一体时，牧师会使用所选法杖或投武的_3级_效果。\n\n_+2：_使用三位一体时，牧师会使用所选法杖或投武的_4级_效果。\n\n_+3：_使用三位一体时，牧师会使用所选法杖或投武的_5级_效果。\n\n_+4：_使用三位一体时，牧师会使用所选法杖或投武的_6级_效果。\n\n三位一体同时只能模拟一种智之位格效果。
actors.hero.talent.spirit_form.title=魂之位格
actors.hero.talent.spirit_form.desc=牧师可以施放法术_魂之位格_，消耗4点充能以使三位一体模拟牧师本局已鉴定的戒指或神器(神圣法典除外)。\n\n_+1：_使用三位一体时，牧师会获得所选戒指的_1级_效果20回合或使用所选神器的_4级_效果。\n\n_+2：_使用三位一体时，牧师会获得所选戒指的_2级_效果20回合或使用所选神器的_6级_效果。\n\n_+3：_使用三位一体时，牧师会获得所选戒指的_3级_效果20回合或使用所选神器的_8级_效果。\n\n_+4：_使用三位一体时，牧师会获得所选戒指的_4级_效果20回合或使用所选神器的_10级_效果。\n\n三位一体同时只能模拟一种魂之位格效果。通过三位一体使用神器时效果与护甲充能消耗因神器而异。

actors.hero.talent.beaming_ray.title=光灵召唤
actors.hero.talent.beaming_ray.desc=牧师可以施放法术_光灵召唤_，消耗1点充能以使强化盟友释放传送光束。光束可穿透墙壁并传送盟友至指定位置。若该位置有敌人，盟友会出现在敌人附近并将其作为攻击目标。该法术还可传送通常情况下无法移动的盟友，但若如此做则传送光束范围减半。\n\n_+1：_传送光束的最大范围为_4格_，并使万物一心对最近敌人的伤害加成提升至_35%_，持续10回合。\n\n_+2：_传送光束的最大范围为_8格_，并使万物一心对最近敌人的伤害加成提升至_40%_，持续10回合。\n\n_+3：_传送光束的最大范围为_12格_，并使万物一心对最近敌人的伤害加成提升至_45%_，持续10回合。\n\n_+4：_传送光束的最大范围为_16格_，并使万物一心对最近敌人的伤害加成提升至_50%_，持续10回合。
actors.hero.talent.life_link.title=血色羁绊
actors.hero.talent.life_link.desc=牧师可以施放法术_血色羁绊_，消耗2点充能以使牧师自身与强化盟友之间建立生命联结。该法术会使牧师与其盟友共享所受伤害，并使3阶及以下的增益型牧师法术对任何一方施放时对双方均生效。\n\n_+1：_生命联结持续_10回合_并使万物一心的伤害减免提升至_35%_。\n\n_+2：_生命联结持续_13回合_并使万物一心的伤害减免提升至_40%_。\n\n_+3：_生命联结持续_17回合_并使万物一心的伤害减免提升至_45%_。\n\n_+4：_生命联结持续_20回合_并使万物一心的伤害减免提升至_50%_。
actors.hero.talent.stasis.title=星界投射
actors.hero.talent.stasis.desc=牧师可以施放法术_星界投射_，消耗2点充能以凝滞强化盟友。该法术会将盟友临时移出地牢，并保留其包括万物一心在内的所有增益效果的剩余时间。当法术效果结束时盟友会在你附近再次出现。该法术可被无消耗地立即再次施放，以提前结束法术效果。该法术对无法移动的盟友也会生效，但无法将其跨层移动。\n\n_+1：_凝滞状态最多持续_60回合_。\n\n_+2：_凝滞状态最多持续_90回合_。\n\n_+3：_凝滞状态最多持续_120回合_。\n\n_+4：_凝滞状态最多持续_150回合_。\n\n当有盟友处于凝滞状态时，牧师还可施放光灵召唤以再次召唤盟友，或施放血色羁绊以使盟友提前获得法术效果。然而，凝滞状态下的盟友无法从血色羁绊的法术效果中获得效益。


#universal
actors.hero.talent.heroic_energy.title=英勇能量
actors.hero.talent.heroic_energy.rat_title=阴勇能量
actors.hero.talent.heroic_energy.desc=_+1：_发动英雄护甲能力的充能消耗_减少12%_。\n\n_+2：_发动英雄护甲能力的充能消耗_减少23%_。\n\n_+3：_发动英雄护甲能力的充能消耗_减少32%_。\n\n_+4：_发动英雄护甲能力的充能消耗_减少40%_。

actors.hero.talent.ratsistance.title=鼠手鼠脚
actors.hero.talent.ratsistance.desc=_+1：_被鼠化的敌人造成的伤害会降低_10%_。\n\n_+2：_被鼠化的敌人造成的伤害会降低_19%_。\n\n_+3：_被鼠化的敌人造成的伤害会降低_27%_。\n\n_+4：_被鼠化的敌人造成的伤害会降低_35%_。
actors.hero.talent.ratlomacy.title=外交鼠段
actors.hero.talent.ratlomacy.desc=_+1：_对被鼠化的敌人再次使用鼠化术会固化老鼠形态并将其永久转化为友军。\n\n_+2：_对被鼠化的敌人再次使用鼠化术会固化老鼠形态并将其永久转化为友军，并赋予其_2回合_的激素涌动。\n\n_+3：_对被鼠化的敌人再次使用鼠化术会固化老鼠形态并将其永久转化为友军，并赋予其_4回合_的激素涌动。\n\n_+4：_对被鼠化的敌人再次使用鼠化术会固化老鼠形态并将其永久转化为友军，并赋予其_6回合_的激素涌动。
actors.hero.talent.ratforcements.title=吱援部队
actors.hero.talent.ratforcements.desc=_+1：_以自身为目标使用鼠化术会在身边_召唤1只_友军啮齿小鼠。\n\n_+2：_以自身为目标使用鼠化术会在身边_召唤2只_友军啮齿小鼠。\n\n_+3：_以自身为目标使用鼠化术会在身边_召唤3只_友军啮齿小鼠。\n\n_+4：_以自身为目标使用鼠化术会在身边_召唤4只_友军啮齿小鼠。



###npcs
actors.mobs.npcs.blacksmith.name=巨魔铁匠
actors.mobs.npcs.blacksmith.intro_quest_warrior=嘿，人类！你看起来还挺强悍的。
actors.mobs.npcs.blacksmith.intro_quest_mage=嘿，人类！你看起来还挺聪明的。
actors.mobs.npcs.blacksmith.intro_quest_rogue=嘿，人类！你看起来还挺鬼祟的。
actors.mobs.npcs.blacksmith.intro_quest_huntress=嘿，人类！你看起来还挺敏捷的。
actors.mobs.npcs.blacksmith.intro_quest_duelist=嘿，人类！你看起来还挺勇猛的。
actors.mobs.npcs.blacksmith.intro_quest_cleric=嘿，人类！你看起来还挺正经的。
actors.mobs.npcs.blacksmith.intro_quest_spellsword=嘿，人类！你看起来还挺机灵的。
actors.mobs.npcs.blacksmith.intro_quest_start=不想当个没用的废物，对吗？正好，我这有活给你干。我在一座旧矿井上建造了这间铁匠铺，那里就是下去的梯子。拿着这把镐子然后给我挖点_暗金矿，40块_就够了。下面的石头不是很硬，_只要你用点力气连墙壁都能凿烂_。\n\n什么，要我如何报答你？真贪心...\n\n好吧，好吧，我可以给你打打铁。想想你运气有多好吧，我可是这附近唯一的铁匠。
actors.mobs.npcs.blacksmith.intro_quest_crystal=不过小心点，矿井对于你这种弱不禁风的人类来说太危险了。矿井被废弃有一段时间了，还有不少水晶长了出来。水晶亮闪闪的，但太脆了，一文不值，而且它们还被一些魔物保护着。那些东西很难缠，所以_注意点你挖矿的位置_，不然你就会引起它们的注意。\n\n下面还有个_巨型水晶_，还挺结实。如果你打算拆了它那你指定得打上一场。我敢打赌敲碎它就能减缓水晶的生长速度，所以你要是能把这活干了的话，我会再多给你点报酬。
actors.mobs.npcs.blacksmith.intro_quest_gnoll=不过小心点，矿井对于你这种弱不禁风的人类来说太危险了。一群豺狼人也想弄点暗金，正在下面搞破坏。这群蠢货，挖矿的时候弄出来一堆塌方落石。你应该得自己开条路出来了，所以_找找刚刚塌下来的岩石_。\n\n我记得有一个豺狼人是带头惹事的，可能是个_地卜萨满_之类的。你要是能拿下它的话，我会再多给你点报酬，不过我敢肯定它会还手。
actors.mobs.npcs.blacksmith.intro_quest_fungi=不过小心点，矿井对于你这种弱不禁风的人类来说太危险了。下面有某种魔菇长了出来。它们之中还有蘑菇哨卫，要是它们看见了你，你可得吃点苦头，不过它们没长腿倒是追不了你。还想活命的话就_别进入它们的视野内_。\n\n你要是能拿下_巨型蘑菇_的话，我会再多给你点报酬。不过它有点难缠，它与隐藏在墙壁中的菌丝节孢相连。你得拆掉其中的大部分节孢才能真正地对它造成伤害。
actors.mobs.npcs.blacksmith.reminder=还要接着浪费我的时间？矿井入口就在那呢。
actors.mobs.npcs.blacksmith.reminder_crystal=暗金多多益善，最好再拆了巨型水晶。
actors.mobs.npcs.blacksmith.reminder_gnoll=暗金多多益善，最好再杀了豺狼地卜师。
actors.mobs.npcs.blacksmith.reminder_fungi=暗金多多益善，最好再杀了巨型蘑菇。
actors.mobs.npcs.blacksmith.lost_pick=你在逗我？我的镐子呢？！
actors.mobs.npcs.blacksmith.quest_start_prompt=你准备好下去了？记得给包里留出暗金的位置。\n\n_我只准你下去一次！_
actors.mobs.npcs.blacksmith.enter_yes=我准备好了
actors.mobs.npcs.blacksmith.enter_no=还没有
actors.mobs.npcs.blacksmith.exit_warn_none=这就完了？你才挖到了几块暗金！怎么说你也能挖个_40块_。\n\n_别忘了，你爬上这个梯子就别想再下去了。_
actors.mobs.npcs.blacksmith.exit_warn_low=这就完了？看起来你挖到的暗金不多。怎么说你也能挖个_40块_。\n\n_别忘了，你爬上这个梯子就别想再下去了。_
actors.mobs.npcs.blacksmith.exit_warn_med=完了？你是挖到了几块暗金，不过下面肯定不止这点。怎么说你也能挖个_40块_。\n\n_别忘了，你爬上这个梯子就别想再下去了。_
actors.mobs.npcs.blacksmith.exit_warn_high=完了？看起来你挖到的暗金不少，不过对我来说还是多多益善。怎么说你也能挖个_40块_。\n\n_别忘了，你爬上这个梯子就别想再下去了。_
actors.mobs.npcs.blacksmith.exit_warn_full=完了？你是挖到了挺多暗金，不过可千万别在下面丢了什么东西。\n\n_别忘了，你爬上这个梯子就别想再下去了。_
actors.mobs.npcs.blacksmith.exit_warn_crystal=那个巨型水晶还在下面。你要是能拆了它，我会再多给你点报酬。
actors.mobs.npcs.blacksmith.exit_warn_gnoll=那个豺狼地卜师还在下面。你要是能杀了它，我会再多给你点报酬。
actors.mobs.npcs.blacksmith.exit_warn_fungi=那个巨型蘑菇还在下面。你要是能杀了它，我会再多给你点报酬。
actors.mobs.npcs.blacksmith.exit_yes=做完了
actors.mobs.npcs.blacksmith.exit_no=还没有
actors.mobs.npcs.blacksmith.get_lost=我忙着呢。滚开！
actors.mobs.npcs.blacksmith.entrance_blocked=下去的路被堵死了。
actors.mobs.npcs.blacksmith.cant_enter_old=那片区域在这场游戏中不可用。创建一个新游戏以尝试新任务！
actors.mobs.npcs.blacksmith.def_verb=格挡
actors.mobs.npcs.blacksmith.desc=这个巨魔铁匠看起来和任何其他巨魔一样：又高又瘦，皮肤的色泽和纹理都像是石头。这位巨魔铁匠正捏着一把与其体形极其不符的小锤子不停地修修补补。

actors.mobs.npcs.ghost.name=悲伤幽灵
actors.mobs.npcs.ghost.rat_1=你好，%s...曾几何时，我也如你这般——既强大又自信...直到被一只邪恶的野兽所害...我不能离开这个地方...除非完成复仇...杀死_腐臭老鼠_，就是它夺走了我的生命...\n\n它就在这一层游荡...四处散播污秽..._小心它的周边的恶臭云雾和腐蚀性的撕咬，它产生的酸性粘液可溶于水..._
actors.mobs.npcs.ghost.rat_2=请帮助我...杀了那个令人憎恶的东西...\n\n_在水附近与它战斗...躲开它的臭气..._
actors.mobs.npcs.ghost.gnoll_1=你好，%s...曾几何时，我也如你这般——既强大又自信...但我被一个狡猾的敌人杀死了...我不能离开这个地方...除非完成复仇...杀死_豺狼诡术师_，就是它夺走了我的生命...\n\n它与其他豺狼人不同...它会隐匿自身，还会使用投掷武器..._小心它的毒镖和火镖，尽量靠近它..._
actors.mobs.npcs.ghost.gnoll_2=请帮助我...杀了那个诡诈的家伙...\n\n_别让它打到你...离它越近越好..._
actors.mobs.npcs.ghost.crab_1=你好，%s...曾几何时，我也如你这般——既强大又自信...但我被一个古老的生物杀死了...我不能离开这个地方...除非完成复仇...杀死_巨钳螃蟹_，就是它夺走了我的生命...\n\n它经历了无数岁月的洗礼...有一个巨大的蟹钳和非常厚重的蟹壳..._小心它的蟹钳，你必须偷袭这只巨蟹，否则它会用钳子格挡你的攻击..._
actors.mobs.npcs.ghost.crab_2=请帮助我...杀了那个甲壳类...\n\n_如果它发现你...就会挡住你所有的攻击..._
actors.mobs.npcs.ghost.find_me=谢谢你...来找我吧...
actors.mobs.npcs.ghost.desc=这个幽灵几乎不可见。它看起来像是由一片无定形的昏暗光斑和一张悲痛的面孔所组成的。

actors.mobs.npcs.imp.name=野心勃勃的小恶魔
actors.mobs.npcs.imp.old_intro=你是个冒险家吗?我爱冒险家！如果有什么东西需要被解决的话，他们永远都能把活干好。我说的对吗?当然是在有赏金的前提下 ;)
actors.mobs.npcs.imp.old_golems_1=总之，我需要你杀一些_魔像_。你看，我要在这里开始搞点小本生意，但这些愚蠢的傀儡只会毁掉我的生意！跟这些发着光的大个子花岗岩根本没法交流，真是该死！所以请，杀死……我想想，_6个魔像_，然后奖励就是你的了。
actors.mobs.npcs.imp.old_monks_1=总之，我需要你杀一些_武僧_。你看，我要在这里开始搞点小本生意，但这些疯子不买任何东西还会吓跑顾客。所以请，杀死……我想想，_8个武僧_，然后奖励就是你的了。
actors.mobs.npcs.imp.old_golems_2=魔像猎杀得怎么样了?你已经击杀了_6只魔像_了吗?
actors.mobs.npcs.imp.old_monks_2=喔，你还活着！我就知道你得功夫很好；) 只要别忘了拿来那些武僧的标记就好，我需要_8个标记_。
actors.mobs.npcs.imp.cya=我们会再见的，%s！
actors.mobs.npcs.imp.hey=喂喂喂，%s！
actors.mobs.npcs.imp.quest_intro_1=哦你好啊，我猜你该是位冒险家？我最爱冒险家了！在需要人搭把手的时候，你们这些冒险家最可靠了。当然当然，我已经备好报酬了，这我懂的 ;)\n\n这下面有一座巨大的矮人宝库，里面可是装满了各种奇珍异宝。我也算是位收藏家，而宝库里有一尊我朝思暮想的雕像。\n\n不过，这宝库里面全是守卫和陷阱，所以希望你能帮我一点小忙！
actors.mobs.npcs.imp.quest_intro_2=宝库入口被魔法封印了。我早准备了一道魔法可以把你传送进去，不过_我没法把你的装备也一起传送进去_。好在宝库里应该也有不少疏于看管的装备用来防身，_在找到合适的装备之前，你大可一边躲开守卫一边搜刮_。\n\n这道魔法能让你带两件宝库里的藏品回来。其中一件当然得是那座雕像，而你还可以按自己心意_再拿一件东西出来_！\n\n我还有些价值不菲的收藏，我想你会很感兴趣的！乐意赏光帮我个忙的话，我愿意拿出收藏来开个小店供您光顾做些买卖，_店面就设在不远的楼下_。
actors.mobs.npcs.imp.quest_in_progress=只要你准备好了就走到宝库入口中间去，然后我就把你传送进去。
actors.mobs.npcs.imp.enter_text=准备好了？你的东西先放我这，_等你回来再还你_。\n\n先穿上这件_布甲_，这块_逃脱棱晶_也拿上，拿到我要的雕像了就用它出来。······呃，_你要是遇到麻烦了也可以提前用这个脱身_，但是没能带出雕像的话，报酬可是也要大打折扣的！\n\n宝库已经很久没人造访过了，里面的守卫想必也很松懈。躲过他们的巡查应该不难，只要_跟在他们背后就不会被发现_。就算你被他们注意到了，_如果只暴露了一小会，只要马上躲起来的话守卫们也不会追上来搜查的_。稍加注意的话，你大概还能_听到他们走到你附近的脚步声_。
actors.mobs.npcs.imp.quest_completed_bad=好吧，至少感谢你的时间。\n\n我用的传送魔法还需要很长时间才能再次发动，好走不送。
actors.mobs.npcs.imp.quest_completed_good=感谢你的帮助！\n\n准备好传送魔法还要点时间，这期间我得用你提供的信息给接下来的行动做些准备。\n\n我打包完东西就去楼下，咱们待会店里见。不过你懂的，我毕竟还得赚点钱用呢，店里的东西可不能白送你 ;)
actors.mobs.npcs.imp.quest_completed_great=干得漂亮，非常感谢！\n\n现在万事俱备，我打包好行李就去楼下，待会请您务必来店里坐坐。不过您要知道，店里的收藏都是精品，我实在难以割爱白白送人，起码也得让我赚点小钱嘛 ;)\n\n什么，您问我为什么想要那座雕像？其实这玩意也没什么稀奇的，或许和您想象的大相径庭了。它来自一个早已不存于世的边陲之地，要不是被这帮贪婪的矮人掠夺到了这里，恐怕这座雕像也已和那里的一切一样不复存在了...
actors.mobs.npcs.imp.enter_yes=降入宝库
actors.mobs.npcs.imp.enter_no=留在原地
actors.mobs.npcs.imp.desc=这个红色的小东西看起来像个小恶魔。小恶魔是一种低等恶魔，力量不强但头脑精明。\n\n在古老的民间故事中，恶魔常常被描述为来自异世界的旅者。你仅仅是如是听闻过，从未见过能证明它们真正存在的证据，不过你面前的这位小恶魔貌似货真价实，而且还挺乐意见到你的。

actors.mobs.npcs.impshopkeeper.name=野心勃勃的小恶魔
actors.mobs.npcs.impshopkeeper.greetings=你好，%s！
actors.mobs.npcs.impshopkeeper.greetings_ascent=%s你都做了些什么？要做买卖就快点，我可不想在这里久留！
actors.mobs.npcs.impshopkeeper.thief=我本以为我可以相信你！
actors.mobs.npcs.impshopkeeper.buyback=小恶魔爽快地退还了你的物品。
actors.mobs.npcs.impshopkeeper.desc=小恶魔在恶魔大厅的入口前摆了个小摊。在这能看到一张友好的面孔是挺不错的，但它商品的标价看起来可一点儿也不友好。

actors.mobs.npcs.mirrorimage.name=镜像
actors.mobs.npcs.mirrorimage.desc=这个幻像和你非常相似，甚至还装备着你当前的武器和护甲。\n\n镜像会猎寻敌人，并用它们的镜像武器对其发动攻击。镜像武器的使用方式与特性和你手中的一样，但造成的伤害会低些。镜像刚生成时几乎是隐形的，但攻击后会显形。\n\n镜像有一定的攻击能力，但本身非常脆弱，受到伤害就会瞬间消散。
actors.mobs.npcs.mirrorimage.discover_hint=你可通过某张卷轴遇到该单位。

actors.mobs.npcs.npc.discover_hint=你可在某个地牢区域中遇到该单位。

actors.mobs.npcs.prismaticimage.name=虹光幻像
actors.mobs.npcs.prismaticimage.desc=这个闪烁着虹光的幻像和你非常相似，甚至还装备着你当前的武器和护甲。\n\n虹光守卫会追击敌人并吸引仇恨，进而用其强化的防御力和生命值分担火力。虽然它不似镜像那般有攻击性，但它生命值更高，还具有基于你护甲的防御增益。\n\n当幻像生命降至0时，它将保持一段时间的存在，在此期间仍能被治愈。当周围没有敌人时，幻像会消散并依附其主人身上。
actors.mobs.npcs.prismaticimage.discover_hint=你可通过某张卷轴遇到该单位。

actors.mobs.npcs.ratking.name=鼠王
actors.mobs.npcs.ratking.not_sleeping=我可不是在睡觉！
actors.mobs.npcs.ratking.what_is_it=你这是想干什么？我可没时间管这些破事。我的王国可不会自己运转下去！
actors.mobs.npcs.ratking.confused=这...我这是在哪？我的王国需要我！
actors.mobs.npcs.ratking.crown_clothes=把衣服穿上！会见皇室的礼仪都不懂吗！
actors.mobs.npcs.ratking.crown_desc=哇，那个皇冠是要给本王的吗！？它看上去比我的皇冠更闪更亮，那我就好心好意地接受了！\n\n当然，我堂堂鼠王也不会白拿的。作为交换，本王能赐你一项配得上“英雄”之称的强大能力！怎么样？要不要？
actors.mobs.npcs.ratking.crown_yes=当然了！
actors.mobs.npcs.ratking.crown_info=我愿闻其详。
actors.mobs.npcs.ratking.crown_no=还是算了...
actors.mobs.npcs.ratking.crown_thankyou=嘿嘿嘿嘿，多谢了！不要让本王失望了，去宣扬我的威名吧！
actors.mobs.npcs.ratking.crown_fine=行吧！反正我也不怎么想要那个闪闪发光的皇冠...
actors.mobs.npcs.ratking.crown_after=新衣服穿着合身吗？诚信交易，概不退换！
actors.mobs.npcs.ratking.desc_crown=这只老鼠比普通的啮齿小鼠大一点。它戴着矮人国王的皇冠。
actors.mobs.npcs.ratking.desc_birthday=这只老鼠比普通的啮齿小鼠大一点。它戴着一顶小小的绿色派对帽，而不是它常戴的皇冠。祝鼠王生日快乐！
actors.mobs.npcs.ratking.desc_winter=这只老鼠比普通的啮齿小鼠大一点。它戴着一顶小小的节日帽，而不是常戴的皇冠。假日快乐！
actors.mobs.npcs.ratking.desc=这只老鼠比普通的啮齿小鼠大一点。它戴着一顶小小的皇冠。
actors.mobs.npcs.ratking.discover_hint=你可在某个地牢区域中的终点遇到该单位。

actors.mobs.npcs.sheep.name=绵羊
actors.mobs.npcs.sheep.baa!=咩！
actors.mobs.npcs.sheep.baa?=咩？
actors.mobs.npcs.sheep.baa.=咩。
actors.mobs.npcs.sheep.baa...=咩...
actors.mobs.npcs.sheep.def_verb=格挡
actors.mobs.npcs.sheep.desc=这是一只魔法绵羊。为什么叫它魔法绵羊？因为你杀不死它。它只会站在那里直到它消失，它会做的事情只有边反刍边对你翻白眼。
actors.mobs.npcs.sheep.discover_hint=你可通过某个物品或陷阱遇到该单位。

actors.mobs.npcs.shopkeeper.name=店主
actors.mobs.npcs.shopkeeper.thief=小偷，小偷！
actors.mobs.npcs.shopkeeper.warn=小心！我不会警告你第二次了。
actors.mobs.npcs.shopkeeper.flee=店主关店跑路了！
actors.mobs.npcs.shopkeeper.sell=选择一件要出售的物品
actors.mobs.npcs.shopkeeper.talk=交谈
actors.mobs.npcs.shopkeeper.buyback=店主不情不愿地退还了你的物品。
actors.mobs.npcs.shopkeeper.talk_prison_intro=我这有你成功冒险所需的一切东西！
actors.mobs.npcs.shopkeeper.talk_prison_warrior=你的那个纹章挺有意思的嘛，它们通常来讲都是一整个的。难不成你是一位蒙受了耻辱的英雄，还是别的什么人物？好啦，不管你做了些什么，都与我无关。我只对你的金币感兴趣。
actors.mobs.npcs.shopkeeper.talk_prison_mage=嘻嘻，我想我在城里的什么地方有见过你的通缉令。在逃亡对吧？哦？你说你是无辜的，真的吗？行行行...放轻松，比起举报你，我还有更值得做的事情。但也许你应该消费消费以确保这一点？
actors.mobs.npcs.shopkeeper.talk_prison_rogue=你是盗贼公会指派来清理这片区域的吗？不是？只是来购物的？你能来到这说明你确实杀了几个怪物，但别指望我会因此给你打折。我已经交足了保护费，但也没怎么见你们在这护我周全。
actors.mobs.npcs.shopkeeper.talk_prison_huntress=小姐，这似乎不是你该待的地方。狭窄的地牢走廊想来不如城镇大厅或者市郊森林那样宽敞，不是吗？嘿嘿，哦，请别在意我这碎嘴巴，为什么不买点东西呢？
actors.mobs.npcs.shopkeeper.talk_prison_duelist=哇偶，这不是闯荡天下的大英雄嘛！如果你在尝试着拯救又一个小镇，那我只能说祝你好运了。毕竟这里的危机可比土匪帮派什么的糟糕多了。当然，我相信你会比任何人做得更棒，只是千万别死在我的店门口。
actors.mobs.npcs.shopkeeper.talk_prison_cleric=哦您好陛下，或许现在该尊称您为“圣上”了？呵呵，无论如何这可不是您这种大人物该来的地方，要是您也殡天了恐怕您的臣民们会心碎的吧。想必您手头肯定不缺世俗钱财，为何不买点东西以防万一呢？
actors.mobs.npcs.shopkeeper.talk_caves=花钱，你才能活得更久。\n\n哦，如果你看到那个巨魔铁匠，代我向他问好。顺便提醒这个笨蛋，他上周从我这买锤子的钱还没结清呢！
actors.mobs.npcs.shopkeeper.talk_city=我的货可以保你平安。\n\n...另外，劳烦您别在这瞎晃悠。我花了很长很长时间才让这里的怪物离我远点，可不希望你把麻烦惹回来！
actors.mobs.npcs.shopkeeper.talk_halls=嘿，那边那位！我为恶魔猎人提供特别优惠！\n\n哦还有，在下面可要当心！底下的恶魔比宝库里那些守卫还难缠，而且这一次可没有逃脱棱晶帮你咯。你要是死了就没法回来消费啦！;)\n\n那些恶魔都和我一样吗？嘿嘿，并不。我只是个小角色，算不上能打，况且我还保全了自由意志。下面那些恶魔都比我猛得多，并且它们都受奴役于...呃...总之，你在下面当心点吧。
actors.mobs.npcs.shopkeeper.talk_ascent=无论你打算用那个护符做什么，我都不想掺和。买点东西，然后赶紧离开，咱俩都该闪人了！
actors.mobs.npcs.shopkeeper.desc=这个矮胖的家伙看起来更适合在某些大城市里做买卖而不是在这种地牢。这些商品的价格说明了为什么他会喜欢在这儿做生意。

actors.mobs.npcs.wandmaker.name=法杖制作者
actors.mobs.npcs.wandmaker.berry_1=啊，在这种地方遇到一个体面的人是多么惊喜！我来这里是为了寻找一样稀有的材料——一个腐莓种子。作为一个施法者，我可以轻易地对付这里的怪物，但我迷路了，而且魔法盾也在逐渐减弱，好尴尬！也许你能够帮助我?为了报答你的工作，我很愿意给你一把我制作的高质量法杖。
actors.mobs.npcs.wandmaker.berry_2=腐莓找的怎么样了，%s?没有?不用担心，我不着急。
actors.mobs.npcs.wandmaker.dust_1=啊，在这种地方遇到一个体面的人是多么惊喜！我来这里是为了寻找一样稀有的材料——尸骨灰烬。它可以在遗骸中被收集，其中有很强的诅咒。作为一个施法者，我可以轻易地对付这里的怪物，但我迷路了，而且魔法盾也在逐渐减弱，好尴尬！也许你能够帮助我?为了报答你的工作，我很愿意给你一把我制作的高质量法杖。
actors.mobs.npcs.wandmaker.dust_2=尸骨灰烬找的怎么样了，%s?没有?遗骸应该是最有价值寻找的地方。
actors.mobs.npcs.wandmaker.intro_warrior=哦，你好！能在这片压抑的地方遇见一位北境战士可真是个惊喜！想必你走了很远才来到此地。如果你对冒险有足够的兴趣，我这有个差事给你。
actors.mobs.npcs.wandmaker.intro_rogue=天哪，你吓了我一跳！在这里这么久你是我见过的第一个尚有理智的强盗，所以你肯定是从地表下来的！如果你愿意帮助我这样一名陌生人的话，这有一个任务或许你能帮上忙。
actors.mobs.npcs.wandmaker.intro_mage=哦，你好啊%s！我好像听说你在法师学院那里搞了不少麻烦？算了这没关系，反正我也不喜欢那些墨守成规的榆木脑袋。如果你愿意的话，我这有个任务可以让你帮忙。
actors.mobs.npcs.wandmaker.intro_huntress=啊，你好啊姑娘！能在这下面见到一张友善的面孔真是太惊喜了，你说是吧？咦，说来，我敢打赌以前在哪见过你，但想不起具体...哦算了，不用在意，如果你是来这里冒险的话，我这有个任务交给你做。
actors.mobs.npcs.wandmaker.intro_duelist=哦，小姐你好！多么压抑的地方，多么美妙的偶遇！如果你有兴趣帮助一位糟老头子的话，我有份小差事可以交给你。
actors.mobs.npcs.wandmaker.intro_cleric=哦，您好陛下！能在如此压抑之地与您相遇实为一件幸事！我虽无意打扰，但我有一事请您相助。
actors.mobs.npcs.wandmaker.intro_spellsword=哦，一位兼修剑术与法术的同行！你看起来比大多数冒险者更适合这个地方。如果你愿意的话，我这里正有一件能发挥你本领的差事。
actors.mobs.npcs.wandmaker.intro_1=\n\n我在这里是为了寻找一个制作法杖需要的稀有材料，但我迷了路，而且身上的魔法盾也在慢慢减弱。我必须马上离开这里，但我不想空手而归。
actors.mobs.npcs.wandmaker.intro_dust=我在寻找一些_尸尘_。这是一种通常出现在这种地方的被诅咒的特殊骨灰。它应该就在附近某个被隔住的房间里，我很肯定你能在那里找到一些尸尘。不过要小心，尸尘上的诅咒相当强大，_尽快将它带回来_，我会净化其中的诅咒。
actors.mobs.npcs.wandmaker.intro_ember=我在寻找能从新生火焰元素身上获得的_元素余烬_。元素生物通常出现在失控的召唤仪式上，因此要召唤它只需要去找到一些蜡烛和一个仪式场地——我很确定你能找到这样的地方。另外，与其战斗时，你不会想要_与其近身肉搏_的，你可能会需要一些_有冻结效果的物品_。新生火焰元素强大而狂暴，但难以抵御寒冷。
actors.mobs.npcs.wandmaker.intro_berry=这个监狱以前的典狱长养着一株_腐莓_，我想要一粒它的种子。现如今，这株植物的长势可能已经失控，所以想搞到它的种子绝非易事。它所在的花园应该就在这附近。你若想全身而退的话，就尽量_远离它的触手藤_。纵火烧死腐莓听起来很可行，但请别这么做，烧死它也会烧毁它的种子。
actors.mobs.npcs.wandmaker.intro_2=\n\n如果你能把它带给我，我愿意用一根我精心制作的法杖当做酬劳！我带了两根过来，你可以挑一根自己喜欢的。
actors.mobs.npcs.wandmaker.reminder_dust=尸尘找的怎么样了，%s？试着寻找一些_障碍物_。
actors.mobs.npcs.wandmaker.reminder_ember=余烬找的怎么样了，%s？你需要找到_四根蜡烛_和一个_仪式场地_。
actors.mobs.npcs.wandmaker.reminder_berry=腐莓种子找的怎么样了，%s？它就在一个_充满植被的房间_里。
actors.mobs.npcs.wandmaker.def_verb=格挡
actors.mobs.npcs.wandmaker.desc=这位老先生的表情看起来十分困扰。他正在被一个力场盾牌保护着。



##vault quest
actors.mobs.quest.vault.vaultbosselemental.name=巨型元素
actors.mobs.quest.vault.vaultbosselemental.rankings_desc=被巨型元素吞噬
actors.mobs.quest.vault.vaultbosselemental.discover_hint=你可在某个任务中遇到该敌人。
actors.mobs.quest.vault.vaultbosselemental.desc=作为矮人召唤术的巅峰之作，这个巨大的元素周围翻涌着无定形的力量，这份无常的力量似乎被召唤它的那个同样令人叹为观止的魔法阵所调控，也给了它_转换形态_的能力！不同形态下，巨型元素的攻击方式、抗性和弱点均有不同。
actors.mobs.quest.vault.vaultbosselemental.desc_fire=巨型元素目前处于熔融的_火焰形态_。在此形态下，巨型元素可以发射火球并召唤焰浪横扫整个战场。它会试图将火球射向你的移动方向，而焰浪当中总是有空隙存在以供规避。一旦命中，二者均会导致你被_点燃_。\n\n在这个形态下，巨型元素还具有_魔法抗性_，其受到的魔法攻击只会转为它炽焰的燃料。不过它脆弱的熔融核心也许很容易被_远程武器_击中。
actors.mobs.quest.vault.vaultbosselemental.fire_resist=巨型元素吸收了你大部分的魔法攻击，炽焰也燃烧的更亮了！
actors.mobs.quest.vault.vaultbosselemental.fire_weak=你的投掷武器正中巨型元素的熔融核心，造成了额外伤害！
actors.mobs.quest.vault.vaultbosselemental.desc_frost=巨型元素目前处于极寒的_冰霜形态_。在此形态下，巨型元素可以发射扇形寒流横扫战场并召唤突进的冰寒涡旋。这些攻击都可以通过把握时机移动规避，不过扇型寒流在远处会相当致命。一旦命中，二者均会导致你被_冻结_。\n\n在这个形态下，巨型元素还具有_投武抗性_，会使其卡在它的冰霜盾壳上。不过盾壳看起来并不是很坚固，所以_近战武器_攻击的输出应该很有效。
actors.mobs.quest.vault.vaultbosselemental.frost_resist=投掷武器卡在了巨型元素的冰霜盾壳上！
actors.mobs.quest.vault.vaultbosselemental.frost_weak=你的近战攻击震裂了冰霜盾壳，造成了额外伤害！
actors.mobs.quest.vault.vaultbosselemental.desc_shock=巨型元素目前处于流电的_电光形态_。在此形态下，巨型元素可以向你所在的位置发射集束闪电，或在战场边缘召唤电火花幕。这些攻击相对易于规避，但其释放频率却是更高。一旦命中，二者均会导致你被短暂_击晕_。\n\n在这个形态下，巨型元素还具有_近战抗性_，直接上前进行近战攻击只会使你触电受伤。不过其外围的能量会被_魔法攻击_扰乱，从而对其造成额外伤害。
actors.mobs.quest.vault.vaultbosselemental.shock_resist=武器命中元素的一瞬间，电流给你带来一阵剧痛！
actors.mobs.quest.vault.vaultbosselemental.shock_weak=魔法攻击扰乱了巨型元素的电场，造成了额外伤害！

actors.mobs.quest.vault.vaultdm100.name=DM-100改
actors.mobs.quest.vault.vaultdm100.discover_hint=你可在某个任务中遇到该敌人。
actors.mobs.quest.vault.vaultdm100.desc=这些DM-100看起来和你在监狱里见过的那些差不多，但它们的眼睛闪着明亮的青光，很可能搭载了更先进的矮人科技能源。\n\n它们的行动和普通的DM-100无异，尽管其能源有变，其使用闪电远程攻击的能力却没有变，而且其更好的运行状况也使它们更加耐用。

actors.mobs.quest.vault.vaultdm200.name=DM-200改
actors.mobs.quest.vault.vaultdm200.discover_hint=你可在某个任务中遇到该敌人。
actors.mobs.quest.vault.vaultdm200.desc=这些DM-200看起来和你在矿洞里见过的那些差不多，但它们的眼睛闪着明亮的青光，很可能搭载了更先进的矮人科技能源。\n\n和它们在矿洞的同型号机体一样，这些DM-200因体型太大无法穿过狭小空间，而且也能喷射毒气。

actors.mobs.quest.vault.vaultrat.desc=这只老鼠行为有些许变化，以测试全新的宝库敌人AI：\n_-_其移动可透过墙壁而被“听见”\n_-_其游荡路径沿着预设的路线\n_-_游荡时，其移动方向的反方向上的侦测范围锐减\n_-_睡觉时，其侦测范围也会降低\n_-_侦测到你时，其会在进行追击之前先进行“搜查”。搜查状态的敌人会向你移动但并不会发动攻击，且更容易在门口与转角处跟丢你。

actors.mobs.quest.vault.vaultskeleton.name=矮人骷髅
actors.mobs.quest.vault.vaultskeleton.discover_hint=你可在某个任务中遇到该敌人。
actors.mobs.quest.vault.vaultskeleton.desc=如果不是那浓密得惊人的胡须，这些骷髅看起来和你在监狱里见过的那些差不多。看来即使是在新王掌权之前，也早就有一些矮人在钻研死灵法术了。\n\n它们的行动和普通骷髅无异，包括死亡时造成的骨头爆炸。诡异的是，它们的大胡子似乎能为它们提供些许保护。

actors.mobs.quest.vault.vaultshaman.name=受俘萨满
actors.mobs.quest.vault.vaultshaman.discover_hint=你可在某个任务中遇到该敌人。
actors.mobs.quest.vault.vaultshaman.desc=这些面覆着矮人一样的怪异金属面具的豺狼萨满显然是从洞穴被抓来的。面具紧勒在萨满们的脸上，而萨满们的动作也异常僵硬。面具是用来控制它们的吗？
actors.mobs.quest.vault.vaultshaman.spell_desc=这些豺狼萨满肯定还是会用魔法飞弹攻击你，但由于面具没有涂装，无法分辨它们会使用什么魔法类型。相比原版的木质面具，金属面具似乎还为它们提供了些许防护，而且它们的攻击相比一般的豺狼萨满也更强了。



###mobs
actors.mobs.acidic.name=酸液蝎子
actors.mobs.acidic.desc=酸液蝎子较普通蝎子更强，也更加危险。它体内的酸液会在遇到危险时释放，从而保护自己免受天敌的袭击。

actors.mobs.albino.name=白化老鼠
actors.mobs.albino.desc=这是一只稀有品种的白色的老鼠，它有一身纯白色的皮毛和锯齿状的牙齿。邪恶污染使它周围布满了血雾。
actors.mobs.albino.discover_hint=你可在某个地牢区域中中碰巧遇到该敌人。

actors.mobs.armoredstatue.name=装甲石像
actors.mobs.armoredstatue.desc=你本以为这只是地牢里又一尊静伫的石像，但它泛着红光的眼睛出卖了它。\n\n石像装备着精良的护甲，看上去相当坚硬，估计会很难对付。
actors.mobs.armoredstatue.desc_arm_wep=虽然雕像本身是石制的，但它装备着的_%1$s_和_%2$s_看起来是真家伙。

actors.mobs.armorstatue.name=活化装甲石像
actors.mobs.armorstatue.desc=你以为这只是地牢里的另一个丑陋雕像，但它发出红光的眼睛让你放弃了刚才的想法。 尽管雕像本身是用石头做的，但它穿着_%s_，看起来像是真的。

actors.mobs.bandit.name=紫衣大盗
actors.mobs.bandit.desc=较普通绿衣小贼而言，紫衣大盗在偷窃同时，会狠狠伤害被偷窃者，以方便自己逃跑。

actors.mobs.bat.name=吸血蝙蝠
actors.mobs.bat.desc=这些敏捷且坚韧的洞穴穹顶生物比看上去可怕地多。它们会通过每次成功的攻击来恢复生命，从而击败比它们大得多的对手。

actors.mobs.bee.name=金色蜜蜂
actors.mobs.bee.desc_honey=尽管金色蜜蜂体型不大，但它们也会尽全力守卫自己的家园。这只蜜蜂受过你的安抚，似乎愿意追随你。
actors.mobs.bee.desc=尽管金色蜜蜂体型不大，但它们也会尽全力守卫自己的家园。这只蜜蜂非常疯狂，你最好和它保持距离。
actors.mobs.bee.discover_hint=你可通过某个道具遇到该单位。

actors.mobs.brute.name=豺狼暴徒
actors.mobs.brute.enraged=激怒
actors.mobs.brute.def_verb=格挡
actors.mobs.brute.desc=暴徒是体型最大，力量最强且生命力最坚韧的一种豺狼人。受到致命伤时，他们会狂暴化，获得暂时的护盾和极高的伤害加成。
actors.mobs.brute$bruterage.name=豺狼狂暴
actors.mobs.brute$bruterage.desc=这个豺狼暴徒已经濒临死亡，但它想拉你作为陪葬品！\n\n时间的推移和外界的伤害都会消磨护盾，盾破便是暴徒的丧命之时。然而，一定要小心，在这一阶段暴徒会造成巨额伤害！\n\n剩余的护盾：%d

actors.mobs.causticslime.name=蚀化史莱姆
actors.mobs.causticslime.desc=这个史莱姆似乎已经被下方渗透的黑暗能量完全侵蚀了。它已经失去了体表原有的绿色光泽，并且在不断滴落腐蚀淤泥。
actors.mobs.causticslime.discover_hint=你可在某个地牢区域中中碰巧遇到该敌人。

actors.mobs.crab.name=下水道螃蟹
actors.mobs.crab.desc=这些巨型的螃蟹位居下水道食物链的顶端。它们行动极其迅速且其厚重的甲壳能承受沉重的打击。

actors.mobs.crystalguardian.name=水晶守卫
actors.mobs.crystalguardian.def_verb=格挡
actors.mobs.crystalguardian.desc=这种巨大的水晶守卫若不是眼中泛着明光，看起来和雕像几乎没有区别。因为身体由硬化的水晶构成，它们行动不便但异常坚固。所以_最好别打扰它们在水晶洞窟中的酣眠_。\n\n由于水晶守卫体型庞大，其在狭隘的地形移动时，速度会非常慢。它们还无比坚韧，无法被彻底杀死。它们被击败后会暂时失能，但不一会便会卷土重来。
actors.mobs.crystalguardian.discover_hint=你可在某个的任务中遇到该敌人。

actors.mobs.crystalmimic.name=水晶宝箱怪
actors.mobs.crystalmimic.ate=水晶宝箱怪吃掉了你的%s！
actors.mobs.crystalmimic.escaped=水晶宝箱怪逃跑了！
actors.mobs.crystalmimic.desc=宝箱怪是一种能随意改变外形的魔法生物。在地牢里它们几乎总会以宝箱形态出现，因为这样更能吸引疏于防备的冒险家。\n\n水晶宝箱怪相比于它们的近亲更为狡猾，会偷取物品并尽量避免争斗。它们会在被发现后迅速逃离，还能通过攻击将敌人移位。

actors.mobs.crystalspire.name=水晶尖塔
actors.mobs.crystalspire.warning=你感受到了被敲打的水晶上传来的颤动。再继续敲下去肯定会引祸上身...
actors.mobs.crystalspire.alert=水晶的颤动愈演愈烈，隆隆声响彻整个矿洞！
actors.mobs.crystalspire.rankings_desc=被水晶尖塔的尖刺贯穿身体
actors.mobs.crystalspire.desc=这座巨型尖塔由无比坚硬的水晶构成，很可能是矿洞中所有奇怪水晶生物的来源。常规武器无法对它造成伤害，所以你得用镐子来拆毁它。\n\n_动手破拆之前，要为硬仗做好准备。_拆除如此硕大的一块水晶可需要花费不少时间，而且很难不被打扰。尖塔本身也可能拥有防御机制。_或许尖塔的攻击可被利用于对付它的爪牙。_
actors.mobs.crystalspire.discover_hint=你可在某个任务中遇到该敌人。

actors.mobs.crystalwisp.name=水晶灵簇
actors.mobs.crystalwisp.beam_kill=你死于光束...
actors.mobs.crystalwisp.desc=一小块愤怒的硬化水晶飘浮在空中，泛着明亮的光。它虽然不算强，但只要有机会，就会射出光束伤害你。\n\n这种灵簇足够小巧，故而可以轻松飞越水晶尖刺，但其射出的光束不可以。
actors.mobs.crystalwisp.discover_hint=你可在某个任务中遇到该敌人。

actors.mobs.demonspawner.name=恶魔血巢
actors.mobs.demonspawner.on_death=此处的恶魔能量似乎随着血巢的毁灭而有所减弱。
actors.mobs.demonspawner.desc=这一团蠕动着的矮人血肉在利用惨死于这一区域的矮人源源不断地制造恶魔撕裂者。看来恶魔们为了对付敌人可以不择手段。\n\n恶魔血巢虽然看上去非常恐怖，但它本身不具备移动能力和直接的自卫手段。不过它庞大的体积使得它难以被迅速破坏，而且它在受到威胁时会加速产出恶魔撕裂者。\n\n_恶魔血巢似乎与某个恶魔能量的源头相连。破坏掉血巢或许能够弱化那个源头。_

actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=你死于闪电...
actors.mobs.dm100.desc=DM-100是一种矮人“防卫机械”的早期机型，用来保护下层矿洞中的矮人矿工。然而由于电击威力不足，它们之后被送给上层的人类城市。尽管典狱长起初仍然认为DM-100太过残忍，但在闲置数年后，它们最终还是被用于监狱。然而随着时间推移，囚犯变得越来越难以控制，这使得DM-100成为了监狱的必备品。

actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=DM-200喷射了一团有毒的废气！
actors.mobs.dm200.desc=DM-200是矮人研发的第二代“防卫机械”，最初用来保护矿洞中的矮人矿工与下方的都城。比起第一代它们相当庞大笨重，并改为用强力的液压锤攻击。\n\n臃肿的体型是它们的一大缺陷——它们无法进入狭窄的门与过道。为了弥补灵活性的缺陷，矮人设计了另一种功能：DM-200能向远处的或无法触及的敌人喷射有毒的废气。

actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=DM-201投出了一枚酸蚀榴弹！
actors.mobs.dm201.desc=矮人曾做过一些围绕DM-200的机动性缺陷展开的实验，并据此设计制造了一批完全固定的DM系列机器。DM-201是经过改装的DM-200，其作为哨戒炮塔完全没有移动能力。作为交换，DM-201们的坚固程度与攻击能力都得到了显著的提升。\n\n由于DM-201并没有用于排放废气的引擎，矮人给它们装备了酸蚀气体榴弹！不过，DM-201对榴弹的使用很谨慎，只有在受到来自远处的攻击时才会向敌人投掷榴弹。

actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=侦 测 到 未 授 权 单 位 ！
actors.mobs.dm300.shield=DM-300从地表导线汲取电力并生成护盾！
actors.mobs.dm300.charging=受 到 伤 害 ！正 在 启 动 能 量 塔 ！
actors.mobs.dm300.charging_hint=DM-300在接受能量塔供电时无法受到伤害！
actors.mobs.dm300.supercharged=毁 灭 ！毁 灭 ！毁 灭 ！
actors.mobs.dm300.charge_lost=能 量 塔 损 坏 ！切 换 至 本 地 供 能 模 式 ！
actors.mobs.dm300.pylons_destroyed=警 告 ！检 测 到 电 网 故 障 ！
actors.mobs.dm300.rankings_desc=被DM-300碾压致死
actors.mobs.dm300.def_verb=格挡
actors.mobs.dm300.defeated=受 到 严 重 损 伤 ！正 在 尝 试 关-
actors.mobs.dm300.desc=DM-300是矮人有史以来发明的最强大的“防卫机械”。这般强大的机械极难量产，所以矮人们仅仅造出了几台来守护他们地下都城的入口。\n\n它配备了可以喷出剧毒废气的通风口和一个可以用来攻击和破坏土石的高功率钻头。DM-300还可以接通电网，进一步增强它的力量。
actors.mobs.dm300.desc_supercharged=DM-300电力盈满，功率全开。此形态下的DM-300能免疫一切伤害，并具有两倍移动速度！此外，它的钻头功率现在足以_凿通墙壁_，不过它凿墙时的移速要慢很多。\n\n直接攻击超载的DM-300毫无意义，不过_这附近一定有为它提供能量的装置_，摧毁了的话也许能削弱它。

actors.mobs.dwarfking.name=矮人国王
actors.mobs.dwarfking.notice=汝竟敢进犯皇家重地！不知天高地厚！
actors.mobs.dwarfking.lifelink_1=献身护驾，奴隶们！
actors.mobs.dwarfking.lifelink_2=为了朕的大业，光荣牺牲吧！
actors.mobs.dwarfking.teleport_1=汝等，给朕拿下此人！
actors.mobs.dwarfking.teleport_2=汝等，拖住此人！
actors.mobs.dwarfking.wave_1=够了！为朕复生而战吧，汝等奴虏！
actors.mobs.dwarfking.wave_2=继续上！为了朕的江山而战！
actors.mobs.dwarfking.wave_3=废物！朕命汝等速速解决此人！
actors.mobs.dwarfking.enraged=汝休想得逞，%s。朕 即 不 朽！
actors.mobs.dwarfking.losing=不！汝不得如此...汝不知晓朕的王国之下埋藏着什么...
actors.mobs.dwarfking.defeated=汝会...毁了一切的...
actors.mobs.dwarfking.rankings_desc=屈服在矮人国王御前
actors.mobs.dwarfking.desc=许多年前，矮人议会中一名最强的巫师洞察了凌驾于生死之上的秘术。很快他就借助这种强大的力量，控制、腐化了王室与整个议会，并将魔爪伸向王国中的每一名矮人。现在他成为了矮人国的国王，统领着数量庞大的死灵。\n\n矮人国王是极具进攻性的强敌，会尝试利用他手下的死灵大军压制入侵者。
actors.mobs.dwarfking$dkghoul.rankings_desc=屈服在矮人国王御前
actors.mobs.dwarfking$dkmonk.rankings_desc=屈服在矮人国王御前
actors.mobs.dwarfking$dkwarlock.rankings_desc=屈服在矮人国王御前
actors.mobs.dwarfking$dkgolem.rankings_desc=屈服在矮人国王御前

actors.mobs.ebonymimic.name=黑檀宝箱怪
actors.mobs.ebonymimic.reveal=那里有一个宝箱怪！
actors.mobs.ebonymimic.hidden_name=可疑的轮廓
actors.mobs.ebonymimic.hidden_desc=那里似乎有什么东西，但它几乎是完全透明的。
actors.mobs.ebonymimic.desc=宝箱怪是一种能随意改变外形的魔法生物。在地牢里它们几乎一直以宝箱形态出现，因为这样总能吸引疏于防备的冒险家。\n\n黑檀宝箱怪凭借其隐匿能力使自身近乎隐形。它们会在冒险家可能交互的事物之上设伏诱敌，攻其不备。与此同时，它们体内也含有其专属的战利品。若能识破其伪装，其攻防能力与普通宝箱怪无异。但若稍有不慎，其出其不意的伏击足以致命。
actors.mobs.ebonymimic.discover_hint=你可通过某件饰物遇到该敌人。

actors.mobs.elemental$fireelemental.name=火焰元素
actors.mobs.elemental$fireelemental.desc=元素是一类狂暴的生物，通常诞生于失控的强力魔法仪式当中。元素生物智力极低，它们通常与一种特定的魔法密切相关。\n\n火焰元素是一种常见的借助火焰之力攻击的元素生物。它的近战攻击能点燃目标，有时也会向远处目标发射火焰弹。
actors.mobs.elemental$newbornfireelemental.name=新生火焰元素
actors.mobs.elemental$newbornfireelemental.charging=新生元素正在蓄能！
actors.mobs.elemental$newbornfireelemental.desc=元素是一类狂暴的生物，通常诞生于失控的强力魔法仪式当中。元素生物智力极低，它们通常与一种特定的魔法密切相关。\n\n这只火焰元素刚刚被召唤出来，但同样很危险！
actors.mobs.elemental$newbornfireelemental.rankings_desc=被新生火焰元素烤焦
actors.mobs.elemental$newbornfireelemental.desc_boss=由于其本质是狂暴的召唤物，这个元素的火攻方式只有通过1回合的蓄能喷出不精准的焰浪。
actors.mobs.elemental$newbornfireelemental.desc_ally=由于这个元素是由晶柱召唤而来，故而对火焰有更好的控制。它没法施展远距离攻击，但仍然可以通过近战攻击引燃敌人。
actors.mobs.elemental$newbornfireelemental.discover_hint=你可在某个任务中遇到该敌人。
actors.mobs.elemental$frostelemental.name=冰霜元素
actors.mobs.elemental$frostelemental.desc=元素是一类狂暴的生物，通常诞生于失控的强力魔法仪式当中。元素生物智力极低，它们通常与一种特定的魔法密切相关。\n\n冰霜元素是一种常见的借助冰霜之力弱化敌人的元素生物。它的近战攻击和不常用的远程攻击都会使敌人陷入冻伤。它的冰霜之力对水上的敌人效果更强。
actors.mobs.elemental$shockelemental.name=电光元素
actors.mobs.elemental$shockelemental.desc=元素是一类狂暴的生物，通常诞生于失控的强力魔法仪式当中。元素生物智力极低，它们通常与一种特定的魔法密切相关。\n\n电光元素是一种较为少见的借助电能与闪光干扰敌人的元素生物。近战时它会向周遭敌人释放电弧，还能对水上的主要目标造成额外伤害。它有时也会聚焦向远处的敌人以释放致盲的强烈闪光。
actors.mobs.elemental$chaoselemental.name=混沌元素
actors.mobs.elemental$chaoselemental.desc=元素是一类狂暴的生物，通常诞生于失控的强力魔法仪式当中。元素生物智力极低，它们通常与一种特定的魔法密切相关。\n\n混沌元素是一种极其稀有的元素生物。它并不局限于某一种特定的魔法，而是会借助攻击向敌人倾泻变幻莫测的狂野魔法。

actors.mobs.eye.name=邪恶之眼
actors.mobs.eye.deathgaze_kill=你死于死亡凝视...
actors.mobs.eye.desc=这种恶魔还有一个名字叫做“憎恶之球”，因为它在看到敌人时会毫无顾忌地使用它的死亡射线，而根本不顾及队友的存在。

actors.mobs.fetidrat.name=腐臭老鼠
actors.mobs.fetidrat.rankings_desc=被腐臭老鼠溶解
actors.mobs.fetidrat.desc=很明显这只老鼠身上有着问题。其油腻的黑毛和腐烂的皮肤与你以前见过的健康老鼠很不同。浅绿色的眼睛让它显得更具威胁。\n\n这只老鼠周围围绕着一片可怕恶臭，其恶臭在近距离接触时尤其浓烈。\n\n黑色的淤泥从它的嘴中流出。淤泥腐蚀掉了地板，但其似乎能在水中溶解开来。
actors.mobs.fetidrat.discover_hint=你可在某个任务中遇到该敌人。

actors.mobs.fungalcore.name=蘑菇菌核
actors.mobs.fungalcore.desc=这株硕大无比的蘑菇想必就是洞穴中异常蘑菇活性的源头了。

actors.mobs.fungalsentry.name=蘑菇哨卫
actors.mobs.fungalsentry.desc=屹立于此的高大蘑菇是整个洞穴中更大的菌丝网络的防御节孢。\n\n它无法移动，但会精准地向任何进入视线的物体喷射毒液。虽然毒液喷射的力道相当弱，_但却可以快速地叠加毒量_。虽然可以被杀死，但最好还是远离它。

actors.mobs.fungalspinner.name=菌生蜘蛛
actors.mobs.fungalspinner.desc=这只矿洞蜘蛛似乎被一种寄生真菌控制。真菌改变了宿主的能力，以真菌生长替换了宿主的蛛网和猛毒。\n\n菌生蜘蛛会喷吐孢子，而非蛛网。孢子不仅会传播真菌，还可能将你缠绕在原地。这种蜘蛛虽然无毒，但却可以在邻近任何蘑菇的时候获得高额伤害抗性。

actors.mobs.ghoul.name=矮人尸群
actors.mobs.ghoul.desc=由于矮人社会的衰亡和矮人新王的独权专行，那些位微言轻和反抗新王的矮人都没落得什么好下场。随着新王对黑暗魔法的掌控愈发娴熟，这些矮人也不得不屈从于其意志，沦为了其大军中的一枚棋子。\n\n单个尸鬼的战斗力并不强，但它们总是成群结队地游荡，而且数量越多越难对付。_只要周围仍有其他同类，被击倒的尸鬼就能在几回合后重新爬起来_。

actors.mobs.gnoll.name=豺狼巡查
actors.mobs.gnoll.desc=豺狼人是鬣狗状的类人生物。它们在下水道和地牢里游荡，不时向上行动试图向地表发起进攻。豺狼巡查是它们种群里最普通的一员，它们既没有暴徒强壮，也赶不上萨满聪明。

actors.mobs.gnollexile.name=豺狼流寇
actors.mobs.gnollexile.desc=这只灰毛豺狼人在其肩处刺有一个显眼的标记，作为其被已流放的标志。豺狼人通常会因无视纪律或违反法律而被流放驱逐出豺狼人社会。强大与精明是流寇生存的看家本领，而这一只看起来善使其所持的长矛。
actors.mobs.gnollexile.desc_passive=_豺狼流寇目前暂无攻击意图。_它似乎并不像此处的其他豺狼人那样好斗，也许它认为与你战斗并不划算。你可以选择饶它一命，但它所携带的包裹也许装满了有用的物品...
actors.mobs.gnollexile.desc_aggro=_豺狼流寇虎视眈眈地环顾四周。_看来终究还是有什么使它下定决心出手进攻了。小心那根长矛！
actors.mobs.gnollexile.seen_passive=持矛的豺狼人警戒地看着你，但其并无攻击意图。
actors.mobs.gnollexile.seen_aggro=持矛的豺狼人准备进行攻击！

actors.mobs.gnollgeomancer.name=豺狼地卜师
actors.mobs.gnollgeomancer.warning=地卜师快醒了，先确保你已准备万全再继续！
actors.mobs.gnollgeomancer.alert=地卜师已被惊醒！整个矿洞的结构似乎都随着它癫狂尖啸着的跃离改变了！
actors.mobs.gnollgeomancer.rock_kill=你死于飞来的岩砾...
actors.mobs.gnollgeomancer.rockfall_kill=你死于落石...
actors.mobs.gnollgeomancer.rankings_desc=被豺狼地卜师活埋
actors.mobs.gnollgeomancer.desc=这只身形魁梧的老豺狼人必定是此处豺狼人的领袖，还是此处土灵魔法的根源。与豺狼工兵不同的是，地卜师精通土灵魔法，因此不会被飞岩落石伤到。不过它大概没办法直接攻击近身的敌人。
actors.mobs.gnollgeomancer.desc_armor=地卜师周身环绕着一层磐岩护盾。_你必须用镐子近身破坏岩盾才能进一步伤害地卜师本体。_
actors.mobs.gnollgeomancer.desc_armor_sapper=_一旁的豺狼工兵正握持着一个看起来能强化地卜师磐岩护盾的装置，现在的地卜师免疫一切伤害！_
actors.mobs.gnollgeomancer.desc_sleeping=这只身形魁梧的豺狼萨满周身环绕着一层磐岩，看似一尊雕像。然而仔细观察才发现，这些磐岩是随着老豺狼人的呼吸而律动的流形护盾。它能凭借这种防护不会受到任何伤害，因而在这乱石林立之处悠然休憩。\n\n手中的镐子应该可以击破他的磐岩护盾，但是_此战必须做好充足准备_。地卜师必定是此处豺狼人的领袖，还是此处土灵魔法的根源。_最好能在挑战他前先击败周围散布的其他豺狼人。_
actors.mobs.gnollgeomancer.discover_hint=你可在某个任务中遇到该敌人。

actors.mobs.gnollguard.name=豺狼守卫
actors.mobs.gnollguard.def_verb=格挡
actors.mobs.gnollguard.spear_warn=豺狼人用矛尖打出残暴的一击！
actors.mobs.gnollguard.desc=这只高大健壮的豺狼人操使着长矛和盾牌，但没有戴头盔。这些守卫似乎在为晋升成暴徒而训练，并为保护矿洞不受野兽侵扰在此执勤。\n\n豺狼守卫身强力壮，单手就能挥舞长矛，不过使得不算太好。_它需要相当开阔的施展空间才能进行长距离攻击。一旦被人欺身而上，长矛施展不开便会威力大减。_
actors.mobs.gnollguard.desc_armor=_一旁的豺狼工兵正握持着一个看起来能赋予这个守卫大地护甲的装置，大幅减少它受到的伤害。_
actors.mobs.gnollguard.discover_hint=你可在某个任务中遇到该敌人。

actors.mobs.gnollsapper.name=豺狼工兵
actors.mobs.gnollsapper.desc=这只豺狼人矮小虚弱但机智。它长有浅色皮毛，携带着装满各种小工具的挎包。它们似乎在此协助勘探和开采暗金矿，并配有豺狼守卫贴身保护。它们虽然能够近战，但是攻击力弱得可怜，不比豺狼巡查强。\n\n相比于直接搏斗，豺狼工兵更喜欢用它们携带的各类装置操纵周遭岩石来攻击。它们只是依靠工具抛掷岩石，而不掌握有土灵魔法。_应该有很多方式可以利用它们的攻击来反击它们和其余的守卫。_
actors.mobs.gnollsapper.discover_hint=你可在某个任务中遇到该敌人。

actors.mobs.gnolltrickster.name=豺狼猎手
actors.mobs.gnolltrickster.rankings_desc=被豺狼诡术师智取
actors.mobs.gnolltrickster.desc=即使以豺狼人的标准来看，这个生物也非常的诡异。它鬼鬼祟祟地弯着腰向前移动，脸上挂着咧着嘴的邪恶笑容，肩上挂着的挎包鼓得同摇篮一般。它的瞳孔中诡异地混合着恐惧与兴奋。\n\n它的挎包里有一大批粗制滥造的飞镖，它们似乎包含着各种有害物质。
actors.mobs.gnolltrickster.discover_hint=你可在某个任务中遇到该敌人。

actors.mobs.goldenmimic.name=黄金宝箱怪
actors.mobs.goldenmimic.desc=宝箱怪是一种能随意改变外形的魔法生物。在地牢里它们几乎一直以宝箱形态出现，因为这样总能吸引疏于防备的冒险家。\n\n黄金宝箱怪是试图吸引顶尖冒险家的强大宝箱怪。它们拥有更丰厚的财宝，但比起普通的宝箱怪也更为强大。

actors.mobs.golem.name=魔像
actors.mobs.golem.def_verb=格挡
actors.mobs.golem.desc=矮人们尝试将他们关于机械的知识与新发现的元素力量结合起来。土地之灵作为公认的最容易掌控的元素之灵，被用来当作机械的"灵魂"。尽管如此，仪式中最细微的失误都会造成严重的爆炸。

actors.mobs.goo.name=粘咕
actors.mobs.goo.notice=咕-咕！
actors.mobs.goo.defeated=咕...咕...
actors.mobs.goo.!!!=!!!
actors.mobs.goo.pumpup=粘咕正在不断地抽动！
actors.mobs.goo.enraged=激怒
actors.mobs.goo.gluuurp=咕————！
actors.mobs.goo.rankings_desc=被粘咕消化
actors.mobs.goo.desc=我们对粘咕所知甚少。它甚至很有可能不是一个生物，而是下水道表面聚集的邪恶物质得到基本智能而产生的实体。不管怎样，很明显是黑暗魔法造就了这个生物。\n\n其凝胶性质让它吸收了很多黑暗能量，你光是靠近就感受到了一股寒意。如果粘咕使用这种能量对你进行攻击那你肯定支撑不了多久。

actors.mobs.greatcrab.name=巨钳螃蟹
actors.mobs.greatcrab.noticed=这只螃蟹留意到了你的进攻并用它的巨大钳子格挡了这次攻击。
actors.mobs.greatcrab.blocked=格挡
actors.mobs.greatcrab.def_verb=格挡
actors.mobs.greatcrab.rankings_desc=被巨钳螃蟹碾碎
actors.mobs.greatcrab.desc=就算是和其他的下水道螃蟹相比较，这只螃蟹也是如此巨大。它的蓝色甲壳上有着一条条裂缝和几只藤壶，证明其经历的无数岁月。它缓慢地在周围爬行，用它那只巨大的钳子勉强保持平衡。\n\n尽管这螃蟹只有一只蟹钳，但钳子的大小完全补偿了这一不足。螃蟹只要发现危险就会把爪子举在自己身前，让自己获得坚不可摧的甲壳防护。
actors.mobs.greatcrab.discover_hint=你可在某个任务中遇到该敌人。

actors.mobs.guard.name=监狱守卫
actors.mobs.guard.scorpion=给我过来！
actors.mobs.guard.def_verb=格挡
actors.mobs.guard.desc=作为曾经监狱的管理者，这些守卫和那些罪犯已经没什么区别了。它们蹒跚的步伐如同僵尸一般，毫无思绪地四处寻找不属于这片区域的生物，比如你！\n\n它的铁链缠在自己的胯部，也许可以用来将敌人拉扯到非常近的距离。

actors.mobs.hermitcrab.name=寄居蟹
actors.mobs.hermitcrab.def_verb=格挡
actors.mobs.hermitcrab.desc=出于某种原因，这只下水道螃蟹决定把一个破桶戴在头上！额外的负重使其移速降到了一般水平，但也使其获得了更多防御。你感觉你听到了有什么东西在桶中碰撞作响...

actors.mobs.mimic.name=宝箱怪
actors.mobs.mimic.reveal=这是一个宝箱怪！
actors.mobs.mimic.hidden_hint=这个宝箱看上去有些不对劲...上前直接打开似乎不太合适。
actors.mobs.mimic.desc=宝箱怪是一种能随意改变外形的生物。在地牢里它们几乎一直以宝箱形态出现，因为它们明白怎么去吸引冒险者。
actors.mobs.mimic.discover_hint=你可在任何地牢区域中遇到该敌人。

actors.mobs.necromancer.name=死灵法师
actors.mobs.necromancer.desc=这些黑暗魔法的学徒大量涌入监狱，因为这里是它们磨练死灵法术的最佳地点。\n\n死灵法师通过召唤并加强骷髅作战。死灵法师被击杀后，其召唤的骷髅也会消散。
actors.mobs.necromancer$necroskeleton.name=死灵法师的骷髅
actors.mobs.necromancer$necroskeleton.desc=这个骷髅是被死灵法师召唤出来的。它的能力与习性和普通的骷髅一样，只是会在召唤者被击杀时跟着消逝。

actors.mobs.mob.died=你依稀听到远处有什么东西死掉了。
actors.mobs.mob.sps_clear=本层已清理，规定时间还剩%d回合。露珠奖励已掉落。
actors.mobs.mob.sps_clear_late=本层已清理，但已超过规定时间，没有获得清层奖励。
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=死于：%s
actors.mobs.mob.discover_hint=你可在某个地牢区域中遇到该敌人。

actors.mobs.monk.name=矮人武僧
actors.mobs.monk.def_verb=格挡
actors.mobs.monk.parried=招架
actors.mobs.monk.disarm=武僧将你手中的武器击飞了！
actors.mobs.monk.desc=这些僧侣皆是狂热的信徒，倾其所能从一切异族手中保护他们城市的秘密。他们既不披甲亦不执械，仅仅依靠他们的徒手格斗技巧退敌。
actors.mobs.monk$focus.name=凝神
actors.mobs.monk$focus.desc=这个武僧已经完全集中于目标的一举一动，似乎能预料到目标的下一步动作。\n\n处于凝神状态的角色必定会招架下一次物理攻击，哪怕是必中的攻击。招架攻击会消耗掉武僧的凝神，他们需要重新凝神以招架下次攻击。武僧在移动时可以更快地凝神。

actors.mobs.phantompiranha.name=幻影食人鱼
actors.mobs.phantompiranha.teleport_away=幻影食人鱼传送走了...
actors.mobs.phantompiranha.desc=幻影食人鱼是巨型食人鱼的一个罕见变种，具有诡异的半透明身体和魔法能力。它能够在受到攻击时传送，依此能力进可攻、退可逃！\n\n虽然很难对付，但它们的肉也因具有魔力而备受珍视。

actors.mobs.piranha.name=巨型肉食鱼
actors.mobs.piranha.desc=这些肉食性鱼类不是地下水池中的天然生物。它们被专门培育用来保护被水淹没的储藏室。
actors.mobs.piranha.discover_hint=你可在任何地牢区域中遇到该敌人。

actors.mobs.pylon.name=能量塔
actors.mobs.pylon.desc_inactive=这是一座用于分配区域内机械用电的能量塔。\n\n这座能量塔未被激活，目前无法受到任何伤害。
actors.mobs.pylon.desc_active=这是一座用于分配区域内机械用电的能量塔。此刻能量塔电能涌动，定是它在支持DM-300的超载状态！\n\n这时的能量塔可被摧毁，但也会顺时针向四周释放电弧。厚重的金属结构使其难以被迅速摧毁。

actors.mobs.rat.name=棕毛鼠
actors.mobs.rat.desc=虽说棕毛鼠们具有攻击性，可它们依旧是下水道居民里的弱者。它们成群结队非常烦人，但只有一只时对你够不上什么威胁。

actors.mobs.ripperdemon.name=恶魔撕裂者
actors.mobs.ripperdemon.leap=恶魔撕裂者正准备扑杀！
actors.mobs.ripperdemon.desc=这种恐怖的生物是恶魔利用这里残留的众多矮人尸骸组成的。恶魔撕裂者外观类似瘦弱的矮人尸鬼，尽管它躯体残缺，骨爪却异常尖利。\n\n恶魔撕裂者算不上耐打，但其仍然敏捷而致命。它能从远处飞扑而至，并用骨爪给目标撕开流血的伤口。

actors.mobs.rotheart.name=腐莓核心
actors.mobs.rotheart.desc=腐莓的果实与众不同。一般的果实会腐败并化作养分，但腐莓果实会生长、硬化，并包裹住种子。果实为长在其内的器官提供保护。这种巨大球体被视为成熟腐莓植株的核心。
actors.mobs.rotheart.discover_hint=你可在某个任务中遇到该敌人。

actors.mobs.rotlasher.name=腐莓触手
actors.mobs.rotlasher.rankings_desc=被腐莓触手鞭杀
actors.mobs.rotlasher.desc=腐莓触手是成熟腐莓根系的一部分，也是其主要自卫手段。触手没有视力，且固扎土中不能移动。但是当周边出现威胁时，只需先花费片刻感知到目标，随后便会发动猛攻。当附近没有敌人时，它们将静止不动，试图将自己融入周遭植被中。
actors.mobs.rotlasher.discover_hint=你可在某个任务中遇到该敌人。

actors.mobs.scorpio.name=巨型蝎子
actors.mobs.scorpio.desc=这些巨大的节肢类生物会尽可能避免一切近距离接触，并且会在远处射出能够致残的尖刺。

actors.mobs.senior.name=武僧大师
actors.mobs.senior.desc=相较普通武僧而言，武僧大师变秃了，也变强了!

actors.mobs.shaman.name=豺狼萨满
actors.mobs.shaman.bolt_kill=你死于魔能射弹...
actors.mobs.shaman.desc=豺狼萨满比大多数豺狼人更具智慧，它们会用战斗法术来弥补力量上的不足。尽管豺狼萨满的力量相对较弱，它们仍在部落中享有崇高地位。
actors.mobs.shaman$redshaman.spell_desc=佩戴红色面具的萨满会利用魔法_弱化你的攻击力_。
actors.mobs.shaman$blueshaman.spell_desc=佩戴蓝色面具的萨满会利用魔法_增加你受到的伤害_。
actors.mobs.shaman$purpleshaman.spell_desc=佩戴紫色面具的萨满会利用魔法_削减你的精准与闪避_。

actors.mobs.armoredbrute.name=装甲暴徒
actors.mobs.armoredbrute.desc=这些最顶级的豺狼暴徒通常靠装备强力的护甲来彰显其身份。暴徒身上的护甲会倍增它们的物理防御力，坚强的意志会大幅提升它们在弥留之际的狂暴时长。

actors.mobs.skeleton.name=骷髅
actors.mobs.skeleton.explo_kill=你死于迸溅的碎骨...
actors.mobs.skeleton.def_verb=格挡
actors.mobs.skeleton.desc=骷髅本是倒霉的冒险家和监狱原住民的尸骨，因地牢深处邪恶魔力的影响而苏醒。骷髅被摧毁后，它的骨头会炸成碎片。迸溅的碎骨会伤害邻近的所有角色，而护甲能显著减免这种伤害。

actors.mobs.slime.name=史莱姆
actors.mobs.slime.def_verb=格挡
actors.mobs.slime.desc=史莱姆是一种具有胶质外形与液态内核的奇特魔法生物。城市的下水道为它们提供了充分的水源和富足的养分。\n\n史莱姆的外层胶膜具有极强的弹性，这使得任何单次攻击都难以对它们造成超过_6点的伤害_。

actors.mobs.snake.name=下水道巨蛇
actors.mobs.snake.hint=试试点击检查按钮再选择蛇，以了解如何击败它们。
actors.mobs.snake.desc=这些大号的蛇能通过快速滑行以闪避攻击，所以很难命中。不过伏击与魔法攻击能打它们个措手不及。\n\n在蛇的视野外攻击它，这次攻击就是伏击。有一种伏击方法是，在蛇追你时躲去门后，再_在蛇进门的瞬间发动攻击_。

actors.mobs.spectralnecromancer.name=幽魂法师
actors.mobs.spectralnecromancer.desc=死灵法师们通常对召唤骷髅欲罢不能，但其中某些个体却偏爱使唤更为缥缈无形的造物。幽魂法师们便选择了怨灵作为他们的爪牙！\n\n怨灵的个体战斗力或许不如骷髅，但这帮幽魂法师无论召唤出多少手下都不嫌多！

actors.mobs.spinner.name=矿洞蜘蛛
actors.mobs.spinner.desc=绿色而多毛的洞穴蜘蛛们会试着去躲避直接的战斗，它们更喜欢在远处等待其猎物卷入蜘网，在毒素中慢慢死去。

actors.mobs.statue.name=活化持剑石像
actors.mobs.statue.def_verb=格挡
actors.mobs.statue.desc=你以为这只是地牢里的另一个丑陋雕像，但它发出红光的眼睛让你放弃了刚才的想法。 尽管雕像本身是用石头做的，但它手上握着_%s_，看起来像是真的。
actors.mobs.statue.desc_weapon=虽然雕像本身是石制的，但它装备着的_%s_看起来是真家伙。
actors.mobs.statue.discover_hint=你可在任何地牢区域中遇到该敌人。

actors.mobs.succubus.name=魅魔
actors.mobs.succubus.desc=魅魔是一种善于操纵敌人的精神的变形恶魔。这一只化为了哥特风的苍白人形，或许是为了吸引矮人术士？\n\n在攻击时，魅魔能够暂时魅惑目标，使其无法直接攻击魅魔本身。魅魔在攻击被魅惑的目标时能吸取其生命精华。

actors.mobs.swarm.name=蝇群
actors.mobs.swarm.desc=致命的飞蝇群愤怒地发出嗡嗡声。每次非魔法攻击都会把它分割成两群更小但同样危险的飞蝇群。
actors.mobs.virus.name=---!!!数据删除!!!---\n未知\n感染
actors.mobs.virus.desc=梦魇病毒体。它会复制英雄的力量，并在每回合自行衰亡。

actors.mobs.tengu.name=天狗
actors.mobs.tengu.notice_gotcha=抓到你了，%s！
actors.mobs.tengu.interesting=是时候让这场战斗变得更有意思了...
actors.mobs.tengu.notice_have=你的命归我了，%s！
actors.mobs.tengu.defeated=终于...解脱了...
actors.mobs.tengu.rankings_desc=被天狗暗杀
actors.mobs.tengu.desc=一位著名的神秘刺客，其名源于紧贴在他脸上的面具。\n\n天狗的手腕和膝下都带着镣铐，但他似乎很久以前就摆脱掉了锁链的束缚。\n\n他将利用陷阱、欺骗性的魔法、精准致命的攻击，来消灭唯一能阻止他逃脱的人：你。

actors.mobs.tengu$bombability$bombblob.desc=这里翻滚着一片过热的烟尘。当心，要爆炸了！
actors.mobs.tengu$bombability$bombitem.name=烟尘炸弹
actors.mobs.tengu$bombability$bombitem.cant_pickup=它固定在地面上，你无法搬动它！
actors.mobs.tengu$bombability$bombitem.desc=天狗往这里扔了一个奇形怪状的，不断鼓出滚烫浓烟的炸弹。它在滴答作响，似乎是爆炸的倒计时！\n\n炸弹嵌入了地面，你无法拾取它。

actors.mobs.tengu$fireability$fireblob.desc=天狗往这里洒了一把开始起烟的细腻粉末，要烧起来了！

actors.mobs.tengu$shockerability$shockerblob.desc=这里正积蓄着电能，站在这里的任何单位都会在下回合受到电击！
actors.mobs.tengu$shockerability$shockeritem.name=电击装置
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=它放出电能太强了，你无法触碰它！
actors.mobs.tengu$shockerability$shockeritem.desc=天狗往这里扔了一个奇怪的装置，好像是用DM-100的零件拼凑出来的。装置在持续地向周围放出电弧，但是范围好像有规律可循。\n\n有这么密集的高压电弧环绕着，你无从下手去拾取它。

actors.mobs.thief.name=疯狂小偷
actors.mobs.thief.stole=小偷偷走了你的%s！
actors.mobs.thief.carries=\n\n这个小偷携带着一个_%s_。明显是偷来的。
actors.mobs.thief.escapes=小偷带着你的%s逃走了！
actors.mobs.thief.desc=这些囚犯逃出了他们的牢房，却没能逃出这座监牢。随着时间流逝，这座监牢彻底摧毁了他们仅存的心智，以及对自由的向往。这些疯狂的小偷和强盗很久以前就已经彻底忘记它们是谁，以及它们为何偷窃。\n\n这些敌人比起面对面地战斗，更倾向于偷走你的财物随后逃之夭夭。一定要看紧它们，否则你以后可能再也不会见到自己的被盗财物了。

actors.mobs.tormentedspirit.name=咒缚灵
actors.mobs.tormentedspirit.desc=咒缚灵是本性善良却受诅咒折磨的魂灵。只要诅咒仍在，它们就会像更强的怨灵一样攻击你！\n\n或许可以在与之相邻时使用祛邪卷轴净化魂灵的诅咒。如果诅咒被净化，它们一定会报答你的...
actors.mobs.tormentedspirit.thank_you=谢谢你...

actors.mobs.npcs.vaultlaser.name=解离哨卫
actors.mobs.npcs.vaultlaser.ondeath=你被解离光束射穿了...
actors.mobs.npcs.vaultlaser.desc=这些哨卫会以固定或者半随机的周期发射解离光束。尽管解离光束看起来很危险，不过至少其扫描路径有迹可循。这些解离光束足够强大，凭你的力量极难抵御，也许_你该试着想办法躲开它们_。

actors.mobs.npcs.vaultsentry.name=扫描哨卫
actors.mobs.npcs.vaultsentry.ondeath=你死于闪电...
actors.mobs.npcs.vaultsentry.desc=这种哨卫会以固定的模式扫描区域。它们看起来很危险，要是被扫描到你肯定会遭受电击。哨卫的扫描模式往往易于识别并回避，而它们能够侦测到你的前提也在于能够看到你，因此_能够遮蔽视野的物品对它们同样会很有效_。

actors.mobs.npcs.vaulttokendoor.name=奇怪的门
actors.mobs.npcs.vaulttokendoor.def_verb=格挡
actors.mobs.npcs.vaulttokendoor.desc=这扇门看似没有上锁，凭你的力量却难以移动分毫。门的表面有一道不同寻常的机关，其上的十个凹槽看起来可以用某种扁平的菱形物体填补上去。
actors.mobs.npcs.vaulttokendoor.no_tokens=_也许你能在宝库里找到什么可以契合进凹槽的东西？_
actors.mobs.npcs.vaulttokendoor.too_few_tokens=_你的矮人徽记与凹槽完美契合_，但徽记的数量还不够。
actors.mobs.npcs.vaulttokendoor.enough_tokens=_你有足够的矮人徽记以填入所有凹槽_，要把它们放进去吗？
actors.mobs.npcs.vaulttokendoor.open=开门
actors.mobs.npcs.vaulttokendoor.not_yet=算了
actors.mobs.npcs.vaulttokendoor.unlocked=徽记渐渐与门融为一体，与此同时你听到了远处门锁打开的声音。

actors.mobs.npcs.vaultmirror.name=奇怪的黑镜
actors.mobs.npcs.vaultmirror.def_verb=格挡
actors.mobs.npcs.vaultmirror.desc=这面巨大的黑镜刻有各式各样闪闪发光的矮人符文，它轻微地的鸣响着，却不显出任何倒影。
actors.mobs.npcs.vaultmirror.approach=一面巨大的镜子伫立在你的面前，其厚重的石质边框上刻着闪闪发光的矮人符文。远看时镜面一片漆黑，但你俯身靠过去时符文的光芒变得更加明亮，熟悉的景象也从镜面上浮现。
actors.mobs.npcs.vaultmirror.scene_warrior=你看见了你那红色的_蜡质纹章_，其依旧对半裂开，却已遭弃置、半掩雪中。这幅景象与你的记忆相去无几，但在细微之处仍有差异。你绝不会容许自己丢掉那枚纹章，只因留下它也是你对自己的惩罚的一部分。你总是长长审视着它，这也使你马上注意到镜中纹章上裂痕的角度与你的纹章略有不同。
actors.mobs.npcs.vaultmirror.scene_mage=你看见了你的_魔杖_静静的待在一间书房的桌子上。这幅景象与你的记忆相去无几，但在细微之处仍有差异。这正是你在南方魔法学院的公共办公室；但要是说存放那根魔杖的话，放在这里也未免有些太显眼了。办公室看起来也比往常多了不少烟火气，本来你是从来不在那个地方干“正事”的。
actors.mobs.npcs.vaultmirror.scene_rogue=你看见了_暗影斗篷_，静静地挂在皇家军械库里的架子上。这幅景象与你的记忆相去无几，但在细微之处仍有差异。军械库里一片寂静，轮值的守卫以他和善的双目沉稳地扫视着整个房间。他仍如往常那样平和地静伫此处，未曾伤残也无被害之忧；你那熟悉的罪恶感同这安稳的景象一并浮现，又一次刺痛了你。
actors.mobs.npcs.vaultmirror.scene_huntress=你看见了你的_灵能弓_被置于密林中一块盘状巨石之上。这幅景象与你的记忆相去无几，但在细微之处仍有差异。巨石周围的林间空地静谧非常、空无一物，远远不像你当初被授予这把灵弓时身边竞相祝贺的热闹欢腾。实际上，你根本就感知不到周围自然环境中的任何事物。
actors.mobs.npcs.vaultmirror.scene_duelist=你看见了一个高大的身影，身披皇家近卫的甲胄伫立在你面前：那正是你过世的父亲。这幅景象与你的记忆相去无几，但在细微之处仍有差异。父亲眼中的慈爱与你儿时曾记丝毫未差，但他的脸上却多出了他的生命未曾得享的漫长岁月带来的种种沧桑。他向你递出了他的_附魔巨剑_，等待你将其接过。
actors.mobs.npcs.vaultmirror.scene_cleric=你看见了明烛照映的圣堂中有一个被打开的圣物匣，其中装着的正是_神圣法典_。这幅景象与你的记忆相去无几，但在细微之处仍有差异。你从未将圣物匣从圣器室取出过，只是单独带走了这本圣典。圣典中辐射而出的神圣能量也不同寻常，仿佛圣典所导引出的能量来自于某个不同以往的根源。
actors.mobs.npcs.vaultmirror.scene_spellsword=你看见自己的_魔剑_横放在一本摊开的法术书上，四周是一座空无一人的训练场。这幅景象与你的记忆相去无几，但在细微之处仍有差异。剑身上的符文与书中的咒文以完全一致的节奏闪烁，仿佛钢铁与魔法从来就不是两门分离的技艺。
actors.mobs.npcs.vaultmirror.scene_final=你注意到黑镜的玻璃镜面已经无影无踪，再也没有任何障碍可以阻止你伸手取走镜中之物。
actors.mobs.npcs.vaultmirror.take=取走物品
actors.mobs.npcs.vaultmirror.scene_take=你将手探入，取走了其中的物品，但镜中的景象一时却并未变化，仿佛你手中的事物同时也存在于镜中一般。\n\n镜中倒影渐渐消逝，你手中的物品开始随镜框上符文闪烁的节奏一齐轻轻震颤。\n\n你不确定刚刚究竟发生了什么，但你所取出的物品的存在似乎依附于这面黑镜，因此你大概无法将它从宝库中带出。
actors.mobs.npcs.vaultmirror.scene_nothing=你再次触碰了黑镜，然而无事发生。镜面光滑坚硬，模糊映出的只有你指尖的倒影。

actors.mobs.warlock.name=矮人术士
actors.mobs.warlock.bolt_kill=你死于暗影射弹...
actors.mobs.warlock.desc=当矮人的兴趣从工程建设转向奥秘学术时，术士们开始在城市中掌权。它们从元素魔法起步，但很快就开始研究恶魔学和死灵术。

actors.mobs.wraith.name=怨灵
actors.mobs.wraith.def_verb=躲避
actors.mobs.wraith.desc=怨灵是来自于墓穴中渴望复仇的罪人之魂。作为飘渺的非实体很难被正常武器击中。
actors.mobs.wraith.discover_hint=你可在任何地牢区域中遇到该敌人。

actors.mobs.yogdzewa.name=Yog-Dzewa
actors.mobs.yogdzewa.notice=我  看  见  你  了
actors.mobs.yogdzewa.darkness=黑暗正在逼近...
actors.mobs.yogdzewa.hope=汝 之 希 望 皆 为 虚 妄
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.rankings_desc=被Yog-Dzewa吞噬
actors.mobs.yogdzewa.desc=Yog-Dzewa是一个古老的神；一个将自己的力量延伸向凡间世界并吞噬它们、以为自身无尽的成长提供养分的巨大怪物。矮人一定是在玩弄黑暗魔法的时候引起了这个巨大恐怖的注意，并且从那以后就一直试图控制祂，使之无法侵吞外界。\n\n这位古神起源于一个原始的、充满魔法与混沌的维度，且无法将祂的真实形态带入这个世界。因此，祂创造了自己的化身并召唤了恶魔们作为祂的仆从来完成它的命令。\n\n这只巨眼是古神在这个世界上力量的焦点。虽然这只眼睛本身是不可移动的，但祂能够射出强大的魔能光束，并召唤各种恶魔仆从来帮助它。
actors.mobs.yogdzewa.desc_spawners=你感觉到恶魔能量正从上层涌向古神之眼。你在上面活着留下的什么东西正在给古神回馈着能量。_古神会使用这股能量召唤更强大的手下！_
actors.mobs.yogdzewa$larva.name=古神幼虫
actors.mobs.yogdzewa$larva.rankings_desc=被Yog-Dzewa吞噬
actors.mobs.yogdzewa$larva.desc=这些古神的小小造物是一种易于制造的简陋生物。虽然单个幼虫十分脆弱，但它们能够被迅速地制造出来，并会在形成一个大数目后变得难以抵挡。
actors.mobs.yogdzewa$yogripper.rankings_desc=被Yog-Dzewa吞噬
actors.mobs.yogdzewa$yogeye.rankings_desc=被Yog-Dzewa吞噬
actors.mobs.yogdzewa$yogscorpio.rankings_desc=被Yog-Dzewa吞噬

actors.mobs.yogfist.invuln_warn=拳头邻接古神之眼时无法受到伤害！
actors.mobs.yogfist.rankings_desc=被Yog-Dzewa吞噬
actors.mobs.yogfist.desc=这个拳头是古神力量的部分体现。这些拳头与古神的力量相互联系，并且当它们靠近古神之眼时会免疫所有受到的伤害。
actors.mobs.yogfist$burningfist.name=燃烧之拳
actors.mobs.yogfist$burningfist.desc=燃烧之拳是由混沌的炽热魔法形成的。它在移动时会不断地引燃周围的环境。它还可以发射火焰能量形成魔法冲击，使目标地陷入一片熊熊烈火。\n\n燃烧之拳引燃环境的能力在靠近水的时候会被抑制，但是其热量实在太大，以至于周围的水很快就会蒸发掉！
actors.mobs.yogfist$soiledfist.name=大地之拳
actors.mobs.yogfist$soiledfist.desc=大地之拳是由混沌的大地魔法形成的。当它移动时，它会不断地使周围生出植物。它还可以发射精准的大地冲击，将它的目标困在迅速生长的藤蔓和根系间！\n\n大地之拳能从植物的生命中获得力量，并能根据其周围的植被数量来抵挡伤害！
actors.mobs.yogfist$rottingfist.name=腐烂之拳
actors.mobs.yogfist$rottingfist.desc=腐烂之拳是由一团活的腐肉形成的。它是一团高塔般庞大的腐烂血肉，可以在近战中喷溅腐蚀淤泥，并喷射毒气作为远程攻击。更糟糕的是，腐烂之拳的巨大质量导致它受到攻击时只会进入流血状态，而不会直接受到伤害。\n\n腐蚀淤泥可以被水洗去，但腐烂之拳也可以通过吸收水来治愈自己！此外，在其流血时对腐烂之拳造成伤害只会刷新其流血状态而不会加重效果！
actors.mobs.yogfist$rustedfist.name=锈蚀之拳
actors.mobs.yogfist$rustedfist.desc=锈蚀之拳是由一块活性金属形成的。它是一块高塔般庞大的活性金属，具有强大的近战能力，并有在远距离使目标残废的能力。由于其巨大的质量，锈蚀之拳所受到的伤害都会被延缓，而非立即作用在其身上。\n\n尽管如此，锈蚀之拳那并不灵活的特性使得它无法通过较窄的走道。另外，虽然锈蚀之拳只会缓慢地受到伤害，但是延缓伤害还会在它受到多次攻击时继续叠加。
actors.mobs.yogfist$brightfist.name=辉耀之拳
actors.mobs.yogfist$brightfist.teleport=辉耀之拳在一道使你重度盲目的爆闪中传送到了别处！
actors.mobs.yogfist$brightfist.desc=辉耀之拳是由纯粹的光能量形成的。它能在每回合射出一道强烈的灼目光束！这些光束除了造成大量伤害外，还会暂时使你失明。辉耀之拳为了逃脱还能发出覆盖全场的刺眼爆闪！\n辉耀之拳在近战中并没有特殊能力。
actors.mobs.yogfist$darkfist.name=暗影之拳
actors.mobs.yogfist$darkfist.teleport=暗影之拳在一片使你光源熄灭的漆黑中传送到了别处！
actors.mobs.yogfist$darkfist.desc=暗影之拳是由纯粹的暗能量形成的。它能在每回合射出强大的暗黑法术！这些法术除了造成大量伤害外，还会削弱你的光源。暗影之拳为了逃脱还能瞬间使全场陷入一片漆黑！\n\n暗影之拳在近战中并没有特殊能力。


