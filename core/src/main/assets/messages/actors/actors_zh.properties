actors.mobs.npcs.fusionpet.name_13=星之子
actors.mobs.npcs.fusionpet.name_14=灯魔
actors.mobs.npcs.fusionpet.name_15=哈罗精灵
actors.mobs.npcs.fusionpet.role_0=护卫型：生命与防御较高，但伤害较低。
actors.mobs.npcs.fusionpet.role_1=突击型：近战伤害较高，但生命较低。
actors.mobs.npcs.fusionpet.role_2=远射型：可以隔着直线攻击，远射伤害降至四分之三。
actors.mobs.npcs.fusionpet.role_3=支援型：基础能力均衡，偶尔使敌人中毒。
actors.mobs.npcs.fusionpet.desc=来自特别惊喜宠物谱系的同行伙伴。%s伙伴数值只随英雄等级有限成长，不会生成物品或经验。

