actors.mobs.challengeguardian.guardian_name=挑战守卫
actors.mobs.challengeguardian.echo_name=挑战回响
actors.mobs.challengeguardian.guardian_desc=由挑战日志的魔力塑造而成的守卫，保护着这处目的地唯一的奖励。它的强度与发现路线时所处的章节相符，击败它不会获得经验。
actors.mobs.challengeguardian.echo_desc=由挑战日志的魔力凝成的弱小回响。它不会携带宝物，击败它也不会获得经验。

actors.mobs.adventureguardian.guardian_name=%s守卫
actors.mobs.adventureguardian.echo_name=%s回响
actors.mobs.adventureguardian.guardian_desc=%s的主要敌人。每个目的地会选用近战或远程模式，并具有五类异常攻击之一；生命降至两个阶段门槛时，它会短暂加速并获得有上限的护盾。它不会提供经验或随机战利品。
actors.mobs.adventureguardian.echo_desc=栖息在%s的弱小敌人回响，会使用较弱的目的地异常攻击，不会提供经验或随机战利品。
actors.mobs.adventureguardian.boss_desc=%s的核心首领。%s首领的生命阶段能力最多触发两次，召唤物没有经验与随机掉落。
